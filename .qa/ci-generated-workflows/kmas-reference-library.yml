name: KMAS reference library
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'apps/web/src/shared/lib/kmas-reference.ts'
      - 'apps/web/src/shared/lib/__tests__/kmas-reference*.test.ts'
      - 'apps/api/src/server/kmas-reference.ts'
      - 'apps/api/src/modules/catalog/**'
      - 'apps/web/src/domains/catalog/references/**'
      - 'apps/web/src/app/routes/**'
      - 'apps/web/src/domains/legal/SitemapPage.tsx'
      - 'apps/web/src/shared/components/site-footer.tsx'
      - 'e2e/kmas-references.spec.ts'
      - 'playwright.references.config.ts'
      - '.github/workflows/kmas-reference-library.yml'
  push:
    paths:
      - 'apps/web/src/shared/lib/kmas-reference.ts'
      - 'apps/web/src/shared/lib/__tests__/kmas-reference*.test.ts'
      - 'apps/api/src/server/kmas-reference.ts'
      - 'apps/api/src/modules/catalog/**'
      - 'apps/web/src/domains/catalog/references/**'
      - 'apps/web/src/app/routes/**'
      - 'apps/web/src/domains/legal/SitemapPage.tsx'
      - 'apps/web/src/shared/components/site-footer.tsx'
      - 'e2e/kmas-references.spec.ts'
      - 'playwright.references.config.ts'
      - '.github/workflows/kmas-reference-library.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      VITE_TRAFFIC_ANALYTICS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Reference contract tests
        run: pnpm exec vitest run apps/web/src/shared/lib/__tests__/kmas-reference.test.ts apps/web/src/shared/lib/__tests__/kmas-reference-hardening.test.ts apps/web/src/shared/lib/__tests__/kmas-reference-recovery.test.ts apps/web/src/shared/lib/__tests__/kmas-reference-merge-readiness.test.ts
      - name: Zero-warning reference lint
        run: pnpm exec eslint apps/web/src/shared/lib/kmas-reference.ts apps/web/src/shared/lib/__tests__/kmas-reference.test.ts apps/web/src/shared/lib/__tests__/kmas-reference-hardening.test.ts apps/web/src/shared/lib/__tests__/kmas-reference-recovery.test.ts apps/web/src/shared/lib/__tests__/kmas-reference-merge-readiness.test.ts apps/api/src/server/kmas-reference.ts apps/api/src/modules/catalog/kmas-reference.controller.ts apps/api/src/modules/catalog/catalog.module.ts apps/web/src/domains/catalog/references apps/web/src/app/routes/reference-labels.ts apps/web/src/app/routes/groups/reference.routes.tsx apps/web/src/app/routes/groups/app-routes.tsx apps/web/src/app/routes/route-titles.ts apps/web/src/shared/components/site-footer.tsx apps/web/src/app/routes/route-manifest.ts apps/web/src/domains/legal/SitemapPage.tsx e2e/kmas-references.spec.ts --max-warnings=0
      - run: pnpm run catalog:gen && pnpm run build:bundle
      - run: pnpm exec playwright install --with-deps chromium
      - name: Chromium route and interaction verification
        run: pnpm exec playwright test --config playwright.references.config.ts
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kmas-reference-browser-evidence
          path: test-results/references
          if-no-files-found: ignore
          retention-days: 7
