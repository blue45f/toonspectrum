name: Studio collaboration synchronization

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [main, release/salvage-integration-20260908]
    paths:
      - apps/web/src/domains/creator/live/**
      - scripts/verify-studio-p2p-channel-lifecycle.mjs
      - .github/workflows/studio-mesh-sync-repair.yml
  push:
    paths:
      - apps/web/src/domains/creator/live/**
      - scripts/verify-studio-p2p-channel-lifecycle.mjs
      - .github/workflows/studio-mesh-sync-repair.yml

  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  collaboration-sync:
    runs-on: macos-14
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Verify channel lifecycle independently
        run: node --experimental-strip-types --test scripts/verify-studio-p2p-channel-lifecycle.mjs
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify collaboration synchronization and reconnects
        run: pnpm exec vitest run apps/web/src/domains/creator/live/studio-crdt-room-binding.test.ts apps/web/src/domains/creator/live/studio-live-p2p-overlay-transport.test.ts apps/web/src/domains/creator/live/studio-live-p2p-reconnect.test.ts apps/web/src/domains/creator/live/studio-live-collaboration-transport.test.ts apps/web/src/domains/creator/live/studio-live-signaling-server-transport.test.ts apps/web/src/domains/creator/live/studio-live-collaboration-room.ink.test.ts apps/web/src/domains/creator/live/studio-live-socket-transport.test.ts apps/web/src/domains/creator/live/studio-mesh-sync-regression.test.ts
      - name: Lint collaboration changes
        run: pnpm exec eslint apps/web/src/domains/creator/live/studio-crdt-room-binding.ts apps/web/src/domains/creator/live/studio-live-p2p-overlay-transport.ts apps/web/src/domains/creator/live/studio-live-p2p-channel-lifecycle.ts apps/web/src/domains/creator/live/studio-live-p2p-reconnect.test.ts apps/web/src/domains/creator/live/studio-mesh-sync-regression.test.ts
      - name: Check application types
        run: pnpm run typecheck
