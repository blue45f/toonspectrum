name: Apply Learn landmark follow-up

on:
  push:
    branches:
      - feat/learn-guided-lesson-experience-20260909
    paths:
      - .github/workflows/apply-learn-landmark-fix.yml

permissions:
  contents: write

concurrency:
  group: apply-learn-landmark-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/learn-guided-lesson-experience-20260909
          fetch-depth: 0
      - name: Reuse the app landmark and harden its browser assertion
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}\n--- needle ---\n{old}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          content = Path("apps/web/src/domains/learn/LearnContent.tsx")
          e2e = Path("e2e/learn-guided-lessons.spec.ts")
          docs = Path("docs/learn/guided-lesson-experience.md")

          replace_once(
              content,
              '''  const skillLabels = meta.skills.map((skillId) => SKILLS.find((skill) => skill.id === skillId)?.label).filter(Boolean);''',
              '''  const skillLabels = meta.skills
              .map((skillId) => SKILLS.find((skill) => skill.id === skillId)?.label)
              .filter((label): label is string => Boolean(label));''',
          )
          replace_once(
              content,
              '''      <main id="learn-main">''',
              '''      <div id="learn-main" tabIndex={-1}>''',
          )
          replace_once(
              content,
              '''      </main>
              <footer className="learn-local-footer">''',
              '''      </div>
              <footer className="learn-local-footer">''',
          )
          replace_once(
              e2e,
              '''  await expect(page.getByRole("main")).toBeVisible();
              await expect(page.getByRole("navigation", { name: "이 강좌 목차" })).toBeVisible();''',
              '''  await expect(page.getByRole("main")).toHaveCount(1);
              await expect(page.locator("#learn-main")).toBeVisible();
              await expect(page.getByRole("navigation", { name: "이 강좌 목차" })).toBeVisible();''',
          )
          replace_once(
              docs,
              '''- 상세 경로에 본문 바로가기 링크와 `<main>` 랜드마크를 추가합니다.''',
              '''- 앱 셸의 기존 `<main>` 랜드마크를 재사용하고 Learn 내부에는 본문 바로가기용 포커스 대상을 둡니다.''',
          )
          PY
      - name: Commit audited follow-up
        shell: bash
        run: |
          rm .github/workflows/apply-learn-landmark-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/domains/learn/LearnContent.tsx e2e/learn-guided-lessons.spec.ts docs/learn/guided-lesson-experience.md .github/workflows/apply-learn-landmark-fix.yml
          git commit -m "fix(learn): reuse the application main landmark"
          git push origin HEAD:feat/learn-guided-lesson-experience-20260909
