name: One-time merged branch cleanup

on:
  push:
    branches:
      - feat/market-3d-governance-integration

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: one-time-merged-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Remove only refs proven to be contained in main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cleanup-merged-branches.mjs --all --apply

      - name: Remove the one-time launcher branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/feat/market-3d-governance-integration"
