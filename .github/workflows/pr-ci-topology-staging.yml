name: Stage optimized PR CI topology

on:
  push:
    branches:
      - fix/real-core-and-main-only-20260910
    paths:
      - .github/workflows/pr-ci-topology-staging.yml

permissions:
  contents: write

concurrency:
  group: pr-ci-topology-staging
  cancel-in-progress: true

jobs:
  stage:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/real-core-and-main-only-20260910
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            scripts/apply-ci-performance-optimization.py
            scripts/integration-test-runner-ci-policy.test.mjs
            scripts/verify-pr-workflow-fanout.py
            sonar-project.properties
            .qa
          sparse-checkout-cone-mode: false

      - name: Generate optimized workflows and policy contracts
        run: python3 scripts/apply-ci-performance-optimization.py

      - name: Validate generated configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-pr-workflow-fanout.py
          node --check scripts/integration-test-runner-ci-policy.test.mjs
          ruby -rpsych -e 'ARGV.each { |path| Psych.parse_file(path) }' .github/workflows/*.yml
          git diff --check
          grep -Eq '^name: CI$' .github/workflows/ci.yml
          grep -Eq '^  core:$' .github/workflows/ci.yml
          grep -Fq 'shard: [1, 2, 3, 4]' .github/workflows/ci.yml
          grep -Fq 'Require all four nonempty coverage reports' .github/workflows/sonarqube.yml
          grep -Fq 'sonar-coverage-4/lcov.info' sonar-project.properties

      - name: Copy workflow blobs outside the protected workflow directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .qa/ci-generated-workflows
          mkdir -p .qa/ci-generated-workflows
          : > .qa/ci-generated-workflows-manifest.txt

          git diff --name-only -- .github/workflows | sort > /tmp/generated-workflow-paths.txt
          workflow_count="$(wc -l < /tmp/generated-workflow-paths.txt | tr -d ' ')"
          echo "Generated workflow count: ${workflow_count}"
          test "$workflow_count" -eq 23

          while IFS= read -r path; do
            test -n "$path"
            destination=".qa/ci-generated-workflows/${path#.github/workflows/}"
            mkdir -p "$(dirname "$destination")"
            cp "$path" "$destination"
            printf '%s\n' "$path" >> .qa/ci-generated-workflows-manifest.txt
          done < /tmp/generated-workflow-paths.txt

          git checkout -- .github/workflows
          git diff --quiet -- .github/workflows

      - name: Publish validated staging blobs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            .qa/ci-generated-workflows \
            .qa/ci-generated-workflows-manifest.txt \
            .qa/ci-performance-optimization-2026-09-11.md \
            scripts/verify-pr-workflow-fanout.py \
            scripts/integration-test-runner-ci-policy.test.mjs \
            sonar-project.properties
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit \
            -m "chore(ci): stage validated optimized workflow blobs"
          git fetch origin fix/real-core-and-main-only-20260910
          git rebase origin/fix/real-core-and-main-only-20260910
          git push origin HEAD:fix/real-core-and-main-only-20260910
