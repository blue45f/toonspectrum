name: Apply ToonStudio project lifecycle once

on:
  push:
    branches:
      - feat/toonstudio-project-lifecycle-20260912
    paths:
      - .github/workflows/apply-toonstudio-project-lifecycle.yml

permissions:
  contents: write

concurrency:
  group: apply-toonstudio-project-lifecycle
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "true"
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-project-lifecycle-20260912
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Connect lifecycle surfaces to canonical routes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          route_pages = "apps/web/src/app/routes/groups/creator-route-pages.ts"
          replace_once(
              route_pages,
              '''export const StudioHomePage = lazyRetry(\n  () => import("@/domains/creator/studio-shell/StudioFrontDoorPages").then((module) => ({\n    default: module.StudioHomePage,\n  })),\n  "StudioHomePage",\n);''',
              '''export const StudioHomePage = lazyRetry(\n  () => import("@/domains/creator/studio-shell/StudioProjectLibraryPage").then((module) => ({\n    default: module.StudioProjectLibraryPage,\n  })),\n  "StudioProjectLibraryPage",\n);''',
          )
          replace_once(
              route_pages,
              '''export const StudioNewPage = lazyRetry(\n  () => import("@/domains/creator/studio-shell/StudioFrontDoorPages").then((module) => ({\n    default: module.StudioNewPage,\n  })),\n  "StudioNewPage",\n);''',
              '''export const StudioNewPage = lazyRetry(\n  () => import("@/domains/creator/studio-shell/StudioNewIntegratedPage").then((module) => ({\n    default: module.StudioNewIntegratedPage,\n  })),\n  "StudioNewIntegratedPage",\n);''',
          )

          routes = "apps/web/src/app/routes/groups/creator.routes.tsx"
          replace_once(
              routes,
              '''  { id: "creator-studio-import", path: "/studio/import", element: <StudioImportPage /> },\n  { id: "creator-studio-assets", path: "/studio/assets", element: <StudioAssetHubPage /> },''',
              '''  { id: "creator-studio-import", path: "/studio/import", element: <StudioImportPage /> },\n  { id: "creator-studio-recovery", path: "/studio/recovery", element: <Navigate to="/studio?view=archived" replace /> },\n  { id: "creator-studio-trash", path: "/studio/trash", element: <Navigate to="/studio?view=trash" replace /> },\n  { id: "creator-studio-assets", path: "/studio/assets", element: <StudioAssetHubPage /> },''',
          )

          integrated = "apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.tsx"
          replace_once(
              integrated,
              '''import { StudioProjectAssistantPanel } from "./StudioProjectAssistantPanel";\nimport { StudioProjectFeatureSuitePanel } from "./StudioProjectFeatureSuitePanel";''',
              '''import { StudioProjectAssistantPanel } from "./StudioProjectAssistantPanel";\nimport { StudioProjectDocumentsPanel } from "./StudioProjectDocumentsPanel";\nimport { StudioProjectFeatureSuitePanel } from "./StudioProjectFeatureSuitePanel";''',
          )
          replace_once(
              integrated,
              '''      <StudioProjectFeatureSuitePanel\n        projectId={projectId}\n        section={section}\n        view={view}\n        locale={locale}\n      />\n      {section === "story" && view === "localization" ? (''',
              '''      <StudioProjectFeatureSuitePanel\n        projectId={projectId}\n        section={section}\n        view={view}\n        locale={locale}\n      />\n      {section === "production" && view === "documents" ? (\n        <StudioProjectDocumentsPanel projectId={projectId} locale={locale} />\n      ) : null}\n      {section === "story" && view === "localization" ? (''',
          )

          reachability = "scripts/verify-toonstudio-feature-reachability.mjs"
          replace_once(
              reachability,
              '''  "apps/web/src/domains/creator/studio-project-workspace-store.ts",\n  "apps/web/src/domains/creator/studio-project-diagnostics.ts",''',
              '''  "apps/web/src/domains/creator/studio-project-workspace-store.ts",\n  "apps/web/src/domains/creator/studio-project-library-store.ts",\n  "apps/web/src/domains/creator/studio-project-document-store.ts",\n  "apps/web/src/domains/creator/studio-project-diagnostics.ts",''',
          )
          replace_once(
              reachability,
              '''  "apps/web/src/domains/creator/studio-shell/StudioProjectFeatureSuitePanel.tsx",\n  "apps/web/src/domains/creator/studio-shell/StudioProjectAssistantPanel.tsx",''',
              '''  "apps/web/src/domains/creator/studio-shell/StudioProjectLibraryPage.tsx",\n  "apps/web/src/domains/creator/studio-shell/StudioNewIntegratedPage.tsx",\n  "apps/web/src/domains/creator/studio-shell/StudioProjectDocumentsPanel.tsx",\n  "apps/web/src/domains/creator/studio-shell/StudioProjectFeatureSuitePanel.tsx",\n  "apps/web/src/domains/creator/studio-shell/StudioProjectAssistantPanel.tsx",''',
          )

          closure = "apps/web/src/domains/creator/studio-integration-closure.test.ts"
          if Path(closure).exists():
              replace_once(
                  closure,
                  '''      "StudioProjectFeatureSuitePanel",\n      "StudioLocalizationPanel",''',
                  '''      "StudioProjectFeatureSuitePanel",\n      "StudioProjectDocumentsPanel",\n      "StudioLocalizationPanel",''',
              )
              text = Path(closure).read_text()
              marker = '''  it("mounts recovered import and AI handoffs in the real canvas host", () => {'''
              addition = '''  it("owns project and document lifecycle from the canonical front door", () => {\n    const routePages = source("apps/web/src/app/routes/groups/creator-route-pages.ts");\n    const routes = source("apps/web/src/app/routes/groups/creator.routes.tsx");\n    const integrated = source("apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.tsx");\n\n    expect(routePages).toContain('studio-shell/StudioProjectLibraryPage');\n    expect(routePages).toContain('studio-shell/StudioNewIntegratedPage');\n    expect(routes).toContain('path: "/studio/recovery"');\n    expect(routes).toContain('path: "/studio/trash"');\n    expect(integrated).toContain("<StudioProjectDocumentsPanel");\n  });\n\n'''
              if marker not in text:
                  raise SystemExit(f"{closure}: insertion marker not found")
              Path(closure).write_text(text.replace(marker, addition + marker, 1))
          PY

      - name: Check source formatting
        run: git diff --check

      - name: Typecheck
        run: pnpm exec tsc -p tsconfig.json --noEmit --pretty false

      - name: Lint lifecycle sources
        run: >-
          pnpm exec eslint --max-warnings=0
          apps/web/src/app/routes/groups/creator-route-pages.ts
          apps/web/src/app/routes/groups/creator.routes.tsx
          apps/web/src/domains/creator/studio-project-library-store.ts
          apps/web/src/domains/creator/studio-project-library-store.test.ts
          apps/web/src/domains/creator/studio-project-document-store.ts
          apps/web/src/domains/creator/studio-project-document-store.test.ts
          apps/web/src/domains/creator/studio-shell/useStudioProjectLibrary.ts
          apps/web/src/domains/creator/studio-shell/useStudioProjectDocuments.ts
          apps/web/src/domains/creator/studio-shell/StudioNewIntegratedPage.tsx
          apps/web/src/domains/creator/studio-shell/StudioNewIntegratedPage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectLibraryPage.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectLibraryPage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectDocumentsPanel.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectDocumentsPanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.tsx
          apps/web/src/domains/creator/studio-integration-closure.test.ts

      - name: Run lifecycle and route tests
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/studio-project-library-store.test.ts
          apps/web/src/domains/creator/studio-project-document-store.test.ts
          apps/web/src/domains/creator/studio-shell/StudioNewIntegratedPage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectLibraryPage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectDocumentsPanel.test.tsx
          apps/web/src/domains/creator/studio-integration-closure.test.ts
          apps/web/src/app/routes/groups/app-routes.test.tsx
          --pool=forks --maxWorkers=2

      - name: Verify ToonStudio contracts and reachability
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-toonstudio-feature-reachability.mjs
          if pnpm run | grep -q 'verify:studio-session-complete'; then
            pnpm run verify:studio-session-complete
          fi

      - name: Build production bundle
        run: pnpm run build:bundle

      - name: Commit verified integration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-toonstudio-project-lifecycle.yml
          git config user.name "toonstudio-integration-bot"
          git config user.email "toonstudio-integration-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(studio): complete project and document lifecycle"
          git push origin HEAD:feat/toonstudio-project-lifecycle-20260912
