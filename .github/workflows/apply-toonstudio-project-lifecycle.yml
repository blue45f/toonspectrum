name: Apply ToonStudio project lifecycle once

# Retry after aligning the integration script with the canonical route registry.
on:
  push:
    branches:
      - feat/toonstudio-project-lifecycle-20260912
    paths:
      - .github/workflows/apply-toonstudio-project-lifecycle.yml

permissions:
  contents: write

concurrency:
  group: apply-toonstudio-project-lifecycle
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      CI: "true"
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-project-lifecycle-20260912
          fetch-depth: 0

      - name: Synchronize main and resolve new-project composition
        shell: bash
        run: |
          set -euo pipefail
          page="apps/web/src/domains/creator/studio-shell/StudioNewIntegratedPage.tsx"
          create_page="apps/web/src/domains/creator/studio-shell/StudioProjectCreatePage.tsx"
          preserved="$RUNNER_TEMP/StudioProjectCreatePage.tsx"

          cp "$page" "$preserved"
          git config user.name "toonstudio-integration-bot"
          git config user.email "toonstudio-integration-bot@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-edit origin/main
          merge_status=$?
          set -e

          if [[ "$merge_status" -eq 0 ]]; then
            echo "Expected the known add/add conflict, but main merged without it." >&2
            exit 1
          fi

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          if [[ "${#conflicts[@]}" -ne 1 || "${conflicts[0]}" != "$page" ]]; then
            printf 'Unexpected merge conflicts:\n' >&2
            printf ' - %s\n' "${conflicts[@]}" >&2
            git merge --abort || true
            exit 1
          fi

          git checkout --theirs -- "$page"
          cp "$preserved" "$create_page"
          python scripts/apply-toonstudio-project-lifecycle.py
          git add -A
          git diff --cached --check
          git commit --no-edit

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize lifecycle sources
        run: >-
          pnpm exec eslint --fix
          apps/web/src/app/routes/groups/creator-route-pages.ts
          apps/web/src/app/routes/groups/creator.routes.tsx
          apps/web/src/domains/creator/studio-project-library-store.ts
          apps/web/src/domains/creator/studio-project-library-store.test.ts
          apps/web/src/domains/creator/studio-project-document-store.ts
          apps/web/src/domains/creator/studio-project-document-store.test.ts
          apps/web/src/domains/creator/studio-shell/useStudioProjectLibrary.ts
          apps/web/src/domains/creator/studio-shell/useStudioProjectDocuments.ts
          apps/web/src/domains/creator/studio-shell/StudioNewIntegratedPage.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectCreatePage.tsx
          apps/web/src/domains/creator/studio-shell/StudioNewIntegratedPage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectLibraryPage.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectLibraryPage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectDocumentsPanel.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectDocumentsPanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.tsx
          apps/web/src/domains/creator/studio-integration-closure.test.ts

      - name: Check source formatting
        run: git diff --check

      - name: Typecheck
        run: pnpm exec tsc -p tsconfig.json --noEmit --pretty false

      - name: Lint lifecycle sources
        run: >-
          pnpm exec eslint --max-warnings=0
          apps/web/src/app/routes/groups/creator-route-pages.ts
          apps/web/src/app/routes/groups/creator.routes.tsx
          apps/web/src/domains/creator/studio-project-library-store.ts
          apps/web/src/domains/creator/studio-project-library-store.test.ts
          apps/web/src/domains/creator/studio-project-document-store.ts
          apps/web/src/domains/creator/studio-project-document-store.test.ts
          apps/web/src/domains/creator/studio-shell/useStudioProjectLibrary.ts
          apps/web/src/domains/creator/studio-shell/useStudioProjectDocuments.ts
          apps/web/src/domains/creator/studio-shell/StudioNewIntegratedPage.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectCreatePage.tsx
          apps/web/src/domains/creator/studio-shell/StudioNewIntegratedPage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectLibraryPage.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectLibraryPage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectDocumentsPanel.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectDocumentsPanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.tsx
          apps/web/src/domains/creator/studio-integration-closure.test.ts

      - name: Run lifecycle and route tests
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/studio-project-library-store.test.ts
          apps/web/src/domains/creator/studio-project-document-store.test.ts
          apps/web/src/domains/creator/studio-shell/StudioNewIntegratedPage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectLibraryPage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectDocumentsPanel.test.tsx
          apps/web/src/domains/creator/studio-integration-closure.test.ts
          apps/web/src/app/routes/groups/app-routes.test.tsx
          --pool=forks --maxWorkers=2

      - name: Verify ToonStudio contracts and reachability
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-toonstudio-feature-reachability.mjs
          if pnpm run | grep -q 'verify:studio-session-complete'; then
            pnpm run verify:studio-session-complete
          fi

      - name: Build production bundle
        run: pnpm run build:bundle

      - name: Commit verified integration and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/rewrite
          {
            echo "# ToonStudio project lifecycle validation"
            echo
            echo "- Validated commit: \`$(git rev-parse HEAD)\`"
            echo "- Validated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- TypeScript: passed"
            echo "- ESLint: passed"
            echo "- Project and document lifecycle tests: passed"
            echo "- Route and integration closure tests: passed"
            echo "- Feature reachability and session contracts: passed"
            echo "- Production bundle: passed"
            echo
            echo "The canonical Studio front door owns persistent project creation, duplication,"
            echo "archive, Trash and recovery. Production > Documents owns document creation and"
            echo "workspace switching while preserving document identity. Template intent remains"
            echo "visible and persisted before the full project creation surface opens."
          } > docs/rewrite/toonstudio-project-lifecycle-validation.md

          rm -f .github/workflows/apply-toonstudio-project-lifecycle.yml
          rm -f .github/workflows/verify-toonstudio-project-lifecycle.yml
          rm -f scripts/apply-toonstudio-project-lifecycle.py
          git add -A
          git diff --cached --check
          git commit -m "feat(studio): complete project and document lifecycle"
          git push origin HEAD:feat/toonstudio-project-lifecycle-20260912
