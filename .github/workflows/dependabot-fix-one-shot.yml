name: Dependabot fix one-shot

on:
  push:
    branches:
      - security/fix-dependabot-23-advisories-20260908

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ !contains(github.event.head_commit.message, '[skip dependabot-fix]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out dependency manifests
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            apps/*/package.json
            packages/*/package.json
            patches/**
            .github/workflows/dependabot-fix-one-shot.yml

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Apply every available advisory update
        env:
          CI: "true"
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/dependabot-fix

          set +e
          pnpm audit --json --audit-level low \
            > /tmp/dependabot-fix/before.json \
            2> /tmp/dependabot-fix/before.err
          printf '%s\n' "$?" > /tmp/dependabot-fix/before.exit

          pnpm audit --fix=update --audit-level low \
            > /tmp/dependabot-fix/fix.log 2>&1
          printf '%s\n' "$?" > /tmp/dependabot-fix/fix.exit

          pnpm audit --json --audit-level low \
            > /tmp/dependabot-fix/after.json \
            2> /tmp/dependabot-fix/after.err
          printf '%s\n' "$?" > /tmp/dependabot-fix/after.exit
          set -e

      - name: Require a clean all-severity audit
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          function readJson(path) {
            return JSON.parse(readFileSync(path, "utf8"));
          }
          function exitCode(path) {
            return Number(readFileSync(path, "utf8").trim());
          }
          function counts(report) {
            const source = report?.metadata?.vulnerabilities ?? {};
            const normalized = Object.fromEntries(
              ["info", "low", "moderate", "high", "critical"].map((severity) => [
                severity,
                Number(source[severity] ?? 0),
              ]),
            );
            normalized.total = Object.values(normalized).reduce(
              (sum, value) => sum + value,
              0,
            );
            return normalized;
          }

          const before = readJson("/tmp/dependabot-fix/before.json");
          const after = readJson("/tmp/dependabot-fix/after.json");
          const summary = {
            before: counts(before),
            after: counts(after),
            fixExitCode: exitCode("/tmp/dependabot-fix/fix.exit"),
            auditExitCode: exitCode("/tmp/dependabot-fix/after.exit"),
          };
          console.log(JSON.stringify(summary, null, 2));

          if (summary.auditExitCode !== 0 || summary.after.total !== 0) {
            console.error(readFileSync("/tmp/dependabot-fix/after.err", "utf8"));
            console.error(JSON.stringify(after, null, 2));
            process.exit(1);
          }
          NODE

      - name: Commit only dependency remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          unexpected="$({ git diff --name-only; git diff --cached --name-only; } | sort -u | grep -Ev '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|apps/[^/]+/package\.json|packages/[^/]+/package\.json|\.github/workflows/dependabot-fix-one-shot\.yml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected tracked changes:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

          git add -- \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            ':(glob)apps/*/package.json' \
            ':(glob)packages/*/package.json'
          git rm -- .github/workflows/dependabot-fix-one-shot.yml
          git status --short
          git commit -m "fix(security): resolve 23 Dependabot advisories [skip dependabot-fix]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
