name: ToonStudio squash rebase reconcile

on:
  push:
    branches:
      - feat/toonstudio-final-ia-20260911
    paths:
      - .github/workflows/toonstudio-rebase-reconcile.yml

permissions:
  contents: write

concurrency:
  group: toonstudio-squash-rebase-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BRANCH: feat/toonstudio-final-ia-20260911
      MAIN_REF: origin/main
      HELPER_WORKFLOW: .github/workflows/toonstudio-rebase-reconcile.yml
      STALE_MENU_WORKFLOW: .github/workflows/toonstudio-menu-contract-repair.yml
      STALE_MENU_SCRIPT: scripts/repair-studio-menu-contract.mjs
    steps:
      - name: Checkout feature branch with full history
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-final-ia-20260911
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild reviewed feature tree directly on current main
        id: reconcile
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --prune

          FEATURE_HEAD="$(git rev-parse HEAD)"
          MAIN_HEAD="$(git rev-parse "$MAIN_REF")"
          SYNC_MERGE="$(
            git log --merges --format=%H \
              --grep="Merge remote-tracking branch 'origin/main' into feat/toonstudio-final-ia-20260911" \
              -1 "$FEATURE_HEAD"
          )"
          if [[ -z "$SYNC_MERGE" ]]; then
            echo 'Could not locate the reviewed main synchronization merge.' >&2
            exit 1
          fi

          FEATURE_SOURCE="$(git rev-parse "${SYNC_MERGE}^1")"
          SYNC_MAIN="$(git rev-parse "${SYNC_MERGE}^2")"
          export FEATURE_HEAD MAIN_HEAD SYNC_MERGE FEATURE_SOURCE SYNC_MAIN

          if [[ "$SYNC_MAIN" != "$MAIN_HEAD" ]]; then
            echo "main advanced after the reviewed synchronization: sync=$SYNC_MAIN current=$MAIN_HEAD" >&2
            echo 'The branch was not rewritten; the new main delta requires another overlap audit.' >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SYNC_MERGE" "$FEATURE_HEAD"; then
            echo 'The synchronization merge is not an ancestor of the feature head.' >&2
            exit 1
          fi

          {
            echo "feature_head=$FEATURE_HEAD"
            echo "main_head=$MAIN_HEAD"
            echo "sync_merge=$SYNC_MERGE"
            echo "feature_source=$FEATURE_SOURCE"
          } >> "$GITHUB_OUTPUT"

          printf 'Feature head: %s\nCurrent main: %s\nSync merge: %s\nPre-merge feature source: %s\n' \
            "$FEATURE_HEAD" "$MAIN_HEAD" "$SYNC_MERGE" "$FEATURE_SOURCE"

          git diff --binary --full-index "$SYNC_MAIN" "$FEATURE_HEAD" -- \
            . \
            ":(exclude)$HELPER_WORKFLOW" \
            ":(exclude)$STALE_MENU_WORKFLOW" \
            ":(exclude)$STALE_MENU_SCRIPT" \
            > /tmp/toonstudio-final-feature.patch
          git diff --name-only "$SYNC_MAIN" "$FEATURE_HEAD" -- \
            . \
            ":(exclude)$HELPER_WORKFLOW" \
            ":(exclude)$STALE_MENU_WORKFLOW" \
            ":(exclude)$STALE_MENU_SCRIPT" \
            | sort -u > /tmp/feature-paths.txt

          git reset --hard "$MAIN_HEAD"
          rm -f "$HELPER_WORKFLOW" "$STALE_MENU_WORKFLOW" "$STALE_MENU_SCRIPT"

          git apply --index --whitespace=nowarn /tmp/toonstudio-final-feature.patch

          python3 <<'PY'
          from __future__ import annotations

          import os
          import re
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          feature_source = os.environ["FEATURE_SOURCE"]
          main_head = os.environ["MAIN_HEAD"]


          def git_show(ref: str, path: str) -> str:
              return subprocess.check_output(
                  ["git", "show", f"{ref}:{path}"],
                  text=True,
              )


          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)


          def write(path: str, text: str) -> None:
              destination = root / path
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text(text, encoding="utf-8")


          # Route conflict: keep main's centralized lazy module while restoring the
          # feature's canonical six-stage project shell.
          creator_routes_path = "apps/web/src/app/routes/groups/creator.routes.tsx"
          creator_routes = git_show(main_head, creator_routes_path)
          creator_routes = replace_once(
              creator_routes,
              "  StudioAssetsPage,\n  StudioBrushLabPage,\n",
              "  StudioAssetsPage,\n  StudioBrushLabPage,\n  StudioProjectShellPage,\n",
              "creator route page import",
          )
          template_route = (
              '  { id: "creator-studio-templates", path: "/studio/templates", '
              'element: <Navigate to="/market?view=templates" replace /> },\n\n'
          )
          project_routes = template_route + (
              "  // Canonical six-stage project shell. Existing editor capabilities remain behind\n"
              "  // these durable project routes while ownership migrates into the unified shell.\n"
              '  { id: "creator-studio-project-root", path: "/studio/p/:projectId", element: <Navigate to="overview" replace /> },\n'
              '  { id: "creator-studio-project-overview", path: "/studio/p/:projectId/overview", element: <StudioProjectShellPage section="overview" /> },\n'
              '  { id: "creator-studio-project-story", path: "/studio/p/:projectId/story", element: <StudioProjectShellPage section="story" /> },\n'
              '  { id: "creator-studio-project-production", path: "/studio/p/:projectId/production", element: <StudioProjectShellPage section="production" /> },\n'
              '  { id: "creator-studio-project-assets", path: "/studio/p/:projectId/assets", element: <StudioProjectShellPage section="assets" /> },\n'
              '  { id: "creator-studio-project-review", path: "/studio/p/:projectId/review", element: <StudioProjectShellPage section="review" /> },\n'
              '  { id: "creator-studio-project-export", path: "/studio/p/:projectId/export", element: <StudioProjectShellPage section="export" /> },\n'
              '  { id: "creator-studio-project-settings", path: "/studio/p/:projectId/settings", element: <StudioProjectShellPage section="settings" /> },\n\n'
          )
          creator_routes = replace_once(
              creator_routes,
              template_route,
              project_routes,
              "project route insertion",
          )
          write(creator_routes_path, creator_routes)

          route_pages_path = "apps/web/src/app/routes/groups/creator-route-pages.ts"
          route_pages = git_show(main_head, route_pages_path)
          learn_anchor = "export const LearnPage = lazyRetry(\n"
          project_page_export = (
              "export const StudioProjectShellPage = lazyRetry(\n"
              '  () => import("@/domains/creator/studio-shell/StudioProjectShellPage").then((module) => ({\n'
              "    default: module.StudioProjectShellPage,\n"
              "  })),\n"
              '  "StudioProjectShellPage",\n'
              ");\n"
          )
          route_pages = replace_once(
              route_pages,
              learn_anchor,
              project_page_export + learn_anchor,
              "project shell lazy export",
          )
          write(route_pages_path, route_pages)

          manual_routes_test_path = "apps/web/src/app/routes/groups/studio-manual.routes.test.tsx"
          # Main's test is the semantic superset: Studio home is separate, while
          # canvas, character, 3D and publishing remain editor-owned routes.
          write(manual_routes_test_path, git_show(main_head, manual_routes_test_path))

          # Navigation conflict: retain the feature's Studio/Spectrum split and add
          # main's new Fortune destination to Spectrum's personal group.
          navigation_path = "apps/web/src/shared/components/site-navigation.ts"
          navigation = git_show(feature_source, navigation_path)
          navigation = replace_once(
              navigation,
              "  MessageSquareQuote,\n  Palette,\n",
              "  MessageSquareQuote,\n  Moon,\n  Palette,\n",
              "Moon icon import",
          )
          fortune_item = (
              "  fortune: item(\n"
              '    "fortune",\n'
              '    "/fortune",\n'
              "    Moon,\n"
              '    "사주·타로 운세",\n'
              '    "Fortune & tarot",\n'
              '    "오늘의 운세·별자리·사주·궁합·타로·독서 처방",\n'
              '    "Explore daily fortune, zodiac, saju, compatibility, tarot and reading prescriptions",\n'
              "  ),\n"
          )
          navigation = replace_once(
              navigation,
              "  research: item(\n",
              fortune_item + "  research: item(\n",
              "fortune navigation item",
          )
          navigation = replace_once(
              navigation,
              "    items: [I.library, I.me, I.insights, I.home],\n",
              "    items: [I.library, I.me, I.fortune, I.insights, I.home],\n",
              "Spectrum personal navigation",
          )
          write(navigation_path, navigation)

          navigation_test_path = "apps/web/src/shared/components/site-navigation.test.ts"
          navigation_test = git_show(feature_source, navigation_test_path)
          context_test_anchor = '  it("switches desktop and mobile navigation from the current product context", () => {\n'
          fortune_test = (
              '  it("keeps fortune and tarot discoverable in the Spectrum context", () => {\n'
              "    const personalItems = TOONSPECTRUM_NAVIGATION_GROUPS.find(\n"
              '      (group) => group.id === "personal"\n'
              "    )?.items;\n\n"
              "    expect(personalItems).toContain(SITE_NAVIGATION_ITEMS.fortune);\n"
              '    expect(SITE_NAVIGATION_ITEMS.fortune.href).toBe("/fortune");\n'
              '    expect(SITE_NAVIGATION_ITEMS.fortune.label.ko).toContain("타로");\n'
              '    expect(siteNavigationContextForPath("/fortune")).toBe("spectrum");\n'
              "  });\n\n"
          )
          navigation_test = replace_once(
              navigation_test,
              context_test_anchor,
              fortune_test + context_test_anchor,
              "fortune navigation regression test",
          )
          write(navigation_test_path, navigation_test)

          # The feature source had a line break between an expression and its `as`
          # assertion, which TypeScript parsed as an invalid standalone statement.
          project_shell_path = "apps/web/src/domains/creator/studio-shell/StudioProjectShellPage.tsx"
          project_shell = git_show(feature_source, project_shell_path)
          project_shell = replace_once(
              project_shell,
              'const PRIMARY_SECTIONS = STUDIO_PROJECT_NAVIGATION.map((item) => item.id)\n  as readonly Exclude<StudioProjectSection, "settings">[];\n',
              'const PRIMARY_SECTIONS = STUDIO_PROJECT_NAVIGATION.map(\n  (item) => item.id,\n) as readonly Exclude<StudioProjectSection, "settings">[];\n',
              "primary section type assertion",
          )
          write(project_shell_path, project_shell)

          # A failed positional repair workflow left the brush menu specification
          # ahead of the command inventory. Normalize the inventory at its canonical
          # position instead of retaining the one-shot automation.
          catalog_path = "apps/web/src/domains/creator/studio-command-catalog-base.ts"
          catalog = (root / catalog_path).read_text(encoding="utf-8")
          brush_lab_line = '  "brush/brush-lab",\n'
          brush_lab_count = catalog.count(brush_lab_line)
          if brush_lab_count > 1:
              raise RuntimeError(
                  f"brush command inventory: expected at most one brush-lab row, found {brush_lab_count}"
              )
          if brush_lab_count == 1:
              catalog = catalog.replace(brush_lab_line, "", 1)

          comment_pattern = re.compile(r"(?m)^  // brush \(\d+\)([^\n]*)$")
          comment_matches = list(comment_pattern.finditer(catalog))
          if len(comment_matches) != 1:
              raise RuntimeError(
                  f"brush command inventory: expected one count comment, found {len(comment_matches)}"
              )
          catalog = comment_pattern.sub(r"  // brush (15)\1", catalog, count=1)
          catalog = replace_once(
              catalog,
              '  "brush/brush-studio",\n',
              '  "brush/brush-studio",\n  "brush/brush-lab",\n',
              "brush-lab canonical inventory position",
          )
          write(catalog_path, catalog)

          groups_test_path = "apps/web/src/domains/creator/studio-main-menu-groups.test.ts"
          groups_test = (root / groups_test_path).read_text(encoding="utf-8")
          help_product_key = (
              '      "studio.mainMenu.item.help.product": '
              '"Help home and guided learning",\n'
          )
          if help_product_key not in groups_test:
              groups_test = replace_once(
                  groups_test,
                  '      "studio.mainMenu.item.view.feature-tutorials": "Feature tutorials",\n',
                  '      "studio.mainMenu.item.view.feature-tutorials": "Feature tutorials",\n'
                  + help_product_key,
                  "product help localization fixture",
              )
          write(groups_test_path, groups_test)
          PY

          git add -A

          cat > /tmp/manual-paths.txt <<'EOF'
          apps/web/src/app/routes/groups/creator-route-pages.ts
          apps/web/src/app/routes/groups/creator.routes.tsx
          apps/web/src/app/routes/groups/studio-manual.routes.test.tsx
          apps/web/src/domains/creator/studio-command-catalog-base.ts
          apps/web/src/domains/creator/studio-main-menu-groups.test.ts
          apps/web/src/domains/creator/studio-shell/StudioProjectShellPage.tsx
          apps/web/src/shared/components/site-navigation.test.ts
          apps/web/src/shared/components/site-navigation.ts
          EOF
          sed -i 's/^          //' /tmp/manual-paths.txt
          sort -u -o /tmp/manual-paths.txt /tmp/manual-paths.txt

          # Every non-manual feature path must stay byte-for-byte identical to the
          # reviewed post-sync feature tree.
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            if grep -Fxq "$path" /tmp/manual-paths.txt; then
              continue
            fi
            if git cat-file -e "$FEATURE_HEAD:$path" 2>/dev/null; then
              if [[ ! -e "$path" && ! -L "$path" ]]; then
                echo "Feature file disappeared during squash rebase: $path" >&2
                exit 1
              fi
              EXPECTED_BLOB="$(git rev-parse "$FEATURE_HEAD:$path")"
              ACTUAL_BLOB="$(git hash-object "$path")"
              if [[ "$EXPECTED_BLOB" != "$ACTUAL_BLOB" ]]; then
                echo "Unexpected content drift in non-conflicting file: $path" >&2
                exit 1
              fi
            elif [[ -e "$path" || -L "$path" ]]; then
              echo "Feature deletion was not preserved: $path" >&2
              exit 1
            fi
          done < /tmp/feature-paths.txt

          python3 <<'PY'
          from pathlib import Path

          required_tokens = {
              "apps/web/src/app/routes/groups/creator.routes.tsx": [
                  "StudioProjectShellPage,",
                  'path: "/studio/p/:projectId/overview"',
                  'path: "/studio/p/:projectId/story"',
                  'path: "/studio/p/:projectId/production"',
                  'path: "/studio/p/:projectId/assets"',
                  'path: "/studio/p/:projectId/review"',
                  'path: "/studio/p/:projectId/export"',
                  'path: "/studio/p/:projectId/settings"',
              ],
              "apps/web/src/app/routes/groups/creator-route-pages.ts": [
                  "export const StudioProjectShellPage = lazyRetry(",
                  'import("@/domains/creator/studio-shell/StudioProjectShellPage")',
              ],
              "apps/web/src/app/routes/groups/studio-manual.routes.test.tsx": [
                  'routeId("/studio")',
                  '"/studio/canvas"',
                  '"/studio/character"',
                  '"/studio/bg3d"',
                  '"/studio/publish"',
              ],
              "apps/web/src/shared/components/site-navigation.ts": [
                  "Moon,",
                  '"fortune",',
                  '"/fortune",',
                  "I.fortune",
                  'export type SiteNavigationContext = "studio" | "spectrum";',
              ],
              "apps/web/src/shared/components/site-navigation.test.ts": [
                  "SITE_NAVIGATION_ITEMS.fortune",
                  'siteNavigationContextForPath("/fortune")',
                  'toBe("spectrum")',
              ],
              "apps/web/src/domains/creator/studio-shell/StudioProjectShellPage.tsx": [
                  "const PRIMARY_SECTIONS = STUDIO_PROJECT_NAVIGATION.map(",
                  "  (item) => item.id,",
                  ') as readonly Exclude<StudioProjectSection, "settings">[];',
              ],
              "apps/web/src/domains/creator/studio-main-menu-groups.test.ts": [
                  '"studio.mainMenu.item.help.product": "Help home and guided learning"',
                  'expect(menuItem(english, "help", "feature-tutorials").label).toBe(',
                  "expect(editor.openFeatureTutorial).not.toHaveBeenCalled();",
              ],
          }
          for path, tokens in required_tokens.items():
              text = Path(path).read_text(encoding="utf-8")
              missing = [token for token in tokens if token not in text]
              if missing:
                  raise SystemExit(f"{path}: missing merged semantic tokens: {missing}")

          catalog_path = Path(
              "apps/web/src/domains/creator/studio-command-catalog-base.ts"
          )
          catalog = catalog_path.read_text(encoding="utf-8")
          if catalog.count('  "brush/brush-lab",\n') != 1:
              raise SystemExit("brush-lab must appear exactly once in the command inventory")
          if '  "brush/brush-studio",\n  "brush/brush-lab",\n' not in catalog:
              raise SystemExit("brush-lab is not adjacent to brush-studio")
          if "// brush (15)" not in catalog:
              raise SystemExit("brush inventory count is not normalized to 15")

          transient = [
              ".github/workflows/toonstudio-rebase-reconcile.yml",
              ".github/workflows/toonstudio-menu-contract-repair.yml",
              "scripts/repair-studio-menu-contract.mjs",
          ]
          leaked = [path for path in transient if Path(path).exists()]
          if leaked:
              raise SystemExit(f"transient automation leaked into final tree: {leaked}")
          PY

          if git grep -n -E '^(<<<<<<<|>>>>>>>|\|\|\|\|\|\|\|)( |$)' -- \
            '*.ts' '*.tsx' '*.js' '*.mjs' '*.mts' '*.json' '*.yml' '*.yaml'; then
            echo 'Conflict marker found after reconciliation.' >&2
            exit 1
          fi
          git diff --cached --check

          git diff --cached --name-only "$MAIN_HEAD" | sort -u > /tmp/final-paths.txt
          cat /tmp/feature-paths.txt /tmp/manual-paths.txt | sort -u > /tmp/allowed-final-paths.txt
          if comm -23 /tmp/final-paths.txt /tmp/allowed-final-paths.txt | grep -q .; then
            echo 'Squash rebase changed files outside the reviewed feature and manual resolutions:' >&2
            comm -23 /tmp/final-paths.txt /tmp/allowed-final-paths.txt >&2
            exit 1
          fi

          if git diff --cached --quiet; then
            echo 'Squash rebase produced no feature changes.' >&2
            exit 1
          fi

          echo "final_changed_files=$(wc -l < /tmp/final-paths.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo 'Final reconciled paths:'
          cat /tmp/final-paths.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint manually reconciled files
        run: >-
          pnpm exec eslint --max-warnings=0
          apps/web/src/app/routes/groups/creator.routes.tsx
          apps/web/src/app/routes/groups/creator-route-pages.ts
          apps/web/src/app/routes/groups/studio-manual.routes.test.tsx
          apps/web/src/shared/components/site-navigation.ts
          apps/web/src/shared/components/site-navigation.test.ts
          apps/web/src/domains/creator/studio-shell/StudioProjectShellPage.tsx
          apps/web/src/domains/creator/studio-command-catalog-base.ts
          apps/web/src/domains/creator/studio-main-menu-groups.test.ts

      - name: Run route, navigation, menu and final IA regression tests
        run: >-
          pnpm exec vitest run
          apps/web/src/app/routes/groups/studio-manual.routes.test.tsx
          apps/web/src/app/routes/app-routes.test.tsx
          apps/web/src/shared/components/site-navigation.test.ts
          apps/web/src/shared/components/site-shell-mobile-accessibility.test.tsx
          apps/web/src/domains/creator/studio-and-spectrum-ia-contract.test.ts
          apps/web/src/domains/creator/studio-route-paths.test.ts
          apps/web/src/domains/creator/studio-final-integration.test.ts
          apps/web/src/domains/creator/studio-final-dod-contract.test.ts
          apps/web/src/domains/creator/studio-main-menu-groups.test.ts
          apps/web/src/domains/creator/studio-main-menu-group-spec.test.ts

      - name: Type-check the integrated application
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Build the production bundle
        run: pnpm run build:bundle

      - name: Commit and force-push the squash rebase with a lease
        shell: bash
        env:
          FEATURE_HEAD: ${{ steps.reconcile.outputs.feature_head }}
          MAIN_HEAD: ${{ steps.reconcile.outputs.main_head }}
        run: |
          set -euo pipefail

          if ! git diff --quiet; then
            echo 'Validation modified tracked files after reconciliation.' >&2
            git diff --stat >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'No staged feature tree remains to commit.' >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'rebase: reconcile ToonStudio IA with main'

          NEW_HEAD="$(git rev-parse HEAD)"
          PARENT_HEAD="$(git rev-parse HEAD^)"
          if [[ "$PARENT_HEAD" != "$MAIN_HEAD" ]]; then
            echo "Unexpected parent after squash rebase: $PARENT_HEAD" >&2
            exit 1
          fi

          git push \
            --force-with-lease="refs/heads/$BRANCH:$FEATURE_HEAD" \
            origin "HEAD:refs/heads/$BRANCH"
          printf 'Rebased head: %s\nParent main: %s\n' "$NEW_HEAD" "$MAIN_HEAD"
