name: Studio Selection Contract Cleanup

on:
  push:
    branches:
      - feat/studio-selection-contract-cleanup-v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-selection-contract-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      HUSKY: "0"
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v6
        with:
          ref: feat/studio-selection-contract-cleanup-v2
          fetch-depth: 1

      - name: Repair selection audit contracts
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def block(*lines: str) -> str:
              return "\n".join(lines)

          def replace_once(path: str, before: str, after: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if after in text:
                  return
              count = text.count(before)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one repair anchor, found {count}")
              target.write_text(text.replace(before, after, 1), encoding="utf-8")

          replace_once(
              "apps/web/src/domains/creator/StudioPixelSelectionHud.test.tsx",
              'return this.dataset?.studioPixelSelectionHud === "true" ? 720 : 0;',
              'return this.dataset?.studioPixelSelectionHud === "true" ? 480 : 0;',
          )

          menu_path = "apps/web/src/domains/creator/studio-main-menu-group-spec.ts"
          replace_once(
              menu_path,
              block(
                  "      part(",
                  '        "Semantic/Object Select",',
                  '        "인스펙터 선택 작업대에서 레이어 불투명도와 온디바이스 AI 피사체를 현재 결합 모드로 선택한다. 독립 메인 메뉴 명령은 아직 없다.",',
                  "      ),",
              ),
              block(
                  "      gap(",
                  '        "Semantic/Object Select",',
                  '        "인스펙터 작업대에 AI·불투명도 선택은 있으나 메인 메뉴에서 호출하는 명령은 아직 없다.",',
                  "      ),",
              ),
          )
          replace_once(
              menu_path,
              block(
                  "      part(",
                  '        "Expand/Shrink/Feather/Smooth",',
                  '        "선택 도구 패널과 캔버스 HUD에서 확장·축소·페더·면적 보존 스무딩을 제공한다. 메인 메뉴 수치 대화상자는 아직 없다.",',
                  "      ),",
              ),
              block(
                  "      gap(",
                  '        "Expand/Shrink/Feather/Smooth",',
                  '        "선택 패널과 캔버스 HUD에 기능은 있으나 메인 메뉴 명령·수치 대화상자는 아직 없다.",',
                  "      ),",
              ),
          )
          replace_once(
              menu_path,
              block(
                  "      part(",
                  '        "Save Selection",',
                  '        "이미지 단위·기기 로컬 이름 저장/불러오기를 제공한다. 프로젝트·CRDT 영구 채널과 팀 동기화는 아직 없다.",',
                  "      ),",
              ),
              block(
                  "      gap(",
                  '        "Save Selection",',
                  '        "이미지 단위 로컬 저장·불러오기는 있으나 메인 메뉴 명령과 프로젝트 영구 채널은 아직 없다.",',
                  "      ),",
              ),
          )
          replace_once(
              menu_path,
              block(
                  "      part(",
                  '        "Selection HUD",',
                  '        "픽셀 선택 대상 근처에 safe-area 인지 HUD를 제공한다. 사용자가 명령 구성을 편집하는 기능은 아직 없다.",',
                  "      ),",
              ),
              block(
                  "      gap(",
                  '        "Selection HUD",',
                  '        "픽셀 선택 HUD는 있으나 메인 메뉴 행이 아닌 캔버스 맥락형 표면이며 사용자 커스터마이즈 명령은 없다.",',
                  "      ),",
              ),
          )

          replace_once(
              "apps/web/src/domains/creator/studio-main-menu-items-selection.ts",
              block(
                  " * The workbench and contextual HUD now partially deliver Semantic/Object Select,",
                  " * Expand/Shrink/Feather/Smooth, Save Selection and Selection HUD. They remain",
                  " * recorded as partial in `studio-main-menu-group-spec.ts`: no direct menubar command,",
                  " * project-synced named-selection channel or user-customizable launcher is invented.",
              ),
              block(
                  " * The workbench and contextual HUD deliver those capabilities outside the menubar.",
                  " * The corresponding §15.3 menu rows remain gaps because no direct menu command,",
                  " * project-synced named-selection channel or customizable launcher item is invented.",
              ),
          )

          integration_path = "apps/web/src/domains/creator/studio-selection-workbench-integration.test.ts"
          replace_once(
              integration_path,
              block(
                  '  it("records the delivered surfaces as partial rather than inventing menubar commands", () => {',
                  '    const source = readCreatorFile("studio-main-menu-group-spec.ts");',
                  '    expect(source).toContain(\'part(\\n        "Semantic/Object Select"\');',
                  '    expect(source).toContain(\'part(\\n        "Expand/Shrink/Feather/Smooth"\');',
                  '    expect(source).toContain(\'part(\\n        "Save Selection"\');',
                  '    expect(source).toContain(\'part(\\n        "Selection HUD"\');',
                  "  });",
              ),
              block(
                  '  it("keeps inspector and HUD capabilities distinct from absent menubar commands", () => {',
                  '    const source = readCreatorFile("studio-main-menu-group-spec.ts");',
                  '    expect(source).toContain(\'gap(\\n        "Semantic/Object Select"\');',
                  '    expect(source).toContain(\'gap(\\n        "Expand/Shrink/Feather/Smooth"\');',
                  '    expect(source).toContain(\'gap(\\n        "Save Selection"\');',
                  '    expect(source).toContain(\'gap(\\n        "Selection HUD"\');',
                  "  });",
              ),
          )
          replace_once(
              integration_path,
              'expect(menuSource).toContain("now partially deliver");',
              'expect(menuSource).toContain("outside the menubar");',
          )
          PY
          git diff --check

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused selection regression suite
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/studio-selection-tools.test.ts
          apps/web/src/domains/creator/studio-pixel-selection-history.test.ts
          apps/web/src/domains/creator/studio-selection-refinement.test.ts
          apps/web/src/domains/creator/studio-selection-source.test.ts
          apps/web/src/domains/creator/studio-saved-selections.test.ts
          apps/web/src/domains/creator/StudioSelectionWorkbenchPanel.test.tsx
          apps/web/src/domains/creator/StudioPixelSelectionHud.test.tsx
          apps/web/src/domains/creator/StudioSelectionContextBar.test.tsx
          apps/web/src/domains/creator/studio-selection-workbench-integration.test.ts
          apps/web/src/domains/creator/studio-main-menu-group-spec.test.ts

      - name: Lint selection implementation
        run: >-
          pnpm exec eslint --max-warnings=0
          apps/web/src/domains/creator/studio-selection-refinement.ts
          apps/web/src/domains/creator/studio-selection-refinement.test.ts
          apps/web/src/domains/creator/studio-selection-source.ts
          apps/web/src/domains/creator/studio-selection-source-browser.ts
          apps/web/src/domains/creator/studio-selection-source.test.ts
          apps/web/src/domains/creator/studio-saved-selections.ts
          apps/web/src/domains/creator/studio-saved-selections.test.ts
          apps/web/src/domains/creator/StudioSelectionWorkbenchPanel.tsx
          apps/web/src/domains/creator/StudioSelectionWorkbenchPanel.test.tsx
          apps/web/src/domains/creator/StudioPixelSelectionHud.tsx
          apps/web/src/domains/creator/StudioPixelSelectionHud.test.tsx
          apps/web/src/domains/creator/studio-selection-workbench-integration.test.ts
          apps/web/src/domains/creator/StudioInspectorImageToolsSection.tsx
          apps/web/src/domains/creator/studio-cuttoon-editor/StudioCuttoonEditorCanvasColumn.tsx
          apps/web/src/domains/creator/studio-main-menu-group-spec.ts
          apps/web/src/domains/creator/studio-main-menu-items-selection.ts

      - name: Typecheck workspace
        run: pnpm exec tsc -p tsconfig.json --noEmit --incremental false

      - name: Validate architecture, menus, and canvas command surfaces
        run: |
          set -euo pipefail
          pnpm run validate:architecture
          pnpm run verify:studio-menus
          pnpm run verify:studio-canvas-surfaces

      - name: Build production application
        run: pnpm run build

      - name: Commit verified cleanup
        run: |
          set -euo pipefail
          git add \
            apps/web/src/domains/creator/StudioPixelSelectionHud.test.tsx \
            apps/web/src/domains/creator/studio-main-menu-group-spec.ts \
            apps/web/src/domains/creator/studio-main-menu-items-selection.ts \
            apps/web/src/domains/creator/studio-selection-workbench-integration.test.ts
          git rm -f \
            .github/workflows/studio-selection-contract-cleanup.yml \
            .github/workflows/studio-selection-fix-regressions.yml \
            .github/workflows/studio-selection-workbench-v2.yml \
            scripts/codex-selection-workbench-v2-patch.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(studio): align selection audit and regression contracts"
          git push origin HEAD:feat/studio-selection-contract-cleanup-v2
