name: Studio wearable runtime review
on:
  push:
    branches: [fix/studio-wearable-quality-audit-20260906]
    paths: ['.github/workflows/studio-wearable-runtime-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Build the production components, not mock meshes
        run: |
          mkdir -p .wearable-review
          cat > .wearable-review/entry.ts <<'EOF'
          export * as THREE from 'three';
          export { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
          export { GLTFExporter } from 'three/examples/jsm/exporters/GLTFExporter.js';
          export { RoundedBoxGeometry } from 'three/examples/jsm/geometries/RoundedBoxGeometry.js';
          export { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
          export * as React from 'react';
          export { createRoot } from 'react-dom/client';
          export { Canvas, useFrame, useThree } from '@react-three/fiber';
          export * from '../src/domains/creator/vrm/studio-vrm-wardrobe';
          export * from '../src/domains/creator/vrm/studio-vrm-props';
          export * from '../src/domains/creator/vrm/studio-vrm-prop-rig';
          export * from '../src/domains/creator/vrm/studio-vrm-skinned-garment';
          export * from '../src/domains/creator/vrm/studio-vrm-poser-utils';
          export * from '../src/domains/creator/vrm/studio-vrm-costume-runtime';
          export * from '../src/domains/creator/vrm/StudioVrmWardrobePropsProjection';
          export * from '../src/domains/creator/studio-pose-presets';
          EOF
          node --input-type=module <<'EOF'
          import {build} from 'vite';
          await build({configFile:false,resolve:{alias:{'@':process.cwd()}},build:{outDir:'wearable-runtime-review/runtime',lib:{entry:'.wearable-review/entry.ts',formats:['es'],fileName:()=> 'runtime.mjs'},minify:false,sourcemap:false},define:{'process.env.NODE_ENV':JSON.stringify('production')}});
          EOF
          mkdir -p wearable-runtime-review/vrm
          cp public/vrm/sample.vrm public/vrm/AvatarSample_B.vrm public/vrm/LICENSES.md wearable-runtime-review/vrm/
          cp -r tools/browser-harnesses wearable-runtime-review/
          git rev-parse HEAD > wearable-runtime-review/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wearable-runtime-review-${{ github.sha }}
          path: wearable-runtime-review/
          retention-days: 3
          if-no-files-found: error
