name: Materialize Studio architecture ratchet recovery

on:
  push:
    branches: [fix/studio-architecture-ratchet-recovery-20260910]
    paths: [.github/workflows/studio-architecture-ratchet-recovery-once.yml]

permissions:
  contents: write

concurrency:
  group: studio-architecture-ratchet-recovery-20260910
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/studio-architecture-ratchet-recovery-20260910
          fetch-depth: 1
          persist-credentials: true
      - name: Move Help Center quota probe behind browser-storage runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/domains/creator/StudioHelpCenterDialog.tsx')
          source = path.read_text(encoding='utf-8')
          import_anchor = 'import { getStudioGpuFabricCapabilities } from "./render/studio-gpu-fabric";\n'
          import_line = 'import { studioBrowserStorageEstimator } from "./studio-browser-storage-estimator";\n'
          if import_line not in source:
              if source.count(import_anchor) != 1:
                  raise SystemExit('unexpected GPU import anchor count')
              source = source.replace(import_anchor, import_anchor + import_line, 1)

          old = '''module.estimateStudioOpfsQuota(
              typeof navigator !== "undefined" && navigator.storage?.estimate
                ? { estimate: () => navigator.storage.estimate() }
                : null,
            )'''
          new = 'module.estimateStudioOpfsQuota(studioBrowserStorageEstimator())'
          if old not in source and new not in source:
              raise SystemExit('storage estimator call site not found')
          source = source.replace(old, new, 1)
          if 'navigator.storage' in source:
              raise SystemExit('Help Center still owns navigator.storage')
          path.write_text(source, encoding='utf-8')
          PY
          test "$(wc -l < apps/web/src/domains/creator/studio-router/StudioRouter.tsx)" -le 100
          git diff --check
      - name: Commit source-only recovery and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name toonstudio-ci
          git config user.email actions@users.noreply.github.com
          rm -f .github/workflows/studio-architecture-ratchet-recovery-once.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix(studio): restore architecture ratchets'
          git push origin HEAD:fix/studio-architecture-ratchet-recovery-20260910
