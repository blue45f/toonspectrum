name: One-shot finalize and benchmark all brushes v2

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: brush-quality-finalize-benchmark-v2
  cancel-in-progress: false

jobs:
  finalize-and-benchmark:
    if: >-
      github.event.issue.pull_request
      && github.event.issue.number == 679
      && github.event.comment.body == '/finalize-and-benchmark-all-brushes-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      TARGET_BRANCH: feat/all-brush-long-stroke-quality-election-20260904
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Restore response-aware sources only when needed
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          state=already-present
          if ! grep -q 'responseProfile' src/domains/creator/brush/studio-brush-quality-curation.ts \
            || ! grep -q 'liveFingerprint' src/domains/creator/brush/studio-brush-quality-curation.ts \
            || ! grep -q 'responseProfile' scripts/analyze-studio-brush-similarity.mts; then
            state=restored
            python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          files = (
              (
                  ".github/brush-quality-payloads/curation.ts.gz.b64",
                  "src/domains/creator/brush/studio-brush-quality-curation.ts",
                  "3904f19aeb0ebc9dd951cd4722d195307dce2840b62c210c0bc6ec47f9ab8748",
              ),
              (
                  ".github/brush-quality-payloads/curation.test.ts.gz.b64",
                  "src/domains/creator/brush/studio-brush-quality-curation.test.ts",
                  "6a37d4d3753e5eee800064ed858e10af3e1b794fe72e8fe5c2c661b13d9cc7bb",
              ),
              (
                  ".github/brush-quality-payloads/analyze.mts.gz.b64",
                  "scripts/analyze-studio-brush-similarity.mts",
                  "9b10f1a811bf8f22ea0fcfbcf1e2fbe439126f74ae0f2b55ec9bc3856bfbf479",
              ),
          )
          for payload_path, target_path, expected_sha256 in files:
              payload = Path(payload_path)
              if not payload.exists():
                  raise SystemExit(f"missing required payload: {payload_path}")
              encoded = payload.read_text(encoding="utf-8").strip()
              restored = gzip.decompress(base64.b64decode(encoded))
              actual_sha256 = hashlib.sha256(restored).hexdigest()
              if actual_sha256 != expected_sha256:
                  raise SystemExit(
                      f"{target_path}: sha256 mismatch {actual_sha256} != {expected_sha256}"
                  )
              target = Path(target_path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(restored)
              print(f"restored {target_path} ({len(restored)} bytes)")
          PY
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          git diff --check

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate response-aware quality policy
        run: |
          set -euo pipefail
          pnpm exec vitest run \
            scripts/studio-brush-long-matrix-quality.test.ts \
            src/domains/creator/brush/studio-brush-gpu-quality-election.test.ts \
            src/domains/creator/brush/studio-brush-gpu-quality-evidence.test.ts \
            src/domains/creator/brush/studio-brush-quality-curation.test.ts \
            src/domains/creator/live/studio-live-ink-lane-admission.test.ts
          pnpm exec eslint --max-warnings=0 \
            scripts/run-studio-all-brush-long-stroke-shard.mts \
            scripts/aggregate-studio-all-brush-long-stroke.mts \
            scripts/analyze-studio-brush-similarity.mts \
            scripts/studio-brush-long-matrix-quality.ts \
            scripts/studio-brush-long-matrix-quality.test.ts \
            scripts/verify-studio-long-stroke.mts \
            src/domains/creator/brush/studio-brush-gpu-quality-election.ts \
            src/domains/creator/brush/studio-brush-gpu-quality-election.test.ts \
            src/domains/creator/brush/studio-brush-gpu-quality-evidence.ts \
            src/domains/creator/brush/studio-brush-gpu-quality-evidence.generated.ts \
            src/domains/creator/brush/studio-brush-gpu-quality-evidence.test.ts \
            src/domains/creator/brush/studio-brush-quality-curation.ts \
            src/domains/creator/brush/studio-brush-quality-curation.test.ts \
            src/domains/creator/live/studio-live-ink-lane-admission.ts \
            src/domains/creator/live/studio-live-ink-lane-admission.test.ts
          pnpm exec tsc -p tsconfig.json --noEmit
          git diff --check

      - name: Finalize feature branch and trigger full benchmark
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/brush-quality-payloads
          rm -f \
            .github/workflows/apply-all-brush-quality-v3-macos.yml \
            .github/workflows/export-brush-quality-source-v2.yml \
            .github/workflows/finalize-response-aware-brush-quality.yml \
            .github/workflows/patch-brush-quality-policy.yml \
            scripts/patch-all-brush-quality-v3.py \
            scripts/patch-all-brush-quality-v3b.py
          mkdir -p .github/trigger
          printf 'full all-brush benchmark requested at %s from run %s\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${GITHUB_RUN_ID}" \
            > .github/trigger/all-brush-quality-benchmark.txt
          git config user.name toonstudio-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes; refreshing benchmark trigger."
            printf 'full all-brush benchmark refreshed at %s from run %s\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${GITHUB_RUN_ID}" \
              > .github/trigger/all-brush-quality-benchmark.txt
            git add .github/trigger/all-brush-quality-benchmark.txt
          fi
          git commit -m "test(brush): finalize response-aware policy and run full catalogue"
          git push origin HEAD:${TARGET_BRANCH}
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post success receipt
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            const body = [
              '✅ **Response-aware brush policy finalized and full-catalogue benchmark triggered**',
              '',
              `- feature HEAD: \`${{ steps.publish.outputs.head_sha }}\``,
              `- source state: **${{ steps.restore.outputs.state }}**`,
              '- quality policy: quality gates first; GPU only after measured visual/interaction tie',
              '- curation: committed + live texture + pressure/tilt/speed response signatures',
              '- compatibility: runtime brush IDs remain intact; only evidence-backed exposure quarantine is permitted',
              `- command run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 679,
              body,
            });

      - name: Post failure receipt
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 679,
              body: `❌ Response-aware brush finalization failed. No benchmark election should be trusted from this run. Inspect: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
