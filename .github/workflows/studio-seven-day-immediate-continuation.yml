name: Studio seven-day immediate continuation

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: studio-seven-day-immediate-continuation
  cancel-in-progress: true

jobs:
  continue:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      CAMPAIGN_WORKFLOW: studio-seven-day-campaign.yml
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Continue immediately when a campaign implementation lane becomes free
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PR_BASE_REF" != "main" ]] \
              || [[ "$PR_HEAD_REF" != codex/campaign-* ]] \
              || [[ "$PR_HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
              echo "The closed pull request is not a same-repository campaign slice."
              exit 0
            fi
          fi

          start_at="$(jq -r '.startAt' docs/automation/studio-seven-day-campaign.json)"
          end_at="$(jq -r '.endAt' docs/automation/studio-seven-day-campaign.json)"
          now_epoch="$(date -u +%s)"
          start_epoch="$(date -u -d "$start_at" +%s)"
          end_epoch="$(date -u -d "$end_at" +%s)"

          if [[ "$now_epoch" -lt "$start_epoch" || "$now_epoch" -ge "$end_epoch" ]]; then
            echo "Outside campaign window: ${start_at} .. ${end_at}."
            exit 0
          fi

          open_campaign_prs="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${REPOSITORY}/pulls?state=open&per_page=100" \
              --jq '[.[] | select(.base.ref == "main") | select(.head.repo.full_name == "'"$REPOSITORY"'") | select(.head.ref | startswith("codex/campaign-"))] | length'
          )"
          if [[ "$open_campaign_prs" -gt 0 ]]; then
            echo "Another campaign pull request already owns the implementation lane."
            exit 0
          fi

          runs_json="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${REPOSITORY}/actions/workflows/${CAMPAIGN_WORKFLOW}/runs?per_page=30"
          )"
          active_count="$(
            jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "requested" or .status == "waiting" or .status == "pending")] | length' \
              <<< "$runs_json"
          )"
          if [[ "$active_count" -gt 0 ]]; then
            echo "A campaign cycle is already active; no duplicate continuation is needed."
            exit 0
          fi

          jq -n '{ref: "main", inputs: {mode: "author", force_active: "false"}}' \
            | gh api \
                --method POST \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "repos/${REPOSITORY}/actions/workflows/${CAMPAIGN_WORKFLOW}/dispatches" \
                --input -

          echo "Dispatched the next Studio saturation cycle immediately."
