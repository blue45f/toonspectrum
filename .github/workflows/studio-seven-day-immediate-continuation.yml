name: Studio seven-day immediate continuation
run-name: Studio immediate parallel continuation · ${{ github.run_number }}

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: studio-seven-day-immediate-continuation
  cancel-in-progress: true

jobs:
  continue:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      COORDINATOR_WORKFLOW: studio-seven-day-hourly-trigger.yml
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Refill every free lane after a manual campaign closure
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PR_BASE_REF" != "main" ]] \
              || [[ "$PR_HEAD_REF" != codex/campaign-* ]] \
              || [[ "$PR_HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
              echo "The closed pull request is not a same-repository campaign lane."
              exit 0
            fi
          fi

          start_at="$(jq -r '.startAt' docs/automation/studio-seven-day-campaign.json)"
          end_at="$(jq -r '.endAt' docs/automation/studio-seven-day-campaign.json)"
          now_epoch="$(date -u +%s)"
          start_epoch="$(date -u -d "$start_at" +%s)"
          end_epoch="$(date -u -d "$end_at" +%s)"

          if [[ "$now_epoch" -lt "$start_epoch" || "$now_epoch" -ge "$end_epoch" ]]; then
            echo "Outside campaign window: ${start_at} .. ${end_at}."
            exit 0
          fi

          jq -n '{ref: "main"}' \
            | gh api \
                --method POST \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "repos/${REPOSITORY}/actions/workflows/${COORDINATOR_WORKFLOW}/dispatches" \
                --input -

          echo "Dispatched the parallel coordinator immediately."
