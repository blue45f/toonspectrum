name: Non-studio experience audit

on:
  push:
    branches: ['codex/non-studio-experience-20260913']
    paths:
      - 'tools/audit-non-studio-experience.py'
      - '.github/workflows/non-studio-experience-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: non-studio-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-browser-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps/web/src
            tools
            e2e
            tests
            packages
            .github
          filter: blob:none
      - name: Preserve exact source used for the audit
        run: |
          mkdir -p qa-results/non-studio
          git rev-parse HEAD > qa-results/non-studio/source-sha.txt
          tar -czf /tmp/non-studio-audit-source.tar.gz apps/web/src tools e2e tests packages .github *.json *.ts *.mjs *.yaml *.md
      - uses: actions/upload-artifact@v4
        with:
          name: non-studio-audit-source
          path: /tmp/non-studio-audit-source.tar.gz
          retention-days: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser harness
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Audit public routes without logging in or submitting forms
        run: python tools/audit-non-studio-experience.py
      - name: Preserve browser evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: non-studio-public-browser-evidence
          path: qa-results/non-studio/
          retention-days: 7
          if-no-files-found: error
