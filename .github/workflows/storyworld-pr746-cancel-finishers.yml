name: Finish cancellation of obsolete Storyworld checks

on:
  push:
    branches: [ops/storyworld-pr746-cancel-finishers-20260905]
    paths: [.github/workflows/storyworld-pr746-cancel-finishers.yml]

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  retire-finishers:
    if: github.repository == 'blue45f/toonspectrum'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Retire only obsolete finishers whose core was already cancelled
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = 'https://api.github.com/repos/blue45f/toonspectrum/'
          def request(path, method='GET'):
              req = urllib.request.Request(base + path, method=method, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=10) as response:
                  data = response.read()
                  return json.loads(data) if data else None

          pr = request('pulls/746')
          assert pr['state'] == 'open' and pr['base']['ref'] == 'main'
          assert pr['head']['ref'] == 'feat/storyworld-causality-lab-20260905'
          assert pr['head']['sha'] == 'a40b3c3e6d9e11faefe1719e73cd1bab4dac29bc'
          old = {33948645140: '593b97c77d3428d327ee066875df2d5907b74b4b', 33949223974: 'a8f194ccaf7cc4f68f41b56a60a156bb7b55d60e', 33952621804: 'c5c802e2dccd1fd23fb4a46b1ae020766d391082'}
          for run_id, sha in old.items():
              run = request(f'actions/runs/{run_id}')
              assert run['head_sha'] == sha and sha != pr['head']['sha']
              assert run['head_branch'] == pr['head']['ref'] and run['name'] == 'CI' and run['event'] == 'pull_request'
              assert any(item['number'] == 746 for item in run['pull_requests'])
              if run['status'] == 'completed' or run['run_attempt'] != 1:
                  print(f'{run_id}: terminal or independently retried; left unchanged.')
                  continue
              jobs = request(f'actions/runs/{run_id}/jobs?filter=latest&per_page=100')['jobs']
              assert any(job['name'] == 'core' and job['status'] == 'completed' and job['conclusion'] == 'cancelled' for job in jobs)
              remaining = [job for job in jobs if job['status'] != 'completed']
              assert remaining and all(job['name'] == 'verify' for job in remaining)
              # Standard cancellation was accepted at 08:12 UTC, but always() kept the old
              # post-core guard queued. The current PR head and its real core are excluded.
              try:
                  request(f'actions/runs/{run_id}/force-cancel', 'POST')
                  print(f'{run_id}: force-cancel request accepted for obsolete finisher.')
              except urllib.error.HTTPError as error:
                  if error.code != 409:
                      raise
              for attempt in range(6):
                  run = request(f'actions/runs/{run_id}')
                  if run['status'] == 'completed':
                      break
                  time.sleep(2)
              assert run['status'] == 'completed', f'{run_id}: cancellation not yet complete'
              print(f"{run_id}: confirmed completed / {run['conclusion']}.")
          print('Current-head CI and all other PRs remain untouched. No check was marked successful.')
          PY
