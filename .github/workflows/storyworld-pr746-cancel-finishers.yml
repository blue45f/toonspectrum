name: Inspect Storyworld CI and finish stale cancellation

on:
  push:
    branches: [ops/storyworld-pr746-cancel-finishers-20260905]
    paths: [.github/workflows/storyworld-pr746-cancel-finishers.yml]

permissions:
  contents: read

jobs:
  retire-finishers:
    if: github.repository == 'blue45f/toonspectrum'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Retire only obsolete finishers with an already terminal unsuccessful core
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = 'https://api.github.com/repos/blue45f/toonspectrum/'
          def request(path, method='GET'):
              req = urllib.request.Request(base + path, method=method, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=10) as response:
                  data = response.read()
                  return json.loads(data) if data else None

          pr = request('pulls/746')
          assert pr['state'] == 'open' and pr['base']['ref'] == 'main'
          assert pr['head']['ref'] == 'feat/storyworld-causality-lab-20260905'
          assert pr['head']['sha'] == 'a40b3c3e6d9e11faefe1719e73cd1bab4dac29bc'
          old = {33948645140: '593b97c77d3428d327ee066875df2d5907b74b4b', 33949223974: 'a8f194ccaf7cc4f68f41b56a60a156bb7b55d60e', 33952621804: 'c5c802e2dccd1fd23fb4a46b1ae020766d391082'}
          for run_id, sha in old.items():
              run = request(f'actions/runs/{run_id}')
              assert run['head_sha'] == sha and sha != pr['head']['sha']
              assert run['head_branch'] == pr['head']['ref'] and run['name'] == 'CI' and run['event'] == 'pull_request'
              assert any(item['number'] == 746 for item in run['pull_requests'])
              if run['status'] == 'completed' or run['run_attempt'] != 1:
                  print(f'{run_id}: terminal or independently retried; left unchanged.')
                  continue
              jobs = request(f'actions/runs/{run_id}/jobs?filter=latest&per_page=100')['jobs']
              core = [job for job in jobs if job['name'] == 'core']
              assert len(core) == 1 and core[0]['status'] == 'completed' and core[0]['conclusion'] in ('failure', 'cancelled')
              remaining = [job for job in jobs if job['status'] != 'completed']
              assert remaining and all(job['name'] == 'verify' for job in remaining)
              try:
                  request(f'actions/runs/{run_id}/force-cancel', 'POST')
                  print(f'{run_id}: obsolete always() finisher cancellation accepted; prior core remains unsuccessful.')
              except urllib.error.HTTPError as error:
                  if error.code != 409:
                      raise
              for attempt in range(6):
                  run = request(f'actions/runs/{run_id}')
                  if run['status'] == 'completed':
                      break
                  time.sleep(2)
              print(f"{run_id}: observed {run['status']} / {run['conclusion']}.")
          print('Current-head CI, every other PR, and required-check policy remain untouched.')
          PY

  read-browser-failure:
    if: github.repository == 'blue45f/toonspectrum'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - name: Extract bounded error evidence from the exact PR 746 in-app job
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          base = 'https://api.github.com/repos/blue45f/toonspectrum/'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          job_id = 101271521388
          with urllib.request.urlopen(urllib.request.Request(base + f'actions/jobs/{job_id}', headers=headers), timeout=20) as response:
              job = json.load(response)
          assert job['run_id'] == 33953145676 and job['head_sha'] == 'a40b3c3e6d9e11faefe1719e73cd1bab4dac29bc'
          assert job['name'] == 'studio-inapp-browser' and job['status'] == 'completed'
          print(json.dumps({'jobId': job_id, 'headSha': job['head_sha'], 'conclusion': job['conclusion'], 'steps': job['steps']}, ensure_ascii=False))
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, hdrs, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          try:
              response = opener.open(urllib.request.Request(base + f'actions/jobs/{job_id}/logs', headers=headers), timeout=20)
          except urllib.error.HTTPError as error:
              assert error.code in (301, 302, 303, 307, 308)
              location = error.headers['Location']
              parsed = urllib.parse.urlparse(location)
              assert parsed.scheme == 'https' and parsed.hostname and (parsed.hostname.endswith('.blob.core.windows.net') or parsed.hostname.endswith('.actions.githubusercontent.com') or parsed.hostname.endswith('.githubusercontent.com'))
              # Signed log URL needs no GitHub credential. Never forward authorization.
              response = urllib.request.urlopen(location, timeout=30)
          with response:
              data = response.read(8_000_001)
          assert len(data) <= 8_000_000
          text = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', data.decode('utf-8-sig'))
          lines = text.splitlines()
          indices = set()
          needles = ('hardFailures', 'Hard failures', 'FAILED', 'AssertionError', 'Error:', '##[error]', 'Maximum update', 'pageerror', 'runtimeErrors', 'failedSteps', '"failed"', '"failures"', '[verify-inapp] FAIL')
          for index, line in enumerate(lines):
              if any(needle in line for needle in needles):
                  indices.update(range(max(0, index - 3), min(len(lines), index + 9)))
          selected = '\n'.join(f'{index + 1}: {lines[index]}' for index in sorted(indices))
          print('::group::Exact job error context')
          print(selected[-24000:])
          print('::endgroup::')
          print('Original log line count:', len(lines), '; selected context characters:', len(selected))
          PY
