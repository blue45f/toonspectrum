name: Verify finishing quality release candidate

on:
  push:
    branches: [feat/studio-quality-inspection-20260905]
    paths: [.github/workflows/studio-quality-bundle-finalize.yml]

permissions:
  contents: read
concurrency:
  group: studio-quality-bundle-finalize-737
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/feat/studio-quality-inspection-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=8192
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Admit exact feature head and integrate current main
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/studio-quality-inspection-20260905 | cut -f1)" = "$GITHUB_SHA"
          git config user.name toonstudio-quality-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            git diff --cc
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Co-locate dependency-free document review and timing models
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const ts = require('typescript');
          const files = ['studio-page-review.ts', 'studio-frame-animation-timing.ts'];
          for (const file of files) {
            const path = 'src/domains/creator/' + file;
            const source = ts.createSourceFile(path, fs.readFileSync(path, 'utf8'), ts.ScriptTarget.Latest, true);
            for (const node of source.statements) {
              if (ts.isImportDeclaration(node)) assert.equal(node.importClause?.isTypeOnly, true, path + ' gained a value dependency');
              if (ts.isExportDeclaration(node) && node.moduleSpecifier) assert.equal(node.isTypeOnly, true, path + ' gained a runtime re-export');
            }
          }
          const file = 'vite.config.ts';
          const before = fs.readFileSync(file, 'utf8');
          const anchor = '            || id.endsWith("/src/domains/creator/studio-work-metadata.ts")\n';
          assert.equal(before.split(anchor).length - 1, 1);
          const after = before.replace(anchor, anchor +
            '            || id.endsWith("/src/domains/creator/studio-page-review.ts")\n' +
            '            || id.endsWith("/src/domains/creator/studio-frame-animation-timing.ts")\n').replace(
            '// Work metadata is a dependency-free leaf whose owner set is contained by layers.',
            '// These pure document models have no runtime dependencies. Review status and frame\n' +
            '            // timing are already needed by the editor and reused by the lazy quality inspector;\n' +
            '            // co-locating their sub-KiB bodies avoids separate startup requests without\n' +
            '            // capturing a quality UI, decoder, rendering engine or browser runtime.'
          );
          fs.writeFileSync(file, after);
          const guard = `import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\nimport test from "node:test";\nimport ts from "typescript";\n\nconst leaves = ["studio-page-review.ts", "studio-frame-animation-timing.ts"];\nfor (const name of leaves) {\n  test(name + " remains a dependency-free document chunk leaf", () => {\n    const path = "src/domains/creator/" + name;\n    const source = ts.createSourceFile(path, readFileSync(path, "utf8"), ts.ScriptTarget.Latest, true);\n    for (const node of source.statements) {\n      if (ts.isImportDeclaration(node)) assert.equal(node.importClause?.isTypeOnly, true);\n      if (ts.isExportDeclaration(node) && node.moduleSpecifier) assert.equal(node.isTypeOnly, true);\n    }\n    const config = readFileSync("vite.config.ts", "utf8");\n    const start = config.indexOf('id.endsWith("/src/domains/creator/studio-layers.ts")');\n    const end = config.indexOf('return "studio-document-micro-models";', start);\n    assert.ok(start >= 0 && end > start);\n    assert.ok(config.slice(start, end).includes('/src/domains/creator/' + name));\n  });\n}\n`;
          fs.writeFileSync('scripts/studio-quality-bundle-leaves.test.mjs', guard);
          JS
          pnpm exec eslint --fix scripts/studio-quality-bundle-leaves.test.mjs
          node --test scripts/studio-quality-bundle-leaves.test.mjs
          git diff --check
      - name: Verify quality, review, layer and timing regressions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/quality-candidate"
          pnpm exec vitest run \
            src/domains/creator/studio-quality-inspection.test.ts \
            src/domains/creator/studio-quality-inspection-hardening.test.ts \
            src/domains/creator/studio-quality-raster-inspection.test.ts \
            src/domains/creator/studio-quality-finish-bridge.test.ts \
            src/domains/creator/studio-finish-quality.test.ts \
            src/domains/creator/studio-finish-quality-integration.test.ts \
            src/domains/creator/StudioFinishQualityView.test.tsx \
            src/domains/creator/StudioContinuityPanel.test.tsx \
            src/domains/creator/StudioContinuityPanel.hardening.test.tsx \
            src/domains/creator/StudioLazyPanelStack.test.tsx \
            src/domains/creator/StudioMenubarContent.test.tsx \
            src/domains/creator/studio-review-entry-point-viewports.test.tsx \
            src/domains/creator/StudioToolBeltContent.hints.test.ts \
            src/domains/creator/studio-router/StudioRouteCollaborationGateway.test.tsx \
            src/domains/creator/studio-router/studio-production-command-center-boundary.test.ts \
            src/domains/creator/studio-page-review.test.ts \
            src/domains/creator/studio-layers.test.ts \
            src/domains/creator/studio-frame-animation.test.ts \
            src/domains/creator/studio-adjustment-stack.test.ts \
            src/domains/creator/studio-ux-convergence-boundary.test.ts \
            --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/quality-candidate/tests.log"
      - name: Publish product-only patch through normal hooks
        id: publish
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/studio-quality-inspection-20260905 | cut -f1)" = "$GITHUB_SHA"
          rm .github/workflows/studio-quality-bundle-finalize.yml
          git add -A
          git diff --cached --check
          git commit -m 'perf(studio): co-locate pure finishing review models without increasing budgets'
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:feat/studio-quality-inspection-20260905
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > "$RUNNER_TEMP/quality-candidate/product-sha.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/quality-candidate
          retention-days: 7

  strict-lint:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full architecture and zero-warning lint
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/quality-static"
          pnpm run validate:architecture 2>&1 | tee "$RUNNER_TEMP/quality-static/architecture.log"
          pnpm run lint:strict 2>&1 | tee "$RUNNER_TEMP/quality-static/lint.log"
          node --test scripts/studio-quality-bundle-leaves.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-static-${{ github.run_id }}
          path: ${{ runner.temp }}/quality-static
          retention-days: 7

  build-and-browser:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build frontend and check API types, notices and CSP
        id: build
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/quality-build"
          pnpm --filter @webtoon-nest/api run typecheck 2>&1 | tee "$RUNNER_TEMP/quality-build/api-types.log"
          pnpm run build 2>&1 | tee "$RUNNER_TEMP/quality-build/build.log"
      - name: Enforce unchanged Studio bundle ratchet
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          cp dist/.vite/manifest.json "$RUNNER_TEMP/quality-build/manifest.json"
          pnpm run check:studio-bundle 2>&1 | tee "$RUNNER_TEMP/quality-build/bundle.log"
      - name: Install Chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify real production menus and export entry points
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          pnpm run verify:studio-menus 2>&1 | tee "$RUNNER_TEMP/quality-build/menus.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-build-${{ github.run_id }}
          path: ${{ runner.temp }}/quality-build
          retention-days: 7

# No status-writing, PR approval, protection updates or automatic main merge.
