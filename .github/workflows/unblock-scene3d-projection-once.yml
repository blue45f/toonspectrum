name: Unblock Scene3D projection once

on:
  push:
    branches: [feat/scene3d-runtime-projection-20260910]
    paths: [.github/workflows/unblock-scene3d-projection-once.yml]

permissions:
  contents: write

jobs:
  unblock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/scene3d-runtime-projection-20260910
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          sed -i 's/runs-on: ubuntu-24.04-arm/runs-on: ubuntu-latest/' .github/workflows/scene3d-projection-bootstrap.yml
          git config user.name toonstudio-3d-ci
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/unblock-scene3d-projection-once.yml
          git add .github/workflows/scene3d-projection-bootstrap.yml
          git commit -m 'ci: move Scene3D projection bootstrap to standard runner'
          git push origin HEAD:feat/scene3d-runtime-projection-20260910
