name: Studio Hyper3D live acceptance v2

on:
  push:
    branches:
      - codex/studio-large-epics-closure-20260909
    paths:
      - .github/workflows/studio-hyper3d-live-acceptance-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-hyper3d-live-acceptance
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      HYPER3D_API_KEY: ${{ secrets.HYPER3D_API_KEY || secrets.RODIN_API_KEY || secrets.HYPER3D_RODIN_API_KEY || secrets.STUDIO_HYPER3D_API_KEY || secrets.STUDIO_RODIN_API_KEY || secrets.HYPER3D_KEY || secrets.RODIN_KEY }}
      STUDIO_HYPER3D_LIVE_OUTPUT: artifacts/studio-hyper3d-live
      STATUS_FILE: docs/automation/studio-hyper3d-live-acceptance.json
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reuse an already merged green receipt
        id: receipt
        shell: bash
        run: |
          if node -e 'const fs=require("fs"); const p=process.env.STATUS_FILE; if(!fs.existsSync(p)) process.exit(1); const r=JSON.parse(fs.readFileSync(p,"utf8")); process.exit(r.passed===true?0:1)'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A green live acceptance receipt already exists."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require an available Hyper3D/Rodin credential
        if: steps.receipt.outputs.skip != 'true'
        run: |
          if [ -z "${HYPER3D_API_KEY:-}" ]; then
            echo "No recognized Hyper3D/Rodin repository secret is configured." >&2
            exit 78
          fi

      - uses: pnpm/action-setup@v4
        if: steps.receipt.outputs.skip != 'true'
        with:
          version: 11.4.0
          run_install: false

      - uses: actions/setup-node@v6
        if: steps.receipt.outputs.skip != 'true'
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install locked dependencies
        if: steps.receipt.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Submit one minimal live Rodin generation
        if: steps.receipt.outputs.skip != 'true'
        run: pnpm exec tsx scripts/verify-studio-hyper3d-live-smoke.mts

      - name: Install Blender
        if: steps.receipt.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender

      - name: Apply a packed texture and re-import the generated GLB
        if: steps.receipt.outputs.skip != 'true'
        run: |
          blender --background --factory-startup \
            --python scripts/blender/studio-generated-model-texture-roundtrip.py -- \
            --input artifacts/studio-hyper3d-live/generated.glb \
            --output artifacts/studio-hyper3d-live/generated-painted-roundtrip.glb \
            --receipt artifacts/studio-hyper3d-live/blender-roundtrip.json

      - name: Validate GLB headers and prepare a non-secret receipt
        if: steps.receipt.outputs.skip != 'true'
        run: |
          mkdir -p "$(dirname "$STATUS_FILE")"
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const glbs = [
            'artifacts/studio-hyper3d-live/generated.glb',
            'artifacts/studio-hyper3d-live/generated-painted-roundtrip.glb',
          ];
          const verified = glbs.map((file) => {
            const bytes = fs.readFileSync(file);
            if (bytes.length < 20 || bytes.toString('ascii', 0, 4) !== 'glTF') {
              throw new Error(`${file} is not GLB`);
            }
            if (bytes.readUInt32LE(4) !== 2 || bytes.readUInt32LE(8) !== bytes.length) {
              throw new Error(`${file} has an invalid GLB header`);
            }
            return {
              filename: file.split('/').at(-1),
              byteLength: bytes.length,
              sha256: crypto.createHash('sha256').update(bytes).digest('hex'),
            };
          });
          const hyper3d = JSON.parse(fs.readFileSync('artifacts/studio-hyper3d-live/receipt.json', 'utf8'));
          const blender = JSON.parse(fs.readFileSync('artifacts/studio-hyper3d-live/blender-roundtrip.json', 'utf8'));
          fs.writeFileSync(process.env.STATUS_FILE, JSON.stringify({
            schemaVersion: 2,
            passed: true,
            runId: process.env.GITHUB_RUN_ID,
            headSha: process.env.GITHUB_SHA,
            completedAt: new Date().toISOString(),
            hyper3d: {
              provider: hyper3d.provider,
              requestIdHash: hyper3d.requestIdHash,
              promptHash: hyper3d.promptHash,
              pollCount: hyper3d.pollCount,
              model: hyper3d.model,
            },
            blender,
            verifiedGlbs: verified,
          }, null, 2) + '\n');
          NODE

      - name: Commit the green receipt with conflict-safe retries
        if: steps.receipt.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATUS_FILE"
          git commit -m "test(studio): record live Hyper3D and Blender acceptance [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            if git rebase "origin/$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME"; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 6))
          done
          exit 1

      - name: Upload short-lived private evidence
        if: always() && steps.receipt.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: studio-hyper3d-live-v2-${{ github.run_id }}
          path: artifacts/studio-hyper3d-live
          if-no-files-found: warn
          retention-days: 7
