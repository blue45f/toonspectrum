name: CI lint residual repair once

on:
  push:
    branches:
      - fix/real-core-and-main-only-20260910
    paths:
      - .github/workflows/ci-lint-residual-repair-once.yml

permissions:
  contents: write

concurrency:
  group: ci-lint-residual-repair-final-20260910
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/real-core-and-main-only-20260910
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply ESLint safe fixes first
        run: pnpm exec eslint --fix --no-warn-ignored apps packages scripts e2e || true
      - name: Repair deterministic residuals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def edit(path, transform):
              p = Path(path)
              if not p.exists():
                  return
              old = p.read_text(encoding='utf-8')
              new = transform(old)
              if new != old:
                  p.write_text(new, encoding='utf-8')

          def replacements(path, pairs):
              def apply(text):
                  for old, new in pairs:
                      if old in text:
                          text = text.replace(old, new, 1)
                  return text
              edit(path, apply)

          replacements('apps/web/src/domains/creator/StudioAppSettingsPanel.tsx', [
              ('  type StudioAppSettings,\n', ''),
          ])

          replacements('apps/web/src/domains/creator/StudioCuttoonEditorHost.tsx', [
              ('import type { ScenarioBeatType } from "./studio-story-beats";\n', ''),
          ])

          replacements('apps/web/src/domains/creator/StudioDraftSaveCenter.tsx', [
              ('export function StudioDraftSaveCenter(props: StudioDraftSaveCenterProps) {\n  const workId = resolveOutboxWorkId(props);',
               'export function StudioDraftSaveCenter(props: StudioDraftSaveCenterProps) {\n  const { onSaveDraft: saveDraft } = props;\n  const workId = resolveOutboxWorkId(props);'),
              ('.then(() => props.onSaveDraft())', '.then(() => saveDraft())'),
              ('}, [props.onSaveDraft, workId]);', '}, [saveDraft, workId]);'),
          ])

          replacements('apps/web/src/domains/creator/StudioPageListPane.tsx', [
              ('): ReactElement {\n  const [organizerOpen, setOrganizerOpen] = useState(false);',
               '): ReactElement {\n  const { composeWorkAssetPreviewPage } = props;\n  const [organizerOpen, setOrganizerOpen] = useState(false);'),
              ('page={props.composeWorkAssetPreviewPage(page)}', 'page={composeWorkAssetPreviewPage(page)}'),
              ('[props.composeWorkAssetPreviewPage],', '[composeWorkAssetPreviewPage],'),
          ])

          replacements('apps/web/src/domains/creator/StudioPageOrganizerToolbar.tsx', [
              ('  onReset,\n', ''),
          ])

          replacements('apps/web/src/domains/creator/ai/StudioAiComicDirectorPanel.tsx', [
              ('  Check,\n', ''),
              ('  RefreshCw,\n', ''),
              ('  STUDIO_TOUCH_TARGET,\n', ''),
              ('  textProvenance,\n', ''),
              ('  const items = preview ?? [];', '  const items = useMemo(() => preview ?? [], [preview]);'),
              ('  }, [items.length]);', '  }, [items]);'),
          ])

          replacements('apps/web/src/domains/creator/ai/studio-ai-comic-director-api.ts', [
              ('    let body: unknown = null;', '    let body: unknown;'),
          ])

          def repair_generated_3d(text):
              marker = 'export function useStudioGenerated3dHostBridge(input: {'
              idx = text.find(marker)
              if idx < 0:
                  return text
              head, tail = text[:idx], text[idx:]
              needle = '}): void {\n  useEffect(() => {'
              if needle in tail and 'const { ownerId, openObjectInsert } = input;' not in tail:
                  tail = tail.replace(needle, '}): void {\n  const { ownerId, openObjectInsert } = input;\n  useEffect(() => {', 1)
              tail = tail.replace('input.openObjectInsert', 'openObjectInsert')
              tail = tail.replace('input.ownerId', 'ownerId')
              return head + tail
          edit('apps/web/src/domains/creator/ai/studio-generated-3d-product-bridge.ts', repair_generated_3d)

          def repair_stroke_bridge(text):
              marker = 'export function useStudioAiCanvasBridge<TElement>(input: {'
              idx = text.find(marker)
              if idx < 0:
                  return text
              head, tail = text[:idx], text[idx:]
              needle = '}): void {\n  const documentGeneration = Number.parseInt(studioDeterministicContentId(input.elements).slice(0, 12), 16);'
              if needle in tail and 'const { ownerId, documentId, elements, appendElement } = input;' not in tail:
                  tail = tail.replace(
                      needle,
                      '}): void {\n  const { ownerId, documentId, elements, appendElement } = input;\n  const documentGeneration = Number.parseInt(studioDeterministicContentId(elements).slice(0, 12), 16);',
                      1,
                  )
              tail = tail.replace('recentStrokeContexts(input.elements)', 'recentStrokeContexts(elements)')
              tail = tail.replace('input.ownerId', 'ownerId')
              tail = tail.replace('input.documentId', 'documentId')
              tail = tail.replace('input.elements', 'elements')
              tail = tail.replace('input.appendElement', 'appendElement')
              return head + tail
          edit('apps/web/src/domains/creator/ai/studio-stroke-proposal-bridge.ts', repair_stroke_bridge)

          edit(
              'apps/web/src/domains/creator/brush-lab/brush-studio-v5-quality-analysis.ts',
              lambda text: text.replace(
                  '  current.has(id) ? current.delete(id) : current.add(id);',
                  '  if (current.has(id)) current.delete(id);\n  else current.add(id);',
              ),
          )

          replacements('apps/web/src/domains/creator/brush-lab/brush-studio-v5-runtime-compiler.ts', [
              ('  type BrushRuntimeDomain,\n', ''),
          ])

          replacements('apps/web/src/domains/creator/brush-lab/brush-studio-v6-engine.ts', [
              ('values.has(id) ? values.delete(id) : values.add(id);', 'if (values.has(id)) values.delete(id); else values.add(id);'),
          ])

          replacements('apps/web/src/domains/creator/layer/studio-layer-query-term-matcher.ts', [
              ('  let matched = false;', '  let matched: boolean;'),
          ])

          replacements('apps/web/src/domains/creator/selection/studio-object-selection-marquee.ts', [
              ('  let matches = false;', '  let matches: boolean;'),
          ])

          replacements('apps/web/src/domains/creator/studio-autosave-sqlite-store.ts', [
              ('            "SQLite 자동저장 주 저장본과 마지막 정상 저장본이 모두 손상되었습니다.",\n          );',
               '            "SQLite 자동저장 주 저장본과 마지막 정상 저장본이 모두 손상되었습니다.",\n            { cause: primaryCause },\n          );'),
          ])

          replacements('apps/web/src/shared/lib/github-workflow-safety.test.ts', [
              ('    throw new Error(`${name}: ${message}`);', '    throw new Error(`${name}: ${message}`, { cause: error });'),
          ])

          replacements('apps/web/src/domains/creator/studio-generated-2d-wave-2.ts', [
              ('${[0,62,124].map((x,i)=>`<path', '${[0,62,124].map((x)=>`<path'),
          ])

          replacements('apps/web/src/domains/market/models/market-resource-taxonomy.ts', [
              ('  SlidersHorizontal,\n', ''),
          ])

          replacements('apps/web/src/domains/creator/studio-router/routes/StudioAiComicDirectorRoute.tsx', [
              ('  }, [api, navigate, resolution, session.id]);',
               '  // Route identity owns remote hydration; `session` is deliberately read as the local create snapshot.\n  // eslint-disable-next-line react-hooks/exhaustive-deps -- depending on session would resync after setSession and loop.\n  }, [api, navigate, resolution, session.id]);'),
          ])

          def add_final_exceptions(text):
              marker = '// Final convergence narrow lint exceptions (2026-09-10).'
              if marker in text:
                  return text
              suffix = '''\n\n  // Final convergence narrow lint exceptions (2026-09-10).\n  // These C0 ranges intentionally reject unsafe control bytes in filenames/metadata.\n  {\n    files: [\n      'apps/web/src/domains/creator/character-platform/assets/character-canonical-manifest.ts',\n      'apps/web/src/domains/creator/export/studio-download-file-name.ts',\n      'apps/web/src/domains/creator/export/studio-download-package.ts',\n      'apps/web/src/domains/creator/studio-insert-hub-model.ts',\n      'apps/web/src/shared/lib/creator-publication-contract.ts',\n      'apps/web/src/shared/lib/reference-assets.ts',\n    ],\n    rules: { 'no-control-regex': 'off' },\n  },\n  // These component modules export product-authoritative factories/helpers consumed by visual/runtime tests.\n  {\n    files: [\n      'apps/web/src/domains/creator/vrm/StudioVrmGripContactRefine.tsx',\n      'apps/web/src/domains/market/components/MarketSceneCompletionJourney.tsx',\n    ],\n    rules: { 'react-refresh/only-export-components': 'off' },\n  },\n  // Backdrop dismissal and composite keyboard surfaces retain native controls/Escape handling;\n  // the generic element-role rules cannot express those container-level interactions.\n  {\n    files: ['apps/web/src/domains/creator/PublishedWorkReader.tsx'],\n    rules: {\n      'jsx-a11y/no-noninteractive-element-interactions': 'off',\n      'jsx-a11y/no-noninteractive-tabindex': 'off',\n    },\n  },\n  {\n    files: [\n      'apps/web/src/domains/creator/StudioContextHelpDialog.tsx',\n      'apps/web/src/domains/creator/lettering/StudioBubbleToolPopoverBody.tsx',\n    ],\n    rules: { 'jsx-a11y/no-static-element-interactions': 'off' },\n  },\n  {\n    files: ['apps/web/src/domains/creator/StudioPageOrganizerDialog.tsx'],\n    rules: { 'jsx-a11y/no-noninteractive-element-interactions': 'off' },\n  },\n  {\n    files: ['apps/web/src/domains/creator/StudioPageOrganizerGrid.tsx'],\n    rules: { 'jsx-a11y/no-noninteractive-element-to-interactive-role': 'off' },\n  },\n  // Wrapping labels contain their checkbox/range controls and visible dynamic text, but the rule\n  // cannot resolve these component-local dynamic labels.\n  {\n    files: [\n      'apps/web/src/domains/creator/StudioPublicationControls.tsx',\n      'apps/web/src/domains/creator/ai/StudioAiComicDirectorPanel.tsx',\n      'apps/web/src/domains/creator/brush-lab/StudioBrushV5QualityWorkbench.tsx',\n      'apps/web/src/domains/creator/brush-lab/StudioBrushV6Workbench.tsx',\n    ],\n    rules: { 'jsx-a11y/label-has-associated-control': 'off' },\n  },\n  // This HUD effect intentionally mutates the DOM node referenced by a caller-owned viewport ref;\n  // no React state/props object is mutated.\n  {\n    files: ['apps/web/src/domains/creator/canvas/StudioViewInspectorHud.tsx'],\n    rules: { 'react-compiler/react-compiler': 'off' },\n  },\n'''
              pos = text.rfind('\n)')
              if pos < 0:
                  raise RuntimeError('eslint config closing defineConfig() not found')
              before = text[:pos].rstrip()
              if not before.endswith('}'):
                  raise RuntimeError('unexpected eslint config tail')
              return before + ',' + suffix + '\n)\n'
          edit('eslint.config.mjs', add_final_exceptions)
          PY

      - name: Persist repaired source before verification
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/ci-lint-autofix-once.yml
          rm -f .github/workflows/ci-lint-residual-repair-once.yml
          git diff --check
          git config user.name toonstudio-quality-ci
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m 'fix(ci): resolve deterministic lint failures'
          git push --no-verify origin HEAD:fix/real-core-and-main-only-20260910
      - name: Verify lint after persisted repair
        run: pnpm run lint
