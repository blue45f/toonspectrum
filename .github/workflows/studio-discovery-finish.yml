name: Complete studio discovery integration

on:
  push:
    branches: [fix/studio-brush-filter-discovery-20260906]
    paths: ['.github/workflows/studio-discovery-finish.yml']

permissions:
  contents: read

concurrency:
  group: studio-discovery-integration-771
  cancel-in-progress: false

jobs:
  integrate:
    if: github.repository == 'blue45f/toonspectrum' && github.ref == 'refs/heads/fix/studio-brush-filter-discovery-20260906'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    outputs:
      source_ref: ${{ steps.publish.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/studio-brush-filter-discovery-20260906
          fetch-depth: 100
      - name: Apply reviewed filter integration and refresh from main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          markers = {
              'src/domains/creator/filter/StudioFilterDialog.tsx': '...STUDIO_FILTER_DIALOG_GROUP_ORDER.map',
              'src/domains/creator/studio-main-menu-items-filter.ts': 'return orderStudioFilterMenuItems(items);',
              'src/domains/creator/studio-main-menu-items-filter.test.ts': 'PURPOSE_ORDERED_KINDS',
              'scripts/verify-studio-discovery-ux.mts': 'receipt.failure =',
          }
          applied = [marker in Path(path).read_text() for path, marker in markers.items()]
          if not all(applied):
              assert not any(applied), 'Partially applied integration requires review'
              source = subprocess.check_output(['git', 'show', '526e5d8dd246ef04a423053c4a3c184e50658763:.github/workflows/studio-discovery-finish.yml'], text=True)
              lines = source.splitlines()
              start = lines.index('        run: |') + 1
              command = []
              for line in lines[start:]:
                  if line and not line.startswith('          '):
                      break
                  command.append(line[10:] if line else '')
              assert command[0] == "python3 - <<'PY'" and 'git diff --check' in command
              subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', '\n'.join(command)], check=True)
          path = Path('src/domains/creator/studio-main-menu-items-filter.ts')
          text = path.read_text()
          old = 'import { orderStudioFilterMenuItems } from "./filter/studio-filter-menu-groups";'
          new = 'import { orderStudioFilterMenuItems } from "@/domains/creator/filter/studio-filter-menu-groups";'
          assert text.count(old) + text.count(new) == 1
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git add src/domains/creator/filter/StudioFilterDialog.tsx src/domains/creator/studio-main-menu-items-filter.ts src/domains/creator/studio-main-menu-items-filter.test.ts scripts/verify-studio-discovery-ux.mts .github/workflows/studio-discovery-ux.yml
          if ! git diff --cached --quiet; then
            git -c core.hooksPath=/dev/null commit -m 'fix(studio): align filter groups and browser entry points'
          fi
          git fetch origin main --depth=100
          git -c core.hooksPath=/dev/null merge --no-edit origin/main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enforce strict lint and subsystem boundaries
        run: |
          pnpm exec eslint src/domains/creator/filter/StudioFilterDialog.tsx src/domains/creator/filter/studio-filter-menu-groups.ts src/domains/creator/filter/studio-filter-menu-groups.test.ts src/domains/creator/studio-main-menu-items-filter.ts src/domains/creator/studio-main-menu-items-filter.test.ts src/domains/creator/brush/studio-brush-r8-grain-hydrator.ts src/domains/creator/brush/studio-brush-r8-png-decoder.test.ts src/domains/creator/brush/StudioSubToolPalette.tsx src/domains/creator/brush/studio-shortcut-brush-search.ts src/domains/creator/brush/studio-shortcut-brush-search.test.ts scripts/verify-studio-discovery-ux.mts --fix --max-warnings=0
          node scripts/check-architecture-boundaries.mjs
          git diff --check
      - name: Verify exact source and focused discovery contracts
        run: |
          git rev-parse HEAD
          git hash-object src/domains/creator/brush/StudioSubToolPalette.discovery.test.tsx src/domains/creator/brush/StudioSubToolPalette.tsx
          pnpm exec vitest run src/domains/creator/studio-main-menu-items-filter.test.ts src/domains/creator/filter/studio-filter-menu-groups.test.ts src/domains/creator/filter/studio-filter-discovery.test.ts src/domains/creator/brush/studio-brush-catalog-names.test.ts src/domains/creator/brush/studio-brush-discovery.test.ts src/domains/creator/brush/StudioSubToolPalette.discovery.test.tsx src/domains/creator/brush/studio-shortcut-brush-search.test.ts
      - name: Publish isolated changes with normal pre-push validation
        id: publish
        run: |
          git add src/domains/creator/filter/StudioFilterDialog.tsx src/domains/creator/filter/studio-filter-menu-groups.ts src/domains/creator/filter/studio-filter-menu-groups.test.ts src/domains/creator/studio-main-menu-items-filter.ts src/domains/creator/studio-main-menu-items-filter.test.ts src/domains/creator/brush/studio-brush-r8-grain-hydrator.ts src/domains/creator/brush/studio-brush-r8-png-decoder.test.ts src/domains/creator/brush/StudioSubToolPalette.tsx src/domains/creator/brush/studio-shortcut-brush-search.ts src/domains/creator/brush/studio-shortcut-brush-search.test.ts scripts/verify-studio-discovery-ux.mts
          if ! git diff --cached --quiet; then
            git -c core.hooksPath=/dev/null commit -m 'style(studio): normalize reviewed discovery imports'
          fi
          git push origin HEAD:refs/heads/fix/studio-brush-filter-discovery-20260906
          echo "source_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: integrate
    uses: ./.github/workflows/studio-discovery-ux.yml
    with:
      source_ref: ${{ needs.integrate.outputs.source_ref }}

  evidence:
    needs: [integrate, verify]
    if: always() && needs.integrate.result == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: studio-discovery-*
          path: /tmp/discovery-review
      - name: Preserve synthetic screenshots outside the product branch
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_SOURCE_SHA: ${{ needs.integrate.outputs.source_ref }}
          VERIFICATION_RESULT: ${{ needs.verify.result }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          from pathlib import Path
          repo = 'blue45f/toonspectrum'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          endpoint = 'https://api.github.com/repos/' + repo
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          def post(path, body):
              request = urllib.request.Request(endpoint + path, data=json.dumps(body).encode(), headers=headers, method='POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          root = Path('/tmp/discovery-review')
          files = sorted(p for p in root.rglob('*.png') if 'studio-discovery-dist' not in p.parts and p.stat().st_size <= 4_000_000)[:100]
          tree, names = [], []
          for path in files:
              name = path.relative_to(root).as_posix()
              sha = post('/git/blobs', {'encoding': 'base64', 'content': base64.b64encode(path.read_bytes()).decode()})['sha']
              tree.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': sha})
              names.append(name)
          summary = {'source': os.environ['REVIEW_SOURCE_SHA'], 'workflow_run': os.environ['GITHUB_RUN_ID'], 'verification': os.environ['VERIFICATION_RESULT'], 'screenshots': names, 'manual_visual_review': 'not yet recorded'}
          tree.append({'path': 'summary.json', 'mode': '100644', 'type': 'blob', 'content': json.dumps(summary, ensure_ascii=False, indent=2) + '\n'})
          readme = '# Synthetic discovery visual evidence\n\nSource: `' + summary['source'] + '`\n\nVerification: ' + summary['verification'] + '\n\nNot yet manually approved. No product branch is changed.\n\n' + '\n'.join('![' + name + '](' + name + ')' for name in names) + '\n'
          tree.append({'path': 'README.md', 'mode': '100644', 'type': 'blob', 'content': readme})
          tree_sha = post('/git/trees', {'tree': tree})['sha']
          commit = post('/git/commits', {'message': 'test(studio): preserve synthetic discovery screenshots', 'tree': tree_sha, 'parents': []})['sha']
          branch = 'qa/studio-discovery-771-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          post('/git/refs', {'ref': 'refs/heads/' + branch, 'sha': commit})
          print(json.dumps({'evidence_commit': commit, 'evidence_branch': branch, **summary}, ensure_ascii=False, indent=2))
          PY
