name: Complete studio discovery integration

on:
  push:
    branches: [fix/studio-brush-filter-discovery-20260906]
    paths: ['.github/workflows/studio-discovery-finish.yml']

permissions:
  contents: read

concurrency:
  group: studio-discovery-integration-771
  cancel-in-progress: true

jobs:
  integrate-and-verify:
    if: github.repository == 'blue45f/toonspectrum' && github.ref == 'refs/heads/fix/studio-brush-filter-discovery-20260906'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      STUDIO_DISCOVERY_QA_DIR: /tmp/studio-discovery-evidence
      TOONSPECTRUM_BRUSH_VERIFY_DIR: /tmp/studio-discovery-evidence
      TOONSPECTRUM_VERIFY_DIR: /tmp/studio-discovery-evidence
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 100
      - name: Apply reviewed filter integration against original Git blobs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          markers = {
              'src/domains/creator/filter/StudioFilterDialog.tsx': '...STUDIO_FILTER_DIALOG_GROUP_ORDER.map',
              'src/domains/creator/studio-main-menu-items-filter.ts': 'return orderStudioFilterMenuItems(items);',
              'src/domains/creator/studio-main-menu-items-filter.test.ts': 'PURPOSE_ORDERED_KINDS',
              'scripts/verify-studio-discovery-ux.mts': 'receipt.failure =',
          }
          applied = [marker in Path(path).read_text() for path, marker in markers.items()]
          if not all(applied):
              assert not any(applied), 'Partially applied integration requires review'
              source = subprocess.check_output(['git', 'show', '526e5d8dd246ef04a423053c4a3c184e50658763:.github/workflows/studio-discovery-finish.yml'], text=True)
              lines = source.splitlines()
              start = lines.index('        run: |') + 1
              command = []
              for line in lines[start:]:
                  if line and not line.startswith('          '):
                      break
                  command.append(line[10:] if line else '')
              assert command[0] == "python3 - <<'PY'" and 'git diff --check' in command
              subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', '\n'.join(command)], check=True)
          path = Path('src/domains/creator/studio-main-menu-items-filter.ts')
          text = path.read_text()
          old = 'import { orderStudioFilterMenuItems } from "./filter/studio-filter-menu-groups";'
          new = 'import { orderStudioFilterMenuItems } from "@/domains/creator/filter/studio-filter-menu-groups";'
          assert text.count(old) + text.count(new) == 1
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git add src/domains/creator/filter/StudioFilterDialog.tsx src/domains/creator/studio-main-menu-items-filter.ts src/domains/creator/studio-main-menu-items-filter.test.ts scripts/verify-studio-discovery-ux.mts .github/workflows/studio-discovery-ux.yml
          if ! git diff --cached --quiet; then
            git -c core.hooksPath=/dev/null commit -m 'fix(studio): align filter groups and browser entry points'
          fi
          git fetch origin main --depth=100
          git -c core.hooksPath=/dev/null merge --no-edit origin/main
      - name: Resolve observed integration regressions without weakening functional assertions
        run: |
          mkdir -p /tmp/studio-discovery-evidence
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          p = Path('src/domains/creator/brush/StudioSubToolPalette.tsx')
          original = p.read_text()
          print('Palette input blob:', subprocess.check_output(['git', 'hash-object', str(p)], text=True).strip())
          text, braces = re.subn(r'\n}\s*}\s*$', '\n}\n', original, count=1)
          start = text.index('  const currentTools = searching\n')
          end = text.index('  const tabStopId = ', start)
          old_block = text[start:end]
          assert 'allTools' in old_block and 'category?.tools' in old_block
          assert 'matchesStudioToolSearch' in old_block or 'searchStudioShortcutBrushes' in old_block
          text = text[:start] + '  const currentTools = searching\n    ? searchStudioShortcutBrushes(allTools, query)\n    : (category?.tools ?? []);\n' + text[end:]
          old_import = 'import { matchesStudioToolSearch, studioToolSearchTerms } from "../studio-tool-search";'
          text = text.replace(old_import, 'import { studioToolSearchTerms } from "../studio-tool-search";')
          helper_import = 'import { searchStudioShortcutBrushes } from "./studio-shortcut-brush-search";'
          if helper_import not in text:
              parent_import = 'import { studioToolSearchTerms } from "../studio-tool-search";'
              assert text.count(parent_import) == 1
              text = text.replace(parent_import, parent_import + '\n\n' + helper_import)
          assert text.count(helper_import) == 1
          assert text.count('searchStudioShortcutBrushes(allTools, query)') == 1
          assert 'matchesStudioToolSearch' not in text
          p.write_text(text)
          print('Duplicate trailing braces corrected:', braces)
          print('Palette search now explicitly invokes the canonical helper')
          p = Path('src/domains/creator/brush/studio-brush-discovery.test.ts')
          text = p.read_text()
          wrong_order_contract = 'expect(displayedIds).toEqual(beforeIds);'
          inventory_contract = 'expect([...displayedIds].sort()).toEqual([...beforeIds].sort());'
          assert text.count(wrong_order_contract) <= 1
          if wrong_order_contract in text:
              text = text.replace(wrong_order_contract, '// Registry inventory and purpose-sorted presentation have intentionally different order.\n    ' + inventory_contract)
              assert 'expect(new Set(displayedIds).size).toBe(beforeIds.length);' in text
              p.write_text(text)
              print('ID preservation: compare the entire inventory, retain uniqueness/count and curated-set assertions')
          else:
              assert inventory_contract in text or 'displayedIds' not in text
              print('This source does not contain the obsolete inventory-order assertion')
          assert Path('src/domains/creator/brush/studio-shortcut-order.test.ts').is_file()
          assert Path('src/domains/creator/brush/studio-shortcut-brush-search-purpose.test.ts').is_file()
          PY
          git diff --check
          git diff -- src/domains/creator/brush/StudioSubToolPalette.tsx src/domains/creator/brush/studio-brush-discovery.test.ts
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enforce strict lint on reviewed source
        run: |
          pnpm exec eslint src/domains/creator/filter/StudioFilterDialog.tsx src/domains/creator/filter/studio-filter-menu-groups.ts src/domains/creator/filter/studio-filter-menu-groups.test.ts src/domains/creator/studio-main-menu-items-filter.ts src/domains/creator/studio-main-menu-items-filter.test.ts src/domains/creator/brush/studio-brush-r8-grain-hydrator.ts src/domains/creator/brush/studio-brush-r8-png-decoder.test.ts src/domains/creator/brush/StudioSubToolPalette.tsx src/domains/creator/brush/studio-brush-discovery.test.ts src/domains/creator/brush/studio-shortcut-brush-search.ts src/domains/creator/brush/studio-shortcut-brush-search.test.ts src/domains/creator/brush/studio-shortcut-brush-search-purpose.test.ts src/domains/creator/brush/studio-shortcut-order.test.ts scripts/verify-studio-discovery-ux.mts --fix --max-warnings=0
          git diff --check
      - name: Repository architecture rules
        run: pnpm run validate:architecture
      - name: All brush and filter regression tests and menu integration
        run: pnpm exec vitest run src/domains/creator/brush src/domains/creator/filter src/domains/creator/studio-tool-search.test.ts src/domains/creator/studio-basic-brush-expansion.test.ts src/domains/creator/StudioUnifiedBrushPicker.test.tsx src/domains/creator/studio-main-menu-items-filter.test.ts --reporter=default --reporter=json --outputFile.json=/tmp/studio-discovery-evidence/unit-tests.json
      - name: Frontend typecheck
        run: pnpm exec tsc -p tsconfig.json --noEmit
      - name: Strict complete brush and filter lint
        run: pnpm exec eslint src/domains/creator/brush src/domains/creator/filter src/domains/creator/studio-tool-search* src/domains/creator/studio-brush.ts src/domains/creator/studio-creative-ux.ts src/domains/creator/studio-basic-brush-expansion.test.ts src/domains/creator/StudioUnifiedBrushPicker.test.tsx src/domains/creator/studio-main-menu-items-filter.ts src/domains/creator/studio-main-menu-items-filter.test.ts scripts/verify-studio-discovery-ux.mts --max-warnings=0
      - name: Publish tested integration only to this PR branch
        run: |
          git add src/domains/creator/filter/StudioFilterDialog.tsx src/domains/creator/filter/studio-filter-menu-groups.ts src/domains/creator/filter/studio-filter-menu-groups.test.ts src/domains/creator/studio-main-menu-items-filter.ts src/domains/creator/studio-main-menu-items-filter.test.ts src/domains/creator/brush/studio-brush-r8-grain-hydrator.ts src/domains/creator/brush/studio-brush-r8-png-decoder.test.ts src/domains/creator/brush/StudioSubToolPalette.tsx src/domains/creator/brush/studio-brush-discovery.test.ts src/domains/creator/brush/studio-shortcut-brush-search.ts src/domains/creator/brush/studio-shortcut-brush-search.test.ts src/domains/creator/brush/studio-shortcut-brush-search-purpose.test.ts src/domains/creator/brush/studio-shortcut-order.test.ts scripts/verify-studio-discovery-ux.mts
          if ! git diff --cached --quiet; then
            git -c core.hooksPath=/dev/null commit -m 'fix(studio): finalize tested brush and filter discovery integration'
          fi
          git push origin HEAD:refs/heads/fix/studio-brush-filter-discovery-20260906
          git rev-parse HEAD | tee /tmp/studio-discovery-evidence/source-sha.txt
      - name: Production build
        run: pnpm run build:bundle
      - run: pnpm exec playwright install --with-deps chromium
      - name: Responsive keyboard and production menu integration
        run: pnpm exec tsx scripts/verify-studio-discovery-ux.mts
      - name: Draw all eighteen shortcuts and verify pixels and undo
        env:
          TOONSPECTRUM_BRUSH_VERIFY_STAGE: desktop
          TOONSPECTRUM_BRUSH_SURVEY: '1'
          TOONSPECTRUM_BRUSH_VERIFY_SETTLED_DUMP: '1'
          TOONSPECTRUM_BRUSH_VERIFY_IDS: gpen,pen,fountain-pen,pencil,pencil--side-shade,charcoal--compressed-edge,watercolor,marker,gouache--matte-body,oil--filbert-ribbon,airbrush,spray,splatter,standard-eraser,kneaded-eraser,screentone,web-cross-hatch-pen,web-radial-burst
        run: pnpm exec tsx scripts/verify-studio-brushes.mts
      - name: Preserve screenshots and failure receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: studio-discovery-final-evidence
          path: /tmp/studio-discovery-evidence
          retention-days: 7
          if-no-files-found: warn
