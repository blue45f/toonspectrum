name: One-time cleanup of newly absorbed branches

on:
  push:
    branches:
      - chore/cleanup-absorbed-branches-20260908-gpt56-r3

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-absorbed-branches-20260908-gpt56-r3
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Delete immutable inactive branches fully contained by active main-bound integrations
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_BRANCH: ${{ github.ref_name }}
          WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          workflow_branch = os.environ["WORKFLOW_BRANCH"]
          workflow_sha = os.environ["WORKFLOW_SHA"]
          owner, repo = repository.split("/", 1)

          candidates = {
              "feat/market-platform-v2-complete": "2e09b5ebf5ab7905b63329d285505c4723cb11b4",
              "merge-ready/3ad5d69c-final": "0ae679dd8f67e8c8ceace78bdd2f22354f58d0c1",
          }

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "toonspectrum-newly-absorbed-branch-cleanup",
          }

          def quote_ref(name: str) -> str:
              return "/".join(
                  urllib.parse.quote(part, safe="") for part in name.split("/")
              )

          def api(path: str, method: str = "GET", allowed_statuses=()):
              request = urllib.request.Request(
                  f"https://api.github.com{path}", headers=headers, method=method
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      body = response.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", "replace")
                  if error.code in allowed_statuses:
                      return None
                  raise RuntimeError(
                      f"GitHub API {method} {path} failed: {error.code} {detail}"
                  ) from error

          def get_ref(name: str):
              return api(
                  f"/repos/{owner}/{repo}/git/ref/heads/{quote_ref(name)}",
                  allowed_statuses=(404,),
              )

          def delete_ref(name: str):
              return api(
                  f"/repos/{owner}/{repo}/git/refs/heads/{quote_ref(name)}",
                  method="DELETE",
                  allowed_statuses=(404,),
              )

          open_pulls = []
          for page in range(1, 11):
              batch = api(
                  f"/repos/{owner}/{repo}/pulls?state=open&per_page=100&page={page}"
              ) or []
              open_pulls.extend(batch)
              if len(batch) < 100:
                  break

          def same_repo(side):
              repo_data = ((side or {}).get("repo") or {})
              return repo_data.get("full_name") == repository

          open_heads = {
              (pull.get("head") or {}).get("ref")
              for pull in open_pulls
              if same_repo(pull.get("head"))
          }
          open_bases = {
              (pull.get("base") or {}).get("ref")
              for pull in open_pulls
              if same_repo(pull.get("base"))
          }

          retained = {}
          main_ref = get_ref("main")
          if main_ref is None:
              raise RuntimeError("main ref is unavailable")
          retained["main"] = main_ref["object"]["sha"]

          for pull in open_pulls:
              head = pull.get("head") or {}
              base = pull.get("base") or {}
              if not same_repo(head) or not same_repo(base):
                  continue
              if base.get("ref") != "main":
                  continue
              head_name = head.get("ref")
              head_sha = head.get("sha")
              if head_name and head_sha and head_name not in candidates:
                  retained[head_name] = head_sha

          if len(retained) == 1:
              raise RuntimeError("No active same-repository integration PR targeting main")

          branches = {}
          for page in range(1, 11):
              batch = api(
                  f"/repos/{owner}/{repo}/branches?per_page=100&page={page}"
              ) or []
              for branch in batch:
                  branches[branch["name"]] = branch
              if len(batch) < 100:
                  break

          report = {
              "retained": retained,
              "deleted": [],
              "skipped": [],
              "errors": [],
          }

          for name, expected_sha in candidates.items():
              try:
                  branch = branches.get(name)
                  if branch is None:
                      report["skipped"].append(
                          {"branch": name, "reason": "already-absent"}
                      )
                      continue
                  if branch.get("protected"):
                      report["skipped"].append(
                          {"branch": name, "reason": "protected"}
                      )
                      continue
                  if name in open_heads or name in open_bases:
                      report["skipped"].append(
                          {"branch": name, "reason": "active-open-pr"}
                      )
                      continue

                  current_sha = (branch.get("commit") or {}).get("sha")
                  if current_sha != expected_sha:
                      report["skipped"].append(
                          {
                              "branch": name,
                              "reason": "head-moved",
                              "expectedSha": expected_sha,
                              "currentSha": current_sha,
                          }
                      )
                      continue

                  proof = None
                  for retained_name, retained_sha in retained.items():
                      comparison = api(
                          f"/repos/{owner}/{repo}/compare/{expected_sha}...{retained_sha}",
                          allowed_statuses=(404, 409),
                      )
                      status = comparison.get("status") if comparison else None
                      behind_by = (
                          int(comparison.get("behind_by", -1))
                          if comparison
                          else -1
                      )
                      if status in {"ahead", "identical"} and behind_by == 0:
                          proof = {
                              "retainedBranch": retained_name,
                              "retainedSha": retained_sha,
                              "status": status,
                              "behindBy": behind_by,
                          }
                          break

                  if proof is None:
                      report["skipped"].append(
                          {"branch": name, "reason": "not-fully-contained"}
                      )
                      continue

                  verified_ref = get_ref(name)
                  verified_sha = (
                      verified_ref["object"]["sha"] if verified_ref else None
                  )
                  if verified_sha != expected_sha:
                      report["skipped"].append(
                          {
                              "branch": name,
                              "reason": "head-changed-after-proof",
                              "currentSha": verified_sha,
                          }
                      )
                      continue

                  delete_ref(name)
                  report["deleted"].append(
                      {"branch": name, "sha": expected_sha, "proof": proof}
                  )
              except Exception as error:
                  report["errors"].append(
                      {"branch": name, "error": str(error)}
                  )

          try:
              helper_ref = get_ref(workflow_branch)
              helper_sha = helper_ref["object"]["sha"] if helper_ref else None
              if helper_sha is not None and helper_sha != workflow_sha:
                  raise RuntimeError(
                      f"temporary launcher head moved: {helper_sha} != {workflow_sha}"
                  )
              delete_ref(workflow_branch)
              report["selfDeleted"] = workflow_branch
          except Exception as error:
              report["errors"].append(
                  {"branch": workflow_branch, "error": str(error)}
              )

          print(json.dumps(report, ensure_ascii=False, indent=2))
          if report["errors"]:
              raise SystemExit(1)
          PY
