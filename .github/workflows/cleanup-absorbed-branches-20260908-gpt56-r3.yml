name: One-time cleanup of newly absorbed branches

on:
  push:
    branches:
      - chore/cleanup-absorbed-branches-20260908-gpt56-r3

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-absorbed-branches-20260908-gpt56-r3
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Delete immutable inactive branches fully contained by active main-bound integrations
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_BRANCH: ${{ github.ref_name }}
          WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          workflow_branch = os.environ["WORKFLOW_BRANCH"]
          workflow_sha = os.environ["WORKFLOW_SHA"]
          owner, repo = repository.split("/", 1)

          candidates = {
              "feat/market-platform-v2-complete": "2e09b5ebf5ab7905b63329d285505c4723cb11b4",
              "merge-ready/3ad5d69c-final": "0ae679dd8f67e8c8ceace78bdd2f22354f58d0c1",
          }
          allowed_retained = {
              "merge-ready/all-completed-worktrees-final-20260908",
              "ops/production-ready-locked-20260908-1810",
          }

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "toonspectrum-newly-absorbed-branch-cleanup",
          }

          def quote_ref(name):
              return "/".join(urllib.parse.quote(p, safe="") for p in name.split("/"))

          def api(path, method="GET", allowed=()):
              request = urllib.request.Request(
                  f"https://api.github.com{path}", headers=headers, method=method
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      body = response.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", "replace")
                  if error.code in allowed:
                      return None
                  raise RuntimeError(
                      f"GitHub API {method} {path} failed: {error.code} {detail}"
                  ) from error

          def get_ref(name):
              return api(
                  f"/repos/{owner}/{repo}/git/ref/heads/{quote_ref(name)}",
                  allowed=(404,),
              )

          def delete_ref(name):
              return api(
                  f"/repos/{owner}/{repo}/git/refs/heads/{quote_ref(name)}",
                  method="DELETE",
                  allowed=(404,),
              )

          pulls = api(f"/repos/{owner}/{repo}/pulls?state=open&per_page=100") or []

          def same_repo(side):
              return (((side or {}).get("repo") or {}).get("full_name") == repository)

          open_heads = {
              (pull.get("head") or {}).get("ref")
              for pull in pulls
              if same_repo(pull.get("head"))
          }
          open_bases = {
              (pull.get("base") or {}).get("ref")
              for pull in pulls
              if same_repo(pull.get("base"))
          }

          retained = {}
          main_ref = get_ref("main")
          if main_ref is None:
              raise RuntimeError("main ref is unavailable")
          retained["main"] = main_ref["object"]["sha"]

          for pull in pulls:
              head = pull.get("head") or {}
              base = pull.get("base") or {}
              name = head.get("ref")
              sha = head.get("sha")
              if (
                  same_repo(head)
                  and same_repo(base)
                  and base.get("ref") == "main"
                  and name in allowed_retained
                  and sha
              ):
                  current = get_ref(name)
                  if current and current["object"]["sha"] == sha:
                      retained[name] = sha

          if len(retained) == 1:
              raise RuntimeError("No approved active integration PR targeting main")

          report = {"retained": retained, "deleted": [], "skipped": [], "errors": []}

          for name, expected_sha in candidates.items():
              try:
                  if name in open_heads or name in open_bases:
                      report["skipped"].append({"branch": name, "reason": "active-open-pr"})
                      continue
                  ref = get_ref(name)
                  if ref is None:
                      report["skipped"].append({"branch": name, "reason": "already-absent"})
                      continue
                  current_sha = ref["object"]["sha"]
                  if current_sha != expected_sha:
                      report["skipped"].append({
                          "branch": name,
                          "reason": "head-moved",
                          "expectedSha": expected_sha,
                          "currentSha": current_sha,
                      })
                      continue

                  proof = None
                  for retained_name, retained_sha in retained.items():
                      comparison = api(
                          f"/repos/{owner}/{repo}/compare/{expected_sha}...{retained_sha}",
                          allowed=(404, 409),
                      )
                      if (
                          comparison
                          and comparison.get("status") in {"ahead", "identical"}
                          and int(comparison.get("behind_by", -1)) == 0
                      ):
                          proof = {
                              "retainedBranch": retained_name,
                              "retainedSha": retained_sha,
                              "status": comparison["status"],
                              "behindBy": 0,
                          }
                          break
                  if proof is None:
                      report["skipped"].append({"branch": name, "reason": "not-fully-contained"})
                      continue

                  verified = get_ref(name)
                  if verified is None or verified["object"]["sha"] != expected_sha:
                      report["skipped"].append({"branch": name, "reason": "head-changed-after-proof"})
                      continue
                  delete_ref(name)
                  report["deleted"].append({"branch": name, "sha": expected_sha, "proof": proof})
              except Exception as error:
                  report["errors"].append({"branch": name, "error": str(error)})

          try:
              helper = get_ref(workflow_branch)
              helper_sha = helper["object"]["sha"] if helper else None
              if helper_sha is not None and helper_sha != workflow_sha:
                  raise RuntimeError(f"temporary launcher head moved: {helper_sha}")
              delete_ref(workflow_branch)
              report["selfDeleted"] = workflow_branch
          except Exception as error:
              report["errors"].append({"branch": workflow_branch, "error": str(error)})

          print(json.dumps(report, ensure_ascii=False, indent=2))
          if report["errors"]:
              raise SystemExit(1)
          PY
