name: Trigger code scanning remediation gate

on:
  push:
    branches:
      - codex/code-scanning-remediation-20260908
    paths:
      - .github/workflows/code-scanning-remediation-gate-trigger.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch final security gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run code-scanning-remediation-gate.yml --repo "$GITHUB_REPOSITORY" --ref codex/code-scanning-remediation-20260908

      - name: Remove one-shot trigger
        uses: actions/checkout@v4
        with:
          ref: codex/code-scanning-remediation-20260908
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Commit trigger cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/code-scanning-remediation-gate-trigger.yml
          git add -A
          git commit -m "chore(security): remove one-shot gate trigger"
          git push origin HEAD:codex/code-scanning-remediation-20260908
