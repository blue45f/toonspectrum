name: Finalize main convergence and branch cleanup

on:
  push:
    branches:
      - ops/blender-52-compat-fix-20260904

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: finalize-main-convergence-20260904
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      BLENDER_BRANCH: feat/blender-character-quality-pipeline-20260904
      FINAL_BRANCH: ops/final-history-convergence-20260904
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure repository identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Idempotently repair the Blender 5.2 branch
        shell: bash
        run: |
          set -euo pipefail
          git switch --force-create blender-52-repair "origin/${BLENDER_BRANCH}"
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("tools/blender/toonstudio_blender_kit/face.py")
          text = path.read_text(encoding="utf-8")
          changed = False

          if "obj.data.vertices[::step]" in text:
              text, count = re.subn(
                  r'(?m)^(?P<indent>\s*)for vertex in obj\.data\.vertices\[::step\]:$',
                  lambda match: (
                      f'{match.group("indent")}vertices = obj.data.vertices\n'
                      f'{match.group("indent")}for vertex_index in range(0, len(vertices), step):\n'
                      f'{match.group("indent")}    vertex = vertices[vertex_index]'
                  ),
                  text,
              )
              if count != 1:
                  raise SystemExit(f"expected one stepped collection slice, found {count}")
              changed = True
          elif "for vertex_index in range(0, len(vertices), step):" not in text:
              raise SystemExit("the Blender vertex iteration is neither legacy nor repaired")

          if 'key["toonstudio_label"] = label' in text:
              text, count = re.subn(
                  r'(?m)^(?P<indent>\s*)key\["toonstudio_label"\] = label$',
                  lambda match: (
                      f'{match.group("indent")}shape_keys = obj.data.shape_keys\n'
                      f'{match.group("indent")}if shape_keys is not None:\n'
                      f'{match.group("indent")}    shape_keys[f"toonstudio_label:{key.name}"] = label'
                  ),
                  text,
              )
              if count != 1:
                  raise SystemExit(f"expected one unsupported ShapeKey property write, found {count}")
              changed = True
          elif 'shape_keys[f"toonstudio_label:{key.name}"] = label' not in text:
              raise SystemExit("the ShapeKey label storage is neither legacy nor repaired")

          if changed:
              path.write_text(text, encoding="utf-8")
          PY
          python -m compileall -q tools/blender/toonstudio_blender_kit scripts/blender
          python -m unittest discover -s tests/blender -p 'test_*.py' -v
          git add tools/blender/toonstudio_blender_kit/face.py
          if ! git diff --cached --quiet; then
            git commit -m "fix(blender): support Blender 5.2 shape key and vertex APIs"
            if ! git push origin HEAD:"${BLENDER_BRANCH}"; then
              echo "A concurrent repair updated the branch; accepting the remote tip and continuing."
              git fetch origin "${BLENDER_BRANCH}"
              git reset --hard "origin/${BLENDER_BRANCH}"
            fi
          fi

      - name: Merge validated product pull requests
        shell: bash
        run: |
          set -euo pipefail

          wait_and_merge() {
            local pr="$1"
            local label="$2"
            local checks_file
            checks_file="${RUNNER_TEMP}/pr-${pr}-checks.txt"

            for attempt in $(seq 1 240); do
              local state merge_state head_sha
              state="$(gh pr view "$pr" --repo "$REPOSITORY" --json state --jq '.state')"
              if [[ "$state" == "MERGED" ]]; then
                echo "${label}: PR #${pr} is merged."
                return 0
              fi
              if [[ "$state" == "CLOSED" ]]; then
                echo "${label}: PR #${pr} was closed without merge." >&2
                return 1
              fi

              merge_state="$(gh pr view "$pr" --repo "$REPOSITORY" --json mergeStateStatus --jq '.mergeStateStatus')"
              if [[ "$merge_state" == "BEHIND" ]]; then
                head_sha="$(gh pr view "$pr" --repo "$REPOSITORY" --json headRefOid --jq '.headRefOid')"
                gh api --method PUT "repos/${REPOSITORY}/pulls/${pr}/update-branch" -f expected_head_sha="$head_sha" >/dev/null || true
                sleep 15
                continue
              fi

              set +e
              gh pr checks "$pr" --repo "$REPOSITORY" >"$checks_file" 2>&1
              local checks_rc=$?
              set -e

              if [[ $checks_rc -eq 0 ]] || grep -qi "no checks reported" "$checks_file"; then
                if gh pr merge "$pr" --repo "$REPOSITORY" --merge --delete-branch=false; then
                  for merged_wait in $(seq 1 30); do
                    state="$(gh pr view "$pr" --repo "$REPOSITORY" --json state --jq '.state')"
                    [[ "$state" == "MERGED" ]] && return 0
                    sleep 5
                  done
                fi
              elif [[ $checks_rc -eq 8 ]]; then
                echo "${label}: checks are pending (attempt ${attempt})."
              else
                cat "$checks_file" >&2
                echo "${label}: a current PR check failed." >&2
                return 1
              fi
              sleep 15
            done

            echo "${label}: timed out waiting for PR #${pr}." >&2
            return 1
          }

          wait_and_merge 617 "Adaptive face and authored hair"
          wait_and_merge 619 "Blender character quality pipeline"

      - name: Preserve every remaining branch history without changing the product tree
        id: convergence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          git switch --force-create final-history-convergence origin/main

          mapfile -t branches < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
              | grep -v '^HEAD$' \
              | grep -v '^main$' \
              | sort -u
          )

          preserved=()
          for branch in "${branches[@]}"; do
            if git merge-base --is-ancestor "origin/${branch}" HEAD; then
              continue
            fi
            git merge --strategy=ours --no-ff --allow-unrelated-histories \
              -m "chore(history): preserve ${branch} before cleanup" \
              "origin/${branch}"
            preserved+=("${branch}")
          done

          git push --force-with-lease origin HEAD:"${FINAL_BRANCH}"
          printf '%s\n' "${preserved[@]}" > "${RUNNER_TEMP}/preserved-branches.txt"

          existing_pr="$(gh pr list --repo "$REPOSITORY" --state open --head "$FINAL_BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing_pr" ]]; then
            pr_number="$existing_pr"
          else
            pr_url="$(gh pr create --repo "$REPOSITORY" --base main --head "$FINAL_BRANCH" \
              --title "chore: preserve all remaining branch histories before cleanup" \
              --body $'## 목적\n\n제품 트리는 최신 `main`과 바이트 동일하게 유지하면서, 아직 조상 관계가 아니던 자동화·복구 브랜치의 커밋 그래프만 `ours` merge로 보존합니다.\n\n병합 후 `main`의 조상이 된 원격 브랜치는 안전하게 삭제합니다.')"
            pr_number="${pr_url##*/}"
          fi
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"

      - name: Merge the history-only convergence pull request
        shell: bash
        env:
          PR_NUMBER: ${{ steps.convergence.outputs.pr_number }}
        run: |
          set -euo pipefail
          checks_file="${RUNNER_TEMP}/history-pr-checks.txt"
          for attempt in $(seq 1 240); do
            state="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json state --jq '.state')"
            [[ "$state" == "MERGED" ]] && exit 0
            [[ "$state" == "CLOSED" ]] && { echo "History convergence PR closed without merge" >&2; exit 1; }

            merge_state="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json mergeStateStatus --jq '.mergeStateStatus')"
            if [[ "$merge_state" == "BEHIND" ]]; then
              head_sha="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json headRefOid --jq '.headRefOid')"
              gh api --method PUT "repos/${REPOSITORY}/pulls/${PR_NUMBER}/update-branch" -f expected_head_sha="$head_sha" >/dev/null || true
              sleep 15
              continue
            fi

            set +e
            gh pr checks "$PR_NUMBER" --repo "$REPOSITORY" >"$checks_file" 2>&1
            checks_rc=$?
            set -e
            if [[ $checks_rc -eq 0 ]] || grep -qi "no checks reported" "$checks_file"; then
              gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --merge --delete-branch=false && true
            elif [[ $checks_rc -ne 8 ]]; then
              cat "$checks_file" >&2
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for history convergence PR" >&2
          exit 1

      - name: Delete only branches proven merged into main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          main_sha="$(git rev-parse origin/main)"
          deleted=()
          retained=()

          mapfile -t branches < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
              | grep -v '^HEAD$' \
              | grep -v '^main$' \
              | sort -u
          )

          for branch in "${branches[@]}"; do
            encoded="$(jq -rn --arg value "$branch" '$value|@uri')"
            protected="$(gh api "repos/${REPOSITORY}/branches/${encoded}" --jq '.protected' 2>/dev/null || echo true)"
            open_prs="$(gh pr list --repo "$REPOSITORY" --state open --head "$branch" --json number --jq 'length')"
            if [[ "$protected" == "false" && "$open_prs" == "0" ]] && git merge-base --is-ancestor "origin/${branch}" origin/main; then
              git push origin --delete "$branch"
              deleted+=("$branch")
            else
              retained+=("$branch")
            fi
          done

          {
            echo "## ToonSpectrum main convergence"
            echo
            echo "- main: \`${main_sha}\`"
            echo "- deleted merged branches: ${#deleted[@]}"
            for branch in "${deleted[@]}"; do echo "  - \`${branch}\`"; done
            echo "- retained branches: ${#retained[@]}"
            for branch in "${retained[@]}"; do echo "  - \`${branch}\`"; done
            echo "- open pull requests: $(gh pr list --repo "$REPOSITORY" --state open --json number --jq 'length')"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ ${#retained[@]} -ne 0 ]]; then
            echo "Some branches could not be safely deleted: ${retained[*]}" >&2
            exit 1
          fi
