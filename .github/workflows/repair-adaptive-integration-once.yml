name: Repair adaptive integration blocker once

on:
  push:
    branches:
      - feat/shaper-adaptive-face-authored-hair-20260903
    paths:
      - .github/workflows/repair-adaptive-integration-once.yml

permissions:
  contents: write

concurrency:
  group: repair-adaptive-integration-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: feat/shaper-adaptive-face-authored-hair-20260903
          fetch-depth: 0

      - name: Update the source-level preview contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/domains/creator/vrm/studio-vrm-generate.test.ts")
          source = path.read_text(encoding="utf-8")
          old = 'expect(panel).toContain("previewRecipe.state.hair.baseColor");'
          new = 'expect(panel).toContain("state={previewRecipe.state}");'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one stale assertion, found {count}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Remove the one-shot workflow and push the repair
        shell: bash
        run: |
          git rm .github/workflows/repair-adaptive-integration-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domains/creator/vrm/studio-vrm-generate.test.ts
          git commit -m "test(vrm): assert the composed preview state contract"
          git push origin HEAD:feat/shaper-adaptive-face-authored-hair-20260903
