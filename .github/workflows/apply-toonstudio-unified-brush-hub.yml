              text = text.replace(marker, capability + marker, 1)
            registry.write_text(text)

          registry_test = ROOT / 'apps/web/src/domains/creator/studio-route-registry.test.ts'
          if registry_test.exists():
            text = registry_test.read_text()
            if '"assets.unified-brushes"' not in text:
              text = text.replace('                "assets.rights",', '                "assets.unified-brushes",\n                "assets.rights",', 1)
            registry_test.write_text(text)

          workflow = ROOT / '.github/workflows/apply-toonstudio-unified-brush-hub.yml'
          # Removed only after every verification step succeeds.
          PY

      - name: Verify formatting
        run: git diff --check

      - name: Verify reachability
        run: node scripts/verify-toonstudio-feature-reachability.mjs

      - name: Typecheck
        run: pnpm exec tsc -p tsconfig.json --noEmit --pretty false

      - name: Lint changed source
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only -- '*.ts' '*.tsx')
          pnpm exec eslint --max-warnings=0 --no-warn-ignored -- "${files[@]}"

      - name: Run brush and integration tests
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/studio-unified-brush-repository.test.ts
          apps/web/src/domains/creator/studio-route-registry.test.ts
          apps/web/src/domains/creator/studio-integration-closure.test.ts
          apps/web/src/domains/creator/studio-shell/StudioProjectBrushHubPanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectShellPage.integration.test.tsx
          apps/web/src/app/routes/groups/app-routes.test.tsx
          --pool=forks --maxWorkers=2

      - name: Build production bundle
        run: pnpm run build:bundle

      - name: Commit verified brush integration
        shell: bash
        run: |
          rm .github/workflows/apply-toonstudio-unified-brush-hub.yml
          git config user.name "toonstudio-integration-bot"
          git config user.email "toonstudio-integration-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(studio): unify brush catalogue and project selection"
          git push origin HEAD:feat/toonstudio-unified-brush-hub-20260911
