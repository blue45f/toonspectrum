name: Apply ToonStudio unified brush hub

on:
  push:
    branches:
      - feat/toonstudio-unified-brush-hub-20260911
    paths:
      - .github/workflows/apply-toonstudio-unified-brush-hub.yml

permissions:
  contents: write

concurrency:
  group: apply-toonstudio-unified-brush-hub
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "true"
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/toonstudio-unified-brush-hub-20260911
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Add unified brush repository and product surface
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')

          repository = r'''export const STUDIO_UNIFIED_BRUSH_UPDATED_EVENT =
            "toonspectrum:studio-unified-brush-updated";
          export const STUDIO_UNIFIED_BRUSH_SELECTED_EVENT =
            "toonspectrum:studio-unified-brush-selected";

          export type StudioUnifiedBrushSource =
            | "system"
            | "personal"
            | "imported"
            | "team"
            | "market";
          export type StudioUnifiedBrushOperation = "paint" | "erase" | "blend";
          export type StudioUnifiedBrushScope = "recommended" | "all" | "mine" | "team" | "market";
          export type StudioUnifiedBrushMaterial =
            | "ink"
            | "pencil"
            | "marker"
            | "watercolor"
            | "oil"
            | "air"
            | "pastel"
            | "texture"
            | "tone"
            | "effect"
            | "eraser"
            | "blend";

          export interface StudioUnifiedBrushRef {
            readonly brushId: string;
            readonly versionId: string;
            readonly source: StudioUnifiedBrushSource;
          }

          export interface StudioUnifiedBrushProvenance {
            readonly providerId: string | null;
            readonly externalId: string | null;
            readonly originalFileName: string | null;
            readonly licenseReceiptId: string | null;
            readonly importedAt: string | null;
          }

          export interface StudioUnifiedBrushDefinition {
            readonly brushId: string;
            readonly versionId: string;
            readonly source: StudioUnifiedBrushSource;
            readonly name: string;
            readonly description: string;
            readonly material: StudioUnifiedBrushMaterial;
            readonly tags: readonly string[];
            readonly readonly: boolean;
            readonly createdAt: string;
            readonly updatedAt: string;
            readonly payload: Readonly<Record<string, unknown>>;
            readonly provenance: StudioUnifiedBrushProvenance;
          }

          export interface StudioUnifiedBrushDraft {
            readonly draftId: string;
            readonly baseRef: StudioUnifiedBrushRef;
            readonly name: string;
            readonly payload: Readonly<Record<string, unknown>>;
            readonly dirty: boolean;
            readonly updatedAt: string;
          }

          export interface StudioUnifiedBrushBrowserView {
            readonly scope: StudioUnifiedBrushScope;
            readonly material: StudioUnifiedBrushMaterial | null;
            readonly query: string;
          }

          export interface StudioUnifiedBrushState {
            readonly schemaVersion: 1;
            readonly projectId: string;
            readonly updatedAt: string;
            readonly definitions: readonly StudioUnifiedBrushDefinition[];
            readonly favorites: readonly string[];
            readonly recent: readonly string[];
            readonly activeByOperation: Readonly<Record<StudioUnifiedBrushOperation, StudioUnifiedBrushRef>>;
            readonly draft: StudioUnifiedBrushDraft | null;
            readonly browserView: StudioUnifiedBrushBrowserView;
          }

          export interface StudioUnifiedBrushStorage {
            getItem(key: string): string | null;
            setItem(key: string, value: string): void;
          }

          export interface StudioUnifiedBrushEventTarget {
            dispatchEvent(event: Event): boolean;
          }

          export interface StudioUnifiedBrushSearchOptions {
            readonly scope?: StudioUnifiedBrushScope;
            readonly material?: StudioUnifiedBrushMaterial | null;
            readonly limit?: number;
          }

          const EMPTY_PROVENANCE: StudioUnifiedBrushProvenance = Object.freeze({
            providerId: null,
            externalId: null,
            originalFileName: null,
            licenseReceiptId: null,
            importedAt: null,
          });

          function requireProjectId(projectId: string): string {
            const value = projectId.trim();
            if (!value || value === "." || value === ".." || value.includes("\\")) {
              throw new Error("A valid project id is required.");
            }
            return value;
          }

          function requireText(value: string, label: string): string {
            const normalized = value.trim();
            if (!normalized) throw new Error(`${label} is required.`);
            return normalized;
          }

          function validTimestamp(value: string): string {
            if (!Number.isFinite(Date.parse(value))) throw new Error("A valid timestamp is required.");
            return value;
          }

          function record(value: unknown): Record<string, unknown> | null {
            return value !== null && typeof value === "object" && !Array.isArray(value)
              ? value as Record<string, unknown>
              : null;
          }

          function unique(values: readonly string[]): readonly string[] {
            return Object.freeze([...new Set(values.filter(Boolean))]);
          }

          function ref(definition: StudioUnifiedBrushDefinition): StudioUnifiedBrushRef {
            return Object.freeze({
              brushId: definition.brushId,
              versionId: definition.versionId,
              source: definition.source,
            });
          }

          function systemBrush(
            brushId: string,
            name: string,
            description: string,
            material: StudioUnifiedBrushMaterial,
            tags: readonly string[],
            payload: Readonly<Record<string, unknown>>,
            at: string,
          ): StudioUnifiedBrushDefinition {
            return Object.freeze({
              brushId,
              versionId: "system-v1",
              source: "system",
              name,
              description,
              material,
              tags: Object.freeze([...tags]),
              readonly: true,
              createdAt: at,
              updatedAt: at,
              payload: Object.freeze({ ...payload }),
              provenance: EMPTY_PROVENANCE,
            });
          }

          export function studioUnifiedBrushStorageKey(projectId: string): string {
            return `toonspectrum:studio-unified-brush:v1:${encodeURIComponent(requireProjectId(projectId))}`;
          }

          export function createDefaultStudioUnifiedBrushState(
            projectId: string,
            updatedAt = new Date().toISOString(),
          ): StudioUnifiedBrushState {
            const id = requireProjectId(projectId);
            const at = validTimestamp(updatedAt);
            const definitions = Object.freeze([
              systemBrush("system:g-pen", "G펜", "깨끗한 웹툰 선화와 강약 표현", "ink", ["선화", "잉크", "웹툰"], { size: 12, opacity: 1, stabilization: 0.38 }, at),
              systemBrush("system:round-pen", "둥근 펜", "일정하고 매끄러운 외곽선", "ink", ["외곽선", "균일"], { size: 10, opacity: 1, stabilization: 0.46 }, at),
              systemBrush("system:rough-pencil", "거친 연필", "콘티와 러프 스케치를 위한 흑연 질감", "pencil", ["스케치", "러프", "흑연"], { size: 18, opacity: 0.84, grain: 0.62 }, at),
              systemBrush("system:watercolor", "번지는 수채", "색이 자연스럽게 섞이는 수채 브러시", "watercolor", ["채색", "수채", "번짐"], { size: 42, opacity: 0.72, water: 0.68 }, at),
              systemBrush("system:soft-air", "부드러운 에어", "빛과 그림자 보정용 부드러운 분사", "air", ["명암", "빛", "에어"], { size: 90, opacity: 0.28, hardness: 0.08 }, at),
              systemBrush("system:eraser", "기본 지우개", "필압에 반응하는 깨끗한 지우개", "eraser", ["지우개"], { size: 28, opacity: 1, pressure: true }, at),
              systemBrush("system:blend", "색 경계 섞기", "색상 경계를 자연스럽게 혼합", "blend", ["혼합", "블렌드"], { size: 36, strength: 0.45 }, at),
            ]);
            const paint = definitions[0]!;
            const eraser = definitions.find((brush) => brush.material === "eraser")!;
            const blend = definitions.find((brush) => brush.material === "blend")!;
            return Object.freeze({
              schemaVersion: 1,
              projectId: id,
              updatedAt: at,
              definitions,
              favorites: Object.freeze([paint.brushId]),
              recent: Object.freeze([paint.brushId]),
              activeByOperation: Object.freeze({ paint: ref(paint), erase: ref(eraser), blend: ref(blend) }),
              draft: null,
              browserView: Object.freeze({ scope: "recommended", material: null, query: "" }),
            });
          }

          function normalizeDefinition(value: unknown): StudioUnifiedBrushDefinition | null {
            const input = record(value);
            if (!input) return null;
            const source = input.source;
            const material = input.material;
            const sources: readonly StudioUnifiedBrushSource[] = ["system", "personal", "imported", "team", "market"];
            const materials: readonly StudioUnifiedBrushMaterial[] = ["ink", "pencil", "marker", "watercolor", "oil", "air", "pastel", "texture", "tone", "effect", "eraser", "blend"];
            if (typeof input.brushId !== "string" || typeof input.versionId !== "string" || typeof input.name !== "string") return null;
            if (!sources.includes(source as StudioUnifiedBrushSource) || !materials.includes(material as StudioUnifiedBrushMaterial)) return null;
            const provenance = record(input.provenance);
            return Object.freeze({
              brushId: input.brushId,
              versionId: input.versionId,
              source: source as StudioUnifiedBrushSource,
              name: input.name,
              description: typeof input.description === "string" ? input.description : "",
              material: material as StudioUnifiedBrushMaterial,
              tags: Object.freeze(Array.isArray(input.tags) ? input.tags.filter((item): item is string => typeof item === "string") : []),
              readonly: input.readonly === true || source === "system" || source === "market",
              createdAt: typeof input.createdAt === "string" && Number.isFinite(Date.parse(input.createdAt)) ? input.createdAt : new Date(0).toISOString(),
              updatedAt: typeof input.updatedAt === "string" && Number.isFinite(Date.parse(input.updatedAt)) ? input.updatedAt : new Date(0).toISOString(),
              payload: Object.freeze({ ...(record(input.payload) ?? {}) }),
              provenance: Object.freeze({
                providerId: typeof provenance?.providerId === "string" ? provenance.providerId : null,
                externalId: typeof provenance?.externalId === "string" ? provenance.externalId : null,
                originalFileName: typeof provenance?.originalFileName === "string" ? provenance.originalFileName : null,
                licenseReceiptId: typeof provenance?.licenseReceiptId === "string" ? provenance.licenseReceiptId : null,
                importedAt: typeof provenance?.importedAt === "string" ? provenance.importedAt : null,
              }),
            });
          }

          function normalizeState(value: unknown, projectId: string): StudioUnifiedBrushState | null {
            const input = record(value);
            if (!input || input.schemaVersion !== 1 || input.projectId !== projectId || !Array.isArray(input.definitions)) return null;
            const defaults = createDefaultStudioUnifiedBrushState(projectId);
            const parsed = input.definitions.map(normalizeDefinition).filter((item): item is StudioUnifiedBrushDefinition => item !== null);
            const definitions = [...defaults.definitions];
            for (const definition of parsed) {
              const index = definitions.findIndex((item) => item.brushId === definition.brushId);
              if (index >= 0) definitions[index] = definition;
              else definitions.push(definition);
            }
            const known = new Set(definitions.map((definition) => definition.brushId));
            const favorites = unique(Array.isArray(input.favorites) ? input.favorites.filter((item): item is string => typeof item === "string" && known.has(item)) : defaults.favorites);
            const recent = unique(Array.isArray(input.recent) ? input.recent.filter((item): item is string => typeof item === "string" && known.has(item)).slice(0, 24) : defaults.recent);
            const activeInput = record(input.activeByOperation);
            const resolveActive = (operation: StudioUnifiedBrushOperation): StudioUnifiedBrushRef => {
              const candidate = record(activeInput?.[operation]);
              const match = candidate && typeof candidate.brushId === "string"
                ? definitions.find((definition) => definition.brushId === candidate.brushId)
                : null;
              return ref(match ?? definitions.find((definition) => operation === "erase"
                ? definition.material === "eraser"
                : operation === "blend"
                  ? definition.material === "blend"
                  : definition.material !== "eraser" && definition.material !== "blend")!);
            };
            const browser = record(input.browserView);
            const scopes: readonly StudioUnifiedBrushScope[] = ["recommended", "all", "mine", "team", "market"];
            const material = typeof browser?.material === "string" && defaults.definitions.some((definition) => definition.material === browser.material)
              ? browser.material as StudioUnifiedBrushMaterial
              : null;
            return Object.freeze({
              schemaVersion: 1,
              projectId,
              updatedAt: typeof input.updatedAt === "string" && Number.isFinite(Date.parse(input.updatedAt)) ? input.updatedAt : defaults.updatedAt,
              definitions: Object.freeze(definitions),
              favorites,
              recent,
              activeByOperation: Object.freeze({ paint: resolveActive("paint"), erase: resolveActive("erase"), blend: resolveActive("blend") }),
              draft: null,
              browserView: Object.freeze({
                scope: typeof browser?.scope === "string" && scopes.includes(browser.scope as StudioUnifiedBrushScope) ? browser.scope as StudioUnifiedBrushScope : "recommended",
                material,
                query: typeof browser?.query === "string" ? browser.query : "",
              }),
            });
          }

          export function readStudioUnifiedBrushState(storage: StudioUnifiedBrushStorage, projectId: string): StudioUnifiedBrushState | null {
            const id = requireProjectId(projectId);
            const raw = storage.getItem(studioUnifiedBrushStorageKey(id));
            if (!raw) return null;
            try {
              return normalizeState(JSON.parse(raw), id);
            } catch {
              return null;
            }
          }

          function dispatch(target: StudioUnifiedBrushEventTarget | undefined, type: string, detail: unknown): void {
            if (!target || typeof CustomEvent === "undefined") return;
            target.dispatchEvent(new CustomEvent(type, { detail }));
          }

          export function writeStudioUnifiedBrushState(
            storage: StudioUnifiedBrushStorage,
            state: StudioUnifiedBrushState,
            target?: StudioUnifiedBrushEventTarget,
          ): StudioUnifiedBrushState {
            const next = normalizeState(state, requireProjectId(state.projectId));
            if (!next) throw new Error("The brush state is invalid.");
            storage.setItem(studioUnifiedBrushStorageKey(next.projectId), JSON.stringify(next));
            dispatch(target, STUDIO_UNIFIED_BRUSH_UPDATED_EVENT, next);
            return next;
          }

          export function ensureStudioUnifiedBrushState(storage: StudioUnifiedBrushStorage, projectId: string): StudioUnifiedBrushState {
            const current = readStudioUnifiedBrushState(storage, projectId);
            if (current) return current;
            return writeStudioUnifiedBrushState(storage, createDefaultStudioUnifiedBrushState(projectId));
          }

          export function updateStudioUnifiedBrushState(
            storage: StudioUnifiedBrushStorage,
            projectId: string,
            updater: (current: StudioUnifiedBrushState) => StudioUnifiedBrushState,
            target?: StudioUnifiedBrushEventTarget,
          ): StudioUnifiedBrushState {
            const id = requireProjectId(projectId);
            const current = ensureStudioUnifiedBrushState(storage, id);
            const updated = updater(current);
            if (updated.projectId !== id) throw new Error("A brush update cannot change project identity.");
            return writeStudioUnifiedBrushState(storage, { ...updated, updatedAt: new Date().toISOString() }, target);
          }

          function matchesScope(definition: StudioUnifiedBrushDefinition, scope: StudioUnifiedBrushScope): boolean {
            if (scope === "all" || scope === "recommended") return true;
            if (scope === "mine") return definition.source === "personal" || definition.source === "imported";
            return definition.source === scope;
          }

          export function searchStudioUnifiedBrushes(
            state: StudioUnifiedBrushState,
            query: string,
            options: StudioUnifiedBrushSearchOptions = {},
          ): readonly StudioUnifiedBrushDefinition[] {
            const scope = options.scope ?? state.browserView.scope;
            const material = options.material === undefined ? state.browserView.material : options.material;
            const normalized = query.trim().toLocaleLowerCase("ko-KR");
            const favorite = new Set(state.favorites);
            const recentRank = new Map(state.recent.map((id, index) => [id, index] as const));
            const result = state.definitions
              .filter((definition) => matchesScope(definition, scope))
              .filter((definition) => material === null || definition.material === material)
              .filter((definition) => !normalized || [definition.name, definition.description, definition.material, ...definition.tags]
                .join(" ")
                .toLocaleLowerCase("ko-KR")
                .includes(normalized))
              .sort((left, right) => {
                const favoriteDelta = Number(favorite.has(right.brushId)) - Number(favorite.has(left.brushId));
                if (favoriteDelta !== 0) return favoriteDelta;
                const leftRecent = recentRank.get(left.brushId) ?? Number.MAX_SAFE_INTEGER;
                const rightRecent = recentRank.get(right.brushId) ?? Number.MAX_SAFE_INTEGER;
                if (leftRecent !== rightRecent) return leftRecent - rightRecent;
                if (scope === "recommended" && left.source !== right.source) return left.source === "system" ? -1 : 1;
                return left.name.localeCompare(right.name, "ko");
              });
            return Object.freeze(result.slice(0, options.limit ?? result.length));
          }

          export function selectStudioUnifiedBrush(
            state: StudioUnifiedBrushState,
            brushId: string,
            operation: StudioUnifiedBrushOperation = "paint",
            target?: StudioUnifiedBrushEventTarget,
          ): StudioUnifiedBrushState {
            const definition = state.definitions.find((item) => item.brushId === brushId);
            if (!definition) throw new Error(`Unknown brush: ${brushId}`);
            const next = Object.freeze({
              ...state,
              activeByOperation: Object.freeze({ ...state.activeByOperation, [operation]: ref(definition) }),
              recent: unique([brushId, ...state.recent]).slice(0, 24),
              updatedAt: new Date().toISOString(),
            });
            dispatch(target, STUDIO_UNIFIED_BRUSH_SELECTED_EVENT, Object.freeze({ operation, definition }));
            return next;
          }

          export function toggleStudioUnifiedBrushFavorite(state: StudioUnifiedBrushState, brushId: string): StudioUnifiedBrushState {
            if (!state.definitions.some((definition) => definition.brushId === brushId)) throw new Error(`Unknown brush: ${brushId}`);
            const favorites = state.favorites.includes(brushId)
              ? state.favorites.filter((id) => id !== brushId)
              : [brushId, ...state.favorites];
            return Object.freeze({ ...state, favorites: unique(favorites), updatedAt: new Date().toISOString() });
          }

          export function setStudioUnifiedBrushBrowserView(
            state: StudioUnifiedBrushState,
            browserView: Partial<StudioUnifiedBrushBrowserView>,
          ): StudioUnifiedBrushState {
            return Object.freeze({
              ...state,
              browserView: Object.freeze({ ...state.browserView, ...browserView }),
              updatedAt: new Date().toISOString(),
            });
          }

          export function duplicateStudioUnifiedBrush(
            state: StudioUnifiedBrushState,
            brushId: string,
            newBrushId: string,
            at = new Date().toISOString(),
          ): StudioUnifiedBrushState {
            const source = state.definitions.find((definition) => definition.brushId === brushId);
            if (!source) throw new Error(`Unknown brush: ${brushId}`);
            const id = requireText(newBrushId, "Brush id");
            if (state.definitions.some((definition) => definition.brushId === id)) throw new Error(`Brush already exists: ${id}`);
            const definition: StudioUnifiedBrushDefinition = Object.freeze({
              ...source,
              brushId: id,
              versionId: `personal-${validTimestamp(at)}`,
              source: "personal",
              name: `${source.name} 사본`,
              readonly: false,
              createdAt: at,
              updatedAt: at,
              payload: Object.freeze({ ...source.payload }),
              provenance: EMPTY_PROVENANCE,
            });
            return Object.freeze({
              ...state,
              definitions: Object.freeze([...state.definitions, definition]),
              activeByOperation: Object.freeze({ ...state.activeByOperation, paint: ref(definition) }),
              recent: unique([id, ...state.recent]).slice(0, 24),
              updatedAt: at,
            });
          }

          export function importStudioUnifiedBrush(
            state: StudioUnifiedBrushState,
            input: {
              readonly brushId: string;
              readonly name: string;
              readonly description?: string;
              readonly material?: StudioUnifiedBrushMaterial;
              readonly tags?: readonly string[];
              readonly payload?: Readonly<Record<string, unknown>>;
              readonly originalFileName?: string | null;
              readonly providerId?: string | null;
              readonly externalId?: string | null;
              readonly licenseReceiptId?: string | null;
            },
            at = new Date().toISOString(),
          ): StudioUnifiedBrushState {
            const id = requireText(input.brushId, "Brush id");
            if (state.definitions.some((definition) => definition.brushId === id)) throw new Error(`Brush already exists: ${id}`);
            const definition: StudioUnifiedBrushDefinition = Object.freeze({
              brushId: id,
              versionId: `import-${validTimestamp(at)}`,
              source: "imported",
              name: requireText(input.name, "Brush name"),
              description: input.description?.trim() ?? "",
              material: input.material ?? "ink",
              tags: unique(input.tags ?? []),
              readonly: false,
              createdAt: at,
              updatedAt: at,
              payload: Object.freeze({ ...(input.payload ?? {}) }),
              provenance: Object.freeze({
                providerId: input.providerId ?? null,
                externalId: input.externalId ?? null,
                originalFileName: input.originalFileName ?? null,
                licenseReceiptId: input.licenseReceiptId ?? null,
                importedAt: at,
              }),
            });
            return Object.freeze({
              ...state,
              definitions: Object.freeze([...state.definitions, definition]),
              activeByOperation: Object.freeze({ ...state.activeByOperation, paint: ref(definition) }),
              recent: unique([id, ...state.recent]).slice(0, 24),
              updatedAt: at,
            });
          }

          export function renameStudioUnifiedBrush(
            state: StudioUnifiedBrushState,
            brushId: string,
            name: string,
          ): StudioUnifiedBrushState {
            const current = state.definitions.find((definition) => definition.brushId === brushId);
            if (!current) throw new Error(`Unknown brush: ${brushId}`);
            if (current.readonly) throw new Error("A read-only brush cannot be renamed.");
            const updatedAt = new Date().toISOString();
            return Object.freeze({
              ...state,
              definitions: Object.freeze(state.definitions.map((definition) => definition.brushId === brushId
                ? Object.freeze({ ...definition, name: requireText(name, "Brush name"), updatedAt })
                : definition)),
              updatedAt,
            });
          }

          export function deleteStudioUnifiedBrush(state: StudioUnifiedBrushState, brushId: string): StudioUnifiedBrushState {
            const current = state.definitions.find((definition) => definition.brushId === brushId);
            if (!current) return state;
            if (current.readonly) throw new Error("A read-only brush cannot be deleted.");
            const definitions = state.definitions.filter((definition) => definition.brushId !== brushId);
            const fallback = definitions.find((definition) => definition.source === "system" && definition.material === "ink")!;
            const activeByOperation = Object.fromEntries(Object.entries(state.activeByOperation).map(([operation, active]) => [
              operation,
              active.brushId === brushId ? ref(fallback) : active,
            ])) as unknown as Readonly<Record<StudioUnifiedBrushOperation, StudioUnifiedBrushRef>>;
            return Object.freeze({
              ...state,
              definitions: Object.freeze(definitions),
              favorites: Object.freeze(state.favorites.filter((id) => id !== brushId)),
              recent: Object.freeze(state.recent.filter((id) => id !== brushId)),
              activeByOperation: Object.freeze(activeByOperation),
              updatedAt: new Date().toISOString(),
            });
          }
          '''
          repository = re.sub(r'^          ', '', repository, flags=re.M)
          (ROOT / 'apps/web/src/domains/creator/studio-unified-brush-repository.ts').write_text(repository)

          hook = r'''import { useCallback, useEffect, useState } from "react";

          import {
            STUDIO_UNIFIED_BRUSH_UPDATED_EVENT,
            ensureStudioUnifiedBrushState,
            updateStudioUnifiedBrushState,
            type StudioUnifiedBrushState,
          } from "../studio-unified-brush-repository";

          type Locale = "ko" | "en";

          export function useStudioUnifiedBrushRepository(projectId: string, locale: Locale) {
            const [state, setState] = useState<StudioUnifiedBrushState | null>(null);
            const [error, setError] = useState<string | null>(null);

            const reload = useCallback(() => {
              if (typeof window === "undefined" || !projectId.trim()) return;
              try {
                setState(ensureStudioUnifiedBrushState(window.localStorage, projectId));
                setError(null);
              } catch {
                setError(locale === "ko" ? "브러시 목록을 불러오지 못했습니다." : "Could not load brushes.");
              }
            }, [locale, projectId]);

            useEffect(() => {
              reload();
              if (typeof window === "undefined") return undefined;
              const handleUpdate = (event: Event) => {
                const detail = (event as CustomEvent<unknown>).detail;
                if (!detail || typeof detail !== "object") return;
                const candidate = detail as Partial<StudioUnifiedBrushState>;
                if (candidate.projectId === projectId && candidate.schemaVersion === 1) {
                  setState(candidate as StudioUnifiedBrushState);
                  setError(null);
                }
              };
              const handleStorage = (event: StorageEvent) => {
