name: Studio Hyper3D live acceptance

on:
  push:
    branches:
      - codex/studio-large-epics-closure-20260909
    paths:
      - scripts/verify-studio-hyper3d-live-smoke.mts
      - scripts/blender/studio-generated-model-texture-roundtrip.py
      - .github/workflows/studio-hyper3d-live-acceptance.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-hyper3d-live-acceptance
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      HYPER3D_API_KEY: ${{ secrets.HYPER3D_API_KEY }}
      RODIN_API_KEY: ${{ secrets.RODIN_API_KEY }}
      STUDIO_HYPER3D_LIVE_OUTPUT: artifacts/studio-hyper3d-live
      STATUS_FILE: docs/automation/studio-hyper3d-live-acceptance.json
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Require an explicitly configured provider credential
        run: |
          if [ -z "${HYPER3D_API_KEY:-}" ] && [ -z "${RODIN_API_KEY:-}" ]; then
            echo "Neither HYPER3D_API_KEY nor RODIN_API_KEY is configured." >&2
            exit 78
          fi

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Submit exactly one minimal live Rodin generation
        run: pnpm exec tsx scripts/verify-studio-hyper3d-live-smoke.mts

      - name: Install Blender and glTF validator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender
          pnpm exec playwright install-deps chromium >/dev/null

      - name: Apply a packed texture and round-trip the generated model in Blender
        run: |
          blender --background --factory-startup --python scripts/blender/studio-generated-model-texture-roundtrip.py -- \
            --input artifacts/studio-hyper3d-live/generated.glb \
            --output artifacts/studio-hyper3d-live/generated-painted-roundtrip.glb \
            --receipt artifacts/studio-hyper3d-live/blender-roundtrip.json

      - name: Validate both GLB containers
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          for (const file of [
            'artifacts/studio-hyper3d-live/generated.glb',
            'artifacts/studio-hyper3d-live/generated-painted-roundtrip.glb',
          ]) {
            const bytes = fs.readFileSync(file);
            if (bytes.length < 20 || bytes.toString('ascii', 0, 4) !== 'glTF') {
              throw new Error(`${file} is not a GLB v2 container`);
            }
            if (bytes.readUInt32LE(4) !== 2 || bytes.readUInt32LE(8) !== bytes.length) {
              throw new Error(`${file} has an invalid GLB header`);
            }
            console.log(file, bytes.length, crypto.createHash('sha256').update(bytes).digest('hex'));
          }
          NODE

      - name: Persist non-secret acceptance receipt
        if: success()
        run: |
          mkdir -p "$(dirname "$STATUS_FILE")"
          node <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync('artifacts/studio-hyper3d-live/receipt.json', 'utf8'));
          const blender = JSON.parse(fs.readFileSync('artifacts/studio-hyper3d-live/blender-roundtrip.json', 'utf8'));
          fs.writeFileSync(process.env.STATUS_FILE, JSON.stringify({
            schemaVersion: 1,
            passed: true,
            runId: process.env.GITHUB_RUN_ID,
            headSha: process.env.GITHUB_SHA,
            completedAt: new Date().toISOString(),
            hyper3d: {
              provider: receipt.provider,
              requestIdHash: receipt.requestIdHash,
              promptHash: receipt.promptHash,
              pollCount: receipt.pollCount,
              model: receipt.model,
            },
            blender,
          }, null, 2) + '\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATUS_FILE"
          git commit -m "test(studio): record live Hyper3D and Blender acceptance [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload private execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-hyper3d-live-${{ github.run_id }}
          path: artifacts/studio-hyper3d-live
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
