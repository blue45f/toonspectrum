name: Materialize issue 1253 final VRM admission

on:
  push:
    branches: [fix/real-core-and-main-only-20260910]
    paths: [.github/workflows/materialize-issue-1253-final.yml]

permissions:
  contents: write

concurrency:
  group: materialize-issue-1253-final-vrm-admission
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      NODE_OPTIONS: --max-old-space-size=12288
      PRODUCT_BRANCH: fix/real-core-and-main-only-20260910
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/real-core-and-main-only-20260910
          fetch-depth: 2
          lfs: true
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rev-parse HEAD > "$RUNNER_TEMP/input-head"
          pnpm install --frozen-lockfile --prefer-offline

      - name: Generate and verify exact LFS-backed evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          pnpm exec tsx scripts/generate-vrm-thumbnail-technical-denylist.ts
          pnpm exec tsx scripts/generate-vrm-model-technical-denylist.ts
          node <<'NODE'
          const fs = require("node:fs");
          const thumbnail = JSON.parse(fs.readFileSync("artifacts/studio-vrm-thumbnail-quality-report.json", "utf8"));
          const model = JSON.parse(fs.readFileSync("artifacts/studio-vrm-model-quality-report.json", "utf8"));
          const expected = [
            "avatar-a", "avatar-b", "avatar-c", "bao-samurai", "blue-pixie",
            "bot-bunny", "cosmic-bot", "crowley", "cute-saurus", "eugenia",
            "good-knight", "kage", "lady-fawn", "lady-koi", "lil-ram",
            "mega-angel", "mushroom-fairy", "rubin", "shino", "shion",
            "stitch-witch", "strawberry-princess", "vita", "weird-cat", "yeti-dude",
          ].sort();
          const actual = Object.keys(model.rejected ?? {}).sort();
          if (thumbnail.scanned !== 112 || Object.keys(thumbnail.rejected ?? {}).length !== 0) {
            throw new Error(`thumbnail audit drift: ${thumbnail.scanned}/${Object.keys(thumbnail.rejected ?? {}).length}`);
          }
          if (model.scanned !== 112 || JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`model audit drift: ${model.scanned}/${actual.join(",")}`);
          }
          for (const reason of Object.values(model.rejected ?? {})) {
            if (typeof reason === "string" && (reason.includes("git-lfs-pointer") || reason.startsWith("scan-error:"))) {
              throw new Error(`incomplete LFS evidence: ${reason}`);
            }
          }
          NODE

      - name: Compose both gates into new-project discovery
        run: python3 scripts/patch-vrm-library-quality-gates.py .

      - name: Lint, reproduce, test, typecheck and build
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/web/src/domains/creator/vrm/studio-vrm-thumbnail-quality.ts
            apps/web/src/domains/creator/vrm/studio-vrm-thumbnail-quality.test.ts
            apps/web/src/domains/creator/vrm/studio-vrm-thumbnail-quality-security.test.ts
            apps/web/src/domains/creator/vrm/studio-vrm-production-thumbnail-files.test.ts
            apps/web/src/domains/creator/vrm/studio-vrm-thumbnail-quality-integration.test.ts
            apps/web/src/domains/creator/vrm/studio-vrm-thumbnail-technical-denylist.generated.ts
            apps/web/src/domains/creator/vrm/studio-vrm-model-quality.ts
            apps/web/src/domains/creator/vrm/studio-vrm-model-quality.test.ts
            apps/web/src/domains/creator/vrm/studio-vrm-model-quality-integration.test.ts
            apps/web/src/domains/creator/vrm/studio-vrm-model-technical-denylist.generated.ts
            apps/web/src/domains/creator/vrm/vrm-library.ts
            apps/web/src/domains/creator/vrm/vrm-library.test.ts
            scripts/generate-vrm-thumbnail-technical-denylist.ts
            scripts/generate-vrm-model-technical-denylist.ts
          )
          pnpm exec eslint --fix --no-warn-ignored "${files[@]}"
          thumbnail_before=$(git hash-object apps/web/src/domains/creator/vrm/studio-vrm-thumbnail-technical-denylist.generated.ts)
          model_before=$(git hash-object apps/web/src/domains/creator/vrm/studio-vrm-model-technical-denylist.generated.ts)
          pnpm exec tsx scripts/generate-vrm-thumbnail-technical-denylist.ts >/dev/null
          pnpm exec tsx scripts/generate-vrm-model-technical-denylist.ts >/dev/null
          test "$thumbnail_before" = "$(git hash-object apps/web/src/domains/creator/vrm/studio-vrm-thumbnail-technical-denylist.generated.ts)"
          test "$model_before" = "$(git hash-object apps/web/src/domains/creator/vrm/studio-vrm-model-technical-denylist.generated.ts)"
          pnpm exec eslint --max-warnings=0 --no-warn-ignored "${files[@]}"
          tests=(
            apps/web/src/domains/creator/vrm/studio-vrm-thumbnail-quality.test.ts
            apps/web/src/domains/creator/vrm/studio-vrm-thumbnail-quality-security.test.ts
            apps/web/src/domains/creator/vrm/studio-vrm-production-thumbnail-files.test.ts
            apps/web/src/domains/creator/vrm/studio-vrm-thumbnail-quality-integration.test.ts
            apps/web/src/domains/creator/vrm/studio-vrm-model-quality.test.ts
            apps/web/src/domains/creator/vrm/studio-vrm-model-quality-integration.test.ts
            apps/web/src/domains/creator/vrm/vrm-library.test.ts
          )
          [[ ! -f apps/web/src/domains/creator/vrm/studio-vrm-production-catalog.test.ts ]] || tests+=(apps/web/src/domains/creator/vrm/studio-vrm-production-catalog.test.ts)
          pnpm exec vitest run "${tests[@]}"
          node scripts/validate-architecture.mjs
          pnpm exec tsc -p tsconfig.json --noEmit
          pnpm build
          git diff --check

      - name: Upload exact audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1253-final-vrm-admission-${{ github.run_id }}
          path: artifacts/studio-vrm-*-quality-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit only the verified product state
        shell: bash
        run: |
          set -euo pipefail
          input_head=$(cat "$RUNNER_TEMP/input-head")
          git fetch origin "${PRODUCT_BRANCH}"
          remote_head=$(git rev-parse "origin/${PRODUCT_BRANCH}")
          if [[ "$remote_head" != "$input_head" ]]; then
            echo "Remote branch moved from $input_head to $remote_head; refusing non-fast-forward overwrite." >&2
            exit 1
          fi
          rm -rf artifacts
          rm -f \
            .github/workflows/materialize-issue-1253-final.yml \
            .github/workflows/push-audited-recovery-tags.yml \
            .github/workflows/fix-issue-1253-recovery-lint.yml \
            .github/workflows/recover-issue-1253.yml \
            scripts/patch-vrm-library-quality-gates.py
          git add -A
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m 'fix(vrm): materialize audited thumbnail and model admission (#1253)'
          git push origin "HEAD:${PRODUCT_BRANCH}"
