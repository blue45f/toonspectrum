name: Materialize issue 1253 final VRM admission

on:
  push:
    branches: [fix/real-core-and-main-only-20260910]
    paths: [.github/workflows/materialize-issue-1253-final.yml]

permissions:
  contents: write

concurrency:
  group: materialize-issue-1253-final-vrm-admission-v2
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCT_BRANCH: fix/real-core-and-main-only-20260910
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/real-core-and-main-only-20260910
          fetch-depth: 2
          persist-credentials: true

      - name: Compose and commit the reviewed admission fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          input_head=$(git rev-parse HEAD)

          python3 -m py_compile scripts/patch-vrm-library-quality-gates.py
          python3 scripts/patch-vrm-library-quality-gates.py .

          python3 - <<'PY'
          from pathlib import Path

          library = Path("apps/web/src/domains/creator/vrm/vrm-library.ts").read_text(encoding="utf-8")
          test = Path("apps/web/src/domains/creator/vrm/vrm-library.test.ts").read_text(encoding="utf-8")
          required = (
              "isStudioVrmProductionThumbnailUrl(sample.thumbnailUrl)",
              "isStudioVrmTechnicallyAdmittedThumbnail(sample.id)",
              "isStudioVrmProductionModelUrl(sample.url)",
              "isStudioVrmTechnicallyAdmittedModel(sample.id)",
          )
          missing = [marker for marker in required if marker not in library]
          if missing:
              raise SystemExit(f"missing admission markers: {missing}")
          if "const names = SAMPLE_VRMS.map((sample) => sample.name);" not in test:
              raise SystemExit("public VRM name contract was not updated")
          PY

          git fetch origin "${PRODUCT_BRANCH}"
          remote_head=$(git rev-parse "origin/${PRODUCT_BRANCH}")
          if [[ "$remote_head" != "$input_head" ]]; then
            echo "Remote branch moved from $input_head to $remote_head; refusing non-fast-forward overwrite." >&2
            exit 1
          fi

          rm -rf scripts/__pycache__
          rm -f \
            .github/workflows/materialize-issue-1253-final.yml \
            .github/workflows/push-audited-recovery-tags.yml \
            .github/workflows/fix-issue-1253-recovery-lint.yml \
            .github/workflows/recover-issue-1253.yml \
            scripts/patch-vrm-library-quality-gates.py
          git add -A
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m 'fix(vrm): enforce audited thumbnail and model admission (#1253)'
          git push origin "HEAD:${PRODUCT_BRANCH}"
