name: Studio drawing input lab one-shot

on:
  push:
    branches: [feat/studio-drawing-input-lab-20260909]
    paths:
      - .github/workflows/studio-drawing-input-lab-once.yml
      - scripts/apply-studio-drawing-input-lab.mjs

permissions:
  contents: write

concurrency:
  group: studio-drawing-input-lab-once
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15-intel
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/studio-drawing-input-lab-20260909
          fetch-depth: 1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply verified Drawing Input Lab patch
        run: node scripts/apply-studio-drawing-input-lab.mjs

      - name: Format changed product and test sources
        run: |
          pnpm exec prettier --write \
            apps/web/src/domains/creator/StudioPressureCurveGraph.tsx \
            apps/web/src/domains/creator/StudioStylusPressurePanel.tsx \
            apps/web/src/domains/creator/StudioStylusPressurePanel.test.tsx \
            apps/web/src/domains/creator/StudioStylusPressurePanel.interaction.test.tsx \
            apps/web/src/domains/creator/brush/studio-stylus-pressure-profile.ts \
            apps/web/src/domains/creator/brush/studio-stylus-pressure-profile-store.ts \
            apps/web/src/domains/creator/brush/studio-stylus-pressure-profile.test.ts \
            apps/web/src/domains/creator/brush/studio-pen-button-policy.ts \
            apps/web/src/domains/creator/brush/studio-pen-button-policy-store.ts \
            apps/web/src/domains/creator/brush/studio-pen-button-policy.test.ts \
            apps/web/src/domains/creator/brush/studio-drawing-input-profile-integration.test.ts \
            apps/web/src/domains/creator/brush/studio-drawing-input-preference-stores.test.ts \
            apps/web/src/domains/creator/brush/studio-draw-pointer-start-plan.ts \
            apps/web/src/domains/creator/brush/studio-draw-pointer-start-plan-boundary.test.ts \
            apps/web/src/domains/creator/brush/studio-draw-rendering-boundary.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-velocity-pressure.ts \
            apps/web/src/domains/creator/canvas/studio-pointer-input.ts \
            apps/web/src/domains/creator/canvas/studio-pointer-input-pen-buttons.test.ts \
            apps/web/src/domains/creator/canvas/studio-pointer-release-endpoint-plan.ts \
            apps/web/src/domains/creator/studio-cuttoon-editor/studio-cuttoon-stage-pointers-down-draw.ts \
            apps/web/src/domains/creator/studio-cuttoon-editor/studio-cuttoon-stage-pointers-freehand.ts \
            apps/web/src/domains/creator/studio-cuttoon-editor/studio-cuttoon-stage-pointers-publish.ts \
            apps/web/src/domains/creator/studio-cuttoon-editor/studio-cuttoon-stage-pointers-release.ts \
            apps/web/src/domains/creator/studio-browser-kv-authority-boundary.test.ts \
            docs/studio-drawing-input-lab-benchmark-2026-09-09.md
          git diff --check

      - name: Lint changed TypeScript sources
        run: |
          pnpm exec eslint --max-warnings=0 \
            apps/web/src/domains/creator/StudioPressureCurveGraph.tsx \
            apps/web/src/domains/creator/StudioStylusPressurePanel.tsx \
            apps/web/src/domains/creator/StudioStylusPressurePanel.test.tsx \
            apps/web/src/domains/creator/StudioStylusPressurePanel.interaction.test.tsx \
            apps/web/src/domains/creator/brush/studio-stylus-pressure-profile.ts \
            apps/web/src/domains/creator/brush/studio-stylus-pressure-profile-store.ts \
            apps/web/src/domains/creator/brush/studio-stylus-pressure-profile.test.ts \
            apps/web/src/domains/creator/brush/studio-pen-button-policy.ts \
            apps/web/src/domains/creator/brush/studio-pen-button-policy-store.ts \
            apps/web/src/domains/creator/brush/studio-pen-button-policy.test.ts \
            apps/web/src/domains/creator/brush/studio-drawing-input-profile-integration.test.ts \
            apps/web/src/domains/creator/brush/studio-drawing-input-preference-stores.test.ts \
            apps/web/src/domains/creator/brush/studio-draw-pointer-start-plan.ts \
            apps/web/src/domains/creator/brush/studio-draw-pointer-start-plan-boundary.test.ts \
            apps/web/src/domains/creator/brush/studio-draw-rendering-boundary.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-velocity-pressure.ts \
            apps/web/src/domains/creator/canvas/studio-pointer-input.ts \
            apps/web/src/domains/creator/canvas/studio-pointer-input-pen-buttons.test.ts \
            apps/web/src/domains/creator/canvas/studio-pointer-release-endpoint-plan.ts \
            apps/web/src/domains/creator/studio-cuttoon-editor/studio-cuttoon-stage-pointers-down-draw.ts \
            apps/web/src/domains/creator/studio-cuttoon-editor/studio-cuttoon-stage-pointers-freehand.ts \
            apps/web/src/domains/creator/studio-cuttoon-editor/studio-cuttoon-stage-pointers-publish.ts \
            apps/web/src/domains/creator/studio-cuttoon-editor/studio-cuttoon-stage-pointers-release.ts \
            apps/web/src/domains/creator/studio-browser-kv-authority-boundary.test.ts

      - name: Validate architecture and TypeScript
        run: |
          pnpm run validate:architecture
          pnpm run typecheck

      - name: Run Drawing Input Lab and adjacent regression tests
        run: |
          pnpm exec vitest run \
            apps/web/src/domains/creator/StudioStylusPressurePanel.test.tsx \
            apps/web/src/domains/creator/StudioStylusPressurePanel.interaction.test.tsx \
            apps/web/src/domains/creator/StudioPressureCurveGraph.test.tsx \
            apps/web/src/domains/creator/StudioPressureCurveGraph.interaction.test.tsx \
            apps/web/src/domains/creator/brush/studio-stylus-pressure-profile.test.ts \
            apps/web/src/domains/creator/brush/studio-pen-button-policy.test.ts \
            apps/web/src/domains/creator/brush/studio-drawing-input-profile-integration.test.ts \
            apps/web/src/domains/creator/brush/studio-drawing-input-preference-stores.test.ts \
            apps/web/src/domains/creator/brush/studio-draw-pointer-start-plan.test.ts \
            apps/web/src/domains/creator/brush/studio-draw-pointer-start-plan-boundary.test.ts \
            apps/web/src/domains/creator/brush/studio-draw-rendering-boundary.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-velocity-pressure.test.ts \
            apps/web/src/domains/creator/canvas/studio-pointer-input.test.ts \
            apps/web/src/domains/creator/canvas/studio-pointer-input-pen-buttons.test.ts \
            apps/web/src/domains/creator/canvas/studio-pointer-release-endpoint-plan.test.ts \
            apps/web/src/domains/creator/studio-browser-kv-authority-boundary.test.ts

      - name: Commit verified implementation and remove one-shot tooling
        run: |
          git rm scripts/apply-studio-drawing-input-lab.mjs
          git rm .github/workflows/studio-drawing-input-lab-once.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(studio): ship professional drawing input lab"
          git push origin HEAD:feat/studio-drawing-input-lab-20260909
