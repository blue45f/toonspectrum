name: Feedback source snapshot
on:
  push:
    branches: [feat/feedback-community-20260906]
    paths: [.github/workflows/feedback-source-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package tracked source only (no environment files or credentials)
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, zipfile
          roots = ('src/', 'components/', 'lib/', 'packages/core/', 'apps/api/', 'tests/', 'e2e/', 'scripts/', '.github/', '.agents/')
          suffixes = {'.ts', '.tsx', '.js', '.jsx', '.mjs', '.mts', '.cjs', '.cts', '.json', '.yaml', '.yml', '.css', '.md', '.html', '.sql'}
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with zipfile.ZipFile('feedback-source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
            for name in tracked:
              path = pathlib.Path(name)
              if not name or not path.is_file() or path.is_symlink():
                continue
              if path.name.startswith('.env') or path.suffix not in suffixes:
                continue
              if '/' not in name or name.startswith(roots):
                archive.write(path, name)
            archive.writestr('SOURCE_COMMIT.txt', subprocess.check_output(['git', 'rev-parse', 'HEAD']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: feedback-source
          path: feedback-source.zip
          retention-days: 2
