name: Apply exact median performance patch

on:
  push:
    branches: [fix/studio-brush-filter-stability-20260906]
    paths: ['scripts/.studio-median-performance.patch']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Apply byte-parity verified implementation on the feature branch only
        run: |
          test "$(git hash-object scripts/.studio-median-performance.patch)" = 13353f05f3a277f7b5cbb417002b6fb14c16b1d1
          git apply --check scripts/.studio-median-performance.patch
          git apply --index scripts/.studio-median-performance.patch
          git rm scripts/.studio-median-performance.patch .github/workflows/apply-studio-median-performance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "perf(studio): bound median filter work with byte-exact sliding histograms"
          git push origin HEAD:refs/heads/fix/studio-brush-filter-stability-20260906
          git rev-parse HEAD
