name: Character 3D unified UX patch

on:
  push:
    branches:
      - feat/character-modeler-parity-20260909
    paths:
      - ".github/workflows/character-3d-ux-patch-20260909.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/character-modeler-parity-20260909
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Collapse duplicate 3D launchers into one Studio entry
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("apps/web/src/domains/creator/StudioToolBeltCreateModeGroups.tsx")
          source = path.read_text(encoding="utf-8")

          for line in [
              "  Boxes,\n",
              "  UsersRound,\n",
              "  PersonStanding,\n",
              "  Sparkles,\n",
              "    bg3dOpen,\n",
              "    mannequinPoserOpen,\n",
              "    poserVrmOpen,\n",
              "    characterShaperOpen,\n",
              "    setBg3dOpen,\n",
              "    setMannequinPoserOpen,\n",
              "    setPoserVrmOpen,\n",
              "    setCharacterShaperOpen,\n",
          ]:
              source = source.replace(line, "")

          start = '      {studioUiDensityAllows(uiDensityMode, "toolbar-reference") ? (\n'
          end = '\n\n      {(studioUiDensityAllows(uiDensityMode, "toolbar-scene") || activeToolbarGroup === "bgGroup") ? ('
          if source.count(start) != 1 or source.count(end) != 1:
              raise SystemExit("3D/reference toolbar markers changed; refusing unsafe rewrite")
          left, rest = source.split(start, 1)
          _, right = rest.split(end, 1)
          reference = '''      {studioUiDensityAllows(uiDensityMode, "toolbar-reference") ? (\n        <>\n          <StudioToolbarDivider label="참조" />\n          <StudioToolbarCluster label="참고 이미지">\n            <StudioToolBeltHintTarget hint={hints.reference}>\n              <button\n                type="button"\n                onClick={() => setReferencePanelOpen((v) => !v)}\n                onMouseEnter={preloadStudioReferencePanel}\n                onFocus={preloadStudioReferencePanel}\n                className={cn(toolBtn(referencePanelOpen), "border-accent/25 bg-accent-soft/25 text-accent hover:bg-accent-soft/40")}\n                aria-pressed={referencePanelOpen}\n              >\n                <PictureInPicture2\n                  size={STUDIO_ICON_SIZE.toolCompact}\n                  strokeWidth={STUDIO_ICON_STROKE}\n                  aria-hidden\n                  className={studioToolIconClass({ tone: "accent" })}\n                />\n                참고 이미지\n              </button>\n            </StudioToolBeltHintTarget>\n          </StudioToolbarCluster>\n        </>\n      ) : null}'''
          source = left + reference + end + right
          source = source.replace('<StudioToolbarDivider label="장면" />', '<StudioToolbarDivider label="3D" />')
          source = source.replace('label="배경·톤"', 'label="3D 제작·배경"')
          source = source.replace('                  배경\n                  <ChevronDown', '                  3D 스튜디오\n                  <ChevronDown')
          source = source.replace('fallback={<StudioPanelLoading label="배경 메뉴를 여는 중..." />}', 'fallback={<StudioPanelLoading label="3D 스튜디오를 여는 중..." />}')

          forbidden = ["3D 캐릭터", "캐릭터 셰이퍼", "3D 데생 인형", "3D 배경"]
          for label in forbidden:
              if label in source:
                  raise SystemExit(f"duplicate 3D launcher remains: {label}")
          if source.count("3D 스튜디오") < 1:
              raise SystemExit("unified 3D Studio entry was not created")
          path.write_text(source, encoding="utf-8")
          PY

      - name: Add IA regression test
        run: |
          cat > apps/web/src/domains/creator/studio-unified-3d-entry.test.ts <<'TS'
          import { readFileSync } from "node:fs";
          import { describe, expect, it } from "vitest";

          const source = readFileSync(
            new URL("./StudioToolBeltCreateModeGroups.tsx", import.meta.url),
            "utf8",
          );

          describe("Studio unified 3D entry", () => {
            it("offers one user-facing 3D Studio entry instead of four competing tools", () => {
              expect(source).toContain("3D 스튜디오");
              expect(source).not.toContain(">3D 캐릭터<");
              expect(source).not.toContain(">캐릭터 셰이퍼<");
              expect(source).not.toContain(">3D 데생 인형<");
              expect(source).not.toContain(">3D 배경<");
              expect(source).toContain("참고 이미지");
            });
          });
          TS

      - name: Validate the unified entry and CI regression fixes
        run: |
          pnpm exec eslint --max-warnings=0 \
            apps/web/src/domains/creator/StudioToolBeltCreateModeGroups.tsx \
            apps/web/src/domains/creator/StudioSceneToolPopoverBody.tsx \
            apps/web/src/domains/creator/studio-unified-3d-entry.test.ts \
            apps/web/src/domains/creator/brush/studio-stylus-pressure-profile.test.ts \
            apps/web/src/domains/creator/export/studio-download-package.test.ts
          pnpm exec vitest run \
            apps/web/src/domains/creator/studio-unified-3d-entry.test.ts \
            apps/web/src/domains/creator/brush/studio-stylus-pressure-profile.test.ts \
            apps/web/src/domains/creator/export/studio-download-package.test.ts
          pnpm exec tsc -p tsconfig.json --noEmit --incremental false

      - name: Commit validated source changes and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/character-3d-ux-patch-20260909.yml
          git add \
            apps/web/src/domains/creator/StudioToolBeltCreateModeGroups.tsx \
            apps/web/src/domains/creator/studio-unified-3d-entry.test.ts
          git commit -m "feat(studio): unify 3D tools into one guided workflow"
          git push origin HEAD:feat/character-modeler-parity-20260909
