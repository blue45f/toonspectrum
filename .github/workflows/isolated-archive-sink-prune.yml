name: Isolated archive sink prune

on:
  pull_request:
    branches:
      - "ops/archive-sink-prune-base-20260910-1722"
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: isolated-archive-sink-prune-20260910-1722
  cancel-in-progress: true

jobs:
  prune:
    if: >-
      github.repository == 'blue45f/toonspectrum' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ops/archive-sink-prune-trigger-20260910-1722' &&
      github.base_ref == 'ops/archive-sink-prune-base-20260910-1722'
    runs-on: macos-14
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TRIGGER_PR: ${{ github.event.pull_request.number }}
      TRIGGER_HEAD: ${{ github.head_ref }}
      TRIGGER_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      TRIGGER_BASE: ${{ github.base_ref }}
      TRIGGER_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Delete exact zero-diff archive sink and retire this runner
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const repository = process.env.REPO;
          const [owner, repo] = repository.split('/');
          const token = process.env.GH_TOKEN;
          const triggerPr = Number(process.env.TRIGGER_PR);
          const triggerHead = process.env.TRIGGER_HEAD;
          const triggerHeadSha = process.env.TRIGGER_HEAD_SHA;
          const triggerBase = process.env.TRIGGER_BASE;
          const triggerBaseSha = process.env.TRIGGER_BASE_SHA;
          const target = 'ops/branch-prune-sink-20260910-1702';
          const expectedSha = '10ccc636ee0ee4150193b3991aeed4c08662b331';
          const apiRoot = 'https://api.github.com';
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'toonspectrum-isolated-archive-sink-prune',
          };

          class HttpError extends Error {
            constructor(status, method, path, payload) {
              super(`${method} ${path} -> ${status}`);
              this.status = status;
              this.payload = payload;
            }
          }

          async function request(path, init = {}) {
            const method = init.method || 'GET';
            const response = await fetch(`${apiRoot}${path}`, {
              ...init,
              headers: {
                ...headers,
                ...(init.body ? { 'Content-Type': 'application/json' } : {}),
                ...(init.headers || {}),
              },
            });
            if (response.status === 204) return null;
            const text = await response.text();
            let payload = null;
            try { payload = text ? JSON.parse(text) : null; } catch { payload = text; }
            if (!response.ok) throw new HttpError(response.status, method, path, payload);
            return payload;
          }

          async function maybe(path) {
            try { return await request(path); }
            catch (error) { if (error.status === 404) return null; throw error; }
          }

          const encodeRef = (branch) => branch.split('/').map(encodeURIComponent).join('/');
          const openPulls = async (params) => request(`/repos/${owner}/${repo}/pulls?${new URLSearchParams({ state: 'open', per_page: '1', ...params })}`);
          const hasOpenReference = async (branch) => {
            const [heads, bases] = await Promise.all([
              openPulls({ head: `${owner}:${branch}` }),
              openPulls({ base: branch }),
            ]);
            return heads.length > 0 || bases.length > 0;
          };

          (async () => {
            const repoInfo = await request(`/repos/${owner}/${repo}`);
            if (repoInfo.default_branch !== 'main') throw new Error(`default branch changed to ${repoInfo.default_branch}`);
            const main = await request(`/repos/${owner}/${repo}/branches/main`);
            const mainSha = main.commit.sha;
            const canonicalPr = await request(`/repos/${owner}/${repo}/pulls/1250`);
            if (!canonicalPr.merged_at || canonicalPr.base?.ref !== 'main' || canonicalPr.head?.repo?.full_name !== repository) {
              throw new Error('canonical PR #1250 is not a verified merged main PR');
            }
            const canonicalSha = canonicalPr.merge_commit_sha;
            const reachability = await request(`/repos/${owner}/${repo}/compare/${mainSha}...${canonicalSha}`);
            if (Number(reachability.ahead_by ?? -1) !== 0) throw new Error('canonical #1250 is not reachable from current main');
            const canonicalCommit = await request(`/repos/${owner}/${repo}/commits/${canonicalSha}`);
            const canonicalTree = canonicalCommit.commit?.tree?.sha;

            let decision = 'preserved';
            let evidence = 'unknown';
            const branchPath = `/repos/${owner}/${repo}/branches/${encodeRef(target)}`;
            const current = await maybe(branchPath);
            if (!current) {
              decision = 'already_missing';
              evidence = 'branch_absent';
            } else if (current.commit?.sha !== expectedSha) {
              evidence = `head_sha_changed:${current.commit?.sha || 'unknown'}`;
            } else if (current.protected) {
              evidence = 'protected_branch';
            } else if (await hasOpenReference(target)) {
              evidence = 'open_pull_request_reference';
            } else {
              const commit = await request(`/repos/${owner}/${repo}/commits/${expectedSha}`);
              const message = commit.commit?.message || '';
              if (commit.commit?.tree?.sha !== canonicalTree) {
                evidence = 'tree_differs_from_canonical_main_snapshot';
              } else if (!message.includes('archive and retire drain-superseded-actions branch') || !message.includes('No file changes')) {
                evidence = 'archive_commit_proof_changed';
              } else {
                const runs = await request(`/repos/${owner}/${repo}/actions/runs?${new URLSearchParams({ branch: target, per_page: '100' })}`);
                if ((runs.workflow_runs || []).some((run) => run.status !== 'completed')) {
                  evidence = 'active_workflow_run';
                } else {
                  const finalBranch = await maybe(branchPath);
                  const finalRef = await maybe(`/repos/${owner}/${repo}/git/ref/heads/${encodeRef(target)}`);
                  if (!finalBranch || finalBranch.commit?.sha !== expectedSha || finalBranch.protected || !finalRef || finalRef.object?.sha !== expectedSha) {
                    evidence = 'changed_during_final_recheck';
                  } else if (await hasOpenReference(target)) {
                    evidence = 'new_open_pull_request';
                  } else {
                    await request(`/repos/${owner}/${repo}/git/refs/heads/${encodeRef(target)}`, { method: 'DELETE' });
                    decision = 'deleted';
                    evidence = 'exact_zero_diff_archive_sink';
                  }
                }
              }
            }

            const report = [
              '# Isolated archive sink prune',
              '',
              `- Target: \`${target}\``,
              `- Expected SHA: \`${expectedSha}\``,
              `- Decision: **${decision}**`,
              `- Evidence: \`${evidence}\``,
              '',
            ].join('\n');
            console.log(report);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${report}\n`);

            const [currentHead, currentBase] = await Promise.all([
              request(`/repos/${owner}/${repo}/branches/${encodeRef(triggerHead)}`),
              request(`/repos/${owner}/${repo}/branches/${encodeRef(triggerBase)}`),
            ]);
            if (currentHead.commit?.sha !== triggerHeadSha || currentHead.protected) throw new Error('trigger head moved or became protected');
            if (currentBase.commit?.sha !== triggerBaseSha || currentBase.protected) throw new Error('trigger base moved or became protected');
            await request(`/repos/${owner}/${repo}/pulls/${triggerPr}`, { method: 'PATCH', body: JSON.stringify({ state: 'closed' }) });
            await request(`/repos/${owner}/${repo}/git/refs/heads/${encodeRef(triggerHead)}`, { method: 'DELETE' });
            await request(`/repos/${owner}/${repo}/git/refs/heads/${encodeRef(triggerBase)}`, { method: 'DELETE' });

            const cleanup = `\n## Isolated runner cleanup\n\n- Closed temporary PR: #${triggerPr}\n- Deleted temporary head/base branches\n- No file or commit was merged into \`main\`.\n`;
            console.log(cleanup);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, cleanup);
            if (!['deleted', 'already_missing'].includes(decision)) process.exitCode = 2;
          })().catch((error) => {
            console.error(error.stack || String(error));
            process.exitCode = 1;
          });
          NODE
