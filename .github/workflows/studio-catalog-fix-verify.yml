name: Studio catalog fix verification
on:
  push:
    branches: [feat/studio-asset-browser-quality-20260906]
    paths: [.github/workflows/studio-catalog-fix-verify.yml]
permissions:
  contents: read
jobs:
  inspect-prepared-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          show-progress: false
      - name: Read every prepared change without applying it
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          encoded=pathlib.Path('.ci/studio-catalog-fix.b64').read_text().strip()
          if len(encoded)>20000: raise ValueError('transport budget')
          patch=lzma.decompress(base64.b64decode(encoded,validate=True),memlimit=64*1024*1024)
          if len(patch)!=30149: raise ValueError('unexpected patch size')
          print('PATCH_SHA256',hashlib.sha256(patch).hexdigest(),flush=True)
          print(subprocess.check_output(['git','apply','--numstat'],input=patch).decode(),flush=True)
          print('BEGIN_PREPARED_PATCH\n'+patch.decode()+'\nEND_PREPARED_PATCH',flush=True)
          subprocess.run(['git','apply','--check'],input=patch,check=True)
          PY
