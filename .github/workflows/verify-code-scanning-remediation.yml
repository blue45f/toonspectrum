name: Verify code-scanning remediation

on:
  push:
    branches:
      - fix/code-scanning-alerts-20260910-v3
    paths:
      - .github/workflows/verify-code-scanning-remediation.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: remediate-code-scanning-alerts-20260910-v3
  cancel-in-progress: false

jobs:
  codeql-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/code-scanning-alerts-20260910-v3
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze remediated branch
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript/security-remediation
          ref: refs/heads/fix/code-scanning-alerts-20260910-v3

      - name: Require zero open alerts on the analyzed branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Code scanning indexing can lag briefly after SARIF upload.
          for attempt in $(seq 1 12); do
            gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&ref=refs%2Fheads%2Ffix%2Fcode-scanning-alerts-20260910-v3&per_page=100" \
              --slurp | jq 'add // []' > /tmp/branch-alerts.json
            count="$(jq 'length' /tmp/branch-alerts.json)"
            if [[ "$count" == "0" ]]; then
              break
            fi
            [[ "$attempt" == "12" ]] || sleep 10
          done

          count="$(jq 'length' /tmp/branch-alerts.json)"
          {
            echo "## Remediated branch CodeQL result"
            echo
            echo "Open alerts: **${count}**"
            if [[ "$count" != "0" ]]; then
              echo
              echo '| Alert | Severity | Rule | Location | State |'
              echo '|---:|---|---|---|---|'
              jq -r '.[] | [
                ("#" + (.number|tostring)),
                (.rule.security_severity_level // .rule.severity // "unknown"),
                (.rule.id // "unknown"),
                (((.most_recent_instance.location.path // "unknown") + ":" + ((.most_recent_instance.location.start_line // 0)|tostring))),
                (.state // "unknown")
              ] | "| " + join(" | ") + " |"' /tmp/branch-alerts.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$count" != "0" ]]; then
            jq -r '.[] | "UNRESOLVED #\(.number) \(.rule.id) \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)"' /tmp/branch-alerts.json
            exit 1
          fi
