name: Code scanning autofix

on:
  workflow_dispatch:
  push:
    branches:
      - codex/code-scanning-remediation-20260908
    paths:
      - .github/workflows/code-scanning-autofix.yml

permissions:
  contents: write
  security-events: write
  pull-requests: write

concurrency:
  group: code-scanning-autofix-remediation
  cancel-in-progress: false

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      TARGET_BRANCH: codex/code-scanning-remediation-20260908
    steps:
      - name: Request and commit every available CodeQL autofix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          repository = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          target_branch = os.environ["TARGET_BRANCH"]
          target_ref = f"refs/heads/{target_branch}"
          base = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "toonspectrum-code-scanning-autofix",
          }

          def request(method, path, payload=None, allow=(200, 201, 202, 204)):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=90) as response:
                      raw = response.read()
                      body = json.loads(raw) if raw else None
                      return response.status, body
              except urllib.error.HTTPError as error:
                  raw = error.read().decode("utf-8", errors="replace")
                  try:
                      body = json.loads(raw) if raw else None
                  except json.JSONDecodeError:
                      body = raw
                  if error.code in allow:
                      return error.code, body
                  raise RuntimeError(f"{method} {path} -> HTTP {error.code}: {body}") from error

          alerts = []
          page = 1
          while True:
              _, batch = request("GET", f"/code-scanning/alerts?state=open&tool_name=CodeQL&per_page=100&page={page}")
              alerts.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          results = []
          for alert in alerts:
              number = alert["number"]
              entry = {
                  "number": number,
                  "rule": (alert.get("rule") or {}).get("id"),
                  "path": (((alert.get("most_recent_instance") or {}).get("location") or {}).get("path")),
                  "status": "pending",
              }
              try:
                  status, body = request(
                      "POST",
                      f"/code-scanning/alerts/{number}/autofix",
                      {},
                      allow=(200, 201, 202, 204, 400, 403, 404, 409, 422),
                  )
                  if status >= 400:
                      entry["status"] = "unavailable"
                      entry["detail"] = body
                      results.append(entry)
                      print("AUTOFIX_UNAVAILABLE=" + json.dumps(entry, ensure_ascii=False, separators=(",", ":")))
                      continue

                  autofix = body or {}
                  for _ in range(90):
                      poll_status, poll_body = request(
                          "GET",
                          f"/code-scanning/alerts/{number}/autofix",
                          allow=(200, 202, 400, 403, 404, 409, 422),
                      )
                      if poll_status >= 400:
                          autofix = {"status": "error", "detail": poll_body}
                          break
                      autofix = poll_body or {}
                      state = autofix.get("status")
                      if state in {"ready", "error", "outdated"}:
                          break
                      time.sleep(2)

                  if autofix.get("status") != "ready":
                      entry["status"] = "not-ready"
                      entry["detail"] = autofix
                      results.append(entry)
                      print("AUTOFIX_NOT_READY=" + json.dumps(entry, ensure_ascii=False, separators=(",", ":")))
                      continue

                  commit_status, commit_body = request(
                      "POST",
                      f"/code-scanning/alerts/{number}/autofix/commits",
                      {"target_ref": target_ref},
                      allow=(200, 201, 202, 400, 403, 404, 409, 422),
                  )
                  if commit_status >= 400:
                      entry["status"] = "commit-failed"
                      entry["detail"] = commit_body
                  else:
                      entry["status"] = "committed"
                      entry["commit"] = commit_body
                  results.append(entry)
                  print("AUTOFIX_RESULT=" + json.dumps(entry, ensure_ascii=False, separators=(",", ":")))
              except Exception as error:
                  entry["status"] = "exception"
                  entry["detail"] = str(error)
                  results.append(entry)
                  print("AUTOFIX_EXCEPTION=" + json.dumps(entry, ensure_ascii=False, separators=(",", ":")))

          with open("code-scanning-autofix-results.json", "w", encoding="utf-8") as output:
              json.dump(results, output, ensure_ascii=False, indent=2)

          committed = sum(item["status"] == "committed" for item in results)
          unavailable = sum(item["status"] == "unavailable" for item in results)
          print(f"AUTOFIX_TOTAL={len(results)}")
          print(f"AUTOFIX_COMMITTED={committed}")
          print(f"AUTOFIX_UNAVAILABLE={unavailable}")
          PY

      - name: Upload autofix results
        uses: actions/upload-artifact@v4
        with:
          name: code-scanning-autofix-results
          path: code-scanning-autofix-results.json
          if-no-files-found: error
          retention-days: 1
