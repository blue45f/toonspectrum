name: WebGPU v2 source bootstrap

on:
  push:
    branches:
      - feat/webgpu-brush-engine-v2-benchmark-20260904
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webgpu-v2-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restore-source:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      PAYLOAD_ARCHIVE: /tmp/webgpu-v2-payload.tar.xz
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Restore and persist candidate source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find .bootstrap/webgpu-v2 -maxdepth 1 -type f -name 'part-*' | sort)
          test "${#parts[@]}" -eq 7
          cat "${parts[@]}" | base64 --decode > "$PAYLOAD_ARCHIVE"
          xz --test "$PAYLOAD_ARCHIVE"
          echo "candidate archive sha256=$(sha256sum "$PAYLOAD_ARCHIVE" | cut -d' ' -f1)"
          if tar -tJf "$PAYLOAD_ARCHIVE" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "unsafe path in candidate archive" >&2
            exit 1
          fi
          tar -xJf "$PAYLOAD_ARCHIVE"
          rm -rf .bootstrap/webgpu-v2
          rm -f .github/workflows/webgpu-v2-working-snapshot.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          HUSKY=0 git commit -m "feat(brush): materialize WebGPU v2 benchmark candidate"
          git push origin "HEAD:${{ github.ref_name }}"
