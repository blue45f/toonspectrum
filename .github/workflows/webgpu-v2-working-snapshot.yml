name: WebGPU v2 source bootstrap

on:
  push:
    branches:
      - feat/webgpu-brush-engine-v2-benchmark-20260904
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webgpu-v2-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restore-source:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Restore and persist candidate source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path, PurePosixPath
          import base64
          import hashlib
          import io
          import tarfile

          parts = sorted(Path('.bootstrap/webgpu-v2').glob('part-*'))
          if len(parts) != 7:
              raise SystemExit(f'expected 7 payload parts, got {len(parts)}')
          encoded = ''.join(part.read_text(encoding='utf-8').split())
          payload = base64.b64decode(encoded, validate=True)
          print(f'candidate archive sha256={hashlib.sha256(payload).hexdigest()}')
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:xz') as archive:
              members = archive.getmembers()
              if not members:
                  raise SystemExit('candidate archive is empty')
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe path in candidate archive: {member.name}')
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'unsupported archive member: {member.name}')
              archive.extractall('.', members=members)
          '@ | python -
          Remove-Item -Recurse -Force .bootstrap/webgpu-v2
          Remove-Item -Force .github/workflows/webgpu-v2-working-snapshot.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $env:HUSKY = "0"
          git commit -m "feat(brush): materialize WebGPU v2 benchmark candidate"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
