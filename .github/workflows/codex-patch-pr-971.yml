name: Codex patch PR 971

on:
  push:
    branches: [feat/now-daily-creator-dashboard-20260909]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[codex-patch-done-971]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/now-daily-creator-dashboard-20260909
      - name: Apply focused accessibility fix
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/web/src/domains/creator-resources/NowPage.tsx')
          source = path.read_text()
          old = '''                <label
                  key={step.id}'''
          new = '''                <label
                  aria-label={`${step.label}: ${step.detail}`}
                  key={step.id}'''
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one target, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
      - name: Commit repair and remove patch workflow
        run: |
          rm .github/workflows/codex-patch-pr-971.yml
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add apps/web/src/domains/creator-resources/NowPage.tsx .github/workflows/codex-patch-pr-971.yml
          git commit -m "fix(now): associate progress labels [codex-patch-done-971]"
          git push origin HEAD:feat/now-daily-creator-dashboard-20260909
