name: Studio wearable quality audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/domains/creator/vrm/**'
      - 'public/assets/3d/**'
      - 'scripts/*wearable*'
      - '.github/workflows/studio-wearable-quality-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wearable-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  wearable-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify asset, head fitting, UI and document contracts
        run: pnpm exec vitest run src/domains/creator/vrm/studio-vrm-headwear-fit.test.ts src/domains/creator/vrm/studio-vrm-wearable-v5.test.ts src/domains/creator/vrm/studio-vrm-prop-rig.test.ts src/domains/creator/vrm/studio-vrm-props.test.ts src/domains/creator/vrm/studio-vrm-prop-selection.test.ts src/domains/creator/vrm/StudioVrmPropPanel.quality.test.tsx src/domains/creator/vrm/StudioVrmPropPanel.test.tsx src/domains/creator/studio-everyday-props-pack-v4.test.ts src/domains/creator/vrm/studio-vrm-wardrobe.test.ts src/domains/creator/vrm/studio-vrm-skinned-garment.test.ts
      - name: Validate actual committed GLBs and their provenance
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import validator from 'gltf-validator';
          const assets=JSON.parse(fs.readFileSync('public/assets/3d/wearable-v5-manifest.json','utf8')).assets;
          const reports=[];
          for(const asset of assets){
            const bytes=fs.readFileSync('public/assets/3d/'+asset.file);
            if(createHash('sha256').update(bytes).digest('hex')!==asset.sha256)throw new Error('Manifest hash mismatch: '+asset.id);
            const result=await validator.validateBytes(new Uint8Array(bytes),{uri:asset.file,maxIssues:30});
            reports.push({id:asset.id,issues:result.issues,info:result.info});
          }
          fs.mkdirSync('.artifacts',{recursive:true});
          fs.writeFileSync('.artifacts/wearable-glb-validation.json',JSON.stringify(reports,null,2));
          if(reports.some(report=>report.issues.numErrors))throw new Error('GLB validation errors');
          EOF
      - run: pnpm exec playwright install --with-deps chromium
      - name: Render actual committed assets on both VRM fixtures
        run: pnpm exec tsx scripts/verify-studio-wearable-v5.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wearable-review-${{ github.sha }}
          path: |
            .artifacts/wearable-glb-validation.json
            .artifacts/studio-wearable-v5/review.json
            .artifacts/studio-wearable-v5/contact-sheet-*.jpg
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wearable-closeups-${{ github.sha }}
          path: .artifacts/studio-wearable-v5/screenshots/*.png
          include-hidden-files: true
          retention-days: 7
