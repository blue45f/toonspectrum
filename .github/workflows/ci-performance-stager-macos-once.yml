      - name: Validate generated workflows and policy contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-pr-workflow-fanout.py
          node --check scripts/integration-test-runner-ci-policy.test.mjs
          ruby -rpsych -e 'ARGV.each { |path| Psych.parse_file(path) }' .github/workflows/*.yml
          git diff --check
          grep -Eq '^name: CI$' .github/workflows/ci.yml
          grep -Eq '^  core:$' .github/workflows/ci.yml
          grep -Fq 'shard: [1, 2, 3, 4]' .github/workflows/ci.yml
          grep -Fq 'Require all four nonempty coverage reports' .github/workflows/sonarqube.yml
          grep -Fq 'sonar-coverage-4/lcov.info' sonar-project.properties

      - name: Stage workflow blobs outside the protected workflow path
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .qa/ci-generated-workflows
          mkdir -p .qa/ci-generated-workflows
          : > .qa/ci-generated-workflows-manifest.txt

          git diff --name-only -- .github/workflows             | grep -v '^.github/workflows/ci-performance-stager-macos-once.yml$'             | sort             > /tmp/generated-workflow-paths.txt

          workflow_count="$(wc -l < /tmp/generated-workflow-paths.txt | tr -d ' ')"
          test "$workflow_count" -eq 23

          while IFS= read -r path; do
            test -n "$path"
            destination=".qa/ci-generated-workflows/${path#.github/workflows/}"
            cp "$path" "$destination"
            echo "$path" >> .qa/ci-generated-workflows-manifest.txt
          done < /tmp/generated-workflow-paths.txt

          git checkout -- .github/workflows
          git diff --quiet -- .github/workflows

      - name: Publish the validated non-workflow staging commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A             .qa/ci-generated-workflows             .qa/ci-generated-workflows-manifest.txt             .qa/ci-performance-optimization-2026-09-11.md             scripts/verify-pr-workflow-fanout.py             scripts/integration-test-runner-ci-policy.test.mjs             sonar-project.properties
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit             -m "chore(ci): stage validated performance workflow blobs"
          git fetch origin fix/real-core-and-main-only-20260910
          git rebase origin/fix/real-core-and-main-only-20260910
          git push origin HEAD:fix/real-core-and-main-only-20260910
