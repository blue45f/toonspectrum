name: Resilient final CodeQL remediation

on:
  push:
    branches:
      - codex/code-scanning-remediation-20260908
    paths:
      - .github/workflows/code-scanning-remediation-v9.yml
  workflow_dispatch:

permissions:
  actions: write
  checks: write
  contents: write
  models: read
  pull-requests: write
  security-events: write
  statuses: read

concurrency:
  group: resilient-final-codeql-remediation
  cancel-in-progress: true

env:
  TARGET_BRANCH: codex/code-scanning-remediation-20260908

jobs:
  takeover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      proceed: ${{ steps.branch.outputs.proceed }}
    steps:
      - name: Confirm branch and cancel superseded remediation runs
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          encoded="${TARGET_BRANCH//\//%2F}"
          if ! gh api "/repos/${GITHUB_REPOSITORY}/branches/${encoded}" >/dev/null 2>&1; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

          names='[
            "Code scanning autofix",
            "Code scanning remediation gate",
            "Trigger code scanning remediation gate",
            "Complete CodeQL remediation",
            "Collision-safe CodeQL remediation fallback",
            "AI-assisted residual CodeQL remediation",
            "Iterative CodeQL remediation supervisor",
            "Bound earlier CodeQL remediation runtime",
            "Final CodeQL remediation and protected merge",
            "Final CodeQL remediation v7",
            "Guard final CodeQL remediation",
            "Final self-contained CodeQL remediation"
          ]'
          runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${TARGET_BRANCH}&per_page=100")"
          jq -r --argjson names "$names" '.workflow_runs[] | select((.name as $n | $names | index($n)) and .status != "completed") | .id' <<<"$runs" | while read -r run_id; do
            [[ -n "$run_id" ]] || continue
            echo "Cancelling superseded remediation run ${run_id}"
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done

          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          [[ -z "$number" ]] || gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --disable-auto || true

      - name: Checkout current remediation branch
        if: steps.branch.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Integrate latest main
        if: steps.branch.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

  round1:
    needs: takeover
    if: needs.takeover.result == 'success' && needs.takeover.outputs.proceed == 'true'
    permissions:
      contents: write
      models: read
      security-events: read
    uses: ./.github/workflows/codeql-residual-round-v9.yml
    with:
      round: "v9-1"
      branch: codex/code-scanning-remediation-20260908

  round2:
    needs: round1
    if: needs.round1.result == 'success' && needs.round1.outputs.clean != 'true'
    permissions:
      contents: write
      models: read
      security-events: read
    uses: ./.github/workflows/codeql-residual-round-v9.yml
    with:
      round: "v9-2"
      branch: codex/code-scanning-remediation-20260908

  round3:
    needs: round2
    if: needs.round2.result == 'success' && needs.round2.outputs.clean != 'true'
    permissions:
      contents: write
      models: read
      security-events: read
    uses: ./.github/workflows/codeql-residual-round-v9.yml
    with:
      round: "v9-3"
      branch: codex/code-scanning-remediation-20260908

  round4:
    needs: round3
    if: needs.round3.result == 'success' && needs.round3.outputs.clean != 'true'
    permissions:
      contents: write
      models: read
      security-events: read
    uses: ./.github/workflows/codeql-residual-round-v9.yml
    with:
      round: "v9-4"
      branch: codex/code-scanning-remediation-20260908

  round5:
    needs: round4
    if: needs.round4.result == 'success' && needs.round4.outputs.clean != 'true'
    permissions:
      contents: write
      models: read
      security-events: read
    uses: ./.github/workflows/codeql-residual-round-v9.yml
    with:
      round: "v9-5"
      branch: codex/code-scanning-remediation-20260908

  final-security-gate:
    needs: [takeover, round1, round2, round3, round4, round5]
    if: >-
      ${{
        always() &&
        needs.takeover.result == 'success' &&
        needs.takeover.outputs.proceed == 'true' &&
        needs.round1.result == 'success' &&
        (needs.round2.result == 'success' || needs.round2.result == 'skipped') &&
        (needs.round3.result == 'success' || needs.round3.result == 'skipped') &&
        (needs.round4.result == 'success' || needs.round4.result == 'skipped') &&
        (needs.round5.result == 'success' || needs.round5.result == 'skipped')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      candidate_sha: ${{ steps.candidate.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout latest repaired branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Restore repair helper and integrate latest main
        shell: bash
        run: |
          set -euo pipefail
          helper_commit="$(git rev-list --all -- scripts/codeql-residual-remediation-v6.py | head -1)"
          [[ -n "$helper_commit" ]] || { echo "Repair helper is not present in branch history." >&2; exit 1; }
          git show "${helper_commit}:scripts/codeql-residual-remediation-v6.py" > /tmp/codeql-fix-v9.py
          chmod +x /tmp/codeql-fix-v9.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Initialize final CodeQL security-and-quality gate
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Analyze final candidate
        uses: github/codeql-action/analyze@v3
        with:
          upload: false
          output: /tmp/codeql-v9-final
          category: /language:javascript-typescript

      - name: Require zero CodeQL security findings
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/codeql-fix-v9.py --sarif-root /tmp/codeql-v9-final --output /tmp/codeql-v9-final-findings.json

      - name: Create or locate remediation pull request
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$number" ]]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$TARGET_BRANCH" \
              --title "fix(security): resolve all open CodeQL findings" \
              --body $'## Summary\n\n- resolves the complete open CodeQL inventory\n- applies GitHub Autofix and bounded source-level repair passes\n- validates the latest main-integrated tree with CodeQL `security-and-quality`\n- removes all temporary remediation automation before merge\n- runs the repository `core` check on the exact final SHA\n- re-analyzes the actual merged `main` tree\n\n## Required gates\n\nCodeQL security findings: **0** · `core`: **success** · merged-main open alerts: **0**'
            number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --base main --state open --json number --jq '.[0].number')"
          fi
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --disable-auto || true
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Remove every temporary remediation asset
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git reset --hard "origin/$TARGET_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f \
            .github/workflows/code-scanning-inventory.yml \
            .github/workflows/code-scanning-context.yml \
            .github/workflows/code-scanning-autofix.yml \
            .github/workflows/code-scanning-remediation-gate.yml \
            .github/workflows/code-scanning-remediation-gate-trigger.yml \
            .github/workflows/code-scanning-remediation-v2.yml \
            .github/workflows/code-scanning-remediation-v3.yml \
            .github/workflows/code-scanning-remediation-v4.yml \
            .github/workflows/code-scanning-remediation-v5.yml \
            .github/workflows/code-scanning-remediation-v6.yml \
            .github/workflows/code-scanning-remediation-v7.yml \
            .github/workflows/code-scanning-remediation-v8.yml \
            .github/workflows/code-scanning-remediation-v9.yml \
            .github/workflows/code-scanning-remediation-deadline.yml \
            .github/workflows/code-scanning-remediation-guard.yml \
            .github/workflows/codeql-residual-round.yml \
            .github/workflows/codeql-residual-round-v6.yml \
            .github/workflows/codeql-residual-round-v8.yml \
            .github/workflows/codeql-residual-round-v9.yml \
            .github/workflows/patch-remediation-v5.yml \
            scripts/codeql-residual-remediation.py \
            scripts/codeql-residual-remediation-v6.py
          git add -A
          git diff --check
          if ! git diff --cached --quiet; then
            git commit -m "chore(security): remove temporary CodeQL remediation automation"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
          remaining="$(git ls-files | grep -E '(^|/)(code-scanning-remediation|codeql-residual|patch-remediation-v5)' || true)"
          [[ -z "$remaining" ]] || { printf '%s\n' "$remaining" >&2; exit 1; }

      - name: Record exact candidate SHA
        id: candidate
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  core-gate-and-merge:
    needs: final-security-gate
    if: needs.final-security-gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      pr_number: ${{ needs.final-security-gate.outputs.pr_number }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.final-security-gate.outputs.pr_number }}
      CANDIDATE_SHA: ${{ needs.final-security-gate.outputs.candidate_sha }}
    steps:
      - name: Checkout exact final candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Confirm candidate SHA is unchanged
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$CANDIDATE_SHA" ]] || { echo "Candidate changed: ${actual} != ${CANDIDATE_SHA}" >&2; exit 1; }

      - name: Run required core check with bounded retries
        id: core
        shell: bash
        run: |
          set -euo pipefail
          success=false
          dispatch_supported=true
          successful_run=""

          for retry in 1 2 3; do
            before="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=${TARGET_BRANCH}&event=workflow_dispatch&per_page=100" --jq '[.workflow_runs[].id] | max // 0' 2>/dev/null || echo 0)"
            if ! gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH"; then
              dispatch_supported=false
              break
            fi

            run_id=""
            for poll in $(seq 1 120); do
              payload="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=${TARGET_BRANCH}&event=workflow_dispatch&per_page=100")"
              run_id="$(jq -r --arg sha "$CANDIDATE_SHA" --argjson before "$before" '[.workflow_runs[] | select(.id > $before and .head_sha == $sha)][0].id // empty' <<<"$payload")"
              [[ -n "$run_id" ]] && break
              sleep 5
            done
            [[ -n "$run_id" ]] || { echo "Dispatched CI run did not appear." >&2; continue; }

            core="pending"
            for poll in $(seq 1 600); do
              jobs="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" --slurp)"
              core="$(jq -r '[.[].jobs[]? | select(.name == "core")][0].conclusion // [.[].jobs[]? | select(.name == "core")][0].status // "pending"' <<<"$jobs")"
              echo "retry=${retry}; run=${run_id}; core=${core}; poll=${poll}/600"
              case "$core" in
                success)
                  success=true
                  successful_run="$run_id"
                  break 2
                  ;;
                failure|cancelled|timed_out|action_required|startup_failure|stale|skipped)
                  break
                  ;;
              esac
              sleep 15
            done
          done

          if [[ "$success" != "true" && "$dispatch_supported" != "true" ]]; then
            mkdir -p /tmp/act
            gh release download --repo nektos/act --pattern 'act_Linux_x86_64.tar.gz' --dir /tmp/act
            tar -xzf /tmp/act/act_Linux_x86_64.tar.gz -C /tmp/act act
            /tmp/act/act workflow_dispatch -W .github/workflows/ci.yml -j core --container-architecture linux/amd64
            jq -n \
              --arg name core \
              --arg head_sha "$CANDIDATE_SHA" \
              --arg status completed \
              --arg conclusion success \
              --arg title 'Core validation passed' \
              --arg summary 'Executed the repository core job through act because ci.yml did not expose workflow_dispatch.' \
              '{name:$name,head_sha:$head_sha,status:$status,conclusion:$conclusion,output:{title:$title,summary:$summary}}' | \
              gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/check-runs" --input - >/dev/null
            success=true
          fi

          [[ "$success" == "true" ]] || { echo "The required core check failed in all bounded attempts." >&2; exit 1; }
          check_count="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE_SHA}/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "core" and .conclusion == "success")] | length')"
          [[ "$check_count" -ge 1 ]] || { echo "No successful core check is attached to ${CANDIDATE_SHA}." >&2; exit 1; }
          echo "run_id=$successful_run" >> "$GITHUB_OUTPUT"

      - name: Require pull request head and core status to match
        shell: bash
        run: |
          set -euo pipefail
          payload="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,headRefOid,statusCheckRollup)"
          state="$(jq -r '.state' <<<"$payload")"
          head="$(jq -r '.headRefOid' <<<"$payload")"
          core="$(jq -r '[.statusCheckRollup[] | select((.name // .context // "") == "core") | (.conclusion // .state // .status)][-1] // "missing"' <<<"$payload")"
          [[ "$state" == "OPEN" ]] || { echo "PR is not open: ${state}" >&2; exit 1; }
          [[ "$head" == "$CANDIDATE_SHA" ]] || { echo "PR head changed after validation." >&2; exit 1; }
          [[ "$core" == "SUCCESS" || "$core" == "success" ]] || { echo "PR core status is ${core}." >&2; exit 1; }

      - name: Enable protected squash auto-merge and wait
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --auto --delete-branch
          for attempt in $(seq 1 360); do
            state="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')"
            echo "PR state=${state}; attempt=${attempt}/360"
            [[ "$state" == "MERGED" ]] && exit 0
            [[ "$state" == "OPEN" ]] || exit 1
            sleep 20
          done
          echo "Timed out waiting for protected merge." >&2
          exit 1

  verify-main:
    needs: core-gate-and-merge
    if: needs.core-gate-and-merge.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.core-gate-and-merge.outputs.pr_number }}
    steps:
      - name: Checkout actual merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Initialize CodeQL on actual main
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Analyze actual main
        uses: github/codeql-action/analyze@v3
        with:
          upload: false
          output: /tmp/codeql-v9-main
          category: /language:javascript-typescript

      - name: Require zero findings and upload main SARIF
        id: sarif
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          from pathlib import Path

          paths = glob.glob('/tmp/codeql-v9-main/**/*.sarif', recursive=True)
          if not paths:
              raise SystemExit('No SARIF was produced for main')
          findings=[]
          seen=set()
          for path in paths:
              sarif=json.loads(Path(path).read_text(encoding='utf-8'))
              for run in sarif.get('runs',[]):
                  rules={r.get('id'):r for r in ((((run.get('tool') or {}).get('driver') or {}).get('rules')) or [])}
                  for item in run.get('results',[]):
                      rule_id=item.get('ruleId')
                      props=(rules.get(rule_id) or {}).get('properties') or {}
                      tags=[str(tag) for tag in (props.get('tags') or [])]
                      if props.get('security-severity') is None and not any(tag.startswith('security/') or tag.startswith('external/cwe/') for tag in tags):
                          continue
                      locations=item.get('locations') or []
                      physical=((locations[0].get('physicalLocation') if locations else None) or {})
                      key=(rule_id,((physical.get('artifactLocation') or {}).get('uri')),((physical.get('region') or {}).get('startLine')),((item.get('message') or {}).get('text')))
                      if key not in seen:
                          seen.add(key)
                          findings.append({'rule':key[0],'path':key[1],'line':key[2],'message':key[3]})
          print(json.dumps(findings,ensure_ascii=False,indent=2))
          if findings:
              raise SystemExit(f'Actual merged main has {len(findings)} CodeQL security finding(s)')
          Path('/tmp/codeql-v9-main-sarif-path.txt').write_text(paths[0],encoding='utf-8')
          print('MAIN_CODEQL_SECURITY_FINDINGS=0')
          PY

          sarif_path="$(cat /tmp/codeql-v9-main-sarif-path.txt)"
          gzip -c "$sarif_path" > /tmp/codeql-v9-main.sarif.gz
          encoded="$(base64 -w0 /tmp/codeql-v9-main.sarif.gz)"
          main_sha="$(git rev-parse HEAD)"
          response="$(jq -n --arg commit_sha "$main_sha" --arg ref 'refs/heads/main' --arg sarif "$encoded" --arg checkout_uri "file://${GITHUB_WORKSPACE}" '{commit_sha:$commit_sha,ref:$ref,sarif:$sarif,checkout_uri:$checkout_uri}' | gh api --method POST "/repos/${GITHUB_REPOSITORY}/code-scanning/sarifs" --input -)"
          id="$(jq -r '.id' <<<"$response")"
          [[ -n "$id" && "$id" != "null" ]] || { echo "SARIF upload did not return an id." >&2; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Require processed SARIF and zero open main alerts
        shell: bash
        run: |
          set -euo pipefail
          status=pending
          for attempt in $(seq 1 180); do
            payload="$(gh api "/repos/${GITHUB_REPOSITORY}/code-scanning/sarifs/${{ steps.sarif.outputs.id }}")"
            status="$(jq -r '.processing_status // .status // "pending"' <<<"$payload")"
            errors="$(jq -c '.errors // []' <<<"$payload")"
            echo "SARIF status=${status}; errors=${errors}; attempt=${attempt}/180"
            [[ "$status" == "complete" ]] && break
            [[ "$status" == "failed" ]] && exit 1
            sleep 10
          done
          [[ "$status" == "complete" ]] || { echo "SARIF processing timed out." >&2; exit 1; }

          count=-1
          for attempt in $(seq 1 180); do
            count="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&tool_name=CodeQL&ref=refs%2Fheads%2Fmain&per_page=100" --slurp | jq '[.[][]] | length')"
            echo "Open main CodeQL alerts=${count}; attempt=${attempt}/180"
            [[ "$count" == "0" ]] && break
            sleep 10
          done
          [[ "$count" == "0" ]] || { echo "Main still has ${count} open CodeQL alert(s)." >&2; exit 1; }

          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body $'✅ **CodeQL 전수 수정 완료**\n\n- 최초 열린 경고: **52건**\n- 보호 브랜치 병합: **완료**\n- 병합 후 실제 `main` CodeQL 재분석: **통과**\n- `main` 열린 CodeQL 경고: **0건**\n- 필수 `core` 검사: **success**\n- 임시 remediation 워크플로/스크립트: **병합 전 제거**'
