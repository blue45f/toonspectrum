name: VRM grip contact v2 bootstrap

on:
  push:
    branches:
      - feat/vrm-grip-contact-v2-20260910
    paths:
      - .github/workflows/vrm-grip-contact-v2-bootstrap.yml

permissions:
  contents: write

jobs:
  wire-and-test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/vrm-grip-contact-v2-20260910
          fetch-depth: 0
      - name: Wire distributed contact targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/domains/creator/vrm/StudioVrmGripContactRefine.tsx')
          text = path.read_text(encoding='utf-8')

          import_anchor = '''import { createAutoGripFingerOverrides, resolvePropAttachment, resolveSecondaryPropTarget } from "./studio-vrm-prop-rig";\n'''
          import_replacement = import_anchor + '''import { createStudioVrmGripContactTargets } from "./studio-vrm-grip-contact-targets";\n'''
          if text.count(import_anchor) != 1:
              raise SystemExit('grip contact import anchor changed')
          text = text.replace(import_anchor, import_replacement, 1)

          text = text.replace('''      const target = new THREE.Vector3();\n      const localTarget = new THREE.Vector3();\n''', '''      const gripCenter = new THREE.Vector3();\n      const localTarget = new THREE.Vector3();\n''', 1)
          text = text.replace('''            target.set(...resolved.socketPosition);\n            sourceHand.localToWorld(target);\n            sourceHand.getWorldQuaternion(rotation).multiply(localRotation).normalize();\n            target.add(scratch.copy(offset).applyQuaternion(rotation));\n            hand.updateWorldMatrix(true, true);\n            const determinant = hand.matrixWorld.determinant();\n            if (!Number.isFinite(determinant) || Math.abs(determinant) < 1e-12\n              || !target.toArray().every(Number.isFinite)\n              || target.distanceTo(hand.getWorldPosition(scratch)) > handSize * 1.8) {\n              release(); // Do not leave a previous correction on an unreachable contact.\n              return;\n            }\n            localTarget.copy(target);\n            hand.worldToLocal(localTarget);\n''', '''            gripCenter.set(...resolved.socketPosition);\n            sourceHand.localToWorld(gripCenter);\n            sourceHand.getWorldQuaternion(rotation).multiply(localRotation).normalize();\n            gripCenter.add(scratch.copy(offset).applyQuaternion(rotation));\n            hand.updateWorldMatrix(true, true);\n            const determinant = hand.matrixWorld.determinant();\n            if (!Number.isFinite(determinant) || Math.abs(determinant) < 1e-12\n              || !gripCenter.toArray().every(Number.isFinite)\n              || gripCenter.distanceTo(hand.getWorldPosition(scratch)) > handSize * 1.8) {\n              release(); // Do not leave a previous correction on an unreachable contact.\n              return;\n            }\n            const initialFingertips = endpoints.map((node) => node.getWorldPosition(new THREE.Vector3()));\n            const contactPlan = createStudioVrmGripContactTargets({\n              center: gripCenter,\n              axis: new THREE.Vector3(...anchor.up).applyQuaternion(rotation),\n              fallbackRadial: new THREE.Vector3(...anchor.forward).applyQuaternion(rotation),\n              fingertipWorldPositions: initialFingertips,\n              gripRadius: radius,\n              handSize,\n              side,\n            });\n            if (!contactPlan) { release(); return; }\n            localTarget.copy(gripCenter);\n            hand.worldToLocal(localTarget);\n''', 1)

          old_context = '''            const context = [localTarget.x, localTarget.y, localTarget.z];\n            // Scale/shear Gram matrix is invariant under common rigid movement.\n            for (let a = 0; a < 3; a += 1) {\n              for (let b = a; b < 3; b += 1) context.push(m[a * 4] * m[b * 4] + m[a * 4 + 1] * m[b * 4 + 1] + m[a * 4 + 2] * m[b * 4 + 2]);\n            }\n'''
          new_context = '''            const context = [localTarget.x, localTarget.y, localTarget.z];\n            // Keep the four immutable contact goals in hand-local coordinates. Rigid movement of\n            // the character/prop therefore replays safely, while a changed grip geometry re-solves.\n            for (const contactTarget of contactPlan.targets) {\n              const localContact = hand.worldToLocal(contactTarget.clone());\n              context.push(localContact.x, localContact.y, localContact.z);\n            }\n            // Scale/shear Gram matrix is invariant under common rigid movement.\n            for (let a = 0; a < 3; a += 1) {\n              for (let b = a; b < 3; b += 1) context.push(m[a * 4] * m[b * 4] + m[a * 4 + 1] * m[b * 4 + 1] + m[a * 4 + 2] * m[b * 4 + 2]);\n            }\n'''
          if text.count(old_context) != 1:
              raise SystemExit('contact context anchor changed')
          text = text.replace(old_context, new_context, 1)

          old_solver = '''              goal: radius * 2.2 + handSize * 0.4,\n              minImprovement: Math.max(1e-5, handSize * 0.008),\n              allowRelaxation: true,\n              maxAngularChange: THREE.MathUtils.degToRad(20),\n              maxEvaluations: 64,\n              apply,\n              measure: () => Math.max(...endpoints.map((node) => node.getWorldPosition(scratch).distanceTo(target))),\n              measureContacts: () => endpoints.map((node) => node.getWorldPosition(scratch).distanceTo(target)),\n'''
          new_solver = '''              goal: contactPlan.tolerance,\n              minImprovement: Math.max(5e-6, handSize * 0.004),\n              allowRelaxation: true,\n              maxAngularChange: THREE.MathUtils.degToRad(24),\n              maxEvaluations: 80,\n              apply,\n              measure: () => Math.max(...endpoints.map((node, index) => (\n                node.getWorldPosition(scratch).distanceTo(contactPlan.targets[index]!)\n              ))),\n              measureContacts: () => endpoints.map((node, index) => (\n                node.getWorldPosition(scratch).distanceTo(contactPlan.targets[index]!)\n              )),\n'''
          if text.count(old_solver) != 1:
              raise SystemExit('contact solver anchor changed')
          text = text.replace(old_solver, new_solver, 1)
          if 'distanceTo(target)' in text:
              raise SystemExit('single-point grip target remains in contact refinement')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate grip solver
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec vitest run \
            apps/web/src/domains/creator/vrm/studio-vrm-grip-contact-targets.test.ts \
            apps/web/src/domains/creator/vrm/studio-vrm-prop-grip-contact.test.ts \
            apps/web/src/domains/creator/vrm/studio-vrm-prop-rig.test.ts
          pnpm exec tsc -p tsconfig.json --noEmit
          git diff --check
      - name: Commit and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name "toonstudio-3d-ci"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/vrm-grip-contact-v2-bootstrap.yml
          git add apps/web/src/domains/creator/vrm/StudioVrmGripContactRefine.tsx \
                  apps/web/src/domains/creator/vrm/studio-vrm-grip-contact-targets.ts \
                  apps/web/src/domains/creator/vrm/studio-vrm-grip-contact-targets.test.ts
          git diff --cached --check
          git commit -m "feat(vrm): wrap fingers around authored prop contacts"
          git push origin HEAD:feat/vrm-grip-contact-v2-20260910
