name: Final canonical CI repair 2026-09-11

on:
  push:
    branches:
      - fix/real-core-and-main-only-20260910
    paths:
      - .github/workflows/final-canonical-ci-repair-20260911.yml

permissions:
  contents: write

concurrency:
  group: final-canonical-ci-repair-20260911
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/real-core-and-main-only-20260910
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Repair remaining deterministic source lint failures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def edit(path: str, transform):
              file = Path(path)
              if not file.exists():
                  return
              before = file.read_text(encoding="utf-8")
              after = transform(before)
              if before != after:
                  file.write_text(after, encoding="utf-8")

          def replace_all(path: str, replacements: list[tuple[str, str]]):
              def transform(text: str) -> str:
                  for old, new in replacements:
                      text = text.replace(old, new)
                  return text
              edit(path, transform)

          # Template literals do not need escaped double quotes.
          replace_all(
              "apps/web/src/domains/creator/lettering/studio-bubble-library.test.ts",
              [(r'`\"version\":${BUBBLE_LIBRARY_PREFERENCES_VERSION}`',
                '`"version":${BUBBLE_LIBRARY_PREFERENCES_VERSION}`')],
          )
          replace_all(
              "apps/web/src/domains/legal/SitemapPage.test.ts",
              [(r'`\"${href}\"`', '`"${href}"`')],
          )

          # The nearest failed recovery operation is the causal error for the aggregate symptom.
          replace_all(
              "apps/web/src/domains/creator/studio-autosave-sqlite-store.ts",
              [("{ cause: primaryCause },\n          );", "{ cause: recoveryCause },\n          );")],
          )

          def repair_director_route(text: str) -> str:
              text = text.replace(
                  'import { useEffect, useMemo, useState, type ReactElement } from "react";',
                  'import { useEffect, useMemo, useRef, useState, type ReactElement } from "react";',
              )
              state_needle = (
                  '  const [session, setSession] = useState(() => initialSession(resolution));\n'
                  '  const [syncState, setSyncState] = useState<'
              )
              if state_needle in text and 'const initialSessionRef = useRef(session);' not in text:
                  text = text.replace(
                      state_needle,
                      '  const [session, setSession] = useState(() => initialSession(resolution));\n'
                      '  const initialSessionRef = useRef(session);\n'
                      '  const [syncState, setSyncState] = useState<',
                      1,
                  )

              effect_start = text.find('  useEffect(() => {\n    let active = true;')
              effect_end = text.find('\n\n  const patchSession =', effect_start)
              if effect_start >= 0 and effect_end >= 0:
                  effect = text[effect_start:effect_end]
                  if 'const createSnapshot = initialSessionRef.current;' not in effect:
                      effect = effect.replace(
                          '  useEffect(() => {\n    let active = true;',
                          '  useEffect(() => {\n    let active = true;\n    const createSnapshot = initialSessionRef.current;',
                          1,
                      )
                  effect = effect.replace('api.createSession(session)', 'api.createSession(createSnapshot)')
                  effect = effect.replace('routePath(resolution, session.id)', 'routePath(resolution, createSnapshot.id)')
                  effect = effect.replace(
                      '  // Route identity owns remote hydration; `session` is deliberately read as the local create snapshot.\n'
                      '  // eslint-disable-next-line react-hooks/exhaustive-deps -- depending on session would resync after setSession and loop.\n'
                      '  }, [api, navigate, resolution, session.id]);',
                      '  }, [api, navigate, resolution]);',
                  )
                  effect = effect.replace('  }, [api, navigate, resolution, session.id]);',
                                          '  }, [api, navigate, resolution]);')
                  text = text[:effect_start] + effect + text[effect_end:]
              return text

          edit(
              "apps/web/src/domains/creator/studio-router/routes/StudioAiComicDirectorRoute.tsx",
              repair_director_route,
          )
          PY

      - name: Apply formatter-supported ESLint fixes
        run: pnpm exec eslint --fix --no-warn-ignored apps packages scripts e2e

      - name: Verify full lint and typecheck
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm run typecheck:cloudflare-realtime

      - name: Run focused regression tests for repaired files
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            apps/web/src/domains/creator/lettering/studio-bubble-library.test.ts
            apps/web/src/domains/legal/SitemapPage.test.ts
            apps/web/src/shared/lib/github-workflow-safety.test.ts
          )
          if [[ -f apps/web/src/domains/creator/studio-autosave-sqlite-store.test.ts ]]; then
            tests+=(apps/web/src/domains/creator/studio-autosave-sqlite-store.test.ts)
          fi
          pnpm exec vitest run "${tests[@]}"

      - name: Build and explicitly accept the integrated bundle as the new ratchet
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build
          UPDATE_BUNDLE_BASELINE=1 pnpm run check:studio-bundle
          pnpm run check:studio-bundle
          git restore --worktree --staged apps/web/public/data 2>/dev/null || true

      - name: Commit only verified source and baseline repairs
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/final-canonical-ci-repair-20260911.yml
          git diff --check
          git config user.name toonstudio-quality-ci
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No additional deterministic repairs were needed."
            exit 0
          fi
          git -c core.hooksPath=/dev/null commit -m "fix(ci): resolve final canonical lint and bundle gates"
          git push --no-verify origin HEAD:fix/real-core-and-main-only-20260910
