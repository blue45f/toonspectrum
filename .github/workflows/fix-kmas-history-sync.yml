name: Fix KMAS reference history synchronization

on:
  push:
    branches:
      - chore/architecture-sonar-cleanup-final
    paths:
      - .github/workflows/fix-kmas-history-sync.yml

permissions:
  contents: write

concurrency:
  group: fix-kmas-history-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      VITE_TRAFFIC_ANALYTICS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/architecture-sonar-cleanup-final
          fetch-depth: 1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Synchronize reference state after browser history restoration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/domains/catalog/references/ReferencePage.tsx')
          source = path.read_text(encoding='utf-8')

          old_import = 'import { useCallback, useEffect, useRef, useState } from "react";'
          new_import = 'import { useCallback, useEffect, useReducer, useRef, useState } from "react";'
          if source.count(old_import) != 1:
              raise SystemExit(f'expected one React hook import, found {source.count(old_import)}')
          source = source.replace(old_import, new_import)

          old_params = '  const [params, setParams] = useSearchParams();'
          new_params = '\n'.join((
              '  const [routerParams, setParams] = useSearchParams();',
              '  const [, refreshHistory] = useReducer((revision: number) => revision + 1, 0);',
              '  useEffect(() => {',
              '    let restoreTimer = 0;',
              '    const restoreFromHistory = () => {',
              '      window.clearTimeout(restoreTimer);',
              '      // Browsers restore form-control state late in a history traversal. Render once after that',
              '      // restoration and read the actual URL so both the controlled form and results follow it.',
              '      restoreTimer = window.setTimeout(refreshHistory, 0);',
              '    };',
              '    window.addEventListener("popstate", restoreFromHistory);',
              '    return () => {',
              '      window.clearTimeout(restoreTimer);',
              '      window.removeEventListener("popstate", restoreFromHistory);',
              '    };',
              '  }, []);',
              '  const params = new URLSearchParams(',
              '    typeof window === "undefined" ? routerParams.toString() : window.location.search,',
              '  );',
          ))
          if source.count(old_params) != 1:
              raise SystemExit(f'expected one search params declaration, found {source.count(old_params)}')
          source = source.replace(old_params, new_params)
          path.write_text(source, encoding='utf-8')
          PY

          pnpm exec eslint apps/web/src/domains/catalog/references/ReferencePage.tsx --max-warnings=0

      - name: Verify the observed back-forward history regression
        shell: bash
        run: |
          set -euo pipefail
          pnpm run catalog:gen
          pnpm run build:bundle
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test --config playwright.references.config.ts --grep 'no eager API call'

      - name: Commit the verified product fix
        shell: bash
        run: |
          set -euo pipefail
          git add apps/web/src/domains/catalog/references/ReferencePage.tsx
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --no-verify -m 'fix(references): synchronize back-forward search state'
          git push --no-verify origin HEAD:chore/architecture-sonar-cleanup-final
