name: Apply clean causal InkWash preview port

on:
  push:
    branches:
      - fix/inkwash-causal-preview-clean-port-20260904
    paths:
      - .github/workflows/apply-clean-inkwash-causal-preview-port.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-clean-inkwash-causal-preview-port
  cancel-in-progress: true

jobs:
  port-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Check out clean branch
        uses: actions/checkout@v6
        with:
          ref: fix/inkwash-causal-preview-clean-port-20260904
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Restore only the durable product surface from PR 689
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin fix/inkwash-live-preview-quality-20260904
          git checkout f091064b4024ebd66825fa51da6f31a3bd2705e8 -- \
            src/domains/creator/brush/studio-inkwash-fluid.ts \
            src/domains/creator/brush/studio-inkwash-fluid-live-preview.test.ts \
            src/domains/creator/live/studio-live-wet-ink-overlay.ts \
            src/domains/creator/live/studio-live-wet-ink-integration.test.ts

      - name: Correct causal pressure interpolation and migrate the overlay regression
        shell: python
        run: |
          from pathlib import Path

          fluid_path = Path("src/domains/creator/brush/studio-inkwash-fluid.ts")
          fluid = fluid_path.read_text(encoding="utf-8")
          pressure_before = """        state.previousY + dy * amount,
                  currentPressure,
                  directionX,"""
          pressure_after = """        state.previousY + dy * amount,
                  state.previousPressure
                    + (currentPressure - state.previousPressure) * amount,
                  directionX,"""
          count = fluid.count(pressure_before)
          if count != 1:
              raise SystemExit(f"pressure interpolation target count={count}")
          fluid_path.write_text(
              fluid.replace(pressure_before, pressure_after, 1),
              encoding="utf-8",
          )

          overlay_test_path = Path(
              "src/domains/creator/live/studio-live-wet-ink-overlay.test.ts"
          )
          overlay_test = overlay_test_path.read_text(encoding="utf-8")
          start_marker = (
              '  it("redraws the whole InkWash live polyline per frame instead of '
              'stacking round caps", () => {'
          )
          end_marker = (
              '  it("keeps InkWash pen and water on one live wash field", () => {'
          )
          start = overlay_test.find(start_marker)
          end = overlay_test.find(end_marker, start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit(
                  f"overlay regression markers start={start} end={end}"
              )
          replacement = '''  it("renders InkWash pigment through bounded optical tile uploads", () => {
            const { activeCanvas, renderer } = attachedRenderer();
            const start = wetStroke([20, 40], {
              brush: "inkwash-pen",
              id: "inkwash-pen-live-preview",
            });
            expect(renderer.begin(start, { pageEpoch: 5 }).status).toBe("started");
            expect(activeCanvas.paths).toEqual([]);
            expect(activeCanvas.draws.length).toBeGreaterThan(0);
            const drawsAfterBegin = activeCanvas.draws.length;

            const grown = wetStroke([20, 40, 60, 42, 100, 47], {
              brush: "inkwash-pen",
              id: "inkwash-pen-live-preview",
            });
            expect(renderer.appendFrom(grown, { pageEpoch: 5 })).toMatchObject({
              status: "appended",
              consumedSourcePoints: 3,
            });
            expect(activeCanvas.paths).toEqual([]);
            expect(activeCanvas.draws.length).toBeGreaterThan(drawsAfterBegin);
            const drawsAfterGrowth = activeCanvas.draws.length;

            const longer = wetStroke([20, 40, 60, 42, 100, 47, 140, 50], {
              brush: "inkwash-pen",
              id: "inkwash-pen-live-preview",
            });
            expect(renderer.appendFrom(longer, { pageEpoch: 5 })).toMatchObject({
              status: "appended",
              consumedSourcePoints: 4,
            });
            expect(activeCanvas.paths).toEqual([]);
            expect(activeCanvas.draws.length).toBeGreaterThan(drawsAfterGrowth);
          });

'''
          overlay_test_path.write_text(
              overlay_test[:start] + replacement + overlay_test[end:],
              encoding="utf-8",
          )

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize changed TypeScript
        run: >-
          pnpm exec eslint --fix --max-warnings=0
          src/domains/creator/brush/studio-inkwash-fluid.ts
          src/domains/creator/brush/studio-inkwash-fluid-live-preview.test.ts
          src/domains/creator/live/studio-live-wet-ink-overlay.ts
          src/domains/creator/live/studio-live-wet-ink-overlay.test.ts
          src/domains/creator/live/studio-live-wet-ink-integration.test.ts

      - name: Run focused InkWash contracts
        run: >-
          pnpm exec vitest run
          src/domains/creator/brush/studio-inkwash-fluid-deposit.test.ts
          src/domains/creator/brush/studio-inkwash-fluid-live-preview.test.ts
          src/domains/creator/live/studio-live-wet-ink-overlay.test.ts
          src/domains/creator/live/studio-live-wet-ink-integration.test.ts

      - name: Typecheck
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Production build
        run: pnpm run build

      - name: Commit the verified clean port without the one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-clean-inkwash-causal-preview-port.yml
          git config user.name "toonstudio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit --no-verify -m "feat(brush): port causal tiled InkWash live preview"
          git push --no-verify origin HEAD:fix/inkwash-causal-preview-clean-port-20260904
