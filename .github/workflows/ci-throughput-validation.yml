name: CI throughput repair validation

on:
  push:
    branches: [ci/throughput-validation-20260920]
    paths: [.github/workflows/ci-throughput-validation.yml]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ci-throughput-repair-1883
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'blue45f/toonspectrum' && github.ref == 'refs/heads/ci/throughput-validation-20260920'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: '1'
      NODE_OPTIONS: --max-old-space-size=12288
      SOURCE_SHA: ba5baabe4922c69861502e250e4d66edb74971da
      PATCH_SHA: 3e38ca0e5bb733218f8c4e6116fec700ef5c17b1
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ba5baabe4922c69861502e250e4d66edb74971da
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
      
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Load immutable reviewed validation steps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/throughput"
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/blue45f/toonspectrum/341c6b0c15429816f44d2638b0f9cb3087a47db3/.github/workflows/ci-throughput-validation.yml --output "$RUNNER_TEMP/throughput/reviewed-workflow.yml"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { parse } from 'yaml';
          const root=process.env.RUNNER_TEMP;
          const w=parse(fs.readFileSync(`${root}/throughput/reviewed-workflow.yml`,'utf8'));
          const names={
            patch:'Apply immutable reviewed patch and remove obsolete comparator imports',
            test:'Validate source, contracts and type safety',
            build:'Require real production build and unchanged bundle gate',
            publish:'Publish only tested Git object and receipt, never move a branch',
            report:'Summarize validation evidence',
          };
          for(const [file,name] of Object.entries(names)){
            const steps=w.jobs.validate.steps.filter(s=>s.name===name);
            if(steps.length!==1 || typeof steps[0].run!=='string')throw new Error(`Unexpected step: ${name}`);
            fs.writeFileSync(`${root}/${file}.sh`,steps[0].run);
          }
          JS
      - name: Apply reviewed behavior-preserving repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/patch.sh"
      - name: Require affected tests, full typecheck, preflight, lint and architecture
        run: bash "$RUNNER_TEMP/test.sh"
      - name: Require unchanged bundle gate and real production build
        run: bash "$RUNNER_TEMP/build.sh"
      - name: Publish tested candidate object only, without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/publish.sh"
      - name: Preserve exact failure or success evidence
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/report.sh"; then bash "$RUNNER_TEMP/report.sh"; fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ci-throughput-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/throughput
          retention-days: 3
          if-no-files-found: warn
