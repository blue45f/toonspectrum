name: Creator flagship quality

on:
  pull_request:
    paths:
      - 'apps/web/index.html'
      - 'apps/web/public/llms.txt'
      - 'apps/web/public/**/*.webmanifest'
      - 'apps/web/public/i18n/app/footer/**'
      - 'apps/web/src/app/routes/AppRouter.tsx'
      - 'apps/web/src/app/routes/route-fallback.tsx'
      - 'apps/web/src/domains/marketing/**'
      - 'apps/web/src/domains/creator-resources/**'
      - 'apps/web/src/domains/creator/studio-shell/StudioDeferredSaveProjectCreatePage*'
      - 'apps/web/src/domains/creator/studio-shell/StudioFrontDoorPages*'
      - 'apps/web/src/domains/creator/studio-shell/StudioTaskFlow*'
      - 'apps/web/src/domains/creator/studio-launch-mode.ts'
      - 'apps/web/src/domains/creator/studio-cuttoon-editor/runtime/useStudioPreferencesRuntime.ts'
      - 'apps/web/src/shared/components/SiteRouteExperienceBoundary*'
      - 'apps/web/src/shared/components/WorkflowTrustBadge*'
      - 'apps/web/src/shared/lib/product-identity*'
      - 'apps/web/src/shared/lib/site-route-ux*'
      - 'apps/web/src/shared/lib/site-route-experience*'
      - 'apps/web/src/shared/lib/workflow-trust*'
      - 'apps/api/src/modules/creator-resources/**'
      - 'config/http-response-headers.json'
      - 'scripts/cloudflare-static-rules.mjs'
      - 'scripts/cloudflare-static-rules.test.mjs'
      - 'deploy/cloudflare-static/src/index.ts'
      - 'packages/core/**'
      - 'tests/creator-flagship-contracts.test.ts'
      - 'tools/verify-creator-flagship.mjs'
      - 'e2e/creator-flagship.spec.ts'
      - 'e2e/open-creation.spec.ts'
      - 'e2e/helpers/capture-page-evidence.ts'
      - 'playwright.non-studio.config.ts'
      - '.github/workflows/creator-flagship-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creator-flagship-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flagship:
    name: Flagship build and browser regression
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deterministic language, storage and mode contracts
        run: node tools/verify-creator-flagship.mjs
      - name: React, product identity and navigation regressions
        run: >-
          pnpm exec vitest run
          tests/creator-flagship-contracts.test.ts
          apps/web/src/domains/creator-resources/open-creation.test.ts
          apps/web/src/domains/creator/studio-shell/StudioDeferredSaveProjectCreatePage.contract.test.ts
          apps/web/src/domains/creator/studio-shell/StudioFrontDoorPages.contract.test.ts
          apps/web/src/domains/creator/studio-shell/StudioTaskFlow.contract.test.ts
          apps/web/src/domains/marketing/CreatorReferenceSearch.test.tsx
          apps/web/src/domains/marketing/CreatorHomeExperience.test.ts
          apps/web/src/domains/marketing/creator-home-navigation.test.ts
          apps/web/src/shared/lib/product-identity.test.ts
          apps/web/src/shared/lib/site-route-ux.test.ts
          apps/web/src/shared/lib/site-route-experience.test.ts
          apps/web/src/shared/lib/workflow-trust.test.ts
          scripts/cloudflare-static-rules.test.mjs
      - name: Response policy generation contract
        run: node scripts/cloudflare-static-rules.mjs --check
      - name: Full application typecheck
        run: pnpm run typecheck
      - name: Production bundle and CSP
        run: pnpm run build:bundle
      - run: pnpm exec playwright install --with-deps chromium
      - name: Actual application browser regression
        env:
          PLAYWRIGHT_CHANNEL: ''
        run: pnpm exec playwright test e2e/creator-flagship.spec.ts e2e/open-creation.spec.ts --config playwright.non-studio.config.ts
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-flagship-browser-evidence
          path: test-results/
          if-no-files-found: warn

# Exercise the built public bundle; leave the independent Studio GPU harness unchanged.
# This gate does not replace or relax any existing protected check.
