name: Studio large epics reconcile

on:
  push:
    branches:
      - codex/studio-large-epics-closure-20260909
    paths:
      - .github/workflows/studio-large-epics-reconcile.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: studio-large-epics-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      GH_TOKEN: ${{ github.token }}
      STATUS_FILE: docs/automation/studio-large-epics-closure-status.json
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Wait for source-mutating integration jobs
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            active="$(gh run list --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME" --limit 100 \
              --json databaseId,name,status \
              --jq '[.[] | select(.databaseId != env.GITHUB_RUN_ID) | select(.status == "queued" or .status == "in_progress") | select(.name == "Studio large epics source normalization" or .name == "Integrate Studio 3D generation API" or .name == "Integrate Studio advanced AI tools")] | length')"
            if [ "$active" = 0 ]; then break; fi
            if [ "$attempt" = 80 ]; then
              echo "Timed out waiting for source-mutating workflows." >&2
              exit 1
            fi
            sleep 15
          done
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Reconcile deterministic source and module wiring
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # Correct a non-standard assertion introduced in the client contract test.
          client_test = Path('apps/web/src/domains/creator/ai/studio-3d-generation-client.test.ts')
          if client_test.exists():
            text = client_test.read_text()
            text = text.replace(
              'expect(String(url)).toEndWith("/api/studio-ai/3d/jobs");',
              'expect(String(url).endsWith("/api/studio-ai/3d/jobs")).toBe(true);',
            )
            client_test.write_text(text)

          # Ensure lock cleanup and state-set inference remain precise.
          ledger = Path('apps/api/src/modules/studio-ai/studio-3d-generation-job-ledger.ts')
          text = ledger.read_text()
          text = text.replace(
            '    this.#locks.set(userId, previous.then(() => current));\n    await previous;',
            '    const lock = previous.then(() => current);\n    this.#locks.set(userId, lock);\n    await previous;',
          )
          text = text.replace(
            '      if (this.#locks.get(userId) === current) this.#locks.delete(userId);',
            '      if (this.#locks.get(userId) === lock) this.#locks.delete(userId);',
          )
          marker = 'const TRANSITIONS:'
          if marker in text:
            before, after = text.split(marker, 1)
            after = re.sub(r'new Set(?:<Studio3dGenerationJobState>)?\(\[', 'new Set<Studio3dGenerationJobState>([', after)
            text = before + marker + after
          ledger.write_text(text)

          # Include the command catalog in the Smart Shape aggregate evidence.
          aggregate = Path('scripts/verify-studio-open-issues-wave.mts')
          text = aggregate.read_text()
          anchor = '"apps/web/src/domains/creator/studio-smart-shape-host-session.ts",\n      "apps/web/src/domains/creator/StudioSmartShapeEditDialog.tsx",'
          replacement = '"apps/web/src/domains/creator/studio-smart-shape-host-session.ts",\n      "apps/web/src/domains/creator/StudioSmartShapeEditDialog.tsx",\n      "apps/web/src/domains/creator/studio-command-catalog-base.ts",'
          text = text.replace(anchor, replacement)
          aggregate.write_text(text)

          # Register the resumable API if a preceding workflow lost its push race.
          module = Path('apps/api/src/modules/studio-ai/studio-ai.module.ts')
          text = module.read_text()
          if 'from "./studio-3d-generation.controller"' not in text:
            matches = list(re.finditer(r'^import .*?;\n', text, flags=re.M))
            if not matches: raise SystemExit('No Studio AI module import anchor')
            pos = matches[-1].end()
            text = text[:pos] + '\nimport { Studio3dGenerationController } from "./studio-3d-generation.controller";\nimport { Studio3dGenerationService } from "./studio-3d-generation.service";' + text[pos:]
          if not re.search(r'controllers\s*:\s*\[[^\]]*Studio3dGenerationController', text, flags=re.S):
            text, count = re.subn(r'(controllers\s*:\s*\[)', r'\1Studio3dGenerationController, ', text, count=1)
            if count != 1: raise SystemExit('No controllers array in Studio AI module')
          if not re.search(r'providers\s*:\s*\[[^\]]*Studio3dGenerationService', text, flags=re.S):
            text, count = re.subn(r'(providers\s*:\s*\[)', r'\1Studio3dGenerationService, ', text, count=1)
            if count != 1: raise SystemExit('No providers array in Studio AI module')
          module.write_text(text)
          PY

      - name: Normalize changed sources
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx' '*.mts' '*.mjs' | grep -v '^artifacts/' || true)
          if [ "${#files[@]}" -gt 0 ]; then
            pnpm exec eslint --fix --max-warnings=0 "${files[@]}"
          fi

      - name: Run complete focused acceptance suite
        shell: bash
        run: |
          pnpm exec vitest run \
            apps/web/src/domains/creator/studio-deterministic-serialization.test.ts \
            apps/web/src/domains/creator/ai/studio-stroke-proposal.test.ts \
            apps/web/src/domains/creator/ai/StudioStrokeProposalReviewPanel.test.tsx \
            apps/web/src/domains/creator/ai/studio-3d-generation-client.test.ts \
            apps/web/src/domains/creator/ai/StudioAi3dGenerationPanel.test.tsx \
            apps/web/src/domains/creator/filter/studio-adjustment-effect-graph.test.ts \
            apps/web/src/domains/creator/animation/studio-timeline-timebase.test.ts \
            apps/web/src/domains/creator/studio-asset-family-revision.test.ts \
            apps/web/src/domains/creator/studio-soft-proofing.test.ts \
            apps/web/src/domains/creator/vrm/studio-vrm-texture-dilation.test.ts \
            apps/web/src/domains/creator/vrm/studio-vrm-attachment-graph.test.ts \
            apps/web/src/domains/creator/ai/studio-structured-edit-proposal.test.ts \
            apps/api/src/modules/studio-ai/studio-3d-generation-job-ledger.test.ts \
            apps/api/src/modules/studio-ai/studio-hyper3d-rodin-provider.test.ts \
            apps/web/src/domains/creator/ai/StudioAiAssistHub.test.tsx \
            apps/web/src/domains/creator/ai/StudioAiToolPopoverBody.production.test.ts

      - name: Verify aggregate, types and production build
        shell: bash
        run: |
          pnpm exec tsx scripts/verify-studio-open-issues-wave.mts
          pnpm exec tsc -p tsconfig.json --noEmit --incremental false
          pnpm --filter @webtoon-nest/api run typecheck
          pnpm run build

      - name: Record a green closure receipt and push reconciled changes
        shell: bash
        run: |
          mkdir -p "$(dirname "$STATUS_FILE")"
          node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync(process.env.STATUS_FILE, JSON.stringify({
            schemaVersion: 1,
            passed: true,
            headSha: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            completedAt: new Date().toISOString(),
            checks: {
              focused: 'success',
              lint: 'success',
              webTypecheck: 'success',
              apiTypecheck: 'success',
              aggregate: 'success',
              build: 'success',
            },
          }, null, 2) + '\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . ':!artifacts'
          if ! git diff --cached --quiet; then
            git commit -m "fix(studio): reconcile and verify large-epic closure"
          fi
          for attempt in 1 2 3 4; do
            git fetch origin "$GITHUB_REF_NAME"
            if git rebase "origin/$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME"; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          echo "Unable to publish reconciled branch after retries." >&2
          exit 1
