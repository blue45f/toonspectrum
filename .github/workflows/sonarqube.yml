name: SonarQube

# Reuse the coverage produced by CI's four test shards. Running this workflow
# independently would scan before those reports exist and report 0% coverage.
on:
  workflow_call:
    secrets:
      SONAR_HOST_URL:
        required: false
      SONAR_TOKEN:
        required: false

permissions:
  contents: read


jobs:
  sonarqube:
    name: SonarQube quality gate
    runs-on: ubuntu-latest
    # A full apps/web relocation invalidates the entire analysis cache. The measured cold
    # TypeScript scan alone takes 15 minutes; leave time for indexing and the quality gate.
    timeout-minutes: 45
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_SCANNER_OPTS: -Xmx10240m
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - name: Check SonarQube secrets
        id: secrets
        run: |
          if [ -n "$SONAR_HOST_URL" ] && [ -n "$SONAR_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SonarQube secrets not configured; skipping scan."
          fi

      - uses: actions/checkout@v6
        if: steps.secrets.outputs.configured == 'true'
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6 # NOSONAR S7637 신뢰된 1st-party 액션
        if: steps.secrets.outputs.configured == 'true'

      - uses: actions/setup-node@v6
        if: steps.secrets.outputs.configured == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.secrets.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Download coverage from every CI shard
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/download-artifact@v4 # NOSONAR S7637 신뢰된 1st-party 액션
        with:
          pattern: sonar-coverage-*
          path: coverage

      - name: Require all four nonempty coverage reports
        if: steps.secrets.outputs.configured == 'true'
        run: |
          for shard in 1 2 3 4; do
            test -s "coverage/sonar-coverage-$shard/lcov.info"
          done

      # SonarCloud Automatic Analysis should be disabled to avoid duplicate scans.
      - name: SonarQube scan
        if: steps.secrets.outputs.configured == 'true'
        uses: SonarSource/sonarqube-scan-action@v7 # NOSONAR S7637 신뢰된 1st-party 액션
        env:
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
