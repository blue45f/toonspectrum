name: Studio large epics deep fixes

on:
  push:
    branches:
      - codex/studio-large-epics-closure-20260909
    paths:
      - .github/workflows/studio-large-epics-deep-fix-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      BRANCH: codex/studio-large-epics-closure-20260909
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply server and bridge guards
        run: |
          python3 <<'PY'
          from pathlib import Path

          service = Path('apps/api/src/modules/studio-ai/studio-3d-generation.service.ts')
          text = service.read_text()
          text = text.replace(
            'import { Injectable, ServiceUnavailableException } from "@nestjs/common";',
            'import { BadRequestException, Injectable, ServiceUnavailableException } from "@nestjs/common";',
          )
          marker = '''  ): Promise<Studio3dGenerationJobRecord> {
    const requestId = `studio-3d-${sha256(`${userId}\\u0000${idempotencyKey}`).slice(0, 24)}`;'''
          replacement = '''  ): Promise<Studio3dGenerationJobRecord> {
    if ((input.transport ?? "server") === "byok" && !providerApiKey?.trim()) {
      throw new BadRequestException("BYOK 3D generation requires a session-scoped provider key.");
    }
    const requestId = `studio-3d-${sha256(`${userId}\\u0000${idempotencyKey}`).slice(0, 24)}`;'''
          if 'BYOK 3D generation requires a session-scoped provider key.' not in text:
            if marker not in text: raise SystemExit('3D create method marker not found')
            text = text.replace(marker, replacement, 1)
          service.write_text(text)

          controller = Path('apps/api/src/modules/studio-ai/studio-3d-generation.controller.ts')
          text = controller.read_text()
          if 'BadRequestException' not in text:
            text = text.replace('  Body,\n', '  BadRequestException,\n  Body,\n', 1)
          text = text.replace(
            '      throw new UnauthorizedException("3D 생성 작업 식별자가 필요해요.");',
            '      throw new BadRequestException("3D 생성 작업 식별자가 필요해요.");',
          )
          controller.write_text(text)

          bridge = Path('apps/web/src/domains/creator/ai/studio-stroke-proposal-bridge.ts')
          text = bridge.read_text().replace(
            '  }) as TElement;',
            '  }) as unknown as TElement;',
          )
          bridge.write_text(text)
          PY

      - name: Add privacy boundary regression
        run: |
          cat > apps/api/src/modules/studio-ai/studio-3d-generation-byok-boundary.test.ts <<'TS'
          import { readFileSync } from "node:fs";
          import path from "node:path";

          import { describe, expect, it } from "vitest";

          describe("Studio 3D BYOK privacy boundary", () => {
            it("requires a session-scoped key and never places it in the durable request summary", () => {
              const service = readFileSync(
                path.join(process.cwd(), "apps/api/src/modules/studio-ai/studio-3d-generation.service.ts"),
                "utf8",
              );
              const store = readFileSync(
                path.join(process.cwd(), "apps/api/src/modules/studio-ai/studio-3d-generation-postgres-store.ts"),
                "utf8",
              );
              expect(service).toContain("BYOK 3D generation requires a session-scoped provider key.");
              expect(service).not.toMatch(/record_json[\s\S]{0,500}providerApiKey/u);
              expect(store).not.toContain("providerApiKey");
            });
          });
          TS

      - name: Verify and self-remove
        run: |
          pnpm exec eslint --fix --max-warnings=0 \
            apps/api/src/modules/studio-ai/studio-3d-generation.service.ts \
            apps/api/src/modules/studio-ai/studio-3d-generation.controller.ts \
            apps/api/src/modules/studio-ai/studio-3d-generation-byok-boundary.test.ts \
            apps/web/src/domains/creator/ai/studio-stroke-proposal-bridge.ts
          pnpm exec vitest run \
            apps/api/src/modules/studio-ai/studio-3d-generation-byok-boundary.test.ts \
            apps/web/src/domains/creator/ai/studio-stroke-proposal.test.ts
          pnpm exec tsc -p tsconfig.json --noEmit --incremental false
          pnpm --filter @webtoon-nest/api run typecheck
          rm -f .github/workflows/studio-large-epics-deep-fix-v3.yml

      - name: Publish verified guards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps .github/workflows/studio-large-epics-deep-fix-v3.yml
          git commit -m "fix(studio): enforce private BYOK and bridge safety"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if git rebase "origin/$BRANCH" && git push origin HEAD:"$BRANCH"; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 7))
          done
          exit 1
