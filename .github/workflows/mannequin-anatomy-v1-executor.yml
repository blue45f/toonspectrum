name: Execute mannequin anatomy v1

on:
  push:
    branches: [feat/mannequin-anatomy-v1-20260910]
    paths: [.github/workflows/mannequin-anatomy-v1-executor.yml]

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/mannequin-anatomy-v1-20260910
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Materialize mannequin anatomy product code
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import os, subprocess, yaml
          source = '.github/workflows/mannequin-anatomy-v1-bootstrap.yml'
          data = yaml.safe_load(open(source, encoding='utf-8'))
          for job in data.get('jobs', {}).values():
              for step in job.get('steps', []):
                  script = step.get('run')
                  if not script:
                      continue
                  name = str(step.get('name', ''))
                  if name == 'Validate mannequin anatomy slice' or 'Commit product change' in name or 'git push origin' in script:
                      continue
                  env = os.environ.copy()
                  env.update({str(k): str(v) for k, v in (step.get('env') or {}).items()})
                  print(f'::group::{name or "bootstrap step"}')
                  subprocess.run(script, shell=True, executable='/bin/bash', check=True, env=env)
                  print('::endgroup::')
          PY
      - name: Preserve optional anatomy fields in existing presets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/domains/creator/scene-3d/studio-mannequin-model.ts')
          text = path.read_text(encoding='utf-8')
          old = 'if (source[key] !== undefined || STUDIO_MANNEQUIN_DEFAULT_BODY_PARAMS[key] !== undefined) {'
          new = 'if (source[key] !== undefined) {'
          if text.count(old) != 1:
              raise SystemExit(f'expected one optional anatomy clamp, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate mannequin anatomy scope
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run apps/web/src/domains/creator/scene-3d/studio-mannequin-model.test.ts
          pnpm exec eslint --max-warnings=0 \
            apps/web/src/domains/creator/scene-3d/studio-mannequin-model.ts \
            apps/web/src/domains/creator/scene-3d/StudioMannequinPoserPanel.tsx \
            apps/web/src/domains/creator/scene-3d/studio-mannequin-model.test.ts
          git diff --check
      - name: Commit materialized product slice
        shell: bash
        run: |
          git config user.name toonstudio-3d-ci
          git config user.email actions@users.noreply.github.com
          rm -f .github/workflows/mannequin-anatomy-v1-bootstrap.yml \
                .github/workflows/mannequin-anatomy-v1-executor.yml
          git add -A
          git diff --cached --check
          HUSKY=0 git commit -m 'feat(mannequin): add anatomical silhouette controls'
          HUSKY=0 git push origin HEAD:feat/mannequin-anatomy-v1-20260910
