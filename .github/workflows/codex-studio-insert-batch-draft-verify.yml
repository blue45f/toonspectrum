name: Studio insert batch race recovery

on:
  push:
    branches:
      - fix/studio-insert-batch-race-20260910
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: studio-insert-batch-race-recovery-20260910
  cancel-in-progress: true

jobs:
  verify-and-commit:
    if: ${{ !contains(github.event.head_commit.message || '', '[codex-insert-draft-verified]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    env:
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/studio-insert-batch-race-20260910
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Make queue state immediately observable to async workers
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/web/src/domains/creator/StudioInsertBatchPreflight.tsx")
          source = path.read_text()
          before = '''  function commitItems(
            update: (
              current: readonly BatchItem[],
            ) => readonly BatchItem[],
          ): void {
            setItems((current) => {
              const next = update(current);
              itemsRef.current = next;
              return next;
            });
          }
          '''
          after = '''  function commitItems(
            update: (
              current: readonly BatchItem[],
            ) => readonly BatchItem[],
          ): void {
            const next = update(itemsRef.current);
            itemsRef.current = next;
            setItems(next);
          }
          '''
          if after in source:
              raise SystemExit("queue state hardening is already present")
          if source.count(before) != 1:
              raise SystemExit(
                  f"expected one queue commit helper, found {source.count(before)}"
              )
          path.write_text(source.replace(before, after, 1))

      - name: Add focused queue-state regression coverage
        shell: bash
        run: |
          cat > apps/web/src/domains/creator/studio-insert-batch-queue-state.test.ts <<'TS'
          import { readFileSync } from "node:fs";
          import { describe, expect, it } from "vitest";

          const source = readFileSync(
            new URL("./StudioInsertBatchPreflight.tsx", import.meta.url),
            "utf8",
          );

          describe("Studio insert batch async queue state", () => {
            it("publishes each worker result to the ref before scheduling React state", () => {
              expect(source).toContain("const next = update(itemsRef.current);");
              expect(source).toContain("itemsRef.current = next;\n    setItems(next);");
              expect(source).not.toContain("setItems((current) => {");
            });
          });
          TS

      - name: Lint focused files
        run: |
          pnpm exec eslint --fix \
            apps/web/src/domains/creator/StudioInsertBatchPreflight.tsx \
            apps/web/src/domains/creator/StudioInsertBatchPreflight.test.tsx \
            apps/web/src/domains/creator/studio-insert-batch-queue-state.test.ts \
            apps/web/src/domains/creator/studio-insert-batch-model.ts \
            apps/web/src/domains/creator/studio-insert-batch-model.test.ts \
            apps/web/src/domains/creator/studio-insert-batch-reachability.test.ts \
            apps/web/src/domains/creator/StudioUnifiedAssetToolPopoverContent.tsx
          pnpm exec eslint --max-warnings=0 \
            apps/web/src/domains/creator/StudioInsertBatchPreflight.tsx \
            apps/web/src/domains/creator/StudioInsertBatchPreflight.test.tsx \
            apps/web/src/domains/creator/studio-insert-batch-queue-state.test.ts \
            apps/web/src/domains/creator/studio-insert-batch-model.ts \
            apps/web/src/domains/creator/studio-insert-batch-model.test.ts \
            apps/web/src/domains/creator/studio-insert-batch-reachability.test.ts \
            apps/web/src/domains/creator/StudioUnifiedAssetToolPopoverContent.tsx

      - name: Run focused insertion regressions
        run: |
          pnpm exec vitest run \
            apps/web/src/domains/creator/studio-insert-batch-queue-state.test.ts \
            apps/web/src/domains/creator/studio-insert-batch-model.test.ts \
            apps/web/src/domains/creator/StudioInsertBatchPreflight.test.tsx \
            apps/web/src/domains/creator/studio-insert-batch-reachability.test.ts \
            apps/web/src/domains/creator/StudioInsertHubWorkspace.test.tsx \
            apps/web/src/domains/creator/StudioAssetToolPopoverWorkspace.test.tsx

      - name: Run type and architecture gates
        run: |
          pnpm exec tsc -p tsconfig.json
          pnpm run validate:architecture
          pnpm run verify:studio-menus
          git diff --check

      - name: Commit verified product-only diff
        run: |
          rm -f \
            .github/workflows/codex-studio-insert-batch-draft-verify.yml \
            .github/workflows/restore-ci-after-bulk-integration.yml
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(studio): serialize batch insertion queue state [codex-insert-draft-verified]"
          git push origin HEAD:fix/studio-insert-batch-race-20260910
