name: Final self-contained CodeQL remediation

on:
  push:
    branches:
      - codex/code-scanning-remediation-20260908
    paths:
      - .github/workflows/code-scanning-remediation-v8.yml

permissions:
  actions: write
  checks: write
  contents: write
  models: read
  pull-requests: write
  security-events: write
  statuses: read

concurrency:
  group: final-self-contained-codeql-remediation
  cancel-in-progress: true

env:
  TARGET_BRANCH: codex/code-scanning-remediation-20260908

jobs:
  takeover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      proceed: ${{ steps.branch.outputs.proceed }}
    steps:
      - name: Confirm branch and stop superseded remediation runs
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          encoded="${TARGET_BRANCH//\//%2F}"
          if ! gh api "/repos/${GITHUB_REPOSITORY}/branches/${encoded}" >/dev/null 2>&1; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

          names='[
            "Code scanning autofix",
            "Code scanning remediation gate",
            "Trigger code scanning remediation gate",
            "Complete CodeQL remediation",
            "Collision-safe CodeQL remediation fallback",
            "AI-assisted residual CodeQL remediation",
            "Iterative CodeQL remediation supervisor",
            "Bound earlier CodeQL remediation runtime",
            "Final CodeQL remediation and protected merge",
            "Final CodeQL remediation v7",
            "Guard final CodeQL remediation"
          ]'
          payload="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${TARGET_BRANCH}&per_page=100")"
          jq -r --argjson names "$names" '.workflow_runs[] | select((.name as $n | $names | index($n)) and .status != "completed") | .id' <<<"$payload" | while read -r run_id; do
            [[ -n "$run_id" ]] || continue
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done

          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          [[ -z "$number" ]] || gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --disable-auto || true

      - name: Checkout latest branch
        if: steps.branch.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Integrate latest main
        if: steps.branch.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

  round1:
    needs: takeover
    if: needs.takeover.result == 'success' && needs.takeover.outputs.proceed == 'true'
    permissions:
      contents: write
      models: read
      security-events: read
    uses: ./.github/workflows/codeql-residual-round-v8.yml
    with:
      round: "v8-1"
      branch: codex/code-scanning-remediation-20260908

  round2:
    needs: round1
    if: needs.round1.result == 'success' && needs.round1.outputs.clean != 'true'
    permissions:
      contents: write
      models: read
      security-events: read
    uses: ./.github/workflows/codeql-residual-round-v8.yml
    with:
      round: "v8-2"
      branch: codex/code-scanning-remediation-20260908

  round3:
    needs: round2
    if: needs.round2.result == 'success' && needs.round2.outputs.clean != 'true'
    permissions:
      contents: write
      models: read
      security-events: read
    uses: ./.github/workflows/codeql-residual-round-v8.yml
    with:
      round: "v8-3"
      branch: codex/code-scanning-remediation-20260908

  finalize:
    needs: [takeover, round1, round2, round3]
    if: >-
      ${{
        always() &&
        needs.takeover.result == 'success' &&
        needs.takeover.outputs.proceed == 'true' &&
        needs.round1.result == 'success' &&
        (needs.round2.result == 'success' || needs.round2.result == 'skipped') &&
        (needs.round3.result == 'success' || needs.round3.result == 'skipped')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout latest repaired branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Restore helper and integrate latest main
        shell: bash
        run: |
          set -euo pipefail
          helper_commit="$(git rev-list --all -- scripts/codeql-residual-remediation-v6.py | head -1)"
          [[ -n "$helper_commit" ]] || { echo "Repair helper is missing from history." >&2; exit 1; }
          git show "${helper_commit}:scripts/codeql-residual-remediation-v6.py" > /tmp/codeql-fix-v8.py
          chmod +x /tmp/codeql-fix-v8.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Initialize final CodeQL security-and-quality gate
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Analyze final product candidate
        uses: github/codeql-action/analyze@v3
        with:
          upload: false
          output: /tmp/codeql-v8-final
          category: /language:javascript-typescript

      - name: Require zero final CodeQL security findings
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/codeql-fix-v8.py --sarif-root /tmp/codeql-v8-final --output /tmp/codeql-v8-final-findings.json

      - name: Create or locate pull request
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$number" ]]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$TARGET_BRANCH" \
              --title "fix(security): resolve all open CodeQL findings" \
              --body $'## Summary\n\n- resolves the full open CodeQL inventory\n- applies bounded residual repair passes\n- validates with CodeQL `security-and-quality`\n- runs the exact repository `core` job on the final SHA\n- removes temporary remediation automation before merge\n- re-analyzes the actual merged `main` tree\n\n## Required result\n\nCodeQL findings: **0** · `core`: **success** · merged `main` open alerts: **0**'
            number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --base main --state open --json number --jq '.[0].number')"
          fi
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --disable-auto || true
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Remove all temporary remediation assets
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git reset --hard "origin/$TARGET_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f \
            .github/workflows/code-scanning-inventory.yml \
            .github/workflows/code-scanning-context.yml \
            .github/workflows/code-scanning-autofix.yml \
            .github/workflows/code-scanning-remediation-gate.yml \
            .github/workflows/code-scanning-remediation-gate-trigger.yml \
            .github/workflows/code-scanning-remediation-v2.yml \
            .github/workflows/code-scanning-remediation-v3.yml \
            .github/workflows/code-scanning-remediation-v4.yml \
            .github/workflows/code-scanning-remediation-v5.yml \
            .github/workflows/code-scanning-remediation-v6.yml \
            .github/workflows/code-scanning-remediation-v7.yml \
            .github/workflows/code-scanning-remediation-v8.yml \
            .github/workflows/code-scanning-remediation-deadline.yml \
            .github/workflows/code-scanning-remediation-guard.yml \
            .github/workflows/codeql-residual-round.yml \
            .github/workflows/codeql-residual-round-v6.yml \
            .github/workflows/codeql-residual-round-v8.yml \
            .github/workflows/patch-remediation-v5.yml \
            scripts/codeql-residual-remediation.py \
            scripts/codeql-residual-remediation-v6.py
          git add -A
          git diff --check
          if ! git diff --cached --quiet; then
            git commit -m "chore(security): remove temporary CodeQL remediation automation"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
          if git ls-files | grep -E '(^|/)(code-scanning-remediation|codeql-residual|patch-remediation-v5)' ; then
            echo "Temporary remediation assets remain tracked." >&2
            exit 1
          fi

      - name: Run core on the final SHA
        id: core
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(git rev-parse HEAD)"
          dispatched=false
          before="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=${TARGET_BRANCH}&event=workflow_dispatch&per_page=100" --jq '[.workflow_runs[].id] | max // 0' 2>/dev/null || echo 0)"
          if gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH"; then
            dispatched=true
          fi

          if [[ "$dispatched" == "true" ]]; then
            run_id=""
            for attempt in $(seq 1 120); do
              payload="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=${TARGET_BRANCH}&event=workflow_dispatch&per_page=100")"
              run_id="$(jq -r --arg sha "$expected_sha" --argjson before "$before" '[.workflow_runs[] | select(.id > $before and .head_sha == $sha)][0].id // empty' <<<"$payload")"
              [[ -n "$run_id" ]] && break
              sleep 5
            done
            [[ -n "$run_id" ]] || { echo "Dispatched CI run did not appear." >&2; exit 1; }
            core="pending"
            for attempt in $(seq 1 600); do
              jobs="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" --slurp)"
              core="$(jq -r '[.[].jobs[]? | select(.name == "core")][0].conclusion // [.[].jobs[]? | select(.name == "core")][0].status // "pending"' <<<"$jobs")"
              echo "run=${run_id}; core=${core}; attempt=${attempt}/600"
              case "$core" in
                success) break ;;
                failure|cancelled|timed_out|action_required|startup_failure|stale) exit 1 ;;
              esac
              sleep 15
            done
            [[ "$core" == "success" ]] || exit 1
          else
            mkdir -p /tmp/act
            gh release download --repo nektos/act --pattern 'act_Linux_x86_64.tar.gz' --dir /tmp/act
            tar -xzf /tmp/act/act_Linux_x86_64.tar.gz -C /tmp/act act
            /tmp/act/act workflow_dispatch -W .github/workflows/ci.yml -j core --container-architecture linux/amd64
            jq -n \
              --arg name core \
              --arg head_sha "$expected_sha" \
              --arg status completed \
              --arg conclusion success \
              --arg title 'Core validation passed' \
              --arg summary 'Executed the repository core job through act because ci.yml does not expose workflow_dispatch.' \
              '{name:$name,head_sha:$head_sha,status:$status,conclusion:$conclusion,output:{title:$title,summary:$summary}}' | \
              gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/check-runs" --input - >/dev/null
          fi

          count="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/commits/${expected_sha}/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "core" and .conclusion == "success")] | length')"
          [[ "$count" -ge 1 ]] || { echo "No successful core check is attached to final SHA." >&2; exit 1; }
          echo "sha=$expected_sha" >> "$GITHUB_OUTPUT"

      - name: Require the PR head to match the validated SHA
        shell: bash
        run: |
          set -euo pipefail
          payload="$(gh pr view "${{ steps.pr.outputs.number }}" --repo "$GITHUB_REPOSITORY" --json state,headRefOid,statusCheckRollup)"
          state="$(jq -r '.state' <<<"$payload")"
          head="$(jq -r '.headRefOid' <<<"$payload")"
          core="$(jq -r '[.statusCheckRollup[] | select((.name // .context // "") == "core") | (.conclusion // .state // .status)][-1] // "missing"' <<<"$payload")"
          [[ "$state" == "OPEN" ]] || exit 1
          [[ "$head" == "${{ steps.core.outputs.sha }}" ]] || { echo "PR head changed after validation." >&2; exit 1; }
          [[ "$core" == "SUCCESS" || "$core" == "success" ]] || { echo "PR core status is ${core}." >&2; exit 1; }

      - name: Enable protected squash auto-merge
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "${{ steps.pr.outputs.number }}" --repo "$GITHUB_REPOSITORY" --squash --auto --delete-branch
          for attempt in $(seq 1 240); do
            state="$(gh pr view "${{ steps.pr.outputs.number }}" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')"
            [[ "$state" == "MERGED" ]] && exit 0
            [[ "$state" == "OPEN" ]] || exit 1
            sleep 15
          done
          echo "Timed out waiting for merge." >&2
          exit 1

  verify-main:
    needs: finalize
    if: needs.finalize.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Initialize CodeQL on main
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Analyze actual main tree
        uses: github/codeql-action/analyze@v3
        with:
          upload: false
          output: /tmp/codeql-v8-main
          category: /language:javascript-typescript

      - name: Validate and explicitly upload main SARIF
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json, pathlib
          sarifs = glob.glob('/tmp/codeql-v8-main/**/*.sarif', recursive=True)
          if not sarifs:
              raise SystemExit('No SARIF produced')
          findings=[]; seen=set()
          for path in sarifs:
              data=json.loads(pathlib.Path(path).read_text(encoding='utf-8'))
              for run in data.get('runs',[]):
                  rules={r.get('id'):r for r in ((((run.get('tool') or {}).get('driver') or {}).get('rules')) or [])}
                  for item in run.get('results',[]):
                      rid=item.get('ruleId'); props=(rules.get(rid) or {}).get('properties') or {}; tags=[str(t) for t in (props.get('tags') or [])]
                      if props.get('security-severity') is None and not any(t.startswith('security/') or t.startswith('external/cwe/') for t in tags):
                          continue
                      locs=item.get('locations') or []; physical=((locs[0].get('physicalLocation') if locs else None) or {})
                      key=(rid,((physical.get('artifactLocation') or {}).get('uri')),((physical.get('region') or {}).get('startLine')),((item.get('message') or {}).get('text')))
                      if key not in seen:
                          seen.add(key); findings.append({'rule':key[0],'path':key[1],'line':key[2],'message':key[3]})
          print(json.dumps(findings,ensure_ascii=False,indent=2))
          if findings:
              raise SystemExit(f'Main has {len(findings)} CodeQL security finding(s)')
          pathlib.Path('/tmp/main-sarif.txt').write_text(sarifs[0],encoding='utf-8')
          PY
          sarif="$(cat /tmp/main-sarif.txt)"
          gzip -c "$sarif" > /tmp/main.sarif.gz
          encoded="$(base64 -w0 /tmp/main.sarif.gz)"
          sha="$(git rev-parse HEAD)"
          response="$(jq -n --arg commit_sha "$sha" --arg ref 'refs/heads/main' --arg sarif "$encoded" --arg checkout_uri "file://${GITHUB_WORKSPACE}" '{commit_sha:$commit_sha,ref:$ref,sarif:$sarif,checkout_uri:$checkout_uri}' | gh api --method POST "/repos/${GITHUB_REPOSITORY}/code-scanning/sarifs" --input -)"
          id="$(jq -r '.id' <<<"$response")"
          [[ -n "$id" && "$id" != "null" ]] || exit 1
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Require processed SARIF and zero open alerts
        shell: bash
        run: |
          set -euo pipefail
          status=pending
          for attempt in $(seq 1 120); do
            payload="$(gh api "/repos/${GITHUB_REPOSITORY}/code-scanning/sarifs/${{ steps.upload.outputs.id }}")"
            status="$(jq -r '.processing_status // .status // "pending"' <<<"$payload")"
            [[ "$status" == "complete" ]] && break
            [[ "$status" == "failed" ]] && exit 1
            sleep 10
          done
          [[ "$status" == "complete" ]] || exit 1
          count=-1
          for attempt in $(seq 1 120); do
            count="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&tool_name=CodeQL&ref=refs%2Fheads%2Fmain&per_page=100" --slurp | jq '[.[][]] | length')"
            [[ "$count" == "0" ]] && break
            sleep 10
          done
          [[ "$count" == "0" ]] || { echo "Open main CodeQL alerts: $count" >&2; exit 1; }
          gh pr comment "${{ needs.finalize.outputs.pr_number }}" --repo "$GITHUB_REPOSITORY" --body "✅ 완료: 병합된 \\`main\\`을 다시 분석했고 열린 CodeQL 경고는 **0건**입니다."
