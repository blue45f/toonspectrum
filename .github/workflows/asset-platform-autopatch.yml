name: Asset platform one-shot integration patch

on:
  push:
    branches:
      - feat/asset-platform-foundation
    paths:
      - scripts/asset-platform-autopatch.mjs
      - .github/workflows/asset-platform-autopatch.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[asset-platform-autopatch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/asset-platform-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply exact source patches
        run: node scripts/asset-platform-autopatch.mjs
      - name: Remove one-shot patch machinery
        run: rm scripts/asset-platform-autopatch.mjs .github/workflows/asset-platform-autopatch.yml
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(asset-platform): integrate foundation contracts [asset-platform-autopatch]"
          git push origin HEAD:feat/asset-platform-foundation
