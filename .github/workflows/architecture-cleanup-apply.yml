name: Apply verified architecture cleanup

on:
  push:
    branches:
      - chore/architecture-sonar-cleanup
    paths:
      - .github/workflows/architecture-cleanup-apply.yml

permissions:
  contents: write

concurrency:
  group: architecture-cleanup-apply-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      HUSKY: 0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/architecture-sonar-cleanup
          fetch-depth: 20
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply the reviewed cleanup and validate it
        shell: bash
        run: |
          set -euo pipefail
          git show 8efd38805c295bec8bdb3b06ee3ee2f6a9419bb0:.github/workflows/architecture-cleanup-finalize.yml > /tmp/finalizer.yml
          node <<'NODE'
          const fs = require('node:fs');
          const YAML = require('yaml');
          const workflow = YAML.parse(fs.readFileSync('/tmp/finalizer.yml', 'utf8'));
          const wanted = new Map([
            ['Consolidate browser-only harnesses and fixtures', '/tmp/consolidate.sh'],
            ['Apply architecture, readability, and CI hardening', '/tmp/apply.sh'],
            ['Refresh deterministic toolchain floors', '/tmp/refresh.sh'],
            ['Validate architecture, code quality, types, and production bundle', '/tmp/validate.sh'],
          ]);
          for (const step of workflow.jobs.finalize.steps) {
            const destination = wanted.get(step.name);
            if (destination) fs.writeFileSync(destination, `set -euo pipefail\n${step.run}\n`);
          }
          for (const destination of wanted.values()) {
            if (!fs.existsSync(destination)) throw new Error(`missing extracted step: ${destination}`);
          }
          NODE

          bash /tmp/consolidate.sh
          bash /tmp/apply.sh

          python3 <<'PY'
          from pathlib import Path

          path = Path('eslint.config.mjs')
          source = path.read_text(encoding='utf-8')
          for entry in [
              "      { type: 'shared', pattern: 'apps/web/src/shared/**/*', mode: 'full' },\n",
              "      { type: 'shared', pattern: 'apps/web/src/types/**/*', mode: 'full' },\n",
          ]:
              if source.count(entry) != 1:
                  raise SystemExit(f'expected one generated boundary entry, found {source.count(entry)}')
              source = source.replace(entry, '')
          path.write_text(source, encoding='utf-8')
          PY

          python3 <<'PY'
          from pathlib import Path

          path = Path('scripts/validate-architecture.mjs')
          source = path.read_text(encoding='utf-8')
          old = '    forbidden: "tools/browser-harnesses/promo-e2e.html",'
          new = '    forbidden: "\\n      - \'tools/browser-harnesses/promo-e2e.html\'",'
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one promo guard, found {source.count(old)}')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY

          python3 <<'PY'
          from pathlib import Path

          path = Path('/tmp/validate.sh')
          source = path.read_text(encoding='utf-8')
          old = " '*.orig' '*.rej'"
          if source.count(old) != 1:
              raise SystemExit(f'expected one generated recovery-file glob, found {source.count(old)}')
          path.write_text(source.replace(old, " '*.rej'"), encoding='utf-8')
          PY

          mkdir -p artifacts/workflow-patch
          cp .github/workflows/ci.yml artifacts/workflow-patch/ci.yml
          cp .github/workflows/studio-asset-browser.yml artifacts/workflow-patch/studio-asset-browser.yml
          cp .github/workflows/studio-promo-video.yml artifacts/workflow-patch/studio-promo-video.yml
          cp .github/workflows/studio-wearable-runtime-review.yml artifacts/workflow-patch/studio-wearable-runtime-review.yml
          git rev-parse HEAD > artifacts/workflow-patch/source-head.txt

          bash /tmp/refresh.sh
          bash /tmp/validate.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-cleanup-workflow-patch-${{ github.run_id }}
          path: artifacts/workflow-patch/
          retention-days: 3
          if-no-files-found: error

      - name: Commit verified non-workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git restore --source=HEAD --staged --worktree .github/workflows
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Workflow files must not be staged by this job.' >&2
            exit 1
          fi
          git diff --cached --check
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No non-workflow cleanup changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --no-verify -m 'refactor: finalize web architecture cleanup'
          git push --no-verify origin HEAD:chore/architecture-sonar-cleanup
