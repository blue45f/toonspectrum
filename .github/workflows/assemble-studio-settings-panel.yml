name: Assemble Studio settings panel upload

on:
  push:
    branches:
      - feat/studio-application-settings-workbench-20260909
    paths:
      - .upload-chunks/studio-app-settings-panel/**
      - .github/workflows/assemble-studio-settings-panel.yml

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reconstruct and verify source blob
        shell: python
        run: |
          from base64 import b64decode
          from bz2 import decompress
          from hashlib import sha1
          from pathlib import Path

          chunks_dir = Path('.upload-chunks/studio-app-settings-panel')
          payload = ''.join(path.read_text(encoding='ascii').strip() for path in sorted(chunks_dir.glob('part-*')))
          source = decompress(b64decode(payload, validate=True))
          blob_sha = sha1(f'blob {len(source)}\0'.encode() + source).hexdigest()
          expected = '49919ac550989e7b4d79264e3c5930d7ff271b61'
          if blob_sha != expected:
              raise SystemExit(f'blob SHA mismatch: {blob_sha} != {expected}')

          target = Path('apps/web/src/domains/creator/StudioAppSettingsPanel.tsx')
          target.write_bytes(source)
      - name: Commit reconstructed source
        run: |
          rm -rf .upload-chunks/studio-app-settings-panel
          rm -f .github/workflows/assemble-studio-settings-panel.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(studio): assemble settings workbench source"
          git push
