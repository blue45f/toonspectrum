name: Retire failed CI run for PR 907

on:
  push:
    branches:
      - ci/actions-queue-dedupe-20260908
    paths:
      - .github/workflows/one-shot-preempt-finishing-907.yml

permissions: {}

concurrency:
  group: CI-907
  cancel-in-progress: true

jobs:
  retire:
    if: ${{ false }}
    runs-on: ubuntu-slim
    steps:
      - run: echo "The failed PR 907 CI run was retired before applying its lint repair."
