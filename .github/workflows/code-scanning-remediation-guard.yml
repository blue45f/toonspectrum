name: Guard final CodeQL remediation

on:
  push:
    branches:
      - codex/code-scanning-remediation-20260908
    paths:
      - .github/workflows/code-scanning-remediation-guard.yml

permissions:
  actions: write
  contents: write
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN || secrets.GH_PAT || secrets.REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || github.token }}
      TARGET_BRANCH: codex/code-scanning-remediation-20260908
    steps:
      - name: Remove guard file from the remediation branch immediately
        uses: actions/checkout@v4
        with:
          ref: codex/code-scanning-remediation-20260908
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Commit self-cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/code-scanning-remediation-guard.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(security): remove remediation retry guard"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Wait for and retry final remediation when necessary
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 120); do
            payload="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${TARGET_BRANCH}&per_page=100")"
            run_id="$(jq -r '[.workflow_runs[] | select(.name == "Final CodeQL remediation v7")][0].id // empty' <<<"$payload")"
            [[ -n "$run_id" ]] && break
            encoded="${TARGET_BRANCH//\//%2F}"
            gh api "/repos/${GITHUB_REPOSITORY}/branches/${encoded}" >/dev/null 2>&1 || exit 0
            echo "Waiting for final remediation run to appear (${attempt}/120)"
            sleep 5
          done
          [[ -n "$run_id" ]] || { echo "Final remediation run was not found." >&2; exit 1; }

          for retry in 0 1 2; do
            status=""
            conclusion=""
            for attempt in $(seq 1 960); do
              payload="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
              status="$(jq -r '.status' <<<"$payload")"
              conclusion="$(jq -r '.conclusion // "pending"' <<<"$payload")"
              run_attempt="$(jq -r '.run_attempt' <<<"$payload")"
              echo "run=${run_id}; run_attempt=${run_attempt}; status=${status}; conclusion=${conclusion}; retry=${retry}; poll=${attempt}/960"
              [[ "$status" == "completed" ]] && break
              sleep 15
            done

            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
              exit 0
            fi
            if [[ "$retry" == "2" ]]; then
              echo "Final remediation failed after bounded retries: ${conclusion}" >&2
              exit 1
            fi

            previous_attempt="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.run_attempt')"
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/rerun"
            for transition in $(seq 1 120); do
              payload="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
              current_attempt="$(jq -r '.run_attempt' <<<"$payload")"
              current_status="$(jq -r '.status' <<<"$payload")"
              if [[ "$current_attempt" -gt "$previous_attempt" || "$current_status" != "completed" ]]; then
                break
              fi
              sleep 5
            done
          done
