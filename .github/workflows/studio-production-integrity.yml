name: Studio production integrity

on:
  pull_request:
    branches: [main, release/salvage-integration-20260908]
    paths:
      - 'scripts/check-studio-bundle.mjs'
      - 'scripts/lib/studio-crdt-bundle-boundary*'
      - 'scripts/lib/repo-paths.mjs'
      - 'scripts/integration-test-runner-ci-policy.test.mjs'
      - 'vite.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'apps/web/src/domains/creator/studio-production/**'
      - 'apps/web/src/domains/creator/studio-router/studio-route-manifest*'
      - 'apps/web/src/domains/creator/studio-router/StudioRouteCollaborationGateway*'
      - 'apps/web/src/domains/creator/studio-router/studio-production-command-center-boundary*'
      - 'apps/web/src/domains/creator/studio-router/StudioRouteEntryContracts*'
      - 'apps/web/src/domains/creator/StudioInspector*'
      - 'apps/web/src/domains/creator/studio-batch-rename*'
      - '.github/workflows/ci.yml'
      - '.github/workflows/studio-production-integrity.yml'
      - 'scripts/ci-executed-gates.test.mjs'
  push:
    branches: [main, release/salvage-integration-20260908]
    paths:
      - 'scripts/check-studio-bundle.mjs'
      - 'scripts/lib/studio-crdt-bundle-boundary*'
      - 'scripts/lib/repo-paths.mjs'
      - 'scripts/integration-test-runner-ci-policy.test.mjs'
      - 'vite.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'apps/web/src/domains/creator/studio-production/**'
      - 'apps/web/src/domains/creator/studio-router/studio-route-manifest*'
      - 'apps/web/src/domains/creator/studio-router/StudioRouteCollaborationGateway*'
      - 'apps/web/src/domains/creator/studio-router/studio-production-command-center-boundary*'
      - 'apps/web/src/domains/creator/studio-router/StudioRouteEntryContracts*'
      - 'apps/web/src/domains/creator/StudioInspector*'
      - 'apps/web/src/domains/creator/studio-batch-rename*'
      - '.github/workflows/ci.yml'
      - '.github/workflows/studio-production-integrity.yml'
      - 'scripts/ci-executed-gates.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

# main 푸시도 최신 커밋만 남긴다. 그룹을 SHA 로 묶으면 main 실행이 저마다 다른 그룹이 되어
# cancel-in-progress 가 취소할 대상을 갖지 못한다.
concurrency:
  group: studio-production-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify real CI execution contract
        run: node --test scripts/ci-executed-gates.test.mjs
      - name: Verify actual production routes and Inspector integration
        run: |
          pnpm exec vitest run \
            apps/web/src/domains/creator/studio-production/studio-production-scope.test.ts \
            apps/web/src/domains/creator/studio-production/StudioProductionHubPage.scope.test.tsx \
            apps/web/src/domains/creator/studio-router/studio-route-manifest.test.ts \
            apps/web/src/domains/creator/studio-router/StudioRouteCollaborationGateway.test.tsx \
            apps/web/src/domains/creator/studio-router/studio-production-command-center-boundary.test.ts \
            apps/web/src/domains/creator/studio-router/StudioRouteEntryContracts.test.tsx \
            apps/web/src/domains/creator/studio-batch-rename.test.ts \
            apps/web/src/domains/creator/StudioInspectorBatchRenameSection.test.tsx \
            apps/web/src/domains/creator/studio-inspector-multi-selection-boundary.test.ts \
            apps/web/src/domains/creator/StudioInspectorOrderAlignSection.test.tsx
      - name: Build production browser without repeating the core typecheck
        run: |
          pnpm run build:bundle
          pnpm run check:studio-bundle
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium
      - name: Inspect actual production browser
        run: pnpm run verify:studio-menus
