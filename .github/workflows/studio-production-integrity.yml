name: Studio production integrity

on:
  push:
    branches: [integrate/perf-debounce-throttle-20260911]
    paths: [.github/workflows/studio-production-integrity.yml]

permissions:
  contents: write

concurrency:
  group: integrate-perf-debounce-throttle-20260911
  cancel-in-progress: true

jobs:
  integrate-performance-work:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      TARGET_BRANCH: integrate/perf-debounce-throttle-20260911
      PARENT_BRANCH: fix/real-core-and-main-only-20260910
      SOURCE_BRANCH: codex/perf-debounce-throttle-main-20260911
      SOURCE_BASE: main
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integrate/perf-debounce-throttle-20260911
          fetch-depth: 1
          persist-credentials: true

      - name: Apply only the cumulative performance product diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"

          git fetch --no-tags --depth=1 origin \
            "${SOURCE_BASE}:refs/remotes/origin/${SOURCE_BASE}"
          git fetch --no-tags --depth=32 origin \
            "${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"

          files=(
            apps/web/src/domains/creator/StudioCc0AssetLibraryPanel.tsx
            apps/web/src/domains/creator/StudioLeftToolRail.tsx
            apps/web/src/domains/creator/live/StudioLiveCanvasOverlay.tsx
            apps/web/src/domains/creator/live/StudioLiveCollaborationCommandCenter.tsx
            apps/web/src/domains/creator/live/StudioLiveCollaborationPanel.tsx
            apps/web/src/domains/creator/live/use-studio-live-display-sync.test.tsx
            apps/web/src/domains/creator/live/use-studio-live-display-sync.ts
            apps/web/src/domains/market/components/MarketDetailStickyBar.tsx
            apps/web/src/domains/market/components/MarketProductionFitWorkbench.test.tsx
            apps/web/src/domains/market/components/MarketResourceDetailArticle.test.tsx
            apps/web/src/domains/market/components/MarketSceneCompletionJourney.tsx
            apps/web/src/domains/market/models/market-comparison.test.ts
            apps/web/src/domains/market/models/market-resource-taxonomy.ts
            apps/web/src/domains/market/pages/MarketBrowsePage.test.tsx
            apps/web/src/domains/market/pages/MarketHomePage.test.tsx
            apps/web/src/shared/components/back-to-top.tsx
          )

          git diff --binary \
            "origin/${SOURCE_BASE}" "origin/${SOURCE_BRANCH}" \
            -- "${files[@]}" > "$RUNNER_TEMP/performance.patch"
          test -s "$RUNNER_TEMP/performance.patch"

          if ! git apply --3way --index "$RUNNER_TEMP/performance.patch"; then
            echo "3-way application could not resolve every product overlap." >&2
            git status --short
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git diff --cached --check

      - name: Publish product-only integration
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${PARENT_BRANCH}/.github/workflows/studio-production-integrity.yml" \
            --output .github/workflows/studio-production-integrity.yml
          git add -A
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit \
            -m "perf(studio): debounce and throttle high-frequency UI updates"
          git push --no-verify origin "HEAD:${TARGET_BRANCH}"
