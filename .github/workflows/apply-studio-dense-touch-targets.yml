name: Apply studio dense touch targets

on:
  push:
    branches:
      - fix/studio-dense-touch-targets-20260908

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the issue branch
        uses: actions/checkout@v4
        with:
          ref: fix/studio-dense-touch-targets-20260908

      - name: Apply the bounded shared-token patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/src/domains/creator/studio-panel-ui.tsx")
          source = path.read_text(encoding="utf-8")
          old = '"h-9 gap-1.5 px-2.5 text-[0.72rem] max-lg:h-11 max-lg:min-h-11 pointer-coarse:h-11 pointer-coarse:min-h-11 pointer-coarse:gap-1.5 pointer-coarse:px-3 pointer-coarse:text-[0.8125rem]"'
          new = '"h-11 min-h-11 gap-1.5 px-2.5 text-[0.72rem] pointer-coarse:gap-1.5 pointer-coarse:px-3 pointer-coarse:text-[0.8125rem]"'
          if source.count(old) != 1:
              raise SystemExit(f"expected exactly one dense toolbar token, found {source.count(old)}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

          cat > apps/web/src/domains/creator/studio-panel-ui.desktop-touch-target.test.tsx <<'EOF'
          import { describe, expect, it } from "vitest";

          import { studioToolButtonClass } from "./studio-panel-ui";

          describe("studioToolButtonClass desktop touch targets", () => {
            it("keeps dense toolbar controls at least 44px tall on every pointer type", () => {
              const tokens = studioToolButtonClass(false, { dense: true }).split(/\s+/);

              expect(tokens).toEqual(expect.arrayContaining(["h-11", "min-h-11"]));
              expect(tokens).not.toContain("h-9");
              expect(tokens).not.toContain("max-lg:h-11");
            });
          });
          EOF

          rm .github/workflows/apply-studio-dense-touch-targets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/domains/creator/studio-panel-ui.tsx \
            apps/web/src/domains/creator/studio-panel-ui.desktop-touch-target.test.tsx \
            .github/workflows/apply-studio-dense-touch-targets.yml
          git commit -m "fix(a11y): make dense studio tools 44px tall"
          git push origin HEAD:fix/studio-dense-touch-targets-20260908
