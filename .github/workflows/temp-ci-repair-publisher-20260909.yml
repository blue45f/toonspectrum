name: Temporary CI repair publisher

on:
  push:
    branches:
      - fix/studio-qa-browser-runtime-20260909

permissions:
  contents: write

concurrency:
  group: temporary-ci-repair-publisher-20260909
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/studio-qa-browser-runtime-20260909
          fetch-depth: 0

      - name: Apply confirmed CI repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int | None = None) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              occurrences = text.count(old)
              if occurrences == 0:
                  raise SystemExit(f"expected source fragment was not found: {path}")
              if count is not None and occurrences != count:
                  raise SystemExit(
                      f"unexpected source fragment count in {path}: expected {count}, got {occurrences}"
                  )
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "apps/api/src/modules/studio-ai/studio-3d-generation-job-ledger.ts",
              '''    ready: new Set(),
              failed: new Set(),
              cancelled: new Set(),
              expired: new Set(),''',
              '''    ready: new Set<Studio3dGenerationJobState>(),
              failed: new Set<Studio3dGenerationJobState>(),
              cancelled: new Set<Studio3dGenerationJobState>(),
              expired: new Set<Studio3dGenerationJobState>(),''',
              count=1,
          )

          replace(
              "apps/api/src/modules/studio-ai/studio-ai-comic-director-schema-preflight.ts",
              'import { runSchemaPreflightToleratingDbUnavailability } from "../../db/schema-preflight";',
              'import { runSchemaPreflightToleratingDbUnavailability } from "../../common/database-availability";',
              count=1,
          )

          controller = "apps/api/src/modules/studio-ai/studio-ai-comic-director.controller.ts"
          replace(
              controller,
              '''  Get,
              Header,
              Headers,''',
              '''  Get,
              Headers,''',
              count=1,
          )
          replace(
              controller,
              '''  Query,
              UnauthorizedException,
            } from "@nestjs/common";''',
              '''  Query,
              type CallHandler,
              type ExecutionContext,
              type NestInterceptor,
              UnauthorizedException,
              UseInterceptors,
            } from "@nestjs/common";''',
              count=1,
          )
          replace(
              controller,
              '''import { StudioAiComicDirectorService } from "./studio-ai-comic-director.service";

            function authenticatedUserId''',
              '''import { StudioAiComicDirectorService } from "./studio-ai-comic-director.service";

            interface HeaderResponse {
              setHeader(name: string, value: string): void;
            }

            const NO_STORE_INTERCEPTOR = {
              intercept(context: ExecutionContext, next: CallHandler) {
                context
                  .switchToHttp()
                  .getResponse<HeaderResponse>()
                  .setHeader("Cache-Control", "no-store, max-age=0");
                return next.handle();
              },
            } satisfies NestInterceptor;

            function authenticatedUserId''',
              count=1,
          )
          replace(
              controller,
              '''@Controller("studio-ai/comic-director")
            @Header("Cache-Control", "no-store, max-age=0")''',
              '''@Controller("studio-ai/comic-director")
            @UseInterceptors(NO_STORE_INTERCEPTOR)''',
              count=1,
          )

          replace(
              "apps/web/src/domains/creator/ai/studio-3d-generation-client.test.ts",
              "const fetchMock = vi.fn<typeof fetch>().mockResolvedValue(jsonResponse(job));",
              "const fetchMock = vi.fn<typeof fetch>().mockImplementation(async () => jsonResponse(job));",
              count=1,
          )
          PY

          git rm .github/workflows/temp-ci-repair-publisher-20260909.yml

      - name: Commit repairs to the PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/modules/studio-ai/studio-3d-generation-job-ledger.ts \
            apps/api/src/modules/studio-ai/studio-ai-comic-director-schema-preflight.ts \
            apps/api/src/modules/studio-ai/studio-ai-comic-director.controller.ts \
            apps/web/src/domains/creator/ai/studio-3d-generation-client.test.ts
          git commit -m "fix(ci): repair API type contracts and 3D fetch mock"
          git push origin HEAD:fix/studio-qa-browser-runtime-20260909
