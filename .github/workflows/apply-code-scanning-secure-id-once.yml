name: Apply secure AI Comic Director IDs once

on:
  push:
    branches:
      - fix/code-scanning-secure-comic-ids-20260910-v2
    paths:
      - .github/workflows/apply-code-scanning-secure-id-once.yml

permissions:
  contents: write

concurrency:
  group: secure-ai-comic-director-ids-20260910-v2
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/code-scanning-secure-comic-ids-20260910-v2
          fetch-depth: 1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm
      - name: Replace insecure ID fallbacks
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected one replacement in {path}, found {count}")
              target.write_text(source.replace(old, new))

          route = "apps/web/src/domains/creator/studio-router/routes/StudioAiComicDirectorRoute.tsx"
          replace_once(
              route,
              'import { cn } from "@/shared/lib/utils";\n',
              'import { createSecureRandomUuid } from "@/shared/lib/secure-random-id";\nimport { cn } from "@/shared/lib/utils";\n',
          )
          replace_once(
              route,
              '''function uid(): string {
            return globalThis.crypto?.randomUUID?.()
              ?? `comic-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
          }
          ''',
              '''function uid(): string {
            return createSecureRandomUuid(
              "이 브라우저에서는 안전한 AI 코믹 디렉터 세션 ID를 만들 수 없습니다.",
            );
          }
          ''',
          )

          session = "apps/web/src/domains/creator/ai/studio-ai-comic-director-session.ts"
          replace_once(
              session,
              'import type { ScenarioPreviewItem } from "../studio-scenario-layout";\n',
              'import type { ScenarioPreviewItem } from "../studio-scenario-layout";\n\nimport { createSecureRandomUuid } from "@/shared/lib/secure-random-id";\n',
          )
          replace_once(
              session,
              '''function id(): string {
            return globalThis.crypto?.randomUUID?.()
              ?? `comic-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
          }
          ''',
              '''function id(): string {
            return createSecureRandomUuid(
              "이 브라우저에서는 안전한 AI 코믹 디렉터 문서 ID를 만들 수 없습니다.",
            );
          }
          ''',
          )

          panel = "apps/web/src/domains/creator/ai/StudioAiComicDirectorPanel.tsx"
          replace_once(
              panel,
              'import { cn } from "@/shared/lib/utils";\n',
              'import { createSecureRandomUuid } from "@/shared/lib/secure-random-id";\nimport { cn } from "@/shared/lib/utils";\n',
          )
          replace_once(
              panel,
              '''function uid(prefix: string): string {
            return globalThis.crypto?.randomUUID?.() ?? `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
          }
          ''',
              '''function uid(prefix: string): string {
            return createSecureRandomUuid(
              `이 브라우저에서는 안전한 ${prefix} ID를 만들 수 없습니다.`,
            );
          }
          ''',
          )

          Path("apps/web/src/shared/lib/secure-random-id.ts").write_text('''const DEFAULT_SECURE_RANDOM_ID_ERROR =
            "이 환경에서는 안전한 식별자를 만들 수 없습니다.";

          /**
           * Creates an RFC 4122 version 4 UUID using Web Crypto only.
           *
           * Some embedded WebViews expose getRandomValues without randomUUID. Falling back to
           * cryptographically secure bytes preserves those environments without ever issuing a
           * predictable identifier from Math.random, time, counters, or process state.
           */
          export function createSecureRandomUuid(
            errorMessage = DEFAULT_SECURE_RANDOM_ID_ERROR,
          ): string {
            const cryptoApi = globalThis.crypto;
            if (typeof cryptoApi?.randomUUID === "function") {
              try {
                return cryptoApi.randomUUID();
              } catch {
                // Older or policy-restricted WebViews can expose a throwing implementation.
              }
            }

            if (typeof cryptoApi?.getRandomValues !== "function") {
              throw new Error(errorMessage);
            }

            const bytes = new Uint8Array(16);
            try {
              cryptoApi.getRandomValues(bytes);
            } catch {
              throw new Error(errorMessage);
            }
            bytes[6] = (bytes[6] & 0x0f) | 0x40;
            bytes[8] = (bytes[8] & 0x3f) | 0x80;
            const hex = Array.from(
              bytes,
              (value) => value.toString(16).padStart(2, "0"),
            ).join("");
            return [
              hex.slice(0, 8),
              hex.slice(8, 12),
              hex.slice(12, 16),
              hex.slice(16, 20),
              hex.slice(20),
            ].join("-");
          }
          ''')

          Path("apps/web/src/shared/lib/secure-random-id.test.ts").write_text('''import { afterEach, describe, expect, it, vi } from "vitest";

          import { createSecureRandomUuid } from "./secure-random-id";

          afterEach(() => {
            vi.restoreAllMocks();
            vi.unstubAllGlobals();
          });

          describe("createSecureRandomUuid", () => {
            it("prefers the platform randomUUID implementation", () => {
              const randomUUID = vi.fn(() => "123e4567-e89b-42d3-a456-426614174000");
              const getRandomValues = vi.fn();
              vi.stubGlobal("crypto", { randomUUID, getRandomValues });

              expect(createSecureRandomUuid()).toBe(
                "123e4567-e89b-42d3-a456-426614174000",
              );
              expect(randomUUID).toHaveBeenCalledOnce();
              expect(getRandomValues).not.toHaveBeenCalled();
            });

            it.each(["missing", "throws"] as const)(
              "uses secure bytes when randomUUID %s",
              (mode) => {
                const random = vi.spyOn(Math, "random").mockImplementation(() => {
                  throw new Error("Math.random must never issue persistent IDs");
                });
                const getRandomValues = vi.fn((bytes: Uint8Array) => {
                  bytes.fill(0xab);
                  return bytes;
                });
                vi.stubGlobal("crypto", {
                  ...(mode === "throws"
                    ? { randomUUID: () => { throw new Error("UUID unavailable"); } }
                    : {}),
                  getRandomValues,
                });

                expect(createSecureRandomUuid()).toBe(
                  "abababab-abab-4bab-abab-abababababab",
                );
                expect(getRandomValues).toHaveBeenCalledOnce();
                expect(random).not.toHaveBeenCalled();
              },
            );

            it("fails closed when secure entropy is unavailable", () => {
              const random = vi.spyOn(Math, "random");
              vi.stubGlobal("crypto", undefined);

              expect(() => createSecureRandomUuid("secure ID unavailable")).toThrow(
                "secure ID unavailable",
              );
              expect(random).not.toHaveBeenCalled();
            });

            it("fails closed when the secure byte provider throws", () => {
              vi.stubGlobal("crypto", {
                randomUUID: () => { throw new Error("UUID unavailable"); },
                getRandomValues: () => { throw new Error("entropy unavailable"); },
              });

              expect(() => createSecureRandomUuid("secure ID unavailable")).toThrow(
                "secure ID unavailable",
              );
            });
          });
          ''')

          Path("apps/web/src/domains/creator/ai/studio-ai-comic-director-security.test.ts").write_text('''import { readFileSync } from "node:fs";

          import { describe, expect, it } from "vitest";

          const ID_CONSUMERS = [
            "./studio-ai-comic-director-session.ts",
            "./StudioAiComicDirectorPanel.tsx",
            "../studio-router/routes/StudioAiComicDirectorRoute.tsx",
          ] as const;

          describe("AI Comic Director identifier security", () => {
            it("uses the shared Web Crypto issuer at every client-side ID boundary", () => {
              for (const relativePath of ID_CONSUMERS) {
                const source = readFileSync(new URL(relativePath, import.meta.url), "utf8");
                expect(source, relativePath).toContain("createSecureRandomUuid");
                expect(source, relativePath).not.toContain("Math.random");
              }
            });

            it("keeps the API client free from insecure randomness", () => {
              const source = readFileSync(
                new URL("./studio-ai-comic-director-api.ts", import.meta.url),
                "utf8",
              );
              expect(source).not.toContain("Math.random");
            });
          });
          ''')
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify focused security regressions
        run: |
          pnpm exec vitest run \
            apps/web/src/shared/lib/secure-random-id.test.ts \
            apps/web/src/domains/creator/ai/studio-ai-comic-director-security.test.ts
          pnpm exec eslint --max-warnings=0 --no-warn-ignored \
            apps/web/src/shared/lib/secure-random-id.ts \
            apps/web/src/shared/lib/secure-random-id.test.ts \
            apps/web/src/domains/creator/ai/studio-ai-comic-director-session.ts \
            apps/web/src/domains/creator/ai/studio-ai-comic-director-security.test.ts \
            apps/web/src/domains/creator/ai/StudioAiComicDirectorPanel.tsx \
            apps/web/src/domains/creator/studio-router/routes/StudioAiComicDirectorRoute.tsx
          pnpm exec tsc -p tsconfig.json --noEmit --pretty false
          git diff --check
      - name: Commit verified remediation and retire temporary audit files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-code-scanning-secure-id-once.yml
          git rm .github/workflows/code-scanning-audit-temp.yml
          git rm .github/code-scanning-open-alerts.json
          git rm .github/code-scanning-open-alerts.md
          git add \
            apps/web/src/shared/lib/secure-random-id.ts \
            apps/web/src/shared/lib/secure-random-id.test.ts \
            apps/web/src/domains/creator/ai/studio-ai-comic-director-session.ts \
            apps/web/src/domains/creator/ai/studio-ai-comic-director-security.test.ts \
            apps/web/src/domains/creator/ai/StudioAiComicDirectorPanel.tsx \
            apps/web/src/domains/creator/studio-router/routes/StudioAiComicDirectorRoute.tsx
          git diff --cached --check
          HUSKY=0 git commit -m "fix(security): use Web Crypto for comic director IDs"
          HUSKY=0 git push origin HEAD:fix/code-scanning-secure-comic-ids-20260910-v2
