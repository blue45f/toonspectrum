name: ToonStudio session completion orchestrator

on:
  push:
    branches:
      - feat/toonstudio-session-complete-20260911-1221
    paths:
      - "docs/rewrite/toonstudio-session-trigger-*.txt"

permissions:
  contents: write
  pull-requests: write

env:
  NODE_OPTIONS: --max-old-space-size=8192

concurrency:
  group: toonstudio-session-completion-orchestrator
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout latest completion branch
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-session-complete-20260911-1221
          fetch-depth: 0

      - name: Synchronize latest canonical PR branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/toonstudio-final-ia-20260911
          git merge --no-edit origin/feat/toonstudio-final-ia-20260911

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply pending deterministic fixes
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re
          import textwrap

          source = Path('.github/workflows/apply-toonstudio-session-fixes.yml')
          if not source.exists():
              print('Deterministic fixes are already committed.')
              raise SystemExit(0)

          workflow = source.read_text()
          block = re.search(
              r'- name: Apply deterministic source fixes\n.*?run: \|\n(?P<body>.*?)\n\s+- name: Verify source formatting',
              workflow,
              re.S,
          )
          if block is None:
              raise SystemExit('Could not locate deterministic migration block')
          body = textwrap.dedent(block.group('body'))
          prefix = "python <<'PY'\n"
          if not body.startswith(prefix) or not body.rstrip().endswith('\nPY'):
              raise SystemExit('Unexpected deterministic migration block format')
          script = body[len(prefix):body.rfind('\nPY')]
          exec(compile(script, 'toonstudio-session-migration.py', 'exec'), {})
          PY
          git diff --check

      - name: Apply safe lint repairs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx')
          if ((${#files[@]})); then
            pnpm exec eslint --fix "${files[@]}" || true
          fi
          git diff --check

      - name: Run all completion gates
        id: gates
        shell: bash
        run: |
          set +e
          mkdir -p .toonstudio-validation

          pnpm exec tsc -p tsconfig.json --noEmit --pretty false \
            > >(tee .toonstudio-validation/typecheck.log) 2>&1
          typecheck_status=${PIPESTATUS[0]}

          lint_status=125
          test_status=125
          build_status=125

          if (( typecheck_status == 0 )); then
            pnpm exec eslint --max-warnings=0 \
              apps/web/src/app/routes/groups/creator-route-pages.ts \
              apps/web/src/app/routes/groups/creator.routes.tsx \
              apps/web/src/domains/creator/ai/studio-ai-project-handoff.ts \
              apps/web/src/domains/creator/ai/StudioAiProjectHandoffHost.tsx \
              apps/web/src/domains/creator/studio-localization-project-store.ts \
              apps/web/src/domains/creator/studio-project-diagnostic-source-store.ts \
              apps/web/src/domains/creator/studio-project-export-snapshot.ts \
              apps/web/src/domains/creator/studio-project-feature-adapters.ts \
              apps/web/src/domains/creator/studio-project-feature-suite-store.ts \
              apps/web/src/domains/creator/studio-project-view-destinations.ts \
              apps/web/src/domains/creator/studio-review-history-store.ts \
              apps/web/src/domains/creator/studio-series-kit-store.ts \
              apps/web/src/domains/creator/studio-shell/StudioAssetHubPage.tsx \
              apps/web/src/domains/creator/studio-shell/StudioExportPanel.tsx \
              apps/web/src/domains/creator/studio-shell/StudioLocalizationPanel.tsx \
              apps/web/src/domains/creator/studio-shell/StudioProjectAssistantPanel.tsx \
              apps/web/src/domains/creator/studio-shell/StudioProjectFeatureSuitePanel.tsx \
              apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.tsx \
              apps/web/src/domains/creator/studio-shell/StudioReviewPanel.tsx \
              apps/web/src/domains/creator/studio-shell/StudioSeriesKitPanel.tsx \
              apps/web/src/domains/creator/studio-shell/useStudioProjectFeatureSuite.ts \
              apps/web/src/domains/creator/studio-shell/useStudioProjectWorkspace.ts \
              > >(tee .toonstudio-validation/lint.log) 2>&1
            lint_status=${PIPESTATUS[0]}
          fi

          if (( typecheck_status == 0 && lint_status == 0 )); then
            pnpm exec vitest run \
              apps/web/src/app/routes/groups/app-routes.test.tsx \
              apps/web/src/domains/creator/ai/studio-ai-project-handoff.test.ts \
              apps/web/src/domains/creator/ai/StudioAiProjectHandoffHost.test.tsx \
              apps/web/src/domains/creator/studio-archive-manifest.test.ts \
              apps/web/src/domains/creator/studio-asset-passport.test.ts \
              apps/web/src/domains/creator/studio-asset-provider.test.ts \
              apps/web/src/domains/creator/studio-automation-recipe.test.ts \
              apps/web/src/domains/creator/studio-export-preflight.test.ts \
              apps/web/src/domains/creator/studio-font-audit.test.ts \
              apps/web/src/domains/creator/studio-localization-project-store.test.ts \
              apps/web/src/domains/creator/studio-localization-workflow.test.ts \
              apps/web/src/domains/creator/studio-marketplace-submission.test.ts \
              apps/web/src/domains/creator/studio-plugin-registry.test.ts \
              apps/web/src/domains/creator/studio-project-diagnostics.test.ts \
              apps/web/src/domains/creator/studio-project-export-snapshot.test.ts \
              apps/web/src/domains/creator/studio-project-feature-suite-store.test.ts \
              apps/web/src/domains/creator/studio-project-readiness-store.test.ts \
              apps/web/src/domains/creator/studio-project-readiness.test.ts \
              apps/web/src/domains/creator/studio-project-view-destinations.test.ts \
              apps/web/src/domains/creator/studio-project-workspace-store.test.ts \
              apps/web/src/domains/creator/studio-publishing-connector.test.ts \
              apps/web/src/domains/creator/studio-publishing-package.test.ts \
              apps/web/src/domains/creator/studio-review-workflow.test.ts \
              apps/web/src/domains/creator/studio-rights-graph.test.ts \
              apps/web/src/domains/creator/studio-series-kit-store.test.ts \
              apps/web/src/domains/creator/studio-series-kit.test.ts \
              apps/web/src/domains/creator/studio-template-system.test.ts \
              apps/web/src/domains/creator/studio-shell/StudioAssetHubPage.test.tsx \
              apps/web/src/domains/creator/studio-shell/StudioProjectAssistantPanel.test.tsx \
              apps/web/src/domains/creator/studio-shell/StudioProjectFeatureSuitePanel.test.tsx \
              apps/web/src/domains/creator/studio-shell/StudioProjectReadinessPanel.test.tsx \
              apps/web/src/domains/creator/studio-shell/StudioReviewPanel.test.tsx \
              --pool=forks --maxWorkers=2 \
              > >(tee .toonstudio-validation/tests.log) 2>&1
            test_status=${PIPESTATUS[0]}
          fi

          if (( typecheck_status == 0 && lint_status == 0 && test_status == 0 )); then
            pnpm build > >(tee .toonstudio-validation/build.log) 2>&1
            build_status=${PIPESTATUS[0]}
          fi

          cat > .toonstudio-validation/status.env <<EOF
          TYPECHECK_STATUS=${typecheck_status}
          LINT_STATUS=${lint_status}
          TEST_STATUS=${test_status}
          BUILD_STATUS=${build_status}
          EOF

          if (( typecheck_status != 0 || lint_status != 0 || test_status != 0 || build_status != 0 )); then
            exit 1
          fi

      - name: Persist diagnostics when a gate fails
        if: failure() && steps.gates.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docs/rewrite/toonstudio-session-failure
          mkdir -p docs/rewrite/toonstudio-session-failure
          cp .toonstudio-validation/*.log docs/rewrite/toonstudio-session-failure/ 2>/dev/null || true
          cp .toonstudio-validation/status.env docs/rewrite/toonstudio-session-failure/status.env
          cat > docs/rewrite/toonstudio-session-failure/README.md <<EOF
          # ToonStudio completion gate failure

          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Captured: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          The exact stage exit codes and logs are stored in this directory.
          EOF
          git config user.name 'toonstudio-integration-bot'
          git config user.email 'toonstudio-integration-bot@users.noreply.github.com'
          git add apps/web/src docs/rewrite/toonstudio-session-failure
          if ! git diff --cached --quiet; then
            git commit -m 'chore(studio): persist completion gate diagnostics'
            git push origin HEAD:feat/toonstudio-session-complete-20260911-1221
          fi

      - name: Publish verified implementation to PR 1307
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docs/rewrite/toonstudio-session-failure
          rm -f docs/rewrite/toonstudio-session-trigger-*.txt
          rm -f \
            .github/workflows/apply-toonstudio-session-fixes.yml \
            .github/workflows/apply-toonstudio-session-fixes-retry.yml \
            .github/workflows/finalize-toonstudio-session.yml \
            .github/workflows/finalize-toonstudio-session-verified.yml \
            .github/workflows/repair-and-publish-toonstudio-session.yml \
            .github/workflows/toonstudio-session-orchestrator.yml
          mkdir -p docs/rewrite
          cat > docs/rewrite/toonstudio-session-verification.md <<EOF
          # ToonStudio session verification

          Verified at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Passed gates:

          - full TypeScript project typecheck
          - integrated ToonStudio ESLint gate
          - focused session regression suite
          - production application build

          The latest feat/toonstudio-final-ia-20260911 source was merged before validation.
          EOF
          git config user.name 'toonstudio-integration-bot'
          git config user.email 'toonstudio-integration-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(studio): publish verified session implementation'
          git push origin HEAD:feat/toonstudio-session-complete-20260911-1221
          git push origin HEAD:feat/toonstudio-final-ia-20260911
          gh pr ready 1307 --repo "${GITHUB_REPOSITORY}" || true
          gh pr comment 1307 --repo "${GITHUB_REPOSITORY}" --body "All planned ToonStudio session capabilities passed full typecheck, integrated lint, the focused regression suite, and the production build in workflow run ${GITHUB_RUN_ID}." || true
