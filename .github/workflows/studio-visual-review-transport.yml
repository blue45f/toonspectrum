name: Studio visual review transport
on:
  push:
    branches: [feat/studio-assets-visual-curation-20260906]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: studio-visual-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  visual-evidence:
    if: github.repository == 'blue45f/toonspectrum' && github.ref == 'refs/heads/feat/studio-assets-visual-curation-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: docs/reports/asset-visual-review-20260906/review-01.pdf
          archive: false
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: docs/reports/asset-visual-review-20260906/review-02.pdf
          archive: false
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: docs/reports/asset-visual-review-20260906/review-03.pdf
          archive: false
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: docs/reports/asset-visual-review-20260906/review-04.pdf
          archive: false
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: docs/reports/asset-visual-review-20260906/review-05.pdf
          archive: false
          retention-days: 14
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.16.0
      - name: Prepare reviewed candidate acquisition code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/blue45f/toonspectrum/git/blobs/ab4709d8cf50c1459b746e4ef516f2b50f5bf8eb --jq .content | base64 --decode > scripts/acquire_studio_pbr_assets.py
          test "$(git hash-object scripts/acquire_studio_pbr_assets.py)" = ab4709d8cf50c1459b746e4ef516f2b50f5bf8eb
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0 defusedxml==0.7.1
          python3 -m py_compile scripts/acquire_studio_pbr_assets.py
          npm install --global pnpm@11.4.0 --ignore-scripts --no-audit --no-fund
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Acquire native 2K PBR originals into review staging only
        run: python3 scripts/acquire_studio_pbr_assets.py --output "$RUNNER_TEMP/studio-pbr-candidates"
      - name: Render detailed models and package visible review pages
        run: |
          pnpm exec playwright install --with-deps chromium
          node scripts/render_studio_asset_delivery.mjs "$RUNNER_TEMP/studio-pbr-candidates" "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          import json,os,shutil
          out=Path(os.environ['RUNNER_TEMP'])/'studio-pbr-candidates'
          assets=json.loads((out/'manifest.json').read_text())['assets']
          sheets=[]
          for page,start in enumerate(range(0,len(assets),12),1):
              sheet=Image.new('RGB',(1600,1400),'#e7e8ed'); draw=ImageDraw.Draw(sheet)
              draw.text((24,16),f'Actual PBR original candidates | page {page} | Not yet artistically approved',fill='#111118')
              for i,a in enumerate(assets[start:start+12]):
                  x=(i%4)*400; y=(i//4)*446+40
                  with Image.open(out/a.get('previewPath',a['path'])) as original:
                      img=original.convert('RGBA');img.thumbnail((384,374))
                  sheet.paste(img,(x+(400-img.width)//2,y),img)
                  draw.text((x+8,y+380),f'{start+i+1:03d} '+a['id'][:46],fill='#111118')
                  draw.text((x+8,y+398),a['kind']+' | '+a['selectionTerm'],fill='#333344')
              sheets.append(sheet)
          sheets[0].save(out/'pbr-candidates-review.pdf','PDF',save_all=True,append_images=sheets[1:],resolution=144,quality=94)
          records=Path('docs/reports/asset-visual-review-20260906')
          for file in ['delivery-report.json','manifest.json','browser-render-evidence.json']:
              shutil.copyfile(out/file,records/('pbr-'+file))
          print('PBR REVIEW CANDIDATES',len(assets),'PAGES',len(sheets))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: ${{ runner.temp }}/studio-pbr-candidates/pbr-candidates-review.pdf
          archive: false
          retention-days: 14
      - name: Preserve acquisition source and exact outcomes on review branch only
        run: |
          test "$GITHUB_REF" = refs/heads/feat/studio-assets-visual-curation-20260906
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          git add -- scripts/acquire_studio_pbr_assets.py docs/reports/asset-visual-review-20260906/pbr-delivery-report.json docs/reports/asset-visual-review-20260906/pbr-manifest.json docs/reports/asset-visual-review-20260906/pbr-browser-render-evidence.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c core.hooksPath=/dev/null commit --quiet -m "feat(studio): acquire and render detailed PBR review candidates"
          git push origin "HEAD:$GITHUB_REF"
          git log -1 --format='PBR_EVIDENCE_COMMIT %H'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: studio-pbr-candidates-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/studio-pbr-candidates/
            !${{ runner.temp }}/studio-pbr-candidates/_source/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 1
