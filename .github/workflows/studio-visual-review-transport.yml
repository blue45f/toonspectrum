name: Studio visual review transport
on:
  push:
    branches: [feat/studio-assets-visual-curation-20260906]
    paths: [.github/workflows/studio-visual-review-transport.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: studio-visual-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual-evidence:
    if: github.repository == 'blue45f/toonspectrum' && github.ref == 'refs/heads/feat/studio-assets-visual-curation-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Restore immutable PBR render evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/blue45f/toonspectrum/actions/artifacts/9975090308/zip > "$RUNNER_TEMP/pbr.zip"
          gh api repos/blue45f/toonspectrum/actions/jobs/101351268205/logs > "$RUNNER_TEMP/runtime.log"
          python3 - <<'PY'
          import pathlib,os,hashlib,zipfile,json,shutil,stat,tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP']); archive=root/'pbr.zip'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='83a7e541158f170b0f2c2fa139dd1db4fbfff9ec155211ad7fb06d9f234d9bbf'
          out=root/'pbr';out.mkdir()
          with zipfile.ZipFile(archive) as z:
              infos=z.infolist();assert len(infos)<5000 and sum(i.file_size for i in infos)<2*1024**3
              for i in infos: assert (out/i.filename).resolve().is_relative_to(out) and not stat.S_ISLNK(i.external_attr>>16)
              z.extractall(out)
          review=root/'review';review.mkdir()
          for p in out.iterdir():
              if p.is_file(): shutil.copyfile(p,review/p.name)
          shutil.copytree(out/'previews',review/'previews')
          log=(root/'runtime.log').read_text(errors='replace')
          lines=log.splitlines(); errors=[i for i,line in enumerate(lines) if any(k in line for k in ['Error:', 'Expected:', 'Received:', 'failed', 'unavailable'])]
          selected=set()
          for i in errors: selected.update(range(max(0,i-3),min(len(lines),i+12)))
          (review/'runtime-failure-excerpt.log').write_text('\n'.join(lines[i] for i in sorted(selected)))
          (review/'runtime-full.log').write_text(log)
          report=json.loads((out/'delivery-report.json').read_text());print('PBR ACTUAL COUNTS',json.dumps(report))
          packs=sorted((out/'assets').iterdir());batches=[[],[],[]];totals=[0,0,0]
          for p in sorted(packs,key=lambda p:sum(f.stat().st_size for f in p.rglob('*') if f.is_file()),reverse=True):
              i=totals.index(min(totals));batches[i].append(p);totals[i]+=sum(f.stat().st_size for f in p.rglob('*') if f.is_file())
          for i,batch in enumerate(batches):
              dest=root/f'pbr-part-{i+1}';dest.mkdir()
              with tarfile.open(dest/f'pbr-part-{i+1}.tar.gz','w:gz',compresslevel=1) as tar:
                  for p in batch: tar.add(p,arcname='assets/'+p.name)
              print('PART',i+1,'rawBytes',totals[i])
          with tarfile.open(review/'reviewed-source.tar.gz','w:gz',compresslevel=1) as tar:
              for name in ['src','scripts','e2e','packages','package.json','pnpm-lock.yaml','pnpm-workspace.yaml','tsconfig.json','vite.config.ts','vitest.config.ts','eslint.config.mjs']:
                  p=pathlib.Path(name)
                  if p.exists():tar.add(p,arcname=name)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: studio-pbr-visual-evidence
          path: ${{ runner.temp }}/review/
          compression-level: 1
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: studio-pbr-originals-part-1
          path: ${{ runner.temp }}/pbr-part-1/
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: studio-pbr-originals-part-2
          path: ${{ runner.temp }}/pbr-part-2/
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: studio-pbr-originals-part-3
          path: ${{ runner.temp }}/pbr-part-3/
          compression-level: 0
          retention-days: 14
