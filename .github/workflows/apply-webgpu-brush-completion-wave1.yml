name: Apply WebGPU brush completion wave 1

on:
  push:
    branches:
      - feat/webgpu-brush-completion-wave1-20260904
    paths:
      - scripts/apply-webgpu-brush-completion-wave1.mjs
      - .github/workflows/apply-webgpu-brush-completion-wave1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/webgpu-brush-completion-wave1-20260904
          fetch-depth: 0
      - run: node scripts/apply-webgpu-brush-completion-wave1.mjs
