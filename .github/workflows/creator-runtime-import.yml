name: Creator runtime verified source import
on:
  push:
    branches: ['feat/offline-inference-spatial-20260913']
    paths: ['.github/workflows/creator-runtime-import.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify patch and prepare unattached source tree (no branch writes)
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          repo = 'blue45f/toonspectrum'
          branch = 'feat/offline-inference-spatial-20260913'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          def api(path, body=None):
              cmd = ['gh', 'api', 'repos/' + repo + '/' + path]
              if body is not None:
                  cmd += ['--method', 'POST', '--input', '-']
              result = subprocess.run(cmd, input=None if body is None else json.dumps(body).encode(), stdout=subprocess.PIPE, check=True)
              return json.loads(result.stdout)
          parent = os.environ['GITHUB_SHA']
          assert api('git/ref/heads/' + branch)['object']['sha'] == parent, 'Branch changed; abort rather than overwrite'
          shas = ['513f377f0e190b935c95ffe0f5898031b5d156e6', '22cacced2028dda44912ced7991dbdf7b36d3e03', 'f5dca432f8f72177d5beebc19b32600b5ae5525e', '6f3ead52adbc2962de9849b92fe1e5b61e28b5eb', '37a2596d9d06c8235f31cdad0b815f992dac8c9a', '0d3e3f1d1a9883b95e9a139e24a7d7b49e4227bd', '3c2ac5fbd58a51a85a85bbd1642bc80561c7f2f3', '597fd1fd39d167a1fdd8618fab7e3e5a1ced41a1', '9c0a22fabcb59bf1fbe045a2069e5cf7ea681e1f']
          parts = []
          for sha in shas:
              blob = api('git/blobs/' + sha)
              data = base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              parts.append(data)
          patch = lzma.decompress(b''.join(parts), memlimit=512 * 1024 * 1024)
          digest = hashlib.sha256(patch).hexdigest()
          assert len(patch) == 282912
          assert digest == 'dc92ed14704e824da6f43cd71a31931221539e9c6938b3e9261ea239b0fd10d2'
          path = pathlib.Path('/tmp/creator-runtime.patch'); path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          names = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().strip('\0').split('\0')
          assert len(names) == 48
          assert all(not pathlib.PurePosixPath(n).is_absolute() and '..' not in pathlib.PurePosixPath(n).parts for n in names)
          importer = '.github/workflows/creator-runtime-import.yml'
          subprocess.run(['git', 'rm', importer], check=True)
          names.append(importer)
          entries, hashes = [], {}
          for name in names:
              p = pathlib.Path(name)
              if p.exists():
                  data = p.read_bytes(); content = data.decode('utf-8')
                  entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'content': content})
                  hashes[name] = hashlib.sha256(data).hexdigest()
              else:
                  entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None})
                  hashes[name] = None
          base_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}']).decode().strip()
          tree = api('git/trees', {'base_tree': base_tree, 'tree': entries})
          result = {'parent': parent, 'tree': tree['sha'], 'patchSha256': digest, 'files': hashes, 'branch': branch}
          pathlib.Path('/tmp/creator-source-import.json').write_text(json.dumps(result, indent=2))
          print('VERIFIED_SOURCE_TREE=' + tree['sha'])
          print('VERIFIED_PARENT=' + parent)
          print('No branch or default-branch ref was changed by this job.')
      - uses: actions/upload-artifact@v4
        with:
          name: creator-source-import
          path: /tmp/creator-source-import.json
          retention-days: 1
