name: Materialize mannequin anatomy controls

on:
  push:
    branches: [feat/mannequin-anatomy-controls-main-20260910]
    paths: [.github/workflows/materialize-mannequin-anatomy-controls.yml]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-slim
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/mannequin-anatomy-controls-main-20260910
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/materialize-mannequin-anatomy-controls.yml
            apps/web/src/domains/creator/scene-3d/studio-mannequin-model.ts
            apps/web/src/domains/creator/scene-3d/StudioMannequinPoserPanel.tsx
          persist-credentials: true

      - name: Add independent anatomy controls to model and panel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          model = Path('apps/web/src/domains/creator/scene-3d/studio-mannequin-model.ts')
          text = model.read_text(encoding='utf-8')

          old = '''  /** 코 높이 배율. 0.8–1.3. 기본 1. */\n  readonly noseHeight?: number;\n}\n\nexport type StudioMannequinCoreParamKey =\n'''
          new = '''  /** 코 높이 배율. 0.8–1.3. 기본 1. */\n  readonly noseHeight?: number;\n  /** 몸통 앞뒤 깊이. 얇은 실루엣↔입체 흉곽. 0.75–1.35. */\n  readonly torsoDepth?: number;\n  /** 허리 중심 볼륨. 0.7–1.3. */\n  readonly waistWidth?: number;\n  /** 팔·다리 전체 굵기 배율. 0.7–1.35. */\n  readonly limbThickness?: number;\n  /** 손바닥·손가락 크기 배율. 0.75–1.3. */\n  readonly handScale?: number;\n  /** 발 길이·발볼·발목 크기 배율. 0.75–1.3. */\n  readonly footScale?: number;\n  /** 목 굵기 배율. 0.75–1.3. */\n  readonly neckThickness?: number;\n}\n\nexport type StudioMannequinCoreParamKey =\n'''
          if text.count(old) != 1:
              raise SystemExit('body parameter anchor changed')
          text = text.replace(old, new, 1)

          old = '''export type StudioMannequinHeadParamKey =\n  | "faceWidth"\n  | "chinLength"\n  | "eyeScale"\n  | "noseHeight";\n\nexport const STUDIO_MANNEQUIN_PARAM_RANGES = Object.freeze({\n'''
          new = '''export type StudioMannequinHeadParamKey =\n  | "faceWidth"\n  | "chinLength"\n  | "eyeScale"\n  | "noseHeight";\n\nexport type StudioMannequinAnatomyParamKey =\n  | "torsoDepth"\n  | "waistWidth"\n  | "limbThickness"\n  | "handScale"\n  | "footScale"\n  | "neckThickness";\n\nexport const STUDIO_MANNEQUIN_PARAM_RANGES = Object.freeze({\n'''
          if text.count(old) != 1:
              raise SystemExit('anatomy type anchor changed')
          text = text.replace(old, new, 1)

          old = '''export const STUDIO_MANNEQUIN_HEAD_PARAM_RANGES = Object.freeze({\n  faceWidth: [0.7, 1.3],\n  chinLength: [0.7, 1.3],\n  eyeScale: [0.8, 1.3],\n  noseHeight: [0.8, 1.3],\n} as const satisfies Record<StudioMannequinHeadParamKey, readonly [number, number]>);\n\nexport const STUDIO_MANNEQUIN_DEFAULT_BODY_PARAMS: StudioMannequinBodyParams = Object.freeze({\n'''
          new = '''export const STUDIO_MANNEQUIN_HEAD_PARAM_RANGES = Object.freeze({\n  faceWidth: [0.7, 1.3],\n  chinLength: [0.7, 1.3],\n  eyeScale: [0.8, 1.3],\n  noseHeight: [0.8, 1.3],\n} as const satisfies Record<StudioMannequinHeadParamKey, readonly [number, number]>);\n\nexport const STUDIO_MANNEQUIN_ANATOMY_PARAM_RANGES = Object.freeze({\n  torsoDepth: [0.75, 1.35],\n  waistWidth: [0.7, 1.3],\n  limbThickness: [0.7, 1.35],\n  handScale: [0.75, 1.3],\n  footScale: [0.75, 1.3],\n  neckThickness: [0.75, 1.3],\n} as const satisfies Record<StudioMannequinAnatomyParamKey, readonly [number, number]>);\n\nexport const STUDIO_MANNEQUIN_DEFAULT_BODY_PARAMS: StudioMannequinBodyParams = Object.freeze({\n'''
          if text.count(old) != 1:
              raise SystemExit('anatomy ranges anchor changed')
          text = text.replace(old, new, 1)

          old = '''  legLength: 1,\n  build: 1,\n});\n'''
          new = '''  legLength: 1,\n  build: 1,\n  torsoDepth: 1,\n  waistWidth: 1,\n  limbThickness: 1,\n  handScale: 1,\n  footScale: 1,\n  neckThickness: 1,\n});\n'''
          if text.count(old) != 1:
              raise SystemExit('default body parameter anchor changed')
          text = text.replace(old, new, 1)

          old = '''  for (const key of Object.keys(STUDIO_MANNEQUIN_HEAD_PARAM_RANGES) as StudioMannequinHeadParamKey[]) {\n    if (source[key] !== undefined) {\n      const [min, max] = STUDIO_MANNEQUIN_HEAD_PARAM_RANGES[key];\n      result[key] = clampNumber(source[key], min, max, STUDIO_MANNEQUIN_DEFAULT_HEAD_PARAMS[key]);\n    }\n  }\n  return result as StudioMannequinBodyParams;\n}\n'''
          new = '''  for (const key of Object.keys(STUDIO_MANNEQUIN_HEAD_PARAM_RANGES) as StudioMannequinHeadParamKey[]) {\n    if (source[key] !== undefined) {\n      const [min, max] = STUDIO_MANNEQUIN_HEAD_PARAM_RANGES[key];\n      result[key] = clampNumber(source[key], min, max, STUDIO_MANNEQUIN_DEFAULT_HEAD_PARAMS[key]);\n    }\n  }\n  for (const key of Object.keys(STUDIO_MANNEQUIN_ANATOMY_PARAM_RANGES) as StudioMannequinAnatomyParamKey[]) {\n    const [min, max] = STUDIO_MANNEQUIN_ANATOMY_PARAM_RANGES[key];\n    result[key] = clampNumber(\n      source[key],\n      min,\n      max,\n      STUDIO_MANNEQUIN_DEFAULT_BODY_PARAMS[key] ?? 1,\n    );\n  }\n  return result as StudioMannequinBodyParams;\n}\n'''
          if text.count(old) != 1:
              raise SystemExit('body parameter clamp anchor changed')
          text = text.replace(old, new, 1)

          old = '''  const upperArmLen = 1.34 * hu * params.armLength;\n  const foreArmLen = 1.06 * hu * params.armLength;\n  const handLen = 0.58 * hu * params.armLength;\n\n  const halfShoulder = 0.78 * hu * params.shoulderWidth * build.shoulder;\n  const clavicleRoot = 0.16 * hu;\n  const hipHalf = 0.33 * hu * params.pelvisWidth;\n\n  const limbR = build.limbRadius;\n  const footLen = 0.95 * hu;\n'''
          new = '''  const torsoDepth = params.torsoDepth ?? 1;\n  const waistWidth = params.waistWidth ?? 1;\n  const limbThickness = params.limbThickness ?? 1;\n  const handScale = params.handScale ?? 1;\n  const footScale = params.footScale ?? 1;\n  const neckThickness = params.neckThickness ?? 1;\n\n  const upperArmLen = 1.34 * hu * params.armLength;\n  const foreArmLen = 1.06 * hu * params.armLength;\n  const handLen = 0.58 * hu * params.armLength * handScale;\n\n  const halfShoulder = 0.78 * hu * params.shoulderWidth * build.shoulder;\n  const clavicleRoot = 0.16 * hu;\n  const hipHalf = 0.33 * hu * params.pelvisWidth;\n\n  const limbR = build.limbRadius * limbThickness;\n  const footLen = 0.95 * hu * footScale;\n'''
          if text.count(old) != 1:
              raise SystemExit('derived anatomy anchor changed')
          text = text.replace(old, new, 1)

          replacements = [
            ('scale: vec3(1.5 * params.pelvisWidth, 0.8, 0.92),',
             'scale: vec3(1.5 * params.pelvisWidth, 0.8, 0.92 * torsoDepth),'),
            ('radius: 0.24 * hu * build.torsoLower,',
             'radius: 0.24 * hu * build.torsoLower * waistWidth,'),
            ('        0.72,\n', '        0.72 * torsoDepth,\n'),
            ('{ kind: "capsule", jointId: "neck", from: vec3(0, 0, 0), to: vec3(0, neckLen, 0), radius: 0.11 * hu },',
             '{ kind: "capsule", jointId: "neck", from: vec3(0, 0, 0), to: vec3(0, neckLen, 0), radius: 0.11 * hu * neckThickness },'),
            ('{ kind: "sphere", jointId: "leftHand", center: vec3(0, 0, 0), radius: 0.095 * hu },',
             '{ kind: "sphere", jointId: "leftHand", center: vec3(0, 0, 0), radius: 0.095 * hu * limbR * handScale },'),
            ('{ kind: "sphere", jointId: "rightHand", center: vec3(0, 0, 0), radius: 0.095 * hu },',
             '{ kind: "sphere", jointId: "rightHand", center: vec3(0, 0, 0), radius: 0.095 * hu * limbR * handScale },'),
            ('scale: vec3((0.26 * hu) / footLen, ankleHeight / footLen, 1),',
             'scale: vec3((0.26 * hu * footScale) / footLen, (ankleHeight * footScale) / footLen, 1),'),
            ('{ kind: "sphere", jointId: "leftFoot", center: vec3(0, 0, 0), radius: 0.105 * hu * limbR },',
             '{ kind: "sphere", jointId: "leftFoot", center: vec3(0, 0, 0), radius: 0.105 * hu * limbR * footScale },'),
            ('{ kind: "sphere", jointId: "rightFoot", center: vec3(0, 0, 0), radius: 0.105 * hu * limbR },',
             '{ kind: "sphere", jointId: "rightFoot", center: vec3(0, 0, 0), radius: 0.105 * hu * limbR * footScale },'),
          ]
          for old_value, new_value in replacements:
              if text.count(old_value) != 1 and 'scale: vec3((0.26 * hu)' not in old_value:
                  raise SystemExit(f'geometry anchor changed: {old_value[:60]}')
              if 'scale: vec3((0.26 * hu)' in old_value:
                  if text.count(old_value) != 2:
                      raise SystemExit(f'foot geometry anchor changed: {text.count(old_value)}')
                  text = text.replace(old_value, new_value)
              else:
                  text = text.replace(old_value, new_value, 1)
          model.write_text(text, encoding='utf-8')

          panel = Path('apps/web/src/domains/creator/scene-3d/StudioMannequinPoserPanel.tsx')
          text = panel.read_text(encoding='utf-8')
          old = '''  STUDIO_MANNEQUIN_BODY_PRESETS,\n  STUDIO_MANNEQUIN_DEFAULT_BODY_PARAMS,\n'''
          new = '''  STUDIO_MANNEQUIN_ANATOMY_PARAM_RANGES,\n  STUDIO_MANNEQUIN_BODY_PRESETS,\n  STUDIO_MANNEQUIN_DEFAULT_BODY_PARAMS,\n'''
          if text.count(old) != 1:
              raise SystemExit('panel range import anchor changed')
          text = text.replace(old, new, 1)

          old = '''  type StudioMannequinBodyParams,\n  type StudioMannequinBodyPresetId,\n'''
          new = '''  type StudioMannequinAnatomyParamKey,\n  type StudioMannequinBodyParams,\n  type StudioMannequinBodyPresetId,\n'''
          if text.count(old) != 1:
              raise SystemExit('panel type import anchor changed')
          text = text.replace(old, new, 1)

          anchor = '''const HEAD_SLIDERS: readonly {\n'''
          anatomy = '''const ANATOMY_SLIDERS: readonly {\n  key: StudioMannequinAnatomyParamKey;\n  label: string;\n  step: number;\n}[] = Object.freeze([\n  { key: "torsoDepth", label: "몸통 깊이", step: 0.02 },\n  { key: "waistWidth", label: "허리 볼륨", step: 0.02 },\n  { key: "limbThickness", label: "팔다리 굵기", step: 0.02 },\n  { key: "handScale", label: "손 크기", step: 0.02 },\n  { key: "footScale", label: "발 크기", step: 0.02 },\n  { key: "neckThickness", label: "목 굵기", step: 0.02 },\n]);\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('panel slider anchor changed')
          text = text.replace(anchor, anatomy + anchor, 1)

          anchor = '''      <div className="space-y-3 pt-3 border-t border-line/60">\n        <StudioSectionHeader\n          title="3D 헤드 모델 (Face Proportions)"\n'''
          block = '''      <div className="space-y-3 border-t border-line/60 pt-3">\n        <StudioSectionHeader\n          title="해부학 비례"\n          description="신장·등신은 유지한 채 흉곽 깊이, 허리 질량, 사지와 말단 크기를 독립 조절합니다."\n        />\n        <div className="space-y-2">\n          {ANATOMY_SLIDERS.map(({ key, label, step }) => {\n            const [min, max] = STUDIO_MANNEQUIN_ANATOMY_PARAM_RANGES[key];\n            const value = params[key] ?? 1;\n            return (\n              <StudioSliderRow\n                key={key}\n                label={label}\n                min={min}\n                max={max}\n                step={step}\n                value={value}\n                onChange={(next) =>\n                  onParamsChange(clampStudioMannequinBodyParams({ ...params, [key]: next }))\n                }\n                readout={`${Math.round(value * 100)}%`}\n              />\n            );\n          })}\n        </div>\n      </div>\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('panel anatomy section anchor changed')
          text = text.replace(anchor, block + anchor, 1)
          panel.write_text(text, encoding='utf-8')

          test = Path('apps/web/src/domains/creator/scene-3d/studio-mannequin-anatomy-controls.test.ts')
          test.write_text('''import { describe, expect, it } from "vitest";\n\nimport {\n  STUDIO_MANNEQUIN_DEFAULT_BODY_PARAMS,\n  buildStudioMannequinSpec,\n  clampStudioMannequinBodyParams,\n  studioMannequinRestStature,\n} from "./studio-mannequin-model";\n\nfunction capsule(spec: ReturnType<typeof buildStudioMannequinSpec>, jointId: string) {\n  return spec.primitives.find((item) => item.kind === "capsule" && item.jointId === jointId);\n}\n\nfunction sphere(\n  spec: ReturnType<typeof buildStudioMannequinSpec>,\n  jointId: string,\n  predicate: (center: readonly number[]) => boolean = () => true,\n) {\n  return spec.primitives.find(\n    (item) => item.kind === "sphere" && item.jointId === jointId && predicate(item.center),\n  );\n}\n\ndescribe("mannequin anatomical silhouette controls", () => {\n  it("normalizes every anatomy parameter and clamps hostile values", () => {\n    const defaults = clampStudioMannequinBodyParams({});\n    expect(defaults).toMatchObject({\n      torsoDepth: 1,\n      waistWidth: 1,\n      limbThickness: 1,\n      handScale: 1,\n      footScale: 1,\n      neckThickness: 1,\n    });\n\n    const clamped = clampStudioMannequinBodyParams({\n      ...STUDIO_MANNEQUIN_DEFAULT_BODY_PARAMS,\n      torsoDepth: 99,\n      waistWidth: -5,\n      limbThickness: Number.NaN,\n      handScale: 0,\n      footScale: 50,\n      neckThickness: Number.POSITIVE_INFINITY,\n    });\n    expect(clamped.torsoDepth).toBe(1.35);\n    expect(clamped.waistWidth).toBe(0.7);\n    expect(clamped.limbThickness).toBe(1);\n    expect(clamped.handScale).toBe(0.75);\n    expect(clamped.footScale).toBe(1.3);\n    expect(clamped.neckThickness).toBe(1);\n  });\n\n  it("changes independent silhouette axes without changing stature or IK lengths", () => {\n    const base = buildStudioMannequinSpec(STUDIO_MANNEQUIN_DEFAULT_BODY_PARAMS);\n    const tuned = buildStudioMannequinSpec({\n      ...STUDIO_MANNEQUIN_DEFAULT_BODY_PARAMS,\n      torsoDepth: 1.3,\n      waistWidth: 1.2,\n      limbThickness: 1.25,\n      handScale: 1.2,\n      footScale: 1.2,\n      neckThickness: 1.2,\n    });\n\n    expect(studioMannequinRestStature(tuned)).toBeCloseTo(base.heightM, 12);\n    expect(tuned.chains.leftArm.upperLength).toBe(base.chains.leftArm.upperLength);\n    expect(tuned.chains.leftArm.lowerLength).toBe(base.chains.leftArm.lowerLength);\n    expect(tuned.chains.leftLeg.upperLength).toBe(base.chains.leftLeg.upperLength);\n\n    const basePelvis = sphere(base, "pelvis");\n    const tunedPelvis = sphere(tuned, "pelvis");\n    const baseChest = sphere(base, "chest");\n    const tunedChest = sphere(tuned, "chest");\n    if (basePelvis?.kind === "sphere" && tunedPelvis?.kind === "sphere") {\n      expect(tunedPelvis.scale?.[2]).toBeGreaterThan(basePelvis.scale?.[2] ?? 0);\n    }\n    if (baseChest?.kind === "sphere" && tunedChest?.kind === "sphere") {\n      expect(tunedChest.scale?.[2]).toBeGreaterThan(baseChest.scale?.[2] ?? 0);\n    }\n\n    const baseSpine = capsule(base, "spine");\n    const tunedSpine = capsule(tuned, "spine");\n    const baseArm = capsule(base, "leftUpperArm");\n    const tunedArm = capsule(tuned, "leftUpperArm");\n    const baseNeck = capsule(base, "neck");\n    const tunedNeck = capsule(tuned, "neck");\n    if (baseSpine?.kind === "capsule" && tunedSpine?.kind === "capsule") {\n      expect(tunedSpine.radius).toBeGreaterThan(baseSpine.radius);\n    }\n    if (baseArm?.kind === "capsule" && tunedArm?.kind === "capsule") {\n      expect(tunedArm.radius).toBeGreaterThan(baseArm.radius);\n    }\n    if (baseNeck?.kind === "capsule" && tunedNeck?.kind === "capsule") {\n      expect(tunedNeck.radius).toBeGreaterThan(baseNeck.radius);\n    }\n\n    const baseDigit = capsule(base, "leftHand");\n    const tunedDigit = capsule(tuned, "leftHand");\n    if (baseDigit?.kind === "capsule" && tunedDigit?.kind === "capsule") {\n      expect(Math.abs(tunedDigit.to[1])).toBeGreaterThan(Math.abs(baseDigit.to[1]));\n    }\n    const baseFoot = sphere(base, "leftFoot", (center) => center[2] > 0);\n    const tunedFoot = sphere(tuned, "leftFoot", (center) => center[2] > 0);\n    if (baseFoot?.kind === "sphere" && tunedFoot?.kind === "sphere") {\n      expect(tunedFoot.radius).toBeGreaterThan(baseFoot.radius);\n      expect(tunedFoot.center[2]).toBeGreaterThan(baseFoot.center[2]);\n    }\n  });\n});\n''', encoding='utf-8')
          PY

      - name: Verify anatomy product boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'STUDIO_MANNEQUIN_ANATOMY_PARAM_RANGES' apps/web/src/domains/creator/scene-3d/studio-mannequin-model.ts
          grep -q 'const limbR = build.limbRadius \* limbThickness' apps/web/src/domains/creator/scene-3d/studio-mannequin-model.ts
          grep -q 'title="해부학 비례"' apps/web/src/domains/creator/scene-3d/StudioMannequinPoserPanel.tsx
          git diff --check

      - name: Commit product slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name toonstudio-3d-ci
          git config user.email actions@users.noreply.github.com
          rm -f .github/workflows/materialize-mannequin-anatomy-controls.yml
          git add apps/web/src/domains/creator/scene-3d/studio-mannequin-model.ts \
                  apps/web/src/domains/creator/scene-3d/StudioMannequinPoserPanel.tsx \
                  apps/web/src/domains/creator/scene-3d/studio-mannequin-anatomy-controls.test.ts \
                  .github/workflows/materialize-mannequin-anatomy-controls.yml
          git diff --cached --check
          HUSKY=0 git commit -m 'feat(mannequin): add anatomical silhouette controls'
          git push origin HEAD:feat/mannequin-anatomy-controls-main-20260910
