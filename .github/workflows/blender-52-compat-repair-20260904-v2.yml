name: Blender 5.2 compatibility repair 20260904 v2

on:
  push:
    branches:
      - automation/source-snapshot-20260904
    paths:
      - .github/workflows/blender-52-compat-repair-20260904-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blender-52-compat-repair-20260904-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Blender integration branch
        uses: actions/checkout@v4
        with:
          ref: feat/blender-character-quality-pipeline-20260904
          fetch-depth: 1

      - name: Apply Blender 5.2 API compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/blender/toonstudio_blender_kit/face.py")
          source = path.read_text(encoding="utf-8")

          old_iteration = "    for vertex in obj.data.vertices[::step]:"
          new_iteration = (
              "    for index in range(0, len(obj.data.vertices), step):\n"
              "        vertex = obj.data.vertices[index]"
          )
          if old_iteration in source:
              source = source.replace(old_iteration, new_iteration)
          if "obj.data.vertices[::step]" in source:
              raise SystemExit("unsupported Blender stepped collection slice remains")

          replacements = {
              '    key["toonstudio_semantic_id"] = spec.semantic_id':
                  '    obj[f"toonstudio_shape_{_normalize(key.name)}_semantic_id"] = spec.semantic_id',
              '    key["toonstudio_direction"] = "positive" if direction > 0 else "negative"':
                  '    obj[f"toonstudio_shape_{_normalize(key.name)}_direction"] = (\n'
                  '        "positive" if direction > 0 else "negative"\n'
                  '    )',
              '    key["toonstudio_generated"] = True':
                  '    obj[f"toonstudio_shape_{_normalize(key.name)}_generated"] = True',
              '                key["toonstudio_label"] = label':
                  '                obj[f"toonstudio_shape_{_normalize(name)}_label"] = label',
          }
          for old, new in replacements.items():
              if old in source:
                  source = source.replace(old, new, 1)

          for unsupported in (
              'key["toonstudio_semantic_id"]',
              'key["toonstudio_direction"]',
              'key["toonstudio_generated"]',
              'key["toonstudio_label"]',
          ):
              if unsupported in source:
                  raise SystemExit(f"unsupported ShapeKey ID property remains: {unsupported}")

          path.write_text(source, encoding="utf-8")
          PY

          python3 -m py_compile tools/blender/toonstudio_blender_kit/face.py
          git diff --check
          test "$(grep -c 'for index in range(0, len(obj.data.vertices), step):' tools/blender/toonstudio_blender_kit/face.py)" -ge 2
          grep -F 'obj[f"toonstudio_shape_{_normalize(key.name)}_semantic_id"]' tools/blender/toonstudio_blender_kit/face.py
          grep -F 'obj[f"toonstudio_shape_{_normalize(name)}_label"]' tools/blender/toonstudio_blender_kit/face.py

      - name: Commit and push compatibility repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Blender 5.2 compatibility repair is already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/blender/toonstudio_blender_kit/face.py
          git commit -m "fix(blender): support Blender 5.2 shape keys and vertex collections"
          git push origin HEAD:feat/blender-character-quality-pipeline-20260904
