name: Materialize Studio 3D stability with sparse checkout

on:
  push:
    branches: [fix/studio-3d-preview-insert-stability-20260910]
    paths: [.github/workflows/materialize-studio-3d-preview-insert-stability-v2.yml]

permissions:
  contents: write

concurrency:
  group: materialize-studio-3d-preview-insert-stability-v2
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-slim
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/studio-3d-preview-insert-stability-20260910
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/materialize-studio-3d-preview-insert-stability.yml
            .github/workflows/materialize-studio-3d-preview-insert-stability-v2.yml
            apps/web/src/domains/creator/vrm/useStudioVrmPoserRuntimeD.ts
            apps/web/src/domains/creator/vrm/StudioVrmCharacterLibraryPanel.tsx
            apps/web/src/domains/creator/bg3d/studio-bg3d-editor-insert-host.ts
          persist-credentials: true

      - name: Materialize product changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('apps/web/src/domains/creator/vrm/useStudioVrmPoserRuntimeD.ts')
          text = runtime.read_text(encoding='utf-8')
          old = '''          const isBundledStaticThumbnail = entry.source === "sample"\n            && entry.thumbnail?.startsWith("/vrm/thumbnails/");\n          if (\n            entry.source === "memory" ||\n            entry.id === activeModelIdRef.current ||\n            entry.thumbnail === null ||\n            isBundledStaticThumbnail\n          ) return entry;\n'''
          new = '''          // Bundled sample thumbnails are immutable same-origin product assets. Never evict\n          // them when the uploaded-thumbnail hydration window moves; only uploaded data URLs\n          // participate in the bounded thumbnail window.\n          if (\n            entry.source === "sample" ||\n            entry.source === "memory" ||\n            entry.id === activeModelIdRef.current ||\n            entry.thumbnail === null\n          ) return entry;\n'''
          if text.count(old) != 1:
              raise SystemExit(f'VRM thumbnail eviction anchor changed: {text.count(old)}')
          runtime.write_text(text.replace(old, new, 1), encoding='utf-8')

          panel = Path('apps/web/src/domains/creator/vrm/StudioVrmCharacterLibraryPanel.tsx')
          text = panel.read_text(encoding='utf-8')
          old = '''                  <img\n                    alt=""\n                    className="h-full w-full object-contain"\n                    src={entry.thumbnail ?? buildFallbackVrmLibraryThumbnail(entry.name, entry.id)}\n'''
          new = '''                  <img\n                    alt=""\n                    decoding="async"\n                    loading="eager"\n                    className="h-full w-full object-contain"\n                    src={entry.thumbnail ?? buildFallbackVrmLibraryThumbnail(entry.name, entry.id)}\n'''
          if text.count(old) != 1:
              raise SystemExit(f'VRM card image anchor changed: {text.count(old)}')
          panel.write_text(text.replace(old, new, 1), encoding='utf-8')

          insert_host = Path('apps/web/src/domains/creator/bg3d/studio-bg3d-editor-insert-host.ts')
          text = insert_host.read_text(encoding='utf-8')
          old = '''      // Clamp DPR to 1..3; the size resolver enforces pixel and 4096-edge budgets.\n      const captureDensity = Math.min(3, Math.max(1, globalThis.devicePixelRatio || 1));\n      const captureSize = resolveStudioBg3dLtCaptureSize({\n        sourceWidth: sourceSize.width,\n        sourceHeight: sourceSize.height,\n        aspectRatio: captureFrame.aspectRatio,\n        requestedHeight: Math.min(\n          4096,\n          Math.round(adapted.document.output.exportHeight * captureDensity)\n        ),\n        maxPixels: Math.min(deviceQuality.maxRenderPixels, STUDIO_BG3D_LT_RENDER_MAX_PIXELS),\n      });\n'''
          new = '''      // Canvas insertion is a persisted output-pixel contract, not a display-density\n      // contract. Keep identical scenes deterministic across monitors and retain enough\n      // source pixels for webtoon composition before the device pixel budget clamps it.\n      const requestedCaptureHeight = Math.min(\n        4096,\n        Math.max(2160, Math.round(adapted.document.output.exportHeight)),\n      );\n      const captureSize = resolveStudioBg3dLtCaptureSize({\n        sourceWidth: sourceSize.width,\n        sourceHeight: sourceSize.height,\n        aspectRatio: captureFrame.aspectRatio,\n        requestedHeight: requestedCaptureHeight,\n        maxPixels: Math.min(deviceQuality.maxRenderPixels, STUDIO_BG3D_LT_RENDER_MAX_PIXELS),\n      });\n'''
          if text.count(old) != 1:
              raise SystemExit(f'BG3D insertion resolution anchor changed: {text.count(old)}')
          insert_host.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('apps/web/src/domains/creator/vrm/studio-vrm-bundled-thumbnail-stability.test.ts').write_text('''import { readFileSync } from "node:fs";\nimport { describe, expect, it } from "vitest";\n\nimport { SAMPLE_VRM_ENTRIES } from "./vrm-library";\n\nconst runtime = readFileSync(new URL("./useStudioVrmPoserRuntimeD.ts", import.meta.url), "utf8");\nconst panel = readFileSync(new URL("./StudioVrmCharacterLibraryPanel.tsx", import.meta.url), "utf8");\n\ndescribe("bundled VRM thumbnail stability", () => {\n  it("ships real same-origin thumbnails for every bundled picker entry", () => {\n    expect(SAMPLE_VRM_ENTRIES.length).toBeGreaterThan(0);\n    for (const entry of SAMPLE_VRM_ENTRIES) {\n      expect(entry.thumbnail).toMatch(/^\\/assets\\/3d\\/characters\\/thumbnails\\//u);\n    }\n  });\n\n  it("never evicts bundled cards when the uploaded thumbnail window moves", () => {\n    const start = runtime.indexOf("const handleVisibleVrmThumbnailWindow");\n    const end = runtime.indexOf("useEffect(() => {", start);\n    const handler = runtime.slice(start, end);\n    expect(start).toBeGreaterThanOrEqual(0);\n    expect(handler).toContain('entry.source === "sample"');\n    expect(handler).not.toContain('startsWith("/vrm/thumbnails/")');\n    expect(handler).toContain('return { ...entry, thumbnail: null }');\n  });\n\n  it("keeps a stable preview box while decoding product card art", () => {\n    expect(panel).toContain('decoding="async"');\n    expect(panel).toContain('loading="eager"');\n    expect(panel).toContain('entry.thumbnail ?? buildFallbackVrmLibraryThumbnail');\n  });\n});\n''', encoding='utf-8')

          Path('apps/web/src/domains/creator/bg3d/studio-bg3d-insert-resolution-boundary.test.ts').write_text('''import { readFileSync } from "node:fs";\nimport { describe, expect, it } from "vitest";\n\nconst source = readFileSync(\n  new URL("./studio-bg3d-editor-insert-host.ts", import.meta.url),\n  "utf8",\n);\n\ndescribe("BG3D canvas insert resolution boundary", () => {\n  it("uses deterministic production pixels instead of monitor DPR", () => {\n    const start = source.indexOf("async function handleInsert()");\n    const end = source.indexOf("h.handleInsert = handleInsert;", start);\n    const handler = source.slice(start, end);\n\n    expect(start).toBeGreaterThanOrEqual(0);\n    expect(handler).not.toContain("devicePixelRatio");\n    expect(handler).not.toContain("captureDensity");\n    expect(handler).toContain("Math.max(2160, Math.round(adapted.document.output.exportHeight))");\n    expect(handler).toContain("requestedHeight: requestedCaptureHeight");\n    expect(handler).toContain("STUDIO_BG3D_LT_RENDER_MAX_PIXELS");\n  });\n});\n''', encoding='utf-8')
          PY

      - name: Verify materialized boundaries
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'startsWith("/vrm/thumbnails/")' apps/web/src/domains/creator/vrm/useStudioVrmPoserRuntimeD.ts
          grep -q 'entry.source === "sample"' apps/web/src/domains/creator/vrm/useStudioVrmPoserRuntimeD.ts
          grep -q 'decoding="async"' apps/web/src/domains/creator/vrm/StudioVrmCharacterLibraryPanel.tsx
          grep -q 'Math.max(2160, Math.round(adapted.document.output.exportHeight))' apps/web/src/domains/creator/bg3d/studio-bg3d-editor-insert-host.ts
          ! grep -A80 'async function handleInsert()' apps/web/src/domains/creator/bg3d/studio-bg3d-editor-insert-host.ts | grep -q devicePixelRatio
          git diff --check

      - name: Commit product slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name toonstudio-3d-ci
          git config user.email actions@users.noreply.github.com
          rm -f .github/workflows/materialize-studio-3d-preview-insert-stability.yml \
                .github/workflows/materialize-studio-3d-preview-insert-stability-v2.yml
          git add apps/web/src/domains/creator/vrm/useStudioVrmPoserRuntimeD.ts \
                  apps/web/src/domains/creator/vrm/StudioVrmCharacterLibraryPanel.tsx \
                  apps/web/src/domains/creator/vrm/studio-vrm-bundled-thumbnail-stability.test.ts \
                  apps/web/src/domains/creator/bg3d/studio-bg3d-editor-insert-host.ts \
                  apps/web/src/domains/creator/bg3d/studio-bg3d-insert-resolution-boundary.test.ts \
                  .github/workflows/materialize-studio-3d-preview-insert-stability.yml \
                  .github/workflows/materialize-studio-3d-preview-insert-stability-v2.yml
          git diff --cached --check
          HUSKY=0 git commit -m 'fix(3d): stabilize previews and canvas insertion quality'
          git push origin HEAD:fix/studio-3d-preview-insert-stability-20260910
