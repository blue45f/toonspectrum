name: Studio campaign compatibility dispatcher
run-name: Studio campaign compatibility dispatch · ${{ github.run_number }}

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: studio-campaign-compatibility-dispatcher
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      COORDINATOR_WORKFLOW: studio-seven-day-hourly-trigger.yml
    steps:
      - name: Dispatch the thirty-lane coordinator
        shell: bash
        run: |
          set -euo pipefail
          jq -n '{ref: "main"}' \
            | gh api \
                --method POST \
                "repos/${REPOSITORY}/actions/workflows/${COORDINATOR_WORKFLOW}/dispatches" \
                --input -
          echo "Dispatched the thirty-lane Studio campaign coordinator."
