name: PR 690 reconciliation on supported runner

on:
  push:
    branches:
      - refactor/layered-architecture-20260904
    paths:
      - .github/workflows/pr690-reconcile-now.yml

permissions:
  contents: write

concurrency:
  group: pr690-reconcile-supported
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reconcile architecture branch with current main
        shell: bash
        run: python3 scripts/pr690-reconcile-v2.py

      - name: Confirm one-off reconciliation files were removed
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            .github/workflows/pr690-reconcile-main.yml \
            .github/workflows/pr690-reconcile-slim.yml \
            .github/workflows/pr690-reconcile-now.yml \
            scripts/pr690-reconcile.py \
            scripts/pr690-reconcile-v2.py
          do
            test ! -e "$path"
          done
