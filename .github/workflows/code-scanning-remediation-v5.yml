name: Iterative CodeQL remediation supervisor

on:
  push:
    branches:
      - codex/code-scanning-remediation-20260908
    paths:
      - .github/workflows/code-scanning-remediation-v5.yml
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write
  models: read
  pull-requests: write
  security-events: read
  statuses: read

concurrency:
  group: iterative-codeql-remediation-supervisor
  cancel-in-progress: false

env:
  TARGET_BRANCH: codex/code-scanning-remediation-20260908

jobs:
  wait:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    outputs:
      proceed: ${{ steps.state.outputs.proceed }}
      branch_exists: ${{ steps.state.outputs.branch_exists }}
    steps:
      - name: Wait for earlier remediation strategies
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs='{"workflow_runs":[]}'
          for attempt in $(seq 1 600); do
            runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${TARGET_BRANCH}&per_page=100")"
            active="$(jq '[.workflow_runs[] | select((.name == "Complete CodeQL remediation" or .name == "Collision-safe CodeQL remediation fallback" or .name == "AI-assisted residual CodeQL remediation") and .status != "completed")] | length' <<<"$runs")"
            if [[ "$active" == "0" ]]; then
              break
            fi
            echo "Waiting for ${active} earlier remediation run(s), attempt ${attempt}/600"
            sleep 30
          done

          if gh api "/repos/${GITHUB_REPOSITORY}/branches/${TARGET_BRANCH//\//%2F}" >/dev/null 2>&1; then
            branch_exists=true
          else
            branch_exists=false
          fi
          successes="$(jq '[.workflow_runs[] | select((.name == "Complete CodeQL remediation" or .name == "Collision-safe CodeQL remediation fallback" or .name == "AI-assisted residual CodeQL remediation") and .conclusion == "success")] | length' <<<"$runs")"
          if [[ "$branch_exists" == "true" && "$successes" == "0" ]]; then
            proceed=true
          else
            proceed=false
          fi
          echo "branch_exists=$branch_exists" >> "$GITHUB_OUTPUT"
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

  cleanup-after-prior-success:
    needs: wait
    if: needs.wait.outputs.branch_exists == 'true' && needs.wait.outputs.proceed != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch left by successful prior strategy
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Remove supervisor-only temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f \
            .github/workflows/code-scanning-remediation-v5.yml \
            .github/workflows/codeql-residual-round.yml \
            scripts/codeql-residual-remediation.py
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(security): remove unused iterative remediation supervisor"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

  prepare:
    needs: wait
    if: needs.wait.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Merge latest main before iterative analysis
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

  round-1:
    needs: [wait, prepare]
    if: needs.wait.outputs.proceed == 'true' && needs.prepare.result == 'success'
    permissions:
      contents: write
      models: read
      security-events: read
    uses: ./.github/workflows/codeql-residual-round.yml
    with:
      round: "1"
      branch: codex/code-scanning-remediation-20260908

  round-2:
    needs: round-1
    if: needs.round-1.result == 'success' && needs.round-1.outputs.clean != 'true'
    permissions:
      contents: write
      models: read
      security-events: read
    uses: ./.github/workflows/codeql-residual-round.yml
    with:
      round: "2"
      branch: codex/code-scanning-remediation-20260908

  round-3:
    needs: round-2
    if: needs.round-2.result == 'success' && needs.round-2.outputs.clean != 'true'
    permissions:
      contents: write
      models: read
      security-events: read
    uses: ./.github/workflows/codeql-residual-round.yml
    with:
      round: "3"
      branch: codex/code-scanning-remediation-20260908

  round-4:
    needs: round-3
    if: needs.round-3.result == 'success' && needs.round-3.outputs.clean != 'true'
    permissions:
      contents: write
      models: read
      security-events: read
    uses: ./.github/workflows/codeql-residual-round.yml
    with:
      round: "4"
      branch: codex/code-scanning-remediation-20260908

  round-5:
    needs: round-4
    if: needs.round-4.result == 'success' && needs.round-4.outputs.clean != 'true'
    permissions:
      contents: write
      models: read
      security-events: read
    uses: ./.github/workflows/codeql-residual-round.yml
    with:
      round: "5"
      branch: codex/code-scanning-remediation-20260908

  verify:
    needs: [wait, prepare, round-1, round-2, round-3, round-4, round-5]
    if: >-
      ${{
        always() &&
        needs.wait.outputs.proceed == 'true' &&
        needs.prepare.result == 'success' &&
        needs.round-1.result == 'success' &&
        (needs.round-2.result == 'success' || needs.round-2.result == 'skipped') &&
        (needs.round-3.result == 'success' || needs.round-3.result == 'skipped') &&
        (needs.round-4.result == 'success' || needs.round-4.result == 'skipped') &&
        (needs.round-5.result == 'success' || needs.round-5.result == 'skipped')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Checkout latest iteratively remediated tree
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Integrate latest main before final security verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Initialize final CodeQL verification
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze final candidate without uploading SARIF
        uses: github/codeql-action/analyze@v3
        with:
          upload: false
          output: /tmp/codeql-supervisor-final
          category: /language:javascript-typescript

      - name: Require zero final security findings
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/codeql-residual-remediation.py \
            --sarif-root /tmp/codeql-supervisor-final \
            --output /tmp/codeql-supervisor-final-findings.json

      - name: Create or locate remediation pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$number" ]]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$TARGET_BRANCH" \
              --title "fix(security): resolve all open CodeQL findings" \
              --body $'## Summary\n\n- inventories and remediates all open CodeQL findings\n- applies GitHub Autofix first, followed by bounded residual repair passes\n- merges the latest `main` before final analysis\n- requires CodeQL `security-extended` findings to be **0**\n- keeps protected-branch CI enforced before merge\n\n## Validation\n\n- CodeQL JavaScript/TypeScript security findings: **0**\n- required `core` check must pass both before and after temporary-workflow cleanup'
            number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --base main --state open --json number --jq '.[0].number')"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Wait for protected core check on full candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 480); do
            payload="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,statusCheckRollup)"
            state="$(jq -r '.state' <<<"$payload")"
            result="$(jq -r '[.statusCheckRollup[] | select((.name // .context // "") == "core") | (.conclusion // .state // .status // "PENDING")] | last // "MISSING"' <<<"$payload")"
            echo "core=${result}; state=${state}; attempt=${attempt}/480"
            case "$result" in
              SUCCESS) exit 0 ;;
              FAILURE|CANCELLED|TIMED_OUT|ACTION_REQUIRED|ERROR|STALE) exit 1 ;;
            esac
            [[ "$state" == "OPEN" ]] || exit 1
            sleep 30
          done
          echo "Timed out waiting for the required core check." >&2
          exit 1

      - name: Remove every temporary remediation asset
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git reset --hard "origin/$TARGET_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f \
            .github/workflows/code-scanning-inventory.yml \
            .github/workflows/code-scanning-context.yml \
            .github/workflows/code-scanning-autofix.yml \
            .github/workflows/code-scanning-remediation-gate.yml \
            .github/workflows/code-scanning-remediation-gate-trigger.yml \
            .github/workflows/code-scanning-remediation-v2.yml \
            .github/workflows/code-scanning-remediation-v3.yml \
            .github/workflows/code-scanning-remediation-v4.yml \
            .github/workflows/code-scanning-remediation-v5.yml \
            .github/workflows/codeql-residual-round.yml \
            scripts/codeql-residual-remediation.py
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(security): remove temporary CodeQL remediation automation"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Wait for protected core check after cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(git rev-parse HEAD)"
          for attempt in $(seq 1 480); do
            payload="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,headRefOid,statusCheckRollup)"
            state="$(jq -r '.state' <<<"$payload")"
            head_sha="$(jq -r '.headRefOid' <<<"$payload")"
            result="$(jq -r '[.statusCheckRollup[] | select((.name // .context // "") == "core") | (.conclusion // .state // .status // "PENDING")] | last // "MISSING"' <<<"$payload")"
            echo "head=${head_sha}; expected=${expected_sha}; core=${result}; attempt=${attempt}/480"
            if [[ "$head_sha" == "$expected_sha" ]]; then
              case "$result" in
                SUCCESS) exit 0 ;;
                FAILURE|CANCELLED|TIMED_OUT|ACTION_REQUIRED|ERROR|STALE) exit 1 ;;
              esac
            fi
            [[ "$state" == "OPEN" ]] || exit 1
            sleep 30
          done
          echo "Timed out waiting for the post-cleanup core check." >&2
          exit 1

      - name: Enable protected squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "${{ steps.pr.outputs.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --auto \
            --delete-branch

      - name: Wait until the pull request is merged
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 240); do
            state="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')"
            echo "PR state=${state}; attempt=${attempt}/240"
            [[ "$state" == "MERGED" ]] && exit 0
            [[ "$state" == "OPEN" ]] || exit 1
            sleep 30
          done
          echo "Timed out waiting for merge." >&2
          exit 1

      - name: Wait for zero open CodeQL alerts on main
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          count=-1
          for attempt in $(seq 1 360); do
            count="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&tool_name=CodeQL&ref=refs%2Fheads%2Fmain&per_page=100" --slurp | jq '[.[][]] | length')"
            echo "Open main CodeQL alerts=${count}; attempt=${attempt}/360"
            [[ "$count" == "0" ]] && break
            sleep 30
          done
          [[ "$count" == "0" ]] || { echo "Open CodeQL alerts remain on main: $count" >&2; exit 1; }
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "✅ Final verification complete: the protected merge finished and the open CodeQL alert count on \\`main\\` is **0**."
