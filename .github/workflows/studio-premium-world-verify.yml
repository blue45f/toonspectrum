name: Studio premium world runtime verification
on:
  push:
    branches: [feat/studio-premium-world-assets-20260913]
    paths:
      - .github/workflows/studio-premium-world-verify.yml
      - scripts/verify-studio-premium-world.mts
      - apps/web/tools/browser-harnesses/premium-world-runtime.ts
permissions:
  contents: read
  actions: read
concurrency:
  group: studio-premium-world-runtime-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_RUN: '34742641873'
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm
      - name: Install frozen workspace and browser
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Require successful candidate build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '[.status,.conclusion,.head_branch] | @tsv')
            test "$(printf '%s' "$result" | cut -f3)" = 'feat/studio-premium-world-assets-20260913'
            state=$(printf '%s' "$result" | cut -f1)
            if test "$state" = completed; then
              test "$(printf '%s' "$result" | cut -f2)" = success
              exit 0
            fi
            sleep 30
          done
          echo 'Candidate build did not finish successfully in this verification window' >&2
          exit 1
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          pattern: premium-world-shard-*
          merge-multiple: true
          path: artifacts/studio-premium-world-v1
      - name: Validate exact GLBs and actual Three.js renders
        run: pnpm exec tsx scripts/verify-studio-premium-world.mts artifacts/studio-premium-world-v1
      - name: Assemble browser render sheets
        if: always()
        run: |
          python3 -m venv /tmp/world-review
          /tmp/world-review/bin/pip -q install Pillow==11.3.0
          /tmp/world-review/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          import json
          root=Path('artifacts/studio-premium-world-v1/runtime-review')
          report=json.loads((root/'report.json').read_text())
          for page in range((len(report['results'])+5)//6):
            sheet=Image.new('RGB',(960,2040),'#d6d9dc');draw=ImageDraw.Draw(sheet)
            for i,r in enumerate(report['results'][page*6:page*6+6]):
              for j,frame in enumerate(r['frames']):
                im=Image.open(root/frame['file']);im.thumbnail((320,320))
                sheet.paste(im,(j*320,i*340))
                draw.text((j*320+6,i*340+322),r['id'].replace('ts-world-','')+' / '+frame['view'],fill='black')
            sheet.save(root/('browser-sheet-'+str(page+1)+'.jpg'),quality=94)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-world-runtime-review
          path: artifacts/studio-premium-world-v1/runtime-review
          if-no-files-found: error
          retention-days: 3
