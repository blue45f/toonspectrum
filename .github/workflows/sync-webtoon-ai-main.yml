name: Sync webtoon AI with latest main

on:
  push:
    branches:
      - feat/webtoon-ai-quality-ux-20260905

permissions:
  contents: write

concurrency:
  group: sync-webtoon-ai-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Merge current main and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          git rm .github/workflows/sync-webtoon-ai-main.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(studio): sync webtoon AI with latest main"
          git push origin "HEAD:${{ github.ref_name }}"
