name: Storyworld core failure evidence
on:
  push:
    branches: [verify/storyworld-preflight-macos-20260905]
    paths: [.github/workflows/storyworld-core-failure-evidence.yml]
permissions:
  actions: read
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Read completed core failure without rerunning or modifying checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, urllib.request, urllib.parse
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  next_request = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if urllib.parse.urlsplit(req.full_url).netloc != urllib.parse.urlsplit(newurl).netloc:
                      next_request.remove_header('Authorization')
                      next_request.remove_header('Accept')
                  return next_request
          opener = urllib.request.build_opener(SafeRedirect())
          base = 'https://api.github.com/repos/blue45f/toonspectrum/'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          def get(path):
              with opener.open(urllib.request.Request(base + path, headers=headers), timeout=30) as response:
                  return response.read()
          run = json.loads(get('actions/runs/33953145676'))
          assert run['head_sha'] == 'a40b3c3e6d9e11faefe1719e73cd1bab4dac29bc'
          job = json.loads(get('actions/jobs/101271521448'))
          assert job['name'] == 'core' and job['run_id'] == run['id'] and job['conclusion'] == 'failure'
          raw = get('actions/jobs/101271521448/logs')
          text = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', raw.decode('utf-8-sig'))
          lines = text.splitlines()
          failed = [line for line in lines if re.search(r'\bFAIL\s|Test Files|\bTests\s+\d+ failed', line)]
          start = next((i for i,line in enumerate(lines) if 'Failed Tests' in line or 'Failed Suites' in line), len(lines)-150)
          print('PRODUCT_SHA=' + run['head_sha'] + '\nLOG_SHA256=' + hashlib.sha256(raw).hexdigest())
          print('FAILURE_HEADERS\n' + '\n'.join(failed))
          print('FAILURE_DETAILS\n' + '\n'.join(lines[start:])[:30000])
          PY
