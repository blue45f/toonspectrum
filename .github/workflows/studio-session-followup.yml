name: Studio session followup
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-session-followup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build:bundle
      - run: pnpm exec tsx scripts/diagnose-studio-session.mts
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: studio-session-diagnosis
          path: /tmp/studio-session-evidence
          retention-days: 7
          if-no-files-found: error
