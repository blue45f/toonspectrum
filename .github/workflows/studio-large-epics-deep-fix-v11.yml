name: Studio large epics deep fixes

on:
  push:
    branches:
      - codex/studio-large-epics-closure-20260909
    paths:
      - .github/workflows/studio-large-epics-deep-fix-v11.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      BRANCH: codex/studio-large-epics-closure-20260909
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Consolidate the host bridge and preserve the host line ratchet
        run: |
          cat > /tmp/consolidate-host.mjs <<'NODE'
          import fs from 'node:fs';
          import childProcess from 'node:child_process';
          import ts from 'typescript';

          const generatedPath = 'apps/web/src/domains/creator/ai/studio-generated-3d-product-bridge.ts';
          let generated = fs.readFileSync(generatedPath, 'utf8');
          generated = generated.replace(
            '  readonly ownerId: string;\n  readonly openObjectInsert: () => void | Promise<void>;',
            '  readonly ownerId: string;\n  readonly enabled?: boolean;\n  readonly openObjectInsert: () => void | Promise<void>;',
          );
          generated = generated.replace(
            '  useEffect(() => {\n    const active = new Set<AbortController>();',
            '  useEffect(() => {\n    if (input.enabled === false) return undefined;\n    const active = new Set<AbortController>();',
          );
          generated = generated.replace(
            '  }, [input.openObjectInsert, input.ownerId]);',
            '  }, [input.enabled, input.openObjectInsert, input.ownerId]);',
          );
          fs.writeFileSync(generatedPath, generated);

          const bridgePath = 'apps/web/src/domains/creator/ai/studio-stroke-proposal-bridge.ts';
          let bridge = fs.readFileSync(bridgePath, 'utf8');
          const generatedImport = 'import { useStudioGenerated3dHostBridge } from "./studio-generated-3d-product-bridge";';
          if (!bridge.includes(generatedImport)) {
            const sf = ts.createSourceFile(bridgePath, bridge, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX);
            const imports = sf.statements.filter(ts.isImportDeclaration);
            const at = imports.at(-1).end;
            bridge = `${bridge.slice(0, at)}\n${generatedImport}${bridge.slice(at)}`;
          }
          if (!bridge.includes('const NOOP_OPEN_OBJECT_INSERT')) {
            const marker = 'const DISCONNECTED:';
            const at = bridge.indexOf(marker);
            if (at < 0) throw new Error('stroke bridge disconnected marker missing');
            bridge = `${bridge.slice(0, at)}const NOOP_OPEN_OBJECT_INSERT = () => undefined;\n\n${bridge.slice(at)}`;
          }
          bridge = bridge.replace(
            '  readonly appendElement: (element: TElement) => void;\n}): void {',
            '  readonly appendElement: (element: TElement) => void;\n  readonly openObjectInsert?: () => void | Promise<void>;\n}): void {',
          );
          if (!bridge.includes('ownerId: `${input.ownerId}:generated-3d`')) {
            const marker = '  const documentGeneration = useMemo(';
            const at = bridge.indexOf(marker);
            if (at < 0) throw new Error('stroke bridge generation marker missing');
            const hook = '  useStudioGenerated3dHostBridge({\n    ownerId: `${input.ownerId}:generated-3d`,\n    enabled: Boolean(input.openObjectInsert),\n    openObjectInsert: input.openObjectInsert ?? NOOP_OPEN_OBJECT_INSERT,\n  });\n';
            bridge = `${bridge.slice(0, at)}${hook}${bridge.slice(at)}`;
          }
          fs.writeFileSync(bridgePath, bridge);

          const hostPath = 'apps/web/src/domains/creator/StudioCuttoonEditorHost.tsx';
          let host = fs.readFileSync(hostPath, 'utf8');
          host = host.replace(/^import \{ useStudioGenerated3dHostBridge \} from "\.\/ai\/studio-generated-3d-product-bridge";\n/mu, '');
          host = host.replace(/\n\s*useStudioGenerated3dHostBridge\(\{\n\s*ownerId: "StudioGenerated3dHost",\n\s*openObjectInsert: openStudioObjectInsert,\n\s*\}\);\n/u, '\n');

          const importLine = 'import { useStudioAiCanvasBridge } from "./ai/studio-stroke-proposal-bridge";';
          if (!host.includes(importLine)) {
            const sf = ts.createSourceFile(hostPath, host, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX);
            const imports = sf.statements.filter(ts.isImportDeclaration);
            const at = imports.at(-1).end;
            host = `${host.slice(0, at)}\n${importLine}${host.slice(at)}`;
          }

          if (!host.includes('ownerId: "StudioCuttoonEditorHost"')) {
            const sf = ts.createSourceFile(hostPath, host, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX);
            let fn;
            for (const statement of sf.statements) {
              if (ts.isFunctionDeclaration(statement) && statement.name?.text === 'StudioCuttoonEditorHost') fn = statement;
              if (ts.isVariableStatement(statement)) {
                for (const declaration of statement.declarationList.declarations) {
                  if (ts.isIdentifier(declaration.name) && declaration.name.text === 'StudioCuttoonEditorHost' && declaration.initializer) fn = declaration.initializer;
                }
              }
            }
            if (!fn?.body || !ts.isBlock(fn.body)) throw new Error('Studio host function not found');
            const names = new Set();
            for (const statement of fn.body.statements) {
              if (ts.isVariableStatement(statement)) {
                for (const declaration of statement.declarationList.declarations) if (ts.isIdentifier(declaration.name)) names.add(declaration.name.text);
              }
              if (ts.isFunctionDeclaration(statement) && statement.name) names.add(statement.name.text);
            }
            const elements = ['elements', 'currentElements', 'pageElements'].find((name) => names.has(name));
            const append = ['addEl', 'addElement', 'appendElement'].find((name) => names.has(name));
            if (!elements || !append || !names.has('openStudioObjectInsert')) throw new Error('Studio host bridge dependencies were not found');
            const result = fn.body.statements.filter(ts.isReturnStatement).at(-1);
            const at = result.getStart(sf);
            const hook = `  useStudioAiCanvasBridge({ ownerId: "StudioCuttoonEditorHost", documentId: String(globalThis.location?.pathname ?? "studio"), elements: ${elements}, appendElement: ${append}, openObjectInsert: openStudioObjectInsert });\n`;
            host = `${host.slice(0, at)}${hook}${host.slice(at)}`;
          } else if (!/ownerId: "StudioCuttoonEditorHost"[\s\S]{0,400}openObjectInsert:/u.test(host)) {
            host = host.replace(
              /(ownerId: "StudioCuttoonEditorHost"[\s\S]{0,400}?appendElement: [^,\n]+,)/u,
              '$1\n    openObjectInsert: openStudioObjectInsert,',
            );
          }

          const baseline = childProcess.execFileSync('git', ['show', 'origin/main:' + hostPath], { encoding: 'utf8' }).split(/\r?\n/u).length;
          const lines = host.split(/\r?\n/u);
          while (lines.length > baseline) {
            let removed = false;
            for (let index = 1; index < lines.length - 1; index += 1) {
              if (lines[index].trim() === '' && (lines[index - 1].trim() === '' || lines[index + 1].trim() === '')) {
                lines.splice(index, 1);
                removed = true;
                break;
              }
            }
            if (!removed) {
              const index = lines.findIndex((line, lineIndex) => lineIndex > 1000 && line.trim() === '');
              if (index < 0) throw new Error(`Unable to preserve host line ratchet ${baseline}`);
              lines.splice(index, 1);
            }
          }
          fs.writeFileSync(hostPath, lines.join('\n'));

          const testPath = 'apps/web/src/domains/creator/studio-large-epics-product-wiring.test.ts';
          let test = fs.readFileSync(testPath, 'utf8');
          test = test.replace('    expect(host).toContain("useStudioGenerated3dHostBridge");\n', '');
          if (!test.includes('studio-stroke-proposal-bridge.ts')) {
            test = test.replace(
              '    const hub = source("apps/web/src/domains/creator/ai/StudioAiAssistHub.tsx");',
              '    const hub = source("apps/web/src/domains/creator/ai/StudioAiAssistHub.tsx");\n    const bridge = source("apps/web/src/domains/creator/ai/studio-stroke-proposal-bridge.ts");',
            );
            test = test.replace(
              '    expect(host).toMatch(/appendElement\\s*:/u);',
              '    expect(host).toMatch(/appendElement\\s*:/u);\n    expect(bridge).toContain("useStudioGenerated3dHostBridge");',
            );
          }
          fs.writeFileSync(testPath, test);
          NODE
          node /tmp/consolidate-host.mjs

      - name: Verify host boundary and self-remove
        run: |
          pnpm exec eslint --fix --max-warnings=0 \
            apps/web/src/domains/creator/StudioCuttoonEditorHost.tsx \
            apps/web/src/domains/creator/ai/studio-stroke-proposal-bridge.ts \
            apps/web/src/domains/creator/ai/studio-generated-3d-product-bridge.ts \
            apps/web/src/domains/creator/studio-large-epics-product-wiring.test.ts
          pnpm exec vitest run \
            apps/web/src/domains/creator/ai/studio-generated-3d-product-bridge.test.tsx \
            apps/web/src/domains/creator/studio-large-epics-product-wiring.test.ts
          pnpm exec tsc -p tsconfig.json --noEmit --incremental false
          test "$(wc -l < apps/web/src/domains/creator/StudioCuttoonEditorHost.tsx)" -le "$(git show origin/main:apps/web/src/domains/creator/StudioCuttoonEditorHost.tsx | wc -l)"
          rm -f .github/workflows/studio-large-epics-deep-fix-v11.yml

      - name: Publish with retries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps .github/workflows/studio-large-epics-deep-fix-v11.yml
          git commit -m "refactor(studio): consolidate large-epic host bridges"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if git rebase "origin/$BRANCH" && git push origin HEAD:"$BRANCH"; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 7))
          done
          exit 1
