name: Finalize Studio template asset smart library

on:
  push:
    branches:
      - feat/studio-template-asset-smart-library-20260909
    paths:
      - .github/workflows/finalize-template-asset-smart-library.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: finalize-template-asset-smart-library-20260909
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/studio-template-asset-smart-library-20260909
          fetch-depth: 0

      - name: Reconstruct reviewed sources from immutable Git blobs
        shell: bash
        run: |
          set -euo pipefail
          workspace=apps/web/src/domains/creator/StudioUnifiedAssetWorkspace.tsx
          workspace_test=apps/web/src/domains/creator/StudioUnifiedAssetWorkspace.test.tsx
          intelligence=apps/web/src/domains/creator/studio-unified-asset-intelligence.ts
          intelligence_test=apps/web/src/domains/creator/studio-unified-asset-intelligence.test.ts
          mkdir -p /tmp/template-asset-smart-library

          fetch_blob() {
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/$1" --jq .content \
              | tr -d '\n\r' \
              | base64 --decode
          }

          {
            fetch_blob 00787dbe2b903ce862b25d6cfbe394a31a5247f9
            fetch_blob d59cdd14deccb6b4a3d8e7af690e3a2892c76592
            fetch_blob a8f1c35fa4e4ef963aa455bfa93f02d5593500fb
            fetch_blob 2a36f1a34b9c64bdef94696e0abf2cfa922d9016
            fetch_blob f480c4a73c4bb2a7161d2fce840e60aa7c58844a
            fetch_blob ac2ee50f27a1d7a85531b038ed552bc04461ea0a
          } | tr -d '\n\r ' | base64 --decode > "$workspace"

          fetch_blob 13e6dc2c3ce8fa108a82f5684a2b24091a46841a > /tmp/template-asset-smart-library/candidate-a
          fetch_blob 1cc7323ae34f54d6e329d36ab862424e2a443400 > /tmp/template-asset-smart-library/candidate-b
          fetch_blob 7518b27c6cbeb285275150b90c04abbb2c0731e8 > /tmp/template-asset-smart-library/candidate-c

          found_workspace_test=0
          found_intelligence=0
          found_intelligence_test=0
          for candidate in /tmp/template-asset-smart-library/candidate-*; do
            if grep -q '@vitest-environment jsdom' "$candidate"; then
              cp "$candidate" "$workspace_test"
              found_workspace_test=$((found_workspace_test + 1))
            elif grep -q 'from "./studio-unified-asset-intelligence"' "$candidate"; then
              cp "$candidate" "$intelligence_test"
              found_intelligence_test=$((found_intelligence_test + 1))
            else
              cp "$candidate" "$intelligence"
              found_intelligence=$((found_intelligence + 1))
            fi
          done

          test "$found_workspace_test" -eq 1
          test "$found_intelligence" -eq 1
          test "$found_intelligence_test" -eq 1
          test -s "$workspace"
          test -s "$workspace_test"
          test -s "$intelligence"
          test -s "$intelligence_test"
          grep -q 'StudioUnifiedAssetWorkspace' "$workspace"
          grep -q 'studio-unified-asset-intelligence' "$workspace"
          grep -q '@vitest-environment jsdom' "$workspace_test"
          grep -q 'export' "$intelligence"
          grep -q 'describe' "$intelligence_test"
          git diff --check

      - name: Commit final feature and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/domains/creator/StudioUnifiedAssetWorkspace.tsx \
            apps/web/src/domains/creator/StudioUnifiedAssetWorkspace.test.tsx \
            apps/web/src/domains/creator/studio-unified-asset-intelligence.ts \
            apps/web/src/domains/creator/studio-unified-asset-intelligence.test.ts
          git rm .github/workflows/finalize-template-asset-smart-library.yml
          git commit -m "feat(studio): 고도화된 템플릿·에셋 스마트 라이브러리"
          git push origin HEAD:feat/studio-template-asset-smart-library-20260909

      - name: Open pull request
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr-body.md <<'EOF'
          ## 목적

          국내외 디자인·웹툰·에셋 제작 서비스를 벤치마킹해 Studio의 템플릿·에셋 탐색을 단순 카테고리 목록에서 반복 제작에 적합한 스마트 라이브러리로 확장합니다.

          ## 주요 변경

          - 전체·즐겨찾기·최근 사용·프로젝트 트레이의 개인 작업 선반을 추가했습니다.
          - 형식, 권리 상태, 편집 가능성, 추천/이름 정렬 필터를 조합할 수 있습니다.
          - 카드에서 형식·권리·편집 가능성을 확인한 뒤 기존 안전한 삽입 경로로 사용합니다.
          - 카테고리·형식·원본·키워드·범위를 이용한 설명 가능한 연관 에셋 추천을 추가했습니다.
          - 손상된 저장값, 중복 ID, 비정상 타임스탬프를 방어하는 버전형 로컬 상태와 한도 정책을 적용했습니다.
          - 통합 탐색, 보관함·마켓, 마켓 딥링크, AI 제작 도구 전달, 기존 소스별 라우팅을 유지합니다.
          - 삽입이 거절되거나 실패한 에셋은 성공 메시지나 최근 사용 기록에 남기지 않습니다.

          ## 벤치마킹 반영

          Canva·Adobe Express·Figma·Clip Studio·Envato·Freepik·Storyboard That·Pixton과 미리캔버스·망고보드·WEBTOON SHAPER·ACON·투닝의 공통 패턴을 검토해 빠른 재발견, 개인화 선반, 에셋 신뢰 정보, 비파괴 후속 편집, 연관 추천을 현재 Studio 구조에 맞게 적용했습니다.

          ## 검증

          - 순수 intelligence 계층 strict TypeScript 검사
          - 저장 상태 정규화·필터·정렬·추천 런타임 단언
          - Workspace 검색·필터·선반·사용 성공/실패 회귀 테스트 확장
          - 변경 소스 `git diff --check`
          - 기존 Workspace 두 파일의 기준 blob이 준비 시점과 동일함을 확인한 뒤 최신 main 기반으로 구성

          전체 저장소 Vitest, ESLint, typecheck, production build는 이 PR의 표준 CI 결과를 기준으로 판단합니다.
          EOF

          if ! gh pr view --repo "$GITHUB_REPOSITORY" --head feat/studio-template-asset-smart-library-20260909 >/dev/null 2>&1; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head feat/studio-template-asset-smart-library-20260909 \
              --title "feat(studio): 템플릿·에셋 스마트 라이브러리 고도화" \
              --body-file /tmp/pr-body.md
          fi
