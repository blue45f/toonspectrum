name: Repair and kick Creator Marketplace finalizer

on:
  push:
    branches:
      - feat/marketplace-creator-pipeline-20260903
    paths:
      - ".github/workflows/marketplace-authoring-finalizer-kick.yml"

permissions:
  actions: write
  contents: write

jobs:
  repair-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/marketplace-creator-pipeline-20260903

      - name: Add deterministic import-order repair before strict lint
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/marketplace-authoring-finalizer.yml")
          source = path.read_text(encoding="utf-8")
          before = '''      - name: Type-check, lint, architecture, and production build
        run: |
          set -euo pipefail
          pnpm exec tsc -p tsconfig.json --noEmit
          pnpm run lint:quick'''
          after = '''      - name: Type-check, lint, architecture, and production build
        run: |
          set -euo pipefail
          pnpm exec eslint --fix \\
            src/domains/creator/brush/StudioBrushStudio.tsx \\
            src/domains/market/components/MarketResourceDetailArticle.tsx \\
            src/domains/market/components/MarketplaceAuthoringInstallAction.tsx \\
            src/domains/market/components/MarketplaceAuthoringWorkshop.tsx \\
            src/domains/market/pages/MarketPublishPage.tsx
          pnpm exec tsc -p tsconfig.json --noEmit
          pnpm run lint:quick'''
          if after not in source:
              if source.count(before) != 1:
                  raise SystemExit("Finalizer lint anchor changed")
              source = source.replace(before, after)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Commit finalizer repair
        run: |
          set -euo pipefail
          git add .github/workflows/marketplace-authoring-finalizer.yml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix(market): normalize generated integration imports before lint"
            git push origin HEAD:feat/marketplace-creator-pipeline-20260903
          fi

      - name: Dispatch the repaired finalizer
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run marketplace-authoring-finalizer.yml
          --repo "$GITHUB_REPOSITORY"
          --ref feat/marketplace-creator-pipeline-20260903
