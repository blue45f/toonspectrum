name: One-shot final lint fix

on:
  push:
    branches:
      - release/final-df46fece-20260908-1905
    paths:
      - .github/workflows/one-shot-final-lint-fix.yml

permissions:
  contents: write

concurrency:
  group: one-shot-final-lint-fix-20260908
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/final-df46fece-20260908-1905
          fetch-depth: 1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Apply the reviewed static-analysis fixes
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin release/final-df46fece-20260908-1905

          old_thumbnail='apps/web/src/domains/creator/character-platform/thumbnail/character-runtime-thumbnail-store.tsx'
          new_thumbnail='apps/web/src/domains/creator/character-platform/thumbnail/character-runtime-thumbnail-store.ts'
          if [[ -f "$old_thumbnail" && ! -e "$new_thumbnail" ]]; then
            git mv "$old_thumbnail" "$new_thumbnail"
          elif [[ ! -f "$new_thumbnail" ]]; then
            echo "thumbnail module is missing" >&2
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count == 1:
                  path.write_text(text.replace(old, new, 1))
                  return
              if count == 0 and new in text:
                  return
              raise SystemExit(f"{path}: expected one reviewed occurrence, found {count}")

          surface = Path("apps/web/src/domains/creator/character-platform/surface-ink/character-surface-ink.ts")
          replace_once(
              surface,
              "    let segment = subtract(target, previous);\n    let segmentLength = length(segment);",
              "    const segment = subtract(target, previous);\n    const segmentLength = length(segment);",
          )

          thumbnail = Path("apps/web/src/domains/creator/character-platform/thumbnail/character-runtime-thumbnail-store.ts")
          replace_once(
              thumbnail,
              "function selectedEntryIds(binding: CharacterShaperBinding): readonly string[] {\n  const ids = new Set<string>();\n  for (const value of Object.values(binding.recipe.slots)) {",
              "function selectedEntryIds(recipe: CharacterShaperBinding[\"recipe\"]): readonly string[] {\n  const ids = new Set<string>();\n  for (const value of Object.values(recipe.slots)) {",
          )
          replace_once(
              thumbnail,
              "  const ids = useMemo(() => selectedEntryIds(binding), [binding.recipe]);",
              "  const ids = useMemo(() => selectedEntryIds(binding.recipe), [binding.recipe]);",
          )

          workbench = Path("apps/web/src/domains/creator/character-platform/ui/CharacterPlatformWorkbench.tsx")
          workbench_text = workbench.read_text()
          for icon in ("BadgeCheck", "Box", "FileJson", "SlidersHorizontal"):
              workbench_text = workbench_text.replace(f"  {icon},\n", "")
          workbench.write_text(workbench_text)

          hook = Path("apps/web/src/domains/creator/character-platform/ui/use-character-platform-workbench.ts")
          hook_text = hook.read_text()
          helper = '''function documentClockForModel(_modelId: string): string {
            return new Date().toISOString();
          }

          '''.replace("          ", "")
          marker = "export function useCharacterPlatformWorkbench(\n"
          if helper not in hook_text:
              if hook_text.count(marker) != 1:
                  raise SystemExit(f"{hook}: hook marker count {hook_text.count(marker)}")
              hook_text = hook_text.replace(marker, helper + marker, 1)
          old_clock = "  const documentClock = useMemo(() => new Date().toISOString(), [modelId]);"
          new_clock = "  const documentClock = useMemo(() => documentClockForModel(modelId), [modelId]);"
          if old_clock in hook_text:
              hook_text = hook_text.replace(old_clock, new_clock, 1)
          elif new_clock not in hook_text:
              raise SystemExit(f"{hook}: document clock marker missing")
          hook.write_text(hook_text)

          workspace = Path("apps/web/src/domains/creator/studio-production/studio-production-workspace.ts")
          replace_once(
              workspace,
              '''export * from "./studio-production-workspace-runtime";

          import {
            createEmptyProductionWorkspace as createRuntimeProductionWorkspace,
          } from "./studio-production-workspace-runtime";

          import type { ProductionWorkspace } from "./studio-production-workspace-runtime";
          '''.replace("          ", ""),
              '''import {
            createEmptyProductionWorkspace as createRuntimeProductionWorkspace,
            type ProductionWorkspace,
          } from "./studio-production-workspace-runtime";

          export * from "./studio-production-workspace-runtime";
          '''.replace("          ", ""),
          )

          for root in (Path("apps"), Path("packages"), Path("scripts")):
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  if path.suffix not in {".ts", ".tsx", ".js", ".mjs"}:
                      continue
                  text = path.read_text(errors="ignore")
                  updated = text.replace(
                      "character-runtime-thumbnail-store.tsx",
                      "character-runtime-thumbnail-store.ts",
                  )
                  if updated != text:
                      path.write_text(updated)
          PY

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify all touched files with the repository lint policy
        run: |
          pnpm exec eslint --max-warnings=0 \
            apps/web/src/domains/creator/character-platform/surface-ink/character-surface-ink.ts \
            apps/web/src/domains/creator/character-platform/thumbnail/character-runtime-thumbnail-store.ts \
            apps/web/src/domains/creator/character-platform/ui/CharacterPlatformWorkbench.tsx \
            apps/web/src/domains/creator/character-platform/ui/use-character-platform-workbench.ts \
            apps/web/src/domains/creator/studio-production/studio-production-workspace.ts
      - name: Commit the verified lint fix and retire this workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/one-shot-final-lint-fix.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(lint): clean final integration static violations"
          git push origin HEAD:release/final-df46fece-20260908-1905
