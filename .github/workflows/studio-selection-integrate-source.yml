name: Studio Selection Source Integration

on:
  push:
    branches:
      - feat/studio-selection-workbench-v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-selection-source-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate-source:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/studio-selection-workbench-v2
          fetch-depth: 1

      - name: Apply fail-closed integration patch
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/codex-selection-workbench-v2-patch.py
          python3 scripts/codex-selection-workbench-v2-patch.py
          git diff --check

      - name: Commit actual product integration
        run: |
          set -euo pipefail
          git add \
            apps/web/src/domains/creator/StudioInspectorImageToolsSection.tsx \
            apps/web/src/domains/creator/studio-cuttoon-editor/StudioCuttoonEditorCanvasColumn.tsx \
            apps/web/src/domains/creator/studio-main-menu-group-spec.ts \
            apps/web/src/domains/creator/studio-main-menu-items-selection.ts
          git rm .github/workflows/studio-selection-integrate-source.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(studio): wire professional selection workbench v2"
          git push origin HEAD:feat/studio-selection-workbench-v2
