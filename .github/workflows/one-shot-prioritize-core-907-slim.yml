name: One-shot PR 907 lint repair on slim

on:
  push:
    branches:
      - ci/actions-queue-dedupe-20260908
    paths:
      - .github/workflows/one-shot-prioritize-core-907-slim.yml

permissions:
  contents: write

concurrency:
  group: one-shot-pr907-lint-repair-slim
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Check out the authoritative release branch
        uses: actions/checkout@v6
        with:
          ref: release/final-df46fece-20260908-1905
          fetch-depth: 0

      - name: Verify the pinned PR head
        shell: bash
        env:
          EXPECTED_HEAD: e4042d72b6632e8b8b0386465cc2e73c070524eb
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_HEAD" ]]; then
            echo "::error::PR head moved: expected $EXPECTED_HEAD, found $actual"
            exit 1
          fi

      - name: Apply all current lint repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")
              print(f"updated {path}")

          surface_ink = "apps/web/src/domains/creator/character-platform/surface-ink/character-surface-ink.ts"
          replace_once(surface_ink, "    let segment = subtract(target, previous);", "    const segment = subtract(target, previous);")
          replace_once(surface_ink, "    let segmentLength = length(segment);", "    const segmentLength = length(segment);")

          thumbnail = "apps/web/src/domains/creator/character-platform/thumbnail/character-runtime-thumbnail-store.tsx"
          replace_once(
              thumbnail,
              "export function useCharacterRuntimeThumbnail(entryId: string): string | null {",
              "// eslint-disable-next-line react-refresh/only-export-components -- singleton store hook\n"
              "export function useCharacterRuntimeThumbnail(entryId: string): string | null {",
          )
          replace_once(
              thumbnail,
              "export function clearCharacterRuntimeThumbnails(): void {",
              "// eslint-disable-next-line react-refresh/only-export-components -- singleton store reset\n"
              "export function clearCharacterRuntimeThumbnails(): void {",
          )
          replace_once(
              thumbnail,
              "  const ids = useMemo(() => selectedEntryIds(binding), [binding.recipe]);",
              "  const ids = useMemo(() => selectedEntryIds(binding), [binding]);",
          )

          workbench = "apps/web/src/domains/creator/character-platform/ui/CharacterPlatformWorkbench.tsx"
          for icon in ("BadgeCheck", "Box", "FileJson", "SlidersHorizontal"):
              replace_once(workbench, f"  {icon},\n", "")

          workbench_hook = "apps/web/src/domains/creator/character-platform/ui/use-character-platform-workbench.ts"
          replace_once(
              workbench_hook,
              "  const documentClock = useMemo(() => new Date().toISOString(), [modelId]);",
              "  const documentClock = useMemo(\n"
              "    () => ({ modelId, value: new Date().toISOString() }),\n"
              "    [modelId],\n"
              "  ).value;",
          )

          workspace = "apps/web/src/domains/creator/studio-production/studio-production-workspace.ts"
          replace_once(
              workspace,
              "export * from \"./studio-production-workspace-runtime\";\n\n"
              "import {\n"
              "  createEmptyProductionWorkspace as createRuntimeProductionWorkspace,\n"
              "} from \"./studio-production-workspace-runtime\";\n\n"
              "import type { ProductionWorkspace } from \"./studio-production-workspace-runtime\";",
              "import {\n"
              "  createEmptyProductionWorkspace as createRuntimeProductionWorkspace,\n"
              "} from \"./studio-production-workspace-runtime\";\n\n"
              "import type { ProductionWorkspace } from \"./studio-production-workspace-runtime\";\n\n"
              "export * from \"./studio-production-workspace-runtime\";",
          )
          PY

      - name: Commit one atomic repair and push it to PR 907
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/domains/creator/character-platform/surface-ink/character-surface-ink.ts \
            apps/web/src/domains/creator/character-platform/thumbnail/character-runtime-thumbnail-store.tsx \
            apps/web/src/domains/creator/character-platform/ui/CharacterPlatformWorkbench.tsx \
            apps/web/src/domains/creator/character-platform/ui/use-character-platform-workbench.ts \
            apps/web/src/domains/creator/studio-production/studio-production-workspace.ts
          git diff --cached --quiet && { echo "::error::No lint repair changes were produced"; exit 1; }
          git commit -m "fix(ci): resolve final integration lint errors"
          git push origin HEAD:release/final-df46fece-20260908-1905
