name: Brush review source snapshot
on:
  push:
    branches: [feat/brush-material-reset-core-20260912]
    paths: [.github/workflows/brush-review-snapshot.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Archive tracked source and dependencies for offline verification
        run: |
          set -euo pipefail
          mkdir -p /tmp/brush-review
          git rev-parse HEAD > /tmp/brush-review/commit.txt
          git ls-files > /tmp/brush-review/files.txt
          git archive --format=tar.gz HEAD > /tmp/brush-review/repository.tar.gz
          git fetch --depth=1 origin 0f8590b2b943a4291be4f4655a9efa01fd34173d
          git archive --format=tar.gz FETCH_HEAD apps/web/src scripts .github docs/rewrite > /tmp/brush-review/consolidation.tar.gz
          git diff HEAD FETCH_HEAD -- apps/web/src scripts docs/rewrite > /tmp/brush-review/consolidation.patch
          tar -czf /tmp/brush-review/dependencies.tar.gz node_modules apps/*/node_modules packages/*/node_modules
          du -h /tmp/brush-review/*
      - uses: actions/upload-artifact@v6
        with:
          name: brush-review-workspace
          path: /tmp/brush-review
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
