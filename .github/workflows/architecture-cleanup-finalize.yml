name: One-shot architecture cleanup finalizer

on:
  push:
    branches:
      - chore/architecture-sonar-cleanup
    paths:
      - .github/workflows/architecture-cleanup-finalize.yml

permissions:
  contents: write

concurrency:
  group: architecture-cleanup-finalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/architecture-sonar-cleanup
          fetch-depth: 1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Consolidate browser-only harnesses and fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/web/tools/browser-harnesses

          for file in hand-compare-main.ts hand-compare.html props-compare-main.ts props-compare.html; do
            test -f "tools/browser-harnesses/$file"
            test ! -e "apps/web/tools/browser-harnesses/$file"
            git mv "tools/browser-harnesses/$file" "apps/web/tools/browser-harnesses/$file"
          done

          for file in hybrid-dcc-e2e-main.tsx hybrid-dcc-e2e.html promo-e2e.html; do
            cmp "tools/browser-harnesses/$file" "apps/web/tools/browser-harnesses/$file"
            git rm "tools/browser-harnesses/$file"
          done

          test -f apps/web/tests/browser-fixtures/studio-catalog/index.html
          test -f apps/web/tests/browser-fixtures/studio-catalog/main.tsx
          git rm -r tests/browser-fixtures/studio-catalog

      - name: Apply architecture, readability, and CI hardening
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          function read(file) {
            return fs.readFileSync(file, 'utf8');
          }

          function write(file, content) {
            fs.writeFileSync(file, content.endsWith('\n') ? content : `${content}\n`);
          }

          function replaceExact(file, before, after, expectedCount = 1) {
            const source = read(file);
            const count = source.split(before).length - 1;
            if (count !== expectedCount) {
              throw new Error(`${file}: expected ${expectedCount} replacement target(s), found ${count}`);
            }
            write(file, source.split(before).join(after));
          }

          function dedentOverIndentedFunction(file, startMarker, endMarker) {
            const lines = read(file).split('\n');
            const start = lines.findIndex((line) => line.startsWith(startMarker));
            const end = lines.findIndex((line, index) => index > start && line.startsWith(endMarker));
            if (start < 0 || end < 0) {
              throw new Error(`${file}: could not locate ${startMarker} .. ${endMarker}`);
            }
            for (let index = start + 1; index < end; index += 1) {
              if (lines[index].startsWith('    ')) lines[index] = lines[index].slice(2);
            }
            write(file, lines.join('\n'));
          }

          const packageJson = JSON.parse(read('package.json'));
          packageJson.scripts['verify:csp'] = 'node scripts/verify-vercel-csp.mjs apps/web/index.html';
          if (!packageJson.scripts.ci.includes('pnpm run verify:csp')) {
            packageJson.scripts.ci = packageJson.scripts.ci.replace(
              'pnpm run validate:architecture && ',
              'pnpm run validate:architecture && pnpm run verify:csp && ',
            );
          }
          write('package.json', JSON.stringify(packageJson, null, 2));

          const tsconfig = JSON.parse(read('tsconfig.json'));
          const obsoleteIncludes = new Set([
            'apps/web/src/shared/components/**/*.ts',
            'apps/web/src/shared/components/**/*.tsx',
            'apps/web/src/shared/lib/**/*.ts',
            'apps/web/src/shared/lib/**/*.tsx',
            'tools/**/*.ts',
            'tools/**/*.tsx',
          ]);
          tsconfig.include = tsconfig.include.filter((entry) => !obsoleteIncludes.has(entry));
          for (const entry of [
            'apps/web/tests/**/*.ts',
            'apps/web/tests/**/*.tsx',
            'apps/web/tools/**/*.ts',
            'apps/web/tools/**/*.tsx',
          ]) {
            if (!tsconfig.include.includes(entry)) tsconfig.include.push(entry);
          }
          write('tsconfig.json', JSON.stringify(tsconfig, null, 2));

          replaceExact(
            '.github/workflows/studio-asset-browser.yml',
            '      - tests/browser-fixtures/studio-catalog/**',
            '      - apps/web/tests/browser-fixtures/studio-catalog/**',
            2,
          );
          replaceExact(
            '.github/workflows/studio-promo-video.yml',
            "      - 'tools/browser-harnesses/promo-e2e.html'",
            "      - 'apps/web/tools/browser-harnesses/promo-e2e.html'",
          );
          replaceExact(
            '.github/workflows/studio-wearable-runtime-review.yml',
            '          cp tools/browser-harnesses/props-compare-main.ts tools/browser-harnesses/props-compare.html wearable-runtime-review/browser-harnesses/',
            '          cp apps/web/tools/browser-harnesses/props-compare-main.ts apps/web/tools/browser-harnesses/props-compare.html wearable-runtime-review/browser-harnesses/',
          );

          replaceExact(
            'scripts/validate-architecture.mjs',
            'const requiredPaths = [\n  "README.md",',
            'const requiredPaths = [\n  "README.md",\n  "ARCHITECTURE.md",',
          );
          replaceExact(
            'scripts/validate-architecture.mjs',
            'const requiredEntries = ["apps/web/index.html", "apps/web/src/app/main.tsx", "vite.config.ts"];',
            'const requiredEntries = [\n  "apps/web/index.html",\n  "apps/web/public",\n  "apps/web/src/app/main.tsx",\n  "apps/web/config/vite-manual-chunks.ts",\n  "apps/web/tests/browser-fixtures/studio-catalog/index.html",\n  "apps/web/tools/browser-harnesses/hybrid-dcc-e2e.html",\n  "vite.config.ts",\n];',
          );
          replaceExact(
            'scripts/validate-architecture.mjs',
            '// "일회성 실험"이 같은 트리에서 구분되지 않는다. 하네스의 집은 tools/browser-harnesses/ 다.',
            '// "일회성 실험"이 같은 트리에서 구분되지 않는다. 하네스의 집은 apps/web/tools/browser-harnesses/다.',
          );
          replaceExact(
            'scripts/validate-architecture.mjs',
            ' (the app entry is apps/web/src/app/main.tsx; browser harnesses belong in tools/browser-harnesses/)',
            ' (the app entry is apps/web/src/app/main.tsx; browser harnesses belong in apps/web/tools/browser-harnesses/)',
          );
          replaceExact(
            'scripts/validate-architecture.mjs',
            '  if (entry.name === "index.html") continue;\n',
            '',
          );
          replaceExact(
            'scripts/validate-architecture.mjs',
            ' (only apps/web/index.html is the application entry; harness pages belong in tools/browser-harnesses/)',
            ' (only apps/web/index.html is the application entry; harness pages belong in apps/web/tools/browser-harnesses/)',
          );
          replaceExact(
            'scripts/validate-architecture.mjs',
            'if (!exists("tools/browser-harnesses")) {\n  issues.push("missing harness home: tools/browser-harnesses/");\n}',
            'if (!exists("apps/web/tools/browser-harnesses")) {\n  issues.push("missing harness home: apps/web/tools/browser-harnesses/");\n}\nif (exists("tools/browser-harnesses")) {\n  issues.push("legacy browser harness directory at repository root: tools/browser-harnesses/");\n}\nif (exists("tests/browser-fixtures/studio-catalog")) {\n  issues.push("duplicate Studio catalog fixture at repository root: tests/browser-fixtures/studio-catalog/");\n}',
          );
          replaceExact(
            'scripts/validate-architecture.mjs',
            'for (const legacyRoot of ["components", "lib", "src", "public"]) {',
            'for (const legacyRoot of ["components", "hooks", "lib", "public", "shared", "src", "styles"]) {',
          );
          replaceExact(
            'scripts/validate-architecture.mjs',
            'for (const receiptDir of [".github/qa", "scripts/qa/runs"]) {',
            'for (const receiptDir of [".github/qa", "qa-results", "scripts/qa/runs"]) {',
          );
          replaceExact(
            'scripts/validate-architecture.mjs',
            '  "validate:architecture",\n  "verify:studio-menus",',
            '  "validate:architecture",\n  "verify:csp",\n  "verify:toolchain-coverage",\n  "verify:studio-menus",',
          );
          replaceExact(
            'scripts/validate-architecture.mjs',
            'for (const script of requiredScripts) {\n  if (!scripts[script]) issues.push(`missing script: ${script}`);\n}\n',
            'for (const script of requiredScripts) {\n  if (!scripts[script]) issues.push(`missing script: ${script}`);\n}\n\nconst expectedCspCommand = "node scripts/verify-vercel-csp.mjs apps/web/index.html";\nif (scripts["verify:csp"] !== expectedCspCommand) {\n  issues.push(`verify:csp must target the canonical entry: ${expectedCspCommand}`);\n}\n\nconst canonicalWorkflowReferences = [\n  {\n    file: ".github/workflows/studio-asset-browser.yml",\n    required: "      - apps/web/tests/browser-fixtures/studio-catalog/**",\n    forbidden: "\\n      - tests/browser-fixtures/studio-catalog/**",\n  },\n  {\n    file: ".github/workflows/studio-promo-video.yml",\n    required: "apps/web/tools/browser-harnesses/promo-e2e.html",\n    forbidden: "\\'tools/browser-harnesses/promo-e2e.html\\'",\n  },\n  {\n    file: ".github/workflows/studio-wearable-runtime-review.yml",\n    required: "cp apps/web/tools/browser-harnesses/props-compare-main.ts",\n    forbidden: "cp tools/browser-harnesses/props-compare-main.ts",\n  },\n];\nfor (const { file, required, forbidden } of canonicalWorkflowReferences) {\n  const source = read(file);\n  if (!source.includes(required)) issues.push(`${file}: missing canonical web path ${required.trim()}`);\n  if (source.includes(forbidden)) issues.push(`${file}: stale root path ${forbidden.trim()}`);\n}\n',
          );

          replaceExact(
            '.github/workflows/ci.yml',
            '      - run: pnpm run validate:architecture\n      - run: pnpm run lint',
            '      - run: pnpm run validate:architecture\n      - run: pnpm run verify:csp\n      - run: pnpm run verify:toolchain-coverage\n      - run: pnpm run lint',
          );

          replaceExact(
            'eslint.config.mjs',
            '// 루트 Vite 앱(apps/web/src/·components/·lib/) — React 19 + RC + jsx-a11y.\n  // ToonSpectrum Vite 앱은 apps/web 에 있고, NestJS API 만 apps/api 에 있다.',
            '// apps/web/src 아래의 Vite 브라우저 앱 — React 19 + RC + jsx-a11y.\n  // 루트 package.json이 프런트엔드 툴체인을 소유하고, NestJS API만 별도 workspace package다.',
          );
          replaceExact(
            'eslint.config.mjs',
            '      { type: \'domains\', pattern: \'apps/web/src/domains/*/**/*\', mode: \'full\' },\n      {\n        type: \'shared\',',
            '      { type: \'domains\', pattern: \'apps/web/src/domains/*/**/*\', mode: \'full\' },\n      { type: \'shared\', pattern: \'apps/web/src/shared/**/*\', mode: \'full\' },\n      { type: \'shared\', pattern: \'apps/web/src/types/**/*\', mode: \'full\' },\n      {\n        type: \'shared\',',
          );
          replaceExact(
            'eslint.config.mjs',
            "    files: ['lib/db/**/*.ts', 'lib/server/**/*.ts', 'scripts/**/*.{ts,tsx,mts,cts}'],",
            "    files: ['scripts/**/*.{ts,tsx,mts,cts}'],",
          );

          replaceExact(
            'scripts/verify-toolchain-coverage.mjs',
            'import { existsSync, readFileSync, writeFileSync } from "node:fs";\nimport { join, relative } from "node:path";',
            'import { existsSync, readFileSync, statSync, writeFileSync } from "node:fs";\nimport { isAbsolute, join, relative, resolve, sep } from "node:path";',
          );
          replaceExact(
            'scripts/verify-toolchain-coverage.mjs',
            '["exec", "tsc", "-p", project, "--listFilesOnly"],',
            '["exec", "tsc", "-p", project, "--listFilesOnly", "--incremental", "false", "--pretty", "false"],',
          );
          replaceExact(
            'scripts/verify-toolchain-coverage.mjs',
            '  let count = 0;\n  for (const line of stdout.split("\\n")) {\n    const file = line.trim();\n    if (!file || file.endsWith(".d.ts") || file.includes("/node_modules/")) continue;\n    count += 1;\n  }\n  return count;',
            '  const files = new Set();\n  for (const line of stdout.split("\\n")) {\n    const candidate = line.trim();\n    if (!candidate || candidate.endsWith(".d.ts")) continue;\n    const file = isAbsolute(candidate) ? candidate : resolve(REPO_ROOT, candidate);\n    if (!existsSync(file) || !statSync(file).isFile()) continue;\n    const repoRelative = relative(REPO_ROOT, file);\n    if (\n      repoRelative === ".."\n      || repoRelative.startsWith(`..${sep}`)\n      || isAbsolute(repoRelative)\n      || repoRelative.split(sep).includes("node_modules")\n    ) {\n      continue;\n    }\n    files.add(repoRelative);\n  }\n  return files.size;',
          );
          replaceExact(
            'scripts/verify-toolchain-coverage.mjs',
            ' * node_modules are excluded so the number tracks first-party source.',
            ' * node_modules are excluded so the number tracks first-party source. Only existing files inside\n * the repository are counted, and a Set removes duplicate compiler output or package-manager chatter.',
          );

          const chunksPath = 'apps/web/config/vite-manual-chunks.ts';
          const chunkLines = read(chunksPath).split('\n');
          const callbackStart = chunkLines.findIndex((line) => line.includes('return (id: string): string | undefined => {'));
          const callbackEnd = chunkLines.findIndex((line, index) => index > callbackStart && line === '  };');
          if (callbackStart < 0 || callbackEnd < 0) {
            throw new Error(`${chunksPath}: manual chunk callback boundaries not found`);
          }
          for (let index = callbackStart + 1; index < callbackEnd; index += 1) {
            if (chunkLines[index].startsWith('        ')) chunkLines[index] = chunkLines[index].slice(8);
          }
          write(chunksPath, chunkLines.join('\n'));

          replaceExact('api/og.js', '\n\n\nfunction handleMarketLanding', '\n\nfunction handleMarketLanding');
          replaceExact('api/og.js', '\n\n\nfunction buildTitleStructuredData', '\n\nfunction buildTitleStructuredData');
          dedentOverIndentedFunction('api/og.js', 'function handleMarketLanding', 'const MARKET_RESOURCE_ID_RE');
          dedentOverIndentedFunction('api/og.js', 'async function handleMarketResource', 'async function fetchTitle');
          dedentOverIndentedFunction('api/og.js', 'function buildTitleStructuredData', 'async function handleTitleRequest');
          replaceExact(
            'api/og.js',
            'const MARKET_RESOURCE_ID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}(?![\\s\\S])/iu;',
            'const MARKET_RESOURCE_ID_RE =\n  /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}(?![\\s\\S])/iu;',
          );
          replaceExact('api/og.js', '  return handleTitleRequest(res, { host, proto, slug });\n\n}', '  return handleTitleRequest(res, { host, proto, slug });\n}');
          NODE

          cat > ARCHITECTURE.md <<'EOF'
          # 아키텍처 개요

          ## 저장소 운영 모델

          - 루트 `package.json`은 Vite·React 프런트엔드의 단일 툴체인 소유자입니다. `apps/web`은 별도 pnpm 패키지가 아니라 이 루트 패키지가 사용하는 브라우저 소스 루트입니다.
          - `apps/api`는 독립된 NestJS workspace package입니다. HTTP, WebSocket, DB, 영속성, 외부 서비스 연동은 서버 전용으로 유지합니다.
          - `packages`에는 브라우저와 서버가 함께 사용할 수 있는 런타임 중립 계약·순수 모델·Studio 엔진만 둡니다.
          - `api`에는 Vercel 진입점용 얇은 어댑터만 두고 실제 서버 구현은 `apps/api`에 둡니다.
          - 루트에는 모노레포·빌드·배포 설정, 횡단 검증, 문서와 운영 자동화를 둡니다. 제품 브라우저 코드는 루트에 두지 않습니다.

          `@/*`는 `apps/web/*`, `@/shared/*`는 `apps/web/src/shared/*`를 가리킵니다. 백엔드는 웹 앱을 import하지 않으며, 생성된 QA 결과는 CI artifact로만 보관합니다.

          ## 디렉터리 책임

          ```text
          apps/web/                         # 루트 package.json이 구동하는 브라우저 애플리케이션
            config/                         # Vite 전용 빌드 정책과 수동 청크 규칙
            index.html                      # 유일한 프로덕션 HTML 진입점
            public/                         # 그대로 배포되는 정적 자산
            src/
              app/                          # 부트스트랩, 라우팅, 서비스 워커, 앱 셸
              domains/                      # 제품 도메인별 UI·유스케이스·모델·어댑터
                creator/                    # Studio와 창작 도구
                catalog/                    # 카탈로그·검색·랭킹
                community/                  # 커뮤니티·리뷰
                auth/                       # 인증 UI와 세션 오케스트레이션
              shared/                       # 도메인·인프라에 의존하지 않는 횡단 코드
                components/                 # 범용 UI primitive와 공용 제품 UI
                lib/                        # 공용 계약·유틸리티·브라우저 안전 런타임
                catalog/                    # 정적 카탈로그 런타임
              components/                   # 앱 셸·오류·브라우저 호환 컴포넌트
              hooks/                        # 웹 공용 훅
              infrastructure/               # API·클라우드 저장소 클라이언트
              styles/                       # 전역 스타일
              types/                        # 브라우저 공용 타입과 외부 모듈 shim
            tests/browser-fixtures/         # Vite가 직접 제공하는 브라우저 fixture
            tools/browser-harnesses/        # 프로덕션 엔트리와 분리된 수동/E2E 하네스
          apps/api/                         # 서버 전용 NestJS workspace package
            src/modules/                    # 기능 모듈과 HTTP 경계
            src/infrastructure/             # DB·외부 서비스 어댑터
            src/db/                         # 스키마·마이그레이션·시드
            src/server/                     # 서버 전용 유스케이스와 정책
          packages/                         # 웹/API 공용 런타임 중립 계약·엔진
          api/                              # Vercel 진입점용 얇은 어댑터
          scripts/, tools/, e2e/, tests/    # 저장소 횡단 도구와 검증 코드
          ```

          브라우저 fixture와 하네스는 Vite의 `root: apps/web` 아래에서 URL로 제공되므로 `apps/web/tests`와 `apps/web/tools`가 canonical 위치입니다. 같은 파일을 루트 `tests`나 `tools`에 복제하지 않습니다.

          ## 의존성 경계

          ESLint boundary gate가 다음 규칙을 실행합니다.

          - `app`은 조립 지점으로서 `app`, `domains`, `shared`, `infrastructure`를 사용할 수 있습니다.
          - `domains`는 제품 기능을 소유하며 `domains`, `shared`, `infrastructure`를 사용할 수 있습니다.
          - `infrastructure`는 `shared`와 다른 infrastructure만 사용할 수 있습니다.
          - `shared`와 `types`는 도메인·앱·인프라에 역으로 의존할 수 없습니다.

          레거시 결합 때문에 필요한 제한적 예외는 파일 단위로 명시하고, `eslint.legacy-exceptions.json`과 테스트를 통해 수가 늘지 않도록 관리합니다. 새 도메인 코드는 `apps/web/src/domains/<domain>`에, 도메인 간 계약과 브라우저 안전 유틸리티는 `apps/web/src/shared`에 둡니다. 웹과 API가 함께 써야 하는 계약은 Node·DOM API에 의존하지 않게 만든 뒤 `packages/*`에서 공개합니다.

          ## 검증과 생성물 정책

          `pnpm run validate:architecture`는 canonical 엔트리, 필수 문서·스크립트, 워크플로 경로, 레거시 루트 디렉터리 재등장과 중복 하네스를 검사합니다. 기본 CI의 lint job은 CSP 원본 검증과 테스트·타입 입력 수 래칫(`verify:toolchain-coverage`)까지 실행하므로 경로 이동이 검증 범위를 조용히 줄일 수 없습니다.

          `dist`, `coverage`, `qa-results`, Playwright screenshot과 임시 진단 파일은 소스가 아닙니다. 재현 가능한 명령이나 Actions artifact로 생성하고 Git에는 커밋하지 않습니다.
          EOF
          sed -i 's/^          //' ARCHITECTURE.md

      - name: Refresh deterministic toolchain floors
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-toolchain-coverage.mjs --update
          node scripts/verify-toolchain-coverage.mjs
          node scripts/verify-toolchain-coverage.mjs

      - name: Validate architecture, code quality, types, and production bundle
        shell: bash
        run: |
          set -euo pipefail
          pnpm run validate:architecture
          pnpm run verify:csp
          node --check api/og.js
          pnpm run lint
          pnpm run typecheck
          pnpm run build
          pnpm run check:studio-bundle
          git diff --check

          tracked_junk=$(git ls-files 'dist/**' 'coverage/**' 'qa-results/**' 'playwright-report/**' 'test-results/**' '*.orig' '*.rej' '.DS_Store')
          if [[ -n "$tracked_junk" ]]; then
            printf 'Tracked generated or recovery files remain:\n%s\n' "$tracked_junk" >&2
            exit 1
          fi

      - name: Commit verified cleanup and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/architecture-cleanup-finalize.yml
          git add -A
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: finalize web architecture cleanup'
          git push origin HEAD:chore/architecture-sonar-cleanup
