name: Recovery cost preflight (read only)

on:
  push:
    branches: [fix/legal-policy-failover-20260913]
    paths: [.github/workflows/recovery-cost-preflight.yml]

permissions:
  contents: read

concurrency:
  group: recovery-cost-preflight
  cancel-in-progress: false

jobs:
  usage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TELEMETRY_DISABLED: "1"
      VERCEL_CLI_VERSION: "58.9.4"
    steps:
      - name: Require existing credentials without exposing them
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "::error::Existing production VERCEL_TOKEN is unavailable; no deployment or billing change was attempted."
            exit 1
          fi
          if [[ "${VERCEL_ORG_ID:-}" != "team_dg5OVFLn94ulQlBfDX0yOHhA" ]]; then
            echo "::error::Existing VERCEL_ORG_ID does not match the authorized ToonStudio team."
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install the existing pinned CLI (no checkout, cache or artifacts)
        run: npm install --global --no-audit --no-fund "vercel@${VERCEL_CLI_VERSION}"
      - name: Read current billing usage (no deploy, build, or app request)
        shell: bash
        run: |
          set -euo pipefail
          vercel usage --scope blue45fs-projects --format json --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/toonstudio-usage.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const usage = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/toonstudio-usage.json`, 'utf8'));
          const forbidden = /token|secret|authorization|cookie|email|address|payment|customer|invoice.?id/i;
          const redact = value => {
            if (Array.isArray(value)) return value.map(redact);
            if (value && typeof value === 'object') return Object.fromEntries(Object.entries(value).filter(([key]) => !forbidden.test(key)).map(([key, child]) => [key, redact(child)]));
            return value;
          };
          console.log('BILLING_USAGE_READ_ONLY=' + JSON.stringify(redact(usage)));
          NODE
      - name: Read plan and project build configuration (GET only)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const teamId = 'team_dg5OVFLn94ulQlBfDX0yOHhA';
          const projectId = 'prj_WLFku7V8cZG8XZTUirfG2WhpmXEQ';
          async function get(path) {
            const response = await fetch(`https://api.vercel.com${path}`, { method: 'GET', headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` }, signal: AbortSignal.timeout(15000) });
            if (!response.ok) throw new Error(`read_only_configuration_http_${response.status}`);
            return response.json();
          }
          const team = await get(`/v2/teams/${teamId}`);
          if (team.id !== teamId) throw new Error('unexpected_team');
          console.log('BILLING_PLAN_READ_ONLY=' + JSON.stringify({ plan: team.billing?.plan, status: team.billing?.status, period: team.billing?.period, currency: team.billing?.currency, planIteration: team.billing?.planIteration, buildMachine: team.resourceConfig?.buildMachine }));
          const project = await get(`/v9/projects/${projectId}?teamId=${teamId}`);
          if (project.id !== projectId || project.accountId !== teamId) throw new Error('unexpected_project');
          console.log('BUILD_CONFIGURATION_READ_ONLY=' + JSON.stringify({ projectId: project.id, resourceConfig: project.resourceConfig, buildMachineType: project.buildMachineType, enableAffectedProjectsDeployments: project.enableAffectedProjectsDeployments, gitDeploymentEnabled: project.gitDeploymentEnabled }));
          NODE
