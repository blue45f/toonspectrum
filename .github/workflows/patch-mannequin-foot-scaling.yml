name: Patch mannequin foot scaling regression

on:
  push:
    branches:
      - fix/mannequin-anatomy-scaling-main-20260910
    paths:
      - .github/workflows/patch-mannequin-foot-scaling.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/mannequin-anatomy-scaling-main-20260910
          persist-credentials: true

      - name: Correct linear foot proportions and strengthen regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          model_path = Path("apps/web/src/domains/creator/scene-3d/studio-mannequin-model.ts")
          test_path = Path("apps/web/src/domains/creator/scene-3d/studio-mannequin-model.test.ts")

          model = model_path.read_text()
          old_scale = 'scale: vec3((0.26 * hu) / footLen, ankleHeight / footLen, 1),'
          new_scale = 'scale: vec3((0.26 * hu * footScale) / footLen, (ankleHeight * footScale) / footLen, 1),'
          if model.count(old_scale) != 2:
              raise SystemExit(f"expected two foot scale formulas, found {model.count(old_scale)}")
          model = model.replace(old_scale, new_scale)

          old_doc = '/** 팔·다리 전체 굵기 배율. 0.7–1.35. */'
          new_doc = '/** 팔·다리 몸통 굵기 배율(손·발 제외). 0.7–1.35. */'
          if model.count(old_doc) != 1:
              raise SystemExit("limb thickness contract changed unexpectedly")
          model = model.replace(old_doc, new_doc)
          model_path.write_text(model)

          test = test_path.read_text()
          anchor = '''  it("체인 길이는 관절 오프셋과 정합한다", () => {'''
          if test.count(anchor) != 1:
              raise SystemExit("test insertion anchor changed unexpectedly")
          regression = '''  it("손 크기는 팔다리 굵기와 독립적이고 발 크기는 세 축에 선형 적용된다", () => {
    const base = buildStudioMannequinSpec(params());
    const thickLimbs = buildStudioMannequinSpec(params({ limbThickness: 1.25 }));
    const scaledHands = buildStudioMannequinSpec(params({ handScale: 1.2 }));
    const scaledFeet = buildStudioMannequinSpec(params({ footScale: 1.2 }));

    const originSphere = (
      spec: ReturnType<typeof buildStudioMannequinSpec>,
      jointId: string,
    ) => spec.primitives.find(
      (primitive) => primitive.kind === "sphere"
        && primitive.jointId === jointId
        && primitive.center.every((value) => value === 0),
    );
    const baseWrist = originSphere(base, "leftHand");
    const thickWrist = originSphere(thickLimbs, "leftHand");
    const scaledWrist = originSphere(scaledHands, "leftHand");
    if (
      baseWrist?.kind === "sphere"
      && thickWrist?.kind === "sphere"
      && scaledWrist?.kind === "sphere"
    ) {
      expect(thickWrist.radius).toBeCloseTo(baseWrist.radius, 12);
      expect(scaledWrist.radius).toBeCloseTo(baseWrist.radius * 1.2, 12);
    } else {
      throw new Error("left wrist primitives are missing");
    }

    const footBody = (spec: ReturnType<typeof buildStudioMannequinSpec>) =>
      spec.primitives.find(
        (primitive) => primitive.kind === "sphere"
          && primitive.jointId === "leftFoot"
          && primitive.center[1] !== 0,
      );
    const baseFoot = footBody(base);
    const scaledFoot = footBody(scaledFeet);
    if (baseFoot?.kind === "sphere" && scaledFoot?.kind === "sphere") {
      for (const axis of [0, 1, 2] as const) {
        const baseExtent = baseFoot.radius * (baseFoot.scale?.[axis] ?? 1);
        const scaledExtent = scaledFoot.radius * (scaledFoot.scale?.[axis] ?? 1);
        expect(scaledExtent).toBeCloseTo(baseExtent * 1.2, 12);
      }
    } else {
      throw new Error("left foot body primitives are missing");
    }
  });

'''
          test = test.replace(anchor, regression + anchor)
          test_path.write_text(test)
          PY

          rm .github/workflows/patch-mannequin-foot-scaling.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/domains/creator/scene-3d/studio-mannequin-model.ts \
                  apps/web/src/domains/creator/scene-3d/studio-mannequin-model.test.ts \
                  .github/workflows/patch-mannequin-foot-scaling.yml
          git commit -m "fix(mannequin): preserve linear foot proportions"
          git push origin HEAD:fix/mannequin-anatomy-scaling-main-20260910
