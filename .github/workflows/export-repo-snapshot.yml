name: Export temporary repository snapshot

on:
  push:
    branches:
      - studio-effects-workbench-20260909
    paths:
      - .github/workflows/export-repo-snapshot.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Pack checkout
        run: tar --exclude=.git -czf /tmp/toonspectrum-main.tar.gz .
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: repo-snapshot
          path: /tmp/toonspectrum-main.tar.gz
          retention-days: 1
          compression-level: 0
