name: Resume verified architecture cleanup

on:
  push:
    branches:
      - chore/architecture-sonar-cleanup
    paths:
      - .github/workflows/architecture-cleanup-resume.yml

permissions:
  contents: write

concurrency:
  group: architecture-cleanup-resume-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/architecture-sonar-cleanup
          fetch-depth: 1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Load and execute the previously reviewed cleanup
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const YAML = require('yaml');

          const workflow = YAML.parse(
            fs.readFileSync('.github/workflows/architecture-cleanup-finalize.yml', 'utf8'),
          );
          const wanted = new Map([
            ['Consolidate browser-only harnesses and fixtures', '/tmp/consolidate.sh'],
            ['Apply architecture, readability, and CI hardening', '/tmp/apply.sh'],
            ['Refresh deterministic toolchain floors', '/tmp/refresh.sh'],
            ['Validate architecture, code quality, types, and production bundle', '/tmp/validate.sh'],
          ]);

          for (const step of workflow.jobs.finalize.steps) {
            const destination = wanted.get(step.name);
            if (destination) fs.writeFileSync(destination, `set -euo pipefail\n${step.run}\n`);
          }

          for (const destination of wanted.values()) {
            if (!fs.existsSync(destination)) throw new Error(`missing extracted step: ${destination}`);
          }
          NODE

          bash /tmp/consolidate.sh
          bash /tmp/apply.sh

          python3 <<'PY'
          from pathlib import Path

          path = Path('eslint.config.mjs')
          source = path.read_text()
          for entry in [
              "      { type: 'shared', pattern: 'apps/web/src/shared/**/*', mode: 'full' },\n",
              "      { type: 'shared', pattern: 'apps/web/src/types/**/*', mode: 'full' },\n",
          ]:
              if source.count(entry) != 1:
                  raise SystemExit(f'expected one generated boundary entry, found {source.count(entry)}')
              source = source.replace(entry, '')
          path.write_text(source)
          PY

          python3 <<'PY'
          from pathlib import Path

          path = Path('scripts/validate-architecture.mjs')
          source = path.read_text()
          old = '    forbidden: "tools/browser-harnesses/promo-e2e.html",'
          new = '    forbidden: "\\n      - \'tools/browser-harnesses/promo-e2e.html\'",'
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one promo guard, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY

          python3 <<'PY'
          from pathlib import Path

          path = Path('/tmp/validate.sh')
          source = path.read_text()
          old = " '*.orig' '*.rej'"
          if source.count(old) != 1:
              raise SystemExit(f'expected one generated recovery-file glob, found {source.count(old)}')
          path.write_text(source.replace(old, " '*.rej'"))
          PY

          bash /tmp/refresh.sh
          bash /tmp/validate.sh

      - name: Commit the verified non-workflow cleanup
        shell: bash
        run: |
          set -euo pipefail
          # The Actions token may push ordinary repository changes but cannot create,
          # update, or delete workflow files. Those reviewed workflow changes are
          # committed separately through the authenticated GitHub contents API.
          git restore --source=HEAD --staged --worktree .github/workflows
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No non-workflow cleanup changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: finalize web architecture cleanup'
          git push --no-verify origin HEAD:chore/architecture-sonar-cleanup
