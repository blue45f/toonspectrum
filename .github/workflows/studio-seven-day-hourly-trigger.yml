name: Studio API-free campaign coordinator
run-name: Studio API-free coordinator · ${{ github.run_number }}

on:
  schedule:
    # Connected ChatGPT/Codex sessions author code. This twice-hourly run audits and recovers CI.
    - cron: "2,32 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: studio-api-free-campaign-coordinator
  cancel-in-progress: true

jobs:
  audit-and-reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      CAMPAIGN_DIR: ${{ runner.temp }}/studio-api-free-campaign
      GATE_DISPATCHER_WORKFLOW: studio-campaign-gate-dispatcher.yml
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate API-free campaign contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/studio-seven-day-campaign.test.mjs
          node --test scripts/studio-autonomous-change-plan.test.mjs
          node --test scripts/studio-campaign-patch-policy.test.mjs
          node --test scripts/validate-studio-competitor-registry.test.mjs
          node --test scripts/studio-competitor-watch.test.mjs
          node --test scripts/studio-emerging-product-watch.test.mjs
          node --test scripts/studio-research-watch.test.mjs
          node --test scripts/validate-studio-third-party-reuse.test.mjs
          node scripts/validate-studio-competitor-registry.mjs
          node scripts/validate-studio-third-party-reuse.mjs

      - name: Resolve the configured campaign window
        id: window
        shell: bash
        run: |
          set -euo pipefail
          config='docs/automation/studio-seven-day-campaign.json'
          start_at="$(jq -r '.startAt' "$config")"
          end_at="$(jq -r '.endAt' "$config")"
          now_epoch="$(date -u +%s)"
          start_epoch="$(date -u -d "$start_at" +%s)"
          end_epoch="$(date -u -d "$end_at" +%s)"
          active=false
          if [[ "$now_epoch" -ge "$start_epoch" && "$now_epoch" -lt "$end_epoch" ]]; then
            active=true
          fi
          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "start_at=$start_at" >> "$GITHUB_OUTPUT"
          echo "end_at=$end_at" >> "$GITHUB_OUTPUT"

      - name: Record the thirty-lane backlog state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CAMPAIGN_DIR"
          jq '{
            campaignId,
            startAt,
            endAt,
            laneCount: (.lanes | length),
            lanes: [.lanes[] | {
              id,
              title,
              issueQueue,
              fallbackTracks,
              focusTerms,
              pathHints
            }]
          }' docs/automation/studio-seven-day-campaign.json \
            > "$CAMPAIGN_DIR/lane-backlog.json"
          cp docs/automation/studio-api-free-runtime.json \
            "$CAMPAIGN_DIR/runtime.json"

      - name: Refresh official product and research signals
        if: ${{ steps.window.outputs.active == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/studio-competitor-watch.mjs \
            --all \
            --concurrency 4 \
            --timeout-ms 15000 \
            --output "$CAMPAIGN_DIR/mature-products.json" \
            --markdown "$CAMPAIGN_DIR/mature-products.md"
          node scripts/studio-emerging-product-watch.mjs \
            --concurrency 4 \
            --timeout-ms 15000 \
            --output "$CAMPAIGN_DIR/emerging-products.json" \
            --markdown "$CAMPAIGN_DIR/emerging-products.md"
          node scripts/studio-research-watch.mjs \
            --concurrency 4 \
            --timeout-ms 20000 \
            --output "$CAMPAIGN_DIR/research.json" \
            --markdown "$CAMPAIGN_DIR/research.md"

      - name: Materialize inactive-window reports
        if: ${{ steps.window.outputs.active != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"results":[],"aggregateHash":"inactive"}' \
            > "$CAMPAIGN_DIR/mature-products.json"
          printf '%s\n' '{"results":[],"aggregateHash":"inactive"}' \
            > "$CAMPAIGN_DIR/emerging-products.json"
          printf '%s\n' '{"entries":[],"queryReports":[],"aggregateHash":"inactive"}' \
            > "$CAMPAIGN_DIR/research.json"

      - name: Reconcile release gates for open campaign pull requests
        shell: bash
        run: |
          set -euo pipefail
          jq -n '{ref: "main"}' \
            | gh api \
                --method POST \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "repos/${REPOSITORY}/actions/workflows/${GATE_DISPATCHER_WORKFLOW}/dispatches" \
                --input -

      - name: Publish API-free coordinator summary
        shell: bash
        env:
          WINDOW_ACTIVE: ${{ steps.window.outputs.active }}
          START_AT: ${{ steps.window.outputs.start_at }}
          END_AT: ${{ steps.window.outputs.end_at }}
        run: |
          {
            echo "## Studio API-free campaign"
            echo
            echo "- Connected-session code authoring: enabled"
            echo "- GitHub-hosted AI authoring: disabled"
            echo "- OPENAI_API_KEY required: no"
            echo "- Logical implementation lanes: 30"
            echo "- Campaign window active: ${WINDOW_ACTIVE}"
            echo "- Window: ${START_AT} .. ${END_AT}"
            echo "- Automated responsibilities: research audit, CI reconciliation, safe merge, deployment, branch cleanup"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: studio-api-free-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/studio-api-free-campaign/
          retention-days: 21
          if-no-files-found: error
