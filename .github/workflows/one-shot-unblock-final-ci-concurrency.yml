name: One-shot unblock final CI concurrency

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-unblock-final-ci-concurrency.yml

permissions:
  contents: write

jobs:
  unblock:
    if: github.event.pull_request.head.ref == 'release/main-final-924176-immutable-20260908' && github.actor != 'github-actions[bot]'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/main-final-924176-immutable-20260908
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/ci.yml
            .github/workflows/one-shot-unblock-final-ci-concurrency.yml
      - name: Isolate the final protected CI run from stale queued gates
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()
          matches = [index for index, line in enumerate(lines) if line.startswith('  group: ')]
          if len(matches) != 1:
              raise SystemExit(f'expected one CI concurrency group, found {len(matches)}')
          index = matches[0]
          if '-release-final-g2' in lines[index]:
              raise SystemExit('final CI concurrency suffix already present')
          lines[index] = lines[index] + '-release-final-g2'
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          grep -F -- '-release-final-g2' .github/workflows/ci.yml
          git diff --check
      - name: Commit the concurrency repair and retire this workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-unblock-final-ci-concurrency.yml
          git add .github/workflows/ci.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ci): isolate final protected run from stale queued gates'
          git push origin HEAD:release/main-final-924176-immutable-20260908
