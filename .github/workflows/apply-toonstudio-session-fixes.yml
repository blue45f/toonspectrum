name: Apply ToonStudio session fixes once

on:
  push:
    branches:
      - feat/toonstudio-session-complete-20260911-1221
    paths:
      - .github/workflows/apply-toonstudio-session-fixes.yml

permissions:
  contents: write

concurrency:
  group: apply-toonstudio-session-fixes
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout dedicated branch
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-session-complete-20260911-1221
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply deterministic source fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          typed_freezes = {
              "apps/web/src/domains/creator/studio-archive-manifest.test.ts": [
                  ("const MANIFEST: StudioArchiveManifest = Object.freeze({", "const MANIFEST: StudioArchiveManifest = Object.freeze<StudioArchiveManifest>({"),
              ],
              "apps/web/src/domains/creator/studio-asset-passport.test.ts": [
                  ("const BASE_BRUSH_QUALITY: StudioBrushQuality = Object.freeze({", "const BASE_BRUSH_QUALITY: StudioBrushQuality = Object.freeze<StudioBrushQuality>({"),
                  ("const BASE_PASSPORT: StudioAssetPassport = Object.freeze({", "const BASE_PASSPORT: StudioAssetPassport = Object.freeze<StudioAssetPassport>({"),
                  ("const BASE_CONTEXT: StudioAssetUsageContext = Object.freeze({", "const BASE_CONTEXT: StudioAssetUsageContext = Object.freeze<StudioAssetUsageContext>({"),
              ],
              "apps/web/src/domains/creator/studio-asset-provider.test.ts": [
                  ("const PROVIDER: StudioAssetProviderDefinition = Object.freeze({", "const PROVIDER: StudioAssetProviderDefinition = Object.freeze<StudioAssetProviderDefinition>({"),
                  ("const ENTITLEMENT: StudioAssetEntitlement = Object.freeze({", "const ENTITLEMENT: StudioAssetEntitlement = Object.freeze<StudioAssetEntitlement>({"),
              ],
              "apps/web/src/domains/creator/studio-automation-recipe.test.ts": [
                  ("const RECIPE: StudioAutomationRecipe = Object.freeze({", "const RECIPE: StudioAutomationRecipe = Object.freeze<StudioAutomationRecipe>({"),
              ],
              "apps/web/src/domains/creator/studio-font-audit.test.ts": [
                  ("const FONT: StudioFontManifest = Object.freeze({", "const FONT: StudioFontManifest = Object.freeze<StudioFontManifest>({"),
              ],
              "apps/web/src/domains/creator/studio-marketplace-submission.test.ts": [
                  ("const SUBMISSION: StudioMarketplaceSubmission = Object.freeze({", "const SUBMISSION: StudioMarketplaceSubmission = Object.freeze<StudioMarketplaceSubmission>({"),
              ],
              "apps/web/src/domains/creator/studio-plugin-registry.test.ts": [
                  ("const PLUGIN: StudioPluginManifest = Object.freeze({", "const PLUGIN: StudioPluginManifest = Object.freeze<StudioPluginManifest>({"),
              ],
              "apps/web/src/domains/creator/studio-project-readiness-store.test.ts": [
                  ("const SNAPSHOT: StudioProjectReadinessSnapshot = Object.freeze({", "const SNAPSHOT: StudioProjectReadinessSnapshot = Object.freeze<StudioProjectReadinessSnapshot>({"),
              ],
              "apps/web/src/domains/creator/studio-project-readiness.test.ts": [
                  ("const CONTINUITY: StudioContinuityReport = Object.freeze({", "const CONTINUITY: StudioContinuityReport = Object.freeze<StudioContinuityReport>({"),
                  ("const PRODUCTION: StudioProductionPipelineReport = Object.freeze({", "const PRODUCTION: StudioProductionPipelineReport = Object.freeze<StudioProductionPipelineReport>({"),
                  ("const REVIEW: StudioReviewReadiness = Object.freeze({", "const REVIEW: StudioReviewReadiness = Object.freeze<StudioReviewReadiness>({"),
                  ("const EXPORT: StudioExportPreflightResult = Object.freeze({", "const EXPORT: StudioExportPreflightResult = Object.freeze<StudioExportPreflightResult>({"),
              ],
              "apps/web/src/domains/creator/studio-publishing-connector.test.ts": [
                  ("const CONNECTOR: StudioPublishConnector = Object.freeze({", "const CONNECTOR: StudioPublishConnector = Object.freeze<StudioPublishConnector>({"),
                  ("const PREFLIGHT: StudioExportPreflightResult = Object.freeze({", "const PREFLIGHT: StudioExportPreflightResult = Object.freeze<StudioExportPreflightResult>({"),
                  ("const REQUEST: StudioPublishRequest = Object.freeze({", "const REQUEST: StudioPublishRequest = Object.freeze<StudioPublishRequest>({"),
              ],
              "apps/web/src/domains/creator/studio-publishing-package.test.ts": [
                  ("const PREFLIGHT: StudioExportPreflightResult = Object.freeze({", "const PREFLIGHT: StudioExportPreflightResult = Object.freeze<StudioExportPreflightResult>({"),
                  ("const RIGHTS: StudioRightsAuditReport = Object.freeze({", "const RIGHTS: StudioRightsAuditReport = Object.freeze<StudioRightsAuditReport>({"),
              ],
              "apps/web/src/domains/creator/studio-rights-graph.test.ts": [
                  ("const GRAPH: StudioRightsGraph = Object.freeze({", "const GRAPH: StudioRightsGraph = Object.freeze<StudioRightsGraph>({"),
              ],
              "apps/web/src/domains/creator/studio-series-kit.test.ts": [
                  ("const KIT: StudioSeriesKit = Object.freeze({", "const KIT: StudioSeriesKit = Object.freeze<StudioSeriesKit>({"),
              ],
              "apps/web/src/domains/creator/studio-template-system.test.ts": [
                  ("const TEMPLATE: StudioTemplateDefinition = Object.freeze({", "const TEMPLATE: StudioTemplateDefinition = Object.freeze<StudioTemplateDefinition>({"),
              ],
              "apps/web/src/domains/creator/studio-shell/StudioProjectReadinessPanel.test.tsx": [
                  ("const SNAPSHOT: StudioProjectReadinessSnapshot = Object.freeze({", "const SNAPSHOT: StudioProjectReadinessSnapshot = Object.freeze<StudioProjectReadinessSnapshot>({"),
              ],
          }
          for path, replacements in typed_freezes.items():
              for old, new in replacements:
                  replace_once(path, old, new)

          replace_once(
              "apps/web/src/domains/creator/studio-project-diagnostic-source-store.ts",
              "return Object.freeze(plainClone(value) as StudioProjectDiagnosticSource);",
              "return Object.freeze(plainClone(value) as unknown as StudioProjectDiagnosticSource);",
          )
          replace_once(
              "apps/web/src/domains/creator/studio-project-feature-adapters.ts",
              '''import type {\n  StudioDiagnosticAssetStatus,\n  StudioProjectDiagnosticAsset,\n  StudioProjectDiagnosticSourceStorage,\n} from "./studio-project-diagnostics";''',
              '''import type {\n  StudioDiagnosticAssetStatus,\n  StudioProjectDiagnosticAsset,\n} from "./studio-project-diagnostics";\nimport type { StudioProjectDiagnosticSourceStorage } from "./studio-project-diagnostic-source-store";''',
          )

          path = "apps/web/src/domains/creator/studio-shell/StudioAssetHubPage.test.tsx"
          replace_once(path, '''expect(screen.getByRole("link", { name: /마켓에서 찾기/u })).toHaveAttribute(\n      "href",\n      "/studio/assets?project=project-12&view=market",\n    );''', '''expect(screen.getByRole("link", { name: /마켓에서 찾기/u }).getAttribute("href"))\n      .toBe("/studio/assets?project=project-12&view=market");''')
          replace_once(path, 'expect(screen.getByRole("link", { name: /내 에셋/u })).toHaveAttribute("aria-current", "page");', 'expect(screen.getByRole("link", { name: /내 에셋/u }).getAttribute("aria-current"))\n      .toBe("page");')
          replace_once(path, '''expect(screen.getByRole("link", { name: "Series Kit" })).toHaveAttribute(\n      "href",\n      "/studio/assets?project=project-12&view=series-kit",\n    );''', '''expect(screen.getByRole("link", { name: "Series Kit" }).getAttribute("href"))\n      .toBe("/studio/assets?project=project-12&view=series-kit");''')
          replace_once(path, 'expect(screen.getByRole("link", { name: /에셋 홈/u })).toHaveAttribute("href", "/studio/assets");', 'expect(screen.getByRole("link", { name: /에셋 홈/u }).getAttribute("href"))\n      .toBe("/studio/assets");')

          path = "apps/web/src/domains/creator/studio-shell/StudioProjectAssistantPanel.test.tsx"
          replace_once(path, 'expect(screen.getByLabelText("location")).toHaveTextContent("/studio/work/project-12/comic");', 'expect(screen.getByLabelText("location").textContent).toContain("/studio/work/project-12/comic");')
          replace_once(path, 'expect(screen.getByRole("alert")).toHaveTextContent("요청할 내용을 입력");', 'expect(screen.getByRole("alert").textContent).toContain("요청할 내용을 입력");')
          replace_once(path, 'expect(screen.getByLabelText("location")).toHaveTextContent("/studio/p/project-12/production");', 'expect(screen.getByLabelText("location").textContent).toContain("/studio/p/project-12/production");')

          path = "apps/web/src/domains/creator/studio-shell/StudioProjectFeatureSuitePanel.test.tsx"
          replace_once(path, 'expect(await screen.findByText("새로운 장면을 발견한다")).toBeInTheDocument();', 'expect(await screen.findByText("새로운 장면을 발견한다")).toBeTruthy();')
          replace_once(path, 'expect(screen.getByRole("heading", { name: "대사와 장면 타이밍 연결" })).toBeInTheDocument();', 'expect(screen.getByRole("heading", { name: "대사와 장면 타이밍 연결" })).toBeTruthy();')
          replace_once(path, 'expect(screen.getByRole("button", { name: "color" })).toBeInTheDocument();', 'expect(screen.getByRole("button", { name: "color" })).toBeTruthy();')
          replace_once(path, 'expect(screen.getByLabelText("대표 대사")).toBeInTheDocument();', 'expect(screen.getByLabelText("대표 대사")).toBeTruthy();')
          replace_once(path, 'expect(screen.getByRole("button", { name: "허용 취소" })).toBeInTheDocument();', 'expect(screen.getByRole("button", { name: "허용 취소" })).toBeTruthy();')

          path = "apps/web/src/domains/creator/studio-shell/StudioReviewPanel.test.tsx"
          replace_once(path, 'expect(screen.getByRole("button", { name: "승인" })).toBeEnabled();', 'expect((screen.getByRole("button", { name: "승인" }) as HTMLButtonElement).disabled).toBe(false);')
          replace_once(path, 'expect(screen.getByRole("button", { name: "승인" })).toBeDisabled();', 'expect((screen.getByRole("button", { name: "승인" }) as HTMLButtonElement).disabled).toBe(true);')

          panel = "apps/web/src/domains/creator/studio-shell/StudioProjectFeatureSuitePanel.tsx"
          replace_once(panel, "  Activity,\n", "")
          replace_once(panel, '} from "lucide-react";\nimport { useMemo, useState } from "react";', '} from "lucide-react";\nimport type { LucideIcon } from "lucide-react";\nimport { useMemo, useState, type ReactNode } from "react";')
          replace_once(panel, "  readonly icon: typeof Activity;", "  readonly icon: LucideIcon;")
          replace_once(panel, "  readonly children: React.ReactNode;", "  readonly children: ReactNode;")
          replace_once(panel, '''  const suite = useStudioProjectFeatureSuite(projectId, locale);\n  const report = useMemo(\n    () => suite.state ? safeResult(() => aggregateStudioAnalytics(suite.state.analyticsEvents)) : null,\n    [suite.state],\n  );''', '''  const suite = useStudioProjectFeatureSuite(projectId, locale);\n  const state = suite.state;\n  const report = useMemo(\n    () => state ? safeResult(() => aggregateStudioAnalytics(state.analyticsEvents)) : null,\n    [state],\n  );''')
          replace_once(panel, "  if (!suite.state) {", "  if (!state) {")
          replace_once(panel, '''  const suite = useStudioProjectFeatureSuite(projectId, locale);\n  const workspace = useStudioProjectWorkspace(projectId, locale);\n  const [kind, setKind] = useState<StudioStoryBeatKind>("dialogue");''', '''  const suite = useStudioProjectFeatureSuite(projectId, locale);\n  const workspace = useStudioProjectWorkspace(projectId, locale);\n  const state = suite.state;\n  const workspaceState = workspace.state;\n  const [kind, setKind] = useState<StudioStoryBeatKind>("dialogue");''')
          replace_once(panel, '''  const storyboard = useMemo(\n    () => suite.state ? safeResult(() => planStudioStoryboard(suite.state.storyBeats)) : null,\n    [suite.state],\n  );\n  const continuity = useMemo(() => workspace.state\n    ? safeResult(() => analyzeStudioStoryContinuity(\n      workspace.state.story.bible,\n      workspace.state.story.states,\n      workspace.state.story.transitions,\n    ))\n    : null, [workspace.state]);''', '''  const storyboard = useMemo(\n    () => state ? safeResult(() => planStudioStoryboard(state.storyBeats)) : null,\n    [state],\n  );\n  const continuity = useMemo(() => workspaceState\n    ? safeResult(() => analyzeStudioStoryContinuity(\n      workspaceState.story.bible,\n      workspaceState.story.states,\n      workspaceState.story.transitions,\n    ))\n    : null, [workspaceState]);''')
          replace_once(panel, "  if (!suite.state) return null;\n  const showPlanner", "  if (!state) return null;\n  const showPlanner")
          replace_once(panel, "suite.state.storyBeats.map", "state.storyBeats.map")
          replace_once(panel, "disabled={suite.state!.storyBeats.length <= 1}", "disabled={state.storyBeats.length <= 1}")
          replace_once(panel, "workspace.state?.story.bible.characters.length", "workspaceState?.story.bible.characters.length")
          replace_once(panel, "workspace.state?.story.bible.locations.length", "workspaceState?.story.bible.locations.length")
          replace_once(panel, "workspace.state?.story.bible.facts.length", "workspaceState?.story.bible.facts.length")
          replace_once(panel, '''  const workspace = useStudioProjectWorkspace(projectId, locale);\n  const report = useMemo(\n    () => workspace.state ? safeResult(() => analyzeStudioProductionPipeline(workspace.state.productionTasks)) : null,\n    [workspace.state],\n  );''', '''  const workspace = useStudioProjectWorkspace(projectId, locale);\n  const workspaceState = workspace.state;\n  const report = useMemo(\n    () => workspaceState ? safeResult(() => analyzeStudioProductionPipeline(workspaceState.productionTasks)) : null,\n    [workspaceState],\n  );''')
          replace_once(panel, "  if (!workspace.state || !report) return null;", "  if (!workspaceState || !report) return null;")
          replace_once(panel, "workspace.state.productionTasks.map", "workspaceState.productionTasks.map")
          replace_once(panel, '''  const suite = useStudioProjectFeatureSuite(projectId, locale);\n  const report = useMemo(\n    () => suite.state ? safeResult(() => analyzeStudioWebtoonQuality(suite.state.quality)) : null,\n    [suite.state],\n  );\n  if (!suite.state || !report) return null;''', '''  const suite = useStudioProjectFeatureSuite(projectId, locale);\n  const state = suite.state;\n  const report = useMemo(\n    () => state ? safeResult(() => analyzeStudioWebtoonQuality(state.quality)) : null,\n    [state],\n  );\n  if (!state || !report) return null;''')
          replace_once(panel, "suite.state.quality.balloons.map", "state.quality.balloons.map")
          replace_once(panel, '''function RenderAndMotionPanel({ projectId, locale }: { readonly projectId: string; readonly locale: Locale }) {\n  const suite = useStudioProjectFeatureSuite(projectId, locale);\n  const renderPlan = useMemo(\n    () => suite.state ? safeResult(() => planStudioWebtoon3dRender(suite.state.render3d.scene, suite.state.render3d.request)) : null,\n    [suite.state],\n  );\n  const voicePlan = useMemo(() => suite.state\n    ? safeResult(() => planStudioVoiceRegeneration({\n      profiles: suite.state.voiceMotion.profiles,\n      lines: suite.state.voiceMotion.lines,\n      existingSegments: suite.state.voiceMotion.segments,\n      commercialUse: true,\n      now: new Date().toISOString(),\n    }))\n    : null, [suite.state]);\n  const schedule = useMemo(\n    () => suite.state ? safeResult(() => buildStudioMotionSchedule(suite.state.voiceMotion.cues)) : null,\n    [suite.state],\n  );\n  if (!suite.state || !renderPlan || !voicePlan || !schedule) return null;''', '''function RenderAndMotionPanel({ projectId, locale }: { readonly projectId: string; readonly locale: Locale }) {\n  const suite = useStudioProjectFeatureSuite(projectId, locale);\n  const state = suite.state;\n  const renderPlan = useMemo(\n    () => state ? safeResult(() => planStudioWebtoon3dRender(state.render3d.scene, state.render3d.request)) : null,\n    [state],\n  );\n  const voicePlan = useMemo(() => state\n    ? safeResult(() => planStudioVoiceRegeneration({\n      profiles: state.voiceMotion.profiles,\n      lines: state.voiceMotion.lines,\n      existingSegments: state.voiceMotion.segments,\n      commercialUse: true,\n      now: new Date().toISOString(),\n    }))\n    : null, [state]);\n  const schedule = useMemo(\n    () => state ? safeResult(() => buildStudioMotionSchedule(state.voiceMotion.cues)) : null,\n    [state],\n  );\n  if (!state || !renderPlan || !voicePlan || !schedule) return null;''')
          replace_once(panel, "suite.state!.render3d.request.passes.includes(pass)", "state.render3d.request.passes.includes(pass)")
          replace_once(panel, "suite.state.voiceMotion.lines[0]?.text", "state.voiceMotion.lines[0]?.text")
          replace_once(panel, '''function DesignTemplatePanel({ projectId, locale }: { readonly projectId: string; readonly locale: Locale }) {\n  const suite = useStudioProjectFeatureSuite(projectId, locale);\n  const templatePlan = useMemo(\n    () => suite.state ? safeResult(() => planStudioTemplateApplication(suite.state.design.template, suite.state.design.values)) : null,\n    [suite.state],\n  );\n  const presentation = useMemo(\n    () => suite.state ? safeResult(() => auditStudioPresentation(suite.state.design.slides)) : null,\n    [suite.state],\n  );\n  if (!suite.state || !templatePlan || !presentation) return null;\n  const titleValue = suite.state.design.values.title;''', '''function DesignTemplatePanel({ projectId, locale }: { readonly projectId: string; readonly locale: Locale }) {\n  const suite = useStudioProjectFeatureSuite(projectId, locale);\n  const state = suite.state;\n  const templatePlan = useMemo(\n    () => state ? safeResult(() => planStudioTemplateApplication(state.design.template, state.design.values)) : null,\n    [state],\n  );\n  const presentation = useMemo(\n    () => state ? safeResult(() => auditStudioPresentation(state.design.slides)) : null,\n    [state],\n  );\n  if (!state || !templatePlan || !presentation) return null;\n  const titleValue = state.design.values.title;''')
          replace_once(panel, '''function AutomationPanel({ projectId, locale }: { readonly projectId: string; readonly locale: Locale }) {\n  const suite = useStudioProjectFeatureSuite(projectId, locale);\n  const plan = useMemo(() => suite.state\n    ? safeResult(() => planStudioAutomationRecipe(\n      suite.state.automation.recipe,\n      suite.state.automation.recipe.steps.map((step) => step.commandId),\n      suite.state.automation.context,\n    ))\n    : null, [suite.state]);\n  if (!suite.state || !plan) return null;''', '''function AutomationPanel({ projectId, locale }: { readonly projectId: string; readonly locale: Locale }) {\n  const suite = useStudioProjectFeatureSuite(projectId, locale);\n  const state = suite.state;\n  const plan = useMemo(() => state\n    ? safeResult(() => planStudioAutomationRecipe(\n      state.automation.recipe,\n      state.automation.recipe.steps.map((step) => step.commandId),\n      state.automation.context,\n    ))\n    : null, [state]);\n  if (!state || !plan) return null;''')
          replace_once(panel, "suite.state.automation.recipe.name", "state.automation.recipe.name")
          replace_once(panel, "suite.state.automation.recipe.steps.length", "state.automation.recipe.steps.length")
          replace_once(panel, "suite.state!.automation.recipe.steps.find", "state.automation.recipe.steps.find")
          PY

      - name: Verify source formatting
        run: git diff --check

      - name: Typecheck
        run: pnpm exec tsc -p tsconfig.json --noEmit --pretty false

      - name: Lint changed sources
        run: >-
          pnpm exec eslint --max-warnings=0
          apps/web/src/domains/creator/studio-project-diagnostic-source-store.ts
          apps/web/src/domains/creator/studio-project-feature-adapters.ts
          apps/web/src/domains/creator/studio-shell/StudioAssetHubPage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectAssistantPanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectFeatureSuitePanel.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectFeatureSuitePanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioReviewPanel.test.tsx

      - name: Run focused tests
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/studio-archive-manifest.test.ts
          apps/web/src/domains/creator/studio-asset-passport.test.ts
          apps/web/src/domains/creator/studio-asset-provider.test.ts
          apps/web/src/domains/creator/studio-automation-recipe.test.ts
          apps/web/src/domains/creator/studio-font-audit.test.ts
          apps/web/src/domains/creator/studio-marketplace-submission.test.ts
          apps/web/src/domains/creator/studio-plugin-registry.test.ts
          apps/web/src/domains/creator/studio-project-readiness-store.test.ts
          apps/web/src/domains/creator/studio-project-readiness.test.ts
          apps/web/src/domains/creator/studio-publishing-connector.test.ts
          apps/web/src/domains/creator/studio-publishing-package.test.ts
          apps/web/src/domains/creator/studio-rights-graph.test.ts
          apps/web/src/domains/creator/studio-series-kit.test.ts
          apps/web/src/domains/creator/studio-template-system.test.ts
          apps/web/src/domains/creator/studio-shell/StudioAssetHubPage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectAssistantPanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectFeatureSuitePanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectReadinessPanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioReviewPanel.test.tsx
          --pool=forks --maxWorkers=2

      - name: Commit verified fixes and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/apply-toonstudio-session-fixes.yml
          git config user.name "toonstudio-integration-bot"
          git config user.email "toonstudio-integration-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(studio): stabilize integrated feature type contracts"
          git push origin HEAD:feat/toonstudio-session-complete-20260911-1221
