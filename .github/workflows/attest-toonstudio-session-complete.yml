name: Attest ToonStudio session completion

on:
  push:
    branches:
      - feat/toonstudio-session-complete-20260911-1221
    paths:
      - .github/workflows/attest-toonstudio-session-complete.yml

permissions:
  contents: write
  statuses: write
  pull-requests: write
  issues: write

concurrency:
  group: retry-toonstudio-session-fixes
  cancel-in-progress: false

jobs:
  attest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout latest completion branch
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-session-complete-20260911-1221
          fetch-depth: 0

      - name: Require verified completion marker
        run: test -f docs/rewrite/toonstudio-session-final-verification.md

      - name: Remove every temporary session workflow
        run: |
          rm -f .github/workflows/apply-toonstudio-session-fixes.yml
          rm -f .github/workflows/apply-toonstudio-session-fixes-retry.yml
          rm -f .github/workflows/commit-toonstudio-session-fixes.yml
          rm -f .github/workflows/finalize-toonstudio-session.yml
          rm -f .github/workflows/toonstudio-session-self-heal.yml
          rm -f .github/workflows/cleanup-toonstudio-session-workflows.yml
          rm -f .github/workflows/ensure-toonstudio-session-complete.yml
          rm -f .github/workflows/attest-toonstudio-session-complete.yml
          rm -f docs/rewrite/toonstudio-session-verification-diagnostics.md
          git diff --check

      - name: Synchronize clean verified head to PR branch
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/toonstudio-final-ia-20260911
          if ! git merge-base --is-ancestor origin/feat/toonstudio-final-ia-20260911 HEAD; then
            git merge --no-edit origin/feat/toonstudio-final-ia-20260911
          fi
          git config user.name "toonstudio-integration-bot"
          git config user.email "toonstudio-integration-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "chore(studio): finalize verified session cleanup"
          fi
          git push origin HEAD:feat/toonstudio-session-complete-20260911-1221
          git push origin HEAD:feat/toonstudio-final-ia-20260911
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish attestation and PR summary
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sync.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/statuses/$SHA \
            -f state=success \
            -f context='toonstudio/session-complete' \
            -f description='Planned session scope implemented and fully verified'
          gh api repos/${{ github.repository }}/issues/1307/comments \
            -f body="ToonStudio 세션 완료 검증을 확정했습니다. 계획 범위 구현, 전체 TypeScript 검사, ESLint, 집중 회귀 테스트, 완료 계약, 프로덕션 빌드 및 임시 워크플로 정리가 완료됐습니다. 검증 커밋: \`$SHA\`."
