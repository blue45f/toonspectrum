name: Apply reviewed Studio catalogue verifier update

on:
  push:
    branches: [fix/studio-brush-filter-stability-20260906]
    paths: ['scripts/.studio-catalog-verifier.patch']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Apply exact reviewed verifier update on the feature branch only
        run: |
          test "$(git hash-object scripts/.studio-catalog-verifier.patch)" = b22499c4e66e66b8bca1a81cba597081b931afd3
          git apply --check scripts/.studio-catalog-verifier.patch
          git apply --index scripts/.studio-catalog-verifier.patch
          git rm scripts/.studio-catalog-verifier.patch .github/workflows/apply-studio-catalog-verifier.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "test(studio): drive floating brush picker and preserve per-stage evidence"
          git push origin HEAD:refs/heads/fix/studio-brush-filter-stability-20260906
          git rev-parse HEAD
