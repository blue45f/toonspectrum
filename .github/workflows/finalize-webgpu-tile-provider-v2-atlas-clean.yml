name: Finalize clean WebGPU tile provider V2 atlas

on:
  push:
    branches:
      - feat/webgpu-tile-provider-v2-atlas-clean-20260904
    paths:
      - ".github/workflows/finalize-webgpu-tile-provider-v2-atlas-clean.yml"

permissions:
  contents: write

concurrency:
  group: finalize-webgpu-tile-provider-v2-atlas-clean-20260904
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/webgpu-tile-provider-v2-atlas-clean-20260904
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Normalize clean branch workflow and imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/webgpu-tile-provider-v2-atlas.yml')
          source = workflow.read_text(encoding='utf-8')
          old = 'feat/webgpu-tile-provider-v2-atlas-20260904'
          new = 'feat/webgpu-tile-provider-v2-atlas-clean-20260904'
          if source.count(old) != 1:
              raise SystemExit(f'expected one workflow branch reference, found {source.count(old)}')
          workflow.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          pnpm exec eslint --fix \
            src/domains/creator/render/studio-engine-webgpu-tile-provider-v2-atlas.ts \
            src/domains/creator/render/studio-engine-webgpu-tile-provider-v2-atlas.test.ts
          git diff --check
      - name: Validate focused atlas contracts
        run: |
          pnpm exec eslint --max-warnings=0 \
            src/domains/creator/render/studio-engine-webgpu-tile-provider-v2-atlas.ts \
            src/domains/creator/render/studio-engine-webgpu-tile-provider-v2-atlas.test.ts
          pnpm exec vitest run \
            src/domains/creator/render/studio-engine-webgpu-tile-provider-v1.test.ts \
            src/domains/creator/render/studio-engine-webgpu-tile-provider-v2-atlas.test.ts
          pnpm exec tsc -p tsconfig.json --noEmit --incremental false
      - name: Commit validated clean candidate
        run: |
          rm -f .github/workflows/finalize-webgpu-tile-provider-v2-atlas-clean.yml
          git config user.name "toonstudio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(webgpu): finalize clean single-atlas tile provider candidate"
          git push origin HEAD:feat/webgpu-tile-provider-v2-atlas-clean-20260904
