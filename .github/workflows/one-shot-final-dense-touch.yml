name: One-shot final dense touch target

on:
  push:
    branches:
      - release/final-main-merge-4888b061-immutable-20260908
    paths:
      - .github/workflows/one-shot-final-dense-touch.yml

permissions:
  contents: write

concurrency:
  group: one-shot-final-dense-touch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/final-main-merge-4888b061-immutable-20260908
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            apps/web/src/domains/creator/studio-panel-ui.tsx
            apps/web/src/domains/creator/studio-panel-ui.desktop-touch-target.test.tsx
            .github/workflows/one-shot-final-dense-touch.yml

      - name: Apply exact source and regression contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("apps/web/src/domains/creator/studio-panel-ui.tsx")
          source = path.read_text(encoding="utf-8")
          before = '? "h-9 gap-1.5 px-2.5 text-[0.72rem] max-lg:h-11 max-lg:min-h-11 pointer-coarse:h-11 pointer-coarse:min-h-11 pointer-coarse:gap-1.5 pointer-coarse:px-3 pointer-coarse:text-[0.8125rem]"'
          after = '? "h-11 min-h-11 gap-1.5 px-2.5 text-[0.72rem] pointer-coarse:gap-1.5 pointer-coarse:px-3 pointer-coarse:text-[0.8125rem]"'
          if after not in source:
              if source.count(before) != 1:
                  raise SystemExit(f"expected exactly one dense-button token, found {source.count(before)}")
              path.write_text(source.replace(before, after, 1), encoding="utf-8")
          PY

          cat > apps/web/src/domains/creator/studio-panel-ui.desktop-touch-target.test.tsx <<'TS'
          import { describe, expect, it } from "vitest";

          import { studioToolButtonClass } from "./studio-panel-ui";

          describe("studioToolButtonClass desktop touch targets", () => {
            it("keeps dense toolbar controls at least 44px tall on every pointer type", () => {
              const tokens = studioToolButtonClass(false, { dense: true }).split(/\s+/);

              expect(tokens).toEqual(expect.arrayContaining(["h-11", "min-h-11"]));
              expect(tokens).not.toContain("h-9");
              expect(tokens).not.toContain("max-lg:h-11");
            });
          });
          TS

          git rm .github/workflows/one-shot-final-dense-touch.yml
          git add \
            apps/web/src/domains/creator/studio-panel-ui.tsx \
            apps/web/src/domains/creator/studio-panel-ui.desktop-touch-target.test.tsx
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(a11y): make dense Studio tools 44px tall"
          git pull --rebase origin release/final-main-merge-4888b061-immutable-20260908
          git push origin HEAD:release/final-main-merge-4888b061-immutable-20260908
