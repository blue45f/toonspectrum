name: Materialize clean Brush Studio goal entry

on:
  push:
    branches: [feat/brush-goal-guided-entry-clean-20260910]
    paths: [.github/workflows/materialize-brush-goal-entry-clean-once.yml]

permissions:
  contents: write

concurrency:
  group: materialize-brush-goal-entry-clean-v2
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/brush-goal-guided-entry-clean-20260910
          fetch-depth: 0
          persist-credentials: true
      - name: Wire goal chooser into Brush Studio
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/web/src/domains/creator/brush/StudioBrushStudio.tsx")
          text = path.read_text(encoding="utf-8")

          import_anchor = 'import { StudioBrushInputControls } from "./StudioBrushInputControls";\n'
          import_line = 'import { StudioBrushGoalStart } from "./StudioBrushGoalStart";\n'
          if import_line not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit(f"Brush Studio import anchor changed: {text.count(import_anchor)}")
              text = text.replace(import_anchor, import_line + import_anchor, 1)

          if "<StudioBrushGoalStart" not in text:
              restore_index = text.find("{restoreAction}")
              mobile_marker = '<div className="shrink-0 border-b border-line p-2 sm:hidden">'
              mobile_index = text.find(mobile_marker, restore_index)
              if restore_index < 0 or mobile_index < 0:
                  raise SystemExit(
                      f"Brush Studio structural markers changed: restore={restore_index}, mobile={mobile_index}"
                  )
              line_start = text.rfind("\n", 0, mobile_index) + 1
              indent = text[line_start:mobile_index]
              if not indent.isspace():
                  raise SystemExit("Brush Studio mobile preview is not on a standalone JSX line")
              block = (
                  f"{indent}<StudioBrushGoalStart\n"
                  f"{indent}  activePresetId={{matchedPreset}}\n"
                  f"{indent}  activeSection={{category}}\n"
                  f"{indent}  onSelectPreset={{(presetId) =>\n"
                  f"{indent}    onSelectDynamicsPreset(\n"
                  f"{indent}      presetId,\n"
                  f"{indent}      studioBrushDynamicsPresetSelectionSettings(presetId),\n"
                  f"{indent}    )\n"
                  f"{indent}  }}\n"
                  f"{indent}  onOpenSection={{(section) => setCategory(section)}}\n"
                  f"{indent}/>\n\n"
              )
              text = text[:line_start] + block + text[line_start:]

          path.write_text(text, encoding="utf-8")
          PY
          grep -q 'export type StudioBrushDynamicsPresetId = "ink-particle" | "airbrush" | "dry-media"' \
            apps/web/src/domains/creator/brush/studio-brush-dynamics-types.ts
          git diff --check
      - name: Commit product-only result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name toonstudio-brush-ci
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/materialize-brush-goal-entry-clean-once.yml
          git add \
            apps/web/src/domains/creator/brush/StudioBrushGoalStart.tsx \
            apps/web/src/domains/creator/brush/StudioBrushGoalStart.test.tsx \
            apps/web/src/domains/creator/brush/studio-brush-goal-start-integration-boundary.test.ts \
            apps/web/src/domains/creator/brush/StudioBrushStudio.tsx
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m 'feat(brush): start Brush Studio from the desired result'
          git -c core.hooksPath=/dev/null push --no-verify origin HEAD:feat/brush-goal-guided-entry-clean-20260910
