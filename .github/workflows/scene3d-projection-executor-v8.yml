name: Recover Scene3D projection on ARM

on:
  push:
    branches: [feat/scene3d-runtime-projection-20260910]
    paths: [.github/workflows/scene3d-projection-executor-v8.yml]

permissions:
  contents: write

concurrency:
  group: recover-scene3d-projection-v8
  cancel-in-progress: true

jobs:
  execute:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/scene3d-runtime-projection-20260910
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Materialize reviewed projection files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import os
          import subprocess
          import yaml

          data = yaml.safe_load(open(
              '.github/workflows/scene3d-projection-bootstrap.yml',
              encoding='utf-8',
          ))
          selected = {
              'Promote procedural primitives to first-class Scene3D entities',
              'Add BG3D projection adapter',
              'Add projection tests',
          }
          for step in data['jobs']['bootstrap']['steps']:
              if step.get('name') not in selected:
                  continue
              subprocess.run(
                  step['run'],
                  shell=True,
                  executable='/bin/bash',
                  check=True,
                  env=os.environ.copy(),
              )
          PY
          python3 scripts/scene3d-projection-fix.py

      - name: Validate projection contracts
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec vitest run \
            apps/web/src/domains/creator/scene3d/studio-scene3d-document.test.ts \
            apps/web/src/domains/creator/scene3d/studio-scene3d-bg3d-projection.test.ts \
            apps/web/src/domains/creator/scene3d/studio-scene3d-bg3d-projection-math.test.ts
          pnpm exec eslint --max-warnings=0 \
            apps/web/src/domains/creator/scene3d/studio-scene3d-document.ts \
            apps/web/src/domains/creator/scene3d/studio-scene3d-bg3d-projection.ts \
            apps/web/src/domains/creator/scene3d/studio-scene3d-bg3d-projection.test.ts \
            apps/web/src/domains/creator/scene3d/studio-scene3d-bg3d-projection-math.test.ts
          git diff --check

      - name: Commit product slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name toonstudio-3d-ci
          git config user.email actions@users.noreply.github.com
          rm -f .github/workflows/scene3d-projection-bootstrap.yml \
                .github/workflows/scene3d-projection-executor.yml \
                .github/workflows/scene3d-projection-executor-v8.yml \
                .github/workflows/unblock-scene3d-projection-once.yml \
                scripts/scene3d-projection-fix.py
          git add -A
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m 'feat(scene3d): project BG3D into unified scene authority'
          git push --no-verify origin HEAD:feat/scene3d-runtime-projection-20260910
