name: Verify Dependabot main completion

on:
  push:
    branches:
      - automation/verify-dependabot-main-20260908-v3

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read
  security-events: read

jobs:
  verify-and-mark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: '931'
      COMPLETION_TAG: dependabot-remediation-2026-09-08-complete
      AUTOMATION_REF: heads/automation/verify-dependabot-main-20260908-v3
    steps:
      - name: Merge through protected core and verify Dependabot closure
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 90); do
            pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
            merged="$(jq -r '.merged' <<<"$pr_json")"
            state="$(jq -r '.state' <<<"$pr_json")"
            head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
            base_ref="$(jq -r '.base.ref' <<<"$pr_json")"

            if [[ "$merged" != 'true' ]]; then
              if [[ "$state" != 'open' || "$base_ref" != 'main' ]]; then
                gh api --method PATCH "repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
                  -f state=open \
                  -f base=main >/dev/null
              fi
              gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --auto --squash || true

              core_status="$(gh api -H 'Accept: application/vnd.github+json' \
                "repos/${REPOSITORY}/commits/${head_sha}/check-runs?per_page=100" \
                --jq '[.check_runs[] | select(.name == "core" and .app.slug == "github-actions")] | sort_by(.started_at // .created_at) | last | .status // "missing"')"
              core_conclusion="$(gh api -H 'Accept: application/vnd.github+json' \
                "repos/${REPOSITORY}/commits/${head_sha}/check-runs?per_page=100" \
                --jq '[.check_runs[] | select(.name == "core" and .app.slug == "github-actions")] | sort_by(.started_at // .created_at) | last | .conclusion // "pending"')"
              echo "attempt=${attempt} head=${head_sha} core_status=${core_status} core_conclusion=${core_conclusion}"

              if [[ "$core_status" == 'completed' && "$core_conclusion" == 'success' ]]; then
                gh pr merge "$PR_NUMBER" \
                  --repo "$REPOSITORY" \
                  --squash \
                  --subject 'fix(security): resolve all Dependabot alerts' \
                  --body 'Resolves all audited dependency advisories and restores pnpm frozen-lockfile consistency.'
              elif [[ "$core_status" == 'completed' && "$core_conclusion" =~ ^(failure|cancelled|timed_out|action_required|startup_failure|stale)$ ]]; then
                echo "Required core check failed with conclusion=${core_conclusion}." >&2
                exit 1
              fi

              sleep 30
              continue
            fi

            main_sha="$(gh api "repos/${REPOSITORY}/branches/main" --jq '.commit.sha')"
            set +e
            alerts_json="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${REPOSITORY}/dependabot/alerts?state=open&per_page=100" \
              --paginate --slurp 2>"${RUNNER_TEMP}/dependabot-alerts.err")"
            alerts_exit="$?"
            set -e
            if [[ "$alerts_exit" -ne 0 ]]; then
              cat "${RUNNER_TEMP}/dependabot-alerts.err" >&2
              exit "$alerts_exit"
            fi
            open_count="$(jq '[.[][]] | length' <<<"$alerts_json")"
            echo "PR merged at main=${main_sha}; open Dependabot alerts=${open_count}"

            if [[ "$open_count" -eq 0 ]]; then
              encoded_tag="${COMPLETION_TAG//\//%2F}"
              if gh api "repos/${REPOSITORY}/git/ref/tags/${encoded_tag}" >/dev/null 2>&1; then
                gh api --method PATCH "repos/${REPOSITORY}/git/refs/tags/${encoded_tag}" \
                  -f sha="$main_sha" -F force=true >/dev/null
              else
                gh api --method POST "repos/${REPOSITORY}/git/refs" \
                  -f ref="refs/tags/${COMPLETION_TAG}" \
                  -f sha="$main_sha" >/dev/null
              fi
              gh api --method DELETE "repos/${REPOSITORY}/git/refs/${AUTOMATION_REF}" >/dev/null 2>&1 || true
              echo "Completion tag ${COMPLETION_TAG} now points to ${main_sha}."
              exit 0
            fi

            sleep 30
          done

          echo 'Completion conditions were not met before timeout.' >&2
          exit 1
