name: Reusable CodeQL residual remediation round

on:
  workflow_call:
    inputs:
      round:
        type: string
        required: true
      branch:
        type: string
        required: true
    outputs:
      clean:
        description: Whether this round found zero CodeQL security findings
        value: ${{ jobs.round.outputs.clean }}
      finding_count:
        description: Number of findings before this round's optional fixes
        value: ${{ jobs.round.outputs.finding_count }}

permissions:
  contents: write
  models: read
  security-events: read

jobs:
  round:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      clean: ${{ steps.state.outputs.clean }}
      finding_count: ${{ steps.state.outputs.finding_count }}
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_MODELS_TOKEN: ${{ github.token }}
      TARGET_BRANCH: ${{ inputs.branch }}
      ROUND: ${{ inputs.round }}
    steps:
      - name: Checkout latest remediation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze current tree without uploading SARIF
        uses: github/codeql-action/analyze@v3
        with:
          upload: false
          output: /tmp/codeql-round-${{ inputs.round }}
          category: /language:javascript-typescript

      - name: Inspect findings and apply a residual fix pass
        id: state
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 scripts/codeql-residual-remediation.py \
            --sarif-root "/tmp/codeql-round-${ROUND}" \
            --output "/tmp/codeql-round-${ROUND}-findings.json"
          inspect_status=$?
          set -e

          if [[ "$inspect_status" == "0" ]]; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
            echo "finding_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$inspect_status" != "2" ]]; then
            exit "$inspect_status"
          fi

          finding_count="$(jq 'length' "/tmp/codeql-round-${ROUND}-findings.json")"
          echo "clean=false" >> "$GITHUB_OUTPUT"
          echo "finding_count=$finding_count" >> "$GITHUB_OUTPUT"

          python3 scripts/codeql-residual-remediation.py \
            --sarif-root "/tmp/codeql-round-${ROUND}" \
            --output "/tmp/codeql-round-${ROUND}-findings.json" \
            --fix

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Residual findings were reported but no source changes were produced." >&2
            exit 1
          fi
          git commit -m "fix(security): remediate residual CodeQL findings (round ${ROUND})"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Upload round diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-residual-round-${{ inputs.round }}
          path: /tmp/codeql-round-${{ inputs.round }}-findings.json
          if-no-files-found: ignore
          retention-days: 1
