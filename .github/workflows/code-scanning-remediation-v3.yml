name: Collision-safe CodeQL remediation fallback

on:
  push:
    branches:
      - codex/code-scanning-remediation-20260908
    paths:
      - .github/workflows/code-scanning-remediation-v3.yml

permissions:
  actions: read
  contents: write
  pull-requests: write
  security-events: write

concurrency:
  group: collision-safe-codeql-remediation
  cancel-in-progress: false

jobs:
  fallback:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: codex/code-scanning-remediation-20260908
    steps:
      - name: Wait for the primary remediation workflow
        id: primary
        shell: bash
        run: |
          set -euo pipefail
          conclusion="missing"
          for attempt in $(seq 1 180); do
            runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/code-scanning-remediation-v2.yml/runs?branch=${TARGET_BRANCH}&per_page=10" 2>/dev/null || printf '{"workflow_runs":[]}')"
            active="$(jq '[.workflow_runs[] | select(.status != "completed")] | length' <<<"$runs")"
            conclusion="$(jq -r '[.workflow_runs[] | select(.status == "completed")][0].conclusion // "missing"' <<<"$runs")"
            if [[ "$active" == "0" ]]; then
              break
            fi
            echo "Primary remediation is still active (${active} run(s)); attempt ${attempt}/180"
            sleep 30
          done
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      - name: Check whether the remediation branch still exists
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          if gh api "/repos/${GITHUB_REPOSITORY}/branches/${TARGET_BRANCH//\//%2F}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout branch
        if: steps.branch.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Remove fallback after successful primary remediation
        if: steps.branch.outputs.exists == 'true' && steps.primary.outputs.conclusion == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/code-scanning-remediation-v3.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(security): remove completed remediation fallback"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Stop when primary remediation succeeded or branch was merged
        if: steps.branch.outputs.exists != 'true' || steps.primary.outputs.conclusion == 'success'
        run: echo "Primary remediation already completed successfully; fallback is not required."

      - name: Apply up to three collision-safe autofix passes
        if: steps.branch.outputs.exists == 'true' && steps.primary.outputs.conclusion != 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          target_ref = f"refs/heads/{os.environ['TARGET_BRANCH']}"
          api_root = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "toonspectrum-codeql-collision-safe-fallback",
          }

          def api(method, path, payload=None, accepted=(200, 201, 202, 204)):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(api_root + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      raw = response.read()
                      return response.status, (json.loads(raw) if raw else None)
              except urllib.error.HTTPError as error:
                  raw = error.read().decode(errors="replace")
                  try:
                      body = json.loads(raw) if raw else None
                  except json.JSONDecodeError:
                      body = raw
                  if error.code in accepted:
                      return error.code, body
                  raise RuntimeError(f"{method} {path}: {error.code}: {body}") from error

          def open_alerts():
              alerts = []
              page = 1
              while True:
                  _, batch = api("GET", f"/code-scanning/alerts?state=open&tool_name=CodeQL&per_page=100&page={page}")
                  alerts.extend(batch)
                  if len(batch) < 100:
                      return alerts
                  page += 1

          all_results = []
          for pass_number in range(1, 4):
              committed_this_pass = 0
              for alert in open_alerts():
                  number = int(alert["number"])
                  result = {"pass": pass_number, "number": number, "rule": (alert.get("rule") or {}).get("id")}
                  create_status, create_body = api(
                      "POST",
                      f"/code-scanning/alerts/{number}/autofix",
                      {},
                      accepted=(200, 201, 202, 204, 400, 403, 404, 409, 422),
                  )
                  if create_status >= 400:
                      result.update(status="unavailable", detail=create_body)
                      all_results.append(result)
                      continue

                  autofix = create_body or {}
                  for _ in range(90):
                      poll_status, poll_body = api(
                          "GET",
                          f"/code-scanning/alerts/{number}/autofix",
                          accepted=(200, 202, 400, 403, 404, 409, 422),
                      )
                      if poll_status >= 400:
                          autofix = {"status": "error", "detail": poll_body}
                          break
                      autofix = poll_body or {}
                      if autofix.get("status") in {"ready", "error", "outdated"}:
                          break
                      time.sleep(2)
                  if autofix.get("status") != "ready":
                      result.update(status="not-ready", detail=autofix)
                      all_results.append(result)
                      continue

                  commit_status, commit_body = api(
                      "POST",
                      f"/code-scanning/alerts/{number}/autofix/commits",
                      {"target_ref": target_ref},
                      accepted=(200, 201, 202, 400, 403, 404, 409, 422),
                  )
                  if commit_status < 400:
                      result.update(status="committed", commit=commit_body)
                      committed_this_pass += 1
                  else:
                      result.update(status="commit-failed", detail=commit_body)
                  all_results.append(result)
                  print(json.dumps(result, ensure_ascii=False, separators=(",", ":")))

              print(f"PASS_{pass_number}_COMMITTED={committed_this_pass}")
              if committed_this_pass == 0:
                  break
              time.sleep(10)

          with open("/tmp/codeql-v3-autofix-results.json", "w", encoding="utf-8") as output:
              json.dump(all_results, output, ensure_ascii=False, indent=2)
          PY

      - name: Refresh checkout after API commits
        if: steps.branch.outputs.exists == 'true' && steps.primary.outputs.conclusion != 'success'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" main
          git reset --hard "origin/$TARGET_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
          fi
          rm -f \
            .github/workflows/code-scanning-inventory.yml \
            .github/workflows/code-scanning-context.yml \
            .github/workflows/code-scanning-autofix.yml \
            .github/workflows/code-scanning-remediation-gate.yml \
            .github/workflows/code-scanning-remediation-gate-trigger.yml \
            .github/workflows/code-scanning-remediation-v2.yml \
            .github/workflows/code-scanning-remediation-v3.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(security): finalize collision-safe remediation"
          fi
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Initialize CodeQL fallback analysis
        if: steps.branch.outputs.exists == 'true' && steps.primary.outputs.conclusion != 'success'
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze fallback tree
        if: steps.branch.outputs.exists == 'true' && steps.primary.outputs.conclusion != 'success'
        uses: github/codeql-action/analyze@v3
        with:
          upload: false
          output: /tmp/codeql-v3-results
          category: /language:javascript-typescript

      - name: Require zero fallback security findings
        if: steps.branch.outputs.exists == 'true' && steps.primary.outputs.conclusion != 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          import sys

          paths = glob.glob("/tmp/codeql-v3-results/**/*.sarif", recursive=True)
          if not paths:
              raise SystemExit("No SARIF output")
          findings = []
          seen = set()
          for path in paths:
              with open(path, encoding="utf-8") as source:
                  sarif = json.load(source)
              for run in sarif.get("runs", []):
                  rules = {r.get("id"): r for r in ((((run.get("tool") or {}).get("driver") or {}).get("rules")) or [])}
                  for result in run.get("results", []):
                      rule_id = result.get("ruleId")
                      props = (rules.get(rule_id) or {}).get("properties") or {}
                      tags = [str(tag) for tag in (props.get("tags") or [])]
                      if props.get("security-severity") is None and not any(tag.startswith("security/") or tag.startswith("external/cwe/") for tag in tags):
                          continue
                      locs = result.get("locations") or []
                      physical = ((locs[0].get("physicalLocation") if locs else None) or {})
                      file_path = ((physical.get("artifactLocation") or {}).get("uri"))
                      line = ((physical.get("region") or {}).get("startLine"))
                      key = (rule_id, file_path, line, ((result.get("message") or {}).get("text")))
                      if key not in seen:
                          seen.add(key)
                          findings.append({"rule": rule_id, "path": file_path, "line": line, "message": key[3]})
          print(json.dumps(findings, ensure_ascii=False, indent=2))
          if findings:
              raise SystemExit(f"Fallback security gate found {len(findings)} finding(s)")
          print("CODEQL_SECURITY_FINDINGS=0")
          PY

      - name: Create or locate pull request
        if: steps.branch.outputs.exists == 'true' && steps.primary.outputs.conclusion != 'success'
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$number" ]]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$TARGET_BRANCH" --title "fix(security): resolve all open CodeQL findings" --body $'## Summary\n\n- resolves the complete CodeQL alert inventory\n- retries colliding autofixes against the latest remediation branch\n- validates the final tree with CodeQL `security-extended`\n\n## Gate\n\nCodeQL security findings: **0**'
            number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --base main --state open --json number --jq '.[0].number')"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Enable protected auto-merge
        if: steps.branch.outputs.exists == 'true' && steps.primary.outputs.conclusion != 'success'
        run: gh pr merge "${{ steps.pr.outputs.number }}" --repo "$GITHUB_REPOSITORY" --squash --auto --delete-branch
