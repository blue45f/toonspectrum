name: Fix issue 1253 recovery lint

on:
  push:
    branches: [fix/issue-1253-vrm-quality-convergence-20260910]
    paths: [.github/workflows/fix-issue-1253-recovery-lint.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-slim
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issue-1253-vrm-quality-convergence-20260910
          fetch-depth: 0
          persist-credentials: true

      - name: Remove control-character regex without changing GLB semantics
        shell: python
        run: |
          from pathlib import Path

          generator = Path("scripts/generate-vrm-model-technical-denylist.ts")
          source = generator.read_text(encoding="utf-8")
          old = '''  const json = bytes
            .subarray(20, 20 + jsonLength)
            .toString("utf8")
            .replace(/\\u0000+$/gu, "")
            .trim();
          return JSON.parse(json) as GltfJson;'''
          new = '''  let json = bytes
            .subarray(20, 20 + jsonLength)
            .toString("utf8");
          const padding = String.fromCharCode(0);
          while (json.endsWith(padding)) json = json.slice(0, -1);
          return JSON.parse(json.trim()) as GltfJson;'''
          if old not in source:
              if new not in source:
                  raise SystemExit("GLB JSON padding anchor changed")
          else:
              generator.write_text(source.replace(old, new, 1), encoding="utf-8")

          workflow = Path(".github/workflows/recover-issue-1253.yml")
          text = workflow.read_text(encoding="utf-8")
          marker = "# Generator lint remediation revision 2.\n"
          if marker not in text:
              text = text.replace(
                  "name: Recover issue 1253 VRM quality convergence\n",
                  "name: Recover issue 1253 VRM quality convergence\n\n" + marker,
                  1,
              )
              workflow.write_text(text, encoding="utf-8")

      - name: Publish fixed recovery input
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-issue-1253-recovery-lint.yml
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit \
            -m "fix(vrm): avoid control regex in technical scanner"
          git push --no-verify origin HEAD:fix/issue-1253-vrm-quality-convergence-20260910
