# Stable retry pinned to the last workflow containing the original product steps.
name: Materialize tagged product without workflow writes

on:
  push:
    branches: [fix/real-core-and-main-only-20260910]
    paths: [.github/workflows/materialize-tagged-product-without-workflow-write.yml]

permissions:
  contents: write

concurrency:
  group: materialize-tagged-product-without-workflow-write-20260911
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    env:
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=8192
      TARGET_BRANCH: fix/real-core-and-main-only-20260910
      EFFECTS_SOURCE_SHA: f76a78bc047d42dcc74cda6002307d50fb491cd8
      SOURCE_MATERIALIZER_SHA: 056e3a1928abb0b4840e4082fba869881e8d5763
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Extract corrected product-only materialization steps
        shell: bash
        run: |
          set -euo pipefail
          git show "${SOURCE_MATERIALIZER_SHA}:.github/workflows/materialize-remaining-tagged-product-work.yml" \
            > "$RUNNER_TEMP/product-materializer.yml"
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path(os.environ["RUNNER_TEMP"]) / "product-materializer.yml"
          source = path.read_text(encoding="utf-8")
          replacements = [
              ('if ">3D 캐릭터<" in source:', 'if "3D 캐릭터" in source:'),
              ('for label in [">3D 캐릭터<", ">캐릭터 셰이퍼<", ">3D 데생 인형<", ">3D 배경<"]:',
               'for label in ["3D 캐릭터", "캐릭터 셰이퍼", "3D 데생 인형", "3D 배경"]:'),
              ('if source.count("3D 스튜디오") < 2:', 'if source.count("3D 스튜디오") < 1:'),
              ('raise SystemExit("unified 3D Studio button/fallback was not created")',
               'raise SystemExit("unified 3D Studio entry was not created")'),
              ('expect(toolbarSource).not.toContain(">3D 캐릭터<");',
               'expect(toolbarSource).not.toContain("3D 캐릭터");'),
              ('expect(toolbarSource).not.toContain(">캐릭터 셰이퍼<");',
               'expect(toolbarSource).not.toContain("캐릭터 셰이퍼");'),
              ('expect(toolbarSource).not.toContain(">3D 데생 인형<");',
               'expect(toolbarSource).not.toContain("3D 데생 인형");'),
              ('expect(toolbarSource).not.toContain(">3D 배경<");',
               'expect(toolbarSource).not.toContain("3D 배경");'),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"unexpected source materializer marker count for {old!r}: {count}")
              source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")
          PY

          ruby -ryaml - <<'RB'
          workflow = YAML.load_file(File.join(ENV.fetch("RUNNER_TEMP"), "product-materializer.yml"), aliases: true)
          steps = workflow.fetch("jobs").fetch("materialize").fetch("steps")
          wanted = {
            "Materialize non-destructive Studio effects workspace" => "effects.sh",
            "Materialize one guided Studio 3D entry" => "unified-3d.py",
            "Record tagged-source recovery map" => "recovery-map.sh",
            "Install and validate focused product contracts" => "validate.sh",
          }
          wanted.each do |name, file|
            step = steps.find { |candidate| candidate["name"] == name }
            abort("missing pinned materializer step: #{name}") unless step && step["run"]
            File.write(File.join(ENV.fetch("RUNNER_TEMP"), file), step["run"])
          end
          RB

      - name: Materialize Studio effects workspace
        shell: bash
        run: bash "$RUNNER_TEMP/effects.sh"

      - name: Materialize unified Studio 3D entry
        shell: bash
        run: python3 "$RUNNER_TEMP/unified-3d.py"

      - name: Record tagged-source recovery map
        shell: bash
        run: bash "$RUNNER_TEMP/recovery-map.sh"

      - name: Validate focused product contracts
        shell: bash
        run: bash "$RUNNER_TEMP/validate.sh"

      - name: Publish product-only recovery commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add apps/web/src/domains/creator .qa/tagged-product-recovery-2026-09-11.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "product recovery already materialized"
            exit 0
          fi
          git -c core.hooksPath=/dev/null commit -m "feat(studio): materialize remaining tagged recovery work"
          for attempt in $(seq 1 8); do
            if git push --no-verify origin HEAD:fix/real-core-and-main-only-20260910; then
              exit 0
            fi
            git fetch origin fix/real-core-and-main-only-20260910
            git rebase origin/fix/real-core-and-main-only-20260910
            sleep $((attempt * 2))
          done
          exit 1
