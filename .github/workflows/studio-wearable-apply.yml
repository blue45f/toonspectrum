name: Apply reviewed wearable selection policy
on:
  push:
    branches: [fix/studio-wearable-quality-audit-20260906]
    paths: ['.github/workflows/studio-wearable-apply.yml']
permissions:
  contents: read
concurrency:
  group: wearable-integration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integrate:
    if: github.ref == 'refs/heads/fix/studio-wearable-quality-audit-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Connect the reviewed selection policy without changing saved-scene parsing
        run: |
          python3 <<'PY'
          from pathlib import Path
          def change(path, before, after):
              p=Path(path); text=p.read_text()
              if after in text: return
              if text.count(before)!=1: raise RuntimeError(f'Source precondition failed: {path}: {before[:100]}')
              p.write_text(text.replace(before,after,1))
          p='src/domains/creator/vrm/StudioVrmPropPanel.tsx'
          change(p,'import { cn } from "@/lib/utils";', 'import { isStudioVrmPropSelectable, studioVrmPropQualityNotice } from "./studio-vrm-prop-quality-policy";\n\nimport { cn } from "@/lib/utils";')
          change(p,'export interface StudioVrmPropPanelProps {','const SELECTABLE_PROP_COUNT = VRM_PROPS.filter(({ id }) => isStudioVrmPropSelectable(id)).length;\n\nexport interface StudioVrmPropPanelProps {')
          change(p,'  "book",\n  "sword",','  "book",\n  "mic",')
          change(p,'  const quickDefinitions = recentPropIds\n    .map','  const quickDefinitions = recentPropIds\n    .filter(isStudioVrmPropSelectable)\n    .map')
          change(p,'  const filteredDefinitions = VRM_PROPS.filter((definition) => {\n','  const filteredDefinitions = VRM_PROPS.filter((definition) => {\n    if (!isStudioVrmPropSelectable(definition.id)) return false;\n')
          change(p,'  function handleAdd(definition: PropDef): void {\n    if (!vrmReady) return;','  function handleAdd(definition: PropDef): void {\n    if (!vrmReady || !isStudioVrmPropSelectable(definition.id)) return;')
          change(p,'{VRM_PROPS.length}종','{SELECTABLE_PROP_COUNT}종')
          change(p,'  const editorTitleId = useId();','  const qualityNotice = studioVrmPropQualityNotice(item.propId);\n  const editorTitleId = useId();')
          change(p,'      aria-labelledby={editorTitleId}\n    >','      aria-labelledby={editorTitleId}\n    >\n      {qualityNotice ? (\n        <p role="note" aria-label="소품 품질 안내" className="mb-3 rounded-lg border border-line bg-panel p-3 text-xs leading-relaxed text-fg-2">\n          품질 개선 대기 소품입니다. 기존 장면의 부착과 편집은 유지되지만 새로 추가할 수 없습니다. {qualityNotice}\n        </p>\n      ) : null}')
          p='src/domains/creator/vrm/useStudioVrmPoserRuntimeE.ts'
          change(p,'import {\n  createPropInstance,','import { isStudioVrmPropSelectable } from "./studio-vrm-prop-quality-policy";\nimport {\n  createPropInstance,')
          change(p,'  function addVrmProp(propId: string) {\n    const instance','  function addVrmProp(propId: string) {\n    if (!isStudioVrmPropSelectable(propId)) return;\n    const instance')
          PY
      - name: Selection, saved-scene and actual GLB regression tests
        run: pnpm exec vitest run src/domains/creator/vrm/StudioVrmPropPanel.quality.test.tsx src/domains/creator/vrm/StudioVrmPropPanel.test.tsx src/domains/creator/vrm/studio-vrm-wearable-v5.test.ts src/domains/creator/vrm/studio-vrm-props.test.ts src/domains/creator/studio-everyday-props-pack-v4.test.ts --reporter=verbose
      - name: Commit only the reviewed UI integration
        run: |
          test "$GITHUB_REF_NAME" = 'fix/studio-wearable-quality-audit-20260906'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git add -- src/domains/creator/vrm/StudioVrmPropPanel.tsx src/domains/creator/vrm/useStudioVrmPoserRuntimeE.ts
          mkdir -p wearable-ui-integration
          git diff --cached --binary > wearable-ui-integration/source.patch
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='ToonStudio quality integration' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(studio): exclude failed wearables from new selections and preserve saved scenes'
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Retain exact reviewed source
        if: always()
        run: |
          mkdir -p wearable-ui-integration
          git rev-parse HEAD > wearable-ui-integration/commit.txt
          cp src/domains/creator/vrm/StudioVrmPropPanel.tsx src/domains/creator/vrm/useStudioVrmPoserRuntimeE.ts wearable-ui-integration/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wearable-ui-integration-${{ github.sha }}
          path: wearable-ui-integration/
          retention-days: 7
