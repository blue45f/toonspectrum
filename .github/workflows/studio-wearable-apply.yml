name: Integrate reviewed wearable fitting and selection
on:
  push:
    branches: [fix/studio-wearable-quality-audit-20260906]
    paths: ['.github/workflows/studio-wearable-apply.yml']
permissions:
  contents: read
concurrency:
  group: wearable-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrate:
    if: github.ref == 'refs/heads/fix/studio-wearable-quality-audit-20260906'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Apply the narrowly reviewed contact and measurement patch
        run: |
          git apply --check scripts/studio-wearable-fit.patch
          git apply scripts/studio-wearable-fit.patch
      - name: Integrate selection policy and explicit hair-clearance guidance
        run: |
          python3 <<'PY'
          from pathlib import Path
          def change(path, before, after):
              p=Path(path); text=p.read_text()
              if after in text: return
              if text.count(before)!=1: raise RuntimeError(f'Source precondition failed: {path}: {before[:100]}')
              p.write_text(text.replace(before,after,1))
          p='src/domains/creator/vrm/StudioVrmPropPanel.tsx'
          change(p,'import { cn } from "@/lib/utils";', 'import { isStudioVrmPropSelectable, studioVrmPropQualityNotice } from "./studio-vrm-prop-quality-policy";\n\nimport { cn } from "@/lib/utils";')
          change(p,'export interface StudioVrmPropPanelProps {','const SELECTABLE_PROP_COUNT = VRM_PROPS.filter(({ id }) => isStudioVrmPropSelectable(id)).length;\n\nexport interface StudioVrmPropPanelProps {')
          change(p,'  "book",\n  "sword",','  "book",\n  "mic",')
          change(p,'  const quickDefinitions = recentPropIds\n    .map','  const quickDefinitions = recentPropIds\n    .filter(isStudioVrmPropSelectable)\n    .map')
          change(p,'  const filteredDefinitions = VRM_PROPS.filter((definition) => {\n','  const filteredDefinitions = VRM_PROPS.filter((definition) => {\n    if (!isStudioVrmPropSelectable(definition.id)) return false;\n')
          change(p,'  function handleAdd(definition: PropDef): void {\n    if (!vrmReady) return;','  function handleAdd(definition: PropDef): void {\n    if (!vrmReady || !isStudioVrmPropSelectable(definition.id)) return;')
          change(p,'{VRM_PROPS.length}종','{SELECTABLE_PROP_COUNT}종')
          change(p,'  const editorTitleId = useId();','  const qualityNotice = studioVrmPropQualityNotice(item.propId);\n  const editorTitleId = useId();')
          notices='''      {qualityNotice ? (
                  <p role="note" aria-label="소품 품질 안내" className="mb-3 rounded-lg border border-line bg-panel p-3 text-xs leading-relaxed text-fg-2">
                    품질 개선 대기 소품입니다. 기존 장면의 부착과 편집은 유지되지만 새로 추가할 수 없습니다. {qualityNotice}
                  </p>
                ) : null}
                {item.bone === "head" && rigMetrics.faceSocket.hairClearanceRequired ? (
                  <p role="note" aria-label="헤어 간섭 안내" className="mb-3 rounded-lg border border-line bg-panel p-3 text-xs leading-relaxed text-fg-2">
                    볼륨 헤어나 기본 머리장식이 소품과 겹칠 수 있습니다. 측면에서 확인하고 소품 위치와 크기를 조정해 주세요.
                  </p>
                ) : null}'''
          change(p,'      aria-labelledby={editorTitleId}\n    >','      aria-labelledby={editorTitleId}\n    >\n'+notices)
          p='src/domains/creator/vrm/useStudioVrmPoserRuntimeE.ts'
          change(p,'import {\n  createPropInstance,','import { isStudioVrmPropSelectable } from "./studio-vrm-prop-quality-policy";\nimport {\n  createPropInstance,')
          change(p,'  function addVrmProp(propId: string) {\n    const instance','  function addVrmProp(propId: string) {\n    if (!isStudioVrmPropSelectable(propId)) return;\n    const instance')
          p='src/domains/creator/vrm/StudioVrmPropPanel.quality.test.tsx'
          change(p,'expect(entries).toHaveLength(34);','expect(entries).toHaveLength(35);')
          change(p,'function renderPanel(items: PropInstance[] = [], vrmReady = true) {','function renderPanel(items: PropInstance[] = [], vrmReady = true, hairRisk = false) {')
          change(p,'rigMetrics={DEFAULT_VRM_PROP_RIG_METRICS}','rigMetrics={hairRisk ? { ...DEFAULT_VRM_PROP_RIG_METRICS, faceSocket: { ...DEFAULT_VRM_PROP_RIG_METRICS.faceSocket, hairClearanceRequired: true } } : DEFAULT_VRM_PROP_RIG_METRICS}')
          marker='  it("keeps saved quarantined items and their transforms intact and editable", () => {'
          test='''  it("warns about native hair clearance without modifying an existing head attachment", () => {
              const item = createPropInstance("cap", "hair-clearance-cap")!;
              const { onUpdate, onRemove } = renderPanel([item], true, true);
              expect(screen.getByRole("note", { name: "헤어 간섭 안내" }).textContent).toContain("측면");
              expect(onUpdate).not.toHaveBeenCalled();
              expect(onRemove).not.toHaveBeenCalled();
            });

          '''
          change(p,marker,test+marker)
          PY
      - name: Regenerate the exact original GLB pack
        run: pnpm exec tsx scripts/generate-studio-wearable-v5.mts
      - name: Lint the changed production code and tests
        run: pnpm exec eslint --fix --max-warnings=0 src/domains/creator/vrm/studio-vrm-head-surface.ts src/domains/creator/vrm/studio-vrm-head-surface.test.ts src/domains/creator/vrm/studio-vrm-prop-rig.ts src/domains/creator/vrm/studio-vrm-props.ts src/domains/creator/vrm/studio-vrm-prop-quality-policy.ts src/domains/creator/vrm/StudioVrmPropPanel.tsx src/domains/creator/vrm/StudioVrmPropPanel.quality.test.tsx src/domains/creator/vrm/useStudioVrmPoserRuntimeE.ts
      - name: Real fixtures, complete VRM regression suite and legacy prop pack
        run: pnpm exec vitest run src/domains/creator/vrm src/domains/creator/studio-everyday-props-pack-v4.test.ts --reporter=default
      - name: Commit only reviewed source and generated output
        run: |
          test "$GITHUB_REF_NAME" = 'fix/studio-wearable-quality-audit-20260906'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git add -- src/domains/creator/vrm/studio-vrm-head-surface.ts src/domains/creator/vrm/studio-vrm-head-surface.test.ts src/domains/creator/vrm/studio-vrm-prop-rig.ts src/domains/creator/vrm/studio-vrm-props.ts src/domains/creator/vrm/studio-vrm-prop-quality-policy.ts src/domains/creator/vrm/StudioVrmPropPanel.tsx src/domains/creator/vrm/StudioVrmPropPanel.quality.test.tsx src/domains/creator/vrm/useStudioVrmPoserRuntimeE.ts scripts/generate-studio-wearable-v5.mts public/assets/3d/atelier_ribbon.glb public/assets/3d/wearable-v5-manifest.json
          git rm -- scripts/studio-wearable-fit.patch
          mkdir -p wearable-final-integration
          git diff --cached --binary > wearable-final-integration/source.patch
          git -c user.name='ToonStudio quality integration' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(studio): fit wearables to head surfaces and quarantine unsafe new selections'
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Install the real browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Render standalone, worn and posed production components
        run: GITHUB_SHA=$(git rev-parse HEAD) pnpm exec tsx scripts/verify-studio-wearable-v5.mts
      - name: Keep exact sources, binaries and test evidence
        if: always()
        run: |
          mkdir -p wearable-final-integration
          git rev-parse HEAD > wearable-final-integration/commit.txt
          git diff --binary > wearable-final-integration/uncommitted.patch
          tar -czf wearable-final-integration/review-source.tar.gz src/domains/creator/vrm public/assets/3d scripts/generate-studio-wearable-v5.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wearable-final-integration-${{ github.sha }}
          path: wearable-final-integration/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wearable-final-review-${{ github.sha }}
          path: |
            .artifacts/studio-wearable-v5/contact-sheet-*.jpg
            .artifacts/studio-wearable-v5/review.json
            .artifacts/studio-wearable-v5/screenshots/*.png
            .artifacts/studio-wearable-v5/runtime/
            .artifacts/studio-wearable-v5/page.mjs
          include-hidden-files: true
          retention-days: 7
