name: Merge PR 931 after protected core

on:
  push:
    branches:
      - automation/merge-pr931-after-core-20260908-v2

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  merge-after-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: '931'
      AUTOMATION_REF: heads/automation/merge-pr931-after-core-20260908-v2
    steps:
      - name: Normalize PR target and merge after protected core succeeds
        shell: bash
        run: |
          set -euo pipefail

          merged="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.merged')"
          if [[ "$merged" == 'true' ]]; then
            echo "PR #${PR_NUMBER} is already merged."
            exit 0
          fi

          gh api --method PATCH "repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
            -f state=open \
            -f base=main \
            -f title='fix(security): resolve all Dependabot alerts' >/dev/null
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --auto --squash

          for attempt in $(seq 1 90); do
            pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
            merged="$(jq -r '.merged' <<<"$pr_json")"
            state="$(jq -r '.state' <<<"$pr_json")"
            head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
            base_ref="$(jq -r '.base.ref' <<<"$pr_json")"

            if [[ "$merged" == 'true' ]]; then
              echo "PR #${PR_NUMBER} merged successfully."
              gh api --method DELETE "repos/${REPOSITORY}/git/refs/${AUTOMATION_REF}" >/dev/null 2>&1 || true
              exit 0
            fi
            if [[ "$state" != 'open' || "$base_ref" != 'main' ]]; then
              echo "Unexpected PR state: state=${state}, base=${base_ref}" >&2
              exit 1
            fi

            core_status="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${REPOSITORY}/commits/${head_sha}/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "core" and .app.slug == "github-actions")] | sort_by(.started_at // .created_at) | last | .status // "missing"')"
            core_conclusion="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${REPOSITORY}/commits/${head_sha}/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "core" and .app.slug == "github-actions")] | sort_by(.started_at // .created_at) | last | .conclusion // "pending"')"

            echo "attempt=${attempt} head=${head_sha} core_status=${core_status} core_conclusion=${core_conclusion}"

            if [[ "$core_status" == 'completed' && "$core_conclusion" == 'success' ]]; then
              gh pr merge "$PR_NUMBER" \
                --repo "$REPOSITORY" \
                --squash \
                --subject 'fix(security): resolve all Dependabot alerts' \
                --body 'Resolves all audited dependency advisories and restores pnpm frozen-lockfile consistency.'
              merged="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.merged')"
              [[ "$merged" == 'true' ]]
              gh api --method DELETE "repos/${REPOSITORY}/git/refs/${AUTOMATION_REF}" >/dev/null 2>&1 || true
              exit 0
            fi

            if [[ "$core_status" == 'completed' && "$core_conclusion" =~ ^(failure|cancelled|timed_out|action_required|startup_failure|stale)$ ]]; then
              echo "Required core check failed with conclusion=${core_conclusion}." >&2
              exit 1
            fi

            sleep 30
          done

          echo 'Timed out before protected core completed.' >&2
          exit 1
