name: One-shot repository Actions triage

on:
  push:
    branches:
      - fix/ci-preserve-explicit-reruns-20260916
    paths:
      - ".github/workflows/pr-actions-queue-cleanup.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: repository-actions-triage-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Reserve runners for the CI repair PR
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Cancel active runs outside main and PR 1482
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const currentRunId = Number(context.runId);
            const keepBranch = "fix/ci-reruns-clean-20260916";
            const activeStatuses = new Set([
              "queued",
              "in_progress",
              "pending",
              "requested",
              "waiting",
            ]);

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 },
            );
            const cancelled = [];
            const preserved = [];
            for (const run of runs) {
              if (run.id === currentRunId || !activeStatuses.has(run.status)) continue;
              const preserve =
                run.head_branch === keepBranch ||
                run.head_branch === "main" ||
                run.event === "schedule";
              if (preserve) {
                preserved.push(run.id);
                continue;
              }
              await github.rest.actions.cancelWorkflowRun({
                owner,
                repo,
                run_id: run.id,
              });
              cancelled.push(run.id);
            }

            await core.summary
              .addHeading("Repository Actions triage")
              .addRaw(`Preserved repair/main/scheduled runs: ${preserved.join(", ") || "none"}\n`)
              .addRaw(`Cancelled other active runs: ${cancelled.join(", ") || "none"}\n`)
              .write();
