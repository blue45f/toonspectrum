name: Retired PR Actions triage

on:
  push:
    branches:
      - fix/ci-preserve-explicit-reruns-20260916
    paths:
      - ".github/workflows/pr-actions-queue-cleanup.yml"

permissions:
  contents: read

concurrency:
  group: repository-actions-triage-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retired:
    name: Confirm queue triage is retired
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - run: echo "Queue triage retired; no workflow runs are modified."
