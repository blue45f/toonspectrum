name: One-shot closed PR Actions cleanup

on:
  push:
    branches:
      - fix/ci-preserve-explicit-reruns-20260916
    paths:
      - ".github/workflows/pr-actions-queue-cleanup.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: pr-actions-queue-cleanup-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Cancel every remaining run for the superseded branch
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Cancel all active runs except this cleanup
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const headBranch = context.ref.replace(/^refs\/heads\//u, "");
            const currentRunId = Number(context.runId);
            const activeStatuses = new Set([
              "queued",
              "in_progress",
              "pending",
              "requested",
              "waiting",
            ]);

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, branch: headBranch, per_page: 100 },
            );
            const cancelled = [];
            for (const run of runs) {
              if (run.id === currentRunId || !activeStatuses.has(run.status)) continue;
              await github.rest.actions.cancelWorkflowRun({
                owner,
                repo,
                run_id: run.id,
              });
              cancelled.push(run.id);
            }

            await core.summary
              .addHeading("Closed PR Actions cleanup")
              .addRaw(`Branch: ${headBranch}\n`)
              .addRaw(`Cancelled active runs: ${cancelled.join(", ") || "none"}\n`)
              .write();
