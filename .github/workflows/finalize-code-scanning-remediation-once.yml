name: Finalize code-scanning remediation once

on:
  push:
    branches:
      - fix/code-scanning-alerts-20260910-v3
    paths:
      - .github/workflows/finalize-code-scanning-remediation-once.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  security-events: write

concurrency:
  group: remediate-code-scanning-alerts-20260910-v3
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: fix/code-scanning-alerts-20260910-v3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/code-scanning-alerts-20260910-v3
          fetch-depth: 0

      - name: Require immutable zero-alert readiness marker
        run: |
          set -euo pipefail
          git fetch origin "${TARGET_BRANCH}"
          git reset --hard "origin/${TARGET_BRANCH}"
          test -f .security-remediation/READY
          grep -qx 'code-scanning-alerts=0' .security-remediation/READY
          grep -qx 'branch=fix/code-scanning-alerts-20260910-v3' .security-remediation/READY

      - name: Prepare final tree and dispatchable authoritative workflows
        id: prepare
        shell: python
        run: |
          from pathlib import Path

          workflows = Path('.github/workflows')

          def ensure_workflow_dispatch(path: Path) -> None:
              text = path.read_text()
              lines = text.splitlines(keepends=True)
              on_index = next((i for i, line in enumerate(lines) if line.rstrip('\r\n') == 'on:'), None)
              if on_index is None:
                  raise SystemExit(f'{path}: unsupported non-block on declaration')

              end = len(lines)
              for index in range(on_index + 1, len(lines)):
                  stripped = lines[index].lstrip()
                  if stripped and not lines[index].startswith((' ', '\t', '\r', '\n')):
                      end = index
                      break
              if any(line.startswith('  workflow_dispatch:') for line in lines[on_index + 1:end]):
                  return
              lines.insert(on_index + 1, '  workflow_dispatch:\n')
              path.write_text(''.join(lines))

          ci_path = workflows / 'ci.yml'
          if not ci_path.exists():
              raise SystemExit('authoritative .github/workflows/ci.yml is missing')
          ensure_workflow_dispatch(ci_path)

          excluded = {
              'verify-code-scanning-remediation.yml',
              'mark-code-scanning-remediation-ready.yml',
              'finalize-code-scanning-remediation-once.yml',
              'remediate-code-scanning-once.yml',
              'integrate-prior-code-scanning-fixes-once.yml',
          }
          codeql_candidates = []
          for path in sorted(workflows.glob('*.y*ml')):
              if path.name in excluded:
                  continue
              if 'github/codeql-action/init@' in path.read_text(errors='ignore'):
                  codeql_candidates.append(path)

          if codeql_candidates:
              codeql_path = codeql_candidates[0]
              ensure_workflow_dispatch(codeql_path)
          else:
              codeql_path = workflows / 'codeql-manual-verification.yml'
              codeql_path.write_text('''name: CodeQL security verification\n\non:\n  workflow_dispatch:\n\npermissions:\n  actions: read\n  contents: read\n  security-events: write\n\njobs:\n  analyze:\n    name: Analyze JavaScript and TypeScript\n    runs-on: ubuntu-24.04\n    timeout-minutes: 45\n    steps:\n      - uses: actions/checkout@v6\n      - uses: github/codeql-action/init@v4\n        with:\n          languages: javascript-typescript\n          build-mode: none\n      - uses: github/codeql-action/analyze@v4\n        with:\n          category: /language:javascript-typescript/manual-verification\n''')

          Path('/tmp/codeql-workflow-name').write_text(codeql_path.name)
          Path('/tmp/ci-workflow-name').write_text(ci_path.name)
          with Path('/tmp/finalizer-output').open('w') as output:
              output.write(f'ci_workflow={ci_path.name}\n')
              output.write(f'codeql_workflow={codeql_path.name}\n')

      - name: Remove temporary remediation machinery
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/remediate-code-scanning-once.yml \
            .github/workflows/integrate-prior-code-scanning-fixes-once.yml \
            .github/workflows/verify-code-scanning-remediation.yml \
            .github/workflows/mark-code-scanning-remediation-ready.yml \
            .github/workflows/finalize-code-scanning-remediation-once.yml \
            .github/workflows/code-scanning-audit-temp.yml \
            .security-remediation/READY
          rmdir .security-remediation 2>/dev/null || true
          git add -A
          git diff --cached --check

      - name: Commit and push the final reviewable tree
        id: final_commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): finalize CodeQL remediation"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
          final_sha="$(git rev-parse HEAD)"
          echo "sha=${final_sha}" >> "$GITHUB_OUTPUT"
          cat /tmp/finalizer-output >> "$GITHUB_OUTPUT"

      - name: Dispatch authoritative CI and CodeQL on the final commit
        run: |
          set -euo pipefail
          ci_workflow='${{ steps.prepare.outputs.ci_workflow }}'
          codeql_workflow='${{ steps.prepare.outputs.codeql_workflow }}'
          gh workflow run "$ci_workflow" --ref "$TARGET_BRANCH"
          gh workflow run "$codeql_workflow" --ref "$TARGET_BRANCH"

      - name: Wait for dispatched workflow conclusions
        env:
          FINAL_SHA: ${{ steps.final_commit.outputs.sha }}
          CI_WORKFLOW: ${{ steps.prepare.outputs.ci_workflow }}
          CODEQL_WORKFLOW: ${{ steps.prepare.outputs.codeql_workflow }}
        run: |
          set -euo pipefail

          wait_for_workflow() {
            local workflow="$1"
            local label="$2"
            local run_id=""

            for attempt in $(seq 1 80); do
              run_id="$(gh api \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=${TARGET_BRANCH}&event=workflow_dispatch&per_page=30" \
                --jq ".workflow_runs | map(select(.head_sha == \"${FINAL_SHA}\")) | sort_by(.created_at) | last | .id // empty")"
              [[ -n "$run_id" ]] && break
              sleep 5
            done
            [[ -n "$run_id" ]] || { echo "${label}: dispatched run not found" >&2; return 1; }

            for attempt in $(seq 1 240); do
              status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status)"
              conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // ""')"
              echo "${label} run ${run_id}: status=${status} conclusion=${conclusion:-pending}"
              if [[ "$status" == "completed" ]]; then
                [[ "$conclusion" == "success" ]]
                return
              fi
              sleep 15
            done
            echo "${label}: run ${run_id} did not complete inside the gate" >&2
            return 1
          }

          wait_for_workflow "$CI_WORKFLOW" "Authoritative CI"
          wait_for_workflow "$CODEQL_WORKFLOW" "CodeQL"

      - name: Reconfirm zero open alerts on the final branch commit
        env:
          FINAL_SHA: ${{ steps.final_commit.outputs.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&ref=refs%2Fheads%2F${TARGET_BRANCH//\//%2F}&per_page=100" \
              --slurp | jq 'add // []' > /tmp/final-alerts.json
            count="$(jq 'length' /tmp/final-alerts.json)"
            [[ "$count" == "0" ]] && break
            [[ "$attempt" == "18" ]] || sleep 10
          done
          count="$(jq 'length' /tmp/final-alerts.json)"
          if [[ "$count" != "0" ]]; then
            jq -r '.[] | "UNRESOLVED #\(.number) \(.rule.id) \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)"' /tmp/final-alerts.json
            exit 1
          fi

      - name: Merge through repository protection rules
        env:
          FINAL_SHA: ${{ steps.final_commit.outputs.sha }}
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$TARGET_BRANCH" --json number --jq '.[0].number // empty')"
          [[ -n "$pr_number" ]] || { echo "Open PR for ${TARGET_BRANCH} not found" >&2; exit 1; }

          gh pr merge "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --merge \
            --delete-branch \
            --match-head-commit "$FINAL_SHA"

          merged="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json mergedAt --jq '.mergedAt // empty')"
          [[ -n "$merged" ]] || { echo "PR #${pr_number} was not merged" >&2; exit 1; }

          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)"
          echo "Merged PR #${pr_number}; main=${main_sha}"
          echo "MAIN_SHA=${main_sha}" >> "$GITHUB_ENV"

      - name: Reanalyze main and require default-branch alerts to close
        env:
          CODEQL_WORKFLOW: ${{ steps.prepare.outputs.codeql_workflow }}
        run: |
          set -euo pipefail
          gh workflow run "$CODEQL_WORKFLOW" --ref main

          run_id=""
          for attempt in $(seq 1 80); do
            run_id="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${CODEQL_WORKFLOW}/runs?branch=main&event=workflow_dispatch&per_page=30" \
              --jq ".workflow_runs | map(select(.head_sha == \"${MAIN_SHA}\")) | sort_by(.created_at) | last | .id // empty")"
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          [[ -n "$run_id" ]] || { echo "Main CodeQL run was not found" >&2; exit 1; }

          for attempt in $(seq 1 240); do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status)"
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // ""')"
            echo "Main CodeQL run ${run_id}: status=${status} conclusion=${conclusion:-pending}"
            if [[ "$status" == "completed" ]]; then
              [[ "$conclusion" == "success" ]]
              break
            fi
            sleep 15
          done

          for attempt in $(seq 1 24); do
            gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&ref=refs%2Fheads%2Fmain&per_page=100" \
              --slurp | jq 'add // []' > /tmp/main-alerts.json
            count="$(jq 'length' /tmp/main-alerts.json)"
            [[ "$count" == "0" ]] && break
            [[ "$attempt" == "24" ]] || sleep 10
          done
          count="$(jq 'length' /tmp/main-alerts.json)"
          if [[ "$count" != "0" ]]; then
            jq -r '.[] | "OPEN ON MAIN #\(.number) \(.rule.id) \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)"' /tmp/main-alerts.json
            exit 1
          fi
          echo "Code scanning open alerts on main: 0"
