name: Studio seven-day saturation campaign
run-name: Studio campaign [${{ inputs.lane_id }}] · ${{ inputs.mode }} · research=${{ inputs.refresh_research }} · ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      lane_id:
        description: "Configured implementation lane id"
        required: true
        type: string
      mode:
        description: "Author one bounded patch or refresh research only"
        required: true
        default: author
        type: choice
        options:
          - author
          - research-only
      refresh_research:
        description: "Refresh official product and paper signals"
        required: true
        default: false
        type: boolean
      force_active:
        description: "Run one deliberate lane outside the configured window"
        required: true
        default: false
        type: boolean

concurrency:
  group: studio-thirty-lane-worker-${{ inputs.lane_id }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      base_sha: ${{ steps.base.outputs.base_sha }}
      lane_id: ${{ steps.lane.outputs.lane_id }}
      lane_title: ${{ steps.lane.outputs.lane_title }}
      window_active: ${{ steps.window.outputs.active }}
      can_author: ${{ steps.plan.outputs.can_author }}
      issue_number: ${{ steps.plan.outputs.issue_number }}
      track: ${{ steps.plan.outputs.track }}
      has_codex_key: ${{ steps.codex_key.outputs.present }}
    env:
      GH_TOKEN: ${{ github.token }}
      CAMPAIGN_DIR: ${{ runner.temp }}/studio-thirty-lane-plan
      LANE_ID: ${{ inputs.lane_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Record exact main base
        id: base
        shell: bash
        run: echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve campaign window
        id: window
        shell: bash
        env:
          FORCE_ACTIVE: ${{ inputs.force_active }}
        run: |
          set -euo pipefail
          config='docs/automation/studio-seven-day-campaign.json'
          start_at="$(jq -r '.startAt' "$config")"
          end_at="$(jq -r '.endAt' "$config")"
          now_epoch="$(date -u +%s)"
          start_epoch="$(date -u -d "$start_at" +%s)"
          end_epoch="$(date -u -d "$end_at" +%s)"
          active=false
          if [[ "$FORCE_ACTIVE" == "true" ]] \
            || [[ "$now_epoch" -ge "$start_epoch" && "$now_epoch" -lt "$end_epoch" ]]; then
            active=true
          fi
          echo "active=$active" >> "$GITHUB_OUTPUT"

      - name: Detect optional Codex authoring credential
        id: codex_key
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -n "${OPENAI_API_KEY:-}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize and validate isolated lane config
        id: lane
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CAMPAIGN_DIR"
          config='docs/automation/studio-seven-day-campaign.json'
          jq -e --arg lane "$LANE_ID" \
            '.lanes[] | select(.id == $lane)' "$config" >/dev/null
          jq --arg lane "$LANE_ID" '
            . as $root
            | (.lanes[] | select(.id == $lane)) as $laneConfig
            | $root
            | .issueQueue = $laneConfig.issueQueue
            | .fallbackTracks = $laneConfig.fallbackTracks
            | .maxOpenCampaignPullRequests = ($laneConfig.maxOpenPullRequests // 1)
            | .branchPrefix = ($root.branchPrefix + $laneConfig.id + "-")
            | .activeLane = $laneConfig
          ' "$config" > "$CAMPAIGN_DIR/campaign-config.json"
          node scripts/studio-seven-day-campaign.mjs \
            --config "$CAMPAIGN_DIR/campaign-config.json" \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "$CAMPAIGN_DIR/config-probe.json"
          echo "lane_id=$LANE_ID" >> "$GITHUB_OUTPUT"
          echo "lane_title=$(jq -r '.activeLane.title' "$CAMPAIGN_DIR/campaign-config.json")" >> "$GITHUB_OUTPUT"

      - name: Read lane issue and open pull requests
        shell: bash
        run: |
          set -euo pipefail
          : > "$CAMPAIGN_DIR/issues.ndjson"
          while IFS= read -r issue_number; do
            gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}" \
              >> "$CAMPAIGN_DIR/issues.ndjson"
            printf '\n' >> "$CAMPAIGN_DIR/issues.ndjson"
          done < <(jq -r '.issueQueue[]' "$CAMPAIGN_DIR/campaign-config.json")
          jq -s '.' "$CAMPAIGN_DIR/issues.ndjson" > "$CAMPAIGN_DIR/issues.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            > "$CAMPAIGN_DIR/pulls.json"

      - name: Refresh product and research signals
        if: ${{ steps.window.outputs.active == 'true' && inputs.refresh_research == true }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/studio-competitor-watch.mjs \
            --all --concurrency 4 --timeout-ms 15000 \
            --output "$CAMPAIGN_DIR/mature-products.json" \
            --markdown "$CAMPAIGN_DIR/mature-products.md"
          node scripts/studio-emerging-product-watch.mjs \
            --concurrency 4 --timeout-ms 15000 \
            --output "$CAMPAIGN_DIR/emerging-products.json" \
            --markdown "$CAMPAIGN_DIR/emerging-products.md"
          node scripts/studio-research-watch.mjs \
            --concurrency 4 --timeout-ms 20000 \
            --output "$CAMPAIGN_DIR/research.json" \
            --markdown "$CAMPAIGN_DIR/research.md"

      - name: Use empty signals in non-refreshing lanes
        if: ${{ steps.window.outputs.active != 'true' || inputs.refresh_research != true }}
        shell: bash
        run: |
          printf '%s\n' '{"results":[],"aggregateHash":"lane-did-not-refresh"}' > "$CAMPAIGN_DIR/mature-products.json"
          printf '%s\n' '{"results":[],"aggregateHash":"lane-did-not-refresh"}' > "$CAMPAIGN_DIR/emerging-products.json"
          printf '%s\n' '{"entries":[],"queryReports":[],"aggregateHash":"lane-did-not-refresh"}' > "$CAMPAIGN_DIR/research.json"

      - name: Build bounded lane plan and prompt
        id: plan
        shell: bash
        env:
          FORCE_ACTIVE: ${{ inputs.force_active }}
        run: |
          set -euo pipefail
          force_args=()
          [[ "$FORCE_ACTIVE" != "true" ]] || force_args+=(--force-active)
          node scripts/studio-seven-day-campaign.mjs \
            --config "$CAMPAIGN_DIR/campaign-config.json" \
            --issues "$CAMPAIGN_DIR/issues.json" \
            --pulls "$CAMPAIGN_DIR/pulls.json" \
            --research "$CAMPAIGN_DIR/research.json" \
            --mature-products "$CAMPAIGN_DIR/mature-products.json" \
            --emerging-products "$CAMPAIGN_DIR/emerging-products.json" \
            --output "$CAMPAIGN_DIR/plan.json" \
            --prompt "$CAMPAIGN_DIR/prompt.md" \
            --github-output "$GITHUB_OUTPUT" \
            "${force_args[@]}"
          if jq -e '
            .window.active == true
            and (.openCampaignPullRequests | length) == 0
            and .selectedIssue == null
          ' "$CAMPAIGN_DIR/plan.json" >/dev/null; then
            echo "can_author=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo
            echo "Thirty-lane boundary"
            echo "--------------------"
            echo "Lane: $(jq -r '.activeLane.id' "$CAMPAIGN_DIR/campaign-config.json")"
            echo "Purpose: $(jq -r '.activeLane.title' "$CAMPAIGN_DIR/campaign-config.json")"
            echo "Focus: $(jq -r '.activeLane.focusTerms | join(", ")' "$CAMPAIGN_DIR/campaign-config.json")"
            echo "Preferred path families: $(jq -r '.activeLane.pathHints | join(", ")' "$CAMPAIGN_DIR/campaign-config.json")"
            echo
            echo "Other lanes are working concurrently. Prefer the listed path families, avoid shared hotspot files, and keep one atomic end-to-end slice."
            echo "The privileged admission job rejects exact file overlap with every open campaign PR."
          } >> "$CAMPAIGN_DIR/prompt.md"

      - name: Upload lane plan
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: studio-thirty-lane-plan-${{ github.run_id }}-${{ inputs.lane_id }}
          path: ${{ runner.temp }}/studio-thirty-lane-plan/
          retention-days: 21
          if-no-files-found: error

  generate-patch:
    needs: plan
    if: >-
      needs.plan.outputs.window_active == 'true' &&
      needs.plan.outputs.can_author == 'true' &&
      needs.plan.outputs.has_codex_key == 'true' &&
      inputs.mode == 'author'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    outputs:
      has_patch: ${{ steps.inspect.outputs.has_patch }}
      changed_files: ${{ steps.inspect.outputs.changed_files }}
      changed_lines: ${{ steps.inspect.outputs.changed_lines }}
    env:
      CAMPAIGN_INPUT: ${{ runner.temp }}/studio-thirty-lane-plan
      CAMPAIGN_OUTPUT: ${{ runner.temp }}/studio-thirty-lane-patch
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: studio-thirty-lane-plan-${{ github.run_id }}-${{ inputs.lane_id }}
          path: ${{ runner.temp }}/studio-thirty-lane-plan

      - name: Prepare isolated patch output
        run: mkdir -p "$CAMPAIGN_OUTPUT"

      - name: Run isolated Codex authoring
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          codex-version: "0.152.1"
          model: "gpt-5.3-codex"
          effort: "high"
          prompt-file: ${{ runner.temp }}/studio-thirty-lane-plan/prompt.md
          output-file: ${{ runner.temp }}/studio-thirty-lane-patch/codex-final.md
          allow-bots: "true"
          allow-bot-users: "github-actions[bot]"

      - name: Admit and validate generated patch
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CAMPAIGN_OUTPUT"
          git add -N -- .
          if git diff --quiet HEAD --; then
            echo "has_patch=false" >> "$GITHUB_OUTPUT"
            echo "changed_files=0" >> "$GITHUB_OUTPUT"
            echo "changed_lines=0" >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"ok":true,"empty":true}' > "$CAMPAIGN_OUTPUT/policy.json"
            exit 0
          fi
          node scripts/studio-campaign-patch-policy.mjs \
            --base HEAD \
            --config "$CAMPAIGN_INPUT/campaign-config.json" \
            --output "$CAMPAIGN_OUTPUT/policy.json" \
            --github-output "$GITHUB_OUTPUT"
          mapfile -t focused_tests < <(
            git diff --name-only HEAD -- \
              | grep -E '\.(test|spec)\.[cm]?[jt]sx?$|^scripts/.*\.test\.mjs$' \
              || true
          )
          if (( ${#focused_tests[@]} > 0 )); then
            mapfile -t node_tests < <(printf '%s\n' "${focused_tests[@]}" | grep -E '^scripts/.*\.test\.mjs$' || true)
            mapfile -t vitest_tests < <(printf '%s\n' "${focused_tests[@]}" | grep -vE '^scripts/.*\.test\.mjs$' || true)
            (( ${#node_tests[@]} == 0 )) || node --test "${node_tests[@]}"
            (( ${#vitest_tests[@]} == 0 )) || pnpm exec vitest run "${vitest_tests[@]}"
          fi
          pnpm run lint:quick
          pnpm run typecheck
          git diff --check HEAD --
          git diff --binary HEAD -- > "$CAMPAIGN_OUTPUT/studio-campaign.patch"
          cp "$CAMPAIGN_INPUT/plan.json" "$CAMPAIGN_OUTPUT/plan.json"
          cp "$CAMPAIGN_INPUT/campaign-config.json" "$CAMPAIGN_OUTPUT/campaign-config.json"
          echo "has_patch=true" >> "$GITHUB_OUTPUT"

      - name: Upload isolated patch
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: studio-thirty-lane-patch-${{ github.run_id }}-${{ inputs.lane_id }}
          path: ${{ runner.temp }}/studio-thirty-lane-patch/
          retention-days: 21
          if-no-files-found: ignore

  open-pull-request:
    needs: [plan, generate-patch]
    if: >-
      needs.generate-patch.result == 'success' &&
      needs.generate-patch.outputs.has_patch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: studio-campaign-pr-admission
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: ${{ needs.plan.outputs.base_sha }}
      ISSUE_NUMBER: ${{ needs.plan.outputs.issue_number }}
      TRACK: ${{ needs.plan.outputs.track }}
      LANE_ID: ${{ needs.plan.outputs.lane_id }}
      LANE_TITLE: ${{ needs.plan.outputs.lane_title }}
      PATCH_DIR: ${{ runner.temp }}/studio-thirty-lane-patch
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: studio-thirty-lane-patch-${{ github.run_id }}-${{ inputs.lane_id }}
          path: ${{ runner.temp }}/studio-thirty-lane-patch

      - name: Require exact current main
        id: fresh
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "$BASE_SHA" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Apply and independently recheck patch
        if: ${{ steps.fresh.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git apply --index --whitespace=error-all "$PATCH_DIR/studio-campaign.patch"
          node scripts/studio-campaign-patch-policy.mjs \
            --base HEAD \
            --config "$PATCH_DIR/campaign-config.json"
          git diff --cached --check

      - name: Reject exact file overlap with open campaign PRs
        id: conflicts
        if: ${{ steps.fresh.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          current_files="$RUNNER_TEMP/current-files.txt"
          conflicts="$RUNNER_TEMP/conflicts.txt"
          git diff --cached --name-only --diff-filter=ACMRTUXB | sort -u > "$current_files"
          : > "$conflicts"
          pulls_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100")"
          while IFS= read -r pull_number; do
            existing="$(mktemp)"
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${pull_number}/files?per_page=100" \
              --jq '.[].filename' | sort -u > "$existing"
            comm -12 "$current_files" "$existing" >> "$conflicts"
            rm -f "$existing"
          done < <(
            jq -r --arg repo "$GITHUB_REPOSITORY" '
              .[]
              | select(.base.ref == "main")
              | select(.head.repo.full_name == $repo)
              | select(.head.ref | startswith("codex/campaign-"))
              | .number
            ' <<< "$pulls_json"
          )
          sort -u -o "$conflicts" "$conflicts"
          if [[ -s "$conflicts" ]]; then
            echo "conflict_free=false" >> "$GITHUB_OUTPUT"
            sed 's/^/- /' "$conflicts" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "conflict_free=true" >> "$GITHUB_OUTPUT"

      - name: Commit isolated lane
        id: commit
        if: ${{ steps.fresh.outputs.ready == 'true' && steps.conflicts.outputs.conflict_free == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          issue_slug="${ISSUE_NUMBER:-research}"
          branch="codex/campaign-${LANE_ID}-${issue_slug}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(studio): advance ${LANE_ID} campaign ${issue_slug}"
          git push --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open auto-merge eligible lane PR
        if: ${{ steps.fresh.outputs.ready == 'true' && steps.conflicts.outputs.conflict_free == 'true' }}
        shell: bash
        env:
          BRANCH: ${{ steps.commit.outputs.branch }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
        run: |
          set -euo pipefail
          issue_title="$(jq -r '.selectedIssue.title // .track' "$PATCH_DIR/plan.json")"
          short_title="$(printf '%s' "$issue_title" | cut -c1-90)"
          {
            echo '<!-- studio-automerge -->'
            echo "<!-- studio-campaign-lane:${LANE_ID} -->"
            echo
            [[ -z "${ISSUE_NUMBER:-}" ]] || echo "Progresses #${ISSUE_NUMBER}"
            echo
            echo "## Autonomous thirty-lane campaign slice"
            echo
            echo "- Lane: \`${LANE_ID}\` — ${LANE_TITLE}"
            echo "- Track: \`${TRACK}\`"
            echo "- Exact base: \`${BASE_SHA}\`"
            echo "- Commit: \`${COMMIT_SHA}\`"
            echo "- Changed files: ${{ needs.generate-patch.outputs.changed_files }}"
            echo "- Changed lines: ${{ needs.generate-patch.outputs.changed_lines }}"
            echo
            echo "## Codex report"
            cat "$PATCH_DIR/codex-final.md"
            echo
            echo "## Admission"
            echo '```json'
            cat "$PATCH_DIR/policy.json"
            echo '```'
            echo
            echo "Exact-file overlap was checked against every open campaign PR. Full merge-ref release gates still apply."
          } > "$PATCH_DIR/pull-request.md"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "feat(studio): [${LANE_ID}] ${short_title}" \
            --body-file "$PATCH_DIR/pull-request.md"
