name: Apply creator film readiness verifier fix

on:
  push:
    branches:
      - chore/architecture-sonar-cleanup
    paths:
      - .github/workflows/creator-home-readiness-fix.yml

permissions:
  contents: write

concurrency:
  group: creator-home-readiness-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/architecture-sonar-cleanup
          fetch-depth: 1
      - name: Replace the event-racy readiness assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/verify-creator-home.mjs')
          source = path.read_text(encoding='utf-8')
          before = '''      await video.evaluate((element) => new Promise((resolve, reject) => {
                if (element.readyState >= 2) return resolve(true);
                const timer = setTimeout(() => reject(new Error("Video readiness timeout")), 20000);
                element.addEventListener("loadeddata", () => { clearTimeout(timer); resolve(true); }, { once: true });
                element.addEventListener("error", () => { clearTimeout(timer); reject(new Error("Video decoding failed")); }, { once: true });
              }));'''
          after = '''      // Poll the media state instead of subscribing to a single loadeddata event.
              // Fast local/CI decoders can emit loadeddata between the click and listener setup,
              // leaving a visibly playing video behind a false timeout.
              await expect.poll(
                () => video.evaluate((element) => element.error ? -element.error.code : element.readyState),
                {
                  message: "Brand film reaches HAVE_CURRENT_DATA without a media error",
                  timeout: 30000,
                },
              ).toBeGreaterThanOrEqual(2);'''
          count = source.count(before)
          if count != 1:
              raise SystemExit(f'expected exactly one readiness block, found {count}')
          path.write_text(source.replace(before, after), encoding='utf-8')
          PY
          node --check scripts/verify-creator-home.mjs
      - name: Commit the verified fix and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/creator-home-readiness-fix.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ci): poll creator film readiness state'
          git push origin HEAD:chore/architecture-sonar-cleanup
