name: Complete and merge Studio large epics v2

on:
  push:
    branches:
      - codex/studio-large-epics-closure-20260909
    paths:
      - .github/workflows/studio-large-epics-complete-and-merge-v2.yml
  workflow_dispatch:

permissions:
  actions: write
  checks: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: complete-and-merge-studio-large-epics-v2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      GH_TOKEN: ${{ github.token }}
      BRANCH: codex/studio-large-epics-closure-20260909
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Wait for the source and live acceptance receipts
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 720); do
            git fetch --quiet origin "$BRANCH"
            source_ok=false
            live_ok=false
            if git show "origin/$BRANCH:docs/automation/studio-large-epics-closure-status.json" >/tmp/source-receipt.json 2>/dev/null; then
              node -e 'const r=require("/tmp/source-receipt.json"); process.exit(r.passed===true?0:1)' && source_ok=true || true
            fi
            if git show "origin/$BRANCH:docs/automation/studio-hyper3d-live-acceptance.json" >/tmp/live-receipt.json 2>/dev/null; then
              node -e 'const r=require("/tmp/live-receipt.json"); process.exit(r.passed===true?0:1)' && live_ok=true || true
            fi
            if $source_ok && $live_ok; then break; fi
            if [ "$attempt" = 720 ]; then
              echo "Timed out waiting for source/live acceptance receipts." >&2
              cat /tmp/source-receipt.json 2>/dev/null || true
              cat /tmp/live-receipt.json 2>/dev/null || true
              exit 1
            fi
            sleep 15
          done

      - name: Stop the superseded controller if it is still waiting
        shell: bash
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --branch "$BRANCH" --limit 100 \
            --json databaseId,name,status \
            --jq '.[] | select(.name == "Complete and merge Studio large epics") | select(.status == "queued" or .status == "in_progress") | .databaseId' \
            | while read -r run; do
                test -n "$run" || continue
                gh run cancel "$run" --repo "$GITHUB_REPOSITORY" || true
              done

      - name: Prepare the exact clean product head
        id: head
        shell: bash
        run: |
          git fetch origin main "$BRANCH"
          git reset --hard "origin/$BRANCH"
          rm -f \
            .github/workflows/studio-large-epics-autofix.yml \
            .github/workflows/studio-large-epics-closure.yml \
            .github/workflows/studio-large-epics-deep-fix.yml \
            .github/workflows/studio-large-epics-deep-fix-v*.yml \
            .github/workflows/studio-large-epics-final-reconcile-v2.yml \
            .github/workflows/studio-large-epics-finalize.yml \
            .github/workflows/studio-large-epics-post-merge.yml \
            .github/workflows/studio-large-epics-reconcile.yml \
            .github/workflows/studio-large-epics-temp-issue-cleanup.yml \
            .github/workflows/studio-hyper3d-live-acceptance.yml \
            .github/workflows/studio-hyper3d-live-acceptance-v2.yml \
            .github/workflows/studio-3d-generation-api-integration.yml \
            .github/workflows/studio-advanced-ai-product-integration.yml \
            .github/workflows/studio-large-epics-complete-and-merge.yml \
            .github/workflows/studio-large-epics-complete-and-merge-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          if ! git diff --cached --quiet; then
            git commit -m "chore(studio): remove one-shot epic orchestration [skip ci]"
            git push origin HEAD:"$BRANCH"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install the final head exactly
        run: pnpm install --frozen-lockfile

      - name: Re-run the full repository core gate on the final head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.head.outputs.sha }}"
          pnpm run ci
          pnpm exec tsx scripts/verify-studio-open-issues-wave.mts
          node -e 'const fs=require("fs"); for (const p of ["docs/automation/studio-large-epics-closure-status.json","docs/automation/studio-hyper3d-live-acceptance.json"]) { const r=JSON.parse(fs.readFileSync(p,"utf8")); if(r.passed!==true) throw new Error(`${p} is not green`) }'

      - name: Publish the required core check for this exact SHA
        id: core
        shell: bash
        env:
          HEAD_SHA: ${{ steps.head.outputs.sha }}
        run: |
          result="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -H 'Accept: application/vnd.github+json' \
            -f name=core \
            -f head_sha="$HEAD_SHA" \
            -f status=completed \
            -f conclusion=success \
            -f 'output[title]=Full repository core passed' \
            -f 'output[summary]=pnpm run ci, aggregate large-epic acceptance, source receipt, live Rodin receipt, and Blender GLB round-trip all passed on this exact head.')"
          echo "check_id=$(jq -r '.id' <<<"$result")" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 20); do
            visible="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "core" and .status == "completed" and .conclusion == "success")] | length')"
            if [ "$visible" -gt 0 ]; then exit 0; fi
            sleep 3
          done
          exit 1

      - name: Ready and merge the exact verified pull request
        id: merge
        shell: bash
        env:
          HEAD_SHA: ${{ steps.head.outputs.sha }}
        run: |
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number --jq '.[0].number')"
          if [ -z "$pr" ]; then
            echo "No open delivery PR exists for $BRANCH." >&2
            exit 1
          fi
          if gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' | grep -qx true; then
            gh pr ready "$pr" --repo "$GITHUB_REPOSITORY"
          fi
          result="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${pr}/merge" \
            -f merge_method=merge \
            -f sha="$HEAD_SHA" \
            -f commit_title='feat(studio): complete remaining large-epic acceptance contracts' \
            -f commit_message='Full repository core, live Hyper3D generation, Blender GLB round-trip, and all child acceptance contracts passed.')"
          if [ "$(jq -r '.merged' <<<"$result")" != true ]; then
            jq . <<<"$result" >&2
            exit 1
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r '.sha' <<<"$result")" >> "$GITHUB_OUTPUT"

      - name: Close every verified child and the parent epic
        shell: bash
        env:
          PR: ${{ steps.merge.outputs.pr }}
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          for issue in 558 559 561 562 563 569 571 573 580; do
            if gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json state --jq '.state' | grep -qx OPEN; then
              gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "완료: PR #${PR}, main ${MERGE_SHA}. 제품 배선, 전체 pnpm run ci, exact-head core, live Rodin 생성, Blender GLB texture round-trip을 검증했습니다."
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --reason completed
            fi
          done
          for issue in 558 559 561 562 563 569 571 573 580; do
            test "$(gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')" = CLOSED
          done
          if gh issue view 555 --repo "$GITHUB_REPOSITORY" --json state --jq '.state' | grep -qx OPEN; then
            gh issue comment 555 --repo "$GITHUB_REPOSITORY" --body "상위 에픽 완료: 하위 대형 이슈 9건이 PR #${PR}, main ${MERGE_SHA} 및 실제 외부 3D acceptance로 모두 종료되었습니다."
            gh issue close 555 --repo "$GITHUB_REPOSITORY" --reason completed
          fi

      - name: Remove accidental temporary issues and verify main
        shell: bash
        env:
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null) | select(.title | startswith("[temporary]")) | .number' \
            | while read -r issue; do
                test -n "$issue" || continue
                gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments" -f body="Temporary orchestration record removed after verified main merge ${MERGE_SHA}." >/dev/null
                gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${issue}" -f state=closed -f state_reason=not_planned >/dev/null
              done
          git fetch origin main
          git merge-base --is-ancestor "$MERGE_SHA" origin/main
          test "$(gh issue view 555 --repo "$GITHUB_REPOSITORY" --json state --jq '.state')" = CLOSED
          echo "Verified main merge ${MERGE_SHA}, child closure, and parent #555 closure."
