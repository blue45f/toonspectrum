name: Apply ToonStudio seller center once

on:
  push:
    branches:
      - feat/toonstudio-session-completion-followup-20260911
    paths:
      - .github/workflows/apply-toonstudio-seller-center.yml

permissions:
  contents: write

concurrency:
  group: validate-toonstudio-continuation-once
  cancel-in-progress: false

jobs:
  integrate-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "true"
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout continuation branch
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-session-completion-followup-20260911
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Wire seller center and repair concurrent file persistence
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, *, already: str | None = None) -> None:
              file = Path(path)
              text = file.read_text()
              if already and already in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          hub = "apps/web/src/domains/creator/studio-shell/StudioAssetHubPage.tsx"
          replace_once(
              hub,
              'import { StudioAssetGovernancePanel } from "./StudioAssetGovernancePanel";\n',
              'import { StudioAssetGovernancePanel } from "./StudioAssetGovernancePanel";\nimport { StudioMarketplaceSellerPanel } from "./StudioMarketplaceSellerPanel";\n',
              already='from "./StudioMarketplaceSellerPanel"',
          )
          replace_once(
              hub,
              '      {view === "seller" ? <MarketManagePage /> : null}\n',
              '''      {view === "seller" ? (\n        <>\n          <MarketManagePage />\n          <Container size="wide" className="pb-10 sm:pb-14">\n            <StudioMarketplaceSellerPanel\n              sellerId={projectId ?? "current-seller"}\n              locale={locale}\n            />\n          </Container>\n        </>\n      ) : null}\n''',
              already='<StudioMarketplaceSellerPanel',
          )

          panel = "apps/web/src/domains/creator/studio-shell/StudioMarketplaceSellerPanel.tsx"
          replace_once(
              panel,
              '''      const nextFile = Object.freeze({\n        path: `${role}/${file.name}`,\n        role,\n        format: extension(file.name),\n        sizeBytes: file.size,\n        checksum: await checksum(file),\n      });\n      commit({\n        ...submission,\n        files: Object.freeze([\n          ...submission.files.filter((item) => item.role !== role),\n          nextFile,\n        ]),\n        updatedAt: new Date().toISOString(),\n      }, locale === "ko" ? `${file.name}의 무결성을 확인했습니다.` : `Verified ${file.name}.`);''',
              '''      const nextFile = Object.freeze({\n        path: `${role}/${file.name}`,\n        role,\n        format: extension(file.name),\n        sizeBytes: file.size,\n        checksum: await checksum(file),\n      });\n      setSubmission((current) => {\n        const next = {\n          ...current,\n          files: Object.freeze([\n            ...current.files.filter((item) => item.role !== role),\n            nextFile,\n          ]),\n          updatedAt: new Date().toISOString(),\n        };\n        return typeof window === "undefined"\n          ? next\n          : writeStudioMarketplaceSubmissionDraft(window.localStorage, next, window);\n      });\n      setMessage(locale === "ko" ? `${file.name}의 무결성을 확인했습니다.` : `Verified ${file.name}.`);''',
              already='setSubmission((current) => {\n        const next = {\n          ...current,\n          files:',
          )

          ui_test = "apps/web/src/domains/creator/studio-shell/StudioMarketplaceSellerPanel.test.tsx"
          text = Path(ui_test).read_text()
          old = '''    fireEvent.change(inputs[0]!, { target: { files: [product] } });\n    fireEvent.change(inputs[1]!, { target: { files: [preview] } });\n\n    await waitFor(() => {\n      expect(globalThis.crypto.subtle.digest).toHaveBeenCalledTimes(2);'''
          new = '''    fireEvent.change(inputs[0]!, { target: { files: [product] } });\n    await waitFor(() => {\n      expect(window.localStorage.getItem(\n        "toonspectrum:studio-marketplace-submission:v1:seller-files",\n      )).toContain("primary/ink.toon-brush");\n    });\n    fireEvent.change(inputs[1]!, { target: { files: [preview] } });\n\n    await waitFor(() => {\n      expect(globalThis.crypto.subtle.digest).toHaveBeenCalledTimes(2);'''
          if old in text:
              text = text.replace(old, new, 1)
          Path(ui_test).write_text(text)

          reachability = Path("scripts/verify-toonstudio-feature-reachability.mjs")
          text = reachability.read_text()
          marker = '  "apps/web/src/domains/creator/studio-marketplace-submission.ts",\n'
          additions = [
              '  "apps/web/src/domains/creator/studio-marketplace-submission-store.ts",\n',
              '  "apps/web/src/domains/creator/studio-shell/StudioMarketplaceSellerPanel.tsx",\n',
          ]
          for addition in additions:
              if addition.strip() in text:
                  continue
              if marker not in text:
                  raise SystemExit("feature reachability marketplace marker missing")
              text = text.replace(marker, marker + addition, 1)
          reachability.write_text(text)

          closure = Path("apps/web/src/domains/creator/studio-integration-closure.test.ts")
          text = closure.read_text()
          if "connects the functional seller workflow" not in text:
              closing = "\n});\n"
              if not text.endswith(closing):
                  raise SystemExit("integration closure ending missing")
              test = '''\n  it("connects the functional seller workflow without claiming remote completion", () => {\n    const assetHub = source("apps/web/src/domains/creator/studio-shell/StudioAssetHubPage.tsx");\n    const seller = source("apps/web/src/domains/creator/studio-shell/StudioMarketplaceSellerPanel.tsx");\n    const store = source("apps/web/src/domains/creator/studio-marketplace-submission-store.ts");\n\n    expect(assetHub).toContain("<StudioMarketplaceSellerPanel");\n    expect(assetHub).toContain("<MarketManagePage");\n    expect(seller).toContain("crypto.subtle.digest");\n    expect(seller).toContain("evaluateStudioMarketplaceSubmission");\n    expect(seller).toContain("transitionStudioMarketplaceSubmission");\n    expect(seller).not.toContain("업로드 완료");\n    expect(seller).not.toContain("판매 완료");\n    expect(store).toContain("STUDIO_MARKETPLACE_SUBMISSION_UPDATED_EVENT");\n  });\n'''
              text = text[:-len(closing)] + test + closing
              closure.write_text(text)

          # All one-shot writers must be absent before the closure test and final commit.
          for value in [
              ".github/workflows/apply-toonstudio-seller-center.yml",
              ".github/workflows/apply-toonstudio-continuation.yml",
              ".github/workflows/repair-toonstudio-continuation.yml",
              ".github/workflows/validate-toonstudio-continuation.yml",
              ".github/workflows/toonstudio-continuation-source-snapshot.yml",
              ".github/workflows/toonstudio-followup-source-snapshot.yml",
              ".github/workflows/finalize-toonstudio-session.yml",
              ".github/workflows/apply-toonstudio-session-fixes.yml",
              ".github/workflows/apply-toonstudio-session-fixes-retry.yml",
              ".github/workflows/toonstudio-final-sync-v2.yml",
              ".github/workflows/repair-sync-toonstudio-session.yml",
              ".github/workflows/install-toonstudio-session-gate.yml",
              ".github/workflows/apply-toonstudio-project-contract-repair.yml",
          ]:
              Path(value).unlink(missing_ok=True)
          PY

      - name: Format and lint full continuation delta
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -t files < <((git diff --name-only origin/main...HEAD; git diff --name-only) | sort -u | grep -E '\.(ts|tsx|mjs)$' || true)
          if ((${#files[@]})); then
            pnpm exec prettier --write "${files[@]}"
            pnpm exec eslint --fix --no-warn-ignored "${files[@]}"
          fi
          git diff --check

      - name: Typecheck whole workspace
        run: pnpm exec tsc -p tsconfig.json --noEmit --pretty false

      - name: Run seller and continuation tests
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/studio-marketplace-submission-store.test.ts
          apps/web/src/domains/creator/studio-marketplace-submission.test.ts
          apps/web/src/domains/creator/studio-template-catalog.test.ts
          apps/web/src/domains/creator/studio-external-route.test.ts
          apps/web/src/domains/creator/studio-route-registry.test.ts
          apps/web/src/domains/creator/studio-product-ia.test.ts
          apps/web/src/domains/creator/studio-project-view-destinations.test.ts
          apps/web/src/domains/creator/studio-integration-closure.test.ts
          apps/web/src/domains/creator/studio-asset-governance.test.ts
          apps/web/src/domains/creator/studio-shell/StudioMarketplaceSellerPanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioTemplatesPage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioAssetHubPage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioAssetGovernancePanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectDeliveryPanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.test.tsx
          --pool=forks --maxWorkers=2

      - name: Verify product reachability and integration
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-toonstudio-feature-reachability.mjs
          if pnpm run | grep -q 'verify:studio-ia'; then pnpm run verify:studio-ia; fi
          if pnpm run | grep -q 'verify:studio-session-complete'; then pnpm run verify:studio-session-complete; fi
          bash scripts/verify-toonstudio-integration.sh core
          bash scripts/verify-toonstudio-integration.sh ui
          bash scripts/verify-toonstudio-integration.sh editor

      - name: Build production bundle
        run: pnpm run build:bundle

      - name: Record seller-center acceptance and push
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/rewrite
          cat > docs/rewrite/toonstudio-seller-center-acceptance.md <<EOF
          # ToonStudio seller center acceptance

          - Validated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Base main: \`$(git rev-parse origin/main)\`
          - Whole-workspace TypeScript: passed
          - Continuation and seller tests: passed
          - Feature reachability: passed
          - Core, UI and editor integration: passed
          - Production bundle: passed

          Product and preview files are hashed with SHA-256 in the browser. Draft metadata, rights declarations, AI provenance, compatibility and review state are persisted per seller. Actual upload, payment and publication remain unavailable until an authenticated server connector is configured.
          EOF
          git config user.name "toonstudio-integration-bot"
          git config user.email "toonstudio-integration-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(studio): complete seller submission and delivery flows"
          git push origin HEAD:feat/toonstudio-session-completion-followup-20260911
