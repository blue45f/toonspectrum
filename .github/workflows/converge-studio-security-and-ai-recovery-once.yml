name: Converge Studio security and AI recovery once

on:
  push:
    branches:
      - fix/studio-final-ci-convergence-20260910
    paths:
      - .github/workflows/converge-studio-security-and-ai-recovery-once.yml

permissions:
  contents: write
  security-events: write

concurrency:
  group: converge-studio-security-ai-recovery-20260910
  cancel-in-progress: false

jobs:
  patch-test-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/studio-final-ci-convergence-20260910
          fetch-depth: 0
          persist-credentials: true

      - name: Merge latest protected main
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-edit origin/main

      - name: Apply secure ID and AI recovery navigation fixes
        shell: python
        run: |
          import re
          from pathlib import Path

          def replace_regex_once(path_name: str, pattern: str, replacement: str) -> None:
              path = Path(path_name)
              source = path.read_text()
              updated, count = re.subn(pattern, replacement, source, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"{path_name}: expected one replacement, found {count}")
              path.write_text(updated)

          panel = Path("apps/web/src/domains/creator/ai/StudioAiComicDirectorPanel.tsx")
          panel_source = panel.read_text()
          if 'from "./studio-ai-comic-director-id";' not in panel_source:
              panel_source, count = re.subn(
                  r'(from "\./studio-ai-comic-director-api";\n)',
                  r'\1import { createStudioAiComicDirectorId } from "./studio-ai-comic-director-id";\n',
                  panel_source,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Panel: API import boundary not found")
          panel_source, count = re.subn(
              r'function uid\(prefix: string\): string \{\n\s*return globalThis\.crypto\?\.randomUUID\?\.\(\) \?\? `\$\{prefix\}-\$\{Date\.now\(\)\.toString\(36\)\}-\$\{Math\.random\(\)\.toString\(36\)\.slice\(2, 10\)\}`;\n\}',
              'function uid(prefix: string): string {\n  return createStudioAiComicDirectorId(prefix);\n}',
              panel_source,
              count=1,
          )
          if count != 1 and "return createStudioAiComicDirectorId(prefix);" not in panel_source:
              raise SystemExit("Panel: insecure uid boundary not found")
          panel.write_text(panel_source)

          route = Path("apps/web/src/domains/creator/studio-router/routes/StudioAiComicDirectorRoute.tsx")
          route_source = route.read_text()
          if 'from "../../ai/studio-ai-comic-director-id";' not in route_source:
              route_source, count = re.subn(
                  r'(import \{ createStudioAiComicDirectorApiClient \} from "\.\./\.\./ai/studio-ai-comic-director-api";\n)',
                  r'\1import { createStudioAiComicDirectorId } from "../../ai/studio-ai-comic-director-id";\n',
                  route_source,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Route: API import boundary not found")
          route_source, count = re.subn(
              r'function uid\(\): string \{\n\s*return globalThis\.crypto\?\.randomUUID\?\.\(\)\n\s*\?\? `comic-\$\{Date\.now\(\)\.toString\(36\)\}-\$\{Math\.random\(\)\.toString\(36\)\.slice\(2, 10\)\}`;\n\}',
              'function uid(): string {\n  return createStudioAiComicDirectorId("comic");\n}',
              route_source,
              count=1,
          )
          if count != 1 and 'return createStudioAiComicDirectorId("comic");' not in route_source:
              raise SystemExit("Route: insecure uid boundary not found")
          route.write_text(route_source)

          launchpad = Path("apps/web/src/domains/creator/ai/StudioAiProductionLaunchpad.tsx")
          launchpad_source = launchpad.read_text()
          if "AI 코믹 디렉터 · 스토리 → 편집 가능한 컷" not in launchpad_source:
              launchpad_source, count = re.subn(
                  r'(\s+disabled=\{action\.disabled \|\| !action\.onClick\}\n)(\s+aria-describedby=\{descriptionId\})',
                  r'\1      aria-label={\n        action.id === "director"\n          ? "AI 코믹 디렉터 · 스토리 → 편집 가능한 컷"\n          : undefined\n      }\n\2',
                  launchpad_source,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Launchpad: action button boundary not found")
          launchpad.write_text(launchpad_source)

          launchpad_test = Path("apps/web/src/domains/creator/ai/StudioAiProductionLaunchpad.test.tsx")
          test_source = launchpad_test.read_text()
          if "AI 코믹 디렉터 · 스토리 → 편집 가능한 컷" not in test_source:
              test_source, count = re.subn(
                  r'\s+fireEvent\.click\(screen\.getByRole\("button", \{ name: /AI 코믹 디렉터/u \}\)\);\n(\s+fireEvent\.click\()',
                  '\n    const director = screen.getByRole("button", {\n      name: /AI 코믹 디렉터 · 스토리 → 편집 가능한 컷/u,\n    });\n    expect(director.getAttribute("data-studio-ai-production-action")).toBe("director");\n\n    fireEvent.click(director);\n\\1',
                  test_source,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Launchpad test: director click boundary not found")
          launchpad_test.write_text(test_source)

          Path("apps/web/src/domains/creator/ai/studio-ai-comic-director-id.ts").write_text('''export type StudioAiComicDirectorCrypto = Partial<
            Pick<Crypto, "randomUUID" | "getRandomValues">
          >;

          function normalizedIdPrefix(prefix: string): string {
            return prefix
              .normalize("NFKC")
              .replace(/[^a-zA-Z0-9_-]+/g, "-")
              .replace(/^-+|-+$/g, "")
              .slice(0, 32) || "id";
          }

          /**
           * Creates identifiers only from Web Crypto entropy. Falling back to Math.random would make
           * session and visual-bible IDs predictable, so environments without secure randomness fail
           * closed instead of silently weakening the boundary.
           */
          export function createStudioAiComicDirectorId(
            prefix: string,
            cryptoApi: StudioAiComicDirectorCrypto | undefined =
              typeof globalThis.crypto === "undefined" ? undefined : globalThis.crypto,
          ): string {
            if (typeof cryptoApi?.randomUUID === "function") {
              try {
                return cryptoApi.randomUUID();
              } catch {
                // Some embedded browsers expose randomUUID but reject the call. getRandomValues is
                // still a cryptographically secure fallback when available.
              }
            }

            if (typeof cryptoApi?.getRandomValues !== "function") {
              throw new Error("Web Crypto randomness is required to create Studio AI comic IDs.");
            }

            const bytes = new Uint8Array(16);
            cryptoApi.getRandomValues(bytes);
            const token = Array.from(
              bytes,
              (byte) => byte.toString(16).padStart(2, "0"),
            ).join("");
            return `${normalizedIdPrefix(prefix)}-${token}`;
          }
          ''')

          Path("apps/web/src/domains/creator/ai/studio-ai-comic-director-id.test.ts").write_text('''import { describe, expect, it, vi } from "vitest";

          import {
            createStudioAiComicDirectorId,
            type StudioAiComicDirectorCrypto,
          } from "./studio-ai-comic-director-id";

          describe("createStudioAiComicDirectorId", () => {
            it("prefers a secure random UUID", () => {
              const randomUUID = vi.fn(
                () => "00000000-0000-4000-8000-000000000001" as `${string}-${string}-${string}-${string}-${string}`,
              );

              expect(createStudioAiComicDirectorId("comic", { randomUUID })).toBe(
                "00000000-0000-4000-8000-000000000001",
              );
              expect(randomUUID).toHaveBeenCalledOnce();
            });

            it("uses secure random bytes when randomUUID is unavailable", () => {
              const getRandomValues = vi.fn((values: Uint8Array) => {
                values.forEach((_, index) => {
                  values[index] = index;
                });
                return values;
              }) as unknown as Crypto["getRandomValues"];
              const cryptoApi: StudioAiComicDirectorCrypto = { getRandomValues };

              expect(createStudioAiComicDirectorId("comic session", cryptoApi)).toBe(
                "comic-session-000102030405060708090a0b0c0d0e0f",
              );
              expect(getRandomValues).toHaveBeenCalledOnce();
            });

            it("falls back to secure random bytes when randomUUID throws", () => {
              const cryptoApi: StudioAiComicDirectorCrypto = {
                randomUUID: () => {
                  throw new Error("embedded browser rejection");
                },
                getRandomValues: ((values: Uint8Array) => {
                  values.fill(255);
                  return values;
                }) as unknown as Crypto["getRandomValues"],
              };

              expect(createStudioAiComicDirectorId("comic", cryptoApi)).toBe(
                `comic-${"ff".repeat(16)}`,
              );
            });

            it("fails closed when no secure randomness exists", () => {
              expect(() => createStudioAiComicDirectorId("comic", {})).toThrow(
                "Web Crypto randomness is required",
              );
            });
          });
          ''')

          for obsolete in (
              ".github/code-scanning-open-alerts.json",
              ".github/code-scanning-open-alerts.md",
              ".github/workflows/code-scanning-audit-temp.yml",
              ".github/workflows/restore-ci-after-bulk-integration.yml",
              ".github/workflows/converge-studio-security-and-ai-recovery-once.yml",
          ):
              Path(obsolete).unlink(missing_ok=True)

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Install frozen dependencies
        env:
          HUSKY: "0"
        run: pnpm install --frozen-lockfile

      - name: Verify focused security and navigation regressions
        run: |
          set -euo pipefail
          pnpm exec vitest run \
            apps/web/src/domains/creator/ai/studio-ai-comic-director-id.test.ts \
            apps/web/src/domains/creator/ai/StudioAiProductionLaunchpad.test.tsx
          pnpm exec eslint --max-warnings=0 --no-warn-ignored \
            apps/web/src/domains/creator/ai/studio-ai-comic-director-id.ts \
            apps/web/src/domains/creator/ai/studio-ai-comic-director-id.test.ts \
            apps/web/src/domains/creator/ai/StudioAiComicDirectorPanel.tsx \
            apps/web/src/domains/creator/ai/StudioAiProductionLaunchpad.tsx \
            apps/web/src/domains/creator/ai/StudioAiProductionLaunchpad.test.tsx \
            apps/web/src/domains/creator/studio-router/routes/StudioAiComicDirectorRoute.tsx
          pnpm run typecheck
          git diff --check

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript/studio-security-convergence

      - name: Commit verified convergence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          HUSKY=0 git commit -m "fix(studio): secure IDs and restore AI recovery navigation"
          HUSKY=0 git push origin HEAD:fix/studio-final-ci-convergence-20260910
