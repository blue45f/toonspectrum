# Production pushes are normally deployed by Vercel Git Integration.
# This manual fallback builds on the GitHub runner and uploads immutable prebuilt output so a
# Vercel remote-build quota incident cannot block an emergency production recovery.
name: Vercel CLI fallback deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, tag, or branch already contained in main (defaults to the triggering ref)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: vercel-production-fallback
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: "58.9.4"
      VERCEL_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Require fallback deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" || -z "${VERCEL_ORG_ID:-}" || -z "${VERCEL_PROJECT_ID:-}" ]]; then
            echo "::error::VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID are all required for the manual fallback deploy."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require a reviewed commit from the current main history
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          deploy_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor "$deploy_sha" "$main_sha"; then
            echo "::error::Ref ${{ inputs.ref || github.sha }} resolves to ${deploy_sha}, which is not contained in origin/main (${main_sha})."
            exit 1
          fi
          echo "sha=${deploy_sha}" >> "$GITHUB_OUTPUT"
          echo "main_sha=${main_sha}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install and verify pinned Vercel CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund "vercel@${VERCEL_CLI_VERSION}"
          actual_version="$(vercel --version 2>&1 | awk '/Vercel CLI/{version=$NF} END {print version}')"
          echo "Vercel CLI ${actual_version}"
          test "$actual_version" = "$VERCEL_CLI_VERSION"

      - name: Pull production project settings and environment
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build production output on the GitHub runner
        run: vercel build --prod --yes --token "$VERCEL_TOKEN"

      - name: Verify immutable prebuilt output
        shell: bash
        run: |
          set -euo pipefail
          test -f .vercel/output/config.json
          test -d .vercel/output/static
          test -d .vercel/output/functions
          test -n "$(find .vercel/output/functions -type d -name '*.func' -print -quit)"
          du -sh .vercel/output

      - name: Deploy prebuilt output to Vercel production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deployment_output="$(vercel deploy --prebuilt --prod --yes --archive=tgz --token "$VERCEL_TOKEN")"
          deployment_url="$(printf '%s\n' "$deployment_output" | awk '/^https:\/\//{url=$0} END{print url}')"
          if [[ ! "$deployment_url" =~ ^https:// ]]; then
            echo "::error::Vercel CLI did not return a production deployment URL."
            printf '%s\n' "$deployment_output"
            exit 1
          fi
          echo "url=${deployment_url}" >> "$GITHUB_OUTPUT"
          {
            echo "## Vercel production fallback"
            echo
            echo "- Requested ref: \`${{ inputs.ref || github.sha }}\`"
            echo "- Immutable commit: \`${{ steps.source.outputs.sha }}\`"
            echo "- Main at validation: \`${{ steps.source.outputs.main_sha }}\`"
            echo "- Deployment: ${deployment_url}"
            echo "- Mode: GitHub-runner prebuilt upload"
          } >> "$GITHUB_STEP_SUMMARY"
