name: Marketplace engagement and trust upgrade

on:
  push:
    branches:
      - feat/marketplace-engagement-trust-v2-20260905
    paths:
      - ".github/workflows/marketplace-engagement-upgrade.yml"
      - "scripts/marketplace/apply-engagement-trust-upgrade.py"

permissions:
  contents: write

concurrency:
  group: marketplace-engagement-upgrade
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Apply deterministic marketplace upgrade
        run: python scripts/marketplace/apply-engagement-trust-upgrade.py

      - name: Remove one-shot automation files
        run: |
          rm scripts/marketplace/apply-engagement-trust-upgrade.py
          rm .github/workflows/marketplace-engagement-upgrade.yml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed sources
        run: |
          pnpm exec prettier --write \
            src/domains/market/hooks/use-market-compare.ts \
            src/domains/market/hooks/use-market-compare.test.ts \
            src/domains/market/components/MarketCompareToggle.tsx \
            src/domains/market/components/MarketNavHeader.tsx \
            src/domains/market/components/MarketResourceCard.tsx \
            src/domains/market/components/MarketResourceCard.test.tsx \
            src/domains/market/components/MarketResourceDetailArticle.tsx \
            src/domains/market/components/MarketWebtoonSpecBadge.tsx \
            src/domains/market/components/MarketWebtoonSpecBadge.test.tsx \
            src/domains/market/components/MarketWebtoon3dViewerModal.tsx \
            src/domains/market/models/market-comparison.ts \
            src/domains/market/models/market-comparison.test.ts \
            src/domains/market/pages/MarketComparePage.tsx \
            src/domains/market/pages/MarketManagePage.tsx \
            src/app/routes/groups/market.routes.tsx \
            apps/api/src/db/creator-marketplace-library.schema.ts \
            apps/api/src/db/creator-marketplace-report.schema.ts \
            apps/api/src/modules/creator-marketplace/creator-marketplace-3d-asset-parity.test.ts \
            scripts/bootstrap-empty-production-database.mjs \
            scripts/bootstrap-empty-production-database.test.mjs \
            scripts/run-production-database-migrations.test.mjs \
            scripts/verify-creator-marketplace-db.mts

      - name: Verify patch cleanliness
        run: git diff --check

      - name: Run focused marketplace tests
        run: |
          pnpm exec vitest run \
            src/domains/market/hooks/use-market-compare.test.ts \
            src/domains/market/models/market-comparison.test.ts \
            src/domains/market/components/MarketResourceCard.test.tsx \
            src/domains/market/components/MarketWebtoonSpecBadge.test.tsx \
            src/domains/market/components/MarketWebtoon3dViewerModal.test.tsx \
            apps/api/src/modules/creator-marketplace/creator-marketplace-3d-asset-parity.test.ts \
            scripts/run-production-database-migrations.test.mjs \
            scripts/bootstrap-empty-production-database.test.mjs

      - name: Verify architecture and changed-file lint
        run: |
          pnpm run validate:architecture
          pnpm run lint:quick

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Build production bundles
        run: pnpm run build

      - name: Commit verified marketplace upgrade
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No marketplace changes were produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(market): add evidence-based comparison and 3d parity"
          git push origin HEAD:feat/marketplace-engagement-trust-v2-20260905
