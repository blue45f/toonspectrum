name: Studio promo implementation workspace
on:
  push:
    branches: [feat/studio-promo-video-20260906]
    paths: [.github/workflows/studio-promo-bootstrap.yml]
permissions:
  contents: write
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/studio-promo-video-20260906
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - run: npm install --global pnpm@11.4.0
      - name: Pin synchronized Remotion dependencies
        run: |
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));for(const k of ['remotion','@remotion/player','@remotion/web-renderer','@remotion/media'])p.dependencies[k]='4.0.521';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          pnpm install --lockfile-only --ignore-scripts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            HUSKY=0 git -c core.hooksPath=/dev/null commit -m 'build(video): pin Remotion 4.0.521 exactly'
            git push origin HEAD:feat/studio-promo-video-20260906
          fi
      - name: Export tracked source only, without credentials or Git metadata
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, tarfile
          allowed={'.ts','.tsx','.js','.jsx','.mjs','.cjs','.json','.yaml','.yml','.md','.css','.html','.toml','.txt','.properties'}
          with tarfile.open('/tmp/studio-promo-source.tar.gz','w:gz') as out:
            for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
              p=pathlib.Path(name)
              if p.is_file() and p.suffix in allowed and not p.name.startswith('.env') and p.stat().st_size<8_000_000:
                out.add(p,arcname=name,recursive=False)
          PY
      - name: Prepare isolated local validation dependencies
        run: |
          mkdir -p /tmp/video-toolchain
          npm install --prefix /tmp/video-toolchain --ignore-scripts --no-audit --no-fund --package-lock=false remotion@4.0.521 @remotion/player@4.0.521 @remotion/web-renderer@4.0.521 @remotion/media@4.0.521 typescript@6.0.3 react@19.2.6 react-dom@19.2.6 @types/react@19 @types/react-dom@19 @types/node zod@4.4.3 esbuild@0.28.2 @playwright/test@1.62.1 vitest@4.1.9 jsdom@29.1.1 react-router-dom@7.18.2 lucide-react@1.17.0 @testing-library/react ky clsx
          tar -czf /tmp/studio-promo-toolchain.tar.gz -C /tmp/video-toolchain node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-promo-implementation-workspace
          path: |
            /tmp/studio-promo-source.tar.gz
            /tmp/studio-promo-toolchain.tar.gz
          retention-days: 1
