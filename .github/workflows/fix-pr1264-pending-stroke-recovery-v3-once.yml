name: Fix PR 1264 pending stroke recovery v3 once

on:
  push:
    branches:
      - integration/completed-unmerged-20260910-1655
    paths:
      - .github/workflows/fix-pr1264-pending-stroke-recovery-v3-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repair and remove temporary files
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/repair-pr1264-pending-stroke-recovery.mjs
          rm -f \
            scripts/repair-pr1264-pending-stroke-recovery.mjs \
            .github/workflows/fix-pr1264-pending-stroke-recovery-once.yml \
            .github/workflows/fix-pr1264-pending-stroke-recovery-v2-once.yml \
            .github/workflows/fix-pr1264-pending-stroke-recovery-v3-once.yml
      - name: Verify recovery contract
        run: |
          pnpm exec vitest run \
            apps/web/src/domains/creator/studio-pending-stroke-recovery.test.ts \
            apps/web/src/domains/creator/studio-autosave-opfs-session.test.ts
          pnpm run typecheck
          pnpm run validate:architecture
      - name: Commit verified repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(studio): recover the newest complete pending stroke snapshot"
          git push origin "HEAD:${GITHUB_REF_NAME}"
