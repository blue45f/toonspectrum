name: Architecture boundaries

on:
  pull_request:
    paths:
      - "apps/admin-web/**"
      - "apps/character-lab/**"
      - "apps/brush-lab/**"
      - "apps/web/src/**"
      - "apps/api/src/**"
      - "apps/api/tsconfig.json"
      - "packages/contracts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "config/architecture-boundary-ratchet.json"
      - "scripts/validate-app-boundaries.mjs"
      - "apps/admin-web/vite.config.ts"
      - ".github/workflows/architecture-boundaries.yml"
  push:
    branches: [main]
    paths:
      - "apps/admin-web/**"
      - "apps/character-lab/**"
      - "apps/brush-lab/**"
      - "apps/web/src/**"
      - "apps/api/src/**"
      - "apps/api/tsconfig.json"
      - "packages/contracts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "config/architecture-boundary-ratchet.json"
      - "scripts/validate-app-boundaries.mjs"
      - "apps/admin-web/vite.config.ts"

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate application import ratchets
        run: node scripts/validate-app-boundaries.mjs
      - name: Type-check shared contracts
        run: pnpm --filter @toonstudio/contracts run typecheck
      - name: Type-check Admin boundary
        run: pnpm --filter @toonstudio/admin-web typecheck
      - name: Build Admin boundary
        run: pnpm --filter @toonstudio/admin-web build
      - name: Type-check Character Lab boundary
        run: pnpm --filter @toonstudio/character-lab typecheck
      - name: Build Character Lab boundary
        run: pnpm --filter @toonstudio/character-lab build
      - name: Test Character Lab (Node·jsdom, NullEngine)
        run: pnpm --filter @toonstudio/character-lab test
      - name: Type-check Brush Lab boundary
        run: pnpm --filter @toonstudio/brush-lab typecheck
      - name: Build Brush Lab boundary
        run: pnpm --filter @toonstudio/brush-lab build
      - name: Test Brush Lab (CPU 참조·fake GPUDevice·벤치)
        run: pnpm --filter @toonstudio/brush-lab test
