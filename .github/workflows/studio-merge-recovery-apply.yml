name: Apply Studio merge recovery
on:
  push:
    branches: [feat/studio-audit-completion-20260905]
    paths: ['.github/workflows/studio-merge-recovery-apply.yml']
permissions:
  contents: write
concurrency:
  group: studio-merge-recovery-apply
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 100
          ref: feat/studio-audit-completion-20260905
          persist-credentials: false
      - name: Preserve current main and apply the complete verified patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/studio-audit-completion-20260905
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main
          git merge --no-commit --no-ff origin/main
          git rev-parse origin/main
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, re, subprocess
          encoded = pathlib.Path('.github/studio-merge-recovery.patch.b64').read_text().strip()
          payload = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(payload).hexdigest() == 'b1677e0b9a2d590e463634d95fab7b1ecfca7d6d9d38be4d7ee1bc7d9239c71e', 'transport mismatch'
          patch = lzma.decompress(payload)
          assert hashlib.sha256(patch).hexdigest() == 'd79a07959548129ebbc2854aa07b87a59bdcdb90a10a0eba7f90b045951a547c', 'patch mismatch'
          # Reviewed main changes: CI was switched off, the title is now h1,
          # and production uses a lazy route adapter shared with Storyworld.
          # Preserve those changes. Reject unknown anchors instead of overwriting files.
          parts = re.split(r'(?=^diff --git )', patch.decode(), flags=re.M)
          adapted = []
          for part in parts:
              if not part:
                  continue
              header = part.splitlines()[0]
              if header.startswith('diff --git a/src/domains/creator/studio-router/StudioRouter.tsx '):
                  continue
              if header.startswith('diff --git a/.github/workflows/ci.yml '):
                  current = pathlib.Path('.github/workflows/ci.yml').read_text()
                  if 'CI_CORE_BYPASS' not in current:
                      continue
                  if '  CI_CORE_BYPASS: "false"' in current:
                      assert part.count('-  CI_CORE_BYPASS: "true"') == 1
                      part = part.replace('-  CI_CORE_BYPASS: "true"', '-  CI_CORE_BYPASS: "false"')
              if header.startswith('diff --git a/src/domains/creator/studio-production/StudioProductionHubPage.tsx '):
                  hunks = re.split(r'(?=^@@ )', part, flags=re.M)
                  label_hunks = [h for h in hunks if '-                Production command center\n' in h]
                  assert len(label_hunks) == 1, 'unexpected title hunk'
                  part = ''.join(h for h in hunks if h not in label_hunks)
              adapted.append(part)
          rebased_patch = ''.join(adapted).encode()
          subprocess.run(['git', 'apply', '--check', '-'], input=rebased_patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=rebased_patch, check=True)
          hub = pathlib.Path('src/domains/creator/studio-production/StudioProductionHubPage.tsx')
          source = hub.read_text()
          assert source.count('Production command center') == 1, 'title changed again'
          hub.write_text(source.replace('Production command center', 'Local production planner'))
          router = pathlib.Path('src/domains/creator/studio-router/StudioRouter.tsx')
          source = router.read_text()
          before, section = source.split('    case "production":', 1)
          production, after = section.split('    case ', 1)
          assert '<StudioProductionRoute' in production, 'production route ownership changed'
          old = 'onOpenStudio={() => navigate("/studio")}'
          assert production.count(old) == 1, 'production exit changed again'
          production = production.replace(old, 'onOpenStudio={() => navigate(resolution.editorHref)}')
          # The page keys its inner workspace by document only. Switching views
          # of the same work must not remount pending local state.
          assert 'key={resolution.lifecycleKey}' not in production
          router.write_text(before + '    case "production":' + production + '    case ' + after)
          PY
          git fetch --no-tags origin 7d5f2c63b0e12bb55dfe91db0c6cf2477262c379
          python3 - <<'PY'
          import pathlib, subprocess
          files = {
            'studio-batch-rename.ts': '0584b4be8689c82da493824116993e4d29bf8cd8',
            'studio-batch-rename.test.ts': 'e0feda7964a2b608e50aacc7ae3e53fd8c048455',
            'StudioInspectorBatchRenameSection.tsx': 'ce6f429a77dab70dff1642c616d134fcfa60b787',
            'StudioInspectorBatchRenameSection.test.tsx': 'a8749f6cf23e95506327fe423802fbdfe76be034',
          }
          for name, expected in files.items():
              path = pathlib.Path('src/domains/creator') / name
              assert not path.exists(), f'refusing to overwrite a newer implementation: {path}'
              data = subprocess.check_output(['git', 'show', f'7d5f2c63b0e12bb55dfe91db0c6cf2477262c379:{path}'])
              actual = subprocess.check_output(['git', 'hash-object', '--stdin'], input=data).decode().strip()
              assert actual == expected, f'pending implementation mismatch: {path}'
              path.write_bytes(data)
          PY
          git rm --ignore-unmatch \
            .github/studio-audit-payload-0.txt \
            .github/studio-audit-payload-1.txt \
            .github/studio-audit-payload-2.txt \
            .github/studio-merge-recovery.patch.b64 \
            .github/workflows/studio-audit-source-snapshot.yml \
            .github/workflows/studio-audit-existing-pr-source.yml \
            .github/workflows/studio-merge-recovery-apply.yml
          git diff --check
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check changed production code and regression tests
        run: |
          pnpm exec eslint --fix --max-warnings=0 \
            src/domains/creator/studio-production/studio-production-scope.ts \
            src/domains/creator/studio-production/studio-production-scope.test.ts \
            src/domains/creator/studio-production/StudioProductionHubPage.tsx \
            src/domains/creator/studio-production/StudioProductionHubPage.scope.test.tsx \
            src/domains/creator/studio-router/StudioRouter.tsx \
            src/domains/creator/studio-router/studio-route-manifest.ts \
            src/domains/creator/studio-router/studio-route-manifest.test.ts \
            src/domains/creator/studio-batch-rename.ts \
            src/domains/creator/studio-batch-rename.test.ts \
            src/domains/creator/StudioInspectorBatchRenameSection.tsx \
            src/domains/creator/StudioInspectorBatchRenameSection.test.tsx \
            src/domains/creator/StudioInspectorMultiSelectionSection.tsx \
            scripts/ci-executed-gates.test.mjs
          node --test scripts/ci-executed-gates.test.mjs
          pnpm exec vitest run \
            src/domains/creator/studio-production/studio-production-scope.test.ts \
            src/domains/creator/studio-production/StudioProductionHubPage.scope.test.tsx \
            src/domains/creator/studio-router/studio-route-manifest.test.ts \
            src/domains/creator/studio-router/StudioRouteCollaborationGateway.test.tsx \
            src/domains/creator/studio-router/studio-production-command-center-boundary.test.ts \
            src/domains/creator/studio-router/StudioRouteEntryContracts.test.tsx \
            src/domains/creator/studio-batch-rename.test.ts \
            src/domains/creator/StudioInspectorBatchRenameSection.test.tsx \
            src/domains/creator/studio-inspector-multi-selection-boundary.test.ts \
            src/domains/creator/StudioInspectorOrderAlignSection.test.tsx
      - name: Publish product-only integration commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add .github/workflows/ci.yml .github/workflows/studio-production-integrity.yml \
            docs/reports/studio-merge-recovery-2026-09-06.md scripts/ci-executed-gates.test.mjs \
            src/domains/creator/studio-production src/domains/creator/studio-router \
            src/domains/creator/studio-batch-rename.ts src/domains/creator/studio-batch-rename.test.ts \
            src/domains/creator/StudioInspectorBatchRenameSection.tsx \
            src/domains/creator/StudioInspectorBatchRenameSection.test.tsx \
            src/domains/creator/StudioInspectorMultiSelectionSection.tsx
          git commit -m 'fix(studio): preserve production identity, integrate atomic rename and restore executed CI'
          python3 - <<'PY'
          import base64, os, subprocess
          env = os.environ.copy()
          env['GIT_CONFIG_COUNT'] = '1'
          env['GIT_CONFIG_KEY_0'] = 'http.https://github.com/.extraheader'
          env['GIT_CONFIG_VALUE_0'] = 'AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + env.pop('GH_TOKEN')).encode()).decode()
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/feat/studio-audit-completion-20260905'], env=env, check=True)
          PY
          git show --stat --oneline HEAD
          git rev-parse HEAD
