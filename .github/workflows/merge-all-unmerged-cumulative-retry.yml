name: Retry cumulative integration and preserve a repair carrier

on:
  push:
    branches:
      - automation/merge-all-unmerged-20260903-driver-v10
    paths:
      - ".github/workflows/merge-all-unmerged-cumulative-retry.yml"
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: merge-all-unmerged-conductor
  cancel-in-progress: false

jobs:
  retry-and-preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      CI: "true"
      GH_TOKEN: ${{ github.token }}
      NODE_OPTIONS: --max-old-space-size=12288
      REPOSITORY: ${{ github.repository }}
      DRIVER_BRANCH: automation/merge-all-unmerged-20260903-driver-v10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.DRIVER_BRANCH }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Rebuild remaining work on current main
        id: carrier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          carrier="automation/all-unmerged-repair-${GITHUB_RUN_ID}"
          git switch --force-create "$carrier" origin/main
          mkdir -p /tmp/merge-all-report
          printf 'branch\tsha\tresult\tconflicts\n' >/tmp/merge-all-report/cumulative.tsv
          printf 'branch\tpath\tresolution\n' >/tmp/merge-all-report/conflicts.tsv

          mapfile -t branches < <(
            git for-each-ref --format='%(committerdate:unix)\t%(refname:strip=3)\t%(objectname)' refs/remotes/origin \
              | sort -n \
              | awk -F '\t' -v driver="$DRIVER_BRANCH" '
                  $2 != "main" && $2 != "HEAD" && $2 != driver &&
                  $2 !~ /^automation\/merge-all-unmerged-20260903-/ &&
                  $2 !~ /^automation\/all-unmerged-/ &&
                  $2 !~ /^archive\// && $2 !~ /^backup\// { print $2 "\t" $3 }
                '
          )

          for row in "${branches[@]}"; do
            branch="${row%%$'\t'*}"
            sha="${row#*$'\t'}"
            if git merge-base --is-ancestor "$sha" HEAD; then
              printf '%s\t%s\talready-contained\t0\n' "$branch" "$sha" >>/tmp/merge-all-report/cumulative.tsv
              continue
            fi
            safe="$(printf '%s' "$branch" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-//;s/-$//')"
            gh api -X POST "repos/${REPOSITORY}/git/refs" \
              -f ref="refs/tags/pre-merge-all/${GITHUB_RUN_ID}/${safe}" -f sha="$sha" >/dev/null 2>&1 || true

            set +e
            git merge --no-ff --no-edit -X theirs "origin/$branch" >/tmp/merge-all-report/${safe}.merge.log 2>&1
            rc=$?
            set -e
            if [[ "$rc" == 0 ]]; then
              printf '%s\t%s\tmerged\t0\n' "$branch" "$sha" >>/tmp/merge-all-report/cumulative.tsv
              continue
            fi

            mapfile -t unresolved < <(git diff --name-only --diff-filter=U)
            if [[ "${#unresolved[@]}" == 0 ]]; then
              git merge --abort || true
              printf '%s\t%s\tmerge-failed\t0\n' "$branch" "$sha" >>/tmp/merge-all-report/cumulative.tsv
              continue
            fi
            for path in "${unresolved[@]}"; do
              if git cat-file -e ":3:$path" 2>/dev/null; then
                git checkout --theirs -- "$path"
                git add -- "$path"
                printf '%s\t%s\tbranch-version\n' "$branch" "$path" >>/tmp/merge-all-report/conflicts.tsv
              elif git cat-file -e ":2:$path" 2>/dev/null; then
                git checkout --ours -- "$path"
                git add -- "$path"
                printf '%s\t%s\tmain-version-kept\n' "$branch" "$path" >>/tmp/merge-all-report/conflicts.tsv
              else
                git rm -f --ignore-unmatch -- "$path"
                printf '%s\t%s\tremoved-unaddressable-index-entry\n' "$branch" "$path" >>/tmp/merge-all-report/conflicts.tsv
              fi
            done
            git commit --no-edit
            printf '%s\t%s\tresolved\t%s\n' "$branch" "$sha" "${#unresolved[@]}" >>/tmp/merge-all-report/cumulative.tsv
          done

          if git diff --quiet origin/main...HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "carrier=$carrier" >> "$GITHUB_OUTPUT"
          git log --oneline origin/main..HEAD >/tmp/merge-all-report/carrier-commits.txt
          git diff --stat origin/main...HEAD >/tmp/merge-all-report/carrier-stat.txt

      - name: Install locked dependencies
        if: steps.carrier.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Apply deterministic formatting and import repair
        if: steps.carrier.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only --diff-filter=ACMR origin/main...HEAD | grep -E '\.(js|jsx|mjs|cjs|ts|tsx|mts|cts)$' || true)
          if [[ "${#changed[@]}" -gt 0 ]]; then
            pnpm exec eslint --fix "${changed[@]}" >/tmp/merge-all-report/eslint-fix.log 2>&1 || true
          fi
          git diff --check
          git add -A -- ':!merge-all-report' ':!/tmp/merge-all-report'
          if ! git diff --cached --quiet; then
            git commit -m "chore(integration): normalize reconstructed branch work"
          fi

      - name: Push repair carrier before validation
        if: steps.carrier.outputs.changed == 'true'
        run: git push --force-with-lease origin "HEAD:refs/heads/${{ steps.carrier.outputs.carrier }}"

      - name: Run strict static gates
        if: steps.carrier.outputs.changed == 'true'
        id: static
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsc -p tsconfig.json --noEmit 2>&1 | tee /tmp/merge-all-report/typecheck.log
          type_rc=${PIPESTATUS[0]}
          pnpm run validate:architecture 2>&1 | tee /tmp/merge-all-report/architecture.log
          arch_rc=${PIPESTATUS[0]}
          pnpm run lint:quick 2>&1 | tee /tmp/merge-all-report/lint.log
          lint_rc=${PIPESTATUS[0]}
          printf '{"typecheck":%s,"architecture":%s,"lint":%s}\n' "$type_rc" "$arch_rc" "$lint_rc" >/tmp/merge-all-report/static.json
          test "$type_rc" = 0 -a "$arch_rc" = 0 -a "$lint_rc" = 0

      - name: Run full tests and one serial retry
        if: steps.carrier.outputs.changed == 'true' && steps.static.outcome == 'success'
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec vitest run --reporter=dot 2>&1 | tee /tmp/merge-all-report/vitest-parallel.log
          rc=${PIPESTATUS[0]}
          if [[ "$rc" != 0 ]]; then
            pnpm exec vitest run --reporter=dot --maxWorkers=1 --minWorkers=1 2>&1 | tee /tmp/merge-all-report/vitest-serial.log
            rc=${PIPESTATUS[0]}
          fi
          exit "$rc"

      - name: Production build
        if: steps.carrier.outputs.changed == 'true' && steps.static.outcome == 'success' && steps.tests.outcome == 'success'
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee /tmp/merge-all-report/build.log
          rc=${PIPESTATUS[0]}
          test "$rc" = 0 -a -f dist/index.html

      - name: Open repair or certified integration PR
        if: steps.carrier.outputs.changed == 'true'
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          carrier="${{ steps.carrier.outputs.carrier }}"
          static="${{ steps.static.outcome }}"
          tests="${{ steps.tests.outcome }}"
          build="${{ steps.build.outcome }}"
          body=$(cat <<EOF
Lossless reconstruction of all remaining remote branch heads on the then-current \`main\`.

Every source head is retained under \`pre-merge-all/${GITHUB_RUN_ID}/...\`.

Validation outcomes:
- static: \`${static}\`
- tests: \`${tests}\`
- build: \`${build}\`

The carrier remains available even when a gate fails, so no branch work disappears.
EOF
)
          url="$(gh pr create --repo "$REPOSITORY" --base main --head "$carrier" \
            --title "chore(integration): preserve all remaining branch work" --body "$body")"
          number="${url##*/}"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          if [[ "$static" == success && "$tests" == success && "$build" == success ]]; then
            gh pr merge "$number" --repo "$REPOSITORY" --squash --delete-branch --admin \
              || gh pr merge "$number" --repo "$REPOSITORY" --squash --delete-branch --auto
          else
            gh pr ready "$number" --repo "$REPOSITORY" >/dev/null 2>&1 || true
          fi

      - name: Upload retry and repair evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cumulative-retry-${{ github.run_id }}
          path: /tmp/merge-all-report
          if-no-files-found: error
          retention-days: 30
