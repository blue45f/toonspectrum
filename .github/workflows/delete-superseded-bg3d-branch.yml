name: Delete superseded BG3D diagnostic branch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/delete-superseded-bg3d-branch.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  delete:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Delete only the superseded PR 624 branch
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = "fix/bg3d-webgpu-gizmo-gate-precondition";
            const expectedSha = "9e3f0950a4f235ec6a4e16c0ddcd585d20f1df0a";

            const original = await github.request(
              "GET /repos/{owner}/{repo}/pulls/{pull_number}",
              { owner, repo, pull_number: 624 },
            );
            if (original.data.state !== "closed" || original.data.merged_at !== null) {
              core.setFailed("PR #624 is not in the expected closed/unmerged superseded state");
              return;
            }

            const replacement = await github.request(
              "GET /repos/{owner}/{repo}/pulls/{pull_number}",
              { owner, repo, pull_number: 642 },
            );
            if (replacement.data.head.ref !== "test/bg3d-webgpu-gate-final-20260904") {
              core.setFailed("Replacement PR #642 no longer points to the expected branch");
              return;
            }

            let current;
            try {
              current = await github.request(
                "GET /repos/{owner}/{repo}/git/ref/{ref}",
                { owner, repo, ref: `heads/${branch}` },
              );
            } catch (error) {
              if (error.status === 404) {
                core.info(`${branch} is already absent`);
                return;
              }
              throw error;
            }

            if (current.data.object.sha !== expectedSha) {
              core.setFailed(
                `${branch} moved from ${expectedSha} to ${current.data.object.sha}; preserving it`,
              );
              return;
            }

            await github.request(
              "DELETE /repos/{owner}/{repo}/git/refs/{ref}",
              { owner, repo, ref: `heads/${branch}` },
            );
            core.info(`Deleted superseded branch ${branch} at ${expectedSha}`);
