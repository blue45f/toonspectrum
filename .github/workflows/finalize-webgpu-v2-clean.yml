name: Finalize clean WebGPU brush V2 candidate

on:
  push:
    branches:
      - feat/webgpu-brush-v2-clean-20260904
    paths:
      - .github/workflows/finalize-webgpu-v2-clean.yml

permissions:
  contents: write

concurrency:
  group: finalize-webgpu-v2-clean-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/webgpu-brush-v2-clean-20260904
          fetch-depth: 0

      - name: Apply exact V2 validation fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              target.write_text(source.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "scripts/studio-engine-webgpu-textured-brush-v2-quality-browser.ts",
              "      let texture = 1;\n      if (kind === \"fibre\") {",
              "      let texture: number;\n      if (kind === \"fibre\") {",
          )
          replace_once(
              "src/domains/creator/render/studio-engine-webgpu-textured-brush-runtime-v2.test.ts",
              "    expect(studioEngineWebGpuTexturedBrushV2SupportsPlan(texturedPlan(3, {\n      mode: \"append\",\n    }))).toBe(false);",
              "    expect(studioEngineWebGpuTexturedBrushV2SupportsPlan(texturedPlan(3, {\n      mode: \"append\",\n      commandSequence: 2,\n    }))).toBe(false);",
          )
          PY

      - name: Commit the fixed clean candidate and remove this one-shot workflow
        run: |
          rm -f .github/workflows/finalize-webgpu-v2-clean.yml
          git diff --check
          git config user.name "toonstudio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit --no-verify -m "fix(webgpu): finalize clean V2 validation fixtures"
          git push --no-verify origin HEAD:feat/webgpu-brush-v2-clean-20260904
