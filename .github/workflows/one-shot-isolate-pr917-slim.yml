name: Prioritize protected CI for final PR 919

on:
  push:
    branches:
      - ci/isolate-pr917-slim-20260908
    paths:
      - .github/workflows/one-shot-isolate-pr917-slim.yml

permissions:
  actions: write
  contents: read

jobs:
  prioritize:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      HELPER_BRANCH: ci/isolate-pr917-slim-20260908
      TARGET_BRANCH: release/final-main-merge-4888b061-immutable-20260908
    steps:
      - name: Preserve only the latest protected CI run for PR 919
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repository = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          helper_branch = os.environ["HELPER_BRANCH"]
          target_branch = os.environ["TARGET_BRANCH"]
          active_statuses = ("in_progress", "queued", "pending", "waiting", "requested")

          def request(path: str, method: str = "GET") -> tuple[int, object]:
              req = urllib.request.Request(
                  f"https://api.github.com{path}",
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "toonspectrum-pr919-core-prioritizer",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as error:
                  raw = error.read()
                  try:
                      payload: object = json.loads(raw) if raw else {}
                  except json.JSONDecodeError:
                      payload = raw.decode("utf-8", errors="replace")
                  return error.code, payload

          active: dict[int, dict[str, object]] = {}
          for status_name in active_statuses:
              for page in range(1, 11):
                  status, payload = request(
                      f"/repos/{repository}/actions/runs?status={status_name}&per_page=100&page={page}"
                  )
                  if status != 200 or not isinstance(payload, dict):
                      raise SystemExit(f"list {status_name} failed: HTTP {status}: {payload}")
                  runs = payload.get("workflow_runs", [])
                  if not isinstance(runs, list):
                      raise SystemExit("invalid workflow_runs response")
                  for run in runs:
                      if isinstance(run, dict) and int(run.get("id", 0)):
                          active[int(run["id"])] = run
                  if len(runs) < 100:
                      break

          target_ci = [
              run for run in active.values()
              if run.get("head_branch") == target_branch
              and run.get("path") == ".github/workflows/ci.yml"
          ]
          if not target_ci:
              raise SystemExit("No active protected CI run found for PR 919")
          keep_run = max(
              target_ci,
              key=lambda run: (str(run.get("created_at") or ""), int(run.get("id", 0))),
          )
          keep_id = int(keep_run["id"])

          candidates: list[dict[str, object]] = []
          for run_id, run in active.items():
              branch = str(run.get("head_branch") or "")
              if branch in {"main", helper_branch} or run_id == keep_id:
                  continue
              candidates.append(run)

          candidates.sort(key=lambda run: (str(run.get("created_at") or ""), int(run.get("id", 0))))
          print(json.dumps({
              "active": len(active),
              "protectedCiRun": keep_id,
              "cancellations": len(candidates),
          }, sort_keys=True))

          failures: list[str] = []
          for run in candidates:
              run_id = int(run["id"])
              status, payload = request(
                  f"/repos/{repository}/actions/runs/{run_id}/cancel",
                  method="POST",
              )
              label = f"{run_id} {run.get('head_branch')} / {run.get('name')} [{run.get('status')}]"
              if status == 202:
                  print(f"cancelled: {label}")
              elif status in {404, 409}:
                  print(f"already terminal: {label} (HTTP {status})")
              else:
                  failures.append(f"{label}: HTTP {status}: {payload}")
              time.sleep(0.03)

          print(f"preserved protected CI run {keep_id}; failed cancellations={len(failures)}")
          if failures:
              raise SystemExit("Cancellation failures:\n" + "\n".join(failures))
          PY
