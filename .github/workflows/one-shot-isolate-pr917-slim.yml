name: Prioritize protected CI for final PR 919
# Triggered for final head 3965326a8254b579d5d948f822a4609acadc94f1.

on:
  push:
    branches: [ci/isolate-pr917-slim-20260908]
    paths: [.github/workflows/one-shot-isolate-pr917-slim.yml]

permissions:
  actions: write
  contents: read

jobs:
  prioritize:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      HELPER_BRANCH: ci/isolate-pr917-slim-20260908
      TARGET_BRANCH: release/final-main-merge-4888b061-immutable-20260908
    steps:
      - name: Preserve only the latest protected CI run
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, time, urllib.error, urllib.request

          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          helper = os.environ["HELPER_BRANCH"]
          target = os.environ["TARGET_BRANCH"]

          def api(path, method="GET"):
              req = urllib.request.Request(
                  f"https://api.github.com{path}", method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "toonspectrum-core-prioritizer",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as res:
                      raw = res.read()
                      return res.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as err:
                  raw = err.read()
                  try: payload = json.loads(raw) if raw else {}
                  except json.JSONDecodeError: payload = raw.decode(errors="replace")
                  return err.code, payload

          active = {}
          for state in ("in_progress", "queued", "pending", "waiting", "requested"):
              for page in range(1, 11):
                  status, payload = api(
                      f"/repos/{repo}/actions/runs?status={state}&per_page=100&page={page}"
                  )
                  if status != 200 or not isinstance(payload, dict):
                      raise SystemExit(f"list {state}: HTTP {status}: {payload}")
                  runs = payload.get("workflow_runs", [])
                  for run in runs:
                      active[int(run["id"])] = run
                  if len(runs) < 100: break

          official = [
              run for run in active.values()
              if run.get("head_branch") == target
              and run.get("path") == ".github/workflows/ci.yml"
          ]
          if not official: raise SystemExit("No active protected CI run found")
          keep = max(official, key=lambda run: (run.get("created_at", ""), int(run["id"])))
          keep_id = int(keep["id"])
          failures = []
          cancelled = 0
          for run_id, run in sorted(active.items()):
              branch = str(run.get("head_branch") or "")
              if branch in {"main", helper} or run_id == keep_id: continue
              status, payload = api(f"/repos/{repo}/actions/runs/{run_id}/cancel", "POST")
              if status == 202:
                  cancelled += 1
                  print(f"cancelled {run_id} {branch} / {run.get('name')}")
              elif status not in {404, 409}:
                  failures.append(f"{run_id}: HTTP {status}: {payload}")
              time.sleep(0.03)
          print(json.dumps({"protectedCiRun": keep_id, "cancelled": cancelled, "failures": len(failures)}))
          if failures: raise SystemExit("\n".join(failures))
          PY
