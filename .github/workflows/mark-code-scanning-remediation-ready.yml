name: Mark code-scanning remediation ready

on:
  push:
    branches:
      - fix/code-scanning-alerts-20260910-v3
    paths:
      - .github/workflows/mark-code-scanning-remediation-ready.yml
  workflow_dispatch:

permissions:
  contents: write
  security-events: read

concurrency:
  group: remediate-code-scanning-alerts-20260910-v3
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: fix/code-scanning-alerts-20260910-v3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/code-scanning-alerts-20260910-v3
          fetch-depth: 0

      - name: Require completed zero-alert branch analysis
        run: |
          set -euo pipefail
          git fetch origin "${TARGET_BRANCH}"
          git reset --hard "origin/${TARGET_BRANCH}"

          # A successful analysis for the current branch must exist; an absent analysis is not zero alerts.
          analyses="$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/code-scanning/analyses?ref=refs%2Fheads%2F${TARGET_BRANCH//\//%2F}&per_page=100" \
            --slurp | jq 'add // []')"
          completed_count="$(jq '[.[] | select(.error == "" or .error == null)] | length' <<<"$analyses")"
          if [[ "$completed_count" == "0" ]]; then
            echo "No completed CodeQL analysis exists for ${TARGET_BRANCH}." >&2
            exit 1
          fi

          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&ref=refs%2Fheads%2F${TARGET_BRANCH//\//%2F}&per_page=100" \
            --slurp | jq 'add // []' > /tmp/branch-alerts.json

          count="$(jq 'length' /tmp/branch-alerts.json)"
          {
            echo "## Final code-scanning gate"
            echo
            echo "Completed analyses: **${completed_count}**"
            echo "Open alerts on branch: **${count}**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$count" != "0" ]]; then
            jq -r '.[] | "UNRESOLVED #\(.number) \(.rule.id) \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)"' /tmp/branch-alerts.json
            exit 1
          fi

      - name: Commit immutable readiness marker
        run: |
          set -euo pipefail
          mkdir -p .security-remediation
          printf 'code-scanning-alerts=0\nbranch=fix/code-scanning-alerts-20260910-v3\n' \
            > .security-remediation/READY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .security-remediation/READY
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(security): mark zero-alert CodeQL verification"
          git push origin "HEAD:${TARGET_BRANCH}"
