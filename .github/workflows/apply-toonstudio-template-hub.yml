name: Finalize ToonStudio template hub once

on:
  push:
    branches:
      - feat/toonstudio-template-hub-20260912
    paths:
      - .github/workflows/apply-toonstudio-template-hub.yml

permissions:
  contents: write

concurrency:
  group: apply-toonstudio-template-hub
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      CI: "true"
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-template-hub-20260912
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Recover the validated integration pipeline
        shell: bash
        run: |
          set -euo pipefail
          WRAPPER_TIP="f27f0e86a4512abc6fed070b3af6b08788b5ec67"
          git cat-file -e "${WRAPPER_TIP}^{commit}"
          git show "${WRAPPER_TIP}:.github/workflows/apply-toonstudio-template-hub.yml" > /tmp/template-wrapper.yml
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import YAML from "yaml";

          const workflow = YAML.parse(fs.readFileSync("/tmp/template-wrapper.yml", "utf8"));
          const names = [
            "Rebuild on validated brush runtime and recover integration steps",
            "Connect owners and repair strict contracts",
            "Validate, finalize and self-remove",
          ];
          const steps = workflow?.jobs?.integrate?.steps ?? [];
          for (const [index, name] of names.entries()) {
            const step = steps.find((candidate) => candidate?.name === name);
            if (!step || typeof step.run !== "string") {
              throw new Error(`Wrapper step is missing: ${name}`);
            }
            fs.writeFileSync(`/tmp/template-wrapper-${index}.sh`, `set -euo pipefail\n${step.run}\n`);
          }
          NODE

      - name: Rebuild and repair workspace typing
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/template-wrapper-0.sh
          bash /tmp/template-wrapper-1.sh
          python <<'PY'
          from pathlib import Path

          path = Path("apps/web/src/domains/creator/studio-project-document-store.ts")
          source = path.read_text(encoding="utf-8")
          old = "  const allowedWorkspaces = KIND_WORKSPACES[input.kind];"
          new = (
              "  const allowedWorkspaces: readonly StudioDocumentWorkspace[] =\n"
              "    KIND_WORKSPACES[input.kind];"
          )
          if source.count(old) != 1:
              raise SystemExit(
                  "studio-project-document-store.ts: expected one allowed workspace declaration"
              )
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate, commit and self-remove
        shell: bash
        run: bash /tmp/template-wrapper-2.sh
