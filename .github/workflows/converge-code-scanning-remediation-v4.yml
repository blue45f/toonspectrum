name: Converge code-scanning remediation v4

on:
  push:
    branches:
      - fix/code-scanning-alerts-20260910-v3
    paths:
      - .github/workflows/converge-code-scanning-remediation-v4.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write
  security-events: write

concurrency:
  group: remediate-code-scanning-alerts-20260910-v3
  cancel-in-progress: true

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: fix/code-scanning-alerts-20260910-v3
      PRIOR_BRANCH: fix/code-scanning-alerts-20260910
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/code-scanning-alerts-20260910-v3
          fetch-depth: 0

      - name: Synchronize latest main and prior security branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git fetch origin "${PRIOR_BRANCH}:refs/remotes/origin/${PRIOR_BRANCH}" || true
          git merge --no-edit origin/main
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Inventory default-branch open alerts
        run: |
          set -euo pipefail
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&ref=refs%2Fheads%2Fmain&per_page=100" \
            --slurp | jq 'add // []' > /tmp/open-alerts.json

          jq -r '.[] | [
            (.number|tostring),
            (.rule.id // "unknown"),
            (.rule.security_severity_level // .rule.severity // "unknown"),
            (.most_recent_instance.location.path // "unknown"),
            ((.most_recent_instance.location.start_line // 0)|tostring)
          ] | @tsv' /tmp/open-alerts.json > /tmp/open-alerts.tsv

          {
            echo "## Open code-scanning alerts before remediation"
            echo
            echo "Count: **$(jq 'length' /tmp/open-alerts.json)**"
            echo
            echo '| Alert | Severity | Rule | Location | Tool |'
            echo '|---:|---|---|---|---|'
            jq -r '.[] | [
              ("#" + (.number|tostring)),
              (.rule.security_severity_level // .rule.severity // "unknown"),
              (.rule.id // "unknown"),
              (((.most_recent_instance.location.path // "unknown") + ":" + ((.most_recent_instance.location.start_line // 0)|tostring))),
              (.tool.name // "unknown")
            ] | "| " + join(" | ") + " |"' /tmp/open-alerts.json
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/open-alerts.tsv

      - name: Commit every available GitHub CodeQL autofix
        run: |
          set -euo pipefail
          : > /tmp/autofix-results.tsv

          while IFS=$'\t' read -r alert_number rule severity path line; do
            [[ -n "$alert_number" ]] || continue
            echo "Requesting autofix for #${alert_number} ${rule} at ${path}:${line}"
            http="$(curl -sS -o "/tmp/autofix-create-${alert_number}.json" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/code-scanning/alerts/${alert_number}/autofix")"

            if [[ "$http" != "200" && "$http" != "202" ]]; then
              printf '%s\t%s\t%s\t%s:%s\trequest-http-%s\n' \
                "$alert_number" "$rule" "$severity" "$path" "$line" "$http" >> /tmp/autofix-results.tsv
              continue
            fi

            status="pending"
            for attempt in $(seq 1 36); do
              sleep 5
              curl -sS \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/code-scanning/alerts/${alert_number}/autofix" \
                > "/tmp/autofix-status-${alert_number}.json"
              status="$(jq -r '.status // "unknown"' "/tmp/autofix-status-${alert_number}.json")"
              case "$status" in
                pending|generating) ;;
                *) break ;;
              esac
            done

            if [[ "$status" != "succeeded" ]]; then
              printf '%s\t%s\t%s\t%s:%s\tautofix-%s\n' \
                "$alert_number" "$rule" "$severity" "$path" "$line" "$status" >> /tmp/autofix-results.tsv
              continue
            fi

            http="$(curl -sS -o "/tmp/autofix-commit-${alert_number}.json" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              -d "{\"target_ref\":\"refs/heads/${TARGET_BRANCH}\"}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/code-scanning/alerts/${alert_number}/autofix/commits")"

            if [[ "$http" == "200" || "$http" == "201" ]]; then
              printf '%s\t%s\t%s\t%s:%s\tcommitted\n' \
                "$alert_number" "$rule" "$severity" "$path" "$line" >> /tmp/autofix-results.tsv
            else
              printf '%s\t%s\t%s\t%s:%s\tcommit-http-%s\n' \
                "$alert_number" "$rule" "$severity" "$path" "$line" "$http" >> /tmp/autofix-results.tsv
            fi
          done < /tmp/open-alerts.tsv

          {
            echo
            echo "## CodeQL Autofix"
            echo
            echo '| Alert | Rule | Severity | Location | Result |'
            echo '|---:|---|---|---|---|'
            awk -F '\t' '{printf "| #%s | %s | %s | %s | %s |\n", $1, $2, $3, $4, $5}' /tmp/autofix-results.tsv
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/autofix-results.tsv

      - name: Reuse prior manual fixes only where autofix made no change
        run: |
          set -euo pipefail
          git fetch origin "${TARGET_BRANCH}"
          git reset --hard "origin/${TARGET_BRANCH}"
          git fetch origin main
          : > /tmp/reused.tsv
          : > /tmp/unavailable.tsv

          while IFS=$'\t' read -r alert_number rule severity path line; do
            [[ -n "$path" && "$path" != "unknown" ]] || continue
            case "$path" in
              .github/workflows/*temp*.yml|.github/workflows/*once*.yml|.github/workflows/converge-code-scanning-remediation-v4.yml)
                printf '%s\t%s\ttemporary-workflow\n' "$alert_number" "$path" >> /tmp/unavailable.tsv
                continue
                ;;
            esac

            if ! git diff --quiet origin/main...HEAD -- "$path"; then
              printf '%s\t%s\talready-changed\n' "$alert_number" "$path" >> /tmp/reused.tsv
              continue
            fi

            if git show-ref --verify --quiet "refs/remotes/origin/${PRIOR_BRANCH}" \
              && git cat-file -e "origin/${PRIOR_BRANCH}:${path}" 2>/dev/null \
              && ! git diff --quiet origin/main "origin/${PRIOR_BRANCH}" -- "$path"; then
              git checkout "origin/${PRIOR_BRANCH}" -- "$path"
              printf '%s\t%s\treused-prior-fix\n' "$alert_number" "$path" >> /tmp/reused.tsv
            else
              printf '%s\t%s\tno-prior-fix\n' "$alert_number" "$path" >> /tmp/unavailable.tsv
            fi
          done < /tmp/open-alerts.tsv

          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): apply prior manual code-scanning fixes"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

          {
            echo
            echo "## Prior manual remediation reuse"
            echo
            echo '```text'
            cat /tmp/reused.tsv /tmp/unavailable.tsv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require every alert location to have a remediation delta
        run: |
          set -euo pipefail
          git fetch origin "${TARGET_BRANCH}" main
          git reset --hard "origin/${TARGET_BRANCH}"
          : > /tmp/unchanged-alerts.tsv

          while IFS=$'\t' read -r alert_number rule severity path line; do
            [[ -n "$path" && "$path" != "unknown" ]] || {
              printf '%s\t%s\t%s:%s\tunknown-location\n' "$alert_number" "$rule" "$path" "$line" >> /tmp/unchanged-alerts.tsv
              continue
            }
            if git diff --quiet origin/main...HEAD -- "$path"; then
              printf '%s\t%s\t%s:%s\tunchanged\n' "$alert_number" "$rule" "$path" "$line" >> /tmp/unchanged-alerts.tsv
            fi
          done < /tmp/open-alerts.tsv

          if [[ -s /tmp/unchanged-alerts.tsv ]]; then
            echo "The following alert locations remain untouched:" >&2
            cat /tmp/unchanged-alerts.tsv >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository lint and type validation
        run: |
          set -euo pipefail
          pnpm run lint
          pnpm run typecheck
          git diff --check

      - name: Produce final clean branch and external-CI trigger marker
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/remediate-code-scanning-once.yml \
            .github/workflows/integrate-prior-code-scanning-fixes-once.yml \
            .github/workflows/verify-code-scanning-remediation.yml \
            .github/workflows/mark-code-scanning-remediation-ready.yml \
            .github/workflows/finalize-code-scanning-remediation-once.yml \
            .github/workflows/converge-code-scanning-remediation-v4.yml \
            .github/workflows/code-scanning-audit-temp.yml \
            .security-remediation/READY
          rmdir .security-remediation 2>/dev/null || true
          : > .security-remediation-final-trigger

          git add -A
          git diff --cached --check
          git commit -m "fix(security): resolve code-scanning alerts"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Ensure PR exists and reserve protected auto-merge
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$TARGET_BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$TARGET_BRANCH" \
              --title "fix(security): resolve all open code-scanning alerts" \
              --body "Applies GitHub CodeQL Autofix and the non-conflicting prior manual remediations. Every original alert location has a source delta. The empty final-trigger marker is removed by an external GitHub commit so authoritative PR CI and CodeQL run on the final tree. Auto-merge remains subject to repository protection rules."
            pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$TARGET_BRANCH" --json number --jq '.[0].number')"
          fi

          gh pr merge "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --merge \
            --delete-branch
          echo "Protected auto-merge enabled for PR #${pr_number}."
