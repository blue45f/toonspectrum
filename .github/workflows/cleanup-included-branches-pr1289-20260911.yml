name: Cleanup branches already included in PR 1289

on:
  push:
    branches:
      - fix/real-core-and-main-only-20260910
    paths:
      - .github/workflows/cleanup-included-branches-pr1289-20260911.yml

permissions:
  contents: write

concurrency:
  group: cleanup-included-branches-pr1289
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR head with complete history
        uses: actions/checkout@v4
        with:
          ref: fix/real-core-and-main-only-20260910
          fetch-depth: 0
          filter: blob:none
          show-progress: false
          persist-credentials: true

      - name: Delete only remote branches fully included in PR head
        shell: bash
        run: |
          set -Eeuo pipefail

          target_branch='fix/real-core-and-main-only-20260910'
          workflow_path='.github/workflows/cleanup-included-branches-pr1289-20260911.yml'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --filter=blob:none --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'

          mapfile -t branches < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
              | grep -vE "^(HEAD|main|${target_branch})$" \
              | sort -u
          )

          deleted=()
          skipped=()

          for branch in "${branches[@]}"; do
            remote_ref="origin/${branch}"
            if git merge-base --is-ancestor "$remote_ref" HEAD; then
              echo "Deleting included branch: ${branch}"
              git push origin --delete "$branch"
              deleted+=("$branch")
            else
              echo "Preserving non-included branch: ${branch}"
              skipped+=("$branch")
            fi
          done

          echo "Deleted ${#deleted[@]} branch(es)."
          printf 'deleted=%s\n' "${deleted[*]:-none}"
          echo "Preserved ${#skipped[@]} non-included branch(es)."
          printf 'preserved=%s\n' "${skipped[*]:-none}"

          rm -f "$workflow_path"
          git add -A
          git commit -m 'chore(branches): remove one-shot included-branch cleanup workflow'
          git push origin "HEAD:refs/heads/${target_branch}"
