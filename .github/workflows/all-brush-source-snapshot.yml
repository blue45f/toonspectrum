name: All-brush benchmark source snapshot

on:
  push:
    branches:
      - feat/all-brush-long-stroke-quality-election-20260904
    paths:
      - .github/workflows/all-brush-source-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: all-brush-source-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive exact branch source
        run: |
          set -euo pipefail
          git rev-parse HEAD > source-head.txt
          zip -qr /tmp/toonspectrum-source.zip . \
            -x '.git/*' 'node_modules/*' 'dist/*' 'artifacts/*'
      - uses: actions/upload-artifact@v4
        with:
          name: all-brush-source-${{ github.sha }}
          path: /tmp/toonspectrum-source.zip
          if-no-files-found: error
          retention-days: 2
