name: Land Studio finishing quality inspection

on:
  push:
    branches:
      - feat/studio-quality-inspection-20260905
    paths:
      - ".github/workflows/studio-quality-integration.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-finishing-quality-inspection
  cancel-in-progress: false

jobs:
  integrate-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=8192
      FEATURE_BRANCH: feat/studio-quality-inspection-20260905
    steps:
      - name: Checkout complete feature history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: feat/studio-quality-inspection-20260905

      - name: Synchronize latest feature and main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "toonstudio-quality-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$FEATURE_BRANCH" main
          git reset --hard "origin/$FEATURE_BRANCH"
          git rev-parse HEAD > /tmp/studio-quality-remote-head.txt
          git merge --no-edit origin/main

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Restore finishing quality inspection implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .quality-payload/part-* | base64 --decode > /tmp/studio-quality-payload.tar.xz
          echo "a1279d9d5642741cff1e454255b95362c6ebfcf23df42305e7561b6a3b0b8650  /tmp/studio-quality-payload.tar.xz" | sha256sum --check -
          tar -xJf /tmp/studio-quality-payload.tar.xz
          python3 apply-studio-quality-integration.py
          rm -f apply-studio-quality-integration.py
          rm -rf .quality-payload
          rm -f .github/workflows/studio-quality-integration.yml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize changed TypeScript
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -m -o --exclude-standard | grep -E '\.(ts|tsx|mts)$')
          test "${#files[@]}" -gt 0
          pnpm exec prettier --write "${files[@]}"
          pnpm exec eslint --fix "${files[@]}"
          git add -N "${files[@]}"
          git diff --check

      - name: Run finishing quality regression tests
        run: >-
          pnpm exec vitest run
          src/domains/creator/studio-quality-inspection.test.ts
          src/domains/creator/studio-quality-raster-inspection.test.ts
          src/domains/creator/StudioContinuityPanel.test.tsx
          src/domains/creator/StudioLazyPanelStack.test.tsx
          --reporter=verbose

      - name: Verify Studio command and menu registry
        run: pnpm run verify:studio-menus

      - name: Type-check product
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Lint changed TypeScript strictly
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -m -o --exclude-standard | grep -E '\.(ts|tsx|mts)$')
          pnpm exec eslint --max-warnings=0 "${files[@]}"

      - name: Validate architecture
        run: pnpm run validate:architecture

      - name: Build production app
        run: pnpm run build

      - name: Prepare verified product commit
        shell: bash
        run: |
          set -euo pipefail
          git restore --worktree -- public/data 2>/dev/null || true
          rm -rf coverage dist test-results playwright-report
          git add -A
          git diff --cached --check
          git status --short

      - name: Commit and push verified implementation
        shell: bash
        run: |
          set -euo pipefail
          remote_before="$(git ls-remote origin "refs/heads/${FEATURE_BRANCH}" | awk '{print $1}')"
          expected_remote="$(cat /tmp/studio-quality-remote-head.txt)"
          if [[ "$remote_before" != "$expected_remote" ]]; then
            echo "Feature branch advanced during verification: expected ${expected_remote}, found ${remote_before}" >&2
            exit 1
          fi
          git commit -m "feat(studio): add finishing quality inspection center"
          git push origin HEAD:"$FEATURE_BRANCH"

      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: studio-quality-integration-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            src/domains/creator/studio-quality-*
            src/domains/creator/StudioContinuityPanel*
            src/domains/creator/StudioLazyPanelStack.tsx
            src/domains/creator/StudioProjectReviewActions.tsx
            src/domains/creator/StudioToolBeltContent.tsx
            src/domains/creator/studio-main-menu-items-production.ts
            src/domains/creator/studio-command-catalog.ts
