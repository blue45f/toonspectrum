name: Repair ToonStudio finalization v2

on:
  push:
    branches:
      - feat/toonstudio-session-completion-followup-20260911
    paths:
      - .github/workflows/repair-toonstudio-finalization-v2.yml

permissions:
  contents: write

concurrency:
  group: validate-toonstudio-continuation-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CI: "true"
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout continuation branch
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-session-completion-followup-20260911
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Repair runtime boundaries and complete all route wiring
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def text(path: str) -> str:
              return Path(path).read_text()

          def save(path: str, value: str) -> None:
              Path(path).write_text(value)

          def insert(path: str, marker: str, value: str, sentinel: str) -> None:
              current = text(path)
              if sentinel in current:
                  return
              if marker not in current:
                  raise SystemExit(f"{path}: missing marker {marker!r}")
              save(path, current.replace(marker, value + marker, 1))

          # Replace the redirect component to avoid conditional hooks and render-time navigation.
          Path("apps/web/src/domains/creator/studio-shell/StudioTemplateStartRoute.tsx").write_text('''import { useEffect, useMemo } from "react";\nimport { useNavigate, useParams } from "react-router-dom";\n\nimport {\n  createStudioTemplateHandoff,\n  studioTemplateById,\n  writeStudioTemplateHandoff,\n} from "../studio-template-catalog";\n\nfunction draftId(templateId: string): string {\n  const random = globalThis.crypto?.randomUUID?.().replaceAll("-", "").slice(0, 12)\n    ?? `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`;\n  return `template-${templateId}-${random}`.slice(0, 150);\n}\n\n/** Create a fresh document identity, persist one handoff, then enter the immersive editor. */\nexport function StudioTemplateStartRoute() {\n  const { templateId = "" } = useParams<{ templateId: string }>();\n  const navigate = useNavigate();\n  const template = studioTemplateById(templateId);\n  const destination = useMemo(() => {\n    if (!template) return null;\n    const params = new URLSearchParams({\n      template: template.id,\n      workspace: template.recommendedWorkspace,\n    });\n    params.sort();\n    return `/studio/draft/${encodeURIComponent(draftId(template.id))}?${params.toString()}`;\n  }, [template]);\n\n  useEffect(() => {\n    if (!template || !destination) {\n      navigate("/studio/templates", { replace: true });\n      return;\n    }\n    if (typeof window !== "undefined") {\n      writeStudioTemplateHandoff(\n        window.localStorage,\n        createStudioTemplateHandoff(template.id),\n      );\n    }\n    navigate(destination, { replace: true });\n  }, [destination, navigate, template]);\n\n  return null;\n}\n''')

          # Use File.arrayBuffer where available and a standards-based fallback in older jsdom/WebViews.
          seller_path = "apps/web/src/domains/creator/studio-shell/StudioMarketplaceSellerPanel.tsx"
          seller = text(seller_path)
          old_checksum = '''async function checksum(file: File): Promise<string> {\n  if (!globalThis.crypto?.subtle) {\n    throw new Error("Secure file verification is not available in this browser.");\n  }\n  const digest = await globalThis.crypto.subtle.digest("SHA-256", await file.arrayBuffer());'''
          new_checksum = '''async function checksum(file: File): Promise<string> {\n  if (!globalThis.crypto?.subtle) {\n    throw new Error("Secure file verification is not available in this browser.");\n  }\n  const bytes = typeof file.arrayBuffer === "function"\n    ? await file.arrayBuffer()\n    : await new Response(file).arrayBuffer();\n  const digest = await globalThis.crypto.subtle.digest("SHA-256", bytes);'''
          if old_checksum in seller:
              seller = seller.replace(old_checksum, new_checksum, 1)
          elif "const bytes = typeof file.arrayBuffer" not in seller:
              raise SystemExit("StudioMarketplaceSellerPanel.tsx: checksum implementation missing")

          old_attach = '''      const nextFile = Object.freeze({\n        path: `${role}/${file.name}`,\n        role,\n        format: extension(file.name),\n        sizeBytes: file.size,\n        checksum: await checksum(file),\n      });\n      commit({\n        ...submission,\n        files: Object.freeze([\n          ...submission.files.filter((item) => item.role !== role),\n          nextFile,\n        ]),\n        updatedAt: new Date().toISOString(),\n      }, locale === "ko" ? `${file.name}의 무결성을 확인했습니다.` : `Verified ${file.name}.`);'''
          new_attach = '''      const nextFile = Object.freeze({\n        path: `${role}/${file.name}`,\n        role,\n        format: extension(file.name),\n        sizeBytes: file.size,\n        checksum: await checksum(file),\n      });\n      setSubmission((current) => {\n        const next = {\n          ...current,\n          files: Object.freeze([\n            ...current.files.filter((item) => item.role !== role),\n            nextFile,\n          ]),\n          updatedAt: new Date().toISOString(),\n        };\n        return typeof window === "undefined"\n          ? next\n          : writeStudioMarketplaceSubmissionDraft(window.localStorage, next, window);\n      });\n      setMessage(locale === "ko" ? `${file.name}의 무결성을 확인했습니다.` : `Verified ${file.name}.`);'''
          if old_attach in seller:
              seller = seller.replace(old_attach, new_attach, 1)
          elif "setSubmission((current) =>" not in seller:
              raise SystemExit("StudioMarketplaceSellerPanel.tsx: concurrent persistence repair missing")
          save(seller_path, seller)

          # Ensure the file tests provide both Blob APIs used by browsers.
          seller_test_path = "apps/web/src/domains/creator/studio-shell/StudioMarketplaceSellerPanel.test.tsx"
          seller_test = text(seller_test_path)
          marker = '''  Object.defineProperty(globalThis, "crypto", {\n    configurable: true,\n    value: {\n      subtle: {\n        digest: vi.fn().mockResolvedValue(DIGEST),\n      },\n    },\n  });\n'''
          fallback = marker + '''  if (typeof File.prototype.arrayBuffer !== "function") {\n    Object.defineProperty(File.prototype, "arrayBuffer", {\n      configurable: true,\n      value: vi.fn(async function arrayBuffer(this: File) {\n        return new Response(this).arrayBuffer();\n      }),\n    });\n  }\n'''
          if "File.prototype.arrayBuffer" not in seller_test:
              if marker not in seller_test:
                  raise SystemExit("StudioMarketplaceSellerPanel.test.tsx: crypto setup missing")
              seller_test = seller_test.replace(marker, fallback, 1)
          simultaneous = '''    fireEvent.change(inputs[0]!, { target: { files: [product] } });\n    fireEvent.change(inputs[1]!, { target: { files: [preview] } });\n\n    await waitFor(() => {'''
          sequential = '''    fireEvent.change(inputs[0]!, { target: { files: [product] } });\n    await waitFor(() => {\n      expect(window.localStorage.getItem(\n        "toonspectrum:studio-marketplace-submission:v1:seller-files",\n      )).toContain("primary/ink.toon-brush");\n    });\n    fireEvent.change(inputs[1]!, { target: { files: [preview] } });\n\n    await waitFor(() => {'''
          if simultaneous in seller_test:
              seller_test = seller_test.replace(simultaneous, sequential, 1)
          save(seller_test_path, seller_test)

          handoff_test_path = "apps/web/src/domains/creator/studio-cuttoon-editor/StudioTemplateHandoffHost.test.tsx"
          handoff_test = text(handoff_test_path)
          handoff_test = handoff_test.replace(
              '"2026-09-12T00:00:00.000Z",\n        3_600_000,',
              'new Date().toISOString(),\n        3_600_000,',
          )
          save(handoff_test_path, handoff_test)

          # Canonical catalogue values and direct-start URL.
          catalog_path = "apps/web/src/domains/creator/studio-template-catalog.ts"
          catalog = text(catalog_path)
          catalog = catalog.replace('documentKind: "comic"', 'documentKind: "webtoon"')
          catalog = catalog.replace('documentKind: "slides"', 'documentKind: "presentation"')
          catalog = catalog.replace('rightsStatus: "unknown"', 'rightsStatus: "warning"')
          old_href = '''  const params = new URLSearchParams({\n    template: template.id,\n    workspace: template.recommendedWorkspace,\n  });\n  params.sort();\n  return `/studio/new?${params.toString()}`;'''
          if old_href in catalog:
              catalog = catalog.replace(old_href, '  return `/studio/templates/${encodeURIComponent(template.id)}/start`;', 1)
          save(catalog_path, catalog)

          catalog_test_path = "apps/web/src/domains/creator/studio-template-catalog.test.ts"
          catalog_test = text(catalog_test_path).replace(
              '"/studio/new?template=webtoon-vertical-episode&workspace=comic"',
              '"/studio/templates/webtoon-vertical-episode/start"',
          )
          save(catalog_test_path, catalog_test)

          # Canonical lazy exports and app routes.
          pages = "apps/web/src/app/routes/groups/creator-route-pages.ts"
          insert(
              pages,
              "export const StudioTemplatesPage = lazyRetry(",
              '''export const StudioTemplateStartRoute = lazyRetry(\n  () => import("@/domains/creator/studio-shell/StudioTemplateStartRoute").then((module) => ({\n    default: module.StudioTemplateStartRoute,\n  })),\n  "StudioTemplateStartRoute",\n);\n''',
              "export const StudioTemplateStartRoute",
          )
          routes_path = "apps/web/src/app/routes/groups/creator.routes.tsx"
          routes = text(routes_path)
          if "  StudioTemplateStartRoute," not in routes:
              anchor = "  StudioTemplatesPage,\n"
              if anchor not in routes:
                  raise SystemExit("creator.routes.tsx: templates import missing")
              routes = routes.replace(anchor, anchor + "  StudioTemplateStartRoute,\n", 1)
          if 'path: "/studio/templates/:templateId/start"' not in routes:
              anchor = '  { id: "creator-studio-templates", path: "/studio/templates", element: <StudioTemplatesPage /> },\n'
              if anchor not in routes:
                  raise SystemExit("creator.routes.tsx: templates route missing")
              routes = routes.replace(
                  anchor,
                  '  { id: "creator-studio-template-start", path: "/studio/templates/:templateId/start", element: <StudioTemplateStartRoute /> },\n' + anchor,
                  1,
              )
          save(routes_path, routes)

          # Mount the handoff in the existing editor host.
          hosts_path = "apps/web/src/domains/creator/studio-cuttoon-editor/StudioCuttoonEditorHosts.tsx"
          hosts = text(hosts_path)
          if 'from "./StudioTemplateHandoffHost"' not in hosts:
              anchor = 'import { StudioImportHandoffHost } from "./StudioImportHandoffHost";\n'
              if anchor not in hosts:
                  raise SystemExit("StudioCuttoonEditorHosts.tsx: import handoff import missing")
              hosts = hosts.replace(anchor, anchor + 'import { StudioTemplateHandoffHost } from "./StudioTemplateHandoffHost";\n', 1)
          if "<StudioTemplateHandoffHost" not in hosts:
              offset = hosts.find("<StudioImportHandoffHost")
              if offset < 0:
                  raise SystemExit("StudioCuttoonEditorHosts.tsx: import handoff mount missing")
              hosts = hosts[:offset] + "<StudioTemplateHandoffHost />\n      " + hosts[offset:]
          save(hosts_path, hosts)

          # Seller centre is an authoring projection alongside account-backed management.
          hub_path = "apps/web/src/domains/creator/studio-shell/StudioAssetHubPage.tsx"
          hub = text(hub_path)
          if 'from "./StudioMarketplaceSellerPanel"' not in hub:
              anchor = 'import { StudioAssetGovernancePanel } from "./StudioAssetGovernancePanel";\n'
              if anchor not in hub:
                  raise SystemExit("StudioAssetHubPage.tsx: governance import missing")
              hub = hub.replace(anchor, anchor + 'import { StudioMarketplaceSellerPanel } from "./StudioMarketplaceSellerPanel";\n', 1)
          old = '      {view === "seller" ? <MarketManagePage /> : null}\n'
          if old in hub:
              hub = hub.replace(old, '''      {view === "seller" ? (\n        <>\n          <MarketManagePage />\n          <Container size="wide" className="pb-10 sm:pb-14">\n            <StudioMarketplaceSellerPanel\n              sellerId={projectId ?? "current-seller"}\n              locale={locale}\n            />\n          </Container>\n        </>\n      ) : null}\n''', 1)
          elif "<StudioMarketplaceSellerPanel" not in hub:
              raise SystemExit("StudioAssetHubPage.tsx: seller projection missing")
          save(hub_path, hub)

          # Reachability must include every continuation surface.
          reach_path = "scripts/verify-toonstudio-feature-reachability.mjs"
          reach = text(reach_path)
          marker = '  "apps/web/src/domains/creator/studio-template-system.ts",\n'
          additions = [
              '  "apps/web/src/domains/creator/studio-template-catalog.ts",\n',
              '  "apps/web/src/domains/creator/studio-marketplace-submission-store.ts",\n',
              '  "apps/web/src/domains/creator/studio-shell/StudioTemplatesPage.tsx",\n',
              '  "apps/web/src/domains/creator/studio-shell/StudioTemplateStartRoute.tsx",\n',
              '  "apps/web/src/domains/creator/studio-cuttoon-editor/StudioTemplateHandoffHost.tsx",\n',
              '  "apps/web/src/domains/creator/studio-shell/StudioMarketplaceSellerPanel.tsx",\n',
              '  "apps/web/src/domains/creator/studio-shell/StudioAssetGovernancePanel.tsx",\n',
              '  "apps/web/src/domains/creator/studio-shell/StudioProjectDeliveryPanel.tsx",\n',
              '  "apps/web/src/domains/creator/studio-shell/StudioExternalEntryRoutes.tsx",\n',
          ]
          for addition in additions:
              if addition.strip() in reach:
                  continue
              if marker not in reach:
                  raise SystemExit("feature reachability insertion marker missing")
              reach = reach.replace(marker, marker + addition, 1)
          save(reach_path, reach)

          # Ensure the closure contract includes both runtime paths, without duplicate test names.
          closure_path = "apps/web/src/domains/creator/studio-integration-closure.test.ts"
          closure = text(closure_path)
          tests = []
          if "applies template handoffs in the real document runtime" not in closure:
              tests.append('''\n  it("applies template handoffs in the real document runtime", () => {\n    const routes = source("apps/web/src/app/routes/groups/creator.routes.tsx");\n    const hosts = source("apps/web/src/domains/creator/studio-cuttoon-editor/StudioCuttoonEditorHosts.tsx");\n    const handoff = source("apps/web/src/domains/creator/studio-cuttoon-editor/StudioTemplateHandoffHost.tsx");\n    expect(routes).toContain('path: "/studio/templates/:templateId/start"');\n    expect(hosts).toContain("<StudioTemplateHandoffHost");\n    expect(handoff).toContain("updateStudioProjectFeatureSuite");\n    expect(handoff).toContain("STUDIO_TEMPLATE_APPLIED_EVENT");\n  });\n''')
          if "connects the functional seller workflow" not in closure:
              tests.append('''\n  it("connects the functional seller workflow without claiming remote completion", () => {\n    const hub = source("apps/web/src/domains/creator/studio-shell/StudioAssetHubPage.tsx");\n    const seller = source("apps/web/src/domains/creator/studio-shell/StudioMarketplaceSellerPanel.tsx");\n    const store = source("apps/web/src/domains/creator/studio-marketplace-submission-store.ts");\n    expect(hub).toContain("<StudioMarketplaceSellerPanel");\n    expect(hub).toContain("<MarketManagePage");\n    expect(seller).toContain("crypto.subtle.digest");\n    expect(seller).toContain("evaluateStudioMarketplaceSubmission");\n    expect(seller).not.toContain("업로드 완료");\n    expect(store).toContain("STUDIO_MARKETPLACE_SUBMISSION_UPDATED_EVENT");\n  });\n''')
          if tests:
              ending = "\n});\n"
              if not closure.endswith(ending):
                  raise SystemExit("integration closure ending missing")
              closure = closure[:-len(ending)] + "".join(tests) + ending
              save(closure_path, closure)

          # Remove all known one-shot writers before closure and final publication.
          transient = [
              ".github/workflows/repair-toonstudio-finalization-v2.yml",
              ".github/workflows/finalize-toonstudio-continuation.yml",
              ".github/workflows/apply-toonstudio-seller-center.yml",
              ".github/workflows/apply-toonstudio-continuation.yml",
              ".github/workflows/repair-toonstudio-continuation.yml",
              ".github/workflows/validate-toonstudio-continuation.yml",
              ".github/workflows/toonstudio-continuation-source-snapshot.yml",
              ".github/workflows/toonstudio-followup-source-snapshot.yml",
              ".github/workflows/finalize-toonstudio-session.yml",
              ".github/workflows/apply-toonstudio-session-fixes.yml",
              ".github/workflows/apply-toonstudio-session-fixes-retry.yml",
              ".github/workflows/toonstudio-final-sync-v2.yml",
              ".github/workflows/repair-sync-toonstudio-session.yml",
              ".github/workflows/install-toonstudio-session-gate.yml",
              ".github/workflows/apply-toonstudio-project-contract-repair.yml",
          ]
          for path in transient:
              Path(path).unlink(missing_ok=True)
          PY

      - name: Format and lint continuation source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -t files < <((git diff --name-only origin/main...HEAD; git diff --name-only) | sort -u | grep -E '\.(ts|tsx|mjs)$' || true)
          if ((${#files[@]})); then
            pnpm exec prettier --write "${files[@]}"
            pnpm exec eslint --fix --no-warn-ignored "${files[@]}"
          fi
          git diff --check

      - name: Typecheck whole workspace
        run: pnpm exec tsc -p tsconfig.json --noEmit --pretty false

      - name: Run focused continuation tests
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/studio-template-catalog.test.ts
          apps/web/src/domains/creator/studio-external-route.test.ts
          apps/web/src/domains/creator/studio-marketplace-submission-store.test.ts
          apps/web/src/domains/creator/studio-marketplace-submission.test.ts
          apps/web/src/domains/creator/studio-route-registry.test.ts
          apps/web/src/domains/creator/studio-product-ia.test.ts
          apps/web/src/domains/creator/studio-project-view-destinations.test.ts
          apps/web/src/domains/creator/studio-integration-closure.test.ts
          apps/web/src/domains/creator/studio-asset-governance.test.ts
          apps/web/src/domains/creator/studio-asset-passport.test.ts
          apps/web/src/domains/creator/studio-asset-provider.test.ts
          apps/web/src/domains/creator/studio-rights-graph.test.ts
          apps/web/src/domains/creator/studio-font-audit.test.ts
          apps/web/src/domains/creator/studio-plugin-registry.test.ts
          apps/web/src/domains/creator/studio-archive-manifest.test.ts
          apps/web/src/domains/creator/studio-publishing-connector.test.ts
          apps/web/src/domains/creator/studio-publishing-package.test.ts
          apps/web/src/domains/creator/studio-cuttoon-editor/StudioTemplateHandoffHost.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioTemplateStartRoute.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioTemplatesPage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioMarketplaceSellerPanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioAssetHubPage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioAssetGovernancePanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectDeliveryPanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.test.tsx
          --pool=forks --maxWorkers=2

      - name: Verify all integration tracks
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-toonstudio-feature-reachability.mjs
          if pnpm run | grep -q 'verify:studio-ia'; then pnpm run verify:studio-ia; fi
          if pnpm run | grep -q 'verify:studio-session-complete'; then pnpm run verify:studio-session-complete; fi
          bash scripts/verify-toonstudio-integration.sh core
          bash scripts/verify-toonstudio-integration.sh ui
          bash scripts/verify-toonstudio-integration.sh editor

      - name: Build production bundle
        run: pnpm run build:bundle

      - name: Record validated completion and push
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/rewrite
          cat > docs/rewrite/toonstudio-continuation-v2-acceptance.md <<EOF
          # ToonStudio continuation v2 acceptance

          - Validated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Base main: \`$(git rev-parse origin/main)\`
          - Whole-workspace TypeScript: passed
          - ESLint continuation delta: passed
          - Focused creation, template, asset, seller and delivery tests: passed
          - Feature reachability: passed
          - Core, UI and editor integration: passed
          - Production bundle: passed

          Template selection creates a fresh document identity and is consumed once by the real editor host. Seller files are hashed with SHA-256 and persist without concurrent-write loss. Actual remote upload, purchase, paid inference and publishing remain fail-closed until authenticated connectors are configured.
          EOF
          git config user.name "toonstudio-integration-bot"
          git config user.email "toonstudio-integration-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(studio): finalize template and seller workflows"
          git push origin HEAD:feat/toonstudio-session-completion-followup-20260911
