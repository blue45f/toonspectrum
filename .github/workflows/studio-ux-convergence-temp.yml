name: Temporary Studio UX convergence

on:
  push:
    branches:
      - codex/studio-ux-convergence-20260905
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-ux-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/studio-ux-convergence-20260905
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Normalize extraction-era source anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          patcher = Path('.github/scripts/apply-studio-ux-convergence.py')
          source = patcher.read_text(encoding='utf-8')
          replacements = [
              (
                  '''WORKSPACE = "src/domains/creator/studio-cuttoon-editor/StudioCuttoonEditorWorkspace.tsx"
replace_once(
    WORKSPACE,
    "  return (\\n      <div\\n        className={cn(\\n",
    "  return (\\n      <div\\n        id=\\"studio-workspace\\"\\n        role=\\"group\\"\\n        aria-label=\\"편집 작업공간\\"\\n        tabIndex={-1}\\n        className={cn(\\n",
)''',
                  '''WORKSPACE = "src/domains/creator/studio-cuttoon-editor/StudioCuttoonEditorWorkspace.tsx"
replace_once(
    WORKSPACE,
    "  return (\\n      <div\\n        data-studio-mobile-canvas-workspace={isMobile ? \\\"true\\\" : undefined}\\n        className={cn(\\n",
    "  return (\\n      <div\\n        id=\\"studio-workspace\\"\\n        role=\\"group\\"\\n        aria-label=\\"편집 작업공간\\"\\n        tabIndex={-1}\\n        data-studio-mobile-canvas-workspace={isMobile ? \\\"true\\\" : undefined}\\n        className={cn(\\n",
)''',
              ),
              (
                  '''CANVAS = "src/domains/creator/studio-cuttoon-editor/StudioCuttoonEditorCanvasColumn.tsx"
replace_once(
    CANVAS,
    "  return (\\n      <div\\n        className={cn(\\n",
    "  return (\\n      <div\\n        id=\\"studio-canvas-workspace\\"\\n        role=\\"region\\"\\n        aria-label=\\"캔버스 작업영역\\"\\n        tabIndex={-1}\\n        className={cn(\\n",
)''',
                  '''CANVAS = "src/domains/creator/studio-cuttoon-editor/StudioCuttoonEditorCanvasColumn.tsx"
replace_once(
    CANVAS,
    "  return (\\n          <div\\n            className={cn(\\n",
    "  return (\\n          <div\\n            id=\\"studio-canvas-workspace\\"\\n            role=\\"region\\"\\n            aria-label=\\"캔버스 작업영역\\"\\n            tabIndex={-1}\\n            className={cn(\\n",
)''',
              ),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'bootstrap anchor not unique: {old[:80]!r} -> {source.count(old)}')
              source = source.replace(old, new, 1)
          patcher.write_text(source, encoding='utf-8')
          PY
      - name: Apply Studio UX convergence patch
        run: python3 .github/scripts/apply-studio-ux-convergence.py
      - name: Align source-contract tests with desktop landmarks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/domains/creator/StudioInspectorAsideShell.accessibility-contract.test.ts')
          source = path.read_text(encoding='utf-8')
          old = 'expect(asideSource).toContain(\'aria-label={isMobile ? "작업 패널" : undefined}\');'
          new = 'expect(asideSource).toContain(\'aria-label="작업 패널"\');'
          if source.count(old) != 1:
              raise SystemExit(f'inspector accessibility assertion anchor count: {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Check patch whitespace
        run: git diff --check
      - name: Run focused Studio UX tests
        run: >-
          pnpm exec vitest run
          src/domains/creator/studio-workspace-landmarks.test.ts
          src/domains/creator/StudioWorkspaceNavigator.test.tsx
          src/domains/creator/StudioSurfaceState.test.tsx
          src/domains/creator/StudioProjectCenterSearch.test.tsx
          src/domains/creator/studio-ux-convergence-boundary.test.ts
          src/domains/creator/studio-chrome-ui.test.tsx
          src/domains/creator/StudioMenubarContent.test.tsx
          src/domains/creator/studio-review-entry-point-viewports.test.tsx
          src/domains/creator/StudioCompanionAssistantDisplay.test.tsx
          src/domains/creator/StudioInspectorAsideShell.accessibility-contract.test.ts
          scripts/verify-studio-hybrid-dcc-integration.test.ts
      - name: Lint changed source quickly
        run: pnpm run lint:quick
      - name: Typecheck repository
        run: pnpm run typecheck
      - name: Remove temporary bootstrap files
        run: |
          rm .github/scripts/apply-studio-ux-convergence.py
          rm .github/workflows/studio-ux-convergence-temp.yml
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(studio): converge navigation states and project center UX"
          git push origin HEAD:codex/studio-ux-convergence-20260905
