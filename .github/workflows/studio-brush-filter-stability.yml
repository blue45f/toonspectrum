name: Studio brush and filter stability

on:
  push:
    branches: [fix/studio-brush-filter-stability-20260906]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-brush-filter-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
      - name: Archive reviewable source at the tested commit
        run: |
          mkdir -p /tmp/studio-stability-source
          git rev-parse HEAD > /tmp/studio-stability-source/commit.txt
          git archive --format=tar.gz HEAD src scripts packages lib tests package.json tsconfig.json vitest.config.ts .github/workflows > /tmp/studio-stability-source/source.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: studio-stability-source
          path: /tmp/studio-stability-source
          retention-days: 3
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Filter worker regression tests
        run: pnpm exec vitest run src/domains/creator/studio-image-filter-worker-client.test.ts
      - run: pnpm run build:bundle
      - uses: actions/upload-artifact@v6
        with:
          name: studio-stability-dist
          path: dist
          retention-days: 3

  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        suite: [filters, brushes]
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      TOONSPECTRUM_VERIFY_DIR: /tmp/studio-stability-evidence
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v6
        with:
          name: studio-stability-dist
          path: dist
      - name: Every filter through the shipped dialog, pixel change and undo
        if: matrix.suite == 'filters'
        env:
          TOONSPECTRUM_FILTER_DIALOG_SURVEY: '1'
        run: pnpm run verify:studio-filter-dialog
      - name: Every listed brush with short and long strokes, undo, redo and durability
        if: matrix.suite == 'brushes'
        env:
          TOONSPECTRUM_BRUSH_SURVEY: '1'
          TOONSPECTRUM_ALL_BRUSH_LONG_MATRIX: '1'
        run: pnpm run verify:studio-brushes
      - name: Preserve evidence even when a product check fails
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: studio-stability-${{ matrix.suite }}
          path: /tmp/studio-stability-evidence
          retention-days: 7
          if-no-files-found: warn
