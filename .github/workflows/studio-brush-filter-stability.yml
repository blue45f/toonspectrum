name: Studio brush and filter stability

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main, release/salvage-integration-20260908]
    paths:
      - 'apps/web/src/domains/creator/brush/**'
      - 'apps/web/src/domains/creator/brush-lab/**'
      - 'apps/web/src/domains/creator/filter/**'
      - 'apps/web/src/domains/creator/live/studio-live-retained-media-overlay.ts'
      - 'apps/web/src/domains/creator/export/studio-svg-export-freehand-media.ts'
      - 'apps/web/src/domains/creator/StudioBrushHubPanel*'
      - 'apps/web/src/domains/creator/studio-brush-*'
      - 'apps/web/src/domains/creator/studio-image-filter*'
      - 'apps/web/src/domains/creator/studio-detail*'
      - 'scripts/verify-studio-brushes.mts'
      - 'scripts/verify-studio-filter-dialog.mts'
      - 'scripts/verify-studio-source-hydration.mts'
      - 'apps/web/src/infrastructure/creator-work-read-options*'
      - 'apps/web/src/domains/creator/StudioCuttoonEditorHost.tsx'
      - 'apps/web/src/domains/creator/studio-shared-document-client*'
      - 'apps/web/src/domains/creator/studio-release-schedule-loader*'
      - '.github/workflows/studio-brush-filter-stability.yml'
  push:
    branches: [main, release/salvage-integration-20260908]
    paths:
      - 'apps/web/src/domains/creator/brush/**'
      - 'apps/web/src/domains/creator/brush-lab/**'
      - 'apps/web/src/domains/creator/filter/**'
      - 'apps/web/src/domains/creator/live/studio-live-retained-media-overlay.ts'
      - 'apps/web/src/domains/creator/export/studio-svg-export-freehand-media.ts'
      - 'apps/web/src/domains/creator/StudioBrushHubPanel*'
      - 'apps/web/src/domains/creator/studio-brush-*'
      - 'apps/web/src/domains/creator/studio-image-filter*'
      - 'apps/web/src/domains/creator/studio-detail*'
      - 'scripts/verify-studio-brushes.mts'
      - 'scripts/verify-studio-filter-dialog.mts'
      - 'scripts/verify-studio-source-hydration.mts'
      - 'apps/web/src/infrastructure/creator-work-read-options*'
      - 'apps/web/src/domains/creator/StudioCuttoonEditorHost.tsx'
      - 'apps/web/src/domains/creator/studio-shared-document-client*'
      - 'apps/web/src/domains/creator/studio-release-schedule-loader*'
      - '.github/workflows/studio-brush-filter-stability.yml'
  workflow_dispatch:

permissions:
  contents: read

# This non-required evidence suite keeps the latest PR/ref run; ci.yml independently
# runs the required core validation for each active pull request or main push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Consolidated product catalogue and render boundary contracts
        run: |
          set -o pipefail
          mkdir -p /tmp/studio-stability-unit-evidence
          git rev-parse HEAD > /tmp/studio-stability-unit-evidence/commit.txt
          pnpm exec vitest run \
            apps/web/src/domains/creator/brush/studio-brush-quality-portfolio.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-listed-uniqueness.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-browser-evidence.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-composition-runtime.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-composition-runtime-boundary.test.ts \
            apps/web/src/domains/creator/brush/StudioBrushEngineProgramControls.test.tsx \
            apps/web/src/domains/creator/brush-lab/brush-studio-v5-quality.test.ts \
            apps/web/src/domains/creator/brush-lab/brush-studio-version-integration.test.ts \
            2>&1 | tee /tmp/studio-stability-unit-evidence/brush-product-contracts.log
          pnpm exec tsx scripts/audit-studio-brush-quality-portfolio.mts \
            2>&1 | tee /tmp/studio-stability-unit-evidence/brush-product-audit.log
      - name: Worker recovery, exact median pixels, texture loading and verifier regressions
        run: |
          set -o pipefail
          mkdir -p /tmp/studio-stability-unit-evidence
          git rev-parse HEAD > /tmp/studio-stability-unit-evidence/commit.txt
          pnpm exec vitest run \
            apps/web/src/domains/creator/studio-image-filter-worker-client.test.ts \
            apps/web/src/domains/creator/studio-image-filter-worker-stability.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-r8-grain-hydrator.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-r8-png-decoder.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-browser-harness-boundary.test.ts \
            apps/web/src/domains/creator/studio-detail.test.ts \
            apps/web/src/domains/creator/studio-detail-median-stability.test.ts \
            2>&1 | tee /tmp/studio-stability-unit-evidence/tests.log
      - name: Preserve focused regression results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: studio-stability-unit-results
          path: /tmp/studio-stability-unit-evidence
          retention-days: 7
          if-no-files-found: warn
      - run: pnpm run build:bundle
      - name: Require the production manifest used by SQLite durability checks
        run: test -s dist/.vite/manifest.json
      - uses: actions/upload-artifact@v6
        with:
          name: studio-stability-dist
          path: dist
          include-hidden-files: true
          retention-days: 3
      - name: Preserve the tested filter Worker separately for reproducible CPU soak tests
        uses: actions/upload-artifact@v6
        with:
          name: studio-stability-filter-worker
          path: |
            dist/assets/studio-image-filter.worker-*.js
            dist/.vite/manifest.json
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        suite: [filters, desktop, long, shapes, mobile, durability, source]
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      TOONSPECTRUM_VERIFY_DIR: /tmp/studio-stability-evidence
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v6
        with:
          name: studio-stability-dist
          path: dist
      - name: Verify hidden manifest survived artifact transport
        run: test -s dist/.vite/manifest.json
      - name: Every dialog filter repeated in the same browser session
        if: matrix.suite == 'filters'
        env:
          TOONSPECTRUM_FILTER_DIALOG_SURVEY: '1'
          TOONSPECTRUM_FILTER_DIALOG_ROUNDS: '3'
        run: pnpm run verify:studio-filter-dialog
      - name: Brush catalogue, long strokes, geometry, touch targets and save recovery
        if: matrix.suite != 'filters' && matrix.suite != 'source'
        env:
          TOONSPECTRUM_BRUSH_VERIFY_STAGE: ${{ matrix.suite }}
          TOONSPECTRUM_BRUSH_STABILITY_ROUNDS: '2'
          TOONSPECTRUM_BRUSH_SURVEY: '1'
          TOONSPECTRUM_ALL_BRUSH_LONG_MATRIX: '1'
        run: pnpm run verify:studio-brushes
      - name: Manuscript source retries, authentication ordering and fail-closed UI
        if: matrix.suite == 'source'
        run: pnpm exec tsx scripts/verify-studio-source-hydration.mts
      - name: Preserve evidence even when a product check fails
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: studio-stability-${{ matrix.suite }}
          path: /tmp/studio-stability-evidence
          retention-days: 7
          if-no-files-found: warn
