name: Finalize PR 1307 squash rebase

on:
  push:
    branches:
      - feat/toonstudio-final-ia-20260911
    paths:
      - .github/workflows/pr1307-final-squash-rebase.yml

permissions:
  contents: write

concurrency:
  group: pr1307-final-squash-rebase
  cancel-in-progress: false

jobs:
  validate-and-rebase:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BRANCH: feat/toonstudio-final-ia-20260911
      HELPER_WORKFLOW: .github/workflows/pr1307-final-squash-rebase.yml
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-final-ia-20260911
          fetch-depth: 0
          persist-credentials: true

      - name: Freeze source and main revisions
        id: revisions
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune

          FEATURE_HEAD="$(git rev-parse HEAD)"
          MAIN_HEAD="$(git rev-parse origin/main)"
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"

          if [[ "$REMOTE_HEAD" != "$FEATURE_HEAD" ]]; then
            echo "Feature branch advanced before validation: local=$FEATURE_HEAD remote=$REMOTE_HEAD" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$MAIN_HEAD" "$FEATURE_HEAD"; then
            echo "Current main is not an ancestor of the reviewed feature tree." >&2
            exit 1
          fi

          rm -f "$HELPER_WORKFLOW"
          git add -A
          FINAL_TREE="$(git write-tree)"

          {
            echo "feature_head=$FEATURE_HEAD"
            echo "main_head=$MAIN_HEAD"
            echo "final_tree=$FINAL_TREE"
          } >> "$GITHUB_OUTPUT"

          printf 'Frozen feature: %s\nFrozen main: %s\nFinal tree without helper: %s\n' \
            "$FEATURE_HEAD" "$MAIN_HEAD" "$FINAL_TREE"

      - name: Set up pnpm before cache discovery
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Set up Node.js and pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify conflict and integration invariants
        shell: bash
        run: |
          set -euo pipefail

          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>|\|\|\|\|\|\|\|)( |$)' -- \
            '*.ts' '*.tsx' '*.js' '*.mjs' '*.mts' '*.json' '*.yml' '*.yaml'; then
            echo 'Unresolved conflict marker found.' >&2
            exit 1
          fi

          grep -F 'path: "/studio/p/:projectId/overview"' apps/web/src/app/routes/groups/creator.routes.tsx
          grep -F 'path: "/studio/p/:projectId/export"' apps/web/src/app/routes/groups/creator.routes.tsx
          grep -F 'path: "/studio/assets/brushes/:brushId/edit"' apps/web/src/app/routes/groups/creator.routes.tsx
          grep -F 'StudioProjectShellPage' apps/web/src/app/routes/groups/creator-route-pages.ts
          grep -F 'StudioImportIntegratedPage' apps/web/src/app/routes/groups/creator-route-pages.ts
          grep -F 'siteNavigationContextForPath' apps/web/src/shared/components/site-navigation.ts
          grep -F 'fortune:' apps/web/src/shared/components/site-navigation.ts
          grep -F 'StudioBrushIntegratedWorkbench' apps/web/src/domains/creator/brush-lab/StudioBrushLabPage.tsx
          grep -F 'StudioBrushLegacyCataloguePanel' apps/web/src/domains/creator/brush-lab/StudioBrushLabPage.tsx

          test ! -e .github/workflows/toonstudio-rebase-reconcile.yml
          test ! -e .github/workflows/toonstudio-menu-contract-repair.yml
          test ! -e scripts/repair-studio-menu-contract.mjs
          test ! -e .github/workflows/pr1307-integration-validation.yml
          test ! -e "$HELPER_WORKFLOW"
          git diff --cached --check

      - name: Run conflict, route, import, brush and project regression tests
        run: >-
          pnpm exec vitest run
          apps/web/src/app/routes/groups/creator-brush-lab-route-contract.test.ts
          apps/web/src/app/routes/groups/studio-manual.routes.test.tsx
          apps/web/src/app/routes/app-routes.test.tsx
          apps/web/src/shared/components/site-navigation.test.ts
          apps/web/src/shared/components/site-shell-mobile-accessibility.test.tsx
          apps/web/src/domains/creator/studio-and-spectrum-ia-contract.test.ts
          apps/web/src/domains/creator/studio-route-paths.test.ts
          apps/web/src/domains/creator/studio-final-integration.test.ts
          apps/web/src/domains/creator/studio-final-dod-contract.test.ts
          apps/web/src/domains/creator/studio-main-menu-groups.test.ts
          apps/web/src/domains/creator/studio-main-menu-group-spec.test.ts
          apps/web/src/domains/creator/brush-lab/brush-studio-version-integration.test.ts
          apps/web/src/domains/creator/studio-import-handoff.test.ts
          apps/web/src/domains/creator/studio-project-view-destinations.test.ts
          apps/web/src/domains/creator/studio-shell/StudioDocumentWorkspaceRoute.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectReadinessPanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectShellPage.integration.test.tsx
          apps/web/src/domains/creator/studio-cuttoon-editor/StudioImportHandoffHost.test.tsx

      - name: Lint manually reconciled and newly integrated files
        run: >-
          pnpm exec eslint --max-warnings=0
          apps/web/src/app/routes/groups/creator-route-pages.ts
          apps/web/src/app/routes/groups/creator.routes.tsx
          apps/web/src/app/routes/groups/studio-manual.routes.test.tsx
          apps/web/src/app/routes/groups/creator-brush-lab-route-contract.test.ts
          apps/web/src/shared/components/site-navigation.ts
          apps/web/src/shared/components/site-navigation.test.ts
          apps/web/src/domains/creator/studio-shell/StudioProjectShellPage.tsx
          apps/web/src/domains/creator/studio-shell/StudioDocumentWorkspaceRoute.tsx
          apps/web/src/domains/creator/studio-shell/StudioImportIntegratedPage.tsx
          apps/web/src/domains/creator/studio-shell/StudioImportIntake.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectReadinessPanel.tsx
          apps/web/src/domains/creator/studio-cuttoon-editor/StudioCuttoonEditorHosts.tsx
          apps/web/src/domains/creator/studio-cuttoon-editor/StudioImportHandoffHost.tsx
          apps/web/src/domains/creator/studio-import-handoff.ts
          apps/web/src/domains/creator/studio-project-view-destinations.ts
          apps/web/src/domains/creator/brush-lab/StudioBrushIntegratedWorkbench.tsx
          apps/web/src/domains/creator/brush-lab/StudioBrushLabPage.tsx
          apps/web/src/domains/creator/brush-lab/StudioBrushLegacyCataloguePanel.tsx
          apps/web/src/domains/creator/brush-lab/brush-studio-version-integration.ts
          apps/web/src/domains/creator/studio-command-catalog-base.ts
          apps/web/src/domains/creator/studio-main-menu-groups.test.ts

      - name: Type-check the complete repository
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm run typecheck

      - name: Build the production application
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm run build

      - name: Rewrite history as one commit directly on main
        shell: bash
        env:
          FEATURE_HEAD: ${{ steps.revisions.outputs.feature_head }}
          MAIN_HEAD: ${{ steps.revisions.outputs.main_head }}
          FINAL_TREE: ${{ steps.revisions.outputs.final_tree }}
        run: |
          set -euo pipefail

          if ! git diff --quiet; then
            echo 'Validation changed tracked working-tree files.' >&2
            git diff --stat >&2
            exit 1
          fi
          if [[ "$(git write-tree)" != "$FINAL_TREE" ]]; then
            echo 'The staged final tree drifted during validation.' >&2
            exit 1
          fi

          git fetch origin main --prune
          LATEST_MAIN="$(git rev-parse origin/main)"
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          if [[ "$LATEST_MAIN" != "$MAIN_HEAD" ]]; then
            echo "main advanced during validation: frozen=$MAIN_HEAD latest=$LATEST_MAIN" >&2
            exit 1
          fi
          if [[ "$REMOTE_HEAD" != "$FEATURE_HEAD" ]]; then
            echo "feature branch advanced during validation: frozen=$FEATURE_HEAD remote=$REMOTE_HEAD" >&2
            exit 1
          fi

          git reset --soft "$MAIN_HEAD"
          if [[ "$(git write-tree)" != "$FINAL_TREE" ]]; then
            echo 'Soft reset did not preserve the validated final tree.' >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'No feature changes remain after resetting onto main.' >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'rebase: reconcile ToonStudio IA with main'

          NEW_HEAD="$(git rev-parse HEAD)"
          PARENT_HEAD="$(git rev-parse HEAD^)"
          COMMITTED_TREE="$(git rev-parse HEAD^{tree})"
          if [[ "$PARENT_HEAD" != "$MAIN_HEAD" ]]; then
            echo "Unexpected parent: expected=$MAIN_HEAD actual=$PARENT_HEAD" >&2
            exit 1
          fi
          if [[ "$COMMITTED_TREE" != "$FINAL_TREE" ]]; then
            echo "Unexpected committed tree: expected=$FINAL_TREE actual=$COMMITTED_TREE" >&2
            exit 1
          fi

          git push \
            --force-with-lease="refs/heads/$BRANCH:$FEATURE_HEAD" \
            origin "HEAD:refs/heads/$BRANCH"

          printf 'Rebased head: %s\nDirect parent: %s\nValidated tree: %s\n' \
            "$NEW_HEAD" "$PARENT_HEAD" "$COMMITTED_TREE"
