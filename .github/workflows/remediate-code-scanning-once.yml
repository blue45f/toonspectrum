name: Remediate code scanning alerts once

on:
  push:
    branches:
      - fix/code-scanning-alerts-20260910-v3
    paths:
      - .github/workflows/remediate-code-scanning-once.yml

permissions:
  actions: read
  contents: write
  pull-requests: write
  security-events: write

concurrency:
  group: remediate-code-scanning-alerts-20260910-v3
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: fix/code-scanning-alerts-20260910-v3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/code-scanning-alerts-20260910-v3
          fetch-depth: 0

      - name: Synchronize with current main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Inventory open alerts
        run: |
          set -euo pipefail
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100" \
            --slurp | jq 'add // []' > /tmp/open-alerts.json

          count="$(jq 'length' /tmp/open-alerts.json)"
          echo "OPEN_ALERT_COUNT=${count}" >> "$GITHUB_ENV"
          {
            echo "## Code scanning inventory"
            echo
            echo "Open alerts before remediation: **${count}**"
            echo
            echo '| Alert | Severity | Rule | Location | Tool |'
            echo '|---:|---|---|---|---|'
            jq -r '.[] | [
              ("#" + (.number|tostring)),
              (.rule.security_severity_level // .rule.severity // "unknown"),
              (.rule.id // "unknown"),
              (((.most_recent_instance.location.path // "unknown") + ":" + ((.most_recent_instance.location.start_line // 0)|tostring))),
              (.tool.name // "unknown")
            ] | "| " + join(" | ") + " |"' /tmp/open-alerts.json
          } >> "$GITHUB_STEP_SUMMARY"

          jq -r '.[] | [
            (.number|tostring),
            (.rule.id // "unknown"),
            (.rule.security_severity_level // .rule.severity // "unknown"),
            (.most_recent_instance.location.path // "unknown"),
            ((.most_recent_instance.location.start_line // 0)|tostring)
          ] | @tsv' /tmp/open-alerts.json > /tmp/open-alerts.tsv
          cat /tmp/open-alerts.tsv

      - name: Generate and commit available CodeQL autofixes
        if: env.OPEN_ALERT_COUNT != '0'
        run: |
          set -euo pipefail
          : > /tmp/autofix-results.tsv

          while IFS=$'\t' read -r alert_number rule severity path line; do
            echo "Requesting autofix for alert #${alert_number} (${rule}, ${path}:${line})"
            create_status="$(curl -sS -o "/tmp/autofix-${alert_number}.json" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/code-scanning/alerts/${alert_number}/autofix")"

            if [[ "${create_status}" != "202" && "${create_status}" != "200" ]]; then
              printf '%s\t%s\t%s\t%s:%s\trequest-http-%s\n' \
                "$alert_number" "$rule" "$severity" "$path" "$line" "$create_status" >> /tmp/autofix-results.tsv
              continue
            fi

            autofix_status="pending"
            for attempt in $(seq 1 36); do
              sleep 5
              curl -sS \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/code-scanning/alerts/${alert_number}/autofix" \
                > "/tmp/autofix-status-${alert_number}.json"
              autofix_status="$(jq -r '.status // "unknown"' "/tmp/autofix-status-${alert_number}.json")"
              case "$autofix_status" in
                pending|generating)
                  ;;
                *)
                  break
                  ;;
              esac
            done

            if [[ "$autofix_status" != "succeeded" ]]; then
              printf '%s\t%s\t%s\t%s:%s\t%s\n' \
                "$alert_number" "$rule" "$severity" "$path" "$line" "autofix-${autofix_status}" >> /tmp/autofix-results.tsv
              continue
            fi

            commit_status="$(curl -sS -o "/tmp/autofix-commit-${alert_number}.json" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              -d "{\"target_ref\":\"refs/heads/${TARGET_BRANCH}\"}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/code-scanning/alerts/${alert_number}/autofix/commits")"

            if [[ "$commit_status" == "201" || "$commit_status" == "200" ]]; then
              printf '%s\t%s\t%s\t%s:%s\tcommitted\n' \
                "$alert_number" "$rule" "$severity" "$path" "$line" >> /tmp/autofix-results.tsv
            else
              printf '%s\t%s\t%s\t%s:%s\tcommit-http-%s\n' \
                "$alert_number" "$rule" "$severity" "$path" "$line" "$commit_status" >> /tmp/autofix-results.tsv
            fi
          done < /tmp/open-alerts.tsv

          {
            echo
            echo "## Autofix results"
            echo
            echo '| Alert | Rule | Severity | Location | Result |'
            echo '|---:|---|---|---|---|'
            awk -F '\t' '{printf "| #%s | %s | %s | %s | %s |\n", $1, $2, $3, $4, $5}' /tmp/autofix-results.tsv
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/autofix-results.tsv

      - name: Capture remaining manual-remediation inventory
        run: |
          set -euo pipefail
          sleep 5
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100" \
            --slurp | jq 'add // []' > /tmp/remaining-alerts.json

          {
            echo
            echo "## Alerts still open pending a new analysis"
            echo
            echo "Open alert records immediately after autofix commits: **$(jq 'length' /tmp/remaining-alerts.json)**"
            echo
            echo '> GitHub closes fixed alerts only after CodeQL analyzes the updated branch/default branch. This count is an inventory, not a dismissal result.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retire this one-shot workflow
        run: |
          set -euo pipefail
          git fetch origin "${TARGET_BRANCH}"
          git reset --hard "origin/${TARGET_BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remediate-code-scanning-once.yml
          git commit -m "chore(security): retire code-scanning autofix runner"
          git push origin "HEAD:${TARGET_BRANCH}"
