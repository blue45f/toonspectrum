name: Apply Studio context help typecheck repair

on:
  push:
    branches: [fix/studio-context-help-typecheck-20260909]
    paths:
      - .github/workflows/apply-studio-context-help-typecheck-fix.yml

permissions:
  contents: write

concurrency:
  group: apply-studio-context-help-typecheck-repair
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/studio-context-help-typecheck-20260909
          fetch-depth: 1
      - name: Repair nullable tool ids and typed terminology aliases
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/web/src/domains/creator/StudioContextHelpDialog.tsx")
          source = path.read_text(encoding="utf-8")

          replacements = {
              '  const toolHelp = useMemo(() => buildStudioToolHelp(toolCommandId), [toolCommandId]);': '''  const toolHelp = useMemo(
            () => (toolCommandId ? buildStudioToolHelp(toolCommandId) : null),
            [toolCommandId],
          );''',
              '  const help = useMemo(() => buildStudioToolHelp(toolCommandId), [toolCommandId]);': '''  const help = useMemo(
            () => (toolCommandId ? buildStudioToolHelp(toolCommandId) : null),
            [toolCommandId],
          );''',
              '''              {help.aliases.map((alias) => (
                <span key={alias} className="rounded-full border border-border bg-background px-2.5 py-1 text-xs text-muted-foreground">{alias}</span>
              ))}''': '''              {help.aliases.map((alias) => (
                <span
                  key={`${alias.vendor}:${alias.term}`}
                  className="rounded-full border border-border bg-background px-2.5 py-1 text-xs text-muted-foreground"
                >
                  {alias.term}
                </span>
              ))}''',
          }

          for before, after in replacements.items():
              if source.count(before) != 1:
                  raise SystemExit(f"expected one replacement target, found {source.count(before)}: {before[:80]!r}")
              source = source.replace(before, after, 1)

          path.write_text(source, encoding="utf-8")
      - name: Commit focused repair and remove one-shot workflow
        run: |
          rm .github/workflows/apply-studio-context-help-typecheck-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(studio): type context help tool aliases safely"
          git push origin HEAD:fix/studio-context-help-typecheck-20260909
