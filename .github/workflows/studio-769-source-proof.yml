name: Studio 769 source proof
on:
  push:
    branches: [audit/studio-769-source-proof-20260906]
    paths: [.github/workflows/studio-769-source-proof.yml]
permissions:
  contents: read
jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 62f51de0a0a026494e1668932e1b330bd9b3ba87
          persist-credentials: false
      - name: Record tracked file identities without executing product code
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip()
          if sha != '62f51de0a0a026494e1668932e1b330bd9b3ba87': raise ValueError('unexpected checkout')
          paths = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          selected = [p for p in paths if p and (('coach' in p or 'snapshot-authority' in p or 'third-party' in p or 'record-authority' in p) and (p.startswith('src/') or p.startswith('scripts/') or p.startswith('lib/'))) and pathlib.Path(p).suffix in {'.ts','.tsx','.js','.mjs','.json'}]
          exact = ['src/domains/creator/studio-local-database-snapshot-authority.test.ts','src/domains/creator/studio-third-party-notices.test.ts','src/domains/creator/studio-coach.ts','src/domains/creator/studio-local-database-record-authority.ts']
          out = pathlib.Path(os.environ['RUNNER_TEMP'])/'source-proof'
          out.mkdir()
          report = {'head':sha, 'trackedCount':len(paths)-1, 'exact':{}, 'related':[]}
          for p in exact:
              report['exact'][p] = {'tracked':p in paths,'exists':(root/p).is_file()}
          for p in selected:
              source = root/p
              if source.is_symlink() or not source.is_file() or source.stat().st_size > 1024*1024: continue
              data=source.read_bytes()
              target=out/p; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
              report['related'].append({'path':p,'sha256':hashlib.sha256(data).hexdigest(),'gitBlob':subprocess.check_output(['git','hash-object',p]).decode().strip()})
          (out/'source-proof.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: studio-769-exact-source-proof
          path: ${{ runner.temp }}/source-proof/
          retention-days: 2
