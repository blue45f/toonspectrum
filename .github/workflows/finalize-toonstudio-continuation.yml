name: Finalize ToonStudio continuation once

on:
  push:
    branches:
      - feat/toonstudio-session-completion-followup-20260911
    paths:
      - .github/workflows/finalize-toonstudio-continuation.yml

permissions:
  contents: write

concurrency:
  group: validate-toonstudio-continuation-once
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CI: "true"
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout continuation branch
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-session-completion-followup-20260911
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Complete canonical template and seller integration
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def source(path: str) -> str:
              return Path(path).read_text()

          def save(path: str, text: str) -> None:
              Path(path).write_text(text)

          def replace_once(path: str, old: str, new: str, *, done: str | None = None) -> None:
              text = source(path)
              if done and done in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:120]!r}")
              save(path, text.replace(old, new, 1))

          def insert_before(path: str, marker: str, block: str, *, sentinel: str) -> None:
              text = source(path)
              if sentinel in text:
                  return
              count = text.count(marker)
              if count < 1:
                  raise SystemExit(f"{path}: marker not found: {marker[:120]!r}")
              save(path, text.replace(marker, block + marker, 1))

          # The template catalogue is the single user-facing template authority.
          catalog_path = "apps/web/src/domains/creator/studio-template-catalog.ts"
          catalog = source(catalog_path)
          catalog = catalog.replace('documentKind: "comic"', 'documentKind: "webtoon"')
          catalog = catalog.replace('documentKind: "slides"', 'documentKind: "presentation"')
          catalog = catalog.replace('rightsStatus: "unknown"', 'rightsStatus: "warning"')
          old_href = '''export function studioTemplateStartHref(templateId: string): string {\n  const template = studioTemplateById(templateId);\n  if (!template) throw new Error("A known Studio template is required.");\n  const params = new URLSearchParams({\n    template: template.id,\n    workspace: template.recommendedWorkspace,\n  });\n  params.sort();\n  return `/studio/new?${params.toString()}`;\n}'''
          new_href = '''export function studioTemplateStartHref(templateId: string): string {\n  const template = studioTemplateById(templateId);\n  if (!template) throw new Error("A known Studio template is required.");\n  return `/studio/templates/${encodeURIComponent(template.id)}/start`;\n}'''
          if old_href in catalog:
              catalog = catalog.replace(old_href, new_href, 1)
          elif '/studio/templates/${encodeURIComponent(template.id)}/start' not in catalog:
              raise SystemExit("studio-template-catalog.ts: start href implementation not recognized")
          save(catalog_path, catalog)

          catalog_test = "apps/web/src/domains/creator/studio-template-catalog.test.ts"
          text = source(catalog_test)
          text = text.replace(
              '.toBe("/studio/new?template=webtoon-vertical-episode&workspace=comic");',
              '.toBe("/studio/templates/webtoon-vertical-episode/start");',
          )
          save(catalog_test, text)

          # Keep one stable draft identity for the navigation render.
          start_route = "apps/web/src/domains/creator/studio-shell/StudioTemplateStartRoute.tsx"
          text = source(start_route)
          if 'import { Navigate, useParams } from "react-router-dom";' in text:
              text = text.replace(
                  'import { Navigate, useParams } from "react-router-dom";',
                  'import { useMemo } from "react";\nimport { Navigate, useParams } from "react-router-dom";',
                  1,
              )
          old = '''  if (typeof window !== "undefined") {\n    writeStudioTemplateHandoff(\n      window.localStorage,\n      createStudioTemplateHandoff(template.id),\n    );\n  }\n  const params = new URLSearchParams({\n    template: template.id,\n    workspace: template.recommendedWorkspace,\n  });\n  params.sort();\n  return (\n    <Navigate\n      to={`/studio/draft/${encodeURIComponent(draftId(template.id))}?${params.toString()}`}\n      replace\n    />\n  );'''
          new = '''  const destination = useMemo(() => {\n    if (typeof window !== "undefined") {\n      writeStudioTemplateHandoff(\n        window.localStorage,\n        createStudioTemplateHandoff(template.id),\n      );\n    }\n    const params = new URLSearchParams({\n      template: template.id,\n      workspace: template.recommendedWorkspace,\n    });\n    params.sort();\n    return `/studio/draft/${encodeURIComponent(draftId(template.id))}?${params.toString()}`;\n  }, [template.id, template.recommendedWorkspace]);\n  return <Navigate to={destination} replace />;'''
          if old in text:
              text = text.replace(old, new, 1)
          elif "const destination = useMemo" not in text:
              raise SystemExit("StudioTemplateStartRoute.tsx: navigation block not recognized")
          save(start_route, text)

          handoff_test = "apps/web/src/domains/creator/studio-cuttoon-editor/StudioTemplateHandoffHost.test.tsx"
          text = source(handoff_test)
          text = text.replace(
              '''createStudioTemplateHandoff(\n        "webtoon-four-panel",\n        "2026-09-12T00:00:00.000Z",\n        3_600_000,\n      )''',
              '''createStudioTemplateHandoff(\n        "webtoon-four-panel",\n        new Date().toISOString(),\n        3_600_000,\n      )''',
          )
          save(handoff_test, text)

          # Lazy route exports and canonical route ownership.
          route_pages = "apps/web/src/app/routes/groups/creator-route-pages.ts"
          insert_before(
              route_pages,
              "export const StudioTemplatesPage = lazyRetry(",
              '''export const StudioTemplateStartRoute = lazyRetry(\n  () => import("@/domains/creator/studio-shell/StudioTemplateStartRoute").then((module) => ({\n    default: module.StudioTemplateStartRoute,\n  })),\n  "StudioTemplateStartRoute",\n);\n''',
              sentinel="export const StudioTemplateStartRoute",
          )

          routes = "apps/web/src/app/routes/groups/creator.routes.tsx"
          text = source(routes)
          if "  StudioTemplateStartRoute," not in text:
              anchor = "  StudioTemplatesPage,\n"
              if anchor not in text:
                  raise SystemExit("creator.routes.tsx: StudioTemplatesPage import anchor missing")
              text = text.replace(anchor, anchor + "  StudioTemplateStartRoute,\n", 1)
          route_marker = '  { id: "creator-studio-templates", path: "/studio/templates", element: <StudioTemplatesPage /> },\n'
          if 'path: "/studio/templates/:templateId/start"' not in text:
              if route_marker not in text:
                  raise SystemExit("creator.routes.tsx: canonical template route missing")
              text = text.replace(
                  route_marker,
                  '  { id: "creator-studio-template-start", path: "/studio/templates/:templateId/start", element: <StudioTemplateStartRoute /> },\n' + route_marker,
                  1,
              )
          save(routes, text)

          # The immersive editor consumes the one-time template handoff.
          hosts = "apps/web/src/domains/creator/studio-cuttoon-editor/StudioCuttoonEditorHosts.tsx"
          text = source(hosts)
          if 'from "./StudioTemplateHandoffHost"' not in text:
              import_anchor = 'import { StudioImportHandoffHost } from "./StudioImportHandoffHost";\n'
              if import_anchor not in text:
                  raise SystemExit("StudioCuttoonEditorHosts.tsx: import host anchor missing")
              text = text.replace(
                  import_anchor,
                  import_anchor + 'import { StudioTemplateHandoffHost } from "./StudioTemplateHandoffHost";\n',
                  1,
              )
          if "<StudioTemplateHandoffHost" not in text:
              mount = text.find("<StudioImportHandoffHost")
              if mount < 0:
                  raise SystemExit("StudioCuttoonEditorHosts.tsx: import handoff mount missing")
              text = text[:mount] + "<StudioTemplateHandoffHost />\n      " + text[mount:]
          save(hosts, text)

          # Seller centre coexists with the existing account-backed management view.
          hub = "apps/web/src/domains/creator/studio-shell/StudioAssetHubPage.tsx"
          text = source(hub)
          if 'from "./StudioMarketplaceSellerPanel"' not in text:
              anchor = 'import { StudioAssetGovernancePanel } from "./StudioAssetGovernancePanel";\n'
              if anchor not in text:
                  raise SystemExit("StudioAssetHubPage.tsx: governance import missing")
              text = text.replace(anchor, anchor + 'import { StudioMarketplaceSellerPanel } from "./StudioMarketplaceSellerPanel";\n', 1)
          old_seller = '      {view === "seller" ? <MarketManagePage /> : null}\n'
          if old_seller in text:
              text = text.replace(old_seller, '''      {view === "seller" ? (\n        <>\n          <MarketManagePage />\n          <Container size="wide" className="pb-10 sm:pb-14">\n            <StudioMarketplaceSellerPanel\n              sellerId={projectId ?? "current-seller"}\n              locale={locale}\n            />\n          </Container>\n        </>\n      ) : null}\n''', 1)
          elif "<StudioMarketplaceSellerPanel" not in text:
              raise SystemExit("StudioAssetHubPage.tsx: seller rendering not recognized")
          save(hub, text)

          # Preserve both asynchronously hashed files if users select them quickly.
          seller = "apps/web/src/domains/creator/studio-shell/StudioMarketplaceSellerPanel.tsx"
          text = source(seller)
          old_attach = '''      const nextFile = Object.freeze({\n        path: `${role}/${file.name}`,\n        role,\n        format: extension(file.name),\n        sizeBytes: file.size,\n        checksum: await checksum(file),\n      });\n      commit({\n        ...submission,\n        files: Object.freeze([\n          ...submission.files.filter((item) => item.role !== role),\n          nextFile,\n        ]),\n        updatedAt: new Date().toISOString(),\n      }, locale === "ko" ? `${file.name}의 무결성을 확인했습니다.` : `Verified ${file.name}.`);'''
          new_attach = '''      const nextFile = Object.freeze({\n        path: `${role}/${file.name}`,\n        role,\n        format: extension(file.name),\n        sizeBytes: file.size,\n        checksum: await checksum(file),\n      });\n      setSubmission((current) => {\n        const next = {\n          ...current,\n          files: Object.freeze([\n            ...current.files.filter((item) => item.role !== role),\n            nextFile,\n          ]),\n          updatedAt: new Date().toISOString(),\n        };\n        return typeof window === "undefined"\n          ? next\n          : writeStudioMarketplaceSubmissionDraft(window.localStorage, next, window);\n      });\n      setMessage(locale === "ko" ? `${file.name}의 무결성을 확인했습니다.` : `Verified ${file.name}.`);'''
          if old_attach in text:
              text = text.replace(old_attach, new_attach, 1)
          elif "setSubmission((current) =>" not in text:
              raise SystemExit("StudioMarketplaceSellerPanel.tsx: file persistence block not recognized")
          save(seller, text)

          seller_test = "apps/web/src/domains/creator/studio-shell/StudioMarketplaceSellerPanel.test.tsx"
          text = source(seller_test)
          concurrent = '''    fireEvent.change(inputs[0]!, { target: { files: [product] } });\n    fireEvent.change(inputs[1]!, { target: { files: [preview] } });\n\n    await waitFor(() => {\n      expect(globalThis.crypto.subtle.digest).toHaveBeenCalledTimes(2);'''
          sequential = '''    fireEvent.change(inputs[0]!, { target: { files: [product] } });\n    await waitFor(() => {\n      expect(window.localStorage.getItem(\n        "toonspectrum:studio-marketplace-submission:v1:seller-files",\n      )).toContain("primary/ink.toon-brush");\n    });\n    fireEvent.change(inputs[1]!, { target: { files: [preview] } });\n\n    await waitFor(() => {\n      expect(globalThis.crypto.subtle.digest).toHaveBeenCalledTimes(2);'''
          if concurrent in text:
              text = text.replace(concurrent, sequential, 1)
          save(seller_test, text)

          # All newly implemented features must be reachable from a real product root.
          reachability = "scripts/verify-toonstudio-feature-reachability.mjs"
          text = source(reachability)
          marker = '  "apps/web/src/domains/creator/studio-template-system.ts",\n'
          required = [
              '  "apps/web/src/domains/creator/studio-template-catalog.ts",\n',
              '  "apps/web/src/domains/creator/studio-marketplace-submission-store.ts",\n',
              '  "apps/web/src/domains/creator/studio-shell/StudioTemplatesPage.tsx",\n',
              '  "apps/web/src/domains/creator/studio-shell/StudioTemplateStartRoute.tsx",\n',
              '  "apps/web/src/domains/creator/studio-cuttoon-editor/StudioTemplateHandoffHost.tsx",\n',
              '  "apps/web/src/domains/creator/studio-shell/StudioMarketplaceSellerPanel.tsx",\n',
              '  "apps/web/src/domains/creator/studio-shell/StudioAssetGovernancePanel.tsx",\n',
              '  "apps/web/src/domains/creator/studio-shell/StudioProjectDeliveryPanel.tsx",\n',
              '  "apps/web/src/domains/creator/studio-shell/StudioExternalEntryRoutes.tsx",\n',
          ]
          for item in required:
              if item.strip() in text:
                  continue
              if marker not in text:
                  raise SystemExit("verify-toonstudio-feature-reachability.mjs: insertion marker missing")
              text = text.replace(marker, marker + item, 1)
          save(reachability, text)

          closure = "apps/web/src/domains/creator/studio-integration-closure.test.ts"
          text = source(closure)
          if "applies template handoffs in the real document runtime" not in text:
              closing = "\n});\n"
              if not text.endswith(closing):
                  raise SystemExit("studio-integration-closure.test.ts: closing marker missing")
              test = '''\n  it("applies template handoffs in the real document runtime", () => {\n    const routes = source("apps/web/src/app/routes/groups/creator.routes.tsx");\n    const hosts = source("apps/web/src/domains/creator/studio-cuttoon-editor/StudioCuttoonEditorHosts.tsx");\n    const handoff = source("apps/web/src/domains/creator/studio-cuttoon-editor/StudioTemplateHandoffHost.tsx");\n    const catalog = source("apps/web/src/domains/creator/studio-template-catalog.ts");\n\n    expect(routes).toContain('path: "/studio/templates/:templateId/start"');\n    expect(hosts).toContain("<StudioTemplateHandoffHost");\n    expect(handoff).toContain("updateStudioProjectFeatureSuite");\n    expect(handoff).toContain("STUDIO_TEMPLATE_APPLIED_EVENT");\n    expect(catalog).toContain("/studio/templates/${encodeURIComponent(template.id)}/start");\n  });\n\n  it("connects the functional seller workflow without claiming remote completion", () => {\n    const assetHub = source("apps/web/src/domains/creator/studio-shell/StudioAssetHubPage.tsx");\n    const seller = source("apps/web/src/domains/creator/studio-shell/StudioMarketplaceSellerPanel.tsx");\n    const store = source("apps/web/src/domains/creator/studio-marketplace-submission-store.ts");\n\n    expect(assetHub).toContain("<StudioMarketplaceSellerPanel");\n    expect(assetHub).toContain("<MarketManagePage");\n    expect(seller).toContain("crypto.subtle.digest");\n    expect(seller).toContain("evaluateStudioMarketplaceSubmission");\n    expect(seller).toContain("transitionStudioMarketplaceSubmission");\n    expect(seller).not.toContain("업로드 완료");\n    expect(seller).not.toContain("판매 완료");\n    expect(store).toContain("STUDIO_MARKETPLACE_SUBMISSION_UPDATED_EVENT");\n  });\n'''
              text = text[:-len(closing)] + test + closing
          save(closure, text)

          # Temporary branch writers are removed before closure tests and final publication.
          for value in [
              ".github/workflows/finalize-toonstudio-continuation.yml",
              ".github/workflows/apply-toonstudio-seller-center.yml",
              ".github/workflows/apply-toonstudio-continuation.yml",
              ".github/workflows/repair-toonstudio-continuation.yml",
              ".github/workflows/validate-toonstudio-continuation.yml",
              ".github/workflows/toonstudio-continuation-source-snapshot.yml",
              ".github/workflows/toonstudio-followup-source-snapshot.yml",
              ".github/workflows/finalize-toonstudio-session.yml",
              ".github/workflows/apply-toonstudio-session-fixes.yml",
              ".github/workflows/apply-toonstudio-session-fixes-retry.yml",
              ".github/workflows/toonstudio-final-sync-v2.yml",
              ".github/workflows/repair-sync-toonstudio-session.yml",
              ".github/workflows/install-toonstudio-session-gate.yml",
              ".github/workflows/apply-toonstudio-project-contract-repair.yml",
          ]:
              Path(value).unlink(missing_ok=True)
          PY

      - name: Format and lint the continuation delta
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -t files < <((git diff --name-only origin/main...HEAD; git diff --name-only) | sort -u | grep -E '\.(ts|tsx|mjs)$' || true)
          if ((${#files[@]})); then
            pnpm exec prettier --write "${files[@]}"
            pnpm exec eslint --fix --no-warn-ignored "${files[@]}"
          fi
          git diff --check

      - name: Typecheck whole workspace
        run: pnpm exec tsc -p tsconfig.json --noEmit --pretty false

      - name: Run creation, assets, seller and delivery tests
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/studio-template-catalog.test.ts
          apps/web/src/domains/creator/studio-external-route.test.ts
          apps/web/src/domains/creator/studio-marketplace-submission-store.test.ts
          apps/web/src/domains/creator/studio-marketplace-submission.test.ts
          apps/web/src/domains/creator/studio-route-registry.test.ts
          apps/web/src/domains/creator/studio-product-ia.test.ts
          apps/web/src/domains/creator/studio-project-view-destinations.test.ts
          apps/web/src/domains/creator/studio-integration-closure.test.ts
          apps/web/src/domains/creator/studio-asset-governance.test.ts
          apps/web/src/domains/creator/studio-asset-passport.test.ts
          apps/web/src/domains/creator/studio-asset-provider.test.ts
          apps/web/src/domains/creator/studio-rights-graph.test.ts
          apps/web/src/domains/creator/studio-font-audit.test.ts
          apps/web/src/domains/creator/studio-plugin-registry.test.ts
          apps/web/src/domains/creator/studio-archive-manifest.test.ts
          apps/web/src/domains/creator/studio-publishing-connector.test.ts
          apps/web/src/domains/creator/studio-publishing-package.test.ts
          apps/web/src/domains/creator/studio-cuttoon-editor/StudioTemplateHandoffHost.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioTemplateStartRoute.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioTemplatesPage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioMarketplaceSellerPanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioAssetHubPage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioAssetGovernancePanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectDeliveryPanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.test.tsx
          --pool=forks --maxWorkers=2

      - name: Verify ToonStudio contracts and reachability
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-toonstudio-feature-reachability.mjs
          if pnpm run | grep -q 'verify:studio-ia'; then pnpm run verify:studio-ia; fi
          if pnpm run | grep -q 'verify:studio-session-complete'; then pnpm run verify:studio-session-complete; fi
          bash scripts/verify-toonstudio-integration.sh core
          bash scripts/verify-toonstudio-integration.sh ui
          bash scripts/verify-toonstudio-integration.sh editor

      - name: Build production bundle
        run: pnpm run build:bundle

      - name: Record final continuation acceptance and push
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/rewrite
          cat > docs/rewrite/toonstudio-template-seller-delivery-acceptance.md <<EOF
          # ToonStudio template, seller and delivery acceptance

          - Validated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Base main: \`$(git rev-parse origin/main)\`
          - Whole-workspace TypeScript: passed
          - Template creation and runtime handoff: passed
          - Asset governance and seller submission: passed
          - Publishing package and archive planning: passed
          - Feature reachability: passed
          - Core, UI and editor integration tracks: passed
          - Production bundle: passed

          ## Accepted flows

          1. Global Templates -> search/favorite -> direct fresh draft -> template project structure.
          2. Project Assets -> quality, purchase, seats, fonts, AI provenance and extension permissions.
          3. Seller Center -> real file SHA-256 -> rights and compatibility -> persisted review state.
          4. Project Export -> preflight -> direct, package or manual delivery plan.
          5. Project Settings -> deterministic archive manifest -> reversible restore plan.
          6. External review, presentation and invite tokens -> established lightweight runtimes.

          External uploads, purchases, paid inference and platform writes remain fail-closed until authenticated connectors are configured.
          EOF
          git config user.name "toonstudio-integration-bot"
          git config user.email "toonstudio-integration-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(studio): complete template seller and delivery runtimes"
          git push origin HEAD:feat/toonstudio-session-completion-followup-20260911
