name: Unblock VRM preview stability once

on:
  push:
    branches: [fix/vrm-preview-stability-20260910]
    paths: [.github/workflows/unblock-vrm-preview-stability-once.yml]

permissions:
  contents: write

jobs:
  unblock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/vrm-preview-stability-20260910
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          sed -i 's/runs-on: ubuntu-24.04-arm/runs-on: ubuntu-latest/' .github/workflows/vrm-preview-stability-hotfix.yml
          git config user.name toonstudio-3d-ci
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/unblock-vrm-preview-stability-once.yml
          git add .github/workflows/vrm-preview-stability-hotfix.yml
          git commit -m 'ci: move VRM preview patch to standard runner'
          git push origin HEAD:fix/vrm-preview-stability-20260910
