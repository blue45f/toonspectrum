name: Retire abandoned cleanup launcher

on:
  push:
    branches:
      - chore/cleanup-contained-branches-20260908-0219

permissions:
  contents: write

concurrency:
  group: cleanup-contained-branch-20260908-0219
  cancel-in-progress: true

jobs:
  retire:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Delete only this temporary launcher branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${REPOSITORY%%/*}"
          repo="${REPOSITORY#*/}"
          encoded_branch="$(python3 -c 'import os, urllib.parse; print("/".join(urllib.parse.quote(part, safe="") for part in os.environ["WORKFLOW_BRANCH"].split("/")))')"
          curl --fail-with-body --silent --show-error \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${owner}/${repo}/git/refs/heads/${encoded_branch}"
          printf '{"selfDeleted":"%s"}\n' "${WORKFLOW_BRANCH}"
