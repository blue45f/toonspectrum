name: One-time cleanup of a contained branch

on:
  push:
    branches:
      - chore/cleanup-contained-branches-20260908-0219

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-contained-branch-20260908-0219
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Verify containment and delete the completed branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_BRANCH: ${{ github.ref_name }}
          TARGET_BRANCH: integration/finalize-all-worktrees-20260908-gpt56
          EXPECTED_TARGET_SHA: 1053e01df11cbecf4e6a0f7f308175fc282bd514
          ANCHOR_BRANCH: merge-ready/3ad5d69c-final
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          owner, repo = os.environ["REPOSITORY"].split("/", 1)
          workflow_branch = os.environ["WORKFLOW_BRANCH"]
          target_branch = os.environ["TARGET_BRANCH"]
          expected_target_sha = os.environ["EXPECTED_TARGET_SHA"]
          anchor_branch = os.environ["ANCHOR_BRANCH"]

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "toonspectrum-contained-branch-cleanup",
          }

          def encode_ref(name):
              return "/".join(urllib.parse.quote(part, safe="") for part in name.split("/"))

          def api(path, method="GET"):
              request = urllib.request.Request(
                  f"https://api.github.com{path}",
                  method=method,
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      body = response.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", "replace")
                  raise RuntimeError(f"GitHub API {method} {path} failed: {error.code} {detail}") from error

          target_ref_path = f"/repos/{owner}/{repo}/git/ref/heads/{encode_ref(target_branch)}"
          anchor_ref_path = f"/repos/{owner}/{repo}/git/ref/heads/{encode_ref(anchor_branch)}"

          target_ref = api(target_ref_path)
          target_sha = target_ref["object"]["sha"]
          if target_sha != expected_target_sha:
              raise RuntimeError(
                  f"Target head changed: expected {expected_target_sha}, found {target_sha}"
              )

          open_pulls = api(f"/repos/{owner}/{repo}/pulls?state=open&per_page=100")
          for pull in open_pulls:
              if pull.get("head", {}).get("ref") == target_branch:
                  raise RuntimeError(f"Target is an open PR head: #{pull['number']}")
              if pull.get("base", {}).get("ref") == target_branch:
                  raise RuntimeError(f"Target is an open PR base: #{pull['number']}")

          anchor_ref = api(anchor_ref_path)
          anchor_sha = anchor_ref["object"]["sha"]
          comparison = api(
              f"/repos/{owner}/{repo}/compare/{target_sha}...{anchor_sha}"
          )
          status = comparison.get("status")
          behind_by = int(comparison.get("behind_by", 0))
          if status not in {"ahead", "identical"} or behind_by != 0:
              raise RuntimeError(
                  f"Containment proof failed: status={status}, behind_by={behind_by}"
              )

          api(
              f"/repos/{owner}/{repo}/git/refs/heads/{encode_ref(target_branch)}",
              method="DELETE",
          )
          api(
              f"/repos/{owner}/{repo}/git/refs/heads/{encode_ref(workflow_branch)}",
              method="DELETE",
          )

          print(json.dumps({
              "deleted": target_branch,
              "deletedSha": target_sha,
              "anchor": anchor_branch,
              "anchorSha": anchor_sha,
              "proof": {"status": status, "behindBy": behind_by},
              "selfDeleted": workflow_branch,
          }, ensure_ascii=False, indent=2))
          PY
