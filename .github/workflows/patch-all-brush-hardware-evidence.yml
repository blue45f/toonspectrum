name: Patch all-brush physical GPU evidence

on:
  push:
    branches:
      - feat/all-brush-long-stroke-quality-election-20260904
    paths:
      - scripts/patch-all-brush-hardware-evidence.py
      - .github/workflows/patch-all-brush-hardware-evidence.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-all-brush-hardware-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/all-brush-long-stroke-quality-election-20260904

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply deterministic source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/patch-all-brush-hardware-evidence.py")
          source = path.read_text()
          start = source.index("    markdown_counts =")
          end = source.index("\n    policy_sentence =", start)
          replacement = """    source = replace_once(
              source,
              '    `- GPU 품질 승인: ${approved.length}`,',
              '''    `- GPU 품질 승인 후보: ${approved.length}`,
              `- 물리 GPU 증거: ${hardwareAdapterFingerprints.length > 0 ? hardwareAdapterFingerprints.join(", ") : "없음(진단 전용)"}`,
              `- 반복 측정: ${measurementRunCount}회 (자동 승격 최소 3회)`,
              `- 증거 만료: ${expiresAt}`,''',
              "aggregator markdown metadata",
          )
          """
          path.write_text(source[:start] + replacement + source[end:])
          PY
          python3 -m py_compile scripts/patch-all-brush-hardware-evidence.py
          python3 scripts/patch-all-brush-hardware-evidence.py
          git diff --check

      - name: Focused quality-election tests
        run: >-
          pnpm exec vitest run
          src/domains/creator/brush/studio-brush-gpu-quality-election.test.ts
          src/domains/creator/brush/studio-brush-gpu-quality-evidence.test.ts
          src/domains/creator/live/studio-live-ink-lane-admission.test.ts

      - name: Focused lint
        run: >-
          pnpm exec eslint --max-warnings=0
          scripts/verify-studio-long-stroke.mts
          scripts/aggregate-studio-all-brush-long-stroke.mts
          src/domains/creator/brush/studio-brush-gpu-quality-election.ts
          src/domains/creator/brush/studio-brush-gpu-quality-election.test.ts
          src/domains/creator/brush/studio-brush-gpu-quality-evidence.ts
          src/domains/creator/brush/studio-brush-gpu-quality-evidence.test.ts
          src/domains/creator/brush/studio-brush-gpu-quality-evidence.generated.ts
          src/domains/creator/live/studio-live-ink-lane-admission.ts
          src/domains/creator/live/studio-live-ink-lane-admission.test.ts

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Commit verified patch
        run: |
          rm scripts/patch-all-brush-hardware-evidence.py
          rm .github/workflows/patch-all-brush-hardware-evidence.yml
          git config user.name toonstudio-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "test(brush): bind GPU rollout to repeated hardware evidence"
          git push origin HEAD:feat/all-brush-long-stroke-quality-election-20260904
