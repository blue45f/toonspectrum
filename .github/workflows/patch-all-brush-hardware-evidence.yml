name: Patch all-brush physical GPU evidence

on:
  push:
    branches:
      - feat/all-brush-long-stroke-quality-election-20260904
    paths:
      - scripts/patch-all-brush-hardware-evidence.py
      - .github/workflows/patch-all-brush-hardware-evidence.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-all-brush-hardware-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/all-brush-long-stroke-quality-election-20260904

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply deterministic source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/patch-all-brush-hardware-evidence.py")
          source = path.read_text()

          old = "source, count = pattern.subn(replacement, source, count=1)"
          new = "source, count = pattern.subn(lambda _match: replacement, source, count=1)"
          if source.count(old) != 1:
              raise SystemExit("generated evidence replacement call not found exactly once")
          source = source.replace(old, new, 1)

          function_start = source.index("def generated_evidence_function() -> str:\n")
          function_end = source.index("\n\ndef patch_aggregator()", function_start)
          raw_function = r'''def generated_evidence_function() -> str:
              return r"""function generatedEvidenceSource(input: Readonly<{
            generatedAt: string;
            expiresAt: string;
            sourceCommit: string | null;
            digest: string;
            measurementRunCount: number;
            measuredBrushCount: number;
            hardwareAdapterFingerprints: readonly string[];
            approved: readonly string[];
            rejected: readonly string[];
          }>): string {
            const literal = (values: readonly string[]) => JSON.stringify(values, null, 2)
              .split("\n")
              .map((line, index) => index === 0 ? line : `  ${line}`)
              .join("\n");
            return `/** Generated by scripts/aggregate-studio-all-brush-long-stroke.mts. */\n`
              + `export const STUDIO_BRUSH_GPU_QUALITY_EVIDENCE_SCHEMA_VERSION = 2 as const;\n`
              + `export const STUDIO_BRUSH_GPU_QUALITY_EVIDENCE = Object.freeze({\n`
              + `  schemaVersion: STUDIO_BRUSH_GPU_QUALITY_EVIDENCE_SCHEMA_VERSION,\n`
              + `  rendererContractVersion: ${STUDIO_BRUSH_GPU_QUALITY_RENDER_CONTRACT_VERSION},\n`
              + `  generatedAt: ${JSON.stringify(input.generatedAt)},\n`
              + `  expiresAt: ${JSON.stringify(input.expiresAt)},\n`
              + `  sourceCommit: ${JSON.stringify(input.sourceCommit)},\n`
              + `  benchmarkDigest: ${JSON.stringify(input.digest)},\n`
              + `  measurementRunCount: ${input.measurementRunCount},\n`
              + `  measuredBrushCount: ${input.measuredBrushCount},\n`
              + `  hardwareClass: ${input.hardwareAdapterFingerprints.length > 0 ? '"hardware"' : 'null'} as "hardware" | null,\n`
              + `  hardwareAdapterFingerprints: Object.freeze(${literal(input.hardwareAdapterFingerprints)} as string[]),\n`
              + `  approvedBrushIds: Object.freeze(${literal(input.approved)} as string[]),\n`
              + `  rejectedBrushIds: Object.freeze(${literal(input.rejected)} as string[]),\n`
              + `});\n`;
          }"""
          '''
          # The workflow heredoc indentation is not part of the replacement source.
          raw_function = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in raw_function.splitlines()
          )
          source = source[:function_start] + raw_function + source[function_end:]

          markdown_start = source.index("    markdown_counts =")
          markdown_end = source.index("\n    policy_sentence =", markdown_start)
          markdown_replacement = '''    source = replace_once(
              source,
              '    `- GPU 품질 승인: ${approved.length}`,',
              """    `- GPU 품질 승인 후보: ${approved.length}`,
              `- 물리 GPU 증거: ${hardwareAdapterFingerprints.length > 0 ? hardwareAdapterFingerprints.join(\", \") : \"없음(진단 전용)\"}`,
              `- 반복 측정: ${measurementRunCount}회 (자동 승격 최소 3회)`,
              `- 증거 만료: ${expiresAt}`,""",
              "aggregator markdown metadata",
          )
          '''
          source = source[:markdown_start] + markdown_replacement + source[markdown_end:]
          path.write_text(source)
          PY
          python3 -m py_compile scripts/patch-all-brush-hardware-evidence.py
          python3 scripts/patch-all-brush-hardware-evidence.py
          pnpm exec eslint --fix \
            src/domains/creator/brush/studio-brush-gpu-quality-evidence.ts \
            src/domains/creator/brush/studio-brush-gpu-quality-evidence.test.ts
          git diff --check

      - name: Focused quality-election tests
        run: >-
          pnpm exec vitest run
          src/domains/creator/brush/studio-brush-gpu-quality-election.test.ts
          src/domains/creator/brush/studio-brush-gpu-quality-evidence.test.ts
          src/domains/creator/live/studio-live-ink-lane-admission.test.ts

      - name: Focused lint
        run: >-
          pnpm exec eslint --max-warnings=0
          scripts/verify-studio-long-stroke.mts
          scripts/aggregate-studio-all-brush-long-stroke.mts
          src/domains/creator/brush/studio-brush-gpu-quality-election.ts
          src/domains/creator/brush/studio-brush-gpu-quality-election.test.ts
          src/domains/creator/brush/studio-brush-gpu-quality-evidence.ts
          src/domains/creator/brush/studio-brush-gpu-quality-evidence.test.ts
          src/domains/creator/brush/studio-brush-gpu-quality-evidence.generated.ts
          src/domains/creator/live/studio-live-ink-lane-admission.ts
          src/domains/creator/live/studio-live-ink-lane-admission.test.ts

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Commit verified patch
        run: |
          rm scripts/patch-all-brush-hardware-evidence.py
          rm .github/workflows/patch-all-brush-hardware-evidence.yml
          git config user.name toonstudio-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "test(brush): bind GPU rollout to repeated hardware evidence"
          git push origin HEAD:feat/all-brush-long-stroke-quality-election-20260904
