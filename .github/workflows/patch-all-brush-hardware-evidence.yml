name: Patch all-brush physical GPU evidence

on:
  push:
    branches:
      - feat/all-brush-long-stroke-quality-election-20260904
    paths:
      - ".github/workflows/patch-all-brush-hardware-evidence.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-all-brush-hardware-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/all-brush-long-stroke-quality-election-20260904

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Patch adapter evidence, aggregation, and benchmark validation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(source: str, before: str, after: str, label: str) -> str:
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return source.replace(before, after, 1)

          verify_path = Path("scripts/verify-studio-long-stroke.mts")
          verify = verify_path.read_text()
          surface_block = '''interface SurfaceEvidence {
            readonly gpuEverActive: boolean;
            readonly gpuEverAuthorized: boolean;
            readonly gpuSurfaceKinds: readonly string[];
            readonly refusedStrokeNotices: number;
          }
          type GateGlobals = typeof globalThis & {'''
          surface_replacement = '''interface SurfaceEvidence {
            readonly gpuEverActive: boolean;
            readonly gpuEverAuthorized: boolean;
            readonly gpuSurfaceKinds: readonly string[];
            readonly refusedStrokeNotices: number;
          }
          interface GpuAdapterEvidence {
            readonly available: boolean;
            readonly adapterClass: "hardware" | "software" | "unknown" | "unavailable";
            readonly isFallbackAdapter: boolean | null;
            readonly adapterFingerprint: string | null;
            readonly vendor: string;
            readonly architecture: string;
            readonly device: string;
            readonly description: string;
          }
          type GateGlobals = typeof globalThis & {'''
          verify = replace_once(verify, surface_block, surface_replacement, "adapter interface")

          log_marker = '''function log(message: string): void {
            console.log(`[verify-studio-long-stroke] ${message}`);
          }'''
          adapter_helper = '''async function inspectGpuAdapter(page: Page): Promise<GpuAdapterEvidence> {
            const unavailable = Object.freeze({
              available: false,
              adapterClass: "unavailable" as const,
              isFallbackAdapter: null,
              adapterFingerprint: null,
              vendor: "",
              architecture: "",
              device: "",
              description: "",
            });
            if (!WEBGPU) return unavailable;
            return page.evaluate(async () => {
              type AdapterInfoLike = Readonly<{
                vendor?: unknown;
                architecture?: unknown;
                device?: unknown;
                description?: unknown;
              }>;
              type AdapterLike = Readonly<{
                info?: AdapterInfoLike;
                isFallbackAdapter?: unknown;
              }>;
              type NavigatorWithGpu = Navigator & Readonly<{
                gpu?: Readonly<{
                  requestAdapter(options?: Readonly<{ powerPreference?: "high-performance" }>):
                    Promise<AdapterLike | null>;
                }>;
              }>;
              const gpu = (navigator as NavigatorWithGpu).gpu;
              if (!gpu) return null;
              const adapter = await gpu.requestAdapter({ powerPreference: "high-performance" });
              if (!adapter) return null;
              const info = adapter.info ?? {};
              const text = (value: unknown): string =>
                typeof value === "string" ? value.trim() : "";
              const vendor = text(info.vendor);
              const architecture = text(info.architecture);
              const device = text(info.device);
              const description = text(info.description);
              const isFallbackAdapter = typeof adapter.isFallbackAdapter === "boolean"
                ? adapter.isFallbackAdapter
                : null;
              const adapterFingerprint = [vendor, architecture, device, description]
                .filter((value) => value.length > 0)
                .join(":") || null;
              const identity = adapterFingerprint?.toLowerCase() ?? "";
              const software = /swiftshader|llvmpipe|lavapipe|software|warp|basic render/u
                .test(identity);
              const adapterClass = isFallbackAdapter === true || software
                ? "software" as const
                : adapterFingerprint
                  ? "hardware" as const
                  : "unknown" as const;
              return {
                available: true,
                adapterClass,
                isFallbackAdapter,
                adapterFingerprint,
                vendor,
                architecture,
                device,
                description,
              };
            }).then((result) => result ?? unavailable).catch(() => unavailable);
          }

          function log(message: string): void {
            console.log(`[verify-studio-long-stroke] ${message}`);
          }'''
          verify = replace_once(verify, log_marker, adapter_helper, "adapter helper")

          goto_marker = '''    await page.goto(studioUrl, { waitUntil: "domcontentloaded", timeout: 60_000 });
            await page.locator(".konvajs-content").first().waitFor({ state: "visible", timeout: 60_000 })'''
          goto_replacement = '''    await page.goto(studioUrl, { waitUntil: "domcontentloaded", timeout: 60_000 });
            const gpuAdapter = await inspectGpuAdapter(page);
            report.gpuAdapter = gpuAdapter;
            log(`gpu adapter: ${gpuAdapter.adapterClass} · ${gpuAdapter.adapterFingerprint ?? "unidentified"}`);
            await page.locator(".konvajs-content").first().waitFor({ state: "visible", timeout: 60_000 })'''
          verify = replace_once(verify, goto_marker, goto_replacement, "adapter capture")
          verify_path.write_text(verify)

          aggregate_path = Path("scripts/aggregate-studio-all-brush-long-stroke.mts")
          aggregate = aggregate_path.read_text()
          election_import = '''import {
            electStudioBrushGpuQuality,
            type StudioBrushCrossEngineQualityEvidence,
            type StudioBrushGpuQualityPolicyKind,
            type StudioBrushLongStrokePerformanceEvidence,
            type StudioBrushLongStrokeQualityEvidence,
          } from "../src/domains/creator/brush/studio-brush-gpu-quality-election";'''
          election_replacement = '''import {
            STUDIO_BRUSH_GPU_QUALITY_RENDER_CONTRACT_VERSION,
            electStudioBrushGpuQuality,
            type StudioBrushCrossEngineQualityEvidence,
            type StudioBrushGpuExecutionEvidence,
            type StudioBrushGpuQualityPolicyKind,
            type StudioBrushLongStrokePerformanceEvidence,
            type StudioBrushLongStrokeQualityEvidence,
          } from "../src/domains/creator/brush/studio-brush-gpu-quality-election";
          import {
            STUDIO_BRUSH_GPU_QUALITY_EVIDENCE_MAX_AGE_MS,
          } from "../src/domains/creator/brush/studio-brush-gpu-quality-evidence";'''
          aggregate = replace_once(aggregate, election_import, election_replacement, "aggregate imports")

          surface_report = '''  readonly surfaceEvidence?: {
            readonly gpuEverActive?: boolean;
            readonly gpuEverAuthorized?: boolean;
            readonly gpuSurfaceKinds?: readonly string[];
            readonly refusedStrokeNotices?: number;
          };
          }'''
          surface_report_replacement = '''  readonly surfaceEvidence?: {
            readonly gpuEverActive?: boolean;
            readonly gpuEverAuthorized?: boolean;
            readonly gpuSurfaceKinds?: readonly string[];
            readonly refusedStrokeNotices?: number;
          };
            readonly gpuAdapter?: {
              readonly available?: boolean;
              readonly adapterClass?: "hardware" | "software" | "unknown" | "unavailable";
              readonly isFallbackAdapter?: boolean | null;
              readonly adapterFingerprint?: string | null;
            };
          }'''
          aggregate = replace_once(
              aggregate,
              surface_report,
              surface_report_replacement,
              "aggregate adapter report type",
          )

          policy_marker = '''async function qualityPolicy(item: StudioBrushCatalogItem): Promise<StudioBrushGpuQualityPolicyKind> {'''
          execution_helper = '''function gpuExecutionEvidence(
            report: LongStrokeReport | null,
          ): StudioBrushGpuExecutionEvidence {
            const adapter = report?.gpuAdapter;
            const adapterClass = adapter?.adapterClass;
            return {
              adapterClass: adapterClass === "hardware"
                || adapterClass === "software"
                || adapterClass === "unknown"
                || adapterClass === "unavailable"
                  ? adapterClass
                  : "unavailable",
              isFallbackAdapter: typeof adapter?.isFallbackAdapter === "boolean"
                ? adapter.isFallbackAdapter
                : null,
              adapterFingerprint: typeof adapter?.adapterFingerprint === "string"
                && adapter.adapterFingerprint.length > 0
                  ? adapter.adapterFingerprint
                  : null,
            };
          }

          async function qualityPolicy(item: StudioBrushCatalogItem): Promise<StudioBrushGpuQualityPolicyKind> {'''
          aggregate = replace_once(aggregate, policy_marker, execution_helper, "execution helper")

          election_call = '''      gpu: {
                quality: qualityEvidence(gpu.report, gpuAnalysis),
                performance: performanceEvidence(gpu.report),
              },
              crossEngine: cross,'''
          election_call_replacement = '''      gpu: {
                quality: qualityEvidence(gpu.report, gpuAnalysis),
                performance: performanceEvidence(gpu.report),
              },
              gpuExecution: gpuExecutionEvidence(gpu.report),
              crossEngine: cross,'''
          aggregate = replace_once(aggregate, election_call, election_call_replacement, "election execution")

          gpu_case = '''      gpu: {
                verifierOk: gpu.report?.ok ?? false,
                quality: qualityEvidence(gpu.report, gpuAnalysis),
                performance: performanceEvidence(gpu.report),
                report: relative(INPUT_ROOT, join(gpu.caseRoot, "report.json")),
              },'''
          gpu_case_replacement = '''      gpu: {
                verifierOk: gpu.report?.ok ?? false,
                quality: qualityEvidence(gpu.report, gpuAnalysis),
                performance: performanceEvidence(gpu.report),
                execution: gpuExecutionEvidence(gpu.report),
                report: relative(INPUT_ROOT, join(gpu.caseRoot, "report.json")),
              },'''
          aggregate = replace_once(aggregate, gpu_case, gpu_case_replacement, "case execution evidence")

          generated_signature = '''function generatedEvidenceSource(input: Readonly<{
            generatedAt: string;
            sourceCommit: string | null;
            digest: string;
            measuredBrushCount: number;
            approved: readonly string[];
            rejected: readonly string[];
          }>): string {'''
          generated_signature_replacement = '''function generatedEvidenceSource(input: Readonly<{
            generatedAt: string;
            expiresAt: string;
            sourceCommit: string | null;
            digest: string;
            measurementRunCount: number;
            measuredBrushCount: number;
            hardwareAdapterFingerprints: readonly string[];
            approved: readonly string[];
            rejected: readonly string[];
          }>): string {'''
          aggregate = replace_once(
              aggregate,
              generated_signature,
              generated_signature_replacement,
              "generated evidence signature",
          )

          generated_body = '''  return `/** Generated by scripts/aggregate-studio-all-brush-long-stroke.mts. */\\n`
              + `export const STUDIO_BRUSH_GPU_QUALITY_EVIDENCE_SCHEMA_VERSION = 1 as const;\\n`
              + `export const STUDIO_BRUSH_GPU_QUALITY_EVIDENCE = Object.freeze({\\n`
              + `  schemaVersion: STUDIO_BRUSH_GPU_QUALITY_EVIDENCE_SCHEMA_VERSION,\\n`
              + `  generatedAt: ${JSON.stringify(input.generatedAt)},\\n`
              + `  sourceCommit: ${JSON.stringify(input.sourceCommit)},\\n`
              + `  benchmarkDigest: ${JSON.stringify(input.digest)},\\n`
              + `  measuredBrushCount: ${input.measuredBrushCount},\\n`
              + `  approvedBrushIds: Object.freeze(${literal(input.approved)} as string[]),\\n`
              + `  rejectedBrushIds: Object.freeze(${literal(input.rejected)} as string[]),\\n`
              + `});\\n`;'''
          generated_body_replacement = '''  return `/** Generated by scripts/aggregate-studio-all-brush-long-stroke.mts. */\\n`
              + `export const STUDIO_BRUSH_GPU_QUALITY_EVIDENCE_SCHEMA_VERSION = 2 as const;\\n`
              + `export const STUDIO_BRUSH_GPU_QUALITY_EVIDENCE = Object.freeze({\\n`
              + `  schemaVersion: STUDIO_BRUSH_GPU_QUALITY_EVIDENCE_SCHEMA_VERSION,\\n`
              + `  rendererContractVersion: ${STUDIO_BRUSH_GPU_QUALITY_RENDER_CONTRACT_VERSION},\\n`
              + `  generatedAt: ${JSON.stringify(input.generatedAt)},\\n`
              + `  expiresAt: ${JSON.stringify(input.expiresAt)},\\n`
              + `  sourceCommit: ${JSON.stringify(input.sourceCommit)},\\n`
              + `  benchmarkDigest: ${JSON.stringify(input.digest)},\\n`
              + `  measurementRunCount: ${input.measurementRunCount},\\n`
              + `  measuredBrushCount: ${input.measuredBrushCount},\\n`
              + `  hardwareClass: ${input.hardwareAdapterFingerprints.length > 0 ? '\"hardware\"' : 'null'} as \"hardware\" | null,\\n`
              + `  hardwareAdapterFingerprints: Object.freeze(${literal(input.hardwareAdapterFingerprints)} as string[]),\\n`
              + `  approvedBrushIds: Object.freeze(${literal(input.approved)} as string[]),\\n`
              + `  rejectedBrushIds: Object.freeze(${literal(input.rejected)} as string[]),\\n`
              + `});\\n`;'''
          aggregate = replace_once(aggregate, generated_body, generated_body_replacement, "generated body")

          generated_at = '''  const generatedAt = new Date().toISOString();
            const sourceCommit = process.env.GITHUB_SHA ?? null;
            const approved = cases'''
          generated_at_replacement = '''  const generatedAt = new Date().toISOString();
            const expiresAt = new Date(
              Date.parse(generatedAt) + STUDIO_BRUSH_GPU_QUALITY_EVIDENCE_MAX_AGE_MS,
            ).toISOString();
            const sourceCommit = process.env.GITHUB_SHA ?? null;
            const hardwareAdapterFingerprints = [...new Set(cases.flatMap((entry) =>
              entry.gpu.execution.adapterClass === "hardware"
                && entry.gpu.execution.isFallbackAdapter !== true
                && entry.gpu.execution.adapterFingerprint
                  ? [entry.gpu.execution.adapterFingerprint]
                  : []
            ))].sort();
            const measurementRunCount = cases.length > 0 ? 1 : 0;
            const approved = cases'''
          aggregate = replace_once(aggregate, generated_at, generated_at_replacement, "hardware aggregate")

          report_header = '''    kind: "toonspectrum-all-brush-screen-fill-gpu-election-v1",
              generatedAt,
              sourceCommit,
              benchmarkDigest,'''
          report_header_replacement = '''    kind: "toonspectrum-all-brush-screen-fill-gpu-election-v2",
              generatedAt,
              expiresAt,
              sourceCommit,
              rendererContractVersion: STUDIO_BRUSH_GPU_QUALITY_RENDER_CONTRACT_VERSION,
              measurementRunCount,
              hardwareClass: hardwareAdapterFingerprints.length > 0 ? "hardware" : null,
              hardwareAdapterFingerprints,
              benchmarkDigest,'''
          aggregate = replace_once(aggregate, report_header, report_header_replacement, "report hardware header")

          markdown_line = '''    `- GPU 품질 승인: ${approved.length}`,
              `- 기존 경로 유지: ${rejected.length}`,
              `- 증거 다이제스트: \\`${benchmarkDigest}\\``,'''
          markdown_replacement = '''    `- GPU 품질 승인: ${approved.length}`,
              `- 기존 경로 유지: ${rejected.length}`,
              `- 물리 GPU 증거: ${hardwareAdapterFingerprints.length > 0 ? hardwareAdapterFingerprints.join(", ") : "없음(진단 전용)"}`,
              `- 증거 만료: ${expiresAt}`,
              `- 증거 다이제스트: \\`${benchmarkDigest}\\``,'''
          aggregate = replace_once(aggregate, markdown_line, markdown_replacement, "markdown hardware evidence")

          policy_text = '''    "질감·형태·라이브/커밋 연속성이 먼저이며, 성능이 빨라도 품질 축 하나가 열화되면 기존 경로를 유지한다. 품질이 동등하고 p95가 5% 이내의 비열화 범위면 GPU를 우선한다.",'''
          policy_replacement = '''    "질감·형태·라이브/커밋 연속성이 먼저이며, 성능이 빨라도 품질 축 하나가 열화되면 기존 경로를 유지한다. 물리 GPU가 확인되고 품질이 거의 동일하며 p95가 2% 이내의 비열화 범위일 때만 GPU를 우선한다.",'''
          aggregate = replace_once(aggregate, policy_text, policy_replacement, "markdown policy")

          generated_call = '''  writeFileSync(GENERATED_EVIDENCE_PATH, generatedEvidenceSource({
              generatedAt,
              sourceCommit,
              digest: benchmarkDigest,
              measuredBrushCount: cases.length,
              approved,
              rejected,
            }));'''
          generated_call_replacement = '''  writeFileSync(GENERATED_EVIDENCE_PATH, generatedEvidenceSource({
              generatedAt,
              expiresAt,
              sourceCommit,
              digest: benchmarkDigest,
              measurementRunCount,
              measuredBrushCount: cases.length,
              hardwareAdapterFingerprints,
              approved,
              rejected,
            }));'''
          aggregate = replace_once(aggregate, generated_call, generated_call_replacement, "generated evidence call")
          aggregate_path.write_text(aggregate)

          workflow_path = Path(".github/workflows/studio-all-brush-long-stroke-quality.yml")
          workflow = workflow_path.read_text()
          workflow = replace_once(
              workflow,
              '''          pnpm exec vitest run \\
                      src/domains/creator/brush/studio-brush-gpu-quality-election.test.ts \\
                      src/domains/creator/live/studio-live-ink-lane-admission.test.ts''',
              '''          pnpm exec vitest run \\
                      src/domains/creator/brush/studio-brush-gpu-quality-election.test.ts \\
                      src/domains/creator/brush/studio-brush-gpu-quality-evidence.test.ts \\
                      src/domains/creator/live/studio-live-ink-lane-admission.test.ts''',
              "benchmark focused tests",
          )
          workflow = replace_once(
              workflow,
              '''            src/domains/creator/brush/studio-brush-gpu-quality-election.test.ts \\
                      src/domains/creator/brush/studio-brush-gpu-quality-evidence.ts \\
                      src/domains/creator/brush/studio-brush-gpu-quality-evidence.generated.ts \\
''',
              '''            src/domains/creator/brush/studio-brush-gpu-quality-election.test.ts \\
                      src/domains/creator/brush/studio-brush-gpu-quality-evidence.ts \\
                      src/domains/creator/brush/studio-brush-gpu-quality-evidence.test.ts \\
                      src/domains/creator/brush/studio-brush-gpu-quality-evidence.generated.ts \\
''',
              "benchmark focused lint",
          )
          workflow_path.write_text(workflow)
          PY

      - name: Focused quality-election tests
        run: >-
          pnpm exec vitest run
          src/domains/creator/brush/studio-brush-gpu-quality-election.test.ts
          src/domains/creator/brush/studio-brush-gpu-quality-evidence.test.ts
          src/domains/creator/live/studio-live-ink-lane-admission.test.ts

      - name: Focused lint
        run: >-
          pnpm exec eslint --max-warnings=0
          scripts/verify-studio-long-stroke.mts
          scripts/aggregate-studio-all-brush-long-stroke.mts
          src/domains/creator/brush/studio-brush-gpu-quality-election.ts
          src/domains/creator/brush/studio-brush-gpu-quality-election.test.ts
          src/domains/creator/brush/studio-brush-gpu-quality-evidence.ts
          src/domains/creator/brush/studio-brush-gpu-quality-evidence.test.ts
          src/domains/creator/brush/studio-brush-gpu-quality-evidence.generated.ts
          src/domains/creator/live/studio-live-ink-lane-admission.ts
          src/domains/creator/live/studio-live-ink-lane-admission.test.ts

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Commit verified patch and remove one-shot workflow
        run: |
          rm .github/workflows/patch-all-brush-hardware-evidence.yml
          git config user.name toonstudio-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "test(brush): require physical GPU quality evidence"
          git push origin HEAD:feat/all-brush-long-stroke-quality-election-20260904
