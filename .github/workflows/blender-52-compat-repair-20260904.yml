name: Blender 5.2 compatibility repair 20260904

on:
  push:
    branches:
      - automation/source-snapshot-20260904
    paths:
      - .github/workflows/blender-52-compat-repair-20260904.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blender-52-compat-repair-20260904
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Blender integration branch
        uses: actions/checkout@v4
        with:
          ref: feat/blender-character-quality-pipeline-20260904
          fetch-depth: 1

      - name: Apply Blender 5.2 collection and metadata compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/blender/toonstudio_blender_kit/face.py")
          source = path.read_text(encoding="utf-8")

          if "import json\n" not in source:
              anchor = "from dataclasses import dataclass\nimport math\n"
              if source.count(anchor) != 1:
                  raise SystemExit("face.py import anchor changed")
              source = source.replace(anchor, "from dataclasses import dataclass\nimport json\nimport math\n", 1)

          old_loop = '''    for vertex in obj.data.vertices[::step]:
                  sampled += 1'''
          new_loop = '''    for index in range(0, len(obj.data.vertices), step):
                  vertex = obj.data.vertices[index]
                  sampled += 1'''
          count = source.count(old_loop)
          if count not in (0, 2):
              raise SystemExit(f"expected zero or two stepped vertex loops, found {count}")
          if count == 2:
              source = source.replace(old_loop, new_loop)

          helper_anchor = '''def _frame_coordinates(world: Vector, frame: HeadFrame) -> tuple[float, float, float]:
          '''
          if "def _record_shape_metadata(" not in source:
              helper = '''def _record_shape_metadata(
              obj: bpy.types.Object,
              shape_name: str,
              *,
              semantic_id: str,
              direction: float,
              label: str,
          ) -> None:
              """Persist semantic shape metadata on the owning Object ID.

              Blender 5.2 no longer accepts arbitrary ID properties on ShapeKey RNA
              values. Object custom properties remain stable, exportable metadata, so a
              compact JSON registry keeps the per-shape authoring contract intact.
              """
              raw = obj.get("toonstudio_face_shape_metadata")
              metadata: dict[str, dict[str, object]] = {}
              if isinstance(raw, str) and raw:
                  try:
                      parsed = json.loads(raw)
                  except (TypeError, ValueError, json.JSONDecodeError):
                      parsed = None
                  if isinstance(parsed, dict):
                      metadata = {
                          str(name): dict(value)
                          for name, value in parsed.items()
                          if isinstance(value, dict)
                      }
              metadata[shape_name] = {
                  "direction": "positive" if direction > 0 else "negative",
                  "generated": True,
                  "label": label,
                  "semanticId": semantic_id,
              }
              obj["toonstudio_face_shape_metadata"] = json.dumps(
                  metadata,
                  ensure_ascii=True,
                  separators=(",", ":"),
                  sort_keys=True,
              )


          '''
              if source.count(helper_anchor) != 1:
                  raise SystemExit("shape metadata helper anchor changed")
              source = source.replace(helper_anchor, helper + helper_anchor, 1)

          unsupported = '''    key["toonstudio_semantic_id"] = spec.semantic_id
              key["toonstudio_direction"] = "positive" if direction > 0 else "negative"
              key["toonstudio_generated"] = True
          '''
          if unsupported in source:
              source = source.replace(unsupported, "", 1)

          old_result = '''                changed = _write_shape(obj, key, frame, spec, direction)
                      if changed >= 8:
                          created.append(f"{obj.name}:{name}")
          '''
          new_result = '''                changed = _write_shape(obj, key, frame, spec, direction)
                      if changed >= 8:
                          _record_shape_metadata(
                              obj,
                              name,
                              semantic_id=spec.semantic_id,
                              direction=direction,
                              label=label,
                          )
                          created.append(f"{obj.name}:{name}")
          '''
          if "_record_shape_metadata(" in source and "semantic_id=spec.semantic_id" not in source:
              if source.count(old_result) != 1:
                  raise SystemExit("shape result anchor changed")
              source = source.replace(old_result, new_result, 1)

          if 'key["toonstudio_label"] = label\n' in source:
              source = source.replace('                key["toonstudio_label"] = label\n', "", 1)

          path.write_text(source, encoding="utf-8")
          PY

          python3 -m py_compile tools/blender/toonstudio_blender_kit/face.py
          git diff --check
          test "$(grep -c 'for index in range(0, len(obj.data.vertices), step):' tools/blender/toonstudio_blender_kit/face.py)" -eq 2
          grep -F 'obj["toonstudio_face_shape_metadata"] = json.dumps(' tools/blender/toonstudio_blender_kit/face.py
          ! grep -F 'key["toonstudio_label"]' tools/blender/toonstudio_blender_kit/face.py
          ! grep -F 'key["toonstudio_semantic_id"]' tools/blender/toonstudio_blender_kit/face.py

      - name: Commit and push compatibility repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Blender 5.2 compatibility repair is already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/blender/toonstudio_blender_kit/face.py
          git commit -m "fix(blender): support Blender 5.2 shape metadata and vertex collections"
          git push origin HEAD:feat/blender-character-quality-pipeline-20260904
