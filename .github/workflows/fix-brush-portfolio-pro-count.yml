name: Fix brush portfolio zero PRO count assertion

on:
  push:
    branches:
      - fix/brush-portfolio-exhaustive-contract-20260904
    paths:
      - ".github/workflows/fix-brush-portfolio-pro-count.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-brush-portfolio-pro-count-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-slim, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/brush-portfolio-exhaustive-contract-20260904
          fetch-depth: 0

      - name: Preserve the valid zero-PRO first batch and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/domains/creator/brush/StudioBrushLibrarySheet.test.tsx")
          source = path.read_text(encoding="utf-8")
          old = 'expect(screen.getAllByText("PRO")).toHaveLength(exhaustiveFirstBatchProCount);'
          new = 'expect(screen.queryAllByText("PRO")).toHaveLength(exhaustiveFirstBatchProCount);'
          old_count = source.count(old)
          new_count = source.count(new)
          if old_count == 1 and new_count == 0:
              path.write_text(source.replace(old, new, 1), encoding="utf-8")
          elif old_count == 0 and new_count == 1:
              pass
          else:
              raise SystemExit(
                  f"unexpected PRO assertion state: old={old_count}, new={new_count}"
              )
          PY
          rm -f .github/workflows/fix-brush-portfolio-pro-count.yml
          git diff --check
          git config user.name "toonstudio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit --no-verify -m "fix(brush): allow a core-only first exhaustive batch"
          if git push --no-verify origin HEAD:fix/brush-portfolio-exhaustive-contract-20260904; then
            exit 0
          fi
          git fetch origin fix/brush-portfolio-exhaustive-contract-20260904
          git show FETCH_HEAD:src/domains/creator/brush/StudioBrushLibrarySheet.test.tsx | grep -F 'screen.queryAllByText("PRO")'
          if git cat-file -e FETCH_HEAD:.github/workflows/fix-brush-portfolio-pro-count.yml 2>/dev/null; then
            echo "remote still contains the one-shot workflow" >&2
            exit 1
          fi
