name: Repair brush PR 1355 integration
on:
  push:
    branches: [feat/brush-material-engine-20260913]
    paths: [.github/workflows/brush-pr1355-regression-repair.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
      - name: Apply exact inventory and route corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, before, after):
              p = Path(path)
              text = p.read_text()
              assert text.count(before) == 1, (path, before, text.count(before))
              p.write_text(text.replace(before, after))
          creator = 'apps/web/src/domains/creator/'
          brush = creator + 'brush/'
          lab = creator + 'brush-lab/'
          replace(lab+'brush-studio-v5-quality.test.ts', 'the same 48 materially', 'the same 80 materially')
          replace(lab+'brush-studio-v5-quality.test.ts', 'toHaveLength(48)', 'toHaveLength(80)')
          replace(lab+'brush-studio-v5-quality.test.ts', '      48,\n', '      80,\n')
          replace(lab+'brush-studio-version-integration.test.ts', 'toHaveLength(48)', 'toHaveLength(80)')
          replace(lab+'brush-studio-v5-quality-catalog.ts', 'the same 48 product representatives', 'the same curated product representatives')
          replace(brush+'studio-brush-selection.test.ts', 'toHaveLength(STUDIO_ALL_BRUSH_CATALOG_ITEMS.length)', 'toHaveLength(STUDIO_BRUSH_CATALOG_COUNTS.total)')
          replace(brush+'studio-brush-selection.test.ts', 'core: STUDIO_BRUSH_CATALOG_COUNTS.core,\n      pro: 160,\n      total: STUDIO_BRUSH_CATALOG_COUNTS.core + 160,\n      erase: 2,\n      paint: STUDIO_BRUSH_CATALOG_COUNTS.core - 2 + 160,', 'core: BRUSH_PRESETS.length,\n      pro: 192,\n      total: BRUSH_PRESETS.length + 192,\n      erase: 2,\n      paint: BRUSH_PRESETS.length - 2 + 192,')
          specialty = creator+'studio-competitor-specialty-brush-expansion.test.ts'
          replace(specialty, 'import { studioBrushIconId }', 'import { STUDIO_BRUSH_QUALITY_ABSORBED_ID_OWNER } from "./brush/studio-brush-quality-portfolio";\nimport { studioBrushIconId }')
          replace(specialty, 'publishes four stable core ids with bilingual discovery aliases', 'retains four stable runtime ids while exposing only curated product aliases')
          replace(specialty, '      ["erodible-pencil", "마모 촉"],\n      ["paint-tube", "3d tube brush"],\n', '')
          replace(specialty, '  it("keeps the catalogue exhaustive', '''  it("never resurrects absorbed runtime profiles through search or favorites", () => {
            for (const [id, query, owner] of [
              ["erodible-pencil", "마모 촉", "pencil--side-shade"],
              ["paint-tube", "3d tube brush", "oil--impasto-ribbon"],
            ] as const) {
              expect(STUDIO_BRUSH_QUALITY_ABSORBED_ID_OWNER[id]).toBe(owner);
              expect(studioBrushCatalogItemById(id)?.id).toBe(id);
              expect(filterStudioBrushCatalogItems({ category: "all" }).some((item) => item.id === owner)).toBe(true);
              for (const candidate of [query, id]) {
                expect(filterStudioBrushCatalogItems({ category: "marker", query: candidate }).some((item) => item.id === id)).toBe(false);
              }
              expect(filterStudioBrushCatalogItems({ category: "favorites", favoriteIds: [id] }).some((item) => item.id === id)).toBe(false);
            }
          });

          it("keeps the catalogue exhaustive''')
          script = 'scripts/verify-studio-collaboration-sync.mts'
          replace(script, 'import { findFreePort }', 'import { STUDIO_DRAFT_CANVAS_PATHNAME } from "../apps/web/src/domains/creator/studio-workspace-route";\n\nimport { findFreePort }')
          replace(script, 'fetch(`${origin}/studio`)', 'fetch(`${origin}${STUDIO_DRAFT_CANVAS_PATHNAME}`)')
          replace(script, 'pageA.goto(`${origin}/studio`,', 'pageA.goto(`${origin}${STUDIO_DRAFT_CANVAS_PATHNAME}`,')
          replace(script, '  await canvas.waitFor({ state: "visible", timeout: 1 });', '  throw new Error(`canvas surface unavailable after 30 seconds at ${page.url()}`);')
          # Capture diagnostics on real browser failure, not only on successful final convergence.
          replace(script, '  report.diagnostics = diagnostics;\n  throw error;', '''  report.diagnostics = diagnostics;
            for (const [index, page] of browser.contexts().flatMap((context) => context.pages()).entries()) {
              await page.screenshot({ path: join(SCRATCH, `failure-tab-${index}.png`), fullPage: true }).catch(() => undefined);
              report[`failureTab${index}`] = { url: page.url(), body: await page.locator("body").innerText().catch(() => "unavailable") };
            }
            throw error;''')
          print('Corrected exact inventory counts, retained curation guards and explicit canvas route.')
          PY
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify repaired contracts and all material selection handoffs
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/brush-lab/brush-studio-v5-quality.test.ts
          apps/web/src/domains/creator/brush-lab/brush-studio-version-integration.test.ts
          apps/web/src/domains/creator/brush/studio-brush-selection.test.ts
          apps/web/src/domains/creator/studio-competitor-specialty-brush-expansion.test.ts
          apps/web/src/domains/creator/brush/studio-material-product-integration.test.ts
          apps/web/src/domains/creator/brush/studio-material-morphology-runtime.test.ts
          apps/web/src/domains/creator/brush/studio-brush-quality-portfolio.test.ts
          scripts/verify-studio-collaboration-entry.test.ts
      - name: Remove this feature-only helper and push with existing lint and typecheck hooks
        run: |
          test "$GITHUB_REF" = refs/heads/feat/brush-material-engine-20260913
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/brush-pr1355-regression-repair.yml
          git add apps/web/src/domains/creator/brush-lab/brush-studio-v5-quality.test.ts apps/web/src/domains/creator/brush-lab/brush-studio-version-integration.test.ts apps/web/src/domains/creator/brush-lab/brush-studio-v5-quality-catalog.ts apps/web/src/domains/creator/brush/studio-brush-selection.test.ts apps/web/src/domains/creator/studio-competitor-specialty-brush-expansion.test.ts scripts/verify-studio-collaboration-sync.mts
          git diff --cached --check
          git commit -m 'fix(studio): align material catalogue contracts and collaboration canvas entry'
          git push origin HEAD:feat/brush-material-engine-20260913
