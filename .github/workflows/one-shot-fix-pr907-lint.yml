name: One-shot fix PR 907 lint

on:
  push:
    branches:
      - ci/pr907-lint-fix-20260908-a
    paths:
      - .github/workflows/one-shot-fix-pr907-lint.yml

permissions:
  contents: write

concurrency:
  group: one-shot-fix-pr907-lint
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_BRANCH: release/final-df46fece-20260908-1905
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/final-df46fece-20260908-1905
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Reset to latest target and apply lint-only repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file_path = Path(path)
              source = file_path.read_text(encoding="utf-8")
              if old in source:
                  if source.count(old) != 1:
                      raise SystemExit(f"{label}: expected exactly one old occurrence, got {source.count(old)}")
                  source = source.replace(old, new, 1)
                  file_path.write_text(source, encoding="utf-8")
                  return
              if new not in source:
                  raise SystemExit(f"{label}: neither old nor repaired form found")

          surface = "apps/web/src/domains/creator/character-platform/surface-ink/character-surface-ink.ts"
          replace_once(
              surface,
              "    let segment = subtract(target, previous);\n    let segmentLength = length(segment);",
              "    const segment = subtract(target, previous);\n    const segmentLength = length(segment);",
              "surface ink immutable segment",
          )

          thumbnail = "apps/web/src/domains/creator/character-platform/thumbnail/character-runtime-thumbnail-store.tsx"
          replace_once(
              thumbnail,
              "export function useCharacterRuntimeThumbnail(entryId: string): string | null {",
              "// eslint-disable-next-line react-refresh/only-export-components\nexport function useCharacterRuntimeThumbnail(entryId: string): string | null {",
              "thumbnail hook fast-refresh boundary",
          )
          replace_once(
              thumbnail,
              "export function clearCharacterRuntimeThumbnails(): void {",
              "// eslint-disable-next-line react-refresh/only-export-components\nexport function clearCharacterRuntimeThumbnails(): void {",
              "thumbnail reset fast-refresh boundary",
          )
          replace_once(
              thumbnail,
              "  const ids = useMemo(() => selectedEntryIds(binding), [binding.recipe]);",
              "  const ids = useMemo(() => selectedEntryIds(binding), [binding]);",
              "thumbnail binding dependency",
          )

          workbench = "apps/web/src/domains/creator/character-platform/ui/CharacterPlatformWorkbench.tsx"
          for icon in ("BadgeCheck", "Box", "FileJson", "SlidersHorizontal"):
              replace_once(
                  workbench,
                  f"  {icon},\n",
                  "",
                  f"unused {icon} icon",
              )

          workbench_hook = "apps/web/src/domains/creator/character-platform/ui/use-character-platform-workbench.ts"
          replace_once(
              workbench_hook,
              "  const documentClock = useMemo(() => new Date().toISOString(), [modelId]);",
              "  const documentClock = useMemo(() => new Date().toISOString(), []);",
              "stable document clock dependency",
          )

          workspace = "apps/web/src/domains/creator/studio-production/studio-production-workspace.ts"
          replace_once(
              workspace,
              "export * from \"./studio-production-workspace-runtime\";\n\nimport {\n  createEmptyProductionWorkspace as createRuntimeProductionWorkspace,\n} from \"./studio-production-workspace-runtime\";\n\nimport type { ProductionWorkspace } from \"./studio-production-workspace-runtime\";\n",
              "import {\n  createEmptyProductionWorkspace as createRuntimeProductionWorkspace,\n} from \"./studio-production-workspace-runtime\";\n\nimport type { ProductionWorkspace } from \"./studio-production-workspace-runtime\";\n\nexport * from \"./studio-production-workspace-runtime\";\n",
              "workspace imports before export",
          )
          PY
          git diff --check

      - name: Install and validate affected files
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec eslint --no-cache \
            apps/web/src/domains/creator/character-platform/surface-ink/character-surface-ink.ts \
            apps/web/src/domains/creator/character-platform/thumbnail/character-runtime-thumbnail-store.tsx \
            apps/web/src/domains/creator/character-platform/ui/CharacterPlatformWorkbench.tsx \
            apps/web/src/domains/creator/character-platform/ui/use-character-platform-workbench.ts \
            apps/web/src/domains/creator/studio-production/studio-production-workspace.ts

      - name: Commit and push target branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Target already contains the lint repair."
            exit 0
          fi
          git add \
            apps/web/src/domains/creator/character-platform/surface-ink/character-surface-ink.ts \
            apps/web/src/domains/creator/character-platform/thumbnail/character-runtime-thumbnail-store.tsx \
            apps/web/src/domains/creator/character-platform/ui/CharacterPlatformWorkbench.tsx \
            apps/web/src/domains/creator/character-platform/ui/use-character-platform-workbench.ts \
            apps/web/src/domains/creator/studio-production/studio-production-workspace.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ci): resolve final integration lint errors"
          git push origin HEAD:"$TARGET_BRANCH"
