name: Fix PR 1264 pending stroke recovery v4 once

on:
  push:
    branches:
      - integration/completed-unmerged-20260910-1655
    paths:
      - .github/workflows/fix-pr1264-pending-stroke-recovery-v4-once.yml

permissions:
  contents: write

concurrency:
  group: fix-pr1264-pending-stroke-recovery-v4-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "1"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integration/completed-unmerged-20260910-1655
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply idempotent repair and retire staging artifacts
        run: |
          set -euo pipefail
          git pull --ff-only origin integration/completed-unmerged-20260910-1655
          node scripts/repair-pr1264-pending-stroke-recovery-v4.mjs
          rm -f \
            scripts/repair-pr1264-pending-stroke-recovery.mjs \
            scripts/repair-pr1264-pending-stroke-recovery-v4.mjs \
            .github/workflows/fix-pr1264-pending-stroke-recovery-once.yml \
            .github/workflows/fix-pr1264-pending-stroke-recovery-v2-once.yml \
            .github/workflows/fix-pr1264-pending-stroke-recovery-v3-once.yml \
            .github/workflows/fix-pr1264-pending-stroke-recovery-v4-once.yml
      - name: Verify focused and inherited contracts
        run: |
          pnpm exec vitest run \
            apps/web/src/domains/creator/studio-pending-stroke-recovery.test.ts \
            apps/web/src/domains/creator/studio-autosave-opfs-session.test.ts \
            apps/web/src/domains/creator/studio-pending-stroke-durability.test.ts
          pnpm run typecheck
          pnpm run validate:architecture
      - name: Commit verified repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No repair changes remained after convergence."
            exit 0
          fi
          git commit -m "fix(studio): recover the newest complete pending stroke snapshot"
          git pull --rebase origin integration/completed-unmerged-20260910-1655
          git push origin HEAD:integration/completed-unmerged-20260910-1655
