name: Studio safe automerge

on:
  workflow_run:
    workflows:
      - CI
      - Studio autonomous risk gate
      - SonarQube
      - Studio campaign release gate
    types: [completed]
  workflow_dispatch:
    inputs:
      head_sha:
        description: "Optional pull-request head SHA to re-evaluate"
        required: false
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: studio-safe-automerge-${{ github.event.workflow_run.head_sha || inputs.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  merge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      MANUAL_HEAD_SHA: ${{ inputs.head_sha }}
    steps:
      - name: Resolve eligible pull requests
        id: candidates
        shell: bash
        run: |
          set -euo pipefail

          head_sha="${EVENT_HEAD_SHA:-${MANUAL_HEAD_SHA:-}}"
          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "No valid pull-request head SHA was supplied."
            echo "numbers=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pulls_json="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${REPOSITORY}/commits/${head_sha}/pulls"
          )"

          mapfile -t numbers < <(
            jq -r \
              --arg repo "$REPOSITORY" \
              --arg sha "$head_sha" \
              '.[]
                | select(.state == "open")
                | select(.draft == false)
                | select(.base.ref == "main")
                | select(.head.repo.full_name == $repo)
                | select(.head.sha == $sha)
                | select(.head.ref | startswith("codex/"))
                | select((.body // "") | contains("<!-- studio-automerge -->"))
                | .number' <<< "$pulls_json"
          )

          if (( ${#numbers[@]} == 0 )); then
            echo "No eligible Studio autonomous pull request is associated with ${head_sha}."
            echo "numbers=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          joined="$(IFS=,; echo "${numbers[*]}")"
          echo "numbers=$joined" >> "$GITHUB_OUTPUT"
          echo "Eligible pull requests: $joined"

      - name: Merge only after every release gate is green
        if: ${{ steps.candidates.outputs.numbers != '' }}
        shell: bash
        env:
          PR_NUMBERS: ${{ steps.candidates.outputs.numbers }}
        run: |
          set -euo pipefail

          IFS=',' read -r -a pull_numbers <<< "$PR_NUMBERS"
          for pull_number in "${pull_numbers[@]}"; do
            pull_json="$(gh api "repos/${REPOSITORY}/pulls/${pull_number}")"
            head_sha="$(jq -r '.head.sha' <<< "$pull_json")"
            head_ref="$(jq -r '.head.ref' <<< "$pull_json")"
            body="$(jq -r '.body // ""' <<< "$pull_json")"

            if [[ "$(jq -r '.state' <<< "$pull_json")" != "open" ]] \
              || [[ "$(jq -r '.draft' <<< "$pull_json")" != "false" ]] \
              || [[ "$(jq -r '.base.ref' <<< "$pull_json")" != "main" ]] \
              || [[ "$(jq -r '.head.repo.full_name' <<< "$pull_json")" != "$REPOSITORY" ]] \
              || [[ "$head_ref" != codex/* ]] \
              || [[ "$body" != *'<!-- studio-automerge -->'* ]]; then
              echo "PR #${pull_number} is no longer eligible; skipping."
              continue
            fi

            if [[ "$head_ref" == codex/campaign-* ]]; then
              required_workflows=(
                "Studio campaign release gate"
                "Studio autonomous risk gate"
                "SonarQube"
              )
            else
              required_workflows=(
                "CI"
                "Studio autonomous risk gate"
                "SonarQube"
              )
            fi

            runs_json="$(
              gh api \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "repos/${REPOSITORY}/actions/runs?head_sha=${head_sha}&per_page=100"
            )"

            all_green=true
            for workflow_name in "${required_workflows[@]}"; do
              conclusion="$(
                jq -r \
                  --arg workflow_name "$workflow_name" \
                  '[.workflow_runs[] | select(.name == $workflow_name)]
                    | sort_by(.run_number)
                    | last
                    | .conclusion // "missing"' <<< "$runs_json"
              )"
              echo "PR #${pull_number}: ${workflow_name} => ${conclusion}"
              if [[ "$conclusion" != "success" ]]; then
                all_green=false
              fi
            done

            if [[ "$all_green" != "true" ]]; then
              echo "PR #${pull_number} remains open because at least one release gate is not green."
              continue
            fi

            # GitHub may briefly report mergeable=null after checks complete. Retry only the
            # metadata read; never bypass a false/conflicting result.
            mergeable="null"
            mergeable_state="unknown"
            for attempt in 1 2 3 4 5 6; do
              pull_json="$(gh api "repos/${REPOSITORY}/pulls/${pull_number}")"
              mergeable="$(jq -r '.mergeable' <<< "$pull_json")"
              mergeable_state="$(jq -r '.mergeable_state' <<< "$pull_json")"
              if [[ "$mergeable" != "null" ]]; then
                break
              fi
              sleep 5
            done

            if [[ "$mergeable" != "true" ]] \
              || [[ "$mergeable_state" == "dirty" ]] \
              || [[ "$mergeable_state" == "blocked" ]]; then
              echo "PR #${pull_number} is not safely mergeable (${mergeable}/${mergeable_state}); skipping."
              continue
            fi

            result="$(
              gh api \
                --method PUT \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "repos/${REPOSITORY}/pulls/${pull_number}/merge" \
                -f merge_method='squash' \
                -f sha="$head_sha"
            )"

            if [[ "$(jq -r '.merged' <<< "$result")" != "true" ]]; then
              echo "GitHub declined PR #${pull_number}: $(jq -r '.message // "unknown error"' <<< "$result")"
              exit 1
            fi

            echo "Merged PR #${pull_number} at $(jq -r '.sha' <<< "$result")."

            # The merge is already durable on main. Branch cleanup is best-effort and never turns a
            # successful release into a false failed merge. The scheduled cleanup workflow retries
            # any branch that GitHub temporarily refuses to remove.
            ref_path="repos/${REPOSITORY}/git/refs/heads/${head_ref}"
            if gh api --method DELETE "$ref_path" >/dev/null 2>&1; then
              echo "Deleted merged branch ${head_ref}."
            elif gh api "$ref_path" >/dev/null 2>&1; then
              echo "::warning::Merged branch ${head_ref} remains; scheduled cleanup will retry."
            else
              echo "Merged branch ${head_ref} is already absent."
            fi
          done
