name: Execute BG3D atomic template switch

on:
  push:
    branches: [fix/bg3d-template-switch-atomic-20260910]
    paths: [.github/workflows/bg3d-template-switch-atomic-executor.yml]

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/bg3d-template-switch-atomic-20260910
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Materialize atomic template product code
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import os, subprocess, yaml
          source = '.github/workflows/bg3d-template-switch-atomic-bootstrap.yml'
          data = yaml.safe_load(open(source, encoding='utf-8'))
          for job in data.get('jobs', {}).values():
              for step in job.get('steps', []):
                  script = step.get('run')
                  if not script:
                      continue
                  name = str(step.get('name', ''))
                  if name == 'Validate atomic template switching' or 'Commit product change' in name or 'git push origin' in script:
                      continue
                  env = os.environ.copy()
                  env.update({str(k): str(v) for k, v in (step.get('env') or {}).items()})
                  print(f'::group::{name or "bootstrap step"}')
                  subprocess.run(script, shell=True, executable='/bin/bash', check=True, env=env)
                  print('::endgroup::')
          PY
      - name: Validate atomic template scope
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run \
            apps/web/src/domains/creator/bg3d/studio-bg3d-template-switch-plan.test.ts \
            apps/web/src/domains/creator/bg3d/studio-bg3d-template-organizer-integration-boundary.test.ts \
            apps/web/src/domains/creator/studio-background-3d-scene-templates.test.ts
          pnpm exec eslint --max-warnings=0 \
            apps/web/src/domains/creator/bg3d/studio-bg3d-template-switch-plan.ts \
            apps/web/src/domains/creator/bg3d/studio-bg3d-template-switch-plan.test.ts \
            apps/web/src/domains/creator/bg3d/studio-bg3d-editor-scene-ops-host.ts \
            apps/web/src/domains/creator/bg3d/studio-bg3d-template-organizer-integration-boundary.test.ts
          git diff --check
      - name: Commit materialized product slice
        shell: bash
        run: |
          git config user.name toonstudio-3d-ci
          git config user.email actions@users.noreply.github.com
          rm -f .github/workflows/bg3d-template-switch-atomic-bootstrap.yml \
                .github/workflows/bg3d-template-switch-atomic-executor.yml
          git add -A
          git diff --cached --check
          HUSKY=0 git commit -m 'fix(bg3d): switch catalog templates atomically'
          HUSKY=0 git push origin HEAD:fix/bg3d-template-switch-atomic-20260910
