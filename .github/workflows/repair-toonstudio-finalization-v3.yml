name: Repair ToonStudio finalization v3

on:
  push:
    branches:
      - feat/toonstudio-session-completion-followup-20260911
    paths:
      - .github/workflows/repair-toonstudio-finalization-v3.yml

permissions:
  contents: write

concurrency:
  group: validate-toonstudio-continuation-once
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CI: "true"
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout continuation branch
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-session-completion-followup-20260911
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Reconcile runtime ownership and focused tests
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text()

          def write(path: str, value: str) -> None:
              Path(path).write_text(value)

          def ensure_before(path: str, marker: str, addition: str, sentinel: str) -> None:
              value = read(path)
              if sentinel in value:
                  return
              if marker not in value:
                  raise SystemExit(f"{path}: marker missing: {marker!r}")
              write(path, value.replace(marker, addition + marker, 1))

          # Stable, hook-safe template start route.
          write("apps/web/src/domains/creator/studio-shell/StudioTemplateStartRoute.tsx", '''import { useEffect, useMemo } from "react";\nimport { useNavigate, useParams } from "react-router-dom";\n\nimport {\n  createStudioTemplateHandoff,\n  studioTemplateById,\n  writeStudioTemplateHandoff,\n} from "../studio-template-catalog";\n\nfunction draftId(templateId: string): string {\n  const random = globalThis.crypto?.randomUUID?.().replaceAll("-", "").slice(0, 12)\n    ?? `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`;\n  return `template-${templateId}-${random}`.slice(0, 150);\n}\n\n/** Create a fresh document identity, persist one handoff, then enter the editor. */\nexport function StudioTemplateStartRoute() {\n  const { templateId = "" } = useParams<{ templateId: string }>();\n  const navigate = useNavigate();\n  const template = studioTemplateById(templateId);\n  const destination = useMemo(() => {\n    if (!template) return null;\n    const params = new URLSearchParams({\n      template: template.id,\n      workspace: template.recommendedWorkspace,\n    });\n    params.sort();\n    return `/studio/draft/${encodeURIComponent(draftId(template.id))}?${params.toString()}`;\n  }, [template]);\n\n  useEffect(() => {\n    if (!template || !destination) {\n      navigate("/studio/templates", { replace: true });\n      return;\n    }\n    writeStudioTemplateHandoff(\n      window.localStorage,\n      createStudioTemplateHandoff(template.id),\n    );\n    navigate(destination, { replace: true });\n  }, [destination, navigate, template]);\n\n  return null;\n}\n''')

          # Canonical template kinds and direct-start href.
          catalog_path = "apps/web/src/domains/creator/studio-template-catalog.ts"
          catalog = read(catalog_path)
          catalog = catalog.replace('documentKind: "comic"', 'documentKind: "webtoon"')
          catalog = catalog.replace('documentKind: "slides"', 'documentKind: "presentation"')
          catalog = catalog.replace('rightsStatus: "unknown"', 'rightsStatus: "warning"')
          start = catalog.index("export function studioTemplateStartHref")
          end = catalog.index("\n}\n", start) + 3
          catalog = catalog[:start] + '''export function studioTemplateStartHref(templateId: string): string {\n  const template = studioTemplateById(templateId);\n  if (!template) throw new Error("A known Studio template is required.");\n  return `/studio/templates/${encodeURIComponent(template.id)}/start`;\n}\n''' + catalog[end:]
          write(catalog_path, catalog)

          # Route exports and ownership are idempotently repaired.
          pages_path = "apps/web/src/app/routes/groups/creator-route-pages.ts"
          ensure_before(
              pages_path,
              "export const StudioTemplatesPage = lazyRetry(",
              '''export const StudioTemplateStartRoute = lazyRetry(\n  () => import("@/domains/creator/studio-shell/StudioTemplateStartRoute").then((module) => ({\n    default: module.StudioTemplateStartRoute,\n  })),\n  "StudioTemplateStartRoute",\n);\n''',
              "export const StudioTemplateStartRoute",
          )
          routes_path = "apps/web/src/app/routes/groups/creator.routes.tsx"
          routes = read(routes_path)
          if "  StudioTemplateStartRoute," not in routes:
              routes = routes.replace("  StudioTemplatesPage,\n", "  StudioTemplatesPage,\n  StudioTemplateStartRoute,\n", 1)
          if 'path: "/studio/templates/:templateId/start"' not in routes:
              marker = '  { id: "creator-studio-templates", path: "/studio/templates", element: <StudioTemplatesPage /> },\n'
              if marker not in routes:
                  raise SystemExit("creator.routes.tsx: template hub route missing")
              routes = routes.replace(marker, '  { id: "creator-studio-template-start", path: "/studio/templates/:templateId/start", element: <StudioTemplateStartRoute /> },\n' + marker, 1)
          write(routes_path, routes)

          # Editor applies the handoff once.
          hosts_path = "apps/web/src/domains/creator/studio-cuttoon-editor/StudioCuttoonEditorHosts.tsx"
          hosts = read(hosts_path)
          if 'from "./StudioTemplateHandoffHost"' not in hosts:
              marker = 'import { StudioImportHandoffHost } from "./StudioImportHandoffHost";\n'
              if marker not in hosts:
                  raise SystemExit("StudioCuttoonEditorHosts.tsx: import handoff import missing")
              hosts = hosts.replace(marker, marker + 'import { StudioTemplateHandoffHost } from "./StudioTemplateHandoffHost";\n', 1)
          if "<StudioTemplateHandoffHost" not in hosts:
              offset = hosts.find("<StudioImportHandoffHost")
              if offset < 0:
                  raise SystemExit("StudioCuttoonEditorHosts.tsx: import handoff mount missing")
              hosts = hosts[:offset] + "<StudioTemplateHandoffHost />\n      " + hosts[offset:]
          write(hosts_path, hosts)

          # Browser and test-compatible SHA-256, with functional persistence for concurrent files.
          seller_path = "apps/web/src/domains/creator/studio-shell/StudioMarketplaceSellerPanel.tsx"
          seller = read(seller_path)
          checksum_start = seller.index("async function checksum(file: File)")
          checksum_end = seller.index("\n}\n", checksum_start) + 3
          seller = seller[:checksum_start] + '''async function checksum(file: File): Promise<string> {\n  if (!globalThis.crypto?.subtle) {\n    throw new Error("Secure file verification is not available in this browser.");\n  }\n  const bytes = typeof file.arrayBuffer === "function"\n    ? await file.arrayBuffer()\n    : await new Response(file).arrayBuffer();\n  const digest = await globalThis.crypto.subtle.digest("SHA-256", bytes);\n  return `sha256:${[...new Uint8Array(digest)]\n    .map((value) => value.toString(16).padStart(2, "0"))\n    .join("")}`;\n}\n''' + seller[checksum_end:]
          old = '''      const nextFile = Object.freeze({\n        path: `${role}/${file.name}`,\n        role,\n        format: extension(file.name),\n        sizeBytes: file.size,\n        checksum: await checksum(file),\n      });\n      commit({\n        ...submission,\n        files: Object.freeze([\n          ...submission.files.filter((item) => item.role !== role),\n          nextFile,\n        ]),\n        updatedAt: new Date().toISOString(),\n      }, locale === "ko" ? `${file.name}의 무결성을 확인했습니다.` : `Verified ${file.name}.`);'''
          if old in seller:
              seller = seller.replace(old, '''      const nextFile = Object.freeze({\n        path: `${role}/${file.name}`,\n        role,\n        format: extension(file.name),\n        sizeBytes: file.size,\n        checksum: await checksum(file),\n      });\n      setSubmission((current) => {\n        const next = {\n          ...current,\n          files: Object.freeze([\n            ...current.files.filter((item) => item.role !== role),\n            nextFile,\n          ]),\n          updatedAt: new Date().toISOString(),\n        };\n        return writeStudioMarketplaceSubmissionDraft(window.localStorage, next, window);\n      });\n      setMessage(locale === "ko" ? `${file.name}의 무결성을 확인했습니다.` : `Verified ${file.name}.`);''', 1)
          write(seller_path, seller)

          # Mount seller authoring under the canonical seller view.
          hub_path = "apps/web/src/domains/creator/studio-shell/StudioAssetHubPage.tsx"
          hub = read(hub_path)
          if 'from "./StudioMarketplaceSellerPanel"' not in hub:
              anchor = 'import { StudioAssetGovernancePanel } from "./StudioAssetGovernancePanel";\n'
              if anchor not in hub:
                  raise SystemExit("StudioAssetHubPage.tsx: asset governance import missing")
              hub = hub.replace(anchor, anchor + 'import { StudioMarketplaceSellerPanel } from "./StudioMarketplaceSellerPanel";\n', 1)
          if "<StudioMarketplaceSellerPanel" not in hub:
              marker = '      {view === "seller" ? <MarketManagePage /> : null}\n'
              if marker not in hub:
                  raise SystemExit("StudioAssetHubPage.tsx: seller projection marker missing")
              hub = hub.replace(marker, '''      {view === "seller" ? (\n        <>\n          <MarketManagePage />\n          <Container size="wide" className="pb-10 sm:pb-14">\n            <StudioMarketplaceSellerPanel sellerId={projectId ?? "current-seller"} locale={locale} />\n          </Container>\n        </>\n      ) : null}\n''', 1)
          write(hub_path, hub)

          # Focused tests use semantic outputs and deterministic browser shims.
          write("apps/web/src/domains/creator/studio-shell/StudioTemplateStartRoute.test.tsx", '''// @vitest-environment jsdom\n\nimport { render, screen, waitFor } from "@testing-library/react";\nimport { afterEach, beforeEach, describe, expect, it } from "vitest";\nimport { MemoryRouter, Route, Routes, useLocation } from "react-router-dom";\n\nimport { STUDIO_TEMPLATE_HANDOFF_KEY } from "../studio-template-catalog";\nimport { StudioTemplateStartRoute } from "./StudioTemplateStartRoute";\n\nfunction LocationProbe() {\n  const location = useLocation();\n  return <output aria-label="location">{`${location.pathname}${location.search}`}</output>;\n}\n\nbeforeEach(() => window.localStorage.clear());\nafterEach(() => window.localStorage.clear());\n\ndescribe("StudioTemplateStartRoute", () => {\n  it("creates a fresh draft and preserves template and workspace", async () => {\n    render(\n      <MemoryRouter initialEntries={["/studio/templates/webtoon-four-panel/start"]}>\n        <Routes>\n          <Route path="/studio/templates/:templateId/start" element={<StudioTemplateStartRoute />} />\n          <Route path="*" element={<LocationProbe />} />\n        </Routes>\n      </MemoryRouter>,\n    );\n    await waitFor(() => {\n      expect(screen.getByLabelText("location").textContent).toMatch(\n        /^\\/studio\\/draft\\/template-webtoon-four-panel-/u,\n      );\n    });\n    expect(screen.getByLabelText("location").textContent).toContain("workspace=comic");\n    expect(screen.getByLabelText("location").textContent).toContain("template=webtoon-four-panel");\n    expect(window.localStorage.getItem(STUDIO_TEMPLATE_HANDOFF_KEY)).toContain("webtoon-four-panel");\n  });\n\n  it("returns an unknown template to the template hub", async () => {\n    render(\n      <MemoryRouter initialEntries={["/studio/templates/unknown/start"]}>\n        <Routes>\n          <Route path="/studio/templates/:templateId/start" element={<StudioTemplateStartRoute />} />\n          <Route path="*" element={<LocationProbe />} />\n        </Routes>\n      </MemoryRouter>,\n    );\n    await waitFor(() => expect(screen.getByLabelText("location").textContent).toBe("/studio/templates"));\n    expect(window.localStorage.getItem(STUDIO_TEMPLATE_HANDOFF_KEY)).toBeNull();\n  });\n});\n''')

          templates_test_path = "apps/web/src/domains/creator/studio-shell/StudioTemplatesPage.test.tsx"
          templates_test = read(templates_test_path)
          templates_test = templates_test.replace(
              '.toContain("template=presentation-webtoon-pitch");',
              '.toBe("/studio/templates/presentation-webtoon-pitch/start");',
          )
          write(templates_test_path, templates_test)

          catalog_test_path = "apps/web/src/domains/creator/studio-template-catalog.test.ts"
          catalog_test = read(catalog_test_path)
          catalog_test = catalog_test.replace(
              '.toBe("/studio/new?template=webtoon-vertical-episode&workspace=comic");',
              '.toBe("/studio/templates/webtoon-vertical-episode/start");',
          )
          catalog_test = catalog_test.replace(
              'expect(planStudioTemplateApplication(\n        template.definition,\n        defaultStudioTemplateValues(template),\n      ).status).not.toBe("blocked");',
              'expect(["ready", "review"]).toContain(planStudioTemplateApplication(\n        template.definition,\n        defaultStudioTemplateValues(template),\n      ).status);',
          )
          write(catalog_test_path, catalog_test)

          seller_test_path = "apps/web/src/domains/creator/studio-shell/StudioMarketplaceSellerPanel.test.tsx"
          write(seller_test_path, '''// @vitest-environment jsdom\n\nimport { cleanup, fireEvent, render, screen, waitFor } from "@testing-library/react";\nimport { afterEach, beforeEach, describe, expect, it, vi } from "vitest";\n\nimport { StudioMarketplaceSellerPanel } from "./StudioMarketplaceSellerPanel";\n\nconst digest = vi.fn(async () => new Uint8Array(32).fill(0xab).buffer);\n\nbeforeEach(() => {\n  window.localStorage.clear();\n  Object.defineProperty(globalThis.crypto, "subtle", {\n    configurable: true,\n    value: { digest },\n  });\n  Object.defineProperty(File.prototype, "arrayBuffer", {\n    configurable: true,\n    value: vi.fn(async function arrayBuffer(this: File) {\n      return new TextEncoder().encode(`${this.name}:${this.size}`).buffer;\n    }),\n  });\n  digest.mockClear();\n});\n\nafterEach(() => {\n  cleanup();\n  window.localStorage.clear();\n  vi.restoreAllMocks();\n});\n\ndescribe("StudioMarketplaceSellerPanel", () => {\n  it("persists a draft without claiming remote completion", async () => {\n    render(<StudioMarketplaceSellerPanel sellerId="seller-1" locale="ko" />);\n    fireEvent.change(screen.getByLabelText("에셋 이름"), { target: { value: "웹툰 잉크 브러시" } });\n    fireEvent.change(screen.getByLabelText("설명"), { target: { value: "필압과 기울기를 지원하는 전문 선화 브러시입니다." } });\n    fireEvent.change(screen.getByLabelText("기술 품질 점수"), { target: { value: "94" } });\n    fireEvent.click(screen.getByLabelText(/참조 원본과 포함 파일의 판매 권리/u));\n    await waitFor(() => {\n      const value = window.localStorage.getItem("toonspectrum:studio-marketplace-submission:v1:seller-1");\n      expect(value).toContain("웹툰 잉크 브러시");\n      expect(value).toContain('"qualityScore":94');\n    });\n    expect(document.body.textContent).not.toMatch(/업로드 완료|판매 완료|공개 완료/u);\n  });\n\n  it("hashes and preserves the product and preview files", async () => {\n    render(<StudioMarketplaceSellerPanel sellerId="seller-files" locale="ko" />);\n    const inputs = document.querySelectorAll<HTMLInputElement>('input[type="file"]');\n    fireEvent.change(inputs[0]!, { target: { files: [new File(["brush"], "ink.toon-brush")] } });\n    await waitFor(() => expect(window.localStorage.getItem(\n      "toonspectrum:studio-marketplace-submission:v1:seller-files",\n    )).toContain("primary/ink.toon-brush"));\n    fireEvent.change(inputs[1]!, { target: { files: [new File(["preview"], "preview.png")] } });\n    await waitFor(() => {\n      const value = window.localStorage.getItem("toonspectrum:studio-marketplace-submission:v1:seller-files");\n      expect(value).toContain("primary/ink.toon-brush");\n      expect(value).toContain("preview/preview.png");\n      expect(value).toContain(`sha256:${"ab".repeat(32)}`);\n    });\n    expect(digest).toHaveBeenCalledTimes(2);\n  });\n});\n''')

          governance_test_path = "apps/web/src/domains/creator/studio-shell/StudioAssetGovernancePanel.test.tsx"
          governance_test = read(governance_test_path)
          governance_test = governance_test.replace('getByLabelText("구매한 계정 연결됨")', 'getByLabelText(/구매한 계정 연결됨/u)')
          governance_test = governance_test.replace('getByLabelText("AI 학습에 사용")', 'getByLabelText(/AI 학습에 사용/u)')
          write(governance_test_path, governance_test)

          delivery_test_path = "apps/web/src/domains/creator/studio-shell/StudioProjectDeliveryPanel.test.tsx"
          delivery_test = read(delivery_test_path).replace(
              'expect(screen.getByText("완전한 프로젝트 사본")).toBeTruthy();',
              'expect(screen.getAllByText("완전한 프로젝트 사본").length).toBeGreaterThan(0);',
          )
          write(delivery_test_path, delivery_test)

          handoff_test_path = "apps/web/src/domains/creator/studio-cuttoon-editor/StudioTemplateHandoffHost.test.tsx"
          handoff_test = read(handoff_test_path).replace(
              '"2026-09-12T00:00:00.000Z",\n        3_600_000,',
              'new Date().toISOString(),\n        3_600_000,',
          )
          write(handoff_test_path, handoff_test)

          # Update exact route expectations retained by older regression tests.
          destinations_test_path = "apps/web/src/domains/creator/studio-project-view-destinations.test.ts"
          destinations_test = read(destinations_test_path)
          destinations_test = destinations_test.replace("view=rights", "view=safety")
          destinations_test = destinations_test.replace("view=installed", "view=library")
          write(destinations_test_path, destinations_test)

          product_test_path = "apps/web/src/domains/creator/studio-product-ia.test.ts"
          product_test = read(product_test_path).replace(
              '["work", "create", "assets", "learn"]',
              '["work", "templates", "assets", "learn"]',
          )
          write(product_test_path, product_test)

          # Reachability additions are idempotent.
          reach_path = "scripts/verify-toonstudio-feature-reachability.mjs"
          reach = read(reach_path)
          marker = '  "apps/web/src/domains/creator/studio-template-system.ts",\n'
          for addition in [
              '  "apps/web/src/domains/creator/studio-template-catalog.ts",\n',
              '  "apps/web/src/domains/creator/studio-marketplace-submission-store.ts",\n',
              '  "apps/web/src/domains/creator/studio-shell/StudioTemplatesPage.tsx",\n',
              '  "apps/web/src/domains/creator/studio-shell/StudioTemplateStartRoute.tsx",\n',
              '  "apps/web/src/domains/creator/studio-cuttoon-editor/StudioTemplateHandoffHost.tsx",\n',
              '  "apps/web/src/domains/creator/studio-shell/StudioMarketplaceSellerPanel.tsx",\n',
              '  "apps/web/src/domains/creator/studio-shell/StudioAssetGovernancePanel.tsx",\n',
              '  "apps/web/src/domains/creator/studio-shell/StudioProjectDeliveryPanel.tsx",\n',
              '  "apps/web/src/domains/creator/studio-shell/StudioExternalEntryRoutes.tsx",\n',
          ]:
              if addition.strip() not in reach:
                  if marker not in reach:
                      raise SystemExit("reachability marker missing")
                  reach = reach.replace(marker, marker + addition, 1)
          write(reach_path, reach)

          # Ensure the closure test has runtime assertions.
          closure_path = "apps/web/src/domains/creator/studio-integration-closure.test.ts"
          closure = read(closure_path)
          blocks = []
          if "applies template handoffs in the real document runtime" not in closure:
              blocks.append('''\n  it("applies template handoffs in the real document runtime", () => {\n    const routes = source("apps/web/src/app/routes/groups/creator.routes.tsx");\n    const hosts = source("apps/web/src/domains/creator/studio-cuttoon-editor/StudioCuttoonEditorHosts.tsx");\n    const handoff = source("apps/web/src/domains/creator/studio-cuttoon-editor/StudioTemplateHandoffHost.tsx");\n    expect(routes).toContain('path: "/studio/templates/:templateId/start"');\n    expect(hosts).toContain("<StudioTemplateHandoffHost");\n    expect(handoff).toContain("updateStudioProjectFeatureSuite");\n  });\n''')
          if "connects the functional seller workflow" not in closure:
              blocks.append('''\n  it("connects the functional seller workflow without fake completion", () => {\n    const hub = source("apps/web/src/domains/creator/studio-shell/StudioAssetHubPage.tsx");\n    const seller = source("apps/web/src/domains/creator/studio-shell/StudioMarketplaceSellerPanel.tsx");\n    expect(hub).toContain("<StudioMarketplaceSellerPanel");\n    expect(seller).toContain("crypto.subtle.digest");\n    expect(seller).not.toContain("업로드 완료");\n  });\n''')
          if blocks:
              ending = "\n});\n"
              if not closure.endswith(ending):
                  raise SystemExit("integration closure ending missing")
              closure = closure[:-len(ending)] + "".join(blocks) + ending
              write(closure_path, closure)

          # Closure is executed with no branch-mutating helper left in the tree.
          for value in [
              ".github/workflows/repair-toonstudio-finalization-v3.yml",
              ".github/workflows/repair-toonstudio-finalization-v2.yml",
              ".github/workflows/finalize-toonstudio-continuation.yml",
              ".github/workflows/apply-toonstudio-seller-center.yml",
              ".github/workflows/apply-toonstudio-continuation.yml",
              ".github/workflows/repair-toonstudio-continuation.yml",
              ".github/workflows/validate-toonstudio-continuation.yml",
              ".github/workflows/toonstudio-continuation-source-snapshot.yml",
              ".github/workflows/toonstudio-followup-source-snapshot.yml",
              ".github/workflows/finalize-toonstudio-session.yml",
              ".github/workflows/apply-toonstudio-session-fixes.yml",
              ".github/workflows/apply-toonstudio-session-fixes-retry.yml",
              ".github/workflows/toonstudio-final-sync-v2.yml",
              ".github/workflows/repair-sync-toonstudio-session.yml",
              ".github/workflows/install-toonstudio-session-gate.yml",
              ".github/workflows/apply-toonstudio-project-contract-repair.yml",
          ]:
              Path(value).unlink(missing_ok=True)
          PY

      - name: Format and lint continuation source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -t files < <((git diff --name-only origin/main...HEAD; git diff --name-only) | sort -u | grep -E '\.(ts|tsx|mjs)$' || true)
          if ((${#files[@]})); then
            pnpm exec prettier --write "${files[@]}"
            pnpm exec eslint --fix --no-warn-ignored "${files[@]}"
          fi
          git diff --check

      - name: Typecheck whole workspace
        run: pnpm exec tsc -p tsconfig.json --noEmit --pretty false

      - name: Run focused continuation tests
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/studio-template-catalog.test.ts
          apps/web/src/domains/creator/studio-external-route.test.ts
          apps/web/src/domains/creator/studio-marketplace-submission-store.test.ts
          apps/web/src/domains/creator/studio-marketplace-submission.test.ts
          apps/web/src/domains/creator/studio-route-registry.test.ts
          apps/web/src/domains/creator/studio-product-ia.test.ts
          apps/web/src/domains/creator/studio-project-view-destinations.test.ts
          apps/web/src/domains/creator/studio-integration-closure.test.ts
          apps/web/src/domains/creator/studio-asset-governance.test.ts
          apps/web/src/domains/creator/studio-asset-passport.test.ts
          apps/web/src/domains/creator/studio-asset-provider.test.ts
          apps/web/src/domains/creator/studio-rights-graph.test.ts
          apps/web/src/domains/creator/studio-font-audit.test.ts
          apps/web/src/domains/creator/studio-plugin-registry.test.ts
          apps/web/src/domains/creator/studio-archive-manifest.test.ts
          apps/web/src/domains/creator/studio-publishing-connector.test.ts
          apps/web/src/domains/creator/studio-publishing-package.test.ts
          apps/web/src/domains/creator/studio-cuttoon-editor/StudioTemplateHandoffHost.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioTemplateStartRoute.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioTemplatesPage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioMarketplaceSellerPanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioAssetHubPage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioAssetGovernancePanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectDeliveryPanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.test.tsx
          --pool=forks --maxWorkers=2

      - name: Verify integration and reachability
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-toonstudio-feature-reachability.mjs
          if pnpm run | grep -q 'verify:studio-ia'; then pnpm run verify:studio-ia; fi
          if pnpm run | grep -q 'verify:studio-session-complete'; then pnpm run verify:studio-session-complete; fi
          bash scripts/verify-toonstudio-integration.sh core
          bash scripts/verify-toonstudio-integration.sh ui
          bash scripts/verify-toonstudio-integration.sh editor

      - name: Build production bundle
        run: pnpm run build:bundle

      - name: Record acceptance and push
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/rewrite
          cat > docs/rewrite/toonstudio-continuation-v3-acceptance.md <<EOF
          # ToonStudio continuation v3 acceptance

          - Validated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Base main: \`$(git rev-parse origin/main)\`
          - Whole-workspace TypeScript: passed
          - ESLint continuation delta: passed
          - Template creation and runtime handoff tests: passed
          - Asset governance and seller file-integrity tests: passed
          - Delivery, archive and external entry tests: passed
          - Feature reachability: passed
          - Core, UI and editor integration: passed
          - Production bundle: passed

          The selected template creates a fresh document and is consumed once in the real editor host. Seller product and preview files are independently SHA-256 verified and retained under concurrent activity. Remote writes remain blocked without an authenticated connector.
          EOF
          git config user.name "toonstudio-integration-bot"
          git config user.email "toonstudio-integration-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(studio): complete continuation runtime validation"
          git push origin HEAD:feat/toonstudio-session-completion-followup-20260911
