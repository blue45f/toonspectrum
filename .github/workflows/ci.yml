name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # DB-backed 테스트(community 등)는 PostgreSQL을 사용한다(libSQL 파일 → Postgres 마이그레이션).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: webdex
          POSTGRES_DB: webdex
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webdex -d webdex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://webdex@localhost:5432/webdex
      # 같은 direct PostgreSQL에 Socket.IO adapter migration을 적용한 뒤 2-node integration을
      # 필수 실행한다. 이 값이 있으면 해당 테스트는 skip이 아니라 CI gate가 된다.
      STUDIO_LIVE_POSTGRES_INTEGRATION_URL: postgres://webdex@localhost:5432/webdex
      # StudioPage.tsx 등 초대형 모듈 ESLint/tsc 힙 고갈 방지 (GitHub-hosted ~7GB 한도 내).
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
      # pnpm 버전은 package.json "packageManager" 필드를 단일 소스로 사용한다.
      # action-setup은 여기에 version 입력이 함께 있으면 ERR_PNPM_BAD_PM_VERSION로 충돌한다.
      - uses: pnpm/action-setup@v6 # NOSONAR S7637 신뢰된 1st-party 액션
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate:architecture
      - run: pnpm run lint
      - run: pnpm run typecheck
      # 테스트 전에 스키마를 provision(Drizzle) — DB-backed 테스트가 의존.
      # drizzle-kit 0.31.x는 일부 내부 예외에도 종료 코드 0을 반환할 수 있어, 앱의 최소 스키마
      # 계약을 PostgreSQL에서 직접 확인해 부분 provision 상태로 테스트를 진행하지 않는다.
      - name: Provision and verify database schema
        run: |
          pnpm exec drizzle-kit push --force
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1
              FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'user'
                AND column_name = 'status'
            ) THEN
              RAISE EXCEPTION 'Drizzle schema provision failed: public.user.status is missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1
              FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'creator_work_crdt_snapshot'
                AND column_name = 'compactedSequence'
            ) THEN
              RAISE EXCEPTION 'Drizzle schema provision failed: CRDT sequence contract is missing';
            END IF;
          END;
          $$;
          SQL
      # 배포 migration 자체도 실제 PostgreSQL에서 실행한 뒤 realtime integration을 수행한다.
      # 0017은 최종 Drizzle 스키마에서도 안전하게 원장만 기록하며, integration suite가 별도
      # schema에 legacy 상태를 구성해 최초 cutover와 재적용 보존을 함께 증명한다.
      - name: Apply realtime SQL migrations
        run: |
          psql "$STUDIO_LIVE_POSTGRES_INTEGRATION_URL" -v ON_ERROR_STOP=1 -f lib/db/migrations/0009_socket_io_postgres_adapter.sql
          psql "$STUDIO_LIVE_POSTGRES_INTEGRATION_URL" -v ON_ERROR_STOP=1 -f lib/db/migrations/0017_creator_work_live_lock_revision.sql
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm run check:studio-bundle
      - run: pnpm run build:all
