name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  studio-p5-brush-real-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6 # NOSONAR S7637 신뢰된 1st-party 액션
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify real p5.brush Worker WebGL2 runtime
        run: pnpm run verify:studio-p5-brush-real-runtime

  verify:
    # Keep this job ID because repository CI-policy tests inspect jobs.verify. The display name
    # moves so the fresh 3D job can retain the stable "CI / verify" check context.
    name: core
    runs-on: ubuntu-latest
    # The complete root suite contains broad Studio/browser and disposable-DB gates. On the
    # GitHub runner, checkout/install/lint/typecheck consume about 9 minutes before Vitest starts,
    # so the old 25-minute job limit cancelled Vitest mid-run and hid its final failure summary.
    # Keep a bounded per-step budget for Vitest while leaving enough time for the post-test runtime
    # and production-build gates. Raising this ceiling does not skip or weaken any check.
    timeout-minutes: 75
    # DB-backed 테스트(community 등)는 PostgreSQL을 사용한다(libSQL 파일 → Postgres 마이그레이션).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: webdex
          POSTGRES_PASSWORD: webdex
          POSTGRES_DB: webdex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webdex -d webdex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://webdex:webdex@localhost:5432/webdex
      # 같은 direct PostgreSQL에 Socket.IO adapter migration을 적용한 뒤 2-node integration을
      # 필수 실행한다. 이 값이 있으면 해당 테스트는 skip이 아니라 CI gate가 된다.
      STUDIO_LIVE_POSTGRES_INTEGRATION_URL: postgres://webdex:webdex@localhost:5432/webdex
      # StudioPage.tsx 등 초대형 모듈 ESLint/tsc 힙 고갈 방지 (GitHub-hosted ~7GB 한도 내).
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
      # pnpm 버전은 package.json "packageManager" 필드를 단일 소스로 사용한다.
      # action-setup은 여기에 version 입력이 함께 있으면 ERR_PNPM_BAD_PM_VERSION로 충돌한다.
      - uses: pnpm/action-setup@v6 # NOSONAR S7637 신뢰된 1st-party 액션
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run validate:architecture
      - run: pnpm run lint
      - run: pnpm run typecheck
      # 테스트 전에 스키마를 provision(Drizzle) — DB-backed 테스트가 의존.
      # drizzle-kit 0.31.x는 일부 내부 예외에도 종료 코드 0을 반환할 수 있어, 앱의 최소 스키마
      # 계약을 PostgreSQL에서 직접 확인해 부분 provision 상태로 테스트를 진행하지 않는다.
      - name: Provision and verify database schema
        run: |
          set -euo pipefail
          # Fresh provision의 Marketplace trigram index DDL이 operator class를 참조하기 전에
          # extension을 명시적으로 준비한다.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'webdex_runtime'
            ) THEN
              CREATE ROLE webdex_runtime
                LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;
            END IF;
          END;
          $$;
          GRANT CONNECT ON DATABASE webdex TO webdex_runtime;
          GRANT USAGE ON SCHEMA public TO webdex_runtime;
          SQL
          # drizzle-kit 0.31.x가 내부 PostgreSQL 오류에도 0으로 끝나는 경우가 있어 출력도 gate한다.
          set +e
          push_output="$(pnpm exec drizzle-kit push --force 2>&1)"
          push_status=$?
          set -e
          printf '%s\n' "$push_output"
          if [[ "$push_status" -ne 0 ]] \
            || grep -Eiq '(^|[[:space:]])error:|severity:.*(ERROR|FATAL|PANIC)' <<< "$push_output"; then
            echo "::error::drizzle-kit fresh schema provision failed."
            exit 1
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1
              FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'user'
                AND column_name = 'status'
            ) THEN
              RAISE EXCEPTION 'Drizzle schema provision failed: public.user.status is missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1
              FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'creator_work_crdt_snapshot'
                AND column_name = 'compactedSequence'
            ) THEN
              RAISE EXCEPTION 'Drizzle schema provision failed: CRDT sequence contract is missing';
            END IF;
          END;
          $$;
          SQL
      # Production의 실제 무원장 baseline(0019까지 적용)을 재현한다. 이 setup은 빈 CI DB에서만
      # historical SQL을 한 번 실행한다. runner의 adopt는 이 구조/0017 marker를 검증해 0001~0019
      # checksum을 재실행 없이 기록하고, 0023 ledger bootstrap을 제외한 post-baseline
      # migration을 실제 SQL 경로로 실행해야 한다.
      - name: Reproduce reviewed historical baseline through 0019
        run: |
          set -euo pipefail
          while IFS= read -r migration_path; do
            if [[ "$migration_path" == lib/db/migrations/0020_* ]]; then
              break
            fi
            psql "$STUDIO_LIVE_POSTGRES_INTEGRATION_URL" \
              -X -v ON_ERROR_STOP=1 \
              -f "$migration_path"
          done < scripts/production-database-migrations.manifest
          # drizzle-kit push describes the current schema, so remove only post-0019
          # relations from this fresh CI database. Adoption must recreate them through the actual
          # 0020/0021/0022 SQL path rather than exercising CREATE IF NOT EXISTS no-ops.
          psql "$STUDIO_LIVE_POSTGRES_INTEGRATION_URL" \
            -X -v ON_ERROR_STOP=1 <<'SQL'
          DROP TABLE IF EXISTS
            "creator_work_asset_storage_reference",
            "creator_asset_storage_object",
            "creator_marketplace_publish_gate",
            "creator_marketplace_resource",
            "creator_draft_collaboration_room"
          CASCADE;
          DROP EXTENSION IF EXISTS pg_trgm;
          SQL
      - name: Adopt verified history and apply genuine pending migrations
        run: |
          set -euo pipefail
          manifest_path='scripts/production-database-migrations.manifest'
          adoption_baseline=19
          manifest_count="$(grep -cve '^[[:space:]]*$' "$manifest_path")"
          bootstrap_count="$(grep -c '/0023_production_migration_ledger.sql$' "$manifest_path")"
          test "$bootstrap_count" -eq 1
          expected_applied=$((manifest_count - adoption_baseline - bootstrap_count))
          expected_verified=$((adoption_baseline + bootstrap_count))
          adoption_output="$(
            MIGRATION_DATABASE_URL="$STUDIO_LIVE_POSTGRES_INTEGRATION_URL" \
              node scripts/run-production-database-migrations.mjs \
              --allow-loopback \
              --mode adopt \
              --runtime-database-role webdex_runtime \
              --release-sha "$GITHUB_SHA" \
              --confirmation ADOPT-TOONSPECTRUM-MIGRATION-HISTORY
          )"
          printf '%s\n' "$adoption_output"
          expected_summary="${adoption_baseline} adopted, ${expected_applied} applied, ${expected_verified} checksum-verified skips"
          grep -Fq "$expected_summary" <<< "$adoption_output"
      - name: Prove pending-only migration rerun
        run: |
          set -euo pipefail
          manifest_count="$(grep -cve '^[[:space:]]*$' scripts/production-database-migrations.manifest)"
          rerun_output="$(
            MIGRATION_DATABASE_URL="$STUDIO_LIVE_POSTGRES_INTEGRATION_URL" \
              node scripts/run-production-database-migrations.mjs \
                --allow-loopback \
                --mode apply \
                --runtime-database-role webdex_runtime \
                --release-sha "$GITHUB_SHA" \
                --confirmation APPLY-TOONSPECTRUM-PRODUCTION-MIGRATIONS
          )"
          printf '%s\n' "$rerun_output"
          grep -Fq "0 applied, ${manifest_count} checksum-verified skips" <<< "$rerun_output"
      - name: Verify full runtime readiness and exact migration ledger
        run: |
          MIGRATION_DATABASE_URL="$STUDIO_LIVE_POSTGRES_INTEGRATION_URL" \
            node scripts/verify-production-database-capabilities.mjs \
              --runtime-database-role webdex_runtime \
              --allow-loopback
      - name: Run the complete root Vitest suite with per-file progress
        timeout-minutes: 40
        run: pnpm run test
      # The root Vitest run intentionally skips Redis without a disposable target.
      # This runner owns a password-protected loopback container and always removes it.
      - name: Verify distributed Redis coordination against a disposable instance
        run: pnpm run test:redis:integration
      # root Vitest suite에는 source unit만 포함된다. workerd runtime integration과 Worker
      # 전용 tsconfig를 별도 gate하지 않으면 Durable Object/runtime 회귀가 false-green이 된다.
      - run: pnpm run test:cloudflare-realtime
      - run: pnpm run typecheck:cloudflare-realtime
      - name: Verify Cloudflare realtime Worker packaging
        run: |
          pnpm exec wrangler deploy \
            --dry-run \
            --config deploy/cloudflare-realtime/wrangler.jsonc \
            --outdir /tmp/toonspectrum-cloudflare-realtime-dry-run
      - run: pnpm run build
      - run: pnpm run check:studio-bundle
      - run: pnpm run build:all

  studio-3d-runtime:
    # Preserve the existing "CI / verify" check context while moving the GPU proof onto
    # a clean GitHub-hosted VM. Browser-process retries cannot recover the observed runner-level
    # Dawn/SwiftShader context loss after the long core job.
    name: verify
    needs: verify
    # Always materialize the release-facing check. A failed/cancelled core job must produce a failing
    # 3D gate instead of a potentially merge-neutral skipped downstream check.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Require successful core CI
        env:
          CORE_RESULT: ${{ needs.verify.result }}
        run: |
          if [[ "$CORE_RESULT" != "success" ]]; then
            echo "::error::Core CI gate ended with result '$CORE_RESULT'."
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          # Dependency, build, and browser code from the PR must not inherit a checkout token.
          persist-credentials: false
      # package.json "packageManager" remains the pnpm version authority.
      - uses: pnpm/action-setup@v6 # NOSONAR S7637 신뢰된 1st-party 액션
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build production Studio assets on the isolated runner
        run: pnpm run build
      - name: Verify Studio 3D runtime and canonical WebGPU/WebGL2 stable-ID parity
        run: pnpm run verify:studio-3d-console
