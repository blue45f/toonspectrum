name: CI

# Preserve main's required contracts and bundle ratchet alongside the complete
# root/serial test gates from the brush material branch. No skipped gate passes.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  static:
    name: Core static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm run lint:strict
      - run: pnpm run typecheck
      - run: pnpm run typecheck:cloudflare-realtime
      - run: pnpm run validate:architecture
      - run: pnpm run verify:toolchain-coverage
      - run: pnpm run verify:csp
      - name: Preserve main brush product, render and BG3D regression gate
        run: |
          set -euo pipefail
          pnpm exec vitest run \
            apps/web/src/domains/creator/brush/studio-brush-quality-portfolio.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-listed-uniqueness.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-catalog-contract.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-browser-evidence.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-composition-runtime.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-composition-runtime-boundary.test.ts \
            apps/web/src/domains/creator/brush/StudioBrushEngineProgramControls.test.tsx \
            apps/web/src/domains/creator/brush-lab/brush-studio-v5-quality.test.ts \
            apps/web/src/domains/creator/brush-lab/brush-studio-version-integration.test.ts \
            apps/web/src/app/routes/groups/creator-brush-lab-route-contract.test.ts \
            apps/web/src/domains/creator/studio-integration-closure.test.ts \
            apps/web/src/domains/creator/bg3d/StudioBg3dViewPanelLazy.test.tsx \
            apps/web/src/domains/creator/bg3d/StudioBg3dViewPanel.test.tsx \
            apps/web/src/domains/creator/bg3d/studio-bg3d-panel-source-boundary.test.ts \
            apps/web/src/domains/creator/bg3d/studio-bg3d-a11y-boundary.test.ts \
            apps/web/src/domains/creator/studio-shell/StudioAssetGovernancePanel.test.tsx
          pnpm exec tsx scripts/audit-studio-brush-quality-portfolio.mts

  unit:
    name: Core unit tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run complete root suite shard
        env:
          CORE_SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          mkdir -p artifacts/core
          git rev-parse HEAD > artifacts/core/commit.txt
          pnpm exec vitest run --shard="$CORE_SHARD/4" --reporter=default --reporter=json --outputFile=artifacts/core/unit.json 2>&1 | tee artifacts/core/unit.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: core-unit-${{ matrix.shard }}
          path: artifacts/core
          retention-days: 7
          if-no-files-found: error

  serial:
    name: Core serial performance regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run serial suite without coverage instrumentation
        run: |
          set -o pipefail
          mkdir -p artifacts/core
          pnpm run test:perf 2>&1 | tee artifacts/core/serial.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: core-serial
          path: artifacts/core
          retention-days: 7
          if-no-files-found: error

  build:
    name: Core production build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build the API and production web bundle without relaxing the ratchet
        run: |
          set -o pipefail
          mkdir -p artifacts/core
          (pnpm --filter @webtoon-nest/api build && pnpm run build && pnpm run check:studio-bundle && test -s dist/.vite/manifest.json) 2>&1 | tee artifacts/core/build.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: core-build
          path: artifacts/core
          retention-days: 7
          if-no-files-found: error

  core:
    name: core
    if: ${{ always() }}
    needs: [static, unit, serial, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every real gate to succeed
        env:
          CORE_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          const results = JSON.parse(process.env.CORE_RESULTS);
          const required = ['static', 'unit', 'serial', 'build'];
          for (const name of required) {
            console.log(`${name}: ${results[name]?.result ?? 'missing'}`);
          }
          if (required.some(name => results[name]?.result !== 'success')) {
            console.error('core requires real success; failure, cancellation, missing and skipped jobs do not pass.');
            process.exit(1);
          }
          JS

  verify:
    name: verify
    needs: core
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require deployable core
        env:
          CORE_RESULT: ${{ needs.core.result }}
        run: |
          set -euo pipefail
          test "$CORE_RESULT" = success
          echo "Required core validation passed."
