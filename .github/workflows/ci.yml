name: CI

# Fast merge gate.
#
# The previous workflow expanded a single PR into many heavyweight Vitest, browser,
# PostgreSQL, GPU/3D and serverless-packaging jobs. In this repository that fan-out
# exhausted the available Actions queue and left the actual required check pending
# without a runner. Those suites remain useful diagnostics, but they must not block
# normal delivery until they are independently stable and budgeted.
#
# The required `core` check now protects deterministic release fundamentals only:
# repository policy, TypeScript contracts and the production browser bundle.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Repository policy checks
        run: |
          pnpm run validate:architecture
          pnpm run verify:csp
          pnpm run verify:toolchain-coverage
      - name: TypeScript contracts
        run: |
          pnpm run typecheck
          pnpm run typecheck:cloudflare-realtime
      - name: Production bundle
        run: |
          pnpm run build:bundle
          pnpm run check:studio-bundle
