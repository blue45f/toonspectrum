name: CI

# Keep one protected aggregate while running independent quality gates in parallel.
# Broad repository QA remains diagnostic; a green core is not a full-suite claim.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: core-v3-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Only superseded PR heads are disposable; running main and merge-group checks must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "1"
  NODE_OPTIONS: --max-old-space-size=12288

jobs:
  lint:
    name: Core strict lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/apps/web/public/assets/
            /apps/web/public/assets/virtual-studio/world/
            /apps/web/public/assets/reference-rebuild/
            /apps/web/public/assets/3d/environments/refined-v6/manifest.json
            /apps/web/public/assets/3d/environments/expansion-v1/manifest.json
            /apps/web/public/assets/3d/environments/webtoon-v7/manifest.json
            /apps/web/public/assets/3d/environments/mcp-free-v1/manifest.json
            !/apps/web/public/vrm/
            !/artifacts/
            !/docs/
            !/tests/benchmarks/results/
      - name: Collect changed pull-request files
        if: github.event_name == 'pull_request'
        id: changed
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          changed_file_path="$RUNNER_TEMP/core-lint-changed-files.txt"
          : > "$changed_file_path"
          page=1
          while :; do
            response="$(curl --fail-with-body --silent --show-error --retry 3 \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100&page=$page")"
            count="$(jq 'length' <<< "$response")"
            jq -r '.[].filename' <<< "$response" >> "$changed_file_path"
            (( count < 100 )) && break
            ((page += 1))
          done
          echo "file=$changed_file_path" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Conventional commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Restore ESLint result cache
        id: eslint-cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules/.cache/eslint
          key: core-eslint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            core-eslint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-
      - name: Strict lint changed pull-request files
        if: github.event_name == 'pull_request'
        env:
          LINT_CACHE_LOCATION: node_modules/.cache/eslint/quick/
        run: node scripts/lint-changed.mjs --files-from="${{ steps.changed.outputs.file }}" --full-on-config
      - name: Strict lint full repository
        if: github.event_name != 'pull_request'
        run: pnpm run lint:strict
      - name: Import and dependency hygiene
        run: pnpm run quality:imports
      - name: Secret scan
        run: pnpm run quality:secrets
      - name: Save ESLint result cache on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.eslint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules/.cache/eslint
          key: core-eslint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-${{ github.sha }}

  typecheck:
    name: Core preflight and application typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/apps/web/public/assets/
            /apps/web/public/assets/virtual-studio/world/
            /apps/web/public/assets/3d/environments/refined-v6/manifest.json
            /apps/web/public/assets/3d/environments/expansion-v1/manifest.json
            /apps/web/public/assets/3d/environments/webtoon-v7/manifest.json
            /apps/web/public/assets/3d/environments/mcp-free-v1/manifest.json
            !/apps/web/public/vrm/
            !/artifacts/
            !/docs/
            /docs/AGENTS.md
            /docs/operations/agent-harness.md
            !/tests/benchmarks/results/
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Verify mandatory CI wiring before installing dependencies
        run: node --test scripts/ci-core-gate.test.mjs scripts/agent-harness.test.mjs scripts/ci-core-regression-shards.test.mjs scripts/ci-executed-gates.test.mjs scripts/lint-changed-policy.test.mjs scripts/run-core-vitest.test.mjs scripts/studio-bundle-temporary-allowance.test.mjs scripts/ci-merge-reliability.test.mjs scripts/ci-throughput-policy.test.mjs
      - name: Verify deduplicated PR workflow policy
        run: python3 scripts/verify-pr-workflow-fanout.py
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Restore TypeScript incremental state
        id: typescript-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            **/*.tsbuildinfo
          key: core-ts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig*.json', 'apps/**/tsconfig*.json', 'deploy/**/tsconfig*.json', 'packages/**/tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            core-ts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig*.json', 'apps/**/tsconfig*.json', 'deploy/**/tsconfig*.json', 'packages/**/tsconfig*.json') }}-
      - name: Typecheck application, API and realtime worker
        run: |
          set -euo pipefail
          pnpm run typecheck
          pnpm run typecheck:cloudflare-realtime
      - name: Save TypeScript incremental state on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.typescript-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            **/*.tsbuildinfo
          key: core-ts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig*.json', 'apps/**/tsconfig*.json', 'deploy/**/tsconfig*.json', 'packages/**/tsconfig*.json') }}-${{ github.sha }}

  static:
    name: Core regression shard / ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard:
          - product
          - studio-foundation
          - studio-editing
          - studio-3d
          - studio-character
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/apps/web/public/assets/
            /apps/web/public/assets/virtual-studio/world/
            /apps/web/public/assets/reference-rebuild/
            /apps/web/public/assets/3d/environments/refined-v6/manifest.json
            /apps/web/public/assets/3d/environments/expansion-v1/manifest.json
            /apps/web/public/assets/3d/environments/webtoon-v7/manifest.json
            /apps/web/public/assets/3d/environments/mcp-free-v1/manifest.json
            !/apps/web/public/vrm/
            /apps/web/public/vrm/AvatarSample_B.vrm
            /apps/web/public/vrm/sample.vrm
            !/artifacts/
            !/docs/
            /docs/studio-selection-benchmark.md
            /docs/FREE_INFRASTRUCTURE.md
            /docs/architecture/frontend-layered-architecture.md
            /docs/competitor-analysis.md
            /docs/ranking-architecture.md
            /docs/studio/virtual-studio-design-closure-ledger-20260920.md
            /docs/studio/virtual-studio-all-pages-closure-20260924.md
            !/tests/benchmarks/results/
      - name: Restore Virtual Studio art for foundation regressions
        if: matrix.shard == 'studio-foundation'
        run: git sparse-checkout add /apps/web/public/assets/virtual-studio/production-v2/ /apps/web/public/assets/virtual-studio/living-world/ /apps/web/public/assets/virtual-studio/drawn-characters-v1/ /apps/web/public/assets/virtual-studio/ambient-audio/ /apps/web/public/assets/virtual-studio/npc-cast-v1/ /apps/web/public/assets/virtual-studio/npc-cast-v2/ /apps/web/public/assets/virtual-studio/npc-cast-v3/ /apps/web/public/assets/virtual-studio/npc-cast-v4/ /apps/web/public/assets/virtual-studio/art-v4/ /apps/web/public/assets/virtual-studio/art-v4-manifest.json /apps/web/public/assets/virtual-studio/style-packs/ /apps/web/public/assets/virtual-studio/style-packs-v5/ /apps/web/public/assets/virtual-studio/living-town-v6/ /apps/web/public/assets/virtual-studio/imagegen25-v7/ /apps/web/public/assets/virtual-studio/world-v2/
      - name: Restore generated BG3D pack for studio-3d regressions
        if: matrix.shard == 'studio-3d'
        run: git sparse-checkout add /apps/web/public/assets/3d/environments/mcp-free-v1/
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run semantic regression shard
        run: node scripts/ci-core-regression-shards.mjs "${{ matrix.shard }}"

  serial:
    name: Core serial performance regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run serial performance checks
        run: |
          set -euo pipefail
          mkdir -p artifacts/core
          git rev-parse HEAD > artifacts/core/commit.txt
          pnpm run test:perf 2>&1 | tee artifacts/core/serial.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: core-serial-attempt-${{ github.run_attempt }}
          path: artifacts/core
          retention-days: 7
          if-no-files-found: error

  a11y:
    name: Core accessibility smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run serious and critical accessibility smoke
        run: pnpm run test:a11y

  build:
    name: Core production build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # The integrated production workspace crosses the 8 GiB V8 heap ceiling
      # during Vite chunk generation. Keep the larger heap scoped to this job.
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build API and web without repeating the required web typecheck
        run: |
          set -euo pipefail
          mkdir -p artifacts/core
          git rev-parse HEAD > artifacts/core/commit.txt
          (pnpm --filter @webtoon-nest/api build && test -s apps/api/dist/apps/api/src/main.js && node --check apps/api/dist/apps/api/src/main.js && pnpm run build:bundle && pnpm run check:studio-bundle && test -s dist/.vite/manifest.json) 2>&1 | tee artifacts/core/build.log
      - name: Verify Virtual Studio art integrity
        run: |
          set -euo pipefail
          pnpm run test:studio-virtual-art
          pnpm run verify:studio-virtual-art
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: core-build-attempt-${{ github.run_attempt }}
          path: artifacts/core
          retention-days: 7
          if-no-files-found: error

  database:
    name: Core review database invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studio_review_test
          POSTGRES_DB: studio_review_integration
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio_review_test -d studio_review_integration"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://studio_review_test@127.0.0.1:5432/studio_review_integration
      STUDIO_LIVE_POSTGRES_INTEGRATION_URL: postgresql://studio_review_test@127.0.0.1:5432/studio_review_integration
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Prepare an empty disposable database with real graph constraints
        run: node scripts/prepare-studio-review-test-db.mjs
      - name: Verify review production, immutable history and concurrent decisions
        run: pnpm exec vitest run --no-file-parallelism apps/api/src/modules/studio-project-graph/studio-review-preview-producer.integration.test.ts apps/api/src/modules/studio-project-graph/studio-review-voice-note.integration.test.ts apps/api/src/modules/studio-project-graph/studio-project-graph-review-race.integration.test.ts apps/api/src/modules/studio-project-graph/studio-world-publication.integration.test.ts apps/api/src/modules/studio-project-graph/studio-work-session.integration.test.ts

  core:
    name: core
    if: ${{ always() && !cancelled() }}
    needs: [lint, typecheck, static, serial, a11y, build, database]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require actual success from every mandatory check
        env:
          CORE_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const required = ["lint", "typecheck", "static", "serial", "a11y", "build", "database"];
          const results = JSON.parse(process.env.CORE_RESULTS ?? "null");
          if (!results || typeof results !== "object" || Array.isArray(results)) {
            throw new Error("core requires the GitHub needs object");
          }
          const unexpected = Object.keys(results).filter((name) => !required.includes(name));
          if (unexpected.length > 0) {
            throw new Error(`core has unrecognized dependencies: ${unexpected.join(", ")}`);
          }
          const failed = required.filter((name) => results[name]?.result !== "success");
          if (failed.length > 0) {
            throw new Error(`core requires actual success from: ${failed.join(", ")}`);
          }
          console.log(`core: all required checks succeeded (${required.join(", ")})`);
          NODE

  verify:
    name: verify
    needs: core
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Require deployable core
        env:
          CORE_RESULT: ${{ needs.core.result }}
        run: |
          set -euo pipefail
          test "$CORE_RESULT" = success
          echo "Required core validation passed."
