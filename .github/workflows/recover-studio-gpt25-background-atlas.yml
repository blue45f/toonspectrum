name: Diagnose studio GPT Image 2.5 background atlas transfer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-studio-gpt25-background-atlas-v4
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out atlas transfer payload
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Export payload diagnostics
        shell: bash
        env:
          PAYLOAD_DIR: artifacts/studio-gpt25-background-atlas
        run: |
          set -euo pipefail

          output="${RUNNER_TEMP}/atlas-transfer"
          mkdir -p "${output}/parts"
          cp "${PAYLOAD_DIR}/overlay.tar.gz" "${output}/atlas-overlay.tar.gz"
          cp "${PAYLOAD_DIR}/parts/"part* "${output}/parts/"

          OUTPUT_DIR="${output}" python3 <<'PY' | tee "${output}/diagnostics.txt"
          from __future__ import annotations

          import gzip
          import hashlib
          import os
          import pathlib
          import zlib

          root = pathlib.Path(os.environ["OUTPUT_DIR"])
          overlay = (root / "atlas-overlay.tar.gz").read_bytes()
          part_paths = sorted((root / "parts").glob("part*"))
          parts = [(path.name, path.read_bytes()) for path in part_paths]

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def longest_suffix_prefix(left: bytes, right: bytes) -> int:
              limit = min(len(left), len(right))
              needle = right[:limit]
              haystack = left[-limit:]
              sentinel = 256
              values = list(needle) + [sentinel] + list(haystack)
              prefix = [0] * len(values)
              for index in range(1, len(values)):
                  candidate = prefix[index - 1]
                  while candidate and values[index] != values[candidate]:
                      candidate = prefix[candidate - 1]
                  if values[index] == values[candidate]:
                      candidate += 1
                  prefix[index] = candidate
              return min(prefix[-1], limit)

          def gzip_error_offset(data: bytes) -> tuple[int | None, int, str | None]:
              stream = zlib.decompressobj(16 + zlib.MAX_WBITS)
              produced = 0
              for offset, byte in enumerate(data, start=1):
                  try:
                      produced += len(stream.decompress(bytes((byte,))))
                  except zlib.error as error:
                      return offset, produced, str(error)
              try:
                  produced += len(stream.flush())
              except zlib.error as error:
                  return len(data), produced, str(error)
              return None, produced, None

          print(
              f"overlay size={len(overlay)} sha256={sha256(overlay)} "
              f"head={overlay[:16].hex()} tail={overlay[-16:].hex()}"
          )
          for name, data in parts:
              headers = []
              start = 0
              while True:
                  found = data.find(b"\x1f\x8b\x08", start)
                  if found < 0:
                      break
                  headers.append(found)
                  start = found + 1
              print(
                  f"{name} size={len(data)} sha256={sha256(data)} "
                  f"head={data[:16].hex()} tail={data[-16:].hex()} gzip_headers={headers}"
              )

          print(f"overlay_is_part00_prefix={parts[0][1].startswith(overlay)}")
          print("pairwise_suffix_prefix_overlaps>=8:")
          for left_name, left in parts:
              for right_name, right in parts:
                  if left_name == right_name:
                      continue
                  overlap = longest_suffix_prefix(left, right)
                  if overlap >= 8:
                      print(f"  {left_name} -> {right_name}: {overlap}")

          candidates = {
              "filename-order": b"".join(data for _, data in parts),
              "overlay-plus-part-order": overlay + b"".join(data for _, data in parts),
          }
          for name, data in candidates.items():
              error_offset, produced, error = gzip_error_offset(data)
              print(
                  f"candidate={name} size={len(data)} sha256={sha256(data)} "
                  f"error_offset={error_offset} produced={produced} error={error}"
              )
              try:
                  unpacked = gzip.decompress(data)
              except Exception as exception:
                  print(f"  gzip_decompress={type(exception).__name__}: {exception}")
              else:
                  print(
                      f"  gzip_decompress=ok unpacked_size={len(unpacked)} "
                      f"tar_head={unpacked[:16].hex()}"
                  )
          PY

          cp "${output}/diagnostics.txt" "${GITHUB_WORKSPACE}/atlas-transfer-diagnostics.txt"

      - name: Upload raw transfer payload
        uses: actions/upload-artifact@v4
        with:
          name: studio-gpt25-background-atlas-transfer
          path: ${{ runner.temp }}/atlas-transfer
          if-no-files-found: error
          retention-days: 7

      - name: Upload readable diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: studio-gpt25-background-atlas-diagnostics
          path: atlas-transfer-diagnostics.txt
          if-no-files-found: error
          retention-days: 7
