name: Studio reviewed assets integration
on:
  push:
    branches: [feat/studio-reviewed-assets-final-20260906]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: studio-reviewed-assets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reviewed-assets:
    if: github.repository == 'blue45f/toonspectrum' && github.ref == 'refs/heads/feat/studio-reviewed-assets-final-20260906'
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      HUSKY: "0"
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.16.0
      - name: Preserve current main and prepare reproducible sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git -c core.hooksPath=/dev/null merge --no-edit origin/main
          gh api repos/blue45f/toonspectrum/git/blobs/ab4709d8cf50c1459b746e4ef516f2b50f5bf8eb --jq .content | python3 -c 'import sys,base64;sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))' > scripts/acquire_studio_pbr_assets.py
          test "$(git hash-object scripts/acquire_studio_pbr_assets.py)" = ab4709d8cf50c1459b746e4ef516f2b50f5bf8eb
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply_studio_visual_curation.py')
          s=p.read_text()
          before="save(directory/'visual-decisions.json',{'items':decisions,'newOriginals':additions})"
          after="save(directory/'visual-decisions.json',{'items':decisions,'newOriginals':[a for a in retained if a['id'].startswith('polyhaven-')]})"
          assert s.count(before)==1
          s=s.replace(before,after)
          before="'activeCatalogCuration':'curation-summary.json','productionPublished':0})"
          after="'activeCatalogCuration':'curation-summary.json','repositoryBundledOriginals':len(retained),'verifiedDeliveryFiles':len(retained),'productionPublished':0})"
          assert s.count(before)==1
          p.write_text(s.replace(before,after))
          p=Path('scripts/verify-studio-cc0-curated-ui.mjs')
          s=p.read_text().replace("const prefix = '/assets/studio/cc0-20260906/';\n",'')
          p.write_text(s)
          PY
          python3 -m venv "$RUNNER_TEMP/asset-venv"
          "$RUNNER_TEMP/asset-venv/bin/pip" install --disable-pip-version-check Pillow==11.3.0 defusedxml==0.7.1
          npm install --global pnpm@11.4.0 --ignore-scripts --no-audit --no-fund
          pnpm install --frozen-lockfile --ignore-scripts
          mkdir -p "$RUNNER_TEMP/studio-curation-results"
      - name: Restore exactly the 47 visually reviewed originals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/blue45f/toonspectrum/actions/artifacts/9975051972/zip > "$RUNNER_TEMP/pbr-reviewed.zip"
          python3 - <<'PY'
          import hashlib,os,pathlib,stat,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          archive=root/'pbr-reviewed.zip'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='5594bf15ecfdabd5266bb75206b59d14c7ac5523bea4208d1c4404c2d32c4e15','Artifact digest mismatch'
          out=root/'studio-pbr-candidates';out.mkdir()
          with zipfile.ZipFile(archive) as z:
              infos=z.infolist()
              assert len(infos)<1000 and sum(i.file_size for i in infos)<900*1024*1024
              for i in infos:
                  target=(out/i.filename).resolve()
                  assert target.is_relative_to(out.resolve()) and not stat.S_ISLNK(i.external_attr>>16)
                  assert pathlib.Path(i.filename).suffix.lower() not in ['.woff','.woff2','.ttf','.otf']
              z.extractall(out)
          print('RESTORED 47 reviewed PBR originals from sealed artifact 9975051972')
          PY
      - name: Apply reviewed decisions and exact duplicate retirement
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/asset-venv/bin/python" -m unittest discover -s scripts -p test_studio_visual_curation.py -v
          "$RUNNER_TEMP/asset-venv/bin/python" scripts/apply_studio_visual_curation.py --candidates "$RUNNER_TEMP/studio-pbr-candidates" --output "$RUNNER_TEMP/studio-curation-results"
      - name: Verify catalog and every preserved legacy contract
        run: |
          set -euo pipefail
          pnpm exec vitest run src/domains/creator/studio-cc0-curation.test.ts src/domains/creator/studio-cc0-asset-delivery.test.ts src/domains/creator/studio-original-free-asset-packs.test.ts src/domains/creator/StudioOriginalAssetMarketplacePanel.test.tsx src/domains/creator/studio-shared-asset-drag.test.ts src/domains/creator/vrm/studio-vrm-outfit-static-asset-audit.test.ts 2>&1 | tee "$RUNNER_TEMP/studio-curation-results/unit-tests.log"
          pnpm exec tsx -e 'import fs from "node:fs";import {parseStudioCc0Catalog} from "./src/domains/creator/studio-cc0-asset-delivery.ts";import {curateStudioCc0Selection} from "./src/domains/creator/studio-cc0-curation.ts";const m=JSON.parse(fs.readFileSync("public/assets/studio/cc0-20260906/manifest.json","utf8"));const a=parseStudioCc0Catalog(m);console.log("VERIFIED_CATALOG",JSON.stringify({all:a.length,defaultSelection:curateStudioCc0Selection(a).length,detailed:curateStudioCc0Selection(a,{style:"detailed",includeComponents:true}).length}));'
      - name: Normalize and check changed frontend code without warnings
        run: |
          set -euo pipefail
          pnpm exec eslint --fix --max-warnings=0 src/domains/creator/studio-cc0-curation.ts src/domains/creator/studio-cc0-curation.test.ts src/domains/creator/StudioCc0AssetLibraryPanel.tsx scripts/verify-studio-cc0-curated-ui.mjs 2>&1 | tee "$RUNNER_TEMP/studio-curation-results/lint.log"
      - name: Exercise the actual component and bundled bytes in Chromium
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium
          node scripts/verify-studio-cc0-curated-ui.mjs "$RUNNER_TEMP/studio-curation-results" 2>&1 | tee "$RUNNER_TEMP/studio-curation-results/browser.log"
      - name: Typecheck and build the full frontend
        run: |
          set -euo pipefail
          pnpm exec tsc -p tsconfig.json --pretty false 2>&1 | tee "$RUNNER_TEMP/studio-curation-results/typecheck.log"
          pnpm run build:bundle 2>&1 | tee "$RUNNER_TEMP/studio-curation-results/build.log"
          pnpm run check:studio-bundle 2>&1 | tee "$RUNNER_TEMP/studio-curation-results/bundle-budget.log"
      - name: Record verified outcomes and retain feature branch only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,pathlib,subprocess,shutil
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'studio-curation-results'
          report={'actualComponentBrowserTest':'passed','catalogAdmission':'passed','pythonRotationTests':'passed','focusedUnitTests':'passed','frontendLint':'passed-zero-warnings','frontendTypes':'passed','frontendBundleBuild':'passed','studioBundleBudgets':'passed','allAngleArtReview':False,'allAssetsEditorSaveRestore':False,'productionDeployment':False,'checkedParent':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()}
          (out/'verification.json').write_text(json.dumps(report,indent=2)+'\n')
          docs=pathlib.Path('docs/reports/asset-visual-review-20260906')
          for name in ['verification.json','ui-verification.json','curated-materials-desktop.png','curated-materials-mobile.png']:
              shutil.copyfile(out/name,docs/name)
          print('VERIFIED REVIEW INTEGRATION',json.dumps(report))
          PY
          test "$GITHUB_REF" = refs/heads/feat/studio-reviewed-assets-final-20260906
          git fetch origin "$GITHUB_REF_NAME"
          git merge-base --is-ancestor FETCH_HEAD HEAD
          git add -- public/assets/studio/cc0-20260906 docs/reports/asset-visual-review-20260906 scripts/acquire_studio_pbr_assets.py scripts/apply_studio_visual_curation.py scripts/test_studio_visual_curation.py scripts/verify-studio-cc0-curated-ui.mjs src/domains/creator/studio-cc0-curation.ts src/domains/creator/studio-cc0-curation.test.ts src/domains/creator/StudioCc0AssetLibraryPanel.tsx
          git -c core.hooksPath=/dev/null commit --quiet -m "feat(studio): integrate 47 reviewed PBR originals and conservative visual curation"
          git push origin "HEAD:$GITHUB_REF"
          git log -1 --format='REVIEWED_ASSET_COMMIT %H'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: studio-curated-integration-${{ github.run_id }}
          path: ${{ runner.temp }}/studio-curation-results/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          path: ${{ runner.temp }}/studio-curation-results/curated-ui-desktop.pdf
          archive: false
          retention-days: 14
          if-no-files-found: ignore
