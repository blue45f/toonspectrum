name: Retire superseded PR 1280 BG3D regression

on:
  push:
    branches:
      - integration/final-main-consolidation-20260910
    paths:
      - .github/workflows/bg3d-runtime-regression.yml

permissions:
  contents: read

concurrency:
  group: bg3d-runtime-1280
  cancel-in-progress: true

jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'superseded PR #1280 BG3D run retired'
