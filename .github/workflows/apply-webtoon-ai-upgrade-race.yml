name: Apply verified webtoon AI upgrade

on:
  push:
    branches:
      - feat/webtoon-ai-quality-ux-v2-20260905

permissions:
  contents: write

concurrency:
  group: apply-webtoon-ai-upgrade-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 20
          ref: ${{ github.sha }}

      - name: Reassemble, verify and apply the reviewed patch
        shell: bash
        env:
          PATCH_OUT: ${{ runner.temp }}/toonstudio-webtoon-ai-upgrade.patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import lzma
          import os
          from pathlib import Path

          expected_parts = {
              'part-00.b64': 'a0551029b85a22abf160ecea81d40a864dbe2c3fffd2f1f2c4b5ac5283e8b7ed',
              'part-01.b64': '26911a8974693cb7ea7283b37633e9c24a0d022a7c3370fe7a1638f6e78c3ee4',
              'part-02.b64': 'ce7c6dcecae3b677a009e3750e8f7e172f8d0b030222728ee25c8553227a4310',
              'part-03.b64': '5cdc7364d386bef59754330797a0ff1c4290ddac1615f64e9d683e69679c1b95',
          }
          chunks = []
          root = Path('.github/patches')
          for name, expected in expected_parts.items():
              content = (root / name).read_bytes()
              actual = hashlib.sha256(content).hexdigest()
              if actual != expected:
                  raise SystemExit(f'{name} checksum mismatch: {actual}')
              chunks.append(content.decode('ascii'))

          encoded = ''.join(chunks)
          if len(encoded) != 24440:
              raise SystemExit(f'base64 length mismatch: {len(encoded)}')
          encoded_hash = hashlib.sha256(encoded.encode('ascii')).hexdigest()
          if encoded_hash != '495f98ed63de6f35d962f948fe887d7030ddf10a28c228038d88fa0bd8ad84de':
              raise SystemExit(f'base64 checksum mismatch: {encoded_hash}')

          compressed = base64.b64decode(encoded, validate=True)
          patch = lzma.decompress(compressed)
          patch_hash = hashlib.sha256(patch).hexdigest()
          if patch_hash != '8cc17b1d66ce770c75c0996b263475e77a436828c84941ed4a63f51810646def':
              raise SystemExit(f'patch checksum mismatch: {patch_hash}')
          Path(os.environ['PATCH_OUT']).write_bytes(patch)
          PY
          git apply --check --3way --whitespace=error-all "$PATCH_OUT"
          git apply --3way --whitespace=error-all "$PATCH_OUT"
          git diff --check

      - name: Commit the product tree without bootstrap artifacts
        shell: bash
        env:
          BRANCH: feat/webtoon-ai-quality-ux-v2-20260905
        run: |
          set -euo pipefail
          rm -f .github/patches/part-*.b64
          rm -f .github/workflows/apply-webtoon-ai-upgrade-race.yml
          rmdir .github/patches 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(studio): upgrade webtoon AI production UX and quality gates"
          git push \
            --force-with-lease="refs/heads/${BRANCH}:${GITHUB_SHA}" \
            origin "HEAD:refs/heads/${BRANCH}"
