name: CI final React compiler fix once

on:
  push:
    branches:
      - fix/real-core-and-main-only-20260910
    paths:
      - .github/workflows/ci-final-react-compiler-fix.yml

permissions:
  contents: write

concurrency:
  group: ci-final-react-compiler-fix-20260910
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/real-core-and-main-only-20260910
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Replace suppressed effect dependency with stable seed ref
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/domains/creator/studio-router/routes/StudioAiComicDirectorRoute.tsx')
          text = path.read_text(encoding='utf-8')

          old_import = 'import { useEffect, useMemo, useState, type ReactElement } from "react";'
          new_import = 'import { useEffect, useMemo, useRef, useState, type ReactElement } from "react";'
          if old_import in text:
              text = text.replace(old_import, new_import, 1)

          state_line = '  const [session, setSession] = useState(() => initialSession(resolution));\n'
          ref_line = state_line + '  const initialSessionRef = useRef(session);\n'
          if 'const initialSessionRef = useRef(session);' not in text:
              if state_line not in text:
                  raise SystemExit('session state initializer not found')
              text = text.replace(state_line, ref_line, 1)

          effect_start = text.index('  useEffect(() => {\n    let active = true;\n    const synchronize = async () => {')
          effect_end = text.index('\n\n  const patchSession = (', effect_start)
          effect = text[effect_start:effect_end]
          effect = effect.replace(
              '  useEffect(() => {\n    let active = true;\n    const synchronize = async () => {',
              '  useEffect(() => {\n    let active = true;\n    const seedSession = initialSessionRef.current;\n    const synchronize = async () => {',
              1,
          )
          effect = effect.replace('api.createSession(session)', 'api.createSession(seedSession)')
          effect = effect.replace('routePath(resolution, session.id)', 'routePath(resolution, seedSession.id)')
          old_tail = '''  // Route identity owns remote hydration; `session` is deliberately read as the local create snapshot.
  // eslint-disable-next-line react-hooks/exhaustive-deps -- depending on session would resync after setSession and loop.
  }, [api, navigate, resolution, session.id]);'''
          new_tail = '  }, [api, navigate, resolution]);'
          if old_tail not in effect:
              raise SystemExit('suppressed effect dependency tail not found')
          effect = effect.replace(old_tail, new_tail, 1)
          text = text[:effect_start] + effect + text[effect_end:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify targeted lint and behavior
        run: |
          pnpm exec eslint --max-warnings=0 apps/web/src/domains/creator/studio-router/routes/StudioAiComicDirectorRoute.tsx
          pnpm exec vitest run apps/web/src/domains/creator/studio-router/studio-ai-comic-director-route.test.ts
      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/ci-final-react-compiler-fix.yml
          git diff --check
          git config user.name toonstudio-quality-ci
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m 'fix(ci): satisfy React compiler without hook suppression'
          git push --no-verify origin HEAD:fix/real-core-and-main-only-20260910
