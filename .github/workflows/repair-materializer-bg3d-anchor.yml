name: Repair BG3D materializer anchor

on:
  push:
    branches: [fix/real-core-and-main-only-20260910]
    paths: [.github/workflows/repair-materializer-bg3d-anchor.yml]

permissions:
  contents: write

concurrency:
  group: repair-materializer-bg3d-anchor-20260911
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/real-core-and-main-only-20260910
          fetch-depth: 0
          persist-credentials: true

      - name: Adapt current BG3D host to the materializer's idempotent marker
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/web/src/domains/creator/bg3d/studio-bg3d-editor-insert-host.ts")
          source = path.read_text(encoding="utf-8")

          import_line = 'import { resolveStudioBg3dInsertQualityPlan } from "./studio-bg3d-insert-quality-policy";\n'
          if import_line not in source:
              anchor = 'import * as R from "./studio-bg3d-editor-runtime-bindings";\n'
              if source.count(anchor) != 1:
                  raise SystemExit("BG3D insert host import anchor changed")
              source = source.replace(anchor, anchor + import_line, 1)

          current = (
              "      const requestedCaptureHeight = Math.min("
              "\n        4096,"
              "\n        Math.max(2160, Math.round(adapted.document.output.exportHeight)),"
              "\n      );"
              "\n      const captureSize = resolveStudioBg3dLtCaptureSize({"
              "\n        sourceWidth: sourceSize.width,"
              "\n        sourceHeight: sourceSize.height,"
              "\n        aspectRatio: captureFrame.aspectRatio,"
              "\n        requestedHeight: requestedCaptureHeight,"
              "\n        maxPixels: Math.min(deviceQuality.maxRenderPixels, STUDIO_BG3D_LT_RENDER_MAX_PIXELS),"
              "\n      });"
          )
          materializer_marker = (
              "      const qualityPlan = resolveStudioBg3dInsertQualityPlan({"
              "\n  exportHeight: adapted.document.output.exportHeight,"
              "\n  aspectRatio: captureFrame.aspectRatio,"
              "\n  deviceMaxPixels: deviceQuality.maxRenderPixels,"
              "\n  rendererMaxPixels: STUDIO_BG3D_LT_RENDER_MAX_PIXELS,"
              "\n});"
              "\nconst captureSize = resolveStudioBg3dLtCaptureSize({"
              "\n  sourceWidth: sourceSize.width,"
              "\n  sourceHeight: sourceSize.height,"
              "\n  aspectRatio: captureFrame.aspectRatio,"
              "\n  requestedHeight: qualityPlan.requestedHeight,"
              "\n  maxPixels: qualityPlan.maxPixels,"
              "\n});"
          )

          if materializer_marker not in source:
              if source.count(current) != 1:
                  raise SystemExit(f"current BG3D insertion block count: {source.count(current)}")
              source = source.replace(current, materializer_marker, 1)

          path.write_text(source, encoding="utf-8")

      - name: Publish repair and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          rm -f .github/workflows/repair-materializer-bg3d-anchor.yml
          git add -A
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m "fix(ci): adapt BG3D recovery to current insert host"
          git push --no-verify origin HEAD:fix/real-core-and-main-only-20260910
