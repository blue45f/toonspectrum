name: Apply studio layer workbench production v3

on:
  push:
    branches:
      - feat/studio-layer-workbench-production-v3

permissions:
  contents: write

concurrency:
  group: studio-layer-workbench-production-v3
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[layer-workbench-v3-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/studio-layer-workbench-production-v3
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply layer workbench implementation
        run: |
          python3 scripts/apply-studio-layer-drag-workbench.py
          python3 scripts/fix-studio-layer-drag-workbench.py
          python3 scripts/fix-studio-layer-drag-jsdom.py
          python3 scripts/refine-studio-layer-drag-workbench.py
          python3 scripts/fix-studio-layer-drag-client-y.py
          python3 scripts/fix-studio-layer-drag-types.py

      - name: Lint and format changed sources
        run: |
          pnpm exec eslint --fix \
            apps/web/src/domains/creator/studio-layers.ts \
            apps/web/src/domains/creator/studio-layers.test.ts \
            apps/web/src/domains/creator/layer/studio-layer-drag.ts \
            apps/web/src/domains/creator/layer/studio-layer-drag.test.ts \
            apps/web/src/domains/creator/layer/StudioLayerNavigator.tsx \
            apps/web/src/domains/creator/layer/StudioLayerNavigator.test.tsx \
            apps/web/src/domains/creator/layer/StudioLayerNavigator.interaction.test.tsx \
            apps/web/src/domains/creator/layer/StudioLayerNavigatorItemRow.tsx \
            apps/web/src/domains/creator/layer/StudioLayerNavigatorItemRow.test.tsx \
            apps/web/src/domains/creator/layer/StudioLayerNavigatorTree.tsx \
            apps/web/src/domains/creator/layer/StudioLayerNavigatorBatchBar.tsx \
            apps/web/src/domains/creator/layer/studio-layer-operations.ts \
            apps/web/src/domains/creator/layer/StudioLayerNavigator.drag.test.tsx
          pnpm exec eslint --max-warnings=0 \
            apps/web/src/domains/creator/studio-layers.ts \
            apps/web/src/domains/creator/studio-layers.test.ts \
            apps/web/src/domains/creator/layer/studio-layer-drag.ts \
            apps/web/src/domains/creator/layer/studio-layer-drag.test.ts \
            apps/web/src/domains/creator/layer/StudioLayerNavigator.tsx \
            apps/web/src/domains/creator/layer/StudioLayerNavigator.test.tsx \
            apps/web/src/domains/creator/layer/StudioLayerNavigator.interaction.test.tsx \
            apps/web/src/domains/creator/layer/StudioLayerNavigatorItemRow.tsx \
            apps/web/src/domains/creator/layer/StudioLayerNavigatorItemRow.test.tsx \
            apps/web/src/domains/creator/layer/StudioLayerNavigatorTree.tsx \
            apps/web/src/domains/creator/layer/StudioLayerNavigatorBatchBar.tsx \
            apps/web/src/domains/creator/layer/studio-layer-operations.ts \
            apps/web/src/domains/creator/layer/StudioLayerNavigator.drag.test.tsx

      - name: Run focused layer regression suite
        run: |
          pnpm exec vitest run \
            apps/web/src/domains/creator/studio-layers.test.ts \
            apps/web/src/domains/creator/layer/studio-layer-drag.test.ts \
            apps/web/src/domains/creator/layer/StudioLayerNavigator.test.tsx \
            apps/web/src/domains/creator/layer/StudioLayerNavigator.interaction.test.tsx \
            apps/web/src/domains/creator/layer/StudioLayerNavigatorItemRow.test.tsx \
            apps/web/src/domains/creator/layer/StudioLayerNavigator.drag.test.tsx

      - name: Typecheck web workspace
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Build production web bundle
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm run build:bundle

      - name: Verify patch hygiene
        run: git diff --check

      - name: Commit verified product sources
        run: |
          rm -f \
            scripts/apply-studio-layer-drag-workbench.py \
            scripts/fix-studio-layer-drag-workbench.py \
            scripts/fix-studio-layer-drag-jsdom.py \
            scripts/refine-studio-layer-drag-workbench.py \
            scripts/fix-studio-layer-drag-client-y.py \
            scripts/fix-studio-layer-drag-types.py \
            .github/workflows/apply-studio-layer-drag-workbench.yml \
            .github/workflows/apply-studio-layer-workbench-production-v3.yml
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "feat(studio): ship professional layer drag workbench [layer-workbench-v3-applied]"
          git push origin HEAD:feat/studio-layer-workbench-production-v3
