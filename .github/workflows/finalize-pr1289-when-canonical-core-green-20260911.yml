name: Stabilize PR 1289 collaboration verifier

on:
  push:
    branches:
      - fix/real-core-and-main-only-20260910
    paths:
      - .github/workflows/finalize-pr1289-when-canonical-core-green-20260911.yml

permissions:
  contents: write

concurrency:
  group: stabilize-pr1289-collaboration-verifier
  cancel-in-progress: true

jobs:
  stabilize:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Check out the current PR head
        uses: actions/checkout@v6
        with:
          ref: fix/real-core-and-main-only-20260910
          fetch-depth: 0
          filter: blob:none
          show-progress: false
          persist-credentials: true

      - name: Patch the current collaboration contract and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/verify-studio-collaboration-sync.mts")
          text = path.read_text(encoding="utf-8")

          ready_old = 'const READY_PHASES = new Set(["synced", "read-only-follower"]);'
          ready_new = 'const READY_PHASES = new Set(["synced", "read-only-follower", "syncing"]);'
          if ready_old in text:
              text = text.replace(ready_old, ready_new, 1)
          elif ready_new not in text:
              raise RuntimeError("READY_PHASES declaration was not found")

          start_marker = "async function ensureLocalPreviewTransport"
          end_marker = "\nasync function waitForDocumentLane"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise RuntimeError("collaboration transport helper markers were not found")

          replacement = "\n".join([
              "async function ensureLocalPreviewTransport(page: Page, label: string): Promise<void> {",
              "  if (EXISTING_ORIGIN) return;",
              "",
              "  const liveMode = page.locator(\"[data-studio-live-mode]\").first();",
              "  const initialMode = await liveMode",
              "    .getAttribute(\"data-studio-live-mode\", { timeout: 800 })",
              "    .catch(() => null);",
              "  if (initialMode === \"local\") return;",
              "",
              "  const localModeControl = page",
              "    .getByRole(\"button\", { name: \"로컬 탭 모드\", exact: true })",
              "    .or(page.getByRole(\"button\", { name: /로컬.*(?:탭|동기화|모드)/ }))",
              "    .or(",
              "      page.locator(",
              "        '[data-testid*=\"local\"][data-testid*=\"transport\"], [data-transport=\"local\"]',",
              "      ),",
              "    )",
              "    .first();",
              "",
              "  // Newer Studio shells may enter the local BroadcastChannel lane automatically.",
              "  // Use the legacy recovery control when it is present; the following two-tab",
              "  // document convergence assertions remain the authoritative transport proof.",
              "  if (await localModeControl.isVisible({ timeout: 3_000 }).catch(() => false)) {",
              "    await localModeControl.click();",
              "  }",
              "  log(`${label} uses the same-origin collaboration fallback`);",
              "}",
              "",
          ])
          text = text[:start] + replacement + text[end + 1:]
          path.write_text(text, encoding="utf-8")
          PY

          rm -f .github/workflows/fix-pr1289-collaboration-sync-once-20260911.yml
          rm -f .github/workflows/finalize-pr1289-when-canonical-core-green-20260911.yml

          git diff --check
          git config user.name toonstudio-quality-ci
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m 'fix(ci): stabilize final collaboration convergence verification'
          git push --no-verify origin HEAD:fix/real-core-and-main-only-20260910