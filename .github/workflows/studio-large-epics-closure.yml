name: Studio large epics closure

on:
  push:
    branches:
      - codex/studio-large-epics-closure-20260909
    paths:
      - "apps/web/src/domains/creator/studio-deterministic-serialization*"
      - "apps/web/src/domains/creator/studio-asset-family-revision*"
      - "apps/web/src/domains/creator/studio-soft-proofing*"
      - "apps/web/src/domains/creator/ai/studio-stroke-proposal*"
      - "apps/web/src/domains/creator/ai/StudioStrokeProposalReviewPanel*"
      - "apps/web/src/domains/creator/ai/studio-structured-edit-proposal*"
      - "apps/web/src/domains/creator/filter/studio-adjustment-effect-graph*"
      - "apps/web/src/domains/creator/animation/studio-timeline-timebase*"
      - "apps/web/src/domains/creator/vrm/studio-vrm-texture-dilation*"
      - "apps/web/src/domains/creator/vrm/studio-vrm-attachment-graph*"
      - "apps/api/src/modules/studio-ai/studio-3d-generation-job-ledger*"
      - "scripts/verify-studio-open-issues-wave.mts"
      - ".github/workflows/studio-large-epics-closure.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-large-epics-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      STATUS_FILE: docs/automation/studio-large-epics-closure-status.json
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Focused large-epic contracts
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec vitest run \
            apps/web/src/domains/creator/studio-deterministic-serialization.test.ts \
            apps/web/src/domains/creator/ai/studio-stroke-proposal.test.ts \
            apps/web/src/domains/creator/ai/StudioStrokeProposalReviewPanel.test.tsx \
            apps/web/src/domains/creator/filter/studio-adjustment-effect-graph.test.ts \
            apps/web/src/domains/creator/animation/studio-timeline-timebase.test.ts \
            apps/web/src/domains/creator/studio-asset-family-revision.test.ts \
            apps/web/src/domains/creator/studio-soft-proofing.test.ts \
            apps/web/src/domains/creator/vrm/studio-vrm-texture-dilation.test.ts \
            apps/web/src/domains/creator/vrm/studio-vrm-attachment-graph.test.ts \
            apps/web/src/domains/creator/ai/studio-structured-edit-proposal.test.ts \
            apps/api/src/modules/studio-ai/studio-3d-generation-job-ledger.test.ts \
            2>&1 | tee /tmp/focused.log

      - name: Lint changed contracts
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec eslint --max-warnings=0 \
            apps/web/src/domains/creator/studio-deterministic-serialization.ts \
            apps/web/src/domains/creator/studio-deterministic-serialization.test.ts \
            apps/web/src/domains/creator/ai/studio-stroke-proposal.ts \
            apps/web/src/domains/creator/ai/studio-stroke-proposal.test.ts \
            apps/web/src/domains/creator/ai/StudioStrokeProposalReviewPanel.tsx \
            apps/web/src/domains/creator/ai/StudioStrokeProposalReviewPanel.test.tsx \
            apps/web/src/domains/creator/filter/studio-adjustment-effect-graph.ts \
            apps/web/src/domains/creator/filter/studio-adjustment-effect-graph.test.ts \
            apps/web/src/domains/creator/animation/studio-timeline-timebase.ts \
            apps/web/src/domains/creator/animation/studio-timeline-timebase.test.ts \
            apps/web/src/domains/creator/studio-asset-family-revision.ts \
            apps/web/src/domains/creator/studio-asset-family-revision.test.ts \
            apps/web/src/domains/creator/studio-soft-proofing.ts \
            apps/web/src/domains/creator/studio-soft-proofing.test.ts \
            apps/web/src/domains/creator/vrm/studio-vrm-texture-dilation.ts \
            apps/web/src/domains/creator/vrm/studio-vrm-texture-dilation.test.ts \
            apps/web/src/domains/creator/vrm/studio-vrm-attachment-graph.ts \
            apps/web/src/domains/creator/vrm/studio-vrm-attachment-graph.test.ts \
            apps/web/src/domains/creator/ai/studio-structured-edit-proposal.ts \
            apps/web/src/domains/creator/ai/studio-structured-edit-proposal.test.ts \
            apps/api/src/modules/studio-ai/studio-3d-generation-job-ledger.ts \
            apps/api/src/modules/studio-ai/studio-3d-generation-job-ledger.test.ts \
            scripts/verify-studio-open-issues-wave.mts \
            2>&1 | tee /tmp/lint.log

      - name: Frontend typecheck
        id: web_typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsc -p tsconfig.json --noEmit --incremental false 2>&1 | tee /tmp/web-typecheck.log

      - name: API typecheck
        id: api_typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @webtoon-nest/api run typecheck 2>&1 | tee /tmp/api-typecheck.log

      - name: Aggregate acceptance map
        id: aggregate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsx scripts/verify-studio-open-issues-wave.mts 2>&1 | tee /tmp/aggregate.log

      - name: Production build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee /tmp/build.log

      - name: Persist concise verification status
        if: always()
        shell: bash
        env:
          FOCUSED: ${{ steps.focused.outcome }}
          LINT: ${{ steps.lint.outcome }}
          WEB_TYPECHECK: ${{ steps.web_typecheck.outcome }}
          API_TYPECHECK: ${{ steps.api_typecheck.outcome }}
          AGGREGATE: ${{ steps.aggregate.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          mkdir -p "$(dirname "$STATUS_FILE")"
          node <<'NODE'
          const fs = require('node:fs');
          const path = process.env.STATUS_FILE;
          const checks = {
            focused: process.env.FOCUSED,
            lint: process.env.LINT,
            webTypecheck: process.env.WEB_TYPECHECK,
            apiTypecheck: process.env.API_TYPECHECK,
            aggregate: process.env.AGGREGATE,
            build: process.env.BUILD,
          };
          const tail = (file) => {
            try { return fs.readFileSync(file, 'utf8').split(/\r?\n/u).slice(-80).join('\n'); }
            catch { return ''; }
          };
          const passed = Object.values(checks).every((value) => value === 'success');
          fs.writeFileSync(path, JSON.stringify({
            schemaVersion: 1,
            headSha: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            passed,
            checks,
            failureTails: passed ? {} : {
              focused: tail('/tmp/focused.log'),
              lint: tail('/tmp/lint.log'),
              webTypecheck: tail('/tmp/web-typecheck.log'),
              apiTypecheck: tail('/tmp/api-typecheck.log'),
              aggregate: tail('/tmp/aggregate.log'),
              build: tail('/tmp/build.log'),
            },
          }, null, 2) + '\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATUS_FILE"
          if ! git diff --cached --quiet; then
            git commit -m "test(studio): record large-epic closure verification [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Enforce all closure checks
        if: always()
        shell: bash
        env:
          FOCUSED: ${{ steps.focused.outcome }}
          LINT: ${{ steps.lint.outcome }}
          WEB_TYPECHECK: ${{ steps.web_typecheck.outcome }}
          API_TYPECHECK: ${{ steps.api_typecheck.outcome }}
          AGGREGATE: ${{ steps.aggregate.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          for value in "$FOCUSED" "$LINT" "$WEB_TYPECHECK" "$API_TYPECHECK" "$AGGREGATE" "$BUILD"; do
            test "$value" = success
          done
