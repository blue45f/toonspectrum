name: Repair final secret fixture minimally

on:
  push:
    branches:
      - repair/final-secret-fixture-minimal-20260908
    paths:
      - .github/workflows/repair-final-secret-fixture-minimal.yml

permissions:
  contents: write

concurrency:
  group: repair-final-secret-fixture-minimal-20260908
  cancel-in-progress: true

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[skip secret-fixture-repair]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/final-secret-fixture-minimal-20260908
          fetch-depth: 0
      - name: Restore the validated test and replace only the secret-shaped token
        shell: bash
        run: |
          set -euo pipefail
          path='apps/web/src/domains/creator/studio-bug-report-package.test.ts'
          git fetch --no-tags origin aa3b26fb56a73c757bd32080c88d8623a1e9259c
          git show aa3b26fb56a73c757bd32080c88d8623a1e9259c:"$path" > "$path"

          python3 <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/domains/creator/studio-bug-report-package.test.ts')
          text = path.read_text(encoding='utf-8')
          old = '  token: "sk_live_51ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",'
          new = (
              '  // Provider-agnostic, low-entropy fixture: long enough to exercise LONG_TOKEN redaction.\n'
              '  token: "REDACTION_FIXTURE_00000000000000000000000000000000",'
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one secret-shaped fixture, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git rm .github/workflows/repair-final-secret-fixture-minimal.yml
          git add "$path"
          git diff --cached --check

          changed="$(git diff --cached --name-only)"
          expected=$'.github/workflows/repair-final-secret-fixture-minimal.yml\napps/web/src/domains/creator/studio-bug-report-package.test.ts'
          if [[ "$changed" != "$expected" ]]; then
            echo "Unexpected changed files:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(security): restore bug-report contract with neutral fixture [skip secret-fixture-repair]"
          git push origin HEAD:repair/final-secret-fixture-minimal-20260908
