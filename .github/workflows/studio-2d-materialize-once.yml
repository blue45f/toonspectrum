name: Finalize and verify Studio 2D changes
on:
  push:
    branches: [feat/studio-2d-assets-quality-20260906]
    paths:
      - 'scripts/.studio-2d-transfer/**'
      - '.github/workflows/studio-2d-materialize-once.yml'
permissions:
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: prepare-studio-2d-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.ref == 'refs/heads/feat/studio-2d-assets-quality-20260906'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
      - name: Apply exact source fixes on the isolated feature branch
        id: materialize
        run: |
          python3 scripts/.studio-2d-transfer/finalize.py
          python3 scripts/.studio-2d-transfer/placement.py
          python3 scripts/.studio-2d-transfer/polish.py
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        id: install
      - name: Audit originals and compatibility paths
        id: audit
        continue-on-error: true
        run: |
          node scripts/studio-2d-asset-audit.mjs | tee artifacts/studio-2d/asset-audit.json
          node --test scripts/studio-2d-asset-quality.test.mjs | tee artifacts/studio-2d/file-tests.txt
      - name: Lint and format changed modules
        id: lint
        continue-on-error: true
        run: pnpm exec eslint --fix src/domains/creator/studio-2d-*.ts src/domains/creator/Studio2d*.tsx src/domains/creator/studio-bg-scenes.ts src/domains/creator/StudioSceneToolPopoverBody.tsx src/domains/creator/StudioToolBeltContent.tsx src/domains/creator/StudioCuttoonEditorHost.tsx scripts/studio-2d-*.mjs 2>&1 | tee artifacts/studio-2d/lint.txt
      - name: Execute scene, component, placement and architecture regression tests
        id: tests
        continue-on-error: true
        run: pnpm exec vitest run src/domains/creator/studio-2d-asset-quality.test.ts src/domains/creator/studio-2d-source-size.test.ts src/domains/creator/Studio2dSceneBrowser.test.tsx scripts/studio-2d-asset-quality.test.mjs src/domains/creator/studio-assets.test.ts src/domains/creator/studio-host-architecture-ratchet.test.ts 2>&1 | tee artifacts/studio-2d/component-tests.txt
      - name: Full project typecheck
        id: types
        continue-on-error: true
        run: pnpm run typecheck 2>&1 | tee artifacts/studio-2d/typecheck.txt
      - run: pnpm exec playwright install --with-deps chromium
        id: browser_install
        continue-on-error: true
      - name: Actual browser interactions, keyboard scrolling and canvas placement
        id: browser
        continue-on-error: true
        run: node scripts/studio-2d-browser-smoke.mjs 2>&1 | tee artifacts/studio-2d/browser-log.txt
      - name: Record prepared code on this feature branch only
        if: always() && steps.materialize.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json,subprocess
          paths=json.load(open('artifacts/studio-2d/finalized-paths.json'))
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'fix(studio): preserve original scene aspect ratio and accessible preview controls'
          git push origin HEAD:refs/heads/feat/studio-2d-assets-quality-20260906
          git rev-parse HEAD > artifacts/studio-2d/prepared-commit.txt
          python3 - <<'PY'
          import json,tarfile
          paths=json.load(open('artifacts/studio-2d/finalized-paths.json'))
          with tarfile.open('artifacts/studio-2d/prepared-source.tar.gz','w:gz') as archive:
              for name in paths: archive.add(name,arcname=name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-2d-finalization-evidence
          path: artifacts/studio-2d/
          retention-days: 7
          if-no-files-found: error
      - name: Preserve actual quality gate outcomes
        if: always()
        env:
          RESULTS: ${{ steps.materialize.outcome }} ${{ steps.install.outcome }} ${{ steps.audit.outcome }} ${{ steps.lint.outcome }} ${{ steps.tests.outcome }} ${{ steps.types.outcome }} ${{ steps.browser_install.outcome }} ${{ steps.browser.outcome }}
        run: |
          for result in $RESULTS; do
            test "$result" = success || exit 1
          done
