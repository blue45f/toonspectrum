name: PR 839 finalizer

on:
  push:
    branches:
      - feat/studio-asset-os-foundation
    paths:
      - .github/workflows/pr839-finalize.yml

permissions:
  contents: write

concurrency:
  group: pr839-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/studio-asset-os-foundation
          fetch-depth: 1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Apply final source and Sonar fixes
        run: python3 scripts/pr839_finalize.py

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Add the Vitest V8 coverage provider
        run: pnpm add -Dw @vitest/coverage-v8@4.1.9

      - name: Normalize changed-file imports
        run: |
          pnpm exec eslint --fix --no-warn-ignored \
            apps/web/src/domains/creator/StudioAssetLegacyPanel.test.tsx \
            apps/web/src/domains/creator/StudioAssetToolPopoverWorkspace.test.tsx

      - name: Run focused coverage and regressions
        run: |
          pnpm exec vitest run \
            apps/web/src/domains/creator/StudioAssetLegacyPanel.test.tsx \
            apps/web/src/domains/creator/StudioAssetToolPopoverWorkspace.test.tsx \
            apps/web/src/domains/creator/StudioUnifiedAssetWorkspace.test.tsx \
            apps/web/src/domains/creator/StudioAssetToolPopoverWorkspace.boundary.test.ts \
            apps/web/src/domains/creator/studio-unified-asset-catalog.test.ts \
            apps/web/src/domains/creator/studio-tool-belt-lazy-ui-boundary.test.ts \
            --config vitest.sonar.config.ts

      - name: Run strict lint
        run: |
          pnpm exec eslint --max-warnings=0 --no-warn-ignored \
            apps/web/src/domains/creator/StudioAssetLegacyPanel.tsx \
            apps/web/src/domains/creator/StudioAssetLegacyPanel.test.tsx \
            apps/web/src/domains/creator/StudioAssetToolPopoverWorkspace.tsx \
            apps/web/src/domains/creator/StudioAssetToolPopoverWorkspace.test.tsx \
            apps/web/src/domains/creator/StudioAssetToolPopoverWorkspace.boundary.test.ts \
            apps/web/src/domains/creator/StudioUnifiedAssetWorkspace.tsx \
            apps/web/src/domains/creator/StudioUnifiedAssetWorkspace.test.tsx \
            apps/web/src/domains/creator/studio-unified-asset-catalog.ts \
            apps/web/src/domains/creator/studio-unified-asset-catalog.test.ts \
            apps/web/src/domains/creator/studio-tool-belt-lazy-ui.ts \
            apps/web/src/domains/creator/studio-tool-belt-lazy-ui-boundary.test.ts \
            vitest.sonar.config.ts

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Commit verified fixes and remove finalizer
        run: |
          rm -f scripts/pr839_finalize.py .github/workflows/pr839-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --no-verify -m "fix(studio): complete unified asset validation"
          git push origin HEAD:feat/studio-asset-os-foundation
