name: PR 839 finalizer

on:
  push:
    branches:
      - feat/studio-asset-os-foundation
    paths:
      - .github/workflows/pr839-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/studio-asset-os-foundation
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Apply final review and coverage fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          workspace = "apps/web/src/domains/creator/StudioUnifiedAssetWorkspace.tsx"
          replace_once(
              workspace,
              "  readonly legacyContent: ReactNode;\n  readonly onUseItem:",
              "  readonly legacyContent: ReactNode;\n  readonly initialView?: WorkspaceView;\n  readonly onUseItem:",
          )
          replace_once(
              workspace,
              'type WorkspaceView = "discover" | "library";',
              'export type WorkspaceView = "discover" | "library";',
          )
          replace_once(
              workspace,
              "  legacyContent,\n  onUseItem,",
              '  legacyContent,\n  initialView = "discover",\n  onUseItem,',
          )
          replace_once(
              workspace,
              'const [view, setView] = useState<WorkspaceView>("discover");',
              "const [view, setView] = useState<WorkspaceView>(initialView);",
          )
          replace_once(
              workspace,
              "  async function useItem(item: StudioUnifiedAssetItem): Promise<void> {",
              "  async function handleUseItem(item: StudioUnifiedAssetItem): Promise<void> {",
          )
          replace_once(
              workspace,
              "onClick={() => void useItem(item)}",
              "onClick={() => void handleUseItem(item)}",
          )

          parent = "apps/web/src/domains/creator/StudioAssetToolPopoverWorkspace.tsx"
          old_parent = '''      {toolBelt.assetTab === "community" ? (
            <StudioAssetLegacyPanel toolBelt={toolBelt} />
          ) : (
            <StudioUnifiedAssetWorkspace
              items={items}
              legacyContent={<StudioAssetLegacyPanel toolBelt={toolBelt} />}
              onUseItem={(item) => routeUnifiedAsset(item, toolBelt)}
              onOpenAi={(prompt) => {
                if (prompt) {
                  toolBelt.stableHandlers.applyAiAssistPresetPrompt("background", prompt);
                }
                toolBelt.setMenu("aiAssist");
              }}
            />
          )}
'''
          new_parent = '''      <StudioUnifiedAssetWorkspace
            initialView={toolBelt.assetTab === "community" ? "library" : "discover"}
            items={items}
            legacyContent={<StudioAssetLegacyPanel toolBelt={toolBelt} />}
            onUseItem={(item) => routeUnifiedAsset(item, toolBelt)}
            onOpenAi={(prompt) => {
              if (prompt) {
                toolBelt.stableHandlers.applyAiAssistPresetPrompt("background", prompt);
              }
              toolBelt.setMenu("aiAssist");
            }}
          />
'''
          replace_once(parent, old_parent, new_parent)

          boundary = "apps/web/src/domains/creator/StudioAssetToolPopoverWorkspace.boundary.test.ts"
          old_boundary = '''  it("keeps community deep links visible without a second discovery click", () => {
    expect(source).toContain('toolBelt.assetTab === "community"');
    expect(source).toContain("<StudioAssetLegacyPanel toolBelt={toolBelt} />");
  });
'''
          new_boundary = '''  it("opens community deep links in the library without unmounting discovery", () => {
    expect(source).toContain(
      'initialView={toolBelt.assetTab === "community" ? "library" : "discover"}',
    );
    expect(source).toContain("<StudioAssetLegacyPanel toolBelt={toolBelt} />");
    expect(source).not.toContain('{toolBelt.assetTab === "community" ? (');
  });
'''
          replace_once(boundary, old_boundary, new_boundary)

          workspace_test = Path(
              "apps/web/src/domains/creator/StudioUnifiedAssetWorkspace.test.tsx"
          )
          text = workspace_test.read_text(encoding="utf-8")
          marker = "\n});\n"
          index = text.rfind(marker)
          if index < 0:
              raise SystemExit("workspace test closing marker not found")
          addition = r'''

  it("opens the legacy library immediately for marketplace deep links", () => {
    render(
      <StudioUnifiedAssetWorkspace
        initialView="library"
        items={items}
        legacyContent={<div data-testid="deep-linked-library">기존 보관함</div>}
        onUseItem={vi.fn()}
        onOpenAi={vi.fn()}
      />,
    );

    expect(screen.getByTestId("deep-linked-library")).toBeTruthy();
    expect(screen.queryByRole("searchbox", { name: "에셋 통합 검색" })).toBeNull();
  });

  it("reports a rejected safe-use route without a false success message", async () => {
    render(
      <StudioUnifiedAssetWorkspace
        items={items}
        legacyContent={<div>기존 보관함</div>}
        onUseItem={vi.fn().mockResolvedValue(false)}
        onOpenAi={vi.fn()}
      />,
    );

    fireEvent.click(screen.getByRole("button", { name: "교실 의자 3D 도구 열기" }));
    expect(
      await screen.findByText("현재 캔버스 상태에서는 이 에셋을 사용할 수 없습니다."),
    ).toBeTruthy();
    expect(screen.queryByText("교실 의자 편집 도구를 열었습니다.")).toBeNull();
  });
'''
          workspace_test.write_text(text[:index] + addition + text[index:], encoding="utf-8")

