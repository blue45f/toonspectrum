name: Prioritize final PR 917 protected core on macOS

on:
  push:
    branches:
      - ci/actions-queue-dedupe-20260908
    paths:
      - .github/workflows/one-shot-prioritize-final-core-macos.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: one-shot-prioritize-final-core-macos
  cancel-in-progress: true

jobs:
  cancel-duplicate-runs:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Preserve only final PR 917 CI and main runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
          REQUIRED_RUN_ID: "34168628743"
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repository = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          self_run_id = int(os.environ["SELF_RUN_ID"])
          required_run_id = int(os.environ["REQUIRED_RUN_ID"])
          active_statuses = ("in_progress", "queued", "pending", "waiting", "requested")

          def api(path: str, method: str = "GET") -> tuple[int, object]:
              request = urllib.request.Request(
                  f"https://api.github.com{path}",
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "toonspectrum-pr917-ci-isolator-macos",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as error:
                  raw = error.read()
                  try:
                      payload: object = json.loads(raw) if raw else {}
                  except json.JSONDecodeError:
                      payload = raw.decode("utf-8", errors="replace")
                  return error.code, payload

          runs_by_id: dict[int, dict[str, object]] = {}
          for run_status in active_statuses:
              for page in range(1, 11):
                  status, payload = api(
                      f"/repos/{repository}/actions/runs?status={run_status}&per_page=100&page={page}"
                  )
                  if status != 200 or not isinstance(payload, dict):
                      raise SystemExit(f"Unable to list {run_status} runs: HTTP {status}: {payload}")
                  runs = payload.get("workflow_runs", [])
                  if not isinstance(runs, list):
                      raise SystemExit("GitHub returned an invalid workflow_runs payload")
                  for run in runs:
                      if isinstance(run, dict):
                          runs_by_id[int(run.get("id", 0))] = run
                  if len(runs) < 100:
                      break

          keep_ids = {self_run_id, required_run_id}
          candidates = [
              run
              for run_id, run in runs_by_id.items()
              if run_id not in keep_ids and run.get("head_branch") != "main"
          ]
          candidates.sort(key=lambda run: (str(run.get("created_at") or ""), int(run.get("id", 0))))
          print(json.dumps({
              "active": len(runs_by_id),
              "preserved": sorted(keep_ids),
              "cancellations": len(candidates),
          }, sort_keys=True))

          cancelled = 0
          raced = 0
          failures: list[str] = []
          for run in candidates:
              run_id = int(run["id"])
              status, payload = api(
                  f"/repos/{repository}/actions/runs/{run_id}/cancel",
                  method="POST",
              )
              label = f"{run_id} {run.get('head_branch')} / {run.get('name')} [{run.get('status')}]"
              if status == 202:
                  cancelled += 1
                  print(f"cancelled: {label}")
              elif status in {404, 409}:
                  raced += 1
                  print(f"already terminal: {label} (HTTP {status})")
              else:
                  failures.append(f"{label}: HTTP {status}: {payload}")
              time.sleep(0.03)

          print(f"summary: cancelled={cancelled} already_terminal={raced} failed={len(failures)}")
          if failures:
              raise SystemExit("Cancellation failures:\n" + "\n".join(failures))
          PY
