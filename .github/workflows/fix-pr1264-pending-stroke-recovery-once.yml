    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      CI: "1"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply focused pending-stroke recovery repair
