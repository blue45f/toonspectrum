name: Fix PR 1264 pending stroke recovery once

on:
  push:
    branches:
      - integration/completed-unmerged-20260910-1655
    paths:
      - .github/workflows/fix-pr1264-pending-stroke-recovery-once.yml

permissions:
  contents: write

concurrency:
  group: fix-pr1264-pending-stroke-recovery-once
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "1"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Materialize the reviewed product patch from the parent revision
        shell: bash
        run: |
          set -euo pipefail
          source_file="$RUNNER_TEMP/pending-stroke-source.yml"
          git show "${GITHUB_SHA}^:.github/workflows/fix-pr1264-pending-stroke-recovery-once.yml" > "$source_file"
          SOURCE_FILE="$source_file" python3 <<'PY'
          import ast
          import os
          import re
          from pathlib import Path

          source = Path(os.environ["SOURCE_FILE"]).read_text(encoding="utf-8")

          def capture(pattern: str, label: str) -> str:
              match = re.search(pattern, source, re.DOTALL)
              if not match:
                  raise SystemExit(f"missing reviewed {label} payload")
              return match.group(1)

          helper = capture(
              r"helper\.write_text\('''(.*?)''', encoding=\"utf-8\"\)",
              "helper",
          )
          test = capture(
              r"test\.write_text\('''(.*?)''', encoding=\"utf-8\"\)",
              "test",
          )
          import_anchor = ast.literal_eval(capture(r"import_anchor = ('.*?')\n", "import anchor"))
          import_line = ast.literal_eval(capture(r"import_line = ('.*?')\n", "import line"))
          winner_anchor = capture(r"winner_anchor = '''(.*?)'''\n", "winner anchor")
          winner_replacement = capture(
              r"winner_replacement = '''(.*?)'''\n",
              "winner replacement",
          )

          Path("apps/web/src/domains/creator/studio-pending-stroke-recovery.ts").write_text(
              helper,
              encoding="utf-8",
          )
          Path("apps/web/src/domains/creator/studio-pending-stroke-recovery.test.ts").write_text(
              test,
              encoding="utf-8",
          )

          target = Path("apps/web/src/domains/creator/studio-autosave-opfs-session.ts")
          content = target.read_text(encoding="utf-8")
          if import_line not in content:
              if content.count(import_anchor) != 1:
                  raise SystemExit("unexpected sha256 import anchor count")
              content = content.replace(import_anchor, import_line + import_anchor, 1)
          if winner_replacement not in content:
              if content.count(winner_anchor) != 1:
                  raise SystemExit("unexpected reconciliation winner anchor count")
              content = content.replace(winner_anchor, winner_replacement, 1)
          target.write_text(content, encoding="utf-8")
          PY
      - name: Verify focused recovery contract
        run: |
          pnpm exec vitest run \
            apps/web/src/domains/creator/studio-pending-stroke-recovery.test.ts \
            apps/web/src/domains/creator/studio-autosave-opfs-session.test.ts
          pnpm run typecheck
          pnpm run validate:architecture
      - name: Commit the verified patch and retire this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-pr1264-pending-stroke-recovery-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/web/src/domains/creator/studio-pending-stroke-recovery.ts \
            apps/web/src/domains/creator/studio-pending-stroke-recovery.test.ts \
            apps/web/src/domains/creator/studio-autosave-opfs-session.ts \
            .github/workflows/fix-pr1264-pending-stroke-recovery-once.yml
          git diff --cached --check
          git commit -m "fix(studio): recover the newest complete pending stroke snapshot"
          git push origin "HEAD:${GITHUB_REF_NAME}"
