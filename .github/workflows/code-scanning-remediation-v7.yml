name: Final CodeQL remediation v7

on:
  push:
    branches:
      - codex/code-scanning-remediation-20260908
    paths:
      - .github/workflows/code-scanning-remediation-v7.yml
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  models: read
  pull-requests: write
  security-events: write
  statuses: read

concurrency:
  group: final-codeql-remediation-v7
  cancel-in-progress: true

env:
  TARGET_BRANCH: codex/code-scanning-remediation-20260908

jobs:
  takeover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      proceed: ${{ steps.branch.outputs.proceed }}
    steps:
      - name: Confirm branch and cancel superseded runs
        id: branch
        env:
          GH_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN || secrets.GH_PAT || secrets.REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          encoded="${TARGET_BRANCH//\//%2F}"
          if ! gh api "/repos/${GITHUB_REPOSITORY}/branches/${encoded}" >/dev/null 2>&1; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

          names='[
            "Code scanning autofix",
            "Code scanning remediation gate",
            "Trigger code scanning remediation gate",
            "Complete CodeQL remediation",
            "Collision-safe CodeQL remediation fallback",
            "AI-assisted residual CodeQL remediation",
            "Iterative CodeQL remediation supervisor",
            "Bound earlier CodeQL remediation runtime",
            "Final CodeQL remediation and protected merge"
          ]'
          runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${TARGET_BRANCH}&per_page=100")"
          jq -r --argjson names "$names" '.workflow_runs[] | select((.name as $n | $names | index($n)) and .status != "completed") | .id' <<<"$runs" | while read -r run_id; do
            [[ -n "$run_id" ]] || continue
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done
          for attempt in $(seq 1 40); do
            runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${TARGET_BRANCH}&per_page=100")"
            active="$(jq --argjson names "$names" '[.workflow_runs[] | select((.name as $n | $names | index($n)) and .status != "completed")] | length' <<<"$runs")"
            [[ "$active" == "0" ]] && break
            sleep 15
          done

          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          [[ -z "$number" ]] || gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --disable-auto || true

      - name: Checkout latest branch
        if: steps.branch.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Integrate latest main
        if: steps.branch.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

  round1:
    needs: takeover
    if: needs.takeover.result == 'success' && needs.takeover.outputs.proceed == 'true'
    permissions:
      contents: write
      models: read
      security-events: read
    uses: ./.github/workflows/codeql-residual-round-v6.yml
    with:
      round: "v7-1"
      branch: codex/code-scanning-remediation-20260908

  round2:
    needs: round1
    if: needs.round1.result == 'success' && needs.round1.outputs.clean != 'true'
    permissions:
      contents: write
      models: read
      security-events: read
    uses: ./.github/workflows/codeql-residual-round-v6.yml
    with:
      round: "v7-2"
      branch: codex/code-scanning-remediation-20260908

  round3:
    needs: round2
    if: needs.round2.result == 'success' && needs.round2.outputs.clean != 'true'
    permissions:
      contents: write
      models: read
      security-events: read
    uses: ./.github/workflows/codeql-residual-round-v6.yml
    with:
      round: "v7-3"
      branch: codex/code-scanning-remediation-20260908

  round4:
    needs: round3
    if: needs.round3.result == 'success' && needs.round3.outputs.clean != 'true'
    permissions:
      contents: write
      models: read
      security-events: read
    uses: ./.github/workflows/codeql-residual-round-v6.yml
    with:
      round: "v7-4"
      branch: codex/code-scanning-remediation-20260908

  round5:
    needs: round4
    if: needs.round4.result == 'success' && needs.round4.outputs.clean != 'true'
    permissions:
      contents: write
      models: read
      security-events: read
    uses: ./.github/workflows/codeql-residual-round-v6.yml
    with:
      round: "v7-5"
      branch: codex/code-scanning-remediation-20260908

  verify-and-merge:
    needs: [takeover, round1, round2, round3, round4, round5]
    if: >-
      ${{
        always() &&
        needs.takeover.result == 'success' &&
        needs.takeover.outputs.proceed == 'true' &&
        needs.round1.result == 'success' &&
        (needs.round2.result == 'success' || needs.round2.result == 'skipped') &&
        (needs.round3.result == 'success' || needs.round3.result == 'skipped') &&
        (needs.round4.result == 'success' || needs.round4.result == 'skipped') &&
        (needs.round5.result == 'success' || needs.round5.result == 'skipped')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
    env:
      GH_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN || secrets.GH_PAT || secrets.REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || github.token }}
    steps:
      - name: Checkout latest repaired tree
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Integrate latest main before final analysis
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Initialize final CodeQL gate
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Analyze final branch candidate
        uses: github/codeql-action/analyze@v3
        with:
          upload: false
          output: /tmp/codeql-v7-final
          category: /language:javascript-typescript

      - name: Require zero CodeQL security findings
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/codeql-residual-remediation-v6.py \
            --sarif-root /tmp/codeql-v7-final \
            --output /tmp/codeql-v7-final-findings.json

      - name: Create or locate pull request
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$number" ]]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$TARGET_BRANCH" \
              --title "fix(security): resolve all open CodeQL findings" \
              --body $'## Summary\n\n- remediates the full open CodeQL inventory\n- applies deterministic and source-level residual fixes\n- validates with CodeQL `security-and-quality`\n- runs the repository `core` job on the final SHA\n- removes all temporary remediation assets before merge\n- re-analyzes the actual merged `main` tree\n\n## Merge gates\n\n- CodeQL security findings: **0**\n- final `core` check: **success**\n- post-merge `main` open CodeQL alerts: **0**'
            number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --base main --state open --json number --jq '.[0].number')"
          fi
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --disable-auto || true
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Remove temporary remediation assets
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git reset --hard "origin/$TARGET_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f \
            .github/workflows/code-scanning-inventory.yml \
            .github/workflows/code-scanning-context.yml \
            .github/workflows/code-scanning-autofix.yml \
            .github/workflows/code-scanning-remediation-gate.yml \
            .github/workflows/code-scanning-remediation-gate-trigger.yml \
            .github/workflows/code-scanning-remediation-v2.yml \
            .github/workflows/code-scanning-remediation-v3.yml \
            .github/workflows/code-scanning-remediation-v4.yml \
            .github/workflows/code-scanning-remediation-v5.yml \
            .github/workflows/code-scanning-remediation-v6.yml \
            .github/workflows/code-scanning-remediation-v7.yml \
            .github/workflows/code-scanning-remediation-deadline.yml \
            .github/workflows/codeql-residual-round.yml \
            .github/workflows/codeql-residual-round-v6.yml \
            .github/workflows/patch-remediation-v5.yml \
            scripts/codeql-residual-remediation.py \
            scripts/codeql-residual-remediation-v6.py
          git add -A
          git diff --check
          if ! git diff --cached --quiet; then
            git commit -m "chore(security): remove temporary CodeQL remediation automation"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
          if git ls-files | grep -E '(^|/)(code-scanning-remediation|codeql-residual|patch-remediation-v5)' ; then
            echo "Temporary remediation assets remain tracked." >&2
            exit 1
          fi

      - name: Dispatch core CI for final SHA
        id: core
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(git rev-parse HEAD)"
          before="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=${TARGET_BRANCH}&event=workflow_dispatch&per_page=100" --jq '[.workflow_runs[].id] | max // 0')"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH"
          run_id=""
          for attempt in $(seq 1 120); do
            payload="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=${TARGET_BRANCH}&event=workflow_dispatch&per_page=100")"
            run_id="$(jq -r --arg sha "$expected_sha" --argjson before "$before" '[.workflow_runs[] | select(.id > $before and .head_sha == $sha)][0].id // empty' <<<"$payload")"
            [[ -n "$run_id" ]] && break
            echo "Waiting for CI dispatch (${attempt}/120)"
            sleep 5
          done
          [[ -n "$run_id" ]] || { echo "CI dispatch did not appear." >&2; exit 1; }

          core="pending"
          for attempt in $(seq 1 480); do
            jobs="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" --slurp)"
            core="$(jq -r '[.[].jobs[]? | select(.name == "core")][0].conclusion // [.[].jobs[]? | select(.name == "core")][0].status // "pending"' <<<"$jobs")"
            echo "CI run=${run_id}; core=${core}; attempt=${attempt}/480"
            case "$core" in
              success) break ;;
              failure|cancelled|timed_out|action_required|startup_failure|stale) exit 1 ;;
            esac
            sleep 15
          done
          [[ "$core" == "success" ]] || { echo "core did not complete successfully." >&2; exit 1; }

          check_count="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/commits/${expected_sha}/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "core" and .conclusion == "success")] | length')"
          [[ "$check_count" -ge 1 ]] || { echo "Successful core check is not attached to final SHA." >&2; exit 1; }
          echo "sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Verify pull-request head and required check
        shell: bash
        run: |
          set -euo pipefail
          payload="$(gh pr view "${{ steps.pr.outputs.number }}" --repo "$GITHUB_REPOSITORY" --json state,headRefOid,statusCheckRollup)"
          state="$(jq -r '.state' <<<"$payload")"
          head="$(jq -r '.headRefOid' <<<"$payload")"
          core="$(jq -r '[.statusCheckRollup[] | select((.name // .context // "") == "core") | (.conclusion // .state // .status)][-1] // "missing"' <<<"$payload")"
          [[ "$state" == "OPEN" ]] || exit 1
          [[ "$head" == "${{ steps.core.outputs.sha }}" ]] || { echo "PR head changed after core validation." >&2; exit 1; }
          [[ "$core" == "SUCCESS" || "$core" == "success" ]] || { echo "Required core check is not successful: $core" >&2; exit 1; }

      - name: Enable protected squash auto-merge
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "${{ steps.pr.outputs.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --auto \
            --delete-branch

      - name: Wait for merge
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            state="$(gh pr view "${{ steps.pr.outputs.number }}" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')"
            echo "PR state=${state}; attempt=${attempt}/180"
            [[ "$state" == "MERGED" ]] && exit 0
            [[ "$state" == "OPEN" ]] || exit 1
            sleep 20
          done
          echo "Timed out waiting for merge." >&2
          exit 1

  verify-main:
    needs: verify-and-merge
    if: needs.verify-and-merge.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN || secrets.GH_PAT || secrets.REPO_PAT || secrets.PERSONAL_ACCESS_TOKEN || github.token }}
    steps:
      - name: Checkout actual merged main tree
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Initialize CodeQL on main
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Analyze actual main tree
        uses: github/codeql-action/analyze@v3
        with:
          upload: false
          output: /tmp/codeql-v7-main
          category: /language:javascript-typescript

      - name: Require zero findings and upload main SARIF explicitly
        id: sarif
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          import pathlib
          import sys

          sarifs = glob.glob('/tmp/codeql-v7-main/**/*.sarif', recursive=True)
          if not sarifs:
              raise SystemExit('No main SARIF produced')
          findings = []
          seen = set()
          for sarif_path in sarifs:
              sarif = json.loads(pathlib.Path(sarif_path).read_text(encoding='utf-8'))
              for run in sarif.get('runs', []):
                  rules = {r.get('id'): r for r in ((((run.get('tool') or {}).get('driver') or {}).get('rules')) or [])}
                  for item in run.get('results', []):
                      rule_id = item.get('ruleId')
                      props = (rules.get(rule_id) or {}).get('properties') or {}
                      tags = [str(tag) for tag in (props.get('tags') or [])]
                      if props.get('security-severity') is None and not any(tag.startswith('security/') or tag.startswith('external/cwe/') for tag in tags):
                          continue
                      locations = item.get('locations') or []
                      physical = ((locations[0].get('physicalLocation') if locations else None) or {})
                      key = (rule_id, ((physical.get('artifactLocation') or {}).get('uri')), ((physical.get('region') or {}).get('startLine')), ((item.get('message') or {}).get('text')))
                      if key not in seen:
                          seen.add(key)
                          findings.append({'rule': key[0], 'path': key[1], 'line': key[2], 'message': key[3]})
          print(json.dumps(findings, ensure_ascii=False, indent=2))
          if findings:
              raise SystemExit(f'Actual main tree has {len(findings)} CodeQL security finding(s)')
          pathlib.Path('/tmp/main-sarif-path.txt').write_text(sarifs[0], encoding='utf-8')
          print('MAIN_CODEQL_SECURITY_FINDINGS=0')
          PY

          sarif_path="$(cat /tmp/main-sarif-path.txt)"
          gzip -c "$sarif_path" > /tmp/codeql-v7-main.sarif.gz
          sarif_b64="$(base64 -w0 /tmp/codeql-v7-main.sarif.gz)"
          main_sha="$(git rev-parse HEAD)"
          response="$(jq -n --arg commit_sha "$main_sha" --arg ref 'refs/heads/main' --arg sarif "$sarif_b64" --arg checkout_uri "file://${GITHUB_WORKSPACE}" '{commit_sha:$commit_sha,ref:$ref,sarif:$sarif,checkout_uri:$checkout_uri}' | gh api --method POST "/repos/${GITHUB_REPOSITORY}/code-scanning/sarifs" --input -)"
          sarif_id="$(jq -r '.id' <<<"$response")"
          [[ -n "$sarif_id" && "$sarif_id" != "null" ]] || { echo "SARIF upload did not return an id." >&2; exit 1; }
          echo "id=$sarif_id" >> "$GITHUB_OUTPUT"
          echo "sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Wait for SARIF processing and zero open main alerts
        shell: bash
        run: |
          set -euo pipefail
          status="pending"
          for attempt in $(seq 1 120); do
            payload="$(gh api "/repos/${GITHUB_REPOSITORY}/code-scanning/sarifs/${{ steps.sarif.outputs.id }}")"
            status="$(jq -r '.processing_status // .status // "pending"' <<<"$payload")"
            errors="$(jq -c '.errors // []' <<<"$payload")"
            echo "SARIF status=${status}; errors=${errors}; attempt=${attempt}/120"
            case "$status" in
              complete) break ;;
              failed) exit 1 ;;
            esac
            sleep 10
          done
          [[ "$status" == "complete" ]] || { echo "SARIF processing timed out." >&2; exit 1; }

          count=-1
          for attempt in $(seq 1 120); do
            count="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&tool_name=CodeQL&ref=refs%2Fheads%2Fmain&per_page=100" --slurp | jq '[.[][]] | length')"
            echo "Open main CodeQL alerts=${count}; attempt=${attempt}/120"
            [[ "$count" == "0" ]] && break
            sleep 10
          done
          [[ "$count" == "0" ]] || { echo "Main still has ${count} open CodeQL alert(s)." >&2; exit 1; }
          gh pr comment "${{ needs.verify-and-merge.outputs.pr_number }}" --repo "$GITHUB_REPOSITORY" --body "✅ 완료: 보호 브랜치 병합 후 실제 \\`main\\` 트리를 다시 분석했고, 열린 CodeQL 경고는 **0건**입니다."
