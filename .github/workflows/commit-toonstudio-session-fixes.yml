name: Commit ToonStudio session fixes

on:
  push:
    branches:
      - feat/toonstudio-session-complete-20260911-1221
    paths:
      - .github/workflows/commit-toonstudio-session-fixes.yml

permissions:
  contents: write

concurrency:
  group: retry-toonstudio-session-fixes
  cancel-in-progress: false

jobs:
  commit-fixes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout dedicated branch
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-session-complete-20260911-1221
          fetch-depth: 0

      - name: Apply migration when it has not been persisted yet
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re
          import textwrap

          sentinel = Path("apps/web/src/domains/creator/studio-archive-manifest.test.ts")
          if "Object.freeze<StudioArchiveManifest>" in sentinel.read_text():
              print("Session fixes are already present; skipping migration.")
          else:
              source = Path(".github/workflows/apply-toonstudio-session-fixes.yml")
              if not source.exists():
                  raise SystemExit("Migration source workflow is missing before fixes were applied")
              workflow = source.read_text()
              block = re.search(
                  r"- name: Apply deterministic source fixes\n.*?run: \|\n(?P<body>.*?)\n\s+- name: Verify source formatting",
                  workflow,
                  re.S,
              )
              if block is None:
                  raise SystemExit("Could not locate deterministic source migration")
              body = textwrap.dedent(block.group("body"))
              prefix = "python <<'PY'\n"
              if not body.startswith(prefix) or not body.rstrip().endswith("\nPY"):
                  raise SystemExit("Unexpected deterministic migration block format")
              script = body[len(prefix):body.rfind("\nPY")]
              exec(compile(script, "toonstudio-session-migration.py", "exec"), {})
          PY

      - name: Remove temporary migration workflows
        run: |
          rm -f .github/workflows/apply-toonstudio-session-fixes.yml
          rm -f .github/workflows/apply-toonstudio-session-fixes-retry.yml
          rm -f .github/workflows/commit-toonstudio-session-fixes.yml

      - name: Commit source fixes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "toonstudio-integration-bot"
          git config user.email "toonstudio-integration-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes remain to commit."
            exit 0
          fi
          git commit -m "fix(studio): stabilize integrated feature type contracts"
          git push origin HEAD:feat/toonstudio-session-complete-20260911-1221
