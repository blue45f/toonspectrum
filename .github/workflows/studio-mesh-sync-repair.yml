name: Studio collaboration synchronization

on:
  pull_request:
    branches: [main]
    paths:
      - src/domains/creator/live/**
      - .github/workflows/studio-mesh-sync-repair.yml
  push:
    branches: [fix/collaboration-cross-browser-sync-20260905]
    paths:
      - src/domains/creator/live/**
      - .github/workflows/studio-mesh-sync-repair.yml

permissions:
  contents: read

concurrency:
  group: studio-mesh-sync-repair
  cancel-in-progress: true

jobs:
  collaboration-sync:
    runs-on: macos-14
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify collaboration synchronization
        run: pnpm exec vitest run src/domains/creator/live/studio-crdt-room-binding.test.ts src/domains/creator/live/studio-live-p2p-overlay-transport.test.ts src/domains/creator/live/studio-live-collaboration-transport.test.ts src/domains/creator/live/studio-live-signaling-server-transport.test.ts src/domains/creator/live/studio-live-collaboration-room.ink.test.ts src/domains/creator/live/studio-live-socket-transport.test.ts src/domains/creator/live/studio-mesh-sync-regression.test.ts
      - name: Lint collaboration changes
        run: pnpm exec eslint src/domains/creator/live/studio-crdt-room-binding.ts src/domains/creator/live/studio-live-p2p-overlay-transport.ts src/domains/creator/live/studio-mesh-sync-regression.test.ts
      - name: Check application types
        run: pnpm run typecheck
