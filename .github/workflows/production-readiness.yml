name: Production readiness

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Apply missing variables and deploy production (false audits only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-readiness
  cancel-in-progress: false

jobs:
  reconcile-and-deploy:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_PROJECT_NAME: toonspectrum
      VERCEL_CLI_VERSION: "58.9.4"
      VERCEL_TELEMETRY_DISABLED: "1"
      PUBLIC_APP_ORIGIN: https://www.toonstudio.cloud
      DATABASE_URL_VALUE: ${{ secrets.DATABASE_URL }}
      AUTH_SESSION_SECRET_VALUE: ${{ secrets.AUTH_SESSION_SECRET }}
      AUTH_STATE_SECRET_VALUE: ${{ secrets.AUTH_STATE_SECRET }}
      GOOGLE_OAUTH_CLIENT_ID_VALUE: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET_VALUE: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      KAKAO_REST_API_KEY_VALUE: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_OAUTH_CLIENT_ID_VALUE: ${{ secrets.KAKAO_OAUTH_CLIENT_ID }}
      KAKAO_CLIENT_SECRET_VALUE: ${{ secrets.KAKAO_CLIENT_SECRET }}
      KAKAO_OAUTH_CLIENT_SECRET_VALUE: ${{ secrets.KAKAO_OAUTH_CLIENT_SECRET }}
      NAVER_OAUTH_CLIENT_ID_VALUE: ${{ secrets.NAVER_OAUTH_CLIENT_ID }}
      NAVER_CLIENT_ID_VALUE: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_OAUTH_CLIENT_SECRET_VALUE: ${{ secrets.NAVER_OAUTH_CLIENT_SECRET }}
      NAVER_CLIENT_SECRET_VALUE: ${{ secrets.NAVER_CLIENT_SECRET }}
      OPENAI_API_KEY_VALUE: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY_VALUE: ${{ secrets.OPENROUTER_API_KEY }}
      BLOB_READ_WRITE_TOKEN_VALUE: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      R2_ACCOUNT_ID_VALUE: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID_VALUE: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY_VALUE: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_VALUE: ${{ secrets.R2_BUCKET }}
      S3_ENDPOINT_VALUE: ${{ secrets.S3_ENDPOINT }}
      S3_REGION_VALUE: ${{ secrets.S3_REGION }}
      S3_ACCESS_KEY_ID_VALUE: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY_VALUE: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET_VALUE: ${{ secrets.S3_BUCKET }}
      CREATOR_ASSET_OBJECT_STORAGE_ENDPOINT_VALUE: ${{ secrets.CREATOR_ASSET_OBJECT_STORAGE_ENDPOINT }}
      CREATOR_ASSET_OBJECT_STORAGE_BUCKET_VALUE: ${{ secrets.CREATOR_ASSET_OBJECT_STORAGE_BUCKET }}
      CREATOR_ASSET_OBJECT_STORAGE_ACCESS_KEY_ID_VALUE: ${{ secrets.CREATOR_ASSET_OBJECT_STORAGE_ACCESS_KEY_ID }}
      CREATOR_ASSET_OBJECT_STORAGE_SECRET_ACCESS_KEY_VALUE: ${{ secrets.CREATOR_ASSET_OBJECT_STORAGE_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "::error::GitHub production environment secret VERCEL_TOKEN is missing."
            exit 1
          fi
          if [[ -z "${VERCEL_PROJECT_ID:-}" || -z "${VERCEL_ORG_ID:-}" ]]; then
            echo "::error::VERCEL_PROJECT_ID and VERCEL_ORG_ID are both required for the pinned Vercel CLI."
            exit 1
          fi
          echo "Vercel deployment credentials are available."

      - name: Reconcile production variables without exposing values
        shell: bash
        env:
          DEPLOY: ${{ inputs.deploy }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY" == "true" ]]; then
            node scripts/configure-vercel-production.mjs
          else
            node scripts/configure-vercel-production.mjs --audit-only
          fi

      - name: Install and verify pinned Vercel CLI
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund "vercel@${VERCEL_CLI_VERSION}"
          actual_version="$(vercel --version 2>&1 | awk '/Vercel CLI/{version=$NF} END {print version}')"
          echo "Vercel CLI ${actual_version}"
          test "$actual_version" = "$VERCEL_CLI_VERSION"

      - name: Link the Vercel project
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Deploy production
        id: deploy
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prod --yes --token "$VERCEL_TOKEN" | tail -n 1)"
          if [[ ! "$deployment_url" =~ ^https:// ]]; then
            echo "::error::Vercel did not return a production deployment URL."
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Production deployment created: $deployment_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test deployment and production domain
        if: ${{ inputs.deploy }}
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          check_page() {
            local url="$1"
            curl --silent --show-error --fail-with-body \
              --retry 8 --retry-all-errors --retry-delay 10 \
              --max-time 30 --output /dev/null "$url"
          }
          check_json_api() {
            local base="$1"
            local tmp
            tmp="$(mktemp)"
            if curl --silent --show-error --fail-with-body \
              --retry 5 --retry-all-errors --retry-delay 5 \
              --max-time 30 --output "$tmp" \
              "$base/api/creator/marketplace/resources?limit=1"; then
              node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$tmp"
              rm -f "$tmp"
              return 0
            fi
            if curl --silent --show-error --fail-with-body \
              --retry 5 --retry-all-errors --retry-delay 5 \
              --max-time 30 --output "$tmp" \
              "$base/creator/marketplace/resources?limit=1"; then
              node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$tmp"
              rm -f "$tmp"
              return 0
            fi
            rm -f "$tmp"
            return 1
          }

          for base in "$DEPLOYMENT_URL" "https://www.toonstudio.cloud"; do
            check_page "$base/"
            check_page "$base/market"
            check_json_api "$base"
          done
          echo "Root, market page, and public marketplace API smoke tests passed." >> "$GITHUB_STEP_SUMMARY"
