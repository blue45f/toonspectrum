name: Production readiness (audit only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness
  cancel-in-progress: false

jobs:
  reconcile-and-deploy:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_PROJECT_NAME: toonspectrum
      VERCEL_CLI_VERSION: "58.9.4"
      VERCEL_TELEMETRY_DISABLED: "1"
      PUBLIC_APP_ORIGIN: https://www.toonstudio.cloud
      DATABASE_URL_VALUE: ${{ secrets.DATABASE_URL }}
      AUTH_SESSION_SECRET_VALUE: ${{ secrets.AUTH_SESSION_SECRET }}
      AUTH_STATE_SECRET_VALUE: ${{ secrets.AUTH_STATE_SECRET }}
      GOOGLE_OAUTH_CLIENT_ID_VALUE: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET_VALUE: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      KAKAO_REST_API_KEY_VALUE: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_OAUTH_CLIENT_ID_VALUE: ${{ secrets.KAKAO_OAUTH_CLIENT_ID }}
      KAKAO_CLIENT_SECRET_VALUE: ${{ secrets.KAKAO_CLIENT_SECRET }}
      KAKAO_OAUTH_CLIENT_SECRET_VALUE: ${{ secrets.KAKAO_OAUTH_CLIENT_SECRET }}
      KAKAO_APP_ID_VALUE: ${{ vars.KAKAO_APP_ID }}
      KAKAO_ADMIN_KEY_VALUE: ${{ secrets.KAKAO_ADMIN_KEY }}
      NAVER_OAUTH_CLIENT_ID_VALUE: ${{ secrets.NAVER_OAUTH_CLIENT_ID }}
      NAVER_CLIENT_ID_VALUE: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_OAUTH_CLIENT_SECRET_VALUE: ${{ secrets.NAVER_OAUTH_CLIENT_SECRET }}
      NAVER_CLIENT_SECRET_VALUE: ${{ secrets.NAVER_CLIENT_SECRET }}
      GITHUB_OAUTH_CLIENT_ID_VALUE: ${{ secrets.TOONSTUDIO_GITHUB_OAUTH_CLIENT_ID }}
      GITHUB_OAUTH_CLIENT_SECRET_VALUE: ${{ secrets.TOONSTUDIO_GITHUB_OAUTH_CLIENT_SECRET }}
      KAKAO_ACCOUNT_EMAIL_SCOPE_ENABLED_VALUE: ${{ vars.KAKAO_ACCOUNT_EMAIL_SCOPE_ENABLED }}
      OPENAI_API_KEY_VALUE: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY_VALUE: ${{ secrets.OPENROUTER_API_KEY }}
      BLOB_READ_WRITE_TOKEN_VALUE: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      R2_ACCOUNT_ID_VALUE: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID_VALUE: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY_VALUE: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_VALUE: ${{ secrets.R2_BUCKET }}
      S3_ENDPOINT_VALUE: ${{ secrets.S3_ENDPOINT }}
      S3_REGION_VALUE: ${{ secrets.S3_REGION }}
      S3_ACCESS_KEY_ID_VALUE: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY_VALUE: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET_VALUE: ${{ secrets.S3_BUCKET }}
      CREATOR_ASSET_OBJECT_STORAGE_ENDPOINT_VALUE: ${{ secrets.CREATOR_ASSET_OBJECT_STORAGE_ENDPOINT }}
      CREATOR_ASSET_OBJECT_STORAGE_BUCKET_VALUE: ${{ secrets.CREATOR_ASSET_OBJECT_STORAGE_BUCKET }}
      CREATOR_ASSET_OBJECT_STORAGE_ACCESS_KEY_ID_VALUE: ${{ secrets.CREATOR_ASSET_OBJECT_STORAGE_ACCESS_KEY_ID }}
      CREATOR_ASSET_OBJECT_STORAGE_SECRET_ACCESS_KEY_VALUE: ${{ secrets.CREATOR_ASSET_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      PRIVATE_OBJECT_STORAGE_ENABLED_VALUE: ${{ secrets.PRIVATE_OBJECT_STORAGE_ENABLED }}
      PRIVATE_OBJECT_STORAGE_SOURCE_PROVIDER_VALUE: ${{ secrets.PRIVATE_OBJECT_STORAGE_SOURCE_PROVIDER }}
      PRIVATE_OBJECT_STORAGE_DERIVED_PROVIDER_VALUE: ${{ secrets.PRIVATE_OBJECT_STORAGE_DERIVED_PROVIDER }}
      PRIVATE_OBJECT_STORAGE_EXPORT_PROVIDER_VALUE: ${{ secrets.PRIVATE_OBJECT_STORAGE_EXPORT_PROVIDER }}
      PRIVATE_OBJECT_STORAGE_ROUTING_FINGERPRINT_VALUE: ${{ secrets.PRIVATE_OBJECT_STORAGE_ROUTING_FINGERPRINT }}
      PRIVATE_OBJECT_STORAGE_QUOTA_GUARD_ENABLED_VALUE: ${{ secrets.PRIVATE_OBJECT_STORAGE_QUOTA_GUARD_ENABLED }}
      PRIVATE_OBJECT_STORAGE_QUOTA_SNAPSHOTS_JSON_VALUE: ${{ secrets.PRIVATE_OBJECT_STORAGE_QUOTA_SNAPSHOTS_JSON }}
      SUPABASE_OBJECT_STORAGE_ENABLED_VALUE: ${{ secrets.SUPABASE_OBJECT_STORAGE_ENABLED }}
      SUPABASE_OBJECT_STORAGE_URL_VALUE: ${{ secrets.SUPABASE_OBJECT_STORAGE_URL }}
      SUPABASE_OBJECT_STORAGE_SERVICE_ROLE_KEY_VALUE: ${{ secrets.SUPABASE_OBJECT_STORAGE_SERVICE_ROLE_KEY }}
      SUPABASE_OBJECT_STORAGE_SOURCE_BUCKET_VALUE: ${{ secrets.SUPABASE_OBJECT_STORAGE_SOURCE_BUCKET }}
      SUPABASE_OBJECT_STORAGE_DERIVED_BUCKET_VALUE: ${{ secrets.SUPABASE_OBJECT_STORAGE_DERIVED_BUCKET }}
      SUPABASE_OBJECT_STORAGE_EXPORT_BUCKET_VALUE: ${{ secrets.SUPABASE_OBJECT_STORAGE_EXPORT_BUCKET }}
      SUPABASE_OBJECT_STORAGE_TIMEOUT_MS_VALUE: ${{ secrets.SUPABASE_OBJECT_STORAGE_TIMEOUT_MS }}
      SUPABASE_OBJECT_STORAGE_MAXIMUM_ASSET_BYTES_VALUE: ${{ secrets.SUPABASE_OBJECT_STORAGE_MAXIMUM_ASSET_BYTES }}
      SUPABASE_OBJECT_STORAGE_MAXIMUM_CONTROL_METADATA_BYTES_VALUE: ${{ secrets.SUPABASE_OBJECT_STORAGE_MAXIMUM_CONTROL_METADATA_BYTES }}
      SUPABASE_OBJECT_STORAGE_MAXIMUM_RESPONSE_BYTES_VALUE: ${{ secrets.SUPABASE_OBJECT_STORAGE_MAXIMUM_RESPONSE_BYTES }}
      R2_OBJECT_STORAGE_ENABLED_VALUE: ${{ secrets.R2_OBJECT_STORAGE_ENABLED }}
      R2_OBJECT_STORAGE_ENDPOINT_VALUE: ${{ secrets.R2_OBJECT_STORAGE_ENDPOINT }}
      R2_OBJECT_STORAGE_REGION_VALUE: ${{ secrets.R2_OBJECT_STORAGE_REGION }}
      R2_OBJECT_STORAGE_ACCESS_KEY_ID_VALUE: ${{ secrets.R2_OBJECT_STORAGE_ACCESS_KEY_ID }}
      R2_OBJECT_STORAGE_SECRET_ACCESS_KEY_VALUE: ${{ secrets.R2_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      R2_OBJECT_STORAGE_SOURCE_BUCKET_VALUE: ${{ secrets.R2_OBJECT_STORAGE_SOURCE_BUCKET }}
      R2_OBJECT_STORAGE_DERIVED_BUCKET_VALUE: ${{ secrets.R2_OBJECT_STORAGE_DERIVED_BUCKET }}
      R2_OBJECT_STORAGE_EXPORT_BUCKET_VALUE: ${{ secrets.R2_OBJECT_STORAGE_EXPORT_BUCKET }}
      R2_OBJECT_STORAGE_PRIVATE_BUCKETS_CONFIRMED_VALUE: ${{ secrets.R2_OBJECT_STORAGE_PRIVATE_BUCKETS_CONFIRMED }}
      R2_OBJECT_STORAGE_TIMEOUT_MS_VALUE: ${{ secrets.R2_OBJECT_STORAGE_TIMEOUT_MS }}
      R2_OBJECT_STORAGE_MAXIMUM_ASSET_BYTES_VALUE: ${{ secrets.R2_OBJECT_STORAGE_MAXIMUM_ASSET_BYTES }}
      R2_OBJECT_STORAGE_MAXIMUM_CONTROL_METADATA_BYTES_VALUE: ${{ secrets.R2_OBJECT_STORAGE_MAXIMUM_CONTROL_METADATA_BYTES }}
      B2_OBJECT_STORAGE_ENABLED_VALUE: ${{ secrets.B2_OBJECT_STORAGE_ENABLED }}
      B2_OBJECT_STORAGE_ENDPOINT_VALUE: ${{ secrets.B2_OBJECT_STORAGE_ENDPOINT }}
      B2_OBJECT_STORAGE_REGION_VALUE: ${{ secrets.B2_OBJECT_STORAGE_REGION }}
      B2_OBJECT_STORAGE_ACCESS_KEY_ID_VALUE: ${{ secrets.B2_OBJECT_STORAGE_ACCESS_KEY_ID }}
      B2_OBJECT_STORAGE_SECRET_ACCESS_KEY_VALUE: ${{ secrets.B2_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      B2_OBJECT_STORAGE_SOURCE_BUCKET_VALUE: ${{ secrets.B2_OBJECT_STORAGE_SOURCE_BUCKET }}
      B2_OBJECT_STORAGE_DERIVED_BUCKET_VALUE: ${{ secrets.B2_OBJECT_STORAGE_DERIVED_BUCKET }}
      B2_OBJECT_STORAGE_EXPORT_BUCKET_VALUE: ${{ secrets.B2_OBJECT_STORAGE_EXPORT_BUCKET }}
      B2_OBJECT_STORAGE_PRIVATE_BUCKETS_CONFIRMED_VALUE: ${{ secrets.B2_OBJECT_STORAGE_PRIVATE_BUCKETS_CONFIRMED }}
      B2_OBJECT_STORAGE_TIMEOUT_MS_VALUE: ${{ secrets.B2_OBJECT_STORAGE_TIMEOUT_MS }}
      B2_OBJECT_STORAGE_MAXIMUM_ASSET_BYTES_VALUE: ${{ secrets.B2_OBJECT_STORAGE_MAXIMUM_ASSET_BYTES }}
      B2_OBJECT_STORAGE_MAXIMUM_CONTROL_METADATA_BYTES_VALUE: ${{ secrets.B2_OBJECT_STORAGE_MAXIMUM_CONTROL_METADATA_BYTES }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "::error::GitHub production environment secret VERCEL_TOKEN is missing."
            exit 1
          fi
          if [[ -z "${VERCEL_PROJECT_ID:-}" || -z "${VERCEL_ORG_ID:-}" ]]; then
            echo "::error::VERCEL_PROJECT_ID and VERCEL_ORG_ID are both required for the pinned Vercel CLI."
            exit 1
          fi
          echo "Vercel deployment credentials are available."

      # Environment mutation and source-build deployment were retired by owner policy 2026-09-14.
      - name: Reconcile production variables without exposing values
        shell: bash
        run: |
          set -euo pipefail
          node scripts/configure-vercel-production.mjs --audit-only
