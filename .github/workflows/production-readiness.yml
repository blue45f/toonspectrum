name: Production readiness (audit only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness
  cancel-in-progress: false

jobs:
  audit:
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RENDER_CORE_API_ORIGIN: https://toonspectrum-core-api.onrender.com
      PUBLIC_APP_ORIGIN: https://www.toonstudio.cloud
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify free-infrastructure boundaries
        run: pnpm run verify:free-infrastructure

      - name: Verify Render Core API authority
        run: pnpm run verify:render-core-origin

      - name: Verify production edge does not traverse Vercel
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT
          curl --fail --silent --show-error --max-time 120 \
            --dump-header "$headers" \
            --output "$body" \
            "${PUBLIC_APP_ORIGIN}/api/auth/providers"
          if grep -Eiq '^(x-vercel-id|x-vercel-cache):' "$headers"; then
            echo "::error::Production API still traverses Vercel."
            exit 1
          fi
          grep -Eiq '^x-render-origin-server: Render' "$headers"
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$body"
          echo "Cloudflare edge and Render Core API authority verified."
