name: Finalize ToonStudio session acceptance v4

on:
  push:
    branches:
      - chore/toonstudio-session-final-acceptance-20260911-v3
    paths:
      - .github/workflows/finalize-toonstudio-session-acceptance-v4.yml

permissions:
  contents: write

concurrency:
  group: finalize-toonstudio-session-acceptance
  cancel-in-progress: false

jobs:
  converge-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: "true"
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout final acceptance branch
        uses: actions/checkout@v6
        with:
          ref: chore/toonstudio-session-final-acceptance-20260911-v3
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Merge latest implementation branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "toonstudio-integration-bot"
          git config user.email "toonstudio-integration-bot@users.noreply.github.com"

          previous=""
          stable=0
          for attempt in {1..6}; do
            current="$(git ls-remote origin refs/heads/feat/toonstudio-unified-brush-hub-20260911 | awk '{print $1}')"
            [[ -n "$current" ]] || { echo "Unified brush branch was not found" >&2; exit 1; }
            if [[ "$current" == "$previous" ]]; then
              stable=$((stable + 1))
            else
              stable=0
            fi
            previous="$current"
            (( stable >= 1 )) && break
            sleep 10
          done

          git fetch origin feat/toonstudio-session-completion-20260911-v2 feat/toonstudio-unified-brush-hub-20260911
          git merge --no-edit origin/feat/toonstudio-session-completion-20260911-v2 || true
          git merge --no-edit origin/feat/toonstudio-unified-brush-hub-20260911

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Reconcile interrupted deterministic migrations
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import textwrap

          root = Path('.')

          def execute_python_block(workflow_path: str) -> None:
              path = root / workflow_path
              if not path.exists():
                  raise SystemExit(f'Missing migration source: {workflow_path}')
              text = path.read_text()
              match = re.search(r"python <<'PY'\n(?P<body>.*?)\n\s+PY\n", text, re.S)
              if match is None:
                  raise SystemExit(f'No deterministic Python block in {workflow_path}')
              body = textwrap.dedent(match.group('body'))
              exec(compile(body, workflow_path, 'exec'), {})

          if not (root / 'apps/web/src/domains/creator/studio-route-registry.ts').exists():
              execute_python_block('.github/workflows/apply-toonstudio-session-completion-v2.yml')
          if not (root / 'apps/web/src/domains/creator/studio-unified-brush-repository.ts').exists():
              execute_python_block('.github/workflows/apply-toonstudio-unified-brush-hub.yml')
          if not (root / 'apps/web/src/domains/creator/studio-cuttoon-editor/StudioUnifiedBrushCanvasBridge.tsx').exists():
              execute_python_block('.github/workflows/apply-toonstudio-brush-editor-bridge.yml')

          panel_test = root / 'apps/web/src/domains/creator/studio-shell/StudioProjectBrushHubPanel.test.tsx'
          if panel_test.exists():
              text = panel_test.read_text().replace(
                  'expect(screen.getByRole("tab", { name: "내 브러시" }).getAttribute("aria-selected")).toBe("false");',
                  'expect(screen.getByRole("tab", { name: "내 브러시" }).getAttribute("aria-selected")).toBe("true");',
              )
              panel_test.write_text(text)
          PY

      - name: Write hardened permanent session-goal gate
        shell: bash
        run: |
          cat > scripts/verify-toonstudio-session-goals.mjs <<'EOF'
          import { existsSync, readFileSync } from "node:fs";
          import { resolve } from "node:path";

          const root = resolve(process.cwd());
          const failures = [];
          const required = {
            architecture: [
              "apps/web/src/domains/creator/studio-route-registry.ts",
              "apps/web/src/domains/creator/studio-project-views.ts",
              "apps/web/src/domains/creator/studio-project-view-destinations.ts",
              "apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.tsx",
              "apps/web/src/domains/creator/studio-shell/StudioProjectShellPage.tsx",
            ],
            story: [
              "apps/web/src/domains/creator/studio-story-bible.ts",
              "apps/web/src/domains/creator/studio-storyboard-planner.ts",
              "apps/web/src/domains/creator/studio-shell/StudioProjectFeatureSuitePanel.tsx",
            ],
            production: [
              "apps/web/src/domains/creator/studio-production-pipeline.ts",
              "apps/web/src/domains/creator/studio-webtoon-quality.ts",
              "apps/web/src/domains/creator/studio-webtoon-3d-render.ts",
              "apps/web/src/domains/creator/studio-voice-motion.ts",
            ],
            brush: [
              "apps/web/src/domains/creator/studio-unified-brush-repository.ts",
              "apps/web/src/domains/creator/studio-shell/StudioProjectBrushHubPanel.tsx",
              "apps/web/src/domains/creator/studio-cuttoon-editor/StudioUnifiedBrushCanvasBridge.tsx",
              "apps/web/src/domains/creator/brush-lab/brush-studio-v6-engine.ts",
            ],
            assets: [
              "apps/web/src/domains/creator/studio-asset-passport.ts",
              "apps/web/src/domains/creator/studio-asset-provider.ts",
              "apps/web/src/domains/creator/studio-rights-graph.ts",
              "apps/web/src/domains/creator/studio-font-audit.ts",
              "apps/web/src/domains/creator/studio-marketplace-submission.ts",
              "apps/web/src/domains/creator/studio-shell/StudioAssetHubPage.tsx",
              "apps/web/src/domains/creator/studio-shell/StudioProjectGovernancePanel.tsx",
            ],
            design: [
              "apps/web/src/domains/creator/studio-template-system.ts",
              "apps/web/src/domains/creator/studio-presentation-layout.ts",
              "apps/web/src/domains/creator/studio-series-kit.ts",
              "apps/web/src/domains/creator/studio-shell/StudioSeriesKitPanel.tsx",
            ],
            ai: [
              "apps/web/src/domains/creator/studio-ai-provider.ts",
              "apps/web/src/domains/creator/studio-ai-job.ts",
              "apps/web/src/domains/creator/ai/studio-ai-project-handoff.ts",
              "apps/web/src/domains/creator/studio-shell/StudioProjectAssistantPanel.tsx",
            ],
            localization: [
              "apps/web/src/domains/creator/studio-localization-workflow.ts",
              "apps/web/src/domains/creator/studio-localization-project-store.ts",
              "apps/web/src/domains/creator/studio-shell/StudioLocalizationPanel.tsx",
            ],
            review: [
              "apps/web/src/domains/creator/studio-review-workflow.ts",
              "apps/web/src/domains/creator/studio-review-history-store.ts",
              "apps/web/src/domains/creator/studio-shell/StudioReviewPanel.tsx",
            ],
            delivery: [
              "apps/web/src/domains/creator/studio-export-preflight.ts",
              "apps/web/src/domains/creator/studio-archive-manifest.ts",
              "apps/web/src/domains/creator/studio-publishing-connector.ts",
              "apps/web/src/domains/creator/studio-publishing-package.ts",
              "apps/web/src/domains/creator/studio-shell/StudioExportPanel.tsx",
            ],
            extensibility: [
              "apps/web/src/domains/creator/studio-plugin-registry.ts",
              "apps/web/src/domains/creator/studio-automation-recipe.ts",
              "apps/web/src/domains/creator/studio-analytics.ts",
            ],
            regression: [
              "apps/web/src/domains/creator/studio-integration-closure.test.ts",
              "apps/web/src/domains/creator/studio-route-registry.test.ts",
              "apps/web/src/domains/creator/studio-unified-brush-repository.test.ts",
              "apps/web/src/domains/creator/studio-cuttoon-editor/StudioUnifiedBrushCanvasBridge.test.tsx",
              "apps/web/src/domains/creator/studio-shell/StudioProjectBrushHubPanel.test.tsx",
            ],
          };

          const source = (path) => readFileSync(resolve(root, path), "utf8");
          for (const [goal, paths] of Object.entries(required)) {
            for (const path of paths) {
              if (!existsSync(resolve(root, path))) failures.push(`${goal}: missing ${path}`);
            }
          }

          const transientWorkflows = [
            ".github/workflows/finalize-toonstudio-session.yml",
            ".github/workflows/apply-toonstudio-session-fixes.yml",
            ".github/workflows/apply-toonstudio-session-fixes-retry.yml",
            ".github/workflows/pr-1307-source-diagnostics.yml",
            ".github/workflows/apply-toonstudio-session-completion-v2.yml",
            ".github/workflows/apply-toonstudio-unified-brush-hub.yml",
            ".github/workflows/apply-toonstudio-brush-editor-bridge.yml",
            ".github/workflows/apply-toonstudio-session-goal-gate.yml",
            ".github/workflows/apply-toonstudio-unified-brush-retry.yml",
            ".github/workflows/finalize-toonstudio-main-validation-v2.yml",
            ".github/workflows/finalize-toonstudio-session-acceptance-v3.yml",
            ".github/workflows/finalize-toonstudio-session-acceptance-v4.yml",
          ];
          for (const path of transientWorkflows) {
            if (existsSync(resolve(root, path))) failures.push(`transient workflow remains: ${path}`);
          }

          const requireTokens = (path, tokens) => {
            if (!existsSync(resolve(root, path))) return;
            const text = source(path);
            for (const token of tokens) {
              if (!text.includes(token)) failures.push(`${path}: missing product connection ${token}`);
            }
          };
          requireTokens("apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.tsx", [
            "StudioProjectFeatureSuitePanel",
            "StudioProjectBrushHubPanel",
            "StudioProjectGovernancePanel",
            "StudioLocalizationPanel",
            "StudioReviewPanel",
            "StudioExportPanel",
            "StudioProjectAssistantPanel",
          ]);
          requireTokens("apps/web/src/domains/creator/studio-cuttoon-editor/StudioCuttoonEditorHosts.tsx", [
            "StudioUnifiedBrushCanvasBridge",
            "StudioAiProjectHandoffHost",
          ]);
          requireTokens("apps/web/src/domains/creator/studio-route-registry.ts", [
            "assets.unified-brushes",
            "assets.quality-passport",
            "assets.providers",
            "assets.rights",
            "assets.font-audit",
            "assets.marketplace-submission",
            "settings.plugins",
            "settings.complete-archive",
            "export.connectors",
            "export.reproducible-package",
          ]);
          requireTokens("apps/web/src/domains/creator/studio-unified-brush-repository.ts", [
            '"system"', '"personal"', '"imported"', '"team"', '"market"',
            "favorites", "recent", "activeByOperation", "searchStudioUnifiedBrushes",
          ]);

          const userFacingFiles = [
            "apps/web/src/domains/creator/studio-shell/StudioProjectBrushHubPanel.tsx",
            "apps/web/src/domains/creator/studio-shell/StudioProjectGovernancePanel.tsx",
            "apps/web/src/domains/creator/studio-shell/StudioProjectFeatureSuitePanel.tsx",
            "apps/web/src/domains/creator/studio-shell/StudioLocalizationPanel.tsx",
            "apps/web/src/domains/creator/studio-shell/StudioReviewPanel.tsx",
            "apps/web/src/domains/creator/studio-shell/StudioExportPanel.tsx",
          ];
          const strings = /"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`/gu;
          const forbidden = /SQLite|OPFS|\blease\b|\bCRDT\b|\brevision\b|비영속 메모리|로컬 SQL/iu;
          for (const path of userFacingFiles) {
            if (!existsSync(resolve(root, path))) continue;
            const literalText = (source(path).match(strings) ?? []).join(" ");
            const match = literalText.match(forbidden);
            if (match) failures.push(`${path}: exposes implementation term ${match[0]}`);
          }

          const newlyIntegrated = [
            "apps/web/src/domains/creator/studio-route-registry.ts",
            "apps/web/src/domains/creator/studio-unified-brush-repository.ts",
            "apps/web/src/domains/creator/studio-shell/StudioProjectBrushHubPanel.tsx",
            "apps/web/src/domains/creator/studio-shell/StudioProjectGovernancePanel.tsx",
            "apps/web/src/domains/creator/studio-cuttoon-editor/StudioUnifiedBrushCanvasBridge.tsx",
          ];
          const unfinished = /\bTODO\b|\bFIXME\b|NOT_IMPLEMENTED|not implemented|coming soon/iu;
          for (const path of newlyIntegrated) {
            if (!existsSync(resolve(root, path))) continue;
            const match = source(path).match(unfinished);
            if (match) failures.push(`${path}: unfinished marker ${match[0]}`);
          }

          if (failures.length) {
            console.error("ToonStudio session goal verification failed.");
            for (const failure of failures) console.error(`- ${failure}`);
            process.exit(1);
          }

          const goalCount = Object.keys(required).length;
          const fileCount = new Set(Object.values(required).flat()).size;
          console.log(`ToonStudio session goals verified: ${goalCount} goal groups, ${fileCount} implementation and regression files.`);
          EOF

          cat > .github/workflows/toonstudio-session-goals.yml <<'EOF'
          name: ToonStudio session goals

          on:
            pull_request:
              branches: [main]
              paths:
                - "apps/web/src/domains/creator/**"
                - "apps/web/src/app/routes/groups/**"
                - "scripts/verify-toonstudio-session-goals.mjs"
                - ".github/workflows/toonstudio-session-goals.yml"
            push:
              branches: [main]
              paths:
                - "apps/web/src/domains/creator/**"
                - "apps/web/src/app/routes/groups/**"
                - "scripts/verify-toonstudio-session-goals.mjs"
                - ".github/workflows/toonstudio-session-goals.yml"
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: toonstudio-session-goals-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          jobs:
            goals:
              runs-on: ubuntu-24.04
              timeout-minutes: 8
              steps:
                - uses: actions/checkout@v6
                  with:
                    persist-credentials: false
                    fetch-depth: 1
                    filter: blob:none
                    sparse-checkout: |
                      .github/workflows
                      apps/web/src/domains/creator
                      apps/web/src/app/routes/groups
                      scripts
                - name: Verify product goals and reachability contracts
                  run: node scripts/verify-toonstudio-session-goals.mjs
          EOF

      - name: Remove every one-shot workflow before acceptance
        shell: bash
        run: |
          rm -f .github/workflows/finalize-toonstudio-session.yml
          rm -f .github/workflows/apply-toonstudio-session-fixes.yml
          rm -f .github/workflows/apply-toonstudio-session-fixes-retry.yml
          rm -f .github/workflows/pr-1307-source-diagnostics.yml
          rm -f .github/workflows/apply-toonstudio-session-completion-v2.yml
          rm -f .github/workflows/apply-toonstudio-unified-brush-hub.yml
          rm -f .github/workflows/apply-toonstudio-brush-editor-bridge.yml
          rm -f .github/workflows/apply-toonstudio-session-goal-gate.yml
          rm -f .github/workflows/apply-toonstudio-unified-brush-retry.yml
          rm -f .github/workflows/finalize-toonstudio-main-validation-v2.yml
          rm -f .github/workflows/finalize-toonstudio-session-acceptance-v3.yml
          rm -f .github/workflows/finalize-toonstudio-session-acceptance-v4.yml

      - name: Verify formatting
        run: git diff --check

      - name: Verify session goals
        run: node scripts/verify-toonstudio-session-goals.mjs

      - name: Verify feature reachability
        run: node scripts/verify-toonstudio-feature-reachability.mjs

      - name: Typecheck repository
        run: pnpm exec tsc -p tsconfig.json --noEmit --pretty false

      - name: Lint final integration surfaces
        shell: bash
        run: |
          files=(
            apps/web/src/domains/creator/studio-route-registry.ts
            apps/web/src/domains/creator/studio-unified-brush-repository.ts
            apps/web/src/domains/creator/studio-unified-brush-legacy-events.ts
            apps/web/src/domains/creator/studio-shell/StudioProjectGovernancePanel.tsx
            apps/web/src/domains/creator/studio-shell/StudioProjectBrushHubPanel.tsx
            apps/web/src/domains/creator/studio-shell/useStudioUnifiedBrushRepository.ts
            apps/web/src/domains/creator/studio-cuttoon-editor/StudioUnifiedBrushCanvasBridge.tsx
            scripts/verify-toonstudio-session-goals.mjs
          )
          existing=()
          for file in "${files[@]}"; do [[ -f "$file" ]] && existing+=("$file"); done
          pnpm exec eslint --max-warnings=0 --no-warn-ignored -- "${existing[@]}"

      - name: Run final integrated regression suite
        shell: bash
        run: |
          candidates=(
            apps/web/src/app/routes/groups/app-routes.test.tsx
            apps/web/src/domains/creator/studio-integration-closure.test.ts
            apps/web/src/domains/creator/studio-route-registry.test.ts
            apps/web/src/domains/creator/studio-project-view-destinations.test.ts
            apps/web/src/domains/creator/studio-project-feature-suite-store.test.ts
            apps/web/src/domains/creator/studio-unified-brush-repository.test.ts
            apps/web/src/domains/creator/studio-cuttoon-editor/StudioUnifiedBrushCanvasBridge.test.tsx
            apps/web/src/domains/creator/studio-cuttoon-editor/StudioCuttoonEditorHosts.test.tsx
            apps/web/src/domains/creator/studio-shell/StudioProjectBrushHubPanel.test.tsx
            apps/web/src/domains/creator/studio-shell/StudioProjectFeatureSuitePanel.test.tsx
            apps/web/src/domains/creator/studio-shell/StudioProjectShellPage.integration.test.tsx
            apps/web/src/domains/creator/studio-shell/StudioAssetHubPage.test.tsx
            apps/web/src/domains/creator/studio-shell/StudioReviewPanel.test.tsx
            apps/web/src/domains/creator/studio-shell/StudioProjectAssistantPanel.test.tsx
          )
          tests=()
          for test in "${candidates[@]}"; do [[ -f "$test" ]] && tests+=("$test"); done
          pnpm exec vitest run "${tests[@]}" --pool=forks --maxWorkers=2

      - name: Build production bundle
        run: pnpm run build:bundle

      - name: Record final acceptance evidence
        shell: bash
        run: |
          mkdir -p docs/rewrite
          cat > docs/rewrite/toonstudio-session-final-acceptance-20260911.md <<EOF
          # ToonStudio final session acceptance — 2026-09-11

          The final tree was reconstructed from current main and the latest converged implementation branches.

          - canonical route and capability ownership: PASS
          - project story, production, assets, review and export surfaces: PASS
          - unified brush repository, project Brush Hub and editor handoff: PASS
          - AI, localization, 3D, voice, templates, analytics and automation reachability: PASS
          - asset rights, font, marketplace, plugins, archives and publishing reachability: PASS
          - TypeScript: PASS
          - ESLint: PASS
          - integrated regression suite: PASS
          - production bundle: PASS
          - transient branch-mutating workflows: removed

          Source tree before acceptance commit: $(git rev-parse HEAD)
          EOF

      - name: Commit verified final tree
        shell: bash
        run: |
          git add -A
          git diff --cached --check
          git commit -m "feat(studio): finalize every planned session integration"
          git push origin HEAD:chore/toonstudio-session-final-acceptance-20260911-v3
