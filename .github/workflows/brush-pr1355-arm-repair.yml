name: Brush integration repair on ARM
on:
  push:
    branches: [feat/brush-material-engine-20260913]
    paths: [.github/workflows/brush-pr1355-arm-repair.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  repair:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
      - name: Apply the unchanged reviewed source corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, textwrap
          p = Path('.github/workflows/brush-pr1355-regression-repair.yml')
          data = p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest() == 'bad348f5fd04b888e75dffd456999626d1f83d9e'
          source = data.decode()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index('\n          PY', start)
          exec(compile(textwrap.dedent(source[start:end]), str(p), 'exec'))
          PY
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify inventory, all 32 handoffs and the explicit collaboration entry
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/brush-lab/brush-studio-v5-quality.test.ts
          apps/web/src/domains/creator/brush-lab/brush-studio-version-integration.test.ts
          apps/web/src/domains/creator/brush/studio-brush-selection.test.ts
          apps/web/src/domains/creator/studio-competitor-specialty-brush-expansion.test.ts
          apps/web/src/domains/creator/brush/studio-material-product-integration.test.ts
          apps/web/src/domains/creator/brush/studio-material-morphology-runtime.test.ts
          apps/web/src/domains/creator/brush/studio-brush-quality-portfolio.test.ts
          scripts/verify-studio-collaboration-entry.test.ts
      - name: Remove temporary helpers and push through the original hooks
        run: |
          test "$GITHUB_REF" = refs/heads/feat/brush-material-engine-20260913
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/brush-pr1355-arm-repair.yml .github/workflows/brush-pr1355-regression-repair.yml
          git add apps/web/src/domains/creator/brush-lab/brush-studio-v5-quality.test.ts apps/web/src/domains/creator/brush-lab/brush-studio-version-integration.test.ts apps/web/src/domains/creator/brush-lab/brush-studio-v5-quality-catalog.ts apps/web/src/domains/creator/brush/studio-brush-selection.test.ts apps/web/src/domains/creator/studio-competitor-specialty-brush-expansion.test.ts scripts/verify-studio-collaboration-sync.mts
          git diff --cached --check
          git commit -m 'fix(studio): repair material inventory and collaboration entry regressions'
          git push origin HEAD:feat/brush-material-engine-20260913
