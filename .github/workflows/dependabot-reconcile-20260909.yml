name: Reconcile Dependabot alerts

on:
  push:
    branches:
      - security/dependabot-reconcile-20260909
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    name: Audit lockfile and probe Dependabot status access
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - name: Reject advisory exclusions
        run: node scripts/verify-security-advisory-exceptions.mjs
      - name: Verify manifest and lockfile consistency
        run: pnpm install --frozen-lockfile --lockfile-only --ignore-scripts
      - name: Run the all-severity pnpm audit
        shell: bash
        run: |
          set -o pipefail
          pnpm audit --json --audit-level low | tee "$RUNNER_TEMP/pnpm-audit.json"
      - name: Publish the audit summary
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const { appendFileSync, existsSync, readFileSync } = require("node:fs");
          const path = `${process.env.RUNNER_TEMP}/pnpm-audit.json`;
          const lines = ["### Dependabot dependency audit", ""];
          if (!existsSync(path)) {
            lines.push("No pnpm audit report was produced.");
          } else {
            const report = JSON.parse(readFileSync(path, "utf8"));
            const metadata = report.metadata?.vulnerabilities ?? {};
            const severities = ["info", "low", "moderate", "high", "critical"];
            for (const severity of severities) {
              lines.push(`- ${severity}: ${metadata[severity] ?? 0}`);
            }
            lines.push(`- total: ${metadata.total ?? 0}`);
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          NODE
      - name: Probe the open-alert endpoint without hiding permission failures
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          async function main() {
            const url = new URL(
              `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/dependabot/alerts`,
            );
            url.searchParams.set("state", "open");
            url.searchParams.set("per_page", "100");
            const response = await fetch(url, {
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                "X-GitHub-Api-Version": "2022-11-28",
                "User-Agent": "toonspectrum-dependabot-reconcile",
              },
            });
            const body = await response.text();
            if (response.status === 403) {
              console.log("DEPENDABOT_ALERT_API_ACCESS=denied");
              console.log(body);
              return;
            }
            if (!response.ok) {
              throw new Error(`Dependabot API ${response.status}: ${body}`);
            }
            const alerts = JSON.parse(body);
            console.log("DEPENDABOT_ALERT_API_ACCESS=granted");
            console.log(`OPEN_DEPENDABOT_ALERT_COUNT_FIRST_PAGE=${alerts.length}`);
            for (const alert of alerts) {
              console.log([
                alert.number,
                alert.dependency?.package?.ecosystem ?? "unknown",
                alert.dependency?.package?.name ?? "unknown",
                alert.dependency?.manifest_path ?? "unknown",
                alert.security_advisory?.ghsa_id ?? "unknown",
                alert.security_advisory?.severity ?? "unknown",
                alert.security_vulnerability?.vulnerable_version_range ?? "unknown",
                alert.security_vulnerability?.first_patched_version?.identifier ?? "unavailable",
              ].join("\t"));
            }
            if (alerts.length > 0) process.exitCode = 1;
          }

          main().catch((error) => {
            console.error(error instanceof Error ? error.message : error);
            process.exitCode = 1;
          });
          NODE
