name: Remediate current Dependabot alerts

on:
  push:
    branches:
      - security/dependabot-reconcile-20260909
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependabot-remediation-20260909
  cancel-in-progress: true

jobs:
  remediate:
    name: Upgrade vulnerable packages and regenerate the lockfile
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: security/dependabot-reconcile-20260909
          sparse-checkout: |
            /package.json
            /pnpm-lock.yaml
            /pnpm-workspace.yaml
            /apps/*/package.json
            /packages/*/package.json
            /patches/
          sparse-checkout-cone-mode: false
      - uses: pnpm/action-setup@v6

      - name: Raise every affected dependency to its patched release
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { existsSync, readFileSync, readdirSync, writeFileSync } = require("node:fs");
          const { join } = require("node:path");

          const manifests = ["package.json"];
          for (const parent of ["apps", "packages"]) {
            if (!existsSync(parent)) continue;
            for (const child of readdirSync(parent, { withFileTypes: true })) {
              if (!child.isDirectory()) continue;
              const manifest = join(parent, child.name, "package.json");
              if (existsSync(manifest)) manifests.push(manifest);
            }
          }

          const alignedVitestPackages = new Map([
            ["vitest", "4.1.11"],
            ["@vitest/coverage-v8", "4.1.11"],
            ["@vitest/ui", "4.1.11"],
          ]);
          const changedManifests = [];
          for (const manifest of manifests) {
            const json = JSON.parse(readFileSync(manifest, "utf8"));
            let changed = false;
            for (const section of ["dependencies", "devDependencies", "optionalDependencies"]) {
              if (!json[section]) continue;
              for (const [name, version] of alignedVitestPackages) {
                if (Object.hasOwn(json[section], name) && json[section][name] !== version) {
                  json[section][name] = version;
                  changed = true;
                }
              }
            }
            if (changed) {
              writeFileSync(manifest, `${JSON.stringify(json, null, 2)}\n`);
              changedManifests.push(manifest);
            }
          }
          if (changedManifests.length === 0) {
            throw new Error("No direct Vitest manifest pins were updated; expected at least the root manifest.");
          }
          console.log(`Updated Vitest family pins in: ${changedManifests.join(", ")}`);

          let workspace = readFileSync("pnpm-workspace.yaml", "utf8");
          function replaceExactlyOnce(before, after) {
            const first = workspace.indexOf(before);
            if (first === -1) throw new Error(`Expected workspace entry was not found: ${before.trim()}`);
            if (workspace.indexOf(before, first + before.length) !== -1) {
              throw new Error(`Workspace entry is ambiguous: ${before.trim()}`);
            }
            workspace = workspace.replace(before, after);
          }

          replaceExactlyOnce("  multer: '>=2.2.0'\n", "  multer: '>=2.3.0'\n");
          replaceExactlyOnce(
            "  'js-yaml@>=4.0.0 <4.3.1': 4.3.1\n",
            "  'js-yaml@>=4.0.0 <4.3.2': 4.3.2\n",
          );
          replaceExactlyOnce("  'sharp@<0.35.0': 0.35.2\n", "  'sharp@<0.35.4': 0.35.4\n");
          replaceExactlyOnce("  vitest: '4.1.9'\n", "  vitest: '4.1.11'\n");
          replaceExactlyOnce(
            "  '@vitest/coverage-v8': '4.1.9'\n",
            "  '@vitest/coverage-v8': '4.1.11'\n",
          );
          replaceExactlyOnce("  '@vitest/ui': '4.1.9'\n", "  '@vitest/ui': '4.1.11'\n");

          const colordOverride = "  'colord@<2.9.4': 2.9.4\n";
          if (!workspace.includes(colordOverride)) {
            replaceExactlyOnce(
              "  form-data: '>=4.0.6'\n",
              `  form-data: '>=4.0.6'\n${colordOverride}`,
            );
          }
          const mockerOverride = "  '@vitest/mocker@>=2.1.0 <4.1.11': 4.1.11\n";
          if (!workspace.includes(mockerOverride)) {
            replaceExactlyOnce(
              "  '@vitest/ui': '4.1.11'\n",
              `  '@vitest/ui': '4.1.11'\n${mockerOverride}`,
            );
          }
          writeFileSync("pnpm-workspace.yaml", workspace);
          NODE

      - name: Regenerate the committed pnpm dependency graph
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Verify manifests and regenerated lockfile are reproducible
        run: pnpm install --frozen-lockfile --lockfile-only --ignore-scripts

      - name: Require zero advisories at every severity
        shell: bash
        run: |
          set -o pipefail
          pnpm audit --json --audit-level low | tee "$RUNNER_TEMP/pnpm-audit.json"

      - name: Commit the verified dependency remediation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' changed < <(git diff --name-only -z)
          if (( ${#changed[@]} == 0 )); then
            echo "No dependency files changed."
            exit 0
          fi
          printf 'Verified dependency changes:\n'
          printf '  %s\n' "${changed[@]}"
          git add -- "${changed[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(security): resolve current Dependabot advisories"
          git push origin HEAD:security/dependabot-reconcile-20260909
