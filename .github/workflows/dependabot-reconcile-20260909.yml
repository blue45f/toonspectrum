name: Reconcile Dependabot alerts

on:
  push:
    branches:
      - security/dependabot-reconcile-20260909
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  alerts:
    name: Read GitHub Dependabot alert state
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Read every open Dependabot alert
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { writeFileSync } = require("node:fs");

          async function main() {
            const alerts = [];
            for (let page = 1; ; page += 1) {
              const url = new URL(
                `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/dependabot/alerts`,
              );
              url.searchParams.set("state", "open");
              url.searchParams.set("per_page", "100");
              url.searchParams.set("page", String(page));
              const response = await fetch(url, {
                headers: {
                  Accept: "application/vnd.github+json",
                  Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "toonspectrum-dependabot-reconcile",
                },
              });
              if (!response.ok) {
                const body = await response.text();
                throw new Error(`Dependabot API ${response.status}: ${body}`);
              }
              const pageAlerts = await response.json();
              alerts.push(...pageAlerts);
              if (pageAlerts.length < 100) break;
            }

            writeFileSync(
              `${process.env.RUNNER_TEMP}/dependabot-open-alerts.json`,
              `${JSON.stringify(alerts, null, 2)}\n`,
            );
            console.log(`OPEN_DEPENDABOT_ALERT_COUNT=${alerts.length}`);
            for (const alert of alerts) {
              const row = [
                alert.number,
                alert.dependency?.package?.ecosystem ?? "unknown",
                alert.dependency?.package?.name ?? "unknown",
                alert.dependency?.manifest_path ?? "unknown",
                alert.dependency?.scope ?? "unknown",
                alert.security_advisory?.ghsa_id ?? "unknown",
                alert.security_advisory?.severity ?? "unknown",
                alert.security_vulnerability?.vulnerable_version_range ?? "unknown",
                alert.security_vulnerability?.first_patched_version?.identifier ?? "unavailable",
              ];
              console.log(row.join("\t"));
            }
            if (alerts.length > 0) process.exitCode = 1;
          }

          main().catch((error) => {
            console.error(error instanceof Error ? error.message : error);
            process.exitCode = 1;
          });
          NODE

  audit:
    name: Audit the exact pnpm dependency graph
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install the exact dependency graph
        run: pnpm install --frozen-lockfile
      - name: Run the repository all-severity security audit
        run: pnpm run audit:security
