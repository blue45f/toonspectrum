name: Studio asset UI source snapshot
on:
  push:
    branches: [feat/studio-asset-browser-quality-20260906]
    paths: [.github/workflows/studio-asset-ui-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Export tracked source only, without fonts or credentials
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, tarfile, os
          root = pathlib.Path.cwd()
          paths = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          allowed = {'.ts','.tsx','.mts','.cts','.js','.jsx','.mjs','.cjs','.json','.yaml','.yml','.css','.scss','.html','.md','.py','.sql','.toml','.svg'}
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'studio-source.tar.gz'
          with tarfile.open(out, 'w:gz') as t:
              for rel in paths:
                  p = root / rel
                  if not rel or p.is_symlink() or not p.is_file() or p.stat().st_size > 16*1024*1024: continue
                  if p.suffix not in allowed and p.name not in {'.gitignore','.npmrc','.nvmrc'}: continue
                  if any(part in {'.git','node_modules','.secrets'} for part in p.parts) or p.name.startswith('.env'): continue
                  t.add(p, arcname=rel, recursive=False)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: studio-asset-ui-source
          path: ${{ runner.temp }}/studio-source.tar.gz
          retention-days: 2
