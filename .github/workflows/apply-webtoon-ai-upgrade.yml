name: Apply verified webtoon AI upgrade

on:
  push:
    branches:
      - feat/webtoon-ai-quality-ux-20260905

permissions:
  contents: write

concurrency:
  group: apply-webtoon-ai-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-commit:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Verify, reconcile, apply, and commit the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import lzma

          parts = Path(".github/patches")
          first = base64.b64encode((parts / "ai-upgrade.part01.bin").read_bytes()).decode("ascii")
          if len(first) != 1000 or first[761] != "d":
              raise SystemExit("unexpected part01 transport payload")
          first = first[:761] + "i" + first[762:]

          payload = bytearray(base64.b64decode(first))
          for index in range(2, 16):
              payload.extend((parts / f"ai-upgrade.part{index:02d}.bin").read_bytes())

          expected_xz = "6b229ea78b9b910ad7227b2a1c8463209eb323c6bed1139c7590a709dfb7297e"
          if hashlib.sha256(payload).hexdigest() != expected_xz:
              raise SystemExit("verified XZ payload hash mismatch")

          patch = lzma.decompress(bytes(payload))
          expected_patch = "8cc17b1d66ce770c75c0996b263475e77a436828c84941ed4a63f51810646def"
          if hashlib.sha256(patch).hexdigest() != expected_patch:
              raise SystemExit("reviewed patch hash mismatch")
          Path("/tmp/toonstudio-webtoon-ai-upgrade.patch").write_bytes(patch)
          PY

          git apply --check --whitespace=error-all \
            --exclude=src/domains/creator/ai/StudioAiToolPopoverBody.tsx \
            --exclude=src/domains/creator/ai/StudioAiCompositionPanel.tsx \
            /tmp/toonstudio-webtoon-ai-upgrade.patch
          git apply --whitespace=error-all \
            --exclude=src/domains/creator/ai/StudioAiToolPopoverBody.tsx \
            --exclude=src/domains/creator/ai/StudioAiCompositionPanel.tsx \
            /tmp/toonstudio-webtoon-ai-upgrade.patch

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one reconciliation anchor, found {count}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          tool = Path("src/domains/creator/ai/StudioAiToolPopoverBody.tsx")
          replace_once(
              tool,
              'import { Suspense } from "react";',
              'import { Suspense, useEffect, useState } from "react";',
          )
          replace_once(
              tool,
              'import { isStudioAiConfigured } from "./studio-ai-client";\n',
              '''import { isStudioAiConfigured } from "./studio-ai-client";
          import {
            consumeStudioAiSuperSuiteOpenRequest,
            subscribeStudioAiSuperSuiteOpenRequest,
          } from "./studio-ai-super-suite-intent";
          import { compileStudioAiSuitePromptHandoff } from "./studio-ai-suite-handoff";
          ''',
          )
          replace_once(
              tool,
              'import { useT } from "@/lib/i18n";\n',
              '''import { useT } from "@/lib/i18n";
          import { lazyRetry } from "@/lib/lazy-retry";

          const StudioAiSuperSuiteModal = lazyRetry(
            () =>
              import("./StudioAiSuperSuiteModal").then((mod) => ({
                default: mod.StudioAiSuperSuiteModal,
              })),
            "StudioAiSuperSuiteModal"
          );
          ''',
          )
          replace_once(
              tool,
              '  const t = useT();\n  const lt =',
              '''  const t = useT();
            const [aiSuperSuiteOpen, setAiSuperSuiteOpen] = useState(() =>
              consumeStudioAiSuperSuiteOpenRequest()
            );
            useEffect(
              () => subscribeStudioAiSuperSuiteOpenRequest(() => setAiSuperSuiteOpen(true)),
              []
            );
            const lt =''',
          )
          replace_once(
              tool,
              '  } = toolBelt.stableHandlers;\n\n  return (',
              '''  } = toolBelt.stableHandlers;

            const applySuperSuitePrompt = (prompt: string) => {
              setAiAssistTool("background");
              setAiBgPrompt(prompt);
              setMenu("aiAssist");
              setAiSuperSuiteOpen(false);
            };

            return (''',
          )
          replace_once(
              tool,
              '              onApplyPresetPrompt={applyAiAssistPresetPrompt}\n              providerSlot={',
              '''              onApplyPresetPrompt={applyAiAssistPresetPrompt}
                            onOpenScenario={() => {
                              if (masterEditMode) return;
                              setScenarioOpen(true);
                              setMenu(null);
                            }}
                            scenarioDisabled={masterEditMode}
                            scenarioDisabledReason="마스터 편집 중에는 시나리오 제작을 사용할 수 없어요."
                            onOpenSuperSuite={() => {
                              setAiSuperSuiteOpen(true);
                            }}
                            providerSlot={''',
          )

          text = tool.read_text(encoding="utf-8")
          closing = '    </>\n  );\n}'
          index = text.rfind(closing)
          if index < 0:
              raise SystemExit(f"{tool}: final fragment anchor not found")
          modal = '''      {aiSuperSuiteOpen ? (
                  <Suspense
                    fallback={
                      <div
                        className="fixed inset-0 z-[120] grid place-items-center bg-black/45 p-4 backdrop-blur-sm"
                        role="status"
                        aria-live="polite"
                      >
                        <div className="rounded-xl border border-line bg-panel px-4 py-3 text-sm font-semibold text-fg shadow-xl">
                          AI 웹툰 레시피 도구를 여는 중…
                        </div>
                      </div>
                    }
                  >
                    <StudioAiSuperSuiteModal
                      open
                      onClose={() => setAiSuperSuiteOpen(false)}
                      onApplyPrompt={applySuperSuitePrompt}
                      onApplyPromptRecipe={(handoff) =>
                        applySuperSuitePrompt(compileStudioAiSuitePromptHandoff(handoff))
                      }
                    />
                  </Suspense>
                ) : null}
          '''
          tool.write_text(text[:index] + modal + text[index:], encoding="utf-8")

          composition = Path("src/domains/creator/ai/StudioAiCompositionPanel.tsx")
          replacements = [
              (
                  '  const [copied, setCopied] = useState(false);',
                  '  const [copyState, setCopyState] = useState<"idle" | "copied" | "failed">("idle");',
              ),
              ('    if (busy || !prompt) return;', '    if (busy || !configured || !prompt) return;'),
              ('    setCopied(false);', '    setCopyState("idle");'),
              ('      setCopied(true);', '      setCopyState("copied");'),
              (
                  '      // 클립보드 접근 불가(권한 등) — 조용히 무시, 사용자는 텍스트를 직접 선택해 복사할 수 있다.',
                  '      setCopyState("failed");',
              ),
              (
                  '          로그인해 서버 AI를 사용하거나 <span className="font-semibold text-fg-2">AI 어시스트 설정</span>\n          에서 내 API 키를 등록하면 쓸 수 있어요.',
                  '          장면 초안은 먼저 작성할 수 있어요. 실행하려면 로그인해 서버 AI를 사용하거나{" "}\n          <span className="font-semibold text-fg-2">AI 어시스트 설정</span>에서 내 API 키를 등록하세요.',
              ),
              (
                  '          if ((e.metaKey || e.ctrlKey) && e.key === "Enter") void run();',
                  '          if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && configured) void run();',
              ),
              ('        disabled={!configured || busy}', '        disabled={busy}'),
              (
                  '                className="inline-flex items-center gap-1 rounded-md border border-line bg-panel px-2 py-1 text-[0.63rem] font-medium text-fg-2 transition-colors hover:bg-raised"\n              >\n                <Copy size={11} /> {copied ? "복사됨" : "복사"}\n              </button>',
                  '''                className="inline-flex min-h-11 items-center gap-1 rounded-md border border-line bg-panel px-2 text-[0.63rem] font-medium text-fg-2 transition-colors hover:bg-raised"
                        >
                          <Copy size={11} />{" "}
                          {copyState === "copied"
                            ? "복사됨"
                            : copyState === "failed"
                              ? "복사 실패"
                              : "복사"}
                        </button>
                        <span className="sr-only" role="status" aria-live="polite">
                          {copyState === "copied"
                            ? "클립보드에 복사했어요."
                            : copyState === "failed"
                              ? "복사하지 못했어요. 텍스트를 직접 선택해 주세요."
                              : ""}
                        </span>''',
              ),
              (
                  '                  className="inline-flex items-center gap-1 rounded-md border border-line bg-panel px-2 py-1 text-[0.63rem] font-medium text-fg-2 transition-colors hover:bg-raised"',
                  '                  className="inline-flex min-h-11 items-center gap-1 rounded-md border border-line bg-panel px-2 text-[0.63rem] font-medium text-fg-2 transition-colors hover:bg-raised"',
              ),
          ]
          for old, new in replacements:
              replace_once(composition, old, new)
          PY

          git diff --check

          rm -f \
            .github/patches/ai-upgrade.part*.bin \
            .github/patches/toonstudio-webtoon-ai-upgrade.patch.xz.b64 \
            .github/workflows/apply-webtoon-ai-upgrade.yml
          rmdir .github/patches 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(studio): upgrade webtoon AI production UX and quality gates"
          git push origin "HEAD:${{ github.ref_name }}"
