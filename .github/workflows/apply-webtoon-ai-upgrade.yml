name: Apply verified webtoon AI upgrade

on:
  push:
    branches:
      - feat/webtoon-ai-quality-ux-20260905

permissions:
  contents: write

concurrency:
  group: apply-webtoon-ai-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-commit:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Verify, apply, and commit the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import lzma

          parts = Path(".github/patches")
          first = base64.b64encode((parts / "ai-upgrade.part01.bin").read_bytes()).decode("ascii")
          if len(first) != 1000 or first[761] != "d":
              raise SystemExit("unexpected part01 transport payload")
          first = first[:761] + "i" + first[762:]

          payload = bytearray(base64.b64decode(first))
          for index in range(2, 16):
              payload.extend((parts / f"ai-upgrade.part{index:02d}.bin").read_bytes())

          expected_xz = "6b229ea78b9b910ad7227b2a1c8463209eb323c6bed1139c7590a709dfb7297e"
          if hashlib.sha256(payload).hexdigest() != expected_xz:
              raise SystemExit("verified XZ payload hash mismatch")

          patch = lzma.decompress(bytes(payload))
          expected_patch = "8cc17b1d66ce770c75c0996b263475e77a436828c84941ed4a63f51810646def"
          if hashlib.sha256(patch).hexdigest() != expected_patch:
              raise SystemExit("reviewed patch hash mismatch")
          Path("/tmp/toonstudio-webtoon-ai-upgrade.patch").write_bytes(patch)
          PY

          git apply --check --3way --whitespace=error-all /tmp/toonstudio-webtoon-ai-upgrade.patch
          git apply --3way --whitespace=error-all /tmp/toonstudio-webtoon-ai-upgrade.patch
          git diff --check

          rm -f \
            .github/patches/ai-upgrade.part*.bin \
            .github/patches/toonstudio-webtoon-ai-upgrade.patch.xz.b64 \
            .github/workflows/apply-webtoon-ai-upgrade.yml
          rmdir .github/patches 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(studio): upgrade webtoon AI production UX and quality gates"
          git push origin "HEAD:${{ github.ref_name }}"
