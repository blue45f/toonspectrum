name: Complete CodeQL remediation

on:
  push:
    branches:
      - codex/code-scanning-remediation-20260908
    paths:
      - .github/workflows/code-scanning-remediation-v2.yml

permissions:
  actions: read
  contents: write
  pull-requests: write
  security-events: write

concurrency:
  group: complete-codeql-remediation
  cancel-in-progress: false

jobs:
  remediate-verify-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: codex/code-scanning-remediation-20260908
    steps:
      - name: Apply every available GitHub CodeQL autofix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          target_ref = f"refs/heads/{os.environ['TARGET_BRANCH']}"
          base = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "toonspectrum-complete-codeql-remediation",
          }

          def call(method, path, payload=None, accepted=(200, 201, 202, 204)):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      raw = response.read()
                      body = json.loads(raw) if raw else None
                      return response.status, body
              except urllib.error.HTTPError as error:
                  raw = error.read().decode("utf-8", errors="replace")
                  try:
                      body = json.loads(raw) if raw else None
                  except json.JSONDecodeError:
                      body = raw
                  if error.code in accepted:
                      return error.code, body
                  raise RuntimeError(f"{method} {path}: HTTP {error.code}: {body}") from error

          alerts = []
          page = 1
          while True:
              _, batch = call("GET", f"/code-scanning/alerts?state=open&tool_name=CodeQL&per_page=100&page={page}")
              alerts.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          results = []
          for alert in alerts:
              number = int(alert["number"])
              result = {
                  "number": number,
                  "rule": (alert.get("rule") or {}).get("id"),
                  "path": ((((alert.get("most_recent_instance") or {}).get("location")) or {}).get("path")),
              }
              try:
                  create_status, create_body = call(
                      "POST",
                      f"/code-scanning/alerts/{number}/autofix",
                      {},
                      accepted=(200, 201, 202, 204, 400, 403, 404, 409, 422),
                  )
                  if create_status >= 400:
                      result.update(status="unavailable", detail=create_body)
                      results.append(result)
                      print(json.dumps(result, ensure_ascii=False, separators=(",", ":")))
                      continue

                  autofix = create_body or {}
                  for _ in range(120):
                      poll_status, poll_body = call(
                          "GET",
                          f"/code-scanning/alerts/{number}/autofix",
                          accepted=(200, 202, 400, 403, 404, 409, 422),
                      )
                      if poll_status >= 400:
                          autofix = {"status": "error", "detail": poll_body}
                          break
                      autofix = poll_body or {}
                      if autofix.get("status") in {"ready", "error", "outdated"}:
                          break
                      time.sleep(2)

                  if autofix.get("status") != "ready":
                      result.update(status="not-ready", detail=autofix)
                      results.append(result)
                      print(json.dumps(result, ensure_ascii=False, separators=(",", ":")))
                      continue

                  commit_status, commit_body = call(
                      "POST",
                      f"/code-scanning/alerts/{number}/autofix/commits",
                      {"target_ref": target_ref},
                      accepted=(200, 201, 202, 400, 403, 404, 409, 422),
                  )
                  if commit_status >= 400:
                      result.update(status="commit-failed", detail=commit_body)
                  else:
                      result.update(status="committed", commit=commit_body)
                  results.append(result)
                  print(json.dumps(result, ensure_ascii=False, separators=(",", ":")))
              except Exception as error:
                  result.update(status="exception", detail=str(error))
                  results.append(result)
                  print(json.dumps(result, ensure_ascii=False, separators=(",", ":")))

          with open("/tmp/codeql-autofix-v2-results.json", "w", encoding="utf-8") as output:
              json.dump(results, output, ensure_ascii=False, indent=2)
          print("AUTOFIX_SUMMARY=" + json.dumps({
              "total": len(results),
              "committed": sum(item.get("status") == "committed" for item in results),
              "unavailable": sum(item.get("status") == "unavailable" for item in results),
              "notReady": sum(item.get("status") == "not-ready" for item in results),
              "commitFailed": sum(item.get("status") == "commit-failed" for item in results),
              "exceptions": sum(item.get("status") == "exception" for item in results),
          }, separators=(",", ":")))
          PY

      - name: Checkout the remediated branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Integrate the latest main and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
          fi
          rm -f \
            .github/workflows/code-scanning-inventory.yml \
            .github/workflows/code-scanning-context.yml \
            .github/workflows/code-scanning-autofix.yml \
            .github/workflows/code-scanning-remediation-gate.yml \
            .github/workflows/code-scanning-remediation-gate-trigger.yml \
            .github/workflows/code-scanning-remediation-v2.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(security): finalize CodeQL remediation tree"
          fi
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Initialize local CodeQL security analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze the final branch without uploading SARIF
        uses: github/codeql-action/analyze@v3
        with:
          upload: false
          output: /tmp/codeql-final-results
          category: /language:javascript-typescript

      - name: Require zero security findings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          import sys

          sarif_paths = glob.glob("/tmp/codeql-final-results/**/*.sarif", recursive=True)
          if not sarif_paths:
              raise SystemExit("No CodeQL SARIF output was produced")

          findings = []
          seen = set()
          for sarif_path in sarif_paths:
              with open(sarif_path, encoding="utf-8") as source:
                  sarif = json.load(source)
              for run in sarif.get("runs", []):
                  rule_map = {
                      rule.get("id"): rule
                      for rule in ((((run.get("tool") or {}).get("driver") or {}).get("rules")) or [])
                  }
                  for item in run.get("results", []):
                      rule_id = item.get("ruleId")
                      rule = rule_map.get(rule_id) or {}
                      properties = rule.get("properties") or {}
                      tags = [str(tag) for tag in (properties.get("tags") or [])]
                      security_severity = properties.get("security-severity")
                      if security_severity is None and not any(
                          tag.startswith("security/") or tag.startswith("external/cwe/") for tag in tags
                      ):
                          continue
                      locations = item.get("locations") or []
                      physical = ((locations[0].get("physicalLocation") if locations else None) or {})
                      path = ((physical.get("artifactLocation") or {}).get("uri"))
                      line = ((physical.get("region") or {}).get("startLine"))
                      key = (rule_id, path, line, ((item.get("message") or {}).get("text")))
                      if key in seen:
                          continue
                      seen.add(key)
                      findings.append({
                          "rule": rule_id,
                          "securitySeverity": security_severity,
                          "path": path,
                          "line": line,
                          "message": ((item.get("message") or {}).get("text")),
                      })

          print(json.dumps(findings, ensure_ascii=False, indent=2))
          if findings:
              print(f"Security gate failed with {len(findings)} finding(s)", file=sys.stderr)
              raise SystemExit(1)
          print("CODEQL_SECURITY_FINDINGS=0")
          PY

      - name: Create or locate the remediation pull request
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$TARGET_BRANCH" \
              --title "fix(security): resolve all open CodeQL findings" \
              --body $'## Summary\n\n- remediates the complete open CodeQL inventory captured on 2026-09-08\n- applies GitHub code-scanning autofixes against the remediation branch\n- integrates the latest `main` before validation\n- removes all temporary remediation workflows\n\n## Security gate\n\n- CodeQL `security-extended` findings: **0**\n- branch protection and the required `core` status check remain enforced'
            pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --base main --state open --json number --jq '.[0].number')"
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Enable protected squash merge
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "${{ steps.pr.outputs.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --auto \
            --delete-branch
