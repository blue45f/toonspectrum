name: Fix Studio final compile and CI

on:
  push:
    branches:
      - fix/studio-final-compile-and-ci-20260909
    paths:
      - .github/workflows/fix-studio-final-compile-and-ci.yml

permissions:
  contents: write

concurrency:
  group: fix-studio-final-compile-and-ci-20260909
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/studio-final-compile-and-ci-20260909
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Apply bounded compiler repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          preflight = Path("apps/api/src/modules/studio-ai/studio-ai-comic-director-schema-preflight.ts")
          text = preflight.read_text(encoding="utf-8")
          old = 'from "../../db/schema-preflight";'
          new = 'from "../../db/schema-preflight-runtime";'
          if text.count(old) != 1:
              raise SystemExit(f"schema-preflight import drifted: found {text.count(old)}")
          preflight.write_text(text.replace(old, new), encoding="utf-8")

          controller = Path("apps/api/src/modules/studio-ai/studio-ai-comic-director.controller.ts")
          text = controller.read_text(encoding="utf-8")
          class_header = '@Controller("studio-ai/comic-director")\n@Header("Cache-Control", "no-store, max-age=0")\n'
          if text.count(class_header) != 1:
              raise SystemExit("controller class-level Header contract drifted")
          text = text.replace(
              class_header,
              '@Controller("studio-ai/comic-director")\n',
          )
          pattern = re.compile(r'  @(Get|Post|Patch)\(([^\n]+)\)\n')
          text, count = pattern.subn(
              lambda match: match.group(0) + '  @Header("Cache-Control", "no-store, max-age=0")\n',
              text,
          )
          if count != 14:
              raise SystemExit(f"expected 14 route methods, decorated {count}")
          controller.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint repaired API sources
        run: >-
          pnpm exec eslint --max-warnings=0
          apps/api/src/modules/studio-ai/studio-ai-comic-director-schema-preflight.ts
          apps/api/src/modules/studio-ai/studio-ai-comic-director.controller.ts

      - name: Typecheck entire workspace
        run: pnpm run typecheck

      - name: Run Studio AI API regression tests
        run: pnpm exec vitest run apps/api/src/modules/studio-ai

      - name: Build production workspace
        run: pnpm run build

      - name: Commit verified fixes and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-studio-final-compile-and-ci.yml
          git add \
            apps/api/src/modules/studio-ai/studio-ai-comic-director-schema-preflight.ts \
            apps/api/src/modules/studio-ai/studio-ai-comic-director.controller.ts
          git commit -m "fix(studio-ai): restore API compiler and cache contracts"
          git push origin HEAD:fix/studio-final-compile-and-ci-20260909
