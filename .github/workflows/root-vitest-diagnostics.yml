name: Root Vitest diagnostics

on:
  push:
    branches:
      - release/final-main-merge-4888b061-immutable-20260908

permissions:
  contents: read

jobs:
  diagnose:
    name: root test diagnostic (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 3]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: webdex
          POSTGRES_PASSWORD: webdex
          POSTGRES_DB: webdex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webdex -d webdex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://webdex:webdex@localhost:5432/webdex
      STUDIO_LIVE_POSTGRES_INTEGRATION_URL: postgres://webdex:webdex@localhost:5432/webdex
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Prepare database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm'
          pnpm exec drizzle-kit push --force
      - name: Run exact shard and capture output
        shell: bash
        run: |
          mkdir -p diagnostics
          set +e
          set -o pipefail
          pnpm run test:root --shard=${{ matrix.shard }}/3 --coverage 2>&1 | tee diagnostics/shard-${{ matrix.shard }}.log
          code=${PIPESTATUS[0]}
          echo "$code" > diagnostics/shard-${{ matrix.shard }}.exit
          exit 0
      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-vitest-diagnostic-${{ matrix.shard }}
          path: diagnostics/
          if-no-files-found: error
      - name: Preserve test result
        if: always()
        run: exit "$(cat diagnostics/shard-${{ matrix.shard }}.exit)"
