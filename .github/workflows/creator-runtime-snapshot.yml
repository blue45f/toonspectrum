name: Creator runtime source snapshot
on:
  push:
    branches: ['feat/offline-inference-spatial-20260913']
    paths: ['.github/workflows/creator-runtime-snapshot.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        shell: python
        run: |
          import pathlib, subprocess, zipfile
          allowed = {'.ts', '.tsx', '.js', '.jsx', '.mjs', '.mts', '.cjs', '.json', '.yaml', '.yml', '.html', '.css', '.py', '.sh', '.md', '.toml', '.txt', '.lock'}
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with zipfile.ZipFile('/tmp/creator-source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in files:
                  p = pathlib.Path(name)
                  if not name or not p.is_file() or p.suffix not in allowed:
                      continue
                  if any(part.startswith('.env') or part in {'node_modules', '.git', 'data', 'artifacts'} for part in p.parts):
                      continue
                  if len(p.parts) > 1 and p.parts[0] not in {'apps', 'packages', 'scripts', 'tools', '.github', 'services', 'tests', 'e2e'}:
                      continue
                  if p.stat().st_size <= 2000000:
                      archive.write(p, name)
              archive.writestr('SOURCE_COMMIT.txt', subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode())
      - uses: actions/upload-artifact@v4
        with:
          name: creator-runtime-source
          path: /tmp/creator-source.zip
          retention-days: 1
