name: Studio large epics deep fixes

on:
  push:
    branches:
      - codex/studio-large-epics-closure-20260909
    paths:
      - .github/workflows/studio-large-epics-deep-fix-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      BRANCH: codex/studio-large-epics-closure-20260909
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Make resumed download, validation and import states idempotent
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          service = Path('apps/api/src/modules/studio-ai/studio-3d-generation.service.ts')
          text = service.read_text()
          pattern = re.compile(r'''    if \(record\.state === "generating-geometry" \|\| record\.state === "generating-texture"\) \{
      record = await this\.#ledger\.transition\(\{
        jobId: record\.id,
        expectedGeneration: record\.generation,
        state: "downloading",
      \}\);
    \}
    const artifacts = await provider\.download\(identity, signal\);
    const binary = modelBinary\(artifacts\);
    if \(!binary\) throw new TypeError\("Hyper3D download did not include a model binary\."\);
    assertGlb\(binary\.bytes\);
    record = await this\.#ledger\.transition\(\{
      jobId: record\.id,
      expectedGeneration: record\.generation,
      state: "validating",
    \}\);
    record = await this\.#ledger\.transition\(\{
      jobId: record\.id,
      expectedGeneration: record\.generation,
      state: "importing",
    \}\);''')
          replacement = '''    if (record.state === "generating-geometry" || record.state === "generating-texture") {
      record = await this.#ledger.transition({
        jobId: record.id,
        expectedGeneration: record.generation,
        state: "downloading",
      });
    }
    if (record.state !== "downloading" && record.state !== "validating" && record.state !== "importing") {
      throw new Error(`3D generation job cannot resume artifact import from ${record.state}.`);
    }
    const artifacts = await provider.download(identity, signal);
    const binary = modelBinary(artifacts);
    if (!binary) throw new TypeError("Hyper3D download did not include a model binary.");
    assertGlb(binary.bytes);
    if (record.state === "downloading") {
      record = await this.#ledger.transition({
        jobId: record.id,
        expectedGeneration: record.generation,
        state: "validating",
      });
    }
    if (record.state === "validating") {
      record = await this.#ledger.transition({
        jobId: record.id,
        expectedGeneration: record.generation,
        state: "importing",
      });
    }'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
            if 'record.state !== "downloading" && record.state !== "validating"' not in text:
              raise SystemExit('resume-state block not found')
          service.write_text(text)

          panel = Path('apps/web/src/domains/creator/ai/StudioAi3dGenerationPanel.tsx')
          text = panel.read_text()
          anchor = '''  const withArtifact = async (
    action: ((job: Studio3dGenerationJob, blob: Blob) => Promise<void> | void) | undefined,
  ) => {'''
          if 'const downloadArtifactToDevice = async () =>' not in text:
            position = text.find(anchor)
            if position < 0: raise SystemExit('artifact action anchor not found')
            return_pos = text.find('\n  return (', position)
            if return_pos < 0: raise SystemExit('panel return anchor not found')
            function = '''
  const downloadArtifactToDevice = async () => {
    if (!job?.artifactRevision) return;
    setBusy(true);
    setError(null);
    try {
      const blob = await client.downloadArtifact(job.artifactRevision.id);
      const url = URL.createObjectURL(blob);
      const anchorElement = document.createElement("a");
      anchorElement.href = url;
      anchorElement.download = `${job.artifactRevision.modelId}.glb`;
      anchorElement.rel = "noopener";
      anchorElement.click();
      URL.revokeObjectURL(url);
    } catch (caught) {
      setError(caught instanceof Error ? caught.message : String(caught));
    } finally {
      setBusy(false);
    }
  };
'''
            text = text[:return_pos] + function + text[return_pos:]
          button_anchor = '''          <div className="flex flex-wrap gap-2">
            {onInsertArtifact ?'''
          if 'GLB 다운로드' not in text:
            if button_anchor not in text: raise SystemExit('ready action row not found')
            text = text.replace(
              button_anchor,
              '''          <div className="flex flex-wrap gap-2">
            <button type="button" onClick={() => void downloadArtifactToDevice()} className="min-h-11 rounded-lg border border-line px-3 text-xs font-bold">GLB 다운로드</button>
            {onInsertArtifact ?''',
              1,
            )
          panel.write_text(text)
          PY

      - name: Add resume and download boundary regression
        run: |
          cat > apps/api/src/modules/studio-ai/studio-3d-generation-resume-boundary.test.ts <<'TS'
          import { readFileSync } from "node:fs";
          import path from "node:path";

          import { describe, expect, it } from "vitest";

          describe("Studio 3D generation resume boundary", () => {
            it("resumes downloading, validating and importing without repeating invalid transitions", () => {
              const source = readFileSync(
                path.join(process.cwd(), "apps/api/src/modules/studio-ai/studio-3d-generation.service.ts"),
                "utf8",
              );
              expect(source).toContain('record.state !== "downloading" && record.state !== "validating"');
              expect(source).toContain('if (record.state === "downloading")');
              expect(source).toContain('if (record.state === "validating")');
            });
          });
          TS

      - name: Verify and self-remove
        run: |
          pnpm exec eslint --fix --max-warnings=0 \
            apps/api/src/modules/studio-ai/studio-3d-generation.service.ts \
            apps/api/src/modules/studio-ai/studio-3d-generation-resume-boundary.test.ts \
            apps/web/src/domains/creator/ai/StudioAi3dGenerationPanel.tsx
          pnpm exec vitest run \
            apps/api/src/modules/studio-ai/studio-3d-generation-job-ledger.test.ts \
            apps/api/src/modules/studio-ai/studio-3d-generation-artifact-atomicity.test.ts \
            apps/api/src/modules/studio-ai/studio-3d-generation-resume-boundary.test.ts \
            apps/web/src/domains/creator/ai/StudioAi3dGenerationPanel.test.tsx
          pnpm exec tsc -p tsconfig.json --noEmit --incremental false
          pnpm --filter @webtoon-nest/api run typecheck
          rm -f .github/workflows/studio-large-epics-deep-fix-v2.yml

      - name: Publish fixes with retries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps .github/workflows/studio-large-epics-deep-fix-v2.yml
          git commit -m "fix(studio): make 3D generation resume and downloads reliable"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if git rebase "origin/$BRANCH" && git push origin HEAD:"$BRANCH"; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 7))
          done
          exit 1
