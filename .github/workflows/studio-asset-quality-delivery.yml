name: Studio asset quality delivery
on:
  push:
    branches: [feat/studio-assets-quality-delivery-20260906]
    paths-ignore: ["docs/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: studio-asset-quality-delivery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  asset-quality:
    if: github.repository == 'blue45f/toonspectrum' && github.ref == 'refs/heads/feat/studio-assets-quality-delivery-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HUSKY: "0"
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.16.0
      - name: Prepare reviewed integration and safeguards
        run: |
          python3 scripts/finalize_studio_asset_delivery.py --prepare
          python3 scripts/prepare_studio_asset_delivery_regressions.py
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0 defusedxml==0.7.1
          python3 -m py_compile scripts/studio_asset_delivery.py scripts/finalize_studio_asset_delivery.py
          npm install --global pnpm@11.4.0 --ignore-scripts --no-audit --no-fund
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Acquire native-resolution originals and remove duplicate variants
        run: python3 scripts/studio_asset_delivery.py --output "$RUNNER_TEMP/studio-asset-delivery"
      - name: Render every GLB from three angles
        run: |
          pnpm exec playwright install --with-deps chromium
          node scripts/render_studio_asset_delivery.mjs "$RUNNER_TEMP/studio-asset-delivery" "$GITHUB_WORKSPACE"
          python3 scripts/finalize_studio_asset_delivery.py --stage "$RUNNER_TEMP/studio-asset-delivery"
      - name: Verify catalog paths integrity and compatibility
        run: |
          pnpm exec vitest run src/domains/creator/studio-cc0-asset-delivery.test.ts src/domains/creator/studio-original-free-asset-packs.test.ts src/domains/creator/StudioOriginalAssetMarketplacePanel.test.tsx src/domains/creator/studio-shared-asset-drag.test.ts
          pnpm exec tsx -e 'import fs from "node:fs"; import {parseStudioCc0Catalog} from "./src/domains/creator/studio-cc0-asset-delivery.ts"; const items=parseStudioCc0Catalog(JSON.parse(fs.readFileSync("public/assets/studio/cc0-20260906/manifest.json","utf8"))); console.log("ADMITTED SELF-HOSTED ORIGINALS",items.length);'
      - name: Check touched frontend lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm exec eslint --fix src/domains/creator/studio-cc0-asset-delivery.ts src/domains/creator/StudioCc0AssetLibraryPanel.tsx src/domains/creator/studio-cc0-asset-delivery.test.ts src/domains/creator/studio-original-free-asset-packs.ts src/domains/creator/StudioAssetMenuPanel.tsx src/domains/creator/studio-original-free-asset-packs.test.ts src/domains/creator/StudioOriginalAssetMarketplacePanel.test.tsx src/domains/creator/studio-shared-asset-drag.test.ts 2>&1 | tee "$RUNNER_TEMP/studio-asset-delivery/frontend-lint.log"
      - name: Check full frontend types
        id: types
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm exec tsc -p tsconfig.json --pretty false 2>&1 | tee "$RUNNER_TEMP/studio-asset-delivery/frontend-types.log"
      - name: Record exact verification outcomes
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPES_OUTCOME: ${{ steps.types.outcome }}
        run: |
          python3 - <<'PY'
          import os,json,pathlib
          result={'catalogAndLegacyUnitTests':'passed','manifestAdmission':'passed','threeAngleModelRendering':'completed','frontendLint':os.environ['LINT_OUTCOME'],'frontendTypes':os.environ['TYPES_OUTCOME'],'fullProductionBuild':'not-run','studioSaveRestoreRoundTrip':'not-run','artisticApproval':'not-claimed','productionDeployment':'not-performed'}
          for folder in [pathlib.Path(os.environ['RUNNER_TEMP'])/'studio-asset-delivery',pathlib.Path('data/studio-assets/delivery-20260906')]:
              folder.mkdir(parents=True,exist_ok=True)
              (folder/'verification.json').write_text(json.dumps(result,indent=2)+'\n')
          print('VERIFICATION',json.dumps(result))
          PY
      - name: Retain reviewed delivery on the feature branch only
        run: |
          test "$GITHUB_REF" = "refs/heads/feat/studio-assets-quality-delivery-20260906"
          test "$GITHUB_REPOSITORY" = "blue45f/toonspectrum"
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          git add -- public/assets/studio/cc0-20260906 data/studio-assets/delivery-20260906 scripts/studio_asset_delivery.py scripts/render_studio_asset_delivery.mjs src/domains/creator/studio-cc0-asset-delivery.ts src/domains/creator/StudioCc0AssetLibraryPanel.tsx src/domains/creator/studio-cc0-asset-delivery.test.ts src/domains/creator/studio-original-free-asset-packs.ts src/domains/creator/StudioAssetMenuPanel.tsx src/domains/creator/studio-original-free-asset-packs.test.ts src/domains/creator/StudioOriginalAssetMarketplacePanel.test.tsx src/domains/creator/studio-shared-asset-drag.test.ts
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c core.hooksPath=/dev/null commit -m "feat(studio): bundle rendered CC0 originals and retire blockout-only picks"
            git push origin "HEAD:$GITHUB_REF"
          fi
          git log -1 --format='DELIVERY_COMMIT %H'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: studio-asset-quality-${{ github.run_id }}
          path: ${{ runner.temp }}/studio-asset-delivery/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
