name: Temporary Studio 3D cinematic asset integration

on:
  push:
    branches:
      - feat/studio-3d-cinematic-assets-20260909
    paths:
      - .github/workflows/tmp-studio-3d-cinematic-assets.yml
      - scripts/apply-studio-3d-cinematic-assets.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-3d-cinematic-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable

      - name: Apply product integration
        run: node scripts/apply-studio-3d-cinematic-assets.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused Studio 3D regression tests
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/bg3d/studio-bg3d-procedural-starter-pack.test.ts
          apps/web/src/domains/creator/bg3d/studio-bg3d-procedural-starter-ui.test.ts
          apps/web/src/domains/creator/bg3d/StudioBg3dProceduralStarterPanel.test.tsx
          apps/web/src/domains/creator/bg3d/studio-bg3d-cinematic-asset-pack.test.ts

      - name: Lint changed TypeScript
        run: >-
          pnpm exec eslint --max-warnings=0
          apps/web/src/domains/creator/bg3d/studio-bg3d-cinematic-asset-blueprints.ts
          apps/web/src/domains/creator/bg3d/studio-bg3d-cinematic-asset-pack.test.ts
          apps/web/src/domains/creator/bg3d/studio-bg3d-procedural-starter-pack.ts
          apps/web/src/domains/creator/bg3d/studio-bg3d-procedural-starter-pack.test.ts
          apps/web/src/domains/creator/bg3d/StudioBg3dProceduralStarterPanel.tsx
          apps/web/src/domains/creator/bg3d/StudioBg3dProceduralStarterPanel.test.tsx

      - name: Run repository TypeScript check
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Check patch whitespace
        run: git diff --check

      - name: Remove one-shot integration files
        run: |
          rm scripts/apply-studio-3d-cinematic-assets.mjs
          rm .github/workflows/tmp-studio-3d-cinematic-assets.yml

      - name: Commit validated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat(studio): add cinematic procedural 3d asset pack"
          git push origin HEAD:feat/studio-3d-cinematic-assets-20260909
