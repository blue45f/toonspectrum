name: Finishing quality final repair once

on:
  push:
    branches:
      - fix/real-core-and-main-only-20260910
    paths:
      - .github/workflows/finishing-quality-final-repair-once.yml

permissions:
  contents: write

concurrency:
  group: finishing-quality-final-repair-20260911
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/real-core-and-main-only-20260910
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Align finishing-quality regression contracts with the converged UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          menubar_path = Path(
              "apps/web/src/domains/creator/StudioMenubarContent.test.tsx"
          )
          menubar = menubar_path.read_text(encoding="utf-8")

          old_signature = (
              '  it("ref-clicks root import inputs and turns the busy control into an '
              'explicit cancel action", () => {'
          )
          new_signature = (
              '  it("ref-clicks root import inputs and turns the busy control into an '
              'explicit cancel action", async () => {'
          )
          if old_signature in menubar:
              menubar = menubar.replace(old_signature, new_signature, 1)
          elif new_signature not in menubar:
              raise RuntimeError("menubar import regression test signature not found")

          old_assertion = '''    expect(screen.getByRole("button", { name: "ORA · CBZ · WILL" }))
              .toHaveProperty("disabled", true);'''
          new_assertion = '''    await waitFor(() => {
              const interchangeButtons = screen.getAllByRole("button", {
                name: "ORA · CBZ · WILL",
              });
              expect(interchangeButtons.length).toBeGreaterThan(0);
              for (const button of interchangeButtons) {
                expect(button).toHaveProperty("disabled", true);
              }
            });'''
          if old_assertion in menubar:
              menubar = menubar.replace(old_assertion, new_assertion, 1)
          elif new_assertion not in menubar:
              raise RuntimeError("menubar import disabled assertion not found")
          menubar_path.write_text(menubar, encoding="utf-8")

          hints_path = Path(
              "apps/web/src/domains/creator/StudioToolBeltContent.hints.test.ts"
          )
          hints = hints_path.read_text(encoding="utf-8")
          old_count = "    expect(buttons).toHaveLength(40);"
          new_count = '''    // Four direct 3D launchers moved behind the shared lazy 3D Studio popover.
              expect(buttons).toHaveLength(36);'''
          if old_count in hints:
              hints = hints.replace(old_count, new_count, 1)
          elif new_count not in hints:
              raise RuntimeError("ToolBelt native button count assertion not found")
          hints_path.write_text(hints, encoding="utf-8")
          PY
      - name: Verify targeted finishing-quality tests
        run: |
          pnpm exec eslint \
            apps/web/src/domains/creator/StudioMenubarContent.test.tsx \
            apps/web/src/domains/creator/StudioToolBeltContent.hints.test.ts
          pnpm exec vitest run \
            apps/web/src/domains/creator/StudioMenubarContent.test.tsx \
            apps/web/src/domains/creator/StudioToolBeltContent.hints.test.ts
      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finishing-quality-final-repair-once.yml
          git diff --check
          git config user.name toonstudio-quality-ci
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m 'test(studio): align finishing quality UI contracts'
          git fetch origin fix/real-core-and-main-only-20260910
          git rebase origin/fix/real-core-and-main-only-20260910
          git push --no-verify origin HEAD:fix/real-core-and-main-only-20260910