name: Full Test Suite Diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  full-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studio_full_test
          POSTGRES_PASSWORD: studio_full_test
          POSTGRES_DB: studio_full_integration
        ports: ['5432:5432']
        # Bootstrap requires the application database to have no other clients.
        # Keep the periodic Docker probe on the maintenance database instead.
        options: >-
          --health-cmd "pg_isready -U studio_full_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://studio_full_test:studio_full_test@127.0.0.1:5432/studio_full_integration
      TEST_RUNTIME_DATABASE_ROLE: studio_full_runtime
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install actual shell and PostgreSQL test prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh postgresql-client
      - name: Bootstrap a fresh disposable database with the runtime role boundary
        env:
          MIGRATION_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          set -euo pipefail
          BOOTSTRAP_RUNTIME_DATABASE_PASSWORD="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')"
          export BOOTSTRAP_RUNTIME_DATABASE_PASSWORD
          node scripts/bootstrap-empty-production-database.mjs --execute --allow-loopback \
            --runtime-database-role "$TEST_RUNTIME_DATABASE_ROLE" --release-sha "$GITHUB_SHA" \
            --confirmation BOOTSTRAP-EMPTY-TOONSPECTRUM-DATABASE
      - name: Run complete root and performance suites with serial database isolation
        run: node scripts/run-full-test-ci.mjs
