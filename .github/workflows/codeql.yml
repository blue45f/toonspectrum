name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # 주요일 03:17 UTC. 매주 고정 오프셋으로 실행해 스케줄 트래픽이 한 시각에 몰리지 않게 한다.
    - cron: "17 3 * * 4"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # javascript-typescript 분석은 이 모노레포에서 60분을 넘겨 timeout으로 취소되며,
    # 그 결과 SARIF가 업로드되지 않아 code scanning이 "설정 오류"로 보이며 경고 상태로 남는다.
    # 다른 언어는 한참 안에 끝나므로 여유를 두되 무한정 붙잡지 않도록 상한은 유지한다.
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
          - language: c-cpp
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"