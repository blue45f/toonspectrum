name: ToonStudio one-time diagnostics bridge mount

on:
  push:
    branches:
      - feat/toonstudio-final-ia-20260911
    paths:
      - .github/workflows/toonstudio-diagnostics-bridge-mount.yml

permissions:
  contents: write

concurrency:
  group: toonstudio-diagnostics-bridge-mount
  cancel-in-progress: false

jobs:
  mount:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/toonstudio-final-ia-20260911
          fetch-depth: 0
      - name: Mount project diagnostics bridge
        run: node scripts/mount-studio-project-diagnostics-bridge.mjs
      - name: Remove one-time mount files
        run: rm scripts/mount-studio-project-diagnostics-bridge.mjs .github/workflows/toonstudio-diagnostics-bridge-mount.yml
      - name: Commit mounted bridge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(studio): mount project diagnostics bridge"
          git push origin HEAD:feat/toonstudio-final-ia-20260911
