name: One-time latest main API release

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/one-time-api-release-1f2c49aa.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: one-time-latest-main-api-release
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/blue45f/toonspectrum-core-api

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CI: "1"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Capture latest main release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          release_sha="$(git rev-parse origin/main)"
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          git checkout --detach "$release_sha"
          test "$(git rev-parse HEAD)" = "$release_sha"
          test -z "$(git status --porcelain)"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install and validate release boundaries
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prefer-offline
          pnpm run validate:architecture
          pnpm run verify:free-infrastructure
          pnpm exec vitest run apps/web/src/domains/creator/workspace/StudioWorkspacePage.continuity.test.tsx

      - name: Build verified API runtime
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @webtoon-nest/api build
          test -s apps/api/dist/apps/api/src/main.js
          node --check apps/api/dist/apps/api/src/main.js

      - name: Assemble production-only image context
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release
          pnpm --filter @webtoon-nest/api deploy --legacy --prod .release/api-package
          mkdir -p .release/image/apps/api
          cp .release/api-package/package.json .release/image/apps/api/package.json
          cp -a .release/api-package/node_modules .release/image/apps/api/node_modules
          cp -a apps/api/dist .release/image/apps/api/dist
          cp -a apps/api/data .release/image/apps/api/data
          mkdir -p .release/image/deploy/trust
          cp deploy/trust/supabase-prod-ca-2021.crt .release/image/deploy/trust/supabase-prod-ca-2021.crt
          cat > .release/image/Dockerfile <<'DOCKERFILE'
          FROM node:24.16.0-bookworm-slim
          ENV NODE_ENV=production
          ENV NODE_EXTRA_CA_CERTS=/app/deploy/trust/supabase-prod-ca-2021.crt
          WORKDIR /app
          COPY --chown=node:node . /app
          USER node
          EXPOSE 3000
          CMD ["node", "apps/api/dist/apps/api/src/main.js"]
          DOCKERFILE
          printf '%s\n' "$RELEASE_SHA" > .release/image/RELEASE_SHA
          test -s .release/image/apps/api/dist/apps/api/src/main.js

      - uses: docker/setup-buildx-action@v3

      - name: Build immutable API image locally
        uses: docker/build-push-action@v6
        with:
          context: .release/image
          file: .release/image/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ steps.release.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/blue45f/toonspectrum
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
            org.opencontainers.image.title=ToonSpectrum Core API
          cache-from: type=gha,scope=toonspectrum-core-api
          cache-to: type=gha,mode=max,scope=toonspectrum-core-api

      - name: Verify main did not move during validation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and record immutable API image
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:${RELEASE_SHA}"
          mkdir -p artifacts/api-container-release
          docker push "$image" | tee artifacts/api-container-release/push.log
          digest="$(sed -nE 's/^digest: (sha256:[0-9a-f]{64}).*/\1/p' artifacts/api-container-release/push.log | tail -1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "sha=$RELEASE_SHA"
            echo "image=$image"
            echo "digest=$digest"
          } | tee artifacts/api-container-release/image.txt
          docker logout ghcr.io || true
          docker buildx imagetools inspect "$image"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: api-container-release-${{ steps.release.outputs.sha }}
          path: artifacts/api-container-release
          if-no-files-found: error
          retention-days: 7
