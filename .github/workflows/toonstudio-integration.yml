name: ToonStudio integration

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/src/app/routes/groups/**"
      - "apps/web/src/domains/creator/**"
      - "apps/web/src/shared/components/**"
      - "apps/web/src/infrastructure/**"
      - "scripts/verify-toonstudio-integration.sh"
      - "tsconfig.toonstudio-core.json"
      - "tsconfig.toonstudio-ui.json"
      - ".github/workflows/toonstudio-integration.yml"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: toonstudio-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.track }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    strategy:
      fail-fast: false
      matrix:
        track: [core, ui, editor]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify ${{ matrix.track }} integration
        run: bash scripts/verify-toonstudio-integration.sh "${{ matrix.track }}"
