name: Commit ToonStudio session migration

on:
  push:
    branches:
      - feat/toonstudio-session-complete-20260911-1221
    paths:
      - .github/workflows/commit-toonstudio-session-migration.yml

permissions:
  contents: write

concurrency:
  group: commit-toonstudio-session-migration
  cancel-in-progress: false

jobs:
  commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout dedicated branch
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-session-complete-20260911-1221
          fetch-depth: 0

      - name: Apply deterministic migration
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path(".github/workflows/apply-toonstudio-session-fixes.yml").read_text()
          block = re.search(
              r"- name: Apply deterministic source fixes\n.*?run: \|\n(?P<body>.*?)\n\s+- name: Verify source formatting",
              workflow,
              re.S,
          )
          if block is None:
              raise SystemExit("Could not locate deterministic migration")
          body = textwrap.dedent(block.group("body"))
          prefix = "python <<'PY'\n"
          if not body.startswith(prefix) or not body.rstrip().endswith("\nPY"):
              raise SystemExit("Unexpected migration block format")
          script = body[len(prefix):body.rfind("\nPY")]
          exec(compile(script, "toonstudio-session-migration.py", "exec"), {})
          PY

      - name: Commit migration and remove temporary writers
        shell: bash
        run: |
          rm .github/workflows/apply-toonstudio-session-fixes.yml
          rm .github/workflows/apply-toonstudio-session-fixes-retry.yml
          rm .github/workflows/commit-toonstudio-session-migration.yml
          git config user.name "toonstudio-integration-bot"
          git config user.email "toonstudio-integration-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(studio): stabilize integrated feature type contracts"
          git push origin HEAD:feat/toonstudio-session-complete-20260911-1221
