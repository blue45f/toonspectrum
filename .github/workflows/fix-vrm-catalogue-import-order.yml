name: Fix VRM catalogue import order

on:
  push:
    branches:
      - chore/architecture-sonar-cleanup-final
    paths:
      - .github/workflows/fix-vrm-catalogue-import-order.yml

permissions:
  contents: write

concurrency:
  group: fix-vrm-catalogue-import-order-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: true
      HUSKY: 0
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/architecture-sonar-cleanup-final
          fetch-depth: 1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Move repository-path import after parent-relative product imports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/generate-studio-vrm-avatar-reference-catalogue.mts')
          source = path.read_text(encoding='utf-8')
          import_line = 'import { WEB_VITE_ALIASES } from "./lib/repo-paths.mjs";\n'
          old_block = f'\n{import_line}\n'
          anchor = '} from "../apps/web/src/domains/creator/vrm/studio-vrm-avatar-reference-recommendation";\n'

          if source.count(import_line) != 1:
              raise SystemExit(f'expected one WEB_VITE_ALIASES import, found {source.count(import_line)}')
          if source.count(anchor) != 1:
              raise SystemExit(f'expected one recommendation import anchor, found {source.count(anchor)}')
          if old_block not in source:
              raise SystemExit('WEB_VITE_ALIASES import is not in the expected pre-fix position')

          source = source.replace(old_block, '\n', 1)
          source = source.replace(anchor, f'{anchor}\n{import_line}', 1)
          path.write_text(source, encoding='utf-8')
          PY
          pnpm exec eslint scripts/generate-studio-vrm-avatar-reference-catalogue.mts --max-warnings=0
          git diff --check
          git diff -- scripts/generate-studio-vrm-avatar-reference-catalogue.mts
      - name: Commit the verified lint fix
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/generate-studio-vrm-avatar-reference-catalogue.mts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --no-verify -m 'fix: order VRM catalogue generator imports'
          git push origin HEAD:chore/architecture-sonar-cleanup-final
