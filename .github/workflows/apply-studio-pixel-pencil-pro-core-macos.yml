name: Materialize studio pixel pencil pro source

on:
  push:
    branches:
      - feat/studio-pixel-pencil-pro-v2-20260909

permissions:
  contents: write

concurrency:
  group: materialize-studio-pixel-pencil-pro-source-v1
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[pixel-pencil-pro-core-applied]') }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Sparse partial-clone current branch head
        env:
          GH_TOKEN: ${{ github.token }}
          FEATURE_BRANCH: feat/studio-pixel-pencil-pro-v2-20260909
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git sparse-checkout init --cone
          git sparse-checkout set .github apps/web docs scripts
          git -c protocol.version=2 fetch \
            --depth=1 \
            --filter=blob:none \
            origin \
            "+refs/heads/${FEATURE_BRANCH}:refs/remotes/origin/${FEATURE_BRANCH}"
          git checkout -B "${FEATURE_BRANCH}" "refs/remotes/origin/${FEATURE_BRANCH}"

      - name: Materialize implementation
        run: |
          python3 -m py_compile \
            scripts/prepare-studio-pixel-pencil-pro-core.py \
            scripts/apply-studio-pixel-pencil-pro-core.py
          python3 scripts/prepare-studio-pixel-pencil-pro-core.py
          python3 scripts/apply-studio-pixel-pencil-pro-core.py
          git diff --check

      - name: Commit actual source and remove one-shot machinery
        run: |
          rm -f scripts/apply-studio-pixel-pencil-pro-core.py
          rm -f scripts/prepare-studio-pixel-pencil-pro-core.py
          rm -f .github/workflows/apply-studio-pixel-pencil-pro-core.yml
          rm -f .github/workflows/apply-studio-pixel-pencil-pro-core-macos.yml
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "feat(studio): upgrade pixel pencil core [pixel-pencil-pro-core-applied]"
          git push origin HEAD:feat/studio-pixel-pencil-pro-v2-20260909
