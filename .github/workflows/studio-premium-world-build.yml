name: Studio premium world candidates
on:
  push:
    branches: [feat/studio-premium-world-assets-20260913]
    paths:
      - .github/workflows/studio-premium-world-build.yml
      - scripts/blender/generate_studio_premium_world_v1.py
permissions:
  contents: read
concurrency:
  group: studio-premium-world-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      BLENDER_VERSION: 5.2.1
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v6
      - name: Install headless runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1 libgl1-mesa-dri libglx-mesa0
      - uses: actions/cache@v4
        id: blender
        with:
          path: .cache/blender-5.2.1-linux-x64
          key: blender-${{ runner.os }}-x64-5.2.1
      - name: Verify and unpack official Blender
        if: steps.blender.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .cache && cd .cache
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          checksum="blender-${BLENDER_VERSION}.sha256"
          curl --fail --location --retry 5 --retry-all-errors -o "$archive" "https://download.blender.org/release/Blender5.2/$archive"
          curl --fail --location --retry 5 --retry-all-errors -o "$checksum" "https://download.blender.org/release/Blender5.2/$checksum"
          grep " $archive$" "$checksum" | sha256sum --check -
          tar -xf "$archive"
          rm "$archive" "$checksum"
      - name: Build and render quarantined candidates
        env:
          BLENDER_USER_RESOURCES: ${{ runner.temp }}/premium-blender-profile
        run: |
          mkdir -p "$BLENDER_USER_RESOURCES"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/blender/generate_studio_premium_world_v1.py')
          s=p.read_text().replace('베이커리 곡면 진열장','베이커리 유리 진열장')
          s=s.replace('(0,-.7+step*.42,.13+step*.13),(2.5,.46,.26+step*.26)', '(0,-.7+step*.42,(.26+step*.13)/2),(2.5,.46,.26+step*.13)')
          p.write_text(s)
          PY
          python3 -m py_compile scripts/blender/generate_studio_premium_world_v1.py
          .cache/blender-5.2.1-linux-x64/blender --background --python-exit-code 1 --python scripts/blender/generate_studio_premium_world_v1.py -- --shard ${{ matrix.shard }} > "$RUNNER_TEMP/world-build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/world-build.log"; exit 1; }
          grep PREMIUM_WORLD_RESULT "$RUNNER_TEMP/world-build.log"
          cp scripts/blender/generate_studio_premium_world_v1.py artifacts/studio-premium-world-v1/generator.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-world-shard-${{ matrix.shard }}
          path: |
            artifacts/studio-premium-world-v1/assets
            artifacts/studio-premium-world-v1/generator.py
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: premium-world-log-${{ matrix.shard }}
          path: ${{ runner.temp }}/world-build.log
          retention-days: 3
  review:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: premium-world-shard-*
          merge-multiple: true
          path: candidates
      - name: Make hash-bound review sheets
        run: |
          python3 -m venv /tmp/review-venv
          /tmp/review-venv/bin/pip -q install Pillow==11.3.0
          /tmp/review-venv/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          import json,hashlib
          out=Path('review');out.mkdir()
          records=[]
          for source in sorted(Path('candidates/assets').glob('*/SOURCE.json')):
            r=json.loads(source.read_text());folder=source.parent
            assert hashlib.sha256((folder/(r['slug']+'.glb')).read_bytes()).hexdigest()==r['sha256']
            im=Image.open(folder/(r['slug']+'.png'));assert im.size==(r['width'],r['height'])
            r['renderSha256']=hashlib.sha256((folder/(r['slug']+'.png')).read_bytes()).hexdigest()
            records.append(r)
          assert len(records)==24 and len({r['id'] for r in records})==24
          for kind in ['scene','prop']:
            subset=[r for r in records if r['kind']==kind]
            for page in range((len(subset)+3)//4):
              sheet=Image.new('RGB',(1600,1260),'#d6d9dc');draw=ImageDraw.Draw(sheet)
              for i,r in enumerate(subset[page*4:page*4+4]):
                x=(i%2)*800;y=(i//2)*630
                image=Image.open(Path('candidates/assets')/r['id']/(r['slug']+'.png')).convert('RGBA')
                image.thumbnail((790,590))
                sheet.paste(image,(x+(800-image.width)//2,y+(595-image.height)//2),image)
                draw.text((x+18,y+601),r['slug'],fill='black')
              sheet.save(out/(kind+'-'+str(page+1)+'.jpg'),quality=94)
          (out/'candidates.json').write_text(json.dumps(records,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'models':len(records),'scenes':8,'props':16,'modelBytes':sum(r['byteSize'] for r in records)},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: premium-world-visual-review
          path: review
          retention-days: 3
