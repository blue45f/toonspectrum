name: Bootstrap confirmed Studio API type fixes

on:
  push:
    branches:
      - fix/studio-qa-browser-runtime-20260909

permissions:
  contents: write

concurrency:
  group: studio-qa-type-repair-bootstrap-20260909
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: fix/studio-qa-browser-runtime-20260909
      - name: Repair confirmed TypeScript contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ledger_path = Path("apps/api/src/modules/studio-ai/studio-3d-generation-job-ledger.ts")
          ledger = ledger_path.read_text()
          for state in ("ready", "failed", "cancelled", "expired"):
              before = f"    {state}: new Set(),"
              after = f"    {state}: new Set<Studio3dGenerationJobState>(),"
              if ledger.count(before) != 1:
                  raise SystemExit(f"expected one terminal transition set for {state}")
              ledger = ledger.replace(before, after)
          ledger_path.write_text(ledger)

          preflight_path = Path("apps/api/src/modules/studio-ai/studio-ai-comic-director-schema-preflight.ts")
          preflight = preflight_path.read_text()
          before_import = 'import { runSchemaPreflightToleratingDbUnavailability } from "../../db/schema-preflight";'
          after_import = 'import { runSchemaPreflightToleratingDbUnavailability } from "../../common/database-availability";'
          if preflight.count(before_import) != 1:
              raise SystemExit("expected the obsolete Studio comic-director preflight import")
          preflight_path.write_text(preflight.replace(before_import, after_import))

          controller_path = Path("apps/api/src/modules/studio-ai/studio-ai-comic-director.controller.ts")
          lines = controller_path.read_text().splitlines()
          class_header = '@Header("Cache-Control", "no-store, max-age=0")'
          if lines.count(class_header) != 1:
              raise SystemExit("expected exactly one invalid class-level Header decorator")
          lines.remove(class_header)

          route_prefixes = ('  @Get(', '  @Post(', '  @Patch(')
          repaired = []
          route_count = 0
          for line in lines:
              repaired.append(line)
              if line.startswith(route_prefixes):
                  repaired.append('  @Header("Cache-Control", "no-store, max-age=0")')
                  route_count += 1
          if route_count != 14:
              raise SystemExit(f"expected 14 comic-director routes, found {route_count}")
          controller_path.write_text("\n".join(repaired) + "\n")
          PY
      - name: Commit repairs and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/studio-qa-type-repair-bootstrap.yml
          git add -A
          git commit -m "fix(studio-api): restore comic director and 3D ledger type contracts"
          git push origin HEAD:fix/studio-qa-browser-runtime-20260909
