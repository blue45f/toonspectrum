name: One-shot PR900 catalogue regression repair

on:
  push:
    branches:
      - feat/studio-3d-quality-expansion-20260908
    paths:
      - .github/workflows/one-shot-pr900-catalog-regression-repair.yml

permissions:
  contents: write

concurrency:
  group: one-shot-pr900-catalog-regression-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/studio-3d-quality-expansion-20260908
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/one-shot-pr900-catalog-regression-repair.yml
            apps/web/src/domains/creator/bg3d/bg3d-model-library.test.ts
            apps/web/src/domains/creator/bg3d/studio-bg3d-model-mutation-integration.test.ts
            apps/web/src/domains/creator/vrm/vrm-library.test.ts
      - name: Repair and validate stale catalogue assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s) of {old!r}, found {count}")
              target.write_text(text.replace(old, new))

          bg3d = "apps/web/src/domains/creator/bg3d/bg3d-model-library.test.ts"
          replace(bg3d, "ships only the twelve audited CC0 environment samples", "ships all eighteen audited CC0 environment samples")
          replace(bg3d, "expect(SAMPLE_BG3D_MODELS).toHaveLength(12);", "expect(SAMPLE_BG3D_MODELS).toHaveLength(18);")
          replace(bg3d, "expect(SAMPLE_BG3D_MODEL_ENTRIES).toHaveLength(12);", "expect(SAMPLE_BG3D_MODEL_ENTRIES).toHaveLength(18);")
          replace(bg3d, "expect(new Set(SAMPLE_BG3D_MODELS.map((sample) => sample.id)).size).toBe(12);", "expect(new Set(SAMPLE_BG3D_MODELS.map((sample) => sample.id)).size).toBe(18);")

          mutation = "apps/web/src/domains/creator/bg3d/studio-bg3d-model-mutation-integration.test.ts"
          replace(mutation, '"if (!cached.admittedProfiles.has(policy.profile))",', '"if (!cached.admissionPolicyKeys?.has(policyKey))",')
          replace(
              mutation,
              '"admitStoredBg3dModelForRendering(args.record.id",\n      "cached.admittedProfiles.add(policy.profile)",',
              '"admitStoredBg3dModelForRendering(args.record.id",\n      "cached.admissionPolicyKeys ??= new Set<string>()",\n      "cached.admissionPolicyKeys.add(policyKey)",\n      "cached.admittedProfiles.add(policy.profile)",',
          )

          vrm = "apps/web/src/domains/creator/vrm/vrm-library.test.ts"
          replace(vrm, "모든 번들 캐릭터가 200KB 이하의 고품질 3D 스튜디오 렌더링 썸네일 실파일을 갖추고 있는지 전수 검사한다.", "모든 번들 캐릭터가 검토된 용량 한도 내 고품질 3D 스튜디오 렌더링 썸네일 실파일을 갖추는지 전수 검사한다.")
          replace(vrm, "backs every bundled character with a high-quality 3D thumbnail (<200KB) and valid sampleVrmThumbnailUrl", "backs every bundled character with a bounded high-quality 3D thumbnail and valid sampleVrmThumbnailUrl")
          replace(vrm, "expect(SAMPLE_VRMS.length).toBe(88);", "expect(SAMPLE_VRMS.length).toBe(113);")
          replace(
              vrm,
              r"/^\/assets\/3d\/characters\/thumbnails\/[a-z0-9_.-]+\.png$/",
              r"/^\/assets\/3d\/characters\/thumbnails\/(?:[a-z0-9_.-]+\/)*[a-z0-9_.-]+\.png$/",
              expected=2,
          )
          replace(
              vrm,
              '      expect(size, `${sample.id} thumbnail size should be < 200KB`).toBeLessThan(200 * 1024);',
              '''      const maxThumbnailBytes = sample.thumbnailUrl!.includes("/refined-v1/")
                ? 320 * 1024
                : 200 * 1024;
              expect(
                size,
                `${sample.id} thumbnail size should be < ${maxThumbnailBytes / 1024}KB`,
              ).toBeLessThan(maxThumbnailBytes);'''.replace("              ", ""),
          )

          for path, required in [
              (bg3d, ["toHaveLength(18)", "toBe(18)"]),
              (mutation, ["admissionPolicyKeys?.has(policyKey)", "admissionPolicyKeys.add(policyKey)"]),
              (vrm, ["toBe(113)", "maxThumbnailBytes", "(?:[a-z0-9_.-]+\\/)*"]),
          ]:
              text = Path(path).read_text()
              missing = [value for value in required if value not in text]
              if missing:
                  raise SystemExit(f"{path}: missing repaired assertions {missing}")
          PY
          git diff --check
      - name: Commit repair and retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-pr900-catalog-regression-repair.yml
          git add \
            apps/web/src/domains/creator/bg3d/bg3d-model-library.test.ts \
            apps/web/src/domains/creator/bg3d/studio-bg3d-model-mutation-integration.test.ts \
            apps/web/src/domains/creator/vrm/vrm-library.test.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(studio): align catalogue regressions with expanded assets"
          git push origin HEAD:feat/studio-3d-quality-expansion-20260908
