name: PR 690 reconcile with main

on:
  push:
    branches:
      - refactor/layered-architecture-20260904
    paths:
      - .github/workflows/pr690-reconcile-main.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: pr690-reconcile-main
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Merge current main and preserve layered ownership
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "toonstudio-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch --no-tags origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_exit=$?
          set -e

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          if (( merge_exit != 0 && ${#conflicts[@]} == 0 )); then
            echo "merge failed without resolvable content conflicts"
            exit "$merge_exit"
          fi

          allowed_conflicts=(
            "src/app/routes/AppRouter.tsx"
            "src/domains/creator/StudioCuttoonEditorHost.tsx"
          )
          unexpected=()
          for file in "${conflicts[@]}"; do
            allowed=false
            for expected in "${allowed_conflicts[@]}"; do
              if [[ "$file" == "$expected" ]]; then
                allowed=true
                break
              fi
            done
            if [[ "$allowed" == false ]]; then
              unexpected+=("$file")
            fi
          done

          if (( ${#unexpected[@]} > 0 )); then
            printf 'unexpected merge conflict: %s\n' "${unexpected[@]}"
            exit 1
          fi

          # The architecture branch owns these composition seams. Current-main
          # product additions are re-applied below at their semantic owners.
          for file in "${conflicts[@]}"; do
            git checkout --ours -- "$file"
          done

          python3 - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          def replace_once(text: str, *, marker: str, needle: str, replacement: str, label: str) -> str:
              if marker in text:
                  return text
              count = text.count(needle)
              if count != 1:
                  raise SystemExit(f"{label}: expected one insertion point, found {count}")
              return text.replace(needle, replacement, 1)

          route_path = Path("src/app/routes/groups/creator.routes.tsx")
          route = route_path.read_text(encoding="utf-8")
          route = replace_once(
              route,
              marker='"CharacterShaperLandingPage"',
              needle='const StudioRouter = lazyRetry(\n',
              replacement='''const CharacterShaperLandingPage = lazyRetry(\n  () => import("@/src/domains/creator/CharacterShaperLandingPage").then((module) => ({\n    default: module.CharacterShaperLandingPage,\n  })),\n  "CharacterShaperLandingPage",\n);\nconst StudioRouter = lazyRetry(\n''',
              label="creator shaper lazy route",
          )
          route = replace_once(
              route,
              marker='id: "creator-character-shaper"',
              needle='  { id: "creator-studio", path: "/studio/*", element: <StudioRouter /> },\n',
              replacement='''  {\n    id: "creator-character-shaper",\n    path: "/shaper",\n    element: <CharacterShaperLandingPage />,\n  },\n  { id: "creator-studio", path: "/studio/*", element: <StudioRouter /> },\n''',
              label="creator shaper route entry",
          )
          route_path.write_text(route, encoding="utf-8")

          runtime_path = Path(
              "src/domains/creator/studio-cuttoon-editor/runtime/"
              "useStudioCharacterShaperSurfaceRuntime.ts"
          )
          runtime_path.parent.mkdir(parents=True, exist_ok=True)
          runtime_path.write_text(
              '''import { useCallback, useState, type Dispatch, type SetStateAction } from "react";\n\ninterface UseStudioCharacterShaperSurfaceRuntimeOptions {\n  readonly navigateStudio2dSurface: (surface: "character" | "poser") => void;\n  readonly setPoserVrmOpen: Dispatch<SetStateAction<boolean>>;\n}\n\n/** Owns the mutually-exclusive VRM builder and preset-first character surface. */\nexport function useStudioCharacterShaperSurfaceRuntime({\n  navigateStudio2dSurface,\n  setPoserVrmOpen,\n}: UseStudioCharacterShaperSurfaceRuntimeOptions) {\n  const [characterShaperOpen, setCharacterShaperOpen] = useState(false);\n\n  const openVrmPoserFromMenu = useCallback(() => {\n    setCharacterShaperOpen(false);\n    setPoserVrmOpen(true);\n    navigateStudio2dSurface("poser");\n  }, [navigateStudio2dSurface, setPoserVrmOpen]);\n\n  const openCharacterShaperFromMenu = useCallback(() => {\n    setPoserVrmOpen(false);\n    setCharacterShaperOpen(true);\n    navigateStudio2dSurface("character");\n  }, [navigateStudio2dSurface, setPoserVrmOpen]);\n\n  return {\n    characterShaperOpen,\n    openCharacterShaperFromMenu,\n    openVrmPoserFromMenu,\n    setCharacterShaperOpen,\n  } as const;\n}\n''',
              encoding="utf-8",
          )

          host_path = Path("src/domains/creator/StudioCuttoonEditorHost.tsx")
          host = host_path.read_text(encoding="utf-8")
          host = replace_once(
              host,
              marker='useStudioCharacterShaperSurfaceRuntime } from',
              needle='import { useStudioPixelToolSessions } from "./studio-cuttoon-editor/studio-pixel-tool-sessions";\n',
              replacement='''import { useStudioCharacterShaperSurfaceRuntime } from "./studio-cuttoon-editor/runtime/useStudioCharacterShaperSurfaceRuntime";\nimport { useStudioPixelToolSessions } from "./studio-cuttoon-editor/studio-pixel-tool-sessions";\n''',
              label="character shaper runtime import",
          )
          host = replace_once(
              host,
              marker='studioRoute.surface === "character"',
              needle='''    } else if (studioRoute.surface === "poser") {\n      setPoserVrmOpen(true);\n    } else if (studioRoute.surface === "animation") {\n''',
              replacement='''    } else if (studioRoute.surface === "poser") {\n      setPoserVrmOpen(true);\n    } else if (studioRoute.surface === "character") {\n      setCharacterShaperOpen(true);\n    } else if (studioRoute.surface === "animation") {\n''',
              label="character route open sync",
          )
          host = replace_once(
              host,
              marker='previousSurface === "character"',
              needle='''      else if (previousSurface === "bg3d") setBg3dOpen(false);\n      else if (previousSurface === "poser") setPoserVrmOpen(false);\n''',
              replacement='''      else if (previousSurface === "bg3d") setBg3dOpen(false);\n      else if (previousSurface === "poser") setPoserVrmOpen(false);\n      else if (previousSurface === "character") setCharacterShaperOpen(false);\n''',
              label="character route close sync",
          )
          host = replace_once(
              host,
              marker='case "character-shaper":',
              needle='''      case "character":\n        setPoserVrmOpen(true);\n        break;\n      case "bg3d":\n''',
              replacement='''      case "character":\n        setPoserVrmOpen(true);\n        break;\n      case "character-shaper":\n        openCharacterShaperFromMenu();\n        break;\n      case "bg3d":\n''',
              label="character shaper command",
          )
          host = replace_once(
              host,
              marker='useStudioCharacterShaperSurfaceRuntime({',
              needle='''  function openVrmPoserFromMenu() {\n    setPoserVrmOpen(true);\n    navigateStudio2dSurface("poser");\n  }\n''',
              replacement='''  const {\n    characterShaperOpen,\n    openCharacterShaperFromMenu,\n    openVrmPoserFromMenu,\n    setCharacterShaperOpen,\n  } = useStudioCharacterShaperSurfaceRuntime({\n    navigateStudio2dSurface,\n    setPoserVrmOpen,\n  });\n''',
              label="character shaper surface runtime",
          )
          host = replace_once(
              host,
              marker='''    characterShaperOpen,\n    dccRouteRequested:''',
              needle='''    bg3dOpen,\n    dccRouteRequested: hybridDccRouteRequested,\n''',
              replacement='''    bg3dOpen,\n    characterShaperOpen,\n    dccRouteRequested: hybridDccRouteRequested,\n''',
              label="character surface admission input",
          )
          host = replace_once(
              host,
              marker='const admittedCharacterShaperOpen =',
              needle='''  const admittedBg3dOpen = interactiveThreeDSurfaceAdmission.bg3dOpen;\n  const admittedMannequinPoserOpen = interactiveThreeDSurfaceAdmission.mannequinPoserOpen;\n''',
              replacement='''  const admittedBg3dOpen = interactiveThreeDSurfaceAdmission.bg3dOpen;\n  const admittedCharacterShaperOpen = interactiveThreeDSurfaceAdmission.characterShaperOpen;\n  const admittedMannequinPoserOpen = interactiveThreeDSurfaceAdmission.mannequinPoserOpen;\n''',
              label="character surface admission output",
          )
          host = replace_once(
              host,
              marker='''    character: false,\n    comic:''',
              needle='''    animation: false,\n    bg3d: false,\n    comic: false,\n''',
              replacement='''    animation: false,\n    bg3d: false,\n    character: false,\n    comic: false,\n''',
              label="routed character state",
          )
          host = replace_once(
              host,
              marker='surface: "animation" | "bg3d" | "character" | "comic" | "poser"',
              needle='surface: "animation" | "bg3d" | "comic" | "poser"',
              replacement='surface: "animation" | "bg3d" | "character" | "comic" | "poser"',
              label="routed character type",
          )
          host = replace_once(
              host,
              marker='useRoutedSurfacePanelSync("character", characterShaperOpen)',
              needle='''  useRoutedSurfacePanelSync("bg3d", bg3dOpen);\n  useRoutedSurfacePanelSync("poser", poserVrmOpen);\n''',
              replacement='''  useRoutedSurfacePanelSync("bg3d", bg3dOpen);\n  useRoutedSurfacePanelSync("poser", poserVrmOpen);\n  useRoutedSurfacePanelSync("character", characterShaperOpen);\n''',
              label="routed character panel sync",
          )
          host = replace_once(
              host,
              marker='''      openCharacterShaperFromMenu,\n      openBackground3dFromMenu,''',
              needle='''      openVrmPoserFromMenu,\n      openBackground3dFromMenu,\n''',
              replacement='''      openVrmPoserFromMenu,\n      openCharacterShaperFromMenu,\n      openBackground3dFromMenu,\n''',
              label="character shaper editor command",
          )
          host = replace_once(
              host,
              marker='admittedCharacterShaperOpen={admittedCharacterShaperOpen}',
              needle='''      admittedBg3dOpen={admittedBg3dOpen}\n      admittedMannequinPoserOpen={admittedMannequinPoserOpen}\n''',
              replacement='''      admittedBg3dOpen={admittedBg3dOpen}\n      admittedCharacterShaperOpen={admittedCharacterShaperOpen}\n      admittedMannequinPoserOpen={admittedMannequinPoserOpen}\n''',
              label="character shaper view admission",
          )
          host = replace_once(
              host,
              marker='setCharacterShaperOpen={setCharacterShaperOpen}',
              needle='''      setPoserInitialElementId={setPoserInitialElementId}\n      setPoserVrmOpen={setPoserVrmOpen}\n''',
              replacement='''      setPoserInitialElementId={setPoserInitialElementId}\n      setCharacterShaperOpen={setCharacterShaperOpen}\n      setPoserVrmOpen={setPoserVrmOpen}\n''',
              label="character shaper view setter",
          )
          host_path.write_text(host, encoding="utf-8")

          host_lines = len(host.split("\n"))
          formatted_lines = f"{host_lines:,}".replace(",", "_")
          ratchet_path = Path("src/domains/creator/studio-host-architecture-ratchet.test.ts")
          ratchet = ratchet_path.read_text(encoding="utf-8")
          ratchet, count = re.subn(
              r"const HOST_MAX_LINES = [0-9_]+;",
              f"const HOST_MAX_LINES = {formatted_lines};",
              ratchet,
              count=1,
          )
          if count != 1:
              raise SystemExit("host ratchet constant was not found exactly once")
          marker = "main-reconciled Character Shaper surface seam"
          if marker not in ratchet:
              ratchet = ratchet.replace(
                  f"const HOST_MAX_LINES = {formatted_lines};",
                  "// 2026-09-04: main-reconciled Character Shaper surface seam resets this once to the\n"
                  "// measured post-merge value; subsequent extractions may only lower it.\n"
                  f"const HOST_MAX_LINES = {formatted_lines};",
                  1,
              )
          ratchet_path.write_text(ratchet, encoding="utf-8")

          doc_path = Path("docs/architecture/frontend-layered-architecture.md")
          doc = doc_path.read_text(encoding="utf-8")
          doc, count = re.subn(
              r"The adoption ceiling is [0-9,]+ lines(?: after preserving current main's Character Shaper surface)?\.",
              f"The adoption ceiling is {host_lines:,} lines after preserving current main's Character Shaper surface.",
              doc,
              count=1,
          )
          if count != 1:
              raise SystemExit("architecture document host ceiling was not found exactly once")
          doc_path.write_text(doc, encoding="utf-8")

          if "<<<<<<<" in host or ">>>>>>>" in host:
              raise SystemExit("unresolved conflict marker remains in Studio host")
          print(f"reconciled Studio host lines: {host_lines}")
          PY

          # Never merge the one-off reconciliation transport itself.
          git rm --ignore-unmatch .github/workflows/pr690-reconcile-main.yml
          git add -A

          git diff --cached --check
          node scripts/validate-architecture.mjs

          if [[ -f .git/MERGE_HEAD ]]; then
            git commit -m "merge(main): reconcile architecture refactor with current studio"
          elif ! git diff --cached --quiet; then
            git commit -m "refactor(architecture): preserve current studio features"
          fi

          git push origin HEAD:refactor/layered-architecture-20260904
