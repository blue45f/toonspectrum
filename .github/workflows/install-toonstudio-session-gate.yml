name: Install ToonStudio session completion gate

on:
  push:
    branches:
      - feat/toonstudio-session-complete-20260911-1221
    paths:
      - .github/workflows/install-toonstudio-session-gate.yml

permissions:
  contents: write

concurrency:
  group: retry-toonstudio-session-fixes
  cancel-in-progress: false

jobs:
  install-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout dedicated branch
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-session-complete-20260911-1221
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add package completion command
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const json = JSON.parse(fs.readFileSync(path, 'utf8'));
          json.scripts ||= {};
          json.scripts['verify:studio-session-goals'] = 'node scripts/verify-toonstudio-session-goals.mjs';
          fs.writeFileSync(path, `${JSON.stringify(json, null, 2)}\n`);
          NODE

      - name: Rebase if main advanced
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "toonstudio-integration-bot"
          git config user.email "toonstudio-integration-bot@users.noreply.github.com"
          git add package.json scripts/verify-toonstudio-session-goals.mjs
          if ! git diff --cached --quiet; then
            git commit -m "test(studio): add session completion gate"
          fi
          git fetch origin main
          if [[ $(git rev-list --count HEAD..origin/main) -gt 0 ]]; then
            git rebase -X theirs origin/main
          fi
          pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify goal contract
        run: pnpm verify:studio-session-goals

      - name: Typecheck
        run: pnpm exec tsc -p tsconfig.json --noEmit --pretty false

      - name: Lint feature delta
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx' '*.mjs')
          if ((${#files[@]})); then pnpm exec eslint --max-warnings=0 "${files[@]}"; fi

      - name: Run feature delta tests
        shell: bash
        run: |
          mapfile -t tests < <(git diff --name-only origin/main...HEAD -- '*.test.ts' '*.test.tsx')
          if ((${#tests[@]})); then pnpm exec vitest run "${tests[@]}" --pool=forks --maxWorkers=2; fi

      - name: Build production bundle
        run: pnpm build

      - name: Record completion matrix
        shell: bash
        run: |
          mkdir -p docs/rewrite
          {
            echo '# ToonStudio session feature completion matrix'
            echo
            echo "Validated commit before report: \`$(git rev-parse HEAD)\`"
            echo
            echo '| Area | Connected implementation | Verification |'
            echo '|---|---|---|'
            echo '| Product IA and canonical routes | Studio home, project sections, document workspaces, legacy redirects | route and destination tests |'
            echo '| Story and writer workflow | story bible, storyboard planner, continuity, localization | model and UI tests |'
            echo '| Professional drawing foundation | editor runtime, brush, vector, selection, tile/GPU contracts | existing Studio regression gates |'
            echo '| Webtoon production | production pipeline, mobile quality, cut and balloon checks | feature suite tests |'
            echo '| Assets and marketplace | asset passport, providers, rights graph, fonts, submission, Series Kit | domain and Asset Hub tests |'
            echo '| 3D, voice and motion | render passes, rights-aware voice regeneration, motion schedule | feature suite tests |'
            echo '| Design and presentation | structured templates and presentation audit | domain and UI tests |'
            echo '| AI assistance | project-scoped handoff, preview, consent and provider safety | AI integration tests |'
            echo '| Review and approval | comments, change requests, reviewer decisions, protected revisions | Review panel tests |'
            echo '| Export and publishing | localization QA, preflight, packages and connector contracts | export and publishing tests |'
            echo '| Analytics and automation | reader/production metrics, safe versus confirmed steps | feature suite tests |'
            echo '| Recovery and archive | readiness, archive manifest, full project safety contracts | readiness and archive tests |'
            echo
            echo 'The gate verifies required domain contracts, project-owned UI surfaces, canonical routes, regression files and removal of internal system terminology from the primary Studio shell.'
          } > docs/rewrite/toonstudio-session-feature-completion-matrix.md

      - name: Commit verified gate and clean one-shot workflows
        shell: bash
        run: |
          rm -f .github/workflows/apply-toonstudio-session-fixes.yml
          rm -f .github/workflows/apply-toonstudio-session-fixes-retry.yml
          rm -f .github/workflows/finalize-toonstudio-session.yml
          rm -f .github/workflows/install-toonstudio-session-gate.yml
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "chore(studio): record verified session feature matrix"
          fi
          git push --force-with-lease origin HEAD:feat/toonstudio-session-complete-20260911-1221
