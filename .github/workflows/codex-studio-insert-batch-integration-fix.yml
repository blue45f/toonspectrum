name: Codex studio insert batch integration fix

on:
  push:
    branches:
      - fix/studio-insert-batch-integration-20260909

permissions:
  contents: write

concurrency:
  group: codex-studio-insert-batch-integration-fix
  cancel-in-progress: true

jobs:
  integrate-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[codex-insert-integration-done]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/studio-insert-batch-integration-20260909
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Mount preflight and add integration regression
        shell: python
        run: |
          from pathlib import Path

          content_path = Path(
              "apps/web/src/domains/creator/StudioUnifiedAssetToolPopoverContent.tsx"
          )
          source = content_path.read_text()
          import_anchor = (
              'import { StudioInsertHubWorkspace } from "./StudioInsertHubWorkspace";\n'
          )
          import_line = (
              'import { StudioInsertBatchPreflight } from "./StudioInsertBatchPreflight";\n'
          )
          if import_line not in source:
              if source.count(import_anchor) != 1:
                  raise SystemExit(
                      f"expected one insert workspace import anchor, found {source.count(import_anchor)}"
                  )
              source = source.replace(import_anchor, import_anchor + import_line, 1)

          jsx_anchor = "      <StudioUnifiedAssetSmartLibrary\n"
          jsx_line = "      <StudioInsertBatchPreflight toolBelt={toolBelt} />\n"
          if jsx_line not in source:
              if source.count(jsx_anchor) != 1:
                  raise SystemExit(
                      f"expected one smart-library JSX anchor, found {source.count(jsx_anchor)}"
                  )
              source = source.replace(jsx_anchor, jsx_line + jsx_anchor, 1)
          content_path.write_text(source)

          test_path = Path(
              "apps/web/src/domains/creator/StudioAssetToolPopoverWorkspace.test.tsx"
          )
          test_source = test_path.read_text()
          test_case = '''  it("mounts the safe multi-image preflight in the insertion hub", async () => {
            const { toolBelt } = createToolBelt();
            render(<StudioAssetToolPopoverWorkspace toolBelt={toolBelt} />);

            expect(
              await screen.findByRole("button", {
                name: /여러 이미지 한 번에 배치/u,
              }),
            ).toBeTruthy();
          });

          '''
          test_anchor = '  it("keeps the workspace mounted while legacy asset tabs switch", async () => {\n'
          if test_case not in test_source:
              if test_source.count(test_anchor) != 1:
                  raise SystemExit(
                      f"expected one workspace test anchor, found {test_source.count(test_anchor)}"
                  )
              test_source = test_source.replace(test_anchor, test_case + test_anchor, 1)
          test_path.write_text(test_source)

          stale_workflow = Path(
              ".github/workflows/codex-studio-insert-batch-preflight.yml"
          )
          if stale_workflow.exists():
              stale_workflow.unlink()

      - name: Format and lint changed insertion sources
        run: |
          pnpm exec eslint --fix \
            apps/web/src/domains/creator/StudioUnifiedAssetToolPopoverContent.tsx \
            apps/web/src/domains/creator/StudioAssetToolPopoverWorkspace.test.tsx \
            apps/web/src/domains/creator/StudioInsertBatchPreflight.tsx \
            apps/web/src/domains/creator/StudioInsertBatchPreflight.test.tsx \
            apps/web/src/domains/creator/studio-insert-batch-model.ts \
            apps/web/src/domains/creator/studio-insert-batch-model.test.ts
          pnpm exec eslint --max-warnings=0 \
            apps/web/src/domains/creator/StudioUnifiedAssetToolPopoverContent.tsx \
            apps/web/src/domains/creator/StudioAssetToolPopoverWorkspace.test.tsx \
            apps/web/src/domains/creator/StudioInsertBatchPreflight.tsx \
            apps/web/src/domains/creator/StudioInsertBatchPreflight.test.tsx \
            apps/web/src/domains/creator/studio-insert-batch-model.ts \
            apps/web/src/domains/creator/studio-insert-batch-model.test.ts

      - name: Run focused insertion regressions
        run: |
          pnpm exec vitest run \
            apps/web/src/domains/creator/studio-insert-batch-model.test.ts \
            apps/web/src/domains/creator/StudioInsertBatchPreflight.test.tsx \
            apps/web/src/domains/creator/StudioInsertHubWorkspace.test.tsx \
            apps/web/src/domains/creator/StudioAssetToolPopoverWorkspace.test.tsx

      - name: Run type and architecture gates
        run: |
          pnpm exec tsc -p tsconfig.json
          pnpm run validate:architecture
          pnpm run verify:studio-menus
          git diff --check

      - name: Commit verified integration and remove one-shot workflow
        run: |
          rm .github/workflows/codex-studio-insert-batch-integration-fix.yml
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "fix(studio): mount verified batch insertion preflight [codex-insert-integration-done]"
          git push origin HEAD:fix/studio-insert-batch-integration-20260909
