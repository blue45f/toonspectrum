name: Finish mannequin anatomy sparse materialization

on:
  push:
    branches: [feat/mannequin-anatomy-controls-main-20260910]
    paths: [.github/workflows/materialize-mannequin-anatomy-controls-v2.yml]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-slim
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/mannequin-anatomy-controls-main-20260910
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/materialize-mannequin-anatomy-controls.yml
            .github/workflows/materialize-mannequin-anatomy-controls-v2.yml
            apps/web/src/domains/creator/scene-3d/studio-mannequin-model.ts
            apps/web/src/domains/creator/scene-3d/StudioMannequinPoserPanel.tsx
          persist-credentials: true

      - name: Reuse the reviewed anatomy materialization recipe
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import os
          import subprocess
          import yaml

          source = '.github/workflows/materialize-mannequin-anatomy-controls.yml'
          data = yaml.safe_load(open(source, encoding='utf-8'))
          selected = {
              'Add independent anatomy controls to model and panel',
              'Verify anatomy product boundaries',
          }
          for step in data['jobs']['materialize']['steps']:
              if step.get('name') not in selected:
                  continue
              subprocess.run(
                  step['run'],
                  shell=True,
                  executable='/bin/bash',
                  check=True,
                  env=os.environ.copy(),
              )
          PY

      - name: Commit generated product slice through the sparse boundary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name toonstudio-3d-ci
          git config user.email actions@users.noreply.github.com
          rm -f .github/workflows/materialize-mannequin-anatomy-controls.yml \
                .github/workflows/materialize-mannequin-anatomy-controls-v2.yml
          git add --sparse \
            apps/web/src/domains/creator/scene-3d/studio-mannequin-model.ts \
            apps/web/src/domains/creator/scene-3d/StudioMannequinPoserPanel.tsx \
            apps/web/src/domains/creator/scene-3d/studio-mannequin-anatomy-controls.test.ts \
            .github/workflows/materialize-mannequin-anatomy-controls.yml \
            .github/workflows/materialize-mannequin-anatomy-controls-v2.yml
          git diff --cached --check
          HUSKY=0 git commit -m 'feat(mannequin): add anatomical silhouette controls'
          git push origin HEAD:feat/mannequin-anatomy-controls-main-20260910
