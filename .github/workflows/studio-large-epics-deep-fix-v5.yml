name: Studio large epics deep fixes

on:
  push:
    branches:
      - codex/studio-large-epics-closure-20260909
    paths:
      - .github/workflows/studio-large-epics-deep-fix-v5.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      BRANCH: codex/studio-large-epics-closure-20260909
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Add the graph status to the current panel return tree
        run: |
          cat > /tmp/wire-effect-graph.mjs <<'NODE'
          import fs from 'node:fs';
          import ts from 'typescript';

          const file = 'apps/web/src/domains/creator/layer/StudioLayerEffectsStackPanel.tsx';
          let source = fs.readFileSync(file, 'utf8');
          const importLine = 'import { StudioLayerEffectsGraphStatus } from "./StudioLayerEffectsGraphStatus";';
          if (!source.includes(importLine)) {
            const sf = ts.createSourceFile(file, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX);
            const imports = sf.statements.filter(ts.isImportDeclaration);
            if (!imports.length) throw new Error('Layer effects panel has no import anchor');
            const at = imports.at(-1).end;
            source = `${source.slice(0, at)}\n${importLine}${source.slice(at)}`;
          }

          if (!source.includes('<StudioLayerEffectsGraphStatus stack={stack}')) {
            const sf = ts.createSourceFile(file, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX);
            let fn;
            for (const statement of sf.statements) {
              if (ts.isFunctionDeclaration(statement) && statement.name?.text === 'StudioLayerEffectsStackPanel') fn = statement;
              if (ts.isVariableStatement(statement)) {
                for (const declaration of statement.declarationList.declarations) {
                  if (ts.isIdentifier(declaration.name) && declaration.name.text === 'StudioLayerEffectsStackPanel' && declaration.initializer) fn = declaration.initializer;
                }
              }
            }
            if (!fn || !fn.body || !ts.isBlock(fn.body)) throw new Error('Layer effects panel function not found');
            const result = fn.body.statements.filter(ts.isReturnStatement).at(-1);
            if (!result?.expression) throw new Error('Layer effects panel return not found');
            let expression = result.expression;
            while (ts.isParenthesizedExpression(expression)) expression = expression.expression;
            if (!ts.isJsxElement(expression)) throw new Error('Layer effects panel root is not a JSX element');
            const at = expression.closingElement.getStart(sf);
            source = `${source.slice(0, at)}        <StudioLayerEffectsGraphStatus stack={stack} sourceHash="selected-layer" />\n${source.slice(at)}`;
          }
          fs.writeFileSync(file, source);

          const wiring = 'apps/web/src/domains/creator/studio-large-epics-product-wiring.test.ts';
          let test = fs.readFileSync(wiring, 'utf8');
          if (!test.includes('StudioLayerEffectsGraphStatus')) {
            test = test.replace(
              '    expect(layerPanel).toMatch(/addLayerEffect|reorderLayerEffect/u);',
              '    expect(layerPanel).toMatch(/addLayerEffect|reorderLayerEffect/u);\n    expect(layerPanel).toContain("StudioLayerEffectsGraphStatus");',
            );
          }
          fs.writeFileSync(wiring, test);
          NODE
          node /tmp/wire-effect-graph.mjs

      - name: Verify live graph wiring and self-remove
        run: |
          pnpm exec eslint --fix --max-warnings=0 \
            apps/web/src/domains/creator/layer/StudioLayerEffectsStackPanel.tsx \
            apps/web/src/domains/creator/layer/StudioLayerEffectsGraphStatus.tsx \
            apps/web/src/domains/creator/layer/studio-layer-effects-graph-adapter.ts \
            apps/web/src/domains/creator/layer/studio-layer-effects-graph-adapter.test.ts \
            apps/web/src/domains/creator/studio-large-epics-product-wiring.test.ts
          pnpm exec vitest run \
            apps/web/src/domains/creator/layer/studio-layer-effects-graph-adapter.test.ts \
            apps/web/src/domains/creator/layer/StudioLayerEffectsStackPanel.test.tsx \
            apps/web/src/domains/creator/studio-large-epics-product-wiring.test.ts
          pnpm exec tsc -p tsconfig.json --noEmit --incremental false
          rm -f .github/workflows/studio-large-epics-deep-fix-v5.yml

      - name: Publish with retries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps .github/workflows/studio-large-epics-deep-fix-v5.yml
          git commit -m "feat(studio): connect layer effects to the live-effect graph"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if git rebase "origin/$BRANCH" && git push origin HEAD:"$BRANCH"; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 7))
          done
          exit 1
