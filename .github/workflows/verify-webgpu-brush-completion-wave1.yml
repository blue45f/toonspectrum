name: Verify WebGPU brush completion wave 1

on:
  push:
    branches:
      - feat/webgpu-brush-completion-wave1-20260904
    paths:
      - .github/workflows/verify-webgpu-brush-completion-wave1.yml
      - src/domains/creator/render/studio-engine-webgpu-tile-provider-production.ts
      - src/domains/creator/render/studio-engine-webgpu-tile-provider-production.test.ts
      - src/domains/creator/brush/studio-wet-media-two-well-field-bridge.ts
      - src/domains/creator/brush/studio-wet-media-two-well-field-bridge.test.ts

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/webgpu-brush-completion-wave1-20260904
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Focused WebGPU and wet-media tests
        run: >-
          pnpm exec vitest run
          src/domains/creator/render/studio-engine-webgpu-tile-provider-production.test.ts
          src/domains/creator/render/studio-engine-webgpu-tile-provider-v2-atlas.test.ts
          src/domains/creator/brush/studio-wet-media-two-well-field-bridge.test.ts
          src/domains/creator/brush/studio-wet-media-two-well-model.test.ts
          src/domains/creator/brush/studio-wet-media-tile-field.test.ts
      - name: Focused lint
        run: >-
          pnpm exec eslint --max-warnings=0
          src/domains/creator/render/studio-engine-webgpu-tile-provider-production.ts
          src/domains/creator/render/studio-engine-webgpu-tile-provider-production.test.ts
          src/domains/creator/brush/studio-wet-media-two-well-field-bridge.ts
          src/domains/creator/brush/studio-wet-media-two-well-field-bridge.test.ts
      - name: Full TypeScript check
        run: pnpm exec tsc -p tsconfig.json --noEmit
      - name: Remove temporary verifier after success
        run: |
          rm .github/workflows/verify-webgpu-brush-completion-wave1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(webgpu): remove wave 1 verifier'
          git push origin HEAD
