name: Prepare brush catalogue merge tree

on:
  push:
    branches: [fix/brush-catalog-consolidation-core-20260912]
    paths:
      - 'scripts/maintenance/finalize-brush-catalog-consolidation.py'
      - 'scripts/maintenance/repair-brush-core-integration.py'
      - '.github/workflows/finalize-brush-catalog-consolidation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-brush-catalog-consolidation
  cancel-in-progress: true

# Source preparation only. Required PR core performs the full release validation.
# Workflow changes are published separately by an authorized maintainer, not GITHUB_TOKEN.
jobs:
  prepare-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/brush-catalog-consolidation-core-20260912
          fetch-depth: 1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Prepare final source and workflow changes
        run: |
          set -euo pipefail
          python scripts/maintenance/finalize-brush-catalog-consolidation.py
          python scripts/maintenance/repair-brush-core-integration.py
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Format and lint changed sources
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only --diff-filter=ACM | grep -E '\.(ts|tsx|mts|mjs|js)$' || true)
          files+=(apps/web/src/domains/creator/bg3d/StudioBg3dViewPanelLazy.tsx)
          files+=(apps/web/src/domains/creator/bg3d/StudioBg3dViewPanelLazy.test.tsx)
          pnpm exec eslint --fix "${files[@]}"
          pnpm exec eslint --max-warnings=0 "${files[@]}"
      - name: Check catalogue and BG3D regressions
        run: |
          set -euo pipefail
          pnpm exec vitest run \
            apps/web/src/domains/creator/brush/studio-brush-quality-portfolio.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-listed-uniqueness.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-catalog-contract.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-browser-evidence.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-composition-runtime.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-composition-runtime-boundary.test.ts \
            apps/web/src/domains/creator/brush/StudioBrushEngineProgramControls.test.tsx \
            apps/web/src/domains/creator/brush-lab/brush-studio-v5-quality.test.ts \
            apps/web/src/domains/creator/brush-lab/brush-studio-version-integration.test.ts \
            apps/web/src/app/routes/groups/creator-brush-lab-route-contract.test.ts \
            apps/web/src/domains/creator/studio-integration-closure.test.ts \
            apps/web/src/domains/creator/bg3d/StudioBg3dViewPanelLazy.test.tsx \
            apps/web/src/domains/creator/bg3d/StudioBg3dViewPanel.test.tsx \
            apps/web/src/domains/creator/bg3d/studio-bg3d-panel-source-boundary.test.ts \
            apps/web/src/domains/creator/bg3d/studio-bg3d-a11y-boundary.test.ts
          pnpm exec tsx scripts/audit-studio-brush-quality-portfolio.mts
      - name: Record workflow patch for separate authorized publication
        run: |
          git diff -- .github/workflows/ci.yml .github/workflows/studio-brush-filter-stability.yml
          git diff --name-only --diff-filter=D -- .github/workflows | while read -r path; do
            printf '%s ' "$path"
            git rev-parse "HEAD:$path"
          done
      - name: Publish prepared sources without changing workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/maintenance/finalize-brush-catalog-consolidation.py
          git rm scripts/maintenance/repair-brush-core-integration.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- apps/web scripts docs
          if git diff --cached --name-only | grep -q '^.github/'; then
            echo 'Workflow changes must be published separately.' >&2
            exit 1
          fi
          git commit -m 'refactor(brush): prepare consolidated catalogue and deferred BG3D controls'
          git push origin HEAD:fix/brush-catalog-consolidation-core-20260912
