name: Sync PR 1307 with current main once

on:
  push:
    branches:
      - feat/toonstudio-final-ia-20260911
    paths:
      - .github/workflows/pr1307-sync-main-once.yml

permissions:
  contents: write

concurrency:
  group: pr1307-sync-main-once
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-final-ia-20260911
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main without reviving stale conflicting files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --prune

          if ! git merge --no-edit -X theirs origin/main; then
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              if git checkout --theirs -- "$path" 2>/dev/null; then
                git add -- "$path"
              else
                git rm -f --ignore-unmatch -- "$path"
              fi
            done < <(git diff --name-only --diff-filter=U)
            git commit --no-edit
          fi

          rm -f .github/workflows/pr1307-sync-main-once.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: finish PR 1307 main synchronization"
          fi
          git push origin HEAD:feat/toonstudio-final-ia-20260911
