name: Apply Lift3D touch target patch

on:
  push:
    branches:
      - fix/lift3d-preview-tab-touch-targets-20260908

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the issue branch
        uses: actions/checkout@v4
        with:
          ref: fix/lift3d-preview-tab-touch-targets-20260908

      - name: Apply the bounded source and regression-test patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("apps/web/src/domains/creator/lift3d/StudioLift3dPage.tsx")
          source = source_path.read_text(encoding="utf-8")
          old = 'className={`min-h-9 flex-1 rounded-md'
          new = 'className={`min-h-11 flex-1 rounded-md'
          if source.count(old) != 1:
              raise SystemExit(f"expected exactly one Lift3D preview-tab class, found {source.count(old)}")
          source_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          test_path = Path("apps/web/src/domains/creator/lift3d/StudioLift3dPage.touch-target.test.ts")
          test_content = "\n".join([
              'import { readFileSync } from "node:fs";',
              '',
              'import { describe, expect, it } from "vitest";',
              '',
              'const source = readFileSync(new URL("./StudioLift3dPage.tsx", import.meta.url), "utf8");',
              '',
              'describe("Studio Lift3D preview touch targets", () => {',
              '  it("keeps every preview tab at least 44px tall", () => {',
              '    expect(source).toContain(\'className={`min-h-11 flex-1 rounded-md\');',
              '    expect(source).not.toContain(\'className={`min-h-9 flex-1 rounded-md\');',
              '  });',
              '});',
              '',
          ])
          test_path.write_text(test_content, encoding="utf-8")
          PY

          rm .github/workflows/apply-lift3d-touch-target-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/domains/creator/lift3d/StudioLift3dPage.tsx \
            apps/web/src/domains/creator/lift3d/StudioLift3dPage.touch-target.test.ts \
            .github/workflows/apply-lift3d-touch-target-patch.yml
          git commit -m "fix(a11y): enlarge Lift3D preview tabs"
          git push origin HEAD:fix/lift3d-preview-tab-touch-targets-20260908
