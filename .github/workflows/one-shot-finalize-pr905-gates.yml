name: One-shot finalize PR 905 aggregate gates

on:
  push:
    branches:
      - ci/gpt56-final-authority-repair-20260908-1836
    paths:
      - .github/workflows/one-shot-finalize-pr905-gates.yml

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: one-shot-finalize-pr905-gates
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: ci/gpt56-final-authority-repair-20260908-1836
    steps:
      - name: Force-cancel superseded branch runs
        run: |
          set -euo pipefail
          for status in queued in_progress; do
            gh api --paginate --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/runs" \
              -f branch="$TARGET_BRANCH" \
              -f status="$status" \
              -f per_page=100 \
              --jq '.workflow_runs[].id' |
            while read -r run_id; do
              if [[ -z "$run_id" || "$run_id" == "$GITHUB_RUN_ID" ]]; then
                continue
              fi
              echo "Force-cancelling superseded run $run_id"
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/force-cancel" \
                >/dev/null 2>&1 || true
            done
          done

      - uses: actions/checkout@v6
        with:
          ref: ci/gpt56-final-authority-repair-20260908-1836
          fetch-depth: 0

      - name: Reset to latest remote head and repair aggregate gates
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          python - <<'PY'
          from pathlib import Path
          import re

          old_expr = "$" + "{{ always() }}"
          new_expr = "$" + "{{ !cancelled() }}"

          ci_path = Path(".github/workflows/ci.yml")
          ci = ci_path.read_text(encoding="utf-8")

          def patch_job(source: str, job_id: str) -> str:
              match = re.search(
                  rf"(?ms)^  {re.escape(job_id)}:\n.*?(?=^  [A-Za-z0-9_-]+:\n|\Z)",
                  source,
              )
              if match is None:
                  raise SystemExit(f"missing CI job: {job_id}")
              section = match.group(0)
              old = f"    if: {old_expr}"
              new = f"    if: {new_expr}"
              if section.count(old) == 1:
                  section = section.replace(old, new, 1)
              elif section.count(new) != 1:
                  raise SystemExit(f"{job_id}: unexpected aggregate condition")
              return source[:match.start()] + section + source[match.end():]

          ci = patch_job(ci, "core")
          ci = patch_job(ci, "verify")
          ci = ci.replace(
              "    # `if: always()` 가 없으면 상류 잡 하나가 실패할 때 이 잡은 \"skipped\" 로 끝나고, GitHub 는\n"
              "    # skipped 필수 체크를 통과로 본다 — 빨간불이 머지 가능한 PR 이 된다. 그래서 언제나 실행하고\n"
              "    # 결과를 직접 읽어 판정한다.\n",
              "    # 상류 잡 실패·skip은 직접 판정하되, 더 새 커밋으로 workflow 전체가 취소되면 함께 종료해\n"
              "    # 구 실행의 집계 잡이 러너와 동시성 슬롯을 붙잡지 않도록 한다.\n",
              1,
          )
          ci = ci.replace(
              "    # 상류 잡이 실패·취소돼도 이 체크는 실패로 보고돼야 한다 — 병합 중립적인 \"skipped\" 로 끝나는\n"
              "    # 일이 없도록 언제나 실행해 결과를 직접 읽는다.\n",
              "    # 상류 잡 실패·skip은 직접 판정하되, 더 새 커밋으로 workflow 전체가 취소되면 함께 종료해\n"
              "    # 구 실행의 집계 잡이 러너와 동시성 슬롯을 붙잡지 않도록 한다.\n",
              1,
          )
          ci_path.write_text(ci, encoding="utf-8")

          policy_path = Path("scripts/integration-test-runner-ci-policy.test.mjs")
          policy = policy_path.read_text(encoding="utf-8")
          replacements = [
              (
                  f'expect(coreJob?.if).toBe("{old_expr}");',
                  f'expect(coreJob?.if).toBe("{new_expr}");',
                  "core policy assertion",
              ),
              (
                  f'expect(releaseGate?.if).toBe("{old_expr}");',
                  f'expect(releaseGate?.if).toBe("{new_expr}");',
                  "verify policy assertion",
              ),
          ]
          for old, new, label in replacements:
              if policy.count(old) == 1:
                  policy = policy.replace(old, new, 1)
              elif policy.count(new) != 1:
                  raise SystemExit(f"{label}: unexpected content")
          policy = policy.replace(
              "    // A skipped required check reads as green to branch protection, so the gate must always run\n"
              "    // and read the upstream results itself.\n",
              "    // Upstream failures and skips are still judged here; only a superseded workflow cancellation\n"
              "    // releases the aggregate runner and concurrency slot.\n",
              1,
          )
          policy = policy.replace(
              "    // queue that wait alone cost 30 minutes per hop (run 2643). A failed or cancelled upstream job\n"
              "    // must still produce a failing verify, never a merge-neutral skipped one, so the gate always\n"
              "    // runs and reads every result itself.\n",
              "    // queue that wait alone cost 30 minutes per hop (run 2643). Failed or skipped upstream jobs\n"
              "    // still produce a failing verify; only a superseded workflow cancellation releases the gate.\n",
              1,
          )
          policy_path.write_text(policy, encoding="utf-8")

          standalone_path = Path("scripts/ci-executed-gates.test.mjs")
          standalone = standalone_path.read_text(encoding="utf-8")
          old = f'  assert.ok(source.includes("if: {old_expr}"));'
          new = f'  assert.ok(source.includes("if: {new_expr}"));'
          if standalone.count(old) == 1:
              standalone = standalone.replace(old, new, 1)
          elif standalone.count(new) != 1:
              raise SystemExit("standalone gate assertion: unexpected content")
          standalone_path.write_text(standalone, encoding="utf-8")

          for job_id in ("core", "verify"):
              section = re.search(
                  rf"(?ms)^  {job_id}:\n.*?(?=^  [A-Za-z0-9_-]+:\n|\Z)",
                  ci,
              ).group(0)
              if f"    if: {new_expr}" not in section or f"    if: {old_expr}" in section:
                  raise SystemExit(f"{job_id}: repair validation failed")
          PY
          git diff --check
          node --test scripts/ci-executed-gates.test.mjs

      - name: Commit repair and retire this one-shot
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-finalize-pr905-gates.yml
          git add \
            .github/workflows/ci.yml \
            scripts/ci-executed-gates.test.mjs \
            scripts/integration-test-runner-ci-policy.test.mjs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ci): release superseded aggregate gates"
          git push origin HEAD:"$TARGET_BRANCH"

      - name: Keep final PR open with auto-merge
        run: |
          set -euo pipefail
          gh api --method PATCH \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/pulls/905" \
            -f state=open >/dev/null
