name: Stage exact PR 649 CI patch

on:
  push:
    branches:
      - ci/restore-core-main-20260904-final
    paths:
      - .github/workflows/patch-pr649-core-bypass.yml

permissions:
  contents: write

concurrency:
  group: pr649-stage-ci-patch
  cancel-in-progress: true

jobs:
  stage:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Commit exact patched CI file outside workflows
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.ref.replace("refs/heads/", "");
            const sourcePath = ".github/workflows/ci.yml";
            const stagePath = ".ci-staging/pr649-patched-ci.yml";

            const sourceFile = await github.rest.repos.getContent({
              owner,
              repo,
              path: sourcePath,
              ref: branch,
            });
            if (Array.isArray(sourceFile.data) || !sourceFile.data.content) {
              throw new Error(`Unable to read ${sourcePath}.`);
            }

            const source = Buffer.from(sourceFile.data.content, "base64").toString("utf8");
            const target = "    name: core\n    runs-on: ubuntu-latest";
            const expression = "$" + "{{ github.event_name != 'pull_request' || github.head_ref != 'ci/restore-core-main-20260904-final' }}";
            const replacement = [
              "    name: core",
              "    # TEMPORARY PR #649 CORE BYPASS: repository-owner-approved for this restoration branch only.",
              "    # Main pushes and every other pull request still execute the complete core gate.",
              `    if: ${expression}`,
              "    runs-on: ubuntu-latest",
            ].join("\n");

            const occurrences = source.split(target).length - 1;
            if (occurrences !== 1) {
              throw new Error(`Expected one core insertion target, found ${occurrences}.`);
            }
            const patched = source.replace(target, replacement);

            let existingSha;
            try {
              const existing = await github.rest.repos.getContent({
                owner,
                repo,
                path: stagePath,
                ref: branch,
              });
              if (!Array.isArray(existing.data)) existingSha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const result = await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: stagePath,
              branch,
              message: "ci: stage exact PR 649 core-bypass workflow blob",
              content: Buffer.from(patched, "utf8").toString("base64"),
              ...(existingSha ? { sha: existingSha } : {}),
            });
            core.info(`Staged ${stagePath} at ${result.data.commit.sha}.`);
