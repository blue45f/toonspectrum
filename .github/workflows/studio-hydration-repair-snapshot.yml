name: Studio hydration repair snapshot
on:
  push:
    branches: [fix/studio-hydration-ci-completion-20260912]
    paths: [.github/workflows/studio-hydration-repair-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive tracked test support without credentials or user data
        run: |
          mkdir -p "$RUNNER_TEMP/hydration-source"
          git rev-parse HEAD > "$RUNNER_TEMP/hydration-source/commit.txt"
          git archive --format=tar HEAD 'vitest.*' apps/web/public/i18n apps/web/config apps/web/index.html apps/api/package.json apps/api/tsconfig.json | gzip > "$RUNNER_TEMP/hydration-source/test-support.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: studio-hydration-test-support
          path: ${{ runner.temp }}/hydration-source
          retention-days: 1
          if-no-files-found: error
