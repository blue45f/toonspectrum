name: Finalize reviewed residual recovery
on:
  push:
    branches: [ops/residual-merge-reconcile-20260913]
    paths: [.github/workflows/residual-merge-finalize.yml]
permissions:
  contents: write
  pull-requests: read
  actions: read
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate exact reviewed sources and create an unreferenced merge commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, io, json, os, pathlib, re, subprocess, urllib.error, urllib.request, zipfile
          api = 'https://api.github.com/repos/blue45f/toonspectrum/'
          main = '9d6d51dacb91fd40d06b23d166b7979ce98a2995'
          head = '0f8a1f2900c9e918f90be02b78986b03bf40de64'
          base = '29aa82c1214fe9dbeba6712fcb9fc523528ef8f2'
          headers = {'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          def request(path,payload=None):
              req=urllib.request.Request(api+path,data=None if payload is None else json.dumps(payload).encode(),headers=headers)
              with urllib.request.urlopen(req,timeout=60) as response: return json.load(response)
          def check_tips():
              assert request('branches/main')['commit']['sha']==main
              pr=request('pulls/1339'); assert pr['state']=='open' and pr['head']['sha']==head
          check_tips()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          try:
              urllib.request.build_opener(NoRedirect).open(urllib.request.Request(api+'actions/artifacts/10304876152/zip',headers=headers),timeout=60)
              raise AssertionError('Expected artifact download redirect')
          except urllib.error.HTTPError as error:
              assert error.code==302
              location=error.headers['Location']; assert location.startswith('https://')
          # Do not forward repository credentials to the signed artifact storage URL.
          with urllib.request.urlopen(location,timeout=60) as response: archive=response.read()
          assert hashlib.sha256(archive).hexdigest()=='20d105b9d5183c31baaf841f27fc66e5e6f7941ca7d58dd3fdaf17004e8d0da9'
          root=pathlib.Path('artifacts/finalized'); root.mkdir(parents=True)
          with zipfile.ZipFile(io.BytesIO(archive)) as zipped:
              for item in zipped.infolist():
                  path=pathlib.PurePosixPath(item.filename)
                  assert not path.is_absolute() and '..' not in path.parts
              zipped.extractall(root)
          path=root/'resolved/scripts/ci-executed-gates.test.mjs'; source=path.read_text()
          old='    const missing = job("static").replace(path, "apps/web/src/unrelated-replacement.test.ts");\n    const decoy = `${missing}\\n      # pnpm exec vitest run ${path}\\n`;'
          new='    const source = job("static");\n    const step = source.split(/(?=^ {6}- name:)/m).find((entry) => entry.startsWith("      - name: Non-3D Studio editing and export regressions\\n"));\n    assert.ok(step, "missing non-3D Studio regression step");\n    const missing = source.replace(step, step.replace(path, "apps/web/src/unrelated-replacement.test.ts"));\n    const decoy = `${missing}\\n      # pnpm exec vitest run ${path}\\n`;'
          assert source.count(old)==1; path.write_text(source.replace(old,new))
          subprocess.run(['node','--test','scripts/ci-executed-gates.test.mjs'],cwd=root/'resolved',check=True)
          trees={}; tree_shas={}
          def tree(ref):
              if ref not in trees:
                  sha=request('git/commits/'+ref)['tree']['sha']; tree_shas[ref]=sha
                  data=request('git/trees/'+sha+'?recursive=1'); assert not data.get('truncated')
                  trees[ref]={e['path']:{k:e[k] for k in ('sha','mode','type')} for e in data['tree'] if e['type']!='tree'}
              return trees[ref]
          mt,ht,bt=tree(main),tree(head),tree(base)
          changed={p for p in set(bt)|set(ht) if bt.get(p)!=ht.get(p)}; assert len(changed)==57
          entries=[]
          for path in (root/'resolved').rglob('*'):
              if not path.is_file(): continue
              relative=path.relative_to(root/'resolved').as_posix(); raw=path.read_bytes()
              sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              if relative in mt and sha==mt[relative]['sha']: continue
              assert relative in changed, 'Unexpected candidate edit: '+relative
              content=raw.decode(); assert not re.search(r'^(<<<<<<<|=======|>>>>>>>)',content,re.M)
              entry={'path':relative,'mode':ht[relative]['mode'],'type':'blob'}
              if sha==ht[relative]['sha']: entry['sha']=sha
              else: entry['content']=content
              entries.append(entry)
          assert {e['path'] for e in entries}=={p for p in changed if mt.get(p)!=ht.get(p)}
          def blob(sha):
              data=request('git/blobs/'+sha); assert data['encoding']=='base64'
              return base64.b64decode(data['content'])
          ancillary=[]
          for branch in ['fix/creator-work-500-core-import-20260912','ops/clear-obsolete-api-ci-20260912','work/api-merge-audit-20260913']:
              tip=request('branches/'+branch)['commit']['sha']; comparison=request('compare/'+main+'...'+tip+'?per_page=1')
              old,feature=tree(comparison['merge_base_commit']['sha']),tree(tip)
              delta=sorted(p for p in set(old)|set(feature) if old.get(p)!=feature.get(p))
              different=[p for p in delta if mt.get(p)!=feature.get(p)]
              for relative in different:
                  for label,mapping in [('side',feature),('main',mt),('base',old)]:
                      if relative in mapping:
                          target=root/'ancillary'/branch/label/relative; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(blob(mapping[relative]['sha']))
              ancillary.append({'branch':branch,'head':tip,'different':different})
          check_tips()
          new_tree=request('git/trees',{'base_tree':tree_shas[main],'tree':entries})['sha']
          commit=request('git/commits',{'message':'merge: reconcile recovered Studio work with current production fixes\n\nPreserve current CI protections and ten recovered suites. Scope non-3D fixture mutations to their own step. Await lazy module loading without relaxing draw/pixel capture assertions or the bundle ratchet.','tree':new_tree,'parents':[head,main]})
          report={'main':main,'head':head,'base':base,'candidate':commit['sha'],'tree':new_tree,'changed_files':sorted(e['path'] for e in entries),'ancillary':ancillary,'branch_refs_updated':False}
          (root/'candidate.json').write_text(json.dumps(report,indent=2)); print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: finalized-residual-recovery
          path: artifacts/finalized
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
