name: Finalize reviewed residual recovery
on:
  push:
    branches: [ops/residual-merge-reconcile-20260913]
    paths: [.github/workflows/residual-merge-finalize.yml]
permissions:
  contents: write
  pull-requests: read
  actions: read
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate sources and stage immutable blobs without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, io, json, os, pathlib, re, subprocess, urllib.error, urllib.request, zipfile
          api = 'https://api.github.com/repos/blue45f/toonspectrum/'
          main = '9d6d51dacb91fd40d06b23d166b7979ce98a2995'
          head = '0f8a1f2900c9e918f90be02b78986b03bf40de64'
          base = '29aa82c1214fe9dbeba6712fcb9fc523528ef8f2'
          headers = {'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          def request(path,payload=None):
              req=urllib.request.Request(api+path,data=None if payload is None else json.dumps(payload).encode(),headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=60) as response: return json.load(response)
              except urllib.error.HTTPError as error:
                  print('GitHub API error:',path,error.code,error.read().decode(),flush=True)
                  raise
          assert request('branches/main')['commit']['sha']==main
          pr=request('pulls/1339'); assert pr['state']=='open' and pr['head']['sha']==head
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          try:
              urllib.request.build_opener(NoRedirect).open(urllib.request.Request(api+'actions/artifacts/10303723951/zip',headers=headers),timeout=60)
              raise AssertionError('Expected download redirect')
          except urllib.error.HTTPError as error:
              assert error.code==302
              location=error.headers['Location']; assert location.startswith('https://')
          with urllib.request.urlopen(location,timeout=60) as response: archive=response.read()
          assert hashlib.sha256(archive).hexdigest()=='9dbbec7bc874a4b1fe661d610dcc1ecece8b6c277e58fd3b7b5ad74cd71f8c69'
          root=pathlib.Path('artifacts/finalized'); root.mkdir(parents=True)
          with zipfile.ZipFile(io.BytesIO(archive)) as zipped:
              for item in zipped.infolist():
                  path=pathlib.PurePosixPath(item.filename)
                  assert not path.is_absolute() and '..' not in path.parts
              zipped.extractall(root)
          subprocess.run(['node','--test','scripts/ci-executed-gates.test.mjs'],cwd=root/'resolved',check=True)
          def tree(ref):
              sha=request('git/commits/'+ref)['tree']['sha']
              data=request('git/trees/'+sha+'?recursive=1'); assert not data.get('truncated')
              return sha,{e['path']:{k:e[k] for k in ('sha','mode','type')} for e in data['tree'] if e['type']!='tree'}
          main_tree,mt=tree(main); _,ht=tree(head); _,bt=tree(base)
          changed={p for p in set(bt)|set(ht) if bt.get(p)!=ht.get(p)}; assert len(changed)==57
          expected_new={'.github/workflows/ci.yml':'501231f85cc41a06f0c57cbb43fe48b91e05dce4','apps/web/src/domains/creator/StudioCuttoonEditorHost.tsx':'2d98b002aff67ca144c3ee2c1d3f3b9f86f59bd3','apps/web/src/domains/creator/canvas/StudioLiveAdjustmentGroup.test.tsx':'24004822f244aae78816d5b102d064cdd10d0c5a','apps/web/src/domains/creator/live/studio-crdt-page-bridge.ts':'3a7d5e38fb5ca3c167fc060f02c6b9df70b604ed','scripts/ci-executed-gates.test.mjs':'da3d674ea687ea4502afaebeb6f960d38921bd70'}
          entries=[]
          for path in sorted((root/'resolved').rglob('*')):
              if not path.is_file(): continue
              relative=path.relative_to(root/'resolved').as_posix(); raw=path.read_bytes()
              sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              if relative in mt and sha==mt[relative]['sha']: continue
              assert relative in changed
              content=raw.decode(); assert not re.search(r'^(<<<<<<<|=======|>>>>>>>)',content,re.M)
              if sha!=ht[relative]['sha']:
                  assert expected_new[relative]==sha
                  result=request('git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
                  assert result['sha']==sha
                  print('Staged source object:',relative,sha,flush=True)
              entries.append({'path':relative,'mode':ht[relative]['mode'],'type':'blob','sha':sha})
          assert len(entries)==48
          report={'main':main,'head':head,'base_tree':main_tree,'tree_elements':entries,'refs_updated':False}
          (root/'staged-objects.json').write_text(json.dumps(report,indent=2)); print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: finalized-residual-recovery
          path: artifacts/finalized
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
