name: Character Shaper PR754 failure diagnosis
on:
  push:
    branches: [ai/shaper-pr754-ci-diagnosis-20260905]
    paths: [.github/workflows/character-shaper-ci-diagnosis.yml]
permissions:
  contents: read
  actions: read
jobs:
  summarize-existing-failure:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Download integration check log
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/actions/jobs/101306325024/logs" \
            --output "$RUNNER_TEMP/shaper-core.log"
      - name: Print bounded diagnostics (not a test result)
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          raw = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'shaper-core.log').read_text(errors='replace')
          raw = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', raw)
          raw = re.sub(r'[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]', '', raw)
          lines = raw.splitlines()
          pattern = re.compile(r'\bFAIL\b|error TS\d+|AssertionError:|Test Files\s|\bTests\s+\d+|##\[(?:error|warning)\]|timed out|cancel|ELIFECYCLE', re.I)
          hits = [i for i, line in enumerate(lines) if pattern.search(line)]
          print(f'Integration job 101306325024: {len(lines)} lines, {len(hits)} diagnostic markers')
          selected = set()
          for i in hits[-40:]:
              selected.update(range(max(0, i-2), min(len(lines), i+6)))
          text = '\n'.join(f'{i+1}: {lines[i][:900]}' for i in sorted(selected))
          print(text[-20000:])
          PY
