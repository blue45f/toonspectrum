name: Temporary Studio production protected merge controller

on:
  push:
    branches:
      - feat/studio-production-command-center-20260905
    paths:
      - .github/workflows/tmp-studio-production-merge-controller.yml
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  statuses: read

env:
  GH_TOKEN: ${{ github.token }}
  REPOSITORY: ${{ github.repository }}
  FINAL_BRANCH: feat/studio-production-command-center-final-20260905

jobs:
  protected-merge-controller:
    runs-on: ubuntu-slim
    timeout-minutes: 180
    steps:
      - name: Create, ready and auto-merge the clean product PR
        shell: bash
        run: |
          set -euo pipefail
          pr_number=$(gh api "repos/${REPOSITORY}/pulls?head=blue45f:${FINAL_BRANCH}&state=open" --jq '.[0].number // empty')
          if [[ -z "$pr_number" ]]; then
            gh pr create --repo "$REPOSITORY" --head "$FINAL_BRANCH" --base main \
              --title 'feat(studio): add production command center' \
              --body $'## Summary\n\n- replace Studio projects, review, versions, presentation, sharing and join placeholders with production-ready workspaces\n- add typed production state and SQLite/OPFS persistence\n- add guarded same-origin collaboration transport and route reconciliation\n- integrate title ownership, lifecycle, accessibility and focused regression coverage\n\n## Merge policy\n\nThe protected `core` check remains the merge authority. Temporary delivery workflows and archive chunks are excluded from the pull-request head.' >/tmp/pr-url
            pr_number=$(sed 's#.*/##' /tmp/pr-url)
          fi
          gh pr ready "$pr_number" --repo "$REPOSITORY" >/dev/null 2>&1 || true

          for attempt in $(seq 1 510); do
            pr=$(gh api "repos/${REPOSITORY}/pulls/${pr_number}")
            merged_at=$(printf '%s' "$pr" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("merged_at") or "")')
            if [[ -n "$merged_at" ]]; then
              echo "PR #${pr_number} merged at ${merged_at}"
              exit 0
            fi
            state=$(printf '%s' "$pr" | python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])')
            [[ "$state" == 'open' ]] || { echo "PR closed without merge" >&2; exit 1; }
            head_sha=$(printf '%s' "$pr" | python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')
            mergeable_state=$(printf '%s' "$pr" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("mergeable_state") or "unknown")')

            if [[ "$attempt" == '1' || $((attempt % 30)) -eq 0 ]]; then
              gh pr merge "$pr_number" --repo "$REPOSITORY" --auto --squash \
                --match-head-commit "$head_sha" \
                --subject 'feat(studio): add production command center' \
                --body 'Land production projects, review, versions, presentation, sharing and join workspaces with typed state, SQLite/OPFS persistence, guarded collaboration transport and route/accessibility contracts.' >/dev/null 2>&1 || true
            fi

            core_status=$(gh api "repos/${REPOSITORY}/commits/${head_sha}/status" --jq '[.statuses[] | select(.context == "core")][0].state // empty' 2>/dev/null || true)
            core_check=$(gh api "repos/${REPOSITORY}/commits/${head_sha}/check-runs" -H 'Accept: application/vnd.github+json' --jq '[.check_runs[] | select(.name == "core")][0].conclusion // empty' 2>/dev/null || true)
            if [[ "$core_status" == 'success' || "$core_check" == 'success' ]]; then
              result=$(gh api --method PUT "repos/${REPOSITORY}/pulls/${pr_number}/merge" \
                -f sha="$head_sha" \
                -f merge_method=squash \
                -f commit_title='feat(studio): add production command center' \
                -f commit_message='Land production projects, review, versions, presentation, sharing and join workspaces with typed state, SQLite/OPFS persistence, guarded collaboration transport and route/accessibility contracts.' 2>/dev/null || true)
              merged=$(printf '%s' "$result" | python3 -c 'import json,sys; print("1" if json.load(sys.stdin).get("merged") else "0")' 2>/dev/null || echo 0)
              [[ "$merged" == '1' ]] && exit 0
            fi

            if [[ "$mergeable_state" == 'behind' && $((attempt % 15)) -eq 0 ]]; then
              gh api --method PUT "repos/${REPOSITORY}/pulls/${pr_number}/update-branch" -f expected_head_sha="$head_sha" >/dev/null 2>&1 || true
            fi

            if [[ "$core_status" == 'failure' || "$core_check" == 'failure' ]]; then
              if (( attempt % 30 == 0 )); then
                gh api "repos/${REPOSITORY}/actions/runs?head_sha=${head_sha}&per_page=100" \
                  --jq '.workflow_runs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | .id' \
                  | while read -r run_id; do
                      [[ -z "$run_id" ]] && continue
                      gh api --method POST "repos/${REPOSITORY}/actions/runs/${run_id}/rerun-failed-jobs" >/dev/null 2>&1 || \
                        gh api --method POST "repos/${REPOSITORY}/actions/runs/${run_id}/rerun" >/dev/null 2>&1 || true
                    done
              fi
            fi
            sleep 20
          done
          echo 'protected merge controller timed out' >&2
          exit 1
