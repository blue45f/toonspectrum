name: Final orphan cleanup branch prune

on:
  pull_request:
    branches:
      - ops/final-orphan-prune-base-20260910-1738
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: final-orphan-prune-20260910-1738
  cancel-in-progress: true

jobs:
  prune:
    if: >-
      github.repository == 'blue45f/toonspectrum' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ops/final-orphan-prune-trigger-20260910-1738' &&
      github.base_ref == 'ops/final-orphan-prune-base-20260910-1738'
    runs-on: macos-14
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SELF_PR: ${{ github.event.pull_request.number }}
      SELF_HEAD: ${{ github.event.pull_request.head.ref }}
      SELF_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SELF_BASE: ${{ github.event.pull_request.base.ref }}
      SELF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Verify and delete exact tree-identical orphan
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/final-orphan-prune.cjs <<'NODE'
          const fs = require('node:fs');

          const repository = process.env.REPO;
          const [owner, repo] = repository.split('/');
          const token = process.env.GH_TOKEN;
          const selfPr = Number(process.env.SELF_PR);
          const selfHead = process.env.SELF_HEAD;
          const selfHeadSha = process.env.SELF_HEAD_SHA;
          const selfBase = process.env.SELF_BASE;
          const selfBaseSha = process.env.SELF_BASE_SHA;
          const expectedMain = '218448adb78a94c44f49be8c19ba9efbb79198b7';
          const target = 'ops/isolated-prune-base-20260910-1701';
          const targetSha = '1fd92c430125b578b6ea481dbc2eb7b776f6d18a';
          const workflowFile = '.github/workflows/final-orphan-prune-20260910-1738.yml';
          const triggerFile = '.ops/final-orphan-prune-trigger-20260910-1738.txt';
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'toonspectrum-final-orphan-prune',
          };
          const active = new Set(['queued', 'in_progress', 'pending', 'waiting', 'requested']);

          class HttpError extends Error {
            constructor(status, method, path, body) {
              super(`${method} ${path} -> ${status}: ${body}`);
              this.status = status;
            }
          }

          const encodeRef = (ref) => ref.split('/').map(encodeURIComponent).join('/');

          async function api(path, init = {}) {
            const method = init.method || 'GET';
            const response = await fetch(`https://api.github.com${path}`, {
              ...init,
              headers: {
                ...headers,
                ...(init.body ? { 'Content-Type': 'application/json' } : {}),
              },
            });
            if (response.status === 204) return null;
            const text = await response.text();
            if (!response.ok) throw new HttpError(response.status, method, path, text);
            return text ? JSON.parse(text) : null;
          }

          async function maybe(path) {
            try { return await api(path); }
            catch (error) {
              if ([404, 422].includes(error.status)) return null;
              throw error;
            }
          }

          function assertExactFiles(compare, expected) {
            const actual = [...new Set((compare.files || []).map((file) => file.filename))].sort();
            const wanted = [...expected].sort();
            if (JSON.stringify(actual) !== JSON.stringify(wanted)) {
              throw new Error(`unexpected isolated files: expected ${JSON.stringify(wanted)}, found ${JSON.stringify(actual)}`);
            }
          }

          async function openRefs(branch) {
            const [heads, bases] = await Promise.all([
              api(`/repos/${owner}/${repo}/pulls?state=open&head=${encodeURIComponent(`${owner}:${branch}`)}&per_page=100`),
              api(`/repos/${owner}/${repo}/pulls?state=open&base=${encodeURIComponent(branch)}&per_page=100`),
            ]);
            return [...heads, ...bases];
          }

          async function deleteExact(branch, sha) {
            const branchPath = `/repos/${owner}/${repo}/branches/${encodeRef(branch)}`;
            const refPath = `/repos/${owner}/${repo}/git/ref/heads/${encodeRef(branch)}`;
            const [branchInfo, refInfo] = await Promise.all([api(branchPath), api(refPath)]);
            if (branchInfo.protected || branchInfo.commit?.sha !== sha || refInfo.object?.sha !== sha) {
              throw new Error(`${branch} moved or became protected`);
            }
            await api(`/repos/${owner}/${repo}/git/refs/heads/${encodeRef(branch)}`, { method: 'DELETE' });
            if (await maybe(refPath)) throw new Error(`${branch} still exists after deletion`);
          }

          (async () => {
            const repoInfo = await api(`/repos/${owner}/${repo}`);
            if (repoInfo.default_branch !== 'main') throw new Error(`default branch changed: ${repoInfo.default_branch}`);
            const main = await api(`/repos/${owner}/${repo}/branches/main`);
            if (!main.protected || main.commit?.sha !== expectedMain) throw new Error('protected main snapshot changed');
            const mainCommit = await api(`/repos/${owner}/${repo}/commits/${expectedMain}`);

            const pr = await api(`/repos/${owner}/${repo}/pulls/${selfPr}`);
            if (pr.state !== 'open' || pr.merged_at || !pr.draft || pr.head?.repo?.full_name !== repository || pr.head?.ref !== selfHead || pr.head?.sha !== selfHeadSha || pr.base?.ref !== selfBase || pr.base?.sha !== selfBaseSha) {
              throw new Error('isolated cleanup PR identity changed');
            }

            const [selfHeadInfo, selfBaseInfo] = await Promise.all([
              api(`/repos/${owner}/${repo}/branches/${encodeRef(selfHead)}`),
              api(`/repos/${owner}/${repo}/branches/${encodeRef(selfBase)}`),
            ]);
            if (selfHeadInfo.protected || selfHeadInfo.commit?.sha !== selfHeadSha || selfBaseInfo.protected || selfBaseInfo.commit?.sha !== selfBaseSha) {
              throw new Error('isolated runner refs changed');
            }
            assertExactFiles(await api(`/repos/${owner}/${repo}/compare/${expectedMain}...${selfBaseSha}`), [workflowFile]);
            assertExactFiles(await api(`/repos/${owner}/${repo}/compare/${expectedMain}...${selfHeadSha}`), [workflowFile, triggerFile]);

            let decision = 'already_missing';
            const targetPath = `/repos/${owner}/${repo}/branches/${encodeRef(target)}`;
            const targetInfo = await maybe(targetPath);
            if (targetInfo) {
              if (targetInfo.protected || targetInfo.commit?.sha !== targetSha) throw new Error('target moved or became protected');
              if ((await openRefs(target)).length) throw new Error('target has an open PR reference');
              const runs = await api(`/repos/${owner}/${repo}/actions/runs?branch=${encodeURIComponent(target)}&per_page=100`);
              if ((runs.workflow_runs || []).some((run) => active.has(run.status))) throw new Error('target has an active workflow run');
              const targetCommit = await api(`/repos/${owner}/${repo}/commits/${targetSha}`);
              const message = targetCommit.commit?.message || '';
              if (targetCommit.commit?.tree?.sha !== mainCommit.commit?.tree?.sha) throw new Error('target tree differs from current main');
              if (!message.includes('normalize isolated cleanup base to main tree') || !message.includes('No product files are changed')) throw new Error('target retirement proof changed');

              const tag = `branch-cleanup-backup/20260910/ops--isolated-prune-base-20260910-1701-${targetSha.slice(0, 12)}`;
              const tagPath = `/repos/${owner}/${repo}/git/ref/tags/${encodeRef(tag)}`;
              const existingTag = await maybe(tagPath);
              if (existingTag) {
                if (existingTag.object?.sha !== targetSha) throw new Error('backup tag conflict');
              } else {
                await api(`/repos/${owner}/${repo}/git/refs`, {
                  method: 'POST',
                  body: JSON.stringify({ ref: `refs/tags/${tag}`, sha: targetSha }),
                });
              }

              const finalTarget = await api(targetPath);
              if (finalTarget.protected || finalTarget.commit?.sha !== targetSha || (await openRefs(target)).length) throw new Error('target changed during final recheck');
              await deleteExact(target, targetSha);
              decision = 'deleted';
            }

            const [finalHead, finalBase] = await Promise.all([
              api(`/repos/${owner}/${repo}/branches/${encodeRef(selfHead)}`),
              api(`/repos/${owner}/${repo}/branches/${encodeRef(selfBase)}`),
            ]);
            if (finalHead.protected || finalHead.commit?.sha !== selfHeadSha || finalBase.protected || finalBase.commit?.sha !== selfBaseSha) throw new Error('isolated runner refs changed before self-clean');
            if ((await openRefs(selfHead)).some((item) => item.number !== selfPr) || (await openRefs(selfBase)).some((item) => item.number !== selfPr)) throw new Error('unexpected open PR references isolated runner');

            await api(`/repos/${owner}/${repo}/pulls/${selfPr}`, {
              method: 'PATCH',
              body: JSON.stringify({ state: 'closed' }),
            });
            await deleteExact(selfHead, selfHeadSha);
            await deleteExact(selfBase, selfBaseSha);

            const summary = [
              '# Final orphan cleanup result',
              '',
              `- Target: \`${target}\` @ \`${targetSha}\``,
              `- Decision: **${decision}**`,
              `- Protected main unchanged: \`${expectedMain}\``,
              `- Closed temporary PR: #${selfPr}`,
              '- Deleted temporary runner head/base',
              '- Product files changed: `0`',
              '',
            ].join('\n');
            console.log(summary);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          })().catch((error) => {
            console.error(error.stack || String(error));
            process.exitCode = 1;
          });
          NODE
          node /tmp/final-orphan-prune.cjs
