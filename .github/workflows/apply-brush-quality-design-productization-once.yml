name: Apply brush quality design productization once

on:
  workflow_dispatch:
  push:
    branches:
      - feat/brush-quality-design-productization-20260912
    paths:
      - .github/workflows/apply-brush-quality-design-productization-once.yml
      - scripts/maintenance/apply-brush-quality-design-productization.py

permissions:
  contents: write

concurrency:
  group: apply-brush-quality-design-productization-once
  cancel-in-progress: true

jobs:
  apply-validate-commit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    env:
      CI: "true"
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout productization branch
        uses: actions/checkout@v4
        with:
          ref: feat/brush-quality-design-productization-20260912
          fetch-depth: 0
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Apply productization patch
        run: python3 scripts/maintenance/apply-brush-quality-design-productization.py

      - name: Normalize changed sources
        run: |
          pnpm exec prettier --write \
            apps/web/src/domains/creator/brush/studio-brush-quality-design-catalog.ts \
            apps/web/src/domains/creator/brush/studio-brush-quality-design-bridge.ts \
            apps/web/src/domains/creator/brush/studio-brush-quality-design-bridge.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-catalog.ts \
            apps/web/src/domains/creator/brush/studio-brush-selection.ts \
            apps/web/src/domains/creator/brush-lab/brush-studio-v5-quality-catalog.ts \
            apps/web/src/domains/creator/brush-lab/StudioBrushLegacyCataloguePanel.tsx \
            docs/rewrite/brush-quality-design-productization-20260912.md

      - name: Strict lint changed sources
        run: |
          pnpm exec eslint --max-warnings=0 \
            apps/web/src/domains/creator/brush/studio-brush-quality-design-catalog.ts \
            apps/web/src/domains/creator/brush/studio-brush-quality-design-bridge.ts \
            apps/web/src/domains/creator/brush/studio-brush-quality-design-bridge.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-catalog.ts \
            apps/web/src/domains/creator/brush/studio-brush-selection.ts \
            apps/web/src/domains/creator/brush-lab/brush-studio-v5-quality-catalog.ts \
            apps/web/src/domains/creator/brush-lab/StudioBrushLegacyCataloguePanel.tsx

      - name: Root typecheck
        run: pnpm exec tsc -p tsconfig.json --noEmit --pretty false

      - name: Focused brush regression suite
        run: |
          pnpm exec vitest run \
            apps/web/src/domains/creator/brush/studio-brush-quality-design-bridge.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-selection.test.ts \
            apps/web/src/domains/creator/brush/studio-brush-catalog-core.test.ts \
            apps/web/src/domains/creator/brush-lab/brush-studio-version-integration.test.ts \
            apps/web/src/domains/creator/brush-lab/brush-studio-v6-engine.test.ts

      - name: Vercel-equivalent production build
        run: pnpm --filter @webtoon-nest/api build && pnpm run build

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: brush-quality-design-productization-diagnostics
          path: |
            apps/web/src/domains/creator/brush/studio-brush-quality-design-catalog.ts
            apps/web/src/domains/creator/brush/studio-brush-quality-design-bridge.ts
            apps/web/src/domains/creator/brush/studio-brush-quality-design-bridge.test.ts
            apps/web/src/domains/creator/brush/studio-brush-catalog.ts
            apps/web/src/domains/creator/brush-lab/StudioBrushLegacyCataloguePanel.tsx
          retention-days: 1

      - name: Commit validated productization
        run: |
          rm scripts/maintenance/apply-brush-quality-design-productization.py
          rm .github/workflows/apply-brush-quality-design-productization-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(brush): surface 72 quality designs in product catalogue"
          git push origin HEAD:feat/brush-quality-design-productization-20260912
