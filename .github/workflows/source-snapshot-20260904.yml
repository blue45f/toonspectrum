name: Source snapshot 20260904

on:
  push:
    branches:
      - automation/source-snapshot-20260904
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: toonspectrum-source-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            .github
            src
            e2e
            scripts
            tests
            package.json
            pnpm-lock.yaml
            playwright.config.*
            tsconfig*.json
            vite.config.*
            vitest.config.*
