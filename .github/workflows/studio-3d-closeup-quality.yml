name: Studio 3D close-up quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/domains/creator/vrm/**'
      - 'src/domains/creator/character-shaper/**'
      - 'scripts/verify-studio-3d-closeup.mts'
      - '.github/workflows/studio-3d-closeup-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-3d-closeup-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: '0'
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Execute character and wardrobe regression tests
        run: pnpm exec vitest run src/domains/creator/vrm src/domains/creator/character-shaper --maxWorkers=1
      - name: Typecheck and build actual application
        run: pnpm run build
      - run: git rev-parse HEAD > dist/studio-3d-review-head.txt
      - uses: actions/upload-artifact@v6
        with:
          name: studio-3d-build-${{ github.run_id }}
          path: dist
          retention-days: 2
          compression-level: 1
          if-no-files-found: error
  rendered-review:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        lane: [top, bottom, shoes, accessory]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: '0'
      NODE_OPTIONS: --max-old-space-size=8192
      TOONSPECTRUM_VERIFY_ORIGIN: http://127.0.0.1:5173
      STUDIO_CLOSEUP_OUTPUT: /tmp/studio-3d-closeup
      STUDIO_CLOSEUP_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v6
        with:
          name: studio-3d-build-${{ github.run_id }}
          path: dist
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start immutable application build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$STUDIO_CLOSEUP_OUTPUT"
          test "$(cat dist/studio-3d-review-head.txt)" = "$(git rev-parse HEAD)"
          git rev-parse HEAD > "$STUDIO_CLOSEUP_OUTPUT/source-head.txt"
          pnpm exec vite preview --host 127.0.0.1 --port 5173 --strictPort > "$STUDIO_CLOSEUP_OUTPUT/vite.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail "$TOONSPECTRUM_VERIFY_ORIGIN/" >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Capture actual UI changes and enlarged views
        timeout-minutes: 22
        run: pnpm exec tsx scripts/verify-studio-3d-closeup.mts
      - name: Emit manifest
        if: always()
        run: test ! -f "$STUDIO_CLOSEUP_OUTPUT/evidence.json" || cat "$STUDIO_CLOSEUP_OUTPUT/evidence.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: studio-3d-closeup-${{ matrix.lane }}-${{ github.sha }}
          path: /tmp/studio-3d-closeup
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
