name: Studio 3D close-up quality

on:
  push:
    branches: [fix/studio-3d-closeup-quality-20260906]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-3d-closeup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rendered-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: '0'
      NODE_OPTIONS: --max-old-space-size=8192
      TOONSPECTRUM_VERIFY_ORIGIN: http://127.0.0.1:5173
      STUDIO_CLOSEUP_OUTPUT: /tmp/studio-3d-closeup
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser for genuine composed-frame evidence
        run: pnpm exec playwright install --with-deps chromium
      - name: Start this exact checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$STUDIO_CLOSEUP_OUTPUT"
          git rev-parse HEAD > "$STUDIO_CLOSEUP_OUTPUT/source-head.txt"
          pnpm exec vite --host 127.0.0.1 --port 5173 --strictPort > "$STUDIO_CLOSEUP_OUTPUT/vite.log" 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --silent --fail "$TOONSPECTRUM_VERIFY_ORIGIN/" >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Capture actual UI changes and close-up views
        run: pnpm exec tsx scripts/verify-studio-3d-closeup.mts
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: studio-3d-closeup-${{ github.sha }}
          path: /tmp/studio-3d-closeup
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
