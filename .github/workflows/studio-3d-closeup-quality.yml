name: Studio 3D close-up quality

on:
  push:
    branches: [fix/studio-3d-closeup-quality-20260906]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-3d-closeup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rendered-review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HUSKY: '0'
      NODE_OPTIONS: --max-old-space-size=8192
      TOONSPECTRUM_VERIFY_ORIGIN: http://127.0.0.1:5173
      STUDIO_CLOSEUP_OUTPUT: /tmp/studio-3d-closeup
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Build actual application
        run: pnpm run build
      - name: Start immutable build and repair baseline locator ambiguity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$STUDIO_CLOSEUP_OUTPUT"
          git rev-parse HEAD > "$STUDIO_CLOSEUP_OUTPUT/source-head.txt"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify-studio-3d-closeup.mts')
          s = p.read_text()
          s = s.replace('button[aria-label="확대"]:not(:disabled)`).waitFor', '[data-character-shaper-hud] button[aria-label="확대"]:not(:disabled)`).waitFor')
          p.write_text(s)
          PY
          pnpm exec vite preview --host 127.0.0.1 --port 5173 --strictPort > "$STUDIO_CLOSEUP_OUTPUT/vite.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail "$TOONSPECTRUM_VERIFY_ORIGIN/" >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Inspect real wardrobe and accessory catalog
        run: pnpm exec tsx scripts/verify-studio-3d-closeup.mts
      - name: Emit review manifest even on failure
        if: always()
        run: |
          if test -f "$STUDIO_CLOSEUP_OUTPUT/evidence.json"; then cat "$STUDIO_CLOSEUP_OUTPUT/evidence.json"; fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: studio-3d-closeup-${{ github.sha }}
          path: /tmp/studio-3d-closeup
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
