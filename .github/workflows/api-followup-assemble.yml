name: Assemble checked API runtime sources
on:
  push:
    branches: [work/api-runtime-followup-20260912]
    paths: [.github/workflows/api-followup-assemble.yml]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate every source before applying any change
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/work/api-runtime-followup-20260912
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path.cwd(); staged={}
          for manifest in sorted(root.glob('.api-followup-edits/[1-4].json')):
              for op in json.loads(manifest.read_text()):
                  relative=pathlib.PurePosixPath(op['path'])
                  assert not relative.is_absolute() and '..' not in relative.parts
                  old=(root/relative).read_bytes()
                  assert hashlib.sha256(old).hexdigest()==op['before'], f"Changed base: {relative}"
                  lines=old.decode().splitlines(keepends=True)
                  for start,end,text in reversed(op['edits']): lines[start:end]=text.splitlines(keepends=True)
                  body=''.join(lines).encode()
                  assert hashlib.sha256(body).hexdigest()==op['after'], f"Edit integrity mismatch: {relative}"
                  staged[str(relative)]=body
          expected=json.loads((root/'.api-followup-edits/hashes.json').read_text())
          assert len(expected)==43 and len(staged)==18
          for name,digest in expected.items():
              body=staged[name] if name in staged else (root/name).read_bytes()
              assert hashlib.sha256(body).hexdigest()==digest, f"Source integrity mismatch: {name}"
          old=(root/'vercel.json').read_text(); anchor='"includeFiles": "dist/index.html"'
          assert json.loads(old)['functions']['api/og.js']['includeFiles']=='dist/index.html' and old.count(anchor)==1
          staged['vercel.json']=old.replace(anchor,'"includeFiles": "{dist/index.html,dist/og/titles/**}"').encode()
          for name,body in staged.items(): (root/name).write_bytes(body)
          print('43 source hashes verified; 18 source edits and OG packaging applied')
          PY
          node --experimental-strip-types --test scripts/api-followup-unit.test.mjs
          node --test scripts/ci-core-gate.test.mjs scripts/ci-executed-gates.test.mjs
      - name: Publish only the guarded feature branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/work/api-runtime-followup-20260912
          git rm -r .api-followup-edits .github/workflows/api-followup-apply.yml .github/workflows/api-followup-workspace.yml .github/workflows/api-followup-assemble.yml
          git add -u
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf(api): integrate bounded search, local OG and isolated runtime graphs'
          remote=$(git ls-remote origin refs/heads/work/api-runtime-followup-20260912 | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/work/api-runtime-followup-20260912
