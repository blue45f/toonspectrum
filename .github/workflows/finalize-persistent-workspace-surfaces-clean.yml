name: Finalize clean persistent Studio workspace surfaces

on:
  push:
    branches:
      - feat/studio-persistent-workspace-surfaces-clean-20260904
    paths:
      - ".github/workflows/finalize-persistent-workspace-surfaces-clean.yml"

permissions:
  contents: write

concurrency:
  group: finalize-persistent-workspace-surfaces-clean-20260904
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/studio-persistent-workspace-surfaces-clean-20260904
          fetch-depth: 0
      - name: Apply current floating-surface contract adaptation
        run: |
          python3 scripts/adapt-persistent-workspace-surfaces.py
          git diff --check
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Normalize jsdom pointer input and focused source quality
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/domains/creator/StudioFloatingSurface.test.tsx')
          source = path.read_text(encoding='utf-8')
          marker = 'import { StudioFloatingSurface } from "./StudioFloatingSurface";\n\n'
          addition = '''class StudioFloatingSurfaceTestPointerEvent extends MouseEvent {
            readonly pointerId: number;
            readonly pointerType: string;
            readonly isPrimary: boolean;

            constructor(type: string, init: PointerEventInit = {}) {
              super(type, init);
              this.pointerId = init.pointerId ?? 0;
              this.pointerType = init.pointerType ?? "mouse";
              this.isPrimary = init.isPrimary ?? true;
            }
          }

          Object.defineProperty(globalThis, "PointerEvent", {
            configurable: true,
            value: StudioFloatingSurfaceTestPointerEvent,
          });

          '''.replace('          ', '')
          if 'class StudioFloatingSurfaceTestPointerEvent' not in source:
              if source.count(marker) != 1:
                  raise SystemExit(f'expected one PointerEvent insertion marker, found {source.count(marker)}')
              source = source.replace(marker, marker + addition, 1)
              path.write_text(source, encoding='utf-8')
          PY
          pnpm exec eslint --fix \
            src/domains/creator/StudioAnimaticTimelineDialog.tsx \
            src/domains/creator/StudioAnimaticTimelineDialog.test.tsx \
            src/domains/creator/StudioPageReviewPanel.tsx \
            src/domains/creator/StudioPageReviewPanel.test.tsx \
            src/domains/creator/StudioFloatingSurface.test.tsx \
            src/domains/creator/studio-floating-surface-preferences-sqlite.ts \
            src/domains/creator/studio-floating-surface-preferences-sqlite.test.ts \
            src/domains/creator/use-studio-floating-surface-layout.ts
          git diff --check
          pnpm run validate:architecture
          pnpm exec eslint --max-warnings=0 \
            src/domains/creator/StudioAnimaticTimelineDialog.tsx \
            src/domains/creator/StudioAnimaticTimelineDialog.test.tsx \
            src/domains/creator/StudioPageReviewPanel.tsx \
            src/domains/creator/StudioPageReviewPanel.test.tsx \
            src/domains/creator/StudioFloatingSurface.test.tsx \
            src/domains/creator/studio-floating-surface-preferences-sqlite.ts \
            src/domains/creator/studio-floating-surface-preferences-sqlite.test.ts \
            src/domains/creator/use-studio-floating-surface-layout.ts
      - name: Run focused workspace-surface tests
        run: |
          pnpm exec vitest run \
            src/domains/creator/StudioAnimaticTimelineDialog.test.tsx \
            src/domains/creator/StudioPageReviewPanel.test.tsx \
            src/domains/creator/studio-floating-surface-preferences-sqlite.test.ts \
            src/domains/creator/StudioFloatingSurface.test.tsx \
            src/domains/creator/studio-floating-surface.test.ts
      - name: Type-check, build, and enforce production bundle budgets
        run: |
          pnpm exec tsc -p tsconfig.json --noEmit --incremental false
          pnpm run build
          pnpm run check:studio-bundle
      - name: Commit validated implementation and remove staging artifacts
        run: |
          rm -f scripts/adapt-persistent-workspace-surfaces.py
          rm -f .github/workflows/finalize-persistent-workspace-surfaces-clean.yml
          git config user.name "toonstudio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(studio): persist movable review and animatic workspaces"
          git push origin HEAD:feat/studio-persistent-workspace-surfaces-clean-20260904
