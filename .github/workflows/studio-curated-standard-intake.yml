name: Studio curated Standard intake
on:
  push:
    branches: [feat/studio-asset-browser-quality-20260906]
    paths: [.github/workflows/studio-curated-standard-intake.yml]
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare isolated official browser tooling
        run: |
          mkdir -p "$RUNNER_TEMP/curated-tool" "$RUNNER_TEMP/curated-intake"
          npm install --prefix "$RUNNER_TEMP/curated-tool" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/curated-tool/node_modules/.bin/playwright" install --with-deps chromium
      - name: Use public free download buttons; never purchase or sign in
        run: |
          cat > "$RUNNER_TEMP/curated-tool/intake.mjs" <<'JS'
          import {chromium} from 'playwright';
          import {mkdir, writeFile, stat} from 'node:fs/promises';
          import path from 'node:path';
          const root=path.join(process.env.RUNNER_TEMP,'curated-intake');
          const browser=await chromium.launch({headless:true});
          const report={packs:[], errors:[], approvedOriginals:0, productionPublished:0};
          try {
            for(const slug of ['stylized-nature-megakit','medieval-village-megakit']){
              const context=await browser.newContext({acceptDownloads:true});
              const page=await context.newPage();
              try {
                const url='https://quaternius.itch.io/'+slug;
                await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
                await page.getByText('Download Now',{exact:true}).first().click();
                const free=page.getByText(/No thanks, just take me to the downloads/i);
                await free.waitFor({state:'visible',timeout:30000});
                await free.click();
                await page.waitForLoadState('domcontentloaded');
                const row=page.locator('.upload').filter({hasText:/\[Standard\]\.zip/i}).first();
                await row.waitFor({state:'visible',timeout:30000});
                const description=await row.innerText();
                if(/\[Pro\]|\[Source\]/i.test(description)) throw new Error('not the free Standard row');
                const pending=page.waitForEvent('download',{timeout:120000});
                await row.getByRole('link',{name:/Download/i}).first().click();
                const download=await pending;
                const filename=download.suggestedFilename();
                if(!/\[Standard\]\.zip$/i.test(filename)) throw new Error('unexpected edition');
                const destination=path.join(root,slug+'.zip');
                await download.saveAs(destination);
                const error=await download.failure(); if(error) throw new Error(error);
                const bytes=(await stat(destination)).size;
                if(bytes>220*1024*1024) throw new Error('pack size exceeds budget');
                report.packs.push({id:slug,sourceUrl:url,edition:'Standard',license:'CC0-1.0',filename,bytes});
                console.log('Acquired free Standard',slug,bytes);
              } catch(error){
                report.errors.push({id:slug,error:String(error)});
                await page.screenshot({path:path.join(root,slug+'-error.png'),fullPage:true}).catch(()=>{});
                console.log('ERROR',slug,String(error));
                console.log((await page.locator('body').innerText().catch(()=>'' )).slice(0,8000));
              } finally {await context.close();}
            }
          } finally {
            await browser.close();
            await writeFile(path.join(root,'intake-report.json'),JSON.stringify(report,null,2));
          }
          if(report.errors.length) process.exitCode=1;
          JS
          node "$RUNNER_TEMP/curated-tool/intake.mjs"
      - name: Extract only model, texture and license files safely
        run: |
          python3 - <<'PY'
          import zipfile, pathlib, stat, hashlib, json, os
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'curated-intake'
          report=[]; total=0
          extensions={'.glb','.gltf','.bin','.png','.jpg','.jpeg','.webp','.txt','.md'}
          for archive in sorted(root.glob('*.zip')):
            seen=set(); records=[]; out=root/archive.stem
            with zipfile.ZipFile(archive) as z:
              if len(z.infolist())>20000: raise ValueError('entry limit')
              for info in z.infolist():
                p=pathlib.PurePosixPath(info.filename)
                if p.is_absolute() or '..' in p.parts or '\\' in info.filename or ':' in info.filename: raise ValueError('unsafe path')
                if stat.S_ISLNK(info.external_attr>>16) or info.flag_bits&1: raise ValueError('unsafe member')
                if info.is_dir() or p.suffix.lower() not in extensions or '__MACOSX' in p.parts: continue
                if str(p).casefold() in seen: raise ValueError('case collision')
                seen.add(str(p).casefold()); total+=info.file_size
                if info.file_size>128*1024*1024 or total>1536*1024*1024: raise ValueError('expansion limit')
                data=z.read(info); dest=out.joinpath(*p.parts); dest.parent.mkdir(parents=True,exist_ok=True)
                dest.write_bytes(data)
                records.append({'path':str(p),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
            report.append({'id':archive.stem,'archiveSha256':hashlib.file_digest(archive.open('rb'),'sha256').hexdigest(),'files':records})
            archive.unlink()
          (root/'inventory.json').write_text(json.dumps(report,indent=2))
          print(json.dumps([{'id':r['id'],'files':len(r['files']),'models':sum(pathlib.Path(f['path']).suffix in {'.gltf','.glb'} for f in r['files'])} for r in report],indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: studio-curated-standard-intake
          path: ${{ runner.temp }}/curated-intake/
          retention-days: 7
          compression-level: 6
