name: Remove PR 1289 watchdog files once

on:
  push:
    branches:
      - fix/real-core-and-main-only-20260910
    paths:
      - .github/workflows/remove-pr1289-watchdogs-once-20260911.yml

permissions:
  contents: write

concurrency:
  group: remove-pr1289-watchdogs-once
  cancel-in-progress: false

jobs:
  remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/real-core-and-main-only-20260910
          fetch-depth: 0
          persist-credentials: true
      - name: Remove every one-time convergence workflow from the final head
        shell: bash
        run: |
          set -euo pipefail
          sleep 20
          git fetch origin fix/real-core-and-main-only-20260910
          git reset --hard origin/fix/real-core-and-main-only-20260910
          rm -f .github/workflows/fix-pr1289-collaboration-sync-once-20260911.yml
          rm -f .github/workflows/finalize-pr1289-when-canonical-core-green-20260911.yml
          rm -f .github/workflows/continuous-pr1289-convergence-20260911.yml
          rm -f .github/workflows/remove-pr1289-watchdogs-once-20260911.yml
          git diff --check
          git config user.name toonstudio-quality-ci
          git config user.email actions@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c core.hooksPath=/dev/null commit -m 'ci: remove one-time PR 1289 convergence workflows'
          git push --no-verify origin HEAD:fix/real-core-and-main-only-20260910
