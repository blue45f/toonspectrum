name: Validate ToonStudio continuation once

on:
  push:
    branches:
      - feat/toonstudio-session-completion-followup-20260911
    paths:
      - .github/workflows/validate-toonstudio-continuation.yml

permissions:
  contents: write

concurrency:
  group: validate-toonstudio-continuation-once
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "true"
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout continuation branch
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-session-completion-followup-20260911
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Reconcile an interrupted wiring pass
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re
          import textwrap

          apply = Path(".github/workflows/apply-toonstudio-continuation.yml")
          if apply.exists():
              workflow = apply.read_text()
              block = re.search(
                  r"- name: Wire canonical templates, assets and delivery flows\n.*?run: \|\n(?P<body>.*?)\n\s+- name: Format changed source",
                  workflow,
                  re.S,
              )
              if block is None:
                  raise SystemExit("Could not locate continuation wiring block")
              body = textwrap.dedent(block.group("body"))
              prefix = "set -euo pipefail\npython <<'PY'\n"
              if not body.startswith(prefix) or not body.rstrip().endswith("\nPY"):
                  raise SystemExit("Unexpected continuation wiring block")
              script = body[len(prefix):body.rfind("\nPY")]
              exec(compile(script, "toonstudio-continuation-wiring.py", "exec"), {})

          required_markers = {
              "apps/web/src/app/routes/groups/creator.routes.tsx": [
                  'path: "/studio/templates"',
                  "<StudioTemplatesPage",
                  'path: "/review/:shareToken"',
              ],
              "apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.tsx": [
                  "<StudioAssetGovernancePanel",
                  "<StudioProjectDeliveryPanel",
              ],
              "apps/web/src/domains/creator/studio-shell/StudioAssetHubPage.tsx": [
                  'view === "safety"',
                  "<StudioAssetGovernancePanel",
              ],
              "apps/web/src/domains/creator/studio-product-ia.ts": [
                  'id: "templates", label: "템플릿"',
                  'id: "template.library"',
              ],
          }
          for path, markers in required_markers.items():
              source = Path(path).read_text()
              for marker in markers:
                  if marker not in source:
                      raise SystemExit(f"{path}: missing continuation marker {marker}")

          catalog = Path("apps/web/src/domains/creator/studio-template-catalog.ts")
          source = catalog.read_text()
          source = source.replace('documentKind: "comic"', 'documentKind: "webtoon"')
          source = source.replace('documentKind: "slides"', 'documentKind: "presentation"')
          source = source.replace('rightsStatus: "unknown"', 'rightsStatus: "warning"')
          catalog.write_text(source)

          transient = [
              ".github/workflows/apply-toonstudio-continuation.yml",
              ".github/workflows/repair-toonstudio-continuation.yml",
              ".github/workflows/toonstudio-continuation-source-snapshot.yml",
              ".github/workflows/toonstudio-followup-source-snapshot.yml",
              ".github/workflows/finalize-toonstudio-session.yml",
              ".github/workflows/apply-toonstudio-session-fixes.yml",
              ".github/workflows/apply-toonstudio-session-fixes-retry.yml",
              ".github/workflows/toonstudio-final-sync-v2.yml",
              ".github/workflows/repair-sync-toonstudio-session.yml",
              ".github/workflows/install-toonstudio-session-gate.yml",
              ".github/workflows/apply-toonstudio-project-contract-repair.yml",
          ]
          for path in transient:
              Path(path).unlink(missing_ok=True)
          PY

      - name: Format and lint continuation delta
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -t files < <((git diff --name-only origin/main...HEAD; git diff --name-only) | sort -u | grep -E '\.(ts|tsx|mjs)$' || true)
          if ((${#files[@]})); then
            pnpm exec prettier --write "${files[@]}"
            pnpm exec eslint --fix --no-warn-ignored "${files[@]}"
          fi
          git diff --check

      - name: Typecheck entire workspace
        run: pnpm exec tsc -p tsconfig.json --noEmit --pretty false

      - name: Run continuation acceptance tests
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/studio-template-catalog.test.ts
          apps/web/src/domains/creator/studio-external-route.test.ts
          apps/web/src/domains/creator/studio-route-registry.test.ts
          apps/web/src/domains/creator/studio-product-ia.test.ts
          apps/web/src/domains/creator/studio-project-view-destinations.test.ts
          apps/web/src/domains/creator/studio-integration-closure.test.ts
          apps/web/src/domains/creator/studio-asset-governance.test.ts
          apps/web/src/domains/creator/studio-asset-passport.test.ts
          apps/web/src/domains/creator/studio-asset-provider.test.ts
          apps/web/src/domains/creator/studio-rights-graph.test.ts
          apps/web/src/domains/creator/studio-font-audit.test.ts
          apps/web/src/domains/creator/studio-marketplace-submission.test.ts
          apps/web/src/domains/creator/studio-plugin-registry.test.ts
          apps/web/src/domains/creator/studio-archive-manifest.test.ts
          apps/web/src/domains/creator/studio-publishing-connector.test.ts
          apps/web/src/domains/creator/studio-publishing-package.test.ts
          apps/web/src/domains/creator/studio-shell/StudioTemplatesPage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioAssetHubPage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioAssetGovernancePanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectDeliveryPanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.test.tsx
          --pool=forks --maxWorkers=2

      - name: Verify all ToonStudio integration tracks
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-toonstudio-feature-reachability.mjs
          if pnpm run | grep -q 'verify:studio-ia'; then pnpm run verify:studio-ia; fi
          if pnpm run | grep -q 'verify:studio-session-complete'; then pnpm run verify:studio-session-complete; fi
          bash scripts/verify-toonstudio-integration.sh core
          bash scripts/verify-toonstudio-integration.sh ui
          bash scripts/verify-toonstudio-integration.sh editor

      - name: Build production bundle
        run: pnpm run build:bundle

      - name: Record acceptance and publish branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/rewrite
          cat > docs/rewrite/toonstudio-continuation-acceptance.md <<EOF
          # ToonStudio continuation acceptance

          - Validated commit before report: \`$(git rev-parse HEAD)\`
          - Base main: \`$(git rev-parse origin/main)\`
          - Validated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Whole-workspace TypeScript: passed
          - Continuation ESLint: passed
          - Template, asset-governance, publishing and archive tests: passed
          - Feature reachability: passed
          - Core, UI and editor integration tracks: passed
          - Production bundle: passed

          ## Accepted user flows

          1. Global Templates navigation -> searchable catalog -> template-preserving new-project handoff.
          2. Project Assets -> rights and safety -> quality, purchases, seats, fonts, AI provenance and extension permissions.
          3. Project Export -> target preflight -> direct, package or manual delivery plan.
          4. Project Settings -> complete archive manifest -> reversible restore plan.
          5. External review, presentation and invitation token entry -> established lightweight runtimes.

          External purchases, paid inference and platform writes remain blocked until a real authenticated connector is configured.
          EOF
          rm -f .github/workflows/validate-toonstudio-continuation.yml
          git config user.name "toonstudio-integration-bot"
          git config user.email "toonstudio-integration-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(studio): validate templates assets and delivery continuation"
          git push origin HEAD:feat/toonstudio-session-completion-followup-20260911
