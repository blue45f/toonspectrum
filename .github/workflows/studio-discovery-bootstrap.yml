name: Materialize studio discovery review

on:
  push:
    branches: [fix/studio-brush-filter-discovery-20260906]
    paths:
      - '.github/workflows/studio-discovery-bootstrap.yml'
      - '.github/discovery-transport/**'

permissions:
  contents: read

jobs:
  materialize:
    if: github.repository == 'blue45f/toonspectrum' && github.ref == 'refs/heads/fix/studio-brush-filter-discovery-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source_ref: ${{ steps.publish.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Verify exact patch bytes and apply only against unchanged original blobs
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          parts = [Path(f'.github/discovery-transport/part-{n}.b64').read_text().strip() for n in (1, 2, 3)]
          print('Transport part lengths:', [len(part) for part in parts])
          payload = lzma.decompress(base64.b64decode(''.join(parts), validate=True))
          assert hashlib.sha256(payload).hexdigest() == '4e5a834a06640c34e0225d423eb2b357ac4316b82528009582647ffb2ac5d723', 'patch checksum mismatch'
          Path('/tmp/studio-discovery.patch').write_bytes(payload)
          PY
          git apply --index /tmp/studio-discovery.patch
          git diff --cached --check
          git diff --cached --stat
      - name: Commit product changes to this branch without force or main writes
        id: publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'feat(studio): clarify brush and filter discovery without changing saved IDs'
          git push origin HEAD:refs/heads/fix/studio-brush-filter-discovery-20260906
          echo "source_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: materialize
    uses: ./.github/workflows/studio-discovery-ux.yml
    with:
      source_ref: ${{ needs.materialize.outputs.source_ref }}
