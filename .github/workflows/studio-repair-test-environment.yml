name: Studio repair test environment
on:
  push:
    branches: [fix/studio-hydration-ci-completion-20260912]
    paths: [.github/workflows/studio-repair-test-environment.yml]
permissions:
  contents: read
jobs:
  environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package dependencies for offline source regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/studio-test-environment"
          find node_modules apps packages -type d -name node_modules -prune -print0 > "$RUNNER_TEMP/studio-node-module-paths"
          tar --exclude='*.wasm' --exclude='*.onnx' --exclude='*.map' --exclude='.cache' -czf "$RUNNER_TEMP/studio-test-environment/dependencies.tar.gz" --null -T "$RUNNER_TEMP/studio-node-module-paths"
          cp "$(command -v node)" "$RUNNER_TEMP/studio-test-environment/node"
          git rev-parse HEAD > "$RUNNER_TEMP/studio-test-environment/commit.txt"
          sha256sum pnpm-lock.yaml > "$RUNNER_TEMP/studio-test-environment/lockfile.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: studio-offline-test-environment
          path: ${{ runner.temp }}/studio-test-environment
          compression-level: 1
          retention-days: 1
          if-no-files-found: error
