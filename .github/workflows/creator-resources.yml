name: Creator resources verification
on:
  pull_request:
    paths:
      - 'lib/creator-resources.ts'
      - 'src/domains/creator-resources/**'
      - 'src/app/routes/**'
      - 'apps/api/src/modules/creator-resources/**'
      - 'apps/api/src/app.module.ts'
      - 'tests/creator-resources*'
      - 'scripts/check-creator-resources.mjs'
      - '.github/workflows/creator-resources.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: creator-resources-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install isolated TypeScript checker
        run: npm install --prefix "$RUNNER_TEMP/creator-checker" --ignore-scripts --no-audit --no-fund typescript@5.9.3
      - name: Strict types and provider/storage/export regression cases
        run: NODE_PATH="$RUNNER_TEMP/creator-checker/node_modules" node scripts/check-creator-resources.mjs
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: '0'
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Focused lint
        run: pnpm exec eslint lib/creator-resources.ts apps/api/src/modules/creator-resources src/domains/creator-resources src/app/routes/groups/creator-resources.routes.tsx src/app/routes/groups/app-routes.tsx src/app/routes/groups/catalog.routes.tsx src/app/routes/route-titles.ts apps/api/src/app.module.ts tests/creator-resources*.ts scripts/check-creator-resources.mjs --max-warnings=0
      - run: pnpm exec vitest run tests/creator-resources.test.ts
      - run: pnpm typecheck
      - run: pnpm build
