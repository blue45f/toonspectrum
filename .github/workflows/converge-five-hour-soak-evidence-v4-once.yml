name: Converge five-hour soak evidence v4 once

on:
  push:
    branches:
      - fix/studio-five-hour-soak-catalog-state-20260910
    paths:
      - .github/workflows/converge-five-hour-soak-evidence-v4-once.yml

permissions:
  contents: write

concurrency:
  group: converge-five-hour-soak-evidence-v4-20260910
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/studio-five-hour-soak-catalog-state-20260910
          fetch-depth: 1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Apply previously proven soak patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          raw = Path('.github/workflows/converge-five-hour-soak-evidence-v3-once.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = raw.index(marker) + len(marker)
          end = raw.index("\n          PY\n", start)
          code = textwrap.dedent(raw[start:end])
          exec(compile(code, 'five-hour-soak-v3-patch', 'exec'))
          PY
          git diff --check
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Normalize existing import-order debt only
        run: pnpm exec eslint --fix --no-warn-ignored scripts/verify-studio-five-hour-soak.mts
      - name: Focused regression and strict lint
        shell: bash
        run: |
          git diff --check
          pnpm exec vitest run scripts/verify-studio-five-hour-soak-harness.test.ts
          pnpm exec eslint --max-warnings=0 --no-warn-ignored scripts/verify-studio-five-hour-soak.mts scripts/verify-studio-five-hour-soak-harness.test.ts
      - name: Commit verified convergence and remove temporary workflows
        shell: bash
        run: |
          rm -f \
            .github/workflows/converge-five-hour-soak-evidence-once.yml \
            .github/workflows/converge-five-hour-soak-evidence-v2-once.yml \
            .github/workflows/converge-five-hour-soak-evidence-v3-once.yml \
            .github/workflows/converge-five-hour-soak-evidence-v4-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          HUSKY=0 git commit -m "test(studio): make five-hour soak evidence trustworthy"
          HUSKY=0 git push origin HEAD:fix/studio-five-hour-soak-catalog-state-20260910
