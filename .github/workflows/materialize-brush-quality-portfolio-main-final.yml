name: Materialize brush quality portfolio on latest main

on:
  push:
    branches:
      - fix/brush-quality-portfolio-main-final-20260904-v2
    paths:
      - ".github/workflows/materialize-brush-quality-portfolio-main-final.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-brush-quality-portfolio-main-final
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Copy the validated quality-first portfolio from its canonical branch
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_BRANCH='fix/brush-portfolio-exhaustive-contract-20260904'
          git fetch --no-tags origin "${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
          paths=(
            '.github/workflows/studio-brush-quality-portfolio.yml'
            'docs/reports/brush-quality-first-portfolio-2026-09-04.md'
            'scripts/audit-studio-brush-quality-portfolio.mts'
            'src/domains/creator/brush/StudioBrushLibrarySheet.test.tsx'
            'src/domains/creator/brush/studio-brush-catalog-core.ts'
            'src/domains/creator/brush/studio-brush-catalog.ts'
            'src/domains/creator/brush/studio-brush-listed-uniqueness.test.ts'
            'src/domains/creator/brush/studio-brush-quality-foundation.ts'
            'src/domains/creator/brush/studio-brush-quality-portfolio-counts.ts'
            'src/domains/creator/brush/studio-brush-quality-portfolio-data.ts'
            'src/domains/creator/brush/studio-brush-quality-portfolio.test.ts'
            'src/domains/creator/brush/studio-brush-quality-portfolio.ts'
            'src/domains/creator/brush/studio-sub-tool-palette-data.test.ts'
            'src/domains/creator/brush/studio-sub-tool-palette-data.ts'
          )
          for path in "${paths[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "refs/remotes/origin/${SOURCE_BRANCH}:${path}" > "$path"
          done

          grep -F 'oil--flat-ribbon' src/domains/creator/brush/studio-brush-quality-portfolio-data.ts >/dev/null
          if grep -F '["acrylic", "아크릴"]' src/domains/creator/brush/studio-brush-quality-portfolio-data.ts >/dev/null; then
            echo 'quarantined acrylic is still a default representative' >&2
            exit 1
          fi
          grep -F 'EXHAUSTIVE_TAB_LABEL' src/domains/creator/brush/studio-sub-tool-palette-data.ts >/dev/null

          rm -f .github/workflows/materialize-brush-quality-portfolio-main-final.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          HUSKY=0 git commit -m "fix(brush): preserve full inventory behind a quality-first default portfolio"
          git push origin "HEAD:${GITHUB_REF_NAME}"
