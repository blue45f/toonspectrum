name: Studio catalog import reconciliation
on:
  push:
    branches: [feat/studio-asset-browser-quality-20260906]
    paths: [.github/workflows/studio-catalog-import-reconcile.yml]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/studio-asset-browser-quality-20260906
          show-progress: false
      - name: Change only the three inspected import separators
        run: |
          test "$GITHUB_REF" = refs/heads/feat/studio-asset-browser-quality-20260906
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          changes = [
            ('src/domains/creator/catalog/studio-catalog-preferences.test.ts', '31a62641757b36e3b0c4e202dbaebb31c0522171', 'from "vitest";\nimport', 'from "vitest";\n\nimport'),
            ('src/domains/creator/catalog/studio-catalog-query.test.ts', '472cc5c5b2a0c212bff9a769c0827c0c3e477df0', 'from "vitest";\nimport', 'from "vitest";\n\nimport'),
            ('src/domains/creator/StudioElementsPanel.tsx', '1998eed51d2bf4c425a84744a51ef7a4d249a8fd', 'import "./catalog/studio-catalog-browser.css";\n\nimport { svgToDataUrl', 'import "./catalog/studio-catalog-browser.css";\nimport { svgToDataUrl'),
          ]
          staged=[]
          for name, expected, old, new in changes:
            actual=subprocess.check_output(['git','hash-object',name],text=True).strip()
            if actual!=expected: raise ValueError('concurrent source change: '+name)
            content=Path(name).read_text(encoding='utf-8')
            if content.count(old)!=1: raise ValueError('expected one separator: '+name)
            staged.append((name,content.replace(old,new,1)))
          for name,content in staged:
            Path(name).write_text(content,encoding='utf-8')
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','diff','--stat'],check=True)
          subprocess.run(['git','add','--',*[name for name, _ in staged]],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(studio): align catalog imports with executed main-merge lint'
          git push origin HEAD:refs/heads/feat/studio-asset-browser-quality-20260906
