name: Unblock Scene3D BG quality once

on:
  push:
    branches: [fix/scene3d-bg-quality-20260910]
    paths: [.github/workflows/unblock-scene3d-bg-quality-once.yml]

permissions:
  contents: write

jobs:
  unblock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/scene3d-bg-quality-20260910
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          sed -i 's/runs-on: ubuntu-24.04-arm/runs-on: ubuntu-latest/' .github/workflows/scene3d-bg-insert-resolution-hotfix.yml
          git config user.name toonstudio-3d-ci
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/unblock-scene3d-bg-quality-once.yml
          git add .github/workflows/scene3d-bg-insert-resolution-hotfix.yml
          git commit -m 'ci: move BG quality patch to standard runner'
          git push origin HEAD:fix/scene3d-bg-quality-20260910
