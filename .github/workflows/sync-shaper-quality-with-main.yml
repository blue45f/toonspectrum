name: Sync Shaper quality branch with main

on:
  push:
    branches:
      - feat/shaper-surface-paint-20260903

permissions:
  contents: write

concurrency:
  group: sync-shaper-quality-with-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/shaper-surface-paint-20260903
          fetch-depth: 0

      - name: Merge current main without discarding either history
        run: |
          git config user.name "toonstudio-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Remove one-shot workflow and publish synchronized branch
        run: |
          rm .github/workflows/sync-shaper-quality-with-main.yml
          git add -A
          git commit --amend --no-edit --no-verify
          git push --no-verify origin HEAD:feat/shaper-surface-paint-20260903
