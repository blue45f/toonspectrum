name: One-time merged branch cleanup 20260908-0320

on:
  push:
    branches:
      - chore/cleanup-merged-branches-20260908-0320

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

# PR #835 is already closed. Reusing its stale Marketplace run's exact
# concurrency key cancels that superseded execution before this job starts.
concurrency:
  group: marketplace-integrity-refs/pull/835/merge
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel superseded cleanup attempts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 34144855700 34144949982; do
            response="$(mktemp)"
            status="$(curl --silent --show-error --location \
              --output "${response}" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true)"
            if [[ "${status}" != "202" && "${status}" != "409" ]]; then
              cat "${response}"
              echo "Unexpected status ${status} while cancelling ${run_id}" >&2
              exit 1
            fi
            rm -f "${response}"
          done

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Delete only branches proven merged into the default branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${{ github.event.repository.default_branch }}/scripts/cleanup-merged-branches.mjs" \
            -o /tmp/cleanup-merged-branches.mjs
          node /tmp/cleanup-merged-branches.mjs --all --apply | tee /tmp/cleanup-report.json
          cat /tmp/cleanup-report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Delete one-time launcher branch
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_REF_NAME}"
