name: Retire superseded Storyworld CI attempts

on:
  push:
    branches: [verify/storyworld-preflight-macos-20260905]
    paths: [.github/workflows/storyworld-retire-superseded-ci-20260905.yml]

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  retire-superseded:
    if: github.repository == 'blue45f/toonspectrum'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Cancel only obsolete attempts belonging to PR 746
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base = 'https://api.github.com/repos/blue45f/toonspectrum/'
          def request(path, method='GET'):
              req = urllib.request.Request(base + path, method=method, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  data = response.read()
                  return json.loads(data) if data else None

          pr = request('pulls/746')
          assert pr['state'] == 'open' and pr['base']['ref'] == 'main'
          assert pr['head']['ref'] == 'feat/storyworld-causality-lab-20260905'
          assert pr['head']['sha'] == 'a40b3c3e6d9e11faefe1719e73cd1bab4dac29bc'
          old = {33948645140: '593b97c77d3428d327ee066875df2d5907b74b4b', 33949223974: 'a8f194ccaf7cc4f68f41b56a60a156bb7b55d60e', 33952621804: 'c5c802e2dccd1fd23fb4a46b1ae020766d391082'}
          for run_id, sha in old.items():
              run = request(f'actions/runs/{run_id}')
              assert run['head_sha'] == sha and run['head_sha'] != pr['head']['sha']
              assert run['head_branch'] == pr['head']['ref'] and run['name'] == 'CI' and run['event'] == 'pull_request'
              assert any(item['number'] == 746 for item in run['pull_requests'])
              if run['status'] == 'completed':
                  print(f'{run_id}: already completed; left unchanged.')
                  continue
              try:
                  request(f'actions/runs/{run_id}/cancel', 'POST')
                  print(f'{run_id}: obsolete PR 746 attempt cancelled.')
              except urllib.error.HTTPError as error:
                  if error.code != 409:
                      raise
                  print(f'{run_id}: no longer cancellable; left unchanged.')
          print('Current-head CI, required status checks, main, and every other PR are untouched.')
          PY
