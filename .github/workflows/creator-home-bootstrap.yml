name: Creator home implementation validation
on:
  push:
    branches: [feat/creator-first-home-20260906]
permissions:
  contents: write
concurrency:
  group: creator-home-implementation
  cancel-in-progress: true
jobs:
  implement-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/creator-first-home-20260906
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Apply bounded shell integration
        run: node scripts/apply-creator-first-brand.mjs
      - name: Install existing application dependencies
        run: pnpm install --frozen-lockfile
      - name: Install isolated video dependencies and fonts
        run: |
          npm --prefix media/brand-film install --package-lock-only --ignore-scripts
          npm --prefix media/brand-film ci
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk ffmpeg
      - name: Render real landscape, portrait, square, poster and sharing artwork
        run: |
          npm --prefix media/brand-film run typecheck
          npm --prefix media/brand-film run render -- all
      - name: Lint implementation without relaxing repository rules
        run: |
          pnpm exec eslint src/domains/marketing components/site-header.tsx components/site-header-mobile-nav.tsx src/app/AppShell.tsx src/app/routes/groups/catalog.routes.tsx src/app/routes/route-titles.ts --fix --max-warnings=0
          pnpm run validate:architecture
          pnpm run verify:csp
      - name: Check types, homepage and automation contracts, production bundle
        run: |
          pnpm exec tsc -p tsconfig.json --incremental false
          pnpm exec vitest run src/domains/marketing/creator-home-content.test.ts
          node --test scripts/creator-film-automation.test.mjs
          pnpm run build:bundle
      - name: Verify real responsive browser and video playback
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/creator-home-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node scripts/verify-creator-home.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: creator-home-browser-evidence
          path: artifacts/creator-home/
          if-no-files-found: ignore
      - name: Save validated implementation to its feature branch
        run: |
          rm scripts/apply-creator-first-brand.mjs .github/workflows/creator-home-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/domains/marketing src/app/AppShell.tsx src/app/routes/groups/catalog.routes.tsx src/app/routes/route-titles.ts components/site-header.tsx components/site-header-mobile-nav.tsx public/i18n/app index.html public/manifest.webmanifest public/brand media/brand-film scripts/apply-creator-first-brand.mjs .github/workflows/creator-home-bootstrap.yml
          git commit -m 'feat(marketing): integrate creator-first shell and verified Remotion films'
          git push origin HEAD:feat/creator-first-home-20260906
