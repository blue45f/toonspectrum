      - name: Commit verified all-features integration
        shell: bash
        run: |
          git add -A
          git diff --cached --check
          git commit -m "feat(studio): complete session all-features integration"
          git push --force-with-lease origin HEAD:"$FINAL_BRANCH"

      - name: Create or update final pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$FINAL_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          body_file=docs/rewrite/toonstudio-session-all-features-final-report.md
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" \
              --title "feat: complete ToonStudio unified creative production workspace" \
              --body-file "$body_file"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$FINAL_BRANCH" \
              --title "feat: complete ToonStudio unified creative production workspace" \
              --body-file "$body_file"
          fi
