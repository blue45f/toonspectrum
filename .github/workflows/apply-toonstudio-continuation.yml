name: Apply ToonStudio continuation once

on:
  push:
    branches:
      - feat/toonstudio-session-completion-followup-20260911
    paths:
      - .github/workflows/apply-toonstudio-continuation.yml

permissions:
  contents: write

concurrency:
  group: apply-toonstudio-continuation-once
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "true"
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout continuation branch
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-session-completion-followup-20260911
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Wire canonical templates, assets and delivery flows
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text()

          def write(path: str, text: str) -> None:
              Path(path).write_text(text)

          def replace_once(path: str, old: str, new: str, *, allow_done: str | None = None) -> None:
              text = read(path)
              if allow_done and allow_done in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              write(path, text.replace(old, new, 1))

          def insert_before(path: str, marker: str, insertion: str, *, sentinel: str) -> None:
              text = read(path)
              if sentinel in text:
                  return
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f"{path}: expected one marker, found {count}: {marker[:100]!r}")
              write(path, text.replace(marker, insertion + marker, 1))

          product_ia = "apps/web/src/domains/creator/studio-product-ia.ts"
          replace_once(
              product_ia,
              '{ id: "create", label: "새로 만들기", href: "/studio/new" },',
              '{ id: "templates", label: "템플릿", href: "/studio/templates" },',
              allow_done='id: "templates", label: "템플릿"',
          )
          insert_before(
              product_ia,
              '  {\n    id: "story.workspace",',
              '''  {\n    id: "template.library",\n    label: "템플릿",\n    owner: "templates",\n    primaryRoute: "/studio/templates",\n    maturity: "stable",\n    surfaces: [\n      { id: "studio-templates", role: "primary" },\n      { id: "header-template-link", role: "projection" },\n      { id: "new-project-template-handoff", role: "projection" },\n    ],\n    aliases: ["템플릿 라이브러리", "PPT 템플릿", "웹툰 템플릿"],\n  },\n''',
              sentinel='id: "template.library"',
          )

          registry = "apps/web/src/domains/creator/studio-route-registry.ts"
          registry_text = read(registry)
          if "export function validateStudioExternalToken" not in registry_text:
              registry_text += '''\n\nconst STUDIO_EXTERNAL_TOKEN_PATTERN = /^[A-Za-z0-9][A-Za-z0-9._~-]{7,255}$/u;\n\n/** Validate opaque review, presentation and invitation tokens without decoding user input. */\nexport function validateStudioExternalToken(value: string | null | undefined): value is string {\n  return typeof value === "string" && STUDIO_EXTERNAL_TOKEN_PATTERN.test(value);\n}\n\nfunction requireStudioExternalToken(value: string): string {\n  if (!validateStudioExternalToken(value)) {\n    throw new Error("A valid external token is required.");\n  }\n  return value;\n}\n\nexport function studioExternalReviewHref(shareToken: string): string {\n  return `/studio/review?shareToken=${encodeURIComponent(requireStudioExternalToken(shareToken))}`;\n}\n\nexport function studioExternalPresentationHref(presentationToken: string): string {\n  return `/studio/present?presentationToken=${encodeURIComponent(requireStudioExternalToken(presentationToken))}`;\n}\n\nexport function studioExternalJoinHref(inviteToken: string): string {\n  return `/studio/join?invite=${encodeURIComponent(requireStudioExternalToken(inviteToken))}`;\n}\n'''
              write(registry, registry_text)

          route_pages = "apps/web/src/app/routes/groups/creator-route-pages.ts"
          replace_once(
              route_pages,
              '''export const StudioNewPage = lazyRetry(\n  () => import("@/domains/creator/studio-shell/StudioFrontDoorPages").then((module) => ({\n    default: module.StudioNewPage,\n  })),\n  "StudioNewPage",\n);''',
              '''export const StudioNewPage = lazyRetry(\n  () => import("@/domains/creator/studio-shell/StudioNewIntegratedPage").then((module) => ({\n    default: module.StudioNewIntegratedPage,\n  })),\n  "StudioNewIntegratedPage",\n);''',
              allow_done='StudioNewIntegratedPage',
          )
          insert_before(
              route_pages,
              'export const StudioAssetHubPage = lazyRetry(',
              '''export const StudioTemplatesPage = lazyRetry(\n  () => import("@/domains/creator/studio-shell/StudioTemplatesPage").then((module) => ({\n    default: module.StudioTemplatesPage,\n  })),\n  "StudioTemplatesPage",\n);\n''',
              sentinel='export const StudioTemplatesPage',
          )
          insert_before(
              route_pages,
              'export const LearnPage = lazyRetry(',
              '''export const StudioExternalReviewRoute = lazyRetry(\n  () => import("@/domains/creator/studio-shell/StudioExternalEntryRoutes").then((module) => ({\n    default: module.StudioExternalReviewRoute,\n  })),\n  "StudioExternalReviewRoute",\n);\nexport const StudioExternalPresentationRoute = lazyRetry(\n  () => import("@/domains/creator/studio-shell/StudioExternalEntryRoutes").then((module) => ({\n    default: module.StudioExternalPresentationRoute,\n  })),\n  "StudioExternalPresentationRoute",\n);\nexport const StudioExternalJoinRoute = lazyRetry(\n  () => import("@/domains/creator/studio-shell/StudioExternalEntryRoutes").then((module) => ({\n    default: module.StudioExternalJoinRoute,\n  })),\n  "StudioExternalJoinRoute",\n);\n''',
              sentinel='export const StudioExternalReviewRoute',
          )

          routes = "apps/web/src/app/routes/groups/creator.routes.tsx"
          routes_text = read(routes)
          if "StudioTemplatesPage," not in routes_text:
              routes_text = routes_text.replace(
                  "  StudioProjectShellPage,\n  StudioPromoPage,",
                  "  StudioProjectShellPage,\n  StudioTemplatesPage,\n  StudioExternalJoinRoute,\n  StudioExternalPresentationRoute,\n  StudioExternalReviewRoute,\n  StudioPromoPage,",
                  1,
              )
          routes_text = routes_text.replace(
              '{ id: "creator-studio-templates", path: "/studio/templates", element: <Navigate to="/market?view=templates" replace /> },',
              '{ id: "creator-studio-templates", path: "/studio/templates", element: <StudioTemplatesPage /> },',
              1,
          )
          external_marker = '  // Canonical showcase routes retain the existing gallery implementation.\n'
          if 'id: "creator-external-review"' not in routes_text:
              external_routes = '''  // Lightweight external entries preserve opaque tokens and reuse the established review runtime.\n  { id: "creator-external-review", path: "/review/:shareToken", element: <StudioExternalReviewRoute /> },\n  { id: "creator-external-presentation", path: "/present/:presentationToken", element: <StudioExternalPresentationRoute /> },\n  { id: "creator-external-join", path: "/join/:inviteToken", element: <StudioExternalJoinRoute /> },\n\n'''
              if external_marker not in routes_text:
                  raise SystemExit("creator.routes.tsx: showcase marker missing")
              routes_text = routes_text.replace(external_marker, external_routes + external_marker, 1)
          write(routes, routes_text)

          integrated = "apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.tsx"
          integrated_text = read(integrated)
          if 'from "./StudioAssetGovernancePanel"' not in integrated_text:
              integrated_text = integrated_text.replace(
                  'import { StudioExportPanel } from "./StudioExportPanel";\n',
                  'import { StudioAssetGovernancePanel } from "./StudioAssetGovernancePanel";\nimport { StudioExportPanel } from "./StudioExportPanel";\n',
                  1,
              )
          if 'from "./StudioProjectDeliveryPanel"' not in integrated_text:
              integrated_text = integrated_text.replace(
                  'import { StudioProjectAssistantPanel } from "./StudioProjectAssistantPanel";\n',
                  'import { StudioProjectAssistantPanel } from "./StudioProjectAssistantPanel";\nimport { StudioProjectDeliveryPanel } from "./StudioProjectDeliveryPanel";\n',
                  1,
              )
          if '<StudioAssetGovernancePanel' not in integrated_text:
              marker = '''      {section === "assets" && view === "series" ? (\n        <StudioSeriesKitPanel projectId={projectId} locale={locale} />\n      ) : null}\n'''
              insertion = marker + '''      {section === "assets" && view === "rights" ? (\n        <StudioAssetGovernancePanel projectId={projectId} locale={locale} />\n      ) : null}\n'''
              if marker not in integrated_text:
                  raise SystemExit("StudioProjectIntegratedPage.tsx: Series Kit marker missing")
              integrated_text = integrated_text.replace(marker, insertion, 1)
          if '<StudioProjectDeliveryPanel' not in integrated_text:
              marker = '''      {section === "export" ? (\n        <StudioExportPanel projectId={projectId} locale={locale} />\n      ) : null}\n'''
              insertion = marker + '''      {(section === "export" && ["targets", "packages", "history"].includes(view))\n        || (section === "settings" && view === "archive") ? (\n        <StudioProjectDeliveryPanel\n          projectId={projectId}\n          section={section}\n          view={view}\n          locale={locale}\n        />\n      ) : null}\n'''
              if marker not in integrated_text:
                  raise SystemExit("StudioProjectIntegratedPage.tsx: export marker missing")
              integrated_text = integrated_text.replace(marker, insertion, 1)
          write(integrated, integrated_text)

          destinations = "apps/web/src/domains/creator/studio-project-view-destinations.ts"
          destination_text = read(destinations)
          old_destination = '''    const viewName = view === "project" ? "project" : view;\n    return external(\n      "assets",\n      assetHref(projectId, viewName),'''
          if old_destination in destination_text:
              new_destination = '''    const viewName = view === "rights"\n      ? "safety"\n      : view === "installed" || view === "missing"\n        ? "library"\n        : "overview";\n    const hubHref = view === "missing"\n      ? withQuery("/studio/assets", { filter: "missing", project: projectId, view: viewName })\n      : assetHref(projectId, viewName);\n    return external(\n      "assets",\n      hubHref,'''
              destination_text = destination_text.replace(old_destination, new_destination, 1)
          elif 'view === "rights"\n      ? "safety"' not in destination_text:
              raise SystemExit("studio-project-view-destinations.ts: asset mapping marker missing")
          write(destinations, destination_text)

          reachability = "scripts/verify-toonstudio-feature-reachability.mjs"
          reachability_text = read(reachability)
          additions = [
              '  "apps/web/src/domains/creator/studio-template-catalog.ts",\n',
              '  "apps/web/src/domains/creator/studio-asset-governance.ts",\n',
              '  "apps/web/src/domains/creator/studio-shell/StudioTemplatesPage.tsx",\n',
              '  "apps/web/src/domains/creator/studio-shell/StudioAssetGovernancePanel.tsx",\n',
              '  "apps/web/src/domains/creator/studio-shell/StudioProjectDeliveryPanel.tsx",\n',
              '  "apps/web/src/domains/creator/studio-shell/StudioExternalEntryRoutes.tsx",\n',
          ]
          marker = '  "apps/web/src/domains/creator/studio-template-system.ts",\n'
          for addition in additions:
              if addition.strip() in reachability_text:
                  continue
              if marker not in reachability_text:
                  raise SystemExit("reachability template-system marker missing")
              reachability_text = reachability_text.replace(marker, marker + addition, 1)
          write(reachability, reachability_text)

          closure = "apps/web/src/domains/creator/studio-integration-closure.test.ts"
          closure_text = read(closure)
          if "connects templates, asset safety and delivery operations" not in closure_text:
              closing = "\n});\n"
              if not closure_text.endswith(closing):
                  raise SystemExit("studio-integration-closure.test.ts: closing marker missing")
              test = '''\n  it("connects templates, asset safety and delivery operations to canonical routes", () => {\n    const routePages = source("apps/web/src/app/routes/groups/creator-route-pages.ts");\n    const routes = source("apps/web/src/app/routes/groups/creator.routes.tsx");\n    const integrated = source("apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.tsx");\n    const assetHub = source("apps/web/src/domains/creator/studio-shell/StudioAssetHubPage.tsx");\n    const productIa = source("apps/web/src/domains/creator/studio-product-ia.ts");\n\n    expect(routePages).toContain("StudioTemplatesPage");\n    expect(routes).toContain('path: "/studio/templates"');\n    expect(routes).toContain("<StudioTemplatesPage");\n    expect(routes).toContain('path: "/review/:shareToken"');\n    expect(productIa).toContain('id: "templates", label: "템플릿"');\n    expect(productIa).toContain('id: "template.library"');\n    expect(integrated).toContain("<StudioAssetGovernancePanel");\n    expect(integrated).toContain("<StudioProjectDeliveryPanel");\n    expect(assetHub).toContain('view === "safety"');\n    expect(assetHub).toContain("<StudioAssetGovernancePanel");\n  });\n'''
              closure_text = closure_text[:-len(closing)] + test + closing
              write(closure, closure_text)
          PY

      - name: Format changed source
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/web/src/app/routes/groups/creator-route-pages.ts
            apps/web/src/app/routes/groups/creator.routes.tsx
            apps/web/src/domains/creator/studio-product-ia.ts
            apps/web/src/domains/creator/studio-route-registry.ts
            apps/web/src/domains/creator/studio-project-view-destinations.ts
            apps/web/src/domains/creator/studio-template-catalog.ts
            apps/web/src/domains/creator/studio-template-catalog.test.ts
            apps/web/src/domains/creator/studio-external-route.test.ts
            apps/web/src/domains/creator/studio-integration-closure.test.ts
            apps/web/src/domains/creator/studio-shell/StudioNewIntegratedPage.tsx
            apps/web/src/domains/creator/studio-shell/StudioTemplatesPage.tsx
            apps/web/src/domains/creator/studio-shell/StudioTemplatesPage.test.tsx
            apps/web/src/domains/creator/studio-shell/StudioAssetHubPage.tsx
            apps/web/src/domains/creator/studio-shell/studio-asset-hub-view.ts
            apps/web/src/domains/creator/studio-shell/StudioAssetGovernancePanel.tsx
            apps/web/src/domains/creator/studio-shell/StudioAssetGovernancePanel.test.tsx
            apps/web/src/domains/creator/studio-shell/StudioProjectDeliveryPanel.tsx
            apps/web/src/domains/creator/studio-shell/StudioProjectDeliveryPanel.test.tsx
            apps/web/src/domains/creator/studio-shell/StudioExternalEntryRoutes.tsx
            apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.tsx
            scripts/verify-toonstudio-feature-reachability.mjs
          )
          pnpm exec prettier --write "${files[@]}"
          pnpm exec eslint --fix --no-warn-ignored "${files[@]}"
          git diff --check

      - name: Typecheck
        run: pnpm exec tsc -p tsconfig.json --noEmit --pretty false

      - name: Run continuation tests
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/studio-template-catalog.test.ts
          apps/web/src/domains/creator/studio-external-route.test.ts
          apps/web/src/domains/creator/studio-route-registry.test.ts
          apps/web/src/domains/creator/studio-product-ia.test.ts
          apps/web/src/domains/creator/studio-project-view-destinations.test.ts
          apps/web/src/domains/creator/studio-integration-closure.test.ts
          apps/web/src/domains/creator/studio-shell/StudioTemplatesPage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioAssetHubPage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioAssetGovernancePanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectDeliveryPanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.test.tsx
          --pool=forks --maxWorkers=2

      - name: Verify feature reachability and completion contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-toonstudio-feature-reachability.mjs
          if pnpm run | grep -q 'verify:studio-ia'; then pnpm run verify:studio-ia; fi
          if pnpm run | grep -q 'verify:studio-session-complete'; then pnpm run verify:studio-session-complete; fi

      - name: Build production bundle
        run: pnpm run build:bundle

      - name: Commit validated continuation and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-toonstudio-continuation.yml
          rm -f .github/workflows/toonstudio-followup-source-snapshot.yml
          rm -f .github/workflows/finalize-toonstudio-session.yml
          rm -f .github/workflows/apply-toonstudio-session-fixes.yml
          rm -f .github/workflows/apply-toonstudio-session-fixes-retry.yml
          git config user.name "toonstudio-integration-bot"
          git config user.email "toonstudio-integration-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(studio): complete templates asset safety and delivery flows"
          git push origin HEAD:feat/toonstudio-session-completion-followup-20260911
