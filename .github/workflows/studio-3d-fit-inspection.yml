name: Studio 3D fit and inspection
on:
  push:
    branches: [fix/studio-3d-fit-inspection-20260906]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  # Preserve the first before/after capture run while verifying this follow-up independently.
  group: studio-3d-fit-final-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrate-followup:
    if: github.ref == 'refs/heads/fix/studio-3d-fit-inspection-20260906'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      head: ${{ steps.source.outputs.head }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Apply the verified three-file limb and test-type correction
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          HUSKY: '0'
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/studio-3d-fit-inspection-20260906'
          if test ! -f src/domains/creator/vrm/studio-vrm-garment-limb-profile.test.ts; then
            python3 - <<'PY'
          import base64,hashlib,json,pathlib,subprocess
          data=json.loads(subprocess.check_output(['gh','api','repos/blue45f/toonspectrum/git/blobs/7d795c44f7ab1e4566cdf62677a29be5dd7250d6']))
          patch=base64.b64decode(data['content'])
          assert hashlib.sha256(patch).hexdigest()=='a327e77a7fb44eb876424bfe552db46ea08814c5bbab17dbad32f2b34efeac0a'
          allowed={
              '+++ b/src/domains/creator/character-shaper/StudioCharacterShaperDialog.test.tsx',
              '+++ b/src/domains/creator/vrm/studio-vrm-wardrobe.ts',
              '+++ b/src/domains/creator/vrm/studio-vrm-garment-limb-profile.test.ts',
          }
          assert {line for line in patch.decode().splitlines() if line.startswith('+++ ')}==allowed
          pathlib.Path('/tmp/3d-followup.patch').write_bytes(patch)
          PY
            git apply --check /tmp/3d-followup.patch
            git apply /tmp/3d-followup.patch
            git add src/domains/creator/character-shaper/StudioCharacterShaperDialog.test.tsx src/domains/creator/vrm/studio-vrm-wardrobe.ts src/domains/creator/vrm/studio-vrm-garment-limb-profile.test.ts
            test "$(git diff --cached --name-only | wc -l)" -eq 3
            git diff --cached --check
            test "$(gh api repos/blue45f/toonspectrum/git/ref/heads/$GITHUB_REF_NAME --jq .object.sha)" = "$GITHUB_SHA"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(studio): orient flared sleeves and hems toward wrists and ankles'
            gh auth setup-git
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  source-verification:
    needs: integrate-followup
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      HUSKY: '0'
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.integrate-followup.outputs.head }}
          persist-credentials: false
          fetch-depth: 1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify every changed product file with strict lint
        run: |
          mkdir -p /tmp/3d-final-code
          git rev-parse HEAD > /tmp/3d-final-code/head.txt
          git fetch --depth=1 origin dbd5e75a207950b00360516a4353af872ff67e60
          git diff --name-only dbd5e75a207950b00360516a4353af872ff67e60 HEAD -- src/domains/creator > /tmp/3d-final-code/changed-files.txt
          xargs pnpm exec eslint --max-warnings=0 < /tmp/3d-final-code/changed-files.txt 2>&1 | tee /tmp/3d-final-code/lint.log
      - name: Complete frontend typecheck
        if: ${{ !cancelled() }}
        run: pnpm exec tsc -p tsconfig.json 2>&1 | tee /tmp/3d-final-code/typecheck.log
      - name: All native tests in the five affected 3D domains
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run src/domains/creator/vrm src/domains/creator/character-shaper src/domains/creator/bg3d src/domains/creator/lift3d src/domains/creator/scene-3d 2>&1 | tee /tmp/3d-final-code/tests.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: studio-3d-final-code-${{ needs.integrate-followup.outputs.head }}
          path: /tmp/3d-final-code
          retention-days: 7

  final-garment-frames:
    needs: integrate-followup
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    env:
      HUSKY: '0'
      NODE_OPTIONS: --max-old-space-size=8192
      STUDIO_REVIEW_GROUP: wardrobe
      STUDIO_REVIEW_VARIANT: final-limb-fit
      STUDIO_CLOSEUP_OUTPUT: /tmp/3d-final-frames
      TOONSPECTRUM_VERIFY_ORIGIN: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.integrate-followup.outputs.head }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the exact final source
        run: |
          mkdir -p "$STUDIO_CLOSEUP_OUTPUT"
          git rev-parse HEAD > "$STUDIO_CLOSEUP_OUTPUT/head.txt"
          pnpm run build:bundle 2>&1 | tee "$STUDIO_CLOSEUP_OUTPUT/build.log"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start local preview
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 5173 --strictPort > "$STUDIO_CLOSEUP_OUTPUT/preview.log" 2>&1 &
          for n in $(seq 1 60); do
            if curl --silent --fail "$TOONSPECTRUM_VERIFY_ORIGIN/" >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Capture all available clothes and shoes again after the limb-profile correction
        run: node scripts/verify-studio-3d-fit-review.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: studio-3d-final-frames-${{ needs.integrate-followup.outputs.head }}
          path: /tmp/3d-final-frames
          retention-days: 7
          if-no-files-found: error
