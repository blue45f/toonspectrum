name: Storyworld independent macOS preflight

on:
  push:
    branches: [verify/storyworld-preflight-macos-20260905]
    paths: [.github/workflows/storyworld-preflight-macos-20260905.yml]

permissions:
  contents: write

concurrency:
  group: storyworld-macos-preflight-20260905
  cancel-in-progress: true

jobs:
  materialize-macos:
    if: github.repository == 'blue45f/toonspectrum'
    runs-on: macos-15
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      TARGET_BRANCH: feat/storyworld-causality-lab-20260905
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Refuse stale work and integrate on the exact live source
        id: integrate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = cd9c1987a4f980e610d991b05e87f3f325725a3c
          python3 .github/storyworld-transport-20260905/integrate.py
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install the exact repository dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Lint only the Storyworld integration surface
        id: lint
        continue-on-error: true
        run: |
          pnpm exec eslint --fix --max-warnings=0 \
            src/domains/creator/storyworld \
            src/domains/creator/studio-router/StudioRouter.tsx \
            src/domains/creator/studio-router/studio-route-manifest.ts \
            src/domains/creator/studio-router/studio-route-manifest.test.ts \
            src/domains/creator/studio-router/studio-storyworld-route.test.ts \
            scripts/verify-storyworld-lab.mjs
      - name: Run actual engine, UI and router regression tests
        id: tests
        continue-on-error: true
        run: pnpm exec vitest run src/domains/creator/storyworld src/domains/creator/studio-router
      - name: Check repository and API TypeScript
        id: types
        continue-on-error: true
        run: pnpm run typecheck
      - name: Publish only a fast-forward product commit, removing all transport
        if: ${{ !cancelled() && steps.integrate.outcome == 'success' }}
        shell: bash
        env:
          LINT_RESULT: ${{ steps.lint.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          TYPE_RESULT: ${{ steps.types.outcome }}
        run: |
          set -euo pipefail
          rm -r .github/storyworld-transport-20260905
          rm .github/workflows/storyworld-materialize-20260905.yml
          rm .github/workflows/storyworld-preflight-macos-20260905.yml
          git add -A -- \
            .github/storyworld-transport-20260905 \
            .github/workflows/storyworld-materialize-20260905.yml \
            .github/workflows/storyworld-preflight-macos-20260905.yml \
            docs/studio-storyworld-causality-lab-2026-09-05.md \
            scripts/verify-storyworld-lab.mjs \
            src/domains/creator/storyworld \
            src/domains/creator/studio-router/StudioRouter.tsx \
            src/domains/creator/studio-router/studio-route-manifest.ts \
            src/domains/creator/studio-router/studio-route-manifest.test.ts \
            src/domains/creator/studio-router/studio-storyworld-route.test.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          HUSKY=0 git commit -m 'feat(studio): integrate verified Storyworld lab with document-scoped routes'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          printf 'Product commit: `%s`\n\nLint: %s\n\nTests: %s\n\nTypes: %s\n\nThis preflight does not replace the mandatory PR core CI.\n' "$(git rev-parse HEAD)" "$LINT_RESULT" "$TEST_RESULT" "$TYPE_RESULT" >> "$GITHUB_STEP_SUMMARY"
      - name: Require all diagnostic results
        if: ${{ !cancelled() }}
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          TYPE_RESULT: ${{ steps.types.outcome }}
        run: |
          test "$INSTALL_RESULT" = success
          test "$LINT_RESULT" = success
          test "$TEST_RESULT" = success
          test "$TYPE_RESULT" = success
