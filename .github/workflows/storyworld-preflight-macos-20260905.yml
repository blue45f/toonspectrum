name: Storyworld exact-head diagnostic report

on:
  push:
    branches: [verify/storyworld-preflight-macos-20260905]
    paths: [.github/workflows/storyworld-preflight-macos-20260905.yml]

permissions:
  contents: read

concurrency:
  group: storyworld-macos-preflight-20260905
  cancel-in-progress: true

jobs:
  diagnostics:
    if: github.repository == 'blue45f/toonspectrum'
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: read
      actions: write
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      PRODUCT_SHA: c5c802e2dccd1fd23fb4a46b1ae020766d391082
    steps:
      - name: Cancel only the two superseded PR 746 CI attempts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base = 'https://api.github.com/repos/blue45f/toonspectrum/'
          def request(path, method='GET'):
              req = urllib.request.Request(base + path, method=method, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = response.read()
                  return json.loads(data) if data else None

          pr = request('pulls/746')
          assert pr['head']['sha'] == os.environ['PRODUCT_SHA'] and pr['state'] == 'open' and pr['base']['ref'] == 'main'
          old = {33948645140: '593b97c77d3428d327ee066875df2d5907b74b4b', 33949223974: 'a8f194ccaf7cc4f68f41b56a60a156bb7b55d60e'}
          for run_id, sha in old.items():
              run = request(f'actions/runs/{run_id}')
              assert run['head_sha'] == sha and run['head_branch'] == 'feat/storyworld-causality-lab-20260905'
              assert run['name'] == 'CI' and run['event'] == 'pull_request'
              assert any(item['number'] == 746 for item in run['pull_requests'])
              if run['status'] == 'completed':
                  print(f'Old run {run_id} already completed; left unchanged.')
                  continue
              try:
                  request(f'actions/runs/{run_id}/cancel', 'POST')
                  print(f'Cancelled superseded run {run_id}; current-head CI is untouched.')
              except urllib.error.HTTPError as error:
                  if error.code != 409:
                      raise
                  print(f'Old run {run_id} completed while cancellation was requested.')
          PY
      - uses: actions/checkout@v6
        with:
          ref: c5c802e2dccd1fd23fb4a46b1ae020766d391082
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Execute real checks against the exact product head
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import time

          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'storyworld-diagnostic.json'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['PRODUCT_SHA']
          commands = [
              ('install', ['pnpm', 'install', '--frozen-lockfile']),
              ('lint', ['pnpm', 'exec', 'eslint', '--max-warnings=0', 'src/domains/creator/storyworld', 'src/domains/creator/studio-router/StudioRouter.tsx', 'src/domains/creator/studio-router/studio-route-manifest.ts', 'src/domains/creator/studio-router/studio-route-manifest.test.ts', 'src/domains/creator/studio-router/studio-storyworld-route.test.ts', 'scripts/verify-storyworld-lab.mjs']),
              ('tests', ['pnpm', 'exec', 'vitest', 'run', 'src/domains/creator/storyworld', 'src/domains/creator/studio-router']),
              ('types', ['pnpm', 'run', 'typecheck']),
              ('architecture', ['pnpm', 'run', 'validate:architecture']),
              ('standalone', ['pnpm', 'exec', 'node', 'scripts/verify-storyworld-lab.mjs']),
          ]
          report = {'productSha': os.environ['PRODUCT_SHA'], 'runId': os.environ['GITHUB_RUN_ID'], 'checks': []}
          for name, command in commands:
              started = time.monotonic()
              try:
                  completed = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=900)
                  entry = {'name': name, 'exitCode': completed.returncode, 'seconds': round(time.monotonic() - started, 2), 'outputTail': completed.stdout[-16000:]}
              except Exception as error:
                  entry = {'name': name, 'exitCode': -1, 'error': str(error)}
              report['checks'].append(entry)
              target.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')
              print('::group::' + name, flush=True)
              print(json.dumps(entry, ensure_ascii=False, indent=2), flush=True)
              print('::endgroup::', flush=True)
              if name == 'install' and entry['exitCode'] != 0:
                  break
          assert len(report['checks']) == len(commands) and all(check['exitCode'] == 0 for check in report['checks']), 'Diagnostic checks failed. Required PR core CI is unchanged.'
          PY
      - name: Preserve diagnostic evidence without modifying any branch
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: storyworld-diagnostic-${{ env.PRODUCT_SHA }}
          path: ${{ runner.temp }}/storyworld-diagnostic.json
          retention-days: 7
          if-no-files-found: error
