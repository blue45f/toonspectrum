name: Scene3D BG insert resolution hotfix

on:
  push:
    branches:
      - fix/scene3d-bg-quality-20260910
    paths:
      - .github/workflows/scene3d-bg-insert-resolution-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/scene3d-bg-quality-20260910
          fetch-depth: 0
      - name: Remove DPR-dependent low-resolution BG insert
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/domains/creator/bg3d/studio-bg3d-editor-insert-host.ts')
          text = path.read_text(encoding='utf-8')
          old = '''      // Clamp DPR to 1..3; the size resolver enforces pixel and 4096-edge budgets.\n      const captureDensity = Math.min(3, Math.max(1, globalThis.devicePixelRatio || 1));\n      const captureSize = resolveStudioBg3dLtCaptureSize({\n        sourceWidth: sourceSize.width,\n        sourceHeight: sourceSize.height,\n        aspectRatio: captureFrame.aspectRatio,\n        requestedHeight: Math.min(\n          4096,\n          Math.round(adapted.document.output.exportHeight * captureDensity)\n        ),\n        maxPixels: Math.min(deviceQuality.maxRenderPixels, STUDIO_BG3D_LT_RENDER_MAX_PIXELS),\n      });\n'''
          new = '''      // Canvas insertion is a persisted output-pixel contract, not a display-density contract.\n      // Multiplying the historical 640px default by the monitor DPR made identical scenes render\n      // differently across displays and produced visibly soft images once placed on a webtoon canvas.\n      // Keep the result deterministic and never insert below a 2160px production source height.\n      const requestedCaptureHeight = Math.min(\n        4096,\n        Math.max(2160, Math.round(adapted.document.output.exportHeight)),\n      );\n      const captureSize = resolveStudioBg3dLtCaptureSize({\n        sourceWidth: sourceSize.width,\n        sourceHeight: sourceSize.height,\n        aspectRatio: captureFrame.aspectRatio,\n        requestedHeight: requestedCaptureHeight,\n        maxPixels: Math.min(deviceQuality.maxRenderPixels, STUDIO_BG3D_LT_RENDER_MAX_PIXELS),\n      });\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one BG insert capture-density block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Add regression test
        shell: bash
        run: |
          cat > apps/web/src/domains/creator/bg3d/studio-bg3d-insert-resolution-boundary.test.ts <<'EOF'
          import { readFileSync } from "node:fs";
          import { describe, expect, it } from "vitest";

          const source = readFileSync(
            new URL("./studio-bg3d-editor-insert-host.ts", import.meta.url),
            "utf8",
          );

          describe("BG3D canvas insert resolution boundary", () => {
            it("uses deterministic production pixels instead of monitor DPR", () => {
              const start = source.indexOf("async function handleInsert()");
              const end = source.indexOf("h.handleInsert = handleInsert;", start);
              const handler = source.slice(start, end);

              expect(start).toBeGreaterThanOrEqual(0);
              expect(handler).not.toContain("devicePixelRatio");
              expect(handler).not.toContain("captureDensity");
              expect(handler).toContain("Math.max(2160, Math.round(adapted.document.output.exportHeight))");
              expect(handler).toContain("requestedHeight: requestedCaptureHeight");
            });
          });
          EOF
      - name: Validate patch
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec vitest run apps/web/src/domains/creator/bg3d/studio-bg3d-insert-resolution-boundary.test.ts
          git diff --check
      - name: Commit and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name "toonstudio-3d-ci"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/scene3d-bg-insert-resolution-hotfix.yml
          git add apps/web/src/domains/creator/bg3d/studio-bg3d-editor-insert-host.ts \
                  apps/web/src/domains/creator/bg3d/studio-bg3d-insert-resolution-boundary.test.ts
          git diff --cached --check
          git commit -m "fix(bg3d): keep canvas insertion sharp and deterministic"
          git push origin HEAD:fix/scene3d-bg-quality-20260910
