name: Free Actions capacity and merge PR 931

on:
  push:
    branches:
      - automation/free-actions-for-pr931-20260908

permissions:
  contents: write
  actions: write
  pull-requests: write
  checks: read

jobs:
  prioritize-security-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TARGET_PR: '931'
      TARGET_BRANCH: security/dependabot-zero-audit-main-20260908-v3
      NOISY_BRANCH: release/final-main-merge-4888b061-immutable-20260908
      AUTOMATION_REF: heads/automation/free-actions-for-pr931-20260908
    steps:
      - name: Cancel queued and running workflows from the unrelated integration branch
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${REPOSITORY}/actions/runs?branch=${NOISY_BRANCH}&per_page=100" --paginate --slurp)"
          mapfile -t ids < <(jq -r '[.[][] | select(.status != "completed")] | .[].id' <<<"$runs")
          echo "cancelling ${#ids[@]} active runs from ${NOISY_BRANCH}"
          for id in "${ids[@]}"; do
            gh api --method POST "repos/${REPOSITORY}/actions/runs/${id}/cancel" >/dev/null 2>&1 || true
          done

      - name: Keep PR 931 open against main and merge only after core succeeds
        shell: bash
        run: |
          set -euo pipefail
          merged="$(gh api "repos/${REPOSITORY}/pulls/${TARGET_PR}" --jq '.merged')"
          if [[ "$merged" == 'true' ]]; then
            gh api --method DELETE "repos/${REPOSITORY}/git/refs/${AUTOMATION_REF}" >/dev/null 2>&1 || true
            exit 0
          fi

          gh api --method PATCH "repos/${REPOSITORY}/pulls/${TARGET_PR}" \
            -f state=open -f base=main \
            -f title='fix(security): resolve all Dependabot alerts' >/dev/null
          gh pr merge "$TARGET_PR" --repo "$REPOSITORY" --auto --squash || true

          retriggered=0
          for attempt in $(seq 1 90); do
            pr_json="$(gh api "repos/${REPOSITORY}/pulls/${TARGET_PR}")"
            merged="$(jq -r '.merged' <<<"$pr_json")"
            state="$(jq -r '.state' <<<"$pr_json")"
            head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
            base_ref="$(jq -r '.base.ref' <<<"$pr_json")"

            if [[ "$merged" == 'true' ]]; then
              gh api --method DELETE "repos/${REPOSITORY}/git/refs/${AUTOMATION_REF}" >/dev/null 2>&1 || true
              echo "PR #${TARGET_PR} merged."
              exit 0
            fi
            [[ "$state" == 'open' && "$base_ref" == 'main' ]]

            checks="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${REPOSITORY}/commits/${head_sha}/check-runs?per_page=100")"
            status="$(jq -r '[.check_runs[] | select(.name == "core" and .app.slug == "github-actions")] | sort_by(.started_at // .created_at) | last | .status // "missing"' <<<"$checks")"
            conclusion="$(jq -r '[.check_runs[] | select(.name == "core" and .app.slug == "github-actions")] | sort_by(.started_at // .created_at) | last | .conclusion // "pending"' <<<"$checks")"
            echo "attempt=${attempt} head=${head_sha} core=${status}/${conclusion}"

            if [[ "$status" == 'completed' && "$conclusion" == 'success' ]]; then
              gh pr merge "$TARGET_PR" --repo "$REPOSITORY" --squash \
                --subject 'fix(security): resolve all Dependabot alerts' \
                --body 'Resolves all audited dependency advisories and restores pnpm frozen-lockfile consistency.'
              sleep 5
              continue
            fi

            if [[ "$status" == 'completed' && "$conclusion" =~ ^(failure|timed_out|action_required|startup_failure|stale)$ ]]; then
              echo "core failed: ${conclusion}" >&2
              latest="$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?branch=${TARGET_BRANCH}&event=pull_request&per_page=20" --jq '.workflow_runs | sort_by(.created_at) | last | .id // empty')"
              [[ -n "$latest" ]] && gh run view "$latest" --repo "$REPOSITORY" --log-failed || true
              exit 1
            fi

            if [[ "$status" == 'missing' && "$attempt" -ge 5 && "$retriggered" -eq 0 ]]; then
              gh api --method PATCH "repos/${REPOSITORY}/pulls/${TARGET_PR}" -f state=closed >/dev/null
              sleep 3
              gh api --method PATCH "repos/${REPOSITORY}/pulls/${TARGET_PR}" -f state=open -f base=main >/dev/null
              retriggered=1
            fi

            sleep 30
          done
          exit 1
