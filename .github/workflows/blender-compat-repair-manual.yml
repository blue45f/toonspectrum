name: Blender compatibility repair

on:
  push:
    branches:
      - feat/blender-character-quality-pipeline-20260904
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blender-compat-repair-manual
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'blue45f/toonspectrum' && github.ref == 'refs/heads/feat/blender-character-quality-pipeline-20260904'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/blender-character-quality-pipeline-20260904
          fetch-depth: 0

      - name: Patch Blender 5.2 API incompatibilities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/blender/toonstudio_blender_kit/face.py")
          text = path.read_text(encoding="utf-8")

          stepped = "    for vertex in obj.data.vertices[::step]:\n"
          replacement = (
              "    for index in range(0, len(obj.data.vertices), step):\n"
              "        vertex = obj.data.vertices[index]\n"
          )
          count = text.count(stepped)
          if count != 2:
              raise SystemExit(f"expected two stepped Blender collection loops, found {count}")
          text = text.replace(stepped, replacement)

          replacements = {
              '    key["toonstudio_semantic_id"] = spec.semantic_id\n': (
                  '    metadata = key.id_data\n'
                  '    metadata["toonstudio_generated"] = True\n'
                  '    metadata[f"toonstudio_semantic_id:{key.name}"] = spec.semantic_id\n'
              ),
              '    key["toonstudio_direction"] = "positive" if direction > 0 else "negative"\n': (
                  '    metadata[f"toonstudio_direction:{key.name}"] = "positive" if direction > 0 else "negative"\n'
              ),
              '    key["toonstudio_generated"] = True\n': '',
              '                key["toonstudio_label"] = label\n': (
                  '                key.id_data[f"toonstudio_label:{name}"] = label\n'
              ),
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one source anchor, found {count}: {old.strip()}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

          python -m compileall -q tools/blender/toonstudio_blender_kit
          python tests/blender/test_source_contracts.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/blender/toonstudio_blender_kit/face.py
          git diff --cached --check
          git commit -m "fix(blender): support Blender 5.2 shape metadata and collections"
          git push origin HEAD:feat/blender-character-quality-pipeline-20260904
