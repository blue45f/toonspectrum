name: Dontdraw intake contracts

on:
  pull_request:
    paths:
      - "scripts/dontdraw/**"
      - ".github/workflows/dontdraw-intake.yml"
  push:
    branches: [main]
    paths:
      - "scripts/dontdraw/**"
      - ".github/workflows/dontdraw-intake.yml"

permissions:
  contents: read

# main 푸시도 최신 커밋만 남긴다. 그룹을 SHA 로 묶으면 main 실행이 저마다 다른 그룹이 되어
# cancel-in-progress 가 취소할 대상을 갖지 못한다 (ref 로 묶어야 같은 그룹이 된다). 이 게이트는
# 브랜치 보호의 필수 체크가 아니므로 최신 main 상태만 검증하면 되고, 커밋별 신호가 필요한
# ci.yml 은 그대로 SHA 로 묶어 둔다.
concurrency:
  group: dontdraw-intake-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dontdraw-intake-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check offline intake syntax
        run: |
          node --check scripts/dontdraw/import-authorized-assets.mjs
          node --check scripts/dontdraw/authorized-intake-io.mjs
      - name: Execute intake and filesystem regression contracts
        run: node --test scripts/dontdraw/*.test.mjs
