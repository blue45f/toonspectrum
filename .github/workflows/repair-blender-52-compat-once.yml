name: Repair Blender 5.2 compatibility once

on:
  push:
    branches:
      - feat/blender-character-quality-pipeline-20260904
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-blender-52-compat-once
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'blue45f/toonspectrum' && github.ref == 'refs/heads/feat/blender-character-quality-pipeline-20260904'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/blender-character-quality-pipeline-20260904
          fetch-depth: 0

      - name: Repair Blender 5.2 collection and ShapeKey metadata compatibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/blender/toonstudio_blender_kit/face.py')
          text = path.read_text(encoding='utf-8')

          old_loop = '    for vertex in obj.data.vertices[::step]:\n'
          new_loop = (
              '    for index in range(0, len(obj.data.vertices), step):\n'
              '        vertex = obj.data.vertices[index]\n'
          )
          loop_count = text.count(old_loop)
          if loop_count != 2:
              raise SystemExit(f'expected two stepped bpy collection loops, found {loop_count}')
          text = text.replace(old_loop, new_loop)

          old_metadata = '''    key["toonstudio_semantic_id"] = spec.semantic_id
              key["toonstudio_direction"] = "positive" if direction > 0 else "negative"
              key["toonstudio_generated"] = True
          '''
          new_metadata = '''    # Individual ShapeKey RNA structs do not support ID properties in Blender 5.2.
              # Store per-shape metadata on the owning Key ID datablock instead.
              metadata = key.id_data
              metadata["toonstudio_generated"] = True
              metadata[f"toonstudio_semantic_id:{key.name}"] = spec.semantic_id
              metadata[f"toonstudio_direction:{key.name}"] = "positive" if direction > 0 else "negative"
          '''
          if old_metadata not in text:
              raise SystemExit('shape metadata anchor not found')
          text = text.replace(old_metadata, new_metadata, 1)

          old_label = '                key["toonstudio_label"] = label\n'
          new_label = '                key.id_data[f"toonstudio_label:{name}"] = label\n'
          if old_label not in text:
              raise SystemExit('shape label anchor not found')
          text = text.replace(old_label, new_label, 1)

          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/repair-blender-52-compat-once.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/blender/toonstudio_blender_kit/face.py .github/workflows/repair-blender-52-compat-once.yml
          git commit -m "fix(blender): support Blender 5.2 shape metadata and collections"
          git push origin HEAD:feat/blender-character-quality-pipeline-20260904
