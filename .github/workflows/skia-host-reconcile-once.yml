name: Skia host reconcile once

on:
  push:
    branches: [fix/skia-live-input-main-reconcile-20260923]
    paths:
      - .github/workflows/skia-host-reconcile-once.yml

permissions:
  contents: write

concurrency:
  group: skia-host-reconcile-once
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: fix/skia-live-input-main-reconcile-20260923
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Merge current main without overriding concurrent work
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "fix/skia-live-input-main-reconcile-20260923"
          git merge-base --is-ancestor fae451cbf4c1cb102f3d5752317b3c31dd093995 HEAD
          git fetch origin main
          git merge --no-commit --no-ff origin/main
      - name: Apply exact guarded host extraction
        run: python3 scripts/reconcile-skia-host-once.py
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify extracted runtime, host ratchet and Skia surface
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/studio-skia-committed-ink-bridge.test.ts
          apps/web/src/domains/creator/studio-host-architecture-ratchet.test.ts
          apps/web/src/domains/creator/render/StudioSkiaDocumentSurface.test.tsx
          apps/web/src/domains/creator/render/studio-webgpu-advanced-live-integration.test.ts
      - name: Verify types, boundaries and changed-file lint
        run: |
          pnpm typecheck
          node scripts/validate-architecture.mjs
          pnpm exec eslint --max-warnings 0 \
            apps/web/src/domains/creator/StudioCuttoonEditorHost.tsx \
            apps/web/src/domains/creator/studio-skia-committed-ink-bridge.ts \
            apps/web/src/domains/creator/studio-skia-committed-ink-bridge.test.ts
      - name: Commit only the reconciled source and remove the one-time machinery
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/skia-host-reconcile-once.yml scripts/reconcile-skia-host-once.py
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "refactor(studio): reconcile Skia handoff runtime with current main"
          git push origin HEAD:fix/skia-live-input-main-reconcile-20260923
