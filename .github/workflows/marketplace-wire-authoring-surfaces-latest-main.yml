name: Marketplace authoring wiring on latest main

on:
  push:
    branches:
      - fix/marketplace-wire-authoring-surfaces-20260903
    paths:
      - ".github/workflows/marketplace-wire-authoring-surfaces-latest-main.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketplace-authoring-surface-repair-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  latest-main-verify-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/marketplace-wire-authoring-surfaces-20260903
          fetch-depth: 0
      - name: Integrate current main without rewriting source history
        run: |
          git fetch origin main
          git merge --no-edit origin/main
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm
      - name: Apply the preserved product integration
        run: node scripts/marketplace/integrate-creator-authoring.mjs
      - name: Stabilize only ambiguous Playwright locators
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function replace(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            if (source.includes(after)) return;
            if (!source.includes(before)) throw new Error(`Missing expected assertion in ${path}`);
            fs.writeFileSync(path, source.replace(before, after));
          }
          replace(
            'e2e/marketplace-authoring-inapp.spec.ts',
            'await expect(workshop.getByText("파티클·산포"), profile.id).toBeVisible();',
            'await expect(\n      workshop\n        .getByTestId("market-authoring-engine-list")\n        .getByText("파티클·산포", { exact: true }),\n      profile.id,\n    ).toBeVisible();',
          );
          replace(
            'e2e/marketplace-authoring-workshop.spec.ts',
            'await expect(page.getByText("stroke-sheet", { exact: true })).toBeVisible();',
            'await expect(page.getByText("stroke-sheet", { exact: true }).last()).toBeVisible();',
          );
          replace(
            'e2e/marketplace-authoring-workshop.spec.ts',
            'await expect(workshop.getByRole("button", { name: "브러시" })).toBeVisible();',
            'await expect(workshop.getByRole("button", { name: "브러시", exact: true })).toBeVisible();',
          );
          replace(
            'e2e/marketplace-authoring-workshop.spec.ts',
            'await expect(page.getByText("Studio 원본 보존")).toHaveCount(2);',
            `const preservedNativePrograms = await page.evaluate(() => {\n      const visit = (value: unknown): unknown[] | null => {\n        if (!value || typeof value !== "object") return null;\n        const record = value as Record<string, unknown>;\n        if (Array.isArray(record.originalEnginePrograms)) return record.originalEnginePrograms;\n        for (const nested of Object.values(record)) {\n          const found = visit(nested);\n          if (found) return found;\n        }\n        return null;\n      };\n      for (const storage of [window.localStorage, window.sessionStorage]) {\n        for (let index = 0; index < storage.length; index += 1) {\n          const key = storage.key(index);\n          const raw = key ? storage.getItem(key) : null;\n          if (!raw) continue;\n          try {\n            const found = visit(JSON.parse(raw));\n            if (found) return found;\n          } catch {\n            // Ignore unrelated non-JSON caches.\n          }\n        }\n      }\n      return [];\n    });\n    expect(preservedNativePrograms).toHaveLength(2);`,
          );
          NODE
      - run: pnpm install --frozen-lockfile
      - name: Static, unit, type and production gates
        run: |
          pnpm exec eslint --fix \
            src/domains/market/pages/MarketPublishPage.tsx \
            src/domains/creator/brush/StudioBrushStudio.tsx \
            e2e/marketplace-authoring-workshop.spec.ts \
            e2e/marketplace-authoring-inapp.spec.ts
          pnpm exec eslint --max-warnings=0 \
            src/domains/market/pages/MarketPublishPage.tsx \
            src/domains/creator/brush/StudioBrushStudio.tsx \
            e2e/marketplace-authoring-workshop.spec.ts \
            e2e/marketplace-authoring-inapp.spec.ts
          pnpm exec vitest run \
            src/domains/market/components/MarketplaceAuthoringWorkshop.test.tsx \
            src/domains/creator/MarketplaceBrushStudioBridge.test.tsx \
            lib/creator-marketplace-authoring-workshop.test.ts \
            --reporter=verbose
          pnpm exec tsc -p tsconfig.json --noEmit
          pnpm run build
          git diff --check
      - run: pnpm exec playwright install --with-deps chromium
      - name: Desktop mobile and in-app browser gates
        run: >-
          xvfb-run -a --server-args="-screen 0 1920x1200x24"
          pnpm exec playwright test
          e2e/marketplace-authoring-workshop.spec.ts
          e2e/marketplace-authoring-inapp.spec.ts
          --project=chromium
          --reporter=line
          --trace=retain-on-failure
      - name: Push only the verified merge and product delta
        run: |
          git add \
            src/domains/market/pages/MarketPublishPage.tsx \
            src/domains/creator/brush/StudioBrushStudio.tsx \
            e2e/marketplace-authoring-workshop.spec.ts \
            e2e/marketplace-authoring-inapp.spec.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix(marketplace): wire authoring surfaces on current main"
          fi
          git push origin HEAD:fix/marketplace-wire-authoring-surfaces-20260903
