name: Run safe merged branch cleanup once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-safe-merged-branch-cleanup-once.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: safe-merged-branch-cleanup-once
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete only branches proven integrated into main
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Fetch the reviewed cleanup script from this main commit
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          script_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SOURCE_SHA}/scripts/cleanup-merged-branches.mjs"
          curl --fail --silent --show-error --location \
            "$script_url" \
            --output "$RUNNER_TEMP/cleanup-merged-branches.mjs"
          node --check "$RUNNER_TEMP/cleanup-merged-branches.mjs"

      - name: Delete safely merged branches
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/cleanup-merged-branches.mjs" --all --apply \
            | tee "$RUNNER_TEMP/cleanup-report.json"
