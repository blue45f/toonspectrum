name: Run safe merged branch cleanup once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-safe-merged-branch-cleanup-once.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: safe-merged-branch-cleanup-once-v2
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete only branches proven integrated into main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch the reviewed cleanup script from this main commit
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          script_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SOURCE_SHA}/scripts/cleanup-merged-branches.mjs"
          curl --fail --silent --show-error --location \
            "$script_url" \
            --output "$RUNNER_TEMP/cleanup-merged-branches.mjs"
          node --check "$RUNNER_TEMP/cleanup-merged-branches.mjs"

      - name: Delete safely merged branches
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/cleanup-merged-branches.mjs" --all --apply \
            | tee "$RUNNER_TEMP/cleanup-report.json"

      - name: Publish cleanup summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Safe merged-branch cleanup"
            if [[ -f "$RUNNER_TEMP/cleanup-report.json" ]]; then
              node - "$RUNNER_TEMP/cleanup-report.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.log(`- Deleted: ${report.deleted?.length ?? 0}`);
          console.log(`- Preserved/skipped: ${report.skipped?.length ?? 0}`);
          console.log(`- Duplicate PRs closed: ${report.closedPullRequests?.length ?? 0}`);
          NODE
              echo '<details><summary>Full report</summary>'
              echo
              echo '```json'
              cat "$RUNNER_TEMP/cleanup-report.json"
              echo '```'
              echo '</details>'
            else
              echo "Cleanup report was not produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
