name: Architecture current source snapshot

on:
  push:
    branches:
      - refactor/layered-architecture-20260904

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Build tracked text-source archive
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          import tarfile
          from pathlib import Path

          root = Path.cwd()
          output = root / ".architecture-current-source"
          output.mkdir(exist_ok=True)

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          tracked = [item for item in tracked if item]
          text_suffixes = {
              ".cjs", ".css", ".cts", ".frag", ".glsl", ".html", ".js", ".jsx",
              ".json", ".jsonc", ".md", ".mjs", ".mts", ".rs", ".scss", ".sql",
              ".toml", ".ts", ".tsx", ".vert", ".wgsl", ".yaml", ".yml",
          }
          source_roots = {
              ".github", "api", "apps", "components", "config", "crates", "data", "deploy",
              "docs", "e2e", "functions", "lib", "packages", "patches", "playwright", "scripts",
              "src", "tests", "tools",
          }
          explicit_root_files = {
              ".dockerignore", ".env.example", ".env.production.example", ".gitattributes",
              ".gitignore", ".npmrc", ".nvmrc", ".vercelignore", "DEPLOY.md", "DESIGN.md",
              "DIFFERENTIATION.md", "MONETIZATION.md", "PRODUCT.md", "README.md",
              "STUDIO_3D_DCC_MANUAL.md", "STUDIO_MANUAL.md", "THIRD_PARTY_NOTICES.md",
              "commitlint.config.cjs", "drizzle.config.ts", "eslint.config.mjs",
              "eslint.legacy-exceptions.json", "index.html", "package.json", "playwright.config.ts",
              "pnpm-lock.yaml", "pnpm-workspace.yaml", "sonar-project.properties", "tsconfig.json",
              "turbo.json", "vercel.json", "vite.config.ts", "vitest.config.ts",
          }

          archive_paths: list[str] = []
          records: list[dict[str, object]] = []
          for rel in tracked:
              path = root / rel
              if not path.is_file():
                  continue
              stat = path.stat()
              suffix = path.suffix.lower()
              first = rel.split("/", 1)[0]
              include = (
                  (suffix in text_suffixes or rel in explicit_root_files)
                  and stat.st_size <= 8 * 1024 * 1024
                  and (first in source_roots or rel in explicit_root_files)
              )
              if not include:
                  continue
              archive_paths.append(rel)
              try:
                  lines = len(path.read_text(encoding="utf-8").splitlines())
              except UnicodeDecodeError:
                  continue
              records.append({"path": rel, "bytes": stat.st_size, "lines": lines})

          with tarfile.open(output / "toonspectrum-current-source.tar.gz", "w:gz") as archive:
              for rel in archive_paths:
                  archive.add(root / rel, arcname=rel, recursive=False)

          (output / "inventory.json").write_text(
              json.dumps(
                  {
                      "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                      "fileCount": len(archive_paths),
                      "files": sorted(records, key=lambda item: str(item["path"])),
                  },
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )
          PY

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: architecture-current-source-${{ github.sha }}
          path: .architecture-current-source/
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
