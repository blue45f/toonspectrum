name: PR 740 superseded CI recovery

on:
  push:
    branches: [maintenance/pr740-ci-queue-recovery-20260905]
    paths: [.github/workflows/pr740-ci-queue-recovery.yml]

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  recover-superseded-runs:
    if: github.repository == 'blue45f/toonspectrum'
    runs-on: ubuntu-slim
    timeout-minutes: 8
    steps:
      # No checkout or PR code execution. Only obsolete runs for this exact PR/branch are cancelled.
      # The latest HEAD, every other PR, required checks, and branch-protection settings are untouched.
      - name: Cancel superseded workflow runs for PR 740
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ab437a655fd2cf521960c9c3c1235f3acbb31109
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = 'blue45f/toonspectrum'
          branch = 'codex/studio-ux-convergence-20260905'
          pr_number = 740
          expected = os.environ['EXPECTED_HEAD']
          api = 'https://api.github.com/repos/' + repo
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'pr740-superseded-ci-recovery',
          }

          def request(path, method='GET'):
              req = urllib.request.Request(api + path, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read()
                      return response.status, json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  if method == 'POST' and error.code in (409, 422):
                      return error.code, None
                  raise

          def checked_pr():
              _, pr = request('/pulls/' + str(pr_number))
              if pr['state'] != 'open' or pr['merged']:
                  raise SystemExit('PR is no longer open; no cancellation performed.')
              if (pr['head']['sha'] != expected or pr['head']['ref'] != branch
                      or pr['head']['repo']['full_name'] != repo or pr['base']['ref'] != 'main'):
                  raise SystemExit('PR identity/HEAD changed; stop instead of touching another revision.')
              return pr

          checked_pr()
          candidates = []
          for page in range(1, 11):
              query = urllib.parse.urlencode({'branch': branch, 'per_page': 100, 'page': page})
              _, payload = request('/actions/runs?' + query)
              runs = payload['workflow_runs']
              for run in runs:
                  active = run['status'] in (
                      'queued', 'pending', 'waiting', 'in_progress', 'requested'
                  )
                  belongs_to_pr = any(
                      linked_pr['number'] == pr_number
                      for linked_pr in run.get('pull_requests', [])
                  )
                  if (run['head_branch'] == branch
                          and run['head_sha'] != expected
                          and active
                          and (belongs_to_pr or run['event'] == 'push')):
                      candidates.append(run)
              if len(runs) < 100:
                  break
          else:
              raise SystemExit('Pagination safety limit reached; no cancellations performed.')

          cancelled = []
          for run in candidates:
              checked_pr()
              code, _ = request('/actions/runs/' + str(run['id']) + '/cancel', 'POST')
              print(
                  'Superseded run', run['id'], run['name'], run['head_sha'],
                  'cancel response', code,
              )
              if code == 202:
                  cancelled.append(run['id'])

          print('Latest HEAD preserved:', expected)
          print('Accepted cancellation requests:', len(cancelled))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## PR 740 queue recovery\n\n')
              summary.write('Latest HEAD preserved: `' + expected + '`.\n\n')
              summary.write(
                  'Cancelled superseded run IDs: '
                  + (', '.join(map(str, cancelled)) or 'none') + '.\n\n'
              )
              summary.write(
                  'No current validation step, required status, other PR, or '
                  'branch-protection setting was changed.\n'
              )
          PY
