name: One-shot inspect root Vitest diagnostics

on:
  push:
    branches:
      - diagnostics/codeql-pr919-20260908
    paths:
      - .github/workflows/one-shot-codeql-pr919.yml

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and print preserved root Vitest outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          gh run download 34171085839 --repo "$GITHUB_REPOSITORY" --dir diagnostics
          find diagnostics -type f -maxdepth 3 -print -exec wc -c {} \;
          for file in diagnostics/root-vitest-diagnostic-*/shard-*.exit; do
            echo "EXIT_FILE=$file VALUE=$(cat "$file")"
          done
          for file in diagnostics/root-vitest-diagnostic-*/shard-*.log; do
            echo "===== BEGIN $file ====="
            cat "$file"
            echo "===== END $file ====="
          done
