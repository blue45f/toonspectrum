name: Temporary filter source export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Package filter implementation and contracts
        run: |
          tar -czf filter-source.tar.gz \
            src/domains/creator/filter \
            src/domains/creator/render \
            src/domains/creator/studio-*.ts \
            src/domains/creator/brush/studio-ink-wash.ts \
            src/domains/creator/layer/studio-layer-border-effect.ts \
            scripts/verify-studio-filter-dialog.mts \
            scripts/verify-studio-gpu-filters.mts \
            package.json \
            pnpm-lock.yaml \
            tsconfig.json \
            vitest.config.* \
            .github/workflows/studio-filter-dialog.yml 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: filter-source
          path: filter-source.tar.gz
          if-no-files-found: error
          retention-days: 1
