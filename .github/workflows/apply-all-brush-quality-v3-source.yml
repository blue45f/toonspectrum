name: Validate all-brush quality-first v3 sources

on:
  push:
    branches:
      - feat/all-brush-long-stroke-quality-election-20260904
    paths:
      - scripts/patch-all-brush-quality-v3.py
      - scripts/patch-all-brush-quality-v3b.py
      - .github/workflows/apply-all-brush-quality-v3-source.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-all-brush-quality-v3-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-verify-publish:
    if: ${{ !contains(github.event.head_commit.message, '[quality-v3-source-validated]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/all-brush-long-stroke-quality-election-20260904
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply source hardening
        run: |
          python3 -m py_compile \
            scripts/patch-all-brush-quality-v3.py \
            scripts/patch-all-brush-quality-v3b.py
          python3 scripts/patch-all-brush-quality-v3.py
          python3 scripts/patch-all-brush-quality-v3b.py
          python3 - <<'PY'
          from pathlib import Path

          verifier = Path("scripts/verify-studio-long-stroke.mts")
          source = verifier.read_text(encoding="utf-8")
          before = '    const liveShot = await shot(page, clip, "01-live");'
          after = '    await shot(page, clip, "01-live");'
          if source.count(before) != 1:
              raise SystemExit(
                  f"complete live capture marker: expected one, found {source.count(before)}"
              )
          verifier.write_text(source.replace(before, after, 1), encoding="utf-8")
          PY
          git diff --check

      - name: Focused tests
        run: >-
          pnpm exec vitest run
          scripts/studio-brush-long-matrix-quality.test.ts
          src/domains/creator/brush/studio-brush-gpu-quality-election.test.ts
          src/domains/creator/brush/studio-brush-gpu-quality-evidence.test.ts
          src/domains/creator/brush/studio-brush-quality-curation.test.ts
          src/domains/creator/live/studio-live-ink-lane-admission.test.ts

      - name: Focused zero-warning lint
        run: >-
          pnpm exec eslint --max-warnings=0
          scripts/run-studio-all-brush-long-stroke-shard.mts
          scripts/aggregate-studio-all-brush-long-stroke.mts
          scripts/verify-studio-long-stroke.mts
          src/domains/creator/brush/studio-brush-gpu-quality-election.ts
          src/domains/creator/brush/studio-brush-gpu-quality-election.test.ts
          src/domains/creator/brush/studio-brush-gpu-quality-evidence.ts
          src/domains/creator/brush/studio-brush-gpu-quality-evidence.test.ts
          src/domains/creator/brush/studio-brush-gpu-quality-evidence.generated.ts
          src/domains/creator/brush/studio-brush-quality-curation.ts
          src/domains/creator/brush/studio-brush-quality-curation.test.ts
          src/domains/creator/live/studio-live-ink-lane-admission.ts
          src/domains/creator/live/studio-live-ink-lane-admission.test.ts

      - name: Typecheck complete repository
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Publish validated source changes
        run: |
          git config user.name toonstudio-bot
          git config user.email actions@users.noreply.github.com
          git add \
            scripts/verify-studio-long-stroke.mts \
            scripts/run-studio-all-brush-long-stroke-shard.mts \
            scripts/aggregate-studio-all-brush-long-stroke.mts
          git diff --cached --check
          git commit -m "test(brush): harden quality-first all-brush election [quality-v3-source-validated]"
          git -c core.hooksPath=/dev/null push origin HEAD:feat/all-brush-long-stroke-quality-election-20260904
