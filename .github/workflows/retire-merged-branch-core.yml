name: Retire merged branch check

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/retire-merged-branch-core.yml

permissions:
  contents: read

jobs:
  core:
    if: ${{ false }}
    runs-on: ubuntu-slim
    steps:
      - run: echo "This branch-retirement PR contains no product-tree changes."
