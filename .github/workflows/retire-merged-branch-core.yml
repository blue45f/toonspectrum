name: Retired branch guard tombstone

# One-time protected-branch check for the cleanup branch below.
# Recreating that branch replaces and cancels any older pending cleanup run;
# the branch is deleted automatically after this maintenance PR merges.
on:
  push:
    branches:
      - chore/remove-retire-guard-20260908

permissions:
  contents: read

concurrency:
  group: one-time-merged-branch-cleanup
  cancel-in-progress: true

jobs:
  core:
    if: ${{ false }}
    runs-on: ubuntu-slim
    steps:
      - run: echo "Historical one-time branch-retirement guard."
