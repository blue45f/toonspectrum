name: Retired branch guard tombstone

# One-time protected-branch check for the cleanup branch below.
# The branch is deleted automatically when PR #862 merges, so this workflow
# cannot run again during normal repository development.
on:
  push:
    branches:
      - chore/remove-retire-guard-20260908

permissions:
  contents: read

jobs:
  core:
    if: ${{ false }}
    runs-on: ubuntu-slim
    steps:
      - run: echo "Historical one-time branch-retirement guard."
