name: Studio tooltip final patch

on:
  push:
    branches:
      - feat/studio-tooltip-pro-v2-20260909
    paths:
      - .github/workflows/studio-tooltip-pro-validate.yml

permissions:
  contents: write

concurrency:
  group: studio-tooltip-final-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /apps/web/src/domains/creator/StudioToolHint.tsx
            /apps/web/src/domains/creator/StudioToolHint.optimization.test.tsx
            /.github/workflows/studio-tooltip-pro-validate.yml
      - name: Apply reviewed tooltip accessibility and hook patch
        run: |
          set -euo pipefail
          node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");

          const shellPath = "apps/web/src/domains/creator/StudioToolHint.tsx";
          const shell = readFileSync(shellPath, "utf8");
          const suppressionPattern = /function suppressPassivePointerHints\(\) \{\s+interaction\.suppressHover\(\);\s+const activeHintId = coordinator\.getActiveHintId\(\);/u;
          const suppressionReplacement = [
            "function suppressPassivePointerHints(event?: Event) {",
            "      const target = event?.target;",
            "      if (",
            "        target instanceof Element &&",
            "        target.closest('[data-studio-tool-hint=\"true\"]')",
            "      ) {",
            "        return;",
            "      }",
            "      interaction.suppressHover();",
            "      const activeHintId = coordinator.getActiveHintId();",
          ].join("\n");
          if (!suppressionPattern.test(shell)) {
            throw new Error("Passive tooltip suppression hook not found");
          }
          let patchedShell = shell.replace(suppressionPattern, suppressionReplacement);

          const detachedHideBefore = [
            "      hideRenderedTooltipImmediately();",
            "      coordinator.release(tipId);",
          ].join("\n");
          const detachedHideAfter = [
            "      hideRenderedToolHintElement(tipId);",
            "      coordinator.release(tipId);",
          ].join("\n");
          if (!patchedShell.includes(detachedHideBefore)) {
            throw new Error("Detached tooltip hiding hook not found");
          }
          patchedShell = patchedShell.replace(detachedHideBefore, detachedHideAfter);

          const effectDepsBefore = "  }, [open]);\n\n  if (!hint)";
          const effectDepsAfter =
            "  }, [coordinator, interaction, open, tipId]);\n\n  if (!hint)";
          if (!patchedShell.includes(effectDepsBefore)) {
            throw new Error("Tooltip reposition effect dependency list not found");
          }
          patchedShell = patchedShell.replace(effectDepsBefore, effectDepsAfter);
          writeFileSync(shellPath, patchedShell);

          const testPath = "apps/web/src/domains/creator/StudioToolHint.optimization.test.tsx";
          const test = readFileSync(testPath, "utf8");
          const marker = '  it("dismisses transient help when the editor window loses attention", () => {';
          const internalScrollTest = [
            '  it("keeps passive hover help open while its own scroll region is being read", async () => {',
            "    vi.useFakeTimers();",
            "    renderPair();",
            '    const pen = screen.getByRole("button", { name: "펜" });',
            "",
            "    fireEvent.mouseEnter(pen);",
            "    await act(async () => {",
            "      vi.advanceTimersByTime(280);",
            "      await Promise.resolve();",
            "      await Promise.resolve();",
            "    });",
            "",
            '    const tooltip = screen.getByRole("tooltip");',
            "    const scrollRegion = tooltip.querySelector(",
            "      '[data-studio-tool-hint-scroll-region=\"true\"]'",
            "    );",
            "    expect(scrollRegion).not.toBeNull();",
            "",
            "    fireEvent.wheel(scrollRegion as Element);",
            "    fireEvent.scroll(scrollRegion as Element);",
            '    expect(screen.getByRole("tooltip")).toBe(tooltip);',
            "",
            "    fireEvent.wheel(document.body);",
            '    expect(screen.queryByRole("tooltip")).toBeNull();',
            "  });",
            "",
            "",
          ].join("\n");
          if (!test.includes(marker)) {
            throw new Error("Tooltip attention regression marker not found");
          }
          writeFileSync(testPath, test.replace(marker, internalScrollTest + marker));
          NODE
      - name: Verify final source contract
        run: |
          set -euo pipefail
          grep -Fq 'function suppressPassivePointerHints(event?: Event)' apps/web/src/domains/creator/StudioToolHint.tsx
          grep -Fq 'target.closest(' apps/web/src/domains/creator/StudioToolHint.tsx
          grep -Fq 'hideRenderedToolHintElement(tipId);' apps/web/src/domains/creator/StudioToolHint.tsx
          grep -Fq '}, [coordinator, interaction, open, tipId]);' apps/web/src/domains/creator/StudioToolHint.tsx
          grep -Fq 'keeps passive hover help open while its own scroll region is being read' apps/web/src/domains/creator/StudioToolHint.optimization.test.tsx
          git diff --check
      - name: Commit final product patch and remove harness
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/studio-tooltip-pro-validate.yml
          git add \
            apps/web/src/domains/creator/StudioToolHint.tsx \
            apps/web/src/domains/creator/StudioToolHint.optimization.test.tsx
          git commit -m "fix(studio): preserve tooltip reading and close hook dependencies"
          git push origin HEAD:${{ github.ref_name }}
