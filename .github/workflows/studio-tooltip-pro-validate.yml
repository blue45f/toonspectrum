name: Studio tooltip pro validation

on:
  push:
    branches:
      - feat/studio-tooltip-pro-v2-20260909
    paths:
      - .github/workflows/studio-tooltip-pro-validate.yml

permissions:
  contents: write

concurrency:
  group: studio-tooltip-pro-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply final accessibility review patch
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");

          const shellPath = "apps/web/src/domains/creator/StudioToolHint.tsx";
          const shell = readFileSync(shellPath, "utf8");
          const shellPattern = /function suppressPassivePointerHints\(\) \{\s+interaction\.suppressHover\(\);\s+const activeHintId = coordinator\.getActiveHintId\(\);/u;
          const shellAfter = [
            "function suppressPassivePointerHints(event?: Event) {",
            "      const target = event?.target;",
            "      if (",
            "        target instanceof Element &&",
            "        target.closest('[data-studio-tool-hint=\"true\"]')",
            "      ) {",
            "        return;",
            "      }",
            "      interaction.suppressHover();",
            "      const activeHintId = coordinator.getActiveHintId();",
          ].join("\n");
          if (!shellPattern.test(shell)) {
            throw new Error("Could not locate the passive pointer suppression hook");
          }
          writeFileSync(shellPath, shell.replace(shellPattern, shellAfter));

          const testPath = "apps/web/src/domains/creator/StudioToolHint.optimization.test.tsx";
          const test = readFileSync(testPath, "utf8");
          const marker = '  it("dismisses transient help when the editor window loses attention", () => {';
          const internalScrollTest = [
            '  it("keeps hover help open while its own scroll region is being read", async () => {',
            "    renderPair();",
            '    const pen = screen.getByRole("button", { name: "펜" });',
            "",
            "    fireEvent.focus(pen);",
            "    await act(async () => {",
            "      await Promise.resolve();",
            "      await Promise.resolve();",
            "    });",
            "",
            '    const tooltip = screen.getByRole("tooltip");',
            "    const scrollRegion = tooltip.querySelector(",
            "      '[data-studio-tool-hint-scroll-region=\"true\"]'",
            "    );",
            "    expect(scrollRegion).not.toBeNull();",
            "",
            "    fireEvent.wheel(scrollRegion as Element);",
            "    fireEvent.scroll(scrollRegion as Element);",
            '    expect(screen.getByRole("tooltip")).toBe(tooltip);',
            "",
            "    fireEvent.wheel(document.body);",
            '    expect(screen.queryByRole("tooltip")).toBeNull();',
            "  });",
            "",
            "",
          ].join("\n");
          if (!test.includes(marker)) {
            throw new Error("Could not locate the tooltip attention regression test");
          }
          writeFileSync(testPath, test.replace(marker, internalScrollTest + marker));
          NODE
      - name: Format tooltip sources
        run: |
          pnpm exec prettier --write \
            apps/web/src/domains/creator/StudioToolHint.tsx \
            apps/web/src/domains/creator/components/StudioToolHintBubble.tsx \
            apps/web/src/domains/creator/studio-tool-hint-position.ts \
            apps/web/src/domains/creator/studio-tool-hint-position.test.ts \
            apps/web/src/domains/creator/studio-tool-hint-exposure.ts \
            apps/web/src/domains/creator/studio-tool-hint-exposure.test.ts \
            apps/web/src/domains/creator/StudioToolHint.optimization.test.tsx \
            apps/web/src/styles/globals.css \
            docs/studio-tooltip-ux-v2-2026-09-09.md
      - name: Lint tooltip sources
        run: |
          pnpm exec eslint --max-warnings=0 \
            apps/web/src/domains/creator/StudioToolHint.tsx \
            apps/web/src/domains/creator/components/StudioToolHintBubble.tsx \
            apps/web/src/domains/creator/studio-tool-hint-position.ts \
            apps/web/src/domains/creator/studio-tool-hint-position.test.ts \
            apps/web/src/domains/creator/studio-tool-hint-exposure.ts \
            apps/web/src/domains/creator/studio-tool-hint-exposure.test.ts \
            apps/web/src/domains/creator/StudioToolHint.optimization.test.tsx
      - name: Run tooltip regression portfolio
        run: |
          pnpm exec vitest run \
            apps/web/src/domains/creator/studio-tool-hint-position.test.ts \
            apps/web/src/domains/creator/studio-tool-hint-exposure.test.ts \
            apps/web/src/domains/creator/studio-tool-hint-coordinator.test.ts \
            apps/web/src/domains/creator/StudioToolHint.test.tsx \
            apps/web/src/domains/creator/StudioToolHint.interaction.test.tsx \
            apps/web/src/domains/creator/StudioToolHint.focus-return.test.tsx \
            apps/web/src/domains/creator/StudioToolHint.optimization.test.tsx \
            apps/web/src/domains/creator/studio-tool-hint.semantic-contract.test.ts
      - name: Verify patch integrity
        run: git diff --check
      - name: Commit formatter output and remove validation harness
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/studio-tooltip-pro-validate.yml
          git add \
            apps/web/src/domains/creator/StudioToolHint.tsx \
            apps/web/src/domains/creator/components/StudioToolHintBubble.tsx \
            apps/web/src/domains/creator/studio-tool-hint-position.ts \
            apps/web/src/domains/creator/studio-tool-hint-position.test.ts \
            apps/web/src/domains/creator/studio-tool-hint-exposure.ts \
            apps/web/src/domains/creator/studio-tool-hint-exposure.test.ts \
            apps/web/src/domains/creator/StudioToolHint.optimization.test.tsx \
            apps/web/src/styles/globals.css \
            docs/studio-tooltip-ux-v2-2026-09-09.md
          git commit -m "test(studio): validate and format tooltip UX v2"
          git push origin HEAD:${{ github.ref_name }}
