name: Apply Studio AI secure ID integration

on:
  push:
    branches: [fix/studio-final-ci-convergence-20260910]
    paths: [.github/workflows/apply-studio-ai-secure-id-integration.yml]

permissions:
  contents: write

concurrency:
  group: studio-ai-secure-id-integration-20260910
  cancel-in-progress: true

jobs:
  apply-validate-retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "1"
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=8192
      BRANCH_NAME: fix/studio-final-ci-convergence-20260910
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Replace every predictable AI comic identifier fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact anchor, found {count}\n--- anchor ---\n{old}")
              target.write_text(source.replace(old, new, 1), encoding="utf-8")

          route = "apps/web/src/domains/creator/studio-router/routes/StudioAiComicDirectorRoute.tsx"
          replace_once(
              route,
              'import { createStudioAiComicDirectorApiClient } from "../../ai/studio-ai-comic-director-api";\n',
              'import { createStudioAiComicDirectorApiClient } from "../../ai/studio-ai-comic-director-api";\nimport { createStudioAiComicDirectorId } from "../../ai/studio-ai-comic-director-id";\n',
          )
          replace_once(
              route,
              '''function uid(): string {
            return globalThis.crypto?.randomUUID?.()
              ?? `comic-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
          }''',
              '''function uid(): string {
            return createStudioAiComicDirectorId("comic");
          }''',
          )

          panel = "apps/web/src/domains/creator/ai/StudioAiComicDirectorPanel.tsx"
          replace_once(
              panel,
              '''import {
            createStudioAiComicDirectorApiClient,
            type StudioAiComicDirectorApiClient,
          } from "./studio-ai-comic-director-api";
          import {''',
              '''import {
            createStudioAiComicDirectorApiClient,
            type StudioAiComicDirectorApiClient,
          } from "./studio-ai-comic-director-api";
          import { createStudioAiComicDirectorId } from "./studio-ai-comic-director-id";
          import {''',
          )
          replace_once(
              panel,
              '''function uid(prefix: string): string {
            return globalThis.crypto?.randomUUID?.() ?? `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
          }''',
              '''function uid(prefix: string): string {
            return createStudioAiComicDirectorId(prefix);
          }''',
          )

          session = "apps/web/src/domains/creator/ai/studio-ai-comic-director-session.ts"
          replace_once(
              session,
              'import type { ScenarioPreviewItem } from "../studio-scenario-layout";\n',
              'import { createStudioAiComicDirectorId } from "./studio-ai-comic-director-id";\n\nimport type { ScenarioPreviewItem } from "../studio-scenario-layout";\n',
          )
          replace_once(
              session,
              '''function id(): string {
            return globalThis.crypto?.randomUUID?.()
              ?? `comic-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
          }''',
              '''function id(): string {
            return createStudioAiComicDirectorId("comic");
          }''',
          )

          boundary = "apps/web/src/domains/creator/ai/studio-ai-comic-director-id-boundary.test.ts"
          replace_once(
              boundary,
              '''const routeSource = readFileSync(
            new URL("../studio-router/routes/StudioAiComicDirectorRoute.tsx", import.meta.url),
            "utf8",
          );
          
          describe''',
              '''const routeSource = readFileSync(
            new URL("../studio-router/routes/StudioAiComicDirectorRoute.tsx", import.meta.url),
            "utf8",
          );
          const sessionSource = readFileSync(
            new URL("./studio-ai-comic-director-session.ts", import.meta.url),
            "utf8",
          );
          
          describe''',
          )
          replace_once(
              boundary,
              'for (const source of [panelSource, routeSource]) {',
              'for (const source of [panelSource, routeSource, sessionSource]) {',
          )

          for filename in (route, panel, session, boundary):
              source = Path(filename).read_text(encoding="utf-8")
              if "Math.random" in source:
                  raise SystemExit(f"predictable randomness remains in {filename}")
              if not source.endswith("\n"):
                  raise SystemExit(f"missing final newline in {filename}")
          PY

      - name: Install locked workspace
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Validate secure identifier boundary
        run: |
          pnpm exec eslint --max-warnings=0 \
            apps/web/src/domains/creator/ai/studio-ai-comic-director-id.ts \
            apps/web/src/domains/creator/ai/studio-ai-comic-director-id.test.ts \
            apps/web/src/domains/creator/ai/studio-ai-comic-director-id-boundary.test.ts \
            apps/web/src/domains/creator/ai/StudioAiComicDirectorPanel.tsx \
            apps/web/src/domains/creator/ai/studio-ai-comic-director-session.ts \
            apps/web/src/domains/creator/studio-router/routes/StudioAiComicDirectorRoute.tsx
          pnpm exec vitest run \
            apps/web/src/domains/creator/ai/studio-ai-comic-director-id.test.ts \
            apps/web/src/domains/creator/ai/studio-ai-comic-director-id-boundary.test.ts \
            apps/web/src/domains/creator/ai/studio-ai-comic-director-session.test.ts
          git diff --check

      - name: Commit validated product changes and retire materializer
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-studio-ai-secure-id-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/domains/creator/ai/StudioAiComicDirectorPanel.tsx \
            apps/web/src/domains/creator/ai/studio-ai-comic-director-id-boundary.test.ts \
            apps/web/src/domains/creator/ai/studio-ai-comic-director-session.ts \
            apps/web/src/domains/creator/studio-router/routes/StudioAiComicDirectorRoute.tsx
          git diff --cached --check
          git commit -m "fix(studio): route AI identifiers through Web Crypto"
          git fetch origin "${BRANCH_NAME}"
          test "$(git rev-parse "origin/${BRANCH_NAME}")" = "${GITHUB_SHA}" || {
            echo "Branch advanced while validating; refusing a stale push." >&2
            exit 1
          }
          git push origin "HEAD:refs/heads/${BRANCH_NAME}"
