name: Non-studio experience quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/app/App*.tsx'
      - 'apps/web/src/app/browser-compat-dismissal*'
      - 'apps/web/src/domains/account/LibraryBackupImport*'
      - 'apps/web/src/domains/account/library-backup*'
      - 'apps/web/src/domains/account/SettingsPage.tsx'
      - 'apps/web/src/app/routes/route-titles.ts'
      - 'apps/web/src/app/routes/app-route-title-ownership*'
      - 'apps/web/src/domains/legal/Site*'
      - 'apps/web/src/domains/legal/site-directory*'
      - 'apps/web/src/domains/legal/TechnologyPage.tsx'
      - 'apps/web/src/domains/legal/technology/**'
      - 'apps/web/src/domains/catalog/SearchPage*'
      - 'apps/web/src/domains/learn/**'
      - 'apps/web/src/domains/market/**'
      - 'apps/web/src/domains/catalog/search-page-layout.css'
      - 'tools/package-non-studio-preview.py'
      - 'apps/web/src/domains/marketing/creator-prism.css'
      - 'apps/web/src/domains/marketing/CreatorHomeExperience.tsx'
      - 'apps/web/src/domains/creator-resources/CreatorHomePage.tsx'
      - 'apps/web/src/domains/creator/production-hub/**'
      - 'apps/web/src/domains/catalog/AuthorPage.tsx'
      - 'apps/web/src/domains/community/PencafePage.tsx'
      - 'apps/web/src/shared/components/public-site-*'
      - 'apps/web/src/shared/components/site-experience/**'
      - 'apps/web/src/domains/catalog/CalendarPage.tsx'
      - 'e2e/atelier-public-polish.spec.ts'
      - 'apps/web/src/shared/components/site-public-routes*'
      - 'apps/web/src/shared/lib/decode-path-segment*'
      - 'e2e/non-studio-experience.spec.ts'
      - 'e2e/non-studio-controls.spec.ts'
      - 'e2e/non-studio-search-layout.spec.ts'
      - 'e2e/creator-flagship.spec.ts'
      - 'e2e/engineering-story.spec.ts'
      - 'e2e/production-risk-intelligence.spec.ts'
      - 'e2e/helpers/capture-page-evidence.ts'
      - 'e2e/a11y-smoke.spec.ts'
      - 'playwright.a11y.config.ts'
      - 'playwright.non-studio.config.ts'
      - '.github/workflows/non-studio-experience-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: non-studio-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  non-studio-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      VITE_CATALOG_SOURCE: static
      PLAYWRIGHT_CHANNEL: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Restricted storage, route labels and connected navigation regressions
        run: >-
          pnpm exec vitest run
          apps/web/src/shared/components/site-experience
          apps/web/src/app/browser-compat-dismissal.test.ts
          apps/web/src/domains/account/library-backup.test.ts
          apps/web/src/domains/account/LibraryBackupImport.test.tsx
          apps/web/src/shared/lib/decode-path-segment.test.ts
          apps/web/src/shared/components/public-site-destinations.test.ts
          apps/web/src/shared/components/public-site-journey.test.tsx
          apps/web/src/shared/components/site-public-routes.test.ts
          apps/web/src/app/routes/app-route-title-ownership.test.ts
          apps/web/src/domains/marketing/CreatorReferenceSearch.test.tsx
          apps/web/src/domains/creator/studio-router/studio-route-manifest.home-boundary.test.ts
          apps/web/src/domains/catalog/SearchPage.navigation.test.tsx
          apps/web/src/domains/legal/site-directory-search.test.ts
          apps/web/src/domains/legal/SiteDirectorySearch.test.tsx
          apps/web/src/domains/legal/SitemapPage.test.ts
          apps/web/src/domains/legal/technology/engineering-story-content.test.ts
          apps/web/src/domains/legal/technology/engineering-field-notes-content.test.ts
          apps/web/src/domains/legal/technology/EngineeringStoryPage.test.tsx
      - name: Production management prediction contracts
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/production-hub/production-risk-intelligence.test.ts
          apps/web/src/domains/creator/production-hub/production-risk-scenarios.test.ts
          apps/web/src/domains/creator/production-hub/production-management-overview.test.ts
          apps/web/src/domains/creator/production-hub/ProductionRecoveryScenarioPanel.test.tsx
          apps/web/src/domains/creator/production-hub/ProductionManagementWorkspace.test.tsx
          apps/web/src/domains/creator/production-hub/ProductionScheduleWorkspace.test.tsx
      - name: Production bundle
        run: pnpm run build:bundle
      - name: Package bounded offline preview for interactive inspection
        run: |
          git rev-parse HEAD > dist/audit-source-sha.txt
          python tools/package-non-studio-preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: non-studio-web-preview
          path: /tmp/non-studio-web-preview.tar.gz
          retention-days: 3
      - run: pnpm exec playwright install --with-deps chromium
      - name: Axe serious and critical accessibility smoke
        run: pnpm run test:a11y
      - name: Production-bundle non-studio navigation and resilience
        run: pnpm exec playwright test --config playwright.non-studio.config.ts
      - name: Preserve route report and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: non-studio-experience-quality
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
