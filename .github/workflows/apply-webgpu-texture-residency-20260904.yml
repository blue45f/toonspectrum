name: Apply WebGPU texture residency patch

on:
  push:
    branches:
      - codex/webgpu-texture-residency-20260904

permissions:
  contents: write

concurrency:
  group: apply-webgpu-texture-residency-20260904
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/webgpu-texture-residency-20260904
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source and regression-test patch
        run: node scripts/apply-webgpu-texture-residency-20260904.mjs
      - name: Validate and commit patched sources
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(brush): bound WebGPU texture residency"
          git push origin HEAD:codex/webgpu-texture-residency-20260904
