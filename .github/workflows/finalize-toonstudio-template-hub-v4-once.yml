name: Finalize ToonStudio PR 1326 once

on:
  workflow_dispatch:
  push:
    branches:
      - feat/toonstudio-template-hub-20260912
    paths:
      - .github/workflows/finalize-toonstudio-template-hub-v4-once.yml
      - scripts/maintenance/finalize-toonstudio-pr-1326.py

permissions:
  contents: write

concurrency:
  group: finalize-toonstudio-pr-1326
  cancel-in-progress: true

jobs:
  integrate-validate-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CI: "true"
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=8192
      FEATURE_BRANCH: feat/toonstudio-template-hub-20260912
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-template-hub-20260912
          fetch-depth: 0

      - name: Merge current main and preserve the project creator
        shell: bash
        run: |
          set -euo pipefail
          page="apps/web/src/domains/creator/studio-shell/StudioNewIntegratedPage.tsx"
          test_page="apps/web/src/domains/creator/studio-shell/StudioNewIntegratedPage.test.tsx"
          expected="$page"

          cp "$page" "$RUNNER_TEMP/StudioProjectCreatePage.tsx"
          cp "$test_page" "$RUNNER_TEMP/StudioProjectCreatePage.test.tsx"

          git config user.name "toonstudio-integration-bot"
          git config user.email "toonstudio-integration-bot@users.noreply.github.com"
          git fetch --no-tags origin main:refs/remotes/origin/main
          echo "MERGED_MAIN_SHA=$(git rev-parse origin/main)" >> "$GITHUB_ENV"

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [[ "$merge_status" -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [[ "${#conflicts[@]}" -ne 1 || "${conflicts[0]}" != "$expected" ]]; then
              printf 'Unexpected merge conflicts:\n' >&2
              printf ' - %s\n' "${conflicts[@]}" >&2
              git merge --abort || true
              exit 1
            fi
            git checkout --theirs -- "$expected"
            git add "$expected"
          fi

          git show "origin/main:$page" > "$page"
          cp "$RUNNER_TEMP/StudioProjectCreatePage.tsx" \
            apps/web/src/domains/creator/studio-shell/StudioProjectCreatePage.tsx
          cp "$RUNNER_TEMP/StudioProjectCreatePage.test.tsx" \
            apps/web/src/domains/creator/studio-shell/StudioProjectCreatePage.test.tsx
          rm -f "$test_page"

          python scripts/maintenance/finalize-toonstudio-pr-1326.py

          python - <<'PY'
          from pathlib import Path
          import re

          document_store = Path(
              "apps/web/src/domains/creator/studio-project-document-store.ts"
          )
          source = document_store.read_text()
          start = source.index("const KIND_WORKSPACES")
          end = source.index("\n\nconst PROJECT_DEFAULT_DOCUMENT", start)
          block = '''const workspaceList = (
            ...workspaces: StudioDocumentWorkspace[]
          ): readonly StudioDocumentWorkspace[] => Object.freeze(workspaces);

          const KIND_WORKSPACES: Readonly<Record<StudioDocumentKind, readonly StudioDocumentWorkspace[]>> = Object.freeze({
            webtoon: workspaceList("comic", "draw", "image", "localization", "review"),
            illustration: workspaceList("draw", "image", "review"),
            image: workspaceList("image", "draw", "review"),
            design: workspaceList("design", "image", "slides", "review"),
            slides: workspaceList("slides", "design", "review"),
            storyboard: workspaceList("storyboard", "draw", "motion", "review"),
            whiteboard: workspaceList("whiteboard", "design", "review"),
            "three-d": workspaceList("3d", "image", "review"),
            animation: workspaceList("animation", "motion", "audio", "review"),
            motion: workspaceList("motion", "audio", "review"),
            audio: workspaceList("audio", "motion", "review"),
            localization: workspaceList("localization", "review"),
          });'''
          block = "\n".join(line[10:] if line.startswith("          ") else line for line in block.splitlines())
          source = source[:start] + block + source[end:]
          source = source.replace(
              "  const allowedWorkspaces: readonly StudioDocumentWorkspace[] = KIND_WORKSPACES[input.kind];",
              "  const allowedWorkspaces = KIND_WORKSPACES[input.kind];",
          )
          document_store.write_text(source)

          replacement = (
              'buttonClass({ variant: "outline", size: "sm", '
              'className: "border-danger/50 text-danger hover:border-danger '
              'hover:bg-danger-soft/25 hover:text-danger" })'
          )
          targets = (
              Path("apps/web/src/domains/creator/studio-shell/StudioProjectDocumentsPanel.tsx"),
              Path("apps/web/src/domains/creator/studio-shell/StudioProjectLibraryPage.tsx"),
          )
          total = 0
          pattern = re.compile(
              r'buttonClass\(\{\s*variant:\s*"danger",\s*size:\s*"sm"\s*\}\)'
          )
          for path in targets:
              text = path.read_text()
              text, count = pattern.subn(replacement, text)
              total += count
              if 'variant: "danger"' in text:
                  raise SystemExit(f"{path}: unsupported danger variant remains")
              path.write_text(text)
          if total != 3:
              raise SystemExit(f"expected three danger replacements, found {total}")
          PY

          grep -q 'const workspaceList' \
            apps/web/src/domains/creator/studio-project-document-store.ts
          if grep -R 'variant: "danger"' \
            apps/web/src/domains/creator/studio-shell/StudioProjectDocumentsPanel.tsx \
            apps/web/src/domains/creator/studio-shell/StudioProjectLibraryPage.tsx; then
            echo "Unsupported danger variant remains" >&2
            exit 1
          fi

          rm -f \
            apps/web/src/domains/creator/studio-project-template-catalog.ts \
            apps/web/src/domains/creator/studio-project-template-catalog.test.ts \
            apps/web/src/domains/creator/studio-shell/StudioTemplateHubPage.tsx \
            apps/web/src/domains/creator/studio-shell/StudioTemplateHubPage.test.tsx \
            .github/workflows/apply-toonstudio-project-lifecycle.yml \
            .github/workflows/apply-toonstudio-template-hub.yml \
            .github/workflows/fix-toonstudio-template-hub-tests-once.yml \
            .github/workflows/fix-toonstudio-template-hub-tests-v2-once.yml \
            .github/workflows/fix-toonstudio-template-hub-tests-v3-once.yml \
            .github/workflows/verify-toonstudio-project-lifecycle.yml

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize and lint product sources
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec eslint --fix \
            apps/web/src/app/routes/groups/creator-route-pages.ts \
            apps/web/src/app/routes/groups/creator.routes.tsx \
            apps/web/src/domains/creator/studio-route-registry.ts \
            apps/web/src/domains/creator/studio-project-creation.ts \
            apps/web/src/domains/creator/studio-project-creation.test.ts \
            apps/web/src/domains/creator/studio-project-document-store.ts \
            apps/web/src/domains/creator/studio-project-document-store.test.ts \
            apps/web/src/domains/creator/studio-project-library-store.ts \
            apps/web/src/domains/creator/studio-project-library-store.test.ts \
            apps/web/src/domains/creator/studio-shell/StudioNewIntegratedPage.tsx \
            apps/web/src/domains/creator/studio-shell/StudioProjectCreatePage.tsx \
            apps/web/src/domains/creator/studio-shell/StudioProjectCreatePage.test.tsx \
            apps/web/src/domains/creator/studio-shell/StudioProjectDocumentsPanel.tsx \
            apps/web/src/domains/creator/studio-shell/StudioProjectDocumentsPanel.test.tsx \
            apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.tsx \
            apps/web/src/domains/creator/studio-shell/StudioProjectLibraryPage.tsx \
            apps/web/src/domains/creator/studio-shell/StudioProjectLibraryPage.test.tsx \
            apps/web/src/domains/creator/studio-shell/useStudioProjectDocuments.ts \
            apps/web/src/domains/creator/studio-shell/useStudioProjectLibrary.ts
          pnpm exec eslint --max-warnings=0 \
            apps/web/src/app/routes/groups/creator-route-pages.ts \
            apps/web/src/app/routes/groups/creator.routes.tsx \
            apps/web/src/domains/creator/studio-route-registry.ts \
            apps/web/src/domains/creator/studio-project-creation.ts \
            apps/web/src/domains/creator/studio-project-document-store.ts \
            apps/web/src/domains/creator/studio-project-library-store.ts \
            apps/web/src/domains/creator/studio-shell/StudioNewIntegratedPage.tsx \
            apps/web/src/domains/creator/studio-shell/StudioProjectCreatePage.tsx \
            apps/web/src/domains/creator/studio-shell/StudioProjectDocumentsPanel.tsx \
            apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.tsx \
            apps/web/src/domains/creator/studio-shell/StudioProjectLibraryPage.tsx \
            apps/web/src/domains/creator/studio-shell/useStudioProjectDocuments.ts \
            apps/web/src/domains/creator/studio-shell/useStudioProjectLibrary.ts
          git diff --check

      - name: Typecheck
        run: pnpm exec tsc -p tsconfig.json --noEmit --pretty false

      - name: Run lifecycle and route tests
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/studio-project-creation.test.ts
          apps/web/src/domains/creator/studio-project-document-store.test.ts
          apps/web/src/domains/creator/studio-project-library-store.test.ts
          apps/web/src/domains/creator/studio-shell/StudioProjectCreatePage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectDocumentsPanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectLibraryPage.test.tsx
          apps/web/src/app/routes/groups/app-routes.test.tsx
          apps/web/src/domains/creator/studio-route-registry.test.ts
          --pool=forks --maxWorkers=2

      - name: Verify ToonStudio contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-toonstudio-feature-reachability.mjs
          if pnpm run | grep -q 'verify:studio-session-complete'; then
            pnpm run verify:studio-session-complete
          fi

      - name: Build production bundle
        run: pnpm run build:bundle

      - name: Commit clean integrated PR branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [[ "$(git rev-parse origin/main)" != "$MERGED_MAIN_SHA" ]]; then
            echo "main advanced during validation; rerun the finalizer" >&2
            exit 1
          fi

          rm -f \
            .github/workflows/finalize-toonstudio-template-hub-v4-once.yml \
            scripts/maintenance/finalize-toonstudio-pr-1326.py
          git add -A
          git diff --cached --check
          git commit -m "feat(studio): add project and document lifecycle"
          git push origin HEAD:${FEATURE_BRANCH}
