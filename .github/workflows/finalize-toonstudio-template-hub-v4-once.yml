name: Finalize ToonStudio project lifecycle on current main once

on:
  workflow_dispatch:
  push:
    branches:
      - feat/toonstudio-template-hub-20260912
    paths:
      - .github/workflows/finalize-toonstudio-template-hub-v4-once.yml

permissions:
  contents: write

concurrency:
  group: finalize-toonstudio-pr-1326
  cancel-in-progress: false

jobs:
  integrate-validate-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CI: "true"
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=8192
      FEATURE_BRANCH: feat/toonstudio-template-hub-20260912
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-template-hub-20260912
          fetch-depth: 0

      - name: Preserve project creation implementation
        shell: bash
        run: |
          set -euo pipefail
          cp apps/web/src/domains/creator/studio-shell/StudioNewIntegratedPage.tsx "$RUNNER_TEMP/StudioProjectCreatePage.tsx"
          cp apps/web/src/domains/creator/studio-shell/StudioNewIntegratedPage.test.tsx "$RUNNER_TEMP/StudioProjectCreatePage.test.tsx"

      - name: Merge current protected main and resolve the intentional page conflict
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "toonstudio-integration-bot"
          git config user.email "toonstudio-integration-bot@users.noreply.github.com"
          git fetch --no-tags origin main:refs/remotes/origin/main
          merged_main_sha="$(git rev-parse origin/main)"
          echo "MERGED_MAIN_SHA=$merged_main_sha" >> "$GITHUB_ENV"

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [[ "$merge_status" -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            expected="apps/web/src/domains/creator/studio-shell/StudioNewIntegratedPage.tsx"
            if [[ "${#conflicts[@]}" -ne 1 || "${conflicts[0]}" != "$expected" ]]; then
              printf 'Unexpected merge conflicts:\n' >&2
              printf ' - %s\n' "${conflicts[@]}" >&2
              git merge --abort || true
              exit 1
            fi
            git checkout --theirs -- "$expected"
            git add "$expected"
          fi

          # The current main wrapper owns template handoff. The PR page becomes the
          # actual persistent project creation surface invoked by that wrapper.
          git show "origin/main:apps/web/src/domains/creator/studio-shell/StudioNewIntegratedPage.tsx" \
            > apps/web/src/domains/creator/studio-shell/StudioNewIntegratedPage.tsx
          cp "$RUNNER_TEMP/StudioProjectCreatePage.tsx" \
            apps/web/src/domains/creator/studio-shell/StudioProjectCreatePage.tsx
          cp "$RUNNER_TEMP/StudioProjectCreatePage.test.tsx" \
            apps/web/src/domains/creator/studio-shell/StudioProjectCreatePage.test.tsx
          rm -f apps/web/src/domains/creator/studio-shell/StudioNewIntegratedPage.test.tsx

      - name: Compose canonical routes and project surfaces
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          wrapper = "apps/web/src/domains/creator/studio-shell/StudioNewIntegratedPage.tsx"
          replace_once(
              wrapper,
              'import { StudioNewPage } from "./StudioFrontDoorPages";',
              'import { StudioNewIntegratedPage as StudioProjectCreatePage } from "./StudioProjectCreatePage";',
          )
          replace_once(wrapper, "<StudioNewPage />", "<StudioProjectCreatePage />")

          create_test = Path(
              "apps/web/src/domains/creator/studio-shell/StudioProjectCreatePage.test.tsx"
          )
          test_source = create_test.read_text()
          test_source = test_source.replace(
              'import { StudioNewIntegratedPage } from "./StudioNewIntegratedPage";',
              'import { StudioNewIntegratedPage as StudioProjectCreatePage } from "./StudioProjectCreatePage";',
          )
          test_source = test_source.replace(
              'describe("StudioNewIntegratedPage"',
              'describe("StudioProjectCreatePage"',
          )
          test_source = test_source.replace(
              "<StudioNewIntegratedPage />",
              "<StudioProjectCreatePage />",
          )
          create_test.write_text(test_source)

          route_pages = "apps/web/src/app/routes/groups/creator-route-pages.ts"
          replace_once(
              route_pages,
              '''export const StudioHomePage = lazyRetry(
  () => import("@/domains/creator/studio-shell/StudioFrontDoorPages").then((module) => ({
    default: module.StudioHomePage,
  })),
  "StudioHomePage",
);''',
              '''export const StudioHomePage = lazyRetry(
  () => import("@/domains/creator/studio-shell/StudioProjectLibraryPage").then((module) => ({
    default: module.StudioProjectLibraryPage,
  })),
  "StudioProjectLibraryPage",
);''',
          )
          replace_once(
              route_pages,
              '''export const StudioNewPage = lazyRetry(
  () => import("@/domains/creator/studio-shell/StudioFrontDoorPages").then((module) => ({
    default: module.StudioNewPage,
  })),
  "StudioNewPage",
);''',
              '''export const StudioNewPage = lazyRetry(
  () => import("@/domains/creator/studio-shell/StudioNewIntegratedPage").then((module) => ({
    default: module.StudioNewIntegratedPage,
  })),
  "StudioNewIntegratedPage",
);''',
          )
          # main already owns one canonical searchable template page. Do not add the
          # PR's duplicate template-hub component to the production route.
          template_page = '''export const StudioTemplatesPage = lazyRetry(
  () => import("@/domains/creator/studio-shell/StudioTemplatesPage").then((module) => ({
    default: module.StudioTemplatesPage,
  })),
  "StudioTemplatesPage",
);'''
          route_text = Path(route_pages).read_text()
          if template_page not in route_text:
              marker = '''export const StudioNewPage = lazyRetry(
  () => import("@/domains/creator/studio-shell/StudioNewIntegratedPage").then((module) => ({
    default: module.StudioNewIntegratedPage,
  })),
  "StudioNewIntegratedPage",
);'''
              route_text = route_text.replace(marker, marker + "\n\n" + template_page, 1)
              Path(route_pages).write_text(route_text)

          routes = "apps/web/src/app/routes/groups/creator.routes.tsx"
          replace_once(
              routes,
              '''  StudioProjectShellPage,
  StudioPromoPage,''',
              '''  StudioProjectShellPage,
  StudioPromoPage,
  StudioTemplatesPage,''',
          )
          replace_once(
              routes,
              '''  { id: "creator-studio-import", path: studioRoutePath("import"), element: <StudioImportPage /> },
  { id: "creator-studio-assets", path: studioRoutePath("assets"), element: <StudioAssetHubPage /> },''',
              '''  { id: "creator-studio-import", path: studioRoutePath("import"), element: <StudioImportPage /> },
  { id: "creator-studio-recovery", path: studioRoutePath("recovery"), element: <Navigate to="/studio?view=archived" replace /> },
  { id: "creator-studio-trash", path: studioRoutePath("trash"), element: <Navigate to="/studio?view=trash" replace /> },
  { id: "creator-studio-assets", path: studioRoutePath("assets"), element: <StudioAssetHubPage /> },''',
          )
          replace_once(
              routes,
              '''  { id: "creator-studio-templates", path: studioRoutePath("templates"), element: <Navigate to="/market?view=templates" replace /> },''',
              '''  { id: "creator-studio-templates", path: studioRoutePath("templates"), element: <StudioTemplatesPage /> },''',
          )

          registry = "apps/web/src/domains/creator/studio-route-registry.ts"
          replace_once(
              registry,
              '''  "templates",
  "assets",''',
              '''  "templates",
  "assets",
  "recovery",
  "trash",''',
          )
          replace_once(
              registry,
              '''  route("assets", "/studio/assets", "asset", "none", "에셋", "Assets", ["/market/library"]),''',
              '''  route("assets", "/studio/assets", "asset", "none", "에셋", "Assets", ["/market/library"]),
  route("recovery", "/studio/recovery", "studio", "none", "복구", "Recovery"),
  route("trash", "/studio/trash", "studio", "none", "휴지통", "Trash"),''',
          )

          integrated = "apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.tsx"
          replace_once(
              integrated,
              'import { StudioProjectDeliveryPanel } from "./StudioProjectDeliveryPanel";',
              '''import { StudioProjectDeliveryPanel } from "./StudioProjectDeliveryPanel";
import { StudioProjectDocumentsPanel } from "./StudioProjectDocumentsPanel";''',
          )
          replace_once(
              integrated,
              '''      <StudioProjectFeatureSuitePanel
        projectId={projectId}
        section={section}
        view={view}
        locale={locale}
      />
      {section === "story" && view === "localization" ? (''',
              '''      <StudioProjectFeatureSuitePanel
        projectId={projectId}
        section={section}
        view={view}
        locale={locale}
      />
      {section === "production" && view === "documents" ? (
        <StudioProjectDocumentsPanel projectId={projectId} locale={locale} />
      ) : null}
      {section === "story" && view === "localization" ? (''',
          )
          PY

      - name: Remove duplicate template implementation and temporary branch workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            apps/web/src/domains/creator/studio-project-template-catalog.ts \
            apps/web/src/domains/creator/studio-project-template-catalog.test.ts \
            apps/web/src/domains/creator/studio-shell/StudioTemplateHubPage.tsx \
            apps/web/src/domains/creator/studio-shell/StudioTemplateHubPage.test.tsx \
            .github/workflows/apply-toonstudio-project-lifecycle.yml \
            .github/workflows/apply-toonstudio-template-hub.yml \
            .github/workflows/fix-toonstudio-template-hub-tests-once.yml \
            .github/workflows/fix-toonstudio-template-hub-tests-v2-once.yml \
            .github/workflows/fix-toonstudio-template-hub-tests-v3-once.yml \
            .github/workflows/verify-toonstudio-project-lifecycle.yml

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize and lint product sources
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec eslint --fix \
            apps/web/src/app/routes/groups/creator-route-pages.ts \
            apps/web/src/app/routes/groups/creator.routes.tsx \
            apps/web/src/domains/creator/studio-route-registry.ts \
            apps/web/src/domains/creator/studio-project-creation.ts \
            apps/web/src/domains/creator/studio-project-creation.test.ts \
            apps/web/src/domains/creator/studio-project-document-store.ts \
            apps/web/src/domains/creator/studio-project-document-store.test.ts \
            apps/web/src/domains/creator/studio-project-library-store.ts \
            apps/web/src/domains/creator/studio-project-library-store.test.ts \
            apps/web/src/domains/creator/studio-shell/StudioNewIntegratedPage.tsx \
            apps/web/src/domains/creator/studio-shell/StudioProjectCreatePage.tsx \
            apps/web/src/domains/creator/studio-shell/StudioProjectCreatePage.test.tsx \
            apps/web/src/domains/creator/studio-shell/StudioProjectDocumentsPanel.tsx \
            apps/web/src/domains/creator/studio-shell/StudioProjectDocumentsPanel.test.tsx \
            apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.tsx \
            apps/web/src/domains/creator/studio-shell/StudioProjectLibraryPage.tsx \
            apps/web/src/domains/creator/studio-shell/StudioProjectLibraryPage.test.tsx \
            apps/web/src/domains/creator/studio-shell/useStudioProjectDocuments.ts \
            apps/web/src/domains/creator/studio-shell/useStudioProjectLibrary.ts
          pnpm exec eslint --max-warnings=0 \
            apps/web/src/app/routes/groups/creator-route-pages.ts \
            apps/web/src/app/routes/groups/creator.routes.tsx \
            apps/web/src/domains/creator/studio-route-registry.ts \
            apps/web/src/domains/creator/studio-project-creation.ts \
            apps/web/src/domains/creator/studio-project-document-store.ts \
            apps/web/src/domains/creator/studio-project-library-store.ts \
            apps/web/src/domains/creator/studio-shell/StudioNewIntegratedPage.tsx \
            apps/web/src/domains/creator/studio-shell/StudioProjectCreatePage.tsx \
            apps/web/src/domains/creator/studio-shell/StudioProjectDocumentsPanel.tsx \
            apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.tsx \
            apps/web/src/domains/creator/studio-shell/StudioProjectLibraryPage.tsx \
            apps/web/src/domains/creator/studio-shell/useStudioProjectDocuments.ts \
            apps/web/src/domains/creator/studio-shell/useStudioProjectLibrary.ts
          git diff --check

      - name: Typecheck
        run: pnpm exec tsc -p tsconfig.json --noEmit --pretty false

      - name: Run project lifecycle and route tests
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/studio-project-creation.test.ts
          apps/web/src/domains/creator/studio-project-document-store.test.ts
          apps/web/src/domains/creator/studio-project-library-store.test.ts
          apps/web/src/domains/creator/studio-shell/StudioProjectCreatePage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectDocumentsPanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectLibraryPage.test.tsx
          apps/web/src/app/routes/groups/app-routes.test.tsx
          apps/web/src/domains/creator/studio-route-registry.test.ts
          --pool=forks --maxWorkers=2

      - name: Verify ToonStudio contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-toonstudio-feature-reachability.mjs
          if pnpm run | grep -q 'verify:studio-session-complete'; then
            pnpm run verify:studio-session-complete
          fi

      - name: Build production bundle
        run: pnpm run build:bundle

      - name: Commit clean integrated PR branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          current_main_sha="$(git rev-parse origin/main)"
          if [[ "$current_main_sha" != "$MERGED_MAIN_SHA" ]]; then
            echo "main advanced during validation: $MERGED_MAIN_SHA -> $current_main_sha" >&2
            exit 1
          fi

          rm -f .github/workflows/finalize-toonstudio-template-hub-v4-once.yml
          git add -A
          git diff --cached --check
          git commit -m "feat(studio): add project and document lifecycle"
          git push origin HEAD:${FEATURE_BRANCH}
