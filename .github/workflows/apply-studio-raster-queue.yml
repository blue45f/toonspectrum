name: Verify and apply raster queue recovery
on:
  push:
    branches: [fix/studio-raster-queue-recovery-20260906]
    paths: ['scripts/.studio-raster-queue.patch']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require the regression to fail on the old clients
        run: |
          mkdir -p /tmp/raster-queue-evidence
          if pnpm exec vitest run src/domains/creator/studio-raster-worker-queue-stability.test.ts > /tmp/raster-queue-evidence/before.log 2>&1; then
            echo 'Regression did not fail before the fix'; exit 1
          fi
      - name: Apply the exact reviewed patch and check old and new behavior
        run: |
          set -o pipefail
          test "$(git hash-object scripts/.studio-raster-queue.patch)" = ac647ae2a5009b483133823d8c3fde5f604c3df7
          git apply --check scripts/.studio-raster-queue.patch
          git apply --index scripts/.studio-raster-queue.patch
          pnpm exec vitest run src/domains/creator/studio-smudge-worker-client.test.ts src/domains/creator/studio-retouch-worker-client.test.ts src/domains/creator/studio-raster-worker-queue-stability.test.ts 2>&1 | tee /tmp/raster-queue-evidence/after.log
          pnpm exec eslint src/domains/creator/studio-abortable-serial-queue.ts src/domains/creator/studio-smudge-worker-client.ts src/domains/creator/studio-retouch-worker-client.ts src/domains/creator/studio-raster-worker-queue-stability.test.ts
      - name: Commit verified changes to the feature branch only
        run: |
          git rm scripts/.studio-raster-queue.patch .github/workflows/apply-studio-raster-queue.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "fix(studio): cancel queued raster strokes immediately and recover message errors"
          git push origin HEAD:refs/heads/fix/studio-raster-queue-recovery-20260906
          git rev-parse HEAD > /tmp/raster-queue-evidence/commit.txt
      - name: Preserve before and after regression evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: raster-queue-regression-evidence
          path: /tmp/raster-queue-evidence
          retention-days: 7
