name: Fix ToonStudio view audit once

on:
  push:
    branches:
      - feat/toonstudio-session-complete-20260911-1221
    paths:
      - .github/workflows/fix-toonstudio-view-audit.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-session-complete-20260911-1221
          fetch-depth: 0

      - name: Replace substring matcher with word-aware matcher
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          paths = (
              Path("apps/web/src/domains/creator/studio-project-view-destinations.ts"),
              Path("apps/web/src/domains/creator/studio-project-view-destinations.test.ts"),
          )
          old = r"/SQLite|OPFS|revision|리비전|lease|CRDT/u"
          new = r"/SQLite|OPFS|CRDT|리비전|\brevision\b|\blease\b/u"
          for path in paths:
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Unexpected matcher count in {path}: {text.count(old)}")
              path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/fix-toonstudio-view-audit.yml
          git diff --check

      - name: Commit
        shell: bash
        run: |
          git config user.name "toonstudio-integration-bot"
          git config user.email "toonstudio-integration-bot@users.noreply.github.com"
          git add -A
          git commit -m "fix(studio): avoid release audit false positive"
          git push origin HEAD:feat/toonstudio-session-complete-20260911-1221
