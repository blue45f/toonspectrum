name: Unblock Scene3D visual audit once

on:
  push:
    branches: [audit/scene3d-assets-20260910]
    paths: [.github/workflows/unblock-scene3d-visual-audit-once.yml]

permissions:
  contents: write

jobs:
  unblock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/scene3d-assets-20260910
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          sed -i 's/runs-on: ubuntu-24.04-arm/runs-on: ubuntu-latest/' .github/workflows/scene3d-visual-asset-audit.yml
          git config user.name toonstudio-3d-ci
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/unblock-scene3d-visual-audit-once.yml
          git add .github/workflows/scene3d-visual-asset-audit.yml
          git commit -m 'ci: move Scene3D visual audit to standard runner'
          git push origin HEAD:audit/scene3d-assets-20260910
