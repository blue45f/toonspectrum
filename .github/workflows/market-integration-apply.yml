name: Apply reviewed market integration
on:
  push:
    branches: [fix/market-production-20260913]
    paths: [.github/workflows/market-integration-apply.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'blue45f/toonspectrum' && github.ref == 'refs/heads/fix/market-production-20260913'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/market-production-20260913
          fetch-depth: 0
      - name: Apply exact reviewed source replacements on this feature branch only
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 scripts/apply-market-production-integration.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/domains/creator apps/web/src/domains/market/components
          git rm .github/workflows/market-workspace-snapshot.yml .github/workflows/market-integration-apply.yml scripts/apply-market-production-integration.py
          git commit -m 'feat(market): connect verified CC0 raster and model handoffs'
          git push origin HEAD:refs/heads/fix/market-production-20260913
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Apply canonical lint to this change set
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          mkdir -p artifacts/market-cc0
          python3 - <<'PY'
          import subprocess
          files = subprocess.check_output(['git','diff','--name-only','0e3ea77161ea9bcf0a256e3fd24df484a5845bee','HEAD'],text=True).splitlines()
          sources = [p for p in files if p.endswith(('.ts','.tsx','.mts','.mjs'))]
          subprocess.run(['pnpm','exec','eslint','--fix','--max-warnings=0','--no-warn-ignored',*sources],check=True)
          PY
          if ! git diff --quiet; then
            git add apps/web/src apps/web/tools scripts/seed/market-cc0-release-manifests.mts scripts/verify-market-cc0*
            git commit -m 'style(market): apply canonical source checks'
            git push origin HEAD:refs/heads/fix/market-production-20260913
          fi
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run regression, type, shipped-byte and actual-browser checks
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          mkdir -p artifacts/market-cc0
          git rev-parse HEAD | tee artifacts/market-cc0/verified-head.txt
          node scripts/verify-market-cc0.mjs 2>&1 | tee artifacts/market-cc0/verification.log
      - name: Preserve diagnostic changes without claiming a pass
        if: always()
        run: |
          mkdir -p artifacts/market-cc0
          git diff --binary > artifacts/market-cc0/uncommitted.patch
          git rev-parse HEAD > artifacts/market-cc0/current-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-integration-${{ github.run_id }}
          path: artifacts/market-cc0/
          retention-days: 3
