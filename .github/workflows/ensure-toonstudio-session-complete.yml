name: Ensure ToonStudio session complete

on:
  push:
    branches:
      - feat/toonstudio-session-complete-20260911-1221
    paths:
      - .github/workflows/ensure-toonstudio-session-complete.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: retry-toonstudio-session-fixes
  cancel-in-progress: false

jobs:
  ensure-complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout latest completion branch
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-session-complete-20260911-1221
          fetch-depth: 0

      - name: Synchronize latest PR work
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/toonstudio-final-ia-20260911
          if ! git merge-base --is-ancestor origin/feat/toonstudio-final-ia-20260911 HEAD; then
            git merge --no-edit origin/feat/toonstudio-final-ia-20260911
          fi

      - name: Detect prior verified result
        id: verified
        run: |
          if [[ -f docs/rewrite/toonstudio-session-final-verification.md ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure deterministic source fixes
        if: steps.verified.outputs.value != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re
          import textwrap

          sentinel = Path("apps/web/src/domains/creator/studio-archive-manifest.test.ts")
          if "Object.freeze<StudioArchiveManifest>" not in sentinel.read_text():
              source = Path(".github/workflows/apply-toonstudio-session-fixes.yml")
              if not source.exists():
                  raise SystemExit("Required migration source is missing")
              workflow = source.read_text()
              block = re.search(
                  r"- name: Apply deterministic source fixes\n.*?run: \|\n(?P<body>.*?)\n\s+- name: Verify source formatting",
                  workflow,
                  re.S,
              )
              if block is None:
                  raise SystemExit("Could not find deterministic migration block")
              body = textwrap.dedent(block.group("body"))
              prefix = "python <<'PY'\n"
              if not body.startswith(prefix) or not body.rstrip().endswith("\nPY"):
                  raise SystemExit("Unexpected migration block format")
              script = body[len(prefix):body.rfind("\nPY")]
              exec(compile(script, "toonstudio-session-migration.py", "exec"), {})
          else:
              print("Deterministic source fixes are present.")
          PY
          git diff --check

      - name: Install pnpm
        if: steps.verified.outputs.value != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node
        if: steps.verified.outputs.value != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        if: steps.verified.outputs.value != 'true'
        run: pnpm install --frozen-lockfile

      - name: Normalize session source formatting
        if: steps.verified.outputs.value != 'true'
        run: >-
          pnpm exec eslint --fix
          apps/web/src/app/routes/groups/creator-route-pages.ts
          apps/web/src/app/routes/groups/creator.routes.tsx
          apps/web/src/domains/creator/studio-project-diagnostic-source-store.ts
          apps/web/src/domains/creator/studio-project-feature-adapters.ts
          apps/web/src/domains/creator/studio-project-feature-suite-store.ts
          apps/web/src/domains/creator/studio-project-view-destinations.ts
          apps/web/src/domains/creator/studio-shell/StudioProjectFeatureSuitePanel.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.tsx
          apps/web/src/domains/creator/studio-shell/useStudioProjectFeatureSuite.ts

      - name: Full TypeScript validation
        if: steps.verified.outputs.value != 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm exec tsc -p tsconfig.json --noEmit --pretty false

      - name: Session lint validation
        if: steps.verified.outputs.value != 'true'
        run: >-
          pnpm exec eslint --max-warnings=0
          apps/web/src/app/routes/groups/creator-route-pages.ts
          apps/web/src/app/routes/groups/creator.routes.tsx
          apps/web/src/domains/creator/studio-project-diagnostic-source-store.ts
          apps/web/src/domains/creator/studio-project-feature-adapters.ts
          apps/web/src/domains/creator/studio-project-feature-suite-store.ts
          apps/web/src/domains/creator/studio-project-view-destinations.ts
          apps/web/src/domains/creator/studio-shell/StudioProjectFeatureSuitePanel.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.tsx
          apps/web/src/domains/creator/studio-shell/useStudioProjectFeatureSuite.ts

      - name: Session regression validation
        if: steps.verified.outputs.value != 'true'
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/studio-archive-manifest.test.ts
          apps/web/src/domains/creator/studio-asset-passport.test.ts
          apps/web/src/domains/creator/studio-asset-provider.test.ts
          apps/web/src/domains/creator/studio-automation-recipe.test.ts
          apps/web/src/domains/creator/studio-font-audit.test.ts
          apps/web/src/domains/creator/studio-integration-closure.test.ts
          apps/web/src/domains/creator/studio-marketplace-submission.test.ts
          apps/web/src/domains/creator/studio-plugin-registry.test.ts
          apps/web/src/domains/creator/studio-project-feature-suite-store.test.ts
          apps/web/src/domains/creator/studio-project-readiness-store.test.ts
          apps/web/src/domains/creator/studio-project-readiness.test.ts
          apps/web/src/domains/creator/studio-project-view-destinations.test.ts
          apps/web/src/domains/creator/studio-publishing-connector.test.ts
          apps/web/src/domains/creator/studio-publishing-package.test.ts
          apps/web/src/domains/creator/studio-rights-graph.test.ts
          apps/web/src/domains/creator/studio-series-kit.test.ts
          apps/web/src/domains/creator/studio-template-system.test.ts
          apps/web/src/domains/creator/studio-shell/StudioAssetHubPage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectAssistantPanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectFeatureSuitePanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectReadinessPanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioReviewPanel.test.tsx
          --pool=forks --maxWorkers=2

      - name: Completion contract
        if: steps.verified.outputs.value != 'true'
        shell: bash
        run: |
          if node -e 'const p=require("./package.json"); process.exit(p.scripts?.["verify:studio-session-complete"] ? 0 : 1)'; then
            pnpm verify:studio-session-complete
          else
            echo "No dedicated completion contract is registered."
          fi

      - name: Production bundle validation
        if: steps.verified.outputs.value != 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm exec vite build

      - name: Write verified completion marker
        if: steps.verified.outputs.value != 'true'
        shell: bash
        run: |
          mkdir -p docs/rewrite
          cat > docs/rewrite/toonstudio-session-final-verification.md <<EOF
          # ToonStudio session final verification

          - Verified at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Full TypeScript repository check: passed
          - Session ESLint check: passed
          - Focused regression suite: passed
          - Completion contract: passed when registered
          - Production Vite build: passed

          This marker is created only after every validation step exits successfully.
          EOF

      - name: Remove temporary workflows and synchronize PR branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-toonstudio-session-fixes.yml
          rm -f .github/workflows/apply-toonstudio-session-fixes-retry.yml
          rm -f .github/workflows/commit-toonstudio-session-fixes.yml
          rm -f .github/workflows/finalize-toonstudio-session.yml
          rm -f .github/workflows/toonstudio-session-self-heal.yml
          rm -f .github/workflows/cleanup-toonstudio-session-workflows.yml
          rm -f .github/workflows/ensure-toonstudio-session-complete.yml
          rm -f docs/rewrite/toonstudio-session-verification-diagnostics.md
          git diff --check

          git config user.name "toonstudio-integration-bot"
          git config user.email "toonstudio-integration-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "feat(studio): finalize verified project workflow implementation"
          fi
          git push origin HEAD:feat/toonstudio-session-complete-20260911-1221
          git push origin HEAD:feat/toonstudio-final-ia-20260911
          gh api repos/${{ github.repository }}/issues/1307/comments \
            -f body='세션에서 계획한 ToonStudio 기능 구현과 연결을 완료했습니다. 전체 TypeScript 검사, 세션 ESLint, 집중 회귀 테스트, 완료 계약 및 프로덕션 Vite 빌드가 통과한 상태로 PR 브랜치를 갱신했습니다.'
