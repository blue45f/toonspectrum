name: Code scanning inventory

on:
  push:
    branches:
      - codex/code-scanning-remediation-20260908

permissions:
  contents: read
  security-events: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Query every open code-scanning alert
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          repository = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          alerts = []
          page = 1

          while True:
              url = (
                  f"https://api.github.com/repos/{repository}/code-scanning/alerts"
                  f"?state=open&per_page=100&page={page}"
              )
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "toonspectrum-code-scanning-inventory",
                  },
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      batch = json.load(response)
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  print(f"GitHub API failed: HTTP {error.code}: {body}", file=sys.stderr)
                  raise

              alerts.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          with open("code-scanning-open-alerts.json", "w", encoding="utf-8") as output:
              json.dump(alerts, output, ensure_ascii=False, indent=2)

          print(f"OPEN_CODE_SCANNING_ALERT_COUNT={len(alerts)}")
          print("CODE_SCANNING_ALERTS_BEGIN")
          for alert in alerts:
              rule = alert.get("rule") or {}
              instance = alert.get("most_recent_instance") or {}
              location = instance.get("location") or {}
              message = instance.get("message") or {}
              if isinstance(message, dict):
                  message = message.get("text")
              summary = {
                  "number": alert.get("number"),
                  "created_at": alert.get("created_at"),
                  "updated_at": alert.get("updated_at"),
                  "html_url": alert.get("html_url"),
                  "tool": (alert.get("tool") or {}).get("name"),
                  "rule_id": rule.get("id"),
                  "rule_name": rule.get("name"),
                  "severity": rule.get("severity"),
                  "security_severity_level": rule.get("security_severity_level"),
                  "tags": rule.get("tags"),
                  "path": location.get("path"),
                  "start_line": location.get("start_line"),
                  "end_line": location.get("end_line"),
                  "message": message,
                  "ref": instance.get("ref"),
                  "commit_sha": instance.get("commit_sha"),
                  "state": alert.get("state"),
                  "dismissed_reason": alert.get("dismissed_reason"),
              }
              print("CODE_SCANNING_ALERT=" + json.dumps(summary, ensure_ascii=False, separators=(",", ":")))
          print("CODE_SCANNING_ALERTS_END")
          PY

      - name: Upload full alert inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-scanning-open-alerts
          path: code-scanning-open-alerts.json
          if-no-files-found: error
          retention-days: 1
