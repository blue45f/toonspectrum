name: ToonStudio session goals

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/src/app/routes/groups/**"
      - "apps/web/src/domains/creator/**"
      - "apps/web/src/shared/components/**"
      - "scripts/verify-toonstudio-session-goals.mjs"
      - ".github/workflows/toonstudio-session-goals.yml"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: toonstudio-session-goals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify planned feature ownership and UI reachability
        run: node scripts/verify-toonstudio-session-goals.mjs

  type-and-lint:
    name: type-and-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -p tsconfig.json --noEmit --pretty false
      - name: Lint changed ToonStudio sources
        shell: bash
        run: |
          git fetch origin main
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx' '*.mjs')
          if ((${#files[@]})); then pnpm exec eslint --max-warnings=0 "${files[@]}"; fi

  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [domain, ui]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run domain tests
        if: matrix.shard == 'domain'
        shell: bash
        run: |
          git fetch origin main
          mapfile -t tests < <(git diff --name-only origin/main...HEAD -- 'apps/web/src/domains/creator/*.test.ts')
          if ((${#tests[@]})); then pnpm exec vitest run "${tests[@]}" --pool=forks --maxWorkers=2; fi
      - name: Run UI and route tests
        if: matrix.shard == 'ui'
        shell: bash
        run: |
          git fetch origin main
          mapfile -t tests < <(git diff --name-only origin/main...HEAD -- 'apps/web/src/**/*.test.tsx' 'apps/web/src/app/routes/**/*.test.ts')
          if ((${#tests[@]})); then pnpm exec vitest run "${tests[@]}" --pool=forks --maxWorkers=2; fi

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
