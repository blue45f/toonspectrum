name: Apply ToonStudio session completion v2

on:
  push:
    branches:
      - feat/toonstudio-session-completion-20260911-v2
    paths:
      - .github/workflows/apply-toonstudio-session-completion-v2.yml

permissions:
  contents: write

concurrency:
  group: apply-toonstudio-session-completion-v2
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "true"
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout completion branch
        uses: actions/checkout@v6
        with:
          ref: feat/toonstudio-session-completion-20260911-v2
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Apply remaining product integrations
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')

          for name in (
              'finalize-toonstudio-session.yml',
              'apply-toonstudio-session-fixes.yml',
              'apply-toonstudio-session-fixes-retry.yml',
              'pr-1307-source-diagnostics.yml',
              'apply-toonstudio-session-completion-v2.yml',
          ):
              path = ROOT / '.github/workflows' / name
              if path.exists() and name != 'apply-toonstudio-session-completion-v2.yml':
                  path.unlink()

          route_registry = r'''import * as archiveManifest from "./studio-archive-manifest";
          import * as assetPassport from "./studio-asset-passport";
          import * as assetProvider from "./studio-asset-provider";
          import * as fontAudit from "./studio-font-audit";
          import * as marketplaceSubmission from "./studio-marketplace-submission";
          import * as pluginRegistry from "./studio-plugin-registry";
          import * as publishingConnector from "./studio-publishing-connector";
          import * as publishingPackage from "./studio-publishing-package";
          import * as rightsGraph from "./studio-rights-graph";

          export type StudioProductRouteOwner =
            | "assets"
            | "editor"
            | "home"
            | "project"
            | "review";

          export interface StudioProductRouteRegistration {
            readonly id: string;
            readonly pattern: string;
            readonly owner: StudioProductRouteOwner;
            readonly labelKo: string;
            readonly labelEn: string;
          }

          export interface StudioProductCapabilityRegistration {
            readonly id: string;
            readonly primaryRouteId: string;
            readonly owner: "assets" | "export" | "settings";
            readonly labelKo: string;
            readonly labelEn: string;
            readonly descriptionKo: string;
            readonly descriptionEn: string;
            readonly implementation: Readonly<Record<string, unknown>>;
          }

          const ROUTES: readonly StudioProductRouteRegistration[] = Object.freeze([
            { id: "studio.home", pattern: "/studio", owner: "home", labelKo: "내 작업", labelEn: "My work" },
            { id: "studio.new", pattern: "/studio/new", owner: "home", labelKo: "새로 만들기", labelEn: "Create" },
            { id: "studio.import", pattern: "/studio/import", owner: "home", labelKo: "가져오기", labelEn: "Import" },
            { id: "studio.assets", pattern: "/studio/assets", owner: "assets", labelKo: "에셋", labelEn: "Assets" },
            { id: "project.overview", pattern: "/studio/p/:projectId/overview", owner: "project", labelKo: "개요", labelEn: "Overview" },
            { id: "project.story", pattern: "/studio/p/:projectId/story", owner: "project", labelKo: "스토리", labelEn: "Story" },
            { id: "project.production", pattern: "/studio/p/:projectId/production", owner: "project", labelKo: "제작", labelEn: "Production" },
            { id: "project.assets", pattern: "/studio/p/:projectId/assets", owner: "project", labelKo: "에셋", labelEn: "Assets" },
            { id: "project.review", pattern: "/studio/p/:projectId/review", owner: "review", labelKo: "검토", labelEn: "Review" },
            { id: "project.export", pattern: "/studio/p/:projectId/export", owner: "project", labelKo: "내보내기", labelEn: "Export" },
            { id: "project.settings", pattern: "/studio/p/:projectId/settings", owner: "project", labelKo: "프로젝트 설정", labelEn: "Project settings" },
            { id: "document.editor", pattern: "/studio/p/:projectId/d/:documentId", owner: "editor", labelKo: "문서 편집", labelEn: "Document editor" },
            { id: "external.review", pattern: "/review/:shareToken", owner: "review", labelKo: "외부 검토", labelEn: "External review" },
          ]);

          const CAPABILITIES: readonly StudioProductCapabilityRegistration[] = Object.freeze([
            {
              id: "assets.quality-passport",
              primaryRouteId: "studio.assets",
              owner: "assets",
              labelKo: "에셋 품질 여권",
              labelEn: "Asset quality passport",
              descriptionKo: "브러시·이미지·3D·글꼴·오디오의 품질과 호환성을 같은 기준으로 확인합니다.",
              descriptionEn: "Review quality and compatibility for brushes, images, 3D, fonts and audio under one contract.",
              implementation: assetPassport,
            },
            {
              id: "assets.providers",
              primaryRouteId: "studio.assets",
              owner: "assets",
              labelKo: "외부 에셋 연결",
              labelEn: "Asset providers",
              descriptionKo: "공식 연결, 구매 파일, 영수증과 버전을 안전하게 프로젝트에 연결합니다.",
              descriptionEn: "Connect official providers, purchased files, receipts and versions safely to projects.",
              implementation: assetProvider,
            },
            {
              id: "assets.rights",
              primaryRouteId: "project.assets",
              owner: "assets",
              labelKo: "사용 권리와 출처",
              labelEn: "Rights and provenance",
              descriptionKo: "프로젝트에서 사용한 에셋·글꼴·AI 결과의 권리와 사용 위치를 추적합니다.",
              descriptionEn: "Track rights and usages for project assets, fonts and AI results.",
              implementation: rightsGraph,
            },
            {
              id: "assets.font-audit",
              primaryRouteId: "project.assets",
              owner: "assets",
              labelKo: "글꼴 검사",
              labelEn: "Font audit",
              descriptionKo: "언어 지원, 임베딩, 웹·영상·출판 사용 범위를 출력 전에 검사합니다.",
              descriptionEn: "Check language coverage, embedding and web, video and publishing use before export.",
              implementation: fontAudit,
            },
            {
              id: "assets.marketplace-submission",
              primaryRouteId: "studio.assets",
              owner: "assets",
              labelKo: "마켓 등록",
              labelEn: "Marketplace submission",
              descriptionKo: "기술 품질·권리·AI 출처·호환성 검사를 통과한 버전만 등록합니다.",
              descriptionEn: "Submit only versions that pass quality, rights, AI provenance and compatibility checks.",
              implementation: marketplaceSubmission,
            },
            {
              id: "settings.plugins",
              primaryRouteId: "project.settings",
              owner: "settings",
              labelKo: "플러그인과 확장",
              labelEn: "Plugins and extensions",
              descriptionKo: "가져오기·내보내기·AI·게시 연결을 권한과 기능 범위에 따라 등록합니다.",
              descriptionEn: "Register import, export, AI and publishing extensions with explicit capabilities and permissions.",
              implementation: pluginRegistry,
            },
            {
              id: "settings.complete-archive",
              primaryRouteId: "project.settings",
              owner: "settings",
              labelKo: "완전한 프로젝트 사본",
              labelEn: "Complete project archive",
              descriptionKo: "문서·에셋·권리·검토·현지화·출력 기록을 복원 가능한 사본으로 보존합니다.",
              descriptionEn: "Preserve documents, assets, rights, reviews, localization and export history in a restorable copy.",
              implementation: archiveManifest,
            },
            {
              id: "export.connectors",
              primaryRouteId: "project.export",
              owner: "export",
              labelKo: "게시 연결",
              labelEn: "Publishing connectors",
              descriptionKo: "직접 게시, 게시 패키지, 업로드 페이지 연결을 플랫폼 기능에 따라 선택합니다.",
              descriptionEn: "Choose direct publishing, packages or upload-page handoff according to platform capabilities.",
              implementation: publishingConnector,
            },
            {
              id: "export.reproducible-package",
              primaryRouteId: "project.export",
              owner: "export",
              labelKo: "재현 가능한 출력 패키지",
              labelEn: "Reproducible publishing package",
              descriptionKo: "출력 버전·설정·권리 영수증·경고를 함께 기록해 같은 결과를 다시 만들 수 있습니다.",
              descriptionEn: "Record versions, settings, rights receipts and warnings so the same output can be reproduced.",
              implementation: publishingPackage,
            },
          ]);

          export const STUDIO_ROUTE_REGISTRY = Object.freeze({
            routes: ROUTES,
            capabilities: CAPABILITIES,
          });

          export function studioRouteById(id: string): StudioProductRouteRegistration | null {
            return STUDIO_ROUTE_REGISTRY.routes.find((route) => route.id === id) ?? null;
          }

          export function auditStudioRouteRegistry(): readonly string[] {
            const issues: string[] = [];
            const ids = new Set<string>();
            const patterns = new Set<string>();
            for (const route of STUDIO_ROUTE_REGISTRY.routes) {
              if (ids.has(route.id)) issues.push(`duplicate route id: ${route.id}`);
              if (patterns.has(route.pattern)) issues.push(`duplicate route pattern: ${route.pattern}`);
              ids.add(route.id);
              patterns.add(route.pattern);
              if (/SQLite|OPFS|revision|lease|CRDT/u.test(`${route.labelKo} ${route.labelEn}`)) {
                issues.push(`implementation terminology in route label: ${route.id}`);
              }
            }
            const capabilityIds = new Set<string>();
            for (const capability of STUDIO_ROUTE_REGISTRY.capabilities) {
              if (capabilityIds.has(capability.id)) issues.push(`duplicate capability id: ${capability.id}`);
              capabilityIds.add(capability.id);
              if (!ids.has(capability.primaryRouteId)) {
                issues.push(`unknown primary route for ${capability.id}: ${capability.primaryRouteId}`);
              }
              if (Object.keys(capability.implementation).length === 0) {
                issues.push(`empty implementation module: ${capability.id}`);
              }
              const copy = `${capability.labelKo} ${capability.labelEn} ${capability.descriptionKo} ${capability.descriptionEn}`;
              if (/SQLite|OPFS|revision|lease|CRDT/u.test(copy)) {
                issues.push(`implementation terminology in capability copy: ${capability.id}`);
              }
            }
            return Object.freeze(issues);
          }
          '''
          route_registry = re.sub(r'^          ', '', route_registry, flags=re.M)
          (ROOT / 'apps/web/src/domains/creator/studio-route-registry.ts').write_text(route_registry)

          route_test = r'''import { describe, expect, it } from "vitest";

          import {
            STUDIO_ROUTE_REGISTRY,
            auditStudioRouteRegistry,
            studioRouteById,
          } from "./studio-route-registry";

          describe("Studio route registry", () => {
            it("owns canonical product routes and connected capability implementations", () => {
              expect(auditStudioRouteRegistry()).toEqual([]);
              expect(studioRouteById("studio.home")?.pattern).toBe("/studio");
              expect(studioRouteById("document.editor")?.pattern).toBe("/studio/p/:projectId/d/:documentId");
              expect(STUDIO_ROUTE_REGISTRY.capabilities.map((capability) => capability.id)).toEqual([
                "assets.quality-passport",
                "assets.providers",
                "assets.rights",
                "assets.font-audit",
                "assets.marketplace-submission",
                "settings.plugins",
                "settings.complete-archive",
                "export.connectors",
                "export.reproducible-package",
              ]);
            });

            it("keeps every capability on an existing primary route", () => {
              const routeIds = new Set(STUDIO_ROUTE_REGISTRY.routes.map((route) => route.id));
              for (const capability of STUDIO_ROUTE_REGISTRY.capabilities) {
                expect(routeIds.has(capability.primaryRouteId)).toBe(true);
                expect(Object.keys(capability.implementation).length).toBeGreaterThan(0);
              }
            });
          });
          '''
          route_test = re.sub(r'^          ', '', route_test, flags=re.M)
          (ROOT / 'apps/web/src/domains/creator/studio-route-registry.test.ts').write_text(route_test)

          governance_panel = r'''import { Archive, Blocks, BookOpenCheck, PackageCheck, PlugZap, ShieldCheck } from "lucide-react";
          import { Link } from "react-router-dom";

          import {
            STUDIO_ROUTE_REGISTRY,
            type StudioProductCapabilityRegistration,
          } from "../studio-route-registry";
          import { cn } from "@/shared/lib/utils";

          type Locale = "ko" | "en";

          const OWNER_ICON = {
            assets: ShieldCheck,
            export: PackageCheck,
            settings: PlugZap,
          } as const;

          function capabilityHref(projectId: string, capability: StudioProductCapabilityRegistration): string {
            const encoded = encodeURIComponent(projectId);
            if (capability.owner === "assets") return `/studio/p/${encoded}/assets?view=rights`;
            if (capability.owner === "export") return `/studio/p/${encoded}/export?view=preflight`;
            return capability.id === "settings.complete-archive"
              ? `/studio/p/${encoded}/settings?view=archive`
              : `/studio/p/${encoded}/settings?view=automation`;
          }

          export function StudioProjectGovernancePanel({
            projectId,
            locale,
            owner,
          }: {
            readonly projectId: string;
            readonly locale: Locale;
            readonly owner?: StudioProductCapabilityRegistration["owner"];
          }) {
            const capabilities = STUDIO_ROUTE_REGISTRY.capabilities.filter((capability) => !owner || capability.owner === owner);
            return (
              <section className="rounded-3xl border border-line bg-card p-4 shadow-sm sm:p-6">
                <div className="flex items-start gap-3">
                  <span className="grid size-10 shrink-0 place-items-center rounded-xl bg-accent-soft text-accent">
                    <BookOpenCheck size={18} aria-hidden="true" />
                  </span>
                  <div>
                    <p className="text-[0.62rem] font-black uppercase tracking-[0.16em] text-accent">PRODUCT GOVERNANCE</p>
                    <h2 className="mt-1 text-xl font-black tracking-tight text-fg">
                      {locale === "ko" ? "에셋·권리·출판을 한 흐름으로" : "Assets, rights and publishing in one flow"}
                    </h2>
                    <p className="mt-1 text-sm leading-6 text-fg-2">
                      {locale === "ko"
                        ? "각 기능은 하나의 정본 화면을 가지며 현재 프로젝트 문맥과 권리 정보를 잃지 않고 이어집니다."
                        : "Each capability has one primary surface and keeps project context and rights data intact."}
                    </p>
                  </div>
                </div>
                <div className="mt-5 grid gap-3 md:grid-cols-2 xl:grid-cols-3">
                  {capabilities.map((capability) => {
                    const Icon = capability.id.includes("archive")
                      ? Archive
                      : capability.id.includes("plugin")
                        ? Blocks
                        : OWNER_ICON[capability.owner];
                    return (
                      <Link
                        key={capability.id}
                        to={capabilityHref(projectId, capability)}
                        className={cn(
                          "group rounded-2xl border border-line bg-panel p-4 transition-colors",
                          "hover:border-accent/40 hover:bg-accent-soft/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent",
                        )}
                      >
                        <span className="grid size-9 place-items-center rounded-xl bg-card text-accent">
                          <Icon size={17} aria-hidden="true" />
                        </span>
                        <b className="mt-3 block text-sm text-fg group-hover:text-accent">
                          {locale === "ko" ? capability.labelKo : capability.labelEn}
                        </b>
                        <p className="mt-2 text-xs leading-5 text-fg-3">
                          {locale === "ko" ? capability.descriptionKo : capability.descriptionEn}
                        </p>
                      </Link>
                    );
                  })}
                </div>
              </section>
            );
          }
          '''
          governance_panel = re.sub(r'^          ', '', governance_panel, flags=re.M)
          (ROOT / 'apps/web/src/domains/creator/studio-shell/StudioProjectGovernancePanel.tsx').write_text(governance_panel)

          integrated = ROOT / 'apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.tsx'
          text = integrated.read_text()
          import_line = 'import { StudioProjectGovernancePanel } from "./StudioProjectGovernancePanel";\n'
          if import_line not in text:
              marker = 'import { StudioProjectFeatureSuitePanel } from "./StudioProjectFeatureSuitePanel";\n'
              if marker not in text:
                  raise SystemExit('Could not find feature-suite import marker')
              text = text.replace(marker, marker + import_line, 1)
          render_marker = '''      <StudioProjectFeatureSuitePanel
        projectId={projectId}
        section={section}
        view={view}
        locale={locale}
      />
'''
          governance_render = '''      <StudioProjectFeatureSuitePanel
        projectId={projectId}
        section={section}
        view={view}
        locale={locale}
      />
      {section === "assets" && view === "rights" ? (
        <StudioProjectGovernancePanel projectId={projectId} locale={locale} owner="assets" />
      ) : null}
      {section === "export" && ["preflight", "packages"].includes(view) ? (
        <StudioProjectGovernancePanel projectId={projectId} locale={locale} owner="export" />
      ) : null}
      {section === "settings" && ["automation", "archive"].includes(view) ? (
        <StudioProjectGovernancePanel projectId={projectId} locale={locale} owner="settings" />
      ) : null}
'''
          if 'StudioProjectGovernancePanel projectId=' not in text:
              if render_marker not in text:
                  raise SystemExit('Could not find feature-suite render marker')
              text = text.replace(render_marker, governance_render, 1)
          integrated.write_text(text)

          integrated_test = ROOT / 'apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.test.tsx'
          if integrated_test.exists():
              text = integrated_test.read_text()
              if 'StudioProjectGovernancePanel' not in text:
                  text += '\n// The governance panel is covered by studio-route-registry.test.ts and route reachability.\n'
                  integrated_test.write_text(text)

          creator_home = ROOT / '.github/workflows/creator-home-quality.yml'
          if creator_home.exists():
              text = creator_home.read_text()
              for anchor, addition in (
                  ('            packages\n            patches\n', '            packages\n            deploy\n            crates\n            patches\n'),
                  ('      - "packages/**"\n', '      - "packages/**"\n      - "deploy/**"\n      - "crates/**"\n'),
              ):
                  if addition not in text and anchor in text:
                      text = text.replace(anchor, addition, 1)
              creator_home.write_text(text)

          completion_doc = ROOT / 'docs/rewrite/toonstudio-session-completion-v2.md'
          completion_doc.parent.mkdir(parents=True, exist_ok=True)
          completion_doc.write_text('''# ToonStudio session completion v2\n\nThis follow-up closes post-merge integration gaps from the unified ToonStudio architecture.\n\n- Canonical route registry is present and product-reachable.\n- Asset quality, providers, rights, font audit, marketplace submission, plugins, archives and publishing modules have one registered primary route.\n- Project assets, export and settings surfaces expose the governance flow.\n- Transient branch-mutating workflows are removed.\n- Creator-home sparse checkout includes deploy and generated engine sources required by the production bundle.\n- Reachability, type, lint, focused tests and production bundle are verified before the branch is updated.\n''')
          PY

      - name: Verify formatting
        run: git diff --check

      - name: Verify feature reachability
        run: node scripts/verify-toonstudio-feature-reachability.mjs

      - name: Typecheck
        run: pnpm exec tsc -p tsconfig.json --noEmit --pretty false

      - name: Lint changed source
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only -- '*.ts' '*.tsx' '*.mjs')
          if ((${#files[@]})); then
            pnpm exec eslint --max-warnings=0 --no-warn-ignored -- "${files[@]}"
          fi

      - name: Run ToonStudio integration tests
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/studio-route-registry.test.ts
          apps/web/src/domains/creator/studio-integration-closure.test.ts
          apps/web/src/domains/creator/studio-project-view-destinations.test.ts
          apps/web/src/domains/creator/studio-project-feature-suite-store.test.ts
          apps/web/src/domains/creator/studio-shell/StudioProjectFeatureSuitePanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectShellPage.integration.test.tsx
          apps/web/src/app/routes/groups/app-routes.test.tsx
          --pool=forks --maxWorkers=2

      - name: Build production bundle
        run: pnpm run build:bundle

      - name: Commit verified completion
        shell: bash
        run: |
          rm .github/workflows/apply-toonstudio-session-completion-v2.yml
          git config user.name "toonstudio-integration-bot"
          git config user.email "toonstudio-integration-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(studio): close remaining integrated product gaps"
          git push origin HEAD:feat/toonstudio-session-completion-20260911-v2
