name: Converge onto single canonical PR branch once

on:
  push:
    branches:
      - feat/toonstudio-session-complete-20260911-1221
    paths:
      - .github/workflows/converge-to-single-pr-branch-once.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: converge-to-single-pr-branch-once-20260911
  cancel-in-progress: false

jobs:
  converge:
    name: Preserve main and the canonical PR branch only
    if: ${{ github.repository == 'blue45f/toonspectrum' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify integration and delete obsolete backup branches
        shell: bash
        run: |
          set -euo pipefail

          repo="$GITHUB_REPOSITORY"
          canonical="feat/toonstudio-session-complete-20260911-1221"
          default_branch="main"
          backups=(
            "backup/toonstudio-final-ia-pre-rebase-20260911"
            "backup/toonstudio-final-ia-rebase-attempt"
          )
          expected_backup_sha="9172952d824bbe5f4cbceb9ef12105482cf78793"

          open_prs="$(gh api "repos/${repo}/pulls?state=open&per_page=100")"
          open_pr_count="$(jq 'length' <<<"$open_prs")"
          if [[ "$open_pr_count" != "1" ]]; then
            echo "Expected exactly one open PR, found ${open_pr_count}; refusing cleanup."
            exit 1
          fi
          if [[ "$(jq -r '.[0].number' <<<"$open_prs")" != "1313" \
             || "$(jq -r '.[0].head.ref' <<<"$open_prs")" != "$canonical" \
             || "$(jq -r '.[0].base.ref' <<<"$open_prs")" != "$default_branch" ]]; then
            echo "The sole open PR is not canonical PR #1313; refusing cleanup."
            exit 1
          fi

          head_pages="$(gh api --paginate --slurp "repos/${repo}/git/matching-refs/heads/?per_page=100")"
          canonical_ref="refs/heads/${canonical}"
          default_ref="refs/heads/${default_branch}"
          canonical_sha="$(jq -r --arg ref "$canonical_ref" '.[][] | select(.ref == $ref) | .object.sha' <<<"$head_pages")"
          default_sha="$(jq -r --arg ref "$default_ref" '.[][] | select(.ref == $ref) | .object.sha' <<<"$head_pages")"

          if [[ -z "$canonical_sha" || "$canonical_sha" == "null" || -z "$default_sha" || "$default_sha" == "null" ]]; then
            echo "Canonical or default branch is missing; refusing cleanup."
            exit 1
          fi
          if [[ "$canonical_sha" != "$GITHUB_SHA" ]]; then
            echo "Canonical branch moved during cleanup; refusing deletion."
            exit 1
          fi

          backup_node_ids=()
          for backup in "${backups[@]}"; do
            ref="refs/heads/${backup}"
            current_sha="$(jq -r --arg ref "$ref" '.[][] | select(.ref == $ref) | .object.sha' <<<"$head_pages")"
            node_id="$(jq -r --arg ref "$ref" '.[][] | select(.ref == $ref) | .node_id' <<<"$head_pages")"

            if [[ "$current_sha" != "$expected_backup_sha" || -z "$node_id" || "$node_id" == "null" ]]; then
              echo "Backup branch ${backup} moved, disappeared, or cannot be identified; refusing cleanup."
              exit 1
            fi

            compare="$(gh api "repos/${repo}/compare/${current_sha}...${canonical_sha}")"
            if [[ "$(jq -r '.behind_by' <<<"$compare")" != "0" \
               || "$(jq -r '.merge_base_commit.sha' <<<"$compare")" != "$current_sha" ]]; then
              echo "Backup branch ${backup} has changes not contained in the canonical branch; refusing cleanup."
              exit 1
            fi
            backup_node_ids+=("$node_id")
          done

          mutation='mutation($id:ID!){deleteRef(input:{refId:$id}){clientMutationId}}'
          for i in "${!backups[@]}"; do
            gh api graphql -f query="$mutation" -f id="${backup_node_ids[$i]}" >/dev/null
            echo "Deleted obsolete backup branch: ${backups[$i]}"
          done

          remaining="$(gh api --paginate --slurp "repos/${repo}/git/matching-refs/heads/?per_page=100")"
          remaining_names="$(jq -r '.[][] | .ref | sub("^refs/heads/"; "")' <<<"$remaining" | sort)"
          expected_names="$(printf '%s\n%s\n' "$canonical" "$default_branch" | sort)"
          if [[ "$remaining_names" != "$expected_names" ]]; then
            echo "Unexpected branch set remains after cleanup:"
            printf '%s\n' "$remaining_names"
            exit 1
          fi

          {
            echo "## Single canonical PR branch convergence completed"
            echo
            echo "- Preserved default branch: ${default_branch}"
            echo "- Preserved canonical PR branch: ${canonical}"
            echo "- Deleted obsolete backup branches: ${#backups[@]}"
            echo "- Verified sole open PR: #1313"
          } >> "$GITHUB_STEP_SUMMARY"
