name: Character production verification 20260913

on:
  push:
    branches: [qa/character-production-20260913]
    paths:
      - .github/workflows/character-production-verification-20260913.yml

permissions:
  contents: read

concurrency:
  group: character-production-verification-20260913
  cancel-in-progress: true

jobs:
  production-browser:
    name: production-browser (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            lane: swiftshader
          - os: macos-14
            lane: native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CI: '1'
      HUSKY: '0'
      NODE_OPTIONS: --max-old-space-size=6144
      TOONSPECTRUM_VERIFY_ORIGIN: https://www.toonstudio.cloud
      TOONSPECTRUM_CHARACTER_SHAPER_VERIFY_DIR: artifacts/character-production
      TOONSPECTRUM_CHARACTER_GPU_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install Chromium for real browser execution
        run: pnpm exec playwright install --with-deps chromium
      - name: Record public production HTTP responses
        run: |
          mkdir -p artifacts/character-production
          git rev-parse HEAD > artifacts/character-production/verifier-commit.txt
          printf '%s\n' fe0f3c207c6cbf5b6f5a5f42f515d622f768a0c6 > artifacts/character-production/expected-production-commit.txt
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const responses = [];
          for (const path of ['/', '/studio/character']) {
            const response = await fetch(`https://www.toonstudio.cloud${path}`);
            const body = await response.text();
            const result = { path, url: response.url, status: response.status, time: new Date().toISOString(), headers: Object.fromEntries(response.headers), bytes: Buffer.byteLength(body) };
            responses.push(result);
            if (!response.ok) throw new Error(`Production HTTP failed: ${JSON.stringify(result)}`);
          }
          writeFileSync('artifacts/character-production/http.json', JSON.stringify(responses, null, 2));
          console.log(JSON.stringify(responses, null, 2));
          JS
      - name: Prepare CSP-safe verifier and PSD cancellation coverage
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('scripts/verify-studio-character-shaper.mts').read_text()
          def replace(old, new, count=1):
              global source
              assert source.count(old) == count, f'Verifier drift: expected {count} occurrences of {old[:100]}'
              source = source.replace(old, new)
          # Production connect-src intentionally excludes data:. Decode the test's own PNG
          # bytes directly; never disable CSP or alter response headers/application bundles.
          replace('const response = await fetch(`data:image/png;base64,${encodedPng}`);\n    const bitmap = await createImageBitmap(await response.blob());',
                  'const bytes = Uint8Array.from(atob(encodedPng), (value) => value.charCodeAt(0));\n    const bitmap = await createImageBitmap(new Blob([bytes], { type: "image/png" }));', 2)
          replace('const png = await fetch(`data:image/png;base64,${encodedPng}`);\n    const bitmap = await createImageBitmap(await png.blob());',
                  'const bytes = Uint8Array.from(atob(encodedPng), (value) => value.charCodeAt(0));\n    const bitmap = await createImageBitmap(new Blob([bytes], { type: "image/png" }));')
          replace('const beauty = new Uint8Array(await (await fetch(`data:application/octet-stream;base64,${encodedBeauty}`)).arrayBuffer());',
                  'const beauty = Uint8Array.from(atob(encodedBeauty), (value) => value.charCodeAt(0));')
          replace('evidence.consoleErrors = consoleErrors;\n    page.on', '''evidence.consoleErrors = consoleErrors;
              const httpErrors: { url: string; status: number }[] = [];
              evidence.httpErrors = httpErrors;
              page.on("response", (response) => {
                if (response.status() >= 400 && httpErrors.length < 100) {
                  const u = new URL(response.url());
                  httpErrors.push({ url: u.origin + u.pathname, status: response.status() });
                }
              });
              page.on''')
          needle = '    const downloadPromise = page.waitForEvent("download", { timeout: 120_000 });\n    await psdButton.click();'
          replace(needle, '''    const cancelledPsdDownloads: string[] = [];
              const onCancelledPsdDownload = (download: Download) => cancelledPsdDownloads.push(download.suggestedFilename());
              page.on("download", onCancelledPsdDownload);
              await page.evaluate(() => {
                const report = { progress: null as number | null, phase: "", requested: false, expired: false };
                Object.assign(window, { __psdCancellation: report });
                const observer = new MutationObserver(() => {
                  const status = [...document.querySelectorAll('[data-character-shaper="true"] [role="status"]')]
                    .map((element) => element.textContent ?? "").join(" ");
                  const match = /PSD (.+) 계산 중 · (\\d+)%/u.exec(status);
                  const percentage = match ? Number(match[2]) : 0;
                  if (!match || percentage <= 0 || percentage >= 100) return;
                  const cancel = [...document.querySelectorAll<HTMLButtonElement>('[data-character-shaper="true"] button')]
                    .find((button) => button.textContent?.trim() === "내보내기 취소" && !button.disabled);
                  if (!cancel) return;
                  report.progress = percentage;
                  report.phase = match[1];
                  report.requested = true;
                  observer.disconnect();
                  clearTimeout(timeout);
                  cancel.click();
                });
                const timeout = setTimeout(() => { observer.disconnect(); report.expired = true; }, 35000);
                observer.observe(document.body, { childList: true, subtree: true, characterData: true });
              });
              await psdButton.click();
              try {
                await page.getByRole("status").filter({ hasText: "내보내기를 취소했습니다." }).waitFor({ timeout: 40000 });
                const cancelled = await page.evaluate(() => (window as unknown as { __psdCancellation: { progress: number | null; phase: string; requested: boolean; expired: boolean } }).__psdCancellation);
                invariant(cancelled.requested && !cancelled.expired && cancelled.progress !== null && cancelled.progress > 0 && cancelled.progress < 100, "PSD computation did not expose cancellable progress");
                invariant(cancelledPsdDownloads.length === 0, "Cancelled PSD downloaded a file");
                invariant(await psdButton.isEnabled(), "PSD cancellation did not release capture authority");
                evidence.psdComputationCancellation = { ...cancelled, downloads: cancelledPsdDownloads.length, lockReleased: true };
              } finally { page.off("download", onCancelledPsdDownload); }
              // Original full PSD decode, layer checks and exact PNG composition checks follow.
              const downloadPromise = page.waitForEvent("download", { timeout: 120_000 });
              await psdButton.click();''')
          Path('scripts/verify-studio-character-shaper.production.mts').write_text(source)
          PY
      - name: Verify live character rendering, edits, PNG, cancellation, PSD and mobile
        run: pnpm exec tsx scripts/verify-studio-character-shaper.production.mts
      - name: Print evidence summary
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readFileSync, appendFileSync } from 'node:fs';
          const path = 'artifacts/character-production/character-shaper-evidence.json';
          if (!existsSync(path)) { console.log('No browser evidence was produced.'); process.exit(0); }
          const e = JSON.parse(readFileSync(path, 'utf8'));
          const summary = {status:e.status, origin:e.origin, capturedAt:e.capturedAt, browserVersion:e.browserVersion, renderer:e.renderer,
            beforeStats:e.beforeStats, hairPeakTileDelta:e.hairPeakTileDelta, topPeakTileDelta:e.topPeakTileDelta,
            transparentPng:e.transparentPng, transparentPng4k:e.transparentPng4k, pngRenderingCancellation:e.pngRenderingCancellation,
            psdComputationCancellation:e.psdComputationCancellation,
            psdDimensions:e.psdDimensions, psdLayers:e.psdLayers, psdRasterLayers:e.psdRasterLayers,
            psdPngComposition:e.psdPngComposition, psdWorkerUrls:e.psdWorkerUrls, psdFailure:e.psdFailure,
            escOrder:e.escOrder, mobileWidths:e.mobileWidths,
            mobileViolations:e.mobileControlBounds?.map(x=>({width:x.width,exportOpen:x.exportOpen,violations:x.violations})),
            accessibleNameGaps:e.accessibleNameGaps, consoleErrors:e.consoleErrors, httpErrors:e.httpErrors};
          console.log(JSON.stringify(summary, null, 2));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, '# Live production browser verification\n\nLane: ' + process.env.TOONSPECTRUM_CHARACTER_GPU_LANE + '. Check the actual renderer identity; a software renderer never proves native hardware behavior. No production application source, deployment settings or CSP were modified.\n\n```json\n' + JSON.stringify(summary, null, 2) + '\n```\n');
          JS
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: character-production-20260913-${{ matrix.lane }}
          path: artifacts/character-production
          retention-days: 7
          if-no-files-found: warn
