name: Execute Scene3D projection bootstrap

on:
  push:
    branches: [feat/scene3d-runtime-projection-20260910]
    paths: [.github/workflows/scene3d-projection-executor.yml]

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/scene3d-runtime-projection-20260910
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Materialize projection product code
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import os, subprocess, yaml
          source = '.github/workflows/scene3d-projection-bootstrap.yml'
          data = yaml.safe_load(open(source, encoding='utf-8'))
          for job in data.get('jobs', {}).values():
              for step in job.get('steps', []):
                  script = step.get('run')
                  if not script:
                      continue
                  name = str(step.get('name', ''))
                  if name in {'Validate projection', 'Commit projection'} or 'git push origin' in script:
                      continue
                  env = os.environ.copy()
                  env.update({str(k): str(v) for k, v in (step.get('env') or {}).items()})
                  print(f'::group::{name or "bootstrap step"}')
                  subprocess.run(script, shell=True, executable='/bin/bash', check=True, env=env)
                  print('::endgroup::')
          PY
      - name: Remove control-regex lint debt from the touched document
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/domains/creator/scene3d/studio-scene3d-document.ts')
          text = path.read_text(encoding='utf-8')
          old = '''function isSafeAssetUri(value: unknown): value is string {
            if (typeof value !== "string" || value.length === 0 || value.length > 1024) return false;
            if (/[\\\u0000-\u001f\u007f]/u.test(value)) return false;
            if (/^(?:javascript|data|blob):/iu.test(value)) return false;
          '''
          new = '''function isSafeAssetUri(value: unknown): value is string {
            if (typeof value !== "string" || value.length === 0 || value.length > 1024) return false;
            for (let index = 0; index < value.length; index += 1) {
              const code = value.charCodeAt(index);
              if (code === 92 || code <= 31 || code === 127) return false;
            }
            if (/^(?:javascript|data|blob):/iu.test(value)) return false;
          '''
          if old not in text:
              raise SystemExit('safe URI validator anchor changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate projection scope
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run \
            apps/web/src/domains/creator/scene3d/studio-scene3d-document.test.ts \
            apps/web/src/domains/creator/scene3d/studio-scene3d-bg3d-projection.test.ts
          pnpm exec eslint --max-warnings=0 \
            apps/web/src/domains/creator/scene3d/studio-scene3d-document.ts \
            apps/web/src/domains/creator/scene3d/studio-scene3d-bg3d-projection.ts \
            apps/web/src/domains/creator/scene3d/studio-scene3d-bg3d-projection.test.ts
          git diff --check
      - name: Commit materialized product slice
        shell: bash
        run: |
          git config user.name toonstudio-3d-ci
          git config user.email actions@users.noreply.github.com
          rm -f .github/workflows/scene3d-projection-bootstrap.yml \
                .github/workflows/scene3d-projection-executor.yml \
                .github/workflows/unblock-scene3d-projection-once.yml
          git add -A
          git diff --cached --check
          HUSKY=0 git commit -m 'feat(scene3d): project legacy BG3D into unified scene authority'
          HUSKY=0 git push origin HEAD:feat/scene3d-runtime-projection-20260910
