name: Collaboration command center V20 bootstrap

on:
  push:
    branches:
      - feat/collaboration-command-center-v20-20260905

permissions:
  contents: write

concurrency:
  group: collaboration-command-center-v20-bootstrap-v2
  cancel-in-progress: true

jobs:
  patch-verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/collaboration-command-center-v20-20260905

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Apply guarded collaboration integration patch
        run: python scripts/apply-collaboration-command-center-v20.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Auto-fix changed files with repository ESLint
        run: >-
          pnpm exec eslint --fix --max-warnings=0
          src/domains/creator/live/StudioLiveCollaborationCommandCenter.tsx
          src/domains/creator/live/StudioLiveCollaborationCommandCenter.test.tsx
          src/domains/creator/live/studio-live-collaboration-command-center.integration.test.ts
          src/domains/creator/live/StudioLiveCollaborationPanel.tsx
          src/domains/creator/StudioTeamPanel.tsx
          src/domains/creator/studio-router/StudioRouteFallbacks.tsx
          src/domains/creator/studio-router/StudioRouteCollaborationGateway.test.tsx

      - name: Lint changed files
        run: >-
          pnpm exec eslint --max-warnings=0
          src/domains/creator/live/StudioLiveCollaborationCommandCenter.tsx
          src/domains/creator/live/StudioLiveCollaborationCommandCenter.test.tsx
          src/domains/creator/live/studio-live-collaboration-command-center.integration.test.ts
          src/domains/creator/live/StudioLiveCollaborationPanel.tsx
          src/domains/creator/StudioTeamPanel.tsx
          src/domains/creator/studio-router/StudioRouteFallbacks.tsx
          src/domains/creator/studio-router/StudioRouteCollaborationGateway.test.tsx

      - name: Run focused collaboration tests
        run: >-
          pnpm exec vitest run
          src/domains/creator/live/StudioLiveCollaborationCommandCenter.test.tsx
          src/domains/creator/live/studio-live-collaboration-command-center.integration.test.ts
          src/domains/creator/live/StudioLiveCollaborationPanel.test.tsx
          src/domains/creator/live/StudioLiveCollaborationPanel.following.test.tsx
          src/domains/creator/studio-router/StudioRouteFallbacks.test.tsx
          src/domains/creator/studio-router/StudioRouteCollaborationGateway.test.tsx

      - name: Run repository typecheck
        run: pnpm run typecheck

      - name: Remove bootstrap files and commit verified integration
        shell: bash
        run: |
          git rm \
            .github/workflows/collaboration-command-center-v20-bootstrap.yml \
            scripts/apply-collaboration-command-center-v20.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/domains/creator/live/StudioLiveCollaborationCommandCenter.tsx \
            src/domains/creator/live/StudioLiveCollaborationCommandCenter.test.tsx \
            src/domains/creator/live/studio-live-collaboration-command-center.integration.test.ts \
            src/domains/creator/live/StudioLiveCollaborationPanel.tsx \
            src/domains/creator/StudioTeamPanel.tsx \
            src/domains/creator/studio-router/StudioRouteFallbacks.tsx \
            src/domains/creator/studio-router/StudioRouteCollaborationGateway.test.tsx
          git commit --no-verify -m "feat(studio): ship collaboration command center V20"
          git push --no-verify origin HEAD:feat/collaboration-command-center-v20-20260905
