name: One-shot merge PR 900 into final integration

on:
  push:
    branches:
      - integration/final-all-worktrees-with-3d-20260908
    paths:
      - .github/workflows/one-shot-merge-pr900-into-final.yml

permissions:
  contents: write

concurrency:
  group: one-shot-merge-pr900-into-final
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HUSKY: '0'
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integration/final-all-worktrees-with-3d-20260908
          fetch-depth: 1
      - name: Fetch and replay the completed 3D expansion
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin f79fd9a0eba37679415994563253536f7da31cf4 --depth=3
          git cherry-pick --no-commit -X ours \
            55ca11c6224656e5bf00f61310b5b7be71360cf4 \
            f79fd9a0eba37679415994563253536f7da31cf4
          git rm -f .github/workflows/one-shot-merge-pr900-into-final.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "merge: restore completed Studio 3D expansion into final integration"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck the merged product tree
        run: pnpm run typecheck
      - name: Run focused Studio 3D integration regressions
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/Studio3dAssetQualityPanel.test.tsx
          apps/web/src/domains/creator/studio-3d-asset-quality-session.test.ts
          apps/web/src/domains/creator/studio-asset-expansion-20260908.test.ts
          apps/web/src/domains/creator/studio-cc0-asset-delivery.test.ts
          apps/web/src/domains/creator/bg3d/studio-bg3d-runtime-asset-quality.test.ts
          apps/web/src/domains/creator/bg3d/studio-bg3d-session-glb-policy.test.ts
          apps/web/src/domains/creator/vrm/quaternius-fantasy-catalog.test.ts
          apps/web/src/domains/creator/vrm/quaternius-modular-catalog.test.ts
      - name: Ensure validation did not rewrite tracked sources
        run: git diff --exit-code
      - name: Publish the verified immutable integration head
        run: git push origin HEAD:refs/heads/integration/final-all-worktrees-with-3d-20260908
