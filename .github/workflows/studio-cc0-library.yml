name: Studio CC0 library regression

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '.github/workflows/studio-cc0-library.yml'
      - 'apps/web/src/domains/creator/StudioCc0AssetLibraryPanel.tsx'
      - 'apps/web/src/domains/creator/studio-cc0-*.ts'
      - 'apps/web/src/domains/creator/useStudioModalSheet.ts'
      - 'scripts/studio-cc0-lifecycle-checks.mjs'
      - 'scripts/verify-studio-cc0-curated-ui.mjs'
      - 'scripts/*premium*.mts'
      - 'apps/web/public/assets/studio/cc0-20260906/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/studio-cc0-library.yml'
      - 'apps/web/src/domains/creator/StudioCc0AssetLibraryPanel.tsx'
      - 'apps/web/src/domains/creator/studio-cc0-*.ts'
      - 'apps/web/src/domains/creator/useStudioModalSheet.ts'
      - 'scripts/studio-cc0-lifecycle-checks.mjs'
      - 'scripts/verify-studio-cc0-curated-ui.mjs'
      - 'scripts/*premium*.mts'
      - 'apps/web/public/assets/studio/cc0-20260906/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cc0-library-runtime:
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      HUSKY: '0'
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install the locked dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
      - name: Lint the focused asset implementation without rewriting source
        run: |
          # Repository-wide typecheck and build are required once by CI/core.
          # Keeping this lane focused prevents unrelated domain errors from fanning out here.
          pnpm exec eslint --max-warnings=0 apps/web/src/domains/creator/studio-cc0-curation.ts apps/web/src/domains/creator/studio-cc0-curation.test.ts apps/web/src/domains/creator/StudioCc0AssetLibraryPanel.tsx scripts/verify-studio-cc0-curated-ui.mjs scripts/studio-cc0-lifecycle-checks.mjs
      - name: Verify the catalog and existing asset contracts
        run: |
          pnpm exec vitest run apps/web/src/domains/creator/studio-cc0-curation.test.ts apps/web/src/domains/creator/studio-cc0-asset-delivery.test.ts apps/web/src/domains/creator/studio-original-free-asset-packs.test.ts apps/web/src/domains/creator/StudioOriginalAssetMarketplacePanel.test.tsx apps/web/src/domains/creator/studio-shared-asset-drag.test.ts apps/web/src/domains/creator/vrm/studio-vrm-outfit-static-asset-audit.test.ts
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Exercise actual assets and cancelled insertion recovery
        run: |
          node scripts/verify-studio-cc0-curated-ui.mjs "$RUNNER_TEMP/studio-cc0-ui"
      - name: Preserve the exact tested revision
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/studio-cc0-ui"
          git rev-parse HEAD > "$RUNNER_TEMP/studio-cc0-ui/tested-revision.txt"
          git diff --exit-code -- apps/web/src/domains/creator scripts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: studio-cc0-library-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/studio-cc0-ui/
          retention-days: 14
          if-no-files-found: error
