name: Isolated final safe branch prune

on:
  pull_request:
    branches:
      - "ops/final-safe-prune-base-20260910-1718"
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: isolated-final-safe-branch-prune-20260910-1718
  cancel-in-progress: true

jobs:
  prune:
    if: >-
      github.repository == 'blue45f/toonspectrum' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ops/final-safe-prune-trigger-20260910-1718' &&
      github.base_ref == 'ops/final-safe-prune-base-20260910-1718'
    runs-on: macos-14
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TRIGGER_PR: ${{ github.event.pull_request.number }}
      TRIGGER_HEAD: ${{ github.head_ref }}
      TRIGGER_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      TRIGGER_BASE: ${{ github.base_ref }}
      TRIGGER_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Verify canonical replacement and delete only exact obsolete refs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const repository = process.env.REPO;
          const [owner, repo] = repository.split('/');
          const token = process.env.GH_TOKEN;
          const triggerPr = Number(process.env.TRIGGER_PR);
          const triggerHead = process.env.TRIGGER_HEAD;
          const triggerHeadSha = process.env.TRIGGER_HEAD_SHA;
          const triggerBase = process.env.TRIGGER_BASE;
          const triggerBaseSha = process.env.TRIGGER_BASE_SHA;
          const apiRoot = 'https://api.github.com';
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'toonspectrum-isolated-final-safe-prune',
          };

          const candidates = [
            {
              branch: 'fix/code-scanning-alerts-20260910-v2',
              sha: '6fefb3f37ca46f4fc98cceaea8e0887bb0cb3cb3',
              mode: 'explicit_superseded_pr',
              sourcePr: 1261,
              needles: ['#1250이 더 강한 정본으로 이미 병합됨', '고유 제품 변경은 없습니다'],
            },
            {
              branch: 'fix/code-scanning-secure-comic-ids-20260910-v2',
              sha: '36d50360623885793ce3f445d5c132fd7c80d490',
              mode: 'canonical_tree_snapshot',
              messageNeedle: 'chore(security): rebase secure Comic Director IDs onto current main',
            },
            {
              branch: 'fix/studio-final-stability-20260910',
              sha: '518b6eb7e99142d16be70f5fab20a4d077414e04',
              mode: 'canonical_tree_snapshot',
              messageNeedle: 'chore(ops): absorb superseded BG3D template branch',
            },
            {
              branch: 'fix/vrm-preview-thumbnail-stability-20260910',
              sha: '0c473de64d24a599926a7c235219d7baff2b5866',
              mode: 'canonical_tree_snapshot',
              messageNeedle: 'absorb superseded VRM thumbnail bootstrap branch',
            },
            {
              branch: 'ops/branch-prune-sink-20260910-1702',
              sha: '361ef01b0e84a70648c4d94a04f2ea1d2d447d40',
              mode: 'canonical_tree_snapshot',
              messageNeedle: 'chore(ops): verify safe automatic branch deletion',
            },
          ];

          class HttpError extends Error {
            constructor(status, method, path, payload) {
              super(`${method} ${path} -> ${status}`);
              this.status = status;
              this.payload = payload;
            }
          }

          async function request(path, init = {}) {
            const method = init.method || 'GET';
            const response = await fetch(`${apiRoot}${path}`, {
              ...init,
              headers: {
                ...headers,
                ...(init.body ? { 'Content-Type': 'application/json' } : {}),
                ...(init.headers || {}),
              },
            });
            if (response.status === 204) return null;
            const text = await response.text();
            let payload = null;
            try { payload = text ? JSON.parse(text) : null; } catch { payload = text; }
            if (!response.ok) throw new HttpError(response.status, method, path, payload);
            return payload;
          }

          async function maybe(path) {
            try { return await request(path); }
            catch (error) { if (error.status === 404) return null; throw error; }
          }

          const encodeRef = (branch) => branch.split('/').map(encodeURIComponent).join('/');
          const openPulls = async (params) => request(`/repos/${owner}/${repo}/pulls?${new URLSearchParams({ state: 'open', per_page: '1', ...params })}`);
          const hasOpenReference = async (branch) => {
            const [heads, bases] = await Promise.all([
              openPulls({ head: `${owner}:${branch}` }),
              openPulls({ base: branch }),
            ]);
            return heads.length > 0 || bases.length > 0;
          };
          const row = (branch, sha, decision, evidence) => ({ branch, sha, decision, evidence });

          (async () => {
            const repoInfo = await request(`/repos/${owner}/${repo}`);
            if (repoInfo.default_branch !== 'main') throw new Error(`default branch changed to ${repoInfo.default_branch}`);

            const main = await request(`/repos/${owner}/${repo}/branches/main`);
            const mainSha = main.commit.sha;
            const canonicalPr = await request(`/repos/${owner}/${repo}/pulls/1250`);
            if (!canonicalPr.merged_at || canonicalPr.base?.ref !== 'main' || canonicalPr.head?.repo?.full_name !== repository) {
              throw new Error('canonical PR #1250 is no longer a verified merged main PR');
            }
            const canonicalSha = canonicalPr.merge_commit_sha;
            if (!/^[0-9a-f]{40}$/.test(canonicalSha || '')) throw new Error('canonical PR #1250 has invalid merge SHA');
            const reachability = await request(`/repos/${owner}/${repo}/compare/${mainSha}...${canonicalSha}`);
            if (Number(reachability.ahead_by ?? -1) !== 0) throw new Error('canonical PR #1250 is not reachable from current main');
            const canonicalCommit = await request(`/repos/${owner}/${repo}/commits/${canonicalSha}`);
            const canonicalTree = canonicalCommit.commit?.tree?.sha;
            if (!/^[0-9a-f]{40}$/.test(canonicalTree || '')) throw new Error('canonical main snapshot tree is unavailable');

            const results = [];
            for (const candidate of candidates) {
              const { branch, sha, mode } = candidate;
              try {
                if (['main', triggerHead, triggerBase].includes(branch) || !/^[0-9a-f]{40}$/.test(sha)) {
                  results.push(row(branch, sha, 'preserved', 'invalid_or_reserved_candidate'));
                  continue;
                }

                const branchPath = `/repos/${owner}/${repo}/branches/${encodeRef(branch)}`;
                const current = await maybe(branchPath);
                if (!current) {
                  results.push(row(branch, sha, 'already_missing', 'branch_absent'));
                  continue;
                }
                if (current.commit?.sha !== sha) {
                  results.push(row(branch, sha, 'preserved', `head_sha_changed:${current.commit?.sha || 'unknown'}`));
                  continue;
                }
                if (current.protected) {
                  results.push(row(branch, sha, 'preserved', 'protected_branch'));
                  continue;
                }
                if (await hasOpenReference(branch)) {
                  results.push(row(branch, sha, 'preserved', 'open_pull_request_reference'));
                  continue;
                }

                const commit = await request(`/repos/${owner}/${repo}/commits/${sha}`);
                if (mode === 'canonical_tree_snapshot') {
                  if (commit.commit?.tree?.sha !== canonicalTree) {
                    results.push(row(branch, sha, 'preserved', 'tree_differs_from_canonical_main_snapshot'));
                    continue;
                  }
                  if (!(commit.commit?.message || '').includes(candidate.messageNeedle)) {
                    results.push(row(branch, sha, 'preserved', 'expected_retirement_message_missing'));
                    continue;
                  }
                } else if (mode === 'explicit_superseded_pr') {
                  const source = await request(`/repos/${owner}/${repo}/pulls/${candidate.sourcePr}`);
                  const sourceText = `${source.title || ''}\n${source.body || ''}`;
                  const identityOk = source.state === 'closed'
                    && !source.merged_at
                    && source.base?.ref === 'main'
                    && source.head?.ref === branch
                    && source.head?.sha === sha
                    && source.head?.repo?.full_name === repository
                    && new Date(source.closed_at).getTime() > new Date(canonicalPr.merged_at).getTime();
                  if (!identityOk) {
                    results.push(row(branch, sha, 'preserved', 'superseded_pr_identity_or_timing_changed'));
                    continue;
                  }
                  if (!candidate.needles.every((needle) => sourceText.includes(needle))) {
                    results.push(row(branch, sha, 'preserved', 'superseded_pr_proof_changed'));
                    continue;
                  }
                } else {
                  results.push(row(branch, sha, 'preserved', 'unknown_proof_mode'));
                  continue;
                }

                const runs = await request(`/repos/${owner}/${repo}/actions/runs?${new URLSearchParams({ branch, per_page: '100' })}`);
                if ((runs.workflow_runs || []).some((run) => run.status !== 'completed')) {
                  results.push(row(branch, sha, 'preserved', 'active_workflow_run'));
                  continue;
                }

                const finalBranch = await maybe(branchPath);
                if (!finalBranch || finalBranch.commit?.sha !== sha || finalBranch.protected) {
                  results.push(row(branch, sha, 'preserved', 'changed_during_final_recheck'));
                  continue;
                }
                if (await hasOpenReference(branch)) {
                  results.push(row(branch, sha, 'preserved', 'new_open_pull_request'));
                  continue;
                }
                const ref = await maybe(`/repos/${owner}/${repo}/git/ref/heads/${encodeRef(branch)}`);
                if (!ref || ref.object?.sha !== sha) {
                  results.push(row(branch, sha, 'preserved', 'ref_changed_during_final_recheck'));
                  continue;
                }

                try {
                  await request(`/repos/${owner}/${repo}/git/refs/heads/${encodeRef(branch)}`, { method: 'DELETE' });
                  results.push(row(branch, sha, 'deleted', mode));
                } catch (error) {
                  results.push(row(branch, sha, 'failed', `delete_failed:${error.message}`));
                }
              } catch (error) {
                results.push(row(branch, sha, 'preserved', `safety_error:${error.message}`));
              }
            }

            const deleted = results.filter((item) => item.decision === 'deleted').length;
            const alreadyMissing = results.filter((item) => item.decision === 'already_missing').length;
            const preserved = results.filter((item) => item.decision === 'preserved').length;
            const failed = results.filter((item) => item.decision === 'failed').length;
            const lines = [
              '# Isolated final safe branch prune',
              '',
              `- Repository: \`${repository}\``,
              `- Current main: \`${mainSha}\``,
              `- Canonical security PR: #1250 at \`${canonicalSha}\``,
              `- Candidates: \`${candidates.length}\``,
              `- Deleted: \`${deleted}\``,
              `- Already missing: \`${alreadyMissing}\``,
              `- Preserved by safety checks: \`${preserved}\``,
              `- Delete failures: \`${failed}\``,
              '',
              '| Branch | Expected SHA | Decision | Evidence |',
              '|---|---|---|---|',
              ...results.map((item) => `| \`${item.branch}\` | \`${item.sha.slice(0, 12)}\` | ${item.decision} | ${item.evidence} |`),
            ];
            const report = `${lines.join('\n')}\n`;
            console.log(report);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, report);

            const [currentHead, currentBase] = await Promise.all([
              request(`/repos/${owner}/${repo}/branches/${encodeRef(triggerHead)}`),
              request(`/repos/${owner}/${repo}/branches/${encodeRef(triggerBase)}`),
            ]);
            if (currentHead.commit?.sha !== triggerHeadSha || currentHead.protected) throw new Error('isolated trigger head moved or became protected');
            if (currentBase.commit?.sha !== triggerBaseSha || currentBase.protected) throw new Error('isolated trigger base moved or became protected');

            await request(`/repos/${owner}/${repo}/pulls/${triggerPr}`, { method: 'PATCH', body: JSON.stringify({ state: 'closed' }) });
            await request(`/repos/${owner}/${repo}/git/refs/heads/${encodeRef(triggerHead)}`, { method: 'DELETE' });
            await request(`/repos/${owner}/${repo}/git/refs/heads/${encodeRef(triggerBase)}`, { method: 'DELETE' });

            const selfReport = `\n## Isolated runner cleanup\n\n- Closed temporary PR: #${triggerPr}\n- Deleted temporary head: \`${triggerHead}\`\n- Deleted temporary base: \`${triggerBase}\`\n- No file or commit was merged into \`main\`.\n`;
            console.log(selfReport);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, selfReport);
            if (failed > 0) process.exitCode = 1;
          })().catch((error) => {
            console.error(error.stack || String(error));
            process.exitCode = 1;
          });
          NODE
