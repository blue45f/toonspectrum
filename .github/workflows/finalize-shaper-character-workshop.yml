name: Finalize Shaper-inspired character workshop

on:
  push:
    branches:
      - feat/shaper-character-workshop-20260903

permissions:
  contents: write

concurrency:
  group: shaper-character-workshop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[shaper-workshop-finalized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/shaper-character-workshop-20260903
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Apply workshop migration when not already materialized
        run: |
          if [ -f scripts/apply-shaper-character-workshop.py ]; then
            if ! grep -q 'vrm-character-workshop-summary' src/domains/creator/vrm/StudioVrmAvatarForgePanel.tsx; then
              python3 scripts/apply-shaper-character-workshop.py
            fi
          fi
          git diff --check
          git status --short

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify changed TypeScript and React surfaces
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          mapfile -t FILES < <(git diff --name-only origin/feat/shaper-surface-paint-20260903...HEAD -- '*.ts' '*.tsx' '*.mts' '*.mjs')
          if [ ${#FILES[@]} -gt 0 ]; then
            pnpm exec eslint --max-warnings=0 "${FILES[@]}"
          fi

      - name: Run focused character-workshop tests
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          TESTS=()
          for file in \
            src/domains/creator/vrm/StudioVrmAvatarForgePanel.test.tsx \
            src/domains/creator/vrm/studio-vrm-avatar-forge.test.ts \
            src/domains/creator/vrm/StudioVrmPhotoPoseScanner.test.tsx \
            src/domains/creator/vrm/studio-vrm-photo-pose-application.test.ts \
            src/domains/creator/vrm/studio-vrm-avatar-reference-recommendations.test.ts; do
            [ -f "$file" ] && TESTS+=("$file")
          done
          pnpm exec vitest run "${TESTS[@]}"

      - name: Type-check web workspace
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm exec tsc -p tsconfig.json --noEmit --incremental false

      - name: Build production Studio
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm run build

      - name: Record verification evidence
        run: |
          mkdir -p docs/reports
          cat > docs/reports/shaper-character-workshop-evidence-2026-09-03.md <<'EOF'
          # Shaper-inspired character workshop evidence · 2026-09-03

          ## Product outcome

          - Replaces text/emoji-first character decisions with visual preset previews and a persistent current-character summary.
          - Adds search and category filtering so creators can narrow style, body, hair, and face recipes without traversing every tab.
          - Adds face-shape recipes and precision range-plus-number controls for repeatable customization.
          - Adds coordinated hair/base/accent colour recipes and a toon-oriented hair silhouette treatment.
          - Adds source-photo overlay review and partial pose application so creators can keep useful body regions instead of accepting or rejecting a whole estimate.
          - Preserves the existing local-only recognition, VRM document, undo, persistence, capture, and export boundaries.

          ## Verification gates

          - Changed-file ESLint with zero warnings.
          - Focused Avatar Forge, photo-pose, and recommendation regression tests.
          - Root web TypeScript no-emit check.
          - Production Studio build.

          ## Deliberate capability boundary

          The workshop does not invent eye, nose, or mouth morph targets that a loaded VRM does not expose. Fine facial controls remain model-capability-aware; whole-head scaling is not relabelled as detailed facial sculpting.
          EOF

      - name: Commit verified product implementation
        run: |
          rm -f scripts/apply-shaper-character-workshop.py
          rm -f .github/workflows/bootstrap-shaper-character-workshop.yml
          rm -f .github/workflows/finalize-shaper-character-workshop.yml
          git config user.name "toonstudio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit --no-verify -m "feat(studio): finalize visual character workshop [shaper-workshop-finalized]"
          git push --no-verify origin HEAD:feat/shaper-character-workshop-20260903
