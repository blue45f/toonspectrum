name: Studio premium asset preparation
on:
  push:
    branches: [codex/studio-premium-assets-20260913]
    paths:
      - .github/workflows/studio-premium-assets-prepare.yml
      - scripts/studio-premium-assets-20260913.py
      - data/studio-assets/premium-20260913-decisions.json
permissions:
  contents: write
concurrency:
  group: studio-premium-assets-20260913
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/codex/studio-premium-assets-20260913'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/studio-premium-assets-20260913
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated asset tooling
        run: |
          python -m pip install Pillow==11.3.0 numpy==2.2.6
          mkdir -p /tmp/toon-asset-tools
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          fs.writeFileSync('/tmp/toon-asset-tools/package.json', JSON.stringify({private:true,dependencies:{three:pkg.dependencies.three,playwright:pkg.devDependencies.playwright}}));
          JS
          npm install --prefix /tmp/toon-asset-tools --ignore-scripts --no-audit --no-fund
          /tmp/toon-asset-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Acquire and render candidates without changing the active catalog
        run: |
          set -euo pipefail
          STAGE=artifacts/studio-premium-20260913
          if [ ! -f "$STAGE/manifest.json" ]; then
            python scripts/acquire_studio_pbr_assets.py --output "$STAGE" --exclude-manifest apps/web/public/assets/studio/cc0-20260906/manifest.json --profile expansion --max-download-mib 1024
            node scripts/render_studio_asset_delivery.mjs "$STAGE" /tmp/toon-asset-tools
          fi
          if [ -f scripts/studio-premium-assets-20260913.py ]; then
            python scripts/studio-premium-assets-20260913.py "$STAGE"
          fi
      - name: Publish only explicitly reviewed candidates
        if: hashFiles('data/studio-assets/premium-20260913-decisions.json') != ''
        run: node scripts/publish-studio-asset-expansion.mjs artifacts/studio-premium-20260913 data/studio-assets/premium-20260913-decisions.json
      - name: Record branch-only assets and review evidence
        run: |
          set -euo pipefail
          git config user.name 'ToonStudio asset preparation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f artifacts/studio-premium-20260913/manifest.json artifacts/studio-premium-20260913/delivery-report.json artifacts/studio-premium-20260913/browser-render-evidence.json artifacts/studio-premium-20260913/source-receipts.json
          git add -f artifacts/studio-premium-20260913/assets artifacts/studio-premium-20260913/previews
          if [ -d artifacts/studio-premium-20260913/review ]; then git add -f artifacts/studio-premium-20260913/review; fi
          git add apps/web/public/assets/studio/cc0-20260906
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(studio): stage verified CC0 originals for explicit visual review'
          git push origin HEAD:refs/heads/codex/studio-premium-assets-20260913
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-premium-assets-review-${{ github.run_id }}
          path: |
            artifacts/studio-premium-20260913/*.json
            artifacts/studio-premium-20260913/previews/
            artifacts/studio-premium-20260913/review/
          retention-days: 7
          if-no-files-found: warn
