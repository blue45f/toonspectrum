name: Publish reviewed premium assets
on:
  push:
    branches: [codex/studio-premium-assets-20260913]
    paths:
      - data/studio-assets/premium-20260913-decisions.json
permissions:
  contents: write
concurrency:
  group: studio-premium-assets-20260913
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/codex/studio-premium-assets-20260913'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/studio-premium-assets-20260913
          fetch-depth: 100
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require completed technical evidence
        run: |
          set -euo pipefail
          test -f artifacts/studio-premium-20260913/manifest.json
          test -f artifacts/studio-premium-20260913/mobile-admission-report.json
          test -f artifacts/studio-premium-20260913/rendered-prop-candidates.json
          test -f artifacts/studio-premium-20260913/derivative-packaging-report.json
          node --experimental-strip-types --test scripts/studio-premium-catalog.test.mts
      - name: Publish SHA-bound visual decisions and preserve previous catalog
        run: |
          set -euo pipefail
          STAGE=artifacts/studio-premium-20260913
          if [ ! -f "$STAGE/publication-report.json" ]; then
            node scripts/publish-studio-asset-expansion.mjs "$STAGE" data/studio-assets/premium-20260913-decisions.json
          fi
          node scripts/finalize-studio-premium-release.mjs
      - name: Commit publication and remove temporary preparation payloads
        run: |
          set -euo pipefail
          git config user.name 'ToonStudio asset preparation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A apps/web/public/assets/studio/cc0-20260906 .github/workflows/studio-premium-assets-prepare.yml docs/reports/studio-premium-assets-20260913.md
          git add -u artifacts/studio-premium-20260913
          git add -f artifacts/studio-premium-20260913/*.json artifacts/studio-premium-20260913/review
          git commit -m 'feat(studio): publish visually selected high-resolution CC0 assets'
          git fetch origin codex/studio-premium-assets-20260913 --depth=100
          git rebase FETCH_HEAD
          git push origin HEAD:refs/heads/codex/studio-premium-assets-20260913
      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-premium-publication-${{ github.run_id }}
          path: |
            artifacts/studio-premium-20260913/*.json
            artifacts/studio-premium-20260913/review/
          retention-days: 7
          if-no-files-found: error
