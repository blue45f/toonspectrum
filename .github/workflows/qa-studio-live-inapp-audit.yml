name: QA Studio live in-app full audit

on:
  push:
    branches:
      - qa/studio-inapp-full-audit-20260902
    paths:
      - scripts/qa-live-studio-inapp-audit.mjs
      - .github/workflows/qa-studio-live-inapp-audit.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qa-studio-live-inapp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  studio-audit:
    name: Studio live and in-app browser audit
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      REPORT_ROOT: qa-results/studio-inapp-audit-2026-09-02
      STUDIO_BASE_URL: https://www.toonstudio.cloud
      CI: true

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare result folders
        run: |
          mkdir -p "$REPORT_ROOT/logs" artifacts/studio-live-inapp artifacts/studio-local-inapp
          printf '%s\n' "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > "$REPORT_ROOT/workflow-url.txt"
          printf '%s\n' "${{ github.sha }}" > "$REPORT_ROOT/source-sha.txt"

      - name: Audit the live deployment with Korean in-app browser profiles
        shell: bash
        run: |
          set +e
          QA_REPORT_DIR="$REPORT_ROOT/live" \
          QA_EVIDENCE_DIR="artifacts/studio-live-inapp" \
          node scripts/qa-live-studio-inapp-audit.mjs 2>&1 | tee "$REPORT_ROOT/logs/live-inapp.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$REPORT_ROOT/live-inapp.exit-code"
          exit 0

      - name: Build production Studio assets
        shell: bash
        run: |
          set +e
          pnpm run build 2>&1 | tee "$REPORT_ROOT/logs/build.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$REPORT_ROOT/build.exit-code"
          exit 0

      - name: Sweep every local Studio route under in-app browser conditions
        shell: bash
        run: |
          set +e
          TOONSPECTRUM_INAPP_VERIFY_DIR="$PWD/artifacts/studio-local-inapp" \
          pnpm run verify:studio-inapp-browser 2>&1 | tee "$REPORT_ROOT/logs/local-inapp-browser.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$REPORT_ROOT/local-inapp-browser.exit-code"
          exit 0

      - name: Probe Studio top chrome on mobile viewports
        shell: bash
        run: |
          set +e
          pnpm run verify:studio-mobile-top 2>&1 | tee "$REPORT_ROOT/logs/mobile-top.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$REPORT_ROOT/mobile-top.exit-code"
          exit 0

      - name: Exercise the 3D editor inside in-app browser profiles
        shell: bash
        run: |
          set +e
          pnpm run verify:studio-bg3d-inapp-editor 2>&1 | tee "$REPORT_ROOT/logs/bg3d-inapp-editor.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$REPORT_ROOT/bg3d-inapp-editor.exit-code"
          exit 0

      - name: Run comprehensive Studio and marketplace browser interactions
        shell: bash
        run: |
          set +e
          pnpm run test:market:e2e 2>&1 | tee "$REPORT_ROOT/logs/studio-browser-e2e.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$REPORT_ROOT/studio-browser-e2e.exit-code"
          exit 0

      - name: Verify the real 3D visual surface
        shell: bash
        run: |
          set +e
          pnpm run verify:studio-3d-visual 2>&1 | tee "$REPORT_ROOT/logs/studio-3d-visual.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$REPORT_ROOT/studio-3d-visual.exit-code"
          exit 0

      - name: Verify the real p5 brush runtime
        shell: bash
        run: |
          set +e
          pnpm run verify:studio-p5-brush-real-runtime 2>&1 | tee "$REPORT_ROOT/logs/studio-p5-brush-runtime.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$REPORT_ROOT/studio-p5-brush-runtime.exit-code"
          exit 0

      - name: Build aggregate audit report
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.REPORT_ROOT;
          const suites = [
            ['live-inapp', 'Live deployment: KakaoTalk/Instagram/NAVER route sweep'],
            ['build', 'Production build'],
            ['local-inapp-browser', 'Local production build: complete in-app route sweep'],
            ['mobile-top', 'Mobile top chrome and responsive viewport checks'],
            ['bg3d-inapp-editor', '3D editor in embedded WebView profiles'],
            ['studio-browser-e2e', 'Marketplace + comprehensive browser + Studio full verification'],
            ['studio-3d-visual', 'Real 3D visual surface verification'],
            ['studio-p5-brush-runtime', 'Real p5 brush runtime verification'],
          ];
          const results = suites.map(([id, label]) => {
            const codePath = path.join(root, `${id}.exit-code`);
            const code = fs.existsSync(codePath) ? Number(fs.readFileSync(codePath, 'utf8').trim()) : 999;
            return { id, label, exitCode: code, ok: code === 0 };
          });
          let live = null;
          const livePath = path.join(root, 'live', 'summary.json');
          if (fs.existsSync(livePath)) live = JSON.parse(fs.readFileSync(livePath, 'utf8'));
          const summary = {
            generatedAt: new Date().toISOString(),
            repository: process.env.GITHUB_REPOSITORY,
            runId: process.env.GITHUB_RUN_ID,
            sourceSha: process.env.GITHUB_SHA,
            target: process.env.STUDIO_BASE_URL,
            suites,
            passedSuites: results.filter((result) => result.ok).length,
            failedSuites: results.filter((result) => !result.ok).length,
            live,
          };
          fs.writeFileSync(path.join(root, 'summary.json'), `${JSON.stringify(summary, null, 2)}\n`);
          const lines = [
            '# ToonStudio full in-app browser audit',
            '',
            `- Generated: ${summary.generatedAt}`,
            `- Target: ${summary.target}`,
            `- Source SHA: ${summary.sourceSha}`,
            `- GitHub Actions run: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            `- Suites: ${summary.passedSuites} passed / ${summary.failedSuites} failed`,
            '',
            '## Suite results',
            '',
            '| Suite | Result | Exit code |',
            '|---|---:|---:|',
            ...results.map((result) => `| ${result.label} | ${result.ok ? 'PASS' : 'FAIL'} | ${result.exitCode} |`),
          ];
          if (live) {
            lines.push(
              '',
              '## Live deployment matrix',
              '',
              `- Cases: ${live.caseCount}`,
              `- Passed: ${live.passed}`,
              `- Failed: ${live.failed}`,
              `- Cases with warnings: ${live.warningCases}`,
              '',
              'See `live/report.md` and `live/summary.json` for route-level evidence.',
            );
          }
          fs.writeFileSync(path.join(root, 'report.md'), `${lines.join('\n')}\n`);
          NODE

      - name: Upload screenshots, traces, logs, and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-inapp-full-audit-2026-09-02
          if-no-files-found: warn
          retention-days: 30
          path: |
            qa-results/studio-inapp-audit-2026-09-02
            artifacts/studio-live-inapp
            artifacts/studio-local-inapp
            playwright-report
            test-results

      - name: Commit the textual audit evidence to the audit branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT_ROOT"
          if git diff --cached --quiet; then
            echo "No textual audit result changes to commit."
            exit 0
          fi
          git commit -m "test(qa): record Studio in-app audit evidence [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Enforce aggregate result
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync(`${process.env.REPORT_ROOT}/summary.json`, 'utf8'));
          if (summary.failedSuites > 0) {
            console.error(`${summary.failedSuites} audit suites failed`);
            process.exit(1);
          }
          console.log('All Studio audit suites passed.');
          NODE
