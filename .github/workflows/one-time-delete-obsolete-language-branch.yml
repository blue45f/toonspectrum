name: One-time obsolete language branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-delete-obsolete-language-branch.yml

permissions:
  contents: write

jobs:
  delete-obsolete-branch:
    if: github.repository == 'blue45f/toonspectrum'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete superseded source branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: heads/feat/global-language-support-20260916
        shell: bash
        run: |
          set -euo pipefail

          get_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/${TARGET_REF}"
          delete_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/refs/${TARGET_REF}"
          response_file="$(mktemp)"

          get_status="$(curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${get_url}")"

          if [[ "${get_status}" == "404" ]]; then
            echo "Target branch is already absent."
            exit 0
          fi

          if [[ "${get_status}" != "200" ]]; then
            cat "${response_file}"
            echo "Unable to confirm target branch; HTTP ${get_status}." >&2
            exit 1
          fi

          delete_status="$(curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
            --request DELETE \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${delete_url}")"

          if [[ "${delete_status}" != "204" ]]; then
            cat "${response_file}"
            echo "Branch deletion failed; HTTP ${delete_status}." >&2
            exit 1
          fi

          echo "Deleted feat/global-language-support-20260916."
