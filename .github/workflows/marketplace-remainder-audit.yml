name: Marketplace remainder audit

on:
  push:
    branches: [fix/marketplace-remaining-integrity-20260905]
    paths: [.github/workflows/marketplace-remainder-audit.yml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Compare closed social lane with the integration base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin \
            a9414cb996766c400559feaacb31b1bc0139499c \
            1811b10153eba0aa8fd55fdda3f0e28b868592b8
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          base = 'a9414cb996766c400559feaacb31b1bc0139499c'
          old = '1811b10153eba0aa8fd55fdda3f0e28b868592b8'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True)
          paths = git('diff', '--name-only', base, old).splitlines()
          lines = []
          for path in paths:
              old_file = subprocess.run(['git', 'show', old + ':' + path], capture_output=True)
              current = Path(path)
              if old_file.returncode != 0:
                  state = 'REMOVAL_ALREADY_APPLIED' if not current.exists() else 'OLD_REMOVAL_NOT_APPLIED'
              elif not current.exists():
                  state = 'MISSING'
              elif old_file.stdout == current.read_bytes():
                  state = 'IDENTICAL'
              else:
                  state = 'DIFFERS_REVIEW_REQUIRED'
              lines.append(state + '\t' + path)
              if state in ('DIFFERS_REVIEW_REQUIRED', 'OLD_REMOVAL_NOT_APPLIED'):
                  print(git('diff', '--no-ext-diff', old, 'HEAD', '--', path))
          report = '\n'.join(lines) + '\n'
          print(report)
          Path('marketplace-remainder-audit.txt').write_text(report)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-remainder-audit
          path: marketplace-remainder-audit.txt
          if-no-files-found: error
          retention-days: 3
