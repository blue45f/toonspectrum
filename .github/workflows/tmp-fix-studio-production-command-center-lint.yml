name: Temporary fix Studio production command center lint

on:
  push:
    branches:
      - feat/studio-production-command-center-v2-20260905
    paths:
      - .github/workflows/tmp-fix-studio-production-command-center-lint.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-studio-production-command-center-lint
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/studio-production-command-center-v2-20260905
          fetch-depth: 0

      - name: Apply the exact lint fix and remove this bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/domains/creator/studio-production/StudioProductionHubPage.tsx')
          source = path.read_text(encoding='utf-8')
          before = 'export const STUDIO_PRODUCTION_SURFACES = ['
          after = 'const STUDIO_PRODUCTION_SURFACES = ['
          if source.count(before) != 1:
              raise SystemExit(f'unexpected export count: {source.count(before)}')
          path.write_text(source.replace(before, after, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/tmp-fix-studio-production-command-center-lint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(studio): keep production route constants module-private'
          git push origin HEAD:feat/studio-production-command-center-v2-20260905
