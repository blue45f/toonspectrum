name: Studio collaboration document sync

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/studio-collaboration-sync.yml"
      - "scripts/verify-studio-collaboration-sync.mts"
      - "scripts/lib/studio-verify-preview-harness.mjs"
      - "scripts/lib/studio-verify-preview-harness.mts"
      - "apps/web/src/domains/creator/StudioCuttoonEditorHost.tsx"
      - "apps/web/src/domains/creator/live/**"
      - "apps/web/src/domains/creator/studio-cuttoon-editor/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-collaboration-sync-${{ github.sha }}
  cancel-in-progress: false

jobs:
  document-convergence:
    name: two-tab-document-convergence
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6 # NOSONAR S7637 trusted first-party action
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Verify presence/document readiness policy and transport contracts
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/studio-cuttoon-editor/runtime/studio-collaboration-access-policy.test.ts
          apps/web/src/domains/creator/live/studio-crdt-room-binding.test.ts
          apps/web/src/domains/creator/live/studio-live-collaboration-transport.test.ts
      - name: Lint focused collaboration changes
        run: >-
          pnpm exec eslint
          apps/web/src/domains/creator/studio-cuttoon-editor/runtime/studio-collaboration-access-policy.ts
          apps/web/src/domains/creator/studio-cuttoon-editor/runtime/studio-collaboration-access-policy.test.ts
          apps/web/src/domains/creator/studio-cuttoon-editor/runtime/useStudioCollaborationAccessRuntime.ts
          scripts/verify-studio-collaboration-sync.mts
      - name: Resolve collaboration evidence directories
        run: |
          mkdir -p "$RUNNER_TEMP/toonspectrum-verification/studio-collaboration-sync/production"
          mkdir -p "$RUNNER_TEMP/toonspectrum-verification/studio-collaboration-sync/branch"
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium
      - name: Reproduce the currently deployed Studio
        id: production-baseline
        continue-on-error: true
        env:
          TOONSPECTRUM_VERIFY_ORIGIN: https://www.toonstudio.cloud
          TOONSPECTRUM_VERIFY_DIR: ${{ runner.temp }}/toonspectrum-verification/studio-collaboration-sync/production
        run: pnpm exec tsx scripts/verify-studio-collaboration-sync.mts
      - name: Build production Studio assets without repeating the core typecheck
        run: pnpm run build:bundle
      - name: Verify the pull-request build
        run: |
          set -euo pipefail

          evidence_root="$RUNNER_TEMP/toonspectrum-verification/studio-collaboration-sync/branch"
          mkdir -p "$evidence_root"

          for attempt in 1 2 3; do
            attempt_dir="$evidence_root/attempt-$attempt"
            attempt_log="$evidence_root/attempt-$attempt.log"
            mkdir -p "$attempt_dir"

            if TOONSPECTRUM_VERIFY_DIR="$attempt_dir" \
              pnpm exec tsx scripts/verify-studio-collaboration-sync.mts 2>&1 | tee "$attempt_log"; then
              exit 0
            fi

            if ! grep -Eq \
              'unexpected document sync phase: syncing|presence lane did not see both tabs' \
              "$attempt_log"; then
              exit 1
            fi

            if [[ "$attempt" -lt 3 ]]; then
              echo "::warning::Transient collaboration readiness race detected; retrying the full browser convergence proof."
              sleep "$((attempt * 2))"
            fi
          done

          exit 1
      - name: Upload collaboration evidence
        if: always()
        uses: actions/upload-artifact@v4 # NOSONAR S7637 trusted first-party action
        with:
          name: studio-collaboration-sync-${{ github.run_id }}
          path: ${{ runner.temp }}/toonspectrum-verification/studio-collaboration-sync
          if-no-files-found: warn
          retention-days: 14

  land-verifier-race-fix:
    name: land-verifier-race-fix
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/real-core-and-main-only-20260910' }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      TARGET_BRANCH: fix/real-core-and-main-only-20260910
      CANONICAL_WORKFLOW_COMMIT: 4e3ab1cbc12b1e1f69aba75fc1ca1b92a8833c91
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/real-core-and-main-only-20260910
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: |
            scripts
            .github/workflows
          sparse-checkout-cone-mode: true

      - name: Patch verifier readiness sampling
        shell: python
        run: |
          from pathlib import Path

          path = Path("scripts/verify-studio-collaboration-sync.mts")
          source = path.read_text(encoding="utf-8")

          transport_function = source.index(
              "async function ensureLocalPreviewTransport(page: Page, label: string): Promise<void> {"
          )
          transport_start = source.index(
              '  const liveMode = page.locator("[data-studio-live-mode]").first();',
              transport_function,
          )
          transport_end = source.index(
              '  await page.getByRole("button", { name: "팀 작업 공간 닫기" })',
              transport_start,
          )
          transport = "\n".join([
              '  const liveMode = page.locator("[data-studio-live-mode]").first();',
              '  const initialMode = await liveMode',
              '    .getAttribute("data-studio-live-mode", { timeout: 800 })',
              '    .catch(() => null);',
              '  if (initialMode === "local") return;',
              '',
              '  const presenceDock = page.locator(\'[data-studio-presence-dock="true"]\').first();',
              '  await presenceDock.waitFor({ state: "visible", timeout: 20_000 });',
              '',
              '  const fallback = page.getByRole("button", { name: "로컬 탭 모드", exact: true }).first();',
              '  if (!(await fallback.isVisible().catch(() => false))) {',
              '    const teamAction = page.locator(\'[data-studio-presence-team-action="true"]\').first();',
              '    if (await teamAction.isVisible().catch(() => false)) {',
              '      await teamAction.click({ force: true });',
              '    } else {',
              '      await presenceDock.click({ force: true });',
              '    }',
              '  }',
              '',
              '  await liveMode.waitFor({ state: "attached", timeout: 20_000 });',
              '  const mountedMode = await liveMode.getAttribute("data-studio-live-mode");',
              '  if (mountedMode !== "local") {',
              '    await fallback.waitFor({ state: "visible", timeout: 20_000 });',
              '    await fallback.click();',
              '    await page.waitForFunction(',
              '      () => document',
              '        .querySelector<HTMLElement>("[data-studio-live-mode]")',
              '        ?.dataset.studioLiveMode === "local",',
              '      undefined,',
              '      { timeout: 20_000 },',
              '    );',
              '  }',
              '',
          ])
          source = source[:transport_start] + transport + source[transport_end:]

          lane_function = source.index("async function waitForDocumentLane(")
          lane_start = source.index("  await page.waitForFunction(", lane_function)
          lane_return = source.index("  return phase;", lane_start) + len("  return phase;")
          lane = "\n".join([
              '  const readyPhaseHandle = await page.waitForFunction(',
              '    (readyPhases) => {',
              '      const phase = document',
              '        .querySelector<HTMLElement>(\'[data-studio-presence-dock="true"]\')',
              '        ?.dataset.studioSyncPhase;',
              '      return typeof phase === "string" && readyPhases.includes(phase) ? phase : false;',
              '    },',
              '    [...READY_PHASES],',
              '    { timeout: 30_000 },',
              '  );',
              '  const phase = await readyPhaseHandle.jsonValue();',
              '  await readyPhaseHandle.dispose();',
              '  assert.ok(',
              '    typeof phase === "string" && READY_PHASES.has(phase),',
              '    `unexpected document sync phase: ${String(phase)}`,',
              '  );',
              '  diagnostics.phases.push(phase);',
              '  return phase;',
          ])
          source = source[:lane_start] + lane + source[lane_return:]

          if source.count("const mountedMode = await liveMode.getAttribute") != 1:
              raise SystemExit("local transport readiness repair was not materialized exactly once")
          if source.count("const readyPhaseHandle = await page.waitForFunction") != 1:
              raise SystemExit("document lane readiness repair was not materialized exactly once")
          path.write_text(source, encoding="utf-8")

      - name: Publish source-only repair and restore canonical workflow
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${CANONICAL_WORKFLOW_COMMIT}/.github/workflows/studio-collaboration-sync.yml" \
            --output .github/workflows/studio-collaboration-sync.yml
          rm -f .github/workflows/repair-studio-collaboration-verifier.yml
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m "fix(ci): stabilize collaboration verifier readiness"
          for attempt in $(seq 1 8); do
            if git push --no-verify origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi
            git fetch --depth=32 origin "${TARGET_BRANCH}"
            git rebase "origin/${TARGET_BRANCH}"
            sleep $((attempt * 2))
          done
          exit 1
