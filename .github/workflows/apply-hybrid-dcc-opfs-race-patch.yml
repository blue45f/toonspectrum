name: Apply Hybrid DCC OPFS race patch

on:
  push:
    branches:
      - fix/hybrid-dcc-opfs-snapshot-race-20260908

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the issue branch
        uses: actions/checkout@v4
        with:
          ref: fix/hybrid-dcc-opfs-snapshot-race-20260908

      - name: Apply the bounded verifier and regression-test patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path("scripts/verify-studio-hybrid-dcc-integration.mts")
          source = source_path.read_text(encoding="utf-8")
          start_marker = "async function readHybridDccOpfsFiles(page: Page): Promise<readonly StudioHybridDccOpfsFileEvidence[]> {"
          end_marker = "\n\nfunction studioHybridDccOpfsFileIdentity"
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit("Hybrid DCC OPFS reader boundary changed; refusing an unbounded patch")
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          replacement = r'''async function readHybridDccOpfsFiles(page: Page): Promise<readonly StudioHybridDccOpfsFileEvidence[]> {
            const files = await page.evaluate(async ({ rootName, maxAttempts, retryDelayMs }) => {
              type DirectoryWithEntries = FileSystemDirectoryHandle & {
                entries(): AsyncIterableIterator<[string, FileSystemHandle]>;
              };
              interface OpfsSnapshot {
                files: Array<{ path: string; byteLength: number; sha256: `sha256:${string}` }>;
                transientNotFound: boolean;
              }

              const isTransientNotFound = (error: unknown): boolean => (
                error instanceof DOMException && error.name === "NotFoundError"
              );

              const readSnapshot = async (): Promise<OpfsSnapshot> => {
                const storage = navigator.storage;
                if (typeof storage?.getDirectory !== "function") {
                  return { files: [], transientNotFound: false };
                }
                const root = await storage.getDirectory();
                const output: Array<{ path: string; byteLength: number; sha256: `sha256:${string}` }> = [];
                const pending: Array<{ directory: FileSystemDirectoryHandle; prefix: string }> = [{
                  directory: root,
                  prefix: "",
                }];
                let transientNotFound = false;

                while (pending.length > 0) {
                  const current = pending.pop();
                  if (!current) break;
                  try {
                    for await (const [name, handle] of (current.directory as DirectoryWithEntries).entries()) {
                      const path = current.prefix ? `${current.prefix}/${name}` : name;
                      if (handle.kind === "directory") {
                        pending.push({ directory: handle as FileSystemDirectoryHandle, prefix: path });
                        continue;
                      }
                      try {
                        const file = await (handle as FileSystemFileHandle).getFile();
                        const bytes = await file.arrayBuffer();
                        const digest = new Uint8Array(await crypto.subtle.digest("SHA-256", bytes));
                        let digestHex = "";
                        for (const value of digest) digestHex += value.toString(16).padStart(2, "0");
                        output.push({
                          path,
                          byteLength: file.size,
                          sha256: `sha256:${digestHex}`,
                        });
                      } catch (error) {
                        if (!isTransientNotFound(error)) throw error;
                        // OPFS writers replace files atomically. A handle yielded just before the
                        // replacement can disappear before getFile()/arrayBuffer(); discard the
                        // whole partial snapshot and retry rather than reporting incomplete proof.
                        transientNotFound = true;
                      }
                    }
                  } catch (error) {
                    if (!isTransientNotFound(error)) throw error;
                    // A directory can likewise be replaced while its async iterator is active.
                    transientNotFound = true;
                  }
                }

                return {
                  files: output
                    .filter(({ path }) => path.startsWith(`${rootName}/`))
                    .sort((left, right) => left.path.localeCompare(right.path)),
                  transientNotFound,
                };
              };

              for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
                const snapshot = await readSnapshot();
                if (!snapshot.transientNotFound) return snapshot.files;
                if (attempt < maxAttempts) {
                  await new Promise<void>((resolve) => {
                    setTimeout(resolve, retryDelayMs * attempt);
                  });
                }
              }

              throw new Error(`Hybrid DCC OPFS snapshot did not stabilize after ${maxAttempts} attempts`);
            }, {
              rootName: HYBRID_DCC_OPFS_ROOT,
              maxAttempts: 5,
              retryDelayMs: 25,
            });
            return files;
          }'''
          source_path.write_text(source[:start] + replacement + source[end:], encoding="utf-8")

          test_path = Path("scripts/verify-studio-hybrid-dcc-integration.test.ts")
          test_source = test_path.read_text(encoding="utf-8")
          insertion_marker = '  it("accepts the complete shipped-UI, OPFS reload, GLB Worker, BG3D, and reopen proof", () => {'
          if test_source.count(insertion_marker) != 1:
              raise SystemExit("Hybrid DCC integration test insertion boundary changed")
          regression = r'''  it("retries transient OPFS replacement races without accepting partial evidence", () => {
            const source = readFileSync(
              new URL("./verify-studio-hybrid-dcc-integration.mts", import.meta.url),
              "utf8",
            );
            const readerStart = source.indexOf("async function readHybridDccOpfsFiles");
            const readerEnd = source.indexOf("function studioHybridDccOpfsFileIdentity", readerStart);
            const reader = source.slice(readerStart, readerEnd);

            expect(reader).toContain('error instanceof DOMException && error.name === "NotFoundError"');
            expect(reader).toContain("transientNotFound = true");
            expect(reader).toContain("if (!snapshot.transientNotFound) return snapshot.files");
            expect(reader).toContain("maxAttempts: 5");
            expect(reader).toContain("Hybrid DCC OPFS snapshot did not stabilize");
          });

          '''
          test_path.write_text(
              test_source.replace(insertion_marker, regression + insertion_marker, 1),
              encoding="utf-8",
          )
          PY

          rm .github/workflows/apply-hybrid-dcc-opfs-race-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-studio-hybrid-dcc-integration.mts \
            scripts/verify-studio-hybrid-dcc-integration.test.ts \
            .github/workflows/apply-hybrid-dcc-opfs-race-patch.yml
          git commit -m "fix(verify): retry atomic OPFS replacement races"
          git push origin HEAD:fix/hybrid-dcc-opfs-snapshot-race-20260908
