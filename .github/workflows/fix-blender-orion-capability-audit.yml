name: Finalize Blender Orion capability audit

on:
  push:
    branches:
      - feat/blender-character-quality-pipeline-20260904

permissions:
  contents: write

concurrency:
  group: finalize-blender-orion-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-and-commit:
    if: ${{ !contains(github.event.head_commit.message, '[blender-orion-audit-fixed]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Check out pipeline branch
        uses: actions/checkout@v6
        with:
          ref: feat/blender-character-quality-pipeline-20260904
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Apply capability-aware audit fixes
        run: python3 scripts/fix-blender-orion-capability-audit.py

      - name: Preserve migrated Python indentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/blender/toonstudio_blender_kit/quality.py")
          source = path.read_text(encoding="utf-8")
          broken = "\n   if degenerate_total > budget.max_degenerate_faces:"
          fixed = "\n    if degenerate_total > budget.max_degenerate_faces:"
          if broken not in source:
              raise SystemExit("expected migration indentation boundary was not found")
          path.write_text(source.replace(broken, fixed, 1), encoding="utf-8")
          PY

      - name: Validate Python, JSON and diff
        run: |
          python3 -m py_compile \
            tools/blender/toonstudio_blender_kit/contracts.py \
            tools/blender/toonstudio_blender_kit/quality.py \
            tools/blender/toonstudio_blender_kit/face.py \
            tools/blender/toonstudio_blender_kit/vrm.py \
            tools/blender/toonstudio_blender_kit/pipeline.py \
            tests/blender/test_pipeline_regressions.py
          python3 -m json.tool config/blender/reference-character.json >/dev/null
          python3 -m json.tool config/blender/avatar-orion-production.json >/dev/null
          python3 -m json.tool config/blender/toonstudio-character-pipeline.schema.json >/dev/null
          git diff --check
          git status --short

      - name: Run pure Blender-pipeline contracts
        run: python3 -m unittest discover -s tests/blender -p 'test_*.py'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository and package checks
        run: |
          pnpm run validate:architecture
          node scripts/verify-blender-character-pipeline.mjs
          pnpm exec eslint --max-warnings=0 \
            src/domains/creator/vrm/studio-vrm-blender-character-package.ts \
            src/domains/creator/vrm/studio-vrm-blender-character-package.test.ts
          pnpm exec vitest run src/domains/creator/vrm/studio-vrm-blender-character-package.test.ts
          pnpm exec tsc -p tsconfig.json --noEmit --incremental false

      - name: Commit verified fixes
        run: |
          rm -f scripts/fix-blender-orion-capability-audit.py
          rm -f .github/workflows/fix-blender-orion-capability-audit.yml
          git config user.name "toonstudio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit --no-verify -m "fix(blender): make Orion quality audit capability-aware [blender-orion-audit-fixed]"
          git push --no-verify origin HEAD:feat/blender-character-quality-pipeline-20260904
