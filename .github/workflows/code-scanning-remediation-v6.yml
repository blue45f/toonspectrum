name: Final CodeQL remediation and protected merge

on:
  push:
    branches:
      - codex/code-scanning-remediation-20260908
    paths:
      - .github/workflows/code-scanning-remediation-v6.yml
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  models: read
  pull-requests: write
  security-events: read
  statuses: read

concurrency:
  group: final-codeql-remediation-v6
  cancel-in-progress: true

env:
  TARGET_BRANCH: codex/code-scanning-remediation-20260908

jobs:
  takeover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      proceed: ${{ steps.branch.outputs.proceed }}
    steps:
      - name: Confirm remediation branch still exists
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          encoded="${TARGET_BRANCH//\//%2F}"
          if gh api "/repos/${GITHUB_REPOSITORY}/branches/${encoded}" >/dev/null 2>&1; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cancel superseded remediation runs
        if: steps.branch.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          names='[
            "Code scanning autofix",
            "Code scanning remediation gate",
            "Trigger code scanning remediation gate",
            "Complete CodeQL remediation",
            "Collision-safe CodeQL remediation fallback",
            "AI-assisted residual CodeQL remediation",
            "Iterative CodeQL remediation supervisor",
            "Bound earlier CodeQL remediation runtime"
          ]'
          runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${TARGET_BRANCH}&per_page=100")"
          jq -r --argjson names "$names" '.workflow_runs[] | select((.name as $name | $names | index($name)) and .status != "completed") | .id' <<<"$runs" | while read -r run_id; do
            [[ -n "$run_id" ]] || continue
            echo "Cancelling superseded run ${run_id}"
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done
          for attempt in $(seq 1 40); do
            runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${TARGET_BRANCH}&per_page=100")"
            active="$(jq --argjson names "$names" '[.workflow_runs[] | select((.name as $name | $names | index($name)) and .status != "completed")] | length' <<<"$runs")"
            [[ "$active" == "0" ]] && exit 0
            echo "Waiting for ${active} superseded run(s) to stop"
            sleep 15
          done
          echo "Superseded remediation runs did not stop in time." >&2
          exit 1

      - name: Disable premature auto-merge on an existing PR
        if: steps.branch.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --disable-auto || true
          fi

      - name: Checkout branch
        if: steps.branch.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Merge latest main before final remediation
        if: steps.branch.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

  round1:
    needs: takeover
    if: needs.takeover.outputs.proceed == 'true' && needs.takeover.result == 'success'
    permissions:
      contents: write
      models: read
      security-events: read
    uses: ./.github/workflows/codeql-residual-round-v6.yml
    with:
      round: "1"
      branch: codex/code-scanning-remediation-20260908

  round2:
    needs: round1
    if: needs.round1.result == 'success' && needs.round1.outputs.clean != 'true'
    permissions:
      contents: write
      models: read
      security-events: read
    uses: ./.github/workflows/codeql-residual-round-v6.yml
    with:
      round: "2"
      branch: codex/code-scanning-remediation-20260908

  round3:
    needs: round2
    if: needs.round2.result == 'success' && needs.round2.outputs.clean != 'true'
    permissions:
      contents: write
      models: read
      security-events: read
    uses: ./.github/workflows/codeql-residual-round-v6.yml
    with:
      round: "3"
      branch: codex/code-scanning-remediation-20260908

  round4:
    needs: round3
    if: needs.round3.result == 'success' && needs.round3.outputs.clean != 'true'
    permissions:
      contents: write
      models: read
      security-events: read
    uses: ./.github/workflows/codeql-residual-round-v6.yml
    with:
      round: "4"
      branch: codex/code-scanning-remediation-20260908

  round5:
    needs: round4
    if: needs.round4.result == 'success' && needs.round4.outputs.clean != 'true'
    permissions:
      contents: write
      models: read
      security-events: read
    uses: ./.github/workflows/codeql-residual-round-v6.yml
    with:
      round: "5"
      branch: codex/code-scanning-remediation-20260908

  verify-and-merge:
    needs: [takeover, round1, round2, round3, round4, round5]
    if: >-
      ${{
        always() &&
        needs.takeover.outputs.proceed == 'true' &&
        needs.takeover.result == 'success' &&
        needs.round1.result == 'success' &&
        (needs.round2.result == 'success' || needs.round2.result == 'skipped') &&
        (needs.round3.result == 'success' || needs.round3.result == 'skipped') &&
        (needs.round4.result == 'success' || needs.round4.result == 'skipped') &&
        (needs.round5.result == 'success' || needs.round5.result == 'skipped')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout latest repaired tree
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Merge latest main before the final gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Initialize final CodeQL security-and-quality gate
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Analyze final candidate
        uses: github/codeql-action/analyze@v3
        with:
          upload: false
          output: /tmp/codeql-v6-final
          category: /language:javascript-typescript

      - name: Require zero final CodeQL security findings
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/codeql-residual-remediation-v6.py \
            --sarif-root /tmp/codeql-v6-final \
            --output /tmp/codeql-v6-final-findings.json

      - name: Create or locate the remediation pull request
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$number" ]]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$TARGET_BRANCH" \
              --title "fix(security): resolve all open CodeQL findings" \
              --body $'## Summary\n\n- remediates the complete open CodeQL inventory\n- runs GitHub Autofix first and bounded source-level repair passes for residual flows\n- validates the latest `main`-integrated tree with CodeQL `security-and-quality`\n- executes the repository `core` CI workflow explicitly on the final SHA\n- removes all temporary remediation automation before merge\n\n## Merge gates\n\n- CodeQL JavaScript/TypeScript security findings: **0**\n- required `core` job: **success**\n- same gates re-run after cleanup'
            number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --base main --state open --json number --jq '.[0].number')"
          fi
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --disable-auto || true
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Dispatch and validate core CI on full candidate
        env:
          LABEL: full-candidate
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(git rev-parse HEAD)"
          before="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=${TARGET_BRANCH}&event=workflow_dispatch&per_page=100" --jq '[.workflow_runs[].id] | max // 0')"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH"
          run_id=""
          for attempt in $(seq 1 120); do
            payload="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=${TARGET_BRANCH}&event=workflow_dispatch&per_page=100")"
            run_id="$(jq -r --arg sha "$expected_sha" --argjson before "$before" '[.workflow_runs[] | select(.id > $before and .head_sha == $sha)][0].id // empty' <<<"$payload")"
            [[ -n "$run_id" ]] && break
            echo "Waiting for ${LABEL} CI dispatch to appear (${attempt}/120)"
            sleep 5
          done
          [[ -n "$run_id" ]] || { echo "CI dispatch did not appear." >&2; exit 1; }
          for attempt in $(seq 1 720); do
            payload="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            status="$(jq -r '.status' <<<"$payload")"
            conclusion="$(jq -r '.conclusion // "pending"' <<<"$payload")"
            echo "${LABEL} CI run=${run_id}; status=${status}; conclusion=${conclusion}; attempt=${attempt}/720"
            if [[ "$status" == "completed" ]]; then
              [[ "$conclusion" == "success" ]] || exit 1
              break
            fi
            sleep 15
          done
          jobs="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" --slurp)"
          core_count="$(jq '[.[][] .jobs[]? | select(.name == "core" and .conclusion == "success")] | length' <<<"$jobs")"
          [[ "$core_count" -ge 1 ]] || { echo "A successful core job was not found." >&2; exit 1; }

      - name: Remove all temporary remediation files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git reset --hard "origin/$TARGET_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f \
            .github/workflows/code-scanning-inventory.yml \
            .github/workflows/code-scanning-context.yml \
            .github/workflows/code-scanning-autofix.yml \
            .github/workflows/code-scanning-remediation-gate.yml \
            .github/workflows/code-scanning-remediation-gate-trigger.yml \
            .github/workflows/code-scanning-remediation-v2.yml \
            .github/workflows/code-scanning-remediation-v3.yml \
            .github/workflows/code-scanning-remediation-v4.yml \
            .github/workflows/code-scanning-remediation-v5.yml \
            .github/workflows/code-scanning-remediation-v6.yml \
            .github/workflows/code-scanning-remediation-deadline.yml \
            .github/workflows/codeql-residual-round.yml \
            .github/workflows/codeql-residual-round-v6.yml \
            .github/workflows/patch-remediation-v5.yml \
            scripts/codeql-residual-remediation.py \
            scripts/codeql-residual-remediation-v6.py
          git add -A
          git diff --check
          if ! git diff --cached --quiet; then
            git commit -m "chore(security): remove temporary CodeQL remediation automation"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
          if git ls-files | grep -E '(^|/)(code-scanning-remediation|codeql-residual|patch-remediation-v5)' ; then
            echo "Temporary remediation files remain tracked." >&2
            exit 1
          fi

      - name: Dispatch and validate core CI after cleanup
        env:
          LABEL: post-cleanup
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(git rev-parse HEAD)"
          before="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=${TARGET_BRANCH}&event=workflow_dispatch&per_page=100" --jq '[.workflow_runs[].id] | max // 0')"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH"
          run_id=""
          for attempt in $(seq 1 120); do
            payload="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=${TARGET_BRANCH}&event=workflow_dispatch&per_page=100")"
            run_id="$(jq -r --arg sha "$expected_sha" --argjson before "$before" '[.workflow_runs[] | select(.id > $before and .head_sha == $sha)][0].id // empty' <<<"$payload")"
            [[ -n "$run_id" ]] && break
            echo "Waiting for ${LABEL} CI dispatch to appear (${attempt}/120)"
            sleep 5
          done
          [[ -n "$run_id" ]] || { echo "Post-cleanup CI dispatch did not appear." >&2; exit 1; }
          for attempt in $(seq 1 720); do
            payload="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            status="$(jq -r '.status' <<<"$payload")"
            conclusion="$(jq -r '.conclusion // "pending"' <<<"$payload")"
            echo "${LABEL} CI run=${run_id}; status=${status}; conclusion=${conclusion}; attempt=${attempt}/720"
            if [[ "$status" == "completed" ]]; then
              [[ "$conclusion" == "success" ]] || exit 1
              break
            fi
            sleep 15
          done
          jobs="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" --slurp)"
          core_count="$(jq '[.[][] .jobs[]? | select(.name == "core" and .conclusion == "success")] | length' <<<"$jobs")"
          [[ "$core_count" -ge 1 ]] || { echo "A successful post-cleanup core job was not found." >&2; exit 1; }

      - name: Enable protected squash auto-merge
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "${{ steps.pr.outputs.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --auto \
            --delete-branch

      - name: Wait for merge completion
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 360); do
            state="$(gh pr view "${{ steps.pr.outputs.number }}" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')"
            echo "PR state=${state}; attempt=${attempt}/360"
            [[ "$state" == "MERGED" ]] && exit 0
            [[ "$state" == "OPEN" ]] || exit 1
            sleep 30
          done
          echo "Timed out waiting for protected merge." >&2
          exit 1

      - name: Verify zero open CodeQL alerts on main
        shell: bash
        run: |
          set -euo pipefail
          count=-1
          for attempt in $(seq 1 480); do
            count="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&tool_name=CodeQL&ref=refs%2Fheads%2Fmain&per_page=100" --slurp | jq '[.[][]] | length')"
            echo "Open main CodeQL alerts=${count}; attempt=${attempt}/480"
            [[ "$count" == "0" ]] && break
            sleep 30
          done
          [[ "$count" == "0" ]] || { echo "Main still has ${count} open CodeQL alert(s)." >&2; exit 1; }
          gh pr comment "${{ steps.pr.outputs.number }}" --repo "$GITHUB_REPOSITORY" --body "✅ Protected merge completed. Final verification: open CodeQL alerts on \\`main\\` = **0**."
