name: Apply studio layer drag workbench

on:
  push:
    branches:
      - feat/studio-layer-drag-workbench

permissions:
  contents: write

concurrency:
  group: apply-studio-layer-drag-workbench
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[layer-drag-workbench-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/studio-layer-drag-workbench
          fetch-depth: 0

      - name: Apply focused source patch
        run: python3 scripts/apply-studio-layer-drag-workbench.py

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed sources
        run: |
          pnpm exec prettier --write \
            apps/web/src/domains/creator/studio-layers.ts \
            apps/web/src/domains/creator/studio-layers.test.ts \
            apps/web/src/domains/creator/layer/studio-layer-drag.ts \
            apps/web/src/domains/creator/layer/studio-layer-drag.test.ts \
            apps/web/src/domains/creator/layer/StudioLayerNavigator.tsx \
            apps/web/src/domains/creator/layer/StudioLayerNavigatorItemRow.tsx \
            apps/web/src/domains/creator/layer/StudioLayerNavigatorTree.tsx \
            apps/web/src/domains/creator/layer/StudioLayerNavigatorBatchBar.tsx \
            apps/web/src/domains/creator/layer/studio-layer-operations.ts \
            apps/web/src/domains/creator/layer/StudioLayerNavigator.drag.test.tsx \
            docs/studio-layer-drag-workbench-benchmark-2026-09-09.md

      - name: Lint changed sources
        run: |
          pnpm exec eslint \
            apps/web/src/domains/creator/studio-layers.ts \
            apps/web/src/domains/creator/studio-layers.test.ts \
            apps/web/src/domains/creator/layer/studio-layer-drag.ts \
            apps/web/src/domains/creator/layer/studio-layer-drag.test.ts \
            apps/web/src/domains/creator/layer/StudioLayerNavigator.tsx \
            apps/web/src/domains/creator/layer/StudioLayerNavigatorItemRow.tsx \
            apps/web/src/domains/creator/layer/StudioLayerNavigatorTree.tsx \
            apps/web/src/domains/creator/layer/StudioLayerNavigatorBatchBar.tsx \
            apps/web/src/domains/creator/layer/studio-layer-operations.ts \
            apps/web/src/domains/creator/layer/StudioLayerNavigator.drag.test.tsx

      - name: Run focused layer tests
        run: |
          pnpm exec vitest run \
            apps/web/src/domains/creator/studio-layers.test.ts \
            apps/web/src/domains/creator/layer/studio-layer-drag.test.ts \
            apps/web/src/domains/creator/layer/StudioLayerNavigator.test.tsx \
            apps/web/src/domains/creator/layer/StudioLayerNavigator.interaction.test.tsx \
            apps/web/src/domains/creator/layer/StudioLayerNavigatorItemRow.test.tsx \
            apps/web/src/domains/creator/layer/StudioLayerNavigator.drag.test.tsx

      - name: Typecheck web workspace
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Build production web bundle
        run: pnpm run build:bundle

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit verified implementation
        run: |
          rm scripts/apply-studio-layer-drag-workbench.py
          rm .github/workflows/apply-studio-layer-drag-workbench.yml
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "feat(studio): add professional layer drag workbench [layer-drag-workbench-applied]"
          git push origin HEAD:feat/studio-layer-drag-workbench
