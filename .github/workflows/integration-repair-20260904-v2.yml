name: Integration repair 20260904 v2

on:
  push:
    branches:
      - automation/source-snapshot-20260904
    paths:
      - .github/workflows/integration-repair-20260904-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integration-repair-20260904-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current adaptive integration branch
        uses: actions/checkout@v4
        with:
          ref: feat/shaper-adaptive-face-authored-hair-20260903
          fetch-depth: 1

      - name: Repair route close race and generated preview contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          host = Path("src/domains/creator/StudioCuttoonEditorHost.tsx")
          source = host.read_text(encoding="utf-8")

          nav_start = source.index("  function navigateStudio2dSurface(")
          nav_end = source.index("\n  /**", nav_start)
          nav = source[nav_start:nav_end]
          if "readonly force?: boolean" not in nav:
              old_options = "options?: { readonly replace?: boolean },"
              if nav.count(old_options) != 1:
                  raise SystemExit("navigateStudio2dSurface options contract changed")
              nav = nav.replace(
                  old_options,
                  "options?: { readonly force?: boolean; readonly replace?: boolean },",
                  1,
              )
          if "studioRoute.surface === surface && options?.force !== true" not in nav:
              old_guard = "if (studioRoute.surface === surface) return;"
              if nav.count(old_guard) != 1:
                  raise SystemExit("navigateStudio2dSurface guard changed")
              nav = nav.replace(
                  old_guard,
                  "if (studioRoute.surface === surface && options?.force !== true) return;",
                  1,
              )
          source = source[:nav_start] + nav + source[nav_end:]

          down_start = source.index(
              "  const downgradeRoutedSurface = useEffectEvent((surface: Studio2dWorkspaceSurface) => {"
          )
          down_end = source.index("\n  const routedSurfacePanelSyncRef", down_start)
          desired_down = '''  const downgradeRoutedSurface = useEffectEvent((surface: Studio2dWorkspaceSurface) => {
            if (studioRoute.surface === surface || studioRoute.surface === "canvas") {
              // Closing can happen while the route upgrade is still pending behind the heavyweight 3D
              // surface. Force a same-canvas replace as the newest navigation so that stale bg3d/poser/
              // timeline route commits cannot reopen an empty panel after a successful insert or update.
              navigateStudio2dSurface("canvas", { force: true, replace: true });
            }
          });'''
          source = source[:down_start] + desired_down + source[down_end:]
          host.write_text(source, encoding="utf-8")

          panel = Path("src/domains/creator/vrm/StudioVrmAvatarForgePanel.tsx")
          source = panel.read_text(encoding="utf-8")
          if "헤어 컬러 {previewRecipe.state.hair.baseColor.toUpperCase()}" not in source:
              anchor = '''            <span className="mt-0.5 block">{describeStudioVrmAvatarForgeState(previewRecipe.state).face} · {describeStudioVrmAvatarForgeState(previewRecipe.state).hair}</span>
                      <span className="block">{formatStudioVrmHeadUnits(resolveStudioVrmProportionMetrics(previewRecipe.state.proportions).headUnits)} · {describeStudioVrmAvatarForgeState(previewRecipe.state).body}</span>'''
              addition = anchor + '''
                      <span className="mt-1 flex items-center gap-1.5">
                        <span
                          aria-hidden
                          className="size-3 shrink-0 rounded-full border border-line/70 shadow-inner"
                          style={{ backgroundColor: previewRecipe.state.hair.baseColor }}
                        />
                        <span className="truncate">헤어 컬러 {previewRecipe.state.hair.baseColor.toUpperCase()}</span>
                      </span>'''
              if source.count(anchor) != 1:
                  raise SystemExit("VRM generated-preview anchor changed")
              source = source.replace(anchor, addition, 1)
              panel.write_text(source, encoding="utf-8")

          test = Path("src/domains/creator/vrm/studio-vrm-generate.test.ts")
          source = test.read_text(encoding="utf-8")
          weak = 'expect(panel).toContain("state={previewRecipe.state}");'
          strong = 'expect(panel).toContain("previewRecipe.state.hair.baseColor");'
          if strong not in source:
              if source.count(weak) != 1:
                  raise SystemExit("VRM preview assertion changed")
              test.write_text(source.replace(weak, strong, 1), encoding="utf-8")
          PY

          git diff --check
          grep -F 'options?: { readonly force?: boolean; readonly replace?: boolean }' src/domains/creator/StudioCuttoonEditorHost.tsx
          grep -F 'navigateStudio2dSurface("canvas", { force: true, replace: true });' src/domains/creator/StudioCuttoonEditorHost.tsx
          grep -F 'previewRecipe.state.hair.baseColor' src/domains/creator/vrm/StudioVrmAvatarForgePanel.tsx
          grep -F 'expect(panel).toContain("previewRecipe.state.hair.baseColor");' src/domains/creator/vrm/studio-vrm-generate.test.ts

      - name: Commit and push product repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Repair is already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/domains/creator/StudioCuttoonEditorHost.tsx \
            src/domains/creator/vrm/StudioVrmAvatarForgePanel.tsx \
            src/domains/creator/vrm/studio-vrm-generate.test.ts
          git commit -m "fix(studio): close routed 3D surfaces and show generated hair color"
          git push origin HEAD:feat/shaper-adaptive-face-authored-hair-20260903
