name: QA apply guarded patch

on:
  push:
    branches:
      - qa/studio-chromium-inapp-20260902
    paths:
      - ".github/qa-patches/*.patch"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qa-apply-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    name: Validate, apply, and commit one QA patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v6
        with:
          ref: qa/studio-chromium-inapp-20260902
          fetch-depth: 2

      - name: Apply pending patch
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t patches < <(find .github/qa-patches -maxdepth 1 -type f -name '*.patch' -print 2>/dev/null | sort)
          if (( ${#patches[@]} == 0 )); then
            echo "No pending patch remains; the deletion-triggered follow-up run is a no-op."
            exit 0
          fi
          if (( ${#patches[@]} != 1 )); then
            printf 'Expected exactly one pending patch, found %s:\n' "${#patches[@]}" >&2
            printf ' - %s\n' "${patches[@]}" >&2
            exit 1
          fi

          patch_file="${patches[0]}"
          first_line="$(head -n 1 "$patch_file")"
          if [[ "$first_line" != '# commit-message: '* ]]; then
            echo "Patch must start with '# commit-message: ...'" >&2
            exit 1
          fi
          commit_message="${first_line#\# commit-message: }"
          tail -n +2 "$patch_file" > /tmp/pending.patch

          git apply --check --whitespace=error-all /tmp/pending.patch
          git apply --whitespace=fix /tmp/pending.patch
          git rm "$patch_file"
          git add -A
          git diff --cached --check

          git config user.name "ToonStudio QA Bot"
          git config user.email "qa-bot@users.noreply.github.com"
          git commit -m "$commit_message"
          git push origin "HEAD:${GITHUB_REF_NAME}"
