name: Studio pencil gate diagnosis
on:
  push:
    branches: [fix/studio-session-followup-20260906]
    paths: ['.github/workflows/studio-pencil-gate-diagnosis.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Record tracked guard configuration without changing it
        run: |
          git rev-parse HEAD
          git ls-files '.husky/*' '*vitest*' '*test*guard*' '*test*exempt*'
          printf '\n--- TRACKED PRE-PUSH ---\n'
          cat .husky/pre-push
          printf '\n--- ROOT VITEST CONFIG ---\n'
          cat vitest.config.ts
          printf '\n--- GUARD REFERENCES ---\n'
          git grep -n -i -E 'vitest-guard|exempted path|exemptions|suite.constraints|test.*exempt' -- .husky scripts vitest.config.ts package.json || test "$?" = 1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record installed hooks and exact discovery inputs
        run: |
          printf '\n--- ACTIVE HOOK PATH ---\n'
          git config --get core.hooksPath
          printf '\n--- INSTALLED PRE-PUSH ---\n'
          cat .husky/pre-push
          printf '\n--- POST-INSTALL TRACKED CHANGES ---\n'
          git diff -- .husky scripts vitest.config.ts package.json
          printf '\n--- VITEST PERF FILE LIST ---\n'
          cat vitest.perf-budget-files.mjs
          printf '\n--- ACTUAL ROOT SUITE DISCOVERY ---\n'
          pnpm exec vitest list src/domains/creator/live/studio-live-pencil-pass-compositing.test.ts src/domains/creator/live/studio-live-retained-media-stability.test.ts src/domains/creator/live/studio-live-transient-tip.test.ts --filesOnly
