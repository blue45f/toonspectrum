name: Apply ToonStudio UI lint fixes once

on:
  push:
    branches:
      - feat/toonstudio-session-complete-20260911-1221
    paths:
      - .github/workflows/apply-toonstudio-ui-lint-fixes.yml

permissions:
  contents: write

concurrency:
  group: apply-toonstudio-ui-lint-fixes
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-session-complete-20260911-1221
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply deterministic lint fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "apps/web/src/domains/creator/studio-shell/StudioAssetHubPage.tsx",
              "/** Resolve a user-supplied query value without allowing unknown asset-hub surfaces. */\nexport function resolveStudioAssetHubView",
              "/** Resolve a user-supplied query value without allowing unknown asset-hub surfaces. */\n// Exported for focused route normalization tests; this module remains the canonical asset surface.\n// eslint-disable-next-line react-refresh/only-export-components\nexport function resolveStudioAssetHubView",
          )

          replace_once(
              "apps/web/src/domains/creator/studio-shell/StudioLocalizationPanel.tsx",
              "  }, [selected?.id, selected?.translatedText, selected?.updatedAt]);",
              "  }, [selected]);",
          )

          readiness = "apps/web/src/domains/creator/studio-shell/StudioProjectReadinessPanel.tsx"
          replace_once(
              readiness,
              '''function statusIcon(status: StudioProjectReadinessStatus) {\n  if (status === "ready") return CheckCircle2;\n  if (status === "warning") return AlertTriangle;\n  return ShieldAlert;\n}''',
              '''function StatusIcon({\n  status,\n  size,\n  className,\n}: {\n  readonly status: StudioProjectReadinessStatus;\n  readonly size: number;\n  readonly className?: string;\n}) {\n  if (status === "ready") return <CheckCircle2 size={size} className={className} aria-hidden="true" />;\n  if (status === "warning") return <AlertTriangle size={size} className={className} aria-hidden="true" />;\n  return <ShieldAlert size={size} className={className} aria-hidden="true" />;\n}''',
          )
          replace_once(
              readiness,
              '''  if (!snapshot) {\n    const FailureIcon = failure ? AlertTriangle : RefreshCw;\n    return (''',
              '''  if (!snapshot) {\n    return (''',
          )
          replace_once(
              readiness,
              '''              <FailureIcon size={17} className={failure ? "text-warning" : "text-fg-3"} aria-hidden="true" />''',
              '''              {failure\n                ? <AlertTriangle size={17} className="text-warning" aria-hidden="true" />\n                : <RefreshCw size={17} className="text-fg-3" aria-hidden="true" />}''',
          )
          replace_once(
              readiness,
              '''  const { report } = snapshot;\n  const StatusIcon = statusIcon(report.status);\n  const percentage = Math.round(report.completion * 100);''',
              '''  const { report } = snapshot;\n  const percentage = Math.round(report.completion * 100);''',
          )
          replace_once(
              readiness,
              '''              <StatusIcon size={14} aria-hidden="true" />''',
              '''              <StatusIcon status={report.status} size={14} />''',
          )
          replace_once(
              readiness,
              '''          {report.sections.map((section) => {\n            const Icon = statusIcon(section.status);\n            return (''',
              '''          {report.sections.map((section) => {\n            return (''',
          )
          replace_once(
              readiness,
              '''                  <Icon size={14} className={statusClasses(section.status).split(" ").at(-1)} aria-hidden="true" />''',
              '''                  <StatusIcon\n                    status={section.status}\n                    size={14}\n                    className={statusClasses(section.status).split(" ").at(-1)}\n                  />''',
          )
          PY

      - name: Verify UI integration
        run: bash scripts/verify-toonstudio-integration.sh ui

      - name: Commit verified fixes and remove workflow
        shell: bash
        run: |
          rm .github/workflows/apply-toonstudio-ui-lint-fixes.yml
          git config user.name "toonstudio-integration-bot"
          git config user.email "toonstudio-integration-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(studio): satisfy project shell UI contracts"
          git push origin HEAD:feat/toonstudio-session-complete-20260911-1221
