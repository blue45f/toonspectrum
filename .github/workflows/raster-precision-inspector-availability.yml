name: Raster precision inspector availability

on:
  push:
    branches:
      - feat/studio-pixel-pencil-pro-v2-20260909

permissions:
  actions: write
  contents: write

concurrency:
  group: raster-precision-inspector-availability
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      FEATURE_BRANCH: feat/studio-pixel-pencil-pro-v2-20260909
    steps:
      - name: Cancel active delivery coordinator
        run: |
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs" \
            -F branch="${FEATURE_BRANCH}" \
            -F per_page=100 \
            --jq '.workflow_runs[] | select(.status == "queued" or .status == "in_progress") | select(.name == "Studio raster precision delivery") | .id' \
          | while read -r run_id; do
              if [ -n "${run_id}" ]; then
                gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
              fi
            done

      - name: Sparse partial-clone inspector surface
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git sparse-checkout init --cone
          git sparse-checkout set .github apps/web/src/domains/creator
          git -c protocol.version=2 fetch \
            --depth=1 \
            --filter=blob:none \
            origin \
            "+refs/heads/${FEATURE_BRANCH}:refs/remotes/origin/${FEATURE_BRANCH}"
          git checkout -B "${FEATURE_BRANCH}" "refs/remotes/origin/${FEATURE_BRANCH}"

      - name: Expose professional pixel properties through the inspector shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("apps/web/src/domains/creator/StudioInspectorAsideShell.tsx")
          source = path.read_text(encoding="utf-8")
          old = '''            drawingToolPropertiesAvailable={
              drawMode !== "shape" && drawMode !== "pixel"
            }
'''
          new = '''            drawingToolPropertiesAvailable={drawMode !== "shape"}
'''
          if old in source:
              source = source.replace(old, new, 1)
          elif 'drawingToolPropertiesAvailable={drawMode !== "shape"}' not in source:
              raise RuntimeError("pixel property availability boundary not found")
          path.write_text(source, encoding="utf-8")
          PY
          grep -F 'drawingToolPropertiesAvailable={drawMode !== "shape"}' \
            apps/web/src/domains/creator/StudioInspectorAsideShell.tsx
          git diff --check

      - name: Commit availability repair and restart full gate
        run: |
          rm -f .github/workflows/raster-precision-inspector-availability.yml
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "fix(studio): expose professional pixel pencil properties"
          git fetch origin "${FEATURE_BRANCH}"
          git push --force-with-lease origin HEAD:"${FEATURE_BRANCH}"
