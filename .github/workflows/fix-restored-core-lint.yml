name: Repair lint baseline exposed by restored core

on:
  push:
    branches:
      - ci/restore-core-gate-final-20260904

permissions:
  contents: write

concurrency:
  group: repair-restored-core-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[core-lint-fixed]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Check out restore branch
        uses: actions/checkout@v6
        with:
          ref: ci/restore-core-gate-final-20260904
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply deterministic import-order fixes
        run: >-
          pnpm exec eslint --fix
          src/domains/creator/StudioCanonicalVNextDryMediaCanvas.tsx
          src/domains/creator/StudioQuickAccessDesktopSurface.tsx
          src/domains/creator/StudioQuickAccessMobileSurface.tsx
          src/domains/creator/brush/StudioDrawingPaletteFloatingSurface.test.tsx
          src/domains/creator/brush/StudioDrawingPaletteFloatingSurface.tsx
          src/domains/creator/brush/StudioDrawingPaletteOptions.tsx
          src/domains/creator/render/studio-gpu-presentation-device.test.ts
          src/domains/creator/studio-floating-surface-pointer.ts
          src/domains/creator/studio-inspector-primary-text-edit.test.ts
          src/domains/creator/studio-quick-access-surface-types.ts

      - name: Prove the full lint gate is clean
        run: pnpm run lint

      - name: Commit verified baseline repair
        run: |
          rm -f .github/workflows/fix-restored-core-lint.yml
          git config user.name "toonstudio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit --no-verify -m "fix(ci): clean import ordering for restored core [core-lint-fixed]"
          git push --no-verify origin HEAD:ci/restore-core-gate-final-20260904
