name: Fix final materializer entry check

on:
  push:
    branches: [fix/real-core-and-main-only-20260910]
    paths: [.github/workflows/fix-final-materializer-entry-check.yml]

permissions:
  contents: write

concurrency:
  group: fix-final-materializer-entry-check-20260911
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/real-core-and-main-only-20260910
          fetch-depth: 0
          persist-credentials: true
      - name: Align entry check with the single-entry product contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/materialize-remaining-tagged-product-work.yml')
          source = path.read_text(encoding='utf-8')
          old = '          if source.count("3D 스튜디오") < 2:\n              raise SystemExit("unified 3D Studio button/fallback was not created")\n'
          new = '          if source.count("3D 스튜디오") < 1:\n              raise SystemExit("unified 3D Studio entry was not created")\n'
          if new not in source:
              if source.count(old) != 1:
                  raise SystemExit(f'unexpected unified 3D entry assertion count: {source.count(old)}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-final-materializer-entry-check.yml
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m "fix(ci): align unified 3D materializer assertion"
          for attempt in $(seq 1 8); do
            if git push --no-verify origin HEAD:fix/real-core-and-main-only-20260910; then
              exit 0
            fi
            git fetch origin fix/real-core-and-main-only-20260910
            git rebase origin/fix/real-core-and-main-only-20260910
            sleep $((attempt * 2))
          done
          exit 1
