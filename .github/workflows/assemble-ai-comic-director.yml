# One-shot recovery workflow: the staged panel source must be assembled before repository CI.
name: Assemble AI comic director source

on:
  pull_request:
    branches: [main]
    paths:
      - ".ai-director-parts/**"
      - ".github/workflows/assemble-ai-comic-director.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assemble-ai-comic-director-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  assemble:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Assemble and verify source
        shell: bash
        run: |
          set -euo pipefail
          target="apps/web/src/domains/creator/ai/StudioAiComicDirectorPanel.tsx"
          mkdir -p "$(dirname "$target")"
          cat .ai-director-parts/part-*.txt > "$target"
          printf '%s  %s\n' \
            '4670cd031566b1850dfddd4e4690317763e96eef3288f4f2b18055266357916e' \
            "$target" | sha256sum -c -

      - name: Commit generated source and remove one-shot assembler
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/domains/creator/ai/StudioAiComicDirectorPanel.tsx
          git rm -r .ai-director-parts
          git rm .github/workflows/assemble-ai-comic-director.yml
          git commit -m "feat(studio): add staged AI comic director workspace"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
