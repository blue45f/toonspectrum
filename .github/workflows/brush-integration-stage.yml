name: Stage brush integration sources
on:
  push:
    branches: [feat/brush-material-reset-core-20260912]
    paths: [.github/workflows/brush-integration-stage.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: brush-integration-stage
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/brush-material-reset-core-20260912
      - name: Integrate the previous product patch without replacing restored CI
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=100 origin 0f8590b2b943a4291be4f4655a9efa01fd34173d
          git fetch --no-tags --depth=1 origin 84d130943865a4e3d7e569e5317193990ca9c053
          python3 - <<'PY'
          import subprocess
          base='84d130943865a4e3d7e569e5317193990ca9c053'
          source='0f8590b2b943a4291be4f4655a9efa01fd34173d'
          rows=subprocess.check_output(['git','diff','--name-status','--no-renames',base,source,'--','apps/web/src','scripts','docs']).decode().splitlines()
          for row in rows:
              status,path=row.split('\t',1)
              print(status,path)
              if status=='D':
                  subprocess.run(['git','rm','--ignore-unmatch','--',path],check=True)
              else:
                  subprocess.run(['git','restore','--source',source,'--staged','--worktree','--',path],check=True)
          PY
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -c core.hooksPath=/dev/null commit -m 'refactor(brush): integrate product-only catalogue and remove legacy design aliases'
            git push origin HEAD:feat/brush-material-reset-core-20260912
          fi
      - name: Archive reviewable source and exact revision
        run: |
          mkdir -p /tmp/brush-integration-source
          git rev-parse HEAD > /tmp/brush-integration-source/commit.txt
          python3 - <<'PY'
          import pathlib,subprocess,zipfile
          suffixes={'.ts','.tsx','.js','.jsx','.mjs','.cjs','.mts','.cts','.json','.yaml','.yml','.md','.toml','.wgsl','.glsl','.css','.html'}
          with zipfile.ZipFile('/tmp/brush-integration-source/source.zip','w',zipfile.ZIP_DEFLATED) as out:
              for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
                  p=pathlib.Path(name)
                  if p.is_file() and not p.is_symlink() and p.suffix in suffixes and p.stat().st_size<6000000 and not any(part.startswith('.env') for part in p.parts):
                      out.write(p,name)
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: brush-integration-source
          path: /tmp/brush-integration-source
          retention-days: 3
          if-no-files-found: error
