name: Repair tagged materializer guard

on:
  push:
    branches: [fix/real-core-and-main-only-20260910]
    paths: [.github/workflows/repair-tagged-materializer-guard.yml]

permissions:
  contents: write

concurrency:
  group: repair-tagged-materializer-guard-20260911
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/real-core-and-main-only-20260910
          fetch-depth: 0
          persist-credentials: true

      - name: Repair multiline JSX label detection and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/materialize-remaining-tagged-product-work.yml')
          source = path.read_text(encoding='utf-8')
          replacements = [
              ('if ">3D 캐릭터<" in source:', 'if "3D 캐릭터" in source:'),
              ('for label in [">3D 캐릭터<", ">캐릭터 셰이퍼<", ">3D 데생 인형<", ">3D 배경<"]:',
               'for label in ["3D 캐릭터", "캐릭터 셰이퍼", "3D 데생 인형", "3D 배경"]:'),
              ('expect(toolbarSource).not.toContain(">3D 캐릭터<");',
               'expect(toolbarSource).not.toContain("3D 캐릭터");'),
              ('expect(toolbarSource).not.toContain(">캐릭터 셰이퍼<");',
               'expect(toolbarSource).not.toContain("캐릭터 셰이퍼");'),
              ('expect(toolbarSource).not.toContain(">3D 데생 인형<");',
               'expect(toolbarSource).not.toContain("3D 데생 인형");'),
              ('expect(toolbarSource).not.toContain(">3D 배경<");',
               'expect(toolbarSource).not.toContain("3D 배경");'),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'unexpected materializer anchor count for {old!r}: {count}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY

          rm -f .github/workflows/repair-tagged-materializer-guard.yml
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m "ci(recovery): detect multiline 3D toolbar labels"
          git push --no-verify origin HEAD:fix/real-core-and-main-only-20260910
