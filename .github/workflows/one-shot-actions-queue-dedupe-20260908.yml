name: One-shot Actions queue dedupe

on:
  push:
    branches:
      - ci/actions-queue-dedupe-20260908
    paths:
      - .github/workflows/one-shot-actions-queue-dedupe-20260908.yml

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: one-shot-actions-queue-dedupe-20260908
  cancel-in-progress: true

jobs:
  dedupe:
    name: Preserve latest protected CI
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Preserve only main and the newest required CI for each open PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
          REQUIRED_WORKFLOW_ID: "287571038"
        run: |
          set -euo pipefail
          PYTHON_BIN="$(command -v python3 || command -v python)"
          "$PYTHON_BIN" <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repository = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          self_run_id = int(os.environ["SELF_RUN_ID"])
          required_workflow_id = int(os.environ["REQUIRED_WORKFLOW_ID"])
          active_statuses = ("in_progress", "queued", "pending", "waiting", "requested")

          def api(path: str, method: str = "GET") -> tuple[int, object]:
              request = urllib.request.Request(
                  f"https://api.github.com{path}",
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "toonspectrum-actions-queue-dedupe",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as error:
                  raw = error.read()
                  try:
                      payload: object = json.loads(raw) if raw else {}
                  except json.JSONDecodeError:
                      payload = raw.decode("utf-8", errors="replace")
                  return error.code, payload

          def open_pr_branches() -> set[str]:
              branches: set[str] = set()
              for page in range(1, 6):
                  status, payload = api(
                      f"/repos/{repository}/pulls?state=open&per_page=100&page={page}"
                  )
                  if status != 200 or not isinstance(payload, list):
                      raise SystemExit(f"Unable to list open pull requests: HTTP {status}: {payload}")
                  for pull in payload:
                      if not isinstance(pull, dict):
                          continue
                      head = pull.get("head")
                      if isinstance(head, dict) and isinstance(head.get("ref"), str):
                          branches.add(head["ref"])
                  if len(payload) < 100:
                      break
              return branches

          def active_runs() -> list[dict[str, object]]:
              by_id: dict[int, dict[str, object]] = {}
              for run_status in active_statuses:
                  for page in range(1, 11):
                      status, payload = api(
                          f"/repos/{repository}/actions/runs"
                          f"?status={run_status}&per_page=100&page={page}"
                      )
                      if status != 200 or not isinstance(payload, dict):
                          raise SystemExit(
                              f"Unable to list {run_status} runs: HTTP {status}: {payload}"
                          )
                      runs = payload.get("workflow_runs", [])
                      if not isinstance(runs, list):
                          raise SystemExit("GitHub returned an invalid workflow_runs payload")
                      for run in runs:
                          if isinstance(run, dict):
                              by_id[int(run.get("id", 0))] = run
                      if len(runs) < 100:
                          break
              return list(by_id.values())

          branches = open_pr_branches()
          runs = active_runs()
          newest_required: dict[str, dict[str, object]] = {}
          for run in runs:
              branch = run.get("head_branch")
              if (
                  isinstance(branch, str)
                  and branch in branches
                  and int(run.get("workflow_id", 0)) == required_workflow_id
              ):
                  current = newest_required.get(branch)
                  run_order = (str(run.get("created_at") or ""), int(run.get("id", 0)))
                  current_order = (
                      (str(current.get("created_at") or ""), int(current.get("id", 0)))
                      if current is not None
                      else ("", 0)
                  )
                  if run_order > current_order:
                      newest_required[branch] = run

          keep_ids = {self_run_id}
          keep_ids.update(int(run["id"]) for run in newest_required.values())
          candidates = [
              run
              for run in runs
              if int(run.get("id", 0)) not in keep_ids
              and run.get("head_branch") != "main"
          ]
          candidates.sort(key=lambda run: (str(run.get("created_at") or ""), int(run.get("id", 0))))

          print(
              json.dumps(
                  {
                      "open_pr_branches": sorted(branches),
                      "active_runs": len(runs),
                      "preserved_required": {
                          branch: int(run["id"])
                          for branch, run in newest_required.items()
                      },
                      "cancellations": len(candidates),
                  },
                  sort_keys=True,
              )
          )

          cancelled = 0
          raced = 0
          failures: list[str] = []
          for run in candidates:
              run_id = int(run["id"])
              status, payload = api(
                  f"/repos/{repository}/actions/runs/{run_id}/cancel",
                  method="POST",
              )
              label = (
                  f"{run_id} {run.get('head_branch')} / {run.get('name')} "
                  f"[{run.get('status')}]"
              )
              if status == 202:
                  cancelled += 1
                  print(f"cancelled: {label}")
              elif status in {404, 409}:
                  raced += 1
                  print(f"already terminal: {label} (HTTP {status})")
              else:
                  failures.append(f"{label}: HTTP {status}: {payload}")
              time.sleep(0.03)

          print(
              f"summary: cancelled={cancelled} already_terminal={raced} "
              f"failed={len(failures)}"
          )
          if failures:
              raise SystemExit("Cancellation failures:\n" + "\n".join(failures))
          PY
