name: Apply tested retained media stability patch
on:
  push:
    branches: [fix/studio-session-followup-20260906]
    paths: ['scripts/.studio-retained-stability.patch']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Apply reviewed diff only to its original source
        run: |
          test "$(git hash-object src/domains/creator/live/studio-live-retained-media-overlay.ts)" = 00147d49752dcf3df78a5281f73983c24f1a7731
          git apply --check scripts/.studio-retained-stability.patch
          git apply --index scripts/.studio-retained-stability.patch
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test the actual renderer graph before publishing the fix
        run: |
          pnpm exec vitest run src/domains/creator/live/studio-live-retained-media-overlay.test.ts src/domains/creator/live/studio-live-retained-media-stability.test.ts
      - name: Publish tested implementation on the feature branch, never main
        run: |
          git rm scripts/.studio-retained-stability.patch .github/workflows/apply-retained-media-stability.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "fix(studio): preserve retained pencil pixels and reject foreign stroke endings"
          git push origin HEAD:refs/heads/fix/studio-session-followup-20260906
          git rev-parse HEAD
