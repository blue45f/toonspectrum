name: Merge eligible open pull requests once

on:
  push:
    branches:
      - chore/merge-open-prs-20260912
    paths:
      - .github/workflows/merge-open-prs-once.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

concurrency:
  group: merge-eligible-open-pull-requests
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      CONTROL_BRANCH: chore/merge-open-prs-20260912
    steps:
      - name: Merge eligible pull requests
        shell: bash
        run: |
          set -euo pipefail

          report_json="$RUNNER_TEMP/pr-merge-report.json"
          merged_json="$RUNNER_TEMP/merged.json"
          skipped_json="$RUNNER_TEMP/skipped.json"
          printf '[]' > "$merged_json"
          printf '[]' > "$skipped_json"

          merge_round() {
            local progress=0
            local page=1
            local prs_file="$RUNNER_TEMP/open-prs.jsonl"
            : > "$prs_file"

            while :; do
              response="$(gh api \
                -H 'Accept: application/vnd.github+json' \
                "/repos/$REPOSITORY/pulls?state=open&sort=created&direction=asc&per_page=100&page=$page")"
              count="$(jq 'length' <<< "$response")"
              jq -c '.[]' <<< "$response" >> "$prs_file"
              (( count < 100 )) && break
              ((page += 1))
            done

            while IFS= read -r pr; do
              [[ -n "$pr" ]] || continue
              number="$(jq -r '.number' <<< "$pr")"
              title="$(jq -r '.title' <<< "$pr")"
              base="$(jq -r '.base.ref' <<< "$pr")"
              head="$(jq -r '.head.ref' <<< "$pr")"
              draft="$(jq -r '.draft' <<< "$pr")"
              url="$(jq -r '.html_url' <<< "$pr")"
              labels="$(jq -r '[.labels[].name | ascii_downcase] | join(",")' <<< "$pr")"

              reason=""
              if [[ "$base" != "main" ]]; then reason="base:$base"; fi
              if [[ "$draft" == "true" ]]; then reason="${reason:+$reason; }draft"; fi
              if [[ "$head" == "$CONTROL_BRANCH" || "$head" == chore/merge-open-prs-* ]]; then
                reason="${reason:+$reason; }control-branch"
              fi
              if grep -Eq '(^|,)(do-not-merge|do not merge|hold|blocked|wip)(,|$)' <<< "$labels"; then
                reason="${reason:+$reason; }blocking-label:$labels"
              fi
              if grep -Eiq '(^|[[:space:][:punct:]])(wip|do not merge|hold)([[:space:][:punct:]]|$)' <<< "$title"; then
                reason="${reason:+$reason; }blocking-title"
              fi

              detail="$(gh pr view "$number" --repo "$REPOSITORY" \
                --json number,title,isDraft,baseRefName,headRefName,mergeStateStatus,reviewDecision,statusCheckRollup,url 2>/dev/null || true)"
              if [[ -z "$detail" ]]; then
                reason="${reason:+$reason; }detail-unavailable"
              else
                merge_state="$(jq -r '.mergeStateStatus // "UNKNOWN"' <<< "$detail")"
                review="$(jq -r '.reviewDecision // ""' <<< "$detail")"
                if [[ "$merge_state" =~ ^(DIRTY|BLOCKED|UNSTABLE|UNKNOWN)$ ]]; then
                  reason="${reason:+$reason; }merge-state:$merge_state"
                fi
                if [[ "$review" == "CHANGES_REQUESTED" || "$review" == "REVIEW_REQUIRED" ]]; then
                  reason="${reason:+$reason; }review:$review"
                fi

                failed="$(jq -r '[.statusCheckRollup[]? | select(
                  ((.status // "COMPLETED") == "COMPLETED") and
                  (((.conclusion // .state // "SUCCESS") | ascii_upcase) as $c |
                    ($c == "FAILURE" or $c == "CANCELLED" or $c == "TIMED_OUT" or
                     $c == "ACTION_REQUIRED" or $c == "STARTUP_FAILURE" or $c == "STALE" or
                     $c == "ERROR"))
                ) | (.name // .context // .workflowName // "check")] | unique | join(",")' <<< "$detail")"
                pending="$(jq -r '[.statusCheckRollup[]? | select(
                  ((.status // "COMPLETED") != "COMPLETED") or
                  (((.conclusion // .state // "SUCCESS") | ascii_upcase) as $c |
                    ($c == "PENDING" or $c == "EXPECTED" or $c == "QUEUED" or $c == "IN_PROGRESS"))
                ) | (.name // .context // .workflowName // "check")] | unique | join(",")' <<< "$detail")"
                [[ -z "$failed" ]] || reason="${reason:+$reason; }failed-checks:$failed"
                [[ -z "$pending" ]] || reason="${reason:+$reason; }pending-checks:$pending"
              fi

              if [[ -n "$reason" ]]; then
                current="$(cat "$skipped_json")"
                jq --argjson number "$number" --arg title "$title" --arg url "$url" --arg reason "$reason" \
                  '[.[] | select(.number != $number)] + [{number:$number,title:$title,url:$url,reason:$reason}]' \
                  <<< "$current" > "$skipped_json.tmp"
                mv "$skipped_json.tmp" "$skipped_json"
                continue
              fi

              if gh pr merge "$number" --repo "$REPOSITORY" --squash --delete-branch; then
                merged_detail="$(gh pr view "$number" --repo "$REPOSITORY" --json mergedAt,mergeCommit,title,url)"
                current="$(cat "$merged_json")"
                jq --argjson number "$number" \
                  --arg title "$(jq -r '.title' <<< "$merged_detail")" \
                  --arg url "$(jq -r '.url' <<< "$merged_detail")" \
                  --arg mergedAt "$(jq -r '.mergedAt // ""' <<< "$merged_detail")" \
                  --arg commit "$(jq -r '.mergeCommit.oid // ""' <<< "$merged_detail")" \
                  '. + [{number:$number,title:$title,url:$url,mergedAt:$mergedAt,mergeCommit:$commit}]' \
                  <<< "$current" > "$merged_json.tmp"
                mv "$merged_json.tmp" "$merged_json"
                current="$(cat "$skipped_json")"
                jq --argjson number "$number" '[.[] | select(.number != $number)]' <<< "$current" > "$skipped_json.tmp"
                mv "$skipped_json.tmp" "$skipped_json"
                progress=1
                sleep 2
              else
                current="$(cat "$skipped_json")"
                jq --argjson number "$number" --arg title "$title" --arg url "$url" \
                  '[.[] | select(.number != $number)] + [{number:$number,title:$title,url:$url,reason:"merge-command-refused"}]' \
                  <<< "$current" > "$skipped_json.tmp"
                mv "$skipped_json.tmp" "$skipped_json"
              fi
            done < "$prs_file"

            echo "$progress"
          }

          for round in 1 2 3 4 5; do
            progress="$(merge_round)"
            [[ "$progress" == "1" ]] || break
          done

          final_open="$(gh api --paginate -H 'Accept: application/vnd.github+json' \
            "/repos/$REPOSITORY/pulls?state=open&per_page=100" --jq '[.[] | {number,title,url:.html_url,draft,base:.base.ref,head:.head.ref}]' | jq -s 'add // []')"
          jq -n \
            --arg repository "$REPOSITORY" \
            --arg completedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile merged "$merged_json" \
            --slurpfile skipped "$skipped_json" \
            --argjson remaining "$final_open" \
            '{repository:$repository,completedAt:$completedAt,merged:$merged[0],skipped:$skipped[0],remaining:$remaining}' \
            > "$report_json"

          {
            echo '# Pull request merge report'
            echo
            echo "- Repository: \`$REPOSITORY\`"
            echo "- Merged: **$(jq '.merged | length' "$report_json")**"
            echo "- Remaining open: **$(jq '.remaining | length' "$report_json")**"
            echo
            echo '## Merged'
            jq -r '.merged[]? | "- PR #\(.number) — \(.title) (\(.mergeCommit))"' "$report_json"
            echo
            echo '## Not merged'
            jq -r '.skipped[]? | "- PR #\(.number) — \(.title): \(.reason)"' "$report_json"
          } | tee "$RUNNER_TEMP/pr-merge-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merge report
        uses: actions/upload-artifact@v4
        with:
          name: pull-request-merge-report
          path: |
            ${{ runner.temp }}/pr-merge-report.json
            ${{ runner.temp }}/pr-merge-report.md
          retention-days: 3
