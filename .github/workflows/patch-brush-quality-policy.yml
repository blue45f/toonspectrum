name: Apply quality-only brush representative ranking

on:
  push:
    branches:
      - feat/all-brush-long-stroke-quality-election-20260904
    paths:
      - .github/workflows/patch-brush-quality-policy.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/all-brush-long-stroke-quality-election-20260904
      - name: Keep performance outside the representative quality score
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, before: str, after: str, label: str) -> None:
              source = path.read_text()
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              path.write_text(source.replace(before, after, 1))

          curation = Path("src/domains/creator/brush/studio-brush-quality-curation.ts")
          replace_once(
              curation,
              '''function candidateQualityScore(candidate: StudioBrushCurationCandidate): number {
            if (!candidate.qualityPassed) return -1;
            const errorPenalty = Math.min(1, candidate.browserErrorCount * 0.25)
              + Math.min(1, candidate.refusedStrokeCount * 0.25);
            const responsiveness = Number.isFinite(candidate.frameP95Milliseconds)
              ? clamp01(1 - Math.max(0, candidate.frameP95Milliseconds - 16.667) / 83.333)
              : 0;
            return 0.28 * clamp01(candidate.centerlineCoverage)
              + 0.22 * clamp01(candidate.liveCommitFidelity)
              + 0.18 * clamp01(candidate.settledStability)
              + 0.17 * clamp01(candidate.inputDeliveryRatio)
              + 0.1 * clamp01(candidate.textureQuality)
              + 0.05 * responsiveness
              - 0.2 * errorPenalty;
          }''',
              '''function candidateQualityScore(candidate: StudioBrushCurationCandidate): number {
            if (!candidate.qualityPassed) return -1;
            const errorPenalty = Math.min(1, candidate.browserErrorCount * 0.25)
              + Math.min(1, candidate.refusedStrokeCount * 0.25);
            // This score deliberately excludes frame time. The representative is chosen by mark
            // quality and interaction fidelity; GPU/backend performance is considered only after
            // the measured quality score is tied.
            return 0.25 * clamp01(candidate.textureQuality)
              + 0.25 * clamp01(candidate.liveCommitFidelity)
              + 0.2 * clamp01(candidate.centerlineCoverage)
              + 0.15 * clamp01(candidate.settledStability)
              + 0.15 * clamp01(candidate.inputDeliveryRatio)
              - 0.2 * errorPenalty;
          }''',
              "quality-only representative score",
          )
          replace_once(
              curation,
              '''  if (Math.abs(qualityDelta) > 0.01) return qualityDelta > 0 ? -1 : 1;''',
              '''  if (Math.abs(qualityDelta) > 0.005) return qualityDelta > 0 ? -1 : 1;''',
              "strict quality tie threshold",
          )

          test = Path("src/domains/creator/brush/studio-brush-quality-curation.test.ts")
          anchor = '''  it("never lets a protected but failing brush beat a passing representative", () => {'''
          insertion = '''  it("does not let frame speed compensate for lower measured mark quality", () => {
            const clusters = curateStudioBrushCandidates([
              candidate("slower-quality", {
                frameP95Milliseconds: 180,
                textureQuality: 0.9,
                listedOrder: 0,
              }),
              candidate("fast-gpu-lower-quality", {
                gpuApproved: true,
                frameP95Milliseconds: 5,
                textureQuality: 0.84,
                listedOrder: 1,
              }),
            ]);
            expect(clusters[0]?.representativeId).toBe("slower-quality");
          });

          ''' + anchor
          replace_once(test, anchor, insertion, "performance cannot buy quality test")
          PY
          git diff --check
      - name: Commit source changes only
        run: |
          set -euo pipefail
          git config user.name toonstudio-bot
          git config user.email actions@users.noreply.github.com
          git add \
            src/domains/creator/brush/studio-brush-quality-curation.ts \
            src/domains/creator/brush/studio-brush-quality-curation.test.ts
          git diff --cached --check
          git commit -m "feat(brush): rank representatives by quality before speed"
          git push origin HEAD:feat/all-brush-long-stroke-quality-election-20260904
