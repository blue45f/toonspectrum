name: Apply Studio work panel quality follow-up

on:
  push:
    branches:
      - feat/studio-work-panel-control-20260909
    paths:
      - .github/workflows/apply-studio-work-panel-polish.yml

permissions:
  contents: write

concurrency:
  group: studio-work-panel-follow-up
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/studio-work-panel-control-20260909
          fetch-depth: 0

      - name: Apply audited panel refinements
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}\n--- needle ---\n{old}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          def replace_all(path: Path, old: str, new: str, expected: int) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}\n--- needle ---\n{old}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          navigator = Path("apps/web/src/domains/creator/StudioInspectorNavigator.tsx")
          preferences = Path("apps/web/src/domains/creator/studio-inspector-panel-preferences.ts")
          controls_test = Path("apps/web/src/domains/creator/StudioInspectorPanelControls.test.tsx")
          preferences_test = Path("apps/web/src/domains/creator/studio-inspector-panel-preferences.test.ts")
          benchmark = Path("docs/rewrite/studio-work-panel-benchmark-2026-09-09.md")

          replace_once(
              navigator,
              '''  options: ["studio.inspector.panel.options", "작업 패널 구성"],
          optionsHint: [''',
              '''  options: ["studio.inspector.panel.options", "작업 패널 구성"],
          closeOptions: [
            "studio.inspector.panel.options.close",
            "작업 패널 구성 닫기",
          ],
          optionsHint: [''',
          )
          replace_once(
              navigator,
              '''  const propertiesTabRef = useRef<HTMLButtonElement>(null);
          const panelOptionsTriggerRef = useRef<HTMLButtonElement>(null);
          const [panelOptionsOpen, setPanelOptionsOpen] = useState(false);''',
              '''  const propertiesTabRef = useRef<HTMLButtonElement>(null);
          const panelOptionsTriggerRef = useRef<HTMLButtonElement>(null);
          const panelOptionsRef = useRef<HTMLDivElement>(null);
          const [panelOptionsOpen, setPanelOptionsOpen] = useState(false);''',
          )
          replace_once(
              navigator,
              '''  useEffect(() => {
            if (!panelOptionsOpen) return;
            const closeOnEscape = (event: KeyboardEvent) => {
              if (event.key !== "Escape" || event.defaultPrevented) return;
              setPanelOptionsOpen(false);
              globalThis.requestAnimationFrame?.(() => {
                panelOptionsTriggerRef.current?.focus({ preventScroll: true });
              });
            };
            window.addEventListener("keydown", closeOnEscape);
            return () => window.removeEventListener("keydown", closeOnEscape);
          }, [panelOptionsOpen]);''',
              '''  useEffect(() => {
            if (!panelOptionsOpen) return;

            const closeOptions = (restoreFocus: boolean) => {
              setPanelOptionsOpen(false);
              if (!restoreFocus) return;
              globalThis.requestAnimationFrame?.(() => {
                panelOptionsTriggerRef.current?.focus({ preventScroll: true });
              });
            };
            const closeOnPointerDown = (event: PointerEvent) => {
              const target = event.target;
              if (!(target instanceof Node)) return;
              if (
                panelOptionsRef.current?.contains(target)
                || panelOptionsTriggerRef.current?.contains(target)
              ) {
                return;
              }
              closeOptions(false);
            };
            const closeOnEscape = (event: KeyboardEvent) => {
              if (event.key !== "Escape" || event.defaultPrevented) return;
              event.preventDefault();
              event.stopPropagation();
              closeOptions(true);
            };
            document.addEventListener("pointerdown", closeOnPointerDown);
            window.addEventListener("keydown", closeOnEscape);
            return () => {
              document.removeEventListener("pointerdown", closeOnPointerDown);
              window.removeEventListener("keydown", closeOnEscape);
            };
          }, [panelOptionsOpen]);''',
          )
          replace_once(
              navigator,
              '''            aria-expanded={panelOptionsOpen}
                      aria-controls={panelOptionsId}''',
              '''            aria-expanded={panelOptionsOpen}
                      aria-haspopup="dialog"
                      aria-controls={panelOptionsId}''',
          )
          replace_once(
              navigator,
              '''        <div
                  id={panelOptionsId}
                  role="region"
                  aria-label={copy("options")}
                  data-testid="studio-inspector-panel-options"
                  className="mb-2 rounded-lg border border-line bg-card/85 p-2 shadow-sm"
                >''',
              '''        <div
                  ref={panelOptionsRef}
                  id={panelOptionsId}
                  role="dialog"
                  aria-modal="false"
                  aria-label={copy("options")}
                  data-testid="studio-inspector-panel-options"
                  data-studio-inspector-panel-options-surface="popover"
                  className="absolute inset-x-1 top-[calc(100%+0.375rem)] z-50 max-h-[65vh] overflow-y-auto overscroll-contain rounded-lg border border-line bg-card/95 p-2 shadow-2xl backdrop-blur supports-[backdrop-filter]:bg-card/90"
                >''',
          )
          replace_once(
              navigator,
              '''            <span className="shrink-0 rounded-full bg-accent-soft px-1.5 py-0.5 text-[0.6875rem] font-bold tabular-nums text-accent">
                      {panelState.visiblePrimaryTabs.length}/{STUDIO_INSPECTOR_PRIMARY_TABS.length}
                    </span>''',
              '''            <div className="flex shrink-0 items-center gap-1">
                      <span className="rounded-full bg-accent-soft px-1.5 py-0.5 text-[0.6875rem] font-bold tabular-nums text-accent">
                        {panelState.visiblePrimaryTabs.length}/{STUDIO_INSPECTOR_PRIMARY_TABS.length}
                      </span>
                      <button
                        type="button"
                        onClick={() => {
                          setPanelOptionsOpen(false);
                          globalThis.requestAnimationFrame?.(() => {
                            panelOptionsTriggerRef.current?.focus({ preventScroll: true });
                          });
                        }}
                        aria-label={copy("closeOptions")}
                        className={cn(
                          "grid size-11 shrink-0 place-items-center rounded-md text-fg-3 transition-colors hover:bg-raised hover:text-fg",
                          tabFocusClass,
                        )}
                      >
                        <X size={14} strokeWidth={1.75} aria-hidden />
                      </button>
                    </div>''',
          )

          replace_once(
              preferences,
              '''export const STUDIO_INSPECTOR_PANEL_SESSION_STORAGE_KEY =
            "toonspectrum:studio:inspector-panel-session:v1";''',
              '''export const STUDIO_INSPECTOR_PANEL_SESSION_STORAGE_KEY =
            "toonspectrum:studio:inspector-panel-session:v1";
          /** Corrupt extension data must not make Studio parse an unbounded local-storage payload. */
          export const STUDIO_INSPECTOR_PANEL_RAW_MAX_CHARS = 8 * 1024;''',
          )
          replace_once(
              preferences,
              '''function isRecord(value: unknown): value is Record<string, unknown> {
            return typeof value === "object" && value !== null && !Array.isArray(value);
          }
          ''',
              '''function isRecord(value: unknown): value is Record<string, unknown> {
            return typeof value === "object" && value !== null && !Array.isArray(value);
          }

          function parseBoundedStoredJson(raw: string | null): unknown {
            if (!raw || raw.length > STUDIO_INSPECTOR_PANEL_RAW_MAX_CHARS) return null;
            return JSON.parse(raw);
          }
          ''',
          )
          replace_once(
              preferences,
              '''    const raw = storage.getItem(STUDIO_INSPECTOR_PANEL_PREFERENCES_STORAGE_KEY);
                return raw
                  ? normalizeStudioInspectorPanelPreferences(JSON.parse(raw))
                  : DEFAULT_STUDIO_INSPECTOR_PANEL_PREFERENCES;''',
              '''    const raw = storage.getItem(STUDIO_INSPECTOR_PANEL_PREFERENCES_STORAGE_KEY);
                const parsed = parseBoundedStoredJson(raw);
                return parsed === null
                  ? DEFAULT_STUDIO_INSPECTOR_PANEL_PREFERENCES
                  : normalizeStudioInspectorPanelPreferences(parsed);''',
          )
          replace_once(
              preferences,
              '''    const raw = storage.getItem(STUDIO_INSPECTOR_PANEL_SESSION_STORAGE_KEY);
                return raw
                  ? normalizeStudioInspectorPanelSessionState(JSON.parse(raw))
                  : DEFAULT_STUDIO_INSPECTOR_PANEL_SESSION_STATE;''',
              '''    const raw = storage.getItem(STUDIO_INSPECTOR_PANEL_SESSION_STORAGE_KEY);
                const parsed = parseBoundedStoredJson(raw);
                return parsed === null
                  ? DEFAULT_STUDIO_INSPECTOR_PANEL_SESSION_STATE
                  : normalizeStudioInspectorPanelSessionState(parsed);''',
          )
          replace_once(
              preferences,
              '''let browserSnapshot: StudioInspectorPanelState | null = null;
          let storageListenerInstalled = false;
          const listeners = new Set<() => void>();''',
              '''let browserSnapshot: StudioInspectorPanelState | null = null;
          let storageListener: ((event: StorageEvent) => void) | null = null;
          const listeners = new Set<() => void>();''',
          )
          replace_once(
              preferences,
              '''function installStorageListener(): void {
            if (storageListenerInstalled || typeof window === "undefined") return;
            storageListenerInstalled = true;
            window.addEventListener("storage", (event) => {
              if (event.key !== STUDIO_INSPECTOR_PANEL_PREFERENCES_STORAGE_KEY) return;
              const current = getStudioInspectorPanelState();
              const preferences = loadStudioInspectorPanelPreferences(browserLocalStorage());
              emit(freezeState({ ...preferences, contextPinned: current.contextPinned }));
            });
          }''',
              '''function installStorageListener(): void {
            if (storageListener !== null || typeof window === "undefined") return;
            storageListener = (event) => {
              if (
                event.key !== null
                && event.key !== STUDIO_INSPECTOR_PANEL_PREFERENCES_STORAGE_KEY
              ) {
                return;
              }
              const current = getStudioInspectorPanelState();
              const preferences = loadStudioInspectorPanelPreferences(browserLocalStorage());
              emit(freezeState({ ...preferences, contextPinned: current.contextPinned }));
            };
            window.addEventListener("storage", storageListener);
          }''',
          )
          replace_once(
              preferences,
              '''  browserSnapshot = null;
            listeners.clear();
          }''',
              '''  if (storageListener !== null && typeof window !== "undefined") {
              window.removeEventListener("storage", storageListener);
            }
            storageListener = null;
            browserSnapshot = null;
            listeners.clear();
          }''',
          )

          replace_all(
              controls_test,
              '''screen.getByRole("region", { name: "작업 패널 구성" })''',
              '''screen.getByRole("dialog", { name: "작업 패널 구성" })''',
              2,
          )
          text = controls_test.read_text(encoding="utf-8")
          marker = "\n});\n"
          if not text.endswith(marker):
              raise SystemExit(f"{controls_test}: unexpected suite ending")
          extra = r'''

            it("opens configuration as a bounded non-modal popover and dismisses it outside", () => {
              render(<NavigatorHarness />);
              const trigger = screen.getByRole("button", { name: "작업 패널 구성" });
              expect(trigger.getAttribute("aria-haspopup")).toBe("dialog");

              fireEvent.click(trigger);
              const dialog = screen.getByRole("dialog", { name: "작업 패널 구성" });
              expect(dialog.getAttribute("aria-modal")).toBe("false");
              expect(
                dialog.getAttribute("data-studio-inspector-panel-options-surface"),
              ).toBe("popover");

              fireEvent.pointerDown(document.body);
              expect(
                screen.queryByRole("dialog", { name: "작업 패널 구성" }),
              ).toBeNull();
            });
          '''
          controls_test.write_text(text[:-len(marker)] + extra + marker, encoding="utf-8")

          replace_once(
              preferences_test,
              '''  STUDIO_INSPECTOR_PANEL_PREFERENCES_STORAGE_KEY,
            STUDIO_INSPECTOR_PANEL_SESSION_STORAGE_KEY,''',
              '''  STUDIO_INSPECTOR_PANEL_PREFERENCES_STORAGE_KEY,
            STUDIO_INSPECTOR_PANEL_RAW_MAX_CHARS,
            STUDIO_INSPECTOR_PANEL_SESSION_STORAGE_KEY,''',
          )
          text = preferences_test.read_text(encoding="utf-8")
          anchor = '''  it("keeps the context pin in session storage, separate from durable chrome preferences", () => {'''
          if text.count(anchor) != 1:
              raise SystemExit(f"{preferences_test}: context-pin test anchor missing")
          extra = r'''  it("rejects oversized persisted payloads before parsing", () => {
              const oversizedStorage = {
                getItem: () => " ".repeat(STUDIO_INSPECTOR_PANEL_RAW_MAX_CHARS + 1),
                setItem: () => undefined,
              };

              expect(loadStudioInspectorPanelPreferences(oversizedStorage)).toEqual(
                DEFAULT_STUDIO_INSPECTOR_PANEL_PREFERENCES,
              );
              expect(
                loadStudioInspectorPanelSessionState(oversizedStorage).contextPinned,
              ).toBe(false);
            });

            it("resets durable chrome when another tab clears local storage", () => {
              setStudioInspectorPanelCompactPrimaryTabs(true);
              expect(getStudioInspectorPanelState().compactPrimaryTabs).toBe(true);

              localStorage.clear();
              window.dispatchEvent(new StorageEvent("storage", { key: null }));

              expect(getStudioInspectorPanelState().compactPrimaryTabs).toBe(false);
            });

          '''
          preferences_test.write_text(text.replace(anchor, extra + anchor), encoding="utf-8")

          replace_once(
              benchmark,
              '''## 4. 의도적으로 하지 않은 것''',
              '''### 3.5 구성 팝오버와 영속 상태 방어

          - 패널 구성은 본문 높이를 계속 밀어내는 인라인 블록이 아니라, 현재 Inspector 위에 뜨는 bounded 비모달 팝오버로 표시한다.
          - 팝오버는 화면 높이의 65%에서 내부 스크롤하며 모바일 bottom sheet에서도 하단 설정을 가리지 않는다.
          - 명시적 닫기, 바깥 포인터 입력, `Esc`를 모두 지원하고 `Esc`/닫기 버튼은 구성 트리거로 포커스를 복원한다.
          - 트리거는 `aria-haspopup="dialog"`, 표면은 `role="dialog"`와 `aria-modal="false"`를 사용해 실제 상호작용 모델을 보조기기에 전달한다.
          - 저장 데이터는 8 KiB 상한을 넘으면 JSON 파싱 전에 기본값으로 복구한다. 다른 탭에서 `localStorage.clear()`가 실행된 경우에도 현재 탭의 표시 탭·컴팩트 상태가 즉시 기본값과 수렴한다.
          - 테스트/HMR 격리 시 설치한 storage listener를 제거해 오래된 Window에 구독이 남지 않게 한다.

          ## 4. 의도적으로 하지 않은 것''',
          )
          replace_once(
              benchmark,
              '''- 접근성: `aria-pressed`, `aria-expanded`, `aria-controls`, `role=region`, 활성 탭 숨김 사유
          - 밀도: 옵션을 닫았을 때 기존 DOM 감사의 최대 chrome 12개 예산 유지''',
              '''- 접근성: `aria-pressed`, `aria-expanded`, `aria-controls`, non-modal `role=dialog`, 명시적 닫기와 바깥 입력 dismiss, 활성 탭 숨김 사유
          - 회복성: 8 KiB 저장 상한, 손상 JSON, 다른 탭의 key 변경·전체 clear 수렴
          - 밀도: 옵션은 65vh 내부 스크롤 팝오버이며, 닫았을 때 기존 DOM 감사의 최대 chrome 12개 예산 유지''',
          )
          PY

          git diff --check
          git diff --stat

      - name: Commit audited refinements
        shell: bash
        env:
          HUSKY: "0"
        run: |
          rm .github/workflows/apply-studio-work-panel-polish.yml
          git config user.name "ToonStudio Automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/domains/creator/StudioInspectorNavigator.tsx \
            apps/web/src/domains/creator/StudioInspectorPanelControls.test.tsx \
            apps/web/src/domains/creator/studio-inspector-panel-preferences.ts \
            apps/web/src/domains/creator/studio-inspector-panel-preferences.test.ts \
            docs/rewrite/studio-work-panel-benchmark-2026-09-09.md \
            .github/workflows/apply-studio-work-panel-polish.yml
          git commit --no-verify -m "feat(studio): harden work panel configuration UX"
          git push origin HEAD:feat/studio-work-panel-control-20260909
