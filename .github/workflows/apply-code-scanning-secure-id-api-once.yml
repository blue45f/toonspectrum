name: Apply secure AI Comic Director IDs via Git API once

on:
  push:
    branches:
      - fix/code-scanning-secure-comic-ids-20260910-v2
    paths:
      - .github/workflows/apply-code-scanning-secure-id-api-once.yml

permissions:
  contents: write

concurrency:
  group: secure-ai-comic-director-ids-20260910-v2
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const branch = "fix/code-scanning-secure-comic-ids-20260910-v2";
            const { owner, repo } = context.repo;
            const ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            const parent = ref.data.object.sha;
            const commit = await github.rest.git.getCommit({ owner, repo, commit_sha: parent });

            async function read(path) {
              const result = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (Array.isArray(result.data) || result.data.type !== "file" || !result.data.content) {
                throw new Error(`Expected a text file at ${path}`);
              }
              return Buffer.from(result.data.content, "base64").toString("utf8");
            }

            function replaceOnce(source, oldText, newText, path) {
              const first = source.indexOf(oldText);
              if (first < 0 || source.indexOf(oldText, first + oldText.length) >= 0) {
                throw new Error(`Replacement anchor mismatch in ${path}`);
              }
              return source.slice(0, first) + newText + source.slice(first + oldText.length);
            }

            const routePath = "apps/web/src/domains/creator/studio-router/routes/StudioAiComicDirectorRoute.tsx";
            let route = await read(routePath);
            route = replaceOnce(
              route,
              'import { cn } from "@/shared/lib/utils";\n',
              'import { createSecureRandomUuid } from "@/shared/lib/secure-random-id";\nimport { cn } from "@/shared/lib/utils";\n',
              routePath,
            );
            route = replaceOnce(
              route,
              'function uid(): string {\n  return globalThis.crypto?.randomUUID?.()\n    ?? `comic-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;\n}\n',
              'function uid(): string {\n  return createSecureRandomUuid(\n    "이 브라우저에서는 안전한 AI 코믹 디렉터 세션 ID를 만들 수 없습니다.",\n  );\n}\n',
              routePath,
            );

            const sessionPath = "apps/web/src/domains/creator/ai/studio-ai-comic-director-session.ts";
            let session = await read(sessionPath);
            session = replaceOnce(
              session,
              'import type { ScenarioPreviewItem } from "../studio-scenario-layout";\n',
              'import type { ScenarioPreviewItem } from "../studio-scenario-layout";\n\nimport { createSecureRandomUuid } from "@/shared/lib/secure-random-id";\n',
              sessionPath,
            );
            session = replaceOnce(
              session,
              'function id(): string {\n  return globalThis.crypto?.randomUUID?.()\n    ?? `comic-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;\n}\n',
              'function id(): string {\n  return createSecureRandomUuid(\n    "이 브라우저에서는 안전한 AI 코믹 디렉터 문서 ID를 만들 수 없습니다.",\n  );\n}\n',
              sessionPath,
            );

            const panelPath = "apps/web/src/domains/creator/ai/StudioAiComicDirectorPanel.tsx";
            let panel = await read(panelPath);
            panel = replaceOnce(
              panel,
              'import { cn } from "@/shared/lib/utils";\n',
              'import { createSecureRandomUuid } from "@/shared/lib/secure-random-id";\nimport { cn } from "@/shared/lib/utils";\n',
              panelPath,
            );
            panel = replaceOnce(
              panel,
              'function uid(prefix: string): string {\n  return globalThis.crypto?.randomUUID?.() ?? `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;\n}\n',
              'function uid(prefix: string): string {\n  return `${prefix}-${createSecureRandomUuid(\n    `이 브라우저에서는 안전한 ${prefix} ID를 만들 수 없습니다.`,\n  )}`;\n}\n',
              panelPath,
            );

            const utilityPath = "apps/web/src/shared/lib/secure-random-id.ts";
            const utility = `const DEFAULT_SECURE_RANDOM_ID_ERROR =\n  "이 환경에서는 안전한 식별자를 만들 수 없습니다.";\n\n/** Creates an RFC 4122 version 4 UUID using Web Crypto only. */\nexport function createSecureRandomUuid(\n  errorMessage = DEFAULT_SECURE_RANDOM_ID_ERROR,\n): string {\n  const cryptoApi = globalThis.crypto;\n  if (typeof cryptoApi?.randomUUID === "function") {\n    try {\n      return cryptoApi.randomUUID();\n    } catch {\n      // Some embedded WebViews expose a throwing randomUUID implementation.\n    }\n  }\n  if (typeof cryptoApi?.getRandomValues !== "function") {\n    throw new Error(errorMessage);\n  }\n  const bytes = new Uint8Array(16);\n  try {\n    cryptoApi.getRandomValues(bytes);\n  } catch {\n    throw new Error(errorMessage);\n  }\n  bytes[6] = (bytes[6] & 0x0f) | 0x40;\n  bytes[8] = (bytes[8] & 0x3f) | 0x80;\n  const hex = Array.from(\n    bytes,\n    (value) => value.toString(16).padStart(2, "0"),\n  ).join("");\n  return [\n    hex.slice(0, 8),\n    hex.slice(8, 12),\n    hex.slice(12, 16),\n    hex.slice(16, 20),\n    hex.slice(20),\n  ].join("-");\n}\n`;

            const utilityTestPath = "apps/web/src/shared/lib/secure-random-id.test.ts";
            const utilityTest = `import { afterEach, describe, expect, it, vi } from "vitest";\n\nimport { createSecureRandomUuid } from "./secure-random-id";\n\nafterEach(() => {\n  vi.restoreAllMocks();\n  vi.unstubAllGlobals();\n});\n\ndescribe("createSecureRandomUuid", () => {\n  it("prefers the platform randomUUID implementation", () => {\n    const randomUUID = vi.fn(() => "123e4567-e89b-42d3-a456-426614174000");\n    const getRandomValues = vi.fn();\n    vi.stubGlobal("crypto", { randomUUID, getRandomValues });\n    expect(createSecureRandomUuid()).toBe(\n      "123e4567-e89b-42d3-a456-426614174000",\n    );\n    expect(randomUUID).toHaveBeenCalledOnce();\n    expect(getRandomValues).not.toHaveBeenCalled();\n  });\n\n  it.each(["missing", "throws"] as const)(\n    "uses secure bytes when randomUUID %s",\n    (mode) => {\n      const random = vi.spyOn(Math, "random").mockImplementation(() => {\n        throw new Error("insecure randomness must not issue IDs");\n      });\n      const getRandomValues = vi.fn((bytes: Uint8Array) => {\n        bytes.fill(0xab);\n        return bytes;\n      });\n      vi.stubGlobal("crypto", {\n        ...(mode === "throws"\n          ? { randomUUID: () => { throw new Error("UUID unavailable"); } }\n          : {}),\n        getRandomValues,\n      });\n      expect(createSecureRandomUuid()).toBe(\n        "abababab-abab-4bab-abab-abababababab",\n      );\n      expect(getRandomValues).toHaveBeenCalledOnce();\n      expect(random).not.toHaveBeenCalled();\n    },\n  );\n\n  it("fails closed without secure entropy", () => {\n    const random = vi.spyOn(Math, "random");\n    vi.stubGlobal("crypto", undefined);\n    expect(() => createSecureRandomUuid("secure ID unavailable")).toThrow(\n      "secure ID unavailable",\n    );\n    expect(random).not.toHaveBeenCalled();\n  });\n\n  it("fails closed when the secure byte provider throws", () => {\n    vi.stubGlobal("crypto", {\n      randomUUID: () => { throw new Error("UUID unavailable"); },\n      getRandomValues: () => { throw new Error("entropy unavailable"); },\n    });\n    expect(() => createSecureRandomUuid("secure ID unavailable")).toThrow(\n      "secure ID unavailable",\n    );\n  });\n});\n`;

            const boundaryTestPath = "apps/web/src/domains/creator/ai/studio-ai-comic-director-security.test.ts";
            const boundaryTest = `import { readFileSync } from "node:fs";\n\nimport { describe, expect, it } from "vitest";\n\nconst ID_CONSUMERS = [\n  "./studio-ai-comic-director-session.ts",\n  "./StudioAiComicDirectorPanel.tsx",\n  "../studio-router/routes/StudioAiComicDirectorRoute.tsx",\n] as const;\n\ndescribe("AI Comic Director identifier security", () => {\n  it("uses the shared Web Crypto issuer at every client-side ID boundary", () => {\n    for (const relativePath of ID_CONSUMERS) {\n      const source = readFileSync(new URL(relativePath, import.meta.url), "utf8");\n      expect(source, relativePath).toContain("createSecureRandomUuid");\n      expect(source, relativePath).not.toContain("Math.random");\n    }\n  });\n\n  it("keeps the API client free from insecure randomness", () => {\n    const source = readFileSync(\n      new URL("./studio-ai-comic-director-api.ts", import.meta.url),\n      "utf8",\n    );\n    expect(source).not.toContain("Math.random");\n  });\n});\n`;

            const blobs = {};
            for (const [path, content] of [
              [routePath, route],
              [sessionPath, session],
              [panelPath, panel],
              [utilityPath, utility],
              [utilityTestPath, utilityTest],
              [boundaryTestPath, boundaryTest],
            ]) {
              const blob = await github.rest.git.createBlob({ owner, repo, content, encoding: "utf-8" });
              blobs[path] = blob.data.sha;
            }

            const tree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: commit.data.tree.sha,
              tree: [
                ...Object.entries(blobs).map(([path, sha]) => ({ path, mode: "100644", type: "blob", sha })),
                { path: ".github/workflows/apply-code-scanning-secure-id-api-once.yml", mode: "100644", type: "blob", sha: null },
                { path: ".github/workflows/apply-code-scanning-secure-id-fast-once.yml", mode: "100644", type: "blob", sha: null },
                { path: ".github/workflows/apply-code-scanning-secure-id-once.yml", mode: "100644", type: "blob", sha: null },
                { path: ".github/workflows/code-scanning-audit-temp.yml", mode: "100644", type: "blob", sha: null },
                { path: ".github/code-scanning-open-alerts.json", mode: "100644", type: "blob", sha: null },
                { path: ".github/code-scanning-open-alerts.md", mode: "100644", type: "blob", sha: null },
              ],
            });
            const next = await github.rest.git.createCommit({
              owner,
              repo,
              message: "fix(security): use Web Crypto for comic director IDs",
              tree: tree.data.sha,
              parents: [parent],
            });
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: `heads/${branch}`,
              sha: next.data.sha,
              force: false,
            });
