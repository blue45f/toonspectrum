name: CI lint autofix once

on:
  push:
    branches:
      - fix/real-core-and-main-only-20260910
    paths:
      - .github/workflows/ci-lint-autofix-once.yml

permissions:
  contents: write

concurrency:
  group: ci-lint-autofix-final-20260910
  cancel-in-progress: false

jobs:
  autofix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/real-core-and-main-only-20260910
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply ESLint-supported fixes
        run: pnpm exec eslint --fix --no-warn-ignored apps packages scripts e2e || true
      - name: Commit only safe source fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/ci-lint-autofix-once.yml
          git diff --check
          git config user.name toonstudio-quality-ci
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No ESLint autofixes were available.'
          else
            git -c core.hooksPath=/dev/null commit -m 'fix(ci): apply safe ESLint autofixes'
            git push --no-verify origin HEAD:fix/real-core-and-main-only-20260910
          fi
