name: Patch iterative remediation with exact GitHub CodeQL gate

on:
  push:
    branches:
      - codex/code-scanning-remediation-20260908
    paths:
      - .github/workflows/patch-remediation-v5.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: codex/code-scanning-remediation-20260908
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Strengthen the final CodeQL gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/code-scanning-remediation-v5.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '  cancel-in-progress: false\n',
              '  cancel-in-progress: true\n',
              1,
          )
          text = text.replace('          queries: security-extended\n', '          queries: security-and-quality\n')

          first_anchor = '''      - name: Wait for protected core check on full candidate
'''
          first_gate = r'''      - name: Require zero GitHub CodeQL alerts on full PR candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          completed=false
          for attempt in $(seq 1 480); do
            runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${expected_sha}&per_page=100")"
            status="$(jq -r '[.workflow_runs[] | select(.path == "dynamic/github-code-scanning/codeql")][0].status // "missing"' <<<"$runs")"
            conclusion="$(jq -r '[.workflow_runs[] | select(.path == "dynamic/github-code-scanning/codeql")][0].conclusion // "pending"' <<<"$runs")"
            echo "CodeQL status=${status}; conclusion=${conclusion}; expected=${expected_sha}; attempt=${attempt}/480"
            if [[ "$status" == "completed" ]]; then
              [[ "$conclusion" == "success" ]] || exit 1
              completed=true
              break
            fi
            sleep 30
          done
          [[ "$completed" == "true" ]] || { echo "Timed out waiting for GitHub CodeQL." >&2; exit 1; }

          pr_count="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&tool_name=CodeQL&pr=${PR_NUMBER}&per_page=100" --slurp | jq '[.[][]] | length')"
          ref_count="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&tool_name=CodeQL&ref=refs%2Fpull%2F${PR_NUMBER}%2Fhead&per_page=100" --slurp | jq '[.[][]] | length')"
          echo "Open CodeQL alerts: pr=${pr_count}, pull-head-ref=${ref_count}"
          [[ "$pr_count" == "0" && "$ref_count" == "0" ]] || exit 1

'''
          if first_gate not in text:
              if first_anchor not in text:
                  raise SystemExit('Could not locate first core-check anchor')
              text = text.replace(first_anchor, first_gate + first_anchor, 1)

          second_anchor = '''      - name: Wait for protected core check after cleanup
'''
          second_gate = r'''      - name: Require zero GitHub CodeQL alerts after temporary-file cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$(git rev-parse HEAD)"
          completed=false
          for attempt in $(seq 1 480); do
            runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${expected_sha}&per_page=100")"
            status="$(jq -r '[.workflow_runs[] | select(.path == "dynamic/github-code-scanning/codeql")][0].status // "missing"' <<<"$runs")"
            conclusion="$(jq -r '[.workflow_runs[] | select(.path == "dynamic/github-code-scanning/codeql")][0].conclusion // "pending"' <<<"$runs")"
            echo "Post-cleanup CodeQL status=${status}; conclusion=${conclusion}; expected=${expected_sha}; attempt=${attempt}/480"
            if [[ "$status" == "completed" ]]; then
              [[ "$conclusion" == "success" ]] || exit 1
              completed=true
              break
            fi
            sleep 30
          done
          [[ "$completed" == "true" ]] || { echo "Timed out waiting for post-cleanup GitHub CodeQL." >&2; exit 1; }

          pr_count="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&tool_name=CodeQL&pr=${PR_NUMBER}&per_page=100" --slurp | jq '[.[][]] | length')"
          ref_count="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&tool_name=CodeQL&ref=refs%2Fpull%2F${PR_NUMBER}%2Fhead&per_page=100" --slurp | jq '[.[][]] | length')"
          echo "Post-cleanup open CodeQL alerts: pr=${pr_count}, pull-head-ref=${ref_count}"
          [[ "$pr_count" == "0" && "$ref_count" == "0" ]] || exit 1

'''
          if second_gate not in text:
              if second_anchor not in text:
                  raise SystemExit('Could not locate second core-check anchor')
              text = text.replace(second_anchor, second_gate + second_anchor, 1)

          cleanup_anchor = '''            .github/workflows/code-scanning-remediation-v5.yml \\
            .github/workflows/codeql-residual-round.yml \\
'''
          cleanup_replacement = '''            .github/workflows/code-scanning-remediation-v5.yml \\
            .github/workflows/codeql-residual-round.yml \\
            .github/workflows/patch-remediation-v5.yml \\
'''
          if cleanup_anchor in text:
              text = text.replace(cleanup_anchor, cleanup_replacement)

          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/patch-remediation-v5.yml
          git add -A
          git diff --check
          git commit -m "ci(security): enforce exact GitHub CodeQL zero gate"
          git push origin HEAD:codex/code-scanning-remediation-20260908
