name: Validate AI Comic Director main

# Branch-only integration gate. Removed after the complete repair set passes.
on:
  push:
    branches: [ci/validate-ai-comic-director-main-20260909]

permissions:
  contents: read

concurrency:
  group: validate-ai-comic-director-main-20260909
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused regression tests
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/ai/studio-ai-comic-director-media.test.ts
          apps/web/src/domains/creator/studio-router/studio-route-manifest.test.ts
          apps/web/src/domains/creator/ai/StudioStrokeProposalReviewPanel.test.tsx
          apps/web/src/domains/creator/ai/studio-3d-generation-client.test.ts
          apps/web/src/domains/creator/filter/studio-adjustment-effect-graph.test.ts
          apps/web/src/domains/creator/layer/studio-layer-effects-graph-adapter.test.ts
          apps/web/src/domains/creator/studio-large-epics-product-wiring.test.ts

      - name: Lint corrected integration files
        run: >-
          pnpm exec eslint --max-warnings=0
          apps/api/src/modules/studio-ai/studio-ai.module.ts
          apps/web/src/domains/creator/ai/studio-ai-comic-director-media.test.ts
          apps/web/src/domains/creator/studio-generated-2d-backgrounds.ts
          apps/web/src/domains/creator/studio-router/studio-route-manifest.test.ts
          apps/web/src/domains/creator/ai/StudioStrokeProposalReviewPanel.test.tsx
          apps/web/src/domains/creator/ai/studio-3d-generation-client.test.ts
          apps/web/src/domains/creator/filter/studio-adjustment-effect-graph.ts
          apps/web/src/domains/creator/layer/studio-layer-effects-graph-adapter.ts
          apps/web/src/domains/creator/studio-large-epics-product-wiring.test.ts
          apps/web/src/domains/creator/studio-soft-proofing.ts

      - name: Typecheck web and API
        run: pnpm run typecheck

      - name: Validate architecture
        run: pnpm run validate:architecture

      - name: Build production application
        run: pnpm run build
