name: Delete known completed branches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/delete-known-completed-branches.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: delete-known-completed-branches-20260904
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Delete allowlisted completed branches
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const repository = `${owner}/${repo}`;
            const defaultBranch = context.payload.repository?.default_branch ?? "main";
            const completed = [
              "automation/final-all-branches-driver-20260904",
              "automation/final-all-products-20260904-v3",
              "automation/lossless-all-remote-branches-20260903",
              "automation/merge-all-unmerged-20260903-driver-v10",
              "automation/source-snapshot-20260904",
              "ci/actions-queue-cleanup-20260904",
              "ci/restore-core-gate-20260904",
              "codex/studio-gpu-fabric-consolidation-20260904",
              "codex/studio-left-rail-editor-client-20260904",
              "feat/shaper-production-workspace-20260903",
              "feat/shaper-quality-workshop-20260903",
              "feat/shaper-surface-paint-20260903",
              "feat/studio-inspector-context-ux-20260904",
              "feat/webgpu-brush-residency-lru-20260904",
              "fix/restore-full-core-ci-20260904",
              "integration/final-products-20260904-v2",
              "integration/generated-history-only-20260903",
              "integration/lossless-current-main-sweep-20260903",
              "integration/source-ink-live-commit-20260904",
              "ops/blender-52-compat-fix-20260904",
              "ops/merge-all-preserve-20260903",
            ];

            const openPulls = await github.paginate(
              "GET /repos/{owner}/{repo}/pulls",
              { owner, repo, state: "open", per_page: 100 },
            );
            const openHeads = new Set(
              openPulls
                .filter((pull) => pull.head.repo?.full_name === repository)
                .map((pull) => pull.head.ref),
            );

            const deleted = [];
            const missing = [];
            const preserved = [];
            const failed = [];

            for (const branch of completed) {
              if (openHeads.has(branch)) {
                preserved.push(`${branch} — now used by an open PR`);
                continue;
              }

              let tip;
              try {
                const ref = await github.request(
                  "GET /repos/{owner}/{repo}/git/ref/{ref}",
                  { owner, repo, ref: `heads/${branch}` },
                );
                tip = ref.data.object.sha;
              } catch (error) {
                if (error.status === 404) {
                  missing.push(`${branch} — already absent`);
                  continue;
                }
                failed.push(`${branch} — ref read failed: ${error.message}`);
                continue;
              }

              try {
                const comparison = await github.request(
                  "GET /repos/{owner}/{repo}/compare/{basehead}",
                  { owner, repo, basehead: `${defaultBranch}...${branch}` },
                );
                if (comparison.data.ahead_by !== 0) {
                  preserved.push(
                    `${branch} — ${comparison.data.ahead_by} commit(s) not reachable from ${defaultBranch}`,
                  );
                  continue;
                }

                const current = await github.request(
                  "GET /repos/{owner}/{repo}/git/ref/{ref}",
                  { owner, repo, ref: `heads/${branch}` },
                );
                if (current.data.object.sha !== tip) {
                  preserved.push(`${branch} — tip changed during cleanup`);
                  continue;
                }

                await github.request(
                  "DELETE /repos/{owner}/{repo}/git/refs/{ref}",
                  { owner, repo, ref: `heads/${branch}` },
                );
                deleted.push(`${branch} — ${tip}`);
              } catch (error) {
                if (error.status === 404) {
                  missing.push(`${branch} — disappeared during cleanup`);
                } else {
                  failed.push(`${branch} — ${error.message}`);
                }
              }
            }

            const section = (title, values) => [
              `## ${title}`,
              ...(values.length ? values.map((value) => `- ${value}`) : ["- none"]),
              "",
            ].join("\n");
            const report = [
              "# Known completed branch cleanup",
              "",
              `- Deleted: ${deleted.length}`,
              `- Already absent: ${missing.length}`,
              `- Preserved: ${preserved.length}`,
              `- Failed: ${failed.length}`,
              "",
              section("Deleted", deleted),
              section("Already absent", missing),
              section("Preserved", preserved),
              section("Failed", failed),
            ].join("\n");

            core.info(report);
            await core.summary.addRaw(report).write();
            if (failed.length) core.setFailed(`${failed.length} deletion(s) failed`);
