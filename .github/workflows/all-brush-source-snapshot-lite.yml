name: All-brush benchmark source snapshot lite

on:
  push:
    branches:
      - feat/all-brush-long-stroke-quality-election-20260904
    paths:
      - .github/workflows/all-brush-source-snapshot-lite.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: all-brush-source-snapshot-lite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive tracked implementation source without large binary assets
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import zipfile

          root = Path.cwd()
          names = subprocess.check_output(
              ["git", "ls-files", "-z"],
          ).decode("utf-8").split("\0")
          excluded_prefixes = (
              "artifacts/",
              "batch_generated/",
              "docs/",
              "public/assets/",
              "public/studio/",
              ".github/qa/",
          )
          required_roots = (
              ".github/workflows/",
              "apps/",
              "deploy/",
              "e2e/",
              "lib/",
              "packages/",
              "scripts/",
              "src/",
              "tests/",
          )
          required_files = {
              ".editorconfig",
              ".gitattributes",
              ".gitignore",
              "eslint.config.js",
              "index.html",
              "package.json",
              "playwright.config.ts",
              "pnpm-lock.yaml",
              "pnpm-workspace.yaml",
              "tsconfig.json",
              "tsconfig.app.json",
              "tsconfig.node.json",
              "vite.config.ts",
              "vitest.config.ts",
              "vitest.perf.config.ts",
          }
          selected = []
          for name in names:
              if not name or name.startswith(excluded_prefixes):
                  continue
              path = root / name
              if not path.is_file():
                  continue
              if name in required_files or name.startswith(required_roots):
                  if path.stat().st_size <= 8 * 1024 * 1024:
                      selected.append(name)
          with zipfile.ZipFile(
              "/tmp/toonspectrum-source-lite.zip",
              "w",
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=6,
          ) as archive:
              for name in selected:
                  archive.write(root / name, name)
              archive.writestr(
                  "source-head.txt",
                  subprocess.check_output(["git", "rev-parse", "HEAD"]),
              )
          print(f"archived {len(selected)} tracked files")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: all-brush-source-lite-${{ github.sha }}
          path: /tmp/toonspectrum-source-lite.zip
          if-no-files-found: error
          retention-days: 2
