name: ToonStudio isolated final sync

on:
  push:
    branches:
      - feat/toonstudio-session-complete-20260911-1221
    paths:
      - .github/workflows/toonstudio-final-sync-v2.yml

permissions:
  contents: write

concurrency:
  group: toonstudio-isolated-final-sync-v2
  cancel-in-progress: false

jobs:
  validate-and-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout completion branch
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-session-complete-20260911-1221
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Configure git and fetch integration refs
        shell: bash
        run: |
          git config user.name "toonstudio-integration-bot"
          git config user.email "toonstudio-integration-bot@users.noreply.github.com"
          git fetch origin main feat/toonstudio-final-ia-20260911

      - name: Rebase onto latest main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/rewrite
          conflicts=$(mktemp)
          set +e
          GIT_EDITOR=true git rebase -X theirs origin/main
          rc=$?
          while ((rc)) && [[ -d .git/rebase-merge || -d .git/rebase-apply ]]; do
            mapfile -t files < <(git diff --name-only --diff-filter=U)
            ((${#files[@]})) || break
            printf '%s\n' "${files[@]}" >> "$conflicts"
            for file in "${files[@]}"; do
              if [[ $file == pnpm-lock.yaml ]]; then
                git checkout --ours -- "$file" || git checkout --theirs -- "$file"
              else
                git checkout --theirs -- "$file" || git checkout --ours -- "$file"
              fi
              git add "$file"
            done
            GIT_EDITOR=true git rebase --continue
            rc=$?
          done
          set -e
          if ((rc)); then
            git rebase --abort || true
            exit "$rc"
          fi
          {
            echo '# ToonStudio latest-main conflict audit'
            echo
            echo "- Latest main: \`$(git rev-parse origin/main)\`"
            echo "- Rebased feature: \`$(git rev-parse HEAD)\`"
            echo "- Recorded at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo '## Resolved files'
            if [[ -s $conflicts ]]; then sort -u "$conflicts" | sed 's/^/- `/' | sed 's/$/`/'; else echo '- None'; fi
          } > docs/rewrite/toonstudio-latest-main-conflict-audit.md

      - name: Preserve original PR-only commits
        shell: bash
        run: |
          set -euo pipefail
          original=origin/feat/toonstudio-final-ia-20260911
          mapfile -t commits < <(git rev-list --reverse --left-only --cherry-pick --no-merges "$original"...HEAD)
          {
            echo '# ToonStudio PR branch preservation audit'
            echo
            echo "- Original head: \`$(git rev-parse "$original")\`"
            echo "- Independent commits: ${#commits[@]}"
            echo
          } > docs/rewrite/toonstudio-pr-branch-preservation.md
          for commit in "${commits[@]}"; do
            echo "- \`$commit\` $(git show -s --format=%s "$commit")" >> docs/rewrite/toonstudio-pr-branch-preservation.md
            git cherry-pick -X theirs "$commit"
          done

      - name: Install rebased dependencies
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --frozen-lockfile

      - name: Verify completion ownership contract
        run: node scripts/verify-toonstudio-session-goals.mjs

      - name: Typecheck
        run: pnpm exec tsc -p tsconfig.json --noEmit --pretty false

      - name: Lint feature delta
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx' '*.mjs')
          if ((${#files[@]})); then pnpm exec eslint --max-warnings=0 "${files[@]}"; fi

      - name: Run feature tests
        shell: bash
        run: |
          mapfile -t tests < <(git diff --name-only origin/main...HEAD -- '*.test.ts' '*.test.tsx')
          if ((${#tests[@]})); then pnpm exec vitest run "${tests[@]}" --pool=forks --maxWorkers=2; fi

      - name: Run existing Studio contracts
        shell: bash
        run: |
          if pnpm run | grep -q 'verify:studio-ia'; then pnpm verify:studio-ia; fi
          if pnpm run | grep -q 'verify:studio-session-complete'; then pnpm verify:studio-session-complete; fi

      - name: Build production bundle
        run: pnpm build

      - name: Record final verification
        shell: bash
        run: |
          cat > docs/rewrite/toonstudio-session-final-validation.md <<EOF
          # ToonStudio session final validation

          - Validated feature head before report: \`$(git rev-parse HEAD)\`
          - Latest main: \`$(git rev-parse origin/main)\`
          - Validated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Session feature contract: passed
          - TypeScript: passed
          - ESLint feature delta: passed
          - Feature tests: passed
          - Existing Studio IA/session contracts: passed when configured
          - Production build: passed

          Story planning, continuity, production pipeline, webtoon quality, 3D render passes, voice and motion, templates, presentation audit, analytics, safe automation, Series Kit, localization, review, AI handoff, asset governance and export are connected through the canonical project shell.
          EOF

      - name: Commit verified state and remove one-shot workflows
        shell: bash
        run: |
          rm -f .github/workflows/apply-toonstudio-session-fixes.yml
          rm -f .github/workflows/apply-toonstudio-session-fixes-retry.yml
          rm -f .github/workflows/finalize-toonstudio-session.yml
          rm -f .github/workflows/install-toonstudio-session-gate.yml
          rm -f .github/workflows/repair-sync-toonstudio-session.yml
          rm -f .github/workflows/toonstudio-final-sync-v2.yml
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then git commit -m "chore(studio): finalize session implementation on latest main"; fi

      - name: Push completion branch
        shell: bash
        run: |
          git push --force-with-lease origin HEAD:feat/toonstudio-session-complete-20260911-1221

      - name: Synchronize PR 1307 branch
        shell: bash
        run: |
          expected=$(git rev-parse origin/feat/toonstudio-final-ia-20260911)
          git push --force-with-lease=refs/heads/feat/toonstudio-final-ia-20260911:$expected \
            origin HEAD:feat/toonstudio-final-ia-20260911
