name: Codex studio insert batch finalization once

on:
  push:
    branches:
      - fix/studio-insert-batch-finalize-20260909

permissions:
  contents: write

concurrency:
  group: codex-studio-insert-batch-finalization-once
  cancel-in-progress: true

jobs:
  finalize-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[codex-insert-finalized]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/studio-insert-batch-finalize-20260909
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply final queue and preview contracts
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/web/src/domains/creator/StudioInsertBatchPreflight.tsx")
          source = path.read_text()

          queue_before = '''  function commitItems(
            update: (
              current: readonly BatchItem[],
            ) => readonly BatchItem[],
          ): void {
            setItems((current) => {
              const next = update(current);
              itemsRef.current = next;
              return next;
            });
          }
          '''
          queue_after = '''  function commitItems(
            update: (
              current: readonly BatchItem[],
            ) => readonly BatchItem[],
          ): void {
            const next = update(itemsRef.current);
            itemsRef.current = next;
            setItems(next);
          }
          '''
          if source.count(queue_before) != 1:
              raise SystemExit(
                  f"expected one queue commit helper, found {source.count(queue_before)}"
              )
          source = source.replace(queue_before, queue_after, 1)

          preview_before = '''  const scale = Math.min(
            PREVIEW_WIDTH / target.width,
            PREVIEW_HEIGHT / target.height,
          );
          if (!Number.isFinite(scale) || scale <= 0) return null;
          const previewTarget = {
            x: (PREVIEW_WIDTH - target.width * scale) / 2,
            y: (PREVIEW_HEIGHT - target.height * scale) / 2,
            width: target.width * scale,
            height: target.height * scale,
          };
          let placements: readonly StudioInsertBatchPlacement[];
          try {
            placements = computeStudioInsertBatchPlacements(
              items.map((item) => ({
                id: item.id,
                width: item.prepared.width * scale,
                height: item.prepared.height * scale,
              })),
              { layout, spacing, target: previewTarget },
            );
          } catch {
            return null;
          }
          '''
          preview_after = '''  const previewScale = Math.min(
            PREVIEW_WIDTH / target.width,
            PREVIEW_HEIGHT / target.height,
          );
          if (!Number.isFinite(previewScale) || previewScale <= 0) return null;
          const previewTarget = {
            x: (PREVIEW_WIDTH - target.width * previewScale) / 2,
            y: (PREVIEW_HEIGHT - target.height * previewScale) / 2,
            width: target.width * previewScale,
            height: target.height * previewScale,
          };
          let placements: readonly StudioInsertBatchPlacement[];
          try {
            placements = computeStudioInsertBatchPlacements(
              items.map((item) => ({
                id: item.id,
                width: item.prepared.width,
                height: item.prepared.height,
              })),
              { layout, spacing, target },
            );
          } catch {
            return null;
          }
          '''
          if source.count(preview_before) != 1:
              raise SystemExit(
                  f"expected one scaled preview geometry block, found {source.count(preview_before)}"
              )
          source = source.replace(preview_before, preview_after, 1)

          placement_before = '''        {placements.map((placement, index) => {
            const item = itemById.get(placement.id);
            if (!item) return null;
            return (
              <span
                key={placement.id}
                aria-hidden
                className="absolute overflow-hidden rounded border border-accent/70 bg-panel shadow-sm"
                style={{
                  left: `${(placement.x / PREVIEW_WIDTH) * 100}%`,
                  top: `${(placement.y / PREVIEW_HEIGHT) * 100}%`,
                  width: `${(placement.width / PREVIEW_WIDTH) * 100}%`,
                  height: `${(placement.height / PREVIEW_HEIGHT) * 100}%`,
                  zIndex: index + 1,
                }}
              >
          '''
          placement_after = '''        {placements.map((placement, index) => {
            const item = itemById.get(placement.id);
            if (!item) return null;
            const previewPlacement = {
              x: previewTarget.x + (placement.x - target.x) * previewScale,
              y: previewTarget.y + (placement.y - target.y) * previewScale,
              width: placement.width * previewScale,
              height: placement.height * previewScale,
            };
            return (
              <span
                key={placement.id}
                aria-hidden
                className="absolute overflow-hidden rounded border border-accent/70 bg-panel shadow-sm"
                style={{
                  left: `${(previewPlacement.x / PREVIEW_WIDTH) * 100}%`,
                  top: `${(previewPlacement.y / PREVIEW_HEIGHT) * 100}%`,
                  width: `${(previewPlacement.width / PREVIEW_WIDTH) * 100}%`,
                  height: `${(previewPlacement.height / PREVIEW_HEIGHT) * 100}%`,
                  zIndex: index + 1,
                }}
              >
          '''
          if source.count(placement_before) != 1:
              raise SystemExit(
                  f"expected one preview placement block, found {source.count(placement_before)}"
              )
          source = source.replace(placement_before, placement_after, 1)
          path.write_text(source)

          stale_workflow = Path(
              ".github/workflows/codex-studio-insert-batch-draft-verify.yml"
          )
          if not stale_workflow.exists():
              raise SystemExit("expected the stale draft verification workflow")
          stale_workflow.unlink()

      - name: Lint insertion sources
        run: |
          pnpm exec eslint --fix \
            apps/web/src/domains/creator/StudioInsertBatchPreflight.tsx \
            apps/web/src/domains/creator/StudioInsertBatchPreflight.test.tsx \
            apps/web/src/domains/creator/studio-insert-batch-model.ts \
            apps/web/src/domains/creator/studio-insert-batch-model.test.ts \
            apps/web/src/domains/creator/studio-insert-batch-reachability.test.ts \
            apps/web/src/domains/creator/studio-insert-batch-preflight-contract.test.ts \
            apps/web/src/domains/creator/StudioUnifiedAssetToolPopoverContent.tsx
          pnpm exec eslint --max-warnings=0 \
            apps/web/src/domains/creator/StudioInsertBatchPreflight.tsx \
            apps/web/src/domains/creator/StudioInsertBatchPreflight.test.tsx \
            apps/web/src/domains/creator/studio-insert-batch-model.ts \
            apps/web/src/domains/creator/studio-insert-batch-model.test.ts \
            apps/web/src/domains/creator/studio-insert-batch-reachability.test.ts \
            apps/web/src/domains/creator/studio-insert-batch-preflight-contract.test.ts \
            apps/web/src/domains/creator/StudioUnifiedAssetToolPopoverContent.tsx

      - name: Run focused insertion regressions
        run: |
          pnpm exec vitest run \
            apps/web/src/domains/creator/studio-insert-batch-model.test.ts \
            apps/web/src/domains/creator/StudioInsertBatchPreflight.test.tsx \
            apps/web/src/domains/creator/studio-insert-batch-reachability.test.ts \
            apps/web/src/domains/creator/studio-insert-batch-preflight-contract.test.ts \
            apps/web/src/domains/creator/StudioInsertHubWorkspace.test.tsx \
            apps/web/src/domains/creator/StudioAssetToolPopoverWorkspace.test.tsx

      - name: Run type and architecture gates
        run: |
          pnpm exec tsc -p tsconfig.json
          pnpm run validate:architecture
          pnpm run verify:studio-menus
          git diff --check

      - name: Commit validated product-only diff
        run: |
          rm .github/workflows/codex-studio-insert-batch-finalize-once.yml
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "fix(studio): finalize exact batch insertion preflight [codex-insert-finalized]"
          git push origin HEAD:fix/studio-insert-batch-finalize-20260909
