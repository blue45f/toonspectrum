name: Patch AI Comic Director layer apply

on:
  push:
    branches:
      - feat/studio-ai-comic-director-complete-20260909
    paths:
      - "scripts/patch-studio-ai-comic-director-apply.mjs"
      - ".github/workflows/patch-studio-ai-comic-director-apply.yml"

permissions:
  contents: write

concurrency:
  group: patch-studio-ai-comic-director-apply
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/studio-ai-comic-director-complete-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
      - name: Patch Studio apply compiler
        run: node scripts/patch-studio-ai-comic-director-apply.mjs
      - name: Commit patched host
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/domains/creator/StudioCuttoonEditorHost.tsx
          git commit -m "feat(studio-ai): apply decomposed comic layers"
          git push origin HEAD:feat/studio-ai-comic-director-complete-20260909
