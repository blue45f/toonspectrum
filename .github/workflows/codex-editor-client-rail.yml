name: Codex EditorClient rail migration

on:
  push:
    branches:
      - codex/editor-client-rail-boundary-20260904

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/editor-client-rail-boundary-20260904
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Repair the one-shot migration helpers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/codex/apply-editor-client-rail.mjs')
          source = path.read_text()
          replacements = {
              'return `${source.slice(0, start)}${replacement}${source.slice(end)}`;':
                  'return `${source.slice(0, start)}${replacement}${source.slice(end + endMarker.length)}`;',
              'export interface StudioLeftToolRailHandlers\\n  extends StudioLeftToolRailHandlersContract {}\\n\\n':
                  'export type StudioLeftToolRailHandlers = StudioLeftToolRailHandlersContract;\\n\\n',
          }
          for old, new in replacements.items():
              assert source.count(old) == 1, old
              source = source.replace(old, new)
          path.write_text(source)
          PY
      - name: Apply the one-shot migration
        run: |
          node .github/codex/apply-editor-client-rail.mjs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/domains/creator/StudioLeftToolRail.test.tsx')
          source = path.read_text()
          old = "    const stableHandlers = createHandlers();\n    stableHandlers.fitCanvasToWidthWithFocus = vi.fn();"
          new = "    const stableHandlers: StudioLeftToolRailHandlers = {\n      ...createHandlers(),\n      fitCanvasToWidthWithFocus: vi.fn(),\n    };"
          assert source.count(old) == 1, 'readonly fit-width fixture not found'
          path.write_text(source.replace(old, new))
          PY
      - name: Check the changed Studio boundary
        run: |
          pnpm exec eslint --fix --max-warnings=0 \
            src/domains/creator/StudioLeftToolRail.tsx \
            src/domains/creator/StudioLeftToolRail.test.tsx \
            src/domains/creator/editor-client/studio-left-tool-rail-client.ts \
            src/domains/creator/editor-client/studio-left-tool-rail-client.test.ts \
            src/domains/creator/studio-cuttoon-editor/StudioCuttoonEditorWorkspace.tsx \
            src/domains/creator/studio-left-tool-rail-boundary.test.ts \
            src/domains/creator/studio-host-architecture-ratchet.test.ts
          pnpm exec vitest run \
            src/domains/creator/editor-client/studio-left-tool-rail-client.test.ts \
            src/domains/creator/StudioLeftToolRail.test.tsx \
            src/domains/creator/studio-left-tool-rail-boundary.test.ts \
            src/domains/creator/studio-host-architecture-ratchet.test.ts
          pnpm run validate:architecture
          pnpm run typecheck
      - name: Commit the verified migration
        run: |
          rm -f .github/codex/apply-editor-client-rail.mjs
          rm -f .github/workflows/codex-editor-client-rail.yml
          rmdir .github/codex 2>/dev/null || true
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor(studio): route left tool rail through EditorClient"
          git push --no-verify origin HEAD:codex/editor-client-rail-boundary-20260904
