name: Studio curated intake inspection
on:
  push:
    branches: [feat/studio-asset-browser-quality-20260906]
    paths: [.github/workflows/studio-curated-intake-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect only the selected official download pages
        run: |
          python3 - <<'PY'
          import urllib.request, re
          for slug in ['stylizednaturemegakit', 'medievalvillagemegakit']:
            url='https://quaternius.com/packs/'+slug+'.html'
            with urllib.request.urlopen(url, timeout=30) as r:
              text=r.read(1024*1024).decode('utf-8')
            print('\nPAGE',url)
            for line in text.splitlines():
              if any(k in line.lower() for k in ['standard', '.zip', 'itch.io', 'download', 'gumroad']):
                print(line[:800])
          PY
