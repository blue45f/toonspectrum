name: QA Studio exact 10 runner-hour soak

on:
  push:
    branches:
      - qa/studio-inapp-full-audit-20260902
    paths:
      - .github/workflows/qa-studio-10-runner-hour-soak-exact.yml
      - scripts/qa-studio-cross-browser-soak.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qa-studio-exact-10-runner-hour-soak-v1
  cancel-in-progress: false

jobs:
  prepare:
    name: Build production Studio once
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: studio-exact-soak-production-build
          path: dist
          retention-days: 7

  soak:
    name: ${{ matrix.browser }} / ${{ matrix.profile }} / 50m
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        browser: [chromium, firefox, webkit]
        profile: [compact-320, kakaotalk-360, instagram-390, naver-412]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps "${{ matrix.browser }}"
      - uses: actions/download-artifact@v4
        with:
          name: studio-exact-soak-production-build
          path: dist

      - name: Resolve mobile profile
        shell: bash
        run: |
          case "${{ matrix.profile }}" in
            compact-320)
              echo 'QA_VIEWPORT_WIDTH=320' >> "$GITHUB_ENV"
              echo 'QA_VIEWPORT_HEIGHT=568' >> "$GITHUB_ENV"
              echo 'QA_USER_AGENT=Mozilla/5.0 (Linux; Android 13; SM-A536N Build/TP1A.220624.014; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/122.0.0.0 Mobile Safari/537.36' >> "$GITHUB_ENV"
              ;;
            kakaotalk-360)
              echo 'QA_VIEWPORT_WIDTH=360' >> "$GITHUB_ENV"
              echo 'QA_VIEWPORT_HEIGHT=592' >> "$GITHUB_ENV"
              echo 'QA_USER_AGENT=Mozilla/5.0 (Linux; Android 14; SM-S918N Build/UP1A.231005.007; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/126.0.6478.71 Mobile Safari/537.36 KAKAOTALK 10.4.3' >> "$GITHUB_ENV"
              ;;
            instagram-390)
              echo 'QA_VIEWPORT_WIDTH=390' >> "$GITHUB_ENV"
              echo 'QA_VIEWPORT_HEIGHT=664' >> "$GITHUB_ENV"
              echo 'QA_USER_AGENT=Mozilla/5.0 (iPhone; CPU iPhone OS 17_4 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/21E236 Instagram 320.0.0.0.0 (iPhone15,3; iOS 17_4; ko_KR)' >> "$GITHUB_ENV"
              ;;
            naver-412)
              echo 'QA_VIEWPORT_WIDTH=412' >> "$GITHUB_ENV"
              echo 'QA_VIEWPORT_HEIGHT=700' >> "$GITHUB_ENV"
              echo 'QA_USER_AGENT=Mozilla/5.0 (Linux; Android 13; SM-G991N Build/TP1A.220624.014; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/122.0.0.0 Mobile Safari/537.36 NAVER(inapp; search; 1000; 12.9.1)' >> "$GITHUB_ENV"
              ;;
          esac

      - name: Start production preview
        shell: bash
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          echo $! > preview.pid
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/studio >/dev/null && exit 0
            sleep 1
          done
          cat preview.log
          exit 1

      - name: Run 50-minute repeated browser audit
        shell: bash
        env:
          QA_BROWSER: ${{ matrix.browser }}
          QA_PROFILE_ID: ${{ matrix.profile }}
          QA_SOAK_MINUTES: 50
          QA_REPORT_DIR: qa-results/studio-exact-soak/${{ matrix.browser }}-${{ matrix.profile }}
          QA_EVIDENCE_DIR: artifacts/studio-exact-soak/${{ matrix.browser }}-${{ matrix.profile }}
          STUDIO_BASE_URL: http://127.0.0.1:4173
        run: |
          set +e
          mkdir -p "$QA_REPORT_DIR" "$QA_EVIDENCE_DIR"
          node scripts/qa-studio-cross-browser-soak.mjs 2>&1 | tee "$QA_REPORT_DIR/run.log"
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > "$QA_REPORT_DIR/exit-code.txt"
          exit "$code"

      - name: Stop preview
        if: always()
        run: kill "$(cat preview.pid)" 2>/dev/null || true

      - name: Upload per-combination evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-exact-soak-${{ matrix.browser }}-${{ matrix.profile }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            qa-results/studio-exact-soak/${{ matrix.browser }}-${{ matrix.profile }}
            artifacts/studio-exact-soak/${{ matrix.browser }}-${{ matrix.profile }}
            preview.log

  aggregate:
    name: Aggregate exact 10 runner-hour evidence
    if: always()
    needs: [prepare, soak]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: studio-exact-soak-*
          path: downloaded-exact-soak
          merge-multiple: true
      - name: Aggregate summaries
        shell: bash
        run: |
          mkdir -p qa-results/studio-exact-soak/aggregate
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const summaries = [];
          const visit = (directory) => {
            if (!fs.existsSync(directory)) return;
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const full = path.join(directory, entry.name);
              if (entry.isDirectory()) visit(full);
              else if (entry.name === 'summary.json') {
                try { summaries.push(JSON.parse(fs.readFileSync(full, 'utf8'))); }
                catch (error) { console.error(full, error); }
              }
            }
          };
          visit('downloaded-exact-soak');
          const totalElapsedMinutes = summaries.reduce((sum, item) => sum + Number(item.elapsedMinutes || 0), 0);
          const aggregate = {
            generatedAt: new Date().toISOString(),
            expectedJobs: 12,
            completedJobs: summaries.length,
            totalElapsedMinutes,
            totalRunnerHours: Number((totalElapsedMinutes / 60).toFixed(2)),
            totalCases: summaries.reduce((sum, item) => sum + Number(item.cases || 0), 0),
            failedCases: summaries.reduce((sum, item) => sum + Number(item.failedCases || 0), 0),
            warningCases: summaries.reduce((sum, item) => sum + Number(item.warningCases || 0), 0),
            summaries,
          };
          const out = 'qa-results/studio-exact-soak/aggregate';
          fs.writeFileSync(path.join(out, 'summary.json'), JSON.stringify(aggregate, null, 2) + '\n');
          const rows = summaries.map((item) => `| ${item.browser} | ${item.profile} | ${item.elapsedMinutes} | ${item.cycles} | ${item.cases} | ${item.failedCases} | ${item.warningCases} |`);
          fs.writeFileSync(path.join(out, 'report.md'), [
            '# ToonStudio exact cross-browser soak',
            '',
            `- Completed jobs: ${aggregate.completedJobs}/${aggregate.expectedJobs}`,
            `- Measured browser runtime: ${aggregate.totalRunnerHours} runner-hours`,
            `- Route cases: ${aggregate.totalCases}`,
            `- Hard-failure cases: ${aggregate.failedCases}`,
            `- Warning cases: ${aggregate.warningCases}`,
            '',
            '| Browser | Profile | Minutes | Cycles | Cases | Failed | Warnings |',
            '|---|---|---:|---:|---:|---:|---:|',
            ...rows,
          ].join('\n') + '\n');
          console.log(JSON.stringify(aggregate, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: studio-exact-soak-aggregate
          retention-days: 30
          path: qa-results/studio-exact-soak/aggregate
      - name: Commit aggregate textual evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa-results/studio-exact-soak/aggregate
          git diff --cached --quiet && exit 0
          git commit -m "test(qa): record exact 10 runner-hour Studio soak [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
