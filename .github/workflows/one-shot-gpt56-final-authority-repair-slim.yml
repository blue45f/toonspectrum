name: One-shot GPT-5.6 final authority repair Slim

on:
  push:
    branches:
      - ci/gpt56-final-authority-repair-20260908-1836
    paths:
      - .github/workflows/one-shot-gpt56-final-authority-repair-slim.yml

permissions:
  contents: write

concurrency:
  group: one-shot-gpt56-final-authority-repair-slim-20260908-1836
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/gpt56-final-authority-repair-20260908-1836
          fetch-depth: 1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Apply reviewed browser authority allowances
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin ci/gpt56-final-authority-repair-20260908-1836
          python3 <<'PY'
          from pathlib import Path

          boundary = Path("apps/web/src/domains/creator/studio-browser-kv-authority-boundary.test.ts")
          boundary_text = boundary.read_text()
          constants = '''const CHARACTER_PLATFORM_LOCAL_DRAFT =
            "Versioned and size-bounded local-only Character Platform presets, manifest links, and surface-ink drafts; browser KV never grants server review, approval, publication, or entitlement authority.";
          const CHARACTER_PLATFORM_LOCAL_DRAFT_PROOF =
            "The exact calls are model-scoped or injected and schema/size validated; changing a key or occurrence requires this authority-ratchet review.";
          '''.replace("          ", "")
          if constants not in boundary_text:
              marker = '''const HISTORY_LEGACY_IDB_PROOF =
            "The default factory accepts only a caller-created legacyRecoveryVault and otherwise selects SQLite, native OPFS, or observable memory-only state.";
          '''.replace("          ", "")
              if boundary_text.count(marker) != 1:
                  raise SystemExit(f"Character Platform allowance constants marker count: {boundary_text.count(marker)}")
              boundary_text = boundary_text.replace(marker, marker + constants, 1)

          first_allowance = '''  allow("apps/web/src/domains/creator/character-platform/presets/character-part-preset-store.ts", "durable-storage-write", '"toonstudio.character-part-presets.v1"', 1, CHARACTER_PLATFORM_LOCAL_DRAFT, CHARACTER_PLATFORM_LOCAL_DRAFT_PROOF),'''
          if first_allowance not in boundary_text:
              marker = "  // Injected localStorage-compatible codecs retained outside product authority selection.\n"
              block = '''  // Character Platform local authoring drafts. Exact keys and operation counts remain review-gated.
            allow("apps/web/src/domains/creator/character-platform/presets/character-part-preset-store.ts", "durable-storage-write", '"toonstudio.character-part-presets.v1"', 1, CHARACTER_PLATFORM_LOCAL_DRAFT, CHARACTER_PLATFORM_LOCAL_DRAFT_PROOF),
            allow("apps/web/src/domains/creator/character-platform/surface-ink/character-surface-ink-storage.ts", "local-storage-write", "storageKey(modelKey)", 1, CHARACTER_PLATFORM_LOCAL_DRAFT, CHARACTER_PLATFORM_LOCAL_DRAFT_PROOF),
            allow("apps/web/src/domains/creator/character-platform/ui/use-character-platform-workbench.ts", "local-storage-write", "manifestStorageKey(modelId)", 1, CHARACTER_PLATFORM_LOCAL_DRAFT, CHARACTER_PLATFORM_LOCAL_DRAFT_PROOF),
            allow("apps/web/src/domains/creator/character-platform/ui/use-character-platform-workbench.ts", "local-storage-cleanup", "manifestStorageKey(modelId)", 1, CLEANUP_ONLY, CLEANUP_PROOF),

            // Injected localStorage-compatible codecs retained outside product authority selection.
          '''.replace("          ", "")
              if boundary_text.count(marker) != 1:
                  raise SystemExit(f"Character Platform allowance block marker count: {boundary_text.count(marker)}")
              boundary_text = boundary_text.replace(marker, block, 1)
          boundary.write_text(boundary_text)
          PY
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify repaired contracts
        run: |
          pnpm exec eslint --max-warnings=0 \
            apps/web/src/domains/creator/studio-router/StudioRouter.tsx \
            apps/web/src/domains/creator/character-shaper/StudioCharacterShaper.test.tsx \
            apps/web/src/domains/creator/studio-browser-kv-authority-boundary.test.ts
          pnpm exec vitest run \
            apps/web/src/domains/creator/studio-host-architecture-ratchet.test.ts \
            apps/web/src/domains/creator/character-shaper/StudioCharacterShaper.test.tsx \
            apps/web/src/domains/creator/studio-browser-kv-authority-boundary.test.ts
          pnpm exec tsc -p tsconfig.json --pretty false
      - name: Commit verified repair and retire temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin ci/gpt56-final-authority-repair-20260908-1836
          git rm -f --ignore-unmatch \
            .github/workflows/one-shot-final-integration-ci-repair.yml \
            .github/workflows/one-shot-final-integration-ci-repair-v2.yml \
            .github/workflows/one-shot-final-integration-ci-repair-v3.yml \
            .github/workflows/one-shot-gpt56-final-authority-repair.yml \
            .github/workflows/one-shot-gpt56-final-authority-repair-macos.yml \
            .github/workflows/one-shot-gpt56-final-authority-repair-macos14.yml \
            .github/workflows/one-shot-gpt56-final-authority-repair-windows.yml \
            .github/workflows/one-shot-gpt56-final-authority-repair-ubuntu.yml \
            .github/workflows/one-shot-gpt56-final-authority-repair-slim.yml
          git add apps/web/src/domains/creator/studio-browser-kv-authority-boundary.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ci): complete isolated final authority repair"
          git push origin HEAD:ci/gpt56-final-authority-repair-20260908-1836
