name: Retry ToonStudio verified fixes

on:
  push:
    branches:
      - feat/toonstudio-session-complete-20260911-1221
    paths:
      - .github/workflows/apply-toonstudio-session-fixes-retry.yml

permissions:
  contents: write

concurrency:
  group: retry-toonstudio-session-fixes
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout dedicated branch
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-session-complete-20260911-1221
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reuse deterministic source migration
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path(".github/workflows/apply-toonstudio-session-fixes.yml").read_text()
          block = re.search(
              r"- name: Apply deterministic source fixes\n.*?run: \|\n(?P<body>.*?)\n\s+- name: Verify source formatting",
              workflow,
              re.S,
          )
          if block is None:
              raise SystemExit("Could not locate the deterministic migration block")
          body = textwrap.dedent(block.group("body"))
          prefix = "python <<'PY'\n"
          if not body.startswith(prefix) or not body.rstrip().endswith("\nPY"):
              raise SystemExit("Unexpected deterministic migration block format")
          script = body[len(prefix):body.rfind("\nPY")]
          exec(compile(script, "toonstudio-session-migration.py", "exec"), {})
          PY

      - name: Verify source formatting
        run: git diff --check

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm exec tsc -p tsconfig.json --noEmit --pretty false

      - name: Lint changed TypeScript
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only -- '*.ts' '*.tsx')
          if ((${#files[@]})); then
            pnpm exec eslint --max-warnings=0 "${files[@]}"
          fi

      - name: Run changed tests
        shell: bash
        run: |
          mapfile -t tests < <(git diff --name-only -- '*.test.ts' '*.test.tsx')
          if ((${#tests[@]})); then
            pnpm exec vitest run "${tests[@]}" --pool=forks --maxWorkers=2
          fi

      - name: Commit verified fixes and remove one-shot workflows
        shell: bash
        run: |
          rm .github/workflows/apply-toonstudio-session-fixes.yml
          rm .github/workflows/apply-toonstudio-session-fixes-retry.yml
          git config user.name "toonstudio-integration-bot"
          git config user.email "toonstudio-integration-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(studio): stabilize integrated feature type contracts"
          git push origin HEAD:feat/toonstudio-session-complete-20260911-1221
