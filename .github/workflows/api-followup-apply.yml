name: Apply and verify API runtime follow-up
on:
  push:
    branches: [work/api-runtime-followup-20260912]
    paths: [.github/workflows/api-followup-apply.yml]
permissions:
  contents: read
concurrency:
  group: api-followup-apply
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      head: ${{ steps.commit.outputs.head }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply exact reviewed source edits with before and after hashes
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/work/api-runtime-followup-20260912
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path.cwd()
          staged={}
          for manifest in sorted(root.glob('.api-followup-edits/[1-4].json')):
              for op in json.loads(manifest.read_text()):
                  relative=pathlib.PurePosixPath(op['path'])
                  assert not relative.is_absolute() and '..' not in relative.parts
                  p=root/relative
                  old=p.read_bytes()
                  assert hashlib.sha256(old).hexdigest()==op['before'], f"Changed base: {relative}"
                  lines=old.decode().splitlines(keepends=True)
                  for start,end,text in reversed(op['edits']):
                      lines[start:end]=text.splitlines(keepends=True)
                  body=''.join(lines).encode()
                  assert hashlib.sha256(body).hexdigest()==op['after'], f"Edit integrity mismatch: {relative}"
                  staged[str(relative)]=body
          expected=json.loads((root/'.api-followup-edits/hashes.json').read_text())
          assert len(expected)==43 and len(staged)==18
          for name,digest in expected.items():
              body=staged.get(name,(root/name).read_bytes())
              assert hashlib.sha256(body).hexdigest()==digest, f"Source integrity mismatch: {name}"
          p=root/'vercel.json'
          old=p.read_text()
          data=json.loads(old)
          assert data['functions']['api/og.js']['includeFiles']=='dist/index.html'
          anchor='"includeFiles": "dist/index.html"'
          assert old.count(anchor)==1
          staged['vercel.json']=old.replace(anchor,'"includeFiles": "{dist/index.html,dist/og/titles/**}"').encode()
          for name,body in staged.items(): (root/name).write_bytes(body)
          print('Verified 43 exact source hashes; applied 18 bounded edits and OG packaging config')
          PY
          node --experimental-strip-types --test scripts/api-followup-unit.test.mjs
          node --test scripts/ci-core-gate.test.mjs scripts/ci-executed-gates.test.mjs
      - name: Commit only the feature branch and remove one-shot helpers
        id: commit
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/work/api-runtime-followup-20260912
          git rm -r .api-followup-edits .github/workflows/api-followup-apply.yml .github/workflows/api-followup-workspace.yml
          git add -u
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf(api): integrate bounded search, local OG and isolated runtime graphs'
          remote=$(git ls-remote origin refs/heads/work/api-runtime-followup-20260912 | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/work/api-runtime-followup-20260912
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: apply
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      CI: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.apply.outputs.head }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Actual focused regressions
        run: |
          set -euo pipefail
          mkdir -p artifacts/api-followup
          git rev-parse HEAD > artifacts/api-followup/head.txt
          mapfile -t tests < <(node -e 'JSON.parse(require("fs").readFileSync("scripts/api-followup-test-files.json","utf8")).forEach(x=>console.log(x))')
          pnpm exec vitest run "${tests[@]}" --reporter=default --reporter=json --outputFile=artifacts/api-followup/vitest.json 2>&1 | tee artifacts/api-followup/vitest.log
      - name: Typecheck application and API
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          pnpm run typecheck 2>&1 | tee artifacts/api-followup/typecheck.log
      - name: Changed source lint
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git diff 29aa82c1214fe9dbeba6712fcb9fc523528ef8f2 HEAD --name-only -- '*.ts' '*.tsx' '*.mjs' '*.cjs' '*.js' | xargs pnpm exec eslint --max-warnings=0 2>&1 | tee artifacts/api-followup/lint.log
      - name: API and web production build
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          (pnpm --filter @webtoon-nest/api build && pnpm run build && pnpm run check:studio-bundle && pnpm run verify:api-serverless-build) 2>&1 | tee artifacts/api-followup/build.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: api-followup-validation-${{ github.run_attempt }}
          path: artifacts/api-followup
          if-no-files-found: warn
          retention-days: 3
