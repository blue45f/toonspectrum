name: Repair ToonStudio finalization v4

on:
  push:
    branches:
      - feat/toonstudio-session-completion-followup-20260911
    paths:
      - .github/workflows/repair-toonstudio-finalization-v4.yml

permissions:
  contents: write

concurrency:
  group: validate-toonstudio-continuation-once
  cancel-in-progress: false

jobs:
  refactor-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CI: "true"
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout continuation branch
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-session-completion-followup-20260911
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Refactor state initialization and complete route ownership
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text()

          def write(path: str, value: str) -> None:
              Path(path).write_text(value)

          # Hook-safe start route: all impure identity creation happens in an effect.
          write("apps/web/src/domains/creator/studio-shell/StudioTemplateStartRoute.tsx", '''import { useEffect } from "react";\nimport { useNavigate, useParams } from "react-router-dom";\n\nimport {\n  createStudioTemplateHandoff,\n  studioTemplateById,\n  writeStudioTemplateHandoff,\n} from "../studio-template-catalog";\n\nfunction draftId(templateId: string): string {\n  const uuid = globalThis.crypto.randomUUID().replaceAll("-", "").slice(0, 12);\n  return `template-${templateId}-${uuid}`.slice(0, 150);\n}\n\n/** Create a fresh document identity, persist one handoff, then enter the editor. */\nexport function StudioTemplateStartRoute() {\n  const { templateId = "" } = useParams<{ templateId: string }>();\n  const navigate = useNavigate();\n  const template = studioTemplateById(templateId);\n\n  useEffect(() => {\n    if (!template) {\n      navigate("/studio/templates", { replace: true });\n      return;\n    }\n    writeStudioTemplateHandoff(\n      window.localStorage,\n      createStudioTemplateHandoff(template.id),\n    );\n    const params = new URLSearchParams({\n      template: template.id,\n      workspace: template.recommendedWorkspace,\n    });\n    params.sort();\n    navigate(\n      `/studio/draft/${encodeURIComponent(draftId(template.id))}?${params.toString()}`,\n      { replace: true },\n    );\n  }, [navigate, template]);\n\n  return null;\n}\n''')

          # Handoff host derives display state up front and performs only external effects later.
          write("apps/web/src/domains/creator/studio-cuttoon-editor/StudioTemplateHandoffHost.tsx", '''import { CheckCircle2, LayoutTemplate, X } from "lucide-react";\nimport { useEffect, useState } from "react";\n\nimport {\n  STUDIO_TEMPLATE_HANDOFF_KEY,\n  defaultStudioTemplateValues,\n  readStudioTemplateHandoff,\n  studioTemplateById,\n} from "../studio-template-catalog";\nimport { updateStudioProjectFeatureSuite } from "../studio-project-feature-suite-store";\nimport { buttonClass } from "@/shared/components/ui/button-utils";\nimport { useI18n } from "@/shared/lib/i18n";\n\nconst STUDIO_TEMPLATE_APPLIED_EVENT = "toonspectrum:studio-template-applied";\n\nfunction currentProjectIdentity(pathname: string): string {\n  const segments = pathname.split("/").filter(Boolean);\n  const studioIndex = segments.indexOf("studio");\n  const scope = studioIndex >= 0 ? segments[studioIndex + 1] : null;\n  const identity = studioIndex >= 0 ? segments[studioIndex + 2] : null;\n  if ((scope === "work" || scope === "draft") && identity) {\n    try {\n      return decodeURIComponent(identity);\n    } catch {\n      return identity;\n    }\n  }\n  return "draft";\n}\n\nfunction appliedStoryBeats(templateId: string) {\n  if (templateId === "webtoon-four-panel") {\n    return [\n      { id: "beat:template:setup", sceneId: "scene:template:four-panel", order: 0, kind: "setup" as const, summary: "상황과 인물을 빠르게 소개합니다.", dialogue: "", characterIds: ["character:lead"], locationId: "location:opening" },\n      { id: "beat:template:development", sceneId: "scene:template:four-panel", order: 1, kind: "action" as const, summary: "문제가 커지거나 기대를 만듭니다.", dialogue: "", characterIds: ["character:lead"], locationId: "location:opening" },\n      { id: "beat:template:twist", sceneId: "scene:template:four-panel", order: 2, kind: "reveal" as const, summary: "예상하지 못한 정보나 반전을 보여 줍니다.", dialogue: "", characterIds: ["character:lead"], locationId: "location:opening" },\n      { id: "beat:template:payoff", sceneId: "scene:template:four-panel", order: 3, kind: "reaction" as const, summary: "마지막 반응이나 결론으로 마무리합니다.", dialogue: "", characterIds: ["character:lead"], locationId: "location:opening" },\n    ];\n  }\n  if (templateId === "storyboard-animatic") {\n    return [\n      { id: "beat:template:opening", sceneId: "scene:template:opening", order: 0, kind: "setup" as const, summary: "공간과 주요 인물을 보여 주는 첫 장면", dialogue: "", characterIds: ["character:lead"], locationId: "location:opening" },\n      { id: "beat:template:action", sceneId: "scene:template:action", order: 1, kind: "action" as const, summary: "핵심 행동과 카메라 이동을 계획하는 장면", dialogue: "", characterIds: ["character:lead"], locationId: "location:opening" },\n      { id: "beat:template:closing", sceneId: "scene:template:closing", order: 2, kind: "transition" as const, summary: "다음 시퀀스로 이어지는 마무리 장면", dialogue: "", characterIds: [], locationId: "location:opening" },\n    ];\n  }\n  return null;\n}\n\n/** Consume one short-lived handoff in the real document runtime. */\nexport function StudioTemplateHandoffHost() {\n  const language = useI18n((state) => state.lang);\n  const locale = language.toLowerCase().startsWith("ko") ? "ko" : "en";\n  const [dismissed, setDismissed] = useState(false);\n  const [handoff] = useState(() => (\n    typeof window === "undefined" ? null : readStudioTemplateHandoff(window.localStorage)\n  ));\n  const template = studioTemplateById(handoff?.templateId);\n\n  useEffect(() => {\n    if (!handoff || !template) return;\n    const projectId = currentProjectIdentity(window.location.pathname);\n    const values = defaultStudioTemplateValues(template);\n    const storyBeats = appliedStoryBeats(template.id);\n    updateStudioProjectFeatureSuite(\n      window.localStorage,\n      projectId,\n      (current) => ({\n        ...current,\n        storyBeats: storyBeats ?? current.storyBeats,\n        design: {\n          ...current.design,\n          template: template.definition,\n          values,\n        },\n      }),\n      window,\n    );\n    window.dispatchEvent(new CustomEvent(STUDIO_TEMPLATE_APPLIED_EVENT, {\n      detail: Object.freeze({\n        projectId,\n        templateId: template.id,\n        workspace: template.recommendedWorkspace,\n        definition: template.definition,\n        values,\n      }),\n    }));\n    window.localStorage.removeItem(STUDIO_TEMPLATE_HANDOFF_KEY);\n  }, [handoff, template]);\n\n  if (!template || dismissed) return null;\n  return (\n    <div className="pointer-events-none fixed inset-x-0 top-16 z-[70] flex justify-center px-3">\n      <div className="pointer-events-auto flex max-w-xl items-start gap-3 rounded-2xl border border-success/30 bg-card/95 p-3 shadow-xl backdrop-blur">\n        <span className="grid size-9 shrink-0 place-items-center rounded-xl bg-success-soft/20 text-success">\n          <LayoutTemplate size={17} aria-hidden="true" />\n        </span>\n        <div className="min-w-0 flex-1">\n          <p className="flex items-center gap-1.5 text-xs font-black text-success">\n            <CheckCircle2 size={14} aria-hidden="true" />\n            {locale === "ko" ? "템플릿 적용됨" : "Template applied"}\n          </p>\n          <p className="mt-1 text-sm font-bold text-fg">\n            {locale === "ko" ? template.titleKo : template.titleEn}\n          </p>\n          <p className="mt-1 text-xs leading-5 text-fg-3">\n            {locale === "ko"\n              ? "새 문서에 기본 구조와 편집 가능한 항목을 준비했습니다. 이미지와 외부 에셋은 사용 전에 권리를 다시 확인합니다."\n              : "Prepared the editable structure in a new document. Image and external asset rights are checked again before use."}\n          </p>\n        </div>\n        <button\n          type="button"\n          aria-label={locale === "ko" ? "템플릿 적용 안내 닫기" : "Dismiss template notice"}\n          onClick={() => setDismissed(true)}\n          className={buttonClass({ variant: "quiet", size: "icon", className: "shrink-0" })}\n        >\n          <X size={15} aria-hidden="true" />\n        </button>\n      </div>\n    </div>\n  );\n}\n\nexport { STUDIO_TEMPLATE_APPLIED_EVENT };\n''')

          # Lazy state initialization avoids copying external stores in effects.
          templates_path = "apps/web/src/domains/creator/studio-shell/StudioTemplatesPage.tsx"
          templates = read(templates_path)
          templates = templates.replace('import { useEffect, useMemo, useState } from "react";', 'import { useMemo, useState } from "react";')
          templates = templates.replace(
              '  const [favoriteIds, setFavoriteIds] = useState<readonly string[]>([]);',
              '  const [favoriteIds, setFavoriteIds] = useState<readonly string[]>(() => (\n    typeof window === "undefined" ? [] : readStudioTemplateFavorites(window.localStorage)\n  ));',
          )
          effect = '''\n  useEffect(() => {\n    if (typeof window === "undefined") return;\n    setFavoriteIds(readStudioTemplateFavorites(window.localStorage));\n  }, []);\n'''
          templates = templates.replace(effect, "\n")
          write(templates_path, templates)

          governance_path = "apps/web/src/domains/creator/studio-shell/StudioAssetGovernancePanel.tsx"
          governance = read(governance_path)
          governance = governance.replace('import { useEffect, useMemo, useState } from "react";', 'import { useMemo, useState } from "react";')
          governance = governance.replace(
              '''  const [preferences, setPreferences] = useState<StudioAssetGovernancePreferences>(\n    createDefaultStudioAssetGovernancePreferences,\n  );''',
              '''  const [preferences, setPreferences] = useState<StudioAssetGovernancePreferences>(() => (\n    typeof window === "undefined"\n      ? createDefaultStudioAssetGovernancePreferences()\n      : readStudioAssetGovernancePreferences(window.localStorage, projectId)\n  ));''',
          )
          governance_effect = '''\n  useEffect(() => {\n    if (typeof window === "undefined") return;\n    setPreferences(readStudioAssetGovernancePreferences(window.localStorage, projectId));\n  }, [projectId]);\n'''
          governance = governance.replace(governance_effect, "\n")
          write(governance_path, governance)

          seller_path = "apps/web/src/domains/creator/studio-shell/StudioMarketplaceSellerPanel.tsx"
          seller = read(seller_path)
          seller = seller.replace('import { useEffect, useMemo, useState } from "react";', 'import { useMemo, useState } from "react";')
          seller = seller.replace(
              '''  const [submission, setSubmission] = useState<StudioMarketplaceSubmission>(() => (\n    createStudioMarketplaceSubmissionDraft(sellerId)\n  ));''',
              '''  const [submission, setSubmission] = useState<StudioMarketplaceSubmission>(() => (\n    typeof window === "undefined"\n      ? createStudioMarketplaceSubmissionDraft(sellerId)\n      : readStudioMarketplaceSubmissionDraft(window.localStorage, sellerId)\n        ?? createStudioMarketplaceSubmissionDraft(sellerId)\n  ));''',
          )
          seller_effect = '''\n  useEffect(() => {\n    if (typeof window === "undefined") return;\n    setSubmission(\n      readStudioMarketplaceSubmissionDraft(window.localStorage, sellerId)\n      ?? createStudioMarketplaceSubmissionDraft(sellerId),\n    );\n  }, [sellerId]);\n'''
          seller = seller.replace(seller_effect, "\n")
          checksum_start = seller.index("async function checksum(file: File)")
          checksum_end = seller.index("\n}\n", checksum_start) + 3
          seller = seller[:checksum_start] + '''async function checksum(file: File): Promise<string> {\n  if (!globalThis.crypto.subtle) {\n    throw new Error("Secure file verification is not available in this browser.");\n  }\n  const optionalFile = file as File & { arrayBuffer?: () => Promise<ArrayBuffer> };\n  const bytes = optionalFile.arrayBuffer\n    ? await optionalFile.arrayBuffer()\n    : await new Response(file).arrayBuffer();\n  const digest = await globalThis.crypto.subtle.digest("SHA-256", bytes);\n  return `sha256:${[...new Uint8Array(digest)]\n    .map((value) => value.toString(16).padStart(2, "0"))\n    .join("")}`;\n}\n''' + seller[checksum_end:]
          old = '''      commit({\n        ...submission,\n        files: Object.freeze([\n          ...submission.files.filter((item) => item.role !== role),\n          nextFile,\n        ]),\n        updatedAt: new Date().toISOString(),\n      }, locale === "ko" ? `${file.name}의 무결성을 확인했습니다.` : `Verified ${file.name}.`);'''
          if old in seller:
              seller = seller.replace(old, '''      setSubmission((current) => {\n        const next = {\n          ...current,\n          files: Object.freeze([\n            ...current.files.filter((item) => item.role !== role),\n            nextFile,\n          ]),\n          updatedAt: new Date().toISOString(),\n        };\n        return writeStudioMarketplaceSubmissionDraft(window.localStorage, next, window);\n      });\n      setMessage(locale === "ko" ? `${file.name}의 무결성을 확인했습니다.` : `Verified ${file.name}.`);''', 1)
          write(seller_path, seller)

          # A project change remounts stateful project-scoped panels rather than copying stores in effects.
          integrated_path = "apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.tsx"
          integrated = read(integrated_path)
          integrated = integrated.replace(
              '<StudioAssetGovernancePanel projectId={projectId} locale={locale} />',
              '<StudioAssetGovernancePanel key={projectId} projectId={projectId} locale={locale} />',
          )
          integrated = integrated.replace(
              '<StudioProjectDeliveryPanel\n          projectId={projectId}',
              '<StudioProjectDeliveryPanel\n          key={`${projectId}:${view}`}\n          projectId={projectId}',
          )
          write(integrated_path, integrated)

          hub_path = "apps/web/src/domains/creator/studio-shell/StudioAssetHubPage.tsx"
          hub = read(hub_path)
          hub = hub.replace(
              '<StudioAssetGovernancePanel projectId={projectId} locale={locale} />',
              '<StudioAssetGovernancePanel key={projectId} projectId={projectId} locale={locale} />',
          )
          hub = hub.replace(
              '<StudioMarketplaceSellerPanel sellerId={projectId ?? "current-seller"} locale={locale} />',
              '<StudioMarketplaceSellerPanel\n              key={projectId ?? "current-seller"}\n              sellerId={projectId ?? "current-seller"}\n              locale={locale}\n            />',
          )
          write(hub_path, hub)

          # Canonical catalogue and routes.
          catalog_path = "apps/web/src/domains/creator/studio-template-catalog.ts"
          catalog = read(catalog_path)
          catalog = catalog.replace('documentKind: "comic"', 'documentKind: "webtoon"')
          catalog = catalog.replace('documentKind: "slides"', 'documentKind: "presentation"')
          catalog = catalog.replace('rightsStatus: "unknown"', 'rightsStatus: "warning"')
          start = catalog.index("export function studioTemplateStartHref")
          end = catalog.index("\n}\n", start) + 3
          catalog = catalog[:start] + '''export function studioTemplateStartHref(templateId: string): string {\n  const template = studioTemplateById(templateId);\n  if (!template) throw new Error("A known Studio template is required.");\n  return `/studio/templates/${encodeURIComponent(template.id)}/start`;\n}\n''' + catalog[end:]
          write(catalog_path, catalog)

          pages_path = "apps/web/src/app/routes/groups/creator-route-pages.ts"
          pages = read(pages_path)
          if "export const StudioTemplateStartRoute" not in pages:
              marker = "export const StudioTemplatesPage = lazyRetry("
              if marker not in pages:
                  raise SystemExit("creator-route-pages.ts: templates export missing")
              pages = pages.replace(marker, '''export const StudioTemplateStartRoute = lazyRetry(\n  () => import("@/domains/creator/studio-shell/StudioTemplateStartRoute").then((module) => ({\n    default: module.StudioTemplateStartRoute,\n  })),\n  "StudioTemplateStartRoute",\n);\n''' + marker, 1)
          write(pages_path, pages)

          routes_path = "apps/web/src/app/routes/groups/creator.routes.tsx"
          routes = read(routes_path)
          if "  StudioTemplateStartRoute," not in routes:
              routes = routes.replace("  StudioTemplatesPage,\n", "  StudioTemplatesPage,\n  StudioTemplateStartRoute,\n", 1)
          if 'path: "/studio/templates/:templateId/start"' not in routes:
              marker = '  { id: "creator-studio-templates", path: "/studio/templates", element: <StudioTemplatesPage /> },\n'
              if marker not in routes:
                  raise SystemExit("creator.routes.tsx: templates route missing")
              routes = routes.replace(marker, '  { id: "creator-studio-template-start", path: "/studio/templates/:templateId/start", element: <StudioTemplateStartRoute /> },\n' + marker, 1)
          write(routes_path, routes)

          hosts_path = "apps/web/src/domains/creator/studio-cuttoon-editor/StudioCuttoonEditorHosts.tsx"
          hosts = read(hosts_path)
          if 'from "./StudioTemplateHandoffHost"' not in hosts:
              marker = 'import { StudioImportHandoffHost } from "./StudioImportHandoffHost";\n'
              if marker not in hosts:
                  raise SystemExit("StudioCuttoonEditorHosts.tsx: import handoff anchor missing")
              hosts = hosts.replace(marker, marker + 'import { StudioTemplateHandoffHost } from "./StudioTemplateHandoffHost";\n', 1)
          if "<StudioTemplateHandoffHost" not in hosts:
              offset = hosts.find("<StudioImportHandoffHost")
              if offset < 0:
                  raise SystemExit("StudioCuttoonEditorHosts.tsx: import handoff mount missing")
              hosts = hosts[:offset] + "<StudioTemplateHandoffHost />\n      " + hosts[offset:]
          write(hosts_path, hosts)

          # Tests: semantic assertions and stable current-time handoff.
          template_test_path = "apps/web/src/domains/creator/studio-template-catalog.test.ts"
          template_test = read(template_test_path)
          template_test = template_test.replace(
              '"/studio/new?template=webtoon-vertical-episode&workspace=comic"',
              '"/studio/templates/webtoon-vertical-episode/start"',
          )
          write(template_test_path, template_test)

          templates_ui_test_path = "apps/web/src/domains/creator/studio-shell/StudioTemplatesPage.test.tsx"
          templates_ui_test = read(templates_ui_test_path).replace(
              '.toContain("template=presentation-webtoon-pitch");',
              '.toBe("/studio/templates/presentation-webtoon-pitch/start");',
          )
          write(templates_ui_test_path, templates_ui_test)

          handoff_test_path = "apps/web/src/domains/creator/studio-cuttoon-editor/StudioTemplateHandoffHost.test.tsx"
          handoff_test = read(handoff_test_path).replace(
              '"2026-09-12T00:00:00.000Z",\n        3_600_000,',
              'new Date().toISOString(),\n        3_600_000,',
          )
          write(handoff_test_path, handoff_test)

          governance_test_path = "apps/web/src/domains/creator/studio-shell/StudioAssetGovernancePanel.test.tsx"
          governance_test = read(governance_test_path)
          governance_test = governance_test.replace('getByLabelText("구매한 계정 연결됨")', 'getByLabelText(/구매한 계정 연결됨/u)')
          governance_test = governance_test.replace('getByLabelText("AI 학습에 사용")', 'getByLabelText(/AI 학습에 사용/u)')
          write(governance_test_path, governance_test)

          delivery_test_path = "apps/web/src/domains/creator/studio-shell/StudioProjectDeliveryPanel.test.tsx"
          delivery_test = read(delivery_test_path).replace(
              'expect(screen.getByText("완전한 프로젝트 사본")).toBeTruthy();',
              'expect(screen.getAllByText("완전한 프로젝트 사본").length).toBeGreaterThan(0);',
          )
          write(delivery_test_path, delivery_test)

          # Remove temporary writers before lint and closure checks.
          for value in [
              ".github/workflows/repair-toonstudio-finalization-v4.yml",
              ".github/workflows/repair-toonstudio-finalization-v3.yml",
              ".github/workflows/repair-toonstudio-finalization-v2.yml",
              ".github/workflows/finalize-toonstudio-continuation.yml",
              ".github/workflows/apply-toonstudio-seller-center.yml",
              ".github/workflows/apply-toonstudio-continuation.yml",
              ".github/workflows/repair-toonstudio-continuation.yml",
              ".github/workflows/validate-toonstudio-continuation.yml",
              ".github/workflows/toonstudio-continuation-source-snapshot.yml",
              ".github/workflows/toonstudio-followup-source-snapshot.yml",
              ".github/workflows/finalize-toonstudio-session.yml",
              ".github/workflows/apply-toonstudio-session-fixes.yml",
              ".github/workflows/apply-toonstudio-session-fixes-retry.yml",
              ".github/workflows/toonstudio-final-sync-v2.yml",
              ".github/workflows/repair-sync-toonstudio-session.yml",
              ".github/workflows/install-toonstudio-session-gate.yml",
              ".github/workflows/apply-toonstudio-project-contract-repair.yml",
          ]:
              Path(value).unlink(missing_ok=True)
          PY

      - name: Format continuation source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -t files < <((git diff --name-only origin/main...HEAD; git diff --name-only) | sort -u | grep -E '\.(ts|tsx|mjs)$' || true)
          if ((${#files[@]})); then
            pnpm exec prettier --write "${files[@]}"
          fi
          git diff --check

      - name: Lint continuation source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -t files < <((git diff --name-only origin/main...HEAD; git diff --name-only) | sort -u | grep -E '\.(ts|tsx|mjs)$' || true)
          if ((${#files[@]})); then
            pnpm exec eslint --max-warnings=0 --no-warn-ignored "${files[@]}"
          fi

      - name: Typecheck whole workspace
        run: pnpm exec tsc -p tsconfig.json --noEmit --pretty false

      - name: Run focused continuation tests
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/studio-template-catalog.test.ts
          apps/web/src/domains/creator/studio-external-route.test.ts
          apps/web/src/domains/creator/studio-marketplace-submission-store.test.ts
          apps/web/src/domains/creator/studio-marketplace-submission.test.ts
          apps/web/src/domains/creator/studio-route-registry.test.ts
          apps/web/src/domains/creator/studio-product-ia.test.ts
          apps/web/src/domains/creator/studio-project-view-destinations.test.ts
          apps/web/src/domains/creator/studio-integration-closure.test.ts
          apps/web/src/domains/creator/studio-asset-governance.test.ts
          apps/web/src/domains/creator/studio-asset-passport.test.ts
          apps/web/src/domains/creator/studio-asset-provider.test.ts
          apps/web/src/domains/creator/studio-rights-graph.test.ts
          apps/web/src/domains/creator/studio-font-audit.test.ts
          apps/web/src/domains/creator/studio-plugin-registry.test.ts
          apps/web/src/domains/creator/studio-archive-manifest.test.ts
          apps/web/src/domains/creator/studio-publishing-connector.test.ts
          apps/web/src/domains/creator/studio-publishing-package.test.ts
          apps/web/src/domains/creator/studio-cuttoon-editor/StudioTemplateHandoffHost.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioTemplateStartRoute.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioTemplatesPage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioMarketplaceSellerPanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioAssetHubPage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioAssetGovernancePanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectDeliveryPanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.test.tsx
          --pool=forks --maxWorkers=2

      - name: Verify integration and reachability
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-toonstudio-feature-reachability.mjs
          if pnpm run | grep -q 'verify:studio-ia'; then pnpm run verify:studio-ia; fi
          if pnpm run | grep -q 'verify:studio-session-complete'; then pnpm run verify:studio-session-complete; fi
          bash scripts/verify-toonstudio-integration.sh core
          bash scripts/verify-toonstudio-integration.sh ui
          bash scripts/verify-toonstudio-integration.sh editor

      - name: Build production bundle
        run: pnpm run build:bundle

      - name: Record acceptance and push
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/rewrite
          cat > docs/rewrite/toonstudio-continuation-v4-acceptance.md <<EOF
          # ToonStudio continuation v4 acceptance

          - Validated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Base main: \`$(git rev-parse origin/main)\`
          - Whole-workspace TypeScript: passed
          - Continuation ESLint: passed
          - Template, asset, seller and delivery tests: passed
          - Feature reachability: passed
          - Core, UI and editor integration: passed
          - Production bundle: passed

          Project-scoped external state is initialized lazily and remounted by project identity. The template runtime consumes a single handoff without effect-driven state copies. Seller file hashing uses an optional browser compatibility path and functional persistence so concurrent file verification cannot discard another file.
          EOF
          git config user.name "toonstudio-integration-bot"
          git config user.email "toonstudio-integration-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(studio): finalize continuation state boundaries"
          git push origin HEAD:feat/toonstudio-session-completion-followup-20260911
