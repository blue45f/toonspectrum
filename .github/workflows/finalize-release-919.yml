name: Finalize release PR 919

on:
  push:
    branches:
      - release/final-main-merge-4888b061-immutable-20260908
    paths:
      - .github/workflows/finalize-release-919.yml

permissions:
  contents: write

concurrency:
  group: finalize-release-pr-919
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/final-main-merge-4888b061-immutable-20260908
          fetch-depth: 0
      - name: Sync main and absorb final accessibility fixes
        shell: bash
        run: |
          set -euo pipefail
          branch='release/final-main-merge-4888b061-immutable-20260908'
          git fetch origin main "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff -m "merge: sync protected main before final release" origin/main

          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              if new in text and old not in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one source match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          modal = Path("apps/web/src/components/browser-compat-modal.tsx")
          replace_once(
              modal,
              'className="absolute top-4 right-4 inline-flex h-9 w-9 items-center justify-center rounded-full bg-white/5 text-fg-3 hover:bg-white/10 hover:text-fg transition-colors"',
              'className="absolute top-4 right-4 inline-flex h-11 w-11 items-center justify-center rounded-full bg-white/5 text-fg-3 hover:bg-white/10 hover:text-fg transition-colors"',
              "browser modal close target",
          )
          replace_once(
              modal,
              'className="inline-flex h-10 items-center justify-center rounded-xl border border-white/15 bg-white/5 px-4 text-xs font-medium text-fg hover:bg-white/10 transition-colors"',
              'className="inline-flex min-h-11 max-w-full items-center justify-center rounded-xl border border-white/15 bg-white/5 px-4 py-2.5 text-center text-xs font-medium leading-tight text-fg hover:bg-white/10 transition-colors"',
              "browser modal copy target",
          )
          replace_once(
              modal,
              'className="inline-flex h-10 items-center justify-center gap-1.5 rounded-xl border border-accent/40 bg-accent/20 px-4 text-xs font-medium text-accent-light hover:bg-accent/30 transition-colors"',
              'className="inline-flex min-h-11 items-center justify-center gap-1.5 rounded-xl border border-accent/40 bg-accent/20 px-4 py-2.5 text-xs font-medium text-accent-light hover:bg-accent/30 transition-colors"',
              "browser modal refresh target",
          )
          replace_once(
              modal,
              'className="inline-flex h-10 items-center justify-center rounded-xl bg-accent px-4 text-xs font-semibold text-on-accent hover:bg-accent-2 transition-colors shadow-lg"',
              'className="inline-flex min-h-11 items-center justify-center rounded-xl bg-accent px-4 py-2.5 text-xs font-semibold text-on-accent hover:bg-accent-2 transition-colors shadow-lg"',
              "browser modal compatibility target",
          )

          Path("apps/web/src/components/browser-compat-modal.test.tsx").write_text('''// @vitest-environment jsdom

import { cleanup, render, screen } from "@testing-library/react";
import { afterEach, describe, expect, it, vi } from "vitest";

import { BrowserCompatModal } from "./browser-compat-modal";

vi.mock("../compat/browser-check", () => ({
  getBrowserInfo: () => ({ name: "Test Browser", version: "1", os: "Test OS" }),
  checkBrowserCompatibility: () => ({ missingFeatures: [] }),
}));

const classTokens = (element: HTMLElement) => element.className.split(/\\s+/);

describe("BrowserCompatModal touch targets", () => {
  afterEach(() => cleanup());

  it("keeps every visible modal action at least 44px tall", () => {
    render(<BrowserCompatModal isOpen onClose={vi.fn()} />);

    const closeButton = screen.getByRole("button", { name: "닫기" });
    expect(classTokens(closeButton)).toContain("h-11");
    expect(classTokens(closeButton)).toContain("w-11");

    for (const name of ["접속 주소 복사", "새로고침", "호환 모드로 계속하기"]) {
      const button = screen.getByRole("button", { name });
      expect(classTokens(button)).toContain("min-h-11");
      expect(classTokens(button)).not.toContain("h-10");
    }
  });
});
''', encoding="utf-8")

          lift = Path("apps/web/src/domains/creator/lift3d/StudioLift3dPage.tsx")
          replace_once(
              lift,
              'className={`min-h-9 flex-1 rounded-md',
              'className={`min-h-11 flex-1 rounded-md',
              "Lift3D preview tab target",
          )
          Path("apps/web/src/domains/creator/lift3d/StudioLift3dPage.touch-target.test.ts").write_text('''import { readFileSync } from "node:fs";

import { describe, expect, it } from "vitest";

const source = readFileSync(new URL("./StudioLift3dPage.tsx", import.meta.url), "utf8");

describe("Studio Lift3D preview touch targets", () => {
  it("keeps every preview tab at least 44px tall", () => {
    expect(source).toContain('className={`min-h-11 flex-1 rounded-md');
    expect(source).not.toContain('className={`min-h-9 flex-1 rounded-md');
  });
});
''', encoding="utf-8")

          Path(".github/secret_scanning.yml").write_text('''# These exact historical test fixtures used UUID-shaped synthetic IDs.
# OpenVSX access tokens are UUID-shaped, so GitHub detected the fixtures as secrets.
# Keep the exclusions narrow; production and runtime source files remain scanned.
paths-ignore:
  - "src/domains/market/hooks/use-market-resources.test.tsx"
  - "apps/web/src/domains/market/hooks/use-market-library.test.ts"
''', encoding="utf-8")
          PY

          git rm .github/workflows/finalize-release-919.yml
          git add \
            .github/secret_scanning.yml \
            apps/web/src/components/browser-compat-modal.tsx \
            apps/web/src/components/browser-compat-modal.test.tsx \
            apps/web/src/domains/creator/lift3d/StudioLift3dPage.tsx \
            apps/web/src/domains/creator/lift3d/StudioLift3dPage.touch-target.test.ts
          git diff --cached --check
          git commit -m "fix(a11y): absorb final touch-target and security updates"
          git push origin HEAD:"$branch"
