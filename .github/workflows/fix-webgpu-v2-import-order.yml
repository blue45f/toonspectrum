name: Normalize WebGPU V2 source ordering

on:
  push:
    branches:
      - feat/webgpu-brush-v2-final-20260904
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: normalize-webgpu-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[webgpu-v2-imports-fixed]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/webgpu-brush-v2-final-20260904
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Normalize and verify V2 source
        run: |
          pnpm exec prettier --write \
            scripts/studio-engine-webgpu-textured-brush-v2-benchmark-browser.ts \
            scripts/verify-studio-engine-webgpu-textured-brush-v2-benchmark.mjs \
            src/domains/creator/render/studio-engine-webgpu-textured-brush-benchmark-contract.ts \
            src/domains/creator/render/studio-engine-webgpu-textured-brush-benchmark-contract.test.ts \
            src/domains/creator/render/studio-engine-webgpu-textured-brush-runtime-v2.ts \
            src/domains/creator/render/studio-engine-webgpu-textured-brush-runtime-v2.test.ts
          pnpm exec eslint --fix \
            scripts/studio-engine-webgpu-textured-brush-v2-benchmark-browser.ts \
            scripts/verify-studio-engine-webgpu-textured-brush-v2-benchmark.mjs \
            src/domains/creator/render/studio-engine-webgpu-textured-brush-benchmark-contract.ts \
            src/domains/creator/render/studio-engine-webgpu-textured-brush-benchmark-contract.test.ts \
            src/domains/creator/render/studio-engine-webgpu-textured-brush-runtime-v2.ts \
            src/domains/creator/render/studio-engine-webgpu-textured-brush-runtime-v2.test.ts
          pnpm exec eslint --max-warnings=0 \
            scripts/studio-engine-webgpu-textured-brush-v2-benchmark-browser.ts \
            scripts/verify-studio-engine-webgpu-textured-brush-v2-benchmark.mjs \
            src/domains/creator/render/studio-engine-webgpu-textured-brush-benchmark-contract.ts \
            src/domains/creator/render/studio-engine-webgpu-textured-brush-benchmark-contract.test.ts \
            src/domains/creator/render/studio-engine-webgpu-textured-brush-runtime-v2.ts \
            src/domains/creator/render/studio-engine-webgpu-textured-brush-runtime-v2.test.ts
          pnpm exec vitest run \
            src/domains/creator/render/studio-engine-webgpu-textured-brush-benchmark-contract.test.ts \
            src/domains/creator/render/studio-engine-webgpu-textured-brush-runtime-v2.test.ts
          pnpm exec tsc -p tsconfig.json --noEmit --incremental false

      - name: Commit normalized implementation
        run: |
          git config user.name "toonstudio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            scripts/studio-engine-webgpu-textured-brush-v2-benchmark-browser.ts \
            scripts/verify-studio-engine-webgpu-textured-brush-v2-benchmark.mjs \
            src/domains/creator/render/studio-engine-webgpu-textured-brush-benchmark-contract.ts \
            src/domains/creator/render/studio-engine-webgpu-textured-brush-benchmark-contract.test.ts \
            src/domains/creator/render/studio-engine-webgpu-textured-brush-runtime-v2.ts \
            src/domains/creator/render/studio-engine-webgpu-textured-brush-runtime-v2.test.ts
          if git diff --cached --quiet; then
            echo "source already normalized"
            exit 0
          fi
          git diff --cached --check
          git commit --no-verify -m "fix(webgpu): normalize V2 source [webgpu-v2-imports-fixed]"
          git pull --rebase origin feat/webgpu-brush-v2-final-20260904
          git push --no-verify origin HEAD:feat/webgpu-brush-v2-final-20260904
