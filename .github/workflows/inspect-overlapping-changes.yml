name: Inspect overlapping remaining changes
on:
  push:
    branches: [ops/merge-final-check-20260913]
    paths: [.github/workflows/inspect-overlapping-changes.yml]
permissions:
  contents: read
  pull-requests: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Collect bounded three-way conflict evidence without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,concurrent.futures,hashlib,json,os,pathlib,subprocess,urllib.request
          api='https://api.github.com/repos/blue45f/toonspectrum/'
          root=pathlib.Path('artifacts/overlap-evidence');root.mkdir(parents=True)
          def read(path):
              req=urllib.request.Request(api+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
          trees={};blobs={}
          def tree(ref):
              if ref not in trees:
                  sha=read('git/commits/'+ref)['tree']['sha'];data=read('git/trees/'+sha+'?recursive=1');assert not data.get('truncated')
                  trees[ref]={e['path']:{k:e[k] for k in ('sha','mode','type')} for e in data['tree'] if e['type']!='tree'}
              return trees[ref]
          def load(sha):
              data=read('git/blobs/'+sha);assert data['encoding']=='base64'
              raw=base64.b64decode(data['content']);assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              return sha,raw
          def store(label,path,entry):
              if not entry:return
              target=root/label/path;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(blobs[entry['sha']])
          main=read('branches/main')['commit']['sha'];mt=tree(main);report={'main':main,'prs':[]}
          for number in [1349,1357,1362,1363,1364]:
              pr=read('pulls/'+str(number));head=pr['head']['sha'];base=read('compare/'+main+'...'+head+'?per_page=1')['merge_base_commit']['sha']
              ht,bt=tree(head),tree(base);changed=sorted(p for p in set(ht)|set(bt) if ht.get(p)!=bt.get(p))
              assert len(changed)<150
              wanted={mapping[p]['sha'] for p in changed for mapping in (mt,ht,bt) if p in mapping and mapping[p]['type']=='blob'}-blobs.keys()
              with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:blobs.update(pool.map(load,wanted))
              conflicts=[];rows=[]
              for path in changed:
                  ours,old,new=mt.get(path),bt.get(path),ht.get(path)
                  for label,entry in [('main',ours),('base',old),('head',new)]:store(str(number)+'/'+label,path,entry)
                  row={'path':path,'main':ours,'base':old,'head':new}
                  if ours==new:row['decision']='identical'
                  elif ours==old:row['decision']='take-head'
                  elif all(e and e['type']=='blob' for e in (ours,old,new)):
                      folder=root/str(number)
                      result=subprocess.run(['git','merge-file','-p','-L','main','-L','base','-L','feature',str(folder/'main'/path),str(folder/'base'/path),str(folder/'head'/path)],capture_output=True)
                      target=folder/'merged'/path;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(result.stdout)
                      row['decision']='text-conflict' if result.returncode else 'auto-merged'
                      if result.returncode:conflicts.append(path)
                  else:row['decision']='structural-conflict';conflicts.append(path)
                  rows.append(row)
              report['prs'].append({'number':number,'state':pr['state'],'merged':pr['merged'],'head':head,'base':base,'rows':rows,'conflicts':conflicts})
          report['main_at_end']=read('branches/main')['commit']['sha']
          (root/'report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps({'main':main,'prs':[{'number':p['number'],'head':p['head'],'conflicts':p['conflicts'],'files':len(p['rows'])} for p in report['prs']]},indent=2))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: remaining-overlap-evidence
          path: artifacts/overlap-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
