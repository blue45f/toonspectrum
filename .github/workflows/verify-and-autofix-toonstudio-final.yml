name: Verify and autofix ToonStudio final integration

on:
  push:
    branches:
      - feat/toonstudio-session-all-features-final-20260911
    paths:
      - .github/workflows/verify-and-autofix-toonstudio-final.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: complete-toonstudio-session-all-features
  cancel-in-progress: false

env:
  FINAL_BRANCH: feat/toonstudio-session-all-features-final-20260911

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-session-all-features-final-20260911
          fetch-depth: 0

      - name: Fetch current main and feature sources
        run: |
          git fetch origin main \
            feat/toonstudio-assets-rights-20260911 \
            feat/toonstudio-publishing-platforms-20260911 \
            feat/toonstudio-plugin-archive-20260911

      - name: Ensure main ancestry
        shell: bash
        run: |
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git config user.name "toonstudio-integration-bot"
            git config user.email "toonstudio-integration-bot@users.noreply.github.com"
            git rebase -X theirs origin/main
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile

      - name: Restore any missing isolated feature files
        shell: bash
        run: |
          declare -A sources=(
            [apps/web/src/domains/creator/studio-project-asset-market-store.ts]=feat/toonstudio-assets-rights-20260911
            [apps/web/src/domains/creator/studio-project-asset-market-store.test.ts]=feat/toonstudio-assets-rights-20260911
            [apps/web/src/domains/creator/studio-shell/useStudioProjectAssetMarket.ts]=feat/toonstudio-assets-rights-20260911
            [apps/web/src/domains/creator/studio-shell/StudioAssetRightsMarketplacePanel.tsx]=feat/toonstudio-assets-rights-20260911
            [apps/web/src/domains/creator/studio-shell/StudioAssetRightsMarketplacePanel.test.tsx]=feat/toonstudio-assets-rights-20260911
            [apps/web/src/domains/creator/studio-project-publishing-store.ts]=feat/toonstudio-publishing-platforms-20260911
            [apps/web/src/domains/creator/studio-project-publishing-store.test.ts]=feat/toonstudio-publishing-platforms-20260911
            [apps/web/src/domains/creator/studio-shell/useStudioProjectPublishing.ts]=feat/toonstudio-publishing-platforms-20260911
            [apps/web/src/domains/creator/studio-shell/StudioPublishingPlatformPanel.tsx]=feat/toonstudio-publishing-platforms-20260911
            [apps/web/src/domains/creator/studio-shell/StudioPublishingPlatformPanel.test.tsx]=feat/toonstudio-publishing-platforms-20260911
            [apps/web/src/domains/creator/studio-project-plugin-archive-store.ts]=feat/toonstudio-plugin-archive-20260911
            [apps/web/src/domains/creator/studio-project-plugin-archive-store.test.ts]=feat/toonstudio-plugin-archive-20260911
            [apps/web/src/domains/creator/studio-shell/useStudioProjectPluginArchive.ts]=feat/toonstudio-plugin-archive-20260911
            [apps/web/src/domains/creator/studio-shell/StudioPluginArchivePanel.tsx]=feat/toonstudio-plugin-archive-20260911
            [apps/web/src/domains/creator/studio-shell/StudioPluginArchivePanel.test.tsx]=feat/toonstudio-plugin-archive-20260911
          )
          for file in "${!sources[@]}"; do
            if [ ! -s "$file" ]; then
              mkdir -p "$(dirname "$file")"
              git show "origin/${sources[$file]}:$file" > "$file"
            fi
          done

      - name: Apply complete idempotent type fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(pathname: str, old: str, new: str) -> None:
              path=Path(pathname)
              if not path.exists(): return
              text=path.read_text()
              if old in text:
                  path.write_text(text.replace(old,new,1))

          typed={
            "apps/web/src/domains/creator/studio-archive-manifest.test.ts":[("const MANIFEST: StudioArchiveManifest = Object.freeze({","const MANIFEST: StudioArchiveManifest = Object.freeze<StudioArchiveManifest>({")],
            "apps/web/src/domains/creator/studio-asset-passport.test.ts":[("const BASE_BRUSH_QUALITY: StudioBrushQuality = Object.freeze({","const BASE_BRUSH_QUALITY: StudioBrushQuality = Object.freeze<StudioBrushQuality>({"),("const BASE_PASSPORT: StudioAssetPassport = Object.freeze({","const BASE_PASSPORT: StudioAssetPassport = Object.freeze<StudioAssetPassport>({"),("const BASE_CONTEXT: StudioAssetUsageContext = Object.freeze({","const BASE_CONTEXT: StudioAssetUsageContext = Object.freeze<StudioAssetUsageContext>({")],
            "apps/web/src/domains/creator/studio-asset-provider.test.ts":[("const PROVIDER: StudioAssetProviderDefinition = Object.freeze({","const PROVIDER: StudioAssetProviderDefinition = Object.freeze<StudioAssetProviderDefinition>({"),("const ENTITLEMENT: StudioAssetEntitlement = Object.freeze({","const ENTITLEMENT: StudioAssetEntitlement = Object.freeze<StudioAssetEntitlement>({")],
            "apps/web/src/domains/creator/studio-automation-recipe.test.ts":[("const RECIPE: StudioAutomationRecipe = Object.freeze({","const RECIPE: StudioAutomationRecipe = Object.freeze<StudioAutomationRecipe>({")],
            "apps/web/src/domains/creator/studio-font-audit.test.ts":[("const FONT: StudioFontManifest = Object.freeze({","const FONT: StudioFontManifest = Object.freeze<StudioFontManifest>({")],
            "apps/web/src/domains/creator/studio-marketplace-submission.test.ts":[("const SUBMISSION: StudioMarketplaceSubmission = Object.freeze({","const SUBMISSION: StudioMarketplaceSubmission = Object.freeze<StudioMarketplaceSubmission>({")],
            "apps/web/src/domains/creator/studio-plugin-registry.test.ts":[("const PLUGIN: StudioPluginManifest = Object.freeze({","const PLUGIN: StudioPluginManifest = Object.freeze<StudioPluginManifest>({")],
            "apps/web/src/domains/creator/studio-project-readiness-store.test.ts":[("const SNAPSHOT: StudioProjectReadinessSnapshot = Object.freeze({","const SNAPSHOT: StudioProjectReadinessSnapshot = Object.freeze<StudioProjectReadinessSnapshot>({")],
            "apps/web/src/domains/creator/studio-project-readiness.test.ts":[("const CONTINUITY: StudioContinuityReport = Object.freeze({","const CONTINUITY: StudioContinuityReport = Object.freeze<StudioContinuityReport>({"),("const PRODUCTION: StudioProductionPipelineReport = Object.freeze({","const PRODUCTION: StudioProductionPipelineReport = Object.freeze<StudioProductionPipelineReport>({"),("const REVIEW: StudioReviewReadiness = Object.freeze({","const REVIEW: StudioReviewReadiness = Object.freeze<StudioReviewReadiness>({"),("const EXPORT: StudioExportPreflightResult = Object.freeze({","const EXPORT: StudioExportPreflightResult = Object.freeze<StudioExportPreflightResult>({")],
            "apps/web/src/domains/creator/studio-publishing-connector.test.ts":[("const CONNECTOR: StudioPublishConnector = Object.freeze({","const CONNECTOR: StudioPublishConnector = Object.freeze<StudioPublishConnector>({"),("const PREFLIGHT: StudioExportPreflightResult = Object.freeze({","const PREFLIGHT: StudioExportPreflightResult = Object.freeze<StudioExportPreflightResult>({"),("const REQUEST: StudioPublishRequest = Object.freeze({","const REQUEST: StudioPublishRequest = Object.freeze<StudioPublishRequest>({")],
            "apps/web/src/domains/creator/studio-publishing-package.test.ts":[("const PREFLIGHT: StudioExportPreflightResult = Object.freeze({","const PREFLIGHT: StudioExportPreflightResult = Object.freeze<StudioExportPreflightResult>({"),("const RIGHTS: StudioRightsAuditReport = Object.freeze({","const RIGHTS: StudioRightsAuditReport = Object.freeze<StudioRightsAuditReport>({")],
            "apps/web/src/domains/creator/studio-rights-graph.test.ts":[("const GRAPH: StudioRightsGraph = Object.freeze({","const GRAPH: StudioRightsGraph = Object.freeze<StudioRightsGraph>({")],
            "apps/web/src/domains/creator/studio-series-kit.test.ts":[("const KIT: StudioSeriesKit = Object.freeze({","const KIT: StudioSeriesKit = Object.freeze<StudioSeriesKit>({")],
            "apps/web/src/domains/creator/studio-template-system.test.ts":[("const TEMPLATE: StudioTemplateDefinition = Object.freeze({","const TEMPLATE: StudioTemplateDefinition = Object.freeze<StudioTemplateDefinition>({")],
            "apps/web/src/domains/creator/studio-shell/StudioProjectReadinessPanel.test.tsx":[("const SNAPSHOT: StudioProjectReadinessSnapshot = Object.freeze({","const SNAPSHOT: StudioProjectReadinessSnapshot = Object.freeze<StudioProjectReadinessSnapshot>({")],
          }
          for filename,pairs in typed.items():
              for old,new in pairs: replace(filename,old,new)

          replace("apps/web/src/domains/creator/studio-project-diagnostic-source-store.ts","return Object.freeze(plainClone(value) as StudioProjectDiagnosticSource);","return Object.freeze(plainClone(value) as unknown as StudioProjectDiagnosticSource);")
          replace("apps/web/src/domains/creator/studio-project-feature-adapters.ts",'''import type {\n  StudioDiagnosticAssetStatus,\n  StudioProjectDiagnosticAsset,\n  StudioProjectDiagnosticSourceStorage,\n} from "./studio-project-diagnostics";''','''import type {\n  StudioDiagnosticAssetStatus,\n  StudioProjectDiagnosticAsset,\n} from "./studio-project-diagnostics";\nimport type { StudioProjectDiagnosticSourceStorage } from "./studio-project-diagnostic-source-store";''')
          replace("apps/web/src/domains/creator/studio-project-plugin-archive-store.test.ts","expect(manifest.totalBytes).toBe(8_582);","expect(manifest.totalBytes).toBe(8_584);")
          replace("apps/web/src/domains/creator/studio-project-asset-market-store.ts","const COMMERCIAL_LICENSE: StudioAssetLicense = Object.freeze({","const COMMERCIAL_LICENSE: StudioAssetLicense = Object.freeze<StudioAssetLicense>({")
          replace("apps/web/src/domains/creator/studio-project-publishing-store.ts","const TARGETS: readonly StudioPublishTargetProfile[] = Object.freeze([","const TARGETS: readonly StudioPublishTargetProfile[] = Object.freeze<StudioPublishTargetProfile[]>([")

          matcher_files=list(Path("apps/web/src/domains/creator/studio-shell").glob("*.test.tsx"))
          for path in matcher_files:
              text=path.read_text()
              text=text.replace('.toBeInTheDocument();','.toBeTruthy();')
              path.write_text(text)

          replace("apps/web/src/domains/creator/studio-shell/StudioReviewPanel.test.tsx",'expect(screen.getByRole("button", { name: "승인" })).toBeEnabled();','expect((screen.getByRole("button", { name: "승인" }) as HTMLButtonElement).disabled).toBe(false);')
          replace("apps/web/src/domains/creator/studio-shell/StudioReviewPanel.test.tsx",'expect(screen.getByRole("button", { name: "승인" })).toBeDisabled();','expect((screen.getByRole("button", { name: "승인" }) as HTMLButtonElement).disabled).toBe(true);')
          replace("apps/web/src/domains/creator/studio-shell/StudioAssetRightsMarketplacePanel.test.tsx",'expect(screen.getByText("1", { selector: "b" })).toBeTruthy();','expect(screen.getByText("판매 초안").parentElement?.textContent).toContain("1");')

          panel=Path("apps/web/src/domains/creator/studio-shell/StudioProjectFeatureSuitePanel.tsx")
          if panel.exists():
              text=panel.read_text()
              text=text.replace("  Activity,\n","")
              if 'import type { LucideIcon } from "lucide-react";' not in text:
                  text=text.replace('} from "lucide-react";\nimport { useMemo, useState } from "react";','} from "lucide-react";\nimport type { LucideIcon } from "lucide-react";\nimport { useMemo, useState, type ReactNode } from "react";')
              text=text.replace("readonly icon: typeof Activity;","readonly icon: LucideIcon;")
              text=text.replace("readonly children: React.ReactNode;","readonly children: ReactNode;")
              pairs=[
                ('''  const suite = useStudioProjectFeatureSuite(projectId, locale);\n  const report = useMemo(\n    () => suite.state ? safeResult(() => aggregateStudioAnalytics(suite.state.analyticsEvents)) : null,\n    [suite.state],\n  );''','''  const suite = useStudioProjectFeatureSuite(projectId, locale);\n  const state = suite.state;\n  const report = useMemo(\n    () => state ? safeResult(() => aggregateStudioAnalytics(state.analyticsEvents)) : null,\n    [state],\n  );'''),
                ("  if (!suite.state) {","  if (!state) {"),
                ('''  const suite = useStudioProjectFeatureSuite(projectId, locale);\n  const workspace = useStudioProjectWorkspace(projectId, locale);\n  const [kind, setKind] = useState<StudioStoryBeatKind>("dialogue");''','''  const suite = useStudioProjectFeatureSuite(projectId, locale);\n  const workspace = useStudioProjectWorkspace(projectId, locale);\n  const state = suite.state;\n  const workspaceState = workspace.state;\n  const [kind, setKind] = useState<StudioStoryBeatKind>("dialogue");'''),
                ('''  const storyboard = useMemo(\n    () => suite.state ? safeResult(() => planStudioStoryboard(suite.state.storyBeats)) : null,\n    [suite.state],\n  );\n  const continuity = useMemo(() => workspace.state\n    ? safeResult(() => analyzeStudioStoryContinuity(\n      workspace.state.story.bible,\n      workspace.state.story.states,\n      workspace.state.story.transitions,\n    ))\n    : null, [workspace.state]);''','''  const storyboard = useMemo(\n    () => state ? safeResult(() => planStudioStoryboard(state.storyBeats)) : null,\n    [state],\n  );\n  const continuity = useMemo(() => workspaceState\n    ? safeResult(() => analyzeStudioStoryContinuity(\n      workspaceState.story.bible,\n      workspaceState.story.states,\n      workspaceState.story.transitions,\n    ))\n    : null, [workspaceState]);'''),
                ("  if (!suite.state) return null;\n  const showPlanner","  if (!state) return null;\n  const showPlanner"),
                ("suite.state.storyBeats.map","state.storyBeats.map"),
                ("disabled={suite.state!.storyBeats.length <= 1}","disabled={state.storyBeats.length <= 1}"),
                ("workspace.state?.story.bible.characters.length","workspaceState?.story.bible.characters.length"),
                ("workspace.state?.story.bible.locations.length","workspaceState?.story.bible.locations.length"),
                ("workspace.state?.story.bible.facts.length","workspaceState?.story.bible.facts.length"),
                ('''  const workspace = useStudioProjectWorkspace(projectId, locale);\n  const report = useMemo(\n    () => workspace.state ? safeResult(() => analyzeStudioProductionPipeline(workspace.state.productionTasks)) : null,\n    [workspace.state],\n  );''','''  const workspace = useStudioProjectWorkspace(projectId, locale);\n  const workspaceState = workspace.state;\n  const report = useMemo(\n    () => workspaceState ? safeResult(() => analyzeStudioProductionPipeline(workspaceState.productionTasks)) : null,\n    [workspaceState],\n  );'''),
                ("  if (!workspace.state || !report) return null;","  if (!workspaceState || !report) return null;"),
                ("workspace.state.productionTasks.map","workspaceState.productionTasks.map"),
                ('''  const suite = useStudioProjectFeatureSuite(projectId, locale);\n  const report = useMemo(\n    () => suite.state ? safeResult(() => analyzeStudioWebtoonQuality(suite.state.quality)) : null,\n    [suite.state],\n  );\n  if (!suite.state || !report) return null;''','''  const suite = useStudioProjectFeatureSuite(projectId, locale);\n  const state = suite.state;\n  const report = useMemo(\n    () => state ? safeResult(() => analyzeStudioWebtoonQuality(state.quality)) : null,\n    [state],\n  );\n  if (!state || !report) return null;'''),
                ("suite.state.quality.balloons.map","state.quality.balloons.map"),
                ("suite.state!.render3d.request.passes.includes(pass)","state.render3d.request.passes.includes(pass)"),
                ("suite.state.voiceMotion.lines[0]?.text","state.voiceMotion.lines[0]?.text"),
                ("suite.state.design.values.title","state.design.values.title"),
                ("suite.state.automation.recipe.name","state.automation.recipe.name"),
                ("suite.state.automation.recipe.steps.length","state.automation.recipe.steps.length"),
                ("suite.state!.automation.recipe.steps.find","state.automation.recipe.steps.find"),
              ]
              for old,new in pairs:
                  if old in text: text=text.replace(old,new,1)
              panel.write_text(text)
          PY

      - name: Ensure project surfaces are connected
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          path=Path("apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.tsx")
          text=path.read_text()
          for line in [
            'import { StudioAssetRightsMarketplacePanel } from "./StudioAssetRightsMarketplacePanel";\n',
            'import { StudioPluginArchivePanel } from "./StudioPluginArchivePanel";\n',
            'import { StudioPublishingPlatformPanel } from "./StudioPublishingPlatformPanel";\n',
          ]:
              if line not in text:
                  anchor='import { StudioExportPanel } from "./StudioExportPanel";\n'
                  if anchor not in text: raise SystemExit("Missing project integration import anchor")
                  text=text.replace(anchor,line+anchor,1)
          start=text.find("function SectionWorkflow({")
          end=text.find("/**\n * Compose the canonical project shell",start)
          if start < 0 or end < 0: raise SystemExit("Missing SectionWorkflow")
          replacement='''function SectionWorkflow({\n  projectId,\n  section,\n  view,\n  locale,\n}: {\n  readonly projectId: string;\n  readonly section: StudioProjectSection;\n  readonly view: string;\n  readonly locale: Locale;\n}) {\n  return (\n    <>\n      <StudioProjectFeatureSuitePanel projectId={projectId} section={section} view={view} locale={locale} />\n      {section === "story" && view === "localization" ? <StudioLocalizationPanel projectId={projectId} locale={locale} /> : null}\n      {section === "settings" && (view === "plugins" || view === "automation") ? <StudioPluginArchivePanel projectId={projectId} locale={locale} mode="plugins" /> : null}\n      {section === "settings" && view === "archive" ? <StudioPluginArchivePanel projectId={projectId} locale={locale} mode="archive" /> : null}\n      {section === "assets" && view !== "series" ? <StudioAssetRightsMarketplacePanel projectId={projectId} locale={locale} initialView={view} /> : null}\n      {section === "assets" && view === "series" ? <StudioSeriesKitPanel projectId={projectId} locale={locale} /> : null}\n      {section === "review" ? <StudioReviewPanel projectId={projectId} locale={locale} /> : null}\n      {section === "export" ? (\n        <>\n          <StudioPublishingPlatformPanel projectId={projectId} locale={locale} view={view} />\n          <StudioExportPanel projectId={projectId} locale={locale} />\n        </>\n      ) : null}\n    </>\n  );\n}\n\n'''
          path.write_text(text[:start]+replacement+text[end:])
          panel=Path("apps/web/src/domains/creator/studio-shell/StudioProjectFeatureSuitePanel.tsx")
          text=panel.read_text().replace('''  if (section === "assets" && ["project", "installed", "rights"].includes(view)) {\n    return <DesignTemplatePanel projectId={projectId} locale={locale} />;\n  }\n''',"")
          text,_=re.compile(r'\n  if \(section === "settings" && view === "archive"\) \{\n.*?\n  \}\n  return null;',re.S).subn("\n  return null;",text,count=1)
          panel.write_text(text)
          PY

      - name: Lint autofix
        run: >-
          pnpm exec eslint --fix
          apps/web/src/domains/creator/studio-project-asset-market-store.ts
          apps/web/src/domains/creator/studio-project-plugin-archive-store.ts
          apps/web/src/domains/creator/studio-project-publishing-store.ts
          apps/web/src/domains/creator/studio-shell/useStudioProjectAssetMarket.ts
          apps/web/src/domains/creator/studio-shell/useStudioProjectPluginArchive.ts
          apps/web/src/domains/creator/studio-shell/useStudioProjectPublishing.ts
          apps/web/src/domains/creator/studio-shell/StudioAssetRightsMarketplacePanel.tsx
          apps/web/src/domains/creator/studio-shell/StudioPluginArchivePanel.tsx
          apps/web/src/domains/creator/studio-shell/StudioPublishingPlatformPanel.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectFeatureSuitePanel.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.tsx

      - name: Remove all temporary workflows
        run: |
          rm -f .github/workflows/complete-toonstudio-session-all-features.yml
          rm -f .github/workflows/repair-toonstudio-session-all-features.yml
          rm -f .github/workflows/verify-and-autofix-toonstudio-final.yml
          rm -f .github/workflows/apply-toonstudio-session-fixes.yml
          rm -f .github/workflows/apply-toonstudio-session-fixes-retry.yml

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm exec tsc -p tsconfig.json --noEmit --pretty false

      - name: Strict lint
        run: >-
          pnpm exec eslint --max-warnings=0
          apps/web/src/domains/creator/studio-project-asset-market-store.ts
          apps/web/src/domains/creator/studio-project-plugin-archive-store.ts
          apps/web/src/domains/creator/studio-project-publishing-store.ts
          apps/web/src/domains/creator/studio-shell/useStudioProjectAssetMarket.ts
          apps/web/src/domains/creator/studio-shell/useStudioProjectPluginArchive.ts
          apps/web/src/domains/creator/studio-shell/useStudioProjectPublishing.ts
          apps/web/src/domains/creator/studio-shell/StudioAssetRightsMarketplacePanel.tsx
          apps/web/src/domains/creator/studio-shell/StudioPluginArchivePanel.tsx
          apps/web/src/domains/creator/studio-shell/StudioPublishingPlatformPanel.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectFeatureSuitePanel.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.tsx

      - name: Feature regression tests
        run: >-
          pnpm exec vitest run
          apps/web/src/app/routes/groups/app-routes.test.tsx
          apps/web/src/domains/creator/studio-route-registry.test.ts
          apps/web/src/domains/creator/studio-main-menu-presentation.test.ts
          apps/web/src/domains/creator/studio-capability-registry.test.ts
          apps/web/src/domains/creator/studio-surface-registry.test.ts
          apps/web/src/domains/creator/studio-project-view-destinations.test.ts
          apps/web/src/domains/creator/studio-project-workspace-store.test.ts
          apps/web/src/domains/creator/studio-project-feature-suite-store.test.ts
          apps/web/src/domains/creator/studio-project-asset-market-store.test.ts
          apps/web/src/domains/creator/studio-project-publishing-store.test.ts
          apps/web/src/domains/creator/studio-project-plugin-archive-store.test.ts
          apps/web/src/domains/creator/studio-storyboard-planner.test.ts
          apps/web/src/domains/creator/studio-story-bible.test.ts
          apps/web/src/domains/creator/studio-production-pipeline.test.ts
          apps/web/src/domains/creator/studio-webtoon-quality.test.ts
          apps/web/src/domains/creator/studio-webtoon-3d-render.test.ts
          apps/web/src/domains/creator/studio-voice-motion.test.ts
          apps/web/src/domains/creator/studio-template-system.test.ts
          apps/web/src/domains/creator/studio-presentation-layout.test.ts
          apps/web/src/domains/creator/studio-analytics.test.ts
          apps/web/src/domains/creator/studio-automation-recipe.test.ts
          apps/web/src/domains/creator/studio-localization-workflow.test.ts
          apps/web/src/domains/creator/studio-review-workflow.test.ts
          apps/web/src/domains/creator/studio-export-preflight.test.ts
          apps/web/src/domains/creator/studio-series-kit.test.ts
          apps/web/src/domains/creator/studio-shell/StudioProjectIntegratedPage.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectFeatureSuitePanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioAssetRightsMarketplacePanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioPublishingPlatformPanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioPluginArchivePanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioLocalizationPanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioReviewPanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioSeriesKitPanel.test.tsx
          apps/web/src/domains/creator/studio-shell/StudioProjectAssistantPanel.test.tsx
          --pool=forks --maxWorkers=2

      - name: Production build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm build

      - name: Write verification report
        run: |
          mkdir -p docs/rewrite
          cat > docs/rewrite/toonstudio-session-all-features-final-report.md <<EOF
          # ToonStudio session all-features final verification

          - Verified: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Main base: $(git rev-parse origin/main)
          - Verified head before commit: $(git rev-parse HEAD)
          - Typecheck: passed
          - Strict integrated-source lint: passed
          - Connected feature regression suite: passed
          - Production build: passed
          - Asset rights marketplace, destination-first publishing, plugin permissions and complete project archive: connected
          - Story, storyboard, production, webtoon quality, 3D render planning, voice and motion, structured templates, presentation audit, localization, review, Series Kit, AI handoff, analytics and automation: retained

          External AI, protected marketplace payments/downloads and direct platform publishing remain capability-gated until real credentials and official APIs are configured. No fake success state is recorded.
          EOF

      - name: Commit and push final verification
        run: |
          git config user.name "toonstudio-integration-bot"
          git config user.email "toonstudio-integration-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo no-changes
          else
            git commit -m "fix(studio): finish type-safe all-features integration"
            git push --force-with-lease origin HEAD:"$FINAL_BRANCH"
          fi

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$FINAL_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --title "feat: complete ToonStudio unified creative production workspace" --body-file docs/rewrite/toonstudio-session-all-features-final-report.md
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$FINAL_BRANCH" --title "feat: complete ToonStudio unified creative production workspace" --body-file docs/rewrite/toonstudio-session-all-features-final-report.md
          fi
