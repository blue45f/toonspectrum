name: One-shot PR 900 priority

on:
  push:
    branches:
      - ops/pr900-priority-20260908
    paths:
      - .github/workflows/one-shot-pr900-priority.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: one-shot-pr900-priority-20260908
  cancel-in-progress: true

jobs:
  prioritize-pr900:
    runs-on: ubuntu-slim
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP_BRANCH: feat/studio-3d-quality-expansion-20260908
      CLOSED_BRANCH: codex/pr874-workflow-integrity-fix
      STALE_PR900_CI_RUN: "34168128282"
    steps:
      - name: Cancel closed PR 911 runs and stale PR 900 CI only
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          self="$GITHUB_RUN_ID"
          candidates="$(mktemp)"
          for status in queued in_progress waiting pending requested; do
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${repo}/actions/runs?status=${status}&per_page=100" \
              --jq '.workflow_runs[] | [.id, .head_branch, .head_sha, .name, .status] | @tsv' \
              >> "$candidates"
          done

          cancelled=0
          preserved=0
          while IFS=$'\t' read -r run_id branch sha name status; do
            [[ -n "$run_id" ]] || continue
            if [[ "$run_id" == "$self" ]]; then
              preserved=$((preserved + 1))
              continue
            fi

            should_cancel=false
            reason=""
            if [[ "$branch" == "$CLOSED_BRANCH" ]]; then
              should_cancel=true
              reason="closed PR 911"
            elif [[ "$run_id" == "$STALE_PR900_CI_RUN" ]]; then
              should_cancel=true
              reason="superseded PR 900 CI"
            fi

            if [[ "$should_cancel" != true ]]; then
              preserved=$((preserved + 1))
              continue
            fi

            echo "Cancelling ${reason}: ${name}#${run_id} ${branch}@${sha} (${status})"
            gh api --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${repo}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 || true
            cancelled=$((cancelled + 1))
          done < <(sort -u "$candidates")

          echo "Requested ${cancelled} cancellations; preserved ${preserved} unrelated/current runs."

      - name: Retire one-shot branch
        if: always()
        shell: bash
        run: |
          encoded='ops%2Fpr900-priority-20260908'
          gh api --method DELETE \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}" \
            >/dev/null 2>&1 || true
