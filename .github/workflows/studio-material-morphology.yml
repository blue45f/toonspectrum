name: Studio material morphology

on:
  pull_request:
    branches: [main]
    paths:
      - apps/web/src/domains/creator/brush/**
      - apps/web/src/domains/creator/brush-lab/**
      - apps/web/src/domains/creator/studio-dynamic-brush-*.ts
      - apps/web/src/domains/creator/live/studio-live-dynamic-brush-overlay*
      - apps/web/config/vite-manual-chunks.ts
      - scripts/generate-studio-material-tip-atlas.mts
      - scripts/studio-material-morphology-browser.ts
      - scripts/verify-studio-material-morphology.mjs
      - scripts/verify-studio-material-atlas-boundary.mjs
      - scripts/studio-material-atlas-boundary.test.ts
      - scripts/studio-hybrid-topology-browser.ts
      - scripts/verify-studio-hybrid-topology.mjs
      - .github/workflows/studio-material-morphology.yml
  push:
    branches: [main]
    paths:
      - apps/web/src/domains/creator/brush/**
      - apps/web/src/domains/creator/brush-lab/**
      - apps/web/config/vite-manual-chunks.ts
      - scripts/*studio-material*
      - scripts/studio-hybrid-topology-browser.ts
      - scripts/verify-studio-hybrid-topology.mjs
      - .github/workflows/studio-material-morphology.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: studio-material-morphology-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  material-morphology:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify generated atlas matches the original material programs
        run: |
          pnpm exec tsx scripts/generate-studio-material-tip-atlas.mts
          git diff --exit-code -- apps/web/src/domains/creator/brush/studio-material-tip-atlas.generated.json
      - name: Complete brush-folder and catalogue regressions
        run: |
          mkdir -p "$RUNNER_TEMP/studio-material-morphology"
          pnpm exec vitest run \
            apps/web/src/domains/creator/brush \
            apps/web/src/domains/creator/studio-sketchpad-specialty.test.ts \
            apps/web/src/domains/creator/studio-competitor-specialty-brush-expansion.test.ts \
            scripts/studio-brush-long-matrix-quality.test.ts \
            scripts/studio-material-atlas-boundary.test.ts \
            2>&1 | tee "$RUNNER_TEMP/studio-material-morphology/brush-tests.log"
      - name: Quiet performance and incremental live streaming regressions
        run: |
          pnpm exec vitest run --config vitest.perf.config.ts \
            apps/web/src/domains/creator/brush \
            apps/web/src/domains/creator/live/studio-live-dynamic-brush-overlay.test.ts \
            2>&1 | tee "$RUNNER_TEMP/studio-material-morphology/streaming-perf-tests.log"
      - name: Existing material-engine, CRDT, pointer and export regressions
        run: |
          pnpm run test:studio-material-brush 2>&1 | tee "$RUNNER_TEMP/studio-material-morphology/material-tests.log"
      - name: Audit public catalogue consistency
        run: pnpm exec tsx scripts/audit-studio-brush-quality-portfolio.mts
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Compare all 32 materials in the real Canvas2D renderer at DPR 1, 2 and 3
        env:
          TOONSPECTRUM_MATERIAL_VERIFY_DIR: ${{ runner.temp }}/studio-material-morphology
        run: node scripts/verify-studio-material-morphology.mjs
      - name: Verify six hybrid topology engines, thirty materials and twelve symmetry combinations
        env:
          TOONSPECTRUM_HYBRID_VERIFY_DIR: ${{ runner.temp }}/studio-material-morphology/hybrid-topology
        run: node scripts/verify-studio-hybrid-topology.mjs
      - name: Build and prove the atlas stays off the initial graph without relaxing any byte budget
        run: |
          pnpm run build:bundle 2>&1 | tee "$RUNNER_TEMP/studio-material-morphology/build.log"
          cp dist/.vite/manifest.json "$RUNNER_TEMP/studio-material-morphology/manifest.json"
          node scripts/verify-studio-material-atlas-boundary.mjs | tee "$RUNNER_TEMP/studio-material-morphology/atlas-boundary.json"
          node scripts/check-studio-bundle.mjs 2>&1 | tee "$RUNNER_TEMP/studio-material-morphology/bundle-budget.log"
      - name: Upload real-renderer images, pressure, performance and test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-material-morphology-${{ github.run_attempt }}
          path: ${{ runner.temp }}/studio-material-morphology
          retention-days: 14
          if-no-files-found: warn
