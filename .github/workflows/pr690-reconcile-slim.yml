name: PR 690 slim reconciliation

on:
  push:
    branches:
      - refactor/layered-architecture-20260904
    paths:
      - .github/workflows/pr690-reconcile-slim.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: pr690-reconcile-main
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reconcile current main
        run: python3 scripts/pr690-reconcile.py
