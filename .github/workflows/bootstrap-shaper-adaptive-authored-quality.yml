name: Bootstrap adaptive face and authored hair quality

on:
  push:
    branches:
      - feat/shaper-adaptive-face-authored-hair-20260903

permissions:
  contents: write

concurrency:
  group: shaper-adaptive-authored-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[shaper-adaptive-authored-applied]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v6
        with:
          ref: feat/shaper-adaptive-face-authored-hair-20260903
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Apply product integration
        run: python3 scripts/apply-shaper-adaptive-authored-quality.py

      - name: Inspect generated diff
        run: git diff --check && git status --short

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate architecture
        run: pnpm run validate:architecture

      - name: Normalize generated import ordering
        run: >-
          pnpm exec eslint --fix
          src/domains/creator/vrm/StudioVrmAvatarForge.tsx
          src/domains/creator/vrm/studio-vrm-semantic-face-morph.ts

      - name: Lint changed quality surfaces
        run: >-
          pnpm exec eslint --max-warnings=0
          src/domains/creator/vrm/studio-vrm-avatar-forge.ts
          src/domains/creator/vrm/studio-vrm-adaptive-face-deformer.ts
          src/domains/creator/vrm/studio-vrm-adaptive-face-deformer.test.ts
          src/domains/creator/vrm/studio-vrm-semantic-face-morph.ts
          src/domains/creator/vrm/studio-vrm-semantic-face-morph.test.ts
          src/domains/creator/vrm/studio-vrm-authored-hair-geometry.ts
          src/domains/creator/vrm/studio-vrm-authored-hair-geometry.test.ts
          src/domains/creator/vrm/StudioVrmAvatarForge.tsx
          src/domains/creator/vrm/StudioVrmAvatarForge.test.ts
          src/domains/creator/vrm/StudioVrmAvatarForgePanel.tsx
          src/domains/creator/vrm/StudioVrmAvatarForgePanel.test.tsx
          src/domains/creator/vrm/StudioVrmAvatarForgePreview.tsx
          src/domains/creator/vrm/StudioVrmAvatarForgePreview.test.tsx
          src/domains/creator/vrm/studio-vrm-character-quality-closure.test.ts

      - name: Run focused quality regression suite
        run: >-
          pnpm exec vitest run
          src/domains/creator/vrm/studio-vrm-adaptive-face-deformer.test.ts
          src/domains/creator/vrm/studio-vrm-semantic-face-morph.test.ts
          src/domains/creator/vrm/studio-vrm-authored-hair-geometry.test.ts
          src/domains/creator/vrm/StudioVrmAvatarForge.test.ts
          src/domains/creator/vrm/StudioVrmAvatarForgePanel.test.tsx
          src/domains/creator/vrm/StudioVrmAvatarForgePreview.test.tsx
          src/domains/creator/vrm/studio-vrm-character-quality-closure.test.ts
          src/domains/creator/vrm/studio-vrm-character-workshop-boundary.test.ts
          src/domains/creator/vrm/studio-vrm-surface-paint-product-boundary.test.ts

      - name: Type-check web workspace
        run: pnpm exec tsc -p tsconfig.json --noEmit --incremental false

      - name: Build production Studio
        run: pnpm run build

      - name: Check Studio bundle boundaries and budgets
        run: pnpm run check:studio-bundle

      - name: Commit verified implementation
        run: |
          rm -f scripts/apply-shaper-adaptive-authored-quality.py
          rm -f .github/workflows/bootstrap-shaper-adaptive-authored-quality.yml
          rm -f .github/workflows/export-shaper-worktree.yml
          git config user.name "toonstudio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit --no-verify -m "feat(studio): add adaptive face and authored toon hair [shaper-adaptive-authored-applied]"
          git push --no-verify origin HEAD:feat/shaper-adaptive-face-authored-hair-20260903
