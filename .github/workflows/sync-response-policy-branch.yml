name: Sync response policy outputs

on:
  push:
    branches:
      - feat/project-context-save-trust-ux-20260917
    paths:
      - config/http-response-headers.json
      - scripts/cloudflare-static-rules.mjs
      - .github/workflows/sync-response-policy-branch.yml

permissions:
  contents: write

concurrency:
  group: sync-response-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Generate static and edge response policy outputs
        run: node scripts/cloudflare-static-rules.mjs
      - name: Commit generated outputs
        shell: bash
        run: |
          if git diff --quiet -- apps/web/public/_headers deploy/cloudflare-static/src/index.ts; then
            echo "Generated response policy outputs are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/_headers deploy/cloudflare-static/src/index.ts
          git commit -m "chore(csp): synchronize generated response policy"
          git push origin "HEAD:${GITHUB_REF_NAME}"
