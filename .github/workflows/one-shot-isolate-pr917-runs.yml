name: Isolate final PR 917 workflow runs

on:
  push:
    branches:
      - ci/isolate-pr917-runs-20260908
    paths:
      - .github/workflows/one-shot-isolate-pr917-runs.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: isolate-final-pr917-workflow-runs
  cancel-in-progress: false

jobs:
  isolate:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      HELPER_BRANCH: ci/isolate-pr917-runs-20260908
      TARGET_BRANCH: release/final-combined-496aa743-20260908
    steps:
      - name: Preserve main and only the latest run of each PR 917 workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from collections import defaultdict

          repository = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          helper_branch = os.environ["HELPER_BRANCH"]
          target_branch = os.environ["TARGET_BRANCH"]
          active_statuses = ("in_progress", "queued", "pending", "waiting", "requested")

          def api(path: str, method: str = "GET") -> tuple[int, object]:
              request = urllib.request.Request(
                  f"https://api.github.com{path}",
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "toonspectrum-pr917-run-isolator",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as error:
                  raw = error.read()
                  try:
                      payload: object = json.loads(raw) if raw else {}
                  except json.JSONDecodeError:
                      payload = raw.decode("utf-8", errors="replace")
                  return error.code, payload

          runs_by_id: dict[int, dict[str, object]] = {}
          for run_status in active_statuses:
              for page in range(1, 11):
                  status, payload = api(
                      f"/repos/{repository}/actions/runs?status={run_status}&per_page=100&page={page}"
                  )
                  if status != 200 or not isinstance(payload, dict):
                      raise SystemExit(f"Unable to list {run_status} runs: HTTP {status}: {payload}")
                  runs = payload.get("workflow_runs", [])
                  if not isinstance(runs, list):
                      raise SystemExit("GitHub returned an invalid workflow_runs payload")
                  for run in runs:
                      if isinstance(run, dict) and int(run.get("id", 0)) > 0:
                          runs_by_id[int(run["id"])] = run
                  if len(runs) < 100:
                      break

          target_groups: dict[int, list[dict[str, object]]] = defaultdict(list)
          for run in runs_by_id.values():
              if run.get("head_branch") == target_branch:
                  target_groups[int(run.get("workflow_id", 0))].append(run)

          keep_ids: set[int] = set()
          for runs in target_groups.values():
              latest = max(
                  runs,
                  key=lambda run: (str(run.get("created_at") or ""), int(run.get("id", 0))),
              )
              keep_ids.add(int(latest["id"]))

          candidates: list[dict[str, object]] = []
          for run_id, run in runs_by_id.items():
              branch = str(run.get("head_branch") or "")
              if branch in {"main", helper_branch}:
                  continue
              if branch == target_branch and run_id in keep_ids:
                  continue
              candidates.append(run)

          candidates.sort(key=lambda run: (str(run.get("created_at") or ""), int(run.get("id", 0))))
          print(json.dumps({
              "active": len(runs_by_id),
              "targetLatestRuns": sorted(keep_ids),
              "cancellations": len(candidates),
          }, sort_keys=True))

          cancelled = 0
          raced = 0
          failures: list[str] = []
          for run in candidates:
              run_id = int(run["id"])
              status, payload = api(
                  f"/repos/{repository}/actions/runs/{run_id}/cancel",
                  method="POST",
              )
              label = f"{run_id} {run.get('head_branch')} / {run.get('name')} [{run.get('status')}]"
              if status == 202:
                  cancelled += 1
                  print(f"cancelled: {label}")
              elif status in {404, 409}:
                  raced += 1
                  print(f"already terminal: {label} (HTTP {status})")
              else:
                  failures.append(f"{label}: HTTP {status}: {payload}")
              time.sleep(0.04)

          print(f"summary: cancelled={cancelled} already_terminal={raced} failed={len(failures)}")
          if failures:
              raise SystemExit("Cancellation failures:\n" + "\n".join(failures))
          PY
