name: Temporary Studio production archive recovery

on:
  push:
    branches:
      - feat/studio-production-command-center-20260905
    paths:
      - .github/workflows/tmp-studio-production-source-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/studio-production-command-center-20260905
          fetch-depth: 1
      - name: Package staged archive and focused source
        shell: bash
        run: |
          set -euo pipefail
          tar -czf studio-production-recovery.tgz \
            .github/tmp \
            .github/workflows/tmp-studio-production-source-export.yml \
            src/app/routes/app-route-title-ownership.ts \
            src/app/routes/app-route-title-ownership.test.ts \
            src/domains/creator/studio-router \
            src/domains/creator/studio-workspace-route.ts
      - uses: actions/upload-artifact@v4
        with:
          name: studio-production-recovery
          path: studio-production-recovery.tgz
          if-no-files-found: error
          retention-days: 1
