name: PR 745 sync latest main once

on:
  push:
    branches:
      - feat/webtoon-ai-quality-ux-20260905
    paths:
      - .github/workflows/pr745-sync-main-once.yml

permissions:
  contents: write

concurrency:
  group: pr745-sync-latest-main-once
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Merge latest main and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          git rm .github/workflows/pr745-sync-main-once.yml
          git diff --check
          git commit -m "chore(studio): sync webtoon AI with latest main"
          git push origin "HEAD:${{ github.ref_name }}"
