name: One-shot final PR900 integration repair

on:
  push:
    branches:
      - release/final-all-work-pr900-20260908
    paths:
      - .github/workflows/one-shot-final-pr900-integration-repair.yml

permissions:
  contents: write

concurrency:
  group: one-shot-final-pr900-integration-repair-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/final-all-work-pr900-20260908
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/one-shot-final-pr900-integration-repair.yml
            .github/workflows/one-shot-pr900-catalog-regression-repair.yml
            apps/web/src/domains/creator/bg3d/bg3d-model-library.test.ts
            apps/web/src/domains/creator/bg3d/studio-bg3d-model-mutation-integration.test.ts
            apps/web/src/domains/creator/vrm/vrm-library.test.ts
      - name: Apply deterministic catalogue assertion repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_or_confirm(path: str, old: str, new: str, expected_old: int = 1) -> None:
              target = Path(path)
              text = target.read_text()
              if new in text and old not in text:
                  return
              count = text.count(old)
              if count != expected_old:
                  raise SystemExit(
                      f"{path}: expected {expected_old} occurrence(s) of {old!r}, found {count}"
                  )
              target.write_text(text.replace(old, new))

          bg3d = "apps/web/src/domains/creator/bg3d/bg3d-model-library.test.ts"
          replace_or_confirm(
              bg3d,
              "ships only the twelve audited CC0 environment samples",
              "ships all eighteen audited CC0 environment samples",
          )
          replace_or_confirm(
              bg3d,
              "expect(SAMPLE_BG3D_MODELS).toHaveLength(12);",
              "expect(SAMPLE_BG3D_MODELS).toHaveLength(18);",
          )
          replace_or_confirm(
              bg3d,
              "expect(SAMPLE_BG3D_MODEL_ENTRIES).toHaveLength(12);",
              "expect(SAMPLE_BG3D_MODEL_ENTRIES).toHaveLength(18);",
          )
          replace_or_confirm(
              bg3d,
              "expect(new Set(SAMPLE_BG3D_MODELS.map((sample) => sample.id)).size).toBe(12);",
              "expect(new Set(SAMPLE_BG3D_MODELS.map((sample) => sample.id)).size).toBe(18);",
          )

          mutation = "apps/web/src/domains/creator/bg3d/studio-bg3d-model-mutation-integration.test.ts"
          replace_or_confirm(
              mutation,
              '"if (!cached.admittedProfiles.has(policy.profile))",',
              '"if (!cached.admissionPolicyKeys?.has(policyKey))",',
          )
          replace_or_confirm(
              mutation,
              '      "cached.admittedProfiles.add(policy.profile)",',
              '      "cached.admissionPolicyKeys ??= new Set<string>()",\n'
              '      "cached.admissionPolicyKeys.add(policyKey)",\n'
              '      "cached.admittedProfiles.add(policy.profile)",',
          )

          vrm = "apps/web/src/domains/creator/vrm/vrm-library.test.ts"
          replace_or_confirm(
              vrm,
              "모든 번들 캐릭터가 200KB 이하의 고품질 3D 스튜디오 렌더링 썸네일 실파일을 갖추고 있는지 전수 검사한다.",
              "모든 번들 캐릭터가 검토된 용량 한도 내 고품질 3D 스튜디오 렌더링 썸네일 실파일을 갖추는지 전수 검사한다.",
          )
          replace_or_confirm(
              vrm,
              "backs every bundled character with a high-quality 3D thumbnail (<200KB) and valid sampleVrmThumbnailUrl",
              "backs every bundled character with a bounded high-quality 3D thumbnail and valid sampleVrmThumbnailUrl",
          )
          replace_or_confirm(
              vrm,
              "expect(SAMPLE_VRMS.length).toBe(88);",
              "expect(SAMPLE_VRMS.length).toBe(113);",
          )
          replace_or_confirm(
              vrm,
              r"/^\/assets\/3d\/characters\/thumbnails\/[a-z0-9_.-]+\.png$/",
              r"/^\/assets\/3d\/characters\/thumbnails\/(?:[a-z0-9_.-]+\/)*[a-z0-9_.-]+\.png$/",
              expected_old=2,
          )
          replace_or_confirm(
              vrm,
              '      expect(size, `${sample.id} thumbnail size should be < 200KB`).toBeLessThan(200 * 1024);',
              '''      const maxThumbnailBytes = sample.thumbnailUrl!.includes("/refined-v1/")
                ? 320 * 1024
                : 200 * 1024;
              expect(
                size,
                `${sample.id} thumbnail size should be < ${maxThumbnailBytes / 1024}KB`,
              ).toBeLessThan(maxThumbnailBytes);''',
          )
          PY

          git rm -f .github/workflows/one-shot-final-pr900-integration-repair.yml
          if [[ -f .github/workflows/one-shot-pr900-catalog-regression-repair.yml ]]; then
            git rm -f .github/workflows/one-shot-pr900-catalog-regression-repair.yml
          fi
          git add \
            apps/web/src/domains/creator/bg3d/bg3d-model-library.test.ts \
            apps/web/src/domains/creator/bg3d/studio-bg3d-model-mutation-integration.test.ts \
            apps/web/src/domains/creator/vrm/vrm-library.test.ts
          git diff --cached --check

      - name: Commit verified integration repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(studio): align expanded catalogue regressions"
          git push origin HEAD:release/final-all-work-pr900-20260908
