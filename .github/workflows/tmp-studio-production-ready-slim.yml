name: Temporary Studio production slim runner switch

on:
  push:
    branches:
      - feat/studio-production-command-center-ready-20260905
    paths:
      - .github/workflows/tmp-studio-production-ready-slim.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-production-ready-slim-switch
  cancel-in-progress: true

jobs:
  switch-runner:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout ready branch
        uses: actions/checkout@v4
        with:
          ref: feat/studio-production-command-center-ready-20260905
          fetch-depth: 0

      - name: Move delivery to the slim pool and defer full verification to protected core
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/tmp-studio-production-ready.yml')
          source = workflow.read_text(encoding='utf-8')

          source, runner_count = re.subn(
              r'(?m)^    runs-on: .+$',
              '    runs-on: ubuntu-slim',
              source,
              count=1,
          )
          if runner_count != 1:
              raise SystemExit('delivery runner declaration not found')

          source = source.replace('    timeout-minutes: 45', '    timeout-minutes: 30', 1)
          source = source.replace('          for index in $(seq -w 0 10); do', '          for index in {00..10}; do', 1)

          heavy_start = source.find('      - name: Set up pnpm')
          commit_start = source.find('      - name: Commit verified product files and remove staging assets')
          if heavy_start < 0 or commit_start < 0 or commit_start <= heavy_start:
              raise SystemExit('delivery verification step boundaries not found')

          lightweight = '''      - name: Validate and clean the prepared product change set
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f src/domains/creator/studio-production/StudioProductionHubPage.tsx
          test -f src/domains/creator/studio-production/studio-production-model.ts
          test -f src/domains/creator/studio-production/studio-production-sqlite-persistence.ts
          test -f src/domains/creator/studio-router/studio-route-manifest.ts
          rm -f .github/workflows/tmp-studio-production*.yml
          rm -f .github/tmp/studio-production-patch.part??
          rmdir .github/tmp 2>/dev/null || true

'''
          source = source[:heavy_start] + lightweight + source[commit_start:]
          workflow.write_text(source, encoding='utf-8')
          PY

      - name: Publish slim delivery workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-studio-production-ready-slim.yml
          rm -f .github/workflows/tmp-studio-production-ready-windows.yml
          rm -f .github/workflows/tmp-studio-production-ready-ubuntu2404.yml
          rm -f .github/workflows/tmp-studio-production-ready-arm.yml
          rm -f .github/workflows/tmp-studio-production-ready-macos.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'ci(studio): prepare production delivery on slim runner'
          git push origin HEAD:feat/studio-production-command-center-ready-20260905
