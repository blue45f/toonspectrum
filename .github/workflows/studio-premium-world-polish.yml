name: Studio premium world polished candidates
on:
  push:
    branches: [feat/studio-premium-world-assets-20260913]
    paths: [.github/workflows/studio-premium-world-polish.yml]
permissions:
  contents: read
  actions: read
jobs:
  polish-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v6
      - name: Download completed repair candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/34743137512/artifacts?name=premium-world-complete-candidates" --jq .total_count)
            if test "$count" = 1; then
              gh run download 34743137512 --repo "$GITHUB_REPOSITORY" --name premium-world-complete-candidates --dir artifacts/studio-premium-world-v1
              exit 0
            fi
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/34743137512" --jq .status)
            if test "$state" = completed; then echo 'Repair produced no complete candidates' >&2; exit 1; fi
            sleep 20
          done
          exit 1
      - uses: actions/cache@v4
        with:
          path: .cache/blender-5.2.1-linux-x64
          key: blender-${{ runner.os }}-x64-5.2.1
      - name: Install headless Blender runtime
        run: |
          test -x .cache/blender-5.2.1-linux-x64/blender
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1 libgl1-mesa-dri libglx-mesa0
      - name: Render only the six visually corrected assets
        run: |
          cp artifacts/studio-premium-world-v1/generator.py scripts/blender/generate_studio_premium_world_v1.py
          python3 scripts/blender/polish_studio_premium_world_v1.py
          for asset in bread-tray bakery-display-case artisan-bakery cycle-rack transit-boulevard riverside-promenade; do
            .cache/blender-5.2.1-linux-x64/blender --background --python-exit-code 1 --python scripts/blender/generate_studio_premium_world_v1.py -- --only "$asset" > "$RUNNER_TEMP/polish-$asset.log" 2>&1 || { tail -70 "$RUNNER_TEMP/polish-$asset.log"; exit 1; }
            grep PREMIUM_WORLD_RESULT "$RUNNER_TEMP/polish-$asset.log"
          done
          cp scripts/blender/generate_studio_premium_world_v1.py artifacts/studio-premium-world-v1/generator.py
      - uses: actions/upload-artifact@v4
        with:
          name: premium-world-final-candidates
          path: |
            artifacts/studio-premium-world-v1/assets
            artifacts/studio-premium-world-v1/generator.py
          retention-days: 3
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm
      - name: Install frozen dependencies and browser
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Verify all 24 final GLBs
        run: pnpm exec tsx scripts/verify-studio-premium-world.mts artifacts/studio-premium-world-v1
      - name: Assemble final evidence sheets
        if: always()
        run: |
          python3 -m venv /tmp/world-review
          /tmp/world-review/bin/pip -q install Pillow==11.3.0
          /tmp/world-review/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          import json,hashlib,shutil
          root=Path('artifacts/studio-premium-world-v1');out=Path('artifacts/premium-world-final-review');out.mkdir(parents=True,exist_ok=True)
          records=[]
          for p in sorted((root/'assets').glob('*/SOURCE.json')):
            r=json.loads(p.read_text());r['renderSha256']=hashlib.sha256((p.parent/(r['slug']+'.png')).read_bytes()).hexdigest();records.append(r)
          assert len(records)==24
          (out/'candidates.json').write_text(json.dumps(records,ensure_ascii=False,indent=2)+'\n')
          for kind in ['scene','prop']:
            group=[r for r in records if r['kind']==kind]
            for page in range((len(group)+3)//4):
              sheet=Image.new('RGB',(1600,1260),'#d6d9dc');draw=ImageDraw.Draw(sheet)
              for i,r in enumerate(group[page*4:page*4+4]):
                x=(i%2)*800;y=(i//2)*630
                im=Image.open(root/'assets'/r['id']/(r['slug']+'.png')).convert('RGBA');im.thumbnail((790,590))
                sheet.paste(im,(x+(800-im.width)//2,y+(595-im.height)//2),im);draw.text((x+18,y+601),r['slug'],fill='black')
              sheet.save(out/(kind+'-'+str(page+1)+'.jpg'),quality=94)
          runtime=root/'runtime-review/report.json'
          if runtime.exists():
            shutil.copy2(runtime,out/'runtime-report.json');report=json.loads(runtime.read_text())
            for page in range((len(report['results'])+5)//6):
              sheet=Image.new('RGB',(960,2040),'#d6d9dc');draw=ImageDraw.Draw(sheet)
              for i,r in enumerate(report['results'][page*6:page*6+6]):
                for j,frame in enumerate(r['frames']):
                  im=Image.open(root/'runtime-review'/frame['file']);im.thumbnail((320,320));sheet.paste(im,(j*320,i*340))
                  draw.text((j*320+6,i*340+322),r['id'].replace('ts-world-','')+' / '+frame['view'],fill='black')
              sheet.save(out/('browser-'+str(page+1)+'.jpg'),quality=94)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-world-final-review
          path: artifacts/premium-world-final-review
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: premium-world-polish-logs
          path: ${{ runner.temp }}/polish-*.log
          retention-days: 3
