name: Execute Scene3D production asset admission

on:
  push:
    branches: [feat/scene3d-production-asset-admission-20260910]
    paths: [.github/workflows/scene3d-production-asset-admission-executor.yml]

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/scene3d-production-asset-admission-20260910
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Materialize audited catalog product code
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import os, subprocess, yaml
          source = '.github/workflows/scene3d-production-asset-admission-bootstrap.yml'
          data = yaml.safe_load(open(source, encoding='utf-8'))
          for job in data.get('jobs', {}).values():
              for step in job.get('steps', []):
                  script = step.get('run')
                  if not script:
                      continue
                  name = str(step.get('name', ''))
                  if name == 'Validate production catalog' or 'Commit product code' in name or 'git push origin' in script:
                      continue
                  env = os.environ.copy()
                  env.update({str(k): str(v) for k, v in (step.get('env') or {}).items()})
                  print(f'::group::{name or "bootstrap step"}')
                  subprocess.run(script, shell=True, executable='/bin/bash', check=True, env=env)
                  print('::endgroup::')
          PY
      - name: Validate production catalog scope
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run \
            apps/web/src/domains/creator/vrm/studio-vrm-production-catalog.test.ts \
            apps/web/src/domains/creator/vrm/vrm-library.test.ts
          pnpm exec eslint --max-warnings=0 \
            apps/web/src/domains/creator/vrm/studio-vrm-production-catalog.ts \
            apps/web/src/domains/creator/vrm/studio-vrm-production-catalog.test.ts \
            apps/web/src/domains/creator/vrm/vrm-library.ts
          git diff --check
      - name: Commit audited catalog policy
        shell: bash
        run: |
          git config user.name toonstudio-3d-ci
          git config user.email actions@users.noreply.github.com
          rm -f .github/workflows/scene3d-production-asset-admission-bootstrap.yml \
                .github/workflows/scene3d-production-asset-admission-executor.yml
          git add -A
          git diff --cached --check
          HUSKY=0 git commit -m 'feat(3d): admit only visually approved bundled characters'
          HUSKY=0 git push origin HEAD:feat/scene3d-production-asset-admission-20260910
