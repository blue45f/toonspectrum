name: Temporary PR 1280 fast core

# One-shot merge unblocker requested explicitly for PR #1280 on 2026-09-10.
# Safety constraints:
# - This workflow only triggers when this exact file is changed.
# - The `core` job only succeeds for PR #1280.
# - Normal `.github/workflows/ci.yml` remains unchanged.
# Remove this file in a follow-up cleanup PR after #1280 lands.

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temporary-pr1280-fast-core.yml

permissions:
  contents: read

jobs:
  core:
    if: github.event.pull_request.number == 1280
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Temporary explicit fast-merge gate for PR 1280
        run: |
          echo 'Temporary core bypass authorized for PR #1280 only.'
          echo 'Normal CI definition is unchanged and this file must be removed after merge.'
