name: PR1289 superseded run janitor

on:
  push:
    branches:
      - fix/real-core-and-main-only-20260910
    paths:
      - .github/workflows/pr1289-superseded-run-janitor.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: pr1289-superseded-run-janitor
  cancel-in-progress: true

jobs:
  cancel-superseded:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - name: Cancel superseded runs and follow the final cleanup commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["GITHUB_REF_NAME"]
          token = os.environ["GH_TOKEN"]
          self_run_id = int(os.environ["GITHUB_RUN_ID"])
          api_root = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "pr1289-superseded-run-janitor",
          }

          def request(path: str, method: str = "GET"):
              req = urllib.request.Request(api_root + path, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      payload = response.read()
                      return json.loads(payload) if payload else {}
              except urllib.error.HTTPError as error:
                  # A run can finish between listing and cancellation.
                  if method == "POST" and error.code in {404, 409}:
                      print(f"Ignoring cancellation race: HTTP {error.code} {path}")
                      return {}
                  raise

          def branch_head() -> str:
              encoded = urllib.parse.quote(branch, safe="")
              return request(f"/branches/{encoded}")["commit"]["sha"]

          active_statuses = ("queued", "in_progress", "pending", "waiting", "requested")

          def active_runs():
              runs_by_id = {}
              encoded_branch = urllib.parse.quote(branch, safe="")
              for status in active_statuses:
                  for page in range(1, 4):
                      query = urllib.parse.urlencode(
                          {
                              "branch": branch,
                              "status": status,
                              "per_page": 100,
                              "page": page,
                          }
                      )
                      page_runs = request(f"/actions/runs?{query}").get("workflow_runs", [])
                      for run in page_runs:
                          runs_by_id[run["id"]] = run
                      if len(page_runs) < 100:
                          break
              return list(runs_by_id.values())

          def cancel_superseded(keep_sha: str) -> int:
              cancelled = 0
              for run in active_runs():
                  run_id = int(run["id"])
                  if run_id == self_run_id or run.get("head_sha") == keep_sha:
                      continue
                  print(
                      "Cancelling superseded run "
                      f"{run_id} name={run.get('name')} status={run.get('status')} "
                      f"head={run.get('head_sha')} keep={keep_sha}"
                  )
                  request(f"/actions/runs/{run_id}/cancel", method="POST")
                  cancelled += 1
              print(f"Cancellation sweep complete: {cancelled} request(s), keep={keep_sha}")
              return cancelled

          initial_head = branch_head()
          print(f"Initial branch head: {initial_head}")
          cancel_superseded(initial_head)

          # The controller removes this one-time workflow after the first sweep.
          # Follow that final commit, then cancel every run belonging to older SHAs,
          # including the temporary commit's CI run. Never cancel the final head.
          deadline = time.time() + 300
          observed_head = initial_head
          while time.time() < deadline:
              time.sleep(5)
              current_head = branch_head()
              if current_head != observed_head:
                  print(f"Branch head advanced: {observed_head} -> {current_head}")
                  observed_head = current_head
                  for _ in range(3):
                      cancel_superseded(observed_head)
                      time.sleep(5)
                  print(f"Final head preserved: {observed_head}")
                  break

          if observed_head == initial_head:
              print("No follow-up head observed before the janitor deadline.")
          PY
