name: Cleanup superseded Actions runs

on:
  push:
    branches:
      - ci/actions-queue-cleanup-20260904

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  cleanup:
    # Queue repair does not depend on Linux, containers, or repository checkout. Use the separate
    # macOS runner pool so a saturated Ubuntu CI backlog cannot prevent stale-run cancellation.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Cancel runs whose commit is no longer a live branch or PR head
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const liveShas = new Set([context.sha]);

            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 },
            );
            for (const branch of branches) {
              liveShas.add(branch.commit.sha);
            }

            const pulls = await github.paginate(
              github.rest.pulls.list,
              { owner, repo, state: "open", per_page: 100 },
            );
            for (const pull of pulls) {
              if (pull.head?.sha) liveShas.add(pull.head.sha);
            }

            let cancelled = 0;
            let retained = 0;
            for (const status of ["queued", "in_progress"]) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                { owner, repo, status, per_page: 100 },
              );
              for (const run of runs) {
                if (
                  run.id === context.runId ||
                  !run.head_sha ||
                  liveShas.has(run.head_sha)
                ) {
                  retained += 1;
                  continue;
                }

                try {
                  await github.rest.actions.cancelWorkflowRun({
                    owner,
                    repo,
                    run_id: run.id,
                  });
                  cancelled += 1;
                  core.info(
                    `Cancelled superseded ${run.name} run ${run.id} at ${run.head_sha}`,
                  );
                } catch (error) {
                  if (error.status === 409) {
                    core.info(`Run ${run.id} already finished while cleanup was running.`);
                    continue;
                  }
                  throw error;
                }
              }
            }

            await core.summary
              .addHeading("Actions queue cleanup")
              .addTable([
                [
                  { data: "Result", header: true },
                  { data: "Count", header: true },
                ],
                ["Superseded runs cancelled", String(cancelled)],
                ["Live/current runs retained", String(retained)],
                ["Live commit SHAs protected", String(liveShas.size)],
              ])
              .write();
