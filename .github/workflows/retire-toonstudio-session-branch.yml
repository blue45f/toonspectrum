name: Retire ToonStudio completion branch

on:
  push:
    branches:
      - feat/toonstudio-session-complete-20260911-1221
    paths:
      - .github/workflows/retire-toonstudio-session-branch.yml

permissions:
  contents: write

concurrency:
  group: retry-toonstudio-session-fixes
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout temporary completion branch
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-session-complete-20260911-1221
          fetch-depth: 0

      - name: Require verified result on active PR branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/toonstudio-final-ia-20260911
          git show origin/feat/toonstudio-final-ia-20260911:docs/rewrite/toonstudio-session-final-verification.md >/dev/null

      - name: Delete temporary completion branch
        run: git push origin --delete feat/toonstudio-session-complete-20260911-1221
