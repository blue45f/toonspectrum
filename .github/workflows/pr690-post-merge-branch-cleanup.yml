name: PR 690 post-merge branch cleanup

on:
  push:
    branches:
      - ops/pr690-post-merge-cleanup-20260904
    paths:
      - .github/workflows/pr690-post-merge-branch-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr690-post-merge-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete superseded PR 690 support branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "refactor/layered-architecture-20260904"
            "integrate/layered-architecture-clean-20260904"
            "automation/architecture-ci-macos-20260904"
            "ops/verify-pr690-exact-core-20260904-1948"
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              echo "deleting ${branch}"
              git push origin --delete "${branch}"
            else
              echo "already absent: ${branch}"
            fi
          done

      - name: Remove one-off cleanup workflow from its branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "toonstudio-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/pr690-post-merge-branch-cleanup.yml
          git commit -m "chore(ci): remove completed PR 690 cleanup transport"
          git push origin "HEAD:${GITHUB_REF_NAME}"
