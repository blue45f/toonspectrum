name: Studio 5h stability soak

# A five-hour browser session is a drift/soak proof, not a useful per-commit merge gate.
# Fast PR browser contracts cover the same interaction surfaces; this workflow keeps the
# expensive full-duration evidence on the overnight schedule and explicit manual runs.
on:
  schedule:
    # 02:30 Asia/Seoul — five-hour run finishes before the Korean workday for overnight evidence.
    - cron: "30 17 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Soak duration per profile (minimum recommended: 300)"
        required: false
        default: "300"

permissions:
  contents: read

concurrency:
  group: studio-five-hour-soak-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CI: "1"
  NODE_OPTIONS: --max-old-space-size=8192
  SOAK_MINUTES: ${{ github.event.inputs.minutes || '300' }}

jobs:
  production-build:
    name: production Studio bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:bundle
      - name: Require production manifest
        run: test -s dist/.vite/manifest.json
      - uses: actions/upload-artifact@v6
        with:
          name: studio-five-hour-dist-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  overnight-full-soak:
    name: overnight 5h · ${{ matrix.id }}
    needs: production-build
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: desktop
            profile: desktop
            webgpu: "0"
          - id: desktop-webgpu
            profile: desktop
            webgpu: "1"
          - id: kakaotalk-android
            profile: kakaotalk-android-360
            webgpu: "0"
          - id: instagram-ios
            profile: instagram-ios-390
            webgpu: "0"
          - id: naver-android
            profile: naver-android-412
            webgpu: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v6
        with:
          name: studio-five-hour-dist-${{ github.sha }}
          path: dist
      - name: Long-session Studio soak
        env:
          TOONSPECTRUM_SOAK_MINUTES: ${{ env.SOAK_MINUTES }}
          TOONSPECTRUM_SOAK_PROFILE: ${{ matrix.profile }}
          TOONSPECTRUM_SOAK_WEBGPU: ${{ matrix.webgpu }}
          TOONSPECTRUM_SOAK_OUT: artifacts/studio-five-hour-soak/${{ matrix.id }}
        run: pnpm exec tsx scripts/verify-studio-five-hour-soak.mts
      - name: Analyze every 10-minute visual checkpoint
        if: always()
        env:
          TOONSPECTRUM_SOAK_OUT: artifacts/studio-five-hour-soak/${{ matrix.id }}
        run: pnpm exec tsx scripts/analyze-studio-five-hour-visual.mts
      - name: Preserve 10-minute checkpoints, screenshots and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: studio-five-hour-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/studio-five-hour-soak/${{ matrix.id }}/
          if-no-files-found: warn
          retention-days: 14
