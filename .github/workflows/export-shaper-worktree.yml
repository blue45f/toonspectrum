name: Export focused Shaper worktree

on:
  push:
    branches:
      - feat/shaper-adaptive-face-authored-hair-20260903

permissions:
  contents: read

jobs:
  export:
    if: ${{ !contains(github.event.head_commit.message, '[worktree-exported]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Archive focused worktree
        run: |
          git archive --format=tar.gz --output=shaper-worktree.tar.gz HEAD \
            package.json pnpm-lock.yaml tsconfig.json eslint.config.mjs \
            src/domains/creator/vrm src/domains/creator/scene-3d
      - uses: actions/upload-artifact@v6
        with:
          name: shaper-worktree-${{ github.sha }}
          path: shaper-worktree.tar.gz
          retention-days: 2
