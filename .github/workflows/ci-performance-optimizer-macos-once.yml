name: Stage CI performance optimization on macOS once

on:
  push:
    branches:
      - fix/real-core-and-main-only-20260910
    paths:
      - .github/workflows/ci-performance-optimizer-macos-once.yml

permissions:
  contents: write

concurrency:
  group: ci-performance-stager-macos-once
  cancel-in-progress: true

jobs:
  stage:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/real-core-and-main-only-20260910
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            scripts/integration-test-runner-ci-policy.test.mjs
          sparse-checkout-cone-mode: false

      - name: Apply canonical CI optimizations in the worktree
        run: |
          python3 <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path

          source = Path('.github/workflows/ci-performance-optimizer-once.yml').read_text(encoding='utf-8')
          match = re.search(
              r"base64 --decode <<'PAYLOAD'.*?\n(?P<payload>(?:          [A-Za-z0-9+/=]+\n)+)          PAYLOAD",
              source,
              re.DOTALL,
          )
          if match is None:
              raise SystemExit('Embedded canonical optimizer payload was not found')
          payload = ''.join(line.strip() for line in match.group('payload').splitlines())
          optimizer = gzip.decompress(base64.b64decode(payload)).decode('utf-8')
          optimizer, count = re.subn(
              r"SUPPLEMENTAL_NAMES = \{\n.*?\n\}\n\nDEFER_AFTER_CORE",
              "SUPPLEMENTAL_NAMES = set()\n\nDEFER_AFTER_CORE",
              optimizer,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit('Could not isolate canonical CI optimizer')
          Path('/tmp/apply-canonical-ci-optimization.py').write_text(optimizer, encoding='utf-8')
          PY
          python3 /tmp/apply-canonical-ci-optimization.py

      - name: Apply changed-area product workflow optimization
        run: |
          set -euo pipefail
          git fetch --depth=1 origin \
            refs/heads/ops/pr1289-ci-delta-optimizer-20260911:refs/remotes/origin/ci-delta-optimizer
          git show \
            refs/remotes/origin/ci-delta-optimizer:.github/workflows/pr1289-ci-delta-optimizer.yml \
            > /tmp/pr1289-ci-delta-optimizer.yml
          python3 <<'EXTRACT'
          from pathlib import Path

          source = Path('/tmp/pr1289-ci-delta-optimizer.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-product-workflow-optimization.py').write_text(code, encoding='utf-8')
          EXTRACT
          python3 /tmp/apply-product-workflow-optimization.py

      - name: Validate and stage desired workflow blobs
        run: |
          set -euo pipefail
          python3 scripts/verify-pr-workflow-fanout.py
          node --check scripts/integration-test-runner-ci-policy.test.mjs
          ruby -rpsych -e 'ARGV.each { |path| Psych.parse_file(path) }' .github/workflows/*.yml
          git diff --check
          grep -Eq '^name: CI$' .github/workflows/ci.yml
          grep -Eq '^  core:$' .github/workflows/ci.yml
          grep -Fq 'shard: [1, 2, 3, 4]' .github/workflows/ci.yml

          rm -rf .qa/ci-generated-workflows
          mkdir -p .qa/ci-generated-workflows
          : > .qa/ci-generated-workflows-manifest.txt
          while IFS= read -r path; do
            test -n "$path"
            destination=".qa/ci-generated-workflows/${path#.github/workflows/}"
            mkdir -p "$(dirname "$destination")"
            cp "$path" "$destination"
            printf '%s\n' "$path" >> .qa/ci-generated-workflows-manifest.txt
          done < <(git diff --name-only -- .github/workflows)

          workflow_count="$(wc -l < .qa/ci-generated-workflows-manifest.txt | tr -d ' ')"
          test "$workflow_count" -eq 22
          git checkout -- .github/workflows
          git diff --quiet -- .github/workflows

      - name: Publish non-workflow staging commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            .qa/ci-generated-workflows \
            .qa/ci-generated-workflows-manifest.txt \
            .qa/ci-performance-optimization-2026-09-11.md \
            scripts/verify-pr-workflow-fanout.py \
            scripts/integration-test-runner-ci-policy.test.mjs
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit \
            -m "chore(ci): stage validated workflow optimization blobs"
          git fetch origin fix/real-core-and-main-only-20260910
          git rebase origin/fix/real-core-and-main-only-20260910
          git push origin HEAD:fix/real-core-and-main-only-20260910
