name: Apply CI performance optimization on macOS once

on:
  push:
    branches:
      - fix/real-core-and-main-only-20260910
    paths:
      - .github/workflows/ci-performance-optimizer-macos-once.yml

permissions:
  contents: write

concurrency:
  group: ci-performance-optimizer-macos-once
  cancel-in-progress: true

jobs:
  apply:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/real-core-and-main-only-20260910
          fetch-depth: 0

      - name: Extract and apply the validated optimizer
        run: |
          python3 <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path

          source = Path('.github/workflows/ci-performance-optimizer-once.yml').read_text(encoding='utf-8')
          match = re.search(
              r"base64 --decode <<'PAYLOAD'.*?\n(?P<payload>(?:          [A-Za-z0-9+/=]+\n)+)          PAYLOAD",
              source,
              re.DOTALL,
          )
          if match is None:
              raise SystemExit('Embedded optimizer payload was not found')
          payload = ''.join(line.strip() for line in match.group('payload').splitlines())
          decoded = gzip.decompress(base64.b64decode(payload))
          Path('/tmp/apply-ci-performance-optimization.py').write_bytes(decoded)
          PY
          python3 /tmp/apply-ci-performance-optimization.py

      - name: Validate optimized workflow files
        run: |
          set -euo pipefail
          python3 scripts/verify-pr-workflow-fanout.py
          ruby -rpsych -e 'ARGV.each { |path| Psych.parse_file(path) }' .github/workflows/*.yml
          git diff --check
          grep -Eq '^name: CI$' .github/workflows/ci.yml
          grep -Eq '^  core:$' .github/workflows/ci.yml
          grep -Fq 'shard: [1, 2, 3, 4]' .github/workflows/ci.yml

      - name: Commit optimized CI topology
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/ci-performance-optimizer-once.yml \
            .github/workflows/ci-performance-optimizer-macos-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows scripts/verify-pr-workflow-fanout.py .qa/ci-performance-optimization-2026-09-11.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "perf(ci): prioritize required PR checks and remove workflow fan-out"
          git fetch origin fix/real-core-and-main-only-20260910
          git rebase origin/fix/real-core-and-main-only-20260910
          git push origin HEAD:fix/real-core-and-main-only-20260910
