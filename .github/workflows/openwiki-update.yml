name: OpenWiki update

on:
  workflow_dispatch:
  schedule:
    # Weekly rather than daily to keep documentation inference cost bounded.
    - cron: "30 18 * * 0"

concurrency:
  group: openwiki-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check OpenWiki configuration
        id: openwiki-config
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENWIKI_PROVIDER: ${{ vars.OPENWIKI_PROVIDER }}
          OPENWIKI_MODEL_ID: ${{ vars.OPENWIKI_MODEL_ID }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ] && [ -n "$OPENWIKI_PROVIDER" ] && [ -n "$OPENWIKI_MODEL_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "OpenWiki generation skipped: configure OPENROUTER_API_KEY plus OPENWIKI_PROVIDER and OPENWIKI_MODEL_ID."
          fi
      - name: Install OpenWiki
        if: steps.openwiki-config.outputs.enabled == 'true'
        run: npm install --global openwiki@0.4.3 mermaid@11.16.0 jsdom@29.1.1
      - name: Update repository wiki
        if: steps.openwiki-config.outputs.enabled == 'true'
        id: openwiki
        continue-on-error: true
        env:
          OPENWIKI_PROVIDER: ${{ vars.OPENWIKI_PROVIDER }}
          OPENWIKI_MODEL_ID: ${{ vars.OPENWIKI_MODEL_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: openwiki code --update --print
      - name: Remove transient run state
        if: steps.openwiki-config.outputs.enabled == 'true' && !cancelled()
        run: rm -f -- openwiki/.run.json
      - name: Create documentation pull request
        if: steps.openwiki-config.outputs.enabled == 'true' && !cancelled()
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            openwiki
            AGENTS.md
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update. This workflow never auto-merges.

            OpenWiki result: ${{ steps.openwiki.outcome }}
      - name: Propagate OpenWiki failure
        if: steps.openwiki-config.outputs.enabled == 'true' && steps.openwiki.outcome == 'failure'
        run: exit 1
