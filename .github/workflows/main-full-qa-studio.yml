name: Main full QA · Studio exhaustive

# Exhaustive browser/engine coverage is intentionally post-merge. Pull requests already run
# `core` plus focused domain browser contracts; keeping this six-lane suite off PRs avoids
# runner starvation while preserving broad integration evidence on main and on demand.
on:
  push:
    branches:
      - main
    paths:
      - "apps/web/src/domains/creator/**"
      - "scripts/verify-studio-**"
      - "scripts/qa/**"
      - ".github/workflows/main-full-qa-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-full-qa-studio-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CI: "1"
  NODE_OPTIONS: --max-old-space-size=8192
  QA_COMMAND_TIMEOUT_MINUTES: "35"

jobs:
  production-build:
    name: production Studio build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build exact production browser bundle
        run: pnpm run build:bundle
      - name: Preserve production bundle
        uses: actions/upload-artifact@v4
        with:
          name: main-full-qa-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  studio-audit:
    name: Studio exhaustive · ${{ matrix.lane }}
    needs: production-build
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: ux-persistence-a
            browsers: all
            commands: |
              studio-launch|pnpm run verify:studio-launch
              studio-lifecycle|pnpm run verify:studio-lifecycle
              service-worker|pnpm run verify:studio-service-worker
              artist-journey|pnpm run verify:studio-artist-journey
              autosave-opfs|pnpm run verify:studio-autosave-opfs
              autosave-two-tab|pnpm run verify:studio-autosave-two-tab
              studio-menus|pnpm run verify:studio-menus
              studio-mobile-top|pnpm run verify:studio-mobile-top
              inapp-route-matrix|pnpm run verify:studio-inapp-browser
              cross-browser-route-matrix|node scripts/qa/verify-studio-cross-browser-matrix.mjs
          - lane: ux-persistence-b
            browsers: all
            commands: |
              inapp-feature-sweep|pnpm run verify:studio-inapp-feature-sweep
              filter-dialog|pnpm run verify:studio-filter-dialog
              canvas-chrome|pnpm run verify:studio-canvas-chrome
              canvas-surfaces|pnpm run verify:studio-canvas-surfaces
              companion|pnpm run verify:studio-companion
              inspector-walkthrough|pnpm run verify:studio-inspector-walkthrough
              studio-icons|pnpm run verify:studio-icons
              studio-groups|pnpm run verify:studio-groups
              ux-task-benchmark|pnpm run verify:studio-ux-task-benchmark
              ai-image-references|pnpm run verify:studio-ai-image-references
          - lane: brush-rendering-a
            browsers: chromium
            commands: |
              studio-engine|pnpm run verify:studio-engine
              studio-brushes|pnpm run verify:studio-brushes
              studio-brush-media|pnpm run verify:studio-brush-media
              studio-brush-latency|pnpm run verify:studio-brush-latency
              studio-long-stroke|pnpm run verify:studio-long-stroke
              brush-planner-quality|pnpm run verify:studio-brush-planner-quality
              brush-engine-selection|pnpm run verify:studio-brush-engine-selection
              brush-catalogue-perf|pnpm run verify:studio-brush-catalogue-perf
              renderer-roles|pnpm run verify:studio-renderer-roles
          - lane: brush-rendering-b
            browsers: chromium
            commands: |
              p5-brush-runtime|pnpm run verify:studio-p5-brush-real-runtime
              gpu-committed-parity|pnpm run verify:studio-gpu-committed-parity
              webgpu-brush-parity|pnpm run verify:studio-engine-webgpu-brush-parity
              webgpu-filter-parity|pnpm run verify:studio-engine-webgpu-filter-parity
              webgpu-presentation|pnpm run verify:studio-engine-webgpu-presentation
              hokusai-wasm|pnpm run verify:studio-hokusai-wasm
              hokusai-natural-media|pnpm run verify:studio-hokusai-natural-media-quality
              hokusai-live-brush|pnpm run verify:studio-hokusai-live-brush
              hokusai-live-integration|pnpm run verify:studio-hokusai-live-integration
              living-ink-execution|pnpm run verify:studio-living-ink-execution
              living-ink-integration|pnpm run verify:studio-living-ink-integration
              native-raster-tools|pnpm run verify:studio-native-raster-tools
              gpu-filters|pnpm run verify:studio-gpu-filters
          - lane: 3d-runtime-a
            browsers: chromium
            commands: |
              studio-3d-console|xvfb-run -a --server-args="-screen 0 1920x1200x24" pnpm run verify:studio-3d-console
              studio-3d-visual|xvfb-run -a --server-args="-screen 0 1920x1200x24" pnpm run verify:studio-3d-visual
              bg3d-inapp-editor|xvfb-run -a --server-args="-screen 0 1920x1200x24" pnpm run verify:studio-bg3d-inapp-editor
              bg3d-webgpu-engine|xvfb-run -a --server-args="-screen 0 1920x1200x24" pnpm run verify:studio-bg3d-webgpu-engine
              bg3d-webgpu-rotation|xvfb-run -a --server-args="-screen 0 1920x1200x24" pnpm run verify:studio-bg3d-webgpu-rotation
              bg3d-physics|pnpm run verify:studio-bg3d-physics
              engine-webgpu-textured-brush|pnpm run verify:studio-engine-webgpu-textured-brush
              engine-webgpu-tile-provider|pnpm run verify:studio-engine-webgpu-tile-provider
              engine-tile-storage-opfs-v2|pnpm run verify:studio-engine-tile-storage-opfs-v2
          - lane: 3d-ai-export-b
            browsers: chromium
            commands: |
              hybrid-dcc-integration|pnpm run verify:studio-hybrid-dcc-integration
              glb-export|pnpm run verify:studio-glb-export
              character-shaper|pnpm run verify:studio-character-shaper
              ai-quality|pnpm run verify:studio-ai-quality
              canvaskit-quality-worker|pnpm run verify:studio-canvaskit-quality-worker
              vello-candidate|pnpm run verify:studio-vello-candidate
              professional-bristle-webgpu|xvfb-run -a --server-args="-screen 0 1920x1200x24" pnpm run verify:studio-professional-bristle-webgpu
              dynamic-dual-tip-webgpu|pnpm run verify:studio-dynamic-dual-tip-webgpu
              dynamic-dual-tip-webgpu-v2|pnpm run verify:studio-dynamic-dual-tip-webgpu-v2
              studio-toolchain|pnpm run studio:toolchain:check
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browsers }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install browser engines and Linux dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.browsers }}" == "all" ]]; then
            pnpm exec playwright install --with-deps chromium firefox webkit
          else
            pnpm exec playwright install --with-deps chromium
          fi
      - uses: actions/download-artifact@v4
        with:
          name: main-full-qa-dist-${{ github.sha }}
          path: dist
      - name: Run every gate in this lane without hiding later failures
        shell: bash
        env:
          QA_LANE: ${{ matrix.lane }}
          QA_COMMANDS: ${{ matrix.commands }}
          TOONSPECTRUM_VERIFY_DIR: artifacts/main-full-qa/${{ matrix.lane }}/evidence
        run: |
          set -euo pipefail
          output_dir="artifacts/main-full-qa/${QA_LANE}"
          mkdir -p "$output_dir/evidence"
          : > "$output_dir/failures.txt"
          : > "$output_dir/results.tsv"

          run_gate() {
            local gate="$1"
            local command="$2"
            local log="$output_dir/${gate}.log"
            echo "::group::${gate}"
            echo "[qa] command=${command}"
            set +e
            timeout --signal=TERM --kill-after=30s "${QA_COMMAND_TIMEOUT_MINUTES}m" \
              bash -lc "$command" 2>&1 | tee "$log"
            local status=${PIPESTATUS[0]}
            set -e
            printf '%s\t%s\n' "$gate" "$status" >> "$output_dir/results.tsv"
            if [[ "$status" -ne 0 ]]; then
              printf '%s\t%s\t%s\n' "$gate" "$status" "$command" >> "$output_dir/failures.txt"
              echo "::error title=Studio QA gate failed::${gate} exited ${status}"
            fi
            echo "::endgroup::"
          }

          while IFS='|' read -r gate command; do
            [[ -z "${gate// }" ]] && continue
            run_gate "$gate" "$command"
          done <<< "$QA_COMMANDS"

          {
            echo "## Studio exhaustive QA · ${QA_LANE}"
            echo
            echo '| Gate | Exit |'
            echo '|---|---:|'
            while IFS=$'\t' read -r gate status; do
              echo "| \`${gate}\` | ${status} |"
            done < "$output_dir/results.tsv"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -s "$output_dir/failures.txt" ]]; then
            echo '[qa] failures:'
            cat "$output_dir/failures.txt"
            exit 1
          fi
      - name: Preserve logs, screenshots, traces and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-full-qa-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/main-full-qa/${{ matrix.lane }}/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
