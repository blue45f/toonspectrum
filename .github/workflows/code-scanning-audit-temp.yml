name: Temporary code scanning alert audit

on:
  push:
    branches:
      - fix/code-scanning-alerts-20260910
    paths:
      - .github/workflows/code-scanning-audit-temp.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/code-scanning-audit-temp.yml

permissions:
  contents: write
  security-events: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the audit branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Collect open code scanning alerts
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github
          gh api \
            --method GET \
            --paginate \
            --slurp \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100" \
            > /tmp/code-scanning-pages.json

          jq '[.[][] | {
            number,
            state,
            rule: {
              id: .rule.id,
              name: .rule.name,
              severity: .rule.severity,
              security_severity_level: .rule.security_severity_level,
              tags: .rule.tags
            },
            tool: .tool.name,
            created_at,
            updated_at,
            most_recent_instance: {
              ref: .most_recent_instance.ref,
              state: .most_recent_instance.state,
              category: .most_recent_instance.category,
              analysis_key: .most_recent_instance.analysis_key,
              environment: .most_recent_instance.environment,
              classifications: .most_recent_instance.classifications,
              location: .most_recent_instance.location
            }
          }] | sort_by(.number)' \
            /tmp/code-scanning-pages.json \
            > .github/code-scanning-open-alerts.json

          {
            echo '# Open code scanning alerts'
            echo
            echo "Generated from \`${GITHUB_REPOSITORY}\` at \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`."
            echo
            echo '| Alert | Severity | Rule | Location |'
            echo '| ---: | --- | --- | --- |'
            jq -r '.[] | [
              ("#" + (.number | tostring)),
              (.rule.security_severity_level // .rule.severity // "unknown"),
              ((.rule.id // "unknown") + " — " + (.rule.name // "")),
              ((.most_recent_instance.location.path // "unknown") + ":" + ((.most_recent_instance.location.start_line // 0) | tostring))
            ] | "| " + join(" | ") + " |"' \
              .github/code-scanning-open-alerts.json
          } > .github/code-scanning-open-alerts.md

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/code-scanning-open-alerts.json .github/code-scanning-open-alerts.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(security): capture open code scanning alerts'
          git push origin "HEAD:${AUDIT_BRANCH}"
