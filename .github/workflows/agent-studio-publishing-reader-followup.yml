name: Apply and verify Studio publishing reader follow-up

on:
  push:
    branches:
      - feat/studio-publishing-reader-policy-consumption-20260909

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Apply implementation and run quality gates
        id: verify
        shell: bash
        run: |
          set +e
          : > /tmp/studio-publishing-reader-followup.log
          (
            set -euo pipefail
            python3 scripts/apply-studio-publishing-reader-followup.py
            python3 scripts/fix-studio-publishing-reader-followup.py
            pnpm install --frozen-lockfile
            pnpm exec eslint --max-warnings=0 \
              apps/web/src/domains/creator/creator-publication-reader.ts \
              apps/web/src/domains/creator/creator-publication-reader.test.ts \
              apps/web/src/domains/creator/PublishedWorkReader.tsx \
              apps/web/src/domains/creator/PublishedWorkReader.test.tsx \
              apps/web/src/domains/creator/creator-publication-page-meta.ts \
              apps/web/src/domains/creator/creator-publication-page-meta.test.tsx \
              apps/web/src/domains/creator/CreateWorkPage.tsx
            pnpm exec vitest run \
              apps/web/src/domains/creator/creator-publication-reader.test.ts \
              apps/web/src/domains/creator/PublishedWorkReader.test.tsx \
              apps/web/src/domains/creator/creator-publication-page-meta.test.tsx \
              apps/web/src/shared/lib/creator-publication-contract.test.ts \
              apps/web/src/domains/creator/creator-a11y-contract.test.ts
            pnpm exec tsc -p tsconfig.json --noEmit
            pnpm run validate:architecture
            pnpm run build
          ) 2>&1 | tee /tmp/studio-publishing-reader-followup.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit verified implementation or diagnostics
        shell: bash
        run: |
          set -e
          rm -f \
            .github/workflows/agent-studio-publishing-reader-followup.yml \
            scripts/apply-studio-publishing-reader-followup.py \
            scripts/fix-studio-publishing-reader-followup.py

          if [ "${{ steps.verify.outputs.status }}" != "0" ]; then
            mkdir -p .agent
            cp /tmp/studio-publishing-reader-followup.log .agent/studio-publishing-reader-followup.log
            commit_message="chore(studio): record reader policy verification failure"
          else
            rm -f .agent/studio-publishing-reader-followup.log
            rmdir .agent 2>/dev/null || true
            commit_message="feat(studio): apply publish policy to public reader"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "$commit_message"
          git push origin HEAD:feat/studio-publishing-reader-policy-consumption-20260909

      - name: Surface verification failure
        if: steps.verify.outputs.status != '0'
        shell: bash
        run: exit 1
