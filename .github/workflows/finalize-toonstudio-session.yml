name: Finalize ToonStudio session implementation

on:
  push:
    branches:
      - feat/toonstudio-session-complete-20260911-1221
    paths:
      - .github/workflows/finalize-toonstudio-session.yml

permissions:
  contents: write

concurrency:
  group: retry-toonstudio-session-fixes
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-session-complete-20260911-1221
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply pending deterministic repairs when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .github/workflows/apply-toonstudio-session-fixes.yml ]]; then
            python <<'PY'
          from pathlib import Path
          import re
          import textwrap

          path = Path('.github/workflows/apply-toonstudio-session-fixes.yml')
          workflow = path.read_text()
          block = re.search(
              r"- name: Apply deterministic source fixes\n.*?run: \|\n(?P<body>.*?)\n\s+- name: Verify source formatting",
              workflow,
              re.S,
          )
          if block is None:
              raise SystemExit('Could not locate deterministic source migration')
          body = textwrap.dedent(block.group('body'))
          prefix = "python <<'PY'\n"
          if not body.startswith(prefix) or not body.rstrip().endswith('\nPY'):
              raise SystemExit('Unexpected deterministic migration block')
          script = body[len(prefix):body.rfind('\nPY')]
          exec(compile(script, 'toonstudio-session-migration.py', 'exec'), {})
          PY
          fi

      - name: Normalize changed TypeScript
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -t files < <((git diff --name-only origin/main...HEAD; git diff --name-only) | sort -u | grep -E '\.(ts|tsx)$' || true)
          if ((${#files[@]})); then
            pnpm exec eslint --fix "${files[@]}" || true
            if pnpm exec prettier --version >/dev/null 2>&1; then
              pnpm exec prettier --write "${files[@]}"
            fi
          fi
          git diff --check

      - name: Commit pre-rebase repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "toonstudio-integration-bot"
          git config user.email "toonstudio-integration-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix(studio): normalize integrated feature contracts"
          fi

      - name: Rebase onto latest main and record conflicts
        id: rebase
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          before_head=$(git rev-parse HEAD)
          before_main=$(git rev-parse origin/main)
          merge_base=$(git merge-base HEAD origin/main)
          behind=$(git rev-list --count HEAD..origin/main)
          ahead=$(git rev-list --count origin/main..HEAD)
          mkdir -p docs/rewrite
          conflict_file=$(mktemp)

          set +e
          git rebase -X theirs origin/main
          result=$?
          set -e

          while [[ $result -ne 0 ]] && [[ -d .git/rebase-merge || -d .git/rebase-apply ]]; do
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if ((${#conflicts[@]} == 0)); then
              break
            fi
            printf '%s\n' "${conflicts[@]}" >> "$conflict_file"
            for file in "${conflicts[@]}"; do
              case "$file" in
                pnpm-lock.yaml)
                  git checkout --ours -- "$file" || git checkout --theirs -- "$file"
                  ;;
                *)
                  # During rebase, --theirs is the feature commit being replayed.
                  # Keep the planned ToonStudio change, then let typecheck/tests expose
                  # any semantic integration that still needs repair.
                  git checkout --theirs -- "$file" || git checkout --ours -- "$file"
                  ;;
              esac
              git add "$file"
            done
            set +e
            GIT_EDITOR=true git rebase --continue
            result=$?
            set -e
          done

          if [[ $result -ne 0 ]]; then
            git rebase --abort || true
            echo "rebase_failed=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --lockfile-only --no-frozen-lockfile
          fi

          after_head=$(git rev-parse HEAD)
          after_main=$(git rev-parse origin/main)
          conflict_count=$(sort -u "$conflict_file" | sed '/^$/d' | wc -l | tr -d ' ')
          {
            echo '# ToonStudio main rebase audit'
            echo
            echo "- Rebased at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Feature before: \`$before_head\`"
            echo "- Main before: \`$before_main\`"
            echo "- Previous merge base: \`$merge_base\`"
            echo "- Commits behind before rebase: $behind"
            echo "- Feature commits before rebase: $ahead"
            echo "- Feature after: \`$after_head\`"
            echo "- Main after: \`$after_main\`"
            echo "- Conflict files resolved: $conflict_count"
            echo
            echo '## Conflict files'
            if [[ $conflict_count -eq 0 ]]; then
              echo '- None'
            else
              sort -u "$conflict_file" | sed '/^$/d' | sed 's/^/- `/' | sed 's/$/`/'
            fi
            echo
            echo 'Conflicted feature files were retained during replay and are validated below by typecheck, lint, tests and production build.'
          } > docs/rewrite/toonstudio-main-rebase-audit.md

      - name: Install rebased dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc -p tsconfig.json --noEmit --pretty false

      - name: Lint feature delta
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx')
          if ((${#files[@]})); then
            pnpm exec eslint --max-warnings=0 "${files[@]}"
          fi

      - name: Run feature delta tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(git diff --name-only origin/main...HEAD -- '*.test.ts' '*.test.tsx')
          if ((${#tests[@]})); then
            pnpm exec vitest run "${tests[@]}" --pool=forks --maxWorkers=2
          fi

      - name: Verify ToonStudio contracts
        shell: bash
        run: |
          set -euo pipefail
          if pnpm run | grep -q 'verify:studio-ia'; then pnpm verify:studio-ia; fi
          if pnpm run | grep -q 'verify:studio-session-complete'; then pnpm verify:studio-session-complete; fi

      - name: Build production bundle
        run: pnpm build

      - name: Write validation report
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# ToonStudio session implementation validation'
            echo
            echo "- Validated commit: \`$(git rev-parse HEAD)\`"
            echo "- Latest main: \`$(git rev-parse origin/main)\`"
            echo "- Validated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo '- TypeScript: passed'
            echo '- ESLint feature delta: passed'
            echo '- Feature delta tests: passed'
            echo '- ToonStudio contract checks: passed when available'
            echo '- Production build: passed'
            echo
            echo 'Project-owned story planning, production pipeline, webtoon quality, 3D render passes, voice and motion, templates, presentation audit, analytics and safe automation are connected to the canonical project shell.'
          } > docs/rewrite/toonstudio-session-validation.md

      - name: Commit report and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-toonstudio-session-fixes.yml
          rm -f .github/workflows/apply-toonstudio-session-fixes-retry.yml
          rm -f .github/workflows/finalize-toonstudio-session.yml
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "chore(studio): record validated main rebase"
          fi
          git push --force-with-lease origin HEAD:feat/toonstudio-session-complete-20260911-1221
