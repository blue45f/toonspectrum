name: Studio tooltip pro materialize

on:
  push:
    branches:
      - feat/studio-tooltip-pro-v2-20260909
    paths:
      - scripts/apply-studio-tooltip-pro-v2.mjs
      - scripts/finalize-studio-tooltip-pro-v2.mjs
      - .github/workflows/studio-tooltip-pro-materialize.yml

permissions:
  contents: write

concurrency:
  group: studio-tooltip-pro-materialize-arm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, 'refine tooltip interaction and motion') }}
    runs-on: ubuntu-slim
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /apps/web/src/domains/creator/StudioToolHint.tsx
            /apps/web/src/domains/creator/components/StudioToolHintBubble.tsx
            /apps/web/src/domains/creator/studio-tool-hint-position.ts
            /apps/web/src/domains/creator/studio-tool-hint-position.test.ts
            /apps/web/src/domains/creator/studio-tool-hint-exposure.ts
            /apps/web/src/domains/creator/studio-tool-hint-exposure.test.ts
            /apps/web/src/domains/creator/StudioToolHint.optimization.test.tsx
            /apps/web/src/styles/globals.css
            /docs/studio-tooltip-ux-v2-2026-09-09.md
            /scripts/apply-studio-tooltip-pro-v2.mjs
            /scripts/finalize-studio-tooltip-pro-v2.mjs
            /.github/workflows/studio-tooltip-pro-materialize.yml
      - name: Integrate latest main baseline
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --filter=blob:none origin main
          git merge --no-edit origin/main
      - name: Validate and apply tooltip UX v2 source changes
        run: |
          set -euo pipefail
          node --check scripts/apply-studio-tooltip-pro-v2.mjs
          node --check scripts/finalize-studio-tooltip-pro-v2.mjs
          node scripts/apply-studio-tooltip-pro-v2.mjs
          node scripts/finalize-studio-tooltip-pro-v2.mjs
      - name: Verify materialized source contract
        run: |
          set -euo pipefail
          test ! -e scripts/apply-studio-tooltip-pro-v2.mjs
          test ! -e scripts/finalize-studio-tooltip-pro-v2.mjs
          test ! -e .github/workflows/studio-tooltip-pro-materialize.yml
          grep -Fq 'STUDIO_TOOL_HINT_WARM_SWITCH_DELAY_MS = 90' apps/web/src/domains/creator/StudioToolHint.tsx
          grep -Fq 'readStudioToolHintViewport' apps/web/src/domains/creator/StudioToolHint.tsx
          grep -Fq 'data-studio-tool-hint-scroll-region="true"' apps/web/src/domains/creator/components/StudioToolHintBubble.tsx
          grep -Fq 'selectionPopupWidth: reservedWidth' apps/web/src/domains/creator/components/StudioToolHintBubble.tsx
          grep -Fq 'Studio tooltip pro v2' apps/web/src/styles/globals.css
          git diff --check
      - name: Commit materialized implementation
        run: |
          set -euo pipefail
          git add -A
          git commit -m "feat(studio): refine tooltip interaction and motion"
          git push origin HEAD:${{ github.ref_name }}
