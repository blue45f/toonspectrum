name: Wire marketplace authoring surfaces into PR 606 once

on:
  push:
    branches:
      - fix/marketplace-brush-publish-hardening-main-20260903
    paths:
      - ".github/workflows/marketplace-wire-authoring-surfaces-606-once.yml"

permissions:
  contents: write

concurrency:
  group: marketplace-wire-authoring-surfaces-606-once
  cancel-in-progress: true

env:
  CI: "true"
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  patch-verify-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/marketplace-brush-publish-hardening-main-20260903
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Materialize the missing product connections
        run: node scripts/marketplace/integrate-creator-authoring.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the product wiring
        run: |
          pnpm exec eslint --fix \
            src/domains/market/pages/MarketPublishPage.tsx \
            src/domains/creator/brush/StudioBrushStudio.tsx
          pnpm exec eslint --max-warnings=0 \
            src/domains/market/pages/MarketPublishPage.tsx \
            src/domains/creator/brush/StudioBrushStudio.tsx
          pnpm exec vitest run \
            src/domains/market/components/MarketplaceAuthoringWorkshop.test.tsx \
            src/domains/creator/MarketplaceBrushStudioBridge.test.tsx \
            src/domains/creator/MarketplaceBrushPublishShortcut.test.tsx \
            --reporter=verbose
          pnpm exec tsc -p tsconfig.json --noEmit
          pnpm run build
          git diff --check -- \
            src/domains/market/pages/MarketPublishPage.tsx \
            src/domains/creator/brush/StudioBrushStudio.tsx

      - name: Commit only verified product wiring
        run: |
          set -euo pipefail
          rm -f marketplace-authoring-integration-report.json
          rm -f .github/workflows/marketplace-wire-authoring-surfaces-606-once.yml
          git add \
            src/domains/market/pages/MarketPublishPage.tsx \
            src/domains/creator/brush/StudioBrushStudio.tsx \
            .github/workflows/marketplace-wire-authoring-surfaces-606-once.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(marketplace): wire authoring workshop and Brush Studio bridge"
          git push origin HEAD:fix/marketplace-brush-publish-hardening-main-20260903
