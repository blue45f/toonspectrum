name: Bootstrap Shaper-inspired surface paint

on:
  push:
    branches:
      - feat/shaper-surface-paint-20260903

permissions:
  contents: write

concurrency:
  group: shaper-surface-paint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[shaper-surface-paint-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/shaper-surface-paint-20260903
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Apply product wiring
        run: python3 scripts/apply-shaper-surface-paint.py

      - name: Inspect migration diff
        run: git diff --check && git status --short

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint changed surface-paint files
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: >-
          pnpm exec eslint --max-warnings=0
          src/domains/creator/vrm/StudioVrmPoserTypes.ts
          src/domains/creator/vrm/StudioVrmActor.tsx
          src/domains/creator/vrm/StudioVrmTexturePaintPanel.tsx
          src/domains/creator/vrm/StudioVrmPoserViewport.tsx
          src/domains/creator/vrm/useStudioVrmPoserRuntimeB.ts
          src/domains/creator/vrm/StudioVrmTexturePaintPanel.test.tsx
          src/domains/creator/vrm/studio-vrm-surface-paint-product-boundary.test.ts
          src/domains/creator/vrm/studio-vrm-texture-paint-integration-boundary.test.ts
          src/domains/creator/vrm/studio-vrm-texture-paint-runtime.test.ts

      - name: Run focused surface-paint tests
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: >-
          pnpm exec vitest run
          src/domains/creator/vrm/StudioVrmTexturePaintPanel.test.tsx
          src/domains/creator/vrm/studio-vrm-surface-paint-product-boundary.test.ts
          src/domains/creator/vrm/studio-vrm-texture-paint-integration-boundary.test.ts
          src/domains/creator/vrm/studio-vrm-surface-paint-tool.test.ts
          src/domains/creator/vrm/studio-vrm-texture-paint-runtime.test.ts

      - name: Type-check the web workspace
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm exec tsc -p tsconfig.json --noEmit --incremental false

      - name: Commit verified implementation
        run: |
          rm scripts/apply-shaper-surface-paint.py
          rm .github/workflows/bootstrap-shaper-surface-paint.yml
          git config user.name "toonstudio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(studio): enable direct VRM surface painting [shaper-surface-paint-applied]"
          git push origin HEAD:feat/shaper-surface-paint-20260903
