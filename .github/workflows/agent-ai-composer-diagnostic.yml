name: agent-ai-composer-apply

on:
  push:
    branches: [feat/studio-ai-comic-composer-20260909]
    paths: [.github/workflows/agent-ai-composer-diagnostic.yml]

permissions:
  contents: write

concurrency:
  group: agent-ai-composer-integration
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/studio-ai-comic-composer-20260909
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            apps/web/src/domains/creator
            docs
            scripts
            .github/workflows
      - name: Apply guarded integration patch
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/agent-ai-composer-patch.part-{01,02,03,04} > scripts/agent-apply-ai-composer.py
          python -m py_compile scripts/agent-apply-ai-composer.py
          python scripts/agent-apply-ai-composer.py
          rm scripts/agent-apply-ai-composer.py
          git diff --check
      - name: Verify production-loop invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'createStudioAiComicComposerHandoff(plan)' apps/web/src/domains/creator/ai/StudioAiToolPopoverBody.tsx
          grep -Fq 'subscribeStudioAiComicComposerOpenRequest' apps/web/src/domains/creator/StudioThreeDPreviewPanelStack.tsx
          grep -Fq 'onImportScenarioProductionPlan' apps/web/src/domains/creator/StudioCuttoonEditorHost.tsx
          grep -Fq 'planStudioScenarioImageGeneration(snapshot.items, request)' apps/web/src/domains/creator/ai/studio-scenario-image-generation.ts
          grep -Fq '<StudioScenarioCandidateDesk' apps/web/src/domains/creator/StudioScenarioAutoLayoutPanel.tsx
          grep -Fq 'approvedImageCandidateId' apps/web/src/domains/creator/studio-scenario-layout.ts
      - name: Commit integrated production sources
        shell: bash
        run: |
          set -euo pipefail
          git add apps/web/src/domains/creator docs/studio-ai-comic-composer-benchmark-2026-09.md .github/workflows/studio-ai-comic-composer-quality.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(studio): connect episode plans to reviewed AI cut candidates'
          git push origin HEAD:feat/studio-ai-comic-composer-20260909
