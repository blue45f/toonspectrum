name: Apply Shaper quality closure

on:
  push:
    branches:
      - feat/shaper-surface-paint-20260903

permissions:
  contents: write

concurrency:
  group: shaper-quality-closure
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[shaper-quality-closure]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out quality branch
        uses: actions/checkout@v6
        with:
          ref: feat/shaper-surface-paint-20260903
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Apply quality closure
        run: python3 scripts/apply-shaper-quality-closure.py

      - name: Inspect generated diff
        run: git diff --check && git status --short

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository architecture
        run: pnpm run validate:architecture

      - name: Lint changed product surfaces
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: >-
          pnpm exec eslint --max-warnings=0
          src/domains/creator/vrm/studio-vrm-avatar-forge.ts
          src/domains/creator/vrm/studio-vrm-semantic-face-morph.ts
          src/domains/creator/vrm/studio-vrm-semantic-face-morph.test.ts
          src/domains/creator/vrm/StudioVrmAvatarForge.tsx
          src/domains/creator/vrm/StudioVrmAvatarForge.test.ts
          src/domains/creator/vrm/StudioVrmAvatarForgePanel.tsx
          src/domains/creator/vrm/StudioVrmAvatarForgePanel.test.tsx
          src/domains/creator/vrm/StudioVrmAvatarForgePreview.tsx
          src/domains/creator/vrm/StudioVrmAvatarForgePreview.test.tsx
          src/domains/creator/vrm/StudioVrmForgeRangeControl.tsx
          src/domains/creator/vrm/StudioVrmPoserPanelBodyA.tsx
          src/domains/creator/scene-3d/studio-shaper-model.ts
          src/domains/creator/scene-3d/studio-shaper-model.test.ts
          src/domains/creator/scene-3d/StudioShaperPanel.tsx
          src/domains/creator/scene-3d/StudioShaperPanel.test.tsx
          src/domains/creator/scene-3d/StudioMannequinPoserPanel.tsx
          src/domains/creator/scene-3d/StudioMannequinPoserPanel.test.tsx

      - name: Run focused quality regression suite
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: >-
          pnpm exec vitest run
          src/domains/creator/vrm/studio-vrm-semantic-face-morph.test.ts
          src/domains/creator/vrm/studio-vrm-avatar-forge.test.ts
          src/domains/creator/vrm/StudioVrmAvatarForge.test.ts
          src/domains/creator/vrm/StudioVrmAvatarForgePanel.test.tsx
          src/domains/creator/vrm/StudioVrmAvatarForgePreview.test.tsx
          src/domains/creator/vrm/StudioVrmForgeRangeControl.test.tsx
          src/domains/creator/scene-3d/studio-shaper-model.test.ts
          src/domains/creator/scene-3d/StudioShaperPanel.test.tsx
          src/domains/creator/scene-3d/StudioMannequinPoserPanel.test.tsx

      - name: Type-check the web workspace
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm exec tsc -p tsconfig.json --noEmit --incremental false

      - name: Build production Studio
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm run build

      - name: Commit verified quality closure
        run: |
          rm -rf scripts/.shaper-quality-payload
          rm scripts/apply-shaper-quality-closure.py
          rm .github/workflows/apply-shaper-quality-closure.yml
          git config user.name "toonstudio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit --no-verify -m "feat(studio): close character quality gaps [shaper-quality-closure]"
          git push --no-verify origin HEAD:feat/shaper-surface-paint-20260903
