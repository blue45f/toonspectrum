name: Push audited recovery tags

on:
  push:
    branches: [fix/real-core-and-main-only-20260910]
    paths: [.github/workflows/push-audited-recovery-tags.yml]

permissions:
  contents: write

concurrency:
  group: push-audited-recovery-tags-20260910
  cancel-in-progress: true

jobs:
  tag:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/real-core-and-main-only-20260910
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch old objects, verify them, and push lightweight tags
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"

          fetch_commit() {
            local sha="$1"
            local pr="${2:-}"
            if git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              return
            fi
            if ! git fetch --no-tags origin "${sha}"; then
              if [[ -z "$pr" ]]; then
                echo "Unable to fetch audited commit ${sha}." >&2
                exit 1
              fi
              git fetch --no-tags origin "+refs/pull/${pr}/head:refs/remotes/recovery/pr-${pr}"
            fi
            git cat-file -e "${sha}^{commit}"
          }

          ensure_tag() {
            local tag="$1"
            local sha="$2"
            local pr="${3:-}"
            local existing
            fetch_commit "$sha" "$pr"
            existing="$(git rev-parse -q --verify "refs/tags/${tag}^{commit}" 2>/dev/null || true)"
            if [[ -n "$existing" ]]; then
              if [[ "$existing" != "$sha" ]]; then
                echo "Tag ${tag} points to ${existing}; expected ${sha}." >&2
                exit 1
              fi
              echo "Verified ${tag} -> ${sha}"
              return
            fi
            git tag "$tag" "$sha"
            git push origin "refs/tags/${tag}"
            echo "Created ${tag} -> ${sha}"
          }

          ensure_tag recovery/2026-09-10/pre-recovery-main d110925528e8ab2c485d5502cef7eae0e8d056dc
          ensure_tag recovery/2026-09-10/pre-recovery-pr1289 89fd666a84bc606295ddf6ffab4e69bd6274cfda
          ensure_tag recovery/2026-09-10/studio-3d-production-quality a8c475dc38060d46e50406b3802ead1867ab2515
          ensure_tag recovery/2026-09-10/vrm-model-quality 591c59ad9f7e6cebb7fe519287bc49274a4a56d1
          ensure_tag recovery/2026-09-10/vrm-thumbnail-quality ae94cb5b06c1f9e2fa7ce9665d9be61aa93730f4
          ensure_tag recovery/2026-09-10/bg3d-webgl-context a09c8533f8a6ba96f043345f2ccb9ff1a5b6a5dd 1242
          ensure_tag recovery/2026-09-10/vrm-preview-atomic-decode 546922a3cb1b888de8b4ceeeb0548b21db726ce1 1240
          ensure_tag recovery/2026-09-10/studio-effects-workspace f76a78bc047d42dcc74cda6002307d50fb491cd8 1231
          ensure_tag recovery/2026-09-10/studio-unified-3d-entry 1b71d831407324fb4b2d9e5b4f0c1cabb5dd1d52 1232
          ensure_tag recovery/2026-09-10/studio-insert-batch-race b0c830f74a6dc1d8574829f91ddba3b8332869ca 1228
          ensure_tag recovery/2026-09-10/concurrent-webgl-recovery 94a6eefdd52edc47078574f9e8be4bfdf512cad1
          ensure_tag recovery/2026-09-10/concurrent-vrm-quality-bootstrap 7f9c5acdee0c1be255d18887267be85288130e2d
          ensure_tag recovery/2026-09-10/pre-final-product-recovery "$(git rev-parse HEAD)"
