name: Provisioned QA Auth Lifecycle

on:
  push:
    branches:
      - qa/extended-matrix-20260902
    paths:
      - ".github/workflows/qa-auth-lifecycle.yml"
      - "e2e/auth-account-matrix.spec.ts"
      - "e2e/market-live.spec.ts"
      - "e2e/run-market-live-e2e.mjs"
      - "playwright.market-live.config.ts"
      - "apps/api/src/**"
      - "lib/auth-crypto.ts"
      - "drizzle.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provisioned-qa-auth-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  NODE_OPTIONS: --max-old-space-size=8192
  DATABASE_URL: postgres://webdex:webdex@127.0.0.1:5432/webdex_qa
  TEST_DATABASE_URL: postgres://webdex:webdex@127.0.0.1:5432/webdex_qa
  TOONSPECTRUM_MARKET_LIVE_API_URL: http://127.0.0.1:4401
  TOONSPECTRUM_MARKET_LIVE_E2E: "1"

jobs:
  authenticated-account-lifecycle:
    name: provision-signup-login-logout-revoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: webdex
          POSTGRES_PASSWORD: webdex
          POSTGRES_DB: webdex_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webdex -d webdex_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Provision the disposable QA database schema
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm'

          set +e
          push_output="$(pnpm exec drizzle-kit push --force 2>&1)"
          push_status=$?
          set -e
          printf '%s\n' "$push_output"
          if [[ "$push_status" -ne 0 ]] \
            || grep -Eiq '(^|[[:space:]])error:|severity:.*(ERROR|FATAL|PANIC)' <<< "$push_output"; then
            echo "::error::drizzle-kit QA schema provision failed."
            exit 1
          fi

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1
              FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'user'
                AND column_name = 'status'
            ) THEN
              RAISE EXCEPTION 'QA schema provision failed: public.user.status is missing';
            END IF;
          END;
          $$;
          SQL
      - name: Generate disposable QA credentials
        shell: bash
        run: |
          password="$(node -e "console.log('Qa!' + require('node:crypto').randomBytes(18).toString('base64url'))")"
          echo "::add-mask::$password"
          echo "TOONSPECTRUM_MARKET_LIVE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "TOONSPECTRUM_MARKET_LIVE_EMAIL=qa-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.test" >> "$GITHUB_ENV"
          echo "TOONSPECTRUM_MARKET_LIVE_NAME=격리 QA ${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
      - name: Execute signup validation, login, cookie, logout, and stale-session checks
        run: pnpm run test:market:live
      - name: Verify disposable account rows were created only in QA database
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc \
            "SELECT count(*) FROM public.\"user\" WHERE email LIKE 'qa-%@example.test' OR email LIKE 'qa-%+%@example.test';" \
            | tee qa-auth-account-count.txt
      - name: Upload auth lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qa-auth-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
            qa-auth-account-count.txt
          if-no-files-found: ignore
          retention-days: 14
