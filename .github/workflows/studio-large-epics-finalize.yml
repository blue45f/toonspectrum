name: Finalize Studio large epics

on:
  push:
    branches:
      - codex/studio-large-epics-closure-20260909
    paths:
      - docs/automation/studio-large-epics-closure-status.json
      - docs/automation/studio-hyper3d-live-acceptance.json
      - .github/workflows/studio-large-epics-finalize.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: finalize-studio-large-epics
  cancel-in-progress: true

jobs:
  final-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require focused and live acceptance receipts
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const required = [
            'docs/automation/studio-large-epics-closure-status.json',
            'docs/automation/studio-hyper3d-live-acceptance.json',
          ];
          for (const file of required) {
            if (!fs.existsSync(file)) throw new Error(`required acceptance receipt is missing: ${file}`);
            const receipt = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (receipt.passed !== true) throw new Error(`acceptance receipt is not green: ${file}`);
          }
          NODE

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run repository release gate
        run: pnpm run ci

      - name: Mark the main PR ready and enable protected auto-merge
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          pr_number="$(gh pr list --repo "$REPOSITORY" --head "$HEAD_BRANCH" --base main --state open --json number --jq '.[0].number')"
          if [ -z "$pr_number" ]; then
            echo "No open main PR found for ${HEAD_BRANCH}." >&2
            exit 1
          fi
          if gh pr view "$pr_number" --repo "$REPOSITORY" --json isDraft --jq '.isDraft' | grep -qx true; then
            gh pr ready "$pr_number" --repo "$REPOSITORY"
          fi
          gh pr merge "$pr_number" --repo "$REPOSITORY" --auto --merge
          echo "Protected auto-merge enabled for PR #${pr_number}."
