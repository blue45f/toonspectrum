name: Studio 767 diagnostic evidence
on:
  push:
    branches: [chore/studio-767-diagnostic-evidence-20260906]
    paths: ['.github/workflows/studio-767-diagnostic-evidence.yml']
permissions:
  contents: read
  actions: read
jobs:
  logs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Collect completed job evidence without changing checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          for job in 101340478581 101340478582 101340478181; do
            gh api --allow-escape-sequences "repos/blue45f/toonspectrum/actions/jobs/$job/logs" > "$RUNNER_TEMP/evidence/$job.log"
          done
          python3 - <<'PY'
          import os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'evidence'
          for path in root.glob('*.log'):
              text = path.read_text(encoding='utf-8-sig')
              clean = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', text)
              path.write_text(clean)
              path.with_suffix('.tail.txt').write_text('\n'.join(clean.splitlines()[-220:]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-767-ci-errors
          path: ${{ runner.temp }}/evidence
          retention-days: 3
          if-no-files-found: error
