name: Apply InkWash live preview quality wave

on:
  push:
    branches:
      - fix/inkwash-live-preview-quality-20260904
    paths:
      - "scripts/apply-inkwash-live-preview-quality-wave.mjs"
      - ".github/workflows/apply-inkwash-live-preview-quality-wave.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-inkwash-live-preview-quality-wave
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[inkwash-live-preview-applied]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/inkwash-live-preview-quality-20260904
          fetch-depth: 1
      - name: Tighten quality semantics and generated workflow
        shell: python
        run: |
          from pathlib import Path

          path = Path("scripts/apply-inkwash-live-preview-quality-wave.mjs")
          source = path.read_text(encoding="utf-8")

          def replace_one(before: str, after: str, label: str) -> None:
              global source
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f"{label} target count={count}")
              source = source.replace(before, after, 1)

          replace_one(
              (
                  "  const baseRadius = Math.max(0.75, options.radius);\n"
                  "  const absorption = spectralColor({ ...options, samples: [] });\n"
                  "  return {"
              ),
              '''  const baseRadius = Math.max(0.75, options.radius);
          const absorption = spectralColor({
            tool: options.tool,
            samples: [],
            radius: options.radius,
            pigmentLoad: options.pigmentLoad,
            wetnessLoad: options.wetnessLoad,
            ...(options.spectralAbsorption
              ? { spectralAbsorption: options.spectralAbsorption }
              : {}),
            ...(options.inkColor ? { inkColor: options.inkColor } : {}),
          });
          return {''',
              "preview construction",
          )
          replace_one(
              "const INKWASH_PREVIEW_TILE_SIZE = 128;",
              "const INKWASH_PREVIEW_TILE_SIZE = 64;",
              "preview tile size",
          )
          replace_one(
              "                coarseBase: 32,",
              "                coarseBase: 16,",
              "preview coarse grid",
          )
          replace_one(
              (
                  "        state.previousPressure\n"
                  "          + (currentPressure - state.previousPressure) * amount,\n"
              ),
              "        currentPressure,\n",
              "commit pressure semantics",
          )
          replace_one(
              (
                  "  push:\n"
                  "    branches:\n"
                  "      - fix/inkwash-live-preview-quality-20260904\n"
              ),
              (
                  "  push:\n"
                  "    branches:\n"
                  "      - main\n"
                  "      - fix/inkwash-live-preview-quality-20260904\n"
              ),
              "permanent workflow branch coverage",
          )

          expression_open = "$" + "{{"
          replace_one(
              (
                  "      TOONSPECTRUM_VERIFY_DIR: "
                  + expression_open
                  + " runner.temp }}/studio-inkwash-live-preview-quality\n"
              ),
              "",
              "runner-temp job environment",
          )
          replace_one(
              (
                  "      - uses: actions/checkout@v6\n"
                  "      - uses: pnpm/action-setup@v4\n"
              ),
              (
                  "      - uses: actions/checkout@v6\n"
                  "      - name: Resolve verification directory after runner allocation\n"
                  "        run: echo \"TOONSPECTRUM_VERIFY_DIR=$RUNNER_TEMP/studio-inkwash-live-preview-quality\" >> \"$GITHUB_ENV\"\n"
                  "      - uses: pnpm/action-setup@v4\n"
              ),
              "runner-temp setup step",
          )

          source = source.replace("${name}", "\\${name}")
          source = source.replace('${label ?? "unknown"}', '\\${label ?? "unknown"}')
          source = source.replace(expression_open, "\\$" + "{{")
          path.write_text(source, encoding="utf-8")
      - name: Apply quality-first preview patch
        run: |
          node --check scripts/apply-inkwash-live-preview-quality-wave.mjs
          node scripts/apply-inkwash-live-preview-quality-wave.mjs
      - name: Commit product changes for full validation
        run: |
          git config user.name "toonstudio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit --no-verify -m "feat(brush): add causal tiled InkWash live preview [inkwash-live-preview-applied]"
          git push --no-verify origin HEAD:fix/inkwash-live-preview-quality-20260904
