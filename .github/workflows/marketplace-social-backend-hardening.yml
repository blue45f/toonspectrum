name: Marketplace social backend hardening

on:
  push:
    branches:
      - feat/marketplace-social-studio-integration-20260904
    paths:
      - "scripts/apply-marketplace-social-backend-hardening.mjs"
      - ".github/workflows/marketplace-social-backend-hardening.yml"

permissions:
  contents: write

concurrency:
  group: marketplace-social-backend-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[market-social-backend-hardened]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/marketplace-social-studio-integration-20260904
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm
      - name: Apply exact backend hardening
        run: |
          node scripts/apply-marketplace-social-backend-hardening.mjs
          git diff --check
      - run: pnpm install --frozen-lockfile
      - name: Focused marketplace social verification
        run: |
          pnpm run validate:architecture
          pnpm exec eslint --max-warnings=0 \
            apps/api/src/modules/creator-marketplace/creator-marketplace-social.service.ts \
            apps/api/src/modules/creator-marketplace/creator-marketplace-social.service.test.ts \
            apps/api/src/modules/creator-marketplace/creator-marketplace-social-boundary.test.ts \
            src/domains/market/hooks/use-market-social.ts \
            src/domains/market/hooks/use-market-social.test.tsx
          pnpm exec vitest run \
            apps/api/src/modules/creator-marketplace/creator-marketplace-social.service.test.ts \
            apps/api/src/modules/creator-marketplace/creator-marketplace-social-boundary.test.ts \
            apps/api/src/modules/creator-marketplace/creator-marketplace-social-boundary.guard.test.ts \
            apps/api/src/modules/creator-marketplace/creator-marketplace-social-generic-api-boundary.test.ts \
            lib/creator-marketplace-social-contract.test.ts \
            lib/creator-marketplace-social-namespace.test.ts \
            src/domains/market/hooks/use-market-social.test.tsx \
            src/domains/market/components/MarketCommentsSection.test.tsx \
            src/domains/market/components/MarketReviewsSection.test.tsx \
            src/domains/market/models/market-studio-handoff.test.ts
          pnpm exec tsc -p tsconfig.json --noEmit --incremental false
      - name: Commit verified product changes and remove one-shot tooling
        run: |
          rm -f scripts/apply-marketplace-social-backend-hardening.mjs
          rm -f .github/workflows/marketplace-social-backend-hardening.yml
          git config user.name "toonstudio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit --no-verify -m "fix(market): harden persistent social lifecycle [market-social-backend-hardened]"
          git push --no-verify origin HEAD:feat/marketplace-social-studio-integration-20260904
