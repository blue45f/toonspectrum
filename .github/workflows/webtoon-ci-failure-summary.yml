name: CI failure analytics

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Days of retained Actions history to inspect; use 0 for all retained history
        required: true
        default: '120'
        type: string
      max_runs:
        description: Maximum failed workflow runs included in the metadata census
        required: true
        default: '15000'
        type: string
      max_log_runs:
        description: Maximum repository-authored failed runs sampled for root-cause logs
        required: true
        default: '120'
        type: string
      include_dynamic:
        description: Inspect logs from dynamic or security-bot workflows while keeping their metrics separate
        required: true
        default: false
        type: boolean
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '.github/workflows/webtoon-ci-failure-summary.yml'
      - 'scripts/ci-failure-analytics.mjs'
      - 'scripts/ci-failure-analytics.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/webtoon-ci-failure-summary.yml'
      - 'scripts/ci-failure-analytics.mjs'
      - 'scripts/ci-failure-analytics.test.mjs'
  schedule:
    - cron: '17 0 * * *'

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-failure-analytics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  failure-analytics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      CI_FAILURE_LOOKBACK_DAYS: ${{ github.event_name == 'schedule' && '14' || inputs.lookback_days || '120' }}
      CI_FAILURE_MAX_RUNS: ${{ github.event_name == 'schedule' && '2000' || inputs.max_runs || '15000' }}
      CI_FAILURE_MAX_LOG_RUNS: ${{ github.event_name == 'schedule' && '60' || inputs.max_log_runs || '120' }}
      CI_FAILURE_INCLUDE_DYNAMIC: ${{ inputs.include_dynamic || 'false' }}
      CI_FAILURE_CONCURRENCY: '4'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/ci-failure-analytics.mjs
            /scripts/ci-failure-analytics.test.mjs

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.16.0
          package-manager-cache: false

      - name: Verify failure classifier contracts
        run: node --test scripts/ci-failure-analytics.test.mjs

      - name: Aggregate retained CI failures
        run: node scripts/ci-failure-analytics.mjs

      - name: Upload machine-readable and Markdown reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-failure-analytics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-failure-analytics/
          retention-days: 30
          if-no-files-found: warn
