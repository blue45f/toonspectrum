name: Mannequin anatomy v1 bootstrap

on:
  push:
    branches: [feat/mannequin-anatomy-v1-20260910]
    paths: [.github/workflows/mannequin-anatomy-v1-bootstrap.yml]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/mannequin-anatomy-v1-20260910
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Extend parametric anatomy model and controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          model = Path('apps/web/src/domains/creator/scene-3d/studio-mannequin-model.ts')
          text = model.read_text(encoding='utf-8')

          old = '''  /** 코 높이 배율. 0.8–1.3. 기본 1. */\n  readonly noseHeight?: number;\n}\n\nexport type StudioMannequinCoreParamKey =\n'''
          new = '''  /** 코 높이 배율. 0.8–1.3. 기본 1. */\n  readonly noseHeight?: number;\n  /** 몸통 앞뒤 깊이. 얇은 실루엣↔입체 흉곽. 0.75–1.35. */\n  readonly torsoDepth?: number;\n  /** 허리 중심부 폭/질량. 0.7–1.3. */\n  readonly waistWidth?: number;\n  /** 팔·다리 전체 굵기 배율. 0.7–1.35. */\n  readonly limbThickness?: number;\n  /** 손바닥·손가락 크기 배율. 0.75–1.3. */\n  readonly handScale?: number;\n  /** 발 길이·발볼 크기 배율. 0.75–1.3. */\n  readonly footScale?: number;\n  /** 목 굵기 배율. 0.75–1.3. */\n  readonly neckThickness?: number;\n}\n\nexport type StudioMannequinCoreParamKey =\n'''
          assert text.count(old) == 1, 'body params anchor changed'
          text = text.replace(old, new, 1)

          old = '''export type StudioMannequinHeadParamKey =\n  | "faceWidth"\n  | "chinLength"\n  | "eyeScale"\n  | "noseHeight";\n\nexport const STUDIO_MANNEQUIN_PARAM_RANGES = Object.freeze({\n'''
          new = '''export type StudioMannequinHeadParamKey =\n  | "faceWidth"\n  | "chinLength"\n  | "eyeScale"\n  | "noseHeight";\n\nexport type StudioMannequinAnatomyParamKey =\n  | "torsoDepth"\n  | "waistWidth"\n  | "limbThickness"\n  | "handScale"\n  | "footScale"\n  | "neckThickness";\n\nexport const STUDIO_MANNEQUIN_PARAM_RANGES = Object.freeze({\n'''
          assert text.count(old) == 1, 'head param type anchor changed'
          text = text.replace(old, new, 1)

          old = '''export const STUDIO_MANNEQUIN_HEAD_PARAM_RANGES = Object.freeze({\n  faceWidth: [0.7, 1.3],\n  chinLength: [0.7, 1.3],\n  eyeScale: [0.8, 1.3],\n  noseHeight: [0.8, 1.3],\n} as const satisfies Record<StudioMannequinHeadParamKey, readonly [number, number]>);\n\nexport const STUDIO_MANNEQUIN_DEFAULT_BODY_PARAMS: StudioMannequinBodyParams = Object.freeze({\n'''
          new = '''export const STUDIO_MANNEQUIN_HEAD_PARAM_RANGES = Object.freeze({\n  faceWidth: [0.7, 1.3],\n  chinLength: [0.7, 1.3],\n  eyeScale: [0.8, 1.3],\n  noseHeight: [0.8, 1.3],\n} as const satisfies Record<StudioMannequinHeadParamKey, readonly [number, number]>);\n\nexport const STUDIO_MANNEQUIN_ANATOMY_PARAM_RANGES = Object.freeze({\n  torsoDepth: [0.75, 1.35],\n  waistWidth: [0.7, 1.3],\n  limbThickness: [0.7, 1.35],\n  handScale: [0.75, 1.3],\n  footScale: [0.75, 1.3],\n  neckThickness: [0.75, 1.3],\n} as const satisfies Record<StudioMannequinAnatomyParamKey, readonly [number, number]>);\n\nexport const STUDIO_MANNEQUIN_DEFAULT_BODY_PARAMS: StudioMannequinBodyParams = Object.freeze({\n'''
          assert text.count(old) == 1, 'range anchor changed'
          text = text.replace(old, new, 1)

          old = '''  legLength: 1,\n  build: 1,\n});\n'''
          new = '''  legLength: 1,\n  build: 1,\n  torsoDepth: 1,\n  waistWidth: 1,\n  limbThickness: 1,\n  handScale: 1,\n  footScale: 1,\n  neckThickness: 1,\n});\n'''
          assert text.count(old) == 1, 'default params anchor changed'
          text = text.replace(old, new, 1)

          old = '''  for (const key of Object.keys(STUDIO_MANNEQUIN_HEAD_PARAM_RANGES) as StudioMannequinHeadParamKey[]) {\n    if (source[key] !== undefined) {\n      const [min, max] = STUDIO_MANNEQUIN_HEAD_PARAM_RANGES[key];\n      result[key] = clampNumber(source[key], min, max, STUDIO_MANNEQUIN_DEFAULT_HEAD_PARAMS[key]);\n    }\n  }\n  return result as StudioMannequinBodyParams;\n}\n'''
          new = '''  for (const key of Object.keys(STUDIO_MANNEQUIN_HEAD_PARAM_RANGES) as StudioMannequinHeadParamKey[]) {\n    if (source[key] !== undefined) {\n      const [min, max] = STUDIO_MANNEQUIN_HEAD_PARAM_RANGES[key];\n      result[key] = clampNumber(source[key], min, max, STUDIO_MANNEQUIN_DEFAULT_HEAD_PARAMS[key]);\n    }\n  }\n  for (const key of Object.keys(STUDIO_MANNEQUIN_ANATOMY_PARAM_RANGES) as StudioMannequinAnatomyParamKey[]) {\n    if (source[key] !== undefined || STUDIO_MANNEQUIN_DEFAULT_BODY_PARAMS[key] !== undefined) {\n      const [min, max] = STUDIO_MANNEQUIN_ANATOMY_PARAM_RANGES[key];\n      result[key] = clampNumber(source[key], min, max, STUDIO_MANNEQUIN_DEFAULT_BODY_PARAMS[key] ?? 1);\n    }\n  }\n  return result as StudioMannequinBodyParams;\n}\n'''
          assert text.count(old) == 1, 'clamp anchor changed'
          text = text.replace(old, new, 1)

          old = '''  const upperArmLen = 1.34 * hu * params.armLength;\n  const foreArmLen = 1.06 * hu * params.armLength;\n  const handLen = 0.58 * hu * params.armLength;\n\n  const halfShoulder = 0.78 * hu * params.shoulderWidth * build.shoulder;\n'''
          new = '''  const torsoDepth = params.torsoDepth ?? 1;\n  const waistWidth = params.waistWidth ?? 1;\n  const limbThickness = params.limbThickness ?? 1;\n  const handScale = params.handScale ?? 1;\n  const footScale = params.footScale ?? 1;\n  const neckThickness = params.neckThickness ?? 1;\n\n  const upperArmLen = 1.34 * hu * params.armLength;\n  const foreArmLen = 1.06 * hu * params.armLength;\n  const handLen = 0.58 * hu * params.armLength * handScale;\n\n  const halfShoulder = 0.78 * hu * params.shoulderWidth * build.shoulder;\n'''
          assert text.count(old) == 1, 'anatomy derived anchor changed'
          text = text.replace(old, new, 1)

          text = text.replace('''  const limbR = build.limbRadius;\n  const footLen = 0.95 * hu;\n''', '''  const limbR = build.limbRadius * limbThickness;\n  const footLen = 0.95 * hu * footScale;\n''', 1)
          text = text.replace('''      scale: vec3(1.5 * params.pelvisWidth, 0.8, 0.92),\n''', '''      scale: vec3(1.5 * params.pelvisWidth, 0.8, 0.92 * torsoDepth),\n''', 1)
          text = text.replace('''      radius: 0.24 * hu * build.torsoLower,\n''', '''      radius: 0.24 * hu * build.torsoLower * waistWidth,\n''', 1)
          text = text.replace('''        0.72,\n''', '''        0.72 * torsoDepth,\n''', 1)
          text = text.replace('''{ kind: "capsule", jointId: "neck", from: vec3(0, 0, 0), to: vec3(0, neckLen, 0), radius: 0.11 * hu },''', '''{ kind: "capsule", jointId: "neck", from: vec3(0, 0, 0), to: vec3(0, neckLen, 0), radius: 0.11 * hu * neckThickness },''', 1)
          text = text.replace('''radius: 0.095 * hu },\n    { kind: "sphere", jointId: "leftHand"''', '''radius: 0.095 * hu * handScale },\n    { kind: "sphere", jointId: "leftHand"''', 1)
          text = text.replace('''radius: 0.095 * hu },\n    { kind: "sphere", jointId: "rightHand"''', '''radius: 0.095 * hu * handScale },\n    { kind: "sphere", jointId: "rightHand"''', 1)
          text = text.replace('''radius: 0.105 * hu * limbR },\n    { kind: "sphere", jointId: "rightUpperLeg"''', '''radius: 0.105 * hu * limbR * footScale },\n    { kind: "sphere", jointId: "rightUpperLeg"''', 1)
          text = text.replace('''radius: 0.105 * hu * limbR },\n  ];''', '''radius: 0.105 * hu * limbR * footScale },\n  ];''', 1)
          model.write_text(text, encoding='utf-8')

          panel = Path('apps/web/src/domains/creator/scene-3d/StudioMannequinPoserPanel.tsx')
          text = panel.read_text(encoding='utf-8')
          text = text.replace('''  STUDIO_MANNEQUIN_BODY_PRESETS,\n  STUDIO_MANNEQUIN_DEFAULT_BODY_PARAMS,\n''', '''  STUDIO_MANNEQUIN_ANATOMY_PARAM_RANGES,\n  STUDIO_MANNEQUIN_BODY_PRESETS,\n  STUDIO_MANNEQUIN_DEFAULT_BODY_PARAMS,\n''', 1)
          text = text.replace('''  type StudioMannequinBodyParams,\n  type StudioMannequinBodyPresetId,\n''', '''  type StudioMannequinAnatomyParamKey,\n  type StudioMannequinBodyParams,\n  type StudioMannequinBodyPresetId,\n''', 1)
          anchor = '''const HEAD_SLIDERS: readonly {\n  key: keyof StudioMannequinBodyParams;\n'''
          anatomy = '''const ANATOMY_SLIDERS: readonly {\n  key: StudioMannequinAnatomyParamKey;\n  label: string;\n  step: number;\n}[] = Object.freeze([\n  { key: "torsoDepth", label: "몸통 깊이", step: 0.02 },\n  { key: "waistWidth", label: "허리 너비", step: 0.02 },\n  { key: "limbThickness", label: "팔다리 굵기", step: 0.02 },\n  { key: "handScale", label: "손 크기", step: 0.02 },\n  { key: "footScale", label: "발 크기", step: 0.02 },\n  { key: "neckThickness", label: "목 굵기", step: 0.02 },\n]);\n\n'''
          assert text.count(anchor) == 1, 'panel slider anchor changed'
          text = text.replace(anchor, anatomy + anchor, 1)
          anchor = '''      <div className="space-y-3 pt-3 border-t border-line/60">\n        <StudioSectionHeader\n          title="3D 헤드 모델 (Face Proportions)"\n'''
          block = '''      <div className="space-y-3 pt-3 border-t border-line/60">\n        <StudioSectionHeader\n          title="해부학 비례"\n          description="몸통 깊이와 말단 크기를 독립 조절해 같은 등신에서도 실루엣과 질량감을 바꿉니다."\n        />\n        <div className="space-y-2">\n          {ANATOMY_SLIDERS.map(({ key, label, step }) => {\n            const [min, max] = STUDIO_MANNEQUIN_ANATOMY_PARAM_RANGES[key];\n            const value = params[key] ?? 1;\n            return (\n              <StudioSliderRow\n                key={key}\n                label={label}\n                min={min}\n                max={max}\n                step={step}\n                value={value}\n                onChange={(next) =>\n                  onParamsChange(clampStudioMannequinBodyParams({ ...params, [key]: next }))\n                }\n                readout={`${Math.round(value * 100)}%`}\n              />\n            );\n          })}\n        </div>\n      </div>\n\n'''
          assert text.count(anchor) == 1, 'panel anatomy section anchor changed'
          text = text.replace(anchor, block + anchor, 1)
          panel.write_text(text, encoding='utf-8')

          tests = Path('apps/web/src/domains/creator/scene-3d/studio-mannequin-model.test.ts')
          text = tests.read_text(encoding='utf-8')
          insert_before = '''  it("체인 길이는 관절 오프셋과 정합한다", () => {\n'''
          new_tests = '''  it("해부학 세부 파라미터가 신장을 바꾸지 않고 각 실루엣 축에 독립적으로 반영된다", () => {\n    const base = buildStudioMannequinSpec(params());\n    const tuned = buildStudioMannequinSpec(params({\n      torsoDepth: 1.3, waistWidth: 1.2, limbThickness: 1.25,\n      handScale: 1.2, footScale: 1.2, neckThickness: 1.2,\n    }));\n    expect(studioMannequinRestStature(tuned)).toBeCloseTo(base.heightM, 12);\n\n    const sphere = (spec: ReturnType<typeof buildStudioMannequinSpec>, jointId: string) =>\n      spec.primitives.find((p) => p.kind === "sphere" && p.jointId === jointId && p.center[1] !== 0);\n    const capsule = (spec: ReturnType<typeof buildStudioMannequinSpec>, jointId: string) =>\n      spec.primitives.find((p) => p.kind === "capsule" && p.jointId === jointId);\n    const baseChest = sphere(base, "chest");\n    const tunedChest = sphere(tuned, "chest");\n    expect(baseChest?.kind).toBe("sphere");\n    expect(tunedChest?.kind).toBe("sphere");\n    if (baseChest?.kind === "sphere" && tunedChest?.kind === "sphere") {\n      expect(tunedChest.scale?.[2]).toBeGreaterThan(baseChest.scale?.[2] ?? 0);\n    }\n    const baseSpine = capsule(base, "spine");\n    const tunedSpine = capsule(tuned, "spine");\n    if (baseSpine?.kind === "capsule" && tunedSpine?.kind === "capsule") {\n      expect(tunedSpine.radius).toBeGreaterThan(baseSpine.radius);\n    }\n    const baseArm = capsule(base, "leftUpperArm");\n    const tunedArm = capsule(tuned, "leftUpperArm");\n    if (baseArm?.kind === "capsule" && tunedArm?.kind === "capsule") {\n      expect(tunedArm.radius).toBeGreaterThan(baseArm.radius);\n    }\n    const baseDigits = base.primitives.filter((p) => p.kind === "capsule" && p.jointId === "leftHand");\n    const tunedDigits = tuned.primitives.filter((p) => p.kind === "capsule" && p.jointId === "leftHand");\n    expect(Math.abs(tunedDigits[0]!.to[1])).toBeGreaterThan(Math.abs(baseDigits[0]!.to[1]));\n    const baseFoot = sphere(base, "leftFoot");\n    const tunedFoot = sphere(tuned, "leftFoot");\n    if (baseFoot?.kind === "sphere" && tunedFoot?.kind === "sphere") {\n      expect(tunedFoot.radius).toBeGreaterThan(baseFoot.radius);\n    }\n    const baseNeck = capsule(base, "neck");\n    const tunedNeck = capsule(tuned, "neck");\n    if (baseNeck?.kind === "capsule" && tunedNeck?.kind === "capsule") {\n      expect(tunedNeck.radius).toBeGreaterThan(baseNeck.radius);\n    }\n  });\n\n'''
          assert text.count(insert_before) == 1, 'model test anchor changed'
          text = text.replace(insert_before, new_tests + insert_before, 1)
          tests.write_text(text, encoding='utf-8')
          PY
      - name: Validate mannequin anatomy slice
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run apps/web/src/domains/creator/scene-3d/studio-mannequin-model.test.ts
          pnpm exec tsc -p tsconfig.json --noEmit
          git diff --check
      - name: Commit product change and remove bootstrap
        shell: bash
        run: |
          git config user.name toonstudio-3d-ci
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/mannequin-anatomy-v1-bootstrap.yml
          git add apps/web/src/domains/creator/scene-3d/studio-mannequin-model.ts \
                  apps/web/src/domains/creator/scene-3d/StudioMannequinPoserPanel.tsx \
                  apps/web/src/domains/creator/scene-3d/studio-mannequin-model.test.ts
          git diff --cached --check
          git commit -m 'feat(mannequin): add anatomical silhouette controls'
          git push origin HEAD:feat/mannequin-anatomy-v1-20260910
