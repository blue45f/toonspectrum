name: API container release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact main commit SHA to package
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: api-container-release-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      IMAGE_NAME: ghcr.io/blue45f/toonspectrum-core-api
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact main release identity
        shell: bash
        run: |
          set -euo pipefail
          SHA='${{ inputs.ref }}'
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$SHA"
          test -z "$(git status --porcelain)"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install and build verified API runtime
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prefer-offline
          pnpm --filter @webtoon-nest/api build
          test -s apps/api/dist/apps/api/src/main.js
          node --check apps/api/dist/apps/api/src/main.js

      - name: Assemble production-only image context
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release
          pnpm --filter @webtoon-nest/api deploy --legacy --prod .release/api-package
          mkdir -p .release/image/apps/api
          cp .release/api-package/package.json .release/image/apps/api/package.json
          cp -a .release/api-package/node_modules .release/image/apps/api/node_modules
          cp -a apps/api/dist .release/image/apps/api/dist
          cp -a apps/api/data .release/image/apps/api/data
          cat > .release/image/Dockerfile <<'DOCKERFILE'
          FROM node:24.16.0-bookworm-slim
          ENV NODE_ENV=production
          WORKDIR /app
          COPY --chown=node:node . /app
          USER node
          EXPOSE 3000
          CMD ["node", "apps/api/dist/apps/api/src/main.js"]
          DOCKERFILE
          printf '%s\n' "${{ inputs.ref }}" > .release/image/RELEASE_SHA
          test -s .release/image/apps/api/dist/apps/api/src/main.js

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable API image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .release/image
          file: .release/image/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/blue45f/toonspectrum
            org.opencontainers.image.revision=${{ inputs.ref }}
            org.opencontainers.image.title=ToonSpectrum Core API
          cache-from: type=gha,scope=toonspectrum-core-api
          cache-to: type=gha,mode=max,scope=toonspectrum-core-api

      - name: Record immutable image identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/api-container-release
          {
            echo "sha=${{ inputs.ref }}"
            echo "image=${IMAGE_NAME}:${{ inputs.ref }}"
            echo "digest=${{ steps.image.outputs.digest }}"
          } | tee artifacts/api-container-release/image.txt

      - uses: actions/upload-artifact@v6
        with:
          name: api-container-release-${{ inputs.ref }}
          path: artifacts/api-container-release/image.txt
          if-no-files-found: error
          retention-days: 7
