name: CodeQL remediation audit

on:
  push:
    branches:
      - security/code-scanning-remediation-20260908
    paths:
      - '.github/workflows/codeql-remediation-audit.yml'
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/core/**'
      - 'packages/studio-engine-registry/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-remediation-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript remediation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript/remediation
          upload: true
          wait-for-processing: true
