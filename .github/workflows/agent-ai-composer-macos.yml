name: Apply and validate Studio AI comic composer

'on':
  push:
    branches:
      - feat/studio-ai-comic-composer-20260909
    paths:
      - .github/workflows/agent-ai-composer-macos.yml

permissions:
  contents: write

concurrency:
  group: agent-ai-composer-integration
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: "${{ github.actor != 'github-actions[bot]' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      HUSKY: "0"
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/studio-ai-comic-composer-20260909
          fetch-depth: 1

      - name: Apply guarded integration patch
        run: |
          set -euo pipefail
          cat scripts/agent-ai-composer-patch.part-{01,02,03,04} > /tmp/agent-apply-ai-composer.py
          python3 -m py_compile /tmp/agent-apply-ai-composer.py
          python3 /tmp/agent-apply-ai-composer.py
          git diff --check

      - name: Verify production-loop invariants
        run: |
          set -euo pipefail
          grep -Fq 'createStudioAiComicComposerHandoff(plan)' apps/web/src/domains/creator/ai/StudioAiToolPopoverBody.tsx
          grep -Fq 'subscribeStudioAiComicComposerOpenRequest' apps/web/src/domains/creator/StudioThreeDPreviewPanelStack.tsx
          grep -Fq 'onImportScenarioProductionPlan' apps/web/src/domains/creator/StudioCuttoonEditorHost.tsx
          grep -Fq 'planStudioScenarioImageGeneration(snapshot.items, request)' apps/web/src/domains/creator/ai/studio-scenario-image-generation.ts
          grep -Fq '<StudioScenarioCandidateDesk' apps/web/src/domains/creator/StudioScenarioAutoLayoutPanel.tsx
          grep -Fq 'approvedImageCandidateId' apps/web/src/domains/creator/studio-scenario-layout.ts

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run AI composer regression tests
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/ai/studio-ai-comic-composer-handoff.test.ts
          apps/web/src/domains/creator/ai/studio-ai-comic-composer-intent.test.ts
          apps/web/src/domains/creator/ai/studio-scenario-candidate-workflow.test.ts
          apps/web/src/domains/creator/StudioScenarioCandidateDesk.test.tsx
          apps/web/src/domains/creator/ai/studio-scenario-image-generation.test.ts
          apps/web/src/domains/creator/StudioScenarioAutoLayoutPanel.test.tsx
          apps/web/src/domains/creator/ai/StudioAiEpisodeProductionModal.test.tsx
          apps/web/src/domains/creator/ai/StudioAiEpisodeProductionGateway.test.tsx
          apps/web/src/domains/creator/ai/StudioAiToolPopoverBody.production.test.ts

      - name: Lint workspace
        run: pnpm run lint

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Build production workspace
        run: pnpm run build

      - name: Commit verified integration and remove temporary tooling
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/agent-ai-composer-arm.yml \
            .github/workflows/agent-ai-composer-diagnostic.yml \
            .github/workflows/agent-ai-composer-macos.yml \
            scripts/agent-ai-composer-patch.part-01 \
            scripts/agent-ai-composer-patch.part-02 \
            scripts/agent-ai-composer-patch.part-03 \
            scripts/agent-ai-composer-patch.part-04
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(studio): connect verified AI comic composer"
          git push origin HEAD:feat/studio-ai-comic-composer-20260909
