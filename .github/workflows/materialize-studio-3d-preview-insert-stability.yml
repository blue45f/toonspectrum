name: Materialize Studio 3D preview and insert stability

on:
  push:
    branches: [fix/studio-3d-preview-insert-stability-20260910]
    paths: [.github/workflows/materialize-studio-3d-preview-insert-stability.yml]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-slim
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/studio-3d-preview-insert-stability-20260910
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Patch durable VRM previews and deterministic BG3D insertion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('apps/web/src/domains/creator/vrm/useStudioVrmPoserRuntimeD.ts')
          text = runtime.read_text(encoding='utf-8')
          old = '''          const isBundledStaticThumbnail = entry.source === "sample"\n            && entry.thumbnail?.startsWith("/vrm/thumbnails/");\n          if (\n            entry.source === "memory" ||\n            entry.id === activeModelIdRef.current ||\n            entry.thumbnail === null ||\n            isBundledStaticThumbnail\n          ) return entry;\n'''
          new = '''          // Bundled sample thumbnails are immutable same-origin product assets. Never evict\n          // them when the uploaded-thumbnail hydration window moves; only uploaded data URLs\n          // participate in the bounded thumbnail window.\n          if (\n            entry.source === "sample" ||\n            entry.source === "memory" ||\n            entry.id === activeModelIdRef.current ||\n            entry.thumbnail === null\n          ) return entry;\n'''
          if text.count(old) != 1:
              raise SystemExit(f'VRM thumbnail eviction anchor changed: {text.count(old)}')
          runtime.write_text(text.replace(old, new, 1), encoding='utf-8')

          panel = Path('apps/web/src/domains/creator/vrm/StudioVrmCharacterLibraryPanel.tsx')
          text = panel.read_text(encoding='utf-8')
          old = '''                  <img\n                    alt=""\n                    className="h-full w-full object-contain"\n                    src={entry.thumbnail ?? buildFallbackVrmLibraryThumbnail(entry.name, entry.id)}\n'''
          new = '''                  <img\n                    alt=""\n                    decoding="async"\n                    loading="eager"\n                    className="h-full w-full object-contain"\n                    src={entry.thumbnail ?? buildFallbackVrmLibraryThumbnail(entry.name, entry.id)}\n'''
          if text.count(old) != 1:
              raise SystemExit(f'VRM card image anchor changed: {text.count(old)}')
          panel.write_text(text.replace(old, new, 1), encoding='utf-8')

          insert_host = Path('apps/web/src/domains/creator/bg3d/studio-bg3d-editor-insert-host.ts')
          text = insert_host.read_text(encoding='utf-8')
          old = '''      // Clamp DPR to 1..3; the size resolver enforces pixel and 4096-edge budgets.\n      const captureDensity = Math.min(3, Math.max(1, globalThis.devicePixelRatio || 1));\n      const captureSize = resolveStudioBg3dLtCaptureSize({\n        sourceWidth: sourceSize.width,\n        sourceHeight: sourceSize.height,\n        aspectRatio: captureFrame.aspectRatio,\n        requestedHeight: Math.min(\n          4096,\n          Math.round(adapted.document.output.exportHeight * captureDensity)\n        ),\n        maxPixels: Math.min(deviceQuality.maxRenderPixels, STUDIO_BG3D_LT_RENDER_MAX_PIXELS),\n      });\n'''
          new = '''      // Canvas insertion is a persisted output-pixel contract, not a display-density\n      // contract. Keep identical scenes deterministic across monitors and retain enough\n      // source pixels for webtoon composition before the device pixel budget clamps it.\n      const requestedCaptureHeight = Math.min(\n        4096,\n        Math.max(2160, Math.round(adapted.document.output.exportHeight)),\n      );\n      const captureSize = resolveStudioBg3dLtCaptureSize({\n        sourceWidth: sourceSize.width,\n        sourceHeight: sourceSize.height,\n        aspectRatio: captureFrame.aspectRatio,\n        requestedHeight: requestedCaptureHeight,\n        maxPixels: Math.min(deviceQuality.maxRenderPixels, STUDIO_BG3D_LT_RENDER_MAX_PIXELS),\n      });\n'''
          if text.count(old) != 1:
              raise SystemExit(f'BG3D insertion resolution anchor changed: {text.count(old)}')
          insert_host.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          cat > apps/web/src/domains/creator/vrm/studio-vrm-bundled-thumbnail-stability.test.ts <<'EOF'
          import { readFileSync } from "node:fs";
          import { describe, expect, it } from "vitest";

          import { SAMPLE_VRM_ENTRIES } from "./vrm-library";

          const runtime = readFileSync(new URL("./useStudioVrmPoserRuntimeD.ts", import.meta.url), "utf8");
          const panel = readFileSync(new URL("./StudioVrmCharacterLibraryPanel.tsx", import.meta.url), "utf8");

          describe("bundled VRM thumbnail stability", () => {
            it("ships real same-origin thumbnails for every bundled picker entry", () => {
              expect(SAMPLE_VRM_ENTRIES.length).toBeGreaterThan(0);
              for (const entry of SAMPLE_VRM_ENTRIES) {
                expect(entry.thumbnail).toMatch(/^\/assets\/3d\/characters\/thumbnails\//u);
              }
            });

            it("never evicts bundled cards when the uploaded thumbnail window moves", () => {
              const start = runtime.indexOf("const handleVisibleVrmThumbnailWindow");
              const end = runtime.indexOf("useEffect(() => {", start);
              const handler = runtime.slice(start, end);
              expect(start).toBeGreaterThanOrEqual(0);
              expect(handler).toContain('entry.source === "sample"');
              expect(handler).not.toContain('startsWith("/vrm/thumbnails/")');
              expect(handler).toContain('return { ...entry, thumbnail: null }');
            });

            it("keeps a stable preview box while decoding product card art", () => {
              expect(panel).toContain('decoding="async"');
              expect(panel).toContain('loading="eager"');
              expect(panel).toContain('entry.thumbnail ?? buildFallbackVrmLibraryThumbnail');
            });
          });
          EOF

          cat > apps/web/src/domains/creator/bg3d/studio-bg3d-insert-resolution-boundary.test.ts <<'EOF'
          import { readFileSync } from "node:fs";
          import { describe, expect, it } from "vitest";

          const source = readFileSync(
            new URL("./studio-bg3d-editor-insert-host.ts", import.meta.url),
            "utf8",
          );

          describe("BG3D canvas insert resolution boundary", () => {
            it("uses deterministic production pixels instead of monitor DPR", () => {
              const start = source.indexOf("async function handleInsert()");
              const end = source.indexOf("h.handleInsert = handleInsert;", start);
              const handler = source.slice(start, end);

              expect(start).toBeGreaterThanOrEqual(0);
              expect(handler).not.toContain("devicePixelRatio");
              expect(handler).not.toContain("captureDensity");
              expect(handler).toContain("Math.max(2160, Math.round(adapted.document.output.exportHeight))");
              expect(handler).toContain("requestedHeight: requestedCaptureHeight");
              expect(handler).toContain("STUDIO_BG3D_LT_RENDER_MAX_PIXELS");
            });
          });
          EOF

      - name: Validate focused product contracts
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run \
            apps/web/src/domains/creator/vrm/studio-vrm-bundled-thumbnail-stability.test.ts \
            apps/web/src/domains/creator/vrm/StudioVrmCharacterLibraryPanel.test.tsx \
            apps/web/src/domains/creator/bg3d/studio-bg3d-insert-resolution-boundary.test.ts
          pnpm exec eslint --max-warnings=0 \
            apps/web/src/domains/creator/vrm/useStudioVrmPoserRuntimeD.ts \
            apps/web/src/domains/creator/vrm/StudioVrmCharacterLibraryPanel.tsx \
            apps/web/src/domains/creator/vrm/studio-vrm-bundled-thumbnail-stability.test.ts \
            apps/web/src/domains/creator/bg3d/studio-bg3d-editor-insert-host.ts \
            apps/web/src/domains/creator/bg3d/studio-bg3d-insert-resolution-boundary.test.ts
          git diff --check

      - name: Commit product code and remove one-shot workflow
        shell: bash
        run: |
          git config user.name toonstudio-3d-ci
          git config user.email actions@users.noreply.github.com
          rm -f .github/workflows/materialize-studio-3d-preview-insert-stability.yml
          git add -A
          git diff --cached --check
          HUSKY=0 git commit -m 'fix(3d): stabilize previews and canvas insertion quality'
          git push origin HEAD:fix/studio-3d-preview-insert-stability-20260910
