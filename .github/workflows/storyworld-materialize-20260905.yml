name: Materialize reviewed Storyworld patch

on:
  push:
    branches: [feat/storyworld-causality-lab-20260905]
    paths:
      - .github/workflows/storyworld-materialize-20260905.yml
      - .github/storyworld-transport-20260905/**

permissions:
  contents: write

concurrency:
  group: storyworld-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'blue45f/toonspectrum'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Verify the immutable patch and apply atomically
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import hashlib
          import lzma
          import pathlib
          import subprocess
          import tempfile
          import shutil

          transport = pathlib.Path('.github/storyworld-transport-20260905')
          chunks = [transport / f'part-{i:03d}' for i in range(6)]
          compressed = b''.join(path.read_bytes() for path in chunks)
          patch = lzma.decompress(compressed, memlimit=256 * 1024 * 1024)
          expected = '863bc8cfe7c50d94eef43fc5d13e42c6ef096b7e77f958e9ba912644d03527dd'
          assert len(patch) == 215215, 'Unexpected patch size'
          assert hashlib.sha256(patch).hexdigest() == expected, 'Patch checksum mismatch'
          with tempfile.NamedTemporaryFile(suffix='.patch') as handle:
              handle.write(patch)
              handle.flush()
              subprocess.run(['git', 'apply', '--check', '--whitespace=error', handle.name], check=True)
              subprocess.run(['git', 'apply', '--whitespace=error', handle.name], check=True)
          shutil.rmtree(transport)
          pathlib.Path('.github/workflows/storyworld-materialize-20260905.yml').unlink()
          print('Applied the reviewed patch. All temporary transport files removed.')
          PY
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(studio): apply reviewed Storyworld causality lab patch'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          printf 'Product commit: `%s`\n\nPatch SHA-256: `863bc8cfe7c50d94eef43fc5d13e42c6ef096b7e77f958e9ba912644d03527dd`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
