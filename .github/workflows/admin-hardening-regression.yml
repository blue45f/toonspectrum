name: Admin hardening regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/domains/admin/**'
      - 'apps/api/src/modules/admin/**'
      - 'scripts/seed/admin-qa*'
      - 'scripts/verify-admin-qa-live.mjs'
      - '.github/workflows/admin-hardening-regression.yml'
  push:
    branches: [main]
    paths:
      - 'src/domains/admin/**'
      - 'apps/api/src/modules/admin/**'
      - 'scripts/seed/admin-qa*'
      - 'scripts/verify-admin-qa-live.mjs'
      - '.github/workflows/admin-hardening-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  admin-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: webdex
          POSTGRES_PASSWORD: webdex
          POSTGRES_DB: toonspectrum_admin_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U webdex -d toonspectrum_admin_qa'
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://webdex:webdex@127.0.0.1:5432/toonspectrum_admin_qa
      TEST_DATABASE_URL: postgresql://webdex:webdex@127.0.0.1:5432/toonspectrum_admin_qa
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare evidence directory
        run: mkdir -p test-results/admin-hardening
      - name: Strict admin source lint
        run: >-
          pnpm exec eslint --max-warnings=0
          src/domains/admin apps/api/src/modules/admin
          scripts/seed/admin-qa-seed.mjs scripts/verify-admin-qa-live.mjs
      - name: Full frontend and API type checks
        run: pnpm run typecheck
      - name: Bootstrap disposable loopback QA database
        env:
          MIGRATION_DATABASE_URL: postgresql://webdex:webdex@127.0.0.1:5432/toonspectrum_admin_qa
        run: |
          set -euo pipefail
          export BOOTSTRAP_RUNTIME_DATABASE_PASSWORD="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')"
          node scripts/bootstrap-empty-production-database.mjs --execute --allow-loopback \
            --runtime-database-role webdex_runtime --release-sha "$GITHUB_SHA" \
            --confirmation BOOTSTRAP-EMPTY-TOONSPECTRUM-DATABASE
      - name: Actual repository admin regression suite
        run: >-
          pnpm exec vitest run src/domains/admin apps/api/src/modules/admin
          lib/__tests__/admin-emails.test.ts lib/__tests__/admin-security.test.ts
          --maxWorkers=2 --reporter=default --reporter=json
          --outputFile=test-results/admin-hardening/vitest.json
      - name: Verify isolated accounts and real session APIs
        env:
          NODE_ENV: test
          TOONSPECTRUM_ADMIN_QA_SEED: '1'
        run: node --import tsx scripts/verify-admin-qa-live.mjs
      - name: Production build and CSP
        run: pnpm run build
      - name: Reject skipped or empty admin test runs
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('test-results/admin-hardening/vitest.json', 'utf8'));
          if (!report.success || report.numFailedTests || report.numPendingTests || report.numTodoTests || report.numTotalTests < 70) {
            throw new Error('Admin regression evidence must be passing, nonempty and unskipped.');
          }
          const summary = { commit: process.env.GITHUB_SHA, passed: report.numPassedTests, failed: report.numFailedTests, skipped: report.numPendingTests };
          writeFileSync('test-results/admin-hardening/summary.json', JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-hardening-evidence-${{ github.run_id }}
          path: test-results/admin-hardening/
          if-no-files-found: warn
