name: WebGPU binning reserved identifier fix

on:
  push:
    branches:
      - fix/webgpu-dab-binning-real-gpu-20260904
    paths:
      - ".github/workflows/webgpu-binning-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webgpu-binning-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/webgpu-dab-binning-real-gpu-20260904

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Replace WGSL reserved identifiers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/domains/creator/render/studio-webgpu-dab-tile-binning-compute.ts")
          source = path.read_text()
          start = source.index("const COUNT_WGSL")
          end = source.index("export const STUDIO_WEBGPU_DAB_TILE_BINNING_COMPUTE_WGSL")
          shaders = source[start:end]

          uniform_count = shaders.count("var<uniform> meta: Meta;")
          member_count = shaders.count("meta.")
          active_count = len(re.findall(r"\bactive\b", shaders))
          if uniform_count != 3 or member_count < 8 or active_count != 8:
              raise SystemExit(
                  f"unexpected shader shape: uniforms={uniform_count}, members={member_count}, active={active_count}"
              )

          shaders = shaders.replace("var<uniform> meta: Meta;", "var<uniform> config: Meta;")
          shaders = shaders.replace("meta.", "config.")
          shaders = re.sub(r"\bactive\b", "level_count", shaders)
          if "var<uniform> meta: Meta;" in shaders or "meta." in shaders or re.search(r"\bactive\b", shaders):
              raise SystemExit("reserved identifier remained in WGSL")

          patched = source[:start] + shaders + source[end:]
          marker = " * WGSL identifiers deliberately avoid evolving reserved words (`meta`, `active`).\n"
          header = "/**\n * Bounded exact WebGPU count / scan / stable-scatter candidate.\n"
          if marker not in patched:
              if header not in patched:
                  raise SystemExit("source header not found")
              patched = patched.replace(header, header + marker, 1)
          path.write_text(patched)

          test_path = Path("src/domains/creator/render/studio-webgpu-dab-tile-binning-compute.test.ts")
          test = test_path.read_text()
          old_expectation = '      "tile_offsets[meta.tile_count] = meta.reference_count",'
          new_expectation = '      "tile_offsets[config.tile_count] = config.reference_count",'
          if test.count(old_expectation) != 1:
              raise SystemExit("legacy scan expectation not found exactly once")
          test = test.replace(old_expectation, new_expectation, 1)
          assertion_anchor = '''    expect(STUDIO_WEBGPU_DAB_TILE_BINNING_COMPUTE_WGSL.scatter).not.toContain(
              "atomicAdd",
            );'''
          assertion = '''    expect(STUDIO_WEBGPU_DAB_TILE_BINNING_COMPUTE_WGSL.scatter).not.toContain(
              "atomicAdd",
            );
            for (const shader of Object.values(STUDIO_WEBGPU_DAB_TILE_BINNING_COMPUTE_WGSL)) {
              expect(shader).not.toMatch(/\\b(meta|active)\\b/u);
            }'''
          if test.count(assertion_anchor) != 1:
              raise SystemExit("shader assertion anchor not found exactly once")
          test_path.write_text(test.replace(assertion_anchor, assertion, 1))
          PY

      - name: Focused unit tests
        run: >-
          pnpm exec vitest run
          src/domains/creator/render/studio-webgpu-dab-tile-binning.test.ts
          src/domains/creator/render/studio-webgpu-dab-tile-binning-compute.test.ts
          src/domains/creator/render/studio-webgpu-sparse-brush-compute-runtime.test.ts

      - name: Focused lint
        run: >-
          pnpm exec eslint --max-warnings=0
          src/domains/creator/render/studio-webgpu-dab-tile-binning-compute.ts
          src/domains/creator/render/studio-webgpu-dab-tile-binning-compute.test.ts
          src/domains/creator/render/studio-webgpu-sparse-brush-compute-runtime.ts
          src/domains/creator/render/studio-webgpu-sparse-brush-compute-runtime.test.ts

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Install Chromium runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Exact WebGPU compute binning proof
        env:
          TOONSPECTRUM_WEBGPU_HEADED: "1"
        run: >-
          xvfb-run -a --server-args="-screen 0 1920x1200x24"
          pnpm exec node scripts/verify-studio-webgpu-dab-tile-binning-compute.mjs

      - name: Existing professional bristle and impasto proof
        env:
          TOONSPECTRUM_WEBGPU_HEADED: "1"
        run: >-
          xvfb-run -a --server-args="-screen 0 1920x1200x24"
          pnpm run verify:studio-professional-bristle-webgpu

      - name: Commit verified runtime fix and remove one-shot workflow
        run: |
          rm .github/workflows/webgpu-binning-diagnostic.yml
          git config user.name "toonstudio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/domains/creator/render/studio-webgpu-dab-tile-binning-compute.ts \
            src/domains/creator/render/studio-webgpu-dab-tile-binning-compute.test.ts \
            .github/workflows/webgpu-binning-diagnostic.yml
          git commit -m "fix(webgpu): avoid reserved WGSL identifiers in tile binning"
          git push origin HEAD:fix/webgpu-dab-binning-real-gpu-20260904
