name: WebGPU binning diagnostic

on:
  push:
    branches:
      - fix/webgpu-dab-binning-real-gpu-20260904
    paths:
      - ".github/workflows/webgpu-binning-diagnostic.yml"
      - "src/domains/creator/render/studio-webgpu-dab-tile-binning-compute.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webgpu-binning-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Instrument scoped errors in the runner checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path("src/domains/creator/render/studio-webgpu-dab-tile-binning-compute.ts")
          source = runtime.read_text()
          scope_marker = '      if (errors.some((error) => error !== null)) {'
          if scope_marker not in source:
              raise SystemExit("scoped-error marker not found")
          source = source.replace(
              scope_marker,
              '      console.error("[binning-compute-scoped]", JSON.stringify(errors.map((error) => error?.message ?? null)));\n'
              + scope_marker,
              1,
          )
          catch_marker = '    } catch {\n      while (errorScopeDepth > 0) {'
          if catch_marker not in source:
              raise SystemExit("catch marker not found")
          source = source.replace(
              catch_marker,
              '    } catch (error) {\n'
              '      console.error("[binning-compute-exception]", error instanceof Error ? error.stack ?? error.message : String(error));\n'
              '      while (errorScopeDepth > 0) {',
              1,
          )
          runtime.write_text(source)

          verifier = Path("scripts/verify-studio-webgpu-dab-tile-binning-compute.mjs")
          source = verifier.read_text()
          console_marker = '    page.on("console", (message) => {\n'
          if console_marker not in source:
              raise SystemExit("verifier console marker not found")
          source = source.replace(
              console_marker,
              console_marker + '      console.log(`[browser-console:${message.type()}] ${message.text()}`);\n',
              1,
          )
          verifier.write_text(source)
          PY
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run exact compute verifier with diagnostics
        env:
          TOONSPECTRUM_WEBGPU_HEADED: "1"
        run: >-
          xvfb-run -a --server-args="-screen 0 1920x1200x24"
          pnpm exec node scripts/verify-studio-webgpu-dab-tile-binning-compute.mjs
