name: Temporary Dependabot audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: temporary-dependabot-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Audit all pnpm advisories
        shell: bash
        run: |
          set +e
          pnpm run audit:security
          status=$?
          echo "AUDIT_EXIT_CODE=$status"
          exit 0
