name: Temporary Dependabot audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Audit all pnpm advisories
        shell: bash
        run: |
          set +e
          pnpm run audit:security
          status=$?
          echo "AUDIT_EXIT_CODE=$status"
          exit 0
