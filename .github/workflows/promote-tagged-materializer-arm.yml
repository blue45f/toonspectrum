name: Promote tagged materializer to ARM

on:
  push:
    branches: [fix/real-core-and-main-only-20260910]
    paths: [.github/workflows/promote-tagged-materializer-arm.yml]

permissions:
  contents: write

concurrency:
  group: promote-tagged-materializer-arm-20260911
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/real-core-and-main-only-20260910
          fetch-depth: 0
          persist-credentials: true
      - name: Switch materializer runner and remove promoter
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/materialize-remaining-tagged-product-work.yml
          test -f "$workflow"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/materialize-remaining-tagged-product-work.yml')
          s = p.read_text(encoding='utf-8')
          old = '    runs-on: ubuntu-24.04\n'
          new = '    runs-on: ubuntu-24.04-arm\n'
          if new not in s:
              if s.count(old) != 1:
                  raise SystemExit(f'unexpected materializer runner count: {s.count(old)}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/promote-tagged-materializer-arm.yml
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m "ci(recovery): run tagged materializer on ARM"
          git push --no-verify origin HEAD:fix/real-core-and-main-only-20260910
