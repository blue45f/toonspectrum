name: Code scanning remediation gate

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write
  security-events: read

concurrency:
  group: code-scanning-remediation-gate
  cancel-in-progress: false

jobs:
  verify-and-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: codex/code-scanning-remediation-20260908
    steps:
      - name: Wait for the autofix pass to finish
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            active="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/code-scanning-autofix.yml/runs?branch=${TARGET_BRANCH}&per_page=20" --jq '[.workflow_runs[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)"
            if [[ "$active" == "0" ]]; then
              exit 0
            fi
            echo "Waiting for ${active} active autofix run(s), attempt ${attempt}/120"
            sleep 30
          done
          echo "Autofix workflow did not finish within the gate timeout." >&2
          exit 1

      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Rebase remediation work onto the latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
          fi

      - name: Remove temporary remediation automation
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/code-scanning-inventory.yml \
            .github/workflows/code-scanning-context.yml \
            .github/workflows/code-scanning-autofix.yml \
            .github/workflows/code-scanning-remediation-gate.yml
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git add -A
            git commit -m "chore(security): remove temporary remediation automation"
          fi
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Initialize CodeQL without uploading results
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Analyze remediation tree locally
        uses: github/codeql-action/analyze@v3
        with:
          upload: false
          output: /tmp/codeql-remediation-results
          category: /language:javascript-typescript

      - name: Require zero CodeQL security findings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          import os
          import sys

          sarif_files = glob.glob("/tmp/codeql-remediation-results/**/*.sarif", recursive=True)
          if not sarif_files:
              raise SystemExit("CodeQL did not produce a SARIF file")

          findings = []
          for path in sarif_files:
              with open(path, encoding="utf-8") as source:
                  sarif = json.load(source)
              for run in sarif.get("runs", []):
                  rules = {}
                  driver = ((run.get("tool") or {}).get("driver") or {})
                  for rule in driver.get("rules", []):
                      rules[rule.get("id")] = rule
                  for result in run.get("results", []):
                      rule_id = result.get("ruleId")
                      rule = rules.get(rule_id, {})
                      properties = rule.get("properties") or {}
                      tags = properties.get("tags") or []
                      precision = properties.get("precision")
                      security_severity = properties.get("security-severity")
                      is_security = security_severity is not None or any(
                          str(tag).startswith("security/") or str(tag).startswith("external/cwe/")
                          for tag in tags
                      )
                      if not is_security:
                          continue
                      locations = result.get("locations") or []
                      physical = (((locations[0] if locations else {}).get("physicalLocation") or {}))
                      artifact = ((physical.get("artifactLocation") or {}).get("uri"))
                      region = physical.get("region") or {}
                      findings.append({
                          "rule": rule_id,
                          "level": result.get("level"),
                          "securitySeverity": security_severity,
                          "precision": precision,
                          "path": artifact,
                          "line": region.get("startLine"),
                          "message": ((result.get("message") or {}).get("text")),
                      })

          print(json.dumps(findings, ensure_ascii=False, indent=2))
          with open("/tmp/codeql-security-findings.json", "w", encoding="utf-8") as output:
              json.dump(findings, output, ensure_ascii=False, indent=2)
          if findings:
              print(f"Found {len(findings)} CodeQL security finding(s). Refusing to merge.", file=sys.stderr)
              raise SystemExit(1)
          print("CodeQL security findings: 0")
          PY

      - name: Create or update the remediation pull request
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$TARGET_BRANCH" \
              --title "fix(security): resolve all open CodeQL findings" \
              --body $'## Summary\n\n- resolves the complete open CodeQL inventory captured on 2026-09-08\n- applies GitHub code-scanning autofixes and manual hardening where needed\n- validates the final tree with a local CodeQL security gate\n- removes temporary remediation workflows before merge\n\n## Validation\n\n- CodeQL JavaScript/TypeScript security findings: **0**\n- repository branch protection and required `core` check remain enforced'
            pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --base main --state open --json number --jq '.[0].number')"
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Enable squash auto-merge after required checks
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "${{ steps.pr.outputs.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --auto \
            --delete-branch
