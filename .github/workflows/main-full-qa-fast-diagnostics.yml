name: Main full QA · isolated diagnostics

# `core` and domain workflows own pull-request gating. This intentionally broad diagnostic
# matrix runs after merge (and on demand) so it can find cross-domain drift without occupying
# dozens of PR runners or duplicating type/build work before every merge.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-full-qa-fast-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CI: "1"
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  static-gates:
    name: Static · ${{ matrix.gate }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: security
            command: pnpm run audit:security
          - gate: architecture-policy
            command: pnpm run validate:architecture && pnpm run verify:csp && pnpm run verify:toolchain-coverage
          - gate: lint-zero-warning
            command: pnpm run lint:strict
          - gate: typecheck-all
            command: pnpm run typecheck && pnpm run typecheck:cloudflare-realtime
          - gate: production-workspace-build
            command: pnpm run build && pnpm run check:studio-bundle && pnpm run build:all && pnpm run verify:api-serverless-build
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run isolated static gate
        run: ${{ matrix.command }}

  regression-tests:
    name: Regression · ${{ matrix.test }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test:
          - apps/web/src/domains/creator/ai/StudioStrokeProposalReviewPanel.test.tsx
          - apps/web/src/domains/creator/ai/studio-3d-generation-client.test.ts
          - apps/web/src/domains/creator/filter/studio-adjustment-effect-graph.test.ts
          - apps/web/src/domains/creator/layer/studio-layer-effects-graph-adapter.test.ts
          - apps/web/src/domains/creator/studio-large-epics-product-wiring.test.ts
          - apps/web/src/domains/creator/studio-soft-proofing.test.ts
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run one repaired contract test
        run: pnpm exec vitest run "${{ matrix.test }}"

  studio-core-tests:
    name: Studio tests · ${{ matrix.gate }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: creator-domain
            command: pnpm exec vitest run apps/web/src/domains/creator --testTimeout=120000
          - gate: serial-performance
            command: pnpm run test:perf
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run Studio test gate
        run: ${{ matrix.command }}

  engine-core:
    name: Engine · ${{ matrix.gate }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: engine
            command: pnpm run verify:studio-engine
            browser: false
            production_bundle: false
          - gate: brushes
            command: pnpm run verify:studio-brushes
            browser: true
            production_bundle: true
          - gate: brush-media
            command: pnpm run verify:studio-brush-media
            browser: true
            production_bundle: true
          - gate: brush-planner
            command: pnpm run verify:studio-brush-planner-quality
            browser: false
            production_bundle: false
          - gate: engine-selection
            command: pnpm run verify:studio-brush-engine-selection
            browser: false
            production_bundle: false
          - gate: native-raster
            command: pnpm run verify:studio-native-raster-tools
            browser: true
            production_bundle: true
          - gate: gpu-filters
            command: pnpm run verify:studio-gpu-filters
            browser: true
            production_bundle: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for browser-backed engine gates
        if: ${{ matrix.browser }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Build exact production Studio bundle for browser-backed gates
        if: ${{ matrix.production_bundle }}
        run: pnpm run build:bundle
      - name: Run one engine option gate
        run: ${{ matrix.command }}

  engine-extended:
    name: Engine extended contracts
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for natural-media and integration probes
        run: pnpm exec playwright install --with-deps chromium
      - name: Hokusai, living ink and hybrid DCC
        run: |
          pnpm run verify:studio-hokusai-wasm
          pnpm run verify:studio-hokusai-natural-media-quality
          pnpm run verify:studio-hokusai-live-integration
          pnpm run verify:studio-living-ink-execution
          pnpm run verify:studio-living-ink-integration
          pnpm run verify:studio-hybrid-dcc-integration
      - name: 3D, AI, export and renderer contracts
        run: |
          pnpm run verify:studio-bg3d-physics
          pnpm run verify:studio-character-shaper
          pnpm run verify:studio-ai-quality
          pnpm run verify:studio-glb-export
          pnpm run verify:studio-vello-candidate
          pnpm run verify:studio-canvaskit-quality-worker
          pnpm run studio:toolchain:check

  studio-browser-core:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build exact production Studio bundle
        run: pnpm run build:bundle
      - name: In-app route matrix
        run: pnpm run verify:studio-inapp-browser
      - name: In-app feature sweep
        run: pnpm run verify:studio-inapp-feature-sweep
      - name: Studio launch and lifecycle
        run: pnpm run verify:studio-launch && pnpm run verify:studio-lifecycle
      - name: Filters, menus and mobile layout
        run: pnpm run verify:studio-filter-dialog && pnpm run verify:studio-menus && pnpm run verify:studio-mobile-top
      - name: Canvas, companion, inspector and icons
        run: pnpm run verify:studio-canvas-chrome && pnpm run verify:studio-canvas-surfaces && pnpm run verify:studio-companion && pnpm run verify:studio-inspector-walkthrough && pnpm run verify:studio-icons
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-full-qa-isolated-browser-${{ github.sha }}
          path: |
            artifacts/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
