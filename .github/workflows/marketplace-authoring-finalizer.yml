name: Finalize Creator Marketplace authoring overhaul

on:
  push:
    branches:
      - feat/marketplace-creator-pipeline-20260903
    paths:
      - ".github/workflows/marketplace-authoring-finalizer.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: marketplace-authoring-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=8192
      FEATURE_BRANCH: feat/marketplace-creator-pipeline-20260903
    steps:
      - name: Cancel obsolete branch workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for status in queued in_progress waiting pending requested; do
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${FEATURE_BRANCH}&status=${status}&per_page=100" \
              --jq '.workflow_runs[].id' 2>/dev/null || true
          done | sort -u > /tmp/marketplace-other-runs.txt
          while read -r run_id; do
            [[ -z "$run_id" || "$run_id" == "$GITHUB_RUN_ID" ]] && continue
            gh api -X POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 || true
          done < /tmp/marketplace-other-runs.txt

      - name: Checkout complete feature history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: feat/marketplace-creator-pipeline-20260903

      - name: Synchronize latest feature and main
        run: |
          set -euo pipefail
          git config user.name "toonstudio-marketplace-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin "$FEATURE_BRANCH" main
          git reset --hard "origin/$FEATURE_BRANCH"
          git merge --no-edit origin/main
          git rev-parse HEAD > /tmp/marketplace-verified-base-head.txt
          git rev-parse origin/main > /tmp/marketplace-main-head.txt

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Apply safety, lifecycle, package, and product integrations
        run: |
          set -euo pipefail
          node scripts/marketplace/normalize-authoring-safety-source.mjs
          node scripts/marketplace/normalize-package-builder.mjs
          node scripts/marketplace/harden-authoring-payload.mjs
          node scripts/marketplace/integrate-quality-validation.mjs
          node scripts/marketplace/harden-authoring-integration-idempotency.mjs
          node scripts/marketplace/integrate-creator-authoring.mjs
          node scripts/marketplace/integrate-authoring-detail-action.mjs
          node scripts/marketplace/integrate-brush-recipe-lab.mjs
          node scripts/marketplace/integrate-asset-quality-matrix.mjs
          node scripts/marketplace/integrate-source-package-builder.mjs
          node scripts/marketplace/integrate-package-recovery.mjs
          node scripts/marketplace/prepare-permanent-authoring-workflow.mjs
          git diff --check

      - name: Prove all integration scripts are idempotent
        run: |
          set -euo pipefail
          targets=(
            src/domains/market/pages/MarketPublishPage.tsx
            src/domains/market/components/MarketResourceDetailArticle.tsx
            src/domains/market/components/MarketplaceAuthoringWorkshop.tsx
            src/domains/market/components/MarketplaceAuthoringInstallAction.tsx
            src/domains/creator/StudioBrushStudio.tsx
            lib/creator-marketplace-authoring-workshop.ts
            lib/creator-marketplace-authoring-safety.ts
            lib/creator-marketplace-package-builder.ts
            .github/workflows/marketplace-authoring.yml
          )
          sha256sum "${targets[@]}" > /tmp/marketplace-first.sha
          node scripts/marketplace/normalize-authoring-safety-source.mjs
          node scripts/marketplace/normalize-package-builder.mjs
          node scripts/marketplace/harden-authoring-payload.mjs
          node scripts/marketplace/integrate-quality-validation.mjs
          node scripts/marketplace/integrate-creator-authoring.mjs
          node scripts/marketplace/integrate-authoring-detail-action.mjs
          node scripts/marketplace/integrate-brush-recipe-lab.mjs
          node scripts/marketplace/integrate-asset-quality-matrix.mjs
          node scripts/marketplace/integrate-source-package-builder.mjs
          node scripts/marketplace/integrate-package-recovery.mjs
          node scripts/marketplace/prepare-permanent-authoring-workflow.mjs
          sha256sum "${targets[@]}" > /tmp/marketplace-second.sha
          diff -u /tmp/marketplace-first.sha /tmp/marketplace-second.sha
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const checks = [
            ["src/domains/market/pages/MarketPublishPage.tsx", "<MarketplaceAuthoringWorkshop />"],
            ["src/domains/creator/StudioBrushStudio.tsx", "<MarketplaceBrushStudioBridge />"],
            ["src/domains/market/components/MarketResourceDetailArticle.tsx", "<MarketplaceAuthoringInstallAction record={record} />"],
            ["src/domains/market/components/MarketplaceAuthoringWorkshop.tsx", "<MarketplaceBrushRecipeAccelerator"],
            ["src/domains/market/components/MarketplaceAuthoringWorkshop.tsx", "<MarketplaceAssetQualityMatrix"],
          ];
          for (const [file, token] of checks) {
            const source = readFileSync(file, "utf8");
            const count = source.split(token).length - 1;
            if (count !== 1) throw new Error(`${file}: expected exactly one ${token}, found ${count}`);
          }
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run marketplace authoring and package contracts
        run: >-
          pnpm exec vitest run
          lib/creator-marketplace-authoring-safety.test.ts
          lib/creator-marketplace-authoring-workshop.test.ts
          lib/creator-marketplace-package-builder.test.ts
          lib/creator-marketplace-quality-validation.test.ts
          src/domains/market/components/MarketplaceAuthoringWorkshop.test.tsx
          src/domains/market/components/MarketplaceBrushRecipeAccelerator.test.tsx
          src/domains/market/components/MarketplaceAssetQualityMatrix.test.tsx
          --reporter=verbose

      - name: Run existing marketplace unit regressions
        run: pnpm exec vitest run src/domains/market --reporter=verbose

      - name: Type-check, lint, architecture, and production build
        run: |
          set -euo pipefail
          pnpm exec tsc -p tsconfig.json --noEmit
          pnpm run lint:quick
          if node -e 'const p=require("./package.json"); process.exit(p.scripts?.["validate:architecture"] ? 0 : 1)'; then
            pnpm run validate:architecture
          fi
          pnpm run build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run existing, authoring, mobile, and in-app browser flows
        run: >-
          xvfb-run -a --server-args="-screen 0 1920x1200x24"
          pnpm exec playwright test
          e2e/market.spec.ts
          e2e/marketplace-authoring-workshop.spec.ts
          e2e/marketplace-authoring-inapp.spec.ts
          --project=chromium
          --reporter=line,html

      - name: Create verification certificate and evidence bundle
        run: |
          set -euo pipefail
          mkdir -p marketplace-benchmark /tmp/marketplace-authoring-evidence
          verified_base="$(cat /tmp/marketplace-verified-base-head.txt)"
          main_head="$(cat /tmp/marketplace-main-head.txt)"
          working_digest="$(git diff --binary -- . ':!public/data' | sha256sum | awk '{print $1}')"
          cat > marketplace-benchmark/creator-authoring-verification.json <<JSON
          {
            "status": "passed",
            "featureBranch": "${FEATURE_BRANCH}",
            "verifiedBaseHead": "${verified_base}",
            "mainHead": "${main_head}",
            "verifiedWorkingTreeDigest": "${working_digest}",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflowRunAttempt": "${GITHUB_RUN_ATTEMPT}",
            "browserEngine": "Chromium",
            "profiles": [
              "desktop-1440",
              "mobile-390",
              "kakaotalk-android-360-emulated",
              "naver-android-412-emulated",
              "instagram-ios-390-emulated"
            ],
            "gates": [
              "integration-idempotency",
              "portable-payload-safety",
              "native-engine-program-round-trip",
              "source-package-build-and-recovery",
              "asset-quality-matrix",
              "marketplace-unit-regressions",
              "typescript",
              "lint-quick",
              "architecture-if-present",
              "production-build",
              "existing-market-e2e",
              "authoring-desktop-mobile-e2e",
              "chromium-inapp-e2e"
            ],
            "physicalDeviceVerified": false,
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          cp marketplace-benchmark/creator-authoring-workshop-2026.md /tmp/marketplace-authoring-evidence/
          cp marketplace-benchmark/creator-authoring-verification.json /tmp/marketplace-authoring-evidence/
          cp /tmp/marketplace-first.sha /tmp/marketplace-authoring-evidence/integration-first.sha
          cp /tmp/marketplace-second.sha /tmp/marketplace-authoring-evidence/integration-second.sha
          find . -maxdepth 1 -name 'marketplace-*-report.json' -exec cp {} /tmp/marketplace-authoring-evidence/ \;
          [[ -d playwright-report ]] && cp -R playwright-report /tmp/marketplace-authoring-evidence/
          [[ -d test-results ]] && cp -R test-results /tmp/marketplace-authoring-evidence/

      - name: Remove one-time migration machinery and generated build changes
        run: |
          set -euo pipefail
          git restore --worktree -- public/data 2>/dev/null || true
          rm -f \
            .github/workflows/marketplace-source-snapshot.yml \
            .github/workflows/marketplace-authoring-integrator.yml \
            .github/workflows/marketplace-authoring-browser.yml \
            .github/workflows/marketplace-authoring-detail-integrator.yml \
            .github/workflows/marketplace-authoring-release-gate.yml \
            .github/workflows/marketplace-brush-recipe-integrator.yml \
            .github/workflows/marketplace-authoring-idempotency.yml \
            .github/workflows/marketplace-authoring-finalizer.yml \
            scripts/marketplace/integrate-creator-authoring.mjs \
            scripts/marketplace/integrate-authoring-detail-action.mjs \
            scripts/marketplace/integrate-brush-recipe-lab.mjs \
            scripts/marketplace/integrate-asset-quality-matrix.mjs \
            scripts/marketplace/harden-authoring-integration-idempotency.mjs \
            scripts/marketplace/harden-authoring-payload.mjs \
            scripts/marketplace/normalize-authoring-safety-source.mjs \
            scripts/marketplace/normalize-package-builder.mjs \
            scripts/marketplace/integrate-source-package-builder.mjs \
            scripts/marketplace/integrate-package-recovery.mjs \
            scripts/marketplace/integrate-quality-validation.mjs \
            scripts/marketplace/prepare-permanent-authoring-workflow.mjs \
            marketplace-authoring-integration-report.json \
            marketplace-authoring-detail-integration-report.json \
            marketplace-brush-recipe-integration-report.json \
            marketplace-authoring-idempotency-report.json \
            marketplace-authoring-payload-safety-report.json \
            marketplace-package-builder-normalization-report.json \
            marketplace-asset-quality-integration-report.json \
            marketplace-source-package-integration-report.json \
            marketplace-package-recovery-integration-report.json \
            marketplace-quality-validation-integration-report.json \
            marketplace-permanent-workflow-report.json \
            marketplace-authoring-release-gate.json
          git diff --check

      - name: Commit and push the certified product
        run: |
          set -euo pipefail
          git add -A
          git status --short
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          const changed = execFileSync("git", ["diff", "--cached", "--name-only", "-z"], { encoding: "utf8" })
            .split("\0")
            .filter(Boolean);
          const allowed = [
            /^\.github\/workflows\/marketplace-authoring\.yml$/,
            /^\.github\/workflows\/marketplace-(?:source-snapshot|authoring-integrator|authoring-browser|authoring-detail-integrator|authoring-release-gate|brush-recipe-integrator|authoring-idempotency|authoring-finalizer)\.yml$/,
            /^lib\/creator-marketplace-/,
            /^src\/domains\/market\//,
            /^src\/domains\/creator\/(?:MarketplaceBrush|StudioBrushStudio\.tsx)/,
            /^e2e\/marketplace-authoring-/,
            /^marketplace-benchmark\//,
            /^scripts\/marketplace\//,
            /^marketplace-.*\.json$/,
          ];
          const unexpected = changed.filter((path) => !allowed.some((pattern) => pattern.test(path)));
          if (unexpected.length > 0) {
            throw new Error(`Unexpected generated or unrelated changes: ${unexpected.join(", ")}`);
          }
          NODE
          git commit -m "feat(market): complete creator marketplace authoring lifecycle"
          remote_before="$(git ls-remote origin "refs/heads/${FEATURE_BRANCH}" | awk '{print $1}')"
          expected_remote="$(git rev-parse HEAD^1)"
          if [[ "$remote_before" != "$expected_remote" && "$remote_before" != "$(cat /tmp/marketplace-verified-base-head.txt)" ]]; then
            echo "Feature branch advanced after verification: ${remote_before}" >&2
            exit 1
          fi
          git push origin HEAD:"$FEATURE_BRANCH"

      - name: Upload final verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: marketplace-authoring-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/marketplace-authoring-evidence
          if-no-files-found: warn
          retention-days: 30
