name: Delete superseded WebGPU V2 benchmark branch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/delete-superseded-webgpu-v2-branch.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  delete:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Delete only the superseded PR 629 branch
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = "feat/webgpu-brush-engine-v2-benchmark-20260904";
            const expectedSha = "7daa9ec13b75f5604150547f104a8f2d45c7e452";

            const original = await github.request(
              "GET /repos/{owner}/{repo}/pulls/{pull_number}",
              { owner, repo, pull_number: 629 },
            );
            if (original.data.state !== "closed" || original.data.merged_at !== null) {
              core.setFailed("PR #629 is not in the expected closed/unmerged superseded state");
              return;
            }

            const replacement = await github.request(
              "GET /repos/{owner}/{repo}/pulls/{pull_number}",
              { owner, repo, pull_number: 651 },
            );
            if (
              replacement.data.state !== "open"
              || replacement.data.head.ref !== "feat/webgpu-brush-v2-final-20260904"
            ) {
              core.setFailed("Replacement PR #651 is not the expected active final branch");
              return;
            }

            let current;
            try {
              current = await github.request(
                "GET /repos/{owner}/{repo}/git/ref/{ref}",
                { owner, repo, ref: `heads/${branch}` },
              );
            } catch (error) {
              if (error.status === 404) {
                core.info(`${branch} is already absent`);
                return;
              }
              throw error;
            }

            if (current.data.object.sha !== expectedSha) {
              core.setFailed(
                `${branch} moved from ${expectedSha} to ${current.data.object.sha}; preserving it`,
              );
              return;
            }

            await github.request(
              "DELETE /repos/{owner}/{repo}/git/refs/{ref}",
              { owner, repo, ref: `heads/${branch}` },
            );
            core.info(`Deleted superseded branch ${branch} at ${expectedSha}`);
