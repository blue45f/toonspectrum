name: Character modeler asset materialization

on:
  push:
    branches:
      - feat/character-modeler-parity-20260909
    paths:
      - ".github/workflows/character-modeler-assets-20260909.yml"

permissions:
  contents: write

concurrency:
  group: character-modeler-assets-20260909
  cancel-in-progress: true

env:
  BLENDER_VERSION: 5.2.1
  VRM_ADDON_VERSION: 4.5.0
  VRM_ADDON_SHA256: e5e0f923a0bb11eb1320870b2db8091948dd5b63014510d839016a112e40a35a

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/character-modeler-parity-20260909
          fetch-depth: 0

      - name: Install headless graphics runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1 libgl1-mesa-dri libglx-mesa0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Blender binary cache
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: .cache/blender-${{ env.BLENDER_VERSION }}-linux-x64
          key: blender-${{ runner.os }}-x64-${{ env.BLENDER_VERSION }}

      - name: Download and verify Blender LTS
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .cache
          cd .cache
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          checksum="blender-${BLENDER_VERSION}.sha256"
          curl --fail --location --retry 5 --retry-all-errors --output "$archive" "https://download.blender.org/release/Blender5.2/$archive"
          curl --fail --location --retry 5 --retry-all-errors --output "$checksum" "https://download.blender.org/release/Blender5.2/$checksum"
          grep " $archive$" "$checksum" | sha256sum --check -
          tar -xf "$archive"
          mv "blender-${BLENDER_VERSION}-linux-x64" "blender-${BLENDER_VERSION}-linux-x64.ready"
          rm -f "$archive" "$checksum"
          mv "blender-${BLENDER_VERSION}-linux-x64.ready" "blender-${BLENDER_VERSION}-linux-x64"

      - name: Configure isolated Blender home
        run: |
          export HOME="$RUNNER_TEMP/toonstudio-blender-home"
          export BLENDER_USER_RESOURCES="$RUNNER_TEMP/toonstudio-blender-user"
          echo "HOME=$HOME" >> "$GITHUB_ENV"
          echo "BLENDER_USER_RESOURCES=$BLENDER_USER_RESOURCES" >> "$GITHUB_ENV"
          echo "BLENDER_PATH=$GITHUB_WORKSPACE/.cache/blender-${BLENDER_VERSION}-linux-x64/blender" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          mkdir -p "$HOME" "$BLENDER_USER_RESOURCES"

      - name: Install and verify pinned Blender extensions
        run: >-
          pnpm exec tsx scripts/setup-toonstudio-blender-pipeline.mts --
          --blender "$BLENDER_PATH"
          --cache-dir "$RUNNER_TEMP/toonstudio-blender-cache"
          --install-addons

      - name: Build audited Orion authored character
        run: >-
          "$BLENDER_PATH" --background
          --python scripts/blender/toonstudio_character_pipeline.py --
          --config config/blender/avatar-orion-production.json
          --project-root "$GITHUB_WORKSPACE"

      - name: Export production modular hair LODs
        run: >-
          "$BLENDER_PATH" --background --python-exit-code 1
          --python scripts/blender/export_character_modular_parts.py --
          --package-dir batch_generated/blender-character/avatar-orion-authored
          --output-dir apps/web/public/assets/3d/character-parts/orion
          --model-id orion
          --model-url /vrm/Avatar_Orion.vrm
          --model-sha256 32712a4aad9e83c0b2f86840ce54f1235fb9d133c5a6e7d6c5b653badc62fbb7
          --thumbnail /assets/3d/characters/thumbnails/orion.png
          --accepted-at 2026-09-09T00:00:00Z
          --public-prefix /assets/3d/character-parts/orion

      - name: Verify generated receipts
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile, stat } from "node:fs/promises";
          import path from "node:path";
          const root = path.resolve("apps/web/public/assets/3d/character-parts/orion");
          const manifest = JSON.parse(await readFile(path.join(root, "canonical-manifest.json"), "utf8"));
          const receipts = JSON.parse(await readFile(path.join(root, "part-receipts.json"), "utf8"));
          if (manifest.schemaVersion !== 2 || manifest.identity.assetId !== "orion") throw new Error("invalid canonical manifest identity");
          if (!Array.isArray(manifest.parts) || manifest.parts.length !== 1 || manifest.parts[0].slot !== "hair") throw new Error("expected one authored hair part");
          if (!manifest.parts[0].quality.accepted || manifest.parts[0].quality.minimumScore < 90) throw new Error("hair did not pass quality gate");
          if (!Array.isArray(receipts.lods) || receipts.lods.length !== 3) throw new Error("expected 3 LOD receipts");
          for (const receipt of receipts.lods) {
            const file = path.join(root, "hair", path.basename(receipt.sourceFile));
            const bytes = await readFile(file);
            const digest = createHash("sha256").update(bytes).digest("hex");
            if (digest !== receipt.sourceSha256 || (await stat(file)).size !== receipt.bytes) throw new Error(`receipt mismatch ${receipt.id}`);
          }
          console.log(JSON.stringify({ score: receipts.qualityScore, lods: receipts.lods.map((item) => [item.id, item.triangles, item.bytes]) }));
          NODE

      - name: Commit generated production assets to feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/assets/3d/character-parts/orion
          if git diff --cached --quiet; then
            echo "Generated assets already match the branch"
            exit 0
          fi
          git commit -m "feat(character): ship Blender-authored Orion modular hair"
          git push origin HEAD:feat/character-modeler-parity-20260909
