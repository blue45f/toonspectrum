name: Fix brush portfolio lint final

on:
  push:
    branches:
      - fix/brush-portfolio-exhaustive-contract-20260904
    paths:
      - ".github/workflows/fix-brush-portfolio-lint-final.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-brush-portfolio-lint-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-slim, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/brush-portfolio-exhaustive-contract-20260904
          fetch-depth: 0

      - name: Repair import ordering and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          data_path = Path("src/domains/creator/brush/studio-brush-quality-portfolio-data.ts")
          data = data_path.read_text(encoding="utf-8")
          first = 'import type { StudioBrushQualityPortfolioEntry } from "./studio-brush-quality-foundation";\n'
          if data.startswith(first + "type Seed="):
              data = data.replace(first + "type Seed=", first + "\ntype Seed=", 1)
          elif not data.startswith(first + "\ntype Seed="):
              raise SystemExit("unexpected portfolio-data import prelude")
          data_path.write_text(data, encoding="utf-8")

          module_path = Path("src/domains/creator/brush/studio-brush-quality-portfolio.ts")
          module = module_path.read_text(encoding="utf-8")
          export_line = 'export * from "./studio-brush-quality-foundation";\n'
          module = module.replace(export_line + "\n", "", 1)
          module = module.replace("  STUDIO_BRUSH_HAND_FEEL_PROFILES,\n", "", 1)
          anchor = 'import { STUDIO_BRUSH_QUALITY_PORTFOLIO } from "./studio-brush-quality-portfolio-data";\n'
          if export_line not in module:
              if anchor not in module:
                  raise SystemExit("portfolio module import anchor missing")
              module = module.replace(anchor, anchor + "\n" + export_line, 1)
          module_path.write_text(module, encoding="utf-8")
          PY
          rm -f .github/workflows/fix-brush-portfolio-lint-final.yml
          git diff --check
          git config user.name "toonstudio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit --no-verify -m "fix(brush): normalize quality portfolio imports"
          if git push --no-verify origin HEAD:fix/brush-portfolio-exhaustive-contract-20260904; then
            exit 0
          fi
          git fetch origin fix/brush-portfolio-exhaustive-contract-20260904
          git show FETCH_HEAD:src/domains/creator/brush/studio-brush-quality-portfolio-data.ts | sed -n '1,3p' | grep -Fx ''
          git show FETCH_HEAD:src/domains/creator/brush/studio-brush-quality-portfolio.ts | sed -n '1,15p' | grep -F 'export * from "./studio-brush-quality-foundation";'
          if git cat-file -e FETCH_HEAD:.github/workflows/fix-brush-portfolio-lint-final.yml 2>/dev/null; then
            echo "remote still contains the one-shot workflow" >&2
            exit 1
          fi
