name: Consolidate merged branch cleanup

on:
  push:
    branches:
      - ci/automatic-merged-branch-cleanup-20260904

permissions:
  contents: write

concurrency:
  group: harden-merged-branch-cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  consolidate:
    if: ${{ !contains(github.event.head_commit.message, '[merged-branch-cleanup-consolidated]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/automatic-merged-branch-cleanup-20260904
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Synchronize latest feature state
        run: |
          git fetch origin ci/automatic-merged-branch-cleanup-20260904
          git reset --hard origin/ci/automatic-merged-branch-cleanup-20260904

      - name: Apply hardening only when missing
        run: |
          if ! grep -Fq 'const verifiedSha = await currentRefSha' scripts/cleanup-merged-branches.mjs; then
            python3 scripts/harden-merged-branch-cleanup.py
          fi

      - name: Remove one-shot hardening machinery
        run: |
          rm -f \
            scripts/harden-merged-branch-cleanup.py \
            .github/workflows/harden-merged-branch-cleanup.yml \
            .github/workflows/consolidate-merged-branch-cleanup.yml
          git diff --check
          git status --short

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run cleanup safety verification
        run: |
          node --check scripts/cleanup-merged-branches.mjs
          pnpm exec eslint --max-warnings=0 \
            scripts/cleanup-merged-branches.mjs \
            scripts/cleanup-merged-branches.test.ts
          pnpm exec vitest run scripts/cleanup-merged-branches.test.ts
          pnpm run validate:architecture
          pnpm exec tsc -p tsconfig.json --noEmit --incremental false

      - name: Commit consolidated cleanup
        run: |
          git config user.name "toonstudio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit --no-verify -m "ci: finalize race-safe merged branch cleanup [merged-branch-cleanup-consolidated]"
          git push --no-verify origin HEAD:ci/automatic-merged-branch-cleanup-20260904
