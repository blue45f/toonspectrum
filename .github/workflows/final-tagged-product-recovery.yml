name: Final tagged product recovery

on:
  push:
    branches: [ops/final-tagged-product-recovery-20260911]
    paths: [.github/workflows/final-tagged-product-recovery.yml]

permissions:
  contents: write

concurrency:
  group: final-tagged-product-recovery-20260911
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=8192
      TARGET_BRANCH: ops/final-tagged-product-recovery-20260911
      SOURCE_MATERIALIZER_SHA: ae8ab74deb66af434c5bbc08551a593b345d8d9d
      EFFECTS_SOURCE_SHA: f76a78bc047d42dcc74cda6002307d50fb491cd8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Extract reviewed product materialization steps
        shell: bash
        run: |
          set -euo pipefail
          git show "${SOURCE_MATERIALIZER_SHA}:.github/workflows/materialize-remaining-tagged-product-work.yml" \
            > "$RUNNER_TEMP/product-materializer.yml"

          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path(os.environ["RUNNER_TEMP"]) / "product-materializer.yml"
          source = path.read_text(encoding="utf-8")
          replacements = [
              ('if ">3D 캐릭터<" in source:', 'if "3D 캐릭터" in source:'),
              ('for label in [">3D 캐릭터<", ">캐릭터 셰이퍼<", ">3D 데생 인형<", ">3D 배경<"]:',
               'for label in ["3D 캐릭터", "캐릭터 셰이퍼", "3D 데생 인형", "3D 배경"]:'),
              ('expect(toolbarSource).not.toContain(">3D 캐릭터<");',
               'expect(toolbarSource).not.toContain("3D 캐릭터");'),
              ('expect(toolbarSource).not.toContain(">캐릭터 셰이퍼<");',
               'expect(toolbarSource).not.toContain("캐릭터 셰이퍼");'),
              ('expect(toolbarSource).not.toContain(">3D 데생 인형<");',
               'expect(toolbarSource).not.toContain("3D 데생 인형");'),
              ('expect(toolbarSource).not.toContain(">3D 배경<");',
               'expect(toolbarSource).not.toContain("3D 배경");'),
          ]
          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f"materializer assertion marker missing: {old}")
              source = source.replace(old, new, 1)

          required = [
              'if "3D 캐릭터" in source:',
              'for label in ["3D 캐릭터", "캐릭터 셰이퍼", "3D 데생 인형", "3D 배경"]:',
              'if source.count("3D 스튜디오") < 1:',
          ]
          for marker in required:
              if marker not in source:
                  raise SystemExit(f"corrected materializer marker missing: {marker}")
          path.write_text(source, encoding="utf-8")
          PY

          ruby -ryaml - <<'RB'
          workflow = YAML.load_file(File.join(ENV.fetch("RUNNER_TEMP"), "product-materializer.yml"), aliases: true)
          steps = workflow.fetch("jobs").fetch("materialize").fetch("steps")
          wanted = {
            "Materialize non-destructive Studio effects workspace" => "effects.sh",
            "Materialize one guided Studio 3D entry" => "unified-3d.py",
            "Record tagged-source recovery map" => "recovery-map.sh",
            "Install and validate focused product contracts" => "validate.sh",
          }
          wanted.each do |name, file|
            step = steps.find { |candidate| candidate["name"] == name }
            abort("missing source materializer step: #{name}") unless step && step["run"]
            File.write(File.join(ENV.fetch("RUNNER_TEMP"), file), step["run"])
          end
          RB

      - name: Materialize Studio effects workspace
        shell: bash
        run: bash "$RUNNER_TEMP/effects.sh"

      - name: Materialize unified Studio 3D entry
        shell: bash
        run: python3 "$RUNNER_TEMP/unified-3d.py"

      - name: Record tagged-source recovery map
        shell: bash
        run: bash "$RUNNER_TEMP/recovery-map.sh"

      - name: Validate focused product contracts
        shell: bash
        run: bash "$RUNNER_TEMP/validate.sh"

      - name: Publish product files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          test ! -e .bootstrap
          git add apps/web/src/domains/creator .qa/tagged-product-recovery-2026-09-11.md
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "Refusing to publish workflow-file mutations" >&2
            git diff --cached --name-only >&2
            exit 1
          fi
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Product tree is already materialized"
            exit 0
          fi
          git -c core.hooksPath=/dev/null commit \
            -m "feat(studio): materialize remaining tagged recovery work"
          git push --no-verify origin "HEAD:${TARGET_BRANCH}"
