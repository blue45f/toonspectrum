name: Ensure Dependabot PR 931 merge

on:
  push:
    branches:
      - security/dependabot-zero-audit-main-20260908-v3
    paths:
      - .github/workflows/ensure-dependabot-pr931-merge.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  ensure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: security/dependabot-zero-audit-main-20260908-v3
          fetch-depth: 2
      - name: Reopen PR against main and enable protected auto-merge
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH repos/${GITHUB_REPOSITORY}/pulls/931 \
            -f state=open \
            -f base=main \
            -f title='fix(security): resolve all Dependabot alerts'
          gh pr merge 931 --repo "$GITHUB_REPOSITORY" --auto --squash
      - name: Retire this one-shot without changing the final tree
        shell: bash
        run: |
          set -euo pipefail
          branch='security/dependabot-zero-audit-main-20260908-v3'
          git rm .github/workflows/ensure-dependabot-pr931-merge.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(ci): retire Dependabot merge one-shot'
          git pull --rebase origin "$branch"
          git push origin HEAD:"$branch"
