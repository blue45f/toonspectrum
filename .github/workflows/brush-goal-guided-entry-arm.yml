name: Recover Brush Studio goal entry

on:
  push:
    branches: [feat/brush-goal-guided-entry-main-20260910]
    paths: [.github/workflows/brush-goal-guided-entry-arm.yml]

permissions:
  contents: write

concurrency:
  group: recover-brush-goal-entry-v3
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/brush-goal-guided-entry-main-20260910
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Restore reviewed component and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import os
          import subprocess
          import yaml

          data = yaml.safe_load(open(
              '.github/workflows/brush-goal-guided-entry-retry-once.yml',
              encoding='utf-8',
          ))
          for step in data['jobs']['materialize']['steps']:
              if step.get('name') != 'Reuse the reviewed component and test definitions':
                  continue
              subprocess.run(
                  step['run'],
                  shell=True,
                  executable='/bin/bash',
                  check=True,
                  env=os.environ.copy(),
              )
          PY
          git show 447f5f8aeabedd7179c64b202c9fcad92a184ebe:apps/web/src/domains/creator/brush/StudioBrushGoalStart.tsx \
            > apps/web/src/domains/creator/brush/StudioBrushGoalStart.tsx
          python3 scripts/materialize-brush-goal-entry.py

      - name: Validate goal-driven entry
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec vitest run \
            apps/web/src/domains/creator/brush/StudioBrushGoalStart.test.tsx \
            apps/web/src/domains/creator/brush/studio-brush-goal-start-integration-boundary.test.ts
          pnpm exec eslint --max-warnings=0 \
            apps/web/src/domains/creator/brush/StudioBrushGoalStart.tsx \
            apps/web/src/domains/creator/brush/StudioBrushGoalStart.test.tsx \
            apps/web/src/domains/creator/brush/studio-brush-goal-start-integration-boundary.test.ts \
            apps/web/src/domains/creator/brush/StudioBrushStudio.tsx
          git diff --check

      - name: Commit product slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name toonstudio-brush-ci
          git config user.email actions@users.noreply.github.com
          rm -f .github/workflows/brush-goal-guided-entry-once.yml \
                .github/workflows/brush-goal-guided-entry-retry-once.yml \
                .github/workflows/brush-goal-guided-entry-arm.yml \
                scripts/materialize-brush-goal-entry.py
          git add -A
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m 'feat(brush): start Brush Studio from the desired result'
          git push --no-verify origin HEAD:feat/brush-goal-guided-entry-main-20260910
