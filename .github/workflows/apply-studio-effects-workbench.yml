name: Apply Studio effects workbench

on:
  push:
    branches:
      - studio-effects-workbench-20260909
    paths:
      - .github/workflows/apply-studio-effects-workbench.yml

permissions:
  contents: write

concurrency:
  group: studio-effects-workbench-bootstrap
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: studio-effects-workbench-20260909
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Apply validated effects payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .bootstrap/apply-effects-workbench.mjs.gz.b64 | gzip -d > /tmp/apply-effects-workbench.mjs
          node --check /tmp/apply-effects-workbench.mjs
          node /tmp/apply-effects-workbench.mjs
          git status --short
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Normalize changed TypeScript
        shell: bash
        run: |
          pnpm exec eslint --fix \
            apps/web/src/domains/creator/StudioEffectWorkbench.tsx \
            apps/web/src/domains/creator/StudioSmartFiltersPanel.tsx \
            apps/web/src/domains/creator/contracts/studio-work-asset-contract.ts \
            apps/web/src/domains/creator/render/studio-konva-filter-fields.ts \
            apps/web/src/domains/creator/render/studio-konva-filters.ts \
            apps/web/src/domains/creator/studio-adjustment-layer-plan.ts \
            apps/web/src/domains/creator/studio-adjustment-layer-runtime.ts \
            apps/web/src/domains/creator/studio-adjustment-stack.ts \
            apps/web/src/domains/creator/studio-effect-workbench.ts \
            apps/web/src/domains/creator/studio-image-filter-worker-client.ts \
            apps/web/src/domains/creator/studio-standard-blend.ts \
            apps/web/src/domains/creator/studio-effect-workbench.test.ts \
            apps/web/src/domains/creator/studio-smart-filter-blend.test.ts \
            apps/web/src/domains/creator/studio-standard-blend.test.ts
      - name: Validate architecture and lint
        shell: bash
        run: |
          pnpm run validate:architecture
          pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Run effects regression suite
        shell: bash
        run: |
          pnpm exec vitest run \
            apps/web/src/domains/creator/studio-standard-blend.test.ts \
            apps/web/src/domains/creator/studio-effect-workbench.test.ts \
            apps/web/src/domains/creator/studio-smart-filter-opacity.test.ts \
            apps/web/src/domains/creator/studio-smart-filter-blend.test.ts \
            apps/web/src/domains/creator/studio-adjustment-stack.test.ts \
            apps/web/src/domains/creator/studio-adjustment-layer-plan.test.ts \
            apps/web/src/domains/creator/studio-adjustment-layer-runtime.test.ts
      - name: Commit product changes and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/export-repo-snapshot.yml
          rm -f .github/workflows/apply-studio-effects-workbench.yml
          git config user.name "toonstudio-effects-bot"
          git config user.email "toonstudio-effects-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m "feat(studio): ship advanced effects workbench"
          git push origin HEAD:studio-effects-workbench-20260909
