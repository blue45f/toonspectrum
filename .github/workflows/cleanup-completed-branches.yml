name: Cleanup completed branches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-completed-branches.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-completed-branches
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Delete only provably completed remote branches
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const repository = `${owner}/${repo}`;
            const defaultBranch = context.payload.repository?.default_branch ?? "main";
            const longLived = new Set([
              defaultBranch,
              "main",
              "master",
              "develop",
              "development",
              "dev",
              "staging",
              "production",
              "gh-pages",
            ]);

            const openPulls = await github.paginate(
              "GET /repos/{owner}/{repo}/pulls",
              { owner, repo, state: "open", per_page: 100 },
            );
            const openHeads = new Set(
              openPulls
                .filter((pull) => pull.head.repo?.full_name === repository)
                .map((pull) => pull.head.ref),
            );

            const closedPulls = await github.paginate(
              "GET /repos/{owner}/{repo}/pulls",
              {
                owner,
                repo,
                state: "closed",
                sort: "updated",
                direction: "desc",
                per_page: 100,
              },
            );
            const mergedHeads = new Map();
            for (const pull of closedPulls) {
              if (!pull.merged_at || pull.head.repo?.full_name !== repository) continue;
              if (!mergedHeads.has(pull.head.ref)) {
                mergedHeads.set(pull.head.ref, pull.head.sha);
              }
            }

            const branches = await github.paginate(
              "GET /repos/{owner}/{repo}/branches",
              { owner, repo, protected: false, per_page: 100 },
            );
            const deleted = [];
            const preserved = [];
            const failed = [];

            for (const branch of branches) {
              const name = branch.name;
              const tip = branch.commit.sha;

              if (longLived.has(name)) {
                preserved.push(`${name} — long-lived/default branch`);
                continue;
              }
              if (branch.protected) {
                preserved.push(`${name} — protected branch`);
                continue;
              }
              if (openHeads.has(name)) {
                preserved.push(`${name} — open PR head`);
                continue;
              }

              let reason = null;
              try {
                const comparison = await github.request(
                  "GET /repos/{owner}/{repo}/compare/{basehead}",
                  { owner, repo, basehead: `${defaultBranch}...${name}` },
                );
                if (comparison.data.ahead_by === 0) {
                  reason = `tip is contained in ${defaultBranch}`;
                }
              } catch (error) {
                if (error.status === 404) {
                  preserved.push(`${name} — disappeared during comparison`);
                  continue;
                }
                throw error;
              }

              if (!reason && mergedHeads.get(name) === tip) {
                reason = "tip is the exact head of a merged PR";
              }
              if (!reason) {
                preserved.push(`${name} — unique or unproven work remains`);
                continue;
              }

              try {
                const current = await github.request(
                  "GET /repos/{owner}/{repo}/git/ref/{ref}",
                  { owner, repo, ref: `heads/${name}` },
                );
                if (current.data.object.sha !== tip) {
                  preserved.push(`${name} — changed during cleanup`);
                  continue;
                }
                await github.request(
                  "DELETE /repos/{owner}/{repo}/git/refs/{ref}",
                  { owner, repo, ref: `heads/${name}` },
                );
                deleted.push(`${name} — ${reason}`);
              } catch (error) {
                if (error.status === 404) {
                  preserved.push(`${name} — already deleted`);
                } else {
                  failed.push(`${name} — ${error.message}`);
                }
              }
            }

            const section = (title, values) => [
              `## ${title}`,
              ...(values.length ? values.map((value) => `- ${value}`) : ["- none"]),
              "",
            ].join("\n");
            const report = [
              "# Completed branch cleanup",
              "",
              `- Repository: \`${repository}\``,
              `- Default branch: \`${defaultBranch}\``,
              `- Deleted: ${deleted.length}`,
              `- Preserved: ${preserved.length}`,
              `- Failed: ${failed.length}`,
              "",
              section("Deleted", deleted),
              section("Preserved", preserved),
              section("Failed", failed),
            ].join("\n");

            core.info(report);
            await core.summary.addRaw(report).write();
            if (failed.length) {
              core.setFailed(`${failed.length} branch deletions failed`);
            }
