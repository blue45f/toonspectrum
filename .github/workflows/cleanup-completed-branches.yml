name: Cleanup completed branches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-completed-branches.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-completed-branches
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Delete only provably completed remote branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          repo="$GITHUB_REPOSITORY"
          default_branch="${{ github.event.repository.default_branch }}"
          summary="$RUNNER_TEMP/completed-branch-cleanup.md"

          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          declare -A open_heads=()
          while IFS= read -r branch; do
            [[ -n "$branch" ]] && open_heads["$branch"]=1
          done < <(
            gh api --paginate --slurp \
              "repos/$repo/pulls?state=open&per_page=100" \
              | jq -r --arg repo "$repo" \
                '.[][] | select(.head.repo.full_name == $repo) | .head.ref' \
              | sort -u
          )

          declare -A merged_pr_sha=()
          while IFS=$'\t' read -r branch sha; do
            [[ -z "$branch" || -z "$sha" ]] && continue
            if [[ -z "${merged_pr_sha[$branch]:-}" ]]; then
              merged_pr_sha["$branch"]="$sha"
            fi
          done < <(
            gh api --paginate --slurp \
              "repos/$repo/pulls?state=closed&sort=updated&direction=desc&per_page=100" \
              | jq -r --arg repo "$repo" \
                '.[][]
                 | select(.merged_at != null)
                 | select(.head.repo.full_name == $repo)
                 | [.head.ref, .head.sha]
                 | @tsv'
          )

          deleted=()
          preserved=()
          failed=()

          while IFS= read -r branch; do
            [[ -z "$branch" ]] && continue

            case "$branch" in
              "$default_branch"|main|master|develop|development|dev|staging|production|gh-pages)
                preserved+=("$branch — long-lived/default branch")
                continue
                ;;
            esac

            if [[ -n "${open_heads[$branch]:-}" ]]; then
              preserved+=("$branch — open PR head")
              continue
            fi

            fetched_sha="$(git rev-parse "refs/remotes/origin/$branch")"
            current_sha="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
            if [[ -z "$current_sha" || "$current_sha" != "$fetched_sha" ]]; then
              preserved+=("$branch — changed during cleanup")
              continue
            fi

            reason=""
            if git merge-base --is-ancestor "$fetched_sha" "refs/remotes/origin/$default_branch"; then
              reason="tip is contained in $default_branch"
            elif [[ "${merged_pr_sha[$branch]:-}" == "$fetched_sha" ]]; then
              reason="tip is the exact head of a merged PR"
            else
              preserved+=("$branch — unique or unproven work remains")
              continue
            fi

            if git push origin ":refs/heads/$branch"; then
              deleted+=("$branch — $reason")
            else
              failed+=("$branch — deletion rejected")
            fi
          done < <(
            git for-each-ref \
              --format='%(refname:strip=3)' \
              refs/remotes/origin \
              | grep -v '^HEAD$' \
              | sort -u
          )

          {
            echo "# Completed branch cleanup"
            echo
            echo "- Repository: \`$repo\`"
            echo "- Default branch: \`$default_branch\`"
            echo "- Deleted: ${#deleted[@]}"
            echo "- Preserved: ${#preserved[@]}"
            echo "- Failed: ${#failed[@]}"
            echo
            echo "## Deleted"
            if (( ${#deleted[@]} == 0 )); then
              echo "- none"
            else
              printf -- '- %s\n' "${deleted[@]}"
            fi
            echo
            echo "## Preserved"
            if (( ${#preserved[@]} == 0 )); then
              echo "- none"
            else
              printf -- '- %s\n' "${preserved[@]}"
            fi
            echo
            echo "## Failed"
            if (( ${#failed[@]} == 0 )); then
              echo "- none"
            else
              printf -- '- %s\n' "${failed[@]}"
            fi
          } | tee "$summary"

          cat "$summary" >> "$GITHUB_STEP_SUMMARY"

          if (( ${#failed[@]} > 0 )); then
            exit 1
          fi
