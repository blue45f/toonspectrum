name: Isolated temporary cleanup runner retirement

on:
  pull_request:
    branches:
      - "ops/isolated-prune-base-20260910-1701"
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: isolated-temp-runner-retirement-20260910-1720
  cancel-in-progress: true

jobs:
  retire:
    if: >-
      github.repository == 'blue45f/toonspectrum' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ops/isolated-prune-trigger-20260910-1701' &&
      github.base_ref == 'ops/isolated-prune-base-20260910-1701'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TRIGGER_PR: ${{ github.event.pull_request.number }}
      TRIGGER_HEAD: ${{ github.head_ref }}
      TRIGGER_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      TRIGGER_BASE: ${{ github.base_ref }}
      TRIGGER_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Load pinned verifier and retire exact cleanup-only refs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64
          import json
          import os
          import pathlib
          import textwrap
          import urllib.request

          repo = os.environ['REPO']
          ref = os.environ['TRIGGER_BASE_SHA']
          path = '.ops/isolated-temp-runner-retire-source.yml'
          url = f'https://api.github.com/repos/{repo}/contents/{path}?ref={ref}'
          request = urllib.request.Request(
              url,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'toonspectrum-isolated-temp-retirement-loader',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          source = base64.b64decode(payload['content']).decode('utf-8')
          lines = source.splitlines()
          start = next(index for index, line in enumerate(lines) if line.strip() == "node <<'NODE'") + 1
          end = next(index for index in range(start, len(lines)) if lines[index].strip() == 'NODE')
          script = textwrap.dedent('\n'.join(lines[start:end])) + '\n'
          destination = pathlib.Path('/tmp/toonspectrum-isolated-temp-retire.cjs')
          destination.write_text(script, encoding='utf-8')
          print(f'Loaded pinned verifier: {len(script)} bytes')
          PY
          node /tmp/toonspectrum-isolated-temp-retire.cjs
