name: Render ToonStudio engineering story films
on:
  workflow_dispatch:
    inputs:
      format:
        description: Reviewable engineering-story rendition (no automatic publishing)
        required: true
        default: all
        type: choice
        options: [all, overview, investor, portrait]
permissions:
  contents: read
concurrency:
  group: technology-story-film-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/media/brand-film/package-lock.json
      - run: npm --prefix tools/media/brand-film ci
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - run: npm --prefix tools/media/brand-film run typecheck
      - name: Render validated engineering-story composition
        env:
          FILM_FORMAT: ${{ inputs.format }}
        run: npm --prefix tools/media/brand-film run render:technology -- "$FILM_FORMAT"
      - uses: actions/upload-artifact@v6
        with:
          name: toonstudio-technology-story-${{ inputs.format }}-${{ github.sha }}
          path: |
            apps/web/public/technology/technology-*.mp4
            apps/web/public/technology/technology-poster.jpg
            apps/web/public/technology/technology-*.vtt
            apps/web/public/technology/technology-transcript.*.md
            apps/web/public/technology/technology-film-manifest.json
          retention-days: 30
          if-no-files-found: error
