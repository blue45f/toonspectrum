name: Studio hydration diagnostic
on:
  push:
    branches: [codex/fix-studio-manuscript-not-found-20260913]
    paths: [.github/workflows/studio-hydration-diagnostic.yml]
permissions:
  contents: read
concurrency:
  group: studio-hydration-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Inspect hydration boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          host = Path('apps/web/src/domains/creator/StudioCuttoonEditorHost.tsx')
          lines = host.read_text().splitlines()
          print('HOST', len(lines), 'lines')
          shown = set()
          for needle, before, after in [('async function loadStudioWork', 35, 75), ('const workId =', 5, 10)]:
              for idx, line in enumerate(lines):
                  if needle in line:
                      for j in range(max(0,idx-before), min(len(lines),idx+after)):
                          if j not in shown:
                              print(f'{j+1}: {lines[j]}')
                              shown.add(j)
          PY
      - name: Package exact tracked sources
        run: |
          git rev-parse HEAD > commit.txt
          git ls-tree -r HEAD > tree.txt
          git archive HEAD apps/web/src apps/api/src packages scripts .github package.json pnpm-lock.yaml pnpm-workspace.yaml eslint.config.mjs tsconfig.json tsconfig.toonstudio-core.json tsconfig.toonstudio-ui.json vitest.config.ts vite.config.ts | gzip > studio-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: studio-hydration-source
          path: |
            studio-source.tar.gz
            commit.txt
            tree.txt
          retention-days: 1
          if-no-files-found: error
