name: Studio finishing quality regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/domains/creator/studio-quality-*.ts'
      - 'src/domains/creator/studio-finish-quality*.ts'
      - 'src/domains/creator/StudioContinuityPanel*.tsx'
      - 'src/domains/creator/StudioFinishQualityView*.tsx'
      - 'src/domains/creator/StudioLazyPanelStack*.tsx'
      - 'src/domains/creator/studio-main-menu-items-production.ts'
      - 'src/domains/creator/hybrid-dcc/StudioHybridDccCameraRig*.tsx'
      - 'scripts/verify-studio-menus.mts'
      - 'scripts/studio-quality-bundle-leaves.test.mjs'
      - 'vite.config.ts'
      - '.github/workflows/studio-finishing-quality.yml'
  push:
    branches: [main]
    paths:
      - 'src/domains/creator/studio-quality-*.ts'
      - 'src/domains/creator/studio-finish-quality*.ts'
      - 'src/domains/creator/StudioContinuityPanel*.tsx'
      - 'src/domains/creator/StudioFinishQualityView*.tsx'
      - 'src/domains/creator/StudioLazyPanelStack*.tsx'
      - 'src/domains/creator/studio-main-menu-items-production.ts'
      - 'src/domains/creator/hybrid-dcc/StudioHybridDccCameraRig*.tsx'
      - 'scripts/verify-studio-menus.mts'
      - 'scripts/studio-quality-bundle-leaves.test.mjs'
      - 'vite.config.ts'
      - '.github/workflows/studio-finishing-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-finishing-quality-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Record exact checked revision
        run: |
          mkdir -p "$RUNNER_TEMP/quality-static"
          git rev-parse HEAD > "$RUNNER_TEMP/quality-static/revision.txt"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Architecture and full zero-warning lint
        run: |
          set -euo pipefail
          pnpm run validate:architecture 2>&1 | tee "$RUNNER_TEMP/quality-static/architecture.log"
          pnpm run lint:strict 2>&1 | tee "$RUNNER_TEMP/quality-static/lint.log"
      - name: Frontend and API type contracts
        run: |
          set -euo pipefail
          pnpm run typecheck 2>&1 | tee "$RUNNER_TEMP/quality-static/typecheck.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-static
          if-no-files-found: error
          retention-days: 7

  finishing-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Record exact checked revision
        run: |
          mkdir -p "$RUNNER_TEMP/finishing-quality"
          git rev-parse HEAD > "$RUNNER_TEMP/finishing-quality/revision.txt"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run finishing, review ownership, camera and navigation contracts
        run: |
          set -euo pipefail
          node --test scripts/studio-quality-bundle-leaves.test.mjs 2>&1 | tee "$RUNNER_TEMP/finishing-quality/bundle-models.log"
          pnpm exec vitest run \
            src/domains/creator/studio-quality-inspection.test.ts \
            src/domains/creator/studio-quality-inspection-hardening.test.ts \
            src/domains/creator/studio-quality-raster-inspection.test.ts \
            src/domains/creator/studio-quality-finish-bridge.test.ts \
            src/domains/creator/studio-finish-quality.test.ts \
            src/domains/creator/studio-finish-quality-integration.test.ts \
            src/domains/creator/StudioFinishQualityView.test.tsx \
            src/domains/creator/StudioContinuityPanel.test.tsx \
            src/domains/creator/StudioContinuityPanel.hardening.test.tsx \
            src/domains/creator/StudioLazyPanelStack.test.tsx \
            src/domains/creator/StudioMenubarContent.test.tsx \
            src/domains/creator/studio-review-entry-point-viewports.test.tsx \
            src/domains/creator/StudioToolBeltContent.hints.test.ts \
            src/domains/creator/studio-router/StudioRouteCollaborationGateway.test.tsx \
            src/domains/creator/studio-router/studio-production-command-center-boundary.test.ts \
            src/domains/creator/studio-adjustment-stack.test.ts \
            src/domains/creator/studio-ux-convergence-boundary.test.ts \
            src/domains/creator/hybrid-dcc/StudioHybridDccCameraRig.test.tsx \
            --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/finishing-quality/tests.log"
      - name: Build the production browser surface with types and CSP checks
        run: |
          set -euo pipefail
          pnpm run build 2>&1 | tee "$RUNNER_TEMP/finishing-quality/build.log"
          pnpm run check:studio-bundle 2>&1 | tee "$RUNNER_TEMP/finishing-quality/bundle.log"
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify production menus, rail and export entry points
        run: |
          set -euo pipefail
          pnpm run verify:studio-menus 2>&1 | tee "$RUNNER_TEMP/finishing-quality/menus.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finishing-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/finishing-quality
          if-no-files-found: error
          retention-days: 7

# This workflow executes its checks independently of the inherited CI bypass flag.
# It cannot write product files, commit statuses, approvals, or merge a pull request.
