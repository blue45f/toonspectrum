name: Studio ink live-commit fidelity

on:
  push:
    branches: [main, release/salvage-integration-20260908]
    paths:
      - ".github/workflows/studio-ink-live-commit.yml"
      - "scripts/verify-inkwash-dippen-live-commit-fidelity.mts"
      - "scripts/studio-ink-fidelity-cases.ts"
      - "scripts/studio-ink-fidelity-cases.test.ts"
      - "scripts/verify-studio-long-stroke.mts"
      - "scripts/lib/studio-verify-preview-harness.mjs"
      - "scripts/lib/studio-verify-preview-harness.mts"
      - "apps/web/src/domains/creator/**"
  pull_request:
    branches: [main, release/salvage-integration-20260908]
    paths:
      - ".github/workflows/studio-ink-live-commit.yml"
      - "scripts/verify-inkwash-dippen-live-commit-fidelity.mts"
      - "scripts/studio-ink-fidelity-cases.ts"
      - "scripts/studio-ink-fidelity-cases.test.ts"
      - "scripts/verify-studio-long-stroke.mts"
      - "scripts/lib/studio-verify-preview-harness.mjs"
      - "scripts/lib/studio-verify-preview-harness.mts"
      - "apps/web/src/domains/creator/**"
  schedule:
    # 03:23 KST. The scheduled run catches renderer drift even when a dependency or generated
    # artifact changes outside the obvious brush paths.
    - cron: "23 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The v2 generation avoids legacy queued x64 runs while preserving per-ref cancellation.
  group: studio-ink-live-commit-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fidelity:
    name: ink-live-commit-fidelity
    # This is a standard 4-core/16-GB runner. It avoids the saturated ubuntu-latest queue while
    # retaining a full VM for Playwright, browser dependencies, the production build and WASM.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      TOONSPECTRUM_INK_FIDELITY_SPAWN_PREVIEW: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          # Browser code comes from the pull request and never needs a repository write token.
          persist-credentials: false
      - uses: pnpm/action-setup@v6 # NOSONAR S7637 trusted first-party action
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Resolve the verification directory after runner allocation
        run: |
          echo "TOONSPECTRUM_VERIFY_DIR=$RUNNER_TEMP/toonspectrum-verification" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/toonspectrum-verification"
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Validate the fidelity harness
        run: |
          pnpm exec eslint --max-warnings=0 \
            scripts/verify-studio-long-stroke.mts \
            scripts/verify-inkwash-dippen-live-commit-fidelity.mts \
            scripts/studio-ink-fidelity-cases.ts \
            scripts/studio-ink-fidelity-cases.test.ts
          pnpm exec vitest run scripts/studio-ink-fidelity-cases.test.ts
      - name: Build production Studio assets
        # The browser proof needs deployable assets, not the repository-wide TypeScript gate.
        # `core` owns global typecheck; coupling it here previously hid fidelity results behind
        # unrelated baseline diagnostics in AI, effects and soft-proofing modules.
        run: pnpm run build:bundle
      - name: Verify ink-wash and dip-pen live/commit fidelity
        run: pnpm exec tsx scripts/verify-inkwash-dippen-live-commit-fidelity.mts
      - name: Upload fidelity evidence
        if: always()
        uses: actions/upload-artifact@v4 # NOSONAR S7637 trusted first-party action
        with:
          name: studio-ink-live-commit-${{ github.run_id }}
          path: ${{ runner.temp }}/toonspectrum-verification/studio-ink-live-commit
          if-no-files-found: warn
          retention-days: 14
