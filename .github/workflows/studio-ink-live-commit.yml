    branches:
      - integration/final-main-consolidation-20260910
    paths:
      - .github/workflows/studio-ink-live-commit.yml

permissions:
  contents: read

concurrency:
  group: studio-ink-live-commit-v3-1280
  cancel-in-progress: true

jobs:
