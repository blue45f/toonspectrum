name: Studio large epics deep fixes

on:
  push:
    branches:
      - codex/studio-large-epics-closure-20260909
    paths:
      - .github/workflows/studio-large-epics-deep-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-large-epics-deep-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Wait for primary source-mutating integrations
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            active="$(gh run list --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME" --limit 100 \
              --json databaseId,name,status \
              --jq '[.[] | select(.name == "Studio large epics source normalization" or .name == "Integrate Studio 3D generation API" or .name == "Integrate Studio advanced AI tools") | select(.status == "queued" or .status == "in_progress")] | length')"
            if [ "$active" = 0 ]; then break; fi
            test "$attempt" != 80 || { echo "Timed out waiting for source integrations" >&2; exit 1; }
            sleep 15
          done
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply atomicity and React lifecycle fixes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          ledger = Path('apps/api/src/modules/studio-ai/studio-3d-generation-job-ledger.ts')
          text = ledger.read_text()
          old = '    readonly actualCredits: number;\n  }): Promise<Studio3dGenerationJobRecord> {'
          new = '    readonly actualCredits: number;\n    readonly persistArtifact?: (artifact: Studio3dGenerationArtifactRevision) => Promise<void>;\n  }): Promise<Studio3dGenerationJobRecord> {'
          if old in text:
            text = text.replace(old, new, 1)
          marker = '      const next = Object.freeze({\n        ...record,\n        state: "ready" as const,'
          if 'await input.persistArtifact(artifactRevision);' not in text:
            if marker not in text: raise SystemExit('ledger ready marker not found')
            text = text.replace(
              marker,
              '      if (input.persistArtifact) {\n        await input.persistArtifact(artifactRevision);\n      }\n      const next = Object.freeze({\n        ...record,\n        state: "ready" as const,',
              1,
            )
          ledger.write_text(text)

          service = Path('apps/api/src/modules/studio-ai/studio-3d-generation.service.ts')
          text = service.read_text()
          call_marker = '      actualCredits: record.estimatedCredits,\n    });'
          if 'persistArtifact: async (revision)' not in text:
            if call_marker not in text: raise SystemExit('service internalize marker not found')
            text = text.replace(
              call_marker,
              '      actualCredits: record.estimatedCredits,\n      persistArtifact: async (revision) => {\n        await this.#artifactStore.putArtifact({\n          revision,\n          bytes: new Uint8Array(binary.bytes),\n        });\n      },\n    });',
              1,
            )
          text = re.sub(
            r'\n    if \(!ready\.artifactRevision\) throw new TypeError\("ready 3D job has no artifact revision\."\);\n    await this\.#artifactStore\.putArtifact\(\{[\s\S]*?\n    \}\);\n    await this\.#identityStore\.delete',
            '\n    if (!ready.artifactRevision) throw new TypeError("ready 3D job has no artifact revision.");\n    await this.#identityStore.delete',
            text,
            count=1,
          )
          service.write_text(text)

          advanced = Path('apps/web/src/domains/creator/ai/StudioAdvancedAiTools.tsx')
          text = advanced.read_text()
          text = text.replace(
            'import { useMemo, useRef, useState } from "react";',
            'import { useEffect, useMemo, useRef, useState } from "react";',
          )
          text = text.replace(
            '  const providerKeyRef = useRef("");\n  providerKeyRef.current = providerKey;\n  const client = useMemo(',
            '  const providerKeyRef = useRef("");\n  useEffect(() => {\n    providerKeyRef.current = providerKey;\n  }, [providerKey]);\n  const client = useMemo(',
          )
          advanced.write_text(text)

          bridge = Path('apps/web/src/domains/creator/ai/studio-stroke-proposal-bridge.ts')
          text = bridge.read_text()
          text = text.replace(
            'import { useEffect, useSyncExternalStore } from "react";',
            'import { useEffect, useMemo, useSyncExternalStore } from "react";',
          )
          text = text.replace(
            '  const documentGeneration = Number.parseInt(studioDeterministicContentId(input.elements).slice(0, 12), 16);\n  const strokes = recentStrokeContexts(input.elements);',
            '  const documentGeneration = useMemo(\n    () => Number.parseInt(studioDeterministicContentId(input.elements).slice(0, 12), 16),\n    [input.elements],\n  );\n  const strokes = useMemo(() => recentStrokeContexts(input.elements), [input.elements]);',
          )
          old_mapping = '        const sourceById = new Map(strokes.map((stroke, index) => [stroke.id, input.elements[input.elements.length - strokes.length + index]]));'
          new_mapping = '''        const sourceById = new Map<string, TElement>();
        for (const element of input.elements) {
          if (!element || typeof element !== "object") continue;
          const id = (element as Record<string, unknown>).id;
          if (typeof id === "string" && id.trim()) sourceById.set(id, element);
        }'''
          text = text.replace(old_mapping, new_mapping)
          bridge.write_text(text)

          panel_test = Path('apps/web/src/domains/creator/ai/StudioAi3dGenerationPanel.test.tsx')
          text = panel_test.read_text()
          text = text.replace(
            '''    const fetchMock = vi.fn<typeof fetch>((input) =>
      Promise.resolve(String(input).endsWith("/jobs") ? response(job) : response([])),
    );''',
            '''    const fetchMock = vi.fn<typeof fetch>((input, init) =>
      Promise.resolve(init?.method === "POST" ? response(job) : response([])),
    );''',
          )
          panel_test.write_text(text)

          client_test = Path('apps/web/src/domains/creator/ai/studio-3d-generation-client.test.ts')
          text = client_test.read_text().replace(
            'expect(String(url)).toEndWith("/api/studio-ai/3d/jobs");',
            'expect(String(url).endsWith("/api/studio-ai/3d/jobs")).toBe(true);',
          )
          client_test.write_text(text)
          PY

      - name: Add atomic persistence regression
        run: |
          cat > apps/api/src/modules/studio-ai/studio-3d-generation-artifact-atomicity.test.ts <<'TS'
          import { describe, expect, it, vi } from "vitest";

          import {
            InMemoryStudio3dGenerationJobStore,
            Studio3dGenerationJobLedger,
          } from "./studio-3d-generation-job-ledger";

          describe("Studio 3D artifact atomicity", () => {
            it("does not expose ready before immutable artifact persistence succeeds", async () => {
              const store = new InMemoryStudio3dGenerationJobStore();
              const ledger = new Studio3dGenerationJobLedger(
                store,
                async () => ({ maxConcurrentJobs: 2, dailyCreditBudget: 10, monthlyCreditBudget: 20 }),
                () => 1_000,
              );
              let record = (
                await ledger.create({
                  userId: "user-1",
                  idempotencyKey: "atomic",
                  request: {
                    mode: "text-to-3d",
                    promptHash: "a".repeat(64),
                    inputContentHashes: [],
                    provider: "hyper3d-rodin",
                    model: "Rodin Gen-2.5",
                    tier: "Gen-2.5-Medium",
                    transport: "server",
                  },
                  estimatedCredits: 1,
                })
              ).record;
              for (const state of ["uploading", "generating-geometry", "downloading", "validating", "importing"] as const) {
                record = await ledger.transition({ jobId: record.id, expectedGeneration: record.generation, state });
              }
              const persistArtifact = vi.fn().mockRejectedValue(new Error("object store unavailable"));
              await expect(
                ledger.internalizeArtifact({
                  jobId: record.id,
                  expectedGeneration: record.generation,
                  bytes: new Uint8Array(32).fill(1),
                  mimeType: "model/gltf-binary",
                  objectKey: "objects/model.glb",
                  validationVersion: "v1",
                  modelId: "model-1",
                  actualCredits: 1,
                  persistArtifact,
                }),
              ).rejects.toThrow("object store unavailable");
              expect((await ledger.require(record.id)).state).toBe("importing");
              expect(persistArtifact).toHaveBeenCalledTimes(1);
            });
          });
          TS

      - name: Lint, test and typecheck hardened contracts
        run: |
          pnpm exec eslint --fix --max-warnings=0 \
            apps/api/src/modules/studio-ai/studio-3d-generation-job-ledger.ts \
            apps/api/src/modules/studio-ai/studio-3d-generation.service.ts \
            apps/api/src/modules/studio-ai/studio-3d-generation-artifact-atomicity.test.ts \
            apps/web/src/domains/creator/ai/StudioAdvancedAiTools.tsx \
            apps/web/src/domains/creator/ai/studio-stroke-proposal-bridge.ts \
            apps/web/src/domains/creator/ai/StudioAi3dGenerationPanel.test.tsx \
            apps/web/src/domains/creator/ai/studio-3d-generation-client.test.ts
          pnpm exec vitest run \
            apps/api/src/modules/studio-ai/studio-3d-generation-job-ledger.test.ts \
            apps/api/src/modules/studio-ai/studio-3d-generation-artifact-atomicity.test.ts \
            apps/web/src/domains/creator/ai/studio-stroke-proposal.test.ts \
            apps/web/src/domains/creator/ai/StudioStrokeProposalReviewPanel.test.tsx \
            apps/web/src/domains/creator/ai/studio-3d-generation-client.test.ts \
            apps/web/src/domains/creator/ai/StudioAi3dGenerationPanel.test.tsx
          pnpm exec tsc -p tsconfig.json --noEmit --incremental false
          pnpm --filter @webtoon-nest/api run typecheck

      - name: Publish fixes with rebase retries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps
          git commit -m "fix(studio): make large-epic product flows persistence-safe"
          for attempt in 1 2 3 4; do
            git fetch origin "$GITHUB_REF_NAME"
            if git rebase "origin/$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME"; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          exit 1
