name: Temporary Studio comments ARM unblock

on:
  push:
    branches:
      - feat/studio-comments-workflow-ux-20260905

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply comment UX patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/temp-studio-comments-apply.yml').read_text()
          match = re.search(r"printf '%s' '([A-Za-z0-9+/=]+)' \| base64", workflow)
          if match is None:
              raise SystemExit('embedded comment patch was not found')
          patch = gzip.decompress(base64.b64decode(match.group(1)))
          Path('/tmp/studio-comments-ux.patch').write_bytes(patch)
          PY
          git apply --check /tmp/studio-comments-ux.patch
          git apply /tmp/studio-comments-ux.patch
          rm -f \
            .github/workflows/temp-studio-comments-source-export.yml \
            .github/workflows/temp-studio-comments-apply.yml \
            .github/workflows/temp-studio-comments-arm-unblock.yml
          git diff --check
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile
      - name: Verify changed comment surfaces
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec eslint --max-warnings=0 \
            src/domains/creator/StudioCommentsPanel.tsx \
            src/domains/creator/StudioCommentsPanel.test.tsx \
            src/domains/creator/StudioCommentThreadPopover.tsx \
            src/domains/creator/StudioCommentThreadPopover.test.tsx
          pnpm exec vitest run \
            src/domains/creator/StudioCommentsPanel.test.tsx \
            src/domains/creator/StudioCommentsPanel.reply-controller.test.tsx \
            src/domains/creator/StudioCommentThreadPopover.test.tsx
          pnpm exec tsc -p tsconfig.json --noEmit --pretty false
      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(studio): streamline comment review workflow"
          git push origin "HEAD:${{ github.ref_name }}"
