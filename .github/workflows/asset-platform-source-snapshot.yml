name: Asset platform source snapshot

on:
  push:
    branches:
      - feat/asset-platform-foundation
    paths:
      - .github/workflows/asset-platform-source-snapshot.yml

permissions:
  contents: read

concurrency:
  group: asset-platform-source-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build compact runtime archive
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/toonspectrum-runtime-source.tar.gz"
          candidates=(
            apps/api/src/app.module.ts
            apps/api/src/main.ts
            apps/api/src/config
            apps/api/src/db
            apps/api/src/modules/creator
            apps/api/src/modules/creator-marketplace
            apps/api/src/infrastructure/supabase-object-storage
            apps/api/package.json
            apps/api/tsconfig.json
            apps/web/src/domains/creator
            apps/web/src/shared/lib
            apps/web/package.json
            apps/web/tsconfig.json
            scripts/bootstrap-empty-production-database.mjs
            scripts/run-production-database-migrations.mjs
            scripts/run-production-database-migrations.test.mjs
            scripts/production-database-migrations.manifest
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            turbo.json
            tsconfig.json
            vitest.config.ts
            drizzle.config.ts
          )
          existing=()
          for path in "${candidates[@]}"; do
            [[ -e "${path}" ]] && existing+=("${path}")
          done
          tar -czf "${archive}" "${existing[@]}"
          test -s "${archive}"
          du -h "${archive}"
      - name: Upload source archive
        uses: actions/upload-artifact@v6
        with:
          name: toonspectrum-asset-platform-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/toonspectrum-runtime-source.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
