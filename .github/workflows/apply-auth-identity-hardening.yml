name: Apply auth identity hardening

on:
  push:
    branches:
      - feat/social-login-kakao-naver-github-20260915
    paths:
      - scripts/apply-auth-identity-hardening.py
      - .github/workflows/apply-auth-identity-hardening.yml

permissions:
  contents: write

concurrency:
  group: auth-identity-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/social-login-kakao-naver-github-20260915
          fetch-depth: 0
      - name: Apply reviewed authentication patch
        run: python3 scripts/apply-auth-identity-hardening.py
      - name: Validate generated patch
        run: |
          git diff --check
          test ! -e scripts/apply-auth-identity-hardening.py
          test ! -e .github/workflows/apply-auth-identity-hardening.yml
          git status --short
      - name: Commit generated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(auth): harden identity ownership and account linking"
          git push origin HEAD:feat/social-login-kakao-naver-github-20260915
