name: Studio campaign gate dispatcher

on:
  workflow_run:
    workflows:
      - Studio seven-day saturation campaign
    types: [completed]
  schedule:
    # Backup reconciliation when a workflow_run delivery or API dispatch is delayed.
    - cron: "43 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: studio-campaign-gate-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Update and dispatch missing gates for eligible campaign pull requests
        shell: bash
        run: |
          set -euo pipefail

          pulls_json="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${REPOSITORY}/pulls?state=open&per_page=100"
          )"
          main_sha="$(gh api "repos/${REPOSITORY}/branches/main" --jq '.commit.sha')"

          mapfile -t candidates < <(
            jq -r \
              --arg repo "$REPOSITORY" \
              '.[]
                | select(.draft == false)
                | select(.base.ref == "main")
                | select(.head.repo.full_name == $repo)
                | select(.head.ref | startswith("codex/campaign-"))
                | select((.body // "") | contains("<!-- studio-automerge -->"))
                | [.number, .head.ref, .head.sha]
                | @tsv' <<< "$pulls_json"
          )

          if (( ${#candidates[@]} == 0 )); then
            echo "No eligible campaign pull requests need reconciliation."
            exit 0
          fi

          latest_state() {
            local runs_json="$1"
            local workflow_name="$2"
            jq -r \
              --arg workflow_name "$workflow_name" \
              '[.workflow_runs[] | select(.name == $workflow_name)]
                | sort_by(.run_number)
                | last
                | if . == null
                  then "missing/missing"
                  else ((.status // "missing") + "/" + (.conclusion // "pending"))
                  end' <<< "$runs_json"
          }

          needs_dispatch() {
            local state="$1"
            case "$state" in
              completed/success|queued/*|in_progress/*|requested/*|waiting/*|pending/*)
                return 1
                ;;
              *)
                return 0
                ;;
            esac
          }

          dispatch_simple() {
            local workflow_file="$1"
            local head_ref="$2"
            jq -n --arg ref "$head_ref" '{ref: $ref}' \
              | gh api \
                  --method POST \
                  -H 'Accept: application/vnd.github+json' \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "repos/${REPOSITORY}/actions/workflows/${workflow_file}/dispatches" \
                  --input -
          }

          dispatch_release() {
            local head_ref="$1"
            local head_sha="$2"
            local pull_number="$3"
            jq -n \
              --arg ref "$head_ref" \
              --arg pr_number "$pull_number" \
              --arg head_sha "$head_sha" \
              '{ref: $ref, inputs: {pr_number: $pr_number, head_sha: $head_sha}}' \
              | gh api \
                  --method POST \
                  -H 'Accept: application/vnd.github+json' \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "repos/${REPOSITORY}/actions/workflows/studio-campaign-release-gate.yml/dispatches" \
                  --input -
          }

          for candidate in "${candidates[@]}"; do
            IFS=$'\t' read -r pull_number head_ref head_sha <<< "$candidate"
            echo "Reconciling PR #${pull_number} (${head_ref}@${head_sha})."

            pull_json="$(gh api "repos/${REPOSITORY}/pulls/${pull_number}")"
            current_sha="$(jq -r '.head.sha' <<< "$pull_json")"
            current_state="$(jq -r '.state' <<< "$pull_json")"
            if [[ "$current_state" != "open" || "$current_sha" != "$head_sha" ]]; then
              echo "PR #${pull_number} moved or closed during reconciliation; skipping."
              continue
            fi

            comparison_json="$(
              gh api \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "repos/${REPOSITORY}/compare/${main_sha}...${head_sha}"
            )"
            comparison_status="$(jq -r '.status // "unknown"' <<< "$comparison_json")"

            if [[ "$comparison_status" == "behind" || "$comparison_status" == "diverged" ]]; then
              echo "PR #${pull_number} is ${comparison_status} current main ${main_sha}; requesting an exact update."
              update_payload="$(jq -n --arg expected_head_sha "$head_sha" '{expected_head_sha: $expected_head_sha}')"
              set +e
              update_response="$(
                gh api \
                  --method PUT \
                  -H 'Accept: application/vnd.github+json' \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "repos/${REPOSITORY}/pulls/${pull_number}/update-branch" \
                  --input - <<< "$update_payload" \
                  2>&1
              )"
              update_status=$?
              set -e
              if [[ "$update_status" -ne 0 ]]; then
                echo "::warning::Could not update PR #${pull_number} onto current main: ${update_response}"
                continue
              fi
              pull_json="$(gh api "repos/${REPOSITORY}/pulls/${pull_number}")"
              head_sha="$(jq -r '.head.sha' <<< "$pull_json")"
              echo "PR #${pull_number} now points to ${head_sha}; dispatching gates for the new head."
            elif [[ "$comparison_status" != "ahead" && "$comparison_status" != "identical" ]]; then
              echo "::warning::Unexpected compare status ${comparison_status} for PR #${pull_number}; skipping."
              continue
            fi

            runs_json="$(
              gh api \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "repos/${REPOSITORY}/actions/runs?head_sha=${head_sha}&per_page=100"
            )"

            release_state="$(latest_state "$runs_json" "Studio campaign release gate")"
            risk_state="$(latest_state "$runs_json" "Studio autonomous risk gate")"
            sonar_state="$(latest_state "$runs_json" "SonarQube")"

            echo "PR #${pull_number}: release=${release_state}, risk=${risk_state}, sonar=${sonar_state}"

            if needs_dispatch "$release_state"; then
              dispatch_release "$head_ref" "$head_sha" "$pull_number"
              echo "Dispatched Studio campaign release gate for PR #${pull_number}."
            fi
            if needs_dispatch "$risk_state"; then
              dispatch_simple studio-autonomous-risk-gate.yml "$head_ref"
              echo "Dispatched Studio autonomous risk gate for PR #${pull_number}."
            fi
            if needs_dispatch "$sonar_state"; then
              dispatch_simple sonarqube.yml "$head_ref"
              echo "Dispatched SonarQube for PR #${pull_number}."
            fi
          done
