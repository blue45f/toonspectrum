name: Repair lossless integration CI

on:
  push:
    branches:
      - integration/lossless-all-remote-branches-20260903
    paths:
      - ".github/workflows/repair-lossless-integration-ci.yml"

permissions:
  contents: write

concurrency:
  group: repair-lossless-integration-ci
  cancel-in-progress: true

env:
  CI: "true"
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  repair-verify-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integration/lossless-all-remote-branches-20260903
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Repair deterministic merge defects
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def transform(path: str, operation):
              file = Path(path)
              before = file.read_text(encoding="utf-8")
              after = operation(before)
              if after == before:
                  raise RuntimeError(f"{path}: expected repair was not applied")
              file.write_text(after, encoding="utf-8")
              print(f"patched: {path}")

          def regex_once(source: str, pattern: str, replacement: str, label: str) -> str:
              result, count = re.subn(pattern, replacement, source, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one target, found {count}")
              return result

          transform(
              "scripts/marketplace/fix-authoring-contracts.mjs",
              lambda source: regex_once(
                  source,
                  r"^/\* eslint-disable no-useless-escape[^\n]*\*/\n\n?",
                  "",
                  "fix-authoring eslint comment",
              ),
          )
          transform(
              "scripts/marketplace/integrate-source-package-builder.mjs",
              lambda source: regex_once(
                  source,
                  r"^/\* eslint-disable no-useless-escape[^\n]*\*/\n",
                  "",
                  "package-builder eslint comment",
              ),
          )
          transform(
              "scripts/qa-live-studio-cross-browser-audit-v2.mjs",
              lambda source: regex_once(
                  source,
                  r"(if \(dom\.bodyTextLength === 0[^\n]+\{\n\s+await sleep\(RETRY_SETTLE_MS\);\n)\s+dom = await inspectDom\(page, profile\);\n(\s+\})",
                  r"\1\2",
                  "cross-browser retry assignment",
              ),
          )
          transform(
              "scripts/qa-studio-authenticated-browser.mjs",
              lambda source: regex_once(
                  source,
                  r"(\}\s*catch\s*\{\n)(\s*)json = null;\n(\s*\})",
                  r"\1\2// Keep the initialized null value for non-JSON responses.\n\3",
                  "authenticated JSON fallback",
              ),
          )
          transform(
              "scripts/qa-studio-browser-fault-injection.mjs",
              lambda source: regex_once(
                  source,
                  r"(\}\s*catch\s*\{\n)(\s*)visible = false;\n(\s*\})",
                  r"\1\2// Keep the initialized false value when the modal is absent.\n\3",
                  "fault-injection visibility fallback",
              ),
          )
          transform(
              "scripts/qa-triage-playwright-artifacts.mjs",
              lambda source: regex_once(
                  source,
                  r"/\\u0000/u\.test\(content\.slice\(0, 4_000\)\)",
                  "content.slice(0, 4_000).includes(String.fromCharCode(0))",
                  "artifact NUL detection",
              ),
          )
          transform(
              "scripts/qa/studio-chromium-inapp-suite-runner.mjs",
              lambda source: regex_once(
                  source,
                  r"throw new Error\(`Invalid QA_CASE_PATTERN \$\{JSON\.stringify\(source\)\}: \$\{String\(error\)\}`\);",
                  "throw new Error(\n      `Invalid QA_CASE_PATTERN ${JSON.stringify(source)}: ${String(error)}`,\n      { cause: error },\n    );",
                  "QA pattern error cause",
              ),
          )

          def patch_avatar(source: str) -> str:
              marker = "/* eslint-disable react-refresh/only-export-components -- Preview helpers are part of the public rendering contract. */\n"
              if source.startswith(marker):
                  raise RuntimeError("avatar lint boundary is already repaired")
              return marker + source

          transform("src/domains/creator/vrm/StudioVrmAvatarForgePreview.tsx", patch_avatar)

          def patch_brush(source: str) -> str:
              source = regex_once(
                  source,
                  r"let lastPresentedMeta: \{\n\s*referenceWidth: number;\n\s*referenceHeight: number;\n\s*frames: Array<\{ tMs: number; width: number; height: number \}>;\n\} \| null = null;",
                  "interface PresentedFrameMeta {\n  readonly referenceWidth: number;\n  readonly referenceHeight: number;\n  readonly frames: Array<{ tMs: number; width: number; height: number }>;\n}\n\nlet lastPresentedMeta: PresentedFrameMeta | null = null;",
                  "presented frame metadata type",
              )
              source = regex_once(
                  source,
                  r"readonly presentedMeta: typeof lastPresentedMeta;",
                  "readonly presentedMeta: PresentedFrameMeta | null;",
                  "stroke record metadata contract",
              )
              source = regex_once(
                  source,
                  r"(\s+inStroke: analyzeStudioBrushScenarioInStroke\(\[\]\),\n)(\s+layers: null,)",
                  r"\1        inStrokeFrames: [],\n        rejectedNotices: { released: 0, settled: 0 },\n        clearTrace: null,\n        presentedMeta: null,\n\2",
                  "buildup summary record contract",
              )
              return source

          transform("scripts/verify-studio-brush-scenarios.mts", patch_brush)
          PY

          git diff --check
          node --check scripts/marketplace/fix-authoring-contracts.mjs
          node --check scripts/marketplace/integrate-source-package-builder.mjs
          node --check scripts/qa-live-studio-cross-browser-audit-v2.mjs
          node --check scripts/qa-studio-authenticated-browser.mjs
          node --check scripts/qa-studio-browser-fault-injection.mjs
          node --check scripts/qa-triage-playwright-artifacts.mjs
          node --check scripts/qa/studio-chromium-inapp-suite-runner.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repaired integration
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec eslint \
            scripts/marketplace/fix-authoring-contracts.mjs \
            scripts/marketplace/integrate-source-package-builder.mjs \
            scripts/qa-live-studio-cross-browser-audit-v2.mjs \
            scripts/qa-studio-authenticated-browser.mjs \
            scripts/qa-studio-browser-fault-injection.mjs \
            scripts/qa-triage-playwright-artifacts.mjs \
            scripts/qa/studio-chromium-inapp-suite-runner.mjs \
            scripts/verify-studio-brush-scenarios.mts \
            src/domains/creator/vrm/StudioVrmAvatarForgePreview.tsx \
            --max-warnings=0
          pnpm exec tsc -p tsconfig.json --noEmit
          pnpm run build

      - name: Commit only verified repairs
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-lossless-integration-ci.yml
          git add \
            scripts/marketplace/fix-authoring-contracts.mjs \
            scripts/marketplace/integrate-source-package-builder.mjs \
            scripts/qa-live-studio-cross-browser-audit-v2.mjs \
            scripts/qa-studio-authenticated-browser.mjs \
            scripts/qa-studio-browser-fault-injection.mjs \
            scripts/qa-triage-playwright-artifacts.mjs \
            scripts/qa/studio-chromium-inapp-suite-runner.mjs \
            scripts/verify-studio-brush-scenarios.mts \
            src/domains/creator/vrm/StudioVrmAvatarForgePreview.tsx
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(integration): repair preserved branch CI contracts"
          git push origin HEAD:integration/lossless-all-remote-branches-20260903
