name: Apply reviewed BG3D source edits

# Temporary, branch-scoped mechanical edit. No application/dependency code executes with this
# write token. Remove this workflow immediately after inspecting the resulting source commit.
on:
  push:
    branches: [fix/bg3d-runtime-verification-20260905]
    paths: [.github/workflows/tmp-bg3d-reviewed-edit.yml]
permissions:
  contents: write
jobs:
  reviewed-edit:
    if: github.repository == 'blue45f/toonspectrum' && github.ref == 'refs/heads/fix/bg3d-runtime-verification-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Apply only the reviewed replacements to hash-verified files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path('src/domains/creator/bg3d')
          def read(name, sha):
              path = root / name
              actual = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
              if actual != sha:
                  raise RuntimeError(f'Source changed; refusing {name}: {actual}')
              return path, path.read_text()
          def replace_once(source, old, new):
              if source.count(old) != 1:
                  raise RuntimeError(f'Reviewed edit no longer unique: {old}')
              return source.replace(old, new, 1)
          path, source = read('StudioBg3dSceneNodes.tsx', 'b477024cdc8b9ecbf09d12dd71d8142dc1a38e66')
          start = source.index('export function BgAdaptiveDprController(')
          end = source.index('interface BgPrimitiveMeshProps', start)
          block = source[start:end]
          block = replace_once(block, '    const previous = governorRef.current;',
              '    // Demand-frame gaps measure artist input cadence, not GPU throughput.\n'
              '    const effectivePaused = paused || state.frameloop !== "always";\n'
              '    const previous = governorRef.current;')
          block = replace_once(block, '      paused,', '      paused: effectivePaused,')
          block = replace_once(block, '    const value = paused ||', '    const value = effectivePaused ||')
          path.write_text(source[:start] + block + source[end:])
          path, source = read('StudioBg3dEditorViewport.tsx', '324918ea15dd3831a64c97151f5e718506029067')
          source = replace_once(source,
              'paused={isCapturing || immersiveSceneActive || !open /* EXPERIMENT: no isTransforming */}',
              'paused={isTransforming || isCapturing || immersiveSceneActive || !open}')
          old_comment = ('                    // 기즈모 드래그 중에는 해상도 거버너를 멈춘다. 드래그는 frameloop를 "always"로\n'
              '                    // 올리므로 프레임 타임이 요동치고, 거버너가 그때마다 dpr을 다시 잡으면 잡고 있는\n'
              '                    // 손 밑에서 백버퍼 크기가 계속 바뀐다 — 작가에게는 변형 피드백이 흔들리고,\n'
              '                    // 회귀 검증에는 "같은 자세인데 표면이 안 정착하는" 프레임만 남는다.')
          source = replace_once(source, old_comment,
              '                    // Freeze resolution beneath a held gizmo, including when a separate animation\n'
              '                    // keeps the renderer continuous. Demand-frame idle gaps are not GPU timings.')
          path.write_text(source)
          package = Path('package.json')
          actual = subprocess.check_output(['git', 'hash-object', str(package)], text=True).strip()
          if actual != '7aa659f7dbd4cd252dc8ad54dfa3ad6128fd5885':
              raise RuntimeError('Package scripts changed; refusing a blind replacement')
          source = package.read_text()
          old = '"verify:studio-bg3d-webgpu-rotation": "STUDIO_BG3D_WEBGPU_GIZMO=1 playwright test e2e/studio-3d-visual-verification.spec.ts --grep \'WebGPU 기즈모 연속 회전\'",'
          new = ('"verify:studio-bg3d-webgpu-rotation": "STUDIO_BG3D_WEBGPU_GIZMO=1 playwright test --config=playwright.bg3d-runtime.config.ts",\n'
              '    "verify:studio-bg3d-webgpu-rotation:dev": "STUDIO_BG3D_WEBGPU_GIZMO=1 playwright test e2e/studio-3d-visual-verification.spec.ts --grep \'WebGPU 기즈모 연속 회전\'",')
          package.write_text(replace_once(source, old, new))
          PY
          git diff --check
          git diff --stat
          git diff -- src/domains/creator/bg3d/StudioBg3dSceneNodes.tsx src/domains/creator/bg3d/StudioBg3dEditorViewport.tsx package.json
          git add -- src/domains/creator/bg3d/StudioBg3dSceneNodes.tsx src/domains/creator/bg3d/StudioBg3dEditorViewport.tsx package.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            -c core.hooksPath=/dev/null commit -m 'fix(bg3d): preserve drag resolution and stop sampling event gaps as GPU load'
      - name: Push the source commit without rewriting branch history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin HEAD:refs/heads/fix/bg3d-runtime-verification-20260905
