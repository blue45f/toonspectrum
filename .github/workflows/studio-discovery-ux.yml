name: Studio discovery UX

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'apps/web/src/domains/creator/brush/**'
      - 'apps/web/src/domains/creator/filter/**'
      - 'apps/web/src/domains/creator/studio-tool-search*'
      - 'apps/web/src/domains/creator/studio-brush.ts'
      - 'apps/web/src/domains/creator/studio-creative-ux.ts'
      - 'apps/web/src/domains/creator/studio-basic-brush-expansion.test.ts'
      - 'apps/web/src/domains/creator/StudioUnifiedBrushPicker.test.tsx'
      - 'apps/web/src/domains/creator/studio-main-menu-items-filter*'
      - 'apps/web/src/domains/creator/color/**'
      - 'apps/web/src/domains/creator/StudioColor*'
      - 'apps/web/src/domains/creator/StudioDualColorWell*'
      - 'apps/web/src/domains/creator/StudioLeftToolRail*'
      - 'apps/web/src/domains/creator/StudioToolbarConfigurator*'
      - 'apps/web/src/domains/creator/studio-toolbar*'
      - 'apps/web/tools/browser-harnesses/drawing-ux-v2*'
      - 'scripts/verify-studio-drawing-ux-v2.mjs'
      - 'scripts/lib/studio-drawing-*'
      - 'scripts/lib/studio-restricted-drawing-context.mjs'
      - 'apps/web/src/domains/creator/useStudioRecentColors*'
      - 'apps/web/src/domains/creator/studio-local-database-worker-handoff*'
      - 'apps/web/src/domains/creator/studio-local-database.worker.ts'
      - 'scripts/verify-studio-discovery-ux.mts'
      - '.github/workflows/studio-discovery-ux.yml'

  push:
    branches: ["main"]
    paths:
      - 'apps/web/src/domains/creator/brush/**'
      - 'apps/web/src/domains/creator/filter/**'
      - 'apps/web/src/domains/creator/studio-tool-search*'
      - 'apps/web/src/domains/creator/studio-brush.ts'
      - 'apps/web/src/domains/creator/studio-creative-ux.ts'
      - 'apps/web/src/domains/creator/studio-basic-brush-expansion.test.ts'
      - 'apps/web/src/domains/creator/StudioUnifiedBrushPicker.test.tsx'
      - 'apps/web/src/domains/creator/studio-main-menu-items-filter*'
      - 'apps/web/src/domains/creator/color/**'
      - 'apps/web/src/domains/creator/StudioColor*'
      - 'apps/web/src/domains/creator/StudioDualColorWell*'
      - 'apps/web/src/domains/creator/StudioLeftToolRail*'
      - 'apps/web/src/domains/creator/StudioToolbarConfigurator*'
      - 'apps/web/src/domains/creator/studio-toolbar*'
      - 'apps/web/tools/browser-harnesses/drawing-ux-v2*'
      - 'scripts/verify-studio-drawing-ux-v2.mjs'
      - 'scripts/lib/studio-drawing-*'
      - 'scripts/lib/studio-restricted-drawing-context.mjs'
      - 'apps/web/src/domains/creator/useStudioRecentColors*'
      - 'apps/web/src/domains/creator/studio-local-database-worker-handoff*'
      - 'apps/web/src/domains/creator/studio-local-database.worker.ts'
      - 'scripts/verify-studio-discovery-ux.mts'
      - '.github/workflows/studio-discovery-ux.yml'

  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Focused creator lint
        run: >-
          pnpm exec eslint --max-warnings=0
          apps/web/src/domains/creator/brush
          apps/web/src/domains/creator/filter
          apps/web/src/domains/creator/studio-tool-search*
          apps/web/src/domains/creator/studio-brush.ts
          apps/web/src/domains/creator/studio-creative-ux.ts
          apps/web/src/domains/creator/studio-basic-brush-expansion.test.ts
          apps/web/src/domains/creator/StudioUnifiedBrushPicker.test.tsx
          apps/web/src/domains/creator/studio-main-menu-items-filter.ts
          apps/web/src/domains/creator/studio-main-menu-items-filter.test.ts
          scripts/verify-studio-discovery-ux.mts
      - name: Brush, filter and discovery unit contracts
        run: >-
          pnpm exec vitest run
          apps/web/src/domains/creator/brush
          apps/web/src/domains/creator/filter
          apps/web/src/domains/creator/color
          apps/web/src/domains/creator/useStudioRecentColors.test.tsx
          apps/web/src/domains/creator/studio-local-database-worker-handoff.test.ts
          scripts/lib/studio-drawing-browser-context.test.ts
          scripts/lib/studio-drawing-isolated-origin.test.ts
          apps/web/src/domains/creator/studio-tool-search.test.ts
          apps/web/src/domains/creator/studio-basic-brush-expansion.test.ts
          apps/web/src/domains/creator/StudioUnifiedBrushPicker.test.tsx
          apps/web/src/domains/creator/studio-main-menu-items-filter.test.ts
      - name: Explain global gate ownership
        run: echo 'Repository-wide typecheck remains owned once by required CI/core.'

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm run build:bundle
      - run: test -s dist/.vite/manifest.json
      - uses: actions/upload-artifact@v6
        with:
          name: studio-discovery-dist
          path: dist
          include-hidden-files: true
          retention-days: 2

  browser:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      STUDIO_DISCOVERY_QA_DIR: /tmp/studio-discovery-evidence
      TOONSPECTRUM_BRUSH_VERIFY_DIR: /tmp/studio-discovery-evidence
      TOONSPECTRUM_VERIFY_DIR: /tmp/studio-discovery-evidence
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Cache drawing verification browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-drawing-three-engines-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install drawing browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium firefox webkit
      - name: Install drawing browser dependencies
        run: pnpm exec playwright install-deps chromium firefox webkit
      - uses: actions/download-artifact@v6
        with:
          name: studio-discovery-dist
          path: dist
      - run: test -s dist/.vite/manifest.json
      - name: Responsive keyboard and production editor integration
        run: pnpm exec tsx scripts/verify-studio-discovery-ux.mts
      - name: Representative brush pixel and undo proof
        env:
          TOONSPECTRUM_BRUSH_VERIFY_STAGE: desktop
          TOONSPECTRUM_BRUSH_SURVEY: '1'
          TOONSPECTRUM_BRUSH_VERIFY_SETTLED_DUMP: '1'
          TOONSPECTRUM_BRUSH_VERIFY_IDS: gpen,pencil--side-shade,watercolor,oil--filbert-ribbon,airbrush,standard-eraser,web-cross-hatch-pen,web-radial-burst
        run: pnpm exec tsx scripts/verify-studio-brushes.mts
      - name: Drawing tools and color transactions with real SQLite persistence
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vite --config apps/web/vite.config.ts --host 127.0.0.1 --port 5219 --strictPort > /tmp/studio-drawing-ux-vite.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5219/tools/browser-harnesses/drawing-ux-v2.html > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-studio-drawing-ux-v2.mjs http://127.0.0.1:5219 chromium,firefox,webkit
      - name: Preserve drawing UX evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: studio-drawing-ux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/drawing-ux-v2
            /tmp/studio-drawing-ux-vite.log
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve screenshots and receipts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: studio-discovery-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/studio-discovery-evidence
          retention-days: 7
          if-no-files-found: warn
