name: Consolidate ToonStudio branches once

on:
  push:
    branches:
      - feat/toonstudio-session-completion-followup-20260911
    paths:
      - .github/workflows/consolidate-toonstudio-branches-once.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: consolidate-toonstudio-branches-once
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI: "true"
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=8192
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: feat/toonstudio-session-completion-followup-20260911
      MANIFEST_PATH: docs/rewrite/toonstudio-branch-consolidation-20260912.md
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-session-completion-followup-20260911
          fetch-depth: 0
          persist-credentials: true

      - name: Configure repository and snapshot branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "toonstudio-consolidation-bot"
          git config user.email "toonstudio-consolidation-bot@users.noreply.github.com"
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          python <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import json
          import subprocess

          target = "feat/toonstudio-session-completion-followup-20260911"
          raw = subprocess.check_output(
              ["git", "for-each-ref", "--format=%(refname:strip=3)\t%(objectname)", "refs/remotes/origin"],
              text=True,
          ).splitlines()
          branches = []
          for line in raw:
              if "\t" not in line:
                  continue
              name, sha = line.split("\t", 1)
              if name in {"HEAD", "main", target}:
                  continue
              if name.startswith(("feat/toonstudio-", "chore/toonstudio-")) or name == "fix/remove-transient-finalizer":
                  branches.append({"name": name, "sha": sha})
          branches.sort(key=lambda item: item["name"])
          grouped = defaultdict(list)
          for branch in branches:
              grouped[branch["sha"]].append(branch["name"])
          payload = {
              "schemaVersion": 1,
              "targetBranch": target,
              "branches": branches,
              "duplicateGroups": [
                  {"sha": sha, "branches": names}
                  for sha, names in sorted(grouped.items())
                  if len(names) > 1
              ],
          }
          Path("/tmp/toonstudio-branches.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n")
          Path("/tmp/toonstudio-tips.tsv").write_text(
              "".join(f"{sha}\t{names[0]}\n" for sha, names in sorted(grouped.items()))
          )
          print(f"snapshot: {len(branches)} branches, {len(grouped)} unique tips")
          PY

      - name: Merge current main and preserve superseded histories
        shell: bash
        run: |
          set -euo pipefail
          if ! git merge --no-edit origin/main; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if ((${#conflicts[@]} == 0)); then
              exit 1
            fi
            for path in "${conflicts[@]}"; do
              case "$path" in
                .github/workflows/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml)
                  git checkout --theirs -- "$path"
                  ;;
                *)
                  git checkout --ours -- "$path"
                  ;;
              esac
              git add -- "$path"
            done
            git commit -m "chore(studio): reconcile current main"
          fi

          while IFS=$'\t' read -r sha representative; do
            [[ -n "$sha" ]] || continue
            if git merge-base --is-ancestor "$sha" HEAD; then
              echo "already preserved: $representative"
              continue
            fi
            git merge --no-ff -s ours --no-edit \
              -m "chore(studio): preserve superseded history ($representative)" \
              "$sha"
          done < /tmp/toonstudio-tips.tsv

      - name: Remove transient workflows and write manifest
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import subprocess

          root = Path(".github/workflows")
          keep = {
              "toonstudio-integration.yml",
              "toonstudio-feature-reachability.yml",
              "toonstudio-session-goals.yml",
          }
          tokens = {
              "apply", "repair", "finalize", "finalizer", "sync", "stage",
              "snapshot", "validate", "validation", "install", "consolidate", "continuation",
          }
          removed = []
          if root.exists():
              for path in sorted(root.iterdir()):
                  if not path.is_file() or path.suffix not in {".yml", ".yaml"}:
                      continue
                  name = path.name.lower()
                  if path.name in keep:
                      continue
                  if ("toonstudio" in name and any(token in name for token in tokens)) or name.startswith("pr-1307-source-diagnostics"):
                      path.unlink()
                      removed.append(path.as_posix())

          snapshot = json.loads(Path("/tmp/toonstudio-branches.json").read_text())
          grouped = defaultdict(list)
          for branch in snapshot["branches"]:
              grouped[branch["sha"]].append(branch["name"])

          lines = [
              "# ToonStudio 브랜치 통합 기록",
              "",
              f"- 생성 시각: {datetime.now(timezone.utc).isoformat()}",
              "- 기준 브랜치: `main`",
              f"- 단일 통합 브랜치: `{snapshot['targetBranch']}`",
              f"- 정리 대상 브랜치: {len(snapshot['branches'])}개",
              f"- 고유 branch tip: {len(grouped)}개",
              "- 정책: 각 기존 tip을 통합 브랜치의 조상으로 보존하고 현재 main 및 검증된 통합 트리를 제품 정본으로 유지합니다.",
              "",
              "## 정리 대상",
              "",
              "| 브랜치 | 마지막 SHA | 이력 보존 | ref 정리 |",
              "|---|---|---|---|",
          ]
          for branch in snapshot["branches"]:
              preserved = subprocess.run(
                  ["git", "merge-base", "--is-ancestor", branch["sha"], "HEAD"],
                  check=False,
              ).returncode == 0
              lines.append(
                  f"| `{branch['name']}` | `{branch['sha'][:12]}` | "
                  f"{'보존됨' if preserved else '확인 필요'} | 삭제 예정 |"
              )
          lines.extend(["", "## 같은 SHA를 가리키던 중복 브랜치", ""])
          duplicates = 0
          for sha, names in sorted(grouped.items()):
              if len(names) < 2:
                  continue
              duplicates += 1
              lines.append(f"- `{sha[:12]}`: " + ", ".join(f"`{name}`" for name in names))
          if duplicates == 0:
              lines.append("- 없음")
          lines.extend(["", "## 제거한 일회성 워크플로", ""])
          lines.extend([f"- `{path}`" for path in removed] or ["- 없음"])
          lines.extend([
              "",
              "## 검증 조건",
              "",
              "- `pnpm run verify:studio-session-complete`",
              "- `node scripts/verify-toonstudio-feature-reachability.mjs`",
              "- `bash scripts/verify-toonstudio-integration.sh core`",
              "- `bash scripts/verify-toonstudio-integration.sh ui`",
              "- `bash scripts/verify-toonstudio-integration.sh editor`",
              "- `pnpm exec tsc -p tsconfig.json --noEmit --pretty false`",
              "- `pnpm run build:bundle`",
              "",
          ])
          path = Path("docs/rewrite/toonstudio-branch-consolidation-20260912.md")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text("\n".join(lines))
          PY

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Validate consolidated product tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          pnpm run verify:studio-session-complete
          node scripts/verify-toonstudio-feature-reachability.mjs
          bash scripts/verify-toonstudio-integration.sh core
          bash scripts/verify-toonstudio-integration.sh ui
          bash scripts/verify-toonstudio-integration.sh editor
          pnpm exec tsc -p tsconfig.json --noEmit --pretty false
          pnpm run build:bundle

      - name: Push consolidated history and product tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(studio): consolidate session branches"
          fi
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Delete preserved obsolete branch refs
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/toonstudio-delete-results.tsv
          jq -r '.branches[] | [.name, .sha] | @tsv' /tmp/toonstudio-branches.json \
          | while IFS=$'\t' read -r branch sha; do
              [[ -n "$branch" ]] || continue
              if ! git merge-base --is-ancestor "$sha" HEAD; then
                printf '%s\t%s\tnot-preserved\n' "$branch" "$sha" >> /tmp/toonstudio-delete-results.tsv
                continue
              fi
              if git push origin --delete "$branch"; then
                printf '%s\t%s\tdeleted\n' "$branch" "$sha" >> /tmp/toonstudio-delete-results.tsv
                continue
              fi
              encoded="$(python -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")"
              status="$(curl --silent --show-error --output /tmp/delete-response.json --write-out '%{http_code}' \
                -X DELETE \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}" || true)"
              if [[ "$status" == "204" || "$status" == "422" ]]; then
                printf '%s\t%s\tdeleted\n' "$branch" "$sha" >> /tmp/toonstudio-delete-results.tsv
              else
                printf '%s\t%s\tdelete-failed-%s\n' "$branch" "$sha" "$status" >> /tmp/toonstudio-delete-results.tsv
              fi
            done

      - name: Record cleanup result
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          manifest = Path("docs/rewrite/toonstudio-branch-consolidation-20260912.md")
          lines = manifest.read_text().splitlines()
          results = {}
          path = Path("/tmp/toonstudio-delete-results.tsv")
          if path.exists():
              for line in path.read_text().splitlines():
                  if not line.strip():
                      continue
                  branch, _sha, status = line.split("\t", 2)
                  results[branch] = status
          labels = {
              "deleted": "삭제 완료",
              "not-preserved": "보존 확인 필요",
          }
          for index, row in enumerate(lines):
              for branch, status in results.items():
                  if not row.startswith(f"| `{branch}` |"):
                      continue
                  columns = row.split("|")
                  columns[-2] = f" {labels.get(status, status)} "
                  lines[index] = "|".join(columns)
                  break
          deleted = sum(value == "deleted" for value in results.values())
          failed = len(results) - deleted
          lines.extend([
              "",
              "## 실행 결과",
              "",
              f"- 삭제 완료: {deleted}개",
              f"- 삭제하지 못한 브랜치: {failed}개",
              "",
          ])
          manifest.write_text("\n".join(lines))
          PY
          git add "$MANIFEST_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "docs(studio): record branch cleanup results"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Report remaining branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t remaining < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
              | grep -E '^(feat|chore)/toonstudio-|^fix/remove-transient-finalizer$' \
              | grep -v "^${TARGET_BRANCH}$" \
              || true
          )
          {
            echo "### ToonStudio branch consolidation"
            echo
            echo "- canonical branch: \`${TARGET_BRANCH}\`"
            echo "- remaining superseded branches: ${#remaining[@]}"
            if ((${#remaining[@]})); then
              printf -- '- `%s`\n' "${remaining[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
