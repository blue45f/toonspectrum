name: Character naturalness workbench
on:
  push:
    branches: [fix/character-natural-hands-preview-20260905]
    paths:
      - .github/workflows/character-naturalness-workbench.yml
      - .github/character-naturalness.patch
permissions:
  contents: write
concurrency:
  group: character-naturalness-workbench
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            src
            lib
            scripts
            tests
            tools
            config
            .github
      - name: Export source snapshot
        run: |
          mkdir -p /tmp/character-workbench
          git rev-parse HEAD > /tmp/character-workbench/source-sha.txt
          tar --exclude=.git --exclude=node_modules -czf /tmp/character-workbench/source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: character-naturalness-source
          path: /tmp/character-workbench
          retention-days: 2
