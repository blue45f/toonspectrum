name: Brush source baseline audit
on:
  push:
    branches: [feat/brush-material-engine-20260913]
    paths: [.github/workflows/brush-source-audit-20260913.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/web/src
            packages
            scripts
            tests
            .github/workflows
      - name: Archive tracked source only
        shell: bash
        run: |
          python3 - <<'PY'
          import os, subprocess
          roots = subprocess.check_output(['git', 'ls-tree', '--name-only', 'HEAD'], text=True).splitlines()
          config = [p for p in roots if p.endswith(('.json', '.yaml', '.yml', '.ts', '.mjs', '.cjs')) and not p.startswith('.env')]
          paths = ['apps/web/src', 'packages', 'scripts', 'tests', '.github/workflows'] + config
          subprocess.run(['git', 'archive', '--format=tar.gz', '-o', os.environ['RUNNER_TEMP'] + '/brush-source-baseline.tar.gz', 'HEAD', *paths], check=True)
          PY
          git rev-parse HEAD > "$RUNNER_TEMP/brush-source-sha.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: brush-source-baseline
          path: |
            ${{ runner.temp }}/brush-source-baseline.tar.gz
            ${{ runner.temp }}/brush-source-sha.txt
          retention-days: 1
          if-no-files-found: error
