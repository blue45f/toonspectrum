name: ToonStudio continuation source snapshot

on:
  push:
    branches:
      - feat/toonstudio-session-completion-followup-20260911
    paths:
      - .github/workflows/toonstudio-continuation-source-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout continuation branch
        uses: actions/checkout@v4
        with:
          ref: feat/toonstudio-session-completion-followup-20260911
          fetch-depth: 1

      - name: Pack validation source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/toonstudio-source"
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig*.json vitest.config.* eslint.config.mjs "$RUNNER_TEMP/toonstudio-source/" 2>/dev/null || true
          cp -R scripts "$RUNNER_TEMP/toonstudio-source/scripts"
          mkdir -p "$RUNNER_TEMP/toonstudio-source/apps/web"
          cp -R apps/web/src "$RUNNER_TEMP/toonstudio-source/apps/web/src"
          if [[ -d apps/web/public/i18n ]]; then
            mkdir -p "$RUNNER_TEMP/toonstudio-source/apps/web/public"
            cp -R apps/web/public/i18n "$RUNNER_TEMP/toonstudio-source/apps/web/public/i18n"
          fi
          cp -R packages "$RUNNER_TEMP/toonstudio-source/packages"
          [[ -d patches ]] && cp -R patches "$RUNNER_TEMP/toonstudio-source/patches"
          tar -C "$RUNNER_TEMP/toonstudio-source" -czf "$RUNNER_TEMP/toonstudio-continuation-source.tar.gz" .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: toonstudio-continuation-source
          path: ${{ runner.temp }}/toonstudio-continuation-source.tar.gz
          if-no-files-found: error
          retention-days: 1
