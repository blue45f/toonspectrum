name: Cleanup merged branches

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-merged-branches.yml
      - scripts/cleanup-merged-branches.mjs
      - scripts/cleanup-superseded-actions-runs.mjs
      - scripts/publish-cleanup-summary.mjs

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # Preserve a cleanup that has acquired a runner; a later tick may replace only stale pending work.
  # The v3 suffix detaches this generation from the failed summary runner while preserving active work.
  group: merged-branch-cleanup-v3
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete integrated branches and stale Actions runs
    runs-on: ubuntu-slim
    timeout-minutes: 8
    steps:
      - name: Fetch cleanup scripts from the triggering main commit
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for script in \
            cleanup-merged-branches.mjs \
            cleanup-superseded-actions-runs.mjs \
            publish-cleanup-summary.mjs
          do
            script_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SOURCE_SHA}/scripts/${script}"
            curl --fail --silent --show-error --location \
              "$script_url" \
              --output "$RUNNER_TEMP/${script}"
            node --check "$RUNNER_TEMP/${script}"
          done

      - name: Remove only branches proven to be integrated
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/cleanup-merged-branches.mjs" --all --apply \
            | tee "$RUNNER_TEMP/cleanup-report.json"

      - name: Cancel superseded queued and running workflow runs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/cleanup-superseded-actions-runs.mjs" \
            --apply \
            --report "$RUNNER_TEMP/actions-queue-cleanup.json"

      - name: Publish cleanup summary
        if: always()
        shell: bash
        run: node "$RUNNER_TEMP/publish-cleanup-summary.mjs"
