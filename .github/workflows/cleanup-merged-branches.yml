name: Cleanup merged branches and stale Actions runs

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-merged-branches.yml
      - scripts/cleanup-merged-branches.mjs
      - scripts/cleanup-superseded-actions-runs.mjs

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: merged-branch-cleanup-v3
  cancel-in-progress: true

jobs:
  cleanup:
    name: Audit integrated branches and drain stale Actions runs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - name: Fetch cleanup scripts from the triggering main commit
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for script in cleanup-merged-branches.mjs cleanup-superseded-actions-runs.mjs; do
            script_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SOURCE_SHA}/scripts/${script}"
            curl --fail --silent --show-error --location \
              "$script_url" \
              --output "$RUNNER_TEMP/${script}"
            node --check "$RUNNER_TEMP/${script}"
          done

      - name: Audit branches without deleting active work
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/cleanup-merged-branches.mjs" --all \
            | tee "$RUNNER_TEMP/cleanup-report.json"

      - name: Cancel superseded queued and running workflow runs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/cleanup-superseded-actions-runs.mjs" \
            --apply \
            --report "$RUNNER_TEMP/actions-queue-cleanup.json"

      - name: Publish cleanup summary
        if: always()
        shell: bash
        run: |
          set -u
          {
            echo "### Branch cleanup audit"
            echo
            if [[ -s "$RUNNER_TEMP/cleanup-report.json" ]]; then
              deleted="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).deleted.length' "$RUNNER_TEMP/cleanup-report.json")"
              skipped="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).skipped.length' "$RUNNER_TEMP/cleanup-report.json")"
              echo "- Destructive branch deletion: disabled"
              echo "- Integrated branch candidates (dry-run): ${deleted}"
              echo "- Preserved or unique branches: ${skipped}"
            else
              echo "- No branch audit report was produced."
            fi

            echo
            echo "### Actions queue cleanup"
            echo
            if [[ -s "$RUNNER_TEMP/actions-queue-cleanup.json" ]]; then
              scanned="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).activeRunsScanned' "$RUNNER_TEMP/actions-queue-cleanup.json")"
              candidates="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).candidateRuns' "$RUNNER_TEMP/actions-queue-cleanup.json")"
              cancelled="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).cancelled.length' "$RUNNER_TEMP/actions-queue-cleanup.json")"
              terminal="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).skipped.length' "$RUNNER_TEMP/actions-queue-cleanup.json")"
              echo "- Active push/PR runs scanned: ${scanned}"
              echo "- Superseded/closed-PR candidates: ${candidates}"
              echo "- Cancellation requests accepted: ${cancelled}"
              echo "- Already terminal while cleaning: ${terminal}"
            else
              echo "- No Actions queue cleanup report was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
