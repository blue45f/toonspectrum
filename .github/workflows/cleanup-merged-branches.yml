name: Cleanup merged branches and stale Actions runs

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: merged-branch-cleanup-v5
  cancel-in-progress: true

jobs:
  main-only-convergence:
    name: Delete every non-main branch for explicit main-only convergence
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[main-only-convergence]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete all non-default branch refs
        shell: bash
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' \
            | while IFS= read -r branch; do
                [[ -n "$branch" ]] || continue
                [[ "$branch" == "$default_branch" ]] && continue
                encoded="$(jq -rn --arg value "$branch" '$value|@uri')"
                echo "Deleting branch: $branch"
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}" || true
              done

  cleanup:
    name: Audit integrated branches and drain stale Actions runs
    if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[main-only-convergence]')) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - name: Fetch cleanup scripts from the triggering main commit
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for script in \
            cleanup-merged-branches.mjs \
            cleanup-superseded-actions-runs.mjs \
            publish-cleanup-summary.mjs
          do
            script_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SOURCE_SHA}/scripts/${script}"
            curl --fail --silent --show-error --location \
              "$script_url" \
              --output "$RUNNER_TEMP/${script}"
            node --check "$RUNNER_TEMP/${script}"
          done

      - name: Audit integrated branches without deleting them
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/cleanup-merged-branches.mjs" --all \
            | tee "$RUNNER_TEMP/cleanup-report.json"

      - name: Cancel superseded queued and running workflow runs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/cleanup-superseded-actions-runs.mjs" \
            --apply \
            --report "$RUNNER_TEMP/actions-queue-cleanup.json"

      - name: Publish cleanup summary
        if: always()
        shell: bash
        run: node "$RUNNER_TEMP/publish-cleanup-summary.mjs"
