name: Cleanup merged branches

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-merged-branches.yml
      - scripts/cleanup-merged-branches.mjs

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # Preserve a cleanup that has acquired a runner; a later tick may replace only stale pending work.
  # The v2 suffix detaches this lightweight runner generation from legacy queued ubuntu-latest runs.
  group: merged-branch-cleanup-v2
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete integrated branches and stale Actions runs
    runs-on: ubuntu-slim
    timeout-minutes: 8
    steps:
      - name: Fetch cleanup script from the triggering main commit
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          script_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SOURCE_SHA}/scripts/cleanup-merged-branches.mjs"
          curl --fail --silent --show-error --location \
            "$script_url" \
            --output "$RUNNER_TEMP/cleanup-merged-branches.mjs"
          node --check "$RUNNER_TEMP/cleanup-merged-branches.mjs"

      - name: Remove only branches proven to be integrated
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/cleanup-merged-branches.mjs" --all --apply \
            | tee "$RUNNER_TEMP/cleanup-report.json"

      - name: Cancel superseded queued and running workflow runs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { writeFileSync } = require("node:fs");

          const token = process.env.GITHUB_TOKEN;
          const currentRunId = Number(process.env.CURRENT_RUN_ID);
          const repository = process.env.GITHUB_REPOSITORY;
          if (!token || !repository || !Number.isFinite(currentRunId)) {
            throw new Error("Missing Actions queue cleanup environment.");
          }

          const headers = {
            accept: "application/vnd.github+json",
            authorization: `Bearer ${token}`,
            "x-github-api-version": "2022-11-28",
            "user-agent": "toonspectrum-actions-queue-cleanup",
          };

          async function request(path, init = {}) {
            const response = await fetch(`https://api.github.com/repos/${repository}${path}`, {
              ...init,
              headers: { ...headers, ...(init.headers ?? {}) },
            });
            if (!response.ok) {
              const text = await response.text();
              const error = new Error(`${init.method ?? "GET"} ${path} -> ${response.status}: ${text}`);
              error.status = response.status;
              throw error;
            }
            if (response.status === 204) return null;
            const text = await response.text();
            return text ? JSON.parse(text) : null;
          }

          async function listRuns(status) {
            const runs = [];
            for (let page = 1; page <= 20; page += 1) {
              const data = await request(`/actions/runs?status=${status}&per_page=100&page=${page}`);
              const batch = data?.workflow_runs ?? [];
              runs.push(...batch);
              if (batch.length < 100) break;
            }
            return runs;
          }

          const runs = [
            ...(await listRuns("queued")),
            ...(await listRuns("in_progress")),
          ].filter((run) =>
            Number(run.id) !== currentRunId
            && (run.event === "push" || run.event === "pull_request"),
          );

          const groups = new Map();
          for (const run of runs) {
            const key = `${run.workflow_id}:${run.event}:${run.head_branch ?? run.head_sha}`;
            const bucket = groups.get(key) ?? [];
            bucket.push(run);
            groups.set(key, bucket);
          }

          const candidates = new Map();
          for (const bucket of groups.values()) {
            bucket.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
            for (const run of bucket.slice(1)) {
              candidates.set(Number(run.id), { run, reason: "superseded" });
            }
          }

          const prStateCache = new Map();
          for (const run of runs) {
            if (run.event !== "pull_request") continue;
            const number = run.pull_requests?.[0]?.number;
            if (!Number.isInteger(number)) continue;
            let state = prStateCache.get(number);
            if (!state) {
              const pr = await request(`/pulls/${number}`);
              state = pr?.state ?? "unknown";
              prStateCache.set(number, state);
            }
            if (state !== "open") {
              candidates.set(Number(run.id), { run, reason: `pull-request-${state}` });
            }
          }

          const cancelled = [];
          const skipped = [];
          for (const { run, reason } of candidates.values()) {
            try {
              await request(`/actions/runs/${run.id}/cancel`, { method: "POST" });
              cancelled.push({
                id: run.id,
                workflow: run.name,
                event: run.event,
                branch: run.head_branch,
                reason,
              });
            } catch (error) {
              if (error?.status === 409) {
                skipped.push({ id: run.id, reason: "already-terminal" });
                continue;
              }
              throw error;
            }
          }

          const report = {
            activeRunsScanned: runs.length,
            candidateRuns: candidates.size,
            cancelled,
            skipped,
          };
          writeFileSync(
            `${process.env.RUNNER_TEMP}/actions-queue-cleanup.json`,
            `${JSON.stringify(report, null, 2)}\n`,
          );
          console.log(JSON.stringify(report));
          NODE

      - name: Publish cleanup summary
        if: always()
        shell: bash
        run: |
          if [[ ! -s "$RUNNER_TEMP/cleanup-report.json" ]]; then
            {
              echo "### Merged branch cleanup"
              echo
              echo "No branch cleanup report was produced."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            node <<'NODE'
            const { appendFileSync, readFileSync } = require("node:fs");
            const report = JSON.parse(
              readFileSync(`${process.env.RUNNER_TEMP}/cleanup-report.json`, "utf8"),
            );
            const lines = [
              "### Merged branch cleanup",
              "",
              `- Deleted: ${report.deleted.length}`,
              `- Closed duplicate PRs: ${report.closedPullRequests.length}`,
              `- Preserved or skipped: ${report.skipped.length}`,
            ];
            if (report.deleted.length > 0) {
              lines.push("", "#### Deleted branches");
              for (const item of report.deleted) {
                lines.push(`- \`${item.branch}\` (${item.proof})`);
              }
            }
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
            NODE
          fi

          if [[ -s "$RUNNER_TEMP/actions-queue-cleanup.json" ]]; then
            node <<'NODE'
            const { appendFileSync, readFileSync } = require("node:fs");
            const report = JSON.parse(
              readFileSync(`${process.env.RUNNER_TEMP}/actions-queue-cleanup.json`, "utf8"),
            );
            const lines = [
              "",
              "### Actions queue cleanup",
              "",
              `- Active push/PR runs scanned: ${report.activeRunsScanned}`,
              `- Superseded/closed-PR candidates: ${report.candidateRuns}`,
              `- Cancellation requests accepted: ${report.cancelled.length}`,
              `- Already terminal while cleaning: ${report.skipped.length}`,
            ];
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
            NODE
          fi
