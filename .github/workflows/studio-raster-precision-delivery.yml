name: Studio raster precision delivery

on:
  push:
    branches:
      - feat/studio-pixel-pencil-pro-v2-20260909

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: studio-raster-precision-delivery
  cancel-in-progress: true

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      FEATURE_BRANCH: feat/studio-pixel-pencil-pro-v2-20260909
    steps:
      - name: Cancel superseded pixel-pencil runs
        run: |
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs" \
            -F branch="${FEATURE_BRANCH}" \
            -F per_page=100 \
            --jq '.workflow_runs[] | select(.status == "queued" or .status == "in_progress") | select(.name | test("pixel pencil"; "i")) | .id' \
          | while read -r run_id; do
              if [ -n "${run_id}" ]; then
                gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
              fi
            done

      - name: Sparse partial-clone feature and main
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git sparse-checkout init --cone
          git sparse-checkout set \
            .github \
            .husky \
            apps \
            config \
            crates \
            docs \
            packages \
            patches \
            scripts \
            third_party
          git -c protocol.version=2 fetch \
            --depth=80 \
            --filter=blob:none \
            origin \
            "+refs/heads/${FEATURE_BRANCH}:refs/remotes/origin/${FEATURE_BRANCH}" \
            "+refs/heads/main:refs/remotes/origin/main"
          git checkout -B "${FEATURE_BRANCH}" "refs/remotes/origin/${FEATURE_BRANCH}"

      - name: Apply renderer-neutral pixel-pencil core
        run: |
          if ! grep -Fq 'export function planStudioPixelPencilSampleUpdate' \
            apps/web/src/domains/creator/studio-pixel-pencil.ts; then
            python3 scripts/prepare-studio-pixel-pencil-pro-core.py
            python3 scripts/apply-studio-pixel-pencil-pro-core.py
          fi
          grep -F 'STUDIO_PIXEL_PENCIL_MAX_STROKE_WIDTH = 64' \
            apps/web/src/domains/creator/studio-pixel-pencil.ts
          grep -F 'pixelSampleUpdate === "replace-tail"' \
            apps/web/src/domains/creator/studio-cuttoon-editor/studio-cuttoon-stage-pointers-freehand.ts

      - name: Apply professional desktop and mobile controls
        run: |
          if ! grep -Fq 'data-studio-pixel-pencil-professional="true"' \
            apps/web/src/domains/creator/brush/StudioDrawOptionsBar.tsx; then
            python3 scripts/prepare-studio-pixel-pencil-pro-ui.py
            python3 scripts/apply-studio-pixel-pencil-pro-ui.py
          fi
          grep -F 'data-studio-pixel-pencil-professional="true"' \
            apps/web/src/domains/creator/brush/StudioDrawOptionsBar.tsx
          grep -F 'data-studio-mobile-pixel-pencil-professional="true"' \
            apps/web/src/domains/creator/StudioMobileEditingDock.tsx
          grep -F '| "silk";' \
            apps/web/src/domains/creator/StudioInspectorDrawModeControls.tsx

      - name: Remove superseded one-shot automation
        run: |
          rm -f .github/workflows/apply-studio-pixel-pencil-pro-core.yml
          rm -f .github/workflows/apply-studio-pixel-pencil-pro-core-v2.yml
          rm -f .github/workflows/apply-studio-pixel-pencil-pro-core-v3.yml
          rm -f .github/workflows/apply-studio-pixel-pencil-pro-combined.yml
          rm -f .github/workflows/verify-studio-pixel-pencil-pro.yml
          rm -f .github/workflows/finalize-studio-pixel-pencil-pro.yml
          rm -f .github/workflows/finalize-studio-pixel-pencil-pro-ready.yml
          rm -f .github/workflows/deliver-studio-pixel-pencil-pro.yml
          rm -f scripts/apply-studio-pixel-pencil-pro-core.py
          rm -f scripts/prepare-studio-pixel-pencil-pro-core.py
          rm -f scripts/apply-studio-pixel-pencil-pro-ui.py
          rm -f scripts/prepare-studio-pixel-pencil-pro-ui.py

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and autofix product sources
        run: |
          pnpm exec prettier --write \
            apps/web/src/domains/creator/studio-pixel-pencil.ts \
            apps/web/src/domains/creator/studio-pixel-pencil.test.ts \
            apps/web/src/domains/creator/StudioInspectorDrawModeControls.tsx \
            apps/web/src/domains/creator/StudioInspectorDrawModeControls.test.tsx \
            apps/web/src/domains/creator/StudioInspectorDrawingSection.tsx \
            apps/web/src/domains/creator/StudioMobileEditingDock.tsx \
            apps/web/src/domains/creator/brush/StudioDrawOptionsBar.tsx \
            apps/web/src/domains/creator/brush/studio-brush-mode-width.ts \
            apps/web/src/domains/creator/brush/studio-brush-mode-width.test.ts \
            apps/web/src/domains/creator/brush/studio-draw-hud.ts \
            apps/web/src/domains/creator/brush/studio-draw-pointer-start-plan.ts \
            apps/web/src/domains/creator/brush/studio-draw-pointer-start-plan.test.ts \
            apps/web/src/domains/creator/brush/studio-pixel-pencil-professional-ui-boundary.test.ts \
            apps/web/src/domains/creator/canvas/StudioCanvasStageHud.tsx \
            apps/web/src/domains/creator/studio-cuttoon-editor/studio-cuttoon-stage-pointers-freehand.ts \
            docs/studio-pixel-pencil-pro-benchmark-2026-09-09.md
          pnpm exec eslint --fix \
            apps/web/src/domains/creator/studio-pixel-pencil.ts \
            apps/web/src/domains/creator/studio-pixel-pencil.test.ts \
            apps/web/src/domains/creator/StudioInspectorDrawModeControls.tsx \
            apps/web/src/domains/creator/StudioInspectorDrawModeControls.test.tsx \
            apps/web/src/domains/creator/StudioInspectorDrawingSection.tsx \
            apps/web/src/domains/creator/StudioMobileEditingDock.tsx \
            apps/web/src/domains/creator/brush/StudioDrawOptionsBar.tsx \
            apps/web/src/domains/creator/brush/studio-brush-mode-width.ts \
            apps/web/src/domains/creator/brush/studio-brush-mode-width.test.ts \
            apps/web/src/domains/creator/brush/studio-draw-hud.ts \
            apps/web/src/domains/creator/brush/studio-draw-pointer-start-plan.ts \
            apps/web/src/domains/creator/brush/studio-draw-pointer-start-plan.test.ts \
            apps/web/src/domains/creator/brush/studio-pixel-pencil-professional-ui-boundary.test.ts \
            apps/web/src/domains/creator/canvas/StudioCanvasStageHud.tsx \
            apps/web/src/domains/creator/studio-cuttoon-editor/studio-cuttoon-stage-pointers-freehand.ts

      - name: Run focused regressions
        shell: bash
        run: |
          tests=(
            apps/web/src/domains/creator/studio-pixel-pencil.test.ts
            apps/web/src/domains/creator/StudioInspectorDrawModeControls.test.tsx
            apps/web/src/domains/creator/brush/studio-brush-mode-width.test.ts
            apps/web/src/domains/creator/brush/studio-draw-pointer-start-plan.test.ts
            apps/web/src/domains/creator/brush/studio-pixel-pencil-professional-ui-boundary.test.ts
          )
          for candidate in \
            apps/web/src/domains/creator/brush/studio-draw-hud.test.ts \
            apps/web/src/domains/creator/brush/StudioDrawOptionsBar.test.tsx \
            apps/web/src/domains/creator/StudioMobileEditingDock.test.tsx \
            apps/web/src/domains/creator/canvas/StudioCanvasStageHud.test.tsx; do
            if [ -f "${candidate}" ]; then tests+=("${candidate}"); fi
          done
          pnpm exec vitest run "${tests[@]}"

      - name: Typecheck web workspace
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Build production web bundle
        run: pnpm run build:bundle

      - name: Commit validated implementation
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          if git diff --cached --quiet; then
            git commit --allow-empty -m "feat(studio): validate raster precision workflow"
          else
            git commit -m "feat(studio): upgrade pixel pencil professional workflow"
          fi

      - name: Rebase onto latest main
        run: |
          git fetch --depth=80 origin main
          git rebase origin/main

      - name: Revalidate after rebase
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm exec eslint \
            apps/web/src/domains/creator/studio-pixel-pencil.ts \
            apps/web/src/domains/creator/studio-pixel-pencil.test.ts \
            apps/web/src/domains/creator/StudioInspectorDrawModeControls.tsx \
            apps/web/src/domains/creator/StudioInspectorDrawModeControls.test.tsx \
            apps/web/src/domains/creator/StudioInspectorDrawingSection.tsx \
            apps/web/src/domains/creator/StudioMobileEditingDock.tsx \
            apps/web/src/domains/creator/brush/StudioDrawOptionsBar.tsx \
            apps/web/src/domains/creator/brush/studio-brush-mode-width.ts \
            apps/web/src/domains/creator/brush/studio-brush-mode-width.test.ts \
            apps/web/src/domains/creator/brush/studio-draw-hud.ts \
            apps/web/src/domains/creator/brush/studio-draw-pointer-start-plan.ts \
            apps/web/src/domains/creator/brush/studio-draw-pointer-start-plan.test.ts \
            apps/web/src/domains/creator/brush/studio-pixel-pencil-professional-ui-boundary.test.ts \
            apps/web/src/domains/creator/canvas/StudioCanvasStageHud.tsx \
            apps/web/src/domains/creator/studio-cuttoon-editor/studio-cuttoon-stage-pointers-freehand.ts
          pnpm exec vitest run \
            apps/web/src/domains/creator/studio-pixel-pencil.test.ts \
            apps/web/src/domains/creator/StudioInspectorDrawModeControls.test.tsx \
            apps/web/src/domains/creator/brush/studio-brush-mode-width.test.ts \
            apps/web/src/domains/creator/brush/studio-draw-pointer-start-plan.test.ts \
            apps/web/src/domains/creator/brush/studio-pixel-pencil-professional-ui-boundary.test.ts
          pnpm exec tsc -p tsconfig.json --noEmit
          pnpm run build:bundle
          git diff --check

      - name: Remove coordinator and push reviewed branch
        run: |
          rm -f .github/workflows/studio-raster-precision-delivery.yml
          git add -A
          git commit --amend --no-edit
          git fetch origin "${FEATURE_BRANCH}"
          git push --force-with-lease origin HEAD:"${FEATURE_BRANCH}"

      - name: Resolve or create MR
        id: pr
        run: |
          PR_NUMBER=$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${FEATURE_BRANCH}" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -z "${PR_NUMBER}" ]; then
            PR_URL=$(gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --head "${FEATURE_BRANCH}" \
              --base main \
              --title "feat(studio): 픽셀펜 전문 드로잉 워크플로 고도화" \
              --body "정수 1–64px 하드 팁, 1px 픽셀 퍼펙트 코너 보정, 픽셀 대칭, 데스크톱·모바일·HUD 제어, 입력 안전성 및 회귀 테스트를 추가합니다.")
            PR_NUMBER=$(gh pr view "${PR_URL}" --repo "${GITHUB_REPOSITORY}" --json number --jq .number)
          fi
          echo "number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"
          gh pr edit "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "feat(studio): 픽셀펜 전문 드로잉 워크플로 고도화" \
            --body-file - <<'EOF'
          ## 구현
          - 정수 문서 좌표 기반 1–64px 하드 픽셀 팁
          - Aseprite식 1px pixel-perfect 코너 정리
          - 세로·가로·방사·만화경·실크 대칭 계약 공유
          - 데스크톱 옵션 바·인스펙터·모바일 시트·캔버스 HUD 일관 제어
          - 폭·좌표·작업량 예산의 fail-closed 검증
          - 기존 `pixel-grid-v1` 재생 포맷 호환 유지

          ## 검증
          - Prettier / ESLint
          - 픽셀펜 및 UI 집중 Vitest
          - 전체 TypeScript typecheck
          - production bundle build
          - 최신 `main` rebase 후 동일 품질 게이트 재실행
          EOF
          gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json number,url,headRefOid --jq .

      - name: Enable protected-branch auto-merge
        run: |
          gh pr merge "${{ steps.pr.outputs.number }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --squash \
            --auto \
            --delete-branch

      - name: Confirm required core check and merge
        shell: bash
        run: |
          rerun_used=false
          for attempt in $(seq 1 240); do
            STATE=$(gh pr view "${{ steps.pr.outputs.number }}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json state \
              --jq .state)
            if [ "${STATE}" = "MERGED" ]; then
              gh pr view "${{ steps.pr.outputs.number }}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json number,url,mergedAt,mergeCommit \
                --jq '{number,url,mergedAt,mergeCommit}'
              exit 0
            fi
            if [ "${STATE}" = "CLOSED" ]; then
              echo "MR closed without merge" >&2
              exit 1
            fi
            if [ "${rerun_used}" = false ]; then
              failed_run=$(gh run list \
                --repo "${GITHUB_REPOSITORY}" \
                --branch "${FEATURE_BRANCH}" \
                --event pull_request \
                --limit 20 \
                --json databaseId,conclusion \
                --jq '.[] | select(.conclusion == "failure") | .databaseId' \
                | head -n 1)
              if [ -n "${failed_run}" ]; then
                gh run rerun "${failed_run}" --failed --repo "${GITHUB_REPOSITORY}" || true
                rerun_used=true
              fi
            fi
            sleep 15
          done
          echo "Required checks did not merge the MR within the guarded window" >&2
          gh pr checks "${{ steps.pr.outputs.number }}" --repo "${GITHUB_REPOSITORY}" || true
          exit 1
