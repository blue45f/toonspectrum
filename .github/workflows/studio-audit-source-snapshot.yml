name: Studio audit source snapshot
on:
  push:
    branches: [feat/studio-audit-completion-20260905]
    paths: ['.github/workflows/studio-audit-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive tracked source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/studio-audit-source"
          git rev-parse HEAD > "$RUNNER_TEMP/studio-audit-source/revision.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/studio-audit-source/git-tree.txt"
          python3 - <<'PY'
          import os, pathlib, subprocess, tarfile
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'studio-audit-source' / 'source.tar.gz'
          suffixes = {'.ts', '.tsx', '.js', '.jsx', '.mjs', '.mts', '.cjs', '.cts', '.json', '.yaml', '.yml', '.css', '.scss', '.html', '.md', '.mdx', '.sql', '.txt', '.toml', '.svg'}
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with tarfile.open(output, 'w:gz') as archive:
              for name in files:
                  path = pathlib.Path(name)
                  if not name or not path.is_file() or path.is_symlink():
                      continue
                  if path.suffix in suffixes or path.name in {'.nvmrc', '.gitignore', '.npmrc', 'LICENSE', 'Dockerfile', 'Makefile'}:
                      if path.stat().st_size <= 8_000_000:
                          archive.add(path, arcname=name, recursive=False)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: studio-audit-source
          path: ${{ runner.temp }}/studio-audit-source
          retention-days: 3
          if-no-files-found: error
