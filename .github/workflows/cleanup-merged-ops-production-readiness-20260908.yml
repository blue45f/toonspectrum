name: Retire merged production readiness branch

on:
  push:
    branches:
      - ops/production-readiness-20260908
    paths:
      - .github/workflows/cleanup-merged-ops-production-readiness-20260908.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: retire-merged-ops-production-readiness-20260908
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify merged state and delete only this inactive branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_BRANCH: ${{ github.ref_name }}
          WORKFLOW_SHA: ${{ github.sha }}
          EXPECTED_ANCESTOR_SHA: 96b03c7e7d19456d34c2e0e6905efd7aeccdc087
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          branch = os.environ["WORKFLOW_BRANCH"]
          workflow_sha = os.environ["WORKFLOW_SHA"]
          expected_ancestor = os.environ["EXPECTED_ANCESTOR_SHA"]
          owner, repo = repository.split("/", 1)

          if branch != "ops/production-readiness-20260908":
              raise RuntimeError(f"unexpected cleanup branch: {branch}")
          if branch == "main":
              raise RuntimeError("refusing to delete the default branch")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "toonspectrum-merged-branch-cleanup",
          }

          def api(path: str, method: str = "GET", allowed_statuses=()):
              request = urllib.request.Request(
                  f"https://api.github.com{path}", headers=headers, method=method
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      body = response.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", "replace")
                  if error.code in allowed_statuses:
                      return None
                  raise RuntimeError(
                      f"GitHub API {method} {path} failed: {error.code} {detail}"
                  ) from error

          def quoted_ref(name: str) -> str:
              return "/".join(
                  urllib.parse.quote(part, safe="") for part in name.split("/")
              )

          ref_path = f"/repos/{owner}/{repo}/git/ref/heads/{quoted_ref(branch)}"
          delete_path = f"/repos/{owner}/{repo}/git/refs/heads/{quoted_ref(branch)}"
          branch_ref = api(ref_path)
          current_sha = branch_ref["object"]["sha"]
          if current_sha != workflow_sha:
              raise RuntimeError(
                  f"branch moved after cleanup launch: {current_sha} != {workflow_sha}"
              )

          launcher_commit = api(f"/repos/{owner}/{repo}/commits/{workflow_sha}")
          parent_shas = {
              parent["sha"] for parent in launcher_commit.get("parents", [])
          }
          if expected_ancestor not in parent_shas:
              raise RuntimeError(
                  "cleanup launcher is not directly based on the verified merged head"
              )

          open_pulls = []
          for page in range(1, 11):
              batch = api(
                  f"/repos/{owner}/{repo}/pulls?state=open&per_page=100&page={page}"
              ) or []
              open_pulls.extend(batch)
              if len(batch) < 100:
                  break

          for pull in open_pulls:
              head = pull.get("head") or {}
              base = pull.get("base") or {}
              head_repo = (head.get("repo") or {}).get("full_name")
              base_repo = (base.get("repo") or {}).get("full_name")
              if head_repo == repository and head.get("ref") == branch:
                  raise RuntimeError(
                      f"branch is the head of open PR #{pull.get('number')}"
                  )
              if base_repo == repository and base.get("ref") == branch:
                  raise RuntimeError(
                      f"branch is the base of open PR #{pull.get('number')}"
                  )

          main_ref = api(f"/repos/{owner}/{repo}/git/ref/heads/main")
          main_sha = main_ref["object"]["sha"]
          comparison = api(
              f"/repos/{owner}/{repo}/compare/{expected_ancestor}...{main_sha}"
          )
          if comparison.get("status") not in {"ahead", "identical"}:
              raise RuntimeError(
                  f"verified branch head is no longer contained by main: {comparison.get('status')}"
              )
          if int(comparison.get("behind_by", -1)) != 0:
              raise RuntimeError(
                  f"verified branch head is behind main comparison by {comparison.get('behind_by')}"
              )

          api(delete_path, method="DELETE")
          if api(ref_path, allowed_statuses=(404,)) is not None:
              raise RuntimeError("branch ref still exists after deletion")

          print(json.dumps({
              "deleted": branch,
              "launcherSha": workflow_sha,
              "mergedAncestorSha": expected_ancestor,
              "mainSha": main_sha,
              "openPullsChecked": len(open_pulls),
          }, ensure_ascii=False, indent=2))
          PY
