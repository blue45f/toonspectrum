name: Apply Studio UI UX follow-up

on:
  push:
    branches:
      - feat/studio-ui-ux-followup-20260904
    paths:
      - .github/workflows/apply-studio-ui-ux-followup-20260904.yml
      - scripts/apply-studio-ui-ux-followup-20260904.py

permissions:
  contents: write

concurrency:
  group: studio-ui-ux-followup-20260904
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/studio-ui-ux-followup-20260904
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply guarded UI UX patch and focused gates
        run: |
          python3 scripts/apply-studio-ui-ux-followup-20260904.py . --skip-base-check
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/domains/creator/StudioCommandSearchDialog.test.tsx")
          text = path.read_text(encoding="utf-8")
          needle = '    const option = screen.getByRole("option", { name: /가우시안 블러/u });'
          replacement = '''    const option = screen.getAllByRole("option").find(
                (candidate) => within(candidate).queryByText("가우시안 블러", { exact: true }),
              );
              if (!option) throw new Error("missing exact 가우시안 블러 option");'''
          count = text.count(needle)
          if count != 2:
              raise SystemExit(f"expected two ambiguous selector rows, found {count}")
          path.write_text(text.replace(needle, replacement), encoding="utf-8")
          PY
          pnpm exec vitest run \
            src/domains/creator/studio-command-execution-registry.test.ts \
            src/domains/creator/StudioCommandSearchDialog.test.tsx \
            src/domains/creator/studio-main-menu-items-filter.test.ts \
            src/domains/creator/studio-inspector-primary-text-edit.test.ts
          pnpm run typecheck
          pnpm run lint

      - name: Architecture and production build gates
        run: |
          pnpm run validate:architecture
          pnpm run build
          pnpm run check:studio-bundle
          git diff --check

      - name: Commit verified product changes
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No product changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domains/creator docs/rewrite
          git commit --no-verify -m "feat(studio): complete UI UX follow-up wave"
          git push origin HEAD:feat/studio-ui-ux-followup-20260904
