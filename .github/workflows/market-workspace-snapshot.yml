name: Market workspace snapshot
on:
  push:
    branches: [fix/market-production-20260913]
    paths: [.github/workflows/market-workspace-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive tracked text sources only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess, tarfile
          paths = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          extensions = {'.ts','.tsx','.mts','.mjs','.cjs','.js','.json','.yaml','.yml','.md','.css','.html'}
          roots = ('apps/web/src/', 'apps/api/src/', 'packages/', 'scripts/', 'e2e/', '.github/workflows/')
          with tarfile.open('/tmp/market-source.tar.gz', 'w:gz') as archive:
              for name in paths:
                  p = pathlib.Path(name)
                  if not name or not p.is_file() or p.suffix not in extensions:
                      continue
                  if len(p.parts) == 1 or name.startswith(roots) or name == 'apps/web/public/assets/studio/cc0-20260906/manifest.json':
                      if p.stat().st_size <= 8 * 1024 * 1024:
                          archive.add(p, arcname=name, recursive=False)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: market-scoped-source
          path: /tmp/market-source.tar.gz
          retention-days: 1
