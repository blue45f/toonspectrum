name: Apply Studio work panel layer-count accessibility fix

on:
  push:
    branches:
      - fix/studio-work-panel-layer-count-a11y-20260909
    paths:
      - .github/workflows/apply-studio-work-panel-layer-count-a11y.yml

permissions:
  contents: write

concurrency:
  group: studio-work-panel-layer-count-a11y
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      HUSKY: "0"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/studio-work-panel-layer-count-a11y-20260909
          fetch-depth: 1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Keep the visual layer count out of the tab accessible name
        shell: pwsh
        run: |
          $path = "apps/web/src/domains/creator/StudioInspectorNavigator.tsx"
          $source = [System.IO.File]::ReadAllText($path)
          $needle = '                <span className="absolute right-1 top-1 rounded-full bg-accent-soft px-1 text-[0.6875rem] font-bold tabular-nums text-accent">'
          $replacement = '                <span aria-hidden="true" className="absolute right-1 top-1 rounded-full bg-accent-soft px-1 text-[0.6875rem] font-bold tabular-nums text-accent">'
          $matches = ([regex]::Matches($source, [regex]::Escape($needle))).Count
          if ($matches -ne 1) {
            throw "Expected exactly one layer-count badge, found $matches."
          }
          $updated = $source.Replace($needle, $replacement)
          [System.IO.File]::WriteAllText(
            $path,
            $updated,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Lint the affected work-panel source and regressions
        run: pnpm exec eslint --max-warnings=0 apps/web/src/domains/creator/StudioInspectorNavigator.tsx apps/web/src/domains/creator/StudioInspectorPanelControls.test.tsx apps/web/src/domains/creator/studio-inspector-panel-preferences.ts apps/web/src/domains/creator/studio-inspector-panel-preferences.test.ts

      - name: Typecheck the work-panel dependency graph
        shell: pwsh
        run: |
          @'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "incremental": false,
              "noEmit": true
            },
            "include": [
              "apps/web/src/domains/creator/StudioInspectorNavigator.tsx",
              "apps/web/src/domains/creator/StudioInspectorPanelControls.test.tsx",
              "apps/web/src/domains/creator/studio-inspector-panel-preferences.ts",
              "apps/web/src/domains/creator/studio-inspector-panel-preferences.test.ts"
            ]
          }
          '@ | Set-Content -Encoding utf8 tsconfig.work-panel-a11y-validation.json
          pnpm exec tsc -p tsconfig.work-panel-a11y-validation.json
          Remove-Item tsconfig.work-panel-a11y-validation.json

      - name: Run focused work-panel regressions
        run: pnpm exec vitest run apps/web/src/domains/creator/StudioInspectorPanelControls.test.tsx apps/web/src/domains/creator/studio-inspector-panel-preferences.test.ts apps/web/src/domains/creator/studio-inspector-context-pin.test.ts

      - name: Commit the verified product fix and remove one-shot automation
        shell: pwsh
        run: |
          Remove-Item .github/workflows/apply-studio-work-panel-layer-count-a11y.yml
          git diff --check
          git config user.name "ToonStudio Automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/domains/creator/StudioInspectorNavigator.tsx .github/workflows/apply-studio-work-panel-layer-count-a11y.yml
          git commit --no-verify -m "fix(studio): keep layer tab accessible name stable"
          git push origin HEAD:fix/studio-work-panel-layer-count-a11y-20260909
