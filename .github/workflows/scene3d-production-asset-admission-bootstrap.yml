name: Materialize Scene3D production asset admission

on:
  push:
    branches: [feat/scene3d-production-asset-admission-20260910]
    paths: [.github/workflows/scene3d-production-asset-admission-bootstrap.yml]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/scene3d-production-asset-admission-20260910
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Add visually audited production catalog policy
        shell: bash
        run: |
          cat > apps/web/src/domains/creator/vrm/studio-vrm-production-catalog.ts <<'EOF'
          /**
           * Visual-admission authority for deployment-owned VRM cards.
           *
           * The 2026-09-10 contact-sheet audit reviewed every bundled card at enlarged size. The
           * default picker deliberately exposes only cohesive production avatars and one explicitly
           * stylized, internally consistent reference family. Rejected legacy files remain resolvable
           * for diagnostics or old documents but are not offered to new work.
           */
          export type StudioVrmCatalogQualityTier = "premium" | "stylized-reference";

          export const STUDIO_VRM_PREMIUM_CATALOG_IDS = Object.freeze([
            "sample-vrm",
            "avatar-a",
            "avatar-b",
            "avatar-c",
            "alicia",
            "mega-angel",
            "rubin",
            "vivi",
            "vita",
            "shino",
            "shion",
            "mio",
            "noa",
            "fumi",
            "kage",
          ] as const);

          const PREMIUM_IDS = new Set<string>(STUDIO_VRM_PREMIUM_CATALOG_IDS);
          const STANDALONE_REFERENCE_IDS = new Set<string>(["orion"]);

          export function classifyStudioVrmCatalogQuality(
            id: string,
          ): StudioVrmCatalogQualityTier | null {
            if (PREMIUM_IDS.has(id)) return "premium";
            if (id.startsWith("quaternius-") || STANDALONE_REFERENCE_IDS.has(id)) {
              return "stylized-reference";
            }
            return null;
          }

          export function isStudioVrmProductionCatalogEntry(id: string): boolean {
            return classifyStudioVrmCatalogQuality(id) !== null;
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/domains/creator/vrm/vrm-library.ts')
          text = path.read_text(encoding='utf-8')

          import_anchor = 'import { QUATERNIUS_FANTASY_VRMS } from "./quaternius-fantasy-catalog";\n'
          import_block = '''import {
            classifyStudioVrmCatalogQuality,
            isStudioVrmProductionCatalogEntry,
            type StudioVrmCatalogQualityTier,
          } from "./studio-vrm-production-catalog";
          '''
          if import_block.strip() not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('VRM catalog import anchor changed')
              text = text.replace(import_anchor, import_block + import_anchor, 1)

          type_anchor = '''export type VrmLibraryEntry = {
            id: string;
            name: string;
            source: "memory" | "sample" | "sqlite-opfs";
          '''
          type_replacement = '''export type VrmLibraryEntry = {
            id: string;
            name: string;
            source: "memory" | "sample" | "sqlite-opfs";
            /** Present only for visually admitted deployment-owned catalog cards. */
            catalogQualityTier?: StudioVrmCatalogQualityTier;
          '''
          if text.count(type_anchor) != 1:
              raise SystemExit('VrmLibraryEntry anchor changed')
          text = text.replace(type_anchor, type_replacement, 1)

          filter_anchor = '''export const SAMPLE_VRM_ENTRIES: VrmLibraryEntry[] = SAMPLE_VRMS
            .filter((sample) => sample.visibility !== "legacy")
            .map((sample) => ({
          '''
          filter_replacement = '''export const SAMPLE_VRM_ENTRIES: VrmLibraryEntry[] = SAMPLE_VRMS
            .filter((sample) =>
              sample.visibility !== "legacy" && isStudioVrmProductionCatalogEntry(sample.id),
            )
            .map((sample) => ({
          '''
          if text.count(filter_anchor) != 1:
              raise SystemExit('default VRM picker filter anchor changed')
          text = text.replace(filter_anchor, filter_replacement, 1)

          source_anchor = '''    source: "sample",
            thumbnail: sample.thumbnailUrl ?? null,
          '''
          source_replacement = '''    source: "sample",
            catalogQualityTier: classifyStudioVrmCatalogQuality(sample.id)!,
            thumbnail: sample.thumbnailUrl ?? null,
          '''
          if text.count(source_anchor) != 1:
              raise SystemExit('sample VRM mapping anchor changed')
          text = text.replace(source_anchor, source_replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY

          cat > apps/web/src/domains/creator/vrm/studio-vrm-production-catalog.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";

          import { SAMPLE_VRM_ENTRIES, SAMPLE_VRMS } from "./vrm-library";
          import {
            STUDIO_VRM_PREMIUM_CATALOG_IDS,
            classifyStudioVrmCatalogQuality,
          } from "./studio-vrm-production-catalog";

          describe("deployment VRM visual admission", () => {
            it("exposes only enlarged-contact-sheet approved cards to new projects", () => {
              expect(SAMPLE_VRM_ENTRIES.length).toBeGreaterThan(30);
              for (const entry of SAMPLE_VRM_ENTRIES) {
                expect(entry.source).toBe("sample");
                expect(classifyStudioVrmCatalogQuality(entry.id)).toBe(entry.catalogQualityTier);
                expect(entry.thumbnail).toMatch(/^\/assets\/3d\/characters\/thumbnails\//u);
              }
            });

            it("keeps polished anchors and the coherent Quaternius reference family", () => {
              const ids = new Set(SAMPLE_VRM_ENTRIES.map((entry) => entry.id));
              for (const id of STUDIO_VRM_PREMIUM_CATALOG_IDS) expect(ids.has(id), id).toBe(true);
              expect([...ids].some((id) => id.startsWith("quaternius-modular-"))).toBe(true);
              expect(SAMPLE_VRM_ENTRIES.find((entry) => entry.id === "orion")?.catalogQualityTier)
                .toBe("stylized-reference");
            });

            it("removes visually weak and inconsistent legacy mascots from the default picker", () => {
              const defaultIds = new Set(SAMPLE_VRM_ENTRIES.map((entry) => entry.id));
              const rejected = [
                "avocado",
                "bad-bot",
                "cool-ramen",
                "ice-cream",
                "strawberry-princess",
                "weird-cat",
                "zombie",
              ];
              for (const id of rejected) expect(defaultIds.has(id), id).toBe(false);
              // Runtime/source identity is retained separately; the visual gate only controls discovery.
              const allIds = new Set(SAMPLE_VRMS.map((entry) => entry.id));
              for (const id of rejected) expect(allIds.has(id), id).toBe(true);
            });
          });
          EOF
      - name: Validate production catalog
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run \
            apps/web/src/domains/creator/vrm/studio-vrm-production-catalog.test.ts \
            apps/web/src/domains/creator/vrm/vrm-library.test.ts
          pnpm exec tsc -p tsconfig.json --noEmit
          git diff --check
      - name: Commit product code and remove bootstrap
        shell: bash
        run: |
          git config user.name toonstudio-3d-ci
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/scene3d-production-asset-admission-bootstrap.yml
          git add apps/web/src/domains/creator/vrm/studio-vrm-production-catalog.ts \
                  apps/web/src/domains/creator/vrm/studio-vrm-production-catalog.test.ts \
                  apps/web/src/domains/creator/vrm/vrm-library.ts
          git diff --cached --check
          git commit -m 'feat(3d): admit only visually approved bundled characters'
          git push origin HEAD:feat/scene3d-production-asset-admission-20260910
