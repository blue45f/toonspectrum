# Pinned verifier for retiring two cleanup-only branches.
node <<'NODE'
const fs = require('node:fs');

const repository = process.env.REPO;
const [owner, repo] = repository.split('/');
const token = process.env.GH_TOKEN;
const triggerPr = Number(process.env.TRIGGER_PR);
const triggerHead = process.env.TRIGGER_HEAD;
const triggerHeadSha = process.env.TRIGGER_HEAD_SHA;
const triggerBase = process.env.TRIGGER_BASE;
const triggerBaseSha = process.env.TRIGGER_BASE_SHA;
const apiRoot = 'https://api.github.com';
const headers = {
  Accept: 'application/vnd.github+json',
  Authorization: `Bearer ${token}`,
  'X-GitHub-Api-Version': '2022-11-28',
  'User-Agent': 'toonspectrum-isolated-temp-runner-retirement',
};
const activeStatuses = new Set(['queued', 'in_progress', 'pending', 'waiting', 'requested']);

const targets = [
  {
    branch: 'ops/chatgpt-safe-branch-prune-20260910-1615-v1',
    sha: '335e58fc211467cfbaa3e902afa121982e9455a7',
    files: [
      '.github/branch-prune-trigger-20260910-1615.txt',
      '.github/workflows/chatgpt-safe-branch-prune-20260910-1615.yml',
    ],
  },
  {
    branch: 'ops/chatgpt-safe-branch-prune-fixed-20260910-1706',
    sha: 'f3252916ddb4abe4423c46b1e572655079f346f8',
    files: [
      '.github/workflows/one-shot-safe-merged-branch-prune-20260910-1706.yml',
    ],
  },
];

class HttpError extends Error {
  constructor(status, method, path, payload) {
    super(`${method} ${path} -> ${status}`);
    this.status = status;
    this.payload = payload;
  }
}

function encodeRef(ref) {
  return ref.split('/').map(encodeURIComponent).join('/');
}

function sleep(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

async function raw(path, init = {}) {
  return fetch(`${apiRoot}${path}`, {
    ...init,
    headers: {
      ...headers,
      ...(init.body ? { 'Content-Type': 'application/json' } : {}),
      ...(init.headers || {}),
    },
  });
}

async function request(path, init = {}) {
  const method = init.method || 'GET';
  const response = await raw(path, init);
  if (response.status === 204) return null;
  const text = await response.text();
  let payload = null;
  try { payload = text ? JSON.parse(text) : null; } catch { payload = text; }
  if (!response.ok) throw new HttpError(response.status, method, path, payload);
  return payload;
}

async function maybe(path) {
  try {
    return await request(path);
  } catch (error) {
    if ([404, 422].includes(error.status)) return null;
    throw error;
  }
}

async function openReferences(branch) {
  const [heads, bases] = await Promise.all([
    request(`/repos/${owner}/${repo}/pulls?state=open&head=${encodeURIComponent(`${owner}:${branch}`)}&per_page=100`),
    request(`/repos/${owner}/${repo}/pulls?state=open&base=${encodeURIComponent(branch)}&per_page=100`),
  ]);
  return [...heads, ...bases];
}

async function activeRuns(branch) {
  const data = await request(`/repos/${owner}/${repo}/actions/runs?branch=${encodeURIComponent(branch)}&per_page=100`);
  return (data.workflow_runs || []).filter((run) => activeStatuses.has(run.status));
}

async function cancelActiveRuns(branch) {
  let runs = await activeRuns(branch);
  for (const run of runs) {
    if (run.head_branch !== branch) {
      throw new Error(`unexpected active run branch for ${run.id}: ${run.head_branch}`);
    }
    const response = await raw(`/repos/${owner}/${repo}/actions/runs/${run.id}/cancel`, { method: 'POST' });
    if (![202, 409].includes(response.status)) {
      throw new Error(`unable to cancel run ${run.id}: ${response.status} ${await response.text()}`);
    }
    console.log(`Cancellation requested for cleanup-only run ${run.id} on ${branch}: ${response.status}`);
  }

  for (let attempt = 0; attempt < 20; attempt += 1) {
    runs = await activeRuns(branch);
    if (runs.length === 0) return;
    await sleep(1500);
  }
  runs = await activeRuns(branch);
  if (runs.length > 0) {
    throw new Error(`cleanup-only branch still has ${runs.length} active run(s)`);
  }
}

function sameFiles(actual, expected) {
  const left = new Set(actual);
  const right = new Set(expected);
  return left.size === right.size && [...left].every((value) => right.has(value));
}

function backupTagName(branch, sha) {
  const slug = branch.replaceAll('/', '--').replace(/[^A-Za-z0-9._-]/g, '-').slice(0, 150);
  return `branch-cleanup-backup/20260910/${slug}-${sha.slice(0, 12)}`;
}

async function ensureBackupTag(branch, sha) {
  const tag = backupTagName(branch, sha);
  const tagPath = `/repos/${owner}/${repo}/git/ref/tags/${encodeRef(tag)}`;
  const existing = await maybe(tagPath);
  if (existing) {
    if (existing.object?.sha !== sha) throw new Error(`backup tag conflict: ${tag}`);
    return tag;
  }
  await request(`/repos/${owner}/${repo}/git/refs`, {
    method: 'POST',
    body: JSON.stringify({ ref: `refs/tags/${tag}`, sha }),
  });
  const created = await request(tagPath);
  if (created.object?.sha !== sha) throw new Error(`backup tag verification failed: ${tag}`);
  return tag;
}

async function deleteExactBranch(branch, sha) {
  const refPath = `/repos/${owner}/${repo}/git/ref/heads/${encodeRef(branch)}`;
  const ref = await maybe(refPath);
  if (!ref || ref.object?.sha !== sha) throw new Error(`ref changed before deletion: ${branch}`);
  await request(`/repos/${owner}/${repo}/git/refs/heads/${encodeRef(branch)}`, { method: 'DELETE' });
  if (await maybe(refPath)) throw new Error(`branch still exists after deletion: ${branch}`);
}

(async () => {
  const repoInfo = await request(`/repos/${owner}/${repo}`);
  if (repoInfo.default_branch !== 'main') throw new Error(`default branch changed: ${repoInfo.default_branch}`);
  const main = await request(`/repos/${owner}/${repo}/branches/main`);
  const mainSha = main.commit.sha;
  const results = [];

  for (const target of targets) {
    const { branch, sha, files } = target;
    try {
      if ([repoInfo.default_branch, triggerHead, triggerBase].includes(branch)) {
        throw new Error('reserved branch target');
      }
      if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('invalid expected SHA');

      const branchPath = `/repos/${owner}/${repo}/branches/${encodeRef(branch)}`;
      const current = await maybe(branchPath);
      if (!current) {
        results.push({ branch, sha, decision: 'already_missing', evidence: 'branch_absent', backupTag: null });
        continue;
      }
      if (current.protected) throw new Error('branch became protected');
      if (current.commit?.sha !== sha) throw new Error(`head SHA changed to ${current.commit?.sha || 'unknown'}`);

      const refs = await openReferences(branch);
      if (refs.length > 0) throw new Error(`branch has ${refs.length} open PR reference(s)`);

      const comparison = await request(`/repos/${owner}/${repo}/compare/main...${sha}`);
      const changedFiles = (comparison.files || []).map((file) => file.filename);
      if (!sameFiles(changedFiles, files)) {
        throw new Error(`unexpected changed files: ${JSON.stringify(changedFiles)}`);
      }

      await cancelActiveRuns(branch);
      const backupTag = await ensureBackupTag(branch, sha);

      const finalBranch = await maybe(branchPath);
      if (!finalBranch || finalBranch.protected || finalBranch.commit?.sha !== sha) {
        throw new Error('branch changed after backup tag creation');
      }
      if ((await openReferences(branch)).length > 0) throw new Error('new open PR reference appeared');
      if ((await activeRuns(branch)).length > 0) throw new Error('new active workflow run appeared');

      await deleteExactBranch(branch, sha);
      results.push({ branch, sha, decision: 'deleted', evidence: 'verified_cleanup_only', backupTag });
    } catch (error) {
      results.push({ branch, sha, decision: 'preserved', evidence: error.message, backupTag: null });
    }
  }

  const lines = [
    '# Isolated temporary cleanup-runner retirement',
    '',
    `- Repository: \`${repository}\``,
    `- Main snapshot: \`${mainSha}\``,
    `- Targets: \`${targets.length}\``,
    `- Deleted: \`${results.filter((item) => item.decision === 'deleted').length}\``,
    `- Already missing: \`${results.filter((item) => item.decision === 'already_missing').length}\``,
    `- Preserved by safety checks: \`${results.filter((item) => item.decision === 'preserved').length}\``,
    '',
    '| Branch | Expected SHA | Decision | Evidence | Backup tag |',
    '|---|---|---|---|---|',
    ...results.map((item) => `| \`${item.branch}\` | \`${item.sha.slice(0, 12)}\` | ${item.decision} | ${item.evidence} | ${item.backupTag ? `\`${item.backupTag}\`` : '-'} |`),
  ];
  const report = `${lines.join('\n')}\n`;
  console.log(report);
  fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, report);

  const incomplete = results.filter((item) => !['deleted', 'already_missing'].includes(item.decision));
  if (incomplete.length > 0) {
    throw new Error(`temporary branch retirement incomplete: ${incomplete.map((item) => item.branch).join(', ')}`);
  }

  const [currentHead, currentBase] = await Promise.all([
    request(`/repos/${owner}/${repo}/branches/${encodeRef(triggerHead)}`),
    request(`/repos/${owner}/${repo}/branches/${encodeRef(triggerBase)}`),
  ]);
  if (currentHead.commit?.sha !== triggerHeadSha || currentHead.protected) {
    throw new Error('isolated trigger head moved or became protected');
  }
  if (currentBase.commit?.sha !== triggerBaseSha || currentBase.protected) {
    throw new Error('isolated trigger base moved or became protected');
  }

  await request(`/repos/${owner}/${repo}/pulls/${triggerPr}`, {
    method: 'PATCH',
    body: JSON.stringify({ state: 'closed' }),
  });
  await deleteExactBranch(triggerHead, triggerHeadSha);
  await deleteExactBranch(triggerBase, triggerBaseSha);
})().catch((error) => {
  console.error(error);
  process.exitCode = 1;
});
NODE
