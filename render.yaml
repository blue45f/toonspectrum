# Render Blueprint — ToonSpectrum platform-neutral NestJS runtimes.
# The production web authority is Cloudflare Static Assets + Worker. The full Core API
# runs as an independent HTTPS origin. Retired Vercel runtimes are not part of the release path.
services:
  - type: web
    name: toonspectrum-core-api
    runtime: node
    region: singapore
    # Free instances can sleep after inactivity and therefore do not provide an SLA.
    # Cloudflare answers static traffic and liveness without waking this service; only
    # dynamic authority requests incur the cold start. Upgrade only after explicit approval.
    plan: free
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && NODE_OPTIONS='--max-old-space-size=4096' pnpm --filter @webtoon-nest/api build
    startCommand: node apps/api/dist/apps/api/src/main.js
    healthCheckPath: /api/health/ready
    # Schema migration is a separate, checksum-led single-writer workflow. Never run DDL
    # from build or start. Production releases stay manual so a push cannot switch authority.
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_RUNTIME_ROLE
        value: full
      - key: NEST_API_HOST
        value: 0.0.0.0
      - key: TZ
        value: Asia/Seoul
      - key: CATALOG_INGEST_MODE
        value: "off"
      - key: API_CORS_ALLOWED_ORIGINS
        value: https://www.toonstudio.cloud,https://toonstudio.cloud
      - key: CANONICAL_HOST
        value: www.toonstudio.cloud
      - key: WEB_APP_BASE_URL
        value: https://www.toonstudio.cloud
      - key: OAUTH_REDIRECT_BASE_URL
        value: https://www.toonstudio.cloud
      - key: AUTH_TRUSTED_PROXY_ENABLED
        value: "true"
      - key: AUTH_TRUSTED_CLIENT_IP_HEADER
        value: x-forwarded-for
      - key: AUTH_TRUSTED_PROXY_MAX_FORWARDED_HOPS
        value: "2"
      # The free plan is one instance, while durable presence/signaling lives on Cloudflare.
      - key: STUDIO_LIVE_CLUSTER_ADAPTER
        value: memory
      - key: STUDIO_LIVE_VOICE_ENABLED
        value: "false"
      # Required authority credentials. Populate from the existing production values without
      # printing them, or mount them as a root .env.local secret file before the first release.
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SESSION_SECRET
        sync: false
      - key: AUTH_STATE_SECRET
        sync: false
      - key: CLOUDFLARE_EDGE_ORIGIN_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: AUTH_RATE_LIMIT_MODE
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      # User sign-in OAuth credentials. Keep the key inventory in the Blueprint so
      # infrastructure migrations cannot silently hide configured login providers.
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: KAKAO_ACCOUNT_EMAIL_SCOPE_ENABLED
        value: "false"
      - key: KAKAO_APP_ID
        sync: false
      - key: KAKAO_ADMIN_KEY
        sync: false
      - key: NAVER_OAUTH_CLIENT_ID
        sync: false
      - key: NAVER_OAUTH_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: APPLE_SERVICE_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: PERSONAL_CLOUD_OAUTH_STATE_SECRET
        sync: false
      - key: PERSONAL_CLOUD_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: STUDIO_REALTIME_TICKET_ENABLED
        sync: false
      - key: STUDIO_REALTIME_CLOUDFLARE_PROVIDER_ID
        sync: false
      - key: STUDIO_REALTIME_CLOUDFLARE_TICKET_ISSUER
        sync: false
      - key: STUDIO_REALTIME_CLOUDFLARE_TICKET_AUDIENCE
        sync: false
      - key: STUDIO_REALTIME_CLOUDFLARE_TICKET_SECRET
        sync: false
      - key: STUDIO_REALTIME_CLOUDFLARE_TICKET_TTL_SECONDS
        sync: false
      - key: STUDIO_REALTIME_CLOUDFLARE_SESSION_TTL_SECONDS
        sync: false
      # Optional feature providers. Configure only the providers enabled by production policy.
      - key: SUPABASE_OBJECT_STORAGE_ENABLED
        sync: false
      - key: SUPABASE_OBJECT_STORAGE_URL
        sync: false
      - key: SUPABASE_OBJECT_STORAGE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_OBJECT_STORAGE_SOURCE_BUCKET
        sync: false
      - key: SUPABASE_OBJECT_STORAGE_DERIVED_BUCKET
        sync: false
      - key: SUPABASE_OBJECT_STORAGE_EXPORT_BUCKET
        sync: false
      - key: UPSTASH_COORDINATION_ENABLED
        sync: false
      - key: UPSTASH_COORDINATION_REST_URL
        sync: false
      - key: UPSTASH_COORDINATION_REST_TOKEN
        sync: false
      - key: UPSTASH_COORDINATION_KEY_HASH_SECRET
        sync: false
      # External real-time text APIs only. Local LLM, self-hosted and batch routes are excluded.
      - key: STUDIO_AI_FREE_POOL_ENABLED
        value: "true"
      - key: STUDIO_AI_FREE_PROVIDER_ORDER
        value: gemini,qwen,groq,sambanova,zai,mistral,cloudflare,openrouter,siliconflow
      - key: STUDIO_AI_FREE_ZAI_CONFIRMED
        value: "false"
      - key: STUDIO_AI_FREE_ZAI_MODEL
        value: glm-4.7-flash
      - key: STUDIO_AI_FREE_OPENROUTER_CONFIRMED
        value: "false"
      - key: STUDIO_AI_FREE_OPENROUTER_MODEL
        value: openrouter/free
      - key: STUDIO_AI_FREE_GEMINI_API_KEY
        sync: false
      - key: STUDIO_AI_FREE_QWEN_WORKSPACE_ID
        sync: false
      - key: STUDIO_AI_FREE_QWEN_API_KEY
        sync: false
      - key: STUDIO_AI_FREE_GROQ_API_KEY
        sync: false
      - key: STUDIO_AI_FREE_SAMBANOVA_API_KEY
        sync: false
      - key: STUDIO_AI_FREE_ZAI_API_KEY
        sync: false
      - key: STUDIO_AI_FREE_MISTRAL_API_KEY
        sync: false
      - key: STUDIO_AI_FREE_CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: STUDIO_AI_FREE_CLOUDFLARE_API_TOKEN
        sync: false
      - key: STUDIO_AI_FREE_OPENROUTER_API_KEY
        sync: false
      - key: STUDIO_AI_FREE_SILICONFLOW_API_KEY
        sync: false
      - key: STUDIO_AI_PROVIDER_ORDER
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ZAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  - type: web
    name: toonspectrum-studio-live
    runtime: node
    region: singapore
    # Optional native Socket.IO fallback. Durable Objects remain the default ephemeral
    # realtime data plane; this service is not the Core HTTP authority.
    plan: free
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @webtoon-nest/api build
    startCommand: node apps/api/dist/apps/api/src/main.js
    healthCheckPath: /api/health/ready
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_RUNTIME_ROLE
        value: studio-live
      - key: TZ
        value: Asia/Seoul
      # Catalog ships in the reviewed deploy bundle; runtime ingest stays off here.
      - key: CATALOG_INGEST_MODE
        value: "off"
      # Socket handshake ACL/CRDT state lookup Neon URL. This host is not the Core HTTP API.
      # Enter secrets in the dashboard; use a dedicated DB role with only Studio relations GRANTed.
      - key: DATABASE_URL
        sync: false
      - key: STUDIO_LIVE_CLUSTER_ADAPTER
        value: postgres
      - key: STUDIO_LIVE_POSTGRES_URL
        sync: false
      - key: STUDIO_LIVE_POSTGRES_POOL_MAX
        value: "2"
      - key: STUDIO_LIVE_POSTGRES_INLINE_BINARY_ENABLED
        value: "false"
      - key: STUDIO_REALTIME_TICKET_ENABLED
        value: "false"
      - key: AUTH_SESSION_SECRET
        sync: false
      - key: STUDIO_LIVE_VOICE_ENABLED
        value: "false"
      - key: API_CORS_ALLOWED_ORIGINS
        value: https://www.toonstudio.cloud,https://toonstudio.cloud
