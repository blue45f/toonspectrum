[package]
name = "studio-engine-vello"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "ToonStudio V11 deterministic CPU reference renderer: SceneIR JSON -> RGBA8 via vello_cpu (Linebender sparse-strip CPU renderer)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vello_cpu = "0.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
parley = { version = "0.11", default-features = false, features = ["std", "system"] }
skrifa = "0.43"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
