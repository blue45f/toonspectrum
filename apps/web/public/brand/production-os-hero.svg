<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">ToonStudio production workspace</title>
  <desc id="desc">A vivid webtoon production desk connecting idea, planning, drawing, review and publishing.</desc>
