<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" role="img" aria-labelledby="title desc">
  <title id="title">Connected webtoon production flow</title>
  <desc id="desc">Six connected steps: planning, episodes, passing work, production, review and export.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0c1c"/><stop offset=".48" stop-color="#1e1740"/><stop offset="1" stop-color="#082737"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a184ff"/><stop offset=".36" stop-color="#69ddff"/><stop offset=".72" stop-color="#ff7bc9"/><stop offset="1" stop-color="#65e0b7"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="13" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fff" opacity=".08"/></pattern>
  </defs>
  <rect width="1600" height="680" fill="url(#bg)"/><rect width="1600" height="680" fill="url(#dots)"/>
  <text x="92" y="94" fill="#f7f3ff" font-family="Inter, Pretendard, sans-serif" font-size="32" font-weight="850">한 작품, 하나의 제작 흐름</text>
  <text x="92" y="132" fill="#a3a1ba" font-family="Inter, Pretendard, sans-serif" font-size="16">각 단계의 파일·사람·결정이 다음 단계로 이어집니다.</text>
  <path d="M168 354H1432" stroke="#343451" stroke-width="14" stroke-linecap="round"/><path d="M168 354H1432" stroke="url(#line)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <g font-family="Inter, Pretendard, sans-serif" text-anchor="middle">
    <g transform="translate(168 354)"><circle r="66" fill="#201b3b" stroke="#a68dff" stroke-width="3"/><path d="M-19-26h38v52h-38zM-10-13h20M-10 0h20M-10 13h13" fill="none" stroke="#d4c8ff" stroke-width="5" stroke-linecap="round"/><circle r="82" fill="none" stroke="#9e83ff" stroke-opacity=".18" stroke-width="2"/><text y="112" fill="#ffffff" font-size="19" font-weight="800">기획</text><text y="140" fill="#9997b0" font-size="12" font-weight="700" letter-spacing="1.5">PLAN</text></g>
    <g transform="translate(420 354)"><circle r="66" fill="#17283b" stroke="#67dff8" stroke-width="3"/><rect x="-24" y="-24" width="48" height="48" rx="7" fill="none" stroke="#a9edff" stroke-width="5"/><path d="M-24-5h48M-5-24v48" stroke="#a9edff" stroke-width="5"/><circle r="82" fill="none" stroke="#67dff8" stroke-opacity=".17" stroke-width="2"/><text y="112" fill="#ffffff" font-size="19" font-weight="800">회차</text><text y="140" fill="#9997b0" font-size="12" font-weight="700" letter-spacing="1.5">EPISODES</text></g>
    <g transform="translate(672 354)"><circle r="66" fill="#30203b" stroke="#ff7bc9" stroke-width="3"/><path d="M-32-3h54M8-20l20 17L8 14M-28 20h44" fill="none" stroke="#ffc0e4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle r="82" fill="none" stroke="#ff7bc9" stroke-opacity=".17" stroke-width="2"/><text y="112" fill="#ffffff" font-size="19" font-weight="800">작업 넘기기</text><text y="140" fill="#9997b0" font-size="12" font-weight="700" letter-spacing="1.5">PASS WORK</text></g>
    <g transform="translate(928 354)"><circle r="66" fill="#28243c" stroke="#ffd272" stroke-width="3"/><path d="M-29 23l43-43 15 15-43 43-21 6zM4-10l15 15" fill="none" stroke="#ffe4a6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle r="82" fill="none" stroke="#ffd272" stroke-opacity=".17" stroke-width="2"/><text y="112" fill="#ffffff" font-size="19" font-weight="800">제작</text><text y="140" fill="#9997b0" font-size="12" font-weight="700" letter-spacing="1.5">WORK</text></g>
    <g transform="translate(1180 354)"><circle r="66" fill="#1b2d36" stroke="#67e0b8" stroke-width="3"/><path d="M-29 0l18 19 40-45" fill="none" stroke="#a4efd4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle r="82" fill="none" stroke="#67e0b8" stroke-opacity=".17" stroke-width="2"/><text y="112" fill="#ffffff" font-size="19" font-weight="800">검수·수정</text><text y="140" fill="#9997b0" font-size="12" font-weight="700" letter-spacing="1.5">REVIEW</text></g>
    <g transform="translate(1432 354)"><circle r="66" fill="#1c2641" stroke="#7da0ff" stroke-width="3"/><path d="M0-31v56M-22 5L0 27 22 5M-28 38h56" fill="none" stroke="#bbc9ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle r="82" fill="none" stroke="#7da0ff" stroke-opacity=".17" stroke-width="2"/><text y="112" fill="#ffffff" font-size="19" font-weight="800">내보내기</text><text y="140" fill="#9997b0" font-size="12" font-weight="700" letter-spacing="1.5">EXPORT</text></g>
  </g>
  <g font-family="Inter, Pretendard, sans-serif" font-size="12" font-weight="700"><rect x="92" y="565" width="242" height="42" rx="21" fill="#9d83ff" fill-opacity=".13" stroke="#a78fff" stroke-opacity=".24"/><text x="213" y="591" text-anchor="middle" fill="#d8ceff">최신 파일 자동 연결</text><rect x="351" y="565" width="242" height="42" rx="21" fill="#6adff9" fill-opacity=".11" stroke="#72e2fb" stroke-opacity=".22"/><text x="472" y="591" text-anchor="middle" fill="#bfefff">담당자·마감 함께 기록</text><rect x="610" y="565" width="242" height="42" rx="21" fill="#ff7bc9" fill-opacity=".1" stroke="#ff86cd" stroke-opacity=".22"/><text x="731" y="591" text-anchor="middle" fill="#ffd0e9">수정 요청 놓치지 않기</text><rect x="869" y="565" width="242" height="42" rx="21" fill="#ffd272" fill-opacity=".09" stroke="#ffd77f" stroke-opacity=".22"/><text x="990" y="591" text-anchor="middle" fill="#ffe5aa">결정과 승인 남기기</text><rect x="1128" y="565" width="380" height="42" rx="21" fill="#66dfb7" fill-opacity=".1" stroke="#70e3bd" stroke-opacity=".22"/><text x="1318" y="591" text-anchor="middle" fill="#b9f3de">플랫폼 규격·사용 권리까지 점검</text></g>
</svg>
