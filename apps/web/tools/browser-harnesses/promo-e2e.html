<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Promo component QA</title>
  <style>body{margin:0;font-family:Arial,sans-serif;background:#f5f6fa}*{box-sizing:border-box}</style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React from "react";
    import { createRoot } from "react-dom/client";
    import { StudioPromoPage } from "/src/domains/creator/promo/StudioPromoPage.tsx";
    import { setUserAiConfiguration } from "/src/shared/ai/user-ai-store.ts";

    // This page is an isolated browser-test harness. Production pages never synthesize a user key.
    if (new URLSearchParams(window.location.search).get("user-ai") === "fixture") {
      setUserAiConfiguration({
        version: 1,
        connections: [{
          id: "promo-e2e",
          label: "Promo E2E fixture",
          baseUrl: "https://openrouter.ai/api/v1",
          apiKey: "promo-e2e-key",
          textModel: "openrouter/free",
          imageModel: "",
          imageGenerationPath: "/images/generations",
          imageEditPath: "/images/edits",
          chatCompletionsPath: "/chat/completions",
          costPolicy: "openrouter-free",
        }],
        assignments: { text: "promo-e2e", image: null, inference: null, "three-d": null },
        routing: {
          mode: "manual",
          allowPaidFallback: false,
          managedPoolPriority: 50,
          serverProviderOrder: ["gemini", "qwen", "groq", "sambanova", "zai", "mistral", "cloudflare", "openrouter", "siliconflow"],
        },
      });
    }

    createRoot(document.getElementById("root")).render(React.createElement(StudioPromoPage));
  </script>
</body>
</html>
