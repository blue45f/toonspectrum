<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VRM Inspection & 3D Thumbnail Generator</title>
</head>
<body style="margin: 0; background: transparent;">
  <canvas id="render-canvas" width="512" height="512" style="width: 512px; height: 512px; display: none;"></canvas>
  <canvas id="downscale-canvas" width="256" height="256" style="width: 256px; height: 256px; display: none;"></canvas>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
    import { VRMLoaderPlugin, VRMUtils } from "@pixiv/three-vrm";
    import { pickNaturalIdlePose } from "../src/domains/creator/studio-pose-presets.ts";
    import { applyPoseToVrm, applyExpressionWeightsToVrm } from "../src/domains/creator/vrm/studio-vrm-poser-utils.ts";

    const canvas = document.getElementById("render-canvas");
    const downscaleCanvas = document.getElementById("downscale-canvas");
    const downscaleCtx = downscaleCanvas.getContext("2d", { willReadFrequently: true });

    const renderer = new THREE.WebGLRenderer({
      canvas,
      alpha: true,
      antialias: true,
      preserveDrawingBuffer: true,
      powerPreference: "high-performance"
    });
    renderer.setSize(512, 512, false);
    renderer.setPixelRatio(1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;

    const scene = new THREE.Scene();

    // Studio 3-point + bounce lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.95);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xfff8f0, 1.55);
    keyLight.position.set(2.2, 3.5, 3.2);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xf0f5ff, 0.85);
    fillLight.position.set(-2.8, 2.2, 2.4);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffffff, 1.15);
    rimLight.position.set(0, 3.2, -3.2);
    scene.add(rimLight);

    const bounceLight = new THREE.DirectionalLight(0xf8f9fa, 0.35);
    bounceLight.position.set(0, -2.5, 1.5);
    scene.add(bounceLight);

    const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 50);

    window.__VRM_READY__ = true;

    window.renderCharacterThumbnail = async function(url, characterId) {
      const loader = new GLTFLoader();
      loader.register((parser) => new VRMLoaderPlugin(parser));
      
      const gltf = await loader.loadAsync(url);
      const vrm = gltf.userData.vrm;
      if (!vrm) throw new Error("No VRM found in gltf");
      
      if (vrm.meta.metaVersion === "0") {
        VRMUtils.rotateVRM0(vrm);
      }

      scene.add(vrm.scene);

      // Apply natural idle pose
      try {
        const preset = pickNaturalIdlePose(characterId);
        if (preset && preset.bones) {
          applyPoseToVrm(vrm, preset.bones, 0);
        }
      } catch (e) {
        console.warn("Pose apply error:", e);
      }

      // Add gentle friendly expression
      try {
        applyExpressionWeightsToVrm(vrm, { happy: 0.28, relaxed: 0.25 });
      } catch (e) {}

      // Reset spring bones if any
      try {
        vrm.springBoneManager?.reset();
      } catch (e) {}

      vrm.update(0);
      vrm.scene.updateMatrixWorld(true);

      // Compute bounding box after pose
      const box = new THREE.Box3().setFromObject(vrm.scene);
      const size = new THREE.Vector3();
      box.getSize(size);
      const height = size.y;
      const width = size.x;
      const top = box.max.y;
      const bottom = box.min.y;

      const humanoid = vrm.humanoid;
      const headNode = humanoid?.getNormalizedBoneNode("head");
      const hipsNode = humanoid?.getNormalizedBoneNode("hips");

      const headPos = new THREE.Vector3();
      const hasHead = !!headNode;
      if (headNode) headNode.getWorldPosition(headPos);

      const hipsPos = new THREE.Vector3();
      const hasHips = !!hipsNode;
      if (hipsNode) hipsNode.getWorldPosition(hipsPos);

      let frameTop;
      let frameBottom;

      // If mascot / non-humanoid / or height <= 1.45m, frame full body
      const isMascotOrChibi = height <= 1.45 || !hasHips || !hasHead || (hasHead && headPos.y < top * 0.65);

      if (isMascotOrChibi) {
        frameTop = top + height * 0.08;
        frameBottom = bottom - height * 0.05;
      } else {
        // Tall humanoid: upper body / portrait bust down to waist/hips
        frameTop = top + height * 0.07;
        const desiredBottom = hasHips && hipsPos.y > bottom + 0.15
          ? hipsPos.y - 0.22
          : top - height * 0.58;
        frameBottom = Math.max(bottom, desiredBottom);
      }

      const targetY = (frameTop + frameBottom) * 0.5;
      const verticalSpan = (frameTop - frameBottom) * 1.05;
      const horizontalSpan = width * 1.15;
      const frameSpan = Math.max(verticalSpan, horizontalSpan, 0.45);

      const fovRad = (camera.fov * Math.PI) / 180;
      const dist = (frameSpan * 0.5) / Math.tan(fovRad * 0.5);

      // 3/4 beauty view angle (13 degrees to the side, slight gentle look down)
      const angle = 0.23; // ~13 deg
      const target = new THREE.Vector3(0, targetY, 0);
      const camPos = new THREE.Vector3(
        Math.sin(angle) * dist,
        targetY + frameSpan * 0.04,
        Math.cos(angle) * dist
      );

      camera.position.copy(camPos);
      camera.lookAt(target);
      camera.updateProjectionMatrix();

      // Render master 512x512
      renderer.render(scene, camera);

      // Downscale to crisp 256x256 with high-quality smoothing
      downscaleCtx.clearRect(0, 0, 256, 256);
      downscaleCtx.imageSmoothingEnabled = true;
      downscaleCtx.imageSmoothingQuality = "high";
      downscaleCtx.drawImage(canvas, 0, 0, 256, 256);

      const dataUrl = downscaleCanvas.toDataURL("image/png");

      // Cleanup scene
      scene.remove(vrm.scene);
      VRMUtils.deepDispose(gltf.scene);

      return {
        vrmVersion: vrm.meta.metaVersion,
        title: vrm.meta.title || vrm.meta.name,
        box: {
          min: [box.min.x, box.min.y, box.min.z],
          max: [box.max.x, box.max.y, box.max.z],
          size: [size.x, size.y, size.z],
          height: size.y,
          width: size.x,
        },
        hasHead,
        hasHips,
        headPos: hasHead ? [headPos.x, headPos.y, headPos.z] : null,
        hipsPos: hasHips ? [hipsPos.x, hipsPos.y, hipsPos.z] : null,
        framing: {
          target: [target.x, target.y, target.z],
          cameraPos: [camPos.x, camPos.y, camPos.z],
          distance: dist,
          frameSpan,
          isMascotOrChibi
        },
        dataUrl
      };
    };
  </script>
</body>
</html>
