<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- iOS는 SVG apple-touch-icon 미지원 — 180x180 PNG(icon-maskable.svg 래스터) 사용 -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- iOS/안드로이드 standalone 설치 모드 — 홈 추가 시 풀스크린 앱셸로 실행 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="툰스펙트럼" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- viewport-fit=cover 가 있어야 노치/홈인디케이터 기기에서 env(safe-area-inset-*) 가 0이 아닌 실제 값으로 해석된다 (스튜디오 바텀시트·툴바·웹캠 프리뷰가 잘리지 않도록). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="웹툰·웹소설 통합 인덱스. 플랫폼을 가로질러 무엇을, 어디서, 왜 봐야 하는지 찾습니다."
    />
    <title>툰스펙트럼 · 웹툰·웹소설 통합 인덱스</title>
    <link rel="canonical" href="https://www.toonstudio.cloud/" />
    <meta name="theme-color" content="#1a1410" />
    <script src="/bootstrap-theme.js"></script>

    <!-- Open Graph (Kakao·Facebook·Instagram 등 SNS 공유 미리보기) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="툰스펙트럼" />
    <meta property="og:title" content="툰스펙트럼 · 웹툰·웹소설 통합 인덱스" />
    <meta
      property="og:description"
      content="네이버·카카오·리디·레진 등 국내 웹툰·웹소설을 가로질러 — 무엇을, 어디서, 왜 봐야 하는지 한 곳에서. 통합 랭킹·연재 캘린더·가격비교·작가별 보기."
    />
    <meta property="og:url" content="https://www.toonstudio.cloud/" />
    <meta
      property="og:image"
      content="https://www.toonstudio.cloud/og-web.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="툰스펙트럼 — 웹툰·웹소설 통합 인덱스"
    />
    <meta property="og:locale" content="ko_KR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="툰스펙트럼 · 웹툰·웹소설 통합 인덱스" />
    <meta
      name="twitter:description"
      content="네이버·카카오·리디·레진 등 국내 웹툰·웹소설을 가로질러 한 곳에서. 통합 랭킹·연재 캘린더·가격비교·작가별 보기."
    />
    <meta
      name="twitter:image"
      content="https://www.toonstudio.cloud/og-web.png"
    />

    <!-- 구조화 데이터(schema.org) — 사이트링크 검색창·지식그래프 신호 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://www.toonstudio.cloud/#website",
            "name": "툰스펙트럼",
            "alternateName": "ToonSpectrum",
            "url": "https://www.toonstudio.cloud/",
            "description": "웹툰·웹소설 통합 인덱스. 플랫폼을 가로질러 무엇을, 어디서, 왜 봐야 하는지 찾습니다.",
            "inLanguage": "ko",
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://www.toonstudio.cloud/search?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "Organization",
            "@id": "https://www.toonstudio.cloud/#org",
            "name": "툰스펙트럼",
            "url": "https://www.toonstudio.cloud/",
            "logo": "https://www.toonstudio.cloud/og-web.png"
          }
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Pretendard(주 한국어 UI 폰트)는 jsDelivr에서 옴 — 렌더 임계 경로라 연결을 미리 warm -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- 임계 경로에는 전역 폰트 2종만 — Space Grotesk(--font-display)·Nanum Myeongjo(--font-serif).
         스튜디오 전용 7종(Jua·Black Han Sans·Gaegu 등)은 StudioPage 마운트 시 동적 주입한다. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script src="/bootstrap-compat.js"></script>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
