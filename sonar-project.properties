sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.next/**,**/.vercel/**,**/.turbo/**,**/.cache/**,**/storybook-static/**,**/pnpm-lock.yaml,**/package-lock.json,**/yarn.lock,**/bun.lockb,**/*.min.js,**/*.generated.*,tests/creator-resources-cases.ts,**/generated/**,**/public/**/*.png,**/public/**/*.jpg,**/public/**/*.jpeg,**/public/**/*.webp,**/public/**/*.avif,**/public/**/*.ico,**/public/**/*.svg,**/public/assets/**,**/apps/api/data/**,**/data/catalog*.json*
