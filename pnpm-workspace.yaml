packages:
  - "."
  - "apps/*"
  - "packages/*"

# 제품 정책: 최신 그래픽/창작 런타임을 즉시 검증할 수 있도록 pnpm의
# 24시간 신규 릴리스 숙성 게이트는 사용하지 않는다. 핵심 그래픽 런타임의 exact version,
# 재현 가능한 lockfile과 아래 build allowlist, license/security audit를 공급망 경계로 유지한다.
minimumReleaseAge: 0

# 빌드 스크립트 실행을 명시 승인(pnpm 11 strict: 미승인 시 ERR_PNPM_IGNORED_BUILDS로 install 실패).
# sibling(pettography) 패턴: onlyBuiltDependencies(array) + allowBuilds(map) 둘 다.
onlyBuiltDependencies:
  - "@nestjs/core"
  - "@sentry/cli"
  - "@swc/core"
  - esbuild
  - unrs-resolver
  - workerd
# firebase 웹 SDK 의 @firebase/util / protobufjs 는 postinstall 빌드 스크립트가 런타임에 불필요해
# 명시적으로 거부(false)한다 — pnpm 11 strict 의 ERR_PNPM_IGNORED_BUILDS 를 깨끗하게 억제(fleet 컨벤션).
allowBuilds:
  '@firebase/util': false
  protobufjs: false
  # image-js의 브라우저 분석 경로에는 선택적 네이티브 Node 캔버스가 필요하지 않다.
  # 품질/분석 Worker는 ImageData/TypedArray만 사용하므로 다운로드 빌드 스크립트를 실행하지 않는다.
  skia-canvas: false
  # glTF-Transform의 브라우저 파이프라인은 WebCodecs/ImageBitmap/TypedArray를 사용한다.
  # 선택적 Node 전용 sharp 바이너리는 Studio 런타임에 필요하지 않으므로 공급망 빌드를 실행하지 않는다.
  sharp: false
  "@nestjs/core": true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  unrs-resolver: true
  # Cloudflare's official local Workers runtime; required by Wrangler/Vitest pool.
  workerd: true

overrides:
  handlebars: '>=4.7.9'
  multer: '>=2.3.0'
  undici: '^7.29.0'
  ws: '>=8.21.0'
  form-data: '>=4.0.6'
  'colord@<2.9.4': 2.9.4
  hono: '>=4.12.25'
  find-my-way: '>=8.2.2'
  '@fastify/middie': '>=9.3.2'
  fastify: '>=5.7.2'
  'fast-uri@>=3.0.0 <3.1.6': 3.1.6
  'socket.io-parser@>=4.0.0 <4.2.7': 4.2.7
  'minimatch@3.1.5>brace-expansion': 5.0.9
  'brace-expansion@>=3.0.0 <5.0.9': 5.0.9
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'postcss@>=8.0.0 <8.5.23': 8.5.23
  'sharp@<0.35.4': 0.35.4
  # 이전에 루트 package.json 의 npm 전용 "overrides" 에 있던 핀. pnpm 워크스페이스는 그 블록을
  # 읽지 않아 실제로는 아무것도 고정하지 못했다(@vercel/fun 이 tar 7.5.7 로 해석되고 있었다).
  # 같은 트리에 이미 존재하는 tar 7.5.22 로 수렴시킨다.
  # (동일 블록의 minimatch 핀은 옮기지 않는다 — 아래 patchedDependencies 의 minimatch@3.1.5
  #  패치와 'minimatch@3.1.5>brace-expansion' 핀, scripts/minimatch-security-compat.test.mjs
  #  회귀 테스트가 3.1.5 의 존재를 전제하므로 전역 ^10 핀은 그것들을 깨뜨린다.)
  tar: '^7.5.18'
  # 각 소비자가 요구하는 라우터 API를 유지한다. 전역 8.x 강제는 Express 4의
  # callable API와 Vercel, Wrangler의 6.x pathToRegexp 반환 계약을 깨뜨린다.
  'path-to-regexp@>=0.1.0 <0.1.13': 0.1.13
  'path-to-regexp@>=6.0.0 <6.3.0': 6.3.0
  'path-to-regexp@>=8.0.0 <8.4.2': 8.4.2
  serialize-javascript: '>=7.0.3'
  piscina: '>=4.9.3'
  vitest: '4.1.11'
  '@vitest/coverage-v8': '4.1.11'
  '@vitest/ui': '4.1.11'
  '@vitest/mocker@>=2.1.0 <4.1.11': 4.1.11
  vite: '>=8.0.16'
  jspdf: '>=4.2.1'
  babylonjs-gltf2interface: '9.19.0'
  'nanoid@>=3.0.0 <3.3.18': 3.3.18
  # 취약한 버전 범위만 해당 major의 수정 릴리스로 올린다. minimatch 3의
  # callable CommonJS 패치와 이미 더 높은 버전을 쓰는 의존 경로는 보존한다.
  'browserslist@>=4.0.0 <4.28.7': 4.28.7
  '@vercel/python-analysis>minimatch': 10.2.3
  '@vercel/static-config>ajv': 8.18.0
  'smol-toml@>=1.0.0 <1.7.1': 1.7.1
  '@tootallnate/once@>=2.0.0 <2.0.1': 2.0.1
  'protobufjs@>=7.5.0 <7.6.5': 7.6.5
  'body-parser@>=1.0.0 <1.20.6': 1.20.6
  'body-parser@>=2.0.0 <2.3.0': 2.3.0
  'qs@>=6.0.0 <6.16.0': 6.16.0
  '@xmldom/xmldom@>=0.7.0 <0.8.15': 0.8.15
  'fflate@>=0.6.0 <0.6.11': 0.6.11
  'tsx@4.22.3>esbuild': 0.28.1
  # drizzle-kit의 구형 설정 로더에 포함된 esbuild 0.18에는 보안 백포트가
  # 없어, 트리에 이미 있는 0.25 수정 버전으로 좁혀 실제 TS 로더를 검증한다.
  '@esbuild-kit/core-utils>esbuild': 0.25.12

# eslint-plugin-jsx-a11y 6.10.2 is the current release and has not yet widened
# its peer range for ESLint 10. The repository executes the plugin under
# ESLint 10 in strict lint plus a direct minimatch compatibility regression.
peerDependencyRules:
  allowedVersions:
    'eslint-plugin-jsx-a11y@6.10.2>eslint': '10'

# R3F v9 still constructs deprecated THREE.Clock and logs its own planned
# forceContextLoss teardown. This compatibility patch keeps GPU release intact,
# moves v9's public clock shape onto THREE.Timer, and suppresses only the deliberate
# unmount event. Remove it when a stable R3F release ships the Timer migration.
patchedDependencies:
  '@react-three/fiber@9.6.1': patches/@react-three__fiber@9.6.1.patch
  'minimatch@3.1.5': patches/minimatch@3.1.5.patch
  p5.brush@2.2.1: patches/p5.brush@2.2.1.patch
