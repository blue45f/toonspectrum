packages:
  - "."
  - "apps/*"
  - "packages/*"

# 공급망 정책(minimumReleaseAge: 너무 최근 발행 패키지 거부)의 예외 목록.
# pg 설치 시 따라온 transitive dep node-releases가 24h 미경과 발행이라 --frozen-lockfile에서
# 거부됨 — caniuse/브라우저 데이터 패키지라 안전하게 제외(다른 워크스페이스와 동일 패턴).
minimumReleaseAgeExclude:
  - node-releases
  - '@heejun/eslint-config@4.0.0'
  - '@heejun/deskcloud@0.1.0'
  - '@heejun/platform-bridge@0.1.0'

# 빌드 스크립트 실행을 명시 승인(pnpm 11 strict: 미승인 시 ERR_PNPM_IGNORED_BUILDS로 install 실패).
# sibling(pettography) 패턴: onlyBuiltDependencies(array) + allowBuilds(map) 둘 다.
onlyBuiltDependencies:
  - "@nestjs/core"
  - "@sentry/cli"
  - "@swc/core"
  - esbuild
  - unrs-resolver
# firebase 웹 SDK 의 @firebase/util / protobufjs 는 postinstall 빌드 스크립트가 런타임에 불필요해
# 명시적으로 거부(false)한다 — pnpm 11 strict 의 ERR_PNPM_IGNORED_BUILDS 를 깨끗하게 억제(fleet 컨벤션).
allowBuilds:
  '@firebase/util': false
  protobufjs: false
  "@nestjs/core": true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  unrs-resolver: true

overrides:
  handlebars: '>=4.7.9'
  multer: '>=2.2.0'
  undici: '^7.28.0'
  ws: '>=8.21.0'
  form-data: '>=4.0.6'
  hono: '>=4.12.25'
  find-my-way: '>=8.2.2'
  '@fastify/middie': '>=9.3.2'
  fastify: '>=5.7.2'
  fast-uri: '>=3.1.2'
  path-to-regexp: '>=6.3.0'
  serialize-javascript: '>=7.0.3'
  piscina: '>=4.9.3'
  drizzle-orm: '>=0.45.2'
  vitest: '>=4.1.9'
  '@vitest/coverage-v8': '>=4.1.9'
  '@vitest/ui': '>=4.1.9'
  vite: '>=8.0.16'
  jspdf: '>=4.2.1'

auditConfig:
  ignoreGhsas:
    - GHSA-2p57-rm9w-gvfp

patchedDependencies:
  '@apps-in-toss/plugins@2.9.1': patches/@apps-in-toss__plugins@2.9.1.patch
